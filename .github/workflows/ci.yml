name: CI

# Every action is pinned by the commit SHA of its release (the tag is in the comment); a tag can be
# moved, a commit cannot. Refresh: take the SHA of the new release tag (git ls-remote --tags <action
# source> <tag>) and update SHA and comment together; the dependency update bot proposes the same.
# The scanners (gitleaks, Trivy) are downloaded as release archives and checked against their
# SHA-256 before they run.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"

jobs:
  backend:
    name: Backend – build, tests, quality gates, SBOM
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify (format, compile -Werror, tests, coverage, checkstyle, PMD, CPD, SpotBugs, ArchUnit, SBOM)
        run: mvn -B verify
      - name: Report failing tests and gate violations
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$f" ] || continue
            grep -h -A3 '<<< FAIL' "$f" | head -12 | tr '\n' ' ' | sed 's/^/::error title=Test failure::/' && echo
          done
          for f in target/checkstyle-result.xml target/pmd.xml target/cpd.xml target/spotbugsXml.xml; do
            [ -f "$f" ] && grep -c -E '<error |<violation |<duplication |<BugInstance ' "$f" | sed "s|^|::notice title=$f findings::|"
          done
          true
      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar -Dsonar.qualitygate.wait=true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports
            backend/target/pmd.xml
            backend/target/spotbugsXml.xml
            backend/target/checkstyle-result.xml
      - name: Software bill of materials (CycloneDX)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-backend
          path: |
            backend/target/bom.json
            backend/target/bom.xml
          if-no-files-found: error

  backend-dependencies:
    name: Backend – dependency vulnerabilities (OWASP dependency-check, CVSS >= 7 fails)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The NVD data (about 1 GB) is kept between runs and only updated.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      # The NVD data needs an API key (repository secret NVD_API_KEY, free from nvd.nist.gov). Without
      # it the scan cannot run; the job says so instead of failing on the missing key.
      - name: NVD API key present
        id: nvd
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning title=Dependency-check skipped::Add the repository secret NVD_API_KEY to run the OWASP dependency-check."
            echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Dependency-check (suppressions in quality/dependency-check-suppressions.xml)
        if: steps.nvd.outputs.present == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B org.owasp:dependency-check-maven:check -DdataDirectory=$HOME/.dependency-check-data
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.nvd.outputs.present == 'true'
        with:
          name: backend-dependency-check
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
            backend/target/dependency-check-report.sarif

  frontend:
    name: Frontend – dependency audit, lint (SonarJS), typecheck, tests, build, SBOM
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - name: Dependency audit (high and critical advisories fail)
        run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run build
      - name: Software bill of materials (CycloneDX) of the runtime dependencies
        run: npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > sbom-frontend.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-frontend
          path: frontend/sbom-frontend.cdx.json
          if-no-files-found: error
      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        with:
          projectBaseDir: frontend

  secrets:
    name: Secret detection (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
      - name: Scan (reviewed findings of the history are listed in .gitleaksignore)
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --report-format sarif --report-path gitleaks.sarif .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif

  documents:
    name: Client documents – pack check (duplicates, versions, wording)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/deliverables/requirements.txt
      - run: pip install -r tools/deliverables/requirements.txt
      - run: python tools/deliverables/check_pack.py

  images:
    name: Docker images – build and scan (Trivy, high and critical fail)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t brokerverse-backend:${{ github.sha }} backend
      - run: docker build -t brokerverse-frontend:${{ github.sha }} frontend
      - name: Install Trivy (checksum verified)
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP" trivy
      # Fixed vulnerabilities only: an unfixed one cannot be removed by a rebuild and is reviewed
      # in .trivyignore.yaml if it matters. Accepted findings are listed there with an expiry date.
      - name: Scan the backend image
        run: >-
          "$RUNNER_TEMP/trivy" image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
          --ignorefile .trivyignore.yaml --scanners vuln,secret brokerverse-backend:${{ github.sha }}
      - name: Scan the frontend image
        run: >-
          "$RUNNER_TEMP/trivy" image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
          --ignorefile .trivyignore.yaml --scanners vuln,secret brokerverse-frontend:${{ github.sha }}
