# iNXT BrokerVerse (BIBS) - CI pipeline for GitLab (client toolchains with GitLab Runner).
# Same gates as the other pipeline definition of the project:
#   backend   mvn verify (format, compile -Werror, unit and integration tests, JaCoCo coverage gate,
#             Checkstyle, PMD / CPD, SpotBugs + FindSecBugs, ArchUnit, delivery wording check,
#             CycloneDX SBOM target/bom.json), then SonarQube with the quality gate when SONAR_TOKEN
#             is set;
#   frontend  npm audit (high and critical fail), npm verify (Prettier, ESLint + SonarJS, TypeScript,
#             Vitest with coverage), build, CycloneDX SBOM, then SonarQube when SONAR_TOKEN is set;
#   security  static application security testing (GitLab SAST), secret detection, dependency
#             scanning (GitLab templates, reported in the security dashboard where the tier offers
#             it) and the dependency gate of the backend (OWASP dependency-check, CVSS >= 7 fails,
#             suppressions with reason and expiry in backend/quality/dependency-check-suppressions.xml);
#             on every pipeline and weekly (schedule "weekly-security", Monday 03:00 UTC);
#   images    backend and frontend container images after both builds pass, each scanned with Trivy
#             (fixed high and critical vulnerabilities fail; accepted findings with expiry in
#             .trivyignore.yaml), pushed to the project registry when it is available and then
#             scanned by the Container-Scanning template.
# Variables (Settings > CI/CD > Variables): SONAR_TOKEN (masked), SONAR_HOST_URL, NVD_API_KEY (masked,
# NVD API key of the dependency gate); for the image push the GitLab registry variables are used
# (CI_REGISTRY, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, CI_REGISTRY_IMAGE).

stages:
  - build
  - quality
  - test
  - security
  - images
  - image-scan

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"
  GIT_DEPTH: "0"
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ---------------------------------------------------------------- backend
backend:verify:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths: [.m2/repository]
  script:
    - cd backend
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
        - backend/target/failsafe-reports/TEST-*.xml
    paths:
      - backend/target/site/jacoco
      - backend/target/surefire-reports
      - backend/target/failsafe-reports
      - backend/target/pmd.xml
      - backend/target/spotbugsXml.xml
      - backend/target/checkstyle-result.xml
      - backend/target/classes
      - backend/target/bom.json
      - backend/target/bom.xml
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

backend:sonarqube:
  stage: quality
  image: maven:3.9-eclipse-temurin-21
  needs: [backend:verify]
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths: [.m2/repository]
    policy: pull
  script:
    - cd backend
    - mvn $MAVEN_CLI_OPTS org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar -Dsonar.qualitygate.wait=true
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && $SONAR_TOKEN

# ---------------------------------------------------------------- frontend
frontend:verify:
  stage: build
  image: node:22
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --no-fund --cache .npm --prefer-offline
    - npm audit --audit-level=high
    - npm run verify
    - npm run build
    - npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > sbom-frontend.cdx.json
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - frontend/coverage
      - frontend/dist
      - frontend/sbom-frontend.cdx.json
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

frontend:sonarqube:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  needs: [frontend:verify]
  script:
    - cd frontend
    - sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" -Dsonar.qualitygate.wait=true
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && $SONAR_TOKEN

# ---------------------------------------------------------------- security (template jobs)
sast:
  stage: security
  variables:
    SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, node_modules, docs, tools"

secret_detection:
  stage: security
  variables:
    # Full history on the weekly schedule, the new commits otherwise.
    SECRET_DETECTION_HISTORIC_SCAN: "false"
  rules:
    - if: $SECRET_DETECTION_DISABLED == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        SECRET_DETECTION_HISTORIC_SCAN: "true"
    - if: $CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"

dependency_scanning:
  stage: security
  variables:
    DS_JAVA_VERSION: "21"
    DS_EXCLUDED_PATHS: "spec, test, tests, tmp, docs, tools"

# Secret gate: gitleaks over the whole history fails the pipeline on a finding (the template job
# above reports to the security dashboard only). Reviewed findings are listed in .gitleaksignore.
secrets:gitleaks:
  stage: security
  image: alpine:3
  needs: []
  script:
    - apk add --no-cache git
    - wget -q -O gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
    - echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
    - tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks git --redact --no-banner --report-format json --report-path gitleaks-report.json .
  artifacts:
    when: always
    expire_in: 30 days
    paths: [gitleaks-report.json]

# Dependency gate of the backend: known vulnerabilities (NVD) with CVSS >= 7 fail the pipeline.
backend:dependency-check:
  stage: security
  image: maven:3.9-eclipse-temurin-21
  needs: []
  cache:
    - key: maven-$CI_COMMIT_REF_SLUG
      paths: [.m2/repository]
      policy: pull
    - key: dependency-check-data
      paths: [.dependency-check-data]
  script:
    - cd backend
    - mvn $MAVEN_CLI_OPTS org.owasp:dependency-check-maven:check -DdataDirectory=$CI_PROJECT_DIR/.dependency-check-data
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - backend/target/dependency-check-report.html
      - backend/target/dependency-check-report.json
      - backend/target/dependency-check-report.sarif

# ---------------------------------------------------------------- images
# Build, scan with Trivy (checksum-verified release; fixed high and critical vulnerabilities fail),
# and push to the project registry when it is available (the Container-Scanning jobs scan the pushed
# image).
.images:
  stage: images
  image: docker:27
  services: [docker:27-dind]
  needs: [backend:verify, frontend:verify]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - wget -q -O trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
    - echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
    - tar -xzf trivy.tar.gz -C /usr/local/bin trivy
  script:
    - docker build -t "brokerverse-$IMAGE_NAME:$CI_COMMIT_SHA" "$IMAGE_NAME"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore.yaml
      --scanners vuln,secret "brokerverse-$IMAGE_NAME:$CI_COMMIT_SHA"
    - |
      if [ -n "$CI_REGISTRY_IMAGE" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker tag "brokerverse-$IMAGE_NAME:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHA"
        docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHA"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

images:backend:
  extends: .images
  variables:
    IMAGE_NAME: backend

images:frontend:
  extends: .images
  variables:
    IMAGE_NAME: frontend

# ---------------------------------------------------------------- image scan (template jobs)
container_scanning:
  stage: image-scan
  needs: [images:backend]
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    CS_SEVERITY_THRESHOLD: HIGH
  rules:
    - if: $CONTAINER_SCANNING_DISABLED == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_REGISTRY_IMAGE

container_scanning:frontend:
  extends: container_scanning
  needs: [images:frontend]
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
