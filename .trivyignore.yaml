# Accepted findings of the container image scan (Trivy, HIGH and CRITICAL with a fix available).
# A finding is fixed by refreshing the pinned base image digest or upgrading the package. An entry
# here is the exception: statement = why it does not apply to BrokerVerse, who reviewed it and when;
# expired_at = at most 6 months ahead, after which the scan fails again.
# Example:
#   vulnerabilities:
#     - id: CVE-0000-00000
#       paths: ["usr/lib/example.so"]
#       statement: Reason, reviewer, review date.
#       expired_at: 2027-03-31
vulnerabilities:
  - id: CVE-2026-47884
    paths: ["app/app.jar"]
    statement: >-
      Spring Framework XsltView path handling. BrokerVerse registers no XsltView or XSLT view resolver and
      renders no XSLT views, so the vulnerable code path is not reachable. No fixed 6.2.x release exists
      yet (fixed only in 7.0.9). Reviewed by D Akash Immanuel, Tech Lead, on 08-Oct-2026; re-check when
      Spring Framework 6.2.20 is released.
    expired_at: 2026-11-30
secrets: []
