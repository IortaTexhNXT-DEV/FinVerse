# ======================================================================================
# iNXT BrokerVerse - application configuration
# Every environment specific value is overridable through environment variables
# (see docs/operations/CONFIGURATION.md). Secrets MUST come from the environment.
# ======================================================================================
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 20000
  application:
    name: brokerverse
  datasource:
    url: ${BROKERVERSE_DB_URL:jdbc:postgresql://localhost:5432/brokerverse}
    username: ${BROKERVERSE_DB_USER:brokerverse}
    password: ${BROKERVERSE_DB_PASSWORD:brokerverse}
    hikari:
      maximum-pool-size: ${BROKERVERSE_DB_POOL_SIZE:20}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations are numbered in per-module ranges (see DEVELOPER_GUIDE "Migrations"), so a new
    # migration of one module can have a lower version than one already applied by another.
    out-of-order: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Must be >= brokerverse.attachments.max-size (the service applies the business limit).
      max-file-size: ${BROKERVERSE_UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${BROKERVERSE_UPLOAD_MAX_REQUEST_SIZE:21MB}

server:
  port: ${BROKERVERSE_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true

brokerverse:
  security:
    # Must be supplied via BROKERVERSE_JWT_SECRET in every non-local environment (>= 32 bytes).
    jwt-secret: ${BROKERVERSE_JWT_SECRET:local-development-secret-change-me-0123456789}
    token-validity: ${BROKERVERSE_TOKEN_VALIDITY:PT8H}
    allowed-origins: ${BROKERVERSE_ALLOWED_ORIGINS:http://localhost:5173}
  attachments:
    max-size: ${BROKERVERSE_ATTACHMENT_MAX_SIZE:10MB}
  mail:
    # true = deliver through the SMTP server configured with spring.mail.* (MAIL_HOST ...);
    # false = simulated delivery (outbox and send log only). See docs/operations/CONFIGURATION.md.
    enabled: ${BROKERVERSE_MAIL_ENABLED:false}
    dispatch-on-commit: ${BROKERVERSE_MAIL_DISPATCH_ON_COMMIT:true}
  jobs:
    # Spring cron (sec min hour day month weekday), UTC; "-" disables the schedule.
    recurring-journals-cron: ${BROKERVERSE_JOB_RECURRING_CRON:0 0 1 * * *}
    alert-checks-cron: ${BROKERVERSE_JOB_ALERTS_CRON:0 30 1 * * *}
    # Monthly reserve valuation (previous month); disabled by default.
    reserve-valuation-cron: ${BROKERVERSE_JOB_RESERVE_VALUATION_CRON:-}
    # Batch RI allocation run (cedes approved transactions of the year to date not yet ceded); off by default.
    ri-allocation-cron: ${BROKERVERSE_JOB_RI_ALLOCATION_CRON:-}
    # Post-dated cheques issued whose cheque date is reached become DUE (status only).
    pdc-issued-due-cron: ${BROKERVERSE_JOB_PDC_ISSUED_DUE_CRON:0 15 0 * * *}
    # Open quotations (draft, pending, approved) past their validity become EXPIRED.
    quotation-expiry-cron: ${BROKERVERSE_JOB_QUOTATION_EXPIRY_CRON:0 45 0 * * *}
    # Outbox relay: delivers queued e-mails and retries failed attempts.
    mail-dispatch-cron: ${BROKERVERSE_JOB_MAIL_DISPATCH_CRON:0 */2 * * * *}
    # Monthly KYC review (BRNB.110): expires overdue KYC and notifies Account Officers.
    kyc-review-due-cron: ${BROKERVERSE_JOB_KYC_REVIEW_DUE_CRON:0 0 2 1 * *}
    # Monthly data retention review (BRNB.106): counts eligible records; never deletes.
    retention-review-cron: ${BROKERVERSE_JOB_RETENTION_REVIEW_CRON:0 0 3 2 * *}
    # Hourly: applies payments confirmed by the payment confirmation sources (BRNB.067/068).
    payment-confirmation-sweep-cron: ${BROKERVERSE_JOB_PAYMENT_CONFIRMATION_SWEEP_CRON:0 0 * * * *}
    # Daily hold cover expiry monitor (BRNB.103): alerts Processing, expires lapsed hold covers.
    hold-cover-expiry-cron: ${BROKERVERSE_JOB_HOLD_COVER_EXPIRY_CRON:0 30 0 * * *}
    # Quotation requests of source systems (HLS, BRNB.023): manual until an interface exists (Q11).
    quotation-request-intake-cron: ${BROKERVERSE_JOB_QUOTATION_REQUEST_INTAKE_CRON:-}
    # End-of-day booking batch (BRNB.036): queued accounts and started multi-year policy years (20:00 PHT).
    booking-batch-cron: ${BROKERVERSE_JOB_BOOKING_BATCH_CRON:0 0 12 * * *}
    # ---- Operations (BRD-2), docs/architecture/OPERATIONS_DESIGN.md section 10 ----
    # Copies booked invoices missing from the Operations invoice ledger (the feed listener copies new ones).
    ops-invoice-feed-replay-cron: ${BROKERVERSE_JOB_OPS_INVOICE_FEED_REPLAY_CRON:-}
    # Cashiering: re-match payments waiting for a pre-booked account (CSHID.020), every 2 hours.
    prebooked-rematch-cron: ${BROKERVERSE_JOB_PREBOOKED_REMATCH_CRON:0 0 */2 * * *}
    # Cashiering: automatic matching of uploaded payments (CSHID.008), hourly.
    payment-automatch-cron: ${BROKERVERSE_JOB_PAYMENT_AUTOMATCH_CRON:0 30 * * * *}
    # Cashiering: warehoused post-dated checks reaching maturity (CSHID.008 item 4), daily 00:30.
    pdc-maturity-cron: ${BROKERVERSE_JOB_PDC_MATURITY_CRON:0 30 0 * * *}
    # Cashiering: minimal balance sweep of premium receivables (CSHID.016), daily 20:00 UTC.
    minimal-balance-sweep-cron: ${BROKERVERSE_JOB_MINIMAL_BALANCE_SWEEP_CRON:0 0 20 * * *}
    # Remittance: scheduled extraction (RMTID.001/003/005), off-peak 12:00 UTC (20:00 PHT).
    remittance-extraction-cron: ${BROKERVERSE_JOB_REMITTANCE_EXTRACTION_CRON:0 0 12 * * *}
    # Remittance: expired holds released (RMTID.021), daily 00:15.
    hold-expiry-cron: ${BROKERVERSE_JOB_HOLD_EXPIRY_CRON:0 15 0 * * *}
    # Production reconciliation: production register extraction per insurer schedule (PRCID.001), daily check 01:00.
    production-extract-cron: ${BROKERVERSE_JOB_PRODUCTION_EXTRACT_CRON:0 0 1 * * *}
    # Production reconciliation: automatic matching (PRCID.025); manual until the frequency is known (OQ30).
    recon-automatch-cron: ${BROKERVERSE_JOB_RECON_AUTOMATCH_CRON:-}
    # Adjustment: daily adjustment report (ADJID.016), 10:00 UTC (18:00 PHT).
    adj-daily-report-cron: ${BROKERVERSE_JOB_ADJ_DAILY_REPORT_CRON:0 0 10 * * *}
    # Commission: insurer feedback SLA on direct payment billings (CMRID.011), daily 01:30.
    dp-feedback-sla-cron: ${BROKERVERSE_JOB_DP_FEEDBACK_SLA_CRON:0 30 1 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: iNXT BrokerVerse
    vendor: IortaTechNXT

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.iortatechnxt.brokerverse: INFO
  pattern:
    # %replace neutralises CR/LF in messages (log forging protection, see spotbugs-exclude.xml).
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %replace(%msg){'[\\r\\n]', '_'}%n"

---
# Local development / demo profile: loads demo data (company, branches, COA, users).
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
