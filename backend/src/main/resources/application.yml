# ======================================================================================
# iNXT FinVerse - application configuration
# Every environment specific value is overridable through environment variables
# (see docs/operations/CONFIGURATION.md). Secrets MUST come from the environment.
# ======================================================================================
spring:
  application:
    name: finverse
  datasource:
    url: ${FINVERSE_DB_URL:jdbc:postgresql://localhost:5432/finverse}
    username: ${FINVERSE_DB_USER:finverse}
    password: ${FINVERSE_DB_PASSWORD:finverse}
    hikari:
      maximum-pool-size: ${FINVERSE_DB_POOL_SIZE:20}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Must be >= finverse.attachments.max-size (the service applies the business limit).
      max-file-size: ${FINVERSE_UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${FINVERSE_UPLOAD_MAX_REQUEST_SIZE:21MB}

server:
  port: ${FINVERSE_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true

finverse:
  security:
    # Must be supplied via FINVERSE_JWT_SECRET in every non-local environment (>= 32 bytes).
    jwt-secret: ${FINVERSE_JWT_SECRET:local-development-secret-change-me-0123456789}
    token-validity: ${FINVERSE_TOKEN_VALIDITY:PT8H}
    allowed-origins: ${FINVERSE_ALLOWED_ORIGINS:http://localhost:5173}
  attachments:
    max-size: ${FINVERSE_ATTACHMENT_MAX_SIZE:10MB}
  jobs:
    # Spring cron (sec min hour day month weekday), UTC; "-" disables the schedule.
    recurring-journals-cron: ${FINVERSE_JOB_RECURRING_CRON:0 0 1 * * *}
    alert-checks-cron: ${FINVERSE_JOB_ALERTS_CRON:0 30 1 * * *}
    # Monthly reserve valuation (previous month); disabled by default.
    reserve-valuation-cron: ${FINVERSE_JOB_RESERVE_VALUATION_CRON:-}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: iNXT FinVerse
    vendor: IortaTechNXT

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.iortatechnxt.finverse: INFO
  pattern:
    # %replace neutralises CR/LF in messages (log forging protection, see spotbugs-exclude.xml).
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %replace(%msg){'[\\r\\n]', '_'}%n"

---
# Local development / demo profile: loads demo data (company, branches, COA, users).
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
