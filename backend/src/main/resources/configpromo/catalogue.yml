  - {code: CAT_PACKAGE_COVERAGE, name: Coverages of the packages, group: PRODUCTS, module: catalog, table: cat_package_coverage, key: [version_id, coverage_code], parent: version_id}
  - {code: CAT_PACKAGE_INSURER, name: Insurers of the packages, group: PRODUCTS, module: catalog, table: cat_package_insurer, key: [version_id, insurer_code], parent: version_id}
  - {code: CAT_PACKAGE_INSURER_TERM, name: Insurer terms of the packages, group: PRODUCTS, module: catalog, table: cat_package_insurer_term, key: [version_id, insurer_code, coverage_code], parent: version_id}
  - {code: CAT_RATE, name: Premium charges and rating factors, group: PRODUCTS, module: catalog, table: cat_rate, key: [rate_code, line_code, effective_from]}
  - {code: CAT_SHORT_PERIOD_RATE, name: Short-period table, group: PRODUCTS, module: catalog, table: cat_short_period_rate, key: [months_covered, effective_from]}
  - {code: CAT_MOTOR_LIMIT, name: Motor limit premiums, group: PRODUCTS, module: catalog, table: cat_motor_limit, key: [coverage, limit_amount, effective_from]}
  - {code: CAT_CLAUSE, name: Clauses and wordings, group: PRODUCTS, module: catalog, table: cat_clause, key: [code]}
  - {code: CAT_FIELD_RULE, name: Field rules and validations, group: PRODUCTS, module: catalog, table: cat_field_rule, key: [scope, scope_code, target, field_key]}
  - {code: CAT_DOCUMENT_RULE, name: Document rules, group: PRODUCTS, module: catalog, table: cat_document_rule, key: [scope, scope_code, document_type]}
  - {code: CAT_TSU_RULE, name: Technical support rules, group: PRODUCTS, module: catalog, table: cat_tsu_rule, key: [code]}
  - {code: CAT_COMMISSION_RATE, name: Commission rates by insurer and product, group: PRODUCTS, module: catalog, table: cat_commission_rate, key: [company_id, insurer_code, product_code, effective_from]}
  - {code: CAT_INCENTIVE_CRITERIA, name: Incentive criteria, group: PRODUCTS, module: catalog, table: cat_incentive_criteria, key: [company_id, code, effective_from]}
  - {code: CAT_INCENTIVE_CRITERIA_PRODUCT, name: Products matrix of the incentive criteria, group: PRODUCTS, module: catalog, table: cat_incentive_criteria_product, key: [criteria_id, product_code, cover_type_code, market_segment, source_channel, insurer_code], parent: criteria_id}
  - {code: PLC_PAYMENT_GATE_RULE, name: Payment gate rules, group: PRODUCTS, module: placement, table: plc_payment_gate_rule, key: [market_segment, line_code, priority]}
  - {code: ISS_DOCUMENT_TRIGGER, name: Document triggers of issuance, group: PRODUCTS, module: issuance, table: iss_document_trigger, key: [document_type, action]}
  - {code: ISS_EXTRACTION_PATTERN, name: Policy extraction patterns, group: PRODUCTS, module: issuance, table: iss_extraction_pattern, key: [insurer_code, kind, field, priority]}
  - {code: CAT_OTHER_CHARGE, name: Other charges of the products, group: PRODUCTS, module: catalog, table: cat_other_charge, key: [charge_code, line_code, product_code, effective_from]}

