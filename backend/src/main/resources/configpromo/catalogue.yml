  - {code: ORG_BRANCH, name: Branches, group: ORGANISATION, module: organization, table: org_branch, key: [company_id, code]}
  - {code: ORG_EMPLOYEE, name: Employees, group: ORGANISATION, module: organization, table: org_employee, key: [company_id, employee_no]}
  - {code: ORG_HOLIDAY, name: Holiday calendar, group: ORGANISATION, module: organization, table: org_holiday, key: [company_id, branch_id, holiday_date]}
  - {code: DIM_VALUE, name: Cost centres and business lines, group: ORGANISATION, module: dimension, table: dim_value, key: [company_id, dimension_type, code]}
  - {code: CAT_SALES_UNIT, name: Sales units, group: ORGANISATION, module: catalog, table: cat_sales_unit, key: [company_id, code], userColumns: [head_username]}
