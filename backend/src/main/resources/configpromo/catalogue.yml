# =====================================================================================================
# Configuration catalogue of BIBS: every configuration dataset of the platform, with its owner module,
# natural key and the attributes Configuration Promotion needs. Every table of the database is either
# a dataset here or listed under "excluded" with the reason it is never promoted; the build fails
# (ConfigCatalogueSchemaIT) when a table is in neither list, so a new table must be classified here.
#
# Dataset attributes
#   code, name, group, module, table   identity of the dataset; group = section of the screens
#   key        natural key columns; a column that references another table by id is resolved to the
#              natural key of that row, so a package never carries database ids
#   parent     column of the parent row for a collection (lines of a rule, permissions of a role): the
#              collection of a parent in the package replaces the collection of the target
#   refs       references by id without a foreign key in the database (column: dataset)
#   exclude    columns never promoted (workflow state, history), besides the audit columns
#   environment  columns the target environment keeps on an existing row (schedules, recipients,
#              running numbers and balances); a new row takes the value of the package
#   environmentRows  rows that belong to the environment and are never promoted (column and values)
#   rows       rows of the table that make up the dataset (column and values), when one table holds
#              several datasets (standard report variants and the variants the users saved)
#   insertDefaults  value of a column on a new row: "=column" copies another column of the row
#   userColumns  columns naming a user; the dry run warns when the user does not exist in the target
#   optional   true = not selected by default (market data)
#   users      true = user records, promoted only when "include users" is chosen
#   usedBy     references by code without a foreign key, checked before an item is deactivated
#              (table.column holding the value of the last key column)
# =====================================================================================================
groups:
  - {code: ORGANISATION, name: Organisation}
  - {code: REFERENCE, name: Lists of values, parameters and switches}
  - {code: PRODUCTS, name: Product catalogue}
  - {code: PARTNERS, name: Insurers and business partners}
  - {code: ACCOUNTING, name: Accounting}
  - {code: TAX, name: Tax}
  - {code: CASH_AND_BANKING, name: Cash and banking}
  - {code: OPERATIONS, name: Operations, collections and commission rules}
  - {code: RENEWAL_SUBMITTED, name: Renewal and submitted policies rules}
  - {code: CLAIMS_BENEFITS, name: Claims and employee benefits rules}
  - {code: SCREENING, name: Sanction screening configuration}
  - {code: WORKFLOW_DOCUMENTS, name: Workflows, notifications and document templates}
  - {code: REPORTS, name: Report definitions and layouts}
  - {code: SECURITY, name: Group profiles, permissions and separation of duties}
  - {code: DATA_MIGRATION, name: Migration console layouts and code maps}
  - {code: USERS, name: Users and their assignments (optional)}

