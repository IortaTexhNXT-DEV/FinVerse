  - {code: COA_ACCOUNT_CURRENCY, name: Currencies of the accounts, group: ACCOUNTING, module: coa, table: coa_account_currency, key: [account_id, currency_code], parent: account_id}
  - {code: COA_ACCOUNT_ROLE, name: Roles of the accounts, group: ACCOUNTING, module: coa, table: coa_account_role, key: [account_id, role_code], parent: account_id}
  - {code: ACC_EVENT_TYPE, name: Accounting events, group: ACCOUNTING, module: accounting, table: acc_event_type, key: [code]}
  - {code: ACC_RULE, name: Accounting rules, group: ACCOUNTING, module: accounting, table: acc_rule, key: [company_id, event_type, name, effective_from]}
  - {code: ACC_RULE_LINE, name: Lines of the accounting rules, group: ACCOUNTING, module: accounting, table: acc_rule_line, key: [rule_id, line_no], parent: rule_id}
  - {code: ACC_COST_CENTER_RULE, name: Cost-centre rules, group: ACCOUNTING, module: accounting, table: acc_cost_center_rule, key: [company_id, priority, source_module, event_type]}
  - {code: ACSL_GLSL_CONTROL, name: Control accounts of the sub-ledger reconciliation, group: ACCOUNTING, module: acsl, table: acsl_glsl_control, key: [company_id, account_code]}
  - {code: PRQ_LIQUIDATION_ACCOUNT, name: Liquidation accounts of marketing requests, group: ACCOUNTING, module: payrequest, table: prq_liquidation_account, key: [company_id, account_role]}
  - {code: JNL_RECURRING_TEMPLATE, name: Recurring journal templates, group: ACCOUNTING, module: journal, table: jnl_recurring_template, key: [company_id, name], environment: [last_occurrence_date]}
  - {code: JNL_RECURRING_LINE, name: Lines of the recurring journals, group: ACCOUNTING, module: journal, table: jnl_recurring_line, key: [template_id, line_no], parent: template_id}
