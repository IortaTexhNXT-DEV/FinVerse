  - {code: MIG_SURVIVORSHIP_RULE, name: Survivorship rules, group: DATA_MIGRATION, module: migration, table: mig_survivorship_rule, key: [field]}

# Reasons a table is never promoted.
reasons:
  TRANSACTION: Business transactions, their lines, documents and work items
  CLIENT_DATA: Clients, payees and their personal or tax details
  LOG: Audit, access, event and processing logs
  SECRET: Passwords, second-factor secrets, sign-in tokens and sessions
  COUNTER: Running numbers of documents and shared counters
  FILE: Stored files and attachments
  STATE: Operational state of the environment (periods, runs, queues, schema history)
  PLANNING: Budgets and sales targets, entered in each environment
  LIST_CONTENT: Watchlist entries, loaded from the list sources in each environment
  PROMOTION: Configuration Promotion's own packages, imports and baselines

