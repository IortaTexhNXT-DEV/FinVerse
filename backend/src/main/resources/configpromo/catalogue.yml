  - {code: CAT_INSURER_BRANCH, name: Insurer branches, group: PARTNERS, module: catalog, table: cat_insurer_branch, key: [insurer_id, code], environment: [placement_email]}
  - {code: PTY_PARTY, name: Business partners, group: PARTNERS, module: party, table: pty_party, key: [company_id, code]}
  - {code: ACSL_SOA_LAYOUT, name: Insurer statement layouts, group: PARTNERS, module: acsl, table: acsl_soa_layout, key: [insurer_code]}

