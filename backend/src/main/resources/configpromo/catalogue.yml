  - {code: BRS_MATCH_RULE, name: Bank reconciliation matching rules, group: CASH_AND_BANKING, module: receivables, table: brs_match_rule, key: [company_id, bank_account_code, rule_code]}
  - code: CSH_RECEIPT_SERIES
