  - {code: LOV_VALUE, name: Values of the lists, group: REFERENCE, module: lov, table: lov_value, key: [type_code, code]}
  - code: SYS_PARAMETER
    name: System parameters and numbering prefixes
    group: REFERENCE
    module: system
    table: sys_parameter
    key: [param_key]
    exclude: [pending_value, pending_by, pending_at]
    environmentRows:
      column: param_key
      values: [MIG_ENVIRONMENT_CLASS, MAIL_FROM_ADDRESS, JOB_FAILURE_RECIPIENTS, SCR_INGEST_ALERT_RECIPIENTS,
               MIG_LEGACY_LINK_EBIX, MIG_LEGACY_LINK_QPS, AUTH_MODE, MFA_POLICY, MFA_ISSUER_NAME,
               CSF_LEGACY_SYNC_ENABLED, PRODRECON_FILE_PATTERN, REMIT_FILE_PATTERN,
               CONFIG_PROMOTION_PRODUCTION_WINDOW, CONFIG_PROMOTION_NOTIFY, CONFIG_PROMOTION_MAX_PACKAGE_MB,
               CONFIG_PROMOTION_PIPELINE_APPLY]
  - {code: CUR_CURRENCY, name: Currencies, group: REFERENCE, module: currency, table: cur_currency, key: [code]}
  - {code: CUR_EXCHANGE_RATE, name: Exchange rates, group: REFERENCE, module: currency, table: cur_exchange_rate, key: [currency_code, rate_type, effective_date], optional: true}
  - code: SYS_PRODUCT_MODULE
    name: Module switches
    group: REFERENCE
    module: system
    table: sys_product_module
    key: [code]
    exclude: [pending_enabled, pending_reason, pending_by, pending_at, changed_reason, changed_by, changed_at, approved_by]
  - {code: SYS_MODULE_PROFILE, name: Module profiles, group: REFERENCE, module: system, table: sys_module_profile, key: [code]}
  - {code: SYS_MODULE_PROFILE_MODULE, name: Modules of the module profiles, group: REFERENCE, module: system, table: sys_module_profile_module, key: [profile_id, module_code], parent: profile_id}
  - {code: STO_RECORD_CLASS, name: Record classes of stored files, group: REFERENCE, module: storage, table: sto_record_class, key: [code]}
  - {code: ALT_EXCEPTION_CODE, name: Exception codes and alert thresholds, group: REFERENCE, module: alert, table: alt_exception_code, key: [code]}
  - {code: ATT_DOCUMENT_ACCESS, name: Document access classes, group: REFERENCE, module: attachment, table: att_document_access, key: [document_type, permission]}
  - {code: NBA_RETENTION_RULE, name: Retention rules, group: REFERENCE, module: nbadmin, table: nba_retention_rule, key: [record_type, statuses]}

  # ---------- Product catalogue --------------------------------------------------------------------
