  - {code: CAT_COVER_TYPE, name: Cover types, group: PRODUCTS, module: catalog, table: cat_cover_type, key: [line_code, code]}
  - {code: CAT_COVERAGE, name: Coverages, group: PRODUCTS, module: catalog, table: cat_coverage, key: [line_code, code]}
