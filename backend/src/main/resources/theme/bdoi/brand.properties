# Theme pack "bdoi": the BDO Insure brand of generated files (reports and business documents in
# PDF, Word and Excel) for BDOI (docs/design/BDO_UX_GUIDELINES.md). Colours as six hex digits.
logo=logo.png
# Logo width / height in pixels (378 x 77)
logo.width=378
logo.height=77
# Header Blue: table headers and titles
color.header=004EA8
# CTA Blue: company line
color.primary=0072D8
# Background Blue: group rows and label cells
color.background=E5F5FF
# Gold rule under the letterhead and above grand totals
color.accent=FDB913
# Subtotal rows and banded rows
color.band=F4F6FA
# Every second detail row of a table
color.rowBand=F7FAFD
# Grid lines
color.grid=D5DBE5
# Word and Excel font (the brand font Nunito is not embedded; Arial is the approved fallback)
font=Arial
