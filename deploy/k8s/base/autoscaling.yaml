# Horizontal scaling of the user-facing workloads. bibs-jobs and bibs-integration keep a fixed
# replica count (set per overlay). Needs the Kubernetes metrics server; a requests-per-second metric
# can be added through a Prometheus adapter (DEPLOYMENT.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bibs-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bibs-web }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies: [{ type: Pods, value: 2, periodSeconds: 60 }]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Pods, value: 1, periodSeconds: 120 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bibs-frontend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bibs-frontend }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
