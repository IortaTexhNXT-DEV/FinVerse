# bibs-integration: outbox relay to MSK, Kafka consumers, inbound bank / insurer / watchlist files,
# and the /integration/** APIs published through Apigee X (ALB path /integration/*). Runtime role
# "integration". Two pods across availability zones: the relay is guarded by the job lock and the
# consumers share their consumer groups.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bibs-integration
  labels: { app.kubernetes.io/name: bibs-integration, app.kubernetes.io/component: backend }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: bibs-integration }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /actuator/prometheus
      labels: { app.kubernetes.io/name: bibs-integration, app.kubernetes.io/component: backend, bibs/tier: backend }
    spec:
      serviceAccountName: bibs-integration
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app.kubernetes.io/name: bibs-integration } }
      containers:
        - name: backend
          image: bibs-backend
          # management: health and Prometheus metrics, reachable from the monitoring namespace only.
          ports: [{ name: https, containerPort: 8443 }, { name: management, containerPort: 9090 }]
          env:
            - { name: BROKERVERSE_RUNTIME_ROLE, value: integration }
          envFrom:
            - configMapRef: { name: bibs-backend-config }
            - secretRef: { name: bibs-backend-secrets }
          resources:
            requests: { cpu: "500m", memory: "1536Mi", ephemeral-storage: "256Mi" }
            limits: { cpu: "2", memory: "2Gi", ephemeral-storage: "3Gi" }
          startupProbe:
            httpGet: { path: /livez, port: https, scheme: HTTPS }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: https, scheme: HTTPS }
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop: { sleep: { seconds: 15 } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tls, mountPath: /etc/bibs/tls, readOnly: true }
            - { name: rds-ca, mountPath: /etc/bibs/rds-ca, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tls
          secret: { secretName: bibs-integration-tls }
        - name: rds-ca
          configMap: { name: rds-ca-bundle }
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: bibs-integration
  labels: { app.kubernetes.io/name: bibs-integration }
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
spec:
  selector: { app.kubernetes.io/name: bibs-integration }
  ports: [{ name: https, port: 8443, targetPort: https }]
