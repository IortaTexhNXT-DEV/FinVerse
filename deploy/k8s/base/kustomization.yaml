# BIBS on Amazon EKS: the four workloads of ARCHITECTURE_OPTION_DECISION.md section 2 and the
# controls of section 5 (internal ALB with WAF, TLS on every hop, NetworkPolicies deny by default,
# IRSA). Do not apply the base directly: build an overlay (overlays/uat, overlays/prod), which sets
# the image tags, host names and the AWS placeholders (<...>). See docs/operations/DEPLOYMENT.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bibs
labels:
  - pairs:
      app.kubernetes.io/part-of: bibs
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - backend-config.yaml
  - bibs-web.yaml
  - bibs-jobs.yaml
  - bibs-integration.yaml
  - bibs-frontend.yaml
  - autoscaling.yaml
  - disruption-budgets.yaml
  - network-policies.yaml
  - certificates.yaml
  - ingress.yaml
  - ../../nginx
