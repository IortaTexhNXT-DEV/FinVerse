# Template only, not part of the kustomization. Create the real secret from AWS Secrets Manager (for
# example with the External Secrets Operator) or your vault; never commit it. Shared by bibs-web,
# bibs-jobs and bibs-integration.
apiVersion: v1
kind: Secret
metadata:
  name: bibs-backend-secrets
  namespace: bibs
type: Opaque
stringData:
  # No sslmode here: BROKERVERSE_DB_SSL_MODE (verify-full) applies. An sslmode in the URL would take
  # precedence and a plaintext one is refused at start-up in production.
  BROKERVERSE_DB_URL: jdbc:postgresql://<rds-endpoint>:5432/brokerverse
  # Least-privilege runtime login of the application (member of brokerverse_runtime) and the schema
  # owner that runs the migrations; see DEPLOYMENT.md "Database roles".
  BROKERVERSE_DB_USER: bibs_app
  BROKERVERSE_DB_PASSWORD: "<from-vault>"
  SPRING_FLYWAY_USER: bibs_owner
  SPRING_FLYWAY_PASSWORD: "<from-vault>"
  BROKERVERSE_JWT_SECRET: "<at-least-32-random-characters>"
  # Key of the authenticator app secrets (second factor): openssl rand -base64 32.
  BROKERVERSE_MFA_ENCRYPTION_KEY: "<32-random-bytes-base64>"
  # Keyed masking of personal data in non-production migration extracts.
  BROKERVERSE_MIGRATION_MASKING_KEY: "<at-least-32-random-characters>"
  # Single sign-on: client secret of the OpenID Connect client, or the SAML provider's certificate.
  BROKERVERSE_OIDC_CLIENT_SECRET: "<only-with-AUTH_MODE-OIDC>"
  BROKERVERSE_SAML_IDP_CERTIFICATE: "<only-with-AUTH_MODE-SAML: PEM certificate>"
  BROKERVERSE_ADMIN_INITIAL_PASSWORD: "<only-for-first-start>"
  # Seed environments only (UAT overlay, seed profile): password of the SIT/UAT users of this environment.
  BROKERVERSE_SEED_PASSWORD: "<seed-environments-only>"
  # ElastiCache AUTH token (or RBAC user password; set BROKERVERSE_REDIS_USERNAME for RBAC).
  BROKERVERSE_REDIS_PASSWORD: "<elasticache-auth-token>"
  # Amazon MSK SASL/SCRAM credentials (the secret associated with the cluster in Secrets Manager).
  BROKERVERSE_KAFKA_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="<msk-scram-user>" password="<msk-scram-password>";
