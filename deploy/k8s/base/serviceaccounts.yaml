# One service account per workload. The backend ones carry an IAM role through IRSA (IAM roles for
# service accounts) with least privilege per workload; the overlay sets the role ARNs.
#   bibs-web:         S3 document bucket (read/write), KMS key of the bucket (encrypt/decrypt)
#   bibs-jobs:        S3 document and report buckets, KMS keys
#   bibs-integration: S3 inbound/outbound file prefixes, KMS keys; Secrets Manager read of its secrets
# No workload needs AWS credentials in environment variables.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bibs-web
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/<BIBS_WEB_ROLE>"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bibs-jobs
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/<BIBS_JOBS_ROLE>"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bibs-integration
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/<BIBS_INTEGRATION_ROLE>"
automountServiceAccountToken: true
---
# The frontend calls no AWS or Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bibs-frontend
automountServiceAccountToken: false
