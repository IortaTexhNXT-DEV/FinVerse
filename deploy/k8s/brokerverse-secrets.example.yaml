# Template only. Create the real secret from your vault/secret manager, never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: brokerverse-secrets
  namespace: brokerverse
type: Opaque
stringData:
  BROKERVERSE_DB_URL: jdbc:postgresql://db-host:5432/brokerverse?sslmode=require
  BROKERVERSE_DB_USER: brokerverse
  BROKERVERSE_DB_PASSWORD: "<from-vault>"
  BROKERVERSE_JWT_SECRET: "<at-least-32-random-characters>"
  BROKERVERSE_ADMIN_INITIAL_PASSWORD: "<only-for-first-start>"
  # ElastiCache AUTH token (or RBAC user password; set BROKERVERSE_REDIS_USERNAME for RBAC).
  BROKERVERSE_REDIS_PASSWORD: "<elasticache-auth-token>"
  # Amazon MSK SASL/SCRAM credentials (the secret associated with the cluster in Secrets Manager).
  BROKERVERSE_KAFKA_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="<msk-scram-user>" password="<msk-scram-password>";
