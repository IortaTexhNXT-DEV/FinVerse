# Template only. Create the real secret from your vault/secret manager, never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: brokerverse-secrets
  namespace: brokerverse
type: Opaque
stringData:
  BROKERVERSE_DB_URL: jdbc:postgresql://db-host:5432/brokerverse?sslmode=require
  BROKERVERSE_DB_USER: brokerverse
  BROKERVERSE_DB_PASSWORD: "<from-vault>"
  BROKERVERSE_JWT_SECRET: "<at-least-32-random-characters>"
  BROKERVERSE_ADMIN_INITIAL_PASSWORD: "<only-for-first-start>"
