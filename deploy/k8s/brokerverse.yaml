# iNXT BrokerVerse – reference Kubernetes deployment.
# Prerequisites: an external PostgreSQL 16 database, an ingress controller, and the secret
# "brokerverse-secrets" (see brokerverse-secrets.example.yaml). Images are built by CI and pushed to
# your registry; replace REGISTRY and TAG.
apiVersion: v1
kind: Namespace
metadata:
  name: brokerverse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: brokerverse-config
  namespace: brokerverse
data:
  SPRING_PROFILES_ACTIVE: "prod"
  BROKERVERSE_ALLOWED_ORIGINS: "https://brokerverse.example.com"
  BROKERVERSE_TOKEN_VALIDITY: "PT8H"
  BROKERVERSE_DB_POOL_SIZE: "20"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokerverse-backend
  namespace: brokerverse
  labels: { app: brokerverse-backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: brokerverse-backend }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: brokerverse-backend }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: backend
          image: REGISTRY/brokerverse-backend:TAG
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: brokerverse-config }
            - secretRef: { name: brokerverse-secrets }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: brokerverse
spec:
  selector: { app: brokerverse-backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokerverse-frontend
  namespace: brokerverse
  labels: { app: brokerverse-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: brokerverse-frontend }
  template:
    metadata:
      labels: { app: brokerverse-frontend }
    spec:
      containers:
        - name: frontend
          image: REGISTRY/brokerverse-frontend:TAG
          ports: [{ containerPort: 8080 }]
          env:
            - { name: BROKERVERSE_BACKEND_HOST, value: backend }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: brokerverse
spec:
  selector: { app: brokerverse-frontend }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brokerverse
  namespace: brokerverse
spec:
  rules:
    - host: brokerverse.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
  tls:
    - hosts: [brokerverse.example.com]
      secretName: brokerverse-tls
