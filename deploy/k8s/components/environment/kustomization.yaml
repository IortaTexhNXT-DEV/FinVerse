# Copies the per-environment values of the overlay's ConfigMap "bibs-environment" (environment.yaml,
# annotated local-config, so it is never applied) into the base resources: host name of the Gateway
# listener and the HTTPRoutes, IRSA role ARNs, Private CA and the network ranges of the
# NetworkPolicies. The values of the load balancer itself (certificate, WAF web ACL, source ranges)
# are copied by the gateway component (components/gateway-alb or gateway-envoy). An overlay lists
# its environment.yaml under resources and this component under components, after the gateway one.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  # ---- Gateway host name ----
  - source: { kind: ConfigMap, name: bibs-environment, fieldPath: data.host }
    targets:
      - select: { kind: Gateway, name: bibs }
        fieldPaths: [spec.listeners.0.hostname]
      - select: { kind: HTTPRoute }
        fieldPaths: [spec.hostnames.0]
  # ---- IRSA ----
  - source: { kind: ConfigMap, name: bibs-environment, fieldPath: data.webRoleArn }
    targets:
      - select: { kind: ServiceAccount, name: bibs-web }
        fieldPaths: ["metadata.annotations.[eks.amazonaws.com/role-arn]"]
  - source: { kind: ConfigMap, name: bibs-environment, fieldPath: data.jobsRoleArn }
    targets:
      - select: { kind: ServiceAccount, name: bibs-jobs }
        fieldPaths: ["metadata.annotations.[eks.amazonaws.com/role-arn]"]
  - source: { kind: ConfigMap, name: bibs-environment, fieldPath: data.integrationRoleArn }
    targets:
      - select: { kind: ServiceAccount, name: bibs-integration }
        fieldPaths: ["metadata.annotations.[eks.amazonaws.com/role-arn]"]
  # ---- Private CA of the in-cluster certificates ----
  - source: { kind: ConfigMap, name: bibs-environment, fieldPath: data.privateCaArn }
    targets:
      - select: { kind: AWSPCAIssuer }
        fieldPaths: [spec.arn]
  - source: { kind: ConfigMap, name: bibs-environment, fieldPath: data.awsRegion }
    targets:
      - select: { kind: AWSPCAIssuer }
        fieldPaths: [spec.region]
  # ---- Network ranges of the NetworkPolicies ----
  - source: { kind: ConfigMap, name: bibs-environment, fieldPath: data.loadBalancerCidr }
    targets:
      - select: { kind: NetworkPolicy, name: allow-load-balancer }
        fieldPaths: [spec.ingress.0.from.0.ipBlock.cidr]
  - source: { kind: ConfigMap, name: bibs-environment, fieldPath: data.dataServicesCidr }
    targets:
      - select: { kind: NetworkPolicy, name: backend-to-data-services }
        fieldPaths: [spec.egress.0.to.0.ipBlock.cidr]
  - source: { kind: ConfigMap, name: bibs-environment, fieldPath: data.awsEndpointsCidr }
    targets:
      - select: { kind: NetworkPolicy, name: backend-to-aws-endpoints }
        fieldPaths: [spec.egress.0.to.0.ipBlock.cidr]
  - source: { kind: ConfigMap, name: bibs-environment, fieldPath: data.clientNetworkCidr }
    targets:
      - select: { kind: NetworkPolicy, name: backend-to-client-network }
        fieldPaths: [spec.egress.0.to.0.ipBlock.cidr]
