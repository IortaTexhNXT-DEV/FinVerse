# Template only. Create the real secret from your vault/secret manager, never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: finverse-secrets
  namespace: finverse
type: Opaque
stringData:
  FINVERSE_DB_URL: jdbc:postgresql://db-host:5432/finverse?sslmode=require
  FINVERSE_DB_USER: finverse
  FINVERSE_DB_PASSWORD: "<from-vault>"
  FINVERSE_JWT_SECRET: "<at-least-32-random-characters>"
  FINVERSE_ADMIN_INITIAL_PASSWORD: "<only-for-first-start>"
