# iNXT BrokerVerse – local / demo stack.
#   docker compose up -d --build        -> http://localhost:8081  (demo users, password Brokerverse@2026)
# Production: use deploy/ (Kubernetes) or the same images with external PostgreSQL and secrets.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brokerverse
      POSTGRES_USER: brokerverse
      POSTGRES_PASSWORD: ${BROKERVERSE_DB_PASSWORD:-brokerverse}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerverse -d brokerverse"]
      interval: 5s
      retries: 20
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      BROKERVERSE_DB_URL: jdbc:postgresql://db:5432/brokerverse
      BROKERVERSE_DB_USER: brokerverse
      BROKERVERSE_DB_PASSWORD: ${BROKERVERSE_DB_PASSWORD:-brokerverse}
      BROKERVERSE_JWT_SECRET: ${BROKERVERSE_JWT_SECRET:-change-me-local-only-0123456789abcdefghij}
      BROKERVERSE_ALLOWED_ORIGINS: http://localhost:8081
      BROKERVERSE_ADMIN_INITIAL_PASSWORD: ${BROKERVERSE_ADMIN_INITIAL_PASSWORD:-}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BROKERVERSE_BACKEND_HOST: backend
    ports:
      - "8081:8080"

volumes:
  db-data:
