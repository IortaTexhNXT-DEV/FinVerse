# BIBS User Provisioning (SCIM 2.0) - OpenAPI 3.0.3. Issued by iorta TechNXT with the User Access
# Interface Specification v1.0 for BDOI IT and the UIDM-ISC team.
openapi: 3.0.3
info:
  title: BIBS User Provisioning (SCIM 2.0)
  version: '1.0'
  description: 'SCIM 2.0 service of the BDO Insure Brokering System (BIBS) for UIDM-ISC, reached through the BDOI
    API gateway. Joiner (POST /Users), mover (PUT), status change and rehire (PATCH), leaver (DELETE), user and
    group profile extracts (GET), and the members of a group profile (PATCH /Groups/{id}). Companion of the User
    Access Interface Specification v1.0. Path inside BIBS: /integration/v1/scim/v2. Sign-in of the users is by OpenID
    Connect with Microsoft Entra ID; the redirect URI to register is <BIBS address>/api/v1/auth/sso/oidc/callback.'
  contact:
    name: iorta TechNXT Project Team
servers:
- url: https://{gateway}/integration/v1/scim/v2
  description: BDOI API gateway (per environment)
  variables:
    gateway:
      default: gateway-host
      description: Gateway host of SIT, UAT or production
security:
- gatewayToken:
  - identity.provision
tags:
- name: Users
- name: Groups
paths:
  /Users:
    get:
      operationId: listUsers
      tags:
      - Users
      summary: User extract
      description: 'Returns every user that holds a Windows ID, with the group profiles held in BIBS. No filter,
        sort or paging parameters are read: the whole list comes back in one answer (about 530 users). active is
        true only for the AD status ACTIVE.'
      responses:
        '200':
          description: Every user with a Windows ID
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserList'
              example:
                schemas:
                - urn:ietf:params:scim:api:messages:2.0:ListResponse
                totalResults: 1
                itemsPerPage: 1
                startIndex: 1
                Resources:
                - schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                  - urn:bibs:params:scim:schemas:extension:bdo:2.0:User
                  id: mbsantos
                  externalId: BDOI\mbsantos
                  userName: mbsantos
                  displayName: Maria B. Santos
                  active: true
                  name:
                    givenName: Maria
                    familyName: Santos
                  emails:
                  - value: maria.santos@bdoinsure.example
                    primary: true
                  urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
                    department: Claims
                    division: Non-Life Claims
                  urn:bibs:params:scim:schemas:extension:bdo:2.0:User:
                    windowsId: BDOI\mbsantos
                    adGroup: GG-BIBS-CLAIMS
                    adStatus: ACTIVE
                    teamLeaderName: Jose Reyes
                    teamHeadName: Ana Cruz
                    sectionHeadName: Paolo Garcia
                    unitHeadName: Liza Mendoza
                    unitSegment: Non-Life Claims
                    location: Makati Head Office
                    uidmRequestNo: UIDM-2026-004512
                    groupProfiles:
                    - CLM_OFFICER
                  groups:
                  - value: CLM_OFFICER
        '401': &id001
          $ref: '#/components/responses/Unauthorized'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
        '413': &id003
          $ref: '#/components/responses/TooLarge'
        '429': &id004
          $ref: '#/components/responses/TooMany'
        '500': &id005
          $ref: '#/components/responses/Failed'
    post:
      operationId: createUser
      tags:
      - Users
      summary: Joiner
      description: Send one User per call. userName is the BIBS user ID; externalId or the extension windowsId is
        the Windows ID (AD account). Both are unique in BIBS. The user is created active. The status follows the
        extension adStatus or, when absent, active. groups is optional. When present, every group profile is checked
        (exists, is active, no separation-of-duties conflict, no conflicting permissions) before anything is recorded.
        When one check fails, the user is not created. uidmRequestNo carries the UIDM request number. It is written
        to the access change log as the reference of every change.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/User'
            examples:
              default:
                value:
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                  - urn:bibs:params:scim:schemas:extension:bdo:2.0:User
                  externalId: BDOI\mbsantos
                  userName: mbsantos
                  name:
                    givenName: Maria
                    familyName: Santos
                  displayName: Maria B. Santos
                  emails:
                  - value: maria.santos@bdoinsure.example
                    primary: true
                  active: true
                  urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
                    department: Claims
                    division: Non-Life Claims
                  urn:bibs:params:scim:schemas:extension:bdo:2.0:User:
                    windowsId: BDOI\mbsantos
                    adGroup: GG-BIBS-CLAIMS
                    adStatus: ACTIVE
                    teamLeaderName: Jose Reyes
                    teamHeadName: Ana Cruz
                    sectionHeadName: Paolo Garcia
                    unitHeadName: Liza Mendoza
                    unitSegment: Non-Life Claims
                    location: Makati Head Office
                    uidmRequestNo: UIDM-2026-004512
                  groups:
                  - value: CLM_OFFICER
      responses:
        '201':
          description: User created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
                - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                - urn:bibs:params:scim:schemas:extension:bdo:2.0:User
                id: mbsantos
                externalId: BDOI\mbsantos
                userName: mbsantos
                displayName: Maria B. Santos
                active: true
                name:
                  givenName: Maria
                  familyName: Santos
                emails:
                - value: maria.santos@bdoinsure.example
                  primary: true
                urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
                  department: Claims
                  division: Non-Life Claims
                urn:bibs:params:scim:schemas:extension:bdo:2.0:User:
                  windowsId: BDOI\mbsantos
                  adGroup: GG-BIBS-CLAIMS
                  adStatus: ACTIVE
                  teamLeaderName: Jose Reyes
                  teamHeadName: Ana Cruz
                  sectionHeadName: Paolo Garcia
                  unitHeadName: Liza Mendoza
                  unitSegment: Non-Life Claims
                  location: Makati Head Office
                  uidmRequestNo: UIDM-2026-004512
                  groupProfiles:
                  - CLM_OFFICER
                groups:
                - value: CLM_OFFICER
        '400':
          description: Invalid attribute or refused group profile (invalidValue)
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: A group profile of groups does not exist
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User ID or Windows ID taken (uniqueness)
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported content type
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id001
        '403': *id002
        '413': *id003
        '429': *id004
        '500': *id005
  /Users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: BIBS user ID or Windows ID
      schema:
        type: string
        pattern: ^[A-Za-z0-9._\\@-]{1,50}$
    get:
      operationId: getUser
      tags:
      - Users
      summary: One user
      responses:
        '200':
          description: The user
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
                - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                - urn:bibs:params:scim:schemas:extension:bdo:2.0:User
                id: mbsantos
                externalId: BDOI\mbsantos
                userName: mbsantos
                displayName: Maria B. Santos
                active: true
                name:
                  givenName: Maria
                  familyName: Santos
                emails:
                - value: maria.santos@bdoinsure.example
                  primary: true
                urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
                  department: Claims
                  division: Non-Life Claims
                urn:bibs:params:scim:schemas:extension:bdo:2.0:User:
                  windowsId: BDOI\mbsantos
                  adGroup: GG-BIBS-CLAIMS
                  adStatus: ACTIVE
                  teamLeaderName: Jose Reyes
                  teamHeadName: Ana Cruz
                  sectionHeadName: Paolo Garcia
                  unitHeadName: Liza Mendoza
                  unitSegment: Non-Life Claims
                  location: Makati Head Office
                  uidmRequestNo: UIDM-2026-004512
                  groupProfiles:
                  - CLM_OFFICER
                groups:
                - value: CLM_OFFICER
        '404':
          description: No user with that ID
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id001
        '403': *id002
        '413': *id003
        '429': *id004
        '500': *id005
    put:
      operationId: replaceUser
      tags:
      - Users
      summary: Mover
      description: Send the whole User. Attributes left out are not cleared when BIBS cannot tell a removal from
        an omission; send every attribute UIDM-ISC holds. When the body has no Windows ID, BIBS keeps the one it
        holds for {user-id}. The group profiles stay as they are unless the body carries groups. When it does, they
        replace the group profiles at once, after the same checks as for a joiner. An empty list removes every group
        profile. A change of the AD status in the extension is applied with the other details.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/User'
            examples:
              default:
                value:
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                  - urn:bibs:params:scim:schemas:extension:bdo:2.0:User
                  externalId: BDOI\mbsantos
                  userName: mbsantos
                  name:
                    givenName: Maria
                    familyName: Santos
                  displayName: Maria B. Santos
                  emails:
                  - value: maria.santos@bdoinsure.example
                    primary: true
                  active: true
                  urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
                    department: Claims
                    division: Non-Life Claims
                  urn:bibs:params:scim:schemas:extension:bdo:2.0:User:
                    windowsId: BDOI\mbsantos
                    adGroup: GG-BIBS-CLAIMS
                    adStatus: ACTIVE
                    teamLeaderName: Carla Lim
                    teamHeadName: Ana Cruz
                    sectionHeadName: Paolo Garcia
                    unitHeadName: Liza Mendoza
                    unitSegment: Non-Life Claims
                    location: Makati Head Office
                    uidmRequestNo: UIDM-2026-004790
                  groups:
                  - value: CLM_TL
      responses:
        '200':
          description: User updated
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
                - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                - urn:bibs:params:scim:schemas:extension:bdo:2.0:User
                id: mbsantos
                externalId: BDOI\mbsantos
                userName: mbsantos
                displayName: Maria B. Santos
                active: true
                name:
                  givenName: Maria
                  familyName: Santos
                emails:
                - value: maria.santos@bdoinsure.example
                  primary: true
                urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
                  department: Claims
                  division: Non-Life Claims
                urn:bibs:params:scim:schemas:extension:bdo:2.0:User:
                  windowsId: BDOI\mbsantos
                  adGroup: GG-BIBS-CLAIMS
                  adStatus: ACTIVE
                  teamLeaderName: Carla Lim
                  teamHeadName: Ana Cruz
                  sectionHeadName: Paolo Garcia
                  unitHeadName: Liza Mendoza
                  unitSegment: Non-Life Claims
                  location: Makati Head Office
                  uidmRequestNo: UIDM-2026-004790
                  groupProfiles:
                  - CLM_TL
                groups:
                - value: CLM_TL
        '400':
          description: Invalid attribute, unknown user or refused group profile
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: A group profile of groups does not exist
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Windows ID taken (uniqueness)
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id001
        '403': *id002
        '413': *id003
        '429': *id004
        '500': *id005
    patch:
      operationId: patchUser
      tags:
      - Users
      summary: Status change or rehire
      description: 'A SCIM PatchOp. BIBS reads the first operation that sets active (true or false) or the extension
        adStatus (ACTIVE, INACTIVE, LOCKED, DISABLED or DEACTIVATED). Other operations are ignored. active false,
        or any AD status other than ACTIVE, deactivates the user in BIBS and ends the open sessions at once. active
        true (or ACTIVE) is a rehire: the user is reactivated with the group profiles held before. At most 100 operations.'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/PatchOp'
            examples:
              default:
                value:
                  schemas:
                  - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  Operations:
                  - op: replace
                    path: active
                    value: false
              example1:
                summary: Same call with the AD status
                value:
                  schemas:
                  - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  Operations:
                  - op: replace
                    path: urn:bibs:params:scim:schemas:extension:bdo:2.0:User:adStatus
                    value: LOCKED
              example2:
                summary: Rehire
                value:
                  schemas:
                  - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  Operations:
                  - op: replace
                    path: active
                    value: true
      responses:
        '200':
          description: User with the new status
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
                - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                - urn:bibs:params:scim:schemas:extension:bdo:2.0:User
                id: mbsantos
                externalId: BDOI\mbsantos
                userName: mbsantos
                displayName: Maria B. Santos
                active: false
                name:
                  givenName: Maria
                  familyName: Santos
                emails:
                - value: maria.santos@bdoinsure.example
                  primary: true
                urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
                  department: Claims
                  division: Non-Life Claims
                urn:bibs:params:scim:schemas:extension:bdo:2.0:User:
                  windowsId: BDOI\mbsantos
                  adGroup: GG-BIBS-CLAIMS
                  adStatus: INACTIVE
                  teamLeaderName: Jose Reyes
                  teamHeadName: Ana Cruz
                  sectionHeadName: Paolo Garcia
                  unitHeadName: Liza Mendoza
                  unitSegment: Non-Life Claims
                  location: Makati Head Office
                  uidmRequestNo: UIDM-2026-004512
                  groupProfiles:
                  - CLM_OFFICER
                groups:
                - value: CLM_OFFICER
        '400':
          description: No status operation, unknown AD status or unknown user
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id001
        '403': *id002
        '413': *id003
        '429': *id004
        '500': *id005
    delete:
      operationId: deleteUser
      tags:
      - Users
      summary: Leaver
      description: The user is deactivated (status DEACTIVATED), the open sessions end, the group profiles are kept
        for the record and the history stays. BIBS never deletes a user. No body is sent or returned.
      responses:
        '204':
          description: User deactivated, sessions ended
        '400':
          description: Unknown user
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id001
        '403': *id002
        '413': *id003
        '429': *id004
        '500': *id005
  /Groups:
    get:
      operationId: listGroups
      tags:
      - Groups
      summary: Group profile extract
      description: Returns every group profile with its name, status, permission codes and members (BIBS user IDs).
        The group profiles themselves are maintained in BIBS through group-profile requests; UIDM-ISC reads them
        here and maps them to its entitlements.
      responses:
        '200':
          description: Every group profile
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/GroupList'
              example:
                schemas:
                - urn:ietf:params:scim:api:messages:2.0:ListResponse
                totalResults: 1
                itemsPerPage: 1
                startIndex: 1
                Resources:
                - &id006
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:Group
                  id: CLM_OFFICER
                  displayName: Claims Officer
                  active: true
                  members:
                  - value: mbsantos
                  - value: jdelacruz
                  permissions:
                  - CLAIM_VIEW
                  - CLAIM_REGISTER
                  - CLAIM_DOCUMENT_UPLOAD
        '401': *id001
        '403': *id002
        '413': *id003
        '429': *id004
        '500': *id005
  /Groups/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Group profile code
      schema:
        type: string
        pattern: ^[A-Za-z0-9._\\@-]{1,50}$
    get:
      operationId: getGroup
      tags:
      - Groups
      summary: One group profile
      responses:
        '200':
          description: The group profile
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Group'
              example: *id006
        '404':
          description: No group profile with that code
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id001
        '403': *id002
        '413': *id003
        '429': *id004
        '500': *id005
    patch:
      operationId: patchGroupMembers
      tags:
      - Groups
      summary: Change the members
      description: The only path accepted is members, or members[value eq "<user ID>"] to remove one member. A value
        of a member is a BIBS user ID as returned by the user extract. add gives the group profile to the users
        listed; remove takes it from the users listed (or from every holder when no value and no filter is given);
        replace makes the users listed the only holders. op is read without regard to case. Each user whose group
        profiles change gets one membership event. All of them are checked first. When one is refused, nothing is
        applied for anybody (all or nothing). Send the UIDM request number in the header X-UIDM-Request-No (up to
        40 letters, digits and . _ / -).
      parameters:
      - name: X-UIDM-Request-No
        in: header
        required: false
        description: UIDM request number of the change
        schema:
          type: string
          pattern: ^[A-Za-z0-9._/-]{1,40}$
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/PatchOp'
            examples:
              default:
                value:
                  schemas:
                  - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  Operations:
                  - op: add
                    path: members
                    value:
                    - value: mbsantos
                    - value: jdelacruz
              example1:
                summary: Remove one member
                value:
                  schemas:
                  - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  Operations:
                  - op: remove
                    path: members[value eq "jdelacruz"]
              example2:
                summary: Replace all members
                value:
                  schemas:
                  - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  Operations:
                  - op: replace
                    path: members
                    value:
                    - value: mbsantos
      responses:
        '200':
          description: The group profile after the change
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Group'
              example: *id006
        '400':
          description: invalidPath, invalidSyntax or invalidValue (refused membership, unknown member)
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No group profile with that code
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id001
        '403': *id002
        '413': *id003
        '429': *id004
        '500': *id005
components:
  securitySchemes:
    gatewayToken:
      type: oauth2
      description: 'Client credentials token of the BDOI API gateway: signed JWT (RS256) with the configured issuer
        and audience and the scope identity.provision; 60 seconds of clock skew.'
      flows:
        clientCredentials:
          tokenUrl: https://{gateway}/oauth/token
          scopes:
            identity.provision: Provision BIBS users and group membership
  schemas:
    User:
      type: object
      additionalProperties: false
      required:
      - schemas
      description: SCIM User with the enterprise and BIBS extensions. Attributes outside this list are refused.
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          readOnly: true
          description: BIBS user ID
        externalId:
          type: string
          pattern: ^[A-Za-z0-9._\\@-]{1,50}$
          description: Windows ID
        userName:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,50}$
          description: BIBS user ID
        name:
          type: object
          properties:
            givenName:
              type: string
              maxLength: 60
            familyName:
              type: string
              maxLength: 60
        displayName:
          type: string
          maxLength: 120
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                pattern: ^[^@\s]{1,64}@[^@\s]{1,120}$
              primary:
                type: boolean
        active:
          type: boolean
        groups:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Reference'
          description: 'Absent: unchanged. Present: replaces the group profiles.'
        meta:
          type: object
        urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
          $ref: '#/components/schemas/EnterpriseUser'
        urn:bibs:params:scim:schemas:extension:bdo:2.0:User:
          $ref: '#/components/schemas/BibsUser'
    EnterpriseUser:
      type: object
      properties:
        department:
          type: string
          maxLength: 120
        division:
          type: string
          maxLength: 120
        manager:
          type: object
          properties:
            displayName:
              type: string
              maxLength: 120
    BibsUser:
      type: object
      properties:
        windowsId:
          type: string
          pattern: ^[A-Za-z0-9._\\@-]{1,50}$
        adGroup:
          type: string
          maxLength: 120
        adStatus:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - LOCKED
          - DISABLED
          - DEACTIVATED
        teamLeaderName:
          type: string
          maxLength: 120
        teamHeadName:
          type: string
          maxLength: 120
        sectionHeadName:
          type: string
          maxLength: 120
        unitHeadName:
          type: string
          maxLength: 120
        unitSegment:
          type: string
          maxLength: 120
        location:
          type: string
          maxLength: 120
        uidmRequestNo:
          type: string
          pattern: ^[A-Za-z0-9._/-]{1,40}$
        groupProfiles:
          type: array
          items:
            type: string
          description: Returned on every answer; read on input only with the setting UAM_PROVISIONING_ROLES
    Reference:
      type: object
      required:
      - value
      properties:
        value:
          type: string
          pattern: ^[A-Za-z0-9_.-]{1,40}$
    Group:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          description: Group profile code
        displayName:
          type: string
        active:
          type: boolean
        members:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
        permissions:
          type: array
          items:
            type: string
    PatchOp:
      type: object
      required:
      - schemas
      - Operations
      properties:
        schemas:
          type: array
          items:
            type: string
            enum:
            - urn:ietf:params:scim:api:messages:2.0:PatchOp
        Operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
            - op
            properties:
              op:
                type: string
                description: add, remove or replace (any case)
              path:
                type: string
              value: {}
    UserList:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
        itemsPerPage:
          type: integer
        startIndex:
          type: integer
        Resources:
          type: array
          items:
            $ref: '#/components/schemas/User'
    GroupList:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
        itemsPerPage:
          type: integer
        startIndex:
          type: integer
        Resources:
          type: array
          items:
            $ref: '#/components/schemas/Group'
    Error:
      type: object
      required:
      - schemas
      - status
      - detail
      properties:
        schemas:
          type: array
          items:
            type: string
            enum:
            - urn:ietf:params:scim:api:messages:2.0:Error
        status:
          type: string
          description: HTTP status as text
        scimType:
          type: string
          enum:
          - invalidValue
          - invalidSyntax
          - invalidPath
          - uniqueness
        detail:
          type: string
      example:
        schemas:
        - urn:ietf:params:scim:api:messages:2.0:Error
        status: '400'
        scimType: invalidValue
        detail: 'Event 18460: One user may not hold both CLM_OFFICER and CLM_TL (separation-of-duties rule SOD-004)'
  responses:
    Unauthorized:
      description: No token, or a token with a wrong issuer, audience, signature or validity
      headers:
        WWW-Authenticate:
          schema:
            type: string
    Forbidden:
      description: Token without the scope identity.provision
    TooLarge:
      description: Body larger than 256 KB
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/Error'
    TooMany:
      description: More than 300 requests in one minute from one client address
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/Error'
    Failed:
      description: Unexpected failure; the detail carries a reference only
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/Error'
