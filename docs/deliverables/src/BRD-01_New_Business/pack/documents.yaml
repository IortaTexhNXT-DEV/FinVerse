# Documents generated by BRD-1 New Business. Each is produced from a document template (Document Templates screen)
# with the BDO Insure letterhead, the "Confidential" footer and page x of y, and is downloadable in Word as a copy.
# Columns: id | document | template | format | produced by | protected | fields and their source | image (slug)
documents:
  - id: DO-01
    name: Insurance quotation (quotation letter)
    template: QUOTATION_LETTER, QUOTATION_TERMS
    format: PDF, one per version; Excel schedule (Quotation sheet)
    produced: Quotation record › PDF / Excel; attached to Send via Email
    protected: Yes when e-mailed (password in a separate e-mail)
    fields:
      - "Quotation: Quotation no., ARN, Version, Client (code – name), Product, Insurer (or To be advised), Period, Valid until, Premium payment (Via BDOI / Directly to the insurer) – from the quotation"
      - "Risk items: #, Group, Risk, Sum insured, Rate %, Premium – from the current version's items"
      - "Premium: Net premium, Documentary stamp tax, Premium tax, VAT, Fire service tax, Local government tax, Gross premium – from the premium computation (Appendix A)"
      - "Letter text and terms and conditions – from the templates QUOTATION_LETTER and QUOTATION_TERMS in force"
      - "Signatures: Prepared by, Approved by – the maker and the approver"
    shot: doc-quotation
    frs: [FR-NB-004, FR-NB-044]
  - id: DO-02
    name: Quotation slip
    template: QUOTATION_SLIP
    format: PDF, one per insurer approached
    produced: PRF record › Quotation Slip tab (PDF); e-mailed at Approve and send to insurers
    protected: Yes (password in a separate e-mail)
    fields:
      - "QS number, PRF, ARN, client, product, period, reply date – from the PRF and the slip"
      - "Risk details and risk items with sums insured – from the PRF"
      - "Request text with the reply date – from the template QUOTATION_SLIP"
    shot: doc-quotation-slip
    frs: [FR-NB-053]
  - id: DO-03
    name: Comparative table
    template: (built-in layout)
    format: PDF and Excel
    produced: PRF record › Comparative Table tab (PDF, Excel); attached to the proposal e-mail
    protected: Yes when e-mailed
    fields:
      - "One row per insurer: Insurer, Response, Premium (lowest marked), Rate %, Deductibles, Conditions, Valid until, Remarks – from the insurer responses"
      - "Recommended insurer – from the TSU recommendation"
    shot: doc-comparative
    frs: [FR-NB-055]
  - id: DO-04
    name: Proposal slip
    template: PROPOSAL_SLIP
    format: PDF, versioned (earlier versions archived on the PRF)
    produced: PRF record › Proposal Slip tab; e-mailed with Send via Email
    protected: Yes when e-mailed
    fields:
      - "PRF, ARN, Client, Product, Period, Total sum insured – from the PRF"
      - "Insurer and proposed terms: Rate %, Deductibles, Conditions, Valid until – from the chosen insurer's response"
      - "Risk items – from the PRF; text from the template PROPOSAL_SLIP"
      - "Signatures: Prepared by, Approved by – the TSU preparer and approver"
    shot: doc-proposal-slip
    frs: [FR-NB-056]
  - id: DO-05
    name: Placement slip
    template: PLACEMENT_SLIP
    format: PDF and Excel, one per insurer branch and version
    produced: Placement Workbench › For Placement (Generate Slips); Placement Slips › PDF / Excel; e-mailed with Send
    protected: Optional (insurers)
    fields:
      - "Slip, Insurer, Branch – from the slip and the insurer master"
      - "Accounts: ARN, Insured, Product, Period, Sum insured, Gross premium; hold cover when requested – from the accounts"
      - "Excel: Slip No., ARN, Client Code, Insured, Product, Line, Cover Type, Period From, Period To, Sum Insured, Net Premium, Gross Premium, Mortgagee Bank, Risk Items"
      - "Placement text – from the template PLACEMENT_SLIP"
    shot: doc-placement-slip
    frs: [FR-NB-080, FR-NB-081]
  - id: DO-06
    name: Hold cover request
    template: HOLD_COVER_REQUEST
    format: PDF
    produced: Account Placement › Request Hold Cover (e-mailed to the insurer)
    protected: No
    fields:
      - "ARN, insured, insurer, start of the hold cover and its expiry (HOLD_COVER_DAYS) – from the account and the request"
      - "Request text – from the template HOLD_COVER_REQUEST"
    shot: doc-hold-cover
    frs: [FR-NB-082]
  - id: DO-07
    name: Insurance Advice
    template: INSURANCE_ADVICE
    format: PDF
    produced: Automatically on policy issue (parameter IA_TRIGGER) or Generate Insurance Advice; Insurance Advice › PDF
    protected: Yes when e-mailed
    fields:
      - "IA number, Account Reference Number, Insured, Insurer, Policy no., Period, Mortgagee, Loan application no. – from the account and the issued policy"
      - "Insured items: No., Item, Sum insured – from the account's risk items"
      - "Advice text – from the template INSURANCE_ADVICE; Authorized signatory"
    shot: doc-insurance-advice
    frs: [FR-NB-103, FR-NB-104]
  - id: DO-08
    name: Service invoice and service invoice credit
    template: SERVICE_INVOICE_NOTE
    format: PDF (Word copy offered)
    produced: At booking and endorsement by the active service invoice types; Service Invoices › Download PDF
    protected: No
    fields:
      - "Service invoice no., Recipient, Code, Issue date, Booked invoice, Account (ARN), Credit of – from the service invoice"
      - "Lines: Brokerage commission, VAT on commission, Less withholding tax, Net amount – from the booking's commission (BOOKING_WTAX_RATE)"
      - "Signatures: Prepared by, Approved by"
    shot: doc-service-invoice
    frs: [FR-NB-117]
  - id: DO-09
    name: CLPC billing file
    template: (file layout)
    format: Excel (.xlsx) or OpenDocument (.ods)
    produced: CLPC Billing › Excel / ODS of a billing batch
    protected: No
    fields:
      - "Columns: PN No., Loan Application No., Booking Date, Borrower, Originating Unit, Premium, Reference (the ARN), BDOI Location, Amortised – from the CBG Fire accounts of the batch"
    shot: doc-clpc-billing
    frs: [FR-NB-090]
  - id: DO-10
    name: Reports (New Business Reports)
    template: (report layouts)
    format: PDF, Excel, ODS, CSV, XML; printed with the report header
    produced: New Business Reports › a report › Print or the download buttons
    protected: No
    fields:
      - "Header: report title, company, parameters, run by and time; columns of each report as in section Reports and documents of the FRS"
    shot: doc-report
    frs: [FR-NB-124, FR-NB-125]
