  - "Workbooks returned by Fri 16-Oct-2026; Q&A on Wed 21-Oct-2026; sign-off on Fri 30-Oct-2026"
  - "Next release sets: BRD-3 Product Maintenance and BRD-11 User Access (Nov 2026), then BRD-10, 12, 6, 9, then BRD-2, 4, 5, then BRD-13, then BRD-7 and BRD-8"
