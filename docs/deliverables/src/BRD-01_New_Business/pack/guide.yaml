# Guide to the BRD-1 New Business business sign-off pack: the content of the Sign-off Pack Guide deck
# (signoff/build_guide_deck.py) and of the Start Here guide (START_HERE_BRD01.md, ```pack blocks "guide-*").
# The same layout is used for every BRD set; only this file changes.
meta:
  deck_title: Sign-off Pack Guide
  module: New Business
  owner: Marketing Business Services and System Support (MBS)
  issued: Mon 28-Sep-2026
  signoff_date: Fri 30-Oct-2026

# The documents of the set in reading order. kind = doc type of the file name (brand.READING_ORDER).
documents:
  - {kind: StartHere, name: New Business, ext: docx, what: "Start Here: the map of the pack, who reads what, the steps and the dates", readers: Everyone, when: "First, on issue"}
  - {kind: GuideDeck, name: New Business, ext: pptx, what: "Sign-off Pack Guide: purpose, approach, the module at a glance, caveats, entry and exit criteria, change control", readers: "Business owner, unit heads; presented at the kick-off", when: "Kick-off session"}
  - {kind: FRS, name: New Business, ext: docx, what: "Functional Requirements Specification v2.0: requirements, navigation, 46 screen specifications with screenshots, walkthroughs, messages, notifications, documents, uploads, cross-BRD contract", readers: "Business users of each area; Finance, Compliance and BDOI IT for their chapters", when: "During the review, with the SIT walkthroughs"}
  - {kind: Signoff, name: New Business, ext: xlsx, what: "Sign-off workbook: one row per screen, field, rule and message with the BU review columns; comments log, meeting minutes, version history, sign-off certificate", readers: "Every reviewer; the business owner signs it", when: "During the review and at sign-off"}
  - {kind: TestPlan, name: New Business, ext: xlsx, what: "Test plan workbook: the test cases traced to the FRs and to the screens, including one screen case and one message case per screen", readers: "Business users who will run UAT; BDOI IT", when: "After the screens; used again in SIT and UAT"}
  - {kind: TestPlan, name: New Business Summary, ext: docx, what: "Test plan summary: scope, approach, coverage and the cases by area", readers: "Business owner, BDOI IT", when: "Before sign-off"}

# Reading order per role (FRS chapter numbers of v2.0).
reading:
  - role: Business owner (Product Owner, Head of MBS)
    order: "00 Start Here; 01 Guide deck; FRS chapters 1-3 (context and personas), 14 (walkthroughs), 20 (sign-off) and 21 (proposed rules for confirmation); workbook Sign-off certificate"
  - role: Business users (Marketing, TSU, Processing)
    order: "FRS chapter 12 (navigation) and the screens of your area in chapter 13; walkthroughs in chapter 14; messages in chapter 15; workbook Screen standards, Screen catalogue, Field register, Business rules and Messages"
  - role: Finance (Comptrollership)
    order: "FRS Booking requirements (chapter 4) and generated documents (chapter 17: service invoice); walkthrough A steps 16-17; cross-BRD contract with Operations, Collections and Accounting (chapter 19); workbook Business rules of the booking screens"
  - role: Compliance
    order: "Client onboarding and KYC screens (SCR-NB-01 to 04); sanction screening lines of the contract (chapter 19); retention rules; messages of the client screens"
  - role: BDOI IT
    order: "Interfaces and integration (chapter 7), non-functional requirements (chapter 8), menu by persona (chapter 12), cross-BRD contract (chapter 19); integrations pending specifications (Guide deck, caveats)"
  - role: iorta TechNXT project team
    order: "All documents; keeps the comments log, the meeting minutes and the version history of the workbook, answers every comment and keeps the traceability to SIT and UAT"

# Approach and step-by-step flow up to closure. raci: R responsible, A accountable, C consulted, I informed.
steps:
  - step: 1
    name: Pack issued
    who: "R: iorta TechNXT Project Manager; A: iorta TechNXT delivery lead; I: all reviewers"
    inputs: "FRS v2.0, workbook, test plan, guide and deck"
    outputs: "Release set v2.0 in the BRD-01 folder; invitations to the sessions"
    duration: "Day 0 (Mon 28-Sep-2026)"
  - step: 2
    name: Kick-off and screen walkthrough on SIT
    who: "R: iorta TechNXT Business Analysis; A: BDOI Product Owner; C: unit heads; I: BDOI IT"
    inputs: "Guide deck; SIT users with seed data; walkthroughs A, B and C"
    outputs: "Screens shown live; first questions logged in the comments log; minutes"
    duration: "4 sessions, 1 to 6-Oct-2026"
  - step: 3
    name: Review with the workbook
    who: "R: business users of each unit; A: unit heads; C: iorta TechNXT (questions)"
    inputs: "FRS chapters of the area; workbook sheets with the BU review columns"
    outputs: "Every row marked Accept, Change requested or Comment; comments log entries"
    duration: "10 working days after the walkthroughs, until Fri 16-Oct-2026"
  - step: 4
    name: Comments consolidated and a Q&A session
    who: "R: iorta TechNXT Project Manager and Business Analysis; A: BDOI Product Owner; C: reviewers"
    inputs: "Returned workbooks"
    outputs: "One consolidated comments log, each item typed (clarification, correction, change request) and answered; Q&A minutes"
    duration: "3 working days, Q&A on Wed 21-Oct-2026"
  - step: 5
    name: One revision cycle (v2.1)
    who: "R: iorta TechNXT Business Analysis; A: iorta TechNXT delivery lead; C: reviewers who raised the items"
    inputs: "Agreed clarifications and corrections"
    outputs: "Release set v2.1 with the changed rows marked; change requests raised for the rest"
    duration: "2 working days, v2.1 on Fri 23-Oct-2026; check by the reviewers until Wed 28-Oct-2026"
  - step: 6
    name: Sign-off meeting and signature
    who: "R: iorta TechNXT Project Manager; A: BDOI Product Owner; C: unit heads, Finance, Compliance, BDOI IT"
    inputs: "v2.1 (or v2.0 when no revision is needed); open items with their decision"
    outputs: "Signed sign-off certificate; minutes; open items accepted as assumptions or change requests"
    duration: "Fri 30-Oct-2026"
  - step: 7
    name: Content freeze
    who: "R: iorta TechNXT delivery lead; A: BDOI Product Owner; I: BDOI IT, other BRD owners"
    inputs: "Signed set; change requests with mandays"
    outputs: "Content frozen as signed; approved deltas scheduled in the Change Management Register"
    duration: "From Mon 2-Nov-2026"
  - step: 8
    name: Traceability into SIT and UAT
    who: "R: iorta TechNXT test lead; A: BDOI Product Owner; C: business users"
    inputs: "Signed FRS rows and test plan"
    outputs: "SIT and UAT runs traced to the signed screens, rules and messages; results against each row"
    duration: "SIT Jan - Jul 2027; UAT Aug - Dec 2027"

# The module at a glance: key screenshots (file names in the screenshot folder of the pack).
