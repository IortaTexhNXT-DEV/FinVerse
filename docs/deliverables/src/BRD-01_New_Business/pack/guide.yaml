# Key business rules and validations (highlights; the full list is in the workbook and FRS chapter 13).
rules:
  - "A prospect needs only its type and name; the KYC documents and minimum fields are needed before the KYC is submitted, and a second user verifies it."
  - "Clients are checked for duplicates on TIN, ID and name with birth date (blocking) and on e-mail, mobile and corporate name (warning)."
  - "A quotation or PRF is approved by someone other than its maker; a quotation is sent only once approved and still valid."
  - "An account needs a confirmed client; Processing validates it only when every mandatory field and document of the product is there."
  - "A risk is insured on one live account only (vehicle identifiers; client, location and item for property)."
  - "Placement needs the payment gate open: CLPC payment matched for CBG Fire, payment or client confirmation for the other lines, or the direct-payment tag."
  - "Booking posts the journal (receivable, payable to the insurer, commission) and the service invoice; cancellations and endorsements follow the same rules."
  - "Bulk uploads validate every row before anything is saved; rejected rows come back in the error file."

# Caveats and possibilities, and how each is handled.
caveats:
  - topic: Additional requirements
    text: "New needs can surface during the review, SIT or UAT."
    handling: "In-scope clarification when the signed text already covers it; otherwise a change request with mandays."
    example: "A reviewer asks for the KYC risk rating on the Clients list: a new column, so a change request; asking which statuses the list shows is a clarification."
  - topic: Other BRDs change New Business
    text: "Product Maintenance, Sanction Screening, User Access, Operations, Collections, Accounting, Renewal, CSF, Submitted Policies, Data Migration and the Core Replacement can change what New Business takes or hands over."
    handling: "The change is raised against the other BRD and assessed against the cross-BRD contract; when it touches this set, a delta sign-off of the affected pages only."
    example: "BRD-3 adds a mandatory field to a product: the account field rules change; the affected screen specification pages are re-issued and signed as a delta."
  - topic: Integrations pending BDOI IT specifications
    text: "HLS, CLPC transport, insurer SFTP or API, directory sign-in and the mail relay depend on specifications from BDOI IT."
    handling: "A manual or file-based step until the specification arrives; the interface is then a change request."
    example: "CLPC billing is a download and an upload today; an automatic transfer is added when the CLPC layout and transport are agreed."
  - topic: Open questions and assumptions
    text: "Open questions of FRS section 10.3 (product matrix, approval chain, document layouts, TSU thresholds and others) follow the assumptions of section 10.1; chapter 21 lists the proposed rules for confirmation."
    handling: "Answered as configuration where possible (lists, parameters, templates); otherwise a change request; the assumption stands until then."
    example: "The approval chain is one approval stage; a two-level chain for large premiums, once BDOI states the limits, is a change request."

# Entry and exit criteria of the sign-off, and the definition of done.
entry:
  - "Every screenshot of the set is taken on the SIT environment with seed data."
  - "Reviewers have their SIT users and the walkthrough sessions are held."
  - "The test plan is traced to the FRS and to the screens."
exit:
  - "Every row of the workbook reviewed by its unit (Accept, Change requested or Comment)."
  - "Every comments log item closed: answered, corrected in v2.1, or raised as a change request."
  - "Open questions closed or accepted as assumptions."
  - "The sign-off certificate signed by the business owner and by Finance, Compliance and BDOI IT for their parts."
done:
  - "Signed certificate filed with the set; version history updated."
  - "Content frozen as signed; deltas listed in the Change Management Register with mandays."
  - "Test plan agreed for SIT and UAT."

# Handover to development / build readiness checklist.
handover:
  - "Signed FRS, sign-off workbook and screens"
  - "Open questions closed or accepted as assumptions"
  - "Configuration inputs from the business: lists of values, parameters, document templates, products, users and roles"
  - "Agreed test plan"
  - "Migration mapping of the New Business objects signed (BRD-13)"
handover_note: "After sign-off the content is frozen as signed and the approved deltas are scheduled."

