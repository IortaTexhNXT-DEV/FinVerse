# UX screen documents of the BRD-1 New Business set for the BDOI UX Design team: 07 UX Screen Deck, 08 UX screen
# register, 09 image package (docs/deliverables/src/signoff/build_ux_deck.py). The screens, fields, actions,
# walkthroughs and images come from the pack; this file holds what only the UX documents need: who each persona is,
# the images taken for the deck only (more states of a screen, the landing page and menu of each persona), the
# changes of the issue and the points for the UX Design team to confirm.

issue:
  version: "2.1"
  date: 8 October 2026
  # Re-issue on the New Business BRD of 13 May 2026 (IT Walkthrough Addendum): the screens whose specification changes.
  changes:
    - ref: CHG-NB-2.1-01
      what: >-
        Send via Email of quotations: one or more quotations to one or more recipients with the supporting documents
        ticked in the dialog or sent on their own; a batch sends the valid quotations and lists the others with their
        reason; each quotation shows the delivery status of its last sending (FR-NB-044, BRNB.042)
      screens: [SCR-NB-05, SCR-NB-07]
    - ref: CHG-NB-2.1-02
      what: >-
        Placement slips carry the EOPT details of each client (taxpayer name, TIN, registered address); the Generate
        Placement Slips dialog shows them or a notice when they are not on record; a slip whose details changed is
        regenerated before sending (FR-NB-087, BRNB.100)
      screens: [SCR-NB-18, SCR-NB-20]
    - ref: CHG-NB-2.1-03
      what: >-
        Insurance Advice register: the sending of each advice shows Manual or Automatic; advices of a mortgagee enrolled in
        the MIS set-up are sent when they are generated (FR-NB-107, BRNB.060)
      screens: [SCR-NB-26]
    - ref: CHG-NB-2.1-04
      what: >-
        Incentive indicator: Pending until the booked invoice is fully paid, then Eligible or Not eligible with the
        criterion code; evaluated again on endorsement and cancellation (FR-NB-118, BRNB.107)
      screens: [SCR-NB-29, SCR-NB-30]
    - ref: CHG-NB-2.1-05
      what: >-
        Service Invoices: the owner is notified of every sending, successful or failed, and the register keeps the status,
        owner and time (FR-NB-117, BRNB.100.1)
      screens: [SCR-NB-32]

# The personas whose landing page and full menu the deck shows.
navigation:
  roles: [MKT_AO, MKT_TL, TSU, PROCESSOR, PROCESSING_TL, NB_APPROVER, EPOLICY_SENDER, ADJUSTMENT, BUSINESS_ADMIN,
          SYSADMIN, AUDITOR]

# Who each persona is (what they do comes from the persona table of the FRS unless given here).
personas:
  MKT_AO: {who: "A Marketing Account Officer of the head office or of a branch who serves the clients and brings in the business"}
  MKT_TL: {who: "A Marketing team leader, team head or unit head, who approves the quotations and proposal requests of the team and verifies the KYC"}
  TSU: {who: "An underwriter of the Technical Support Unit who prepares the quotation and proposal slips of the non-package risks"}
  PROCESSOR: {who: "A Processing officer who validates the accounts, confirms the payments, places the accounts, receives the e-policies and books the accounts"}
  PROCESSING_TL: {who: "The team leader of Processing, who assigns the work of the team"}
  NB_APPROVER: {who: "A New Business approver who authorises the master records and the changes that need a second user"}
  EPOLICY_SENDER: {who: "An officer who sends the e-policies and Insurance Advices to the clients"}
  ADJUSTMENT: {who: "An Adjustment officer who cancels bookings and posts the endorsements of booked accounts"}
  BUSINESS_ADMIN: {who: "The business administrator of New Business, who keeps the lists of values, the targets and the message texts"}
  SYSADMIN: {who: "The system administrator of BIBS (BDOI IT operations), who keeps the users, the parameters and the jobs"}
  AUDITOR: {who: "An internal or external auditor with read access to the clients, quotations, accounts and work queues"}

