# Points for the UX Design team to confirm with BDOI.
confirm:
  clarifications: [CLR-NB-38, CLR-NB-39, CLR-NB-40, CLR-NB-41, CLR-NB-42, CLR-NB-43, CLR-NB-45, CLR-NB-47, CLR-NB-48]
  findings:
    - screens: [SCR-NB-37]
      observation: >-
        Every New Business persona lands on the New Business Dashboard after sign-in; the System Administrator and the
        Auditor land on the home page of the platform.
      proposal: Confirm the landing page of each persona, or land the Processing and TSU personas on their workbench.
    - screens: [SCR-NB-29, SCR-NB-30]
      observation: >-
        The journal preview and the journal of a booked invoice show the ledger account by its number and name and the
        party of a line by its sub-ledger code (client or insurer code), as the journals of the General Ledger do.
      proposal: Confirm the account number and the party code, or show the party's name with the code under it.
    - screens: [SCR-NB-40]
      observation: >-
        The Account Status Report lists the product by its code and wraps the ARN over three lines in its narrow column;
        the printed report has the same layout.
      proposal: Show the product name with the code under it and keep the ARN on one line, or confirm the compact layout.
    - screens: [SCR-NB-43]
      observation: >-
        The record types of the retention rules are shown in words made from their internal names (for example Csf
        Contact Change, Eb Programme).
      proposal: Give each record type a business name (for example Customer servicing contact change, Employee Benefits programme).
    - screens: [SCR-NB-42]
      observation: >-
        Lists of Values shows the code of each list under its name and the code of each value in its own column; these
        codes are what the upload templates and interfaces carry.
      proposal: Keep the codes for the Business Administrator, or show them only in the tooltip.
    - screens: [SCR-NB-45]
      observation: >-
        In the SIT environment no mail server is connected: the Reason column of Outbound Messages and the Dispatch
        Report show the SIT delivery note instead of the mail server's answer.
      proposal: No change; the column shows the mail server's answer in production.
    - screens: [SCR-NB-25]
      observation: >-
        The Extraction Review compares the policy numbers read from the e-policy with the number expected on the account
        ("1 expected"), not with a policy number, which the account does not have yet.
      proposal: Confirm the wording, or write "One policy number expected".
