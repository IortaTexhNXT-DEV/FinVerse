        steps:
          - Receive a payment quoting the ARN of an account awaiting payment; open Account Placement of the ARN.
        expected: The gate is passed with evidence CASHIERING PRE:<id>.
      - c: 2
        type: Negative
        title: Second confirmation of the same payment
        steps:
          - Run the payment confirmation sweep twice.
        expected: The gate is confirmed once; the second run adds nothing.

