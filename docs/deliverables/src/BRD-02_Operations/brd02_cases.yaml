        expected: The record is Returned with the reason, then Record Cancelled; no receipt number is used.
      - c: 1
        type: Workflow
        title: OTC payment of an invoice
        steps:
          - Receive Payment; AR class OTC; invoice of a booked seed account; amount = outstanding; mode cash; preview; post.
        expected: An AR with the next number; the payment is applied; the invoice is PAID.
      - c: 2
        type: Positive
        data: [TD-OP-09]
        title: USD payment at the BOOK rate
        steps:
          - Receive USD 100.00 on the USD invoice; preview.
        expected: The preview shows the BOOK rate of the day with 2 decimals and the peso amount; the journal posts at that rate.
      - c: 2
        type: Upload-download
        screen: RECEIPT
        title: Print the AR
        steps:
          - Open the AR; download the PDF.
        expected: The PDF shows the AR number, payor, amount, date and invoice.
      - c: 3
        type: Negative
        title: Amount zero
        steps:
          - Receive a payment of 0.00.
        expected: Refused.
        msg: [A receipt needs an amount above zero, RECEIPT_AMOUNT]
      - c: 3
        type: Negative
        title: Check without number
        steps:
          - Mode of payment Check without check number; post.
        expected: The form marks Check No. as required; nothing is posted.

