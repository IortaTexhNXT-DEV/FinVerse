  FR-OP-023:
    scenario: SC-OP-03
    persona: CASHIER
    screen: RECEIVE
    conditions:
      - A payment that leaves a premium balance within the threshold clears it in the same posting; no unapplied item or disposition is created; a balance equal to the DST charged is kept.
      - A minimal excess within the threshold goes to AP overages at processing and never appears in Unapplied Payments; an excess above the threshold becomes an unapplied item.
      - The safety-net sweep clears only balances left within the threshold by later events and never clears a balance twice.
    cases:
      - c: 1
        type: Positive
        title: Minimal premium balance cleared at payment
        pre: An unpaid invoice of 10,000.00; threshold 10.00.
        steps:
          - Receive 9,995.00 on the invoice; Issue AR and Apply; open the receipt (Applications, Journal) and Unapplied Payments.
        expected: The remaining 5.00 is reversed in the same posting; the invoice is paid; Unapplied Payments shows nothing for it.
      - c: 1
        type: Negative
        title: Balance equal to the DST is kept
        pre: An invoice whose DST charged is 5.00.
        steps:
          - Receive the premium less 5.00 so that only the DST of 5.00 remains.
        expected: The 5.00 is not reversed and stays outstanding.
      - c: 2
        type: Boundary
        title: Minimal excess at payment
        pre: An unpaid invoice of 10,000.00.
        steps:
          - Receive 10,008.00 on the invoice; open the receipt and Unapplied Payments.
        expected: The excess of 8.00 is moved to AP overages at once; the Unapplied, Monitoring and For Approval tabs show nothing for it.
      - c: 2
        type: Boundary
        neg: true
        title: Excess above the threshold
        steps:
          - Receive 10,050.00 on an unpaid invoice of 10,000.00.
        expected: An unapplied item of 50.00 of origin Excess is created and follows the disposition flow.
      - c: 3
        type: Workflow
        persona: CASHIER_TL
        screen: CASHSETUP
        title: Safety-net sweep finds nothing after the payments
        steps:
          - After the cases above, click Run Sweep Now twice.
        expected: Nothing is cleared; each balance was cleared once, at payment.

