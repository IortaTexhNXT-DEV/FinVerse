  FR-OP-011:
    scenario: SC-OP-02
    persona: CASHIER
    screen: RECEIVE
    data: [TD-OP-02, TD-OP-09]
    conditions:
      - An OTC payment on a booked invoice issues an AR with the next number and applies it; the invoice becomes PAID when covered.
      - A foreign-currency payment shows and posts at the BOOK rate; the AR prints with its details.
      - A zero amount or a missing mandatory field is refused.
      - With the posting step (as delivered) the AR is a creation record submitted for posting; a second user posts it and the AR number is issued then; the creator cannot post it.
    cases:
      - c: 4
        type: Workflow
        screen: RECFORM
        title: AR creation record posted by a second user
        steps:
          - As cashier open Create AR, enter a premium payment of a client with one account and its paid amount, Save, then Submit for Posting.
          - As cashtl open Posting, open the record and Post.
        expected: The record CR-AR-nnnnnn is For Posting, then AR/OR Issued with the AR number of the branch series; the payment is applied and any excess is listed as unapplied.
      - c: 4
        type: Security-access
        screen: RECORD
        title: The creator cannot post the own record
        steps:
          - As cashier open the record submitted for posting.
        expected: Post and Return are not offered to the creator; a direct posting request is refused.
      - c: 4
        type: Negative
        screen: RECFORM
        title: Accounts that do not add up to the paid amount
        steps:
          - Enter a Paid Amount of 1,000.00 and one account with 900.00; Save.
        expected: "The message \"The amounts of the accounts must add up to the Paid Amount\" is shown and nothing is saved."
      - c: 4
        type: Positive
        persona: CASHIER_TL
        screen: POSTING
        title: Return to the creator and cancellation of a record
        steps:
