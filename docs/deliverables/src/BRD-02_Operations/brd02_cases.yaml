  FR-OP-030:
    scenario: SC-OP-04
    persona: REMIT_PROCESSOR
    screen: EXTRACTION
    data: [TD-OP-02, TD-OP-04]
    conditions:
      - The scheduled run puts a paid and cleared invoice into a batch RMB-<insurer>-yyyy-n tagged EXTRACTED and locks it; an invoice on hold is tagged UNEXTRACTED_DUE with ON_HOLD.
      - A manual extraction of an invoice of another insurer, or of an invoice that cannot be extracted, is refused.
      - An invoice queued for the end of day is extracted by the evening run once.
      - An invoice taken by a manual (ad hoc) extraction keeps the source Manual and is not extracted again by a later run.
    cases:
      - c: 1
        type: Workflow
        persona: SYSTEM
        screen: JOBS
        title: Scheduled extraction
        pre: An invoice of INS-MGIC paid in cash four banking days ago.
        steps:
          - Start the scheduled remittance extraction; open Extraction, the run's tags; open Remittance Batches.
        expected: The invoice is EXTRACTED into batch RMB-INS-MGIC-2026-n and its lock shows REMITTANCE.
      - c: 1
        type: Negative
        title: Invoice on hold not extracted
        pre: The hold of ARN-2026-940008 approved.
        steps:
          - Run the extraction; open the tag of ARN-2026-940008.
        expected: UNEXTRACTED_DUE with reason ON_HOLD.
      - c: 2
        type: Negative
        title: Manual extraction for the wrong insurer
        steps:
          - Manual run; insurer INS-LAC; invoice of INS-MGIC.
        expected: Refused.
        msg: ["Invoice <no> is not an invoice of {INS-LAC}", REMIT_INVOICE_INSURER]
      - c: 2
        type: Negative
        title: Manual extraction of an unpaid invoice
        steps:
          - Manual run on an unpaid invoice.
        expected: Refused with the reason.
        msg: ["Invoice <no> cannot be remitted now: <reasons>", SPECIAL_REMIT_NOT_ELIGIBLE]
      - c: 3
        type: Workflow
        title: End-of-day request extracted once
        steps:
          - Queue an eligible invoice for the end of day; run the evening extraction twice.
        expected: The invoice is extracted by the first run only.
      - c: 4
        type: Workflow
        title: Ad hoc extraction not taken again
        steps:
          - Manual run for one eligible invoice of INS-MGIC; open Invoice 360; run the scheduled extraction.
        expected: Invoice 360 shows the source Manual with the EXTRACTED tag; the scheduled run does not extract it again.

  FR-OP-031:
    scenario: SC-OP-04
    persona: REMIT_PROCESSOR
    screen: DTIP
    data: [TD-OP-02]
    conditions:
      - A check payment is held 3 banking days and extracted on the third banking day.
      - Paid AR above DTIP is excluded (or capped with CAP) and listed on REM-PAIDAR-OVER-DTIP.
      - Written-off invoices and negative DTIP are never extracted; a negative adjustment on a batched invoice notifies the Remittance team.
      - Any pending financial endorsement blocks the extraction; a posted adjustment does not.
    cases:
      - c: 1
        type: Boundary
        neg: true
        title: Check paid two banking days ago
        steps:
          - Pay an invoice by check with value date two banking days ago; run the extraction.
        expected: UNEXTRACTED_DUE with CHECK_HOLDING; on the third banking day it is extracted.
      - c: 2
        type: Report-output
        screen: REPORTS
        title: Paid AR above DTIP
        pre: An invoice with paid AR 10,500.00 and DTIP 10,000.00; REMIT_PAIDAR_OVER_DTIP_MODE = EXCLUDE.
        steps:
          - Run the extraction; run REM-PAIDAR-OVER-DTIP.
        expected: The invoice is excluded and listed with invoice, insurer, paid AR and DTIP.
      - c: 2
        type: Positive
        persona: SYSADMIN
        screen: PARAMS
        title: CAP mode remits the DTIP balance
        steps:
          - Set REMIT_PAIDAR_OVER_DTIP_MODE to CAP; run the extraction.
        expected: The invoice is extracted for 10,000.00; the difference is recorded.
      - c: 3
        type: Negative
        screen: INV360
        title: Written-off invoice never batched
        pre: An invoice written off by the minimal balance file (TC-OP-059.1-01).
        steps:
          - Run the extraction; open Invoice 360.
        expected: The invoice is in no batch and shows WRITTEN_OFF.
      - c: 3
        type: Positive
        screen: NOTIF
        title: Negative adjustment notifies Remittance
        steps:
          - Submit a negative adjustment on an invoice in a batch; as remit open the bell.
        expected: A notification names the invoice and the batch.
      - c: 4
        type: Negative
        title: Pending increase in TSI blocks the extraction
        pre: A paid invoice with a TSI increase request submitted and not yet posted.
        steps:
          - Run the extraction; open the tag of the invoice.
        expected: Not extracted; the tag reads Pending financial endorsement.
      - c: 4
        type: Positive
        title: Posted adjustment no longer blocks
        steps:
          - Post the TSI increase; run the extraction again.
        expected: The invoice is extracted on its new balances.

  FR-OP-032:
    scenario: SC-OP-04
    persona: REMIT_PROCESSOR
    screen: BATCH
    data: [TD-OP-04]
    conditions:
      - The processor cannot change the paid AR or commission of a line.
      - Excluding a line removes it from the totals and unlocks the invoice; a restored line is back.
      - Only remaining lines post on approval; exclusion and restore need a batch that can change.
      - The extracted accounts show the details of the remittance schedule.
    cases:
      - c: 1
        type: Negative
        screen: SYS
        title: Amounts of a line cannot be edited
        steps:
          - Look for edit on a line; send a direct request to change the line amount.
        expected: No edit on screen; a direct request cannot change the amount.
      - c: 2
        type: Workflow
        title: Exclude and restore a line
        steps:
          - Open the batch in review; exclude a line with reason and comment; check totals and Invoice 360; restore it.
        expected: After exclusion the totals drop and the invoice is unlocked; after restore the line is back in the totals and locked.
      - c: 2
        type: Negative
        title: Exclude a line twice
        steps:
          - Exclude the already excluded line again (direct request).
        expected: Refused.
        msg: ["Invoice <no> is already excluded", REMIT_LINE_ALREADY_EXCLUDED]
      - c: 3
        type: Negative
        title: Exclude after submission
        steps:
          - Submit the batch; try to exclude a line.
        expected: Refused.
        msg: ["Batch <no> is <stage>: lines can no longer change", REMIT_BATCH_STAGE]
      - c: 4
        type: Positive
        title: Extracted accounts with the schedule details
        steps:
          - Open the batch in review; Lines.
        expected: Each account shows insurer, policy number, invoice, assured, remittance type, batch number and the amounts of the schedule.

  FR-OP-033:
    scenario: SC-OP-04
    persona: REMIT_PROCESSOR
    screen: BATCH
    data: [TD-OP-04]
    conditions:
      - A batch with a line put on hold after extraction cannot be submitted and the invoice is named.
      - A returned batch releases its invoices and the next run extracts them again; a return needs a reason.
      - The TL re-assigns a batch to another processor.
