      - Only the approved exclusion rules exclude an entry (negative amount, fully cancelled); the excluded entry stays visible with its rule and is left out of billing, reports and incentives.
      - An account is eligible for billing only when the payment status upstream is Paid; it then becomes Valid without a user action.
    cases:
