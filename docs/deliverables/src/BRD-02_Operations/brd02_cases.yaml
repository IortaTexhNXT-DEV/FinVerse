  FR-OP-058:
    scenario: SC-OP-06
    persona: MKT_COLLECTION
    screen: NEWREQ
    conditions:
      - An increase that takes the adjustments above 100 % of the original premium needs a justification.
      - A decrease that would make the premium negative is refused without justification.
      - Cumulative adjustments reaching the warning level show a warning; a decrease beyond the original DTIP needs a justification.
    cases:
      - c: 1
        type: Boundary
        neg: true
        title: Above the 100 % baseline
        steps:
          - Raise a second premium increase that takes the total adjustments to 101 % of the original premium; submit.
        expected: Refused without justification; accepted with it.
        msg: ["Cumulative adjustments of <amount> exceed the baseline of {100}% of the original premium <amount>", ADJ_OVER_BASELINE]
      - c: 1
        type: Positive
        title: Within the baseline
        steps:
          - Raise increases totalling 100 % exactly.
        expected: Accepted without justification.
      - c: 2
        type: Negative
        title: Decrease making the premium negative
        steps:
          - Raise a decrease larger than the premium; submit.
        expected: Refused without justification.
        msg: ["Cumulative adjustments of <amount> exceed the baseline of {100}% of the original premium <amount>", ADJ_OVER_BASELINE]
      - c: 3
        type: Boundary
        title: Warning at 92 % of the original premium
        steps:
          - Raise increases that take the cumulative adjustments to 92 % of the original premium; submit.
        expected: A warning is shown; the request is submitted without justification.
      - c: 3
        type: Negative
        title: Decrease beyond the original DTIP
        steps:
          - Raise a decrease whose cumulative effect exceeds the original DTIP; submit without justification.
        expected: Refused until a justification is given.

