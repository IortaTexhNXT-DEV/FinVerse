  FR-OP-113:
    scenario: SC-OP-05
    persona: MKT_COLLECTION
    screen: CWT
    data: [TD-OP-02, TD-OP-03]
    conditions:
      - A certificate tag gets a reference CWT-2026-n and shows the computed PR 2307 amount, the outstanding PR and the CRU status.
      - A certificate amount above the computed PR 2307 amount or above the outstanding PR, a second tag in process, an unknown invoice or a tag without certificate number is refused.
      - Validating and posting tags of one insurer generates one BIR 2307 transaction report, zeroes the PR and routes it directly to Disbursement; a batch of two insurers is refused.
      - A tag with an outstanding commission receivable is posted and flagged For Commission Receivable; a tag on a remitted payment needs the insurer's written confirmation and sends the amount to Unapplied Payments.
    cases:
      - c: 1
        type: Workflow
        title: Tag a certificate
        steps:
          - Tag 2307; invoice with 2 % CWT outstanding; certificate number, period and amount; save.
        expected: Reference CWT-2026-n; the tag shows the computed PR 2307 amount, the outstanding PR and the CRU status None.
      - c: 2
        type: Negative
        title: Certificate amount above the PR 2307 amount
        steps:
          - Tag an invoice whose computed PR 2307 amount is 200.00 with a certificate of 250.00.
        expected: Refused; both amounts are shown and nothing is saved.
      - c: 2
        type: Negative
        title: Second tag in process
        steps:
          - Tag the same invoice again.
        expected: Refused.
        msg: ["Invoice <no> already has a 2307 tag in process", CWT_ALREADY_TAGGED]
      - c: 2
        type: Negative
        title: Certificate tag without number
        steps:
          - Save a tag without certificate number.
        expected: Refused.
        msg: [A certificate tag needs the BIR 2307 certificate number, CWT_CERTIFICATE_REQUIRED]
      - c: 3
        type: Workflow
        title: Validate, post and route two tags of one insurer
        steps:
          - Select two checked tags of INS-MGIC; attach the BIR 2307 copies; Validate and Post Report; Route to Disbursement.
        expected: One BIR 2307 transaction report for INS-MGIC; the PR of both invoices is zero (proposed entry Dr DTIP / Cr PR); the report is With Disbursement, not through Remittance.
      - c: 3
        type: Negative
        title: Tags of two insurers in one batch
        steps:
          - Select tags of INS-MGIC and INS-LAC; Validate and Post Report.
        expected: Refused.
        msg: [A 2307 batch holds the certificates of one insurer (CSHID.027), CWT_BATCH_ONE_INSURER]
      - c: 4
        type: Workflow
        title: Outstanding commission receivable flagged
        pre: An invoice of the direct payment storyline with commission billed and not collected.
        steps:
          - Tag, validate and post its 2307; open DP Accounts as commrec.
        expected: The reversal is posted and released; the tag is flagged For Commission Receivable and listed for the Commission Receivables team.
      - c: 4
        type: Negative
        title: Remitted payment without the insurer's confirmation
        pre: An invoice whose payment was already remitted.
        steps:
          - Validate and post its tag without attaching the insurer's written confirmation; then attach it and post.
        expected: The first posting is refused; after the attachment the reversed amount is in Unapplied Payments.

