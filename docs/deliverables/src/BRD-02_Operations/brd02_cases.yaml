        expected: Refused.
        msg: ["A non-financial endorsement carries no request type, sum insured or amount change", ADJ_NON_FINANCIAL_WITH_AMOUNTS]
      - c: 4
        type: Negative
        title: Effective date outside the cover
        steps:
          - Effective date after the expiry.
        expected: Refused.
        msg: ["The effective date must be within the cover <inception> to <expiry>", ADJ_EFFECTIVE_DATE_OUTSIDE_TERM]
      - c: 4
        type: Negative
        title: Cancellation without reason
        steps:
          - Flat cancellation without a reason.
        expected: Refused.
        msg: [Select the reason for cancellation, ADJ_CANCELLATION_REASON_REQUIRED]

