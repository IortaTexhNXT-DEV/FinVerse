        expected: The cancellation is refused.
        msg: ["Request <no> (<type>) is still open on <invoice>: a cancellation cannot be combined with another financial change", ADJ_INCOMPATIBLE_REQUEST]
      - c: 3
        type: Positive
        title: Non-financial change of the assured
        steps:
          - New Request; type non-financial (assured information); description; no amounts; submit.
        expected: The request is saved without amounts.
      - c: 3
        type: Positive
        title: Three invoices, three requests
        steps:
          - Choose three invoices in the wizard; complete; save.
        expected: Three requests, one per invoice.
      - c: 4
        type: Negative
        title: Non-financial with amounts
        steps:
