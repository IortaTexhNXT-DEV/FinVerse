  FR-OP-050:
    scenario: SC-OP-06
    persona: MKT_COLLECTION
    screen: NEWREQ
    data: [TD-OP-02]
    conditions:
      - A flat cancellation is raised with a reason and submitted; the invoice shows PENDING_NEG_ADJ and the lock.
      - A request on an invoice in a remittance batch, or a cancellation combined with another open financial request, is refused.
      - A non-financial change is raised without amounts; three invoices raise three requests.
      - The request fields are validated.
    cases:
      - c: 1
        type: Workflow
        title: Flat cancellation raised and submitted
        steps:
