# Documents generated by BRD-2 Operations. Each is produced by BIBS from the record on screen with the BDO Insure
# letterhead; the PDF documents carry page x of y. Templates are maintained on the Document Templates screen.
# Columns: id | document | template | format | produced by | protected | fields and their source | image (slug)
documents:
  - id: DO-01
    name: Acknowledgement receipt (AR)
    template: (built-in receipt layout)
    format: PDF, one per receipt
    produced: Receipt record › PDF; Batch Print for the receipts of a day
    protected: "No"
    fields:
      - "Title and reference: Acknowledgement Receipt, AR number from the branch series and date – from the receipt"
      - "Received from: Payor, Payor code, Assured, Date, Class, Amount, Mode of payment, Check (bank and number), Status – from the receipt and its payment"
      - "Application: one row per invoice with the amount applied, and the amount left unapplied – from the application"
      - "Signature line: Cashier"
    shot: doc-ar
    frs: [FR-OP-011, FR-OP-025]
  - id: DO-02
    name: Official receipt (OR) for service fees and commission
    template: (built-in receipt layout)
    format: PDF, one per receipt
    produced: Issue Official Receipt; the commission OR of an approved remittance batch or DP collection
    protected: "No"
    fields:
      - "Title and reference: Official Receipt, OR number from the Head Office series and date – from the receipt"
      - "Received from: Payor (insurer or client), Payor code, Assured, Date, Class (service fee, commission, incentive), Amount, Mode of payment, Check, Status – from the receipt"
      - "Lines: one row per item (invoice and its commission) with Net, VAT and withholding tax – from the receipt lines"
      - "Signature line: Cashier"
    shot: doc-or
    frs: [FR-OP-012, FR-OP-021]
  - id: DO-03
    name: Remittance schedule
    template: REMITTANCE_SCHEDULE
    format: PDF and Excel, one per batch; the Excel copy is e-mailed to the insurer password protected
    produced: Remittance Batch › Documents and Receipts; Send Schedule to Insurer
    protected: Yes when e-mailed (password in a separate e-mail)
    fields:
      - "Batch: Batch number, Insurer, Remittance type, Currency, Accounts, Processor, Stage – from the batch"
      - "Accounts remitted: Invoice Number, Policy Number, Endorsement Number, Name of Assured, Risk Code, Date Last Paid, Date Inception, Date Booked, Date Expiry, Paid AR, Realized Commission, Realized VAT, WTAX, DTIP, Net Due – from the batch lines"
      - "Totals: Paid AR, less realized commission, less VAT on commission, add withholding tax on commission, Net due, less incentive with VAT, Amount payable – from the batch"
      - "Request to the insurer to return the schedule with its official receipt number and date per account; signature lines Prepared by, Checked by, Approved by"
    shot: doc-remittance-schedule
    frs: [FR-OP-034, FR-OP-110]
  - id: DO-04
    name: Payment request of a remittance batch
    template: REMITTANCE_PAYMENT_REQUEST
    format: PDF, one per batch
    produced: Remittance Batch › Documents and Receipts, at Approve and Push
    protected: "No"
    fields:
      - "Batch: Batch number, Insurer, Remittance type, Currency, Accounts, Processor, Stage – from the batch"
      - "Totals: Paid AR, realized commission, VAT, withholding tax, Net due, incentive, Amount payable – from the batch"
      - "Request text: amount payable, insurer, batch and approver – from the batch and its approval"
      - "Signature lines: Requested by, Approved by, Received by Disbursement"
    shot: doc-payment-request
    frs: [FR-OP-034, FR-OP-035]
  - id: DO-05
    name: Endorsement slip
    template: ENDORSEMENT_SLIP
    format: PDF, one per posted request
    produced: Endorsement Request › Documents, once the request is posted
    protected: "No"
    fields:
      - "Letter to the insurer: policy, assured, request number, effective date, invoice and ARN to quote – from the request"
      - "Request: Date, Endorsement Request No., Invoice No., Account Reference No., Endorsement Type, Request Type, Reason for Cancellation, Effective Date, Insurer Endorsement Ref., Description, Additional / Other Instructions – from the request"
      - "Policy: Assured, Insurer, Co-insurer/s, Policy No., Risk Code, Risk Description, Period of Cover, Marketing AO, Market Segment, Total Sum Insured, Sum Insured Change, Premium Rate (%), Approved by – from the invoice and the request"
      - "Collection and remittance: Payment Status, Amount Paid, Remaining AR, Remittance Status – from the Operations ledger"
    shot: doc-endorsement-slip
    frs: [FR-OP-060, FR-OP-114]
  - id: DO-06
    name: Validation slip
    template: VALIDATION_SLIP
    format: PDF, one per request
    produced: Endorsement Request › Documents, once the request is validated
    protected: "No"
    fields:
      - "Statement of the validation: request, invoice, validation date and stage – from the request"
      - "Request: the same fields as the endorsement slip – from the request"
      - "Validation: Status, Validated by, Validation Date, Approved by, Validation Batch No., Endorsement No., Invoice Booked, Service Invoices, AR Insurer – from the request and its posting"
      - "Before and after per premium component and commission (Before, Change, After) – from the recompute"
    shot: doc-validation-slip
    frs: [FR-OP-060]
  - id: DO-07
    name: Production register
    template: (built-in register layout); cover letter from the production register template
    format: Excel workbook, one per extract
    produced: Production Extracts › Download, Send to Insurer
    protected: Yes when e-mailed (password in a separate e-mail)
    fields:
      - "One row per invoice of the booking period: Month of Production, Insurer, Invoice Number, Booking Date, Inception Date, Expiry Date, Policy No., Endorsement No., PN No., Assured Name, Risk Type, Basic Premium, Gross Commission, A/R Client, Gross Premium, Booked VAT, Amount Paid, Date Paid, AR / OR Number, Adjustment Type, Remittance Status, Incentive, Remarks – from the Operations ledger"
      - "The image shows a selection of the columns"
    shot: doc-production-register
    frs: [FR-OP-072, FR-OP-073]
  - id: DO-08
    name: Direct payment commission billing
    template: (built-in billing layout)
    format: Excel workbook, one per billing, with a Decision column for the insurer's answer
    produced: DP Billing › Download, Send to Insurer
    protected: Yes when e-mailed (password in a separate e-mail)
    fields:
      - "One row per direct payment account: Billing No., Invoice No., Policy No., Assured Name, Premium, Commission, VAT, Withholding Tax, Net Commission – from the billing"
      - "Decision, Reason and Comment columns completed by the insurer (Approved or Rejected) and read back on Insurer Responses"
    shot: doc-dp-billing
    frs: [FR-OP-092]
