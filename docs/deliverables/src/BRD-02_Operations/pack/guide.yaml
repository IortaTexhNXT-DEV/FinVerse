# Guide to the BRD-2 Operations business sign-off pack: the content of the Sign-off Pack Guide deck
# (signoff/build_guide_deck.py) and of the Start Here guide (START_HERE_BRD02.md, ```pack blocks "guide-*").
# The same layout is used for every BRD set; only this file changes.
meta:
  deck_title: Sign-off Pack Guide
  module: Operations
  owner: "Operations: Financial Transactions and Processing (FT&P)"
  issued: Mon 28-Sep-2026
  signoff_date: Fri 18-Dec-2026

# The documents of the set in reading order. kind = doc type of the file name (brand.READING_ORDER).
documents:
  - {kind: StartHere, name: Operations, ext: docx, what: "Start Here: the map of the pack, who reads what, the steps and the dates", readers: Everyone, when: "First, on issue"}
  - {kind: GuideDeck, name: Operations, ext: pptx, what: "Sign-off Pack Guide: purpose, approach, the module at a glance, caveats and impacts on other modules, entry and exit criteria, change control", readers: "Business owner, unit heads; presented at the kick-off", when: "Kick-off session"}
  - {kind: FRS, name: Operations, ext: docx, what: "Functional Requirements Specification v2.0: requirements, navigation, 64 screen specifications with screenshots, walkthroughs, messages, notifications, documents, uploads, cross-BRD contract", readers: "Business users of each Operations team; Comptrollership, Disbursement and BDOI IT for their chapters", when: "During the review, with the SIT walkthroughs"}
  - {kind: Signoff, name: Operations, ext: xlsx, what: "Sign-off workbook: one row per screen, field, rule and message with the BU review columns; comments log, meeting minutes, version history, sign-off certificate", readers: "Every reviewer; the business owner signs it", when: "During the review and at sign-off"}
  - {kind: TestPlan, name: Operations, ext: xlsx, what: "Test plan workbook: the test cases traced to the FRs and to the screens, including one screen case and one message case per screen", readers: "Business users who will run UAT; BDOI IT", when: "After the screens; used again in SIT and UAT"}
  - {kind: TestPlan, name: Operations Summary, ext: docx, what: "Test plan summary: scope, approach, coverage and the cases by area", readers: "Business owner, BDOI IT", when: "Before sign-off"}
  - {kind: UXDeck, name: Operations, ext: pptx, what: "UX Screen Deck for the BDOI UX Design team: design foundation, navigation and personas, every walkthrough step by step and every screen with all its states", readers: "BDOI UX Design team", when: "From the issue, in parallel with the review; re-issued with each version of the set"}
  - {kind: UXScreens, name: Operations, ext: xlsx, what: "UX screen register: one row per screen image with the screen, personas, walkthrough and step, state, FRS section and requirements, UXD status and comments, and the Changed in this issue flag", readers: "BDOI UX Design team", when: "Kept by the UX Design team; the changed rows are flagged at each issue"}
  - {kind: UXScreens, name: Operations, ext: zip, what: "Image package: every screen image at twice the screen resolution (PNG), the component crops and the register as CSV", readers: "BDOI UX Design team", when: "Imported into the design tool at each issue"}

# Reading order per role (FRS chapter numbers of v2.0).
reading:
  - role: Business owner (Product Owner; Operations FT&P)
    order: "00 Start Here; 01 Guide deck; FRS chapters 1-3 (context and personas), 14 (walkthroughs), 20 (sign-off) and 21 (proposed rules for confirmation); workbook Sign-off certificate"
  - role: Cashiering (cashiers and Team Leader)
    order: "FRS chapter 4 Cashiering; the Cashiering screens of chapter 13 (SCR-OP-07 to 22); walkthroughs A (steps 3-4), B (steps 8-9) and D (steps 3-4); messages in chapter 15; documents DO-01 and DO-02 in chapter 17; upload templates in chapter 18"
  - role: Remittance (processors and Team Leader)
    order: "FRS chapter 4 Remittance; screens SCR-OP-23 to 36; walkthroughs A (steps 5-10) and D (step 5); notifications in chapter 16; documents DO-03 and DO-04"
  - role: Adjustment (processors and Team Leader)
    order: "FRS chapter 4 Adjustment / Cancellation; screens SCR-OP-37 to 42; walkthrough B; documents DO-05 and DO-06; Policy Transactions in chapter 12"
  - role: Production Reconciliation and Commission Receivables
    order: "FRS chapter 4 Production Reconciliation and Commission Receivables; screens SCR-OP-43 to 60; walkthrough C; documents DO-07 and DO-08"
  - role: Marketing Collection and Marketing Team Leader
    order: "Holds, special remittance, BIR 2307 tags and endorsement requests (SCR-OP-19, 28 to 31, 38); walkthrough B steps 1-3 and D steps 1-2"
  - role: Comptrollership, Disbursement and ACSL (BRD-5)
    order: "Accounting events (chapter 5); Disbursement Queue and Remittance Deductions (SCR-OP-33, 34, 36); BIR certificates (SCR-OP-58, 59); cross-BRD contract (chapter 19)"
  - role: BDOI IT
    order: "Interfaces and integration (chapter 7), non-functional requirements (chapter 8), configuration and jobs (chapter 9), Interfaces screen (SCR-OP-61), cross-BRD contract (chapter 19); the Technical Specification, reviewed by BDOI IT"
  - role: BDOI UX Design team
    order: "07 UX Screen Deck: design foundation and navigation first, then the personas, walkthroughs and screens of the design work; 08 UX screen register (filter Changed in this issue at each new issue); 09 image package in the design tool"
  - role: iorta TechNXT project team
    order: "All documents; keeps the comments log, the meeting minutes and the version history of the workbook, answers every comment and keeps the traceability to SIT and UAT"

# Approach and step-by-step flow up to closure. raci: R responsible, A accountable, C consulted, I informed.
steps:
  - step: 1
    name: Pack issued
    who: "R: iorta TechNXT Project Manager; A: iorta TechNXT delivery lead; I: all reviewers"
    inputs: "FRS v2.0, workbook, test plan, guide and deck"
    outputs: "Release set v2.0 in the BRD-02 folder; invitations to the sessions"
    duration: "Day 0 (Mon 28-Sep-2026); sessions scheduled after the BRD-10, 12, 6 and 9 sign-offs"
  - step: 2
    name: Kick-off and screen walkthrough on SIT
    who: "R: iorta TechNXT Business Analysis; A: BDOI Product Owner; C: Operations FT&P unit heads; I: BDOI IT"
    inputs: "Guide deck; SIT users with seed data; walkthroughs A, B, C and D"
    outputs: "Screens shown live per team (Cashiering, Remittance, Adjustment, Production Reconciliation and Commission Receivables); first questions logged in the comments log; minutes"
    duration: "5 sessions, 16 to 20-Nov-2026"
  - step: 3
    name: Review with the workbook
    who: "R: business users of each Operations team; A: Operations FT&P unit heads; C: iorta TechNXT (questions)"
    inputs: "FRS chapters of the area; workbook sheets with the BU review columns"
    outputs: "Every row marked Accept, Change requested or Comment; comments log entries"
    duration: "10 working days after the walkthroughs, until Fri 4-Dec-2026"
  - step: 4
    name: Comments consolidated and a Q&A session
    who: "R: iorta TechNXT Project Manager and Business Analysis; A: BDOI Product Owner; C: reviewers"
    inputs: "Returned workbooks"
    outputs: "One consolidated comments log, each item typed (clarification, correction, change request) and answered; Q&A minutes"
    duration: "3 working days, Q&A on Wed 9-Dec-2026"
  - step: 5
    name: One revision cycle (v2.1)
    who: "R: iorta TechNXT Business Analysis; A: iorta TechNXT delivery lead; C: reviewers who raised the items"
    inputs: "Agreed clarifications and corrections"
    outputs: "Release set v2.1 with the changed rows marked; change requests raised for the rest"
    duration: "2 working days, v2.1 on Fri 11-Dec-2026; check by the reviewers until Wed 16-Dec-2026"
  - step: 6
    name: Sign-off meeting and signature
    who: "R: iorta TechNXT Project Manager; A: BDOI Product Owner; C: Operations FT&P, Comptrollership, BDOI IT"
    inputs: "v2.1 (or v2.0 when no revision is needed); open items with their decision"
    outputs: "Signed sign-off certificate; minutes; open items accepted as assumptions or change requests"
    duration: "Fri 18-Dec-2026"
  - step: 7
    name: Content freeze
    who: "R: iorta TechNXT delivery lead; A: BDOI Product Owner; I: BDOI IT, other BRD owners"
    inputs: "Signed set; change requests with mandays"
    outputs: "Content frozen as signed; approved deltas scheduled in the Change Management Register"
    duration: "From Mon 21-Dec-2026"
  - step: 8
    name: Traceability into SIT and UAT
    who: "R: iorta TechNXT test lead; A: BDOI Product Owner; C: business users"
    inputs: "Signed FRS rows and test plan"
    outputs: "SIT and UAT runs traced to the signed screens, rules and messages; results against each row"
    duration: "SIT Jan - Jul 2027; UAT Aug - Dec 2027"

