# Key business rules and validations (highlights; the full list is in the workbook and FRS chapter 13).
rules:
  - "Every booked invoice is in the Operations ledger with its payment status, remittance status and flags; Invoice 360 shows its receipts, remittances, adjustments and movements."
  - "A payment is applied by premium component in the agreed hierarchy; what is left over becomes an unapplied payment whose disposition (apply, reclass, transfer, refund) needs the Team Leader's approval."
  - "A receipt is cancelled or reinstated only with a reason and a second user's approval; the AR and OR series are controlled per branch."
  - "Only paid, unlocked invoices without a hold, a pending negative adjustment or a check in holding are extracted for remittance; a batch is approved by someone other than its processor."
  - "An invoice worked by one team is locked to the others (Remittance, Adjustment, Cashiering) until that team is done."
  - "An endorsement or cancellation is recomputed per insurer, validated by Adjustment and approved by its Team Leader before posting; posting books the invoice, re-applies payments and sets up the AR Insurer."
  - "The insurer's production is matched to the booked invoices within tolerance; differences get feedback and a disposition before the cycle is closed."
  - "Direct payment commission is billed to the insurer, confirmed by its answer and collected; late answers are flagged after ten working days."

# Caveats and possibilities, and how each is handled.
caveats:
  - topic: Additional requirements
    text: "New needs can surface during the review, SIT or UAT."
    handling: "In-scope clarification when the signed text already covers it; otherwise a change request with mandays."
    example: "A reviewer asks for the AO on the Remittance Batches list: a new column, so a change request; asking which stages the For Approval tab shows is a clarification."
  - topic: Impacts on other modules
    text: "Operations takes every booked invoice from New Business (BRD-1) and Renewal (BRD-6), receives the requests of Collections (BRD-4) and Claims (BRD-7), and hands journals, payment requests and deductions to Accounting, Disbursement and ACSL (BRD-5). A change to an Operations rule can change what those modules see."
    handling: "Each change is assessed against the cross-BRD contract (FRS chapter 19); when it touches another set, a delta sign-off of the affected pages of both sets."
    example: "Changing the payment application hierarchy changes the outstanding balances in the Collections worklists and the journals in the General Ledger: both owners confirm the delta."
  - topic: Other BRDs change Operations
    text: "Product Maintenance (components, taxes, insurers), User Access (roles), Accounting (GL accounts and journal rules), Collections (request types) and Data Migration (legacy balances) can change what Operations takes or hands over."
    handling: "The change is raised against the other BRD and assessed against the contract; when it touches this set, a delta sign-off of the affected pages only."
    example: "BRD-3 adds a premium component: the application hierarchy and the remittance schedule columns are re-issued and signed as a delta."
  - topic: Disbursement queue until the Disbursement module
    text: "Payment requests of Operations are worked on the Disbursement Queue of Operations until the Disbursement module of BRD-5 takes them over."
    handling: "The queue keeps the same statuses and notices; the switch is a configuration change agreed with Disbursement and BDOI IT."
    example: "Once BRD-5 Disbursement is live, an approved batch sends its payment request there and the queue shows it read-only."
  - topic: Production Reconciliation in Drop 2
    text: "Production Reconciliation is specified and shown in this set; its release is planned with Drop 2."
    handling: "Signed with this set; the Drop 2 release notes confirm any change since sign-off."
    example: "A new insurer layout for the production feedback agreed before Drop 2 is added as a delta."
  - topic: Integrations pending BDOI IT specifications
    text: "Bank payment files, insurer file transfers, the mail relay and the flow-in feeds depend on specifications from BDOI IT."
    handling: "A file upload or download step until the specification arrives; the automatic transfer is then a change request. The technical detail is in the Technical Specification, reviewed by BDOI IT."
    example: "Insurer ORs are uploaded from the insurer's file today; an automatic pick-up from the insurer's file transfer folder is added when the transport is agreed."
  - topic: Open questions and assumptions
    text: "Open questions of FRS section 10.3 follow the assumptions of section 10.1; chapter 21 lists the proposed rules and clarifications for confirmation."
    handling: "Answered as configuration where possible (lists of values, parameters, templates); otherwise a change request; the assumption stands until then."
    example: "Hold reasons are one value (Others) until BDOI supplies its list; the list is then loaded as configuration."

# Entry and exit criteria of the sign-off, and the definition of done.
entry:
  - "Every screenshot of the set is taken on the SIT environment with seed data."
  - "Reviewers have their SIT users and the walkthrough sessions are held."
  - "The test plan is traced to the FRS and to the screens."
  - "The BRD-1 New Business set is signed (booked invoices are the input of Operations)."
exit:
  - "Every row of the workbook reviewed by its team (Accept, Change requested or Comment)."
  - "Every comments log item closed: answered, corrected in v2.1, or raised as a change request."
  - "Open questions closed or accepted as assumptions."
  - "The sign-off certificate signed by every signatory of the Who signs what matrix: prepared, input, reviewed and approved as on the Operations BRD approval sheet; the Product Owner approves the whole set."
done:
  - "Signed certificate filed with the set; version history updated."
  - "Content frozen as signed; deltas listed in the Change Management Register with mandays."
  - "Test plan agreed for SIT and UAT."

# Handover checklist.
handover:
  - "Signed FRS, sign-off workbook and screens"
  - "Open questions closed or accepted as assumptions"
  - "Configuration inputs from the business: receipt series and BIR authorities to print, lists of values (hold reasons, disposition types, return and exclusion reasons), tolerances, incentive rules and schemes, payment file layouts, users and roles"
  - "Agreed test plan"
  - "Migration mapping of the open invoices, receipts and unapplied payments signed (BRD-13)"
handover_note: "After sign-off the content is frozen as signed and the approved deltas are scheduled."

