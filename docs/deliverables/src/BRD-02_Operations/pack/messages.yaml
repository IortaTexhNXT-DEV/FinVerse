# Messages catalogue of BRD-2 Operations: sources, places and the fix the user makes.
# The message texts are read from the platform at every build (never typed here). This file says where each message
# appears (by the class or file that raises it) and what the user does. The batch screens of the legacy balances
# (Unapplied to Income, Legacy PR 2307 Reversal, DP PR Legacy Reversal) are specified in the BRD-13 set and left out.
sources:
  backend_packages: [opsledger, cashiering, remittance, adjustment, prodrecon, commission]
  exclude_classes: [LegacyBatch, LegacyBatchService, LegacyBatchPoster, LegacyInvoiceIntake, IncomeDispositions,
                    DpprBatch, DpprBatchService, DpprBatchPoster, DpprOpenPremium, BookRates]
  exclude_codes: [NOT_FOUND, MIG_UPP_NOT_MIGRATED, MIG_UPP_WORKED]
  exclude_texts: ["^<message>$", "^<errors>$"]
  bulk_handlers: [CwtTagHandler, PdcFileHandler, CommissionPaymentHandler, AdjustmentBatchHandler, MinimalBalanceFileHandler]
  bulk_screen: "Upload screens (Payment Uploads, BIR 2307, Commission ORs, Batch Request Upload, Minimal Balance File)"
  frontend_dirs: [features/operations, features/remittance, features/adjustment, features/prodrecon,
                  features/cashiering/BatchPrintPage.tsx, features/cashiering/CashFields.tsx,
                  features/cashiering/CashieringHomePage.tsx, features/cashiering/CashieringRequestsPage.tsx,
                  features/cashiering/CashieringSetupPage.tsx, features/cashiering/CheckPickupPage.tsx,
                  features/cashiering/CommissionOrsPage.tsx, features/cashiering/Cwt2307Page.tsx,
                  features/cashiering/CwtTagDialog.tsx, features/cashiering/DispositionForm.tsx,
                  features/cashiering/IssueOrDialog.tsx, features/cashiering/PaymentPreviewPane.tsx,
                  features/cashiering/PaymentUploadsPage.tsx, features/cashiering/PdcDialogs.tsx,
                  features/cashiering/PdcWarehousePage.tsx, features/cashiering/PrebookedPage.tsx,
                  features/cashiering/ReceiptActionsTab.tsx, features/cashiering/ReceiptDetailPage.tsx,
                  features/cashiering/ReceiptParts.tsx, features/cashiering/ReceiptSeriesPage.tsx,
                  features/cashiering/ReceiptTabs.tsx, features/cashiering/ReceiptsPage.tsx,
                  features/cashiering/ReceivePaymentPage.tsx, features/cashiering/ReinstateDialog.tsx,
                  features/cashiering/RequestDialogs.tsx, features/cashiering/RequestPanels.tsx,
                  features/cashiering/UnappliedDetailPage.tsx, features/cashiering/UnappliedPage.tsx,
                  features/cashiering/cashieringLogic.ts, features/cashiering/requestsApi.ts,
                  features/commission/BillingDialogs.tsx, features/commission/CertificateDialog.tsx,
                  features/commission/CertificatePage.tsx, features/commission/CertificatesPage.tsx,
                  features/commission/CommissionHomePage.tsx, features/commission/DpBillingPage.tsx,
                  features/commission/DpBillingsPage.tsx, features/commission/DpItemDialogs.tsx,
                  features/commission/DpItemsPage.tsx, features/commission/DpListsPage.tsx,
                  features/commission/DpResponsesPage.tsx, features/commission/EstimatedItemsPage.tsx,
                  features/commission/IncentiveRunsPage.tsx, features/commission/IncentiveSchemesPage.tsx,
                  features/commission/SchemeDialog.tsx, features/commission/commissionLogic.ts,
                  components/broking/PolicyTransactions.tsx]

