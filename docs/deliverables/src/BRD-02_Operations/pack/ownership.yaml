# Who signs what in the BRD-2 Operations sign-off set: one definition, read by 00 Start Here, the 01 guide deck, the
# sign-off certificate of the 03 workbook, the Drop closure summary and the drop index (signoff_pack.py, "ownership").
# The roles and units are those of the Operations BRD approval sheet; a role the set adds is marked "Added for this set".
# The set holds business content only; the technical content is in the Technical Specification, reviewed by BDOI IT.
source: "Operations BRD approval sheet p.6-7 (Prepared by, Input Provided by, Reviewed by, Approved by)"

# id: short (matrix cells), role, organisation, capacity (as on the approval sheet), confirms, sheet (where the role
# is on the approval sheet).
roles:
  - {id: ITN, short: iorta TechNXT, role: "iorta TechNXT project team: Project Manager, Business Analysis, test lead", org: iorta TechNXT, capacity: Prepared by, confirms: "The set is complete and consistent as issued, traced to the BRD and to the screens; every comment is answered in the comments log", sheet: Added for this set (author of the FRS set)}
  - {id: BA, short: BA (BPS), role: "Business Analyst, Enterprise Services Group - Business Project Services (BPS) (Zean C. Ibay)", org: BDO Unibank ESG, capacity: Prepared by, confirms: "The set states the BRD requirements as written; every departure is listed in the proposed rules and clarifications", sheet: "Prepared by (p.6)"}
  - {id: OPSI, short: FT&P input, role: "Operations: Financial Transactions and Processing, BU representatives (Shirley Catapang, Perjelyn Joy Gutierrez)", org: BDOI, capacity: Input provided by, confirms: "The Cashiering, Remittance, Adjustment, Production Reconciliation and Commission Receivables screens, fields, rules and messages match the business input", sheet: "Input Provided by (p.6)"}
  - {id: IT, short: BDOI IT, role: "BDOI Information Technology Group (BDOI IT)", org: BDOI, capacity: Reviewed by, confirms: "Interfaces and scheduled runs, user access and menus, the Disbursement queue and the uploads that stand in for other systems, and the Technical Specification (a separate document); not the business screens", sheet: "Reviewed by (p.6-7)"}
  - {id: PGM, short: Program Manager (BPS), role: "Program Manager, Enterprise Services Group - Business Project Services (BPS) (Dan Ace Cauton)", org: BDO Unibank ESG, capacity: Approved by, confirms: "Traceability of every BRD requirement to the set and completeness of the set", sheet: "Approved by (p.7)"}
  - {id: OPSH, short: Operations FT&P, role: "Operations: Financial Transactions and Processing (Jose Melvin M. Jarin)", org: BDOI, capacity: Approved by, confirms: "The Operations screens, rules, messages, notifications, documents and accounting events", sheet: "Approved by (p.7)"}
  - {id: PO, short: Product Owner, role: "Product Owner, AVP (Shellah Marie C. Miranda)", org: BDOI, capacity: Approved by, confirms: "Owns the set and approves all of its contents", sheet: "Approved by (p.7)"}

# Part of the set -> role ids that prepare it, provide input, review it and approve it (RACI style).
parts:
  - {part: "Screens and fields (FRS screen specifications; workbook Screen catalogue, Field register)", prepares: [ITN], input: [OPSI], reviews: [PGM], approves: [PO, OPSH]}
  - {part: "Business rules and validations", prepares: [ITN], input: [OPSI, BA], reviews: [PGM], approves: [PO, OPSH]}
  - {part: "Messages and notifications", prepares: [ITN], input: [OPSI], reviews: [PGM], approves: [PO, OPSH]}
  - {part: "Documents and reports (receipts, remittance schedules, slips, registers, billings, reports)", prepares: [ITN], input: [OPSI], reviews: [PGM], approves: [PO, OPSH]}
  - {part: "Walkthroughs (end-to-end, screen by screen)", prepares: [ITN], input: [OPSI], reviews: [PGM], approves: [PO]}
  - {part: "Proposed business rules and clarifications for confirmation", prepares: [ITN], input: [BA, OPSI], reviews: [PGM], approves: [PO, OPSH]}
  - {part: "Interfaces, scheduled runs, user access and menus by persona", prepares: [ITN], input: [OPSI], reviews: [IT], approves: [PO]}
  - {part: "Test plan (04 workbook, 05 summary)", prepares: [ITN], input: [OPSI], reviews: [PGM, IT], approves: [PO]}
  - {part: "UX screen deck, UX screen register and image package (07 to 09, for the BDOI UX Design team; the screens as specified in this set)", prepares: [ITN], input: [OPSI], reviews: [PGM], approves: [PO]}
  - {part: "Technical Specification (separate document, not part of the business sign-off)", prepares: [ITN], input: [IT], reviews: [IT], approves: [IT]}
