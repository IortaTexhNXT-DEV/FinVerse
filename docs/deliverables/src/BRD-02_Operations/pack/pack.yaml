# Elements shared by many screens, described once.
common:
  - name: Page header and company
    text: >-
      Every page shows its section and title, a one-line description and its actions on the right. The company in the
      header decides the records shown; lists and reports are always of that company.
  - name: Workbenches and work tiles
    text: >-
      Each team (Cashiering, Remittance, Production Reconciliation, Adjustment, Commission Receivables) has a
      workbench with its work queues as tiles: a Title Case label and the live count; a queue that needs action has an
      amber or red bar and "Needs attention". A tile opens the list behind it. The Operations Home shows the tiles of
      every team the user works in.
  - name: Work lists
    text: >-
      Lists show status tabs (with their counts where useful), a search box, a Filters button for the other criteria,
      and the paged table ("Showing 1 to n of N results"). Rows alternate white and Background Blue; a long list scrolls inside its card with the header row in view. A row opens its record. Dates show as dd-MMM-yyyy and times
      as dd-MMM-yyyy HH:mm in Philippine time. Selecting rows enables the bulk actions of the tab.
  - name: Record summary and reference chips
    text: >-
      A record opens with its reference chips (invoice, ARN, policy number, receipt, batch, request, billing), its
      status pill, its flags and the key facts. A reference chip copies the reference. An invoice number opens its
      Invoice 360.
  - name: Invoice statuses and flags
    text: >-
      Every invoice has a payment status (Unpaid, Partially Paid, Paid, Not Applicable) and a remittance status
      (Unprocessed, Unapplied Payment, With Outstanding Balance, Review in Process, Requested for Hold, Approved,
      Partially Remitted, Fully Remitted, Not Applicable), shown as two pills, and flags shown as tags in their own
      column: Direct Payment, 2% CWT, Incentive, On Hold, Pending Negative Adjustment, Written Off, Cancelled,
      Estimated and Locked by the team working on it.
  - name: Workflow header and history
    text: >-
      Every Operations record with a workflow (receipt cancellation or reinstatement, disposition, BIR 2307 tag,
      remittance batch, hold, special remittance, deduction, endorsement request, reconciliation cycle, DP billing,
      BIR certificate) shows the workflow header under the record header: a stepper of the stages in their order
      (passed stages ticked in blue, the current stage highlighted, the stages ahead in grey with their number; a
      returned or on-hold stage in amber, a rejected, cancelled or returned record in red, the last stage in green once
      reached), and one row with Current Stage, Since, Due (with the Overdue pill) and Assigned To, with the actions the
      user may take now on the right. The history table lists every step, newest first: Stage, From Stage, Action, By
      (the user's name; the role under it for the users who may read the roles of others: user administration,
      access review and audit), Date and Time, Remarks and Duration in Stage. "Workflow notice" in the action tables means the
      in-app notice NT-01.
  - name: Four eyes
    text: >-
      Approvals are made by a second user: a receipt cancellation, reinstatement or disposition is never approved by
      its requester; a remittance batch never by its submitter; a hold, extension, cancellation or special remittance
      never by its requester; an endorsement request never by whoever raised, submitted or validated it; a deduction
      is confirmed by the ACSL Team Leader. The system refuses the approval with a message even when the role holds the
      permission.
  - name: Status pills and tags
    text: >-
      Statuses are outlined pills of one size and colour per state group; a pill never wraps. Statuses show their full label; an
      agreed short form, with the full label in the tooltip, is used only for a label longer than 21 characters.
      Flags are tags in the record header or in their own column.
  - name: Dates, amounts, periods and names
    text: >-
      Dates are entered with one date picker and shown as dd-MMM-yyyy; times as dd-MMM-yyyy HH:mm in Philippine time.
      Amounts show two decimals and thousand separators, negatives in brackets, with the currency in the column header
      or before the amount. A period (period of cover, FFY period, booking period) is shown in lists on two lines, the
      start date and "to" the end date; an open end reads "to open". Aging reads in days ("0 days", "1 day"). Lists
      of values show their labels, and users are shown by their names.
  - name: Policy Transactions
    text: >-
      One table on Invoice 360, on the endorsement request and on the account: the original booking, then every
      endorsement, adjustment, cancellation and refund in date order, each with its date and effective date, type,
      reference, premium, taxes and commission change, the gross premium and commission after it (Not posted for an
      open request), its status and its accounting; a row opens its GL journals with their lines (account, party,
      narration, debit, credit) and totals.
  - name: Documents panel
    text: >-
      Lists the documents of the record (File, Type, Description, Size, Uploaded by, Uploaded, SHA-256), with the
      upload bar, download of one file or a ZIP of the selected files, and removal. File type, size, content and
      malware checks apply to every upload.
  - name: Uploads
    text: >-
      Files are added in a drop zone (drag and drop or Browse) that states the accepted types and the maximum size.
      Template uploads validate every row before anything is saved and show Rows Read, Valid and Rejected with the
      rows; valid rows are processed and the rejected rows are returned in the error file. A file already uploaded is
      refused. Payment files report applied, unapplied, pre-booked, excess and failed rows.
  - name: Generated documents and e-mails
    text: >-
      Receipts, remittance schedules, payment requests, endorsement and validation slips, production registers and
      DP billings are produced from document templates with the BDO Insure letterhead. Documents e-mailed to an
      insurer are password protected and the password follows in a separate e-mail; the e-mail is queued and its
      outcome is kept.
  - name: Notifications and help
    text: >-
      The bell in the header shows the unread count and opens the notifications panel, grouped by day; each notice
      shows its title, a one-line summary, the record reference and the time, and opens its record. Mark Read, Mark
      All Read and View All are offered. Each user chooses the channels of the Operations events on Notification
      Settings. The Help button of each page explains the screen.
  - name: Messages
    text: >-
      Every message follows one notice standard: a white notice with a thin bar and an icon in the colour of its kind
      (red error, amber warning, blue information, green success), a bold short title, then the business message with
      one bullet per missing item. Field errors appear under the field. A refusal by a business rule shows the
      business message only, without codes; only an unexpected system error offers Retry and a reference for support.
      Success is confirmed by a short message in the same standard.
  - name: Confirmations and bulk results
    text: >-
      Every approve, post, submit, release, cancel or reverse asks for confirmation in a dialog that names the record
      and the effect; actions that need a reason open a dialog with the reason from its list and an optional comment.
      An action run on several selected rows processes each record on its own and lists the outcome of each, so one
      failure does not stop the others.
