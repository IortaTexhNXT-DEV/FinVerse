  - id: SCR-OP-21
    title: Receipt Series
    route: /cashiering/series
    purpose: >-
      The AR and OR number ranges per branch with their BIR Authority to Print, the next number and the numbers left
      before the series runs out; a new series is authorised by a second user before it is used.
    entry:
      - Cashiering Workbench
    shots:
      - {state: list, user: cashtl, caption: "Receipt Series with the numbers left"}
      - {state: new, user: cashtl, fill: new_series, caption: "New Receipt Series dialog"}
    fields:
      - "Toolbar | Origin | Drop-down | All origins, BIBS, Migrated | N | Fixed list | All origins | - | - | -"
      - "List | Series / Branch / Range / Next No. / Used / Status | Column | Prefix with the kind and ATP; gauge with the numbers left | - | Receipt series | - | Read only | - | No receipt series yet"
      - "New Receipt Series dialog | Kind / Branch | Drop-down | AR or OR; an OR series only for the Head Office | Y | Branches | AR | - | - | -"
      - "New Receipt Series dialog | Prefix | Text | For example AR-HO- | Y | - | Blank | - | Not blank | Prefix is required"
      - "New Receipt Series dialog | From No. / To No. | Number | The range ends at or after its start | Y | - | Blank | - | Valid range | The range must end at or after its start"
      - "New Receipt Series dialog | BIR ATP No. / Warn When Remaining At | Text, number | - | N | - | Blank | - | - | -"
    actions:
      - "New Series / Save Series | Cashiering Team Leader | Always | Saves the series for authorisation | Pending authorization | -"
      - "Authorize | A second user with the authorisation permission | Series pending | Asks for confirmation and activates the series | Active | -"
      - "Deactivate | Cashiering Team Leader | Series active | Asks for confirmation; no more receipts are issued from it | Inactive | -"
    rules:
      - "Each receipt takes the next number of its series; a depleted series refuses the receipt (FR-OP-010)."
      - "When the numbers left reach the warning level, the Cashiering team is alerted (FR-OP-010)."
      - "ORs are issued only from Head Office series (FR-OP-010)."
    outcome: Receipt numbers come from authorised series and the team is warned before a series runs out.
    frs: [FR-OP-010]
    tests: [SERIES]

  - id: SCR-OP-22
    title: Cashiering Setup
    route: /cashiering/setup
    purpose: >-
      The layouts of the bank and channel payment files and the minimal balance rules with the manual run of the
      sweep.
    entry:
      - Cashiering Workbench
    shots:
      - {state: layouts, user: cashtl, caption: "Cashiering Setup, Payment File Layouts tab"}
      - {state: minimal, user: cashtl, tab: "Minimal Balance", caption: "Cashiering Setup, Minimal Balance tab with the rules"}
    fields:
      - "Tabs | Payment File Layouts / Minimal Balance | Tab | - | - | Fixed | Payment File Layouts | - | - | -"
      - "Payment File Layouts | File / Kind / Separator / Last Changed | Column | Automatic, delimited or fixed width | - | Payment file layouts | - | Read only | - | -"
      - "Edit layout dialog | File Kind / Separator / Fields (Header:start:length separated by ;, start is 1-based) | Drop-down, text | Fields for a fixed-width file | Y | - | The current layout | - | - | -"
      - "Minimal Balance | Balance / Up To / Excludes / Action / Status | Column | For example premium balances up to 10.00, excluding the 2% CWT, the DST and the whole premium | - | Minimal balance rules | - | Read only | - | -"
    actions:
      - "Edit / Save Layout | Cashiering Team Leader | Always | Changes the layout of a payment file | - | -"
      - "Run Sweep Now | Cashiering Team Leader | Always | Runs the minimal balance sweep now and reports the balances reversed and the excess moved | - | -"
