      - "Toolbar | Pick-up From / Pick-up To | Date | dd-MMM-yyyy | N | - | Blank | - | - | -"
      - "List | Select | Check box | For Pick-up tab | N | - | Not ticked | - | - | -"
      - "List | Collection Ref. / Payor / Pick-up Date / Requested By / Check No. / Amount / AR / Status | Column | Collection reference with the ARN | - | Check pick-up requests | - | Read only | - | No items to display"
    actions:
      - "Import Pending Requests | Cashier | Always | Takes in the pick-up requests waiting from Collections | For pick-up | -"
      - "Print ARs | Cashier | Rows selected | Issues and prints the ARs of the selected checks in one batch | AR printed | -"
      - "Download <batch> | Cashier | After Print ARs | Downloads the merged PDF of the batch | - | -"
      - "Cancel | Cashier | For pick-up | Asks for confirmation and cancels the pick-up; the check stays with the cashier | Cancelled | -"
    rules:
      - "The ARs of the checks picked up are issued and printed in one batch (FR-OP-017)."
    outcome: Checks picked up are receipted and their ARs printed together.
    frs: [FR-OP-017]
    tests: [PICKUP]

  - id: SCR-OP-18
    title: Batch Print
    route: /cashiering/print
    purpose: >-
      Print receipts in one batch: choose them by kind, insurer and date, preview the list, print the selected
      receipts into one PDF and retry the ones that failed.
    entry:
      - Cashiering Workbench
    shots:
      - {state: list, user: cashier, caption: "Batch Print: receipts to print and the print batches"}
    fields:
      - "Receipts to Print | Kind / Insurer Code / Date From / Date To | Drop-down, text, date | All, AR, OR | N | - | All | - | - | -"
      - "Receipts to Print | Receipt No. / Date / Payor / Amount / Printed | Column | Printed <n>x or Not yet | - | Receipts | - | Read only | - | No receipts match the criteria"
      - "Print Batches | Batch No. / Criteria / Progress / Printed / Failed / Created / Status | Column | Progress bar; red when a receipt failed | - | Print batches | - | Read only | - | No print batch yet"
    actions:
      - "Preview List | Cashier | Always | Lists the issued receipts of the criteria | - | -"
      - "Print Selected (n) | Cashier | Receipts selected | Prints the selected receipts into one PDF and records each | Batch done or with failures | -"
      - "Download | Cashier | Batch printed | Downloads the merged PDF | - | -"
      - "Retry Failures | Cashier | Batch with failures | Prints the failed receipts again | - | -"
    rules:
      - "A batch records each receipt printed, so a failure is retried without printing the others again (FR-OP-025)."
    outcome: Receipts are printed in one run with a record of what was printed.
    frs: [FR-OP-025]
    tests: [PRINT]

  - id: SCR-OP-19
    title: BIR 2307
    route: /cashiering/cwt
    purpose: >-
      The creditable withholding tax certificates (BIR 2307) of 2% CWT clients: tagged by Marketing, received and
      checked by Cashiering, validated per insurer into a report batch that is posted, routed to Disbursement and
      released to the insurer, or settled in cash.
    entry:
      - Cashiering Workbench › BIR 2307 to Validate tile
    shots:
      - {state: list, user: cashier, caption: "BIR 2307, Tagged by Marketing tab"}
      - {state: tag, user: mktcoll, fill: cwt_tag, caption: "Tag BIR 2307 dialog of Marketing Collection"}
    fields:
      - "Tabs | Tagged by Marketing / Validation / Reports and Routing / Released / Settled | Tab | - | - | Fixed | Tagged by Marketing | - | - | -"
      - "Tags | Reference / Client / Insurer / Path / Amount / Checklist / Tagged / Stage | Column | CWT-yyyy-n with the invoice and ARN; path Certificate or Cash; checklist CWT Copy, Remitted | - | BIR 2307 tags | - | Read only | - | No items to display"
      - "Validation | CWT copy received | Check box | - | N | - | Not ticked | Validating | - | -"
      - "Reports and Routing | Batch No. / Insurer / Certificates / Total / Disbursement / Status | Column | - | - | 2307 report batches | - | Read only | - | No 2307 report yet"
      - "Tag BIR 2307 dialog | Invoice No. | Text | - | Y | Invoice ledger | Blank | - | Not blank | Invoice number is required"
      - "Tag BIR 2307 dialog | Path | Drop-down | Certificate or Cash | Y | Fixed list | Certificate | - | - | -"
      - "Tag BIR 2307 dialog | Amount | Number | Blank = the expected 2% | N | - | Blank | - | Above zero when given | Enter an amount above zero, or leave it empty for the expected 2%"
      - "Tag BIR 2307 dialog | Certificate No. / Period From / Period To / Remarks | Text, date | Certificate number for the certificate path | Cond. | - | Blank | - | Certificate number for a certificate | Certificate number is required for a certificate"
    actions:
      - "Tag 2307 | Marketing Collection | Always | Tags the certificate or the cash path of the invoice | Tagged by Marketing | -"
      - "Receive | Cashier | Tagged | Receives the tag for validation | Validating | -"
      - "Validate and Post Report | Cashier | Validated certificates of one insurer selected | Asks for confirmation, validates them into a report batch and posts the reclass of the 2% | Report posted | -"
      - "Settle in Cash | Cashier | Cash path | Issues an AR applied to the withheld 2% | Settled in cash | -"
      - "Route to Disbursement | Cashier | Report posted | Sends the batch to the Disbursement queue | With Disbursement | Disbursement request received (NT-03)"
      - "Release to Insurer | Disbursement | Batch paid | Releases the certificates to the insurer and offsets the DTIP | Released to insurer | -"
      - "Return to Marketing / Cancel Tag | Cashier / Marketing Collection | Tagged or validating | Returns or cancels the tag | Tagged by Marketing / Cancelled | Workflow notice (NT-01)"
    rules:
      - "Validation posts the reclass of the 2% from the premium receivable to the PR 2307 component; the release to the insurer offsets it against the DTIP (FR-OP-026, FR-OP-121)."
      - "A report batch holds the certificates of one insurer (FR-OP-026)."
    outcome: The 2% CWT of the premium is settled with the insurer through the certificates, or in cash.
    frs: [FR-OP-026, FR-OP-113, FR-OP-121]
    tests: [CWT]

  - id: SCR-OP-20
