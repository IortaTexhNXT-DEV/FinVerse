# Points for the UX Design team to confirm with BDOI.
confirm:
  clarifications: [CLR-OP-24, CLR-OP-28, CLR-OP-33, CLR-OP-34, CLR-OP-35]
  findings:
    - screens: [SCR-OP-03, SCR-OP-39]
      observation: >-
        The Policy Transactions table (the booking, its endorsements and returns with the premium, taxes, commission
        and gross premium before and after, and the journals) is wider than the page: it scrolls inside its card with
        the first columns in view.
      proposal: >-
        Keep the table scrolling inside its card with the transaction column fixed, or fold the before and after
        columns into one Change column and show the details of a transaction in a side panel.
    - screens: [SCR-OP-26, SCR-OP-45, SCR-OP-54, SCR-OP-59]
      observation: >-
        The reference of a remittance batch, a reconciliation cycle and a direct payment billing carries the insurer's
        short code (RMB-INS-MGIC-2026-000001); the insurer's name is in the record facts and the lists.
      proposal: >-
        Confirm the reference with the short code (CLR-OP-28) or ask for a plain sequence number with the insurer's
        name only in the facts.
    - screens: [SCR-OP-46, SCR-OP-54]
      observation: >-
        The production register and the direct payment billing are workbooks read back by the insurers' own
        systems: their dates are yyyy-mm-dd and the remittance status and the insurer are codes.
      proposal: Confirm the layout for the insurers (CLR-OP-34), or give the layout each insurer needs.
    - screens: [SCR-OP-02, SCR-OP-44]
      observation: >-
        Invoice Search and Reconciliation Cycles hold more columns than a 1440-pixel window shows: the last columns
        (Remittance and Flags; Last Feedback) scroll inside the card.
      proposal: >-
        Keep the lists scrolling with the reference column fixed, or stack two facts per column (as Booked /
        Inception already does) so that every column is in view.
    - screens: [SCR-OP-39]
      observation: >-
        The accounting entries of a request and the journals of Policy Transactions show the party of a line by its
        sub-ledger code (client or insurer code), as the journals of the General Ledger do.
      proposal: Confirm the code, or show the party's name with the code under it.
    - screens: [SCR-OP-01, SCR-OP-07, SCR-OP-23]
      observation: >-
        The Operations personas land on the New Business dashboard after sign-in, the landing page of every broking
        role; their own home pages (Operations, Cashiering, Remittance) are one click away in the menu.
      proposal: Confirm the landing page, or land each Operations persona on the home page of its team.
    - screens: [SCR-OP-38]
      observation: >-
        Before, Change and After of a recompute are taken on the premium in force of the policy year, so a flat
        cancellation of a policy with a later endorsement shows the whole policy year going to zero.
      proposal: Confirm the basis (CLR-OP-35); the Recompute step would otherwise name the invoice the figures are for.
