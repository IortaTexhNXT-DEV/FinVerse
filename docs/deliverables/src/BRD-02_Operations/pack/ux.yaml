# UX screen documents of the BRD-2 Operations set for the BDOI UX Design team: 07 UX Screen Deck, 08 UX screen
# register, 09 image package (docs/deliverables/src/signoff/build_ux_deck.py). The screens, fields, actions,
# walkthroughs and images come from the pack; this file holds what only the UX documents need: who each persona is,
# the images taken for the deck only (more states of a screen, the landing page and menu of each persona), the
# changes of the issue and the points for the UX Design team to confirm.

issue:
  version: "2.0"
  date: 28 September 2026
  # First issue of the UX screen documents of the set: every screen is new to the UX Design team.
  changes: []

# The personas whose landing page and full menu the deck shows (the Operations personas; Processing, whose sidebar
# the set shows for the booking step of walkthrough A, belongs to the New Business set).
navigation:
  roles: [CASHIER, CASHIER_TL, REMIT_PROCESSOR, REMIT_TL, RECON_HANDLER, ADJUSTMENT, ADJUSTMENT_TL, COMMREC_HANDLER,
          COMMREC_TL, MKT_COLLECTION, MKT_TL, COMPTROLLERSHIP, DISBURSEMENT, ACSL_PROCESSOR, ACSL_TL, SYSADMIN, AUDITOR]

# Who each persona is (what they do comes from the persona table of the FRS unless given here).
personas:
  CASHIER: {who: "A cashier of the head office or of a branch who receives the payments of the clients"}
  CASHIER_TL: {who: "The team leader or head of Cashiering, who approves cancellations, reinstatements and dispositions"}
  REMIT_PROCESSOR: {who: "A Remittance processor who extracts the paid premiums into batches per insurer"}
  REMIT_TL: {who: "The team leader or head of Remittance, who approves the batches and the special remittances"}
  RECON_HANDLER: {who: "A Production Reconciliation handler who sends the registers and reconciles the insurer's production"}
  ADJUSTMENT: {who: "An Adjustment processor who validates and posts the endorsement requests"}
  ADJUSTMENT_TL: {who: "The team leader of Adjustment, who approves the endorsement requests"}
  COMMREC_HANDLER: {who: "A Commission Receivables handler who bills the direct payment commissions to the insurers"}
  COMMREC_TL: {who: "The team leader or head of Commission Receivables, who posts the incentive runs and keeps the schemes"}
  MKT_COLLECTION: {who: "A Marketing Collection officer of the head office or of a branch who raises holds, special remittances, BIR 2307 tags and endorsement requests"}
  MKT_TL: {who: "A Marketing team leader or unit head, who approves the holds of the Marketing officers"}
  COMPTROLLERSHIP: {who: "A Comptrollership officer who acknowledges the BIR certificates and reads the journals and reports"}
  DISBURSEMENT: {who: "A Disbursement officer who works the payment requests of the queue until BRD-5 replaces it"}
  ACSL_PROCESSOR: {who: "An ACSL processor who records the deductions on the remittances (BRD-5)"}
  ACSL_TL: {who: "The ACSL team leader who confirms the deductions (BRD-5)"}
  SYSADMIN: {who: "The system administrator of BIBS (BDOI IT operations), who keeps the feeds and the lists"}
  AUDITOR: {who: "An internal or external auditor with read access to Operations and its reports"}

