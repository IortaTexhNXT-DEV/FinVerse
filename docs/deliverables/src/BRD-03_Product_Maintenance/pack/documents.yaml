# Documents generated by BRD-3 Product Maintenance. Each is produced from a document template (Document Templates
# screen of BRD-1) with the BDO Insure letterhead, the "Confidential" footer and page x of y.
# Columns: id | document | template | format | produced by | protected | fields and their source | image (slug)
documents:
  - id: DO-01
    name: Package Request Form
    template: PKG_REQUEST_FORM
    format: PDF
    produced: Package Request record › Request Form
    protected: No (kept in BIBS)
    fields:
      - "Request: request number and type, package or programme name, scope, client, line and cover type, product – from the package request"
      - "Requested terms: sections; coverages with Included, Limit, Sub-limit, Deductible; rate %, minimum premium, commission %, TSI limit, computation basis, effective from, package term, anniversary; insurers with role, share, rate and minimum premium – from the requested terms"
      - "Opening text – merged from the template PKG_REQUEST_FORM; signature lines Prepared by and Approved by"
    shot: doc-request-form
    frs: [FR-PM-020]
  - id: DO-02
    name: Package quotation slip
    template: PKG_QUOTATION_SLIP
    format: PDF, one per round (the same slip to every insurer of the round)
    produced: Negotiation tab › Quotation Slip; e-mailed at Approve and Send and at Resend
    protected: Yes when e-mailed (password in a separate e-mail)
    fields:
      - "Slip number PQS-yyyy-nnnnnn, round, request, package, line, client or programme, reply date – from the round and the request"
      - "Round notes – the notes of the round (What changes in this round)"
      - "Requested terms as in DO-01"
      - "Opening text with the slip number, round and reply date – merged from the template PKG_QUOTATION_SLIP"
      - "Signature lines Prepared by and Approved by"
    shot: doc-quotation-slip
    frs: [FR-PM-030]
  - id: DO-03
    name: Comparative table (audit master and client view)
    template: PKG_COMPARATIVE
    format: PDF and Excel, one pair per stored output
    produced: Comparative tab › PDF / Excel of each stored output
    protected: Yes when e-mailed
    fields:
      - "Title (Audit master or the client view title), request, round – from the output"
      - "Insurer terms: one row per insurer with the fields of the output (Outcome, Rate %, Minimum Premium, Coverages, Deductibles, Conditions / Warranties, Valid Until, Remarks) – from the insurer responses stored in the output"
      - "Opening text with the request, round and variant – merged from the template PKG_COMPARATIVE (PDF only); the Excel file holds the table only"
    shot: doc-comparative
    frs: [FR-PM-034, FR-PM-035]
  - id: DO-04
    name: Package slip
    template: PKG_SLIP
    format: PDF
    produced: Requirements & Sign-off tab › Package Slip; printed, signed and uploaded as Package slip (signed)
    protected: No (kept in BIBS)
    fields:
      - "Request, package, line, client or programme – from the request"
      - "Proposed terms: coverages, rate scheme, computation basis, dates and chosen insurers with role and share – from the proposed terms"
      - "Opening text – merged from the template PKG_SLIP; signature lines Prepared by and Approved by, signed on the printed slip"
    shot: doc-package-slip
    frs: [FR-PM-040]
  - id: DO-05
    name: ManCom sign-off record
    template: (built-in layout, ManCom Sign-off)
    format: PDF, attached as ManCom sign-off when no signed sheet was uploaded
    produced: Automatically at Sign off and send to MBS
    protected: No (kept in BIBS)
    fields:
      - "Package: request, package, line, client or programme – from the request"
      - "Reference MC-PKR-yyyy-nnnnnn, Decision, Signed by, Signed at, Comment – from the ManCom decision; footer Signed in BIBS by <user>"
    shot: doc-mancom-signoff
    frs: [FR-PM-041]
  - id: DO-06
    name: Package advisory
    template: PKG_ADVISORY (new, reactivated or updated package), PKG_RENEWAL_ADVISORY (renewed package); built-in text for a retirement
    format: PDF, stored on the request as Package advisory and e-mailed when addresses are given
    produced: Advisories tab › Send Advisory
    protected: Yes when e-mailed (password in a separate e-mail)
    fields:
      - "Subject and recipient groups – from the advisory as edited"
      - "Advisory text – merged from the template with the risk code, package name, version, effective date and request number, then edited by TSU"
      - "Supporting documents (kept in BIBS): the signed package slip and the ManCom sign-off with their file names"
    shot: doc-advisory
    frs: [FR-PM-044]
