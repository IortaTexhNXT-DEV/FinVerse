# Guide to the BRD-3 Product Maintenance business sign-off pack: the content of the Sign-off Pack Guide deck
# (generic guide deck builder) and of the Start Here guide (START_HERE_BRD03.md, ```pack blocks "guide-*").
# The same layout is used for every BRD set; only this file changes.
meta:
  deck_title: Sign-off Pack Guide
  module: Product Maintenance
  owner: Product Owner, Marketing Business System (MBS)
  issued: Mon 2-Nov-2026
  signoff_date: Mon 30-Nov-2026

# The documents of the set in reading order. kind = doc type of the file name (brand.READING_ORDER).
documents:
  - {kind: StartHere, name: Product Maintenance, ext: docx, what: "Start Here: the map of the pack, who reads what, the steps and the dates", readers: Everyone, when: "First, on issue"}
  - {kind: GuideDeck, name: Product Maintenance, ext: pptx, what: "Sign-off Pack Guide: purpose, approach, the module at a glance, caveats, entry and exit criteria, change control", readers: "Business owner, unit heads; presented at the kick-off", when: "Kick-off session"}
  - {kind: FRS, name: Product Maintenance, ext: docx, what: "Functional Requirements Specification v2.1: requirements, navigation, 22 screen specifications with screenshots, walkthroughs, messages, notifications, documents, uploads, configuration inputs, cross-BRD contract", readers: "MBS, TSU and Marketing for their screens; Finance and BDOI IT for their chapters", when: "During the review, with the SIT walkthroughs"}
  - {kind: Signoff, name: Product Maintenance, ext: xlsx, what: "Sign-off workbook: one row per screen, field, rule and message with the BU review columns; comments log, meeting minutes, version history, sign-off certificate", readers: "Every reviewer; the business owner signs it", when: "During the review and at sign-off"}
  - {kind: TestPlan, name: Product Maintenance, ext: xlsx, what: "Test plan workbook: the test cases traced to the FRs and to the screens, including one screen case and one message case per screen", readers: "Business users who will run UAT; BDOI IT", when: "After the screens; used again in SIT and UAT"}
  - {kind: TestPlan, name: Product Maintenance Summary, ext: docx, what: "Test plan summary: scope, approach, coverage and the cases by area", readers: "Business owner, BDOI IT", when: "Before sign-off"}
  - {kind: Templates, name: Configuration Inputs, ext: xlsx, what: "Configuration input templates: product catalogue, coverages and rules, clauses, rate tables, insurers, packages in force, package map, document templates, lists of values, incentive criteria", readers: "MBS, TSU, Operations, Comptrollership (who provide the content)", when: "During the review; filled in for the data migration mocks and the map freeze"}
  - {kind: UXDeck, name: Product Maintenance, ext: pptx, what: "UX Screen Deck for the BDOI UX Design team: design foundation, navigation and personas, every flow step by step and every screen with all its states", readers: "BDOI UX Design team", when: "From the issue, in parallel with the review; re-issued with each version of the set"}
  - {kind: UXScreens, name: Product Maintenance, ext: xlsx, what: "UX screen register: one row per screen image with the screen, personas, flow and step, state, FRS section and requirements, UXD status and comments, and the Changed in this issue flag", readers: "BDOI UX Design team", when: "Kept by the UX Design team; the changed rows are flagged at each issue"}
  - {kind: UXScreens, name: Product Maintenance, ext: zip, what: "Image package: every screen image at twice the screen resolution (PNG), the component crops and the register as CSV", readers: "BDOI UX Design team", when: "Imported into the design tool at each issue"}

# Reading order per role (FRS chapter numbers of v2.1).
reading:
  - role: Business owner (Product Owner, Marketing Business System)
    order: "00 Start Here; 01 Guide deck; FRS chapters 1-3 (context and personas), 22 (proposed rules for confirmation), 14 (walkthroughs), 19 (configuration inputs) and 21 (sign-off); workbook Sign-off certificate"
  - role: MBS (set-up, versions, masters, incentive criteria)
    order: "FRS chapter 12 (navigation); chapter 13 screens SCR-PM-08 and SCR-PM-11 to SCR-PM-20; walkthrough A steps 1-2 and 15-19; chapter 19 templates CI-01 to CI-06, CI-09 and CI-10; workbook Screen catalogue, Field register, Business rules and Messages of those screens"
  - role: TSU (requests, negotiation, requirements, advisories, expiry)
    order: "FRS chapter 13 screens SCR-PM-01 to SCR-PM-10; walkthroughs A (steps 5-14 and 20) and B; chapter 17 (documents); chapter 19 template CI-07 (package map); workbook rows of those screens"
  - role: Marketing (requests, approval, client-specific terms, pricing)
    order: "FRS chapter 13 screens SCR-PM-02 to SCR-PM-04, SCR-PM-21 and SCR-PM-22; walkthrough A steps 3-4 and 21-24; chapter 20 lines IC-01 to IC-03"
  - role: Finance (Comptrollership)
    order: "Rates & Taxes (SCR-PM-19), Insurer record commission rates (SCR-PM-18), Incentive Criteria (SCR-PM-16); contract lines IC-10 and IC-11 (chapter 20); templates CI-04 and CI-10"
  - role: BDOI IT
    order: "Interfaces and integration (chapter 7), non-functional requirements (chapter 8), menu by persona (chapter 12), cross-BRD contract (chapter 20); product master feed pending specifications (Guide deck, caveats)"
  - role: BDOI UX Design team
    order: "07 UX Screen Deck: design foundation and navigation first, then the personas, flows and screens of the design work; 08 UX screen register (filter Changed in this issue at each new issue); 09 image package in the design tool"
  - role: iorta TechNXT project team
    order: "All documents; keeps the comments log, the meeting minutes and the version history of the workbook, answers every comment and keeps the traceability to SIT and UAT"

# Approach and step-by-step flow up to closure. raci: R responsible, A accountable, C consulted, I informed.
steps:
  - step: 1
    name: Pack issued
    who: "R: iorta TechNXT Project Manager; A: iorta TechNXT delivery lead; I: all reviewers"
    inputs: "FRS v2.1, workbook, test plan, configuration input templates, guide and deck"
    outputs: "Release set v2.1 in the BRD-03 folder of Drop 0; invitations to the sessions"
    duration: "Day 0 (Mon 2-Nov-2026)"
  - step: 2
    name: Kick-off and screen walkthrough on SIT
    who: "R: iorta TechNXT Business Analysis; A: BDOI Product Owner; C: MBS, TSU and Marketing heads; I: BDOI IT"
    inputs: "Guide deck; SIT users with seed data; walkthroughs A and B"
    outputs: "Screens shown live; first questions logged in the comments log; minutes"
    duration: "3 sessions, 4 to 6-Nov-2026"
  - step: 3
    name: Review with the workbook; configuration inputs started
    who: "R: business users of MBS, TSU and Marketing; A: unit heads; C: iorta TechNXT (questions)"
    inputs: "FRS chapters of the area; workbook sheets with the BU review columns; the configuration input templates"
    outputs: "Every row marked Accept, Change requested or Comment; comments log entries; first drafts of the templates"
    duration: "8 working days after the walkthroughs, until Wed 18-Nov-2026"
  - step: 4
    name: Comments consolidated and a Q&A session
    who: "R: iorta TechNXT Project Manager and Business Analysis; A: BDOI Product Owner; C: reviewers"
    inputs: "Returned workbooks"
    outputs: "One consolidated comments log, each item typed (clarification, correction, change request) and answered; Q&A minutes"
    duration: "3 working days, Q&A on Mon 23-Nov-2026"
  - step: 5
    name: One revision cycle (v2.2)
    who: "R: iorta TechNXT Business Analysis; A: iorta TechNXT delivery lead; C: reviewers who raised the items"
    inputs: "Agreed clarifications and corrections"
    outputs: "Release set v2.2 with the changed rows marked; change requests raised for the rest"
    duration: "v2.2 on Wed 25-Nov-2026; check by the reviewers until Fri 27-Nov-2026"
  - step: 6
    name: Sign-off meeting and signature
    who: "R: iorta TechNXT Project Manager; A: BDOI Product Owner; C: MBS, TSU, Marketing, Finance, BDOI IT"
    inputs: "v2.2 (or v2.1 when no revision is needed); open items with their decision"
    outputs: "Signed sign-off certificate; minutes; open items accepted as assumptions or change requests"
    duration: "Mon 30-Nov-2026"
  - step: 7
    name: Content freeze; configuration and migration inputs
    who: "R: iorta TechNXT delivery lead; A: BDOI Product Owner; I: BDOI IT, other BRD owners, Data Migration working group"
    inputs: "Signed set; change requests with mandays; filled configuration input templates"
    outputs: "Content frozen as signed; approved deltas scheduled in the Change Management Register; templates handed to the data migration mocks"
    duration: "From Tue 1-Dec-2026; templates final at the map freeze"
  - step: 8
    name: Traceability into SIT and UAT
    who: "R: iorta TechNXT test lead; A: BDOI Product Owner; C: business users"
    inputs: "Signed FRS rows and test plan"
    outputs: "SIT and UAT runs traced to the signed screens, rules and messages; results against each row"
    duration: "SIT Apr - Jul 2027; UAT Aug - Oct 2027"

