# Key business rules and validations (highlights; the full list is in the workbook and FRS chapter 13).
rules:
  - "A package request is approved by Marketing, recommended by the TSU Team Lead and approved by the TSU Head, never by its maker, and the TSU Head never approves his own recommendation."
  - "A quotation slip is approved by a TSU Team Lead or a co-officer, never its preparer, and goes to each insurer by protected e-mail."
  - "Terms are final only when every insurer of the latest round has an outcome; co-insurance shares total 100."
  - "ManCom signs off a complete requirements pack with the signed package slip; the slips then lock."
  - "A package version is validated by the TSU Head or the Business Administrator, never its maker or submitter, with a five-point checklist and a test premium."
  - "New business is priced on the version in force on the transaction date; a different rate needs an approved rate exception."
  - "Every product master is maker-checker and never deleted; expired and retired packages stay readable."
  - "An advisory is sent only with the signed package slip and the ManCom sign-off attached."

# Caveats and possibilities, and how each is handled.
caveats:
  - topic: Additional requirements
    text: "New needs can surface during the review, SIT or UAT."
    handling: "In-scope clarification when the signed text already covers it; otherwise a change request with mandays."
    example: "A reviewer asks for a two-level ManCom approval: a new stage, so a change request; asking which documents the advisory checks is a clarification."
  - topic: Other BRDs change Product Maintenance
    text: "New Business, Renewal, Employee Benefits, Submitted Policies, Operations, Accounting and Data Migration read the products and package versions."
    handling: "The change is raised against the other BRD and assessed against the cross-BRD contract; when it touches this set, a delta sign-off of the affected pages only."
    example: "Renewal asks to renew accounts of an expired package on a new version: the rating purpose changes; the version pages are re-issued and signed as a delta."
  - topic: Items that belong to other sets
    text: "The package map (data migration object R06) and the Renewal sanitation check PACKAGE_REMAP belong to the Data Migration and Renewal sets."
    handling: "Product Maintenance provides the package versions the map names; the map is signed with the Data Migration and Renewal sets."
    example: "The template CI-07 of this set is the layout TSU prepares; it is loaded with the data migration."
  - topic: Integrations pending BDOI IT specifications
    text: "The product master feed to other BDOI systems waits for their specification (PQ16)."
    handling: "BIBS records each change for the transfer; the transfer is a change request once the specification arrives."
    example: "When BDOI names the receiving system, each released version is sent to it; the screens do not change."
  - topic: Open questions and assumptions
    text: "Open questions of FRS section 10.3 (product matrix, approval chain, ManCom quorum, validator role, CPC2) follow the assumptions of section 10.1; chapter 22 lists the proposed rules for confirmation."
    handling: "Answered as configuration where possible (lists, parameters, templates, the product matrix itself); otherwise a change request; the assumption stands until then."
    example: "The service level hours of each stage are parameters: a changed answer to PQ08 is a configuration change, not a change request."

# Entry and exit criteria of the sign-off, and the definition of done.
entry:
  - "Every screenshot of the set is taken on the SIT environment with seed data."
  - "Reviewers have their SIT users and the walkthrough sessions are held."
  - "The test plan is traced to the FRS and to the screens."
exit:
  - "Every row of the workbook reviewed by its unit (Accept, Change requested or Comment)."
  - "Every comments log item closed: answered, corrected in v2.2, or raised as a change request."
  - "Open questions closed or accepted as assumptions."
  - "The sign-off certificate signed by every signatory of the Who signs what matrix: prepared, input, reviewed and approved as on the BRD approval sheet; the Product Owner approves the whole set."
done:
  - "Signed certificate filed with the set; version history updated."
  - "Content frozen as signed; deltas listed in the Change Management Register with mandays."
  - "Configuration input templates owned and scheduled for the data migration mocks."
  - "Test plan agreed for SIT and UAT."

# Handover to development / build readiness checklist.
handover:
  - "Signed FRS, sign-off workbook and screens"
  - "Open questions closed or accepted as assumptions"
  - "Configuration inputs from the business: product catalogue, coverages and rules, clauses, rate tables, insurers, packages in force, package map, document templates, lists of values, incentive criteria"
  - "Agreed test plan"
  - "Migration mapping of the product objects (R01, R03-R07) signed with BRD-13"
handover_note: "After sign-off the content is frozen as signed, the approved deltas are scheduled and the configuration inputs are loaded."

