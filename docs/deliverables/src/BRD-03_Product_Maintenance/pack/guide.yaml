  - {role: "Input provider and reviewer", who: "Marketing Business System (MBS)", does: "Coordinates the MBS review and the configuration inputs; signs for the business input and its review (BRD approval sheet)"}
  - {role: "Reviewers", who: "TSU, Marketing, MBS", does: "Review their screens and rows; raise comments; provide the templates they own"}
  - {role: "Finance and BDOI IT", who: "Comptrollership, BDOI IT", does: "Comptrollership approves rates, commission and incentives; BDOI IT reviews interfaces, access and the Technical Specification, not the business screens"}
  - {role: "BRD owner", who: "Business Project Services, BDO Unibank ESG", does: "Business Analyst: the BRD as written; Program Manager: traceability and completeness; sign-off coordination"}
  - {role: "Delivery", who: "iorta TechNXT Project Manager, Business Analysis, test lead", does: "Sessions, answers, comments log, revisions, change requests"}
