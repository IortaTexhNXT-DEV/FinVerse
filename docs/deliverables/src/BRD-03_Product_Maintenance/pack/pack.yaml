# Elements shared by many screens, described once.
common:
  - name: Page header and company
    text: >-
      Every page shows its section (Product Maintenance) and title, a one-line description and its actions on the right.
      The company in the header decides the package requests, insurers, sales units and incentive criteria shown;
      products, coverages, clauses and rates are the same for every company.
  - name: Work lists
    text: >-
      Lists show status tabs, a search box, a Filters button where the list has advanced filters, and the paged table
      ("Showing 1 to n of N results"). A row opens its record. Dates show as dd-MMM-yyyy and times as dd-MMM-yyyy
      HH:mm in Philippine time.
  - name: Record summary and reference chips
    text: >-
      A record opens with its reference (package request number PKR-yyyy-nnnnnn, risk code, version), its status pill,
      its flags (Generic or Client-specific, No negotiation, Package, Version n Draft) and the key facts. A reference
      chip copies the reference.
  - name: Workflow status strip and history
    text: >-
      The current stage of a package request is shown as a status strip: Stage (status pill and stage name), In Stage
      Since, Due (the service level due time, Overdue in red) and Assigned To, with the actions the user may take now on
      the right. The History tab lists every step, newest first: Stage, From Stage, Action, By (name and role), Date
      and Time, Remarks and Duration in Stage. Actions that need a reason (Return to requester, Void, Not proceeded,
      Request changes, Return to TSU) open a dialog with the mandatory reason from its list of values and an optional
      comment; the comment is kept in the history and sent with the workflow notice.
  - name: Maker-checker on product masters
    text: >-
      Products, coverages, clauses, field, document and TSU routing rules, insurers, branches, commission rates, rates
      and taxes, sales units and incentive criteria are saved with Save for Authorization and show Pending
      Authorization until a second user authorises them with Authorize (on the list row or in My Approvals). The maker
      never authorises his own record. An authorised record is not deleted: Deactivate ends its use and keeps its
      history. Package versions follow their own check: Submit for Validation, then Validate and Release by the TSU
      Head or the Business Administrator.
  - name: Status pills and tags
    text: >-
      Stages and record statuses are pills of one size and colour per state group; a pill never wraps. Flags such as
      Generic, Client-specific, No negotiation, Package, Basic, Lowest rate and Locked are tags next to the name or in
      their own column.
  - name: Dates, amounts and rates
    text: >-
      Dates are entered with the date picker and shown as dd-MMM-yyyy (for example 27-Sep-2026). Amounts show two
      decimals and thousand separators in Philippine pesos. Rates are percentages with up to four decimals.
  - name: Documents panel
    text: >-
      The Documents tab of a package request lists its files (File, Type, Description, Size, Uploaded by, Uploaded,
      SHA-256) with the upload bar (document type, description, files and the option to name the files after the
      request number), download of one file or a ZIP of the selected files, and removal. The signed package slip is
      uploaded here with the type Package slip (signed); the ManCom sign-off sheet with the type ManCom sign-off. File
      type, size, content and malware checks apply to every upload.
  - name: Protected e-mails
    text: >-
      Quotation slips to insurers and advisories e-mailed outside BIBS are sent as password-protected PDF; the password
      follows in a separate e-mail. Every e-mail is listed on the request's E-mails tab with its outcome and in
      Outbound Messages.
  - name: Notifications and help
    text: >-
      The bell in the header shows the unread count and opens the notifications panel, grouped by day; each notice
      opens its record. Mark Read, Mark All Read and View All are offered. The Help button of each page explains the
      screen.
  - name: Messages
    text: >-
      Field errors appear under the field in red with the field outlined; a banner at the top lists the errors of a
      form. A refusal by a business rule shows the business message and a reference for support (the message code and
      a request number). Success is confirmed by a short message at the bottom right of the page.
