      - "Claim | A user of the stage | Unassigned item | Assigns the request to the user | Unchanged | -"
      - "Assign | Team leaders (WORK_ASSIGN) | Always | Opens the assignment dialog: a user of the stage or the team queue | Unchanged | Assignment notice"
