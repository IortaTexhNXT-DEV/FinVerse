  - id: SCR-PM-10
    title: Package Expiry
    route: /product-maintenance/expiry
    purpose: >-
      The released packages by package end date, with their renewal status: packages ending without a renewal request,
      packages whose renewal is in progress, and the pointer to the expired packages kept in the catalog. TSU drafts
      renewal requests for the selected packages, pre-filled from the version in force.
    entry:
      - Product Maintenance Home › Packages ending soon tiles
      - Package Requests › Package Expiry
      - The expiry alert (Alert inbox) and the package expired notice
    shots:
      - {state: list, user: tsu, caption: "Package Expiry, Expiring tab"}
      - {state: dialog, user: tsu, click: "^generate expiry list$", caption: "Generate Expiry List dialog"}
    fields:
      - "Tabs | Expiring / Renewal in Progress / Expired | Tab | - | - | Fixed | Expiring | - | Expiring = no renewal request yet; Renewal in Progress = an open renewal or reactivation request | -"
      - "List | Package | Column | Risk code v<version>, with the product name | - | Version in force | - | Read only | - | -"
      - "List | Package End | Column | dd-MMM-yyyy | - | Version in force | - | Read only | - | -"
      - "List | Days Left | Column | Days until the package end, red up to 7, amber up to 30 | - | Computed | - | Read only | - | -"
      - "List | Anniversary | Column | dd-MMM-yyyy | - | Version in force | - | Read only | - | -"
      - "List | Renewal Request | Column | Request number and its stage pill | - | Package requests | - | Read only | - | -"
      - "Generate Expiry List | Packages ending within (days) | Number | Whole days from today | Y | - | 90 (or the window of the home tile) | - | Zero or more | -"
    actions:
      - "Generate Expiry List | Every user of the screen | Always | Opens the dialog; Generate lists the packages ending within the days entered | - | -"
      - "Generate Renewal Request | TSU (PKG_NEGOTIATE) | Expiring tab; at least one package selected | Drafts one Renew request per package, pre-filled from the version in force with the next term (start = old end + 1 day, same length); a package with an open renewal keeps it; one request opens directly | Draft request | -"
    rules:
      - "A package is listed from its version in force; the expiry monitor alerts at 60 days (PACKAGE_EXPIRY_NOTICE_DAYS) and again at 30 and 7 days (FR-PM-060)."
      - "A renewal request is never drafted twice for the same package; when PACKAGE_RENEWAL_AUTODRAFT is on, the monitor drafts it itself (FR-PM-061)."
