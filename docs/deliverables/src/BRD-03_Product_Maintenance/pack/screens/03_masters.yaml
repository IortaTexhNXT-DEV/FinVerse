# Screen specifications of BRD-3 Product Maintenance: insurers, rates and taxes, sales organisation, the premium
# calculator and the package rate scheme as New Business uses it. Schema: docs/deliverables/src/signoff/README.md.
area: Insurers, rates and pricing
screens:
  - id: SCR-PM-17
    title: Insurers
    route: /catalog/insurers
    purpose: >-
      The insurer panel of the company: each accredited insurer with its accreditation date, placement channel and
      placement e-mails, and its credit days. Package versions, quotation slips and placement use this panel. A new
      insurer also creates its business partner for the ledger; both are authorised together.
    entry:
      - Sidebar entry Insurers
    shots:
      - {state: list, user: mbs, caption: "Insurers list"}
      - {state: new, user: badmin, click: "^new insurer$", caption: "New insurer dialog"}
    fields:
      - "List | Code | Column | Partner code INS-... | - | Insurer master | - | Read only | - | No insurer on the panel yet."
      - "List | Name | Column | Registered name | - | Insurer master | - | Read only | - | -"
      - "List | Accredited Until | Column | dd-MMM-yyyy; (expired) in red once past | - | Insurer master | - | Read only | - | -"
      - "List | Placement / Placement e-mails | Column | E-mail; addresses | - | Insurer master | - | Read only | - | -"
      - "List | Credit Days | Column | Days | - | Insurer master | - | Read only | - | -"
      - "List | Status | Column | Pending Authorization, Active, Inactive | - | Insurer master | - | Read only | - | -"
      - "New insurer | Partner code | Text | INS- followed by capitals | Y | - | INS- | New insurer only | Unique; an existing party must be an insurer | Party <party code> exists and is not an insurer"
      - "New insurer | Name / Short name | Text | Registered and short name | Y (name) | - | Blank | Pending, active | - | -"
      - "New insurer | IC accreditation no. / Accredited until | Text / Date | Insurance Commission accreditation; dd-MMM-yyyy | N | - | Blank | Pending, active | - | -"
      - "New insurer | Placement channel | Drop-down | E-mail | Y | Fixed list | E-mail | Pending, active | Only e-mail placement is available | Only e-mail placement is available; choose the e-mail placement channel"
      - "New insurer | Placement e-mails | Text | Addresses separated by commas | N (needed to send quotation slips and placement slips) | - | Blank | Pending, active | - | <name> has no placement e-mail address"
      - "New insurer | Credit days | Number | 0 to 365 | N | - | 30 | Pending, active | 0 to 365 | Default credit days must be between 0 and 365"
      - "New insurer | TIN / Address / E-mail / Phone | Text | Business partner details | N | - | Blank | New insurer only | - | -"
    actions:
      - "New Insurer | MASTER_MAINTAIN (Business Administrator) | Always | Opens New insurer; Save for Authorization | Pending Authorization | -"
      - "Authorize | MASTER_AUTHORIZE, not the maker | Pending row | Authorises the insurer and its business partner | Active | -"
      - "Deactivate | MASTER_MAINTAIN | Active row | The insurer is no longer offered | Inactive | -"
      - "[Open a row] | Every user of the screen | Always | Opens the insurer record | - | -"
    rules:
      - "Only authorised, active insurers are offered in package requests, package versions and quotation slips (FR-PM-014, FR-PM-030)."
      - "The insurer master is maintained under New Business rules (BRD-1, insurer panel); Product Maintenance uses it for the package panels (FR-PM-014)."
    outcome: The insurer panel used by every package is maintained once, with the e-mail addresses the slips are sent to.
    frs: [FR-PM-014]
    tests: [INSURERS]

  - id: SCR-PM-18
    title: Insurer record
    route: /catalog/insurers/:id
    parent: /catalog/insurers
    purpose: >-
      One insurer: its profile (partner code, accreditation, placement channel and e-mails, credit days, maker and
      authoriser), its branches with the local government tax rate, and its commission rates by product.
    entry:
      - Insurers › a row
    shots:
      - {state: record, user: mbs, open: first_insurer, caption: "Insurer record with branches and commission rates"}
    fields:
      - "Profile | Partner code / Short name / IC accreditation / Accredited until / Placement channel / Placement e-mails / Credit days / Maker / Authorized by | Detail | As entered | - | Insurer master | - | Read only (Edit opens the insurer dialog) | - | -"
      - "Branches | Code / Name / City / LGT % / Placement e-mail / Status | Column | Branch of the insurer | - | Insurer branches | - | Read only | - | No branch recorded."
      - "Commission rates | Product / Commission % / From / To / Status | Column | All products or one product; To shows Open | - | Commission rates | - | Read only | - | No commission rate: the product default applies."
      - "New Branch | Code / Name | Text | Branch code and name | Y | - | Blank | New branch | Unique per insurer | Insurer branch already exists: <key>"
      - "New Branch | City | Text | Free text | N | - | Blank | New branch | - | -"
      - "New Branch | LGT % | Number | Local government tax on premium, up to four decimals | Y | - | 0 | New branch | 0 to 100 | The LGT rate must be between 0 and 100 %"
      - "New Branch | Placement e-mail | Text | Address | N | - | Blank | New branch | - | -"
      - "New Commission Rate | Product | Drop-down | All products of the insurer or one active product | N | Active products | All products of the insurer | New rate | - | -"
      - "New Commission Rate | Commission % | Number | Percentage | Y | - | Blank | New rate | 0 to 100 | The commission rate must be a percentage between 0 and 100"
      - "New Commission Rate | Effective from / Effective to | Date | dd-MMM-yyyy | Y (from) | - | Today | New rate | To on or after from | Enter the effective-from date / The effective-to date is before the effective-from date"
    actions:
      - "Edit | MASTER_MAINTAIN | Always | Opens the insurer dialog (partner code fixed); Save for Authorization | Pending Authorization | -"
      - "Add branch | MASTER_MAINTAIN | Always | Opens New Branch; Save for Authorization | Pending Authorization | -"
      - "Add rate | MASTER_MAINTAIN | Always | Opens New Commission Rate; Save for Authorization | Pending Authorization | -"
      - "Authorize / Deactivate | As on Insurers | As on Insurers | As on Insurers | Active / Inactive | -"
    rules:
      - "The commission rate in force on the account's period start applies; without an insurer rate, the product default applies (FR-PM-014)."
      - "A package version's own insurer rate and minimum premium win over the insurer's general terms for that package (FR-PM-014)."
    outcome: The business sees and maintains everything that is specific to one insurer.
    frs: [FR-PM-014]
    tests: [INSURER]

  - id: SCR-PM-19
    title: Rates & Taxes
    route: /catalog/rates
    purpose: >-
      The statutory charges and rating tables applied by the premium calculation: documentary stamp tax, premium tax,
      VAT, fire service tax and the motor own-damage factors; the short-period table; and the bodily injury and property
      damage limit premiums. Every row is effective-dated and maker-checker.
    entry:
      - Sidebar entry Rates & Taxes
    shots:
      - {state: list, user: mbs, caption: "Rates & Taxes, Taxes & factors tab"}
      - {state: new, user: badmin, click: "^new rate$", caption: "New tax or rating factor dialog"}
    fields:
      - "Tabs | Taxes & factors / Short-period table / BI / PD limits | Tab | - | - | Fixed | Taxes & factors | - | - | -"
      - "Taxes & factors | Rate / Line / % / From / To / Status | Column | Rate name; All lines or a line; percentage; dd-MMM-yyyy; Open | - | Rate table | - | Read only | - | -"
      - "Short-period table | Months Covered (up To) / % of Annual Premium / From / To / Status | Column | Months 1 to 12; percentage | - | Short-period table | - | Read only | - | -"
      - "BI / PD limits | Coverage / Limit / Premium / From / To / Status | Column | Bodily injury or Property damage; amounts | - | Motor limit table | - | Read only | - | -"
      - "New rate | Rate | Drop-down | DST, premium tax, VAT, fire service tax and the motor factors | Y | Fixed list | DST | New row | - | -"
      - "New rate | Line code | Text | Blank = every line | N | Product lines | Blank | New row | - | -"
      - "New rate | Rate % / % of annual premium | Number | Percentage, up to four decimals | Y | - | Blank | New row | 0 to 100 | The rate must be a percentage between 0 and 100 / The short-period percentage must be a percentage between 0 and 100"
      - "New rate | Months covered | Number | 1 to 12 | Y (short-period table) | - | Blank | New row | 1 to 12 | Months covered must be between 1 and 12"
      - "New rate | Coverage / Limit / Premium | Drop-down / Number | Bodily injury (BI) or Property damage (PD); amounts | Y (limit table) | Fixed list | Bodily injury (BI) | New row | Limit greater than zero; premium zero or more | The limit must be greater than zero / The premium cannot be negative"
      - "New rate | Effective from / Effective to | Date | dd-MMM-yyyy | Y (from) | - | Today | New row | To on or after from | Enter the effective-from date / The effective-to date is before the effective-from date"
    actions:
      - "New Rate | MASTER_MAINTAIN (Business Administrator) | Always | Opens the dialog of the current tab; Save for Authorization | Pending Authorization | -"
      - "Authorize / Deactivate | MASTER_AUTHORIZE / MASTER_MAINTAIN | As on Insurers | Authorises the row or ends its use | Active / Inactive | -"
    rules:
      - "The row in force on the rating date applies; statutory rates keep their effective-date look-up and do not follow the package version (FR-PM-051)."
      - "A period without a short-period row, or a motor limit not in the table, is refused at rating (FR-PM-051)."
    outcome: Every charge applied to a premium comes from one authorised, effective-dated table.
    frs: [FR-PM-051]
    tests: [RATES]

  - id: SCR-PM-20
    title: Sales Organisation
    route: /catalog/sales-organisation
    purpose: >-
      The sales organisation of the company: regions, departments and teams with their cost centres, and the account
      officers of each team. Accounts are stamped with the creator's units and cost centre when they are created.
    entry:
      - Sidebar entry Sales Organisation
    shots:
      - {state: tree, user: badmin, caption: "Sales Organisation tree"}
    fields:
      - "Tree | [Unit line] | Tree | Code, name, level · cost center (inherited when blank), status | - | Sales units | - | Read only | - | No sales unit defined yet."
      - "Tree | [Account officer line] | Tree | User name of the officer, status | - | Sales officers | - | Read only | - | -"
      - "New sales unit | Level | Drop-down | Region, Department, Team | Y | Fixed list | Region | New unit | A department belongs to a region; a team to a department | A <level> must belong to a <parent level>"
      - "New sales unit | Code / Name | Text | Unit code and name | Y | - | Blank | New unit | Unique | Sales unit already exists: <key>"
      - "New sales unit | Cost center | Text | Blank = inherited from the parent | N | - | Blank | New unit | - | -"
      - "New sales unit | Parent | Drop-down | Units of the level above | Cond.: department and team | Sales units | Select | New unit | - | -"
      - "Assign account officer | Team | Drop-down | Teams | Y | Sales units | Select | New assignment | An existing team | Unknown team <team code>"
      - "Assign account officer | User name | Text | BIBS user | Y | Users | Blank | New assignment | An existing user | Unknown user <username>"
    actions:
      - "New Unit | MASTER_MAINTAIN | Always | Opens New sales unit; Save for Authorization | Pending Authorization | -"
      - "Assign Officer | MASTER_MAINTAIN | Always | Opens Assign account officer; Save for Authorization | Pending Authorization | -"
      - "Authorize / Deactivate | MASTER_AUTHORIZE / MASTER_MAINTAIN | Per unit or officer | Authorises or ends the unit or assignment | Active / Inactive | -"
    rules:
      - "The sales organisation is a New Business master (BRD-1, sales hierarchy and production reporting) kept in the Product Maintenance section of the menu; it is loaded at go-live by the data migration."
    outcome: Every account and production report is attributed to the right region, department, team and officer.
    frs: []
    tests: [SALESORG]

  - id: SCR-PM-21
    title: Premium Calculator
    route: /catalog/calculator
    purpose: >-
      Rates a product with the charges in force, for an insurer and branch, annual, pro-rata or short period, for a new
      account or an endorsement over the remaining term, and shows every charge and the commission. For a package it
      shows the version that priced it; an earlier released version can be chosen for information.
    entry:
      - Sidebar entry Premium Calculator
    shots:
      - {state: filled, user: ao, fill: calculator_package, submit: "^calculate$", caption: "Premium Calculator: a package priced on its version in force"}
    fields:
      - "Cover | Product | Drop-down | Code – name of the active products | Y | Active products | Select | - | - | Choose a product."
      - "Cover | Insurer | Drop-down | Insurers of the panel | N | Insurers | Product default commission | - | A package with a panel accepts only its panel insurers | Insurer <insurer code> is not on the panel of <product code> version <version no>"
      - "Cover | Insurer branch (LGT) | Drop-down | Branch name (LGT %) | N | Insurer branches | No LGT | - | An authorised branch of the insurer | Branch <branch code> is not authorized or inactive"
      - "Cover | Period basis | Drop-down | Annual, Pro-rata (days), Short period (table) | N | Fixed list | Annual | - | Pro-rata and short period need the period | Pro-rata and short-period rating need the period (for endorsements: the remaining term)."
      - "Cover | From / To | Date | dd-MMM-yyyy | Cond.: pro-rata or short period | - | Blank | - | To after From | The period end must be after the period start"
      - "Cover | Commission % override | Number | Percentage | N | - | Blank | - | - | -"
      - "Cover | Package version | Drop-down | Version in force, or an earlier released version | N | Released and superseded versions | Version in force | - | Shown when the package has two or more sold versions | -"
      - "Cover | Endorsement (remaining term, may return premium) | Check box | - | N | - | Not ticked | - | Only an endorsement may reduce the sum insured | Only an endorsement may reduce the sum insured."
      - "Cover | Multi-year own damage factor | Check box | Motor multi-year products | N | - | Not ticked | - | - | -"
      - "Items | Item / Sum insured | Text / Number | Label; amount in PHP | Y (a sum insured for at least one item) | - | Blank | - | Zero or more | Enter the sum insured of at least one item."
      - "Items | Rate % | Number | Blank = product default (non-motor) | N | - | Blank | - | A rate other than the scheme rate is priced but flagged | Enter the premium rate of <item>"
      - "Items | Excess BI limit / PD limit | Number | Motor limits of the table | N | Motor limit table | Blank | - | A limit of the table | <coverage> limit <amount> is not in the limit table"
      - "Result | [Version line] | Banner | Priced on package version n (effective dd-MMM-yyyy, scheme rate r%); not the current version; an item rate differs from the scheme rate | - | Package version | - | Read only | - | -"
      - "Result | Sum insured / Net premium / Gross premium / Commission | Figure | Amounts in PHP | - | Premium computation | - | Read only | - | -"
      - "Result | Component / Basis / Amount | Table | Annual premium, net premium, documentary stamp tax, premium tax, VAT, fire service tax, local government tax, total charges, commission, VAT on commission | - | Premium computation | - | Read only | - | -"
    actions:
      - "Add Item / Remove | Every user of the screen | Always | Adds or removes an item | - | -"
      - "Calculate | Every user of the screen | Product chosen and a sum insured entered | Rates the cover and shows the result | - | -"
    rules:
      - "New business is priced on the package version in force on the transaction date, not on the period start (FR-PM-051)."
      - "A version other than the one in force is shown for information only; a quotation needs the current version or an approved rate exception (FR-PM-051)."
      - "An item rate different from the scheme rate (or the panel insurer's rate) is priced but flagged; a quotation with it needs an approved rate exception (FR-PM-051)."
      - "An expired or retired package, or a package with no version in force, cannot be priced for new business (FR-PM-052)."
    outcome: Anyone can check what a package costs today, and on which version, before quoting it.
    frs: [FR-PM-051, FR-PM-052]
    tests: [CALC]

  - id: SCR-PM-22
    title: "Quotation: package rate scheme and rate exception"
    route: /quotations/:id
    parent: /quotations
    purpose: >-
      Where New Business meets the package version: the quotation record of a package product shows the version that
      priced it and warns when an item rate differs from the scheme rate. The Account Officer then requests a rate
      exception, which an approver decides in My Approvals; the quotation is submitted with the approved exception. Only
      the rate scheme panel and the Request Rate Exception dialog are specified here; the rest of the quotation record
      is specified in the New Business set (SCR-NB-07).
    entry:
      - Quotations › a row (New Business)
      - New Quotation › Submit for Review refused with the rate scheme message
    shots:
      - {state: deviation, user: ao, open: quotation_deviation, caption: "Rate scheme panel: an item rate differs from the scheme rate"}
      - {state: exception, user: ao, open: quotation_deviation, click: "^request rate exception$", caption: "Request Rate Exception dialog"}
    fields:
      - "Rate scheme panel | [Version line] | Banner | Priced on package version n; An item rate differs from the scheme rate: submission needs an approved rate exception | - | Quotation pricing | - | Read only | Warning while an item rate differs | Package <product code> is priced on the current rate scheme: <what> needs an approved rate exception"
      - "Rate scheme panel | [Exceptions] | Rows | Exception reference, rate n% until dd-MMM-yyyy, status pill | - | Rate exceptions of the quotation | - | Read only | - | -"
      - "Request Rate Exception | Item rate % | Number | 0 to 100 | Y | - | The rate of the first item | Draft quotation | 0 to 100 | Enter the item rate between 0 and 100"
      - "Request Rate Exception | Valid until | Date | dd-MMM-yyyy | N | - | The quotation's valid-until date | Draft quotation | Not in the past | The validity date cannot be in the past"
      - "Request Rate Exception | Reason | Text | Free text | Y | - | Blank | Draft quotation | Not blank | Explain why the scheme rate cannot be used"
    actions:
      - "Request Rate Exception | Marketing (QUOTE_MAINTAIN) | Draft quotation of a package with an item rate that differs | Opens the dialog; Request Exception records the exception for this quotation, pending approval | Exception pending authorisation | -"
      - "[Decision in My Approvals] | Business Administrator, New Business Approver (PRODUCT_AUTHORIZE), not the requester | Exception pending | Approves (authorises) or rejects (deactivates) the exception | Active or Inactive | -"
    rules:
      - "Only package rate schemes need an exception; an exception names the rate or the version it approves and the transaction (quotation number or ARN) (FR-PM-051)."
      - "Submission of the quotation (and of the account) is refused until an approved exception covers the differing rate or version (FR-PM-051)."
      - "The approved exception is stored on the quotation and passed to the accounts created from it (FR-PM-051)."
    outcome: A package is sold on its approved scheme, and any exception is approved by a second person and kept with the transaction.
    frs: [FR-PM-051]
    tests: [QUOTE, APPROVALS]
