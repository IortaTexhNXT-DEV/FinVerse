# UX screen documents of the BRD-3 Product Maintenance set for the BDOI UX Design team: 07 UX Screen Deck, 08 UX
# screen register, 09 image package (docs/deliverables/src/signoff/build_ux_deck.py). The screens, fields, actions,
# walkthroughs and images come from the pack; this file holds what only the UX documents need: who each persona is,
# the images taken for the deck only (more states, the crops of the shared components, the landing page and menu of
# each persona), the changes of the issue and the points for the UX Design team to confirm.

issue:
  version: "2.1"
  date: 29 September 2026
  changes:
    - ref: CHG-PM-2.1-01
      what: The Details of the validation checks name the cover type, the coverages and the insurers by their names
      screens: [SCR-PM-13]
      images: [scr-pm-13-05-validation, scr-pm-13-06-released, wt-a-16, wt-a-17]
    - ref: CHG-PM-2.1-02
      what: >-
        A released version shows its rate scheme, dates and terms as values: amounts with separators, rates with their
        decimals, a dash when empty and long texts wrapped
      screens: [SCR-PM-13]
      images: [scr-pm-13-06-released, wt-a-17]
    - ref: CHG-PM-2.1-03
      what: >-
        The coverages of a request are chosen by name from the coverages of the product line, and the hint Before
        submitting is an information notice
      screens: [SCR-PM-03]
      images: [scr-pm-03-01-empty, scr-pm-03-02-filled, scr-pm-03-03-error, ux-scr-pm-03-saved]
    - ref: CHG-PM-2.1-04
      what: >-
        The actions of the step bar stay on one row, and an action that closes the request off its path (Not
        Proceeded) is shown in red
      screens: [SCR-PM-04, SCR-PM-05]
      images: [scr-pm-04-01-record, scr-pm-04-02-approval, scr-pm-05-01-tab, ux-scr-pm-04-cmp-stepper]
    - ref: CHG-PM-2.1-05
      what: >-
        Authorize and Deactivate of the catalog records (products, coverages and clauses, incentive criteria,
        insurers, rates) through the row action menu, each confirmed in a dialog; a deactivation asks the reason, kept
        in the audit trail; the required documents of a product as a table
      screens: [SCR-PM-11, SCR-PM-12, SCR-PM-15, SCR-PM-16, SCR-PM-17, SCR-PM-18, SCR-PM-19]
      images: [scr-pm-11-01-list, scr-pm-12-01-record, scr-pm-15-01-list, scr-pm-15-02-clauses, scr-pm-16-01-list,
               scr-pm-17-01-list, scr-pm-18-01-record, scr-pm-19-01-list]

personas:
  MKT_AO: {who: "An account officer of Retail, Corporate or Combank / Corbank Marketing who serves the clients"}
  MKT_TL: {who: "A team lead, team head or unit head of Marketing"}
  TSU: {who: "An officer of the Technical Support Unit who negotiates with the insurers"}
  TSU_TL: {who: "The team lead of a TSU team"}
  TSU_HEAD: {who: "The team head or head of the Technical Support Unit"}
  MBS: {who: "A member of Marketing Business Services who keeps the product catalogue"}
  MANCOM: {who: "A member of the management committee"}
  BUSINESS_ADMIN: {who: "The business administrator of the catalogue, outside the maker's unit"}
  NB_APPROVER:
    who: "A New Business approver of Marketing"
    does: "Approves or rejects the rate exceptions of the quotations; authorises commission rates as the second user"
  SYSADMIN: {who: "The system administrator of BIBS (BDOI IT operations)"}
  AUDITOR: {who: "An internal or external auditor with read access"}

