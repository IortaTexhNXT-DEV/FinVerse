# UX screen documents of the BRD-3 Product Maintenance set for the BDOI UX Design team: 07 UX Screen Deck, 08 UX
# screen register, 09 image package (docs/deliverables/src/signoff/build_ux_deck.py). The screens, fields, actions,
# walkthroughs and images come from the pack; this file holds what only the UX documents need: who each persona is,
# the images taken for the deck only (more states, the crops of the shared components, the landing page and menu of
# each persona), the changes of the issue and the points for the UX Design team to confirm.

issue:
  version: "2.0"
  date: 28 September 2026
  changes:
    - ref: CHG-PM-2.0-01
      what: Sales Organisation shown as a tree table, with the actions menu of each row and the refused deactivation
      screens: [SCR-PM-20]
    - ref: CHG-PM-2.0-02
      what: >-
        Package Version: the header with its package request, the Validation Checklist of the validator and the
        Validation card of a released version with the checks and the figures compared
      screens: [SCR-PM-13]
      images: [scr-pm-13-01-draft, scr-pm-13-05-validation, scr-pm-13-06-released, wt-a-16, wt-a-17]
    - ref: CHG-PM-2.0-03
      what: The rule parameters of an incentive criterion as a table of parameters and values
      screens: [SCR-PM-16]
      images: [scr-pm-16-02-new]

