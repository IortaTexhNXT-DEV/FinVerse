# Documents generated by BRD-4 Collections. Each is produced by BIBS from the records on screen; the PDF statement
# carries the BDO Insure letterhead and page x of y. The statement template is maintained on the Document Templates
# screen; the files are Excel workbooks (the application file a text file) published on Collections Files.
# Columns: id | document | template | format | produced by | protected | fields and their source | image (slug)
documents:
  - id: DO-01
    name: Statement of account (SOA)
    template: Statement of account template (wording to confirm, CQ18)
    format: PDF, one per billing cycle of an installment plan
    produced: Statement of Account › Download PDF; Send via Email; Billing Run and Generate SOA create the statement
    protected: Yes when e-mailed (password in a separate e-mail)
    fields:
      - "Title and reference: Statement of Account, SOA number and date – from the statement"
      - "Account: Name of the assured, ARN, billing frequency, billing cycle and due date – from the installment plan"
      - "Installments billed: the installment of the cycle and any earlier installment still unpaid (arrears), with invoice, policy year, coverage, due date, amount, paid and balance – from the plan and the invoice ledger"
      - "Amount due and the text of the template: settle the amount on or before the due date; disregard if paid; issued for monitoring only, creates no new receivable"
    shot: doc-soa
    frs: [FR-CL-060, FR-CL-061, FR-CL-062]
  - id: DO-02
    name: Outstanding PR List
    template: (report layout of the Collections reports)
    format: Excel; daily at the end of the day, and on request (Export to Files)
    produced: Collections Files (daily file); PR Worklist › Export to Files
    protected: "No"
    fields:
      - "Client and account: Client Code, Name of Assured, Invoice No., Policy No., Account (ARN), Booking Date, Aging Bracket, Invoicing Branch, Insurer, Product Line, Inception, Expiry – from the invoice ledger"
      - "Amounts: Currency, Total Premium, Outstanding Premium, PR2307 Amount – from the invoice ledger"
      - "Ownership: Market Segment, Sales Unit, Unit Head, Account Officer, Collection Handler – from the sales organisation and the assignments"
      - "Collection work: Client Payment Status, Invoice Category, Disposition, Category (A/B/C), Tagging Owner, Last Collection Effort Date, Last Collection Effort Code, Remarks, Status – from the collection account"
    shot: doc-outstanding-pr
    shot_caption: "first page as generated: the report header and a selection of the columns"
    frs: [FR-CL-083, FR-CL-084]
  - id: DO-03
    name: Full Production Report
    template: (report layout of the Collections reports)
    format: Excel; daily after the end-of-day run (BRD p.63)
    produced: Collections Files (daily file); Report Centre › Full Production Report
    protected: "No"
    fields:
      - "Every collection account of the invoices booked in the period, any status, with the columns of the Outstanding PR List"
    shot: doc-full-production
    shot_caption: "first page as generated: the report header and a selection of the columns"
    frs: [FR-CL-083]
  - id: DO-04
    name: DP PR for Reversal and PR 2307 for Reversal files
    template: (report layout of the Collections reports)
    format: Excel; weekly per unit and branch (Saturday to Friday, available the Monday 08:00) and monthly for the previous month (first working day)
    produced: Collections Files (weekly and monthly files)
    protected: "No"
    fields:
      - "The accounts tagged DP PR for reversal or PR 2307 for reversal in the period, with the columns of the Outstanding PR List – from the collection accounts"
      - "Tagging: Date Tagged, Tagged By, Tag Remarks – from the disposition"
      - "Commission: Basic Commission, VAT on Commission, WTAX Rate and Diff (Premium Balance less PR2307) – from the invoice ledger"
    shot: doc-dp-reversal
    shot_caption: "first page as generated: the report header and a selection of the columns"
    frs: [FR-CL-080, FR-CL-081, FR-CL-082]
  - id: DO-05
    name: For Application To Invoice file
    template: (fixed layout of the daily application file)
    format: Text file, daily before 06:00 for the requests of the previous day (BRCLXN.041-042); Report Centre for any period
    produced: The daily application job; Requests to Cashiering shows the file of each request
    protected: "No"
    fields:
      - "One line per application request: Requested On, Payment Date, Payment File Name, Transaction No., Paid Amount, Currency, Payment Type, Payor, Reference No., Name of Assured, Invoice No., User ID (who made the disposition), Unapplied Reference, Status, Cashiering Reference – from the requests and Cashiering"
    shot: doc-application-file
    shot_caption: "the file as generated, shown field by field (its first line names the fields)"
    frs: [FR-CL-077]
