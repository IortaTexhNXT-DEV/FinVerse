# Guide to the BRD-4 Collections business sign-off pack: the content of the Sign-off Pack Guide deck
# (signoff/build_guide_deck.py) and of the Start Here guide (START_HERE_BRD04.md, ```pack blocks "guide-*").
# The same layout is used for every BRD set; only this file changes.
meta:
  deck_title: Sign-off Pack Guide
  module: Collections
  owner: "Collections and Marketing Support, with Marketing (Corporate, Commercial and Retail)"
  issued: Thu 8-Oct-2026
  signoff_date: Tue 22-Dec-2026

# The documents of the set in reading order. kind = doc type of the file name (brand.READING_ORDER).
documents:
  - {kind: StartHere, name: Collections, ext: docx, what: "Start Here: the map of the pack, who reads what, the steps and the dates", readers: Everyone, when: "First, on issue"}
  - {kind: GuideDeck, name: Collections, ext: pptx, what: "Sign-off Pack Guide: purpose, approach, the module at a glance, caveats and impacts on other modules, entry and exit criteria, change control", readers: "Business owner, unit and section heads; presented at the kick-off", when: "Kick-off session"}
  - {kind: FRS, name: Collections, ext: docx, what: "Functional Requirements Specification v2.1: requirements re-based on the Collections BRD with the minutes of 27-Apr-2026, navigation, 19 screen specifications with screenshots, five walkthroughs, messages, notifications, documents, upload template, cross-BRD contract, user-story view and storyboard index", readers: "Collection handlers and team leads, Marketing AOs and unit heads; Cashiering, Commission Receivables and BDOI IT for their chapters", when: "During the review, with the SIT walkthroughs"}
  - {kind: Signoff, name: Collections, ext: xlsx, what: "Sign-off workbook: one row per screen, field, rule and message with the BU review columns; comments log, meeting minutes, version history, sign-off certificate", readers: "Every reviewer; the business owner signs it", when: "During the review and at sign-off"}
  - {kind: TestPlan, name: Collections, ext: xlsx, what: "Test plan workbook: the test cases traced to the FRs and to the screens, including one screen case and one message case per screen", readers: "Business users who will run UAT; BDOI IT", when: "After the screens; used again in SIT and UAT"}
  - {kind: TestPlan, name: Collections Summary, ext: docx, what: "Test plan summary: scope, approach, coverage and the cases by area", readers: "Business owner, BDOI IT", when: "Before sign-off"}
  - {kind: UXDeck, name: Collections, ext: pptx, what: "UX Screen Deck for the BDOI UX Design team: design foundation, navigation and personas, every walkthrough step by step and every screen with all its states", readers: "BDOI UX Design team", when: "From the issue, in parallel with the review; re-issued with each version of the set"}
  - {kind: UXScreens, name: Collections, ext: xlsx, what: "UX screen register: one row per screen image with the screen, personas, walkthrough and step, state, FRS section and requirements, UXD status and comments, and the Changed in this issue flag", readers: "BDOI UX Design team", when: "Kept by the UX Design team; the changed rows are flagged at each issue"}
  - {kind: UXScreens, name: Collections, ext: zip, what: "Image package: every screen image at twice the screen resolution (PNG), the component crops and the register as CSV", readers: "BDOI UX Design team", when: "Imported into the design tool at each issue"}

# Reading order per role (FRS chapter numbers of v2.1).
reading:
  - role: Business owner (Product Owners; Marketing unit and section heads)
    order: "00 Start Here; 01 Guide deck; FRS chapters 1-3 (context and personas), 14 (walkthroughs), 20 (sign-off), 21 (proposed rules for confirmation) and 22 (user-story view); workbook Sign-off certificate"
  - role: Collection Handlers and Collection Team Leads
    order: "FRS sections 4.2 to 4.7; the screens of chapter 13 (SCR-CL-01 to 13); walkthroughs A, B and D with the storyboard index of chapter 23; messages in chapter 15; the statement of account DO-01 in chapter 17"
  - role: Marketing Account Officers, Handlers and Team Leads
    order: "PR Worklist, Collection Account and Client View (SCR-CL-02 to 04); escalations (SCR-CL-11, 12); walkthroughs A, B and E; the Collections Bulk Update template in chapter 18"
  - role: Unapplied Payment Handlers
    order: "FRS section 4.8; Unapplied Payments, Unapplied Payment and Requests to Cashiering (SCR-CL-14 to 16); walkthrough C; document DO-05"
  - role: Section Heads and set-up users (Business Administrator)
    order: "Assignments, Collections Files and Collections Setup (SCR-CL-17 to 19); Escalation Rules (SCR-CL-13); configuration in chapter 9; the files DO-02 to DO-04"
  - role: "Operations: Cashiering and Commission Receivables (BRD-2)"
    order: "The hand-offs and requests (FRS sections 4.4 and 4.8, chapter 19); the billing statements generated by Operations (section 4.7, walkthrough D steps 2 to 4); walkthrough C (step 3); the DP PR and PR 2307 for Reversal files; FRS section 4.10 for the commission receivable gate"
  - role: Comptrollership
    order: "FRS section 4.10 (commission receivable and incentives, rows FR-CL-090 to 094) and the proposed rules of chapter 21 on them"
  - role: BDOI IT
    order: "Interfaces and integration (chapter 7), non-functional requirements (chapter 8), configuration and jobs (chapter 9), cross-BRD contract (chapter 19); the Technical Specification, reviewed by BDOI IT"
  - role: BDOI UX Design team
    order: "07 UX Screen Deck: design foundation and navigation first, then the personas, walkthroughs and screens of the design work; 08 UX screen register (filter Changed in this issue at each new issue); 09 image package in the design tool"
  - role: iorta TechNXT project team
    order: "All documents; keeps the comments log, the meeting minutes and the version history of the workbook, answers every comment and keeps the traceability to SIT and UAT"

# Approach and step-by-step flow up to closure. raci: R responsible, A accountable, C consulted, I informed.
steps:
  - step: 1
    name: Pack issued
    who: "R: iorta TechNXT Project Manager; A: iorta TechNXT delivery lead; I: all reviewers"
    inputs: "FRS v2.1, workbook, test plan, guide and deck"
    outputs: "Release set v2.1 in the BRD-04 folder; invitations to the sessions"
    duration: "Day 0 (Thu 8-Oct-2026); sessions scheduled after the BRD-2 Operations walkthroughs"
  - step: 2
    name: Kick-off and screen walkthrough on SIT
    who: "R: iorta TechNXT Business Analysis; A: BDOI Product Owner; C: Collections and Marketing Support, Marketing unit heads; I: Operations, BDOI IT"
    inputs: "Guide deck; SIT users with seed data; walkthroughs A to E"
    outputs: "Screens shown live (worklist and account, promises and escalations, unapplied payments, plans and billing, set-up); first questions logged in the comments log; minutes"
    duration: "3 sessions, 23 to 25-Nov-2026"
  - step: 3
    name: Review with the workbook
    who: "R: Collection handlers and team leads, Marketing AOs and unit heads; A: Collections and Marketing Support; C: iorta TechNXT (questions)"
    inputs: "FRS chapters of the area; workbook sheets with the BU review columns"
    outputs: "Every row marked Accept, Change requested or Comment; comments log entries"
    duration: "10 working days after the walkthroughs, until Wed 9-Dec-2026"
  - step: 4
    name: Comments consolidated and a Q&A session
    who: "R: iorta TechNXT Project Manager and Business Analysis; A: BDOI Product Owner; C: reviewers"
    inputs: "Returned workbooks"
    outputs: "One consolidated comments log, each item typed (clarification, correction, change request) and answered; Q&A minutes"
    duration: "3 working days, Q&A on Mon 14-Dec-2026"
  - step: 5
    name: One revision cycle (v2.2)
    who: "R: iorta TechNXT Business Analysis; A: iorta TechNXT delivery lead; C: reviewers who raised the items"
    inputs: "Agreed clarifications and corrections"
    outputs: "Release set v2.2 with the changed rows marked; change requests raised for the rest"
    duration: "2 working days, v2.2 on Wed 16-Dec-2026; check by the reviewers until Fri 18-Dec-2026"
  - step: 6
    name: Sign-off meeting and signature
    who: "R: iorta TechNXT Project Manager; A: BDOI Product Owner; C: Marketing heads, Operations Head, Comptrollership, BDOI IT"
    inputs: "v2.2 (or v2.1 when no revision is needed); open items with their decision"
    outputs: "Signed sign-off certificate; minutes; open items accepted as assumptions or change requests"
    duration: "Tue 22-Dec-2026"
  - step: 7
    name: Content freeze
    who: "R: iorta TechNXT delivery lead; A: BDOI Product Owner; I: BDOI IT, other BRD owners"
    inputs: "Signed set; change requests with mandays"
    outputs: "Content frozen as signed; approved deltas scheduled in the Change Management Register"
    duration: "From Wed 23-Dec-2026"
  - step: 8
    name: Traceability into SIT and UAT
    who: "R: iorta TechNXT test lead; A: BDOI Product Owner; C: business users"
    inputs: "Signed FRS rows and test plan"
    outputs: "SIT and UAT runs traced to the signed screens, rules and messages; results against each row"
    duration: "SIT Jan - Jul 2027; UAT Aug - Dec 2027"

