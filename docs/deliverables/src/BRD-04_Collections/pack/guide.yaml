# Key business rules and validations (highlights; the full list is in the workbook and FRS chapter 13).
rules:
  - "Every booked invoice with premium receivable above the threshold (10.00 by default) is a collection account, refreshed every night from the Operations invoice ledger; Collections keeps no second copy of the money and posts no accounting entry."
  - "New accounts go to a handler by the assignment rules, else to their account officer; team leads reassign accounts permanently or until an end date."
  - "A disposition with an Operations action is handed over inside BIBS: BIR 2307 tags to Cashiering, direct payment accounts to Commission Receivables; there is no check pick-up (removed from scope by Operations); some dispositions are reserved to some roles."
  - "Operations generates and sends the statements of account of the installment plans; the Collections users see them (minutes of 27-Apr-2026)."
  - "Promises to pay are checked every night against the payments applied; a broken promise notifies the collector and escalates the account."
  - "Escalation rules (aging, no commitment, broken promises, overdue installments, amount) escalate accounts every night; a new or changed rule applies only once another user authorizes it."
  - "A request on an unapplied payment is carried out by Cashiering with its own approvals; For Application to Invoice needs a valid invoice number of the ledger."
  - "Updating several accounts at once needs the bulk update permission; an account opened by one user is locked to the others for the edit-lock time."
  - "Files and exports run in the background and are published with the time from which they may be downloaded."

# Caveats and possibilities, and how each is handled.
caveats:
  - topic: Additional requirements
    text: "New needs can surface during the review, SIT or UAT."
    handling: "In-scope clarification when the signed text already covers it; otherwise a change request with mandays."
    example: "A reviewer asks for the bank AO on the PR Worklist: a new column, so a change request; asking which accounts the Credit Balances tab shows is a clarification."
  - topic: Impacts on other modules
    text: "Collections reads the Operations invoice ledger (BRD-2) and hands its work to Cashiering, Commission Receivables and Adjustment. A change of a Collections disposition or request can change what Operations receives."
    handling: "Each change is assessed against the cross-BRD contract (FRS chapter 19); when it touches another set, a delta sign-off of the affected pages of both sets."
    example: "A new disposition that hands accounts to Adjustment needs a new hand-off in Operations: both owners confirm the delta."
  - topic: Other BRDs change Collections
    text: "New Business (booking), Operations (balances, payment application, requests), Product Maintenance (sales organisation), User Access (roles) and Data Migration (legacy follow-up) can change what Collections shows."
    handling: "The change is raised against the other BRD and assessed against the contract; when it touches this set, a delta sign-off of the affected pages only."
    example: "Operations changes the payment application hierarchy: the outstanding by component on the collection account changes and is signed as a delta."
  - topic: Lists of values still to confirm
    text: "The PR and unapplied payment dispositions, the effort codes and the escalation defaults carry provisional values marked to confirm (CQ08, CQ14)."
    handling: "BDOI gives its lists; they are loaded as configuration on the Lists of Values and Collections Setup screens, without a change request."
    example: "BDOI adds the disposition For legal follow-up with category C and Marketing as owner: a list value and its attributes."
  - topic: Commission receivable rows in draft
    text: "The rows on incentives, commission refunds and mixed payments (FR-CL-091 to 094) come from the draft addendum; the minutes of 27-Apr-2026 confirm their intent, not their scope (CQ01)."
    handling: "Signed as proposed rules; confirmed or changed when BDOI signs the addendum."
    example: "If BDOI drops automatic incentive billing, FR-CL-092 is removed in v2.2 without affecting the rest of the set."
  - topic: Integrations pending BDOI IT specifications
    text: "The transfer of the daily application file to the file server FS04 and the Marketing Diary kept in ISYS depend on BDOI IT (OQ17, CQ20)."
    handling: "A download from Collections Files until the transfer is specified; the automatic transfer is then a change request. The technical detail is in the Technical Specification, reviewed by BDOI IT."
    example: "The application file is downloaded each morning and copied to FS04 by Cashiering until the transfer is agreed."
  - topic: Open questions and assumptions
    text: "Open questions of FRS section 10.3 follow the assumptions of section 10.1; chapter 21 lists the proposed rules and clarifications for confirmation."
    handling: "Answered as configuration where possible (lists of values, parameters, templates); otherwise a change request; the assumption stands until then."
    example: "The minimal balance threshold is 10.00 until BDOI confirms it (CQ03); the answer is a parameter value."

# Entry and exit criteria of the sign-off, and the definition of done.
entry:
  - "Every screenshot of the set is taken on the SIT environment with seed data."
  - "Reviewers have their SIT users and the walkthrough sessions are held."
  - "The test plan is traced to the FRS and to the screens."
  - "The BRD-2 Operations walkthroughs are held (the invoice ledger and the Cashiering screens are the input and the output of Collections)."
exit:
  - "Every row of the workbook reviewed by its team (Accept, Change requested or Comment)."
  - "Every comments log item closed: answered, corrected in v2.2, or raised as a change request."
  - "Open questions closed or accepted as assumptions."
  - "The sign-off certificate signed by every signatory of the Who signs what matrix: prepared, input, reviewed and approved as on the Collections BRD approval sheets; the Product Owner approves the whole set."
done:
  - "Signed certificate filed with the set; version history updated."
  - "Content frozen as signed; deltas listed in the Change Management Register with mandays."
  - "Test plan agreed for SIT and UAT."

# Handover checklist.
handover:
  - "Signed FRS, sign-off workbook and screens"
  - "Open questions closed or accepted as assumptions"
  - "Configuration inputs from the business: the PR and unapplied payment dispositions with their category, owner, Operations action and reserved roles, effort codes, escalation reasons and rules, billing frequencies, the threshold, aging brackets and edit-lock time, the assignment rules and the Unit Heads, the statement of account wording, users and roles"
  - "Agreed test plan"
  - "Migration mapping of the open collection follow-up (dispositions, promises, installments, collectors) signed (BRD-13)"
handover_note: "After sign-off the content is frozen as signed and the approved deltas are scheduled."

