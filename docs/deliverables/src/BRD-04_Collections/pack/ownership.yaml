# Who signs what in the BRD-4 Collections sign-off set: one definition, read by 00 Start Here, the 01 guide deck, the
# sign-off certificate of the 03 workbook, the Drop closure summary and the drop index (signoff_pack.py, "ownership").
# The roles and units are those of the approval sheets of the Collections BRD: the Collection Management System BRD
# (p.95-96), the renumbering addendum (p.36) and the signed Collections Addendum of the workshop (p.24); a role the set
# adds is marked "Added for this set". The "Validated by" signatories of p.96 sign here as reviewers.
# The set holds business content only; the technical content is in the Technical Specification, reviewed by BDOI IT.
source: "Collections BRD approval sheets: CMS BRD p.95-96 (Prepared, Reviewed, Validated, Approved by), renumbering addendum p.36 and Collections Addendum p.24"

# id: short (matrix cells), role, organisation, capacity (as on the approval sheet), confirms, sheet (where the role
# is on the approval sheet).
roles:
  - {id: ITN, short: iorta TechNXT, role: "iorta TechNXT project team: Project Manager, Business Analysis, test lead", org: iorta TechNXT, capacity: Prepared by, confirms: "The set is complete and consistent as issued, traced to the BRD and to the screens; every comment is answered in the comments log", sheet: Added for this set (author of the FRS set)}
  - {id: BA, short: BA (BPS), role: "Business Analyst, Enterprise Services Group - Business Project Services (BPS) (Zean C. Ibay)", org: BDO Unibank ESG, capacity: Prepared by, confirms: "The set states the BRD requirements as written; every departure is listed in the proposed rules and clarifications", sheet: "Prepared by (p.95 and p.36)"}
  - {id: MKTI, short: Collections & Marketing input, role: "Collections and Marketing Support, HO Marketing Support BBG, Operations, Marketing and Business Services, Marketing - Head Office, Marketing Business Services and System Support (Pia Grace M. Pinili, Maria Victoria Evangelista, Grace Tordesillas, Ma. Fides E. Rivera, Arra R. Rivera, Rhommel Mark Galler)", org: BDOI, capacity: Input provided by, confirms: "The worklist, collection account, disposition, promise, installment, escalation, billing statement and unapplied payment screens, fields, rules and messages match the business input", sheet: "Reviewed by (p.95, p.36, p.24); Input Provider in the intended audience (p.39)"}
  - {id: OPSI, short: FT&P input, role: "Operations: Financial Transactions and Processing (Perjelyn Joy Gutierrez)", org: BDOI, capacity: Input provided by, confirms: "The hand-offs to Cashiering and Commission Receivables, the requests on unapplied payments and the reversal files match what Operations carries out", sheet: "Reviewed by (p.95); Input Provider (p.39)"}
  - {id: OPSH, short: Operations Head, role: "VP and Head, BDOI Operations (John Benedict S. Santos)", org: BDOI, capacity: Reviewed by, confirms: "The Collections process with Operations and the caveat of p.95: exports and downloads run in the background and do not slow the system", sheet: "Reviewed by, with the caveat on exports (p.95)"}
  - {id: IT, short: BDOI IT, role: "BDOI Information Technology Group: IT Core Business Delivery (Reynaldo Valera Jr.) and IT AIO Core Business Delivery - Insurance (Wynonah Allyssa D. Agojo)", org: BDOI, capacity: Reviewed by, confirms: "Scheduled runs and files, user access and menus, the hand-offs inside BIBS and the Technical Specification (a separate document); not the business screens", sheet: "Validated by and Prepared by (p.95-96); Reviewed by (p.36)"}
  - {id: PGM, short: Program Manager (BPS), role: "Program Manager, Enterprise Services Group - Business Project Services (BPS) (Dan Ace Cauton)", org: BDO Unibank ESG, capacity: Approved by, confirms: "Traceability of every BRD requirement to the set and completeness of the set", sheet: "Validated by (p.96); Approved by (p.36); Reviewed by (p.24)"}
  - {id: PO, short: Product Owner, role: "Product Owner, AVP (Shellah Marie C. Miranda)", org: BDOI, capacity: Approved by, confirms: "Owns the set and approves all of its contents", sheet: "Approved by (p.96, p.36, p.24)"}
  - {id: PO2, short: Product Owner (Operations), role: "Product Owner, AVP (Jose Melvin Jarin)", org: BDOI, capacity: Approved by, confirms: "The addendum functions: escalation, bulk update, reassignment, installments, promises, billing statements", sheet: "Approved by (p.24)"}
  - {id: MKTH, short: Marketing heads, role: "Unit Head - Combank and Corbank (Mark Joseph C. Makalintal) and Heads of Retail Marketing (Edmundante F. Ramirez, Roderick Lim)", org: BDOI, capacity: Approved by, confirms: "The collector screens, rules and messages for the Corporate, Commercial and Retail Marketing units", sheet: "Approved by (p.24)"}
  - {id: COMP, short: Comptrollership, role: "Head - Comptrollership, VP (Ronald Allan E. De Leon)", org: BDOI, capacity: Approved by, confirms: "The commission receivable gate and the draft rows on incentives, commission refunds and mixed payments", sheet: "Approved by (p.24)"}

# Part of the set -> role ids that prepare it, provide input, review it and approve it (RACI style).
parts:
  - {part: "Screens and fields (FRS screen specifications; workbook Screen catalogue, Field register)", prepares: [ITN], input: [MKTI, OPSI], reviews: [PGM, OPSH], approves: [PO, PO2, MKTH]}
  - {part: "Business rules and validations", prepares: [ITN], input: [MKTI, BA], reviews: [PGM, OPSH], approves: [PO, PO2, MKTH]}
  - {part: "Messages and notifications", prepares: [ITN], input: [MKTI], reviews: [PGM], approves: [PO, MKTH]}
  - {part: "Documents, files and reports (statement of account, worklist and reversal files, application file, reports)", prepares: [ITN], input: [MKTI, OPSI], reviews: [PGM, OPSH], approves: [PO, MKTH]}
  - {part: "Commission receivable gate and the draft rows on incentives (FR-CL-090 to 094)", prepares: [ITN], input: [BA, OPSI], reviews: [PGM], approves: [PO, PO2, COMP]}
  - {part: "Walkthroughs (end-to-end, screen by screen)", prepares: [ITN], input: [MKTI], reviews: [PGM], approves: [PO]}
  - {part: "Proposed business rules and clarifications for confirmation", prepares: [ITN, BA], input: [MKTI, OPSI], reviews: [PGM, OPSH], approves: [PO, PO2, MKTH]}
  - {part: "Scheduled runs and files, hand-offs inside BIBS, user access and menus by persona", prepares: [ITN], input: [MKTI], reviews: [IT, OPSH], approves: [PO]}
  - {part: "Test plan (04 workbook, 05 summary)", prepares: [ITN], input: [MKTI], reviews: [PGM, IT], approves: [PO]}
  - {part: "UX screen deck, UX screen register and image package (07 to 09, for the BDOI UX Design team; the screens as specified in this set)", prepares: [ITN], input: [MKTI], reviews: [PGM], approves: [PO]}
  - {part: "Technical Specification (separate document, not part of the business sign-off)", prepares: [ITN], input: [IT], reviews: [IT], approves: [IT]}
