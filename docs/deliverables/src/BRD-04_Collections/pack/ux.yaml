# UX screen documents of the BRD-4 Collections set for the BDOI UX Design team: 07 UX Screen Deck, 08 UX screen
# register, 09 image package (docs/deliverables/src/signoff/build_ux_deck.py). The screens, fields, actions,
# walkthroughs and images come from the pack; this file holds what only the UX documents need: who each persona is,
# the images taken for the deck only (more states of a screen, the landing page and menu of each persona), the
# changes of the issue and the points for the UX Design team to confirm.

issue:
  version: "2.1"
  date: 8 October 2026
  # Re-base on the Collections BRD with the minutes of 27 April 2026 and the Operations Cashiering annex.
  changes:
    - ref: CHG-CL-2.1-01
      what: >-
        Check pick-up removed from scope: no For check pick-up disposition and no pick-up details in Record
        Disposition; walkthrough A ends at the first collection effort (its steps 5 and 6 are retired)
      screens: [SCR-CL-02, SCR-CL-03]
      images: [scr-cl-02-03-reassign, wt-a-04]
    - ref: CHG-CL-2.1-02
      what: >-
        Billing statements generated, sent and cancelled by the Operations billing user; Collections users see the
        statements read only (Billing Run, Generate SOA, Send via Email and Cancel Statement not offered to them)
      screens: [SCR-CL-06, SCR-CL-09, SCR-CL-10]
      images: [scr-cl-06-01-record, scr-cl-06-02-actions, scr-cl-09-01-list, scr-cl-09-02-run, scr-cl-10-01-record,
               scr-cl-10-02-send, wt-d-02, wt-d-03, wt-d-04]
    - ref: CHG-CL-2.1-03
      what: >-
        Collections Home: tiles Broken Promises, Promises Due, Overdue Installments and Open Escalations for the
        handlers and team leads (proposed, CLR-CL-35)
      screens: [SCR-CL-01]

# The personas whose landing page and full menu the deck shows.
navigation:
  roles: [MKT_AO, MKT_TL, MKT_HANDLER, MKT_COLLECTION, CLX_TL, MKT_SECTION_HEAD, UNAPPLIED_HANDLER, PROCESSOR, CASHIER,
          DISBURSEMENT, COMPTROLLERSHIP, BUSINESS_ADMIN, SYSADMIN, AUDITOR]
  # The Unapplied Payment Handler has the same menu as the Marketing Handler.
  shared:
    ux-nav-07-menu: BRD-04:ux-nav-03-menu

# Who each persona is (what they do comes from the persona table of the FRS unless given here).
personas:
  MKT_AO: {who: "A Marketing account officer who follows up the premium of the own accounts"}
  MKT_TL: {who: "A Marketing team lead who acts on escalations, reassigns accounts and updates several accounts at once"}
  MKT_HANDLER: {who: "A Marketing handler who follows up the accounts of the unit, also several at once"}
  MKT_COLLECTION: {who: "A collection handler who works the accounts assigned to her: efforts, dispositions, promises and installment plans; she sees the statements"}
  CLX_TL: {who: "The team lead of the collection handlers, who assigns the accounts and acts on the escalations"}
  MKT_SECTION_HEAD: {who: "The head of the Corporate or Retail section, who keeps the Collections set-up and reads the audit log"}
  UNAPPLIED_HANDLER: {who: "A handler of the unapplied payments, who records the dispositions and the requests to Cashiering"}
  PROCESSOR: {who: "A Processing officer, who records the disposition No / missing policy number"}
  CASHIER: {who: "A cashier who reads the Collections screens and carries out the collector requests; the Cashiering Team Leader / Head generates the statements of account"}
  DISBURSEMENT: {who: "A Disbursement officer with read access to Collections and its files"}
  COMPTROLLERSHIP: {who: "A Comptrollership officer with read access to Collections"}
  BUSINESS_ADMIN: {who: "The business administrator who keeps the Collections set-up and the escalation rules"}
  SYSADMIN: {who: "The system administrator of BIBS (BDOI IT operations)"}
  AUDITOR: {who: "An internal or external auditor with read access to Collections and its audit log"}

