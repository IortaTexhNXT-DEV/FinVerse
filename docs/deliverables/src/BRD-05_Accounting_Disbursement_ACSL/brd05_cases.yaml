        msg: [Enter at least one fieldwork day before submitting, PRQ_LIQUIDATION_EMPTY]
      - c: 3
        type: Boundary
        neg: true
        title: 61 fieldwork days
        steps:
          - Enter 61 days.
        expected: The liquidation is refused; 60 are accepted.
        msg: [A liquidation has up to 60 fieldwork days, PRQ_LIQUIDATION_LINES]
      - c: 3
        type: Negative
        title: Day without particulars
        steps:
          - Enter a day with date and no particulars.
        expected: The liquidation is refused.
        msg: [Every fieldwork day needs its date and particulars, PRQ_LIQUIDATION_LINE]
      - c: 3
        type: Negative
        title: Negative expense
        steps:
          - Enter a transport expense of -100.00.
        expected: The liquidation is refused.
        msg: [Expenses are zero or positive with at most two decimals, PRQ_AMOUNT_INVALID]
      - c: 3
        type: Negative
        persona: PRQ_REVIEWER
        title: Account of an expense role not set
        pre: The test lead clears the account of role LODGING on Liquidation Accounts.
        steps:
          - Post a liquidation with a lodging expense.
        expected: The posting is refused. Restore the account afterwards.
        msg: ["Comptrollership has not set the account of {LODGING} for liquidations (AQ02)", PRQ_LIQUIDATION_ACCOUNT_MISSING]
      - c: 3
        type: Negative
        screen: SYS
        title: Change a posted liquidation
