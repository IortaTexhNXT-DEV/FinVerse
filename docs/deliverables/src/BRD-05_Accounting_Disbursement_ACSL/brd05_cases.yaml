  FR-PQ-017:
    scenario: SC-DPA-08
    persona: PRQ_PROCESSOR
    screen: REQ
    data: [TD-DPA-05, TD-DPA-08]
    conditions:
      - After a cash advance is disbursed the employee records up to 60 fieldwork days and submits; the checker posts it with the excess or shortage.
