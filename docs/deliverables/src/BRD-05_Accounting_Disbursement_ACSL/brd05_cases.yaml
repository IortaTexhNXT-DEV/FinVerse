        expected: The check is PRINTED again; the edit is APPLIED.
      - c: 1
        type: Workflow
        persona: DISB_TL
        title: Reject a status edit
        steps:
          - Reject a requested edit with a reason.
        expected: The edit is REJECTED and the status stays.
      - c: 2
        type: Negative
        title: Status of another mode
        steps:
          - Request the status Debited on a check.
        expected: The request is refused.
        msg: ["{DEBITED} is not another status of a {Check}", STATUS_EDIT_INVALID]
      - c: 2
        type: Negative
        title: Second pending edit
        steps:
          - Request a second edit while one is pending.
        expected: The request is refused.
        msg: [A status edit of this instrument already waits for approval, STATUS_EDIT_PENDING]
      - c: 2
        type: Negative
        persona: DISB_TL
        title: Instrument changed meanwhile
        steps:
          - While an edit is pending, the check is negotiated by the upload; approve the edit.
        expected: The approval is refused.
        msg: ["The instrument is now {NEGOTIATED}; request the edit again", STATUS_EDIT_STALE]
      - c: 2
        type: Security-access
        persona: DISB_TL
        title: Requester approves the own edit
        steps:
          - As disbtl, request an edit and approve it.
        expected: The approval is refused.
        msg: [A status edit cannot be approved by its requestor, MAKER_CHECKER_VIOLATION]

