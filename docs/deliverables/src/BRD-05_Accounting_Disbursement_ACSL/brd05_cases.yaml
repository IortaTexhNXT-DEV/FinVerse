      - c: 1
        type: Positive
        persona: FRBS_HEAD
        title: Re-assign to glhead
        steps:
          - Re-assign the same journal to glhead.
        expected: The journal leaves gltl's list and appears in glhead's.
      - c: 2
        type: Negative
        persona: FRBS_HEAD
        title: Assign to the submitter
        steps:
          - Assign a journal submitted by gltl to gltl.
        expected: The assignment is refused.
        msg: ["{JV-2026-00012} cannot be assigned to the user who submitted it", ASSIGNEE_IS_MAKER]
      - c: 2
        type: Negative
        title: Assignee who cannot authorise
        steps:
          - Assign a journal to glofficer.
        expected: The assignment is refused.
        msg: ["{glofficer} is not allowed to authorize journals", ASSIGNEE_NOT_AUTHORIZER]

  FR-AC-032:
    scenario: SC-AC-04
    persona: FRBS_PROCESSOR
    screen: NEWJ
    data: [TD-AC-05]
    conditions:
      - The GL Officer prepares a MANUAL, ADJUSTMENT or ACCRUAL journal with lines by code or short code, saves it as a draft and submits it.
      - Only MANUAL, ADJUSTMENT or ACCRUAL journals are entered by hand.
      - Only the maker changes a draft or returned journal.
      - The reverse-on date must follow the value date.
    cases:
      - c: 1
        type: Positive
        title: Accrual with a short code
        steps:
          - New Journal, type ACCRUAL, value date the month end, reverse on the first of next month, two lines of 5,000.00, one by short code; save.
          - Submit and confirm.
        expected: The account name fills in; the journal saves as DRAFT, then is PENDING_APPROVAL.
      - c: 1
        type: Upload-download
        screen: JOURNALS
        title: Journals uploaded from a file
        steps:
          - Use Journal Upload with the template; one valid voucher and one invalid.
        expected: The valid voucher becomes a draft journal; the invalid one is reported with its reason.
      - c: 2
        type: Negative
        screen: SYS
        title: SYSTEM journal entered by hand
        steps:
          - Send a direct request to create a journal of type SYSTEM.
        expected: The journal is refused.
        msg: ["Only MANUAL, ADJUSTMENT or ACCRUAL journals can be entered manually", INVALID_JOURNAL_TYPE]
      - c: 3
        type: Security-access
        persona: FRBS_TL
        screen: EDITJ
        title: Another user edits the draft
        steps:
          - As gltl, open glofficer's draft and change a line.
        expected: The change is refused.
        msg: ["Only the maker ({glofficer}) can change this journal", NOT_MAKER]
      - c: 4
        type: Boundary
        neg: true
        title: Reverse-on equal to the value date
        steps:
          - Enter an accrual with reverse-on equal to its value date.
        expected: The journal is refused.
        msg: ["The reversal date must be after the value date {date}", REVERSAL_DATE_INVALID]

  FR-AC-033:
    scenario: SC-AC-04
    persona: SYSTEM
    screen: JOURNALS
    data: [TD-AC-05]
    conditions:
      - JOURNAL_AUTO_REVERSAL posts, on the reverse-on date, one REVERSAL journal that mirrors the posted accrual and is linked to it.
      - A journal is reversed once; a second reversal is refused.
    cases:
      - c: 1
        type: Workflow
        title: Accrual of 31 August reversed on 1 September
        steps:
          - Post the accrual of TD-AC-05 dated 31 August with reverse-on 1 September.
          - Run JOURNAL_AUTO_REVERSAL on 1 September (Scheduled Jobs, Run now).
        expected: A REVERSAL system journal dated 1 September mirrors the accrual and is linked to it; the accrual is REVERSED.
      - c: 2
        type: Negative
        title: Job run twice
        steps:
          - Run the job again the same day.
        expected: No second reversal is posted.
      - c: 2
        type: Negative
        persona: FRBS_HEAD
        screen: JOURNAL
        title: Manual reversal of a reversed journal
        steps:
          - As glhead, click Reverse on the accrual already reversed.
        expected: The reversal is refused.
        msg: ["Journal {JV-2026-00031} is already reversed", ALREADY_REVERSED]

  FR-AC-034:
    scenario: SC-AC-04
    persona: FRBS_PROCESSOR
    screen: NEWJ
    data: [TD-AC-05]
    conditions:
      - An unbalanced journal is refused.
      - Lines on non-postable, frozen or closed accounts, wrong currency or branch, or a value date outside the window are refused, all errors together.
      - A BLOCK account that would turn negative is refused; a WARN account shows a warning that can be confirmed.
    cases:
      - c: 1
        type: Negative
        title: Debits 1,000.00 and credits 900.00
        steps:
          - Enter the unbalanced journal of TD-AC-05 and submit.
        expected: The submission is refused.
        msg: ["Journal is not balanced: debit {1000.00} vs credit {900.00}", UNBALANCED_JOURNAL]
      - c: 1
        type: Positive
        title: Balanced journal accepted
        steps:
          - Enter the balanced MANUAL journal of TD-AC-05 and submit.
        expected: The journal is PENDING_APPROVAL.
      - c: 2
        type: Negative
        title: Line on a heading and a frozen account
        steps:
          - Enter a journal with one line on a heading account and one on a frozen account; submit.
        expected: The journal is refused and both errors are listed together.
        msg: ["{list of errors}", JOURNAL_INVALID]
      - c: 2
        type: Boundary
        neg: true
        title: Value date beyond the back-dated window
        pre: Company FVI allows n back-dated days.
        steps:
          - Enter a journal dated n+1 days ago.
        expected: The journal is refused; n days back is accepted.
        msg: ["Value date {date} is earlier than the permitted {n} back-dated days", JOURNAL_INVALID]
      - c: 3
        type: Negative
        title: BLOCK cash account would turn negative
        steps:
          - Credit a BLOCK cash account beyond its balance; submit.
        expected: The journal is refused.
        msg: ["Account {code} would have a negative ({DEBIT}) balance of {amount}", JOURNAL_INVALID]
      - c: 3
        type: Positive
        title: WARN account shows a warning and is confirmed
        steps:
          - Credit 1913.01 (WARN) beyond its balance; submit.
        expected: The confirmation dialog shows the warning; after confirmation the journal is PENDING_APPROVAL.

  FR-AC-035:
    scenario: SC-AC-04
    persona: FRBS_PROCESSOR
    screen: NEWJ
    conditions:
      - Before a journal is submitted or posted, the confirmation dialog shows the totals, line count, dates and warnings.
      - Cancel in the dialog leaves the journal as it was.
    cases:
      - c: 1
        type: Positive
        title: Confirmation before submission
        steps:
          - Submit the balanced journal.
        expected: The dialog shows debit and credit totals, the number of lines and the value date before it is sent.
      - c: 1
        type: Positive
        persona: FRBS_TL
        screen: JOURNAL
        title: Confirmation before posting
        steps:
          - As gltl, click Post on the submitted journal.
        expected: The dialog shows the totals, lines and any warning before posting.
      - c: 2
        type: Negative
        title: Cancel in the dialog
        steps:
          - Submit a draft and click Cancel in the dialog.
        expected: The journal stays DRAFT, unchanged.

  FR-AC-036:
    scenario: SC-AC-04
    persona: FRBS_TL
    screen: JOURNALS
    data: [TD-AC-05]
    conditions:
      - The poster posts one or several journals; each is validated and posted on its own and the result lists successes and refusals.
      - The poster returns a journal with remarks; the maker edits and resubmits it.
      - A journal is never posted by its submitter nor above the poster's limit, and only in the right status.
    cases:
      - c: 1
        type: Positive
        title: Ten journals of which one is unbalanced
        pre: Ten submitted journals, one made unbalanced by the test lead in the test environment.
        steps:
          - Select the ten journals and click Post.
        expected: Nine are POSTED; the result lists the refused one with its reason.
      - c: 2
        type: Workflow
        title: Return to Maker with remarks
        steps:
          - Open a submitted journal, enter remarks and click Return to Maker.
          - As glofficer, edit it and submit it again.
        expected: The journal is REJECTED with the remarks, editable by glofficer, then PENDING_APPROVAL again.
      - c: 2
        type: Negative
        title: Return without remarks
        steps:
          - Click Return to Maker with the remarks blank.
        expected: The return is refused.
        msg: [Enter the reason, "-"]
      - c: 3
        type: Security-access
        title: Poster is the submitter
        steps:
          - As gltl, submit a journal and try to post it.
        expected: The posting is refused.
        msg: [A journal cannot be authorized by the user who submitted it, MAKER_CHECKER_VIOLATION]
      - c: 3
        type: Boundary
        neg: true
        title: Journal above the authorisation limit
        pre: The test lead gives gltl an authorisation limit of 100,000.00.
        steps:
          - Post a journal of 100,000.01.
        expected: The posting is refused; 100,000.00 is accepted.
        msg: ["Journal total {100000.01} exceeds your authorization limit {100000.00}", AUTHORIZATION_LIMIT_EXCEEDED]
      - c: 3
        type: Negative
        screen: SYS
        title: Post a journal that is already posted
        steps:
          - Send a direct request to post a journal that is already POSTED.
        expected: The request is refused.
        msg: ["Cannot {approve} journal {JV-2026-00012} in status {POSTED}", INVALID_JOURNAL_STATUS]

  FR-AC-037:
    scenario: SC-AC-04
    persona: FRBS_PROCESSOR
    screen: EDITJ
    conditions:
      - Draft and returned journals are edited by their maker.
      - A posted journal is never edited; it is reversed and entered again.
    cases:
      - c: 1
        type: Positive
        title: Returned journal edited and resubmitted
        steps:
          - Open the returned journal, change a line amount on both sides, submit.
        expected: The journal is PENDING_APPROVAL with the new amounts.
      - c: 2
        type: Negative
        screen: JOURNAL
        title: Posted journal has no Edit action
        steps:
          - Open a posted journal; send a direct request to change a line.
        expected: No Edit action is shown; a direct request is refused.
        msg: ["Cannot {edit} journal {JV-2026-00012} in status {POSTED}", INVALID_JOURNAL_STATUS]
      - c: 2
        type: Workflow
        persona: FRBS_HEAD
        screen: JOURNAL
        title: Head reverses a posted journal with a reason
        steps:
          - As glhead, click Reverse on a posted journal and give the reason.
        expected: A linked reversal journal is posted and the original is REVERSED.

  FR-AC-040:
    scenario: SC-AC-05
    persona: FRBS_TL
    screen: GLCLOSE
    conditions:
      - BIBS proposes the 2nd banking day at 17:00; GL_PERIOD_CLOSE runs the due close through the checklist.
      - Only the previous month may be closed.
      - A close with blocking items fails, records them and raises GL_CLOSE_FAILED.
      - A scheduled close can be withdrawn; a period already scheduled or not closable is refused.
    cases:
      - c: 1
        type: Workflow
        title: Close of the previous month at its time
        steps:
          - Open Month-End Close; accept the proposed date (2nd banking day, 17:00); schedule.
          - At the time (or Run now of GL_PERIOD_CLOSE), open the schedule.
        expected: The schedule is COMPLETED and the period CLOSED.
      - c: 2
        type: Negative
        title: On 1 October August is refused
        pre: Today is 1 October (clock of SIT set by the test lead).
        steps:
          - Schedule the close of August; then of September.
        expected: August is refused; September is accepted.
        msg: ["On {2026-10-01} only the period of {September 2026} may be closed, not {August 2026}", CLOSE_ONLY_PREVIOUS_MONTH]
      - c: 3
        type: Negative
        screen: ALERTS
        title: Close with unposted journals fails
        steps:
          - Leave a journal PENDING_APPROVAL in the month; run the scheduled close.
        expected: The schedule is FAILED with the blocking items listed; GL_CLOSE_FAILED is raised.
        msg: ["{blocking items}", GL_CLOSE_CHECKLIST]
      - c: 4
        type: Workflow
        title: Withdraw a scheduled close
        steps:
          - Withdraw the scheduled close; try to withdraw it again.
        expected: The schedule is CANCELLED; the second withdrawal is refused.
        msg: ["The scheduled close is already {CANCELLED}", CLOSE_SCHEDULE_NOT_ACTIVE]
      - c: 4
        type: Negative
        title: Second schedule for the same period
        steps:
          - Schedule the close of September twice.
        expected: The second schedule is refused.
        msg: ["{September 2026} already has a scheduled close", CLOSE_ALREADY_SCHEDULED]
      - c: 4
        type: Negative
        screen: SYS
        title: Period already closed
        steps:
          - Send a direct request to close a CLOSED period now.
        expected: The close is refused.
        msg: ["{August 2026} is {CLOSED}", PERIOD_NOT_CLOSABLE]
      - c: 1
        type: Security-access
        persona: FRBS_PROCESSOR
        title: GL Officer cannot schedule the close
        steps:
          - As glofficer, open the address of the GL Close & Cut-Off screen directly in the browser.
        expected: The screen is refused; a direct request is refused.

  FR-AC-041:
    scenario: SC-AC-05
    persona: FRBS_TL
    screen: YEAREND
    conditions:
      - The year-end close zeroes the nominal accounts into retained earnings, opens the next year and the verification shows nominal balance and trial-balance difference 0.00.
      - YEAR_END_CLOSE_DUE is raised 15 days before the deadline while the year is open.
      - A year with open periods, a failing checklist, a year already closed or a verify without a close is refused.
    cases:
      - c: 1
        type: Workflow
        title: Close and verify 2025
        steps:
          - With all 2025 periods closed, click Close Year for 2025; then Verify.
        expected: Income and expense accounts are zero; retained earnings holds the result; the verification shows nominal balance 0.00 and trial-balance difference 0.00.
      - c: 2
        type: Negative
        persona: SYSTEM
        screen: ALERTS
        title: Deadline alert on 1 April
        pre: 2025 open; SIT clock 1 April 2026.
        steps:
          - Run the alert job.
        expected: YEAR_END_CLOSE_DUE is raised for 2025.
      - c: 3
        type: Negative
        title: Year with open periods
        steps:
          - Close the year while December is open.
        expected: The close is refused.
        msg: ["All periods of fiscal year {2025} must be closed first", YEAR_PERIODS_OPEN]
      - c: 3
        type: Negative
        title: Year already closed
        steps:
          - Close 2025 again.
        expected: The close is refused.
        msg: ["Fiscal year {2025} is already closed", YEAR_ALREADY_CLOSED]
      - c: 3
        type: Negative
        title: Verify a year that is not closed
        steps:
          - Click Verify for 2026.
        expected: The verification is refused.
        msg: [The fiscal year has no year-end close to verify, YEAR_NOT_CLOSED]

  FR-AC-042:
    scenario: SC-AC-05
    persona: SYSTEM
    screen: GLCLOSE
    conditions:
      - At 23:00 on the last day of the month the broking books close; broking events of that month are refused while GL adjustments are accepted.
      - A TL reopens the books with a reason and closes them again.
      - A reopen without a reason is refused.
    cases:
      - c: 1
        type: Workflow
        persona: REMIT_TL
        screen: REMIT
        title: Remittance of 30 September after the cut-off
        steps:
          - Let BROKING_BOOKS_CLOSE run at 23:00 on 30 September (or Close now).
          - Approve a remittance batch dated 30 September.
        expected: The posting is refused and the batch stays for approval.
        msg: ["The {remittance} books of {September 2026} are closed", BOOKS_CLOSED]
      - c: 1
        type: Positive
        persona: FRBS_PROCESSOR
        screen: NEWJ
        title: GL adjustment of 30 September accepted
        steps:
          - Post an ADJUSTMENT journal dated 30 September.
        expected: The journal posts; the GL stays open until the GL close.
      - c: 2
        type: Workflow
        persona: FRBS_TL
        title: Reopen for a late remittance and close again
        steps:
          - Click Reopen with reason "Late remittance"; approve the batch; click Close now.
        expected: The batch posts while the books are open; after closing, broking postings are refused again.
      - c: 3
        type: Negative
        persona: FRBS_TL
        title: Reopen without a reason
        steps:
          - Click Reopen with the reason blank.
        expected: The reopen is refused.
        msg: [Enter the reason for reopening the books, REASON_REQUIRED]

  FR-AC-043:
    scenario: SC-AC-05
    persona: FRBS_TL
    screen: FXREV
    data: [TD-AC-03]
    conditions:
      - The revaluation posts the difference at the CLOSING rate to unrealised FX gain or loss and reverses it on the first day of the next period, once per period.
      - A missing CLOSING rate or a period of another company is refused.
    cases:
      - c: 1
        type: Workflow
        title: USD receivable of 1,000.00 from 56.00 to 58.00
        pre: A USD receivable of 1,000.00 booked at 56.00; CLOSING rate 58.00 at the month end.
        steps:
          - Preview the revaluation of the month; run it.
          - Run the register report GL-FXREV.
        expected: An unrealised gain of 2,000.00 is posted and reversed on the first day of the next month; the register lists it.
      - c: 1
        type: Negative
        title: Run twice for the same period
        steps:
          - Run the revaluation of the same month again.
        expected: No second revaluation is posted.
      - c: 2
        type: Negative
        title: No CLOSING rate
        pre: No CLOSING rate of USD at the month end.
        steps:
          - Preview the revaluation.
        expected: The run is refused.
        msg: ["No CLOSING rate for {USD}", RATE_NOT_FOUND]
      - c: 2
        type: Negative
        screen: SYS
        title: Period of another company
        steps:
          - Send a direct request to save the revaluation with the period of another company.
        expected: The request is refused.
        msg: [Period belongs to another company, PERIOD_OTHER_COMPANY]

  FR-AC-050:
    scenario: SC-AC-06
    persona: FRBS_PROCESSOR
    screen: BANKST
    data: [TD-AC-07]
    conditions:
      - The bank file is mapped by the layout of the bank account and imported, and the automatic matching runs at once.
      - The first pass pairs the same check number and amount on any date; the officer finalises the reconciliation.
      - A layout without amount columns or with a bad date pattern is refused; a row with a bad date or amount is refused.
      - A reconciled line cannot be matched again.
    cases:
      - c: 1
        type: Upload-download
        title: Upload the bank file
        steps:
          - Open Bank Statements, choose the bank account and upload the CSV of TD-AC-07.
        expected: The statement is imported with its lines and the matching runs.
      - c: 2
        type: Positive
        screen: BANKREC
        title: Check 000123 matched across dates and finalised
        steps:
          - Open Bank Reconciliation of the statement.
          - Finalise the reconciliation.
        expected: The bank line of check 000123 for 15,000.00 is matched to the book payment of check 000123 though the dates differ; after finalising, the statement shows no unexplained difference.
      - c: 3
        type: Negative
        persona: FRBS_TL
        screen: LAYOUTS
        title: Layout without amount columns
        steps:
          - Save a layout with no amount, debit or credit column.
        expected: The layout is refused.
        msg: [Map either a signed amount column or both debit and credit columns, LAYOUT_AMOUNTS]
      - c: 3
        type: Negative
        persona: FRBS_TL
        screen: LAYOUTS
        title: Invalid date pattern
        steps:
          - Save a layout with date pattern "yyyy-qq-dd".
        expected: The layout is refused.
        msg: ["Invalid date pattern {yyyy-qq-dd}", LAYOUT_DATE_PATTERN]
      - c: 3
        type: Negative
        title: Row with a bad date
        steps:
          - Upload a file whose row 3 has the date 31/02/2026.
        expected: The file is refused and names the row.
        msg: ["Row {3}: invalid date '{31/02/2026}'", INVALID_STATEMENT]
      - c: 4
        type: Negative
        screen: BANKREC
        title: Match a reconciled line again
        steps:
          - Match by hand a statement line already reconciled.
        expected: The match is refused.
        msg: ["Statement line {5} is already reconciled", LINE_ALREADY_MATCHED]

  FR-AC-051:
    scenario: SC-AC-06
    persona: FRBS_PROCESSOR
    screen: REPORTS
    data: [TD-AC-07]
    conditions:
      - The reports list the unmatched book entries, the unmatched bank lines and the reconciliation statement, and export to Excel and PDF.
      - Matched items are not on the unmatched reports.
    cases:
      - c: 1
        type: Report-output
        title: Deposit in transit on the reports
        steps:
          - Run FIN-BRS-UNREC-BOOK and FIN-BRS-STMT for the statement date; export to Excel and PDF.
        expected: The deposit in transit is on the unmatched book report and among the reconciling items of the statement.
      - c: 2
        type: Negative
        title: Matched check not listed
        steps:
          - Run FIN-BRS-UNREC-BANK for the same date.
        expected: Check 000123 is not listed.

  FR-AC-052:
    scenario: SC-AC-07
    persona: FRBS_PROCESSOR
    screen: SFRUNS
    data: [TD-AC-06]
    conditions:
      - A run takes the invoices fully paid in the period, not cancelled, with commission and in no live run, and applies the rate of their segment on the net commission.
      - The run is approved by another user; approval posts the accrual and sends one Disbursement request per line.
      - A run is recomputed, returned or cancelled; a returned payout is sent again.
      - Period, rules and stages are validated.
    cases:
      - c: 1
        type: Positive
        title: CBG invoice with commission 10,000.00 and WTAX 200.00
        pre: A CBG invoice fully paid in the period with commission 10,000.00 and insurer WTAX 200.00.
        steps:
          - Compute a run for the period; open the run.
        expected: The CBG line carries a fee of 245.00 (9,800.00 x 2.5 %).
      - c: 2
        type: Workflow
        persona: FRBS_TL
        screen: SFRUN
        title: Approval posts and sends the payouts
        steps:
          - As glofficer submit the run; as gltl approve it.
        expected: The run is APPROVED; one accrual journal (Dr 5614 / Cr 2250) and one Disbursement request of type SERVICE_FEE per line exist.
      - c: 2
        type: Security-access
        persona: FRBS_TL
        screen: SFRUN
        title: The preparer cannot approve
        steps:
          - As gltl, compute and submit a run; try to approve it.
        expected: The approval is refused.
        msg: [The run is approved by someone other than its preparer, SERVICE_FEE_FOUR_EYES]
      - c: 3
        type: Workflow
        screen: SFRUN
        title: Recompute and cancel a computed run
        steps:
          - Recompute a COMPUTED run after a rule change; then cancel it with a reason.
        expected: The recomputed lines use the new rule; after cancelling, its invoices can be taken by a new run.
      - c: 3
        type: Workflow
        persona: FRBS_TL
        screen: SFRUN
        title: Returned run and payout sent again
        steps:
          - Return a run in FOR_APPROVAL with a reason; resubmit and approve it.
          - Ask Disbursement to return one payout; click Send Again on the line.
        expected: The run is COMPUTED after the return; the returned line is sent again as a new request.
      - c: 4
        type: Negative
        title: Period ending in the future
        steps:
          - Compute a run with an end date tomorrow.
        expected: The run is refused.
        msg: [Give a period that ends on or before today and after it starts, SERVICE_FEE_PERIOD]
      - c: 4
        type: Negative
        title: Nothing to pay
        steps:
          - Compute a run for a period without fully paid invoices left.
        expected: The run is refused.
        msg: ["No invoice fully paid from {from} to {to} is left for a service fee", SERVICE_FEE_NOTHING]
      - c: 4
        type: Negative
        persona: FRBS_TL
        screen: SFRATES
        title: Rate zero on a rule
        steps:
          - Save a rule for segment CBG with rate 0.
        expected: The rule is refused.
        msg: [The rate is a percentage above 0, SERVICE_FEE_RATE]
      - c: 4
        type: Negative
        persona: FRBS_TL
        screen: SFRATES
        title: Rule without start date
        steps:
          - Save a rule with segment and rate but no start date.
        expected: The rule is refused.
        msg: ["Give the segment, the rate and the start date", SERVICE_FEE_RULE]
      - c: 4
        type: Negative
        screen: SYS
        title: Submit an approved run
        steps:
          - Send a direct request to submit an APPROVED run.
        expected: The request is refused.
        msg: ["Run {no} is {APPROVED} and cannot be {submitted}", SERVICE_FEE_STAGE]

  FR-AC-053:
    scenario: SC-AC-07
    persona: FRBS_PROCESSOR
    screen: SFRUN
    data: [TD-AC-06]
    conditions:
      - A line paid by Disbursement is RELEASED on the payment date; the officer can tag a release with the credit date.
      - A line is LIQUIDATED with the unit's liquidation report and date; the run follows its lines.
      - Dates in the future, a liquidation before the release, a missing report or a wrong line status are refused.
    cases:
      - c: 1
        type: Workflow
        persona: DISBURSEMENT
        title: Paid line shows Released
        steps:
          - Ask Disbursement to pay a line of the seed run on 5 September.
          - Open the run.
        expected: The line is RELEASED on 5 September.
      - c: 2
        type: Upload-download
        title: Liquidate with the report
        steps:
          - On a released line click Liquidate, attach the unit's liquidation report (PDF) and date; save.
        expected: The line is LIQUIDATED; when every line is liquidated the run is LIQUIDATED.
      - c: 3
        type: Negative
        title: Liquidate without the report
        steps:
          - Click Liquidate without a file.
        expected: The liquidation is refused.
        msg: [Attach the liquidation report of the unit, SERVICE_FEE_LIQUIDATION_REPORT]
      - c: 3
        type: Negative
        title: Liquidation before the release
        steps:
          - Liquidate with a date before the release date.
        expected: The liquidation is refused.
        msg: ["The liquidation date is before the release date {date}", SERVICE_FEE_DATES]
      - c: 3
        type: Negative
        title: Release date in the future
        steps:
          - Tag a release with tomorrow's date.
        expected: The tag is refused.
        msg: [Give a date that is not in the future, SERVICE_FEE_DATES]
      - c: 3
        type: Negative
        title: Liquidate a line not released
        steps:
          - Click Liquidate on a line that is still SENT.
        expected: The action is refused.
        msg: ["Line {n} is {SENT} and cannot be {liquidated}", SERVICE_FEE_LINE_STATUS]

  FR-AC-054:
    scenario: SC-AC-07
    persona: FRBS_TL
    screen: CCRULES
    data: [TD-AC-06]
    conditions:
      - A missing cost centre on a cost-centre-required line is filled from the first matching rule.
      - When no rule matches, the event is FAILED with COST_CENTER_MISSING and the alert is raised; it is re-processed after the rule is added.
      - A rule needs a cost centre.
    cases:
      - c: 1
        type: Positive
        persona: SYSTEM
        screen: EVREG
        title: Service-fee accrual takes the rule's cost centre
        steps:
          - Approve a service-fee run; open the accrual journal.
        expected: The 5614 line carries the cost centre of the matching rule.
      - c: 2
        type: Negative
        persona: SYSTEM
        screen: EVREG
        title: No rule covers the posting
        pre: The test lead deactivates the 5614 rule.
        steps:
          - Approve a service-fee run; open Event Register and Alerts.
          - Add the rule again and re-process the event.
        expected: The event is FAILED with COST_CENTER_MISSING and the alert is raised; after re-processing it posts.
        msg: ["{Event FRBS_SERVICE_FEE_ACCRUE, account 5614} needs a cost centre", COST_CENTER_MISSING]
      - c: 3
        type: Negative
        title: Rule without cost centre
        steps:
          - Save a rule with source module and event type but no cost centre.
        expected: The rule is refused.
        msg: [Enter the cost centre of the rule, COST_CENTER_REQUIRED]

  FR-AC-055:
    scenario: SC-AC-07
    persona: SYSTEM
    screen: REMIT
    conditions:
      - The early-remittance incentive posts to the incentive income account through its own component, not to commission income.
      - The incentive account is chosen by the rule.
    cases:
      - c: 1
        type: Workflow
        persona: REMIT_TL
        title: Early incentive posts to 4130
        steps:
          - Approve a remittance batch with an early incentive.
          - Open the journal of the batch.
        expected: The incentive is credited to 4130 (incentive income) with its VAT; commission income is not touched; the batch reference is on the entry.
      - c: 1
        type: Negative
        persona: FRBS_TL
        screen: INQ
        title: Commission income is not touched
        steps:
          - Run Account Inquiry on the commission income account for the batch reference.
        expected: No movement of the batch is on commission income.
      - c: 2
        type: Positive
        persona: FRBS_TL
        screen: ACCRULES
        title: The component is mapped by the rule
        steps:
          - Open the rule of OPS_REMIT_INCENTIVE, component INCENTIVE_INCOME.
        expected: The line names account 4130; changing it (with approval) changes the account of later batches without a release.

  FR-AC-060:
    scenario: SC-AC-08
    persona: FRBS_PROCESSOR
    screen: PACK
    conditions:
      - The Report Pack lists the seven Appendix A groups with their reports; each entry opens its runner and exports to Excel and PDF.
      - A user without FRBS_REPORT_VIEW does not see the Report Pack.
    cases:
      - c: 1
        type: Report-output
        title: Seven groups of the pack
        steps:
          - Open Report Pack.
        expected: I End of Day, II GARD, III Subsidiaries Accounting, IV Schedules and Aging, V Performance / Mancom, VI Service Fee and VII Government are listed with their reports.
      - c: 1
        type: Report-output
        title: GARD Schedule of Operating Expenses
        steps:
          - Open the GARD Schedule of Operating Expenses for August; export to Excel and PDF.
        expected: Both files are produced with the rows shown.
      - c: 2
        type: Security-access
        persona: DISBURSEMENT
        title: No Report Pack without FRBS_REPORT_VIEW
        steps:
          - Log in as disb; open the address of the FRBS Report Pack directly in the browser.
        expected: The screen is refused.

  FR-AC-061:
    scenario: SC-AC-08
    persona: FRBS_PROCESSOR
    screen: SCHED
    conditions:
      - Every provided schedule definition runs and exports to Excel and PDF.
      - An aged schedule spreads each balance into its buckets, which add up to the balance.
      - The TL maintains definitions and the monthly commentary; incomplete or invalid definitions are refused.
    cases:
      - c: 1
        type: Report-output
        title: Every provided definition runs
        steps:
          - Run each of the 28 definitions for August and export one to Excel and PDF.
        expected: All run; the files hold the rows shown.
      - c: 2
        type: Report-output
        title: Aged premium receivable
        steps:
          - Run SCH-PR with ageing for August.
        expected: Each party's balance is split into its buckets and the buckets add up to the balance.
      - c: 3
        type: Positive
        persona: FRBS_TL
        title: New schedule and commentary
        steps:
          - Create a definition with a prefix selector, grouping by account, figures opening, movement and closing and a commentary column; save.
          - Enter the August comment on one row.
        expected: The schedule runs with the comment printed on its row.
      - c: 3
        type: Negative
        persona: FRBS_TL
        title: Definition without accounts
        steps:
          - Save a definition with no prefix or report group.
        expected: The definition is refused.
        msg: [List at least one account prefix or report group, SCHEDULE_ACCOUNTS]
      - c: 3
        type: Negative
        persona: FRBS_TL
        title: Invalid code
        steps:
          - Save a definition with code "sch pr".
        expected: The definition is refused.
        msg: ["Use 2 to 40 upper-case letters, digits or dashes for the code", SCHEDULE_CODE]
      - c: 3
        type: Negative
        persona: FRBS_TL
        title: Ageing on a movement schedule
        steps:
          - Save a movement schedule with ageing.
        expected: The definition is refused.
        msg: [Only a balance schedule can be aged, SCHEDULE_AGEING_BASIS]
      - c: 3
        type: Negative
        persona: FRBS_TL
        title: Comparative figure without a period
        steps:
          - Choose the comparative figure without a comparative period.
        expected: The definition is refused.
        msg: [Choose a comparative period for the comparative figures, SCHEDULE_COMPARATIVE]
      - c: 3
        type: Negative
        persona: FRBS_TL
        title: Comment on a schedule without commentary
        steps:
          - Enter a comment on a schedule that has no commentary column.
        expected: The comment is refused.
        msg: ["Schedule {GARD-OPEX} has no commentary column", SCHEDULE_NO_COMMENTARY]

  FR-AC-062:
    scenario: SC-AC-08
    persona: FRBS_PROCESSOR
    screen: PACK
    conditions:
      - The Mancom, production, expense, GAP, cash-flow and service-fee reports run for a period with their figures.
      - The GAP report totals match the open items of the sub-ledger.
    cases:
      - c: 1
        type: Report-output
        title: Market performance summary of August
        steps:
          - Run FRBS-MANCOM-MARKET for August.
        expected: Premium and commission per segment with month, year to date, previous year to date and growth.
      - c: 1
        type: Report-output
        title: Branch production, expenses and cash flow
        steps:
          - Run FRBS-BRANCH-PRODUCTION, FRBS-EXPENSE-GROUPING and FRBS-CASH-FLOW for August.
        expected: Production per sales unit, expenses per cost centre and account, and the cash flow from opening to closing are shown and export.
      - c: 2
        type: Report-output
        title: GAP totals agree with the sub-ledger
        steps:
          - Run FRBS-GAP as of the month end; compare with the sub-ledger open items.
        expected: The receivable and payable totals equal the open items.
      - c: 2
        type: Negative
        title: Period ending before it starts
        steps:
          - Run FRBS-GAP with a reversed date range.
        expected: The report does not run; the range is refused.

  FR-AC-063:
    scenario: SC-AC-08
    persona: FRBS_PROCESSOR
    screen: TAXFORMS
    conditions:
      - The BIR returns, alphalists, SAWT and books of accounts run for a period and export.
      - The SAWT lists every certificate recorded in the quarter; the Cash Disbursements book lists the payment journals of the month.
      - A form without lines, a form prepared outside BIBS or a reversed period is refused.
    cases:
      - c: 1
        type: Report-output
        title: VAT return, alphalists and books
        steps:
          - Open BIR Forms & Books; run TAX-VAT-2550Q, TAX-QAP and TAX-BOOK-GJ for Q3; export to Excel and PDF.
        expected: Each output is produced with the rows of the quarter.
      - c: 2
        type: Report-output
        title: SAWT of Q3
        steps:
          - Run TAX-SAWT for Q3.
        expected: Every insurer certificate recorded in Certificates Received for Q3 is listed.
      - c: 2
        type: Report-output
        title: Cash Disbursements book of August
        steps:
          - Run TAX-BOOK-CDB for August.
        expected: The payment journals of August are listed.
      - c: 3
        type: Negative
        title: Reversed tax period
        steps:
          - Run a worksheet with end date before start date.
        expected: The run is refused.
        msg: [Tax period end precedes its start, INVALID_TAX_PERIOD]
      - c: 3
        type: Negative
        title: Form prepared outside BIBS
        steps:
          - Open the worksheet of a form that BIBS does not prepare.
        expected: No worksheet is produced.
        msg: [This form is prepared outside BIBS and has no worksheet, NO_WORKSHEET]
      - c: 3
        type: Negative
        title: Form without lines
        steps:
          - Run a form whose lines are not defined.
        expected: The run is refused.
        msg: ["Form {code} has no lines", FORM_NOT_DEFINED]
      - c: 1
        type: Security-access
        persona: COMPTROLLERSHIP
        title: No BIR outputs without TAX_VIEW
        steps:
          - Log in as comptrol and open Tax & Statutory.
        expected: BIR Forms & Books is not offered; a direct report request is refused.

  FR-AC-070:
    scenario: SC-AC-09
    persona: BUSINESS_ADMIN
    screen: LOV
    data: [TD-AC-08]
    conditions:
      - A new value is usable only after another user approves it, from its effective date.
      - A value ended yesterday is not offered today; values are never deleted.
      - Effective dates are validated; a system list cannot be changed.
      - The maker cannot approve the own change.
    cases:
      - c: 1
        type: Workflow
        title: New refund reason after approval
        steps:
          - Add "Duplicate booking" to REFUND_REASON effective today; save.
          - Open New Refund Request (as mktao) before and after glhead approves it in My Approvals.
        expected: The value is offered only after the approval.
      - c: 2
        type: Positive
        title: Value ended yesterday
        steps:
          - Set effective-to yesterday on a value (approved); open a form that uses the list.
        expected: The value is no longer offered; it stays in the list as ended.
      - c: 3
        type: Negative
        title: Effective-to before effective-from
        steps:
          - Save a value effective from the 10th to the 1st.
        expected: The value is refused.
        msg: [The effective-to date is before the effective-from date, LOV_EFFECTIVITY_INVALID]
      - c: 3
        type: Negative
        screen: SYS
        title: System list
        steps:
          - Send a direct request to add a value to a list maintained by the system.
        expected: The request is refused.
        msg: ["The list {type} is maintained by the system", LOV_NOT_MAINTAINABLE]
      - c: 4
        type: Security-access
        screen: APPROVALS
        title: Maker approves the own value
        pre: badmin also holds MASTER_AUTHORIZE for the case (test user prepared by the test lead).
        steps:
          - Approve the value badmin added.
        expected: The approval is refused.
        msg: [A record cannot be authorized by the user who maintained it, MAKER_CHECKER_VIOLATION]

  FR-AC-071:
    scenario: SC-AC-09
    persona: SYSADMIN
    screen: ACCREQ
    data: [TD-AC-08]
    conditions:
      - A request to create a user, change roles, disable a user or change the permissions of a role takes effect only after another user approves it; the matrix shows the change.
      - A request is validated (user name, existing user, roles, permissions, a real change).
      - One pending request per subject.
    cases:
      - c: 1
        type: Workflow
        title: Give glofficer the role FRBS_TL
        steps:
          - As admin raise MODIFY_ROLES for glofficer adding FRBS_TL, with justification.
          - Check glofficer's menu; as approver approve the request; check again.
          - Open the User Access Matrix.
        expected: glofficer gains the TL screens only after the approval; the matrix shows FRBS_TL for glofficer. Remove the role after the case.
      - c: 2
        type: Negative
        title: User name too short
        steps:
          - Raise CREATE_USER with user name "ab".
        expected: The request is refused.
        msg: ["The user name has 3 to 50 letters, digits, dots, dashes or underscores", ACCESS_USERNAME]
      - c: 2
        type: Negative
        title: User exists
        steps:
          - Raise CREATE_USER for glofficer.
        expected: The request is refused.
        msg: ["User {glofficer} already exists", ACCESS_USER_EXISTS]
      - c: 2
        type: Negative
        title: No role
        steps:
          - Raise CREATE_USER without roles.
        expected: The request is refused.
        msg: [Select at least one role, ACCESS_ROLES]
      - c: 2
        type: Negative
        screen: SYS
        title: Unknown role
        steps:
          - Raise MODIFY_ROLES with role FRBS_BOSS.
        expected: The request is refused.
        msg: ["Unknown role(s): {FRBS_BOSS}", ACCESS_UNKNOWN_ROLE]
      - c: 2
        type: Negative
        title: Permission added and removed
        steps:
          - Raise MODIFY_ROLE_PERMISSIONS on FRBS_TL adding and removing JOURNAL_ASSIGN.
        expected: The request is refused.
        msg: ["Permission(s) both added and removed: {JOURNAL_ASSIGN}", ACCESS_PERMISSION_CONFLICT]
      - c: 2
        type: Negative
        title: Request that changes nothing
        steps:
          - Raise MODIFY_ROLE_PERMISSIONS on FRBS_TL adding JOURNAL_ASSIGN, which it holds.
        expected: The request is refused.
        msg: ["The request does not change the permissions of group profile {FRBS Team Lead}", ACCESS_NO_PERMISSION_CHANGE]
      - c: 3
        type: Negative
        title: Second pending request for the same user
        steps:
          - Raise a second MODIFY_ROLES for glofficer while the first is pending.
        expected: The request is refused.
        msg: ["A request for {glofficer} is already waiting for approval", ACCESS_REQUEST_PENDING]

  FR-AC-072:
    scenario: SC-AC-09
    persona: ACCESS_APPROVER
    screen: APPROVALS
    data: [TD-AC-08]
    conditions:
      - The approver sees the pending requests with a count and approves or declines them with remarks, alone or in bulk.
      - A returned request is RETURNED with remarks and resubmitted by its requester.
      - A request is never decided by its submitter; remarks are mandatory to decline or return; a decided request cannot be decided again.
      - A new-user request is approved on its own.
    cases:
      - c: 1
        type: Positive
        title: Approve two requests in bulk
        steps:
          - Open My Approvals; note the count of access requests; select two role changes and approve them.
        expected: Both are APPROVED with a result each; the count falls by two; the requester is notified.
      - c: 1
        type: Negative
        screen: ACCREQ
        title: Decline without a reason
        steps:
          - Decline a request with the remarks blank.
        expected: The decline is refused.
        msg: [Enter the reason of the rejection, ACCESS_REJECT_REASON]
      - c: 2
        type: Workflow
        screen: ACCREQ
        title: Return and resubmit
        steps:
          - Return a request with remarks "Add the ticket number".
          - As the requester badmin, resubmit it with a new justification.
        expected: The request is RETURNED with the remarks, then PENDING again.
      - c: 2
        type: Negative
        screen: ACCREQ
        title: Return without remarks
        steps:
          - Return a request with the remarks blank.
        expected: The return is refused.
        msg: [Enter the remarks for the requester, ACCESS_RETURN_REASON]
      - c: 2
        type: Negative
        persona: SYSADMIN
        screen: ACCREQ
        title: Resubmit by another user
        steps:
          - As admin, resubmit the request badmin raised.
        expected: The resubmission is refused.
        msg: ["Only {badmin} can resubmit this request", ACCESS_NOT_REQUESTER]
      - c: 3
        type: Security-access
        persona: BUSINESS_ADMIN
        screen: ACCREQ
        title: Requester approves the own request
        pre: badmin also holds ACCESS_APPROVE for the case (test user prepared by the test lead).
        steps:
          - Approve the request badmin raised.
        expected: The approval is refused.
        msg: [A request cannot be decided by the user who submitted it, ACCESS_FOUR_EYES]
      - c: 3
        type: Negative
        screen: SYS
        title: Approve a decided request
        steps:
          - Send a direct request to approve an APPROVED access request.
        expected: The request is refused.
        msg: ["Request {no} is already {APPROVED}", ACCESS_REQUEST_DECIDED]
      - c: 4
        type: Negative
        title: New-user request in a bulk approval
        steps:
          - Select a CREATE_USER request with another request and approve in bulk.
        expected: The new-user request is not approved in the bulk; the other is.
        msg: ["Approve {ref} on its own: the new user's temporary password is shown once", ACCESS_APPROVE_INDIVIDUALLY]
  FR-DS-001:
    scenario: SC-DPA-01
    persona: DISBURSEMENT
    screen: LOGIN
    data: [TD-DPA-01]
    conditions:
      - Each user logs in with an own profile and sees only the Disbursement, Payment Requests or ACSL screens of the roles.
      - Wrong credentials are refused.
      - The inactivity warning appears after SESSION_IDLE_WARNING_MINUTES.
    cases:
      - c: 1
        type: Security-access
        neg: false
        title: Disbursement Processor sees the workbench, not ACSL
        steps:
          - Log in as disb and open the group Finance.
        expected: Disbursement (Disbursement Workbench and the processor screens) is shown; ACSL and Refund & Cash Advance Requests are not.
      - c: 1
        type: Security-access
        persona: PRQ_PROCESSOR
        title: Marketing processor sees only the request screens
        steps:
          - Log in as mktao and open the group Finance; open the address of the Disbursement screen directly in the browser.
        expected: Requests Home, New Refund Request, New Cash Advance and Cancel a Check are shown; the Disbursement link is refused ("You do not have access to this screen. Contact your administrator if you need it.").
      - c: 2
        type: Negative
        persona: ACSL_PROCESSOR
        title: Wrong password
        steps:
          - Enter user ID acsl and a wrong password.
        expected: No session starts.
        msg: [Invalid user name or password, AUTHENTICATION_FAILED]
      - c: 3
        type: Positive
        persona: DISB_TL
        screen: WB
        title: Inactivity warning after 15 minutes
        steps:
          - Log in as disbtl and leave the workbench open without activity for 15 minutes.
        expected: The dialog "Your session is about to expire" appears with the seconds left.
        msg: [Your session is about to expire, "-"]

  FR-DS-010:
    scenario: SC-DPA-01
    persona: DISB_TL
    screen: PAYEE
    data: [TD-DPA-02]
    conditions:
      - A new payee is a draft, is submitted and becomes ACTIVE when the approver authorises it; changes, deactivation and reactivation are authorised the same way.
      - The maker cannot authorise the own payee.
      - A payee needs a code, at least one mode and a default mode among the allowed modes; a payee under authorisation cannot be edited.
      - Account numbers are masked unless the user holds DISB_PAYEE_VIEW_FULL.
    cases:
      - c: 1
        type: Workflow
        title: New supplier payee authorised
        steps:
          - As disbtl, click New Payee, class Supplier, name, TIN, modes Check and CTA, default Check, one bank account; save and submit.
          - As disbappr, open For Authorisation and authorise it.
        expected: The payee is DRAFT, then for authorisation, then ACTIVE and offered on new DVs.
      - c: 1
        type: Workflow
        persona: DISB_APPROVER
        title: Return a payee to the maker
        steps:
          - As disbappr, return a submitted payee with a reason.
        expected: The payee is back with disbtl as a draft with the reason.
      - c: 2
        type: Security-access
        title: Maker authorises the own payee
        pre: disbtl2 also holds DISB_PAYEE_AUTHORIZE (test user prepared by the test lead).
        steps:
          - As disbtl2, create and submit a payee, then authorise it.
        expected: The authorisation is refused.
        msg: [A payee cannot be authorised by the user who maintained it, MAKER_CHECKER_VIOLATION]
      - c: 3
        type: Negative
        title: No mode of payment
        steps:
          - Save a payee without any mode.
        expected: The payee is refused.
        msg: [Select at least one mode of payment, PAYEE_MODE]
      - c: 3
        type: Negative
        title: Default mode not allowed
        steps:
          - Save a payee with modes Check only and default ATD.
        expected: The payee is refused.
        msg: [The default mode of payment must be one of the allowed modes, PAYEE_MODE]
      - c: 3
        type: Negative
        screen: SYS
        title: Payee without code
        steps:
          - Send a direct request to create a payee without a payee code.
        expected: The request is refused.
        msg: [Company and payee code are required, PAYEE_CODE]
      - c: 3
        type: Negative
        title: Edit a payee waiting for authorisation
        steps:
          - Change the address of a payee that is for authorisation.
        expected: The change is refused.
        msg: ["Payee {code} is {FOR_AUTHORIZATION}", PAYEE_NOT_EDITABLE]
      - c: 4
        type: Security-access
        persona: DISBURSEMENT
        screen: PAYEES
        title: Processor sees masked account numbers
        steps:
          - Log in as disb and open Payees and a payee.
        expected: Account numbers show only their last four digits.
      - c: 4
        type: Security-access
        neg: false
        screen: PAYEES
        title: Team leader sees full account numbers
        steps:
          - Log in as disbtl and open the same payee.
        expected: The full account numbers are shown.

  FR-DS-011:
    scenario: SC-DPA-01
    persona: DISB_TL
    screen: PAYEE
    conditions:
      - Each payee has a class of PAYEE_CLASS and its allowed modes among the seven modes.
      - A DV cannot use a mode the payee does not allow.
    cases:
      - c: 1
        type: Positive
        title: Classes and modes offered
        steps:
          - Open New Payee and the lists Class and Modes.
        expected: Classes Supplier, Insurer, Employee, Client, Government agency, Others; modes Credit to Account, Debit BDOIR Main Account (ATD), Manager's Check or Demand Draft, Credit Ticket, Telegraphic Transfer, Online Banking, Check.
      - c: 2
        type: Negative
        persona: DISBURSEMENT
        screen: DV
        title: ATD for a payee allowed Check and CTA
        steps:
          - On a DV of the supplier payee (modes Check and CTA) choose mode ATD; save.
        expected: The terms are refused.
        msg: ["Mode {ATD} is not allowed for payee {code}", DV_MODE]

  FR-DS-012:
    scenario: SC-DPA-01
    persona: DISB_TL
    screen: PAYEES
    conditions:
      - Payee requests come from refunds, Disbursement and requests without payee (NO_MATCH); authorising the payee closes the request and resumes the waiting request.
      - A request not needed is closed; a closed request cannot be acted on.
    cases:
      - c: 1
        type: Workflow
        persona: REMIT_TL
        title: Remittance for an insurer without payee
        steps:
          - Approve a remittance batch of an insurer without a payee.
          - As disbtl open Payee Requests; create the payee from the request; disbappr authorises it.
        expected: A NO_MATCH payee request is listed; after the authorisation it is DONE and the remittance request creates its DV.
      - c: 2
        type: Negative
        title: Act on a closed payee request
        steps:
          - Close a payee request not needed; try to close it again.
        expected: The second action is refused.
        msg: ["The payee request is {CLOSED}", PAYEE_REQUEST_CLOSED]

  FR-DS-013:
    scenario: SC-DPA-01
    persona: DISB_TL
    screen: PAYEE
    conditions:
      - A draft payee never used can be deleted.
      - A payee that is active or has been used is deactivated with authorisation and can be reactivated; inactive payees are not offered on new DVs.
    cases:
      - c: 1
        type: Positive
        title: Delete an unused draft
        steps:
          - Create a draft payee and click Delete.
        expected: The payee is deleted.
      - c: 2
        type: Negative
        title: Delete a payee paid last month
        steps:
          - Click Delete on the supplier payee of TD-DPA-03.
        expected: The deletion is refused.
        msg: [Only a draft payee never used can be deleted; deactivate it instead, PAYEE_IN_USE]
      - c: 2
        type: Workflow
        title: Deactivate and reactivate
        steps:
          - Request Deactivation of a payee; disbappr authorises it.
          - Encode a request for that payee; then reactivate the payee (authorised).
        expected: The payee is INACTIVE and not offered on the DV; after reactivation it is offered again.

  FR-DS-014:
    scenario: SC-DPA-01
    persona: DISB_TL
    screen: UPL
    data: [TD-DPA-04]
    conditions:
      - The Payees screen lists maintained payees by tab with masked accounts.
      - The migration upload creates valid payees with source MIGRATION and lists the refused rows with their reasons.
    cases:
      - c: 1
        type: Positive
        persona: DISBURSEMENT
        screen: PAYEES
        title: Consolidated list of payees
        steps:
          - Open Payees, tabs Active and Inactive.
        expected: Name, address, masked account number, mode and disbursement type of each payee.
      - c: 2
        type: Upload-download
        title: Migration of 100 payees with 2 invalid rows
        steps:
          - Upload the migration file of TD-DPA-04 with the template DISB_PAYEE_MIGRATION.
        expected: 98 payees are created with source MIGRATION; the reconciliation lists 2 refused rows with their reasons.
      - c: 2
        type: Negative
        title: Row without payee code
        steps:
          - Upload a migration file with one row without payee code.
        expected: That row is refused with its reason; the others load.

  FR-DS-020:
    scenario: SC-DPA-02
    persona: SYSTEM
    screen: WB
    data: [TD-DPA-02]
    conditions:
      - A module request with a maintained payee creates its DV at once; refund and remittance DVs go straight to For Approval.
      - A request without a maintained payee waits under No Payee with a NO_MATCH request and the alert, and resumes when the payee is authorised.
      - A duplicate request, an amount that is not positive or an action in the wrong status is refused.
    cases:
      - c: 1
        type: Workflow
        persona: REMIT_TL
        title: Approved remittance batch becomes a DV For Approval
        steps:
          - Approve a remittance batch; open the Disbursement Workbench, For Approval.
        expected: A remittance DV of the batch amount is For Approval with the RFP number and the root invoice.
      - c: 2
        type: Workflow
        persona: PRQ_APPROVER
        title: Refund for a client without payee waits
        steps:
          - Approve a refund for a client without payee; open No Payee.
          - Authorise the client payee (disbtl, disbappr).
        expected: The request waits under No Payee and DISB_PAYEE_NO_MATCH is raised; after the authorisation the DV is created.
      - c: 3
        type: Negative
        screen: SYS
        title: Same source reference twice
        steps:
          - Send the same gateway request twice (test harness of the test lead).
        expected: The second request is refused.
        msg: ["Request {ref} was already received", DISB_REQUEST_DUPLICATE]
      - c: 3
        type: Negative
        screen: SYS
        title: Zero amount
        steps:
          - Send a gateway request of 0.00.
        expected: The request is refused.
        msg: [A payment request needs a positive amount, DISB_AMOUNT]
      - c: 3
        type: Negative
        persona: DISBURSEMENT
        title: Voucher for a request still without payee
        steps:
          - Open a No Payee request and click Create Voucher.
        expected: The action is refused.
        msg: ["Maintain payee {code} before creating the voucher", DISB_PAYEE_NOT_MAINTAINED]

  FR-DS-021:
    scenario: SC-DPA-02
    persona: SYSTEM
    screen: WB
    conditions:
      - Each request carries its disbursement type from the source or the payee class, which drives the rule, reports and end-of-day files.
      - A type outside DISBURSEMENT_TYPE is not offered.
    cases:
      - c: 1
        type: Positive
        persona: DISBURSEMENT
        title: Government payee classified and reported
        steps:
          - Encode a request for a government payee; approve it; run the end of day.
        expected: The DV type is Payment to government agencies and it appears in DSB-EOD-OTHER.
      - c: 2
        type: Negative
        persona: DISBURSEMENT
        screen: ENC
        title: Types offered for encoding
        steps:
          - Open the disbursement type list on Encode Payment Request.
        expected: Only Remittance, Refund, Payment to supplier, Employee-related and Other are offered.

  FR-DS-022:
    scenario: SC-DPA-02
    persona: SYSTEM
    screen: DREP
    conditions:
      - The payee is matched by party code, then by a unique name.
      - A request without a match is listed on the unmatched-payee report and waits.
    cases:
      - c: 1
        type: Positive
        title: Match by name when the code is missing
        steps:
          - Send a request with the payee name of a maintained payee and no code.
        expected: The DV is created for that payee.
      - c: 2
        type: Report-output
        persona: DISBURSEMENT
        title: No-match report
        steps:
          - Run DSB-PAYEE-NOMATCH.
        expected: The waiting request is listed with its source, payee code and amount.
      - c: 2
        type: Negative
        title: Two payees with the same name
        pre: Two active payees share a name.
        steps:
          - Send a request with that name and no code.
        expected: The request is not matched and waits under No Payee.

  FR-DS-023:
    scenario: SC-DPA-02
    persona: DISBURSEMENT
    screen: ENC
    conditions:
      - An encoded request with a maintained payee becomes a DV In Process with the payee's details.
      - The amount must be positive and the payee maintained.
    cases:
      - c: 1
        type: Positive
        title: Supplier request of 25,000.00
        steps:
          - Encode type Payment to supplier, the supplier payee, PHP 25,000.00, purpose, RFP no., expense account and cost centre; attach the invoice PDF; save.
        expected: A DV In Process with the supplier's details and the attachment.
      - c: 2
        type: Negative
        title: Amount zero
        steps:
          - Encode a request of 0.00.
        expected: The request is refused.
        msg: [A payment request needs a positive amount, DISB_AMOUNT]
      - c: 2
        type: Negative
        title: Payee not maintained
        steps:
          - Encode a request for a payee code that is not maintained.
        expected: The request is refused.
        msg: ["Maintain payee {code} before creating the voucher", DISB_PAYEE_NOT_MAINTAINED]

  FR-DS-024:
    scenario: SC-DPA-02
    persona: DISBURSEMENT
    screen: UPL
    data: [TD-DPA-04]
    conditions:
      - Valid rows of the upload become requests with their DVs; failed rows are listed with their reason.
      - A user without DISB_UPLOAD cannot upload.
    cases:
      - c: 1
        type: Upload-download
        title: 20 rows with 3 unknown payees
        steps:
          - Upload the request file of TD-DPA-04 with the template DISB_REQUESTS.
        expected: 17 requests with DVs in the processing list; the fall-out lists 3 rows with their reason.
      - c: 1
        type: Negative
        title: Row with a negative amount
        steps:
          - Upload a file with one row of -100.00.
        expected: That row is in the fall-out with its reason; the others load.
      - c: 2
        type: Security-access
        persona: DISB_APPROVER
        title: Approver cannot upload
        steps:
          - Log in as disbappr; open the menu.
        expected: Disbursement Uploads is not shown.

  FR-DS-025:
    scenario: SC-DPA-02
    persona: DISBURSEMENT
    screen: WB
    data: [TD-DPA-03]
    conditions:
      - The workbench lists requests and DVs by tab with filters on the received date and every column.
      - The DV shows the request, payee details and taxes, documents, entry, instrument and history.
      - A DV claimed by one user is read only for others.
    cases:
      - c: 1
        type: Positive
        title: Filter on the received date
        steps:
          - Open In Process; set Received From and Received To to yesterday.
        expected: Only the requests received yesterday are listed.
      - c: 2
        type: Positive
        screen: DV
        title: Supplier DV shows TIN and ATC
        steps:
          - Open the supplier DV.
        expected: The payee's TIN and ATC, currency and mode are shown with the documents (view and download).
      - c: 3
        type: Negative
        persona: DISB_TL
        screen: DV
        title: DV claimed by another user
        steps:
          - While disb works the DV, open it as disbtl and change the terms.
        expected: The DV is read only for disbtl.

  FR-DS-030:
    scenario: SC-DPA-02
    persona: DISBURSEMENT
    screen: DV
    data: [TD-DPA-02]
    conditions:
      - The DV is numbered DV-yyyy-n with terms pre-filled from the payee; the processor completes the terms.
      - The paying account is active and in the DV currency; the payee account is active; EWT is zero or more and below the gross.
      - A DV with missing terms cannot be submitted; a DV past In Process cannot be changed.
    cases:
      - c: 1
        type: Positive
        title: Encoded request gets its DV
        steps:
          - Open the DV of the supplier request.
        expected: DV-2026-n with mode, payee account and taxes pre-filled from the payee.
      - c: 2
        type: Negative
        title: Paying account in another currency
        steps:
          - Choose a USD paying account on a PHP DV.
        expected: The terms are refused.
        msg: ["The paying account must be in {PHP}", DV_BANK_CURRENCY]
      - c: 2
        type: Negative
        title: Inactive payee account
        steps:
          - Choose an inactive account of the payee.
        expected: The terms are refused.
        msg: [Select an active account of the payee, DV_PAYEE_ACCOUNT]
      - c: 2
        type: Boundary
        neg: true
        title: EWT equal to the gross
        steps:
          - Enter EWT 25,000.00 on the DV of 25,000.00.
        expected: The terms are refused; 24,999.99 is accepted.
        msg: [The withholding tax must be at least zero and below the gross amount, DV_EWT]
      - c: 3
        type: Negative
        title: Submit without paying account
        steps:
          - Leave the paying account blank and click Submit.
        expected: The DV is not submitted.
        msg: ["Complete DV {no}: {paying account}", DV_INCOMPLETE]
      - c: 3
        type: Negative
        screen: SYS
        title: Change terms of an approved DV
        steps:
          - Send a direct request to change the terms of an APPROVED DV.
        expected: The change is refused.
        msg: ["DV {no} is {APPROVED} and can no longer be changed", DV_NOT_EDITABLE]

  FR-DS-031:
    scenario: SC-DPA-02
    persona: DISBURSEMENT
    screen: DVENTRY
    conditions:
      - The proforma entry is generated from the rule; edited lines are marked Edited and shown to the approver; Rebuild from rule discards the edits.
      - An entry without lines or unbalanced cannot be saved.
    cases:
      - c: 1
        type: Positive
        title: Change the expense account of a supplier DV
        steps:
          - On the Entry tab change the expense account of the supplier DV; save.
          - As disbappr open the DV.
        expected: The line is marked Edited and disbappr sees that the entry was changed; on approval the edited lines post as given.
      - c: 1
        type: Positive
        title: Rebuild from rule
        steps:
          - Click Rebuild from rule.
        expected: The lines of the rule return and the Edited marks disappear.
      - c: 2
        type: Negative
        title: Unbalanced edited entry
        steps:
          - Change one line amount only; save.
        expected: The entry is refused and the errors listed.
        msg: ["{errors}", DV_ENTRY_INVALID]
      - c: 2
        type: Negative
        screen: SYS
        title: Entry without lines
        steps:
          - Send a direct request to save the proforma entry with no line.
        expected: The request is refused.
        msg: [The proforma entry has no line, DV_ENTRY_EMPTY]

  FR-DS-032:
    scenario: SC-DPA-02
    persona: DISBURSEMENT
    screen: DVENTRY
    conditions:
      - An allocation of account, cost centre and amount creates the expense lines; it must add up to the gross.
    cases:
      - c: 1
        type: Positive
        title: Rent allocated to HO and Cebu
        steps:
          - On a rent DV of 30,000.00 click Apply Allocation with 20,000.00 HO and 10,000.00 Cebu.
        expected: Two expense lines with those cost centres; they post at approval.
      - c: 1
        type: Negative
        title: Allocation that does not add up
        steps:
          - Apply an allocation of 20,000.00 and 5,000.00 on the DV of 30,000.00.
        expected: The allocation is refused.
        msg: ["The allocation must add up to the gross amount {30,000.00}", DV_ALLOCATION_TOTAL]

  FR-DS-033:
    scenario: SC-DPA-04
    persona: DISBURSEMENT
    screen: DVINST
    conditions:
      - An approved DV has one instrument of its mode, numbered from the check series or the mode's series.
      - A DV has no instrument before approval; a status outside the life cycle of the mode is refused; a mode without form is processed by file.
    cases:
      - c: 1
        type: Workflow
        title: Check printed from the series
        steps:
          - Approve a check DV (disbappr); click Print on its instrument.
        expected: The check takes the next number of the paying account's series (for example 000124) and is PRINTED.
      - c: 2
        type: Negative
        screen: SYS
        title: Print before approval
        steps:
          - Send a direct request to print the instrument of a DV For Review.
        expected: The request is refused.
        msg: [The DV has no instrument until it is approved, DV_NOT_APPROVED]
      - c: 2
        type: Negative
        screen: SYS
        title: Negotiated check released again
        steps:
          - Send a direct request to release a NEGOTIATED check.
        expected: The request is refused.
        msg: ["{Check} {000124} is {NEGOTIATED} and cannot become {RELEASED}", INSTRUMENT_STATUS]
      - c: 2
        type: Negative
        title: Print a credit to account
        steps:
          - Click Print on a CTA instrument.
        expected: The action is refused.
        msg: ["{Credit to account} has no printed form; it is processed by file", DISB_NO_FORM]

  FR-DS-034:
    scenario: SC-DPA-04
    persona: DISBURSEMENT
    screen: DVINST
    conditions:
      - An ATD is Printed, Emailed to the branch and Debited on the branch's confirmation.
      - Only an ATD is e-mailed.
    cases:
      - c: 1
        type: Workflow
        title: ATD printed, e-mailed and confirmed
        steps:
          - Print the ATD of an approved ATD DV; click E-mail (branch mailbox of BRANCH_EMAIL, requester in copy); click Debited.
        expected: The history shows PRINTED, EMAILED and DEBITED; the e-mail is on the E-mails tab.
      - c: 2
        type: Negative
        screen: SYS
        title: E-mail a check
        steps:
          - Send a direct request to e-mail the instrument of a check DV.
        expected: The request is refused.
        msg: [Only an authority to debit is e-mailed, DISB_NOT_ATD]

  FR-DS-035:
    scenario: SC-DPA-04
    persona: DISBURSEMENT
    screen: DVINST
    conditions:
      - An MC / DD goes Printed, Received, Released; a Credit Ticket or TT goes Printed, Debited.
      - A status outside the life cycle is refused.
    cases:
      - c: 1
        type: Workflow
