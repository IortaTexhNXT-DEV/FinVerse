        title: Failed posting in DSB-UNREGULARIZED
        steps:
          - Run DSB-UNREGULARIZED after the failed approval of FR-DS-041.
        expected: The DV is listed with the error; the workbench KPI Unregularised counts it.
      - c: 2
        type: Negative
        screen: DVENTRY
        title: Edit the entry of an approved DV
        steps:
          - Change a line of the entry of an approved DV.
        expected: The change is refused.
        msg: ["DV {no} is {APPROVED}; return it first", DV_NOT_EDITABLE]

  FR-DS-050:
