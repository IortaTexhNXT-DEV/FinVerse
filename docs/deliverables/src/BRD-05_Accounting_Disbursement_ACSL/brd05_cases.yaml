    scenario: SC-DPA-05
    persona: DISB_TL
    screen: EOD
    conditions:
      - After the end of day one payment advice is e-mailed to each payee of the day and logged on the DV.
      - The confirmations of a run are sent once.
    cases:
      - c: 1
        type: Upload-download
        title: Confirm the run of 30 September
        steps:
          - Click Confirm on the run; open the test mailboxes and the E-mails tab of a DV.
        expected: One payment advice per payee paid that day; the e-mail is logged on each DV.
      - c: 2
        type: Negative
        title: Confirm twice
        steps:
          - Click Confirm again.
        expected: Nothing is sent again.
        msg: ["The confirmations of {EOD-2026-5} were already sent", EOD_CONFIRMED]

  FR-DS-064:
    scenario: SC-DPA-05
    persona: DISB_TL
    screen: FUND
    conditions:
      - A funding request is made, verified by another TL and approved by two further approvers; the second approval posts the transfer.
      - An approver can decline and each step can return to the maker with remarks.
      - Amount, accounts and currencies are validated; four-eyes rules hold at each step.
    cases:
      - c: 1
        type: Workflow
        title: Maker, verifier and two approvers
        steps:
          - disbtl creates FND-yyyy-n (source and target BDOIR accounts, amount, purpose) and submits; disbtl2 verifies; disbappr and disbappr2 approve.
        expected: The request is APPROVED and DISB_FUND_TRANSFER posts (Dr target bank / Cr source bank); the BOB reference is recorded.
      - c: 2
        type: Workflow
        persona: DISB_APPROVER
        title: Decline at the first approval
        steps:
          - disbappr declines a verified request with remarks.
        expected: The request is DECLINED with the remarks.
      - c: 3
        type: Security-access
        persona: DISB_APPROVER
        title: Same approver twice
        steps:
          - After disbappr's approval, disbappr approves again.
        expected: The second approval is refused.
        msg: [The second approval must be given by another approver, FUNDING_FOUR_EYES]
      - c: 3
        type: Security-access
        title: Maker verifies
        steps:
          - disbtl verifies own request.
        expected: The verification is refused.
        msg: [The maker cannot verify the funding request, FUNDING_FOUR_EYES]
      - c: 3
        type: Negative
        title: Same source and target
        steps:
          - Create a request with the same account as source and target.
        expected: The request is refused.
        msg: [The source and target accounts must differ, FUNDING_SAME_ACCOUNT]
      - c: 3
        type: Negative
        title: Accounts in different currencies
        steps:
          - Choose a PHP source and a USD target.
        expected: The request is refused.
        msg: ["Both accounts must be in {PHP}", FUNDING_CURRENCY]
      - c: 3
        type: Negative
        title: Amount zero
        steps:
          - Enter an amount of 0.00.
        expected: The request is refused.
        msg: [The amount must be positive, FUNDING_AMOUNT]

  FR-DS-070:
    scenario: SC-DPA-05
    persona: DISB_APPROVER
    screen: BANKS
    conditions:
      - The approver adds a cheque book whose first leaf is used first and corrects its range only before the first check is printed.
      - An invalid, overlapping or used range is refused.
    cases:
      - c: 1
        type: Positive
        title: New series 000100-000199
        steps:
          - Add a cheque book 000100 to 000199 to a paying account; print a check from it.
        expected: The check is 000100.
      - c: 2
        type: Negative
        title: Correct a book already used
        steps:
          - Change the last number of the book used above.
        expected: The change is refused.
        msg: [Only an active cheque book with no leaf used can be edited, CHEQUE_BOOK_IN_USE]
      - c: 2
        type: Negative
        title: Overlapping range
        steps:
          - Add a book 000150-000250 on the same account.
        expected: The book is refused.
        msg: [Cheque range overlaps another book of the account, CHEQUE_RANGE_OVERLAP]
      - c: 2
        type: Negative
        title: Last before first
        steps:
          - Add a book 000300-000200.
        expected: The book is refused.
        msg: ["Cheque range {000300}-{000200} is invalid", INVALID_CHEQUE_RANGE]

  FR-DS-071:
    scenario: SC-DPA-05
    persona: DISB_APPROVER
    screen: BANKS
    conditions:
      - A status change of a BDOIR account waits for authorisation; inactive accounts are not offered on new DVs.
      - The maker cannot authorise the own change.
    cases:
      - c: 1
        type: Workflow
        title: Account tagged inactive
        steps:
          - disbappr tags an account inactive; disbappr2 authorises it.
          - On a new DV open the paying account list.
        expected: The account is INACTIVE and not offered.
      - c: 2
        type: Security-access
        title: Maker authorises the own change
        steps:
          - disbappr authorises the change disbappr made.
        expected: The authorisation is refused.
        msg: [A record cannot be authorized by the user who maintained it, MAKER_CHECKER_VIOLATION]

  FR-DS-080:
    scenario: SC-DPA-05
    persona: DISBURSEMENT
    screen: DREP
    conditions:
      - The Disbursement reports run for a date or period, export to XLSX, ODS or PDF and print with the print options.
      - A missing mandatory parameter is refused; users without DISB_REPORT_VIEW do not see the reports.
    cases:
      - c: 1
        type: Report-output
        title: Masterlist of September
        steps:
          - Run DSB-MASTERLIST for September; export to XLSX; print landscape fit to width.
        expected: The file and the print hold every disbursement of September.
      - c: 2
        type: Negative
        title: Date range left blank
        steps:
          - Run DSB-MASTERLIST without dates.
        expected: The report does not run.
        msg: ["Parameter {dateFrom} is required", MISSING_PARAMETER]
      - c: 2
        type: Security-access
        persona: PRQ_PROCESSOR
        screen: REPORTS
        title: Marketing processor does not see the Disbursement reports
        steps:
          - As mktao, open the Report Centre.
        expected: The category Disbursement is not listed.

  FR-DS-081:
    scenario: SC-DPA-05
    persona: SYSTEM
    screen: EOD
    conditions:
      - The end of day generates the six end-of-day reports of the date and archives them with the run.
      - A DV approved on another date is not in the reports of the date.
    cases:
      - c: 1
        type: Report-output
        title: Remittance report of 30 September
        steps:
          - Open the DSB-EOD-REMIT output of the run of 30 September.
        expected: Every remittance DV approved that day is listed with the withholding at 2 % and 15 %.
      - c: 2
        type: Negative
        title: DV of 1 October not in the report of 30 September
        steps:
          - Approve a remittance DV on 1 October; reopen the report of 30 September.
        expected: The DV is not listed.

  FR-DS-082:
    scenario: SC-DPA-05
    persona: DISBURSEMENT
    screen: DREP
    conditions:
      - The real-time reports run for any date range with their ageing buckets and subtotals.
      - A check outside a bucket's range is not counted in it.
    cases:
      - c: 1
        type: Report-output
        title: Unreleased check 45 days old
        steps:
          - Run DSB-UNRELEASED-CHECKS as of today.
        expected: A check printed 45 days ago is in bucket 31-60 with the subtotals.
      - c: 1
        type: Report-output
        title: CWT on commission, ATD, stale checks and cash flow
        steps:
          - Run DSB-CWT-COMMISSION, DSB-ATD, DSB-ML-STALE and DSB-CASH-FLOW for September.
        expected: Each report runs and exports; DSB-ML-STALE shows the stale check of FR-DS-054.
      - c: 1
        type: Negative
        title: Reversed date range
        steps:
          - Run DSB-MASTERLIST from 30 September to 1 September.
        expected: The report does not run; the range is refused.
      - c: 2
        type: Boundary
        title: Check of exactly 30 days
        steps:
          - Look for a check printed 30 days ago.
        expected: It is in the current-30 bucket, not in 31-60.

  FR-DS-083:
    scenario: SC-DPA-05
    persona: DISBURSEMENT
    screen: DREP
    data: [TD-DPA-04]
    conditions:
      - The payee report lists the payees with masked account numbers unless permitted; the fall-out report lists the refused upload rows of a period.
    cases:
      - c: 1
        type: Report-output
        title: Fall-out report of September
        steps:
          - Run DSB-UPLOAD-FALLOUT for September.
        expected: The 3 refused rows of the request upload are listed with their reasons.
      - c: 1
        type: Security-access
        title: Payee report masked for the processor
        steps:
          - As disb, run DSB-PAYEE.
        expected: Account numbers are masked; disbtl sees them in full.

  FR-DS-090:
    scenario: SC-DPA-06
    persona: REMIT_TL
    screen: REMIT
    data: [TD-DPA-07]
    conditions:
      - A qualifying line gets CPC2 at the rate of the criterion on the basic premium remitted, with VAT, deducted from the payable and shown apart from commission.
      - Approval posts OPS_REMIT_CPC2 per batch to CPC2 incentive income.
      - A line without an active CPC2 criterion or below the minimum premium gets no CPC2.
    cases:
      - c: 1
        type: Positive
        title: Packaged Motor line with CPC2 of 2 %
        steps:
          - Extract a batch with a packaged Motor line of basic premium remitted 100,000.00 matched by a CPC2 criterion of 2 %.
          - Open the batch, Settlement tab.
        expected: The line shows CPC2 2,000.00 plus VAT with the criterion code and rate; the batch payable is reduced by that amount; the payment request and schedule show CPC2 apart from commission.
      - c: 2
        type: Workflow
        title: Approval posts CPC2 income
        steps:
          - Approve the batch; open its journals.
        expected: OPS_REMIT_CPC2 with reference RMB:<batch>:CPC2 credits CPC2 incentive income (4131) and output VAT.
      - c: 3
        type: Negative
        title: Line below the minimum premium
        pre: The CPC2 criterion has a minimum gross premium above the line's premium.
        steps:
          - Extract a batch with that line.
        expected: The line has no CPC2.

  FR-DS-091:
    scenario: SC-DPA-06
    persona: REMIT_TL
    screen: REMIT
    data: [TD-DPA-07]
    conditions:
      - Approving a batch with an early incentive issues one EARLY_INCENTIVE service invoice with 2 % withholding, linked to the batch.
      - A re-sent batch does not issue a second invoice; a manual issue of the type is refused.
    cases:
      - c: 1
        type: Workflow
        title: Early incentive of 5,000.00
        steps:
          - Approve a batch with an early incentive of 5,000.00; open the Settlement tab.
        expected: One service invoice with 100.00 withholding tax is linked to the batch; the incentive OR names it.
      - c: 2
        type: Negative
        screen: SINV
        title: Manual EARLY_INCENTIVE invoice
        steps:
          - Issue a service invoice of type EARLY_INCENTIVE by hand.
        expected: The invoice is refused.
        msg: ["Service invoices of type {EARLY_INCENTIVE} are issued automatically with the early remittance incentive", SERVICE_INVOICE_AUTOMATIC_ONLY]
      - c: 2
        type: Negative
        title: Re-sent batch
        steps:
          - Cancel the batch's DV and approve the batch again.
        expected: No second EARLY_INCENTIVE invoice is issued.

  FR-DS-092:
    scenario: SC-DPA-06
    persona: DISBURSEMENT
    screen: DREP
    conditions:
      - The CPC2 of each line (code, rate, amount, VAT) is shown on the batch and its payment request.
      - The CPC2 report lists the CPC2 lines of a period and its total agrees with the CPC2 income in the ledger.
    cases:
      - c: 1
        type: Positive
        persona: REMIT_TL
        screen: REMIT
        title: CPC2 visible on the batch
        steps:
          - Open the batch of FR-DS-090 and its payment request.
        expected: Code, rate, amount and VAT of CPC2 per line are shown.
      - c: 2
        type: Report-output
        title: CPC2 report of the month
        steps:
          - Run the CPC2 report in Disbursement Reports for September; export it to Excel.
        expected: Every CPC2 line of the September batches is listed with user, product, code, rate, amount and VAT; the total equals the CPC2 income posted in September.
      - c: 2
        type: Negative
        title: CPC2 report without the period
        steps:
          - Run the CPC2 report with the period blank.
        expected: The report does not run.
        msg: ["Parameter <name> is required", MISSING_PARAMETER]

  FR-DS-093:
    scenario: SC-DPA-06
    persona: ACSL_PROCESSOR
    screen: INV360
    conditions:
      - The Invoice Family lists all invoices of the root with the family totals; remittance requests carry the root invoice.
      - Each invoice keeps its own BIR number.
    cases:
      - c: 1
        type: Positive
        title: Family of an endorsed and cancelled invoice
        steps:
          - Search the original invoice in Invoice Search; open Invoice 360, Invoice Family.
        expected: The original, its endorsement and its cancellation are listed with the family totals.
      - c: 2
        type: Negative
        title: The endorsement keeps its own number
        steps:
          - Open the endorsement invoice.
        expected: Its BIR invoice number differs from the original's; the root chip shows the original.

  FR-PQ-001:
    scenario: SC-DPA-07
    persona: PRQ_REVIEWER
    screen: PQHOME
    data: [TD-DPA-05]
    conditions:
      - Requests Home lists the requests by stage with counts, searches by number, payee, reference or DV and filters by kind and date.
      - Several requests are endorsed or approved at once with a result per request.
      - A user without PRQ_VIEW does not see Requests Home.
    cases:
      - c: 1
        type: Positive
        title: For Review tab of the reviewer
        steps:
          - Log in as mktrev and open Requests Home, tab For Review.
        expected: The tab shows the count and the requests waiting for mktrev; a search by RRF number finds one.
      - c: 2
        type: Positive
        title: Endorse three requests at once
        steps:
          - Select three requests For Review raised by mktao and click Endorse.
        expected: One result per request; the three are For Approval.
      - c: 2
        type: Negative
        title: Bulk endorse with one own request
        pre: One of the three requests was raised by mktrev.
        steps:
          - Endorse the three at once.
        expected: Two are endorsed; the own request is refused in its result.
        msg: ["You raised or already moved {RRF-2026-12}: another user decides", PRQ_FOUR_EYES]
      - c: 3
        type: Security-access
        persona: DISBURSEMENT
        title: Disbursement processor does not see Requests Home
        steps:
          - Log in as disb; open the address of the Payment Requests screen directly in the browser.
        expected: The screen is refused ("You do not have access to this screen. Contact your administrator if you need it.").

  FR-PQ-002:
    scenario: SC-DPA-07
    persona: PRQ_PROCESSOR
    screen: REPORTS
    conditions:
      - The Marketing roles run the Operations reports of unapplied payments for a date range and export them.
      - A missing mandatory parameter is refused.
    cases:
      - c: 1
        type: Report-output
        title: Unapplied-payment report of September to XLSX
        steps:
          - As mktao, run the Cashiering report of unapplied payments for September; export to XLSX; print.
        expected: The file and the print list the unapplied payments of September.
      - c: 2
        type: Negative
        title: Date range left blank
        steps:
          - Run the report without dates.
        expected: The report does not run.
        msg: ["Parameter {dateFrom} is required", MISSING_PARAMETER]

  FR-PQ-003:
    scenario: SC-DPA-07
    persona: PRQ_PROCESSOR
    screen: NEWRRF
    data: [TD-DPA-05]
    conditions:
      - An RRF of one client with 1 to 50 lines is saved and printed from the Appendix D template; a Draft or Preparing request can be edited.
      - All lines belong to one client; each line has the AR number and assured name; invoices exist in the ledger.
      - Amount and currency are validated; a request past Preparing cannot be edited.
    cases:
      - c: 1
        type: Positive
        title: RRF of one client with two lines
        steps:
          - Fill the RRF - segment, reference, unit, purpose, PHP, credit to account with the client's BDO account, two lines with AR no., client code, assured, invoice, amount, reason Overpayment; save.
          - Open the printable form.
        expected: RRF-yyyy-n in Draft with the total of the lines; the PDF follows the Appendix D layout.
      - c: 2
        type: Negative
        title: Lines of two clients
        steps:
          - Add a line of another client; save.
        expected: The request is refused.
        msg: [All accounts of a refund request belong to one client (AQ18), PRQ_ONE_CLIENT]
      - c: 2
        type: Boundary
        neg: true
        title: 51 lines
        steps:
          - Save an RRF with 51 lines.
        expected: The request is refused; 50 lines are accepted.
        msg: [A refund request has between 1 and 50 accounts, PRQ_LINES_REQUIRED]
      - c: 2
        type: Negative
        title: Line without AR number
        steps:
          - Save a line without AR number.
        expected: The request is refused.
        msg: [Every line needs the AR number and the assured name, PRQ_LINE_INCOMPLETE]
      - c: 2
        type: Negative
        title: Invoice not in the ledger
        steps:
          - Enter invoice BI-2026-999999 on a line.
        expected: The request is refused.
        msg: ["Invoice {BI-2026-999999} is not in the ledger", PRQ_INVOICE_UNKNOWN]
      - c: 3
        type: Negative
        title: Amount with three decimals
        steps:
          - Enter an amount of 100.005.
        expected: The request is refused.
        msg: [The amount must be positive with at most two decimals, PRQ_AMOUNT_INVALID]
      - c: 3
        type: Negative
        screen: SYS
        title: Currency of two letters
        steps:
          - Send a direct request to create a refund with currency PH.
        expected: The request is refused.
        msg: [Currency must be a 3-letter code, PRQ_CURRENCY_INVALID]
      - c: 3
        type: Negative
        screen: SYS
        title: Edit a request For Approval
        steps:
          - Send a direct request to change a refund request For Approval.
        expected: The change is refused.
        msg: ["{RRF-2026-12} is {FOR_APPROVAL} for this action", PRQ_WRONG_STAGE]

  FR-PQ-004:
    scenario: SC-DPA-08
    persona: PRQ_PROCESSOR
    screen: NEWCA
    data: [TD-DPA-05]
    conditions:
      - An RFP of type Cash advance, Petty cash or Others is saved with the employee as payee and printed from the Appendix D template.
      - Purpose, payee and a positive amount are required.
    cases:
      - c: 1
        type: Positive
        title: Cash advance of 5,000.00
        steps:
          - Fill the RFP - segment, reference, unit, type Cash advance, purpose, PHP, employee number and name, check, 5,000.00; save.
        expected: RFP-yyyy-n in Draft with the employee as payee; the PDF prints.
      - c: 2
        type: Negative
        title: No purpose
        steps:
          - Save the RFP without purpose.
        expected: The request is refused.
        msg: [Give the purpose of the cash advance, PRQ_PURPOSE_REQUIRED]
      - c: 2
        type: Negative
        title: No payee
        steps:
          - Save the RFP without employee.
        expected: The request is refused.
        msg: [Give the payee code and name, PRQ_PAYEE_REQUIRED]
      - c: 2
        type: Negative
        title: Negative amount
        steps:
          - Enter -5,000.00.
        expected: The request is refused.
        msg: [The amount must be positive with at most two decimals, PRQ_AMOUNT_INVALID]

  FR-PQ-005:
    scenario: SC-DPA-07
    persona: PRQ_REVIEWER
    screen: REQ
    conditions:
      - The reviewer assigns or re-assigns a refund to a preparer; it moves to Preparing in the preparer's work.
      - A request is returned one step back with a reason; an action in the wrong stage is refused.
    cases:
      - c: 1
        type: Workflow
        title: Re-assign from mktao to another preparer
        pre: A second preparer account (for example ao, MKT_AO) exists.
        steps:
          - Assign a Draft RRF to mktao; then re-assign it to ao.
        expected: The request is Preparing and appears in ao's work, no longer in mktao's.
      - c: 2
        type: Negative
        title: Return without a reason
        steps:
          - On a request For Review click Return to preparer without a reason.
        expected: The return is refused.
        msg: ["Select a reason for '{return}'", WORKFLOW_REASON_REQUIRED]
      - c: 2
        type: Workflow
        title: Return to the preparer
        steps:
          - Return the request with a reason and remarks.
        expected: The request is Preparing with the reason in its history.
      - c: 2
        type: Negative
        screen: SYS
        title: Assign a request For Review
        steps:
          - Send a direct request to assign a request For Review.
        expected: The request is refused.
        msg: ["{RRF-2026-12} is {FOR_REVIEW} for this action", PRQ_WRONG_STAGE]

  FR-PQ-006:
    scenario: SC-DPA-07
    persona: PRQ_PROCESSOR
    screen: REQ
    data: [TD-DPA-05]
    conditions:
      - A refund line of a cancelled policy opens one ACSL and one Cashiering validation.
      - The request goes For Review only when all validations are confirmed; a rejection returns it to the preparer.
      - A validation result is given once.
    cases:
      - c: 1
        type: Workflow
        title: Send a cancelled-policy refund for validation
        steps:
          - Create an RRF with reason Cancelled policy; click Send for validation.
          - Open the Validations tab.
        expected: One ACSL validation (case of type Account analysis request) and one Cashiering task RVL-yyyy-n per line, OPEN.
      - c: 2
        type: Workflow
        persona: ACSL_PROCESSOR
        screen: CASE
        title: ACSL confirms and Cashiering gives the new AR
        steps:
          - As acsl, provide the result Confirmed on the case.
          - As cashier, confirm the reinstatement with the new AR number.
        expected: Both validations are CONFIRMED and the request is For Review.
      - c: 2
        type: Workflow
        persona: CASHIER
        screen: CASHTASK
        title: Cashiering rejects the validation
        steps:
          - Reject the Cashiering validation with a reason.
        expected: The request returns to the preparer; resubmission opens a new round.
      - c: 3
        type: Negative
        persona: CASHIER
        screen: SYS
        title: Result given twice
        steps:
          - Send a direct request to record the result of a validation already CONFIRMED.
        expected: The request is refused.
        msg: ["This validation was already {CONFIRMED}", PRQ_VALIDATION_DONE]

  FR-PQ-007:
    scenario: SC-DPA-07
    persona: PRQ_PROCESSOR
    screen: REQ
    data: [TD-DPA-05]
    conditions:
      - Documents attached to a request are viewed, downloaded singly or as a ZIP, and travel to the DV.
      - A file type outside the accepted list is refused.
    cases:
      - c: 1
        type: Upload-download
        title: PDF and XLSX reach the refund DV
        steps:
          - Attach a PDF and an XLSX to the RRF with their document types; download both as a ZIP.
          - After approval, open the refund DV, Documents.
        expected: The ZIP holds both files; the DV shows both documents.
      - c: 2
        type: Negative
        title: Executable file
        steps:
          - Attach a .exe file.
        expected: The file is refused.
        msg: ["Only these file types are allowed: {pdf, png, jpg, jpeg, xlsx, docx, csv, ods, odt, xls, doc, msg, eml}", ATTACHMENT_TYPE_NOT_ALLOWED]

  FR-PQ-008:
    scenario: SC-DPA-07
    persona: PRQ_REVIEWER
    screen: REQ
    data: [TD-DPA-05]
    conditions:
      - The preparer submits the request; the reviewer endorses it to the approver or returns it.
      - The reviewer is never the user who raised or last moved the request.
      - An AR already refunded by another live request is refused at submission.
    cases:
      - c: 1
        type: Workflow
        title: Submit and endorse
        steps:
          - As mktao, click Submit for review.
          - As mktrev, click Endorse for approval.
        expected: The request is For Review, then For Approval.
      - c: 2
        type: Security-access
        persona: PRQ_PROCESSOR
        title: Preparer endorses the own request
        pre: mktao also holds PRQ_REVIEW for the case (test user prepared by the test lead).
        steps:
          - mktao endorses the request he submitted.
        expected: The endorsement is refused.
        msg: ["You raised or already moved {RRF-2026-12}: another user decides", PRQ_FOUR_EYES]
      - c: 3
        type: Negative
        persona: PRQ_PROCESSOR
        title: AR already on a live refund
        steps:
          - Submit a second RRF with an AR of the first live RRF.
        expected: The submission is refused.
        msg: ["AR {2026-00123} is already refunded by request {RRF-2026-12}", PRQ_DUPLICATE_AR]
      - c: 2
        type: Negative
        screen: SYS
        title: Endorse a request in Draft
        steps:
          - Send a direct request to endorse a Draft request.
        expected: The request is refused.
        msg: ["{RRF-2026-12} is {DRAFT} for this action", PRQ_WRONG_STAGE]

  FR-PQ-009:
    scenario: SC-DPA-08
    persona: PRQ_APPROVER
    screen: REQ
    data: [TD-DPA-05]
    conditions:
      - An approved refund goes to Disbursement; an approved cash advance goes to HR, whose approval sends it to Disbursement.
      - The approver returns a request to the reviewer with a reason; HR returns to the Marketing approver.
      - The approver is never the requester or the previous actor; the stage must allow the action.
    cases:
      - c: 1
        type: Workflow
        title: Cash advance through Marketing and HR
        steps:
          - As mktappr approve the endorsed cash advance.
          - As hrappr approve it.
