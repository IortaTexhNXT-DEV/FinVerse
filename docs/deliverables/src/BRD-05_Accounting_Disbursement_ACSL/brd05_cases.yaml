          - Print, Receive and Release a manager's check; print and mark Debited a credit ticket.
        expected: The MC is PRINTED, RECEIVED, RELEASED; the credit ticket PRINTED, DEBITED.
      - c: 2
        type: Negative
        title: Release an MC not received
        steps:
          - Click Release on a PRINTED manager's check.
        expected: The action is refused.
        msg: ["{Manager's check} {no} is {PRINTED} and cannot become {RELEASED}", INSTRUMENT_STATUS]

  FR-DS-036:
    scenario: SC-DPA-02
    persona: DISBURSEMENT
    screen: DV
    conditions:
      - A complete DV is submitted to For Review with the confirmation of its totals.
      - An incomplete DV is refused.
    cases:
      - c: 1
        type: Workflow
        title: Submit a complete DV
        steps:
          - Complete the supplier DV and click Submit; confirm.
        expected: The DV is in the For Review tab.
      - c: 2
        type: Negative
        title: Submit without the mode
        steps:
          - Clear the mode of payment and submit.
        expected: The DV is not submitted.
        msg: ["Complete DV {no}: {mode of payment}", DV_INCOMPLETE]

  FR-DS-037:
    scenario: SC-DPA-02
    persona: FIN_ADMIN
    screen: EMP
    data: [TD-DPA-08]
    conditions:
      - The employee master holds a unique employee number, cost centre, unit, branch and dates, and feeds the headcount report.
      - A missing cost centre, a separation before hiring or a branch of another company is refused.
    cases:
      - c: 1
        type: Positive
        title: New employee
        steps:
          - As fmanager, add an employee with number, name, position, unit, branch HO, cost centre and hiring date.
        expected: The employee is saved and is the default cost centre of an employee payee.
      - c: 1
        type: Negative
        title: Duplicate employee number
        steps:
          - Add a second employee with the same number.
        expected: The employee is refused.
      - c: 1
        type: Report-output
        screen: REPORTS
        title: Headcount per cost centre
        steps:
          - Run ORG-HEADCOUNT-CC as of 30 September; export to Excel and PDF.
        expected: The active employees are counted per cost centre.
      - c: 2
        type: Negative
        title: No cost centre
        steps:
          - Save an employee without cost centre.
        expected: The employee is refused.
        msg: ["Enter the employee's cost centre", COST_CENTER_REQUIRED]
      - c: 2
        type: Negative
        title: Separation before hiring
        steps:
          - Enter a separation date before the hiring date.
        expected: The employee is refused.
        msg: [The separation date is before the hiring date, SEPARATION_BEFORE_HIRING]
      - c: 2
        type: Negative
        screen: SYS
        title: Branch of another company
        steps:
          - Send a direct request to create an employee with a branch of another company.
        expected: The request is refused.
        msg: [The branch belongs to another company, BRANCH_OF_OTHER_COMPANY]

  FR-DS-040:
    scenario: SC-DPA-03
    persona: DISB_TL
    screen: DV
    data: [TD-DPA-03]
    conditions:
      - The TL reviews a DV For Review and submits it for approval or returns it with a reason and instructions.
      - The checker is never the processor.
    cases:
      - c: 1
        type: Workflow
        title: Return with "Incomplete supporting documents"
        steps:
          - Open a DV For Review, click Return with the reason Incomplete supporting documents and remarks.
        expected: The DV is In Process again with the reason visible to the processor.
      - c: 1
        type: Workflow
        title: Submit for approval
        steps:
          - Review a complete DV and click Submit for Approval.
        expected: The DV is For Approval.
      - c: 1
        type: Negative
        title: Return without a reason
        steps:
          - Click Return without a reason.
        expected: The return is refused.
        msg: ["Select a reason for '{return}'", WORKFLOW_REASON_REQUIRED]
      - c: 2
        type: Security-access
        title: Checker is the processor
        pre: disbtl encoded and submitted the DV.
        steps:
          - As disbtl, submit the DV for approval.
        expected: The action is refused.
        msg: [The processor cannot check their own voucher, DV_FOUR_EYES]

  FR-DS-041:
    scenario: SC-DPA-03
    persona: DISB_APPROVER
    screen: WB
    data: [TD-DPA-03]
    conditions:
      - Approval posts the DV entry, creates the instrument and reports the status to the source; several DVs are approved each on its own.
      - A posting failure keeps the DV For Approval with posting status FAILED.
      - The approver is never the processor or checker; only a DV For Approval with an entry is approved.
    cases:
      - c: 1
        type: Workflow
        screen: DV
        title: Approve a refund DV
        steps:
          - Open a refund DV For Approval and click Approve.
        expected: Dr refund payable / Cr bank is posted; the instrument is created; Payment Requests sees the DV assigned.
      - c: 2
        type: Negative
        title: Five DVs, one without rule
        pre: One DV of a type whose rule the test lead deactivates.
        steps:
          - Select five DVs For Approval and click Approve.
        expected: Four are APPROVED; one stays For Approval with posting status FAILED and the error.
        msg: ["DV {no} could not be posted: {reason}", DV_POSTING_FAILED]
      - c: 3
        type: Security-access
        title: Approver was the checker
        pre: A user holding DISB_REVIEW and DISB_APPROVE checked the DV (test user prepared by the test lead).
        steps:
          - That user approves the DV.
        expected: The approval is refused.
        msg: [The approver of a voucher cannot be its processor or checker, DV_FOUR_EYES]
      - c: 3
        type: Negative
        screen: SYS
        title: Approve a DV In Process
        steps:
          - Send a direct request to approve a DV In Process.
        expected: The request is refused.
        msg: ["DV {no} is {IN_PROCESS}", DV_NOT_FOR_APPROVAL]
      - c: 3
        type: Negative
        screen: SYS
        title: DV without entry
        steps:
          - Approve a DV whose entry is empty (prepared by the test lead).
        expected: The approval is refused.
        msg: ["DV {no} has no entry", DV_ENTRY_EMPTY]

  FR-DS-042:
    scenario: SC-DPA-03
    persona: DISB_APPROVER
    screen: DV
    conditions:
      - A rejected DV is final and its request returns to the source, which is notified.
      - A rejection needs a reason.
    cases:
      - c: 1
        type: Workflow
        title: Reject a refund DV
        steps:
          - Reject a refund DV For Approval with a reason and remarks.
          - As mktao, open the refund request.
        expected: The DV is REJECTED; the refund is back with its preparer and notified.
      - c: 2
        type: Negative
        title: Reject without a reason
        steps:
          - Click Reject without a reason.
        expected: The rejection is refused.
        msg: ["Select a reason for '{reject}'", WORKFLOW_REASON_REQUIRED]

  FR-DS-043:
    scenario: SC-DPA-03
    persona: DISBURSEMENT
    screen: WB
    conditions:
      - A DV In Process (processor) or For Review (TL) is cancelled with a reason and its request returns to the source.
      - A cancellation needs a reason; a request already in a voucher cannot be cancelled on its own.
    cases:
      - c: 1
        type: Workflow
        title: Cancel a duplicate supplier DV
        steps:
          - Search the second supplier DV by payee; click Cancel with reason "Duplicate request or DV" and remarks.
        expected: The DV is CANCELLED and the request goes back to its source.
      - c: 2
        type: Negative
        screen: DV
        title: Cancel without a reason
        steps:
          - Click Cancel without a reason.
        expected: The cancellation is refused.
        msg: ["Select a reason for '{cancel}'", WORKFLOW_REASON_REQUIRED]
      - c: 2
        type: Negative
        screen: SYS
        title: Cancel the request of a live voucher
        steps:
          - Cancel the request of a DV In Process by a direct request.
        expected: The request is refused.
        msg: ["Cancel or reject the voucher of {request}", DISB_REQUEST_IN_VOUCHER]

  FR-DS-044:
    scenario: SC-DPA-03
    persona: DISB_APPROVER
    screen: DV
    data: [TD-DPA-03]
    conditions:
      - Cancelling an approved DV reverses its journal, cancels the instrument when not final and returns the request to its source.
      - A cancelled remittance DV restores the batch postings, invoices and deductions and the batch is re-sent under a new reference.
      - A DV whose instrument is final cannot be cancelled; a cancellation needs a reason.
    cases:
      - c: 1
        type: Workflow
        title: Cancel an approved refund DV
        steps:
          - Cancel the approved refund DV with a reason.
          - Open the refund request (mktao).
        expected: The DV journal is reversed (posting REVERSED); the refund request is reopened.
      - c: 2
        type: Workflow
        persona: REMIT_TL
        screen: REMIT
        title: Cancelled remittance DV restores the batch
        steps:
          - Cancel an approved remittance DV (disbappr).
          - Open the batch.
        expected: The remittance, incentive, CPC2 and deduction postings are reversed; the batch is back in review; re-approval sends a new request under <batch>/R1.
      - c: 3
        type: Negative
        title: Cancel the DV of a negotiated check
        steps:
          - Cancel the DV whose check is NEGOTIATED.
        expected: The cancellation is refused.
        msg: ["{Check} {000124} is {NEGOTIATED} and cannot be cancelled", INSTRUMENT_FINAL]
      - c: 3
        type: Negative
        title: Cancel without a reason
        steps:
          - Click Cancel approved DV without a reason.
        expected: The cancellation is refused.
        msg: ["Select a reason for '{cancel}'", WORKFLOW_REASON_REQUIRED]

  FR-DS-045:
    scenario: SC-DPA-03
