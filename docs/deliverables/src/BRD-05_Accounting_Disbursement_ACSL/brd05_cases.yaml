  FR-DS-051:
    scenario: SC-DPA-04
    persona: DISBURSEMENT
    screen: DVINST
    conditions:
      - A wrongly tagged status is corrected through a status edit that the TL approves or rejects.
      - A status of another mode, a second pending edit or a changed instrument is refused; the requester never approves the own edit.
    cases:
      - c: 1
        type: Workflow
        title: Released check set back to Printed
