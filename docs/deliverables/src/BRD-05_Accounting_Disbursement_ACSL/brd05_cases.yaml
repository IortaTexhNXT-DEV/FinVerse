# Test plan BRD-5 Accounting, Disbursement and ACSL - test data file (release set v2.0).
# Build: python docs/deliverables/src/testplans/build_test_plan.py docs/deliverables/src/BRD-05_Accounting_Disbursement_ACSL/brd05_cases.yaml
# Schema: see the header of build_test_plan.py. FR titles, BRD IDs and priorities come from the FRS.
# Messages and codes are the ones BIBS shows on the Accounting, Disbursement, Payment Requests, ACSL and
# administration screens; labels are those of the screens.

