        expected: PRQ_CA_LIQUIDATION posts the expenses by category and 500.00 cash returned against the advance of 5,000.00.
      - c: 2
        type: Workflow
        persona: PRQ_REVIEWER
        title: Return a liquidation
        steps:
          - Return a submitted liquidation with remarks.
        expected: The liquidation is DRAFT again for the employee.
      - c: 2
        type: Security-access
        title: Employee checks the own liquidation
        pre: The employee also holds the checker permission (test user).
        steps:
          - The employee posts the own liquidation.
        expected: The posting is refused.
        msg: [A liquidation is checked by someone other than the employee, PRQ_FOUR_EYES]
      - c: 3
        type: Negative
        title: Liquidate an advance not disbursed
        steps:
          - Open the liquidation of a cash advance For Approval.
        expected: The liquidation is refused.
        msg: [Only a disbursed cash advance is liquidated, PRQ_NOT_LIQUIDABLE]
      - c: 3
        type: Negative
        title: Submit without a day
