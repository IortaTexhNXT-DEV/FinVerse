        expected: Dr 2241 / Cr bank 15,000.00.
      - c: 1
        type: Workflow
        title: Staled check
        steps:
          - Open the entry of the check staled in FR-DS-054.
        expected: Dr 2241 / Cr 2240 Miscellaneous Liability - stale checks.
      - c: 2
        type: Negative
        pre: The test lead sets DISB_CHECK_CLEARING OFF.
        title: No clearing entry with the model off
        steps:
          - Approve and negotiate a check DV.
        expected: The approval credits the bank directly; the negotiation posts nothing. Reset the parameter afterwards.

  FR-DS-056:
    scenario: SC-DPA-04
    persona: DISBURSEMENT
