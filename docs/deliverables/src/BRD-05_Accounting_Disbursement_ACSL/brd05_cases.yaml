          - Change one line amount; submit.
        expected: The submission is refused.
        msg: ["A correction needs at least two lines and equal debits ({1000.00}) and credits ({900.00})", ACSL_CORRECTION_UNBALANCED]
      - c: 3
        type: Negative
        title: Description missing
        steps:
          - Submit without description.
        expected: The submission is refused.
        msg: [Describe the correction, ACSL_DESCRIPTION_REQUIRED]
      - c: 3
        type: Negative
        title: Line on a heading account
        steps:
          - Enter a line on heading account 4100.
        expected: The line is refused.
        msg: ["Account {4100} is a heading", ACSL_ACCOUNT_NOT_POSTABLE]
      - c: 3
        type: Negative
        title: Control account without party
        steps:
          - Enter a line on 1210 without the party.
        expected: The line is refused.
        msg: ["Control account {1210} needs the sub-ledger party", ACSL_PARTY_REQUIRED]
      - c: 3
        type: Negative
        title: Line without side
        steps:
          - Enter a line without Debit or Credit.
        expected: The line is refused.
        msg: [Every line needs a side and a positive amount with two decimals, ACSL_LINE_INVALID]
      - c: 3
        type: Negative
        title: Component without invoice
        steps:
          - Enter a line with the ledger component PREMIUM and no invoice.
        expected: The line is refused.
        msg: ["A ledger component ({PREMIUM}) needs the invoice it corrects", ACSL_COMPONENT_INVALID]
      - c: 3
        type: Boundary
        neg: true
        screen: SYS
        title: 201 lines
        steps:
          - Send a direct request to save a correction with 201 lines.
        expected: The request is refused; 200 lines are accepted.
        msg: [A correction has at most 200 lines, ACSL_TOO_MANY_LINES]
      - c: 3
        type: Negative
        title: Unknown line of the original journal
        steps:
          - Propose from line 99 of a journal of 4 lines.
        expected: The proposal is refused.
        msg: ["Journal {batch} has no line {99}", ACSL_LINE_UNKNOWN]
      - c: 4
        type: Workflow
        title: Cancel a draft
        steps:
          - Cancel the draft with a reason.
        expected: The correction is CANCELLED.

  FR-AS-022:
    scenario: SC-DPA-10
    persona: ACSL_TL
    screen: CORR
    conditions:
      - The reviewer endorses a correction for approval or returns it with a reason.
      - The reviewer is not the preparer.
    cases:
      - c: 1
        type: Workflow
        title: acsltl endorses acsl's correction
        steps:
          - Open the correction For Review; click Endorse for approval with a comment.
        expected: The correction is For Approval with the comment in the trail.
      - c: 1
        type: Workflow
        title: Return to the preparer
        steps:
          - Return a correction with a reason.
        expected: The correction is DRAFT again.
      - c: 2
        type: Security-access
        title: Preparer reviews the own correction
        steps:
          - As acsltl, prepare and submit a correction, then endorse it.
        expected: The endorsement is refused.
        msg: [A correction is reviewed by someone other than its preparer, ACSL_FOUR_EYES]

  FR-AS-023:
    scenario: SC-DPA-10
    persona: ACSL_HEAD
    screen: CORR
    conditions:
      - The Head approves with a comment or returns with a reason and comment; comments are kept in the trail.
      - The approver is not the maker; a return needs a reason.
    cases:
      - c: 1
        type: Workflow
        title: Return with a comment
        steps:
          - Return an endorsed correction with reason and comment.
        expected: The correction is DRAFT with the Head's comment.
      - c: 2
        type: Negative
        title: Return without reason
        steps:
          - Click Return to preparer without a reason.
        expected: The return is refused.
        msg: ["Select a reason for '{return}'", WORKFLOW_REASON_REQUIRED]
      - c: 2
        type: Security-access
        title: Maker approves
        pre: A test user holding ACSL_PROCESS and ACSL_APPROVE prepared the correction.
        steps:
          - That user approves it.
        expected: The approval is refused.
        msg: [The approver of a correction is not its maker, ACSL_FOUR_EYES]

  FR-AS-024:
    scenario: SC-DPA-10
    persona: SYSTEM
    screen: CORR
    conditions:
      - On approval BIBS posts the system journal ACS:<no>, matches the open items of the lines and moves the invoice components.
      - An unknown account or party refuses the posting.
    cases:
      - c: 1
        type: Workflow
        persona: ACSL_HEAD
        title: Approve and post
        steps:
          - Approve the correction with a comment; open its Journal.
        expected: The journal ACS:COR-yyyy-n is posted; the invoice balance changes by the corrected component.
      - c: 2
        type: Negative
        persona: ACSL_HEAD
        title: Party removed before approval
        pre: The party of a line is removed from the master by the test lead after submission.
        steps:
          - Approve the correction.
        expected: The approval is refused and nothing is posted.
        msg: ["Party {code} of a correction line is not maintained", ACSL_PARTY_UNKNOWN]
      - c: 2
        type: Negative
        persona: ACSL_HEAD
        title: Account not in the chart
        pre: A line names an account the test lead closes after submission.
        steps:
          - Approve the correction.
        expected: The approval is refused.
        msg: ["Account {code} is not in the chart", ACSL_ACCOUNT_UNKNOWN]

  FR-AS-025:
    scenario: SC-DPA-10
    persona: ACSL_PROCESSOR
    screen: DED
    data: [TD-DPA-06, TD-DPA-07]
    conditions:
      - A deduction with the insurer's confirmation is submitted and confirmed by another user.
      - The next approved batch of the insurer consumes the confirmed deductions, capped at the amount payable, and posts OPS_REMIT_DEDUCTION.
      - A deduction needs a positive amount and the insurer's confirmation; it changes only as a draft; the preparer cannot confirm it.
    cases:
      - c: 1
        type: Workflow
        persona: ACSL_TL
        title: Confirm the INS-LAC deduction
        steps:
          - Open the deduction of TD-DPA-06 For Confirmation and click Confirm deduction.
        expected: The deduction is CONFIRMED.
      - c: 2
        type: Workflow
        persona: REMIT_TL
        screen: REMIT
        title: Deduction of 10,000.00 on the next batch
        steps:
          - Approve the next INS-LAC batch.
        expected: The payable is reduced by 10,000.00; OPS_REMIT_DEDUCTION posts with reference RMB:<batch>:<deduction>.
      - c: 2
        type: Boundary
        persona: REMIT_TL
        screen: REMIT
        title: Deduction of 50,000.00 against a payable of 30,000.00
        steps:
          - Approve a batch of 30,000.00 payable with a confirmed deduction of 50,000.00.
        expected: 30,000.00 is consumed; the batch is settled without a payment request; 20,000.00 remains on the deduction.
      - c: 3
        type: Negative
        title: Submit without the insurer's confirmation
        steps:
          - Record a deduction without confirmation reference; submit.
        expected: The submission is refused.
        msg: ["Deduction {RDN-2026-2} needs the insurer's confirmation reference and date before submission", REMIT_DEDUCTION_UNCONFIRMED]
      - c: 3
        type: Negative
        title: Amount zero
        steps:
          - Record a deduction of 0.00.
        expected: The deduction is refused.
        msg: [A deduction needs a positive amount, REMIT_DEDUCTION_AMOUNT]
      - c: 3
        type: Negative
        screen: SYS
        title: Change a submitted deduction
        steps:
          - Send a direct request to change a deduction For Confirmation.
        expected: The change is refused.
        msg: ["Deduction {RDN-2026-2} can only change as a draft", REMIT_DEDUCTION_STAGE]
      - c: 3
        type: Security-access
        persona: ACSL_TL
        title: Preparer confirms the own deduction
        steps:
          - As acsltl, record and submit a deduction, then confirm it.
        expected: The confirmation is refused.
        msg: ["Deduction {RDN-2026-3} must be confirmed by another user", REMIT_DEDUCTION_FOUR_EYES]

  FR-AS-026:
    scenario: SC-DPA-10
    persona: ACSL_PROCESSOR
    screen: INV360
    conditions:
      - ACSL sees for an invoice the whole family with its corrections and cases through the root invoice.
      - Each invoice keeps its own BIR number.
    cases:
      - c: 1
        type: Positive
        title: Invoice cancelled and rebooked
        steps:
          - Open Invoice 360, Invoice Family, of an invoice cancelled and rebooked; open its cases.
        expected: Both invoices are listed with their cases and corrections.
      - c: 2
        type: Negative
        title: The rebooked invoice keeps its own number
        steps:
          - Compare the numbers of the original and the rebooked invoice.
        expected: The numbers differ; only the root links them.

access:
  - action: Prepare and submit manual journals
    screen: NEWJ
    permission: JOURNAL_CREATE
    allow: [FRBS_PROCESSOR, FRBS_TL]
    deny: [FRBS_HEAD, COMPTROLLERSHIP, AUDITOR]
    denied: New Journal is not in the menu; a direct request is refused.
  - action: Assign journals to a poster
    screen: JOURNALS
    permission: JOURNAL_ASSIGN
    allow: [FRBS_TL, FRBS_HEAD]
    deny: [FRBS_PROCESSOR]
    denied: Assign is not shown; a direct request is refused.
  - action: Post or return journals
    screen: JOURNAL
    permission: JOURNAL_AUTHORIZE
    allow: [FRBS_TL, FRBS_HEAD]
    deny: [FRBS_PROCESSOR, COMPTROLLERSHIP]
    denied: Post and Return to Maker are not shown; a direct request is refused.
  - action: Reverse a posted journal
    screen: JOURNAL
    permission: JOURNAL_REVERSE
    allow: [FRBS_HEAD]
    deny: [FRBS_TL, FRBS_PROCESSOR]
    denied: Reverse is not shown; a direct request is refused.
