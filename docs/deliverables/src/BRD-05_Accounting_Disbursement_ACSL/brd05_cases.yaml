  FR-DS-054:
    scenario: SC-DPA-04
    persona: SYSTEM
    screen: DVINST
    conditions:
      - DISB_CHECK_STALE tags Stale every check still Printed or Released DISB_STALE_DAYS after its print date and raises the alert.
      - A stale check is re-issued through a new DV; a check that is not stale cannot be re-issued.
    cases:
      - c: 1
        type: Boundary
        title: Check printed on 1 April stale on 28 September
        pre: A check printed 180 days ago (print date moved by the test lead).
        steps:
          - Run DISB_CHECK_STALE; open the check.
        expected: The check is STALE; the stale entry posts; DISB_CHECK_STALE is raised. A check printed 179 days ago stays.
      - c: 2
        type: Workflow
        persona: DISBURSEMENT
        title: Re-issue a stale check
        steps:
          - Click Re-issue on the stale check.
        expected: A STALE_REISSUE request creates a new DV for the payee in the normal flow.
      - c: 2
        type: Negative
        persona: DISBURSEMENT
        title: Re-issue a check that is not stale
        steps:
          - Send a direct request to re-issue a RELEASED check.
        expected: The request is refused.
        msg: [Only a stale check is re-issued, CHECK_NOT_STALE]

  FR-DS-055:
    scenario: SC-DPA-04
    persona: SYSTEM
    screen: DVENTRY
    conditions:
      - With DISB_CHECK_CLEARING ON, an approved check DV credits 2241; negotiation posts 2241 against the bank; staling posts 2241 against stale checks; a re-issue posts the stale liability against the paying account.
      - Without the clearing model no clearing entry is posted.
    cases:
