# Documents generated by BRD-5 Accounting, Disbursement and ACSL. Each is produced by BIBS from the records on screen;
# the PDF documents carry the BDO Insure letterhead and page x of y. The templates and layouts are maintained on the
# Document Templates screen; the bank files follow the layouts of Appendix B until BDOI confirms them.
# Columns: id | document | template | format | produced by | protected | fields and their source | image (slug)
documents:
  - id: DO-01
    name: Disbursement voucher
    template: Disbursement voucher template (layout to confirm, AQ14)
    format: PDF, one per voucher; printed in batch by the end of day
    produced: Disbursement Voucher › Download Voucher; Disbursement End of Day (vouchers of the day)
    protected: "No"
    fields:
      - "Title and reference: Disbursement Voucher, DV number and date – from the voucher"
      - "Payee: name, code, address and TIN – from the payee master"
      - "Payment: disbursement type, mode of payment, paying account, value date, gross, withholding tax and net amount, purpose – from the voucher terms"
      - "Accounting entry: the lines with account, cost centre, debit and credit – from the entry of the voucher"
      - "Prepared, checked and approved by: the names of the processor, the team leader and the approver – from the voucher workflow"
    shot: doc-dv
    frs: [FR-DS-030, FR-DS-062]
  - id: DO-02
    name: Authority to Debit (bank form)
    template: Authority to Debit form of the bank (layout to confirm, AQ14)
    format: PDF, one per instrument; also the MC / DD, credit ticket and TT forms
    produced: Disbursement Voucher › Instrument › Download Form; Disbursement End of Day (forms of the day)
    protected: "No"
    fields:
      - "Bank and account: the BDOIR account to debit and the branch – from the paying account"
      - "Payment: payee, amount in figures and words, value date and reference – from the voucher and its instrument"
      - "Signatories of BDOI – from the approver of the voucher"
    shot: doc-atd
    frs: [FR-DS-034, FR-DS-035]
  - id: DO-03
    name: Direct Credit Transaction File (DCTF)
    template: DCTF layout of Appendix B (header and 89-character detail lines; trailer to confirm, AQ09)
    format: Text file, one per end-of-day run, for TPD's automatic credit arrangement
    produced: Disbursement End of Day › the DCTF output of the run
    protected: "No"
    fields:
      - "Header: the company account and the business date – from the paying account and the run"
      - "Detail line per credit to account: payee account number, payee name, amount and reference – from the vouchers paid by credit to account"
    shot: doc-dctf
    frs: [FR-DS-061]
  - id: DO-04
    name: Refund Request Form (RRF)
    template: Refund Request Form of Appendix D
    format: PDF, one per refund request
    produced: Request › Refund Request Form
    protected: "No"
    fields:
      - "Request: segment, request date, reference, requesting unit and purpose – from the request"
      - "Lines: item, AR number, client number, assured or client name, amount, reason of refund, branch or unit, categories A and B – from the accounts to refund"
      - "Total and the account name or check name – from the request"
      - "Requested, reviewed and approved by – from the request workflow"
    shot: doc-rrf
    frs: [FR-PQ-003]
  - id: DO-05
    name: BIR Form 2307 (certificate of creditable tax withheld at source)
    template: BIR Form 2307 of the BIR
    format: PDF, one per payee and quarter, or one file per batch
    produced: BIR Form 2307 › PDF
    protected: "No"
    fields:
      - "Payee: name, TIN and address – from the payee"
      - "Payor: BDOI, its TIN and address – from the company"
      - "Income payments: the ATC, the income and the tax withheld per month of the quarter – from the withholding tax of the payments"
    shot: doc-2307
    frs: [FR-DS-058]
  - id: DO-06
    name: Insurer SOA reconciliation report
    template: (report layout of the ACSL reports)
    format: Excel, one per uploaded statement
    produced: Insurer SOA › Download Report
    protected: "No"
    fields:
      - "Statement: insurer, period and upload number – from the upload"
      - "Lines: invoice, policy, assured, result, the premium and balance of the statement and of the books and their variances, the remittance – from the reconciliation run"
    shot: doc-soa-report
    shot_caption: "first page as generated, with the report header and the reconciliation columns (the remittance, 2307 and cancellation columns of the workbook are left out of the image)"
    frs: [FR-AS-003]
