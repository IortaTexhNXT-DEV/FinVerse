# Key business rules and validations (highlights; the full list is in the workbook and FRS chapter 13).
rules:
  - "Every amount posts through the accounting rules of its business event; a journal posts only when it balances, and posted entries are reversed, never changed."
  - "Four eyes everywhere: journals, vouchers, payees, bank accounts, fundings, corrections and service-fee runs are approved by another user than their maker; a funding needs a verifier and two approvers."
  - "Accruals reverse themselves on their reversal date; the broking books close at month end and the GL month closes on the date the GL Team Lead schedules."
  - "Disbursement pays what the units request: each request becomes a voucher with its proforma entry; refunds and remittances go straight to the approver; approval posts the entry and issues the instrument of the mode."
  - "A cancelled approved voucher is reversed and its request goes back to its source to be regularised; an approved voucher counts as unregularised until its OR / AR is tagged."
  - "Marketing refunds and cash advances are reviewed and approved in BIBS (cash advances also by HR) and reach Disbursement on approval; an AR is refunded once."
  - "ACSL reconciles the insurer statements and the GL with the sub-ledgers, investigates cases and corrects wrong postings with a preparer, a reviewer and an approver."

# Caveats and possibilities, and how each is handled.
caveats:
  - topic: Additional requirements
    text: "New needs can surface during the review, SIT or UAT."
    handling: "In-scope clarification when the signed text already covers it; otherwise a change request with mandays."
    example: "A reviewer asks for the cost centre on the Disbursement Workbench list: a new column, so a change request; asking which vouchers count as unregularised is a clarification."
  - topic: Impacts on other modules
    text: "Disbursement pays the remittances, refunds and commission refunds of Operations and the Marketing requests; ACSL corrects the postings of every module; every module posts through the accounting rules."
    handling: "Each change is assessed against the cross-BRD contract (FRS chapter 19); when it touches another set, a delta sign-off of the affected pages of both sets."
    example: "A new disbursement type for claims payments needs the request of Claims and its accounting rule: both owners confirm the delta."
  - topic: Other BRDs change Accounting and Disbursement
    text: "Operations (remittance batches, cashiering validations, remittance deductions), New Business (clients, booking, root invoices), User Access (roles) and Data Migration (opening balances, payees) change what this set shows."
    handling: "The change is raised against the other BRD and assessed against the contract; when it touches this set, a delta sign-off of the affected pages only."
    example: "Operations changes the remittance schedule columns: the remittance voucher and its documents are re-issued and signed as a delta."
  - topic: BDOI data still to give
    text: "The chart of accounts, the accounting entries of the transactions, the report layouts, the bank file layouts, the check and form layouts and several rates are BDOI data not given yet (AQ01-AQ31)."
    handling: "BIBS holds them as configuration with provisional values; the answer is loaded as configuration, without a change request."
    example: "BDOI gives the layout of a GARD schedule: the schedule definition is changed on Account Schedules and the report is issued with it."
  - topic: Role matrix to confirm
    text: "The grants follow the role matrices read from the scanned pages; the bank reconciliation is held today by the Accountant and Finance Manager roles (AQ28, CLR-AC-15)."
    handling: "BDOI confirms the matrix; a change of a grant is applied through an access request, without a change to the screens."
    example: "BDOI confirms that the GL Officer reconciles the bank accounts: the permission is added to the role."
  - topic: Integrations pending BDOI IT specifications
    text: "The DCTF to TPD, BDO Business Online Banking, the e-filing of the BIR forms and the GARD transmission depend on BDOI IT and the bank (AQ09, AQ07, AQ31)."
    handling: "Files are produced and uploaded by the users until the transfers are specified; an automatic transfer is then a change request. The technical detail is in the Technical Specification, reviewed by BDOI IT."
    example: "The DCTF is downloaded from the end of day and forwarded to TPD until the transfer is agreed."
  - topic: Open questions and assumptions
    text: "Open questions of FRS section 10.3 follow the assumptions of section 10.1; chapter 21 lists the proposed rules and clarifications for confirmation."
    handling: "Answered as configuration where possible (lists of values, parameters, templates, rules); otherwise a change request; the assumption stands until then."
    example: "A check goes stale after 180 days until BDOI confirms the period; the answer is a parameter value."

# Entry and exit criteria of the sign-off, and the definition of done.
entry:
  - "Every screenshot of the set is taken on the SIT environment with seed data."
  - "Reviewers have their SIT users and the walkthrough sessions are held."
  - "The test plan is traced to the FRS and to the screens."
  - "The BRD-2 Operations walkthroughs are held (the remittance batches, refunds and cashiering validations are the input of Disbursement and ACSL)."
exit:
  - "Every row of the workbook reviewed by its unit (Accept, Change requested or Comment)."
  - "Every comments log item closed: answered, corrected in v2.1, or raised as a change request."
  - "Open questions closed or accepted as assumptions."
  - "The sign-off certificate signed by every signatory of the Who signs what matrix: prepared, input, reviewed and approved as on the BRD-5 approval sheets; the Head of Comptrollership approves the whole set."
done:
  - "Signed certificate filed with the set; version history updated."
  - "Content frozen as signed; deltas listed in the Change Management Register with mandays."
  - "Test plan agreed for SIT and UAT."

# Handover checklist.
handover:
  - "Signed FRS, sign-off workbook and screens"
  - "Open questions closed or accepted as assumptions"
  - "Configuration inputs from the business: the chart of accounts and its mapping, the accounting entries of every transaction, the cost-centre rules and the employees, the report and schedule layouts, the payees, the bank accounts and check series, the bank file and form layouts, the service-fee rates and recipients, the SOA layouts of the insurers, the lists of values, users and roles"
  - "Agreed test plan"
  - "Migration mapping of the opening balances, the open items and the payees signed (BRD-13)"
handover_note: "After sign-off the content is frozen as signed and the approved deltas are scheduled."

