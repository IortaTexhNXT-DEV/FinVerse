# Guide to the BRD-5 Accounting, Disbursement and ACSL business sign-off pack: the content of the Sign-off Pack Guide
# deck (signoff/build_guide_deck.py) and of the Start Here guide (START_HERE_BRD05.md, ```pack blocks "guide-*").
# The same layout is used for every BRD set; only this file changes.
meta:
  deck_title: Sign-off Pack Guide
  module: Accounting, Disbursement and ACSL
  owner: "Comptrollership (FRBS, Disbursement, ACSL), with Marketing for the refund and cash-advance requests"
  issued: Fri 2-Oct-2026
  signoff_date: Wed 23-Dec-2026

# The documents of the set in reading order. kind = doc type of the file name (brand.READING_ORDER).
documents:
  - {kind: StartHere, name: Accounting Disbursement ACSL, ext: docx, what: "Start Here: the map of the pack, who reads what, who signs what, the steps and the dates", readers: Everyone, when: "First, on issue"}
  - {kind: GuideDeck, name: Accounting Disbursement ACSL, ext: pptx, what: "Sign-off Pack Guide: purpose, approach, the module at a glance, caveats and impacts on other modules, entry and exit criteria, change control", readers: "Head of Comptrollership, the product owners of FRBS, Disbursement, ACSL and Marketing; presented at the kick-off", when: "Kick-off session"}
  - {kind: FRS, name: Accounting Disbursement ACSL, ext: docx, what: "Functional Requirements Specification v2.0: requirements of the two former volumes in one document, navigation, 51 screen specifications with screenshots, five walkthroughs, messages, notifications, documents, upload templates, cross-BRD contract", readers: "The GL team, Disbursement, ACSL and the Marketing requesters for their sections; Operations and BDOI IT for their chapters", when: "During the review, with the SIT walkthroughs"}
  - {kind: Signoff, name: Accounting Disbursement ACSL, ext: xlsx, what: "Sign-off workbook: one row per screen, field, rule and message with the BU review columns; comments log, meeting minutes, version history, sign-off certificate", readers: "Every reviewer; the approvers sign it", when: "During the review and at sign-off"}
  - {kind: TestPlan, name: Accounting Disbursement ACSL, ext: xlsx, what: "Test plan workbook: the test cases of both former volumes traced to the FRs and to the screens, including one screen case and one message case per screen", readers: "Business users who will run UAT; BDOI IT", when: "After the screens; used again in SIT and UAT"}
  - {kind: TestPlan, name: Accounting Disbursement ACSL Summary, ext: docx, what: "Test plan summary: scope, approach, coverage and the cases by area", readers: "Product owners, BDOI IT", when: "Before sign-off"}
  - {kind: UXDeck, name: Accounting Disbursement ACSL, ext: pptx, what: "UX Screen Deck for the BDOI UX Design team: design foundation, navigation and personas, every walkthrough step by step and every screen with all its states", readers: "BDOI UX Design team", when: "From the issue, in parallel with the review; re-issued with each version of the set"}
  - {kind: UXScreens, name: Accounting Disbursement ACSL, ext: xlsx, what: "UX screen register: one row per screen image with the screen, personas, walkthrough and step, state, FRS section and requirements, UXD status and comments, and the Changed in this issue flag", readers: "BDOI UX Design team", when: "Kept by the UX Design team; the changed rows are flagged at each issue"}
  - {kind: UXScreens, name: Accounting Disbursement ACSL, ext: zip, what: "Image package: every screen image at twice the screen resolution (PNG), the component crops and the register as CSV", readers: "BDOI UX Design team", when: "Imported into the design tool at each issue"}

# Reading order per role (FRS chapter numbers of v2.0).
reading:
  - role: "Approvers (Head of Comptrollership; product owners of FRBS and ACSL, Disbursement, Comptrollership and Operations, Marketing)"
    order: "00 Start Here; 01 Guide deck; FRS chapters 1-3 (context and personas), 14 (walkthroughs), 20 (sign-off) and 21 (proposed rules for confirmation); workbook Sign-off certificate"
  - role: "GL team (GL Officers, GL Team Lead, GL Section Head)"
    order: "FRS sections 4.1 to 4.10; the screens SCR-AC-01 to 24 of chapter 13; walkthroughs A and D; messages in chapter 15; configuration in chapter 9"
  - role: "Disbursement (Processors, Team Leaders, Approvers)"
    order: "FRS section 4.11; the screens SCR-AC-25 to 38; walkthroughs B and E; the documents DO-01 to DO-03 and DO-05 in chapter 17; the upload templates in chapter 18"
  - role: "Marketing (Processors, Reviewers, Approvers) and Human Resources"
    order: "FRS section 4.12; the screens SCR-AC-39 to 44; walkthrough B (steps 1 to 4 and 8) and E; the Refund Request Form DO-04"
  - role: "ACSL (Processors, Team Leader, Head)"
    order: "FRS section 4.13; the screens SCR-AC-45 to 51; walkthrough C; the reconciliation report DO-06"
  - role: "Operations (Cashiering and Remittance, BRD-2)"
    order: "The hand-offs of chapter 19 (remittance payments, refund validations, payment reversals, remittance deductions); walkthrough B; FRS sections 4.11 and 4.13"
  - role: "Business and System Administrators"
    order: "FRS section 4.10 (administration) and configuration in chapter 9; the lists of values and access screens of the BRD-1 and BRD-11 sets; Menu by persona in chapter 12"
  - role: BDOI IT
    order: "Interfaces and integration (chapter 7), non-functional requirements (chapter 8), configuration and jobs (chapter 9), cross-BRD contract (chapter 19), the bank files of chapter 17; the Technical Specification, reviewed by BDOI IT"
  - role: BDOI UX Design team
    order: "07 UX Screen Deck: design foundation and navigation first, then the personas, walkthroughs and screens of the design work; 08 UX screen register (filter Changed in this issue at each new issue); 09 image package in the design tool"
  - role: iorta TechNXT project team
    order: "All documents; keeps the comments log, the meeting minutes and the version history of the workbook, answers every comment and keeps the traceability to SIT and UAT"

# Approach and step-by-step flow up to closure. raci: R responsible, A accountable, C consulted, I informed.
steps:
  - step: 1
    name: Pack issued
    who: "R: iorta TechNXT Project Manager; A: iorta TechNXT delivery lead; I: all reviewers"
    inputs: "FRS v2.0, workbook, test plan, guide and deck"
    outputs: "Release set v2.0 in the BRD-05 folder; invitations to the sessions"
    duration: "Day 0 (Fri 2-Oct-2026); sessions scheduled after the BRD-4 Collections walkthroughs"
  - step: 2
    name: Kick-off and screen walkthrough on SIT
    who: "R: iorta TechNXT Business Analysis; A: Head of Comptrollership; C: product owners of FRBS, ACSL, Disbursement and Marketing; I: Operations, BDOI IT"
    inputs: "Guide deck; SIT users with seed data; walkthroughs A to E"
    outputs: "Screens shown live (general ledger and closing, reports and service fee, Disbursement, the Marketing requests, ACSL); first questions logged in the comments log; minutes"
    duration: "5 sessions, 25-Nov to 1-Dec-2026"
  - step: 3
    name: Review with the workbook
    who: "R: GL team, Disbursement, ACSL and Marketing reviewers; A: the product owners; C: iorta TechNXT (questions)"
    inputs: "FRS chapters of the area; workbook sheets with the BU review columns"
    outputs: "Every row marked Accept, Change requested or Comment; comments log entries"
    duration: "10 working days after the walkthroughs, until Mon 14-Dec-2026"
  - step: 4
    name: Comments consolidated and a Q&A session
    who: "R: iorta TechNXT Project Manager and Business Analysis; A: Head of Comptrollership; C: reviewers"
    inputs: "Returned workbooks"
    outputs: "One consolidated comments log, each item typed (clarification, correction, change request) and answered; Q&A minutes"
    duration: "2 working days, Q&A on Wed 16-Dec-2026"
  - step: 5
    name: One revision cycle (v2.1)
    who: "R: iorta TechNXT Business Analysis; A: iorta TechNXT delivery lead; C: reviewers who raised the items"
    inputs: "Agreed clarifications and corrections"
    outputs: "Release set v2.1 with the changed rows marked; change requests raised for the rest"
    duration: "2 working days, v2.1 on Fri 18-Dec-2026; check by the reviewers until Tue 22-Dec-2026"
  - step: 6
    name: Sign-off meeting and signature
    who: "R: iorta TechNXT Project Manager; A: Head of Comptrollership; C: the product owners, BDOI IT, Business Project Services"
    inputs: "v2.1 (or v2.0 when no revision is needed); open items with their decision"
    outputs: "Signed sign-off certificate; minutes; open items accepted as assumptions or change requests"
    duration: "Wed 23-Dec-2026"
  - step: 7
    name: Content freeze
    who: "R: iorta TechNXT delivery lead; A: Head of Comptrollership; I: BDOI IT, other BRD owners"
    inputs: "Signed set; change requests with mandays"
    outputs: "Content frozen as signed; approved deltas scheduled in the Change Management Register"
    duration: "From Mon 28-Dec-2026"
  - step: 8
    name: Traceability into SIT and UAT
    who: "R: iorta TechNXT test lead; A: Head of Comptrollership; C: business users"
    inputs: "Signed FRS rows and test plan"
    outputs: "SIT and UAT runs traced to the signed screens, rules and messages; results against each row"
    duration: "SIT Jan - Jul 2027; UAT Aug - Dec 2027"

