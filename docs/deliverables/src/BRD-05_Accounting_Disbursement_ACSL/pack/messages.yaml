# Messages catalogue of BRD-5 Accounting, Disbursement and ACSL: sources, places and the fix the user makes.
# The message texts are read from the platform at every build (never typed here). This file says where each message
# appears (by the class or file that raises it) and what the user does. The administration messages of BASAU are
# specified in the BRD-1 (lists of values) and BRD-11 (users, roles and access requests) sets.
sources:
  backend_packages: [disbursement, payrequest, acsl, frbs, journal, coa, closing, currency, period]
  backend_classes_extra: [ScheduleRules, ScheduleDefinitionService, ScheduleEngine, BankMatchingService,
                          BankStatementParser, StatementFileImportService, BankReconciliation, BankAccountDirectory,
                          ReceivedCertificateService, Certificate2307Service, Certificate2307, EmployeeService,
                          CostCenterRuleService, ReportBatchService, ReportParameters, BankAccountService, ChequeBook]
  exclude_classes: [RecurringJournalService, RecurringJournalTemplate, JournalUploadService, SpreadsheetRows,
                    UploadTable, PeriodModuleLockService, RecurringLines]
  exclude_codes: [NOT_FOUND]
  # The descriptions of the upload types and the effect of a confirmation are screen texts, not messages.
  exclude_texts: ["^<message>$", "^<errors>$", "^<detail>$",
                  "^The (approvals exported|checks deposited|credit-to-account confirmation|payment requests|payees)",
                  "^The close will not run", "^Added by the preparer$"]
  bulk_handlers: [CoaUploadHandler, RequestUploadHandler, ChecksNegotiatedHandler, CtaCreditedHandler,
                  BobApprovedHandler, PayeeMigrationHandler]
  bulk_screen: "Disbursement Uploads (SCR-AC-30) and Chart Upload (SCR-AC-07)"
  frontend_dirs: [features/disbursement, features/payrequest, features/acsl, features/frbs, features/gl,
                  features/closing, features/receivables/BankStatementsPage.tsx,
                  features/receivables/BankReconciliationPage.tsx, features/receivables/MatchWorkbench.tsx,
                  features/receivables/BrsView.tsx, features/setup/CostCentreRulesPage.tsx,
                  features/setup/RevaluationRatesCard.tsx, features/setup/CurrencyRatesPage.tsx,
                  features/setup/StatementLayoutsPage.tsx, features/setup/LayoutFields.tsx,
                  features/setup/EmployeesPage.tsx, features/tax/ReceivedCertificatesPage.tsx,
                  features/tax/RecordCertificateDialog.tsx, features/tax/Certificates2307Page.tsx,
                  features/tax/BirOutputsPage.tsx, features/reports]

