# Who signs what in the BRD-5 Accounting, Disbursement and ACSL sign-off set: one definition, read by 00 Start Here,
# the 01 guide deck, the sign-off certificate of the 03 workbook, the Drop closure summary and the drop index
# (signoff_pack.py, "ownership"). The roles and units are those of the approval sheets of the BRD-5 documents: the
# main BRD (p.141-142), Addendum 1 (p.39-40) and the Workshop Addendum (p.15-16); a role the set adds is marked
# "Added for this set". The set holds business content only; the technical content is in the Technical
# Specification, reviewed by BDOI IT.
source: "BRD-5 approval sheets: main BRD p.141-142 (Prepared, Input Provided, Reviewed, Approved by), Addendum 1 p.39-40 and the Workshop Addendum p.15-16"

# id: short (matrix cells), role, organisation, capacity (as on the approval sheet), confirms, sheet (where the role
# is on the approval sheet).
roles:
  - {id: ITN, short: iorta TechNXT, role: "iorta TechNXT project team: Project Manager, Business Analysis, test lead", org: iorta TechNXT, capacity: Prepared by, confirms: "The set is complete and consistent as issued, traced to the BRD and to the screens; every comment is answered in the comments log", sheet: Added for this set (author of the FRS set)}
  - {id: BA, short: BA (BPS), role: "Business Analysts, Enterprise Services Group - Business Project Services (BPS) (Roda Lyn D. Gallardo; Zean C. Ibay and Jane Tagle for the Workshop Addendum)", org: BDO Unibank ESG, capacity: Prepared by, confirms: "The set states the BRD requirements as written; every departure is listed in the proposed rules and clarifications", sheet: "Prepared by (p.141, p.39, p.15)"}
  - {id: MBS, short: MBS input, role: "Marketing Business Services and System Support (MBS Team) (Ma. Fides Rivera; Ruby Evangelista and Darryl Castillo for the Workshop Addendum)", org: BDOI, capacity: Input provided by, confirms: "The non-functional requirements and the Marketing refund and cash-advance request screens, fields, rules and messages match the business input", sheet: "Input Provided by (p.141, p.39, p.15)"}
  - {id: PGM, short: Program Manager (BPS), role: "Program Manager, Enterprise Services Group - Business Project Services (BPS) (Dan Ace R. Cauton)", org: BDO Unibank ESG, capacity: Reviewed by, confirms: "Traceability of every BRD requirement to the set and completeness of the set", sheet: "Reviewed by (p.141, p.39, p.16)"}
  - {id: ACSLPO, short: ACSL product owners, role: "Product Owners - Comptrollership - ACSL (Freddie A. Atanque, Jennifer T. Lugtu)", org: BDOI, capacity: Reviewed by, confirms: "The ACSL screens, the reconciliations, cases, corrections and remittance deductions, and the accounting entries they post", sheet: "Reviewed by (p.141, p.40); Input Provided by (p.15)"}
  - {id: IT, short: BDOI IT, role: "BDOI Information Technology Group (Carmela A. Morfe, Yonille D. Guy, Abegail R. Panghulan, Nelda R. Ranchez)", org: BDOI, capacity: Reviewed by, confirms: "Scheduled runs and files, the bank files and forms, user access and menus, the hand-offs inside BIBS and the Technical Specification (a separate document); not the business screens", sheet: "Reviewed by (p.39)"}
  - {id: MBSR, short: MBS review, role: "Marketing Business Services and System Support (Rhommel Mark Galler)", org: BDOI, capacity: Reviewed by, confirms: "The Workshop Addendum functions for Marketing: the cost centres of the payments and the incentives", sheet: "Reviewed by (p.16)"}
  - {id: DISBPO, short: Disbursement PO, role: "Product Owner - Comptrollership - Disbursement (Rodrigo R. Dela Cruz)", org: BDOI, capacity: Approved by, confirms: "The Disbursement screens, fields, rules, messages, documents and bank files", sheet: "Approved by (p.141, p.40); Input Provided by (p.15)"}
  - {id: FRBSPO, short: FRBS and ACSL PO, role: "Product Owner - Comptrollership - FRBS and ACSL (Iris S. Marquez)", org: BDOI, capacity: Approved by, confirms: "The general ledger, closing, bank reconciliation, report pack, service fee and ACSL screens, rules and messages", sheet: "Approved by (p.141, p.40); Input Provided by (p.15)"}
  - {id: OPSPO, short: Comptrollership and Operations PO, role: "Product Owner - Comptrollership and Operations (Perjelyn Joy R. Gutierrez)", org: BDOI, capacity: Approved by, confirms: "The hand-offs with Operations: remittance payments, refund validations, payment reversals, remittance deductions and the regularisation of cancelled vouchers", sheet: "Approved by (p.142)"}
  - {id: MKTPO, short: Product Owner (Marketing), role: "Product Owner - Marketing, Processing and Collections, AVP (Shellah Marie C. Miranda)", org: BDOI, capacity: Approved by, confirms: "The Marketing refund, cash-advance and check-cancellation requests", sheet: "Approved by (p.142, p.40, p.16)"}
  - {id: COMP, short: Head - Comptrollership, role: "Head - Comptrollership, VP (Ronald Allan E. De Leon)", org: BDOI, capacity: Approved by, confirms: "Owns the set for Comptrollership and approves all of its contents", sheet: "Approved by (p.142, p.40, p.16)"}
  - {id: MKTH, short: Marketing head, role: "Head - Institutional Banking, SM and BDO Accounts, FVP (Roderick L. Lim; Head - Retail Marketing on the Workshop Addendum)", org: BDOI, capacity: Approved by, confirms: "The Marketing requests and the service fee of the referrers", sheet: "Approved by (p.142, p.40, p.16)"}

# Part of the set -> role ids that prepare it, provide input, review it and approve it (RACI style).
parts:
  - {part: "General ledger, closing, bank reconciliation and report screens (FRS sections 4.1-4.10, screens SCR-AC-01 to 24)", prepares: [ITN], input: [BA], reviews: [PGM, ACSLPO], approves: [FRBSPO, COMP]}
  - {part: "Disbursement screens, fields, documents and bank files (FRS section 4.11, screens SCR-AC-25 to 38)", prepares: [ITN], input: [BA], reviews: [PGM, IT], approves: [DISBPO, COMP]}
  - {part: "Marketing refund and cash-advance requests (FRS section 4.12, screens SCR-AC-39 to 44)", prepares: [ITN], input: [MBS], reviews: [PGM, MBSR], approves: [MKTPO, MKTH]}
  - {part: "ACSL screens, reconciliations, cases and corrections (FRS section 4.13, screens SCR-AC-45 to 51)", prepares: [ITN], input: [BA], reviews: [PGM, ACSLPO], approves: [FRBSPO, COMP]}
  - {part: "Business rules, validations and the accounting entries", prepares: [ITN], input: [BA, MBS], reviews: [PGM, ACSLPO], approves: [COMP, FRBSPO, DISBPO]}
  - {part: "Messages and notifications", prepares: [ITN], input: [MBS], reviews: [PGM], approves: [COMP]}
  - {part: "Hand-offs with Operations (remittance payments, refund validations, payment reversals, remittance deductions)", prepares: [ITN], input: [BA], reviews: [PGM, ACSLPO], approves: [OPSPO, COMP]}
  - {part: "Walkthroughs (end-to-end, screen by screen)", prepares: [ITN], input: [MBS], reviews: [PGM], approves: [COMP]}
  - {part: "Proposed business rules and clarifications for confirmation", prepares: [ITN, BA], input: [MBS], reviews: [PGM, ACSLPO], approves: [COMP, FRBSPO, DISBPO, MKTPO]}
  - {part: "Scheduled runs and files, bank files and forms, user access and menus by persona", prepares: [ITN], input: [MBS], reviews: [IT, PGM], approves: [COMP]}
  - {part: "Test plan (04 workbook, 05 summary)", prepares: [ITN], input: [MBS], reviews: [PGM, IT], approves: [COMP]}
  - {part: "UX screen deck, UX screen register and image package (07 to 09, for the BDOI UX Design team; the screens as specified in this set)", prepares: [ITN], input: [MBS], reviews: [PGM], approves: [COMP]}
  - {part: "Technical Specification (separate document, not part of the business sign-off)", prepares: [ITN], input: [IT], reviews: [IT], approves: [IT]}
