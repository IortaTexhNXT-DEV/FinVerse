# Elements shared by many screens, described once.
common:
  - name: Page header and company
    text: >-
      Every page shows its section and title, a one-line description and its actions on the right. The company in the
      header decides the records shown; lists, journals, reports and files are always of that company.
  - name: Work lists
    text: >-
      Lists show status tabs (with their counts where useful), a search box, a Filters button for the other criteria
      and the paged table ("Showing 1 to n of N results"). Rows alternate white and Background Blue; a long list
      scrolls inside its card with the header row in view. A row opens its record. Selecting rows enables the bulk
      actions of the tab (assign or post journals, approve vouchers, endorse or approve requests).
  - name: Record summary and reference chips
    text: >-
      A record opens with its reference chips (voucher, request, journal, case, correction, root invoice), its status
      pill, its flags (Automatic, Entry Edited, Posted, Returned) and the key facts. A reference chip copies the
      reference.
  - name: Workflow header and history
    text: >-
      A record with a workflow (disbursement voucher, payee, account funding, payment request, ACSL case and
      correction, service-fee run) shows the workflow header under the record header: a stepper of the stages in their
      order (passed stages ticked in blue, the current stage highlighted, the stages ahead in grey; a returned stage
      in amber, the last stage in green once reached), and one row with Current Stage, Since, Due (with the Overdue
      pill) and Assigned To, with the actions the user may take now on the right. The history table lists every step,
      newest first: Stage, From Stage, Action, By (the user's name; the role under it for the users who may read the
      roles of others: user administration, access review and audit), Date and Time, Remarks and Duration in Stage.
      "Workflow notice" in the action tables means the in-app notice of the move.
  - name: Maker-checker and separation of duties
    text: >-
      Every posting and every master change needs a second user: a journal is posted by another user than its
      submitter; a disbursement voucher is checked and approved by other users than its processor; a funding request
      is verified by another user than its maker and approved by two further users; a payee, a bank account and a
      check series change take effect when the approver authorises them; a correction entry is reviewed and approved
      by other users than its preparer; a service-fee run is approved by another user than its preparer. The action is
      not offered to the user who may not take it, and a refusal names the rule.
  - name: Accounting entries
    text: >-
      Every amount that BIBS posts goes through the accounting rules: the business event (a voucher approved, a check
      negotiated, a funding, a correction, a service-fee accrual) proposes the entry from the rule, the user sees it as
      Dr / Cr lines with the account, party, cost centre and amount, and the entry posts only when it balances. A
      voucher entry that the processor edits is marked Entry Edited for the approver. Posted entries are never changed;
      they are reversed by a linked entry.
  - name: Status pills and tags
    text: >-
      Statuses are outlined pills of one size and colour per state group; a pill never wraps. Statuses show their full
      label; an agreed short form, with the full label in the tooltip, is used only for a label longer than 21
      characters. Flags (Automatic, Entry Edited, Posting Failed, Returned) are tags.
  - name: Dates, amounts, rates and names
    text: >-
      Dates are entered with one date picker and shown as dd-MMM-yyyy; times as dd-MMM-yyyy HH:mm in Philippine time.
      Amounts show two decimals and thousand separators, with the currency in the column header or before the amount;
      negatives in brackets. Exchange rates show six decimals and percentage rates two to four. A period is shown in
      lists on two lines, the start date and "to" the end date. Lists of values show their labels, insurers their
      names and users their names.
  - name: Uploads
    text: >-
      Uploads (payment requests, bank confirmations, payees, the chart of accounts, bank statements, insurer
      statements) offer the template next to the upload; every row is checked before anything is saved and the rows
      read, valid and rejected are shown with their messages; only the valid rows are processed and a file uploaded
      before is refused.
  - name: Hand-offs between the units
    text: >-
      Work moves inside BIBS: an approved refund, cash advance or check cancellation of Marketing becomes a payment
      request in the Disbursement Workbench; a remittance, a commission refund or a service fee becomes a payment
      request when its batch or run is approved; a cancelled voucher goes back to the request's source; an ACSL case
      can ask Cashiering for a payment reversal and raise a correction entry. Each hand-off keeps the reference of its
      source.
  - name: Notifications and help
    text: >-
      The bell in the header shows the unread count and opens the notifications panel, grouped by day; each notice
      shows its title, a one-line summary, the record reference and the time, and opens its record. Mark Read, Mark
      All Read and View All are offered. Each user chooses the channels of the events on Notification Settings. The
      Help button of each page explains the screen.
  - name: Messages
    text: >-
      Every message follows one notice standard: a white notice with a thin bar and an icon in the colour of its kind
      (red error, amber warning, blue information, green success), a bold short title, then the business message with
      one bullet per missing item. Field errors appear under the field. A refusal by a business rule shows the
      business message only, without codes; only an unexpected system error offers Retry and a reference for support.
      Success is confirmed by a short message in the same standard.
  - name: Confirmations and bulk results
    text: >-
      Every approve, post, authorise, cancel, reverse and deactivate asks for confirmation in a dialog that names the
      record and the effect; actions that need a reason open a dialog with the reason and a comment. An action run on
      several selected records (post journals, approve vouchers, endorse or approve requests) processes each on its own
      and lists the outcome of each, so one failure does not stop the others.
  - name: Reports and exports
    text: >-
      Reports open in the report runner with their parameters, column filters and the export to Excel, PDF, ODS or
      CSV; several reports run together as a report batch. Large exports run in the background and are published
      with the time from which they may be downloaded.
