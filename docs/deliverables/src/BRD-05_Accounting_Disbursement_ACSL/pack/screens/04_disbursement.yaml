      - "Batches | Batch / Quarter / Certificates / Tax Withheld / Issued / PDF | Column | One row per batch with its PDF | - | Certificate batches | - | Read only | - | -"
      - "Certificate register | Certificate / Quarter / Payee / TIN / Income / Tax Withheld / Status | Column | One row per certificate | - | Certificates | - | Read only | - | -"
    actions:
