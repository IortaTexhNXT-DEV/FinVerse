  - id: SCR-AC-36
    title: Certificates Received
    route: /tax/received-certificates
    purpose: >-
      The register of the BIR 2307 certificates received from the insurers on commission and incentives: the
      certificate number, withholding agent, period covered, income, tax withheld and the journal that recorded it;
      a certificate is recorded with its income payments and cancelled with a reason.
    entry:
      - Disbursement Voucher › Tag CWT
    shots:
      - {state: list, user: disb, caption: "Certificates Received: the BIR 2307 certificates of the insurers with the journal posted"}
    fields:
      - "Tabs | All / Recorded / Cancelled | Tab | - | - | Certificates | All | - | - | -"
      - "Toolbar | Search Certificate No. or Agent | Text | - | N | - | Blank | - | Contains | -"
      - "List | Certificate No. / Withholding Agent / Period Covered / Income / Tax Withheld / Journal / Status | Column | The agent by name; the period on two lines | - | Certificates received | - | Read only | - | -"
      - "Record Certificate Received dialog | Certificate No. / Withholding Agent (Insurer Code) / Agent Name / Agent TIN | Text | The certificate and the agent | Y | Insurers | - | - | - | -"
      - "Record Certificate Received dialog | Period Covered From / Period Covered To / Date Received / Reference (DV / Remittance) | Date, text | dd-MMM-yyyy | Y / Y / Y / N | - | - | - | - | -"
      - "Record Certificate Received dialog | Income Payments | Rows | Kind, ATC, income and tax withheld of each payment | Y | Tax codes | - | - | At least one row | -"
    actions:
