# UX screen documents of the BRD-5 Accounting, Disbursement and ACSL set for the BDOI UX Design team: 07 UX Screen
# Deck, 08 UX screen register, 09 image package (docs/deliverables/src/signoff/build_ux_deck.py). The screens,
# fields, actions, walkthroughs and images come from the pack; this file holds what only the UX documents need: who
# each persona is, the images taken for the deck only (more states of a screen, the landing page and menu of each
# persona), the changes of the issue and the points for the UX Design team to confirm.

issue:
  version: "2.1"
  date: 8 October 2026
  # Re-base on the WS Addendum v04152026 (minutes of 4 May 2026): no screen of this set changes; the CPC2 report rule
  # follows the incentive tag of the booked transaction.
  changes:
    - ref: CHG-AC-2.1-01
      what: >-
        The CPC2 incentive report lists only the remitted lines whose booked transaction carries the CPC2 incentive
        tag (minutes of 4 May 2026)
      screens: [SCR-AC-38]

# The personas whose landing page and full menu the deck shows.
navigation:
  roles: [FRBS_PROCESSOR, FRBS_TL, FRBS_HEAD, ACCOUNTANT, FIN_ADMIN, DISBURSEMENT, DISB_TL, DISB_APPROVER, PRQ_PROCESSOR,
          PRQ_REVIEWER, PRQ_APPROVER, HR_APPROVER, ACSL_PROCESSOR, ACSL_TL, ACSL_HEAD, COMPTROLLERSHIP, BUSINESS_ADMIN,
          SYSADMIN, AUDITOR]
  # Identical menus are kept once: the ACSL Team Leader has the menu of the ACSL processor.
  shared:
    ux-nav-14-menu: BRD-05:ux-nav-13-menu

# Who each persona is (what they do comes from the persona table of the FRS unless given here).
personas:
  FRBS_PROCESSOR: {who: "A GL Officer of FRBS who prepares the manual entries, runs the report pack and the BIR forms and follows the service fee"}
  FRBS_TL: {who: "The GL Team Lead who assigns and posts the entries, keeps the chart, closes the month and the year and approves the service fee"}
  FRBS_HEAD: {who: "The GL Section Head who enters the monthly revaluation rate, authorises the chart and posts and reverses entries"}
  ACCOUNTANT: {who: "An accountant who imports the bank statements and reconciles the bank accounts",
               does: "Imports the statements of the bank accounts, matches the bank lines with the book entries and prepares the bank reconciliation statement of the month"}
  FIN_ADMIN: {who: "A Comptrollership administrator who keeps the accounting and cost-centre rules, the employees and the liquidation accounts"}
  DISBURSEMENT: {who: "A Disbursement Processor who encodes and uploads requests, prepares the vouchers, follows the instruments and tags the receipts and certificates"}
  DISB_TL: {who: "The Disbursement Team Leader who reviews the vouchers, keeps the payees, runs the end of day and requests and verifies the fundings"}
  DISB_APPROVER: {who: "A Disbursement Approver who approves the vouchers, authorises the payees and bank accounts and approves the fundings"}
  PRQ_PROCESSOR: {who: "A Marketing account officer who raises the refund, cash-advance and check-cancellation requests"}
  PRQ_REVIEWER: {who: "A Marketing reviewer who assigns, validates and endorses the requests"}
  PRQ_APPROVER: {who: "A Marketing approver who approves the requests and sends them to Disbursement"}
  HR_APPROVER: {who: "The Human Resources approver of the employee cash advances"}
  ACSL_PROCESSOR: {who: "An ACSL processor who uploads the insurer statements, investigates the cases and prepares the corrections"}
  ACSL_TL: {who: "The ACSL Team Leader who assigns the cases and corrections, endorses the corrections and confirms the remittance deductions"}
  ACSL_HEAD: {who: "The ACSL Head who approves the corrections"}
  COMPTROLLERSHIP: {who: "A Comptrollership officer with read access to the journals, Disbursement and ACSL"}
  BUSINESS_ADMIN: {who: "The business administrator who keeps the lists of values and the employees"}
  SYSADMIN: {who: "The system administrator of BIBS (BDOI IT operations)"}
  AUDITOR: {who: "An internal or external auditor with read access to the ledger, the reports and the records"}

