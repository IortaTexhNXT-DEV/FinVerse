# Documents generated by BRD-6 Renewal. Each is produced by BIBS from the renewal on screen; the letters carry the BDO
# Insure letterhead and page x of y and are kept in the documents of the renewal. The letter templates are versioned
# and maintained on the Document Templates screen; the lists are Excel workbooks.
# Columns: id | document | template | format | produced by | protected | fields and their source | image (slug)
documents:
  - id: DO-01
    name: Renewal Advice (first and second notice)
    template: Renewal Advice first notice and second notice templates (wording to confirm, RQ26)
    format: PDF, one per renewal; e-mailed to the client
    produced: Letters › Generate RA, then Send; Renewal › Letters tab › Download PDF
    protected: Yes when e-mailed (password in a separate e-mail)
    fields:
      - "Title: Renewal Advice - the assured - policy number (second notice: Second notice) – from the renewal"
      - "Client and policy: client name, policy number, insurer name and expiry date – from the expiring account"
      - "Renewal terms: renewal period, product, sum insured and renewal premium with the currency – from the renewal account, else the expiring terms"
      - "How to accept: reply to the e-mail, sign and return the Renewal Advice, or pay the renewal premium on or before the expiry date"
      - "Renewal reference and the name of the Account Officer – from the renewal"
    shot: doc-renewal-advice
    frs: [FR-RN-080, FR-RN-081]
  - id: DO-02
    name: Not for Renewal Letter and No Advice Letter
    template: Not for Renewal Letter and No Advice Letter templates (wording to confirm, RQ26)
    format: PDF, one per renewal; e-mailed to the client
    produced: Letters, tab NAL / NFR › Send Letters
    protected: Yes when e-mailed (password in a separate e-mail)
    fields:
      - "Client and policy: client name, policy number, insurer name and expiry date – from the expiring account"
      - "Not for Renewal Letter: the reason for Not for Renewal and the name of the Account Officer; No Advice Letter: that the policy is not renewed through BDOI and no action is needed"
      - "Reference: the renewal reference"
    shot: doc-closing-letter
    frs: [FR-RN-082, FR-RN-024]
  - id: DO-03
    name: Insurer extract
    template: (fixed layout of the extract per insurer, 28 columns of the BRD)
    format: Excel workbook, one per insurer batch; e-mailed to the insurer
    produced: Insurer Batches › New Batch, then Download or Send to Insurer
    protected: Yes when e-mailed (password in a separate e-mail)
    fields:
      - "Insurance Company, Invoice No, Assured Name, Risk Code, Inception Date, Expiry Date, Sum Insured, Premium Amount, Commission Rate, AR Client (Unpaid Balance), Is Mortgaged – from the expiring account and the ledger"
      - "Premium Rate (per cover), Policy No, Risk Description, Encoder Name, Unit Head, Business Origin, Account Type, Region, Area, Branch, Account Officer Name, Remarks – from the account and the sales organisation"
      - "BIPD for Motor, Seating Capacity for Motor, Auto Personal Accident for Motor, Sum Insured (per cover), Packaged / Non-Packaged – from the policy"
    shot: doc-insurer-extract
    frs: [FR-RN-070]
  - id: DO-04
    name: Expiry list download
    template: (columns of the renewal lists)
    format: Excel workbook of the list as shown, with its filters
    produced: Expiry List, My Dispositions, TL Review, Processing Worklist, Letters › Download
    protected: "No"
    fields:
      - "Renewal Reference, Status, Classification, Disposition, Expiring Invoice, Expiring ARN, Policy No., Client – from the renewal"
      - "Product, Line, Insurer, Segment, Branch, Unit, Account Officer, Assigned AO, Assigned PO, Expiry – from the expiring account and the assignments"
      - "Currency, Gross Premium, Sum Insured – from the expiring account (empty for LAMD and Contact Center)"
    shot: doc-expiry-list
    frs: [FR-RN-014]
  - id: DO-05
    name: Renewal account details
    template: (layout of the record details)
    format: PDF, one per renewal
    produced: Renewal › Details PDF
    protected: "No"
    fields:
      - "Renewal: renewal reference, status, classification, client, expiring invoice and ARN, policy number, insurer, expiry date, Account Officer and Processing Officer, gross premium and sum insured – from the renewal"
      - "Checks: the check, its outcome, severity and message – from the latest check run"
      - "Dispositions: disposition, reason, remarks, source, by and on – from the dispositions of the renewal"
    shot: doc-account-details
    frs: [FR-RN-041]
