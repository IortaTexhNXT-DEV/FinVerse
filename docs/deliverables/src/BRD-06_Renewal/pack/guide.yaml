# Key business rules and validations (highlights; the full list is in the workbook and FRS chapter 13).
rules:
  - "The booked accounts expiring at the lead days (140 by default) are extracted every day, once per policy year; Generate Expiry List takes any range. Extraction does not start the renewal: it is initiated explicitly."
  - "On initiation the checks run (reference, PN, risk code, LAMD, claims, endorsements, outstanding premium, KYC and others): a failed check never gives the Clean classification; the decision matrix proposes the disposition, automatic for a Clean renewal when the rule says so."
  - "The Account Officer gives the disposition only after viewing the account history; Not for Renewal needs its reason. The Team Leader posts, returns or overrides with remarks."
  - "A renewal For Renewal or on the New Business path is not posted while a blocking check fails."
  - "Processing sends the renewals to the insurer in batches, protected; the insurer's response is captured once; Renew As Is with a match moves the renewal to the Renewal Advice without re-keying."
  - "The Renewal Advice is generated from the latest template and e-mailed protected; fewer than 30 days before expiry it needs a recorded confirmation; it locks the renewal on the Marketing side."
  - "The client's acceptance (e-mail, signed Renewal Advice or payment) moves the renewal account to placement and booking; it books as business type Renewal."
  - "Risk codes, checks and package mappings are maker-checker; the classification rules and the decision matrix are versions activated by another user."

# Caveats and possibilities, and how each is handled.
caveats:
  - topic: Additional requirements
    text: "New needs can surface during the review, SIT or UAT."
    handling: "In-scope clarification when the signed text already covers it; otherwise a change request with mandays."
    example: "A reviewer asks for the bank officer on the Expiry List: a new column, so a change request; asking which renewals the Exceptions tab shows is a clarification."
  - topic: Impacts on other modules
    text: "Renewal reads the Operations ledger and the New Business account, and hands the renewal back to New Business as an account of business type Renewal for placement and booking. A change of a disposition path or of the acceptance can change what New Business receives."
    handling: "Each change is assessed against the cross-BRD contract (FRS chapter 19); when it touches another set, a delta sign-off of the affected pages of both sets."
    example: "Booking the renewal under its own business type changes the New Business booking screens: both owners confirm the delta."
  - topic: Other BRDs change Renewal
    text: "New Business (account, booking), Operations (balances, endorsements), Product Maintenance (packages), Claims (claims summary), Submitted Policies (hand-off), User Access (roles) and Data Migration (go-live) can change what Renewal shows."
    handling: "The change is raised against the other BRD and assessed against the contract; when it touches this set, a delta sign-off of the affected pages only."
    example: "Product Maintenance withdraws a package version: the product-renewable check fails for its renewals and they go to Review; signed as a delta."
  - topic: Lists of values and rules still to confirm
    text: "The reasons for Not for Renewal, the return, transfer and override reasons, the follow-up channels and outcomes, the check severities, the classification rules and the decision matrix carry provisional values marked to confirm (RQ01, RQ24)."
    handling: "BDOI gives its lists and rules; they are loaded as configuration on Lists of Values and Renewal Setup, without a change request."
    example: "BDOI adds the reason Client moved abroad: a list value, maintained by MBS."
  - topic: Letters and their wording
    text: "The Renewal Advice and the other letters use draft templates until BDOI gives its own wording (RQ26)."
    handling: "The templates are versioned on Document Templates; the new wording is a new version, without a change request."
    example: "Marketing adds the payment channels to the Renewal Advice: a new template version, approved by MBS."
  - topic: Integrations pending BDOI IT specifications
    text: "Insurer responses and LAMD reports are uploaded until a channel is agreed; the approved domains of the Renewal Advice e-mails are to confirm (RQ16)."
    handling: "Uploads are in scope now; an automatic channel later is a change request. The technical detail is in the Technical Specification, reviewed by BDOI IT."
    example: "LAMD sends its monthly report as a file; the LAMD user uploads it on LAMD Reports."
  - topic: Open questions and assumptions
    text: "Open questions of FRS section 10.3 follow the assumptions of section 10.1; chapter 21 lists the proposed rules and clarifications for confirmation."
    handling: "Answered as configuration where possible (lists of values, parameters, templates, rules); otherwise a change request; the assumption stands until then."
    example: "The lead days are 140 until BDOI confirms them; the answer is a parameter value."

# Entry and exit criteria of the sign-off, and the definition of done.
entry:
  - "Every screenshot of the set is taken on the SIT environment with seed data."
  - "Reviewers have their SIT users and the walkthrough sessions are held."
  - "The test plan is traced to the FRS and to the screens."
  - "The BRD-1 New Business walkthroughs are held (the expiring account and the renewal account are New Business screens)."
exit:
  - "Every row of the workbook reviewed by its team (Accept, Change requested or Comment)."
  - "Every comments log item closed: answered, corrected in v2.1, or raised as a change request."
  - "Open questions closed or accepted as assumptions."
  - "The sign-off certificate signed by every signatory of the Who signs what matrix: prepared, input, reviewed and approved as on the Renewal BRD approval sheets; the Product Owner approves the whole set."
done:
  - "Signed certificate filed with the set; version history updated."
  - "Content frozen as signed; deltas listed in the Change Management Register with mandays."
  - "Test plan agreed for SIT and UAT."

# Handover checklist.
handover:
  - "Signed FRS, sign-off workbook and screens"
  - "Open questions closed or accepted as assumptions"
  - "Configuration inputs from the business: the reasons and lists of values of Renewal, the lead days and the other parameters, the check severities, the classification rules and the decision matrix, the non-renewable risk codes, the package map of the migrated policies, the letter templates, the insurers' renewal e-mail addresses, users and roles"
  - "Agreed test plan"
  - "Migration of the in-force policies of the go-live window and of the Renewal Advices sent before go-live signed (BRD-13)"
handover_note: "After sign-off the content is frozen as signed and the approved deltas are scheduled."

