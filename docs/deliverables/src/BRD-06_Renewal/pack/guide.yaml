# Guide to the BRD-6 Renewal business sign-off pack: the content of the Sign-off Pack Guide deck
# (signoff/build_guide_deck.py) and of the Start Here guide (START_HERE_BRD06.md, ```pack blocks "guide-*").
# The same layout is used for every BRD set; only this file changes.
meta:
  deck_title: Sign-off Pack Guide
  module: Renewal
  owner: "Marketing (Retail, Corporate and Commercial), Processing and Marketing Business Services and System Support"
  issued: Thu 8-Oct-2026
  signoff_date: Fri 27-Nov-2026

# The documents of the set in reading order. kind = doc type of the file name (brand.READING_ORDER).
documents:
  - {kind: StartHere, name: Renewal, ext: docx, what: "Start Here: the map of the pack, who reads what, the steps and the dates", readers: Everyone, when: "First, on issue"}
  - {kind: GuideDeck, name: Renewal, ext: pptx, what: "Sign-off Pack Guide: purpose, approach, the module at a glance, caveats and impacts on other modules, entry and exit criteria, change control", readers: "Product Owners, Marketing heads and the Combank / Corbank Unit Head; presented at the kick-off", when: "Kick-off session"}
  - {kind: FRS, name: Renewal, ext: docx, what: "Functional Requirements Specification v2.0: requirements, navigation, 20 screen specifications with screenshots, five walkthroughs, messages, notifications, documents, uploads, cross-BRD contract", readers: "Marketing Team Leaders and Account Officers, Processing Team Leaders and Officers, MBS; Contact Center, LAMD and BDOI IT for their chapters", when: "During the review, with the SIT walkthroughs"}
  - {kind: Signoff, name: Renewal, ext: xlsx, what: "Sign-off workbook: one row per screen, field, rule and message with the BU review columns; comments log, meeting minutes, version history, sign-off certificate", readers: "Every reviewer; the business owner signs it", when: "During the review and at sign-off"}
  - {kind: TestPlan, name: Renewal, ext: xlsx, what: "Test plan workbook: the test cases traced to the FRs and to the screens, including one screen case and one message case per screen", readers: "Business users who will run UAT; BDOI IT", when: "After the screens; used again in SIT and UAT"}
  - {kind: TestPlan, name: Renewal Summary, ext: docx, what: "Test plan summary: scope, approach, coverage and the cases by area", readers: "Business owner, BDOI IT", when: "Before sign-off"}
  - {kind: UXDeck, name: Renewal, ext: pptx, what: "UX Screen Deck for the BDOI UX Design team: design foundation, navigation and personas, every walkthrough step by step and every screen with all its states", readers: "BDOI UX Design team", when: "From the issue, in parallel with the review; re-issued with each version of the set"}
  - {kind: UXScreens, name: Renewal, ext: xlsx, what: "UX screen register: one row per screen image with the screen, personas, walkthrough and step, state, FRS section and requirements, UXD status and comments, and the Changed in this issue flag", readers: "BDOI UX Design team", when: "Kept by the UX Design team; the changed rows are flagged at each issue"}
  - {kind: UXScreens, name: Renewal, ext: zip, what: "Image package: every screen image at twice the screen resolution (PNG), the component crops and the register as CSV", readers: "BDOI UX Design team", when: "Imported into the design tool at each issue"}

# Reading order per role (FRS chapter numbers of v2.0).
reading:
  - role: Business owner (Product Owners; Marketing heads; Combank / Corbank Unit Head)
    order: "00 Start Here; 01 Guide deck; FRS chapters 1-3 (context and personas), 14 (walkthroughs), 20 (sign-off) and 21 (proposed rules for confirmation); workbook Sign-off certificate"
  - role: Marketing Team Leaders
    order: "FRS sections 4.2 to 4.6; Expiry List, TL Review and Transfers (SCR-RN-02, 08, 09); walkthroughs A, D and E; messages in chapter 15"
  - role: Marketing Account Officers (Account Brokers)
    order: "My Dispositions, the renewal and its tabs, Set Disposition (SCR-RN-03 to 07); Letters and Record Acceptance (SCR-RN-13, 14); walkthroughs A, B and D"
  - role: Processing Team Leaders and Processing Officers
    order: "FRS sections 4.7 and 4.8; Processing Worklist, Insurer Batches and Record Insurer Response (SCR-RN-10 to 12); Package Map and Go-live (SCR-RN-19, 20); walkthrough B; the insurer extract DO-03 in chapter 17"
  - role: "Contact Center and LAMD"
    order: "Follow-ups (SCR-RN-15) and walkthrough C for the Contact Center; LAMD Reports (SCR-RN-16) and FRS FR-RN-025 for LAMD; the uploads in chapter 18"
  - role: Marketing Business Services and System Support (Business Administrator)
    order: "Renewal Setup (SCR-RN-17 to 20); configuration in chapter 9; the letters DO-01 and DO-02; the menus by persona in chapter 12"
  - role: BDOI IT
    order: "Interfaces and integration (chapter 7), non-functional requirements (chapter 8), configuration (chapter 9), cross-BRD contract (chapter 19); the Technical Specification, reviewed by BDOI IT"
  - role: BDOI UX Design team
    order: "07 UX Screen Deck: design foundation and navigation first, then the personas, walkthroughs and screens of the design work; 08 UX screen register (filter Changed in this issue at each new issue); 09 image package in the design tool"
  - role: iorta TechNXT project team
    order: "All documents; keeps the comments log, the meeting minutes and the version history of the workbook, answers every comment and keeps the traceability to SIT and UAT"

# Approach and step-by-step flow up to closure. raci: R responsible, A accountable, C consulted, I informed.
steps:
  - step: 1
    name: Pack issued
    who: "R: iorta TechNXT Project Manager; A: iorta TechNXT delivery lead; I: all reviewers"
    inputs: "FRS v2.0, workbook, test plan, guide and deck"
    outputs: "Release set v2.0 in the BRD-06 folder; invitations to the sessions"
    duration: "Day 0 (Thu 8-Oct-2026); sessions in the Drop 1 window of November 2026"
  - step: 2
    name: Kick-off and screen walkthrough on SIT
    who: "R: iorta TechNXT Business Analysis; A: BDOI Product Owner; C: Marketing and Processing input providers, MBS; I: Contact Center, LAMD, BDOI IT"
    inputs: "Guide deck; SIT users with seed data; walkthroughs A to E"
    outputs: "Screens shown live (expiry list and disposition, review and transfers, processing and the insurer, letters and acceptance, set-up); first questions logged in the comments log; minutes"
    duration: "3 sessions, 4 to 6-Nov-2026"
  - step: 3
    name: Review with the workbook
    who: "R: Marketing Team Leaders and Account Officers, Processing Team Leaders and Officers, MBS; A: Marketing Business Services and System Support; C: iorta TechNXT (questions)"
    inputs: "FRS chapters of the area; workbook sheets with the BU review columns"
    outputs: "Every row marked Accept, Change requested or Comment; comments log entries"
    duration: "10 working days after the walkthroughs, until Fri 20-Nov-2026"
  - step: 4
    name: Comments consolidated and a Q&A session
    who: "R: iorta TechNXT Project Manager and Business Analysis; A: BDOI Product Owner; C: reviewers"
    inputs: "Returned workbooks"
    outputs: "One consolidated comments log, each item typed (clarification, correction, change request) and answered; Q&A minutes"
    duration: "2 working days, Q&A on Tue 24-Nov-2026"
  - step: 5
    name: One revision cycle (v2.1)
    who: "R: iorta TechNXT Business Analysis; A: iorta TechNXT delivery lead; C: reviewers who raised the items"
    inputs: "Agreed clarifications and corrections"
    outputs: "Release set v2.1 with the changed rows marked; change requests raised for the rest"
    duration: "1 working day, v2.1 on Wed 25-Nov-2026; check by the reviewers until Thu 26-Nov-2026"
  - step: 6
    name: Sign-off meeting and signature
    who: "R: iorta TechNXT Project Manager; A: BDOI Product Owner; C: Product Owners, Marketing heads, Combank / Corbank Unit Head, BDOI IT"
    inputs: "v2.1 (or v2.0 when no revision is needed); open items with their decision"
    outputs: "Signed sign-off certificate; minutes; open items accepted as assumptions or change requests"
    duration: "Fri 27-Nov-2026"
  - step: 7
    name: Content freeze
    who: "R: iorta TechNXT delivery lead; A: BDOI Product Owner; I: BDOI IT, other BRD owners"
    inputs: "Signed set; change requests with mandays"
    outputs: "Content frozen as signed; approved deltas scheduled in the Change Management Register"
    duration: "From Mon 30-Nov-2026"
  - step: 8
    name: Traceability into SIT and UAT
    who: "R: iorta TechNXT test lead; A: BDOI Product Owner; C: business users"
    inputs: "Signed FRS rows and test plan"
    outputs: "SIT and UAT runs traced to the signed screens, rules and messages; results against each row"
    duration: "SIT Jan - Jul 2027; UAT Aug - Dec 2027"

