# Who signs what in the BRD-6 Renewal sign-off set: one definition, read by 00 Start Here, the 01 guide deck, the
# sign-off certificate of the 03 workbook, the Drop closure summary and the drop index (signoff_pack.py, "ownership").
# The roles and units are those of the approval sheets of the Renewal BRD: the Renewal Addendum of the workshop
# (p.16-18), Renewal Addendum 1 (p.35-38) and the RMEL Phase 2 Online Dispositioning BRD (p.188-189); a role the set
# adds is marked "Added for this set". The Information Technology Group reviewers of Addendum 1 sign here as
# reviewers of the scheduled runs, the access and the Technical Specification.
# The set holds business content only; the technical content is in the Technical Specification, reviewed by BDOI IT.
source: "Renewal BRD approval sheets: Renewal Addendum (Workshop) p.16-18, Renewal Addendum 1 p.35-38 and the RMEL Phase 2 Online Dispositioning BRD p.188-189 (Prepared, Input provided, Reviewed, Approved by)"

# id: short (matrix cells), role, organisation, capacity (as on the approval sheet), confirms, sheet (where the role
# is on the approval sheet).
roles:
  - {id: ITN, short: iorta TechNXT, role: "iorta TechNXT project team: Project Manager, Business Analysis, test lead", org: iorta TechNXT, capacity: Prepared by, confirms: "The set is complete and consistent as issued, traced to the BRD and to the screens; every comment is answered in the comments log", sheet: Added for this set (author of the FRS set)}
  - {id: BA, short: BA (BPS), role: "Business Analysts, Enterprise Services Group - Business Project Services (BPS) (Zean C. Ibay, Roda Lyn D. Gallardo, Jane Tagle)", org: BDO Unibank ESG, capacity: Prepared by, confirms: "The set states the BRD requirements as written; every departure is listed in the proposed rules and clarifications", sheet: "Prepared by (p.16, p.35, p.188)"}
  - {id: MKTI, short: Marketing & MBS input, role: "Marketing Business Services and System Support and the Marketing and Processing input providers (Ma. Fides R. Rivera, Rose Marie Lique, Jackie Lyn Serrano, Marie Grace Mendiola, Berna Corpuz, Maria Cecilia Remodo, Alma Aramburo Olegario, Grace Tordesillas, Jocimarie Biaoco Palcat, Angelo Tiu Alibuyog, Amara Camille Linis Cruz, Racquel Jimenez, Clarissa Pagalanan, Herbert De Guzman)", org: BDOI, capacity: Input provided by, confirms: "The expiry list, disposition, Team Leader review, transfer, processing, insurer, letter, acceptance and follow-up screens, fields, rules and messages match the business input", sheet: "Input provided by (p.16-17, p.35-36, p.188)"}
  - {id: MBS, short: MBS review, role: "Marketing Business Services and System Support (Rhommel Mark Galler)", org: BDOI, capacity: Reviewed by, confirms: "The lists of values, templates, set-up and the menus of the Renewal users as the business administers them", sheet: "Reviewed by (p.18)"}
  - {id: IT, short: BDOI IT, role: "BDOI Information Technology Group (Angela Villamarzo Ramirez, Ma. Carmela Austria Morfe)", org: BDOI, capacity: Reviewed by, confirms: "Scheduled runs, uploads, protected e-mails, user access and menus and the Technical Specification (a separate document); not the business screens", sheet: "Reviewed by (p.37)"}
  - {id: PGM, short: Program Manager (BPS), role: "Program Manager, Enterprise Services Group - Business Project Services (BPS) (Dan Ace R. Cauton)", org: BDO Unibank ESG, capacity: Reviewed by, confirms: "Traceability of every BRD requirement to the set and completeness of the set", sheet: "Reviewed by (p.18, p.37, p.188)"}
  - {id: PO, short: Product Owner, role: "Product Owner, AVP (Shellah Marie C. Miranda)", org: BDOI, capacity: Approved by, confirms: "Owns the set and approves all of its contents", sheet: "Approved by (p.18, p.38, p.188)"}
  - {id: PO2, short: Product Owner (2), role: "Product Owner, AVP (Jose Melvin Jarin)", org: BDOI, capacity: Approved by, confirms: "The addendum functions: sanitation, classification, decision matrix, LAMD and Contact Center, insurer responses and the progression to placement and booking", sheet: "Approved by (p.18, for regularization)"}
  - {id: UH, short: Combank / Corbank UH, role: "Unit Head - Combank and Corbank Marketing / Corporate Processing, SAVP (Mark Joseph C. Makalintal)", org: BDOI, capacity: Approved by, confirms: "The screens, rules and messages of the Corporate and Commercial Marketing units and of Corporate Processing", sheet: "Approved by (p.18, p.38, p.188, with e-mail sign-off)"}
  - {id: MKTH, short: Retail Marketing heads, role: "Head - Retail Marketing, VP (Edmundante F. Ramirez) and Head - Corporate and Retail Marketing, FVP (Roderick Lim)", org: BDOI, capacity: Approved by, confirms: "The screens, rules and messages of the Retail and Corporate Marketing units", sheet: "Approved by (p.18, p.38, p.189)"}
  - {id: COMP, short: Comptrollership, role: "Head - Comptrollership, VP (Ronald Allan E. De Leon)", org: BDOI, capacity: Approved by, confirms: "Informed of the set: the Renewal BRD marks the Comptrollership approval as not required; a renewal books through the New Business booking and posts nothing itself", sheet: "Approved by (p.18 and p.38: not required for this BRD)"}

# Part of the set -> role ids that prepare it, provide input, review it and approve it (RACI style).
parts:
  - {part: "Screens and fields (FRS screen specifications; workbook Screen catalogue, Field register)", prepares: [ITN], input: [MKTI], reviews: [PGM, MBS], approves: [PO, PO2, UH, MKTH]}
  - {part: "Business rules, checks, classification and the decision matrix", prepares: [ITN], input: [MKTI, BA], reviews: [PGM, MBS], approves: [PO, PO2, UH, MKTH]}
  - {part: "Messages and notifications", prepares: [ITN], input: [MKTI], reviews: [PGM], approves: [PO, MKTH]}
  - {part: "Documents and files (Renewal Advice, No Advice and Not for Renewal letters, insurer extract, expiry list and account details)", prepares: [ITN], input: [MKTI], reviews: [PGM, MBS], approves: [PO, UH, MKTH]}
  - {part: "Walkthroughs (end-to-end, screen by screen)", prepares: [ITN], input: [MKTI], reviews: [PGM], approves: [PO]}
  - {part: "Proposed business rules and clarifications for confirmation", prepares: [ITN, BA], input: [MKTI], reviews: [PGM, MBS], approves: [PO, PO2, UH, MKTH]}
  - {part: "Scheduled runs, uploads, protected e-mails, user access and menus by persona", prepares: [ITN], input: [MKTI], reviews: [IT, MBS], approves: [PO]}
  - {part: "Accounting impact: none of its own (a renewal books through the New Business booking)", prepares: [ITN], input: [BA], reviews: [PGM], approves: [COMP]}
  - {part: "Test plan (04 workbook, 05 summary)", prepares: [ITN], input: [MKTI], reviews: [PGM, IT], approves: [PO]}
  - {part: "UX screen deck, UX screen register and image package (07 to 09, for the BDOI UX Design team; the screens as specified in this set)", prepares: [ITN], input: [MKTI], reviews: [PGM], approves: [PO]}
  - {part: "Technical Specification (separate document, not part of the business sign-off)", prepares: [ITN], input: [IT], reviews: [IT], approves: [IT]}
