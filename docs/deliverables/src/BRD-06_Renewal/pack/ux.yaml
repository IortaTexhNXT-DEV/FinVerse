# UX screen documents of the BRD-6 Renewal set for the BDOI UX Design team: 07 UX Screen Deck, 08 UX screen register,
# 09 image package (docs/deliverables/src/signoff/build_ux_deck.py). The screens, fields, actions, walkthroughs and
# images come from the pack; this file holds what only the UX documents need: who each persona is, the images taken
# for the deck only (more states of a screen, the landing page and menu of each persona), the changes of the issue
# and the points for the UX Design team to confirm.

issue:
  version: "2.0"
  date: 8 October 2026
  # First issue of the UX screen documents of the set: every screen is new to the UX Design team.
  changes: []

# The personas whose landing page and full menu the deck shows.
navigation:
  roles: [MKT_TL, MKT_AO, PROCESSING_TL, PROCESSOR, CONTACT_CENTER, LAMD, BUSINESS_ADMIN, SYSADMIN, AUDITOR]

# Who each persona is (what they do comes from the persona table of the FRS unless given here).
personas:
  MKT_TL: {who: "A Marketing Team Leader who extracts the expiring accounts, assigns them, reviews and posts the dispositions and decides the transfers of the unit"}
  MKT_AO: {who: "A Marketing Account Officer (Account Broker) who gives the disposition of the assigned renewals, sends the Renewal Advice and records the client's acceptance"}
  PROCESSING_TL: {who: "The Processing Team Leader who assigns the posted renewals to the Processing Officers and approves the package choices of migrated policies"}
  PROCESSOR: {who: "A Processing Officer who creates the renewal account, sends the renewals to the insurer and records the insurer's answer"}
  CONTACT_CENTER: {who: "A Contact Center agent who follows up the clients who have not answered the Renewal Advice"}
  LAMD: {who: "A LAMD officer of the bank who uploads the monthly paid-off and past-due loan reports"}
  BUSINESS_ADMIN: {who: "The business administrator (MBS) who keeps the Renewal set-up, the lists of values and the letter templates"}
  SYSADMIN: {who: "The system administrator of BIBS (BDOI IT operations), who keeps the roles and their functions"}
  AUDITOR: {who: "An internal or external auditor with read access to Renewal and its reports"}

