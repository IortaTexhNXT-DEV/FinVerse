        steps:
          - Click Resolve and Close with the resolution blank.
        expected: The case stays Open - With Fulfillment Unit.
        msg: [Enter the resolution given to the client]
      - c: 3
        type: Workflow
        title: Request CSR action and close by the agent
        steps:
          - As fu1 open an open case; click Request CSR Action; enter the instruction Call the client to confirm the delivery address; confirm.
          - As agent1 open Cases > CSR Action Required; open the case; add a note; click Close with the resolution.
        expected: The case is listed in agent1's CSR Action Required queue with the instruction; after the agent's close it shows Closed by CSR.
      - c: 3
        type: Workflow
        persona: CSF_AGENT
        screen: CASE
        title: Re-endorse a returned case
        pre: The case of TC-CSF-052.1-01 is Open - Returned to Agent.
        steps:
          - Complete the missing details; click Re-endorse to Fulfilment Unit.
        expected: The case is back in the Fulfilment Unit Queue with the status Open - With Fulfillment Unit.
      - c: 4
        type: Security-access
        title: A member of another unit cannot act on the case
        steps:
          - Log in as fu2; send a Resolve and Close request for a Consumer 1 Motor case signed in as fu2.
        expected: The case is not in fu2's queue; the request is refused.
        msg: [You are not permitted to perform this action]

  FR-CSF-061:
    scenario: SC-CSF-12
    persona: SYSADMIN
    screen: LOV
    data: [TD-CSF-11]
    conditions:
      - The Log Case dialog offers the values of the case lists of the addendum.
      - A deactivated value is no longer offered and still shows on the cases that used it.
      - A routing row proposes its fulfilment unit on the next case; a duplicate value or routing row is refused.
    cases:
      - c: 1
        type: Positive
        persona: CSF_AGENT
        screen: LOGCASE
        title: Case lists of the addendum
        steps:
          - Open the Log Case dialog; open each list and count the values.
        expected: 3 channels, 7 case types, 125 natures of transaction, 51 product types, 33 market segments and 53 fulfilment units are offered, as in the addendum p.11-17.
      - c: 2
        type: Workflow
        title: Deactivate a nature of transaction
        steps:
          - Open Broking Setup > Lists of Values > CSF_CASE_NATURE; deactivate Test transaction.
          - As agent1 open the Log Case dialog; open a case that used Test transaction.
        expected: Test transaction is not offered on the dialog; the case still shows it.
      - c: 3
        type: Positive
        screen: ROUTING
        title: New routing row proposes its fulfilment unit
        steps:
          - Open Customer Service Facility > Case Routing; add case type Complaint, market segment Leasing, any nature of transaction, fulfilment unit IDG/Leasing; save.
          - As agent1 log a Complaint case for a client of the Leasing market segment.
        expected: IDG/Leasing is proposed as the fulfilment unit.
      - c: 3
        type: Negative
        screen: ROUTING
        title: Duplicate routing row refused
        steps:
          - Add the routing row of TC-CSF-061.3-01 a second time.
        expected: The row is not saved.
        msg: ["A routing row already exists for this case type, market segment and nature of transaction"]

access:
  - action: Open the Customer Search and the Servicing View
    screen: SEARCH
    permission: CSF_VIEW
    allow: [CSF_AGENT, CSF_SUPERVISOR, CSF_MANAGEMENT]
    deny: [SYSADMIN, MKT_AO]
    allowed: The Customer Search is the landing page and clients open in the Servicing View.
    denied: Customer Service Facility is not in the menu; its address shows the no-access page.
  - action: Verify the caller and change contact details
    screen: UPDATE
    permission: CSF_CONTACT_UPDATE
    allow: [CSF_AGENT, CSF_SUPERVISOR]
    deny: [CSF_MANAGEMENT, SYSADMIN]
    denied: Update Contact is not shown; a direct contact update request is refused.
  - action: Resend the RA or e-policy to the registered e-mail
    screen: RESEND
    permission: CSF_RESEND
    allow: [CSF_AGENT, CSF_SUPERVISOR]
    deny: [CSF_MANAGEMENT]
    denied: Resend is not shown; a direct resend request is refused.
  - action: Resend to another address with a reason
    screen: RESEND
    permission: CSF_RESEND_OTHER
    allow: [CSF_SUPERVISOR]
    deny: [CSF_AGENT, CSF_MANAGEMENT]
    allowed: The recipient field is editable and the reason is asked.
    denied: The recipient is read only; a direct request with another recipient is refused.
  - action: Upload documents from the Servicing View
    screen: DOCS
    permission: CSF_DOCUMENT_UPLOAD
    allow: [CSF_AGENT, CSF_SUPERVISOR]
    deny: [CSF_MANAGEMENT]
    denied: Upload is not shown; a direct upload request is refused.
  - action: Open and download documents
    screen: DOCS
    permission: ATTACHMENT_VIEW
    allow: [CSF_AGENT, CSF_SUPERVISOR]
    deny: [CSF_MANAGEMENT]
    denied: Documents cannot be opened or downloaded; a direct download request is refused.
  - action: Run the Contact Changes and Agent Activity reports
    screen: REPORTS
    permission: CSF_REPORT_VIEW
    allow: [CSF_SUPERVISOR, CSF_MANAGEMENT]
    deny: [CSF_AGENT, SYSADMIN]
    denied: The Customer Service category is not listed; a direct run request is refused.
  - action: Run the Audit Trail report (CTL-AUDIT)
    screen: AUDIT
    permission: AUDIT_VIEW
    allow: [CSF_MANAGEMENT, SYSADMIN]
    deny: [CSF_AGENT, CSF_SUPERVISOR]
    denied: Audit Trail is not in the menu; a direct run request is refused.
  - action: Maintain users and roles
    screen: USERS
    permission: USER_MANAGE, ROLE_MANAGE
    allow: [SYSADMIN]
    deny: [CSF_AGENT, CSF_SUPERVISOR, CSF_MANAGEMENT]
    denied: Administration > Users is not in the menu; the request is refused.
  - action: Log a case, add notes and documents, close own cases
    screen: LOGCASE
    permission: CSF_CASE_CREATE
    allow: [CSF_AGENT, CSF_SUPERVISOR]
    deny: [CSF_MANAGEMENT, CSF_FULFILMENT]
    denied: Log Case is not shown; a direct case creation request is refused.
  - action: Reassign, escalate, change the category and close any case
    screen: CASE
    permission: CSF_CASE_SUPERVISE
    allow: [CSF_SUPERVISOR]
    deny: [CSF_AGENT, CSF_FULFILMENT]
    denied: Reassign, Escalate and Change Category are not shown; a direct request is refused.
  - action: Resolve, return or request CSR action on cases of the user's units
    screen: FUQ
    permission: CSF_CASE_FULFIL
    allow: [CSF_FULFILMENT]
    deny: [CSF_AGENT, CSF_MANAGEMENT]
    denied: The Fulfilment Unit Queue is not in the menu; a direct request is refused.
  - action: Open the case dashboard and run the case reports
    screen: DASH
    permission: CSF_CASE_REPORT
    allow: [CSF_SUPERVISOR, CSF_MANAGEMENT]
    deny: [CSF_AGENT, CSF_FULFILMENT]
    denied: The Case Dashboard is not in the menu; a direct report run is refused.
  - action: Maintain the case routing table
    screen: ROUTING
    permission: CSF_CASE_ROUTING
    allow: [SYSADMIN]
    deny: [CSF_AGENT, CSF_SUPERVISOR, CSF_MANAGEMENT]
    denied: Case Routing is not in the menu; a direct change is refused.
