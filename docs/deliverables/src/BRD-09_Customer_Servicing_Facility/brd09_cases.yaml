          - Call the run of CSF-CONTACT-CHANGES signed in as agent1.
        expected: The Customer Service category and the Audit Trail are not offered; the request is refused.
        msg: [You are not permitted to perform this action]
      - c: 5
        type: Positive
        persona: SYSADMIN
        screen: AUDIT
        title: Report time and run log
        steps:
          - Time the run of TC-CSF-041.1-01.
          - Open the audit trail for report runs today.
        expected: The report was on screen within 5 seconds; the run and each export are logged with mgmt1 and the parameters.

  FR-CSF-042:
    scenario: SC-CSF-07
    persona: CSF_SUPERVISOR
    screen: REPORTS
    data: [TD-CSF-02]
    conditions:
      - Every CSF action - search with criteria, view, download, RA resend, e-policy resend, upload and contact change - writes an activity row.
      - The Agent Activity report shows counts per agent and day by action, then the detail rows.
      - The activity log cannot be switched off, changed or deleted.
      - A date range with the end before the start is refused.
      - An agent cannot run the Agent Activity report.
    cases:
      - c: 1
        type: Positive
        title: Each CSF action writes an activity row
        pre: agent2 performs one search, one view, one download, one RA resend, one e-policy resend, one upload and one contact change on TD-CSF-02 today.
        steps:
          - Run CSF-ACTIVITY for today and agent2.
        expected: Seven detail rows, one per action, each with client, reference and time; the search row shows the key type and criteria.
      - c: 2
        type: Report-output
        persona: CSF_MANAGEMENT
        title: Counts per agent and day
        steps:
          - Run CSF-ACTIVITY for the test week, all agents; export to Excel.
        expected: The summary shows counts per agent and day by action, followed by the detail rows; the Excel file holds the same figures.
      - c: 3
        type: Negative
        persona: SYSADMIN
        screen: PARAMS
        title: No setting switches the activity log off
        steps:
          - Search System Parameters and Scheduled Jobs for a CSF activity log setting.
          - Try an update and a delete of an activity row by a direct request.
        expected: No parameter or job disables the log; no update or delete is offered and direct requests are refused.
      - c: 4
        type: Negative
        title: End date before start date
        steps:
          - Run CSF-ACTIVITY with the end date before the start date.
        expected: The report does not run.
        msg: [The end date must be on or after the start date]
      - c: 5
        type: Security-access
        persona: CSF_AGENT
        title: The agent cannot run the Agent Activity report
        steps:
          - As agent1 send a direct request to run CSF-ACTIVITY.
        expected: The request is refused.
        msg: [You are not permitted to perform this action]

  FR-CSF-043:
    scenario: SC-CSF-08
    persona: INFRA
    screen: RESTORE
    conditions:
      - The changes are saved to the backup storage at least every 15 minutes, and a daily full backup runs outside the peak hours.
      - A restore recovers BIBS data to a point less than 15 minutes before the test.
      - Online response times stay within the targets while the changes are saved.
      - A failed archive or backup alerts the infrastructure team.
    cases:
      - c: 1
        type: Positive
        title: Backup interval and full backup schedule
        steps:
          - Read the backup interval of the changes and the backup schedule.
          - List the saved changes of the last two hours in the backup storage.
        expected: The backup interval is 15 minutes or less; changes are saved in every 15-minute window; the daily full backup runs outside 10:00-12:00 and 14:00-16:00.
      - c: 2
        type: Positive
        title: Restore to a point less than 15 minutes before the test
        steps:
          - Note the time T; make a contact change on SIT at T minus 20 minutes and another at T minus 5 minutes.
          - Restore the last full backup and the saved changes on the restore environment up to the latest point.
          - Check the two contact changes.
        expected: The restored data holds the change made at T minus 20 minutes and is recovered to a point less than 15 minutes before T.
      - c: 3
        type: Positive
        persona: CSF_AGENT
        screen: SEARCH
        title: Response times during archiving
        steps:
          - During an archive cycle run ten searches and open ten Servicing Views.
        expected: Every search and view answers within 3 seconds.
      - c: 4
        type: Negative
        title: Failed archive raises an alert
        steps:
          - Make the archive storage unavailable on the test environment; wait for the next archive attempt.
        expected: The archive fails and the infrastructure team receives the alert; archiving resumes when the storage is back.

  FR-CSF-050:
    scenario: SC-CSF-09
    persona: CSF_AGENT
    screen: LOGCASE
    data: [TD-CSF-02, TD-CSF-11, TD-CSF-12]
    conditions:
      - A case submitted with all mandatory fields gets a unique Case ID, is linked to the client and the account and shows in the queue of the fulfilment unit with the status Open - With Fulfillment Unit.
      - A case with a blank mandatory field is refused and the missing fields are named.
      - A second case for the same client, account and nature of transaction is refused while the first is open.
      - The creation is recorded in the case history with the creator, date and time.
      - The members of the fulfilment unit receive the notification with the Case ID and the policy number.
      - A case resolved on the call is created with the status Closed by CSR and its resolution; a caller who is not a client is logged with name and contact.
    cases:
      - c: 1
        type: Positive
        title: Log a Request case for the CBG Motor account and submit it to the fulfilment unit
        steps:
          - Open the Servicing View of UAT CSF Client One; click Log Case.
          - Select the CBG Motor account; channel Phone; case type Request; nature of transaction Resend insurance policy/COC; product type Motor Vehicle Insurance; keep the proposed market segment and fulfilment unit; priority Normal.
          - Enter the subject and the description; click Submit to Fulfilment Unit.
        expected: The confirmation shows the Case ID CASE-yyyy-nnnnnn and the due date 4 working days after today. The case is listed on the Cases tab of the client and in the Fulfilment Unit Queue of Consumer 1 Motor with the status Open - With Fulfillment Unit.
      - c: 1
        type: Workflow
        title: Two cases get different Case IDs
        steps:
          - Log a second case for the non-CBG Property account with another nature of transaction.
        expected: The second case gets the next Case ID; both cases are listed on the Cases tab of the client with their own account.
      - c: 2
        type: Negative
        title: Case without nature of transaction and fulfilment unit
        steps:
          - Click Log Case; fill everything except the nature of transaction and the fulfilment unit; click Submit to Fulfilment Unit.
        expected: No case is created; the dialog stays open with both fields marked.
        msg: ["Complete the mandatory fields - Nature of transaction, Fulfilment unit"]
      - c: 3
        type: Negative
        title: Second open case for the same transaction is refused
        pre: The case of TC-CSF-050.1-01 is open.
        steps:
          - Log a case for the same client, the same CBG Motor account and the nature of transaction Resend insurance policy/COC.
        expected: No case is created; BIBS names the open case and offers Open case, which opens it.
        msg: ["Case <Case ID> is already open for this client, account and nature of transaction. Add a note to it instead"]
      - c: 3
        type: Boundary
        title: Same nature of transaction after the first case is closed
        pre: The case of TC-CSF-050.1-01 is closed.
        steps:
          - Log a case for the same client, account and nature of transaction.
        expected: The case is created with a new Case ID; the duplicate check applies to open cases only.
      - c: 4
        type: Positive
        screen: CASE
        title: Creation in the case history
        steps:
          - Open the case of TC-CSF-050.1-01; open the History tab.
        expected: The first row is Case created with agent1's name, the date and time and the values of every field.
      - c: 5
        type: Positive
        persona: CSF_FULFILMENT
        screen: NOTIF
        title: Fulfilment unit notification
        steps:
          - Log in as fu1 (member of Consumer 1 Motor); open the bell and the test mailbox of fu1.
        expected: The notice and the e-mail give the Case ID, the policy number, the case type, the nature of transaction and the due date; the account officer of the account received a copy.
      - c: 6
        type: Positive
        title: Inquiry answered on the call is closed by the CSR
        steps:
          - Log an Inquiry case with the nature of transaction Breakdown of insurance premium; enter the resolution; click Resolve and Close.
        expected: The case is created with the status Closed by CSR, the resolution and no notification to the fulfilment unit.
      - c: 6
        type: Negative
        title: Resolve and Close without the resolution
        steps:
          - Log an Inquiry case; leave the resolution blank; click Resolve and Close.
        expected: No case is created.
        msg: [Enter the resolution given to the client]
      - c: 6
        type: Positive
        screen: CASES
        title: Case for a caller who is not a client
        steps:
          - Open Cases; click Log Case; tick Caller not a client; enter the caller name and mobile; case type Inquiry; nature of transaction Directory assistance; Resolve and Close with the resolution.
        expected: The case is created without client and account, with the caller name and mobile, and the status Closed by CSR.

  FR-CSF-051:
    scenario: SC-CSF-09
    persona: CSF_AGENT
    screen: LOGCASE
    data: [TD-CSF-11, TD-CSF-14]
    conditions:
      - The due date is the creation date plus the turnaround time of the case type in working days.
      - Only a supervisor changes the category of a submitted case, with a reason.
      - A new case type recomputes the due date from the creation time and records the old and new type.
      - The list offers only the active case types, each with its turnaround time.
    cases:
      - c: 1
        type: Positive
        title: Due date of an Inquiry logged on a Monday
        pre: The test date is a Monday with no holiday in the week (TD-CSF-14).
        steps:
          - Log an Inquiry case and submit it to the fulfilment unit.
        expected: The due date is the Thursday of the same week (3 working days).
      - c: 1
        type: Boundary
        title: Due date across a holiday
        pre: A holiday of the BIBS calendar falls on the Wednesday (TD-CSF-14).
        steps:
          - Log an Inquiry case on the Monday.
        expected: The due date is the Friday; the holiday is not counted.
      - c: 2
        type: Security-access
        screen: CASE
        title: The agent cannot change the category of a submitted case
        steps:
          - As agent1 open a submitted case; look for Change Category.
          - Send a category change for the case signed in as agent1.
        expected: Change Category is not offered; the request is refused.
        msg: [You are not permitted to perform this action]
      - c: 3
        type: Workflow
        persona: CSF_SUPERVISOR
        screen: CASE
        title: Supervisor changes an Inquiry to a Complaint
        steps:
          - As sup1 open the Inquiry case of TC-CSF-051.1-01; click Change Category; select Complaint; enter the reason; confirm.
        expected: The due date becomes 6 working days after the creation date; the History tab shows the old and new case type, sup1 and the reason; the owner and the fulfilment unit are notified.
      - c: 3
        type: Negative
        persona: CSF_SUPERVISOR
        screen: CASE
        title: Category change without reason
        steps:
          - Click Change Category; select Problem; leave the reason blank; confirm.
        expected: The category does not change.
        msg: [Enter the reason for changing the category]
      - c: 4
        type: Positive
        title: Case type list with turnaround times
        steps:
          - Open the Case type list of the Log Case dialog.
        expected: Inquiry 3, Request 4, Request (1-day) 1, Problem 6, Complaint 6, Follow-up 1 and Commendation 6 are offered, each with its turnaround time in working days.

  FR-CSF-052:
    scenario: SC-CSF-10
    persona: CSF_FULFILMENT
