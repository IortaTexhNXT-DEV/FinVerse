      - c: 4
        type: Positive
        persona: CSF_SUPERVISOR
        screen: CASES
        title: Status and status group in the Cases list
        steps:
          - As sup1 open Cases > All Open, then Closed.
        expected: Each row shows the status label and its group - Open / In Progress, Pending or Closed - as in FRS section 5.3.

  FR-CSF-053:
    scenario: SC-CSF-09
    persona: CSF_AGENT
    screen: CASE
    data: [TD-CSF-12, TD-CSF-13]
    conditions:
      - Notes are listed in date order with their author, date and time.
