  FR-CSF-057:
    scenario: SC-CSF-11
    persona: CSF_SUPERVISOR
    screen: DASH
    data: [TD-CSF-13, TD-CSF-14]
    conditions:
      - A case one working day before its due date shows Approaching breach and the four recipients are notified once.
      - A case past its due date shows Breached on the case, the queue and the dashboard.
      - A breached case of a type set for automatic escalation is escalated with the reason Past TAT.
      - The age of a case is counted from its creation time.
    cases:
      - c: 1
        type: Boundary
        title: Approaching breach one working day before the due date
        pre: A Request case created 3 working days ago (due tomorrow) and a Request case created 2 working days ago (TD-CSF-13).
        steps:
          - Run the SLA check (or wait 15 minutes); open both cases and the bells of agent1, sup1, fu1 and the escalation group.
          - Run the SLA check a second time.
        expected: The case due tomorrow shows Approaching breach and the four recipients have one notice each; the case due in 2 days stays Within TAT; the second check sends no further notice.
      - c: 2
        type: Positive
        title: Breached case on the case, queue and dashboard
        pre: A Problem case created 7 working days ago is open (TD-CSF-13).
        steps:
          - Run the SLA check; open the case, the Team Queue and the Case Dashboard.
        expected: The case shows Breached in its header, its queue row and the breached count of the dashboard.
      - c: 3
        type: Workflow
        title: Automatic escalation of a breached Complaint
        pre: A Complaint case created 7 working days ago is open; Complaint is set for automatic escalation.
        steps:
          - Run the SLA check; open the case.
        expected: The case shows Escalated with the reason Past TAT; the escalation group is notified; the History tab shows the automatic escalation.
      - c: 3
        type: Negative
        neg: true
        title: No automatic escalation for a type not set for it
        pre: Commendation is not set for automatic escalation; a Commendation case created 7 working days ago is open.
        steps:
          - Run the SLA check; open the case.
        expected: The case shows Breached but is not escalated.
      - c: 4
        type: Positive
        persona: CSF_AGENT
        screen: CASE
        title: Age counted from creation
        steps:
          - Open a case created 2 working days ago that was returned to the agent yesterday.
        expected: The age shows 2 working days, counted from the creation, not from the return.

  FR-CSF-058:
    scenario: SC-CSF-09
    persona: CSF_AGENT
    screen: CASE
    data: [TD-CSF-13]
    conditions:
      - A closed case offers no edit, note, upload or status action.
      - A follow-up case created from a closed case has a new Case ID, and both cases show the link and the reason.
      - A case cannot be closed without the resolution and the closure reason.
