  FR-CSF-056:
    scenario: SC-CSF-11
    persona: CSF_SUPERVISOR
    screen: TEAMQ
    data: [TD-CSF-01, TD-CSF-13]
    conditions:
      - A reassigned case shows in the new owner's queue at once and leaves the old owner's queue.
      - An escalation without a reason is refused.
      - An escalated case shows the Escalated indicator with the reason in its header, its queue row and the dashboard.
      - An agent does not see Reassign or Escalate.
    cases:
      - c: 1
        type: Workflow
        title: Reassign a case from agent1 to agent2
        steps:
          - As sup1 select a case of agent1 in the Team Queue; Reassign; select agent2; enter the reason; confirm.
          - Log in as agent2 and open My Cases; log in as agent1 and open My Cases.
        expected: The case is in agent2's My Cases at once and no longer in agent1's; agent2 received the notification.
      - c: 2
        type: Negative
        screen: CASE
        title: Escalate without reason
        steps:
