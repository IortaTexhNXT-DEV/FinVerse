          - Open the Team Queue and the Case Dashboard.
        expected: The case keeps its status and shows Escalated with the reason and date in the header, the queue row and the dashboard; the escalation group and the owner are notified.
      - c: 4
        type: Security-access
        persona: CSF_AGENT
        screen: CASE
        title: The agent has no Reassign or Escalate
        steps:
