# Test plan BRD-9 Customer Servicing Facility - test data file.
# Build: python docs/deliverables/src/testplans/build_test_plan.py docs/deliverables/src/BRD-09_Customer_Servicing_Facility/brd09_cases.yaml
# Schema: see the header of build_test_plan.py. FR titles, BRD IDs and priorities come from the FRS.
# The expected results quote the message text of the FRS; screen paths follow the CSF screens of the FRS.

meta:
  brd: BRD-09
  name: Customer Servicing Facility
  code: CSF
  frs: FRS_BRD09_CUSTOMER_SERVICING_FACILITY.md
  summary: TP_BRD09_CUSTOMER_SERVICING_FACILITY.md
  version: "1.1"
  date: 08 October 2026
  verify_messages: false

personas:
  CSF_AGENT: {name: BDO Insure Contact Center Agent, short: Agent}
  CSF_SUPERVISOR: {name: Contact Center Supervisor, short: Supervisor}
  CSF_MANAGEMENT: {name: "Contact Center Management (Leads / Heads)", short: Mgmt}
  SYSADMIN: {name: System Administrator, short: Sys Admin}
  MKT_AO: {name: Marketing AO without a CSF role, short: MKT AO}
  INFRA: {name: Infrastructure team (infrastructure administrator), short: Infra}
  CSF_FULFILMENT: {name: Fulfilment Unit member, short: FU}

screens:
  LOGIN: Login page
  SEARCH: Customer Service Facility > Customer Search
  VIEW: Customer Service Facility > Customer Search > Servicing View (summary card)
  ACCTS: Customer Service Facility > Customer Search > Servicing View > Accounts tab
  PAY: Customer Service Facility > Customer Search > Servicing View > Payments tab
  RA: Customer Service Facility > Customer Search > Servicing View > Renewal Advice tab
  EPOL: Customer Service Facility > Customer Search > Servicing View > E-policies tab
  DOCS: Customer Service Facility > Customer Search > Servicing View > Documents tab
  HIST: Customer Service Facility > Customer Search > Servicing View > Contact History tab
  UPDATE: Customer Service Facility > Servicing View > Update Contact dialog
  RESEND: Customer Service Facility > Servicing View > Resend dialog
  REPORTS: Reports > Report Centre (category Customer Service)
  AUDIT: Administration > Audit Trail
  USERS: Administration > Users
  PARAMS: Administration > System Parameters
  JOBS: Administration > Scheduled Jobs
  LOV: Broking Setup > Lists of Values
  ACCREQ: User Access > Access Requests
  NOTIF: Notifications (bell icon in the page header)
  MAIL: Test mailbox of the recipient
  RESTORE: Restore environment of the infrastructure team
  SYS: System function check outside the screens, signed in as the persona (test lead tool)
  CASES: Customer Service Facility > Cases
  LOGCASE: Customer Service Facility > Customer Search > Servicing View > Log Case dialog
  CASE: Customer Service Facility > Cases > Case record
  TEAMQ: Customer Service Facility > Cases > Team Queue
  FUQ: Customer Service Facility > Cases > Fulfilment Unit Queue
  DASH: Customer Service Facility > Case Dashboard
  ROUTING: Customer Service Facility > Case Routing

data:
  - id: TD-CSF-01
    name: Test users per role
    content: One user per role - agent1 and agent2 (CSF_AGENT), sup1 (CSF_SUPERVISOR), mgmt1 (CSF_MANAGEMENT), the System Administrator, ao (MKT_AO, no CSF role). The seed data adds the SIT/UAT users csfagent, csfagent2, csfsup and csfmgmt for the same roles.
    source: Created by the test lead through User Access requests on SIT, or the seed users
  - id: TD-CSF-02
    name: Client with CBG and non-CBG accounts
    content: Masked client "UAT CSF Client One" with a CBG Motor account booked and in force (policy number, PN number, receipts paid) and a non-CBG Property account awaiting payment; registered e-mail and mobile point to the test mailbox and test phone.
    source: Prepared by the test lead on SIT from masked seed clients and accounts keyed in the BRD-1 screens
  - id: TD-CSF-03
    name: Accounts in each CSF status
    content: "Accounts of one client in stage DRAFT, SUBMITTED, AWAITING_PAYMENT, BOOKED with premium outstanding, BOOKED and paid in force, CANCELLED, and BOOKED with the policy period ended."
    source: Prepared by the test lead on SIT through the BRD-1 and BRD-2 screens
  - id: TD-CSF-04
    name: Search keys
    content: Client code, prospect code and government ID of TD-CSF-02; ARN with and without suffix; policy number; legacy account number of a migrated account; PN number of the CBG account; loan application number of a placement billing item; a surname shared by more than 50 masked clients; a PN that exists only in LOS.
    source: Prepared by the test lead; the 50-client surname is loaded with the client bulk upload
  - id: TD-CSF-05
    name: Payment history over 14 months
    content: Receipts of TD-CSF-02 spread over 14 months; one receipt applied to two invoices with a balance left on each; one receipt dated 12 months and 1 day before the test date.
    source: Keyed in Cashiering (BRD-2) on SIT by the test lead; receipt dates set in the test environment
  - id: TD-CSF-06
    name: Renewal advices and e-policies
    content: One RA of the Renewal module, one RA of Employee Benefits and one RA of a submitted policy (document type RENEWAL_ADVICE); a confirmed e-policy on the CBG account; an account without a confirmed e-policy; a second client "UAT CSF Client Two" without a registered e-mail.
    source: RAs loaded as RENEWAL_ADVICE attachments by the test lead until the Renewal and EB modules produce them (dependency D-CSF-01); e-policy from Issuance (BRD-1)
  - id: TD-CSF-07
    name: Files to upload
    content: HEIF photo (2 MB); one file each of TXT, RTF, GIF, BMP, TIFF, WEBP, DOC, DOCX, XLS, XLSX, ODS, CSV, PNG, JPG and PDF; an .exe file; the same .exe renamed .pdf; an empty (0 byte) PDF; a PDF above the platform size limit.
    source: Test document folder of the test lead (no client data)
  - id: TD-CSF-08
    name: Documents of the client
    content: A quotation PDF, a claims report (CLAIM_REPORT) of a claim of TD-CSF-02, an invoice document, and a document of a type that the access classes do not open to the CSF roles.
    source: Attached on SIT by the test lead through the owning modules
  - id: TD-CSF-09
    name: Parameters as configured
    content: "LOGIN_MAX_FAILED_ATTEMPTS 3; CSF_SEARCH_MIN_CHARS 3; CSF_SEARCH_MAX_RESULTS 50; CSF_PAYMENT_HISTORY_MONTHS 12; CSF_VERIFY_MIN_MATCHES 2; CSF_VERIFICATION_VALID_MINUTES 30; CSF_VERIFY_MAX_FAILS 3; CSF_LEGACY_SYNC_ENABLED false."
    source: Configuration of the SIT environment (FRS section 9.1)
  - id: TD-CSF-10
    name: Test mailboxes
    content: Registered e-mail of each test client and the other address used by the supervisor point to test mailboxes of the test lead; no real client address.
    source: Test mail relay of SIT and UAT
  - id: TD-CSF-11
    name: Case lists and routing table
    content: "The case lists of the addendum (3 channels, 7 case types with their turnaround times, 125 natures of transaction, 51 product types, 33 market segments, 53 fulfilment units), the proposed lists of priority, escalation, return and closure reasons, and routing rows - Request / Consumer 1 Motor / any nature to Consumer 1 Motor and Complaint / any segment to CBEST Retail; Complaint set for automatic escalation, Commendation not."
    source: Loaded with the case lists at installation; the routing rows keyed by the test lead on Case Routing
  - id: TD-CSF-12
    name: Fulfilment unit users
    content: fu1, member of Consumer 1 Motor; fu2, member of CLAIMS - Davao only; the escalation group of Consumer 1 Motor (sup1 and mgmt1); each with the role CSF_FULFILMENT or the CSF role of TD-CSF-01.
    source: Created by the test lead through User Access requests on SIT
  - id: TD-CSF-13
    name: Cases in each status and SLA state
    content: Cases of UAT CSF Client One in each status of FRS section 5.3; open Request, Problem, Complaint and Commendation cases created 2, 3 and 7 working days before the test date; one case Closed by Fulfillment Unit; one case Closed by CSR.
    source: Logged by the test lead through the case screens on SIT; creation dates set in the test environment
  - id: TD-CSF-14
    name: Working-day calendar
    content: BIBS holiday calendar of the test year with one holiday on a Wednesday of the test week.
    source: Holiday calendar of SIT, maintained by the System Administrator

scenarios:
  - id: SC-CSF-01
    persona: SYSADMIN
    title: Access and roles. Agents, supervisors and management log in, land on the Customer Search and see only the CSF actions of their role; role grants go through User Access requests.
    pre: Users of TD-CSF-01 are active; parameters of TD-CSF-09.
  - id: SC-CSF-02
    persona: CSF_AGENT
    title: Find the caller. The agent searches by name, client ID, account number, PN number and application number and opens the client.
    pre: Search keys of TD-CSF-04.
  - id: SC-CSF-03
    persona: CSF_AGENT
    title: Servicing view. The agent reads the client information, every account with its CSF status and the payment history.
    pre: Client TD-CSF-02, accounts TD-CSF-03, payments TD-CSF-05.
  - id: SC-CSF-04
    persona: CSF_AGENT
    title: Verify and update the contact. The agent verifies the caller, changes the mobile or e-mail with a reason, and the change is queued for QPS and EBIX while they coexist.
    pre: Client TD-CSF-02; parameters TD-CSF-09.
  - id: SC-CSF-05
    persona: CSF_AGENT
    title: Resend documents. The agent resends a renewal advice and an e-policy to the registered e-mail; the supervisor sends to another address with a reason.
    pre: Documents TD-CSF-06; mailboxes TD-CSF-10.
  - id: SC-CSF-06
    persona: CSF_AGENT
    title: Documents. The agent uploads documents to the client or an account and retrieves quotations, renewal advices and claims reports.
    pre: Files TD-CSF-07; documents TD-CSF-08.
  - id: SC-CSF-07
    persona: CSF_MANAGEMENT
    title: Audit and reports. Management prints or saves the audit trail, the Contact Changes report and the Agent Activity report.
    pre: Scenarios SC-CSF-02 to SC-CSF-06 ran on the test day.
  - id: SC-CSF-08
    persona: INFRA
    title: Backup and restore. The infrastructure team proves the 15-minute log archiving and a restore.
    pre: Restore environment available; log archiving configured.
  - id: SC-CSF-09
    persona: CSF_AGENT
    title: Log and close cases. The agent logs a case from the Servicing View, resolves an inquiry on the call, adds notes and documents, and closes a case with a linked follow-up case.
    pre: Client TD-CSF-02; case lists TD-CSF-11; fulfilment unit users TD-CSF-12.
  - id: SC-CSF-10
    persona: CSF_FULFILMENT
    title: Fulfilment unit. The case is routed to the fulfilment unit, which resolves and closes it, returns it to the agent or asks for CSR action.
    pre: Routing table TD-CSF-11; users TD-CSF-12; cases TD-CSF-13.
  - id: SC-CSF-11
    persona: CSF_SUPERVISOR
    title: Supervision and SLA. The supervisor reassigns, escalates and recategorises cases; the SLA check flags and escalates cases approaching and past their due date.
    pre: Cases TD-CSF-13; calendar TD-CSF-14.
  - id: SC-CSF-12
    persona: CSF_MANAGEMENT
    title: Case reports and lists. Management follows the case dashboard and exports the case reports; the case lists and routing table are maintained.
    pre: Scenarios SC-CSF-09 to SC-CSF-11 ran.

frs:
  FR-CSF-001:
    scenario: SC-CSF-01
    persona: CSF_AGENT
    screen: LOGIN
    data: [TD-CSF-01, TD-CSF-09]
    conditions:
      - An agent with valid credentials and a CSF role lands on the Customer Search.
      - Wrong credentials are refused and no session is created.
      - The account locks at the third consecutive failed attempt and only the System Administrator unlocks it.
      - A user without a CSF role does not see the Customer Service Facility menu section.
      - Every successful and failed log-in is recorded with user, time and source address.
    cases:
      - c: 1
        type: Positive
        title: Agent logs in and lands on the Customer Search
        steps:
          - Open the BIBS URL.
          - Enter user ID agent1 and the password; click Sign in.
        expected: The Customer Search opens as the first page. The side menu shows the section Customer Service Facility with Customer Search.
      - c: 1
        type: Positive
        persona: CSF_SUPERVISOR
        title: Supervisor logs in and lands on the Customer Search
        steps:
          - Log in as sup1.
        expected: The Customer Search opens as the first page; the Reports entry of the menu lists the Customer Service category.
      - c: 2
        type: Negative
        title: Log-in with a wrong password is refused
        steps:
          - Enter user ID agent1 and a wrong password; click Sign in.
        expected: The Login page stays open and no session starts. The failed attempt is counted.
        msg: [Invalid user name or password]
      - c: 3
        type: Boundary
        neg: true
        title: The third failed attempt locks the account
        steps:
          - Enter user ID agent2 with a wrong password three times.
          - Enter the correct password.
        expected: The third wrong attempt locks the account; the correct password is then refused with the same message as a wrong password; the lock shows to the System Administrator in Administration > Users.
        msg: [Invalid user name or password]
      - c: 3
        type: Boundary
        title: Two failed attempts do not lock the account
        steps:
          - Enter user ID agent2 with a wrong password twice.
          - Enter the correct password.
        expected: The log-in succeeds and the Customer Search opens; the failed-attempt count starts again from zero.
      - c: 3
        type: Workflow
        persona: SYSADMIN
        screen: USERS
        title: The System Administrator unlocks the account
        pre: agent2 is locked (TC-CSF-001.3-01).
        steps:
          - Log in as the System Administrator; open Administration > Users; select agent2; click Unlock.
          - Log in as agent2 with the correct password.
        expected: The status of agent2 changes from Locked to Active; agent2 logs in and lands on the Customer Search.
      - c: 4
        type: Security-access
        persona: MKT_AO
        title: A user without a CSF role has no CSF menu section
        steps:
          - Log in as ao.
          - Open the side menu.
          - Open the address of the Customer Service Facility directly in the browser.
        expected: The menu has no Customer Service Facility section; the direct address shows the no-access page and no client data loads.
      - c: 5
        type: Positive
        persona: SYSADMIN
        screen: AUDIT
        title: Successful and failed log-ins appear in the audit trail
        pre: Cases TC-CSF-001.1-01 and TC-CSF-001.2-01 ran today.
        steps:
          - Open Administration > Audit Trail; filter on today and the user agent1.
        expected: One row for the failed attempt and one for the successful log-in, each with user, time and source address.

  FR-CSF-002:
    scenario: SC-CSF-01
    persona: CSF_MANAGEMENT
    screen: VIEW
    data: [TD-CSF-01, TD-CSF-02]
    conditions:
      - Each CSF role sees only the screens and actions its permissions allow.
      - A direct request without the permission is refused and the refusal is logged.
      - CSF role grants change only through an approved User Access request.
    cases:
      - c: 1
        type: Security-access
        neg: false
        title: Management sees the client but not the change, resend and upload actions
        steps:
          - Log in as mgmt1; search TD-CSF-02 and open the Servicing View.
          - Look for Update Contact on the summary card, Resend on the Renewal Advice and E-policies tabs, and Upload on the Documents tab.
        expected: The summary card and the tabs are shown. Update Contact, Resend and Upload are not shown.
      - c: 1
        type: Security-access
        neg: false
        persona: CSF_AGENT
        screen: REPORTS
        title: The agent has the servicing actions but no CSF reports
        steps:
          - Log in as agent1; open the Servicing View of TD-CSF-02.
          - Open Reports > Report Centre.
        expected: Update Contact, Resend and Upload are shown. The Customer Service report category is not listed.
      - c: 2
        type: Security-access
        persona: CSF_AGENT
        screen: SYS
        title: Agent sends a resend to another address directly
        steps:
          - Sign in as agent1.
          - Call the resend of an RA of TD-CSF-06 with a recipient other than the registered e-mail.
          - Log in as the System Administrator and open Administration > Audit Trail.
        expected: The request is refused and nothing is sent. The audit trail shows the refused request with the user and time.
        msg: [You are not permitted to perform this action]
        data: [TD-CSF-06]
      - c: 2
        type: Security-access
        screen: SYS
        title: Management sends a contact update directly
        steps:
          - Sign in as mgmt1.
          - Call the contact update of TD-CSF-02 with a new mobile number.
        expected: The request is refused; the client's mobile number is unchanged.
        msg: [You are not permitted to perform this action]
      - c: 3
        type: Workflow
        persona: SYSADMIN
        screen: ACCREQ
        title: A supervisor role is granted through an approved request
        steps:
          - As the Requestor of BRD-11, raise a Modify user request that adds CSF_SUPERVISOR to agent2; submit it to an approver.
          - Log in as agent2 before the approval and open Reports.
          - Approve the request as the approver; log in as agent2 again.
        expected: Before approval agent2 sees no Customer Service reports. After approval agent2 sees them, and the Resend dialog lets agent2 change the recipient.
      - c: 3
        type: Negative
        persona: SYSADMIN
        screen: USERS
        title: A CSF role cannot be added by a direct edit of the user
        steps:
          - Log in as the System Administrator; open Administration > Users; open agent1 and try to add CSF_SUPERVISOR directly.
        expected: The role cannot be saved directly while the emergency parameter UAM_DIRECT_ROLE_EDIT is false; the screen offers Raise request instead.
        msg: [A group profile is changed only by implementing an approved request]

  FR-CSF-010:
    scenario: SC-CSF-02
    persona: CSF_AGENT
    screen: SEARCH
    data: [TD-CSF-02, TD-CSF-04]
    conditions:
      - A name search lists the matching clients, each with its matching accounts; a single match opens the Servicing View directly.
      - A client ID search matches the client code, the prospect code and the government ID number.
      - An account number search matches the ARN with or without suffix, the policy number and the legacy account number of a migrated account.
      - A PN number search returns the client of the account with that PN.
      - An application number search returns the client of the placement billing item.
      - A search with no result shows "No client found" with the criteria; a PN or application number known only to QPS, EBIX or LOS returns nothing.
      - A blank value and a name shorter than 3 characters are refused, and more than 50 matching clients ask the agent to refine the search.
      - Each search returns within 3 seconds and is written to the activity log with key type and criteria.
    cases:
      - c: 1
        type: Positive
        title: Name search lists clients grouped with their accounts
        steps:
          - Select Search by Name; enter "UAT CSF"; click Search.
        expected: Both UAT CSF clients are listed, each with its matching accounts (ARN, product, CSF status).
      - c: 1
        type: Positive
        title: A single match opens the Servicing View directly
        steps:
          - Select Search by Name; enter "UAT CSF Client One"; click Search.
        expected: The Servicing View of TD-CSF-02 opens without a result list.
      - c: 2
        type: Positive
        title: Client ID search on client code, prospect code and government ID
        steps:
          - Select Search by Client ID; search the client code of TD-CSF-02.
          - Repeat with its prospect code, then with its government ID number.
        expected: Each of the three searches returns TD-CSF-02.
      - c: 3
        type: Positive
        title: Account number search on ARN, ARN without suffix, policy number and legacy number
        steps:
          - Select Search by Account No.; search the full ARN of the CBG account.
          - Repeat with the ARN without its suffix, with the policy number, and with the legacy account number of the migrated account.
        expected: Each search returns the client of the account with the account shown under it.
      - c: 4
        type: Positive
        title: PN number search returns the client of the account
        steps:
          - Select Search by PN No.; enter the PN of the CBG account of TD-CSF-02.
        expected: TD-CSF-02 is returned with the CBG account that carries the PN.
      - c: 5
        type: Positive
        title: Application number search returns the client of the placement billing item
        steps:
          - Select Search by Application No.; enter the loan application number of TD-CSF-04.
        expected: The client of the placement billing item is returned with the account.
      - c: 6
        type: Negative
        title: Search with no result
        steps:
          - Select Search by Name; enter "ZZQ NO SUCH CLIENT"; click Search.
        expected: No result list is shown; the page states that no client was found for the criteria entered.
        msg: ["No client found for {Name ZZQ NO SUCH CLIENT}"]
      - c: 6
        type: Negative
        title: PN known only to LOS returns nothing
        steps:
          - Select Search by PN No.; enter the PN of TD-CSF-04 that exists only in LOS.
        expected: No client is found; the legacy lookup is not connected (CSQ01, CSQ02).
        msg: ["No client found for {PN No. of TD-CSF-04}"]
      - c: 7
        type: Negative
        title: Blank search value
        steps:
          - Select Search by Name; leave Value blank; click Search.
        expected: The Value field is marked and no search runs.
        msg: [Enter the value to search]
      - c: 7
        type: Boundary
        neg: true
        title: Name search with 2 characters
        steps:
          - Select Search by Name; enter "UA"; click Search.
        expected: No search runs.
        msg: [Enter at least 3 characters]
      - c: 7
        type: Boundary
        title: Name search with 3 characters
        steps:
          - Select Search by Name; enter "UAT"; click Search.
        expected: The search runs and lists the matching clients.
      - c: 7
        type: Boundary
        neg: true
        title: More than 50 clients match
        steps:
          - Select Search by Name; enter the surname of TD-CSF-04 shared by more than 50 clients; click Search.
        expected: BIBS asks the agent to refine the search.
        msg: [More than 50 clients match. Refine the search]
      - c: 8
        type: Positive
        title: Search response time and activity log
        steps:
          - Run ten searches over the five key types during the peak window 10:00-12:00 and time each from click to result.
          - As sup1, run the Agent Activity report for today and agent1.
        expected: Every search returns within 3 seconds. The report lists each search with key type, criteria and time.

  FR-CSF-011:
    scenario: SC-CSF-03
    persona: CSF_AGENT
    screen: VIEW
    data: [TD-CSF-02]
    conditions:
      - The Servicing View shows the client's current information and every account, CBG and non-CBG, with CSF status, BIBS stage, policy number, period and balance.
      - Each tab loads on its own within 3 seconds; a tab whose source does not answer shows a message and the other tabs still work.
      - A contact change made in BIBS shows at once in the Servicing View.
      - Only users with CLIENT_VIEW see the link to the full client page.
      - Each opening of a Servicing View is written to the activity log.
    cases:
      - c: 1
        type: Positive
        title: Client with a CBG and a non-CBG account
        steps:
          - Search TD-CSF-02 and open it.
          - Read the summary card and the Accounts tab.
        expected: The summary card shows code, name, status, flags and contact details. The Accounts tab lists the CBG Motor and the non-CBG Property account, each with CSF status, BIBS stage, policy number, period and balance.
      - c: 2
        type: Positive
        title: Each tab loads within 3 seconds
        steps:
          - Open each tab in turn (Accounts, Payments, Renewal Advice, E-policies, Documents, Contact History) and time it.
        expected: Every tab shows its data within 3 seconds.
      - c: 2
        type: Negative
        title: A source module does not answer
        pre: The test lead makes the invoice ledger unavailable on SIT for the test.
        steps:
          - Open the Payments tab.
          - Open the Accounts and Documents tabs.
        expected: The Payments tab shows the message; the Accounts and Documents tabs load normally.
        msg: [Information not available now. Try again]
      - c: 3
        type: Workflow
        persona: SYSADMIN
        title: A contact change made in the client master shows at once
        steps:
          - As a user with CLIENT_MAINTAIN, change the phone number of TD-CSF-02 in Client Management.
          - As agent1, refresh the Servicing View of TD-CSF-02.
        expected: The new phone number is shown on the summary card.
      - c: 4
        type: Security-access
        title: The agent has no link to the full client page
        steps:
          - As agent1, open the Servicing View of TD-CSF-02 and look for Open client page.
          - Type the address of the full client page of the client.
        expected: The link is not shown; the direct address shows the no-access page.
      - c: 5
        type: Positive
        persona: CSF_SUPERVISOR
        screen: REPORTS
        title: Servicing View openings are logged
        steps:
          - As agent1 open TD-CSF-02 twice.
          - As sup1 run the Agent Activity report for today and agent1.
        expected: Two view rows with agent, client and time.

  FR-CSF-012:
    scenario: SC-CSF-03
    persona: CSF_AGENT
    screen: ACCTS
    data: [TD-CSF-03]
    conditions:
      - An account awaiting payment shows the CSF status Awaiting next to the BIBS stage AWAITING_PAYMENT.
      - Draft and submitted accounts show Pending; a booked account with premium outstanding shows Booked; a booked account in force shows Open; a cancelled account or an ended policy period shows Closed.
      - A change to the mapping list changes the displayed status without a change to the system, and the change is audited.
      - Only the list maintainers can change the mapping.
    cases:
      - c: 1
        type: Positive
        title: Awaiting payment account
        steps:
          - Open the Accounts tab of the client of TD-CSF-03; find the AWAITING_PAYMENT account.
        expected: The account shows the CSF status pill Awaiting and the stage AWAITING_PAYMENT.
      - c: 2
        type: Positive
        title: Pending, Booked, Open and Closed accounts
        steps:
          - On the same tab read the status of the DRAFT, SUBMITTED, BOOKED with premium outstanding, BOOKED and paid, CANCELLED and period-ended accounts.
        expected: DRAFT and SUBMITTED show Pending; BOOKED with premium outstanding shows Booked; BOOKED and paid in force shows Open; CANCELLED and the ended period show Closed.
      - c: 2
        type: Negative
        title: A cancelled account is not shown as Open
        steps:
          - Read the CANCELLED account; cancel the booked and paid account in BRD-1 and read it again.
        expected: Both cancelled accounts show Closed; neither shows Open or Booked.
      - c: 3
        type: Workflow
        persona: SYSADMIN
        screen: LOV
        title: Change the mapping of RETURNED_TO_MARKETING
        steps:
          - Open Broking Setup > Lists of Values, CSF_STATUS_MAP; change the row of RETURNED_TO_MARKETING from Pending to Awaiting; have a second user approve it.
          - As agent1, reopen the Accounts tab of an account in RETURNED_TO_MARKETING.
          - Open Administration > Audit Trail for the list.
        expected: The account shows Awaiting without a change to the system; the audit trail shows the row change with old and new value and the user.
      - c: 4
        type: Security-access
        screen: LOV
        title: The agent cannot change the mapping
        steps:
          - As agent1, type the address of Lists of Values, type CSF_STATUS_MAP.
        expected: The screen is not in the menu and the direct address shows the no-access page.

  FR-CSF-013:
    scenario: SC-CSF-03
    persona: CSF_AGENT
    screen: PAY
    data: [TD-CSF-05]
    conditions:
      - The Payments tab lists the payments of the last 12 months, newest first, with receipt number, date, mode, amount, invoices applied, and the balance and payment status of each invoice.
      - A payment applied to two invoices shows both invoices and the remaining balance of each.
      - Payments older than the window appear only after Show older.
      - The account filter shows only the payments of the selected account.
      - The window follows parameter CSF_PAYMENT_HISTORY_MONTHS.
    cases:
      - c: 1
        type: Positive
        title: Payments of the last 12 months
        steps:
          - Open the Payments tab of TD-CSF-02.
        expected: The receipts of the last 12 months are listed newest first with receipt number, date, mode, amount, invoices applied, invoice balance and payment status.
      - c: 2
        type: Positive
        title: Payment applied to two invoices
        steps:
          - Find the receipt of TD-CSF-05 applied to two invoices.
        expected: The row shows both invoice numbers, the amount applied to each and the balance left on each.
      - c: 3
        type: Boundary
        neg: true
        title: A receipt 12 months and 1 day old is outside the window
        steps:
          - Look for the receipt dated 12 months and 1 day before today.
        expected: The receipt is not listed.
      - c: 3
        type: Boundary
        title: Show older brings the older receipts
        steps:
          - Click Show older.
        expected: The receipt of 12 months and 1 day and the older receipts appear below the others.
      - c: 4
        type: Negative
        title: Account filter hides the other account's payments
        steps:
          - Filter the tab on the CBG account.
