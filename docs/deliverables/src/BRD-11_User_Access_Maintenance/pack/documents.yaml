# Documents produced by BRD-11 User Access Maintenance: the user access reports (PDF, Excel and CSV from the report
# runner, with the BDO Insure header: report name, generated by, date coverage and time generated) and the Excel export
# of the User Access Matrix. The e-mails are in the notifications catalogue.
# Columns: id | document | template | format | produced by | protected | fields and their source | image (slug)
documents:
  - id: DO-01
    name: User Access Report
    template: Report layout of the report runner (sample A of the BRD)
    format: PDF (landscape), Excel, CSV
    produced: User Access Reports › User Access Report › PDF, Excel or CSV
    protected: No (kept by the user; the report is archived with its parameters)
    fields:
      - "Header: report name, generated by (user), as-of date, date and time generated – from the run"
      - "User Name, User ID / Windows ID, Business Unit / User Level, Status – from the user master as at the end of the as-of date"
      - "User Group Profile – the profiles held on the as-of date, rebuilt from the access change log"
      - "Created by / Date Created, Modified by / Date Modified – the approver and the request number of the enrolment and of the last change, or the user of a direct change"
      - "Last Action / by – added, modified, deactivated or reactivated, and by whom"
    shot: doc-user-access
    frs: [FR-UA-060]
  - id: DO-02
    name: User Group Profile Report
    template: Report layout of the report runner (sample B of the BRD)
    format: PDF, Excel, CSV
    produced: User Access Reports › User Group Profile Report
    protected: No
    fields:
      - "Header as DO-01, with the profile, module and active filters"
      - "Group profile – code and name, as a group heading"
      - "Module Name, Task Name – the functional area and the permission"
      - "Access – With Access or No Access"
      - "Date Created, Created by, Date Modified, Modified by – from the access change log of the profile"
    shot: doc-group-profile
    frs: [FR-UA-061]
  - id: DO-03
    name: Group Profile Membership
    template: Report layout of the report runner (sample C of the BRD)
    format: PDF, Excel, CSV
    produced: User Access Reports › Group Profile Membership
    protected: No
    fields:
      - "Header as DO-01, with the profile and the as-of date"
      - "Member Username, Member User ID – the members of each profile on the as-of date"
      - "Created by, Date Created, Modified by, Date Modified – who added the member and when, from the access change log"
    shot: doc-group-members
    frs: [FR-UA-062]
  - id: DO-04
    name: User Access Audit Log
    template: Report layout of the report runner (sample D of the BRD)
    format: PDF, Excel, CSV
    produced: User Access Reports › User Access Audit Log
    protected: No
    fields:
      - "Header as DO-01, with the period, user and activity filters"
      - "Date, Activity – the time and the activity in the words of the BRD sample (Enroll New User, Modify User Group Profile of, Deactivate User, Reset Password of, Create Group Profile, Modify Group Profile Access of...)"
      - "From, To – the value before and after (Null when none; profile codes shown as profile names)"
      - "Done By, Approved By, Request No. – from the access change log and the request history"
      - "Log-in, Failed Log-in, Log-out – from the audit trail when Include Log-ins and Log-outs is ticked"
    shot: doc-audit-log
    frs: [FR-UA-063, FR-UA-064]
  - id: DO-05
    name: Access Requests
    template: Report layout of the report runner
    format: PDF, Excel, CSV
    produced: User Access Reports › Access Requests
    protected: No
    fields:
      - "Header as DO-01, with the period, status and request type"
      - "Request No., Request Type, User / Group Profile, Requester, Approver – from the access request"
      - "Date Created, Date Decided, Effective Date, Age (days) – from the request and its history; open requests age to today"
    shot: doc-requests
    frs: [FR-UA-018]
  - id: DO-06
    name: User Access Matrix (Excel)
    template: Workbook of the User Access Matrix
    format: Excel, two sheets (by permission; by area and action class)
    produced: User Access Matrix › Export to Excel
    protected: No
    fields:
      - "Sheet User Access Matrix: Permission, Area (area code), Action class and one column per group profile code, with Y where the profile holds the permission; the first row gives the enabled users of each profile – from the role grants in force"
      - "Sheet By Action: Area, Action class, Permissions and, per profile, the permissions it holds there"
    shot: doc-access-matrix
    frs: [FR-UA-051]
