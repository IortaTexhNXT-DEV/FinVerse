# Key business rules and validations (highlights; the full list is in the workbook and FRS chapter 13).
rules:
  - "Access changes only through an approved request: the requester and the user concerned never decide it, and only the approver chosen by the requester does."
  - "A privileged change (a High or Admin profile) or a change outside working hours needs a second approval by another approver, and raises an alert."
  - "Group-profile changes are approved in order and implemented by a System Administrator who did not raise them; direct edits are an audited, alerted emergency path, closed as delivered."
  - "The account locks after 3 failed sign-ins; the session warns at 15 minutes of inactivity and ends at 30."
  - "Passwords: at least 10 characters with upper and lower case, a digit and a symbol; not one of the last 8; expire after 90 days; changed at the first sign-in after an administrator sets them."
  - "Every change is logged insert-only with its from and to values, approver and request number; four reports give the BRD samples A to D."
  - "Every persona sees exactly the menu of its group profiles; the insurer functions are hidden from BDOI."

# Caveats and possibilities, and how each is handled.
caveats:
  - topic: Additional requirements
    text: "New needs can surface during the review, SIT or UAT."
    handling: "In-scope clarification when the signed text already covers it; configuration when it is a new profile or a changed grant; otherwise a change request with mandays."
    example: "Information Security asks that the Auditor also sees a new report: a group-profile request (configuration). Asking for a third approval level on all requests is a change request."
  - topic: Other BRDs change the role matrix
    text: "Every BRD adds permissions and personas as it is built; the menus of chapter 12 follow the grants."
    handling: "A new persona of an existing permission is a group-profile request under this signed set; a new permission or rule is a change request against the other BRD, and this set's menu pages are re-issued as a delta."
    example: "Claims adds a Claims Reports viewer: the profile is requested, approved and implemented; the menu sheet of the persona is added in the next version of the set."
  - topic: Identity integrations owned by BDOI IT
    text: "Sign-in through EIAM on Microsoft Entra ID and provisioning from UIDM-ISC are named by BDOI for Drop 0; their specifications are open (IQ04, IQ05)."
    handling: "Seams only in this set: local sign-in with the directory port, and every change as a BIBS request. The integrations are change requests once BDOI IT gives the specifications; the screens of this set do not change."
    example: "When Entra ID sign-in is enabled, the Login page redirects to BDO's sign-in; the BIBS password rules then apply only to the break-glass administrator."
  - topic: Designed but not yet built
    text: "Automatic deactivation of dormant users, a single session per device and an external access-control list are not in the build."
    handling: "Stated in section 10.4; a dormant user is deactivated by a request, and the session log already records every session."
    example: "Information Security asks for deactivation after 90 days without sign-in: a change request, with a new daily job and alert."
  - topic: Open questions and assumptions
    text: "Open questions of FRS section 10.3 (who the requesters and approvers are, the approval chain, privileged profiles, working hours, password values, business units and user levels) are built on the assumptions of section 10.1."
    handling: "Answered as configuration where possible (profiles, parameters, lists, the approvers themselves); otherwise a change request; the assumption stands until then."
    example: "Working hours of 07:00-19:00 instead of 08:00-18:00: a change of the parameter UAM_WORKING_HOURS, not a build."

# Entry and exit criteria of the sign-off, and the definition of done.
entry:
  - "The set is built from the system as built and every screenshot is taken on the SIT environment with seed data."
  - "Reviewers have their SIT users and the walkthrough sessions are held."
  - "The test plan is traced to the FRS and to the screens; the persona menus are checked by the persona menu test."
exit:
  - "Every row of the workbook reviewed by its unit (Accept, Change requested or Comment), including the menu sheet of every persona."
  - "Every comments log item closed: answered, corrected in v2.1, or raised as a change request."
  - "Open questions closed or accepted as assumptions."
  - "The sign-off certificate signed by the business owner, Business Administration, BDOI Information Security and BDOI IT for their parts."
done:
  - "Signed certificate filed with the set; version history updated."
  - "Build frozen as signed; deltas listed in the Change Management Register with mandays."
  - "Role-to-permission matrix and users of the templates loaded by group-profile and bulk requests, and checked with the reports."
  - "Test plan agreed for SIT and UAT."

# Handover to development / build readiness checklist.
handover:
  - "Signed FRS, sign-off workbook and screens"
  - "Open questions closed or accepted as assumptions"
  - "Configuration inputs from the business: users and roles, role-to-permission matrix, approval rules, separation-of-duties rules, password and session parameters, lists of values"
  - "Agreed test plan"
  - "BDOI IT decisions on EIAM and UIDM-ISC recorded as change requests or assumptions"
handover_note: "User Access Maintenance is already built: handover means the build is frozen as signed, the approved deltas are scheduled and the configuration inputs are loaded through requests."

