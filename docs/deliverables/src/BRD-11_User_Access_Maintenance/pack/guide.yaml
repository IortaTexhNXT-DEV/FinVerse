# Guide to the BRD-11 User Access Maintenance business sign-off pack: the content of the Sign-off Pack Guide deck
# (generic guide deck builder) and of the Start Here guide (START_HERE_BRD11.md, ```pack blocks "guide-*").
# The same layout is used for every BRD set; only this file changes.
meta:
  deck_title: Sign-off Pack Guide
  module: User Access Maintenance
  owner: Product Owner, Marketing Business System, with the Process Owner of User Access Maintenance (Business Administration)
  issued: Mon 2-Nov-2026
  signoff_date: Tue 1-Dec-2026

# The documents of the set in reading order. kind = doc type of the file name (brand.READING_ORDER).
documents:
  - {kind: StartHere, name: User Access Maintenance, ext: docx, what: "Start Here: the map of the pack, who reads what, the steps and the dates", readers: Everyone, when: "First, on issue"}
  - {kind: GuideDeck, name: User Access Maintenance, ext: pptx, what: "Sign-off Pack Guide: purpose, approach, the module at a glance, caveats, entry and exit criteria, change control", readers: "Business owner, Business Administration, Information Security, BDOI IT; presented at the kick-off", when: "Kick-off session"}
  - {kind: FRS, name: User Access Maintenance, ext: docx, what: "Functional Requirements Specification v2.0: requirements, the menu of every persona, 18 screen specifications with screenshots, walkthroughs, messages, notifications, reports, the bulk upload, configuration inputs, cross-BRD contract", readers: "Business Administration for the requests and reports; Information Security for the role matrix and the separation of duties; BDOI IT for sign-in and identity integration", when: "During the review, with the SIT walkthroughs"}
  - {kind: Signoff, name: User Access Maintenance, ext: xlsx, what: "Sign-off workbook: one row per screen, field, rule and message with the BU review columns; one menu sheet per persona; comments log, meeting minutes, version history, sign-off certificate", readers: "Every reviewer; the signatories sign it", when: "During the review and at sign-off"}
  - {kind: TestPlan, name: User Access Maintenance, ext: xlsx, what: "Test plan workbook: the test cases traced to the FRs and to the screens, including one screen case and one message case per screen and the access checks by persona", readers: "Business users who will run UAT; Information Security; BDOI IT", when: "After the screens; used again in SIT and UAT"}
  - {kind: TestPlan, name: User Access Maintenance Summary, ext: docx, what: "Test plan summary: scope, approach, coverage and the cases by area", readers: "Business owner, Information Security, BDOI IT", when: "Before sign-off"}
  - {kind: Templates, name: Configuration Inputs, ext: xlsx, what: "Configuration input templates: users and roles load, role-to-permission matrix, approval rules and limits, separation-of-duties rules, password and session parameters, lists of values", readers: "Business Administration, Information Security, BDOI IT, the unit heads who name their users", when: "During the review; filled in before the first data migration mock and final before UAT"}

# Reading order per role (FRS chapter numbers of v2.0).
reading:
  - role: Business owner (Product Owner, Marketing Business System)
    order: "00 Start Here; 01 Guide deck; FRS chapters 1-3 (context and personas), 10.4 (differences from the BRD), 14 (walkthroughs), 19 (configuration inputs) and 21 (sign-off); workbook Sign-off certificate"
  - role: Business Administration (process owner of user access)
    order: "FRS chapter 13 screens SCR-UA-06 to SCR-UA-12, SCR-UA-14 and SCR-UA-17; walkthroughs A and B; chapter 18 (bulk upload); chapter 19 templates CI-01, CI-03 and CI-06; workbook Screen catalogue, Field register, Business rules and Messages of those screens"
  - role: BDOI Information Security
    order: "FRS chapter 3 (personas and permissions), chapter 12 (menu of every persona) and its workbook sheets Menu by persona and Menu <role>; chapter 13 rules of SCR-UA-07, SCR-UA-08, SCR-UA-12, SCR-UA-15, SCR-UA-16 and SCR-UA-18 (separation of duties, second approval, emergency path); walkthroughs C and D; templates CI-02, CI-04 and CI-05"
  - role: BDOI IT
    order: "FRS chapter 7 (interfaces: EIAM on Entra ID, UIDM-ISC), chapter 8 (non-functional requirements), screens SCR-UA-01 to SCR-UA-05, SCR-UA-15 and SCR-UA-18, chapter 20 lines IC-08 to IC-11; template CI-05; the caveats of the Guide deck"
  - role: Unit heads of the other BRDs (New Business, Operations, Finance, Compliance, Claims, Employee Benefits)
    order: "FRS chapter 12, the menu table of their personas, and the workbook sheet Menu <role> of each; walkthrough A (a new user sees exactly the menu of the persona)"
  - role: iorta TechNXT project team
    order: "All documents; keeps the comments log, the meeting minutes and the version history of the workbook, answers every comment and keeps the traceability to SIT and UAT"

# Approach and step-by-step flow up to closure. raci: R responsible, A accountable, C consulted, I informed.
steps:
  - step: 1
    name: Pack issued
    who: "R: iorta TechNXT Project Manager; A: iorta TechNXT delivery lead; I: all reviewers"
    inputs: "FRS v2.0, workbook, test plan, configuration input templates, guide and deck built from the system as built"
    outputs: "Release set v2.0 in the BRD-11 folder of Drop 0; invitations to the sessions"
    duration: "Day 0 (Mon 2-Nov-2026)"
  - step: 2
    name: Kick-off and screen walkthrough on SIT
    who: "R: iorta TechNXT Business Analysis; A: BDOI Product Owner; C: Business Administration, Information Security, BDOI IT; I: unit heads of the other BRDs"
    inputs: "Guide deck; SIT users with seed data; walkthroughs A to D"
    outputs: "Screens shown live; first questions logged in the comments log; minutes"
    duration: "2 sessions, Mon 9 and Tue 10-Nov-2026"
  - step: 3
    name: Review with the workbook; configuration inputs started
    who: "R: Business Administration, Information Security, BDOI IT, unit heads for their menus; A: BDOI Product Owner; C: iorta TechNXT (questions)"
    inputs: "FRS chapters of the area; workbook sheets with the BU review columns; the menu sheet of each persona; the configuration input templates"
    outputs: "Every row marked Accept, Change requested or Comment; comments log entries; first drafts of the templates (users, role matrix, rules, parameters)"
    duration: "8 working days after the walkthroughs, until Fri 20-Nov-2026"
  - step: 4
    name: Comments consolidated and a Q&A session
    who: "R: iorta TechNXT Project Manager and Business Analysis; A: BDOI Product Owner; C: reviewers"
    inputs: "Returned workbooks"
    outputs: "One consolidated comments log, each item typed (clarification, defect, change request) and answered; Q&A minutes"
    duration: "3 working days, Q&A on Tue 24-Nov-2026"
  - step: 5
    name: One revision cycle (v2.1)
    who: "R: iorta TechNXT Business Analysis; A: iorta TechNXT delivery lead; C: reviewers who raised the items"
    inputs: "Agreed clarifications and defects"
    outputs: "Release set v2.1 with the changed rows marked; change requests raised for the rest"
    duration: "v2.1 on Thu 26-Nov-2026; check by the reviewers until Fri 27-Nov-2026"
  - step: 6
    name: Sign-off meeting and signature
    who: "R: iorta TechNXT Project Manager; A: BDOI Product Owner; C: Business Administration, Information Security, BDOI IT"
    inputs: "v2.1 (or v2.0 when no revision is needed); open items with their decision"
    outputs: "Signed sign-off certificate; minutes; open items accepted as assumptions or change requests"
    duration: "Tue 1-Dec-2026"
  - step: 7
    name: Handover to development or build freeze; configuration inputs loaded
    who: "R: iorta TechNXT delivery lead; A: BDOI Product Owner; I: BDOI IT, Information Security, other BRD owners, Data Migration working group"
    inputs: "Signed set; change requests with mandays; filled configuration input templates"
    outputs: "Build frozen as signed; approved deltas scheduled in the Change Management Register; role matrix implemented by group-profile requests; users loaded by bulk requests before the first mock"
    duration: "From Wed 2-Dec-2026; templates final before UAT"
  - step: 8
    name: Traceability into SIT and UAT
    who: "R: iorta TechNXT test lead; A: BDOI Product Owner; C: business users, Information Security"
    inputs: "Signed FRS rows and test plan"
    outputs: "SIT and UAT runs traced to the signed screens, rules, messages and persona menus; results against each row"
    duration: "SIT Apr - Jul 2027; UAT Aug - Oct 2027"

