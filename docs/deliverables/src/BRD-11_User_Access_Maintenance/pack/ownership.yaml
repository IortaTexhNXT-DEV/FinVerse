# Who signs what in the BRD-11 User Access Maintenance sign-off set: one definition, read by 00 Start Here, the 01
# guide deck, the sign-off certificate of the 03 workbook, the Drop 0 closure summary and the drop index
# (signoff_pack.py, "ownership"). The roles and units are those of the BRD-11 sign-off sheet; a role the set adds is
# marked "Added for this set". The set holds business content only; the technical content is in the Technical
# Specification, reviewed by BDOI IT.
source: "BRD-11 sign-off sheet p.19 (Owner: \"I own this document and approve all of its contents\")"

roles:
  - {id: ITN, short: iorta TechNXT, role: "iorta TechNXT project team: Project Manager, Business Analysis, test lead", org: iorta TechNXT, capacity: Prepared by, confirms: "The set is complete and consistent as issued, traced to the BRD and to the screens; every comment is answered in the comments log", sheet: Added for this set (author of the FRS set)}
  - {id: BA, short: BA (BPS), role: "Business Analyst, Enterprise Services - Business Process Services (BPS)", org: BDO Unibank ESG, capacity: Prepared by, confirms: "The set states the BRD requirements as written; every departure is listed in the proposed rules and clarifications", sheet: "Prepared by (p.19)"}
  - {id: BUR, short: BU representative (MBS), role: "BU representative, Marketing Business System (MBS)", org: BDOI, capacity: Input provided by, confirms: "The request, approval, group-profile and report screens match the business input", sheet: "Input provider (p.19)"}
  - {id: BAD, short: Business Administration, role: "Business Administration (user access maintenance)", org: BDOI, capacity: Input provided by, confirms: "The daily handling of the requests and the configuration inputs of templates CI-01 to CI-06", sheet: Added for this set}
  - {id: PGM, short: Program Manager (BPS), role: "Program Manager, Enterprise Services - Business Process Services (BPS)", org: BDO Unibank ESG, capacity: Reviewed by, confirms: "Traceability of every BRD requirement to the set and completeness of the set (\"validated the completeness of business requirements\")", sheet: "Reviewed by (p.19)"}
  - {id: SEC, short: Information Security, role: "BDOI Information Security", org: BDOI, capacity: Reviewed by, confirms: "The role matrix, the menus by persona, the separation-of-duties rules, the password and session rules and the audit log", sheet: Added for this set}
  - {id: IT, short: BDOI IT, role: "BDOI Information Technology Group (BDOI IT)", org: BDOI, capacity: Reviewed by, confirms: "Sign-in and identity interfaces (EIAM, UIDM-ISC), the System Administrator functions and the Technical Specification (a separate document); not the business screens", sheet: Added for this set}
  - {id: PO, short: Product Owner, role: "Product Owner, Marketing Business System", org: BDOI, capacity: Approved by, confirms: "Owns the set and approves all of its contents", sheet: "Approved by, owner (p.19)"}
  - {id: CRM1, short: UH Claims and Risk Management, role: "Unit Head - Claims and Risk Management", org: BDOI, capacity: Approved by, confirms: "The access of the Claims and Risk Management users", sheet: "Approved by (p.19)"}
  - {id: CC, short: UH Combank and Corbank, role: "Unit Head - Combank and Corbank Marketing / Corporate Processing", org: BDOI, capacity: Approved by, confirms: "The access of the Combank, Corbank and Corporate Processing users", sheet: "Approved by (p.19)"}
  - {id: COMP, short: Head Comptrollership, role: "Head - Comptrollership", org: BDOI, capacity: Approved by, confirms: "The access of the Comptrollership users", sheet: "Approved by (p.19)"}
  - {id: RM, short: Head Retail Marketing, role: "Head - Retail Marketing", org: BDOI, capacity: Approved by, confirms: "The access of the Retail Marketing users", sheet: "Approved by (p.19)"}
  - {id: CRM, short: Head Corporate and Retail Marketing, role: "Head - Corporate and Retail Marketing", org: BDOI, capacity: Approved by, confirms: "The access of the Corporate Marketing users", sheet: "Approved by (p.19)"}

parts:
  - {part: "Screens and fields (FRS screen specifications; workbook Screen catalogue, Field register)", prepares: [ITN], input: [BUR, BAD], reviews: [PGM], approves: [PO]}
  - {part: "Business rules and validations (four eyes, password and session rules)", prepares: [ITN], input: [BUR, BAD, BA], reviews: [PGM, SEC], approves: [PO]}
  - {part: "Messages and notifications", prepares: [ITN], input: [BAD], reviews: [PGM], approves: [PO]}
  - {part: "Documents and reports (access reports, audit log)", prepares: [ITN], input: [BUR, BAD], reviews: [PGM, SEC], approves: [PO]}
  - {part: "Walkthroughs (end-to-end, screen by screen)", prepares: [ITN], input: [BUR, BAD], reviews: [PGM], approves: [PO]}
  - {part: "Proposed business rules and clarifications for confirmation", prepares: [ITN], input: [BA, BUR], reviews: [PGM], approves: [PO]}
  - {part: "Role matrix and menus by persona (who may do what)", prepares: [ITN], input: [BUR, BAD], reviews: [SEC, IT], approves: [PO, CRM1, CC, COMP, RM, CRM]}
  - {part: "Interfaces and sign-in (EIAM, UIDM-ISC, directory)", prepares: [ITN], input: [BAD], reviews: [IT, SEC], approves: [PO]}
  - {part: "Test plan (04 workbook, 05 summary)", prepares: [ITN], input: [BUR, BAD], reviews: [PGM, IT], approves: [PO]}
  - {part: "Configuration inputs (06 templates, Drop 0)", prepares: [ITN], input: [BAD, BUR], reviews: [SEC, PGM], approves: [PO]}
  - {part: "Technical Specification (separate document, not part of the business sign-off)", prepares: [ITN], input: [IT], reviews: [IT, SEC], approves: [IT]}
