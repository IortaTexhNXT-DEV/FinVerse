# Elements shared by many screens, described once.
common:
  - name: Page header
    text: >-
      Every page shows its section (User Access, Administration or Account) and title, a one-line description and its
      actions on the right. A record page has a back arrow to its list.
  - name: Work lists
    text: >-
      Lists show tabs, a search box with its Search button, a Filters button where the list has advanced filters, and
      the paged table ("Showing 1 to n of N results"). A row opens its record. Dates show as dd-MMM-yyyy and times as
      dd-MMM-yyyy HH:mm in Philippine time. Users are shown by their names, not their user IDs.
  - name: Record summary and reference chips
    text: >-
      A request opens with its reference (AR-yyyy-nnnnnn for a request, BLK-yyyy-nnnnnn for a bulk batch), its status
      pill, its risk flags (Privilege Increase, Outside Hours) and the key facts: requested by and when, approver,
      effective date and decision. A reference chip copies the reference.
  - name: Decisions with a reason
    text: >-
      Approve, Return, Reject, Cancel and Implement open a dialog that names the request and its change. Return,
      Reject and Cancel need a text (remarks, reason); an approval comment is optional. The text is kept in the history
      of the request and sent with the notice.
  - name: Separation of duties
    text: >-
      Nothing changes access until a second person approves. The requester and the user the request is about never
      decide it; a request goes to the approver chosen by the requester; a second approval is given by someone other
      than the first approver; a group-profile request is implemented by a System Administrator who did not raise it.
      The screens offer a decision only to the users who may take it, and the server refuses it for anyone else.
  - name: Status pills and tags
    text: >-
      Request statuses (Draft, Pending, Pending Second, Returned, Scheduled, Approved, For Implementation,
      Implemented, Rejected, Cancelled) and user statuses (Active, Online, Disabled, Locked) are pills of one size and
      colour per state group; a pill never wraps. Risk flags are tags next to the request title.
  - name: Dates
    text: >-
      Dates are entered with the date picker and shown as dd-MMM-yyyy (for example 27-Sep-2026). An effective date
      cannot be before today; blank means the change applies on approval.
  - name: Notifications and help
    text: >-
      The bell in the header shows the unread count and opens the notifications panel, grouped by day; each notice
      opens its request. Mark Read, Mark All Read and View All are offered. The Help button of each page explains the
      screen.
  - name: Session guard
    text: >-
      On every screen, after 15 minutes without activity a dialog warns that the user will be signed out and counts
      down; Stay Signed In keeps the session and Sign Out Now ends it. After 30 minutes without activity the user is
      signed out. Activity in any browser tab keeps every tab signed in. Separately, the session ends at a fixed time
      after sign-in, whatever the activity, and a dialog warns 30 minutes before.
  - name: Messages
    text: >-
      Field errors appear under the field in red with the field outlined. A refusal by a business rule shows the
      business message and a reference for support (the message code and a request number). Success is confirmed by a
      short message at the bottom right of the page.
