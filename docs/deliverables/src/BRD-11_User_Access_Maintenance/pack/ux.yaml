states:
  - {screen: SCR-UA-06, state: empty, user: requestor, ux: empty, nocallouts: true, caption: "A search that finds no access request"}
  # Crop of the notice standard for the design foundation of every deck (ux_foundation.yaml).
  - {screen: SCR-UA-07, state: cmp-notice, component: true, user: requestor, fill: enrol_invalid, submit: "^submit$", crop: "main .notice", nocallouts: true, caption: "Notice standard"}

confirm:
  clarifications: [CLR-UA-01, CLR-UA-10, CLR-UA-11, CLR-UA-18, CLR-UA-19, CLR-UA-20, CLR-UA-24]
  findings:
    - screens: [SCR-UA-06]
      observation: The Change column of the request list names the subject user by the user ID only.
      proposal: Name the user with the full name first and the user ID in brackets, as the request record does.
