# UX screen documents of the BRD-11 User Access Maintenance set for the BDOI UX Design team: 07 UX Screen Deck, 08
# UX screen register, 09 image package (docs/deliverables/src/signoff/build_ux_deck.py). The screens, fields,
# actions, walkthroughs and images come from the pack; this file holds what only the UX documents need: who each
# persona is, the images taken for the deck only, the changes of the issue and the points to confirm.

issue:
  version: "2.1"
  date: 8 October 2026
  changes:
    - ref: CHG-UA-2.1-SSO
      what: >-
        Login with single sign-on through EIAM: in the sign-in mode OIDC or SAML the Login page shows Sign in with
        the BDO identity provider, and only the break-glass administrators keep the user ID and password form
        (FR-UA-003, CLR-UA-01, CLR-UA-24). The images show the local sign-in of SIT; the single sign-on state is
        captured once BIBS is registered in EIAM
      screens: [SCR-UA-01]

navigation:
  # The same landing page and menu as in the BRD-3 set (identical images are kept once).
  shared:
    ux-nav-04-menu: BRD-03:ux-nav-08-menu
    ux-nav-05-landing: BRD-03:ux-nav-10-landing
    ux-nav-05-menu: BRD-03:ux-nav-10-menu
    ux-nav-06-landing: BRD-03:ux-nav-11-landing
    ux-nav-06-menu: BRD-03:ux-nav-11-menu
    ux-nav-08-landing: BRD-03:ux-nav-09-landing
    ux-nav-08-menu: BRD-03:ux-nav-09-menu

personas:
  UAM_REQUESTOR: {who: "One of the named user access requestors of the business units"}
  UAM_APPROVER: {who: "One of the named user access approvers of the business units"}
  UAM_SECOND_APPROVER: {who: "The second approver of privileged or out-of-hours access changes (Information Security)"}
  BUSINESS_ADMIN: {who: "The business administrator of BIBS who owns the group profiles"}
  SYSADMIN: {who: "The system administrator of BIBS (BDOI IT operations)"}
  AUDITOR: {who: "An internal or external auditor with read access"}
  INFOSEC_OFFICER: {who: "An officer of BDOI Information Security"}
  NB_APPROVER: {who: "A New Business approver of Marketing who also approves access requests of the unit"}

