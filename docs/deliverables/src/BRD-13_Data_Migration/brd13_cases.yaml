      - The GL lead who prepared a true-up cannot approve it.
      - With January 2028 closed, the final true-up posts after Comptrollership reopens the period, and the period is closed again the same day.
      - A line on a legacy control account without its open-item detail stops the validation.
      - Posting the same true-up twice creates no second journal.
    cases:
      - c: 1
        type: Workflow
        title: Prepare, approve and post true-up 1
        steps:
          - Validate the true-up 1 batch (G01 TU1, G03, G03D) and Submit as the GL lead.
          - As the Head of Comptrollership open the true-up in My Approvals and Approve.
          - Open Journal inquiry for MIG-TU-1; run the January 2028 P&L.
        expected: MIG-TU-1 posted as an opening journal dated 1 January 2028 - Dr retained earnings 80,000.00, Cr accrued expenses 80,000.00; the January 2028 P&L shows no amount from the true-up.
      - c: 2
        type: Positive
        screen: INV360
        title: Write-off with open-item detail
        steps:
          - After the posting of true-up 1, open Invoice 360 of I00300002; run the report Migration Clearing and Legacy Control Accounts for MKT01.
        expected: Movement Legacy written off of 3,000.00 on basic premium; open balance 0.00; Premium Receivable - Legacy 3,000.00 lower; Migration Clearing 0.00; the change appears in the report Changes to Legacy Invoices as a FY2027 true-up.
      - c: 3
        type: Negative
        persona: OPERATOR
        screen: ISSUES
        title: Journal outside FY2027 or not in the register
        steps:
