        expected: Migration Clearing shows a credit of 4,200.00 for MKT01 PHP (DTIP 5,000.00 credit less commission receivable 800.00 debit, from the trial balance); alert to Comptrollership; sign-off refused.
        msg: ["Migration Clearing is {4,200.00 credit} in {MKT01} {PHP}; it must be zero"]
      - c: 4
