  FR-DM-034:
    scenario: SC-DM-04
    persona: STEWARD
    screen: MAPS
    data: [TD-DM-02, TD-DM-04]
    conditions:
      - An approved PACKAGE version with 120 entries loads into the Renewal package map and reconciles with 120 entries.
      - At renewal, a candidate on a legacy package with one entry for a sum insured up to 2,000,000.00 and one above gets the first BIBS package for a sum insured of 950,000.00 and the second for 2,500,000.00.
      - A candidate whose legacy package has a Reject entry is in the Exception bucket.
      - A version with two entries of the same legacy package whose sum-insured bands overlap cannot be submitted.
      - A header on a legacy package without an entry loads with no warning and keeps its legacy package.
      - The package code map is prepared by TSU and approved by the Product Owner, never by the preparer.
    cases:
      - c: 1
        type: Positive
        persona: OPERATOR
        screen: BATCH
        title: package code map loaded as reference data
        pre: PACKAGE version with 120 entries approved, including PKG-MC-PRIV v3 split at a sum insured of 2,000,000.00.
        steps:
          - Validate and load object R06; run the report Reconciliation Summary for the batch.
        expected: 120 entries in the Renewal package map; L1-L4 Matched; the batch records the PACKAGE version it loaded.
      - c: 2
        type: Positive
        persona: SYSTEM
        screen: RENEWAL
        title: Split resolved at Renewal sanitation
        steps:
          - After the go-live extraction, open the candidates of C-2027-004512-01 (sum insured 950,000.00) and C-2027-004513-01 (2,500,000.00), both on PKG-MC-PRIV v3.
        expected: The sanitation check the package check of the Renewal sanitation gives MC-PRIVATE-STD v1 to the first and MC-PRIVATE-HV v1 to the second; neither is in the Exception bucket.
      - c: 3
        type: Negative
        persona: SYSTEM
        screen: RENEWAL
        title: Rejected package in the Exception bucket
        steps:
          - After the go-live extraction, open the candidate of the header on PKG-HOME-01 v2 (entry Reject).
        expected: The candidate is in the Exception bucket for the Renewal processing team, which chooses the package or the new-business path.
      - c: 4
        type: Negative
        title: Overlapping sum-insured bands
        steps:
          - In a Draft PACKAGE version add a second entry for PKG-MC-PRIV v3 with band 1,500,000.00 to 3,000,000.00; Submit.
        expected: The version stays Draft.
        msg: ["Legacy package {PKG-MC-PRIV} has overlapping entries for {sum-insured band}"]
      - c: 5
        type: Positive
        persona: OPERATOR
        screen: ISSUES
        title: Header keeps its legacy package
        steps:
          - Validate and load P01 with a packaged header on PKG-XYZ-09 v1, which has no entry in the map.
        expected: No issue is raised for the package; the account shows legacy package PKG-XYZ-09 version 1.
      - c: 6
        type: Security-access
        title: Preparer approves own PACKAGE version
        pre: migsteward (TSU role in the test) submitted the version and was also given Data migration mapping approve for this test.
        steps:
          - As migsteward click Approve on the submitted PACKAGE version.
        expected: Refused; migowner (Product Owner) approves it.
        msg: [A record cannot be authorized by the user who maintained it]

  FR-DM-040:
