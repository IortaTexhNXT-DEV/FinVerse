        title: Autopay AR with the legacy invoice number
        data: [TD-DM-10]
        steps:
          - Upload the Direct Credit file with the row for I00123457; open the AR of the row; open Invoice 360 of I00123457.
        expected: The AR shows the legacy invoice number I00123457; Invoice 360 lists the AR under its receipts.

