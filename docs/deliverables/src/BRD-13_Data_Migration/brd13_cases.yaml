        expected: The line is an error; the true-up cannot be submitted.
        msg: ["{Premium Receivable - Legacy} adjustment of {1,500.00} has no matching open-item detail"]
      - c: 7
        type: Boundary
        persona: SYSTEM
        screen: JOURNAL
        title: Posting twice
        neg: true
        steps:
