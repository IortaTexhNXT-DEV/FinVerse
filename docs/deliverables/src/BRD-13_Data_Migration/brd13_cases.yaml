  FR-DM-120:
    scenario: SC-DM-08
    persona: DML
    screen: CUTOVER
    data: [TD-DM-01]
    conditions:
      - A trial-migration plan records planned and actual times per task and per object load.
      - The runbook export lists every task with owner and timing.
      - A task cannot start before its dependency is complete.
      - In a trial-migration plan the load of P01 cannot start while C01 is not accepted (reference data and clients first).
      - Each trial migration is a Mock run plan with its number, run on fresh masked extracts, and its results (timings, error rates, reconciliation) are kept for the comparison with the next run.
      - The dress rehearsal loads the production volume within the cut-over window with at least 20 percent margin.
    cases:
      - c: 1
        type: Workflow
        title: Run a trial-migration plan
        steps:
          - Create a plan of kind Mock run from the template; start and complete the tasks of phase D.
        expected: Actual start and end are recorded per task and per load; progress against the plan is shown.
      - c: 2
        type: Upload-download
        title: Runbook export
        steps:
          - Export the plan to Excel and Word.
        expected: Every task with phase, owner role, planned and actual times.
      - c: 3
        type: Negative
        title: Start before dependency
        steps:
          - Start CT-045 while CT-044 is not complete.
        expected: Refused.
        msg: ["Task {CT-045} depends on {CT-044}, which is not complete"]
      - c: 4
        type: Negative
        persona: OPERATOR
        screen: BATCH
        title: Header load before the clients are accepted
        pre: Trial-migration plan with C01 Loaded but G6 not signed.
        steps:
          - Approve and start the load of the P01 batch.
        expected: Refused; after C01 is accepted (G6) the P01 load starts.
        msg: ["Object {C01} must be accepted before this object can load"]
      - c: 5
        type: Workflow
        scenario: SC-DM-10
        title: Trial migration 2 run end to end
        pre: Trial migration 1 closed with its results; fresh masked extracts of every object received with their control files.
        steps:
          - Create a plan of kind Mock run with number 2 from the template.
          - Run the objects in load order from intake to acceptance (G1 to G6), recording the start and end of each task.
          - Export the plan and the Reconciliation Summary report.
        expected: Every object is accepted (G6) with L1-L5 matched or explained and Migration Clearing 0.00; the plan shows the planned and actual times of each task; the results of run 1 and run 2 can be compared per object.
      - c: 5
        type: Negative
        scenario: SC-DM-10
        title: Extract of an earlier run refused
        steps:
          - In trial migration 2 upload the C01 extract of trial migration 1 again with its control file.
        expected: Refused; the run uses only fresh extracts.
        msg: ["This file was already received as extract {MGX-2027-000101}"]
      - c: 6
        type: Boundary
        scenario: SC-DM-10
        title: Dress rehearsal within the window
        pre: Dress rehearsal plan; production-sized environment; full-volume masked extracts.
        steps:
          - Run phases C to E of the plan and record the actual times.
        expected: The elapsed time from the final extracts to the go / no-go checkpoint is at most 80 percent of the 48-hour window (20 percent margin); a longer run is recorded as a finding for the plan before the cut-over.

  FR-DM-121:
    scenario: SC-DM-08
