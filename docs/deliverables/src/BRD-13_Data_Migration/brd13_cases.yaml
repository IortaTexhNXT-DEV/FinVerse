    data: [TD-DM-12]
    conditions:
      - An e-policy whose insurer and insurer policy number match one migrated account is linked to it and can be viewed and downloaded from the account's documents.
      - An e-policy that matches no account, or more than one, is not linked and appears on the exception report with its reason.
      - The audit report lists every linked and failed file with the time and the reason.
    cases:
      - c: 1
        type: Upload-download
        title: Linked e-policy on the account
        steps:
          - After the e-policy load, open the migrated account of the first file of the index; open the Documents tab; download the e-policy.
        expected: The e-policy is listed, opens and downloads; the download is logged.
      - c: 2
        type: Negative
        persona: OPERATOR
        screen: BATCH
        title: Unmatched and ambiguous files
        steps:
          - Validate the e-policy index with the file that matches no account and the file that matches two accounts.
        expected: Neither file is linked; both are on the exception report with their reasons.
        msg: ["E-policy {EP-0029.pdf} matches no migrated account"]
      - c: 3
        type: Report-output
        persona: OPERATOR
        screen: REPORTS
        title: Audit report of the linking
        steps:
          - Run the audit report of the e-policy batch.
        expected: 27 files linked and 3 failed (no match, two matches, checksum) with times and reasons.

access:
  - action: View the Migration Console
    screen: HOME
    permission: "Data migration view"
    allow: [DML, STEWARD, OWNER, OPERATOR, RECON, GONOGO]
    deny: [CASHIER, MKT_AO, AUDIT]
    denied: Data Migration is not in the menu; a direct request is refused.
  - action: Maintain objects and submit decisions
    screen: OBJ
    permission: "Data migration object manage"
    allow: [DML]
    deny: [STEWARD, OWNER, OPERATOR]
    denied: New Object and Submit Decision are not shown; the request is refused.
  - action: Approve decisions and map versions
    screen: APPROVALS
    permission: "Data migration decision approve / Data migration mapping approve"
    allow: [OWNER]
    deny: [DML, STEWARD, OPERATOR]
    denied: The item is not offered in My Approvals; the request is refused.
  - action: Edit code maps and resolve issues
    screen: MAPS
    permission: "Data migration mapping edit / Data migration DQ resolve"
    allow: [STEWARD]
    deny: [OPERATOR, RECON]
    denied: The maps are read only; the request is refused.
  - action: Upload extracts and run loads
    screen: EXTRACTS
    permission: "Data migration intake / Data migration load run"
    allow: [OPERATOR]
    deny: [STEWARD, OWNER, RECON]
    denied: Upload and Load are not shown; the request is refused.
  - action: Approve a load
    screen: BATCH
    permission: "Data migration load approve"
    allow: [DML]
    deny: [OPERATOR, STEWARD]
    denied: Approve Load is not shown; the request is refused.
  - action: Sign a reconciliation and approve rollbacks
    screen: RECONC
    permission: "Data migration recon signoff / Data migration rollback approve"
    allow: [RECON]
    deny: [DML, OPERATOR, STEWARD]
    denied: Sign and Approve are not shown; the request is refused.
  - action: Decide go / no-go
    screen: GONOGO
    permission: "Data migration gonogo decide"
    allow: [GONOGO]
    deny: [DML, RECON]
    denied: GO and NO-GO are not shown; the request is refused.
  - action: Search the legacy archive
    screen: INQUIRY
    permission: "Legacy inquiry view"
    allow: [AUDIT]
    deny: [CASHIER, OPERATOR]
    denied: Legacy Inquiry is not in the menu; the request is refused.
  - action: Review the legacy access log
    screen: ACCLOG
    permission: "Legacy access log view"
    allow: [ACCESS_REV]
    deny: [AUDIT, DML]
    denied: Access Log is not shown; the request is refused.
  - action: Approve UPP reclassification to income (second level)
    screen: APPROVALS
    permission: "Cash UPP income approve"
    allow: [TOPMGMT]
    deny: [CASHIER, CASHIER_TL]
    denied: The batch is not offered at the top-management stage; the request is refused.
  - action: Approve DP PR and PR2307 legacy reversal batches
    screen: APPROVALS
    permission: "Legacy reversal approve"
    allow: [CASHIER_TL, COLLECTIONS_TL]
    deny: [SUPPORT, COLLECTIONS, ACCT]
    denied: Approve is not shown; the request is refused.

  - action: Prepare a FY2027 true-up
    screen: TRUEUPS
    permission: "Data migration trueup prepare"
    allow: [GL_LEAD]
    deny: [OPERATOR, DML]
    denied: Submit is not shown; the request is refused.
  - action: Approve a FY2027 true-up
    screen: APPROVALS
    permission: "Data migration trueup approve"
    allow: [RECON]
    deny: [GL_LEAD, DML]
    denied: The true-up is not offered in My Approvals; the request is refused.
  - action: Approve a resubmission of corrected P03 rows
    screen: RESUB
    permission: "Data migration resubmit approve"
    allow: [RNW_CHECKER]
    deny: [RNW_MAKER, OPERATOR]
    denied: Approve is not shown; the request is refused.
