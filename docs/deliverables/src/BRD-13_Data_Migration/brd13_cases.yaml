data:
  - id: TD-DM-01
    name: Test users per migration role
    content: miglead (Data Migration Lead), migsteward (Data Steward), migowner and migowner2 (data owner), migops (Migration Operator), migrecon (reconciliation approver), miggonogo (go / no-go board), legacyaudit (Audit / Compliance user), legacyrev (Compliance reviewer), topmgmt (top management approver), plus the Operations users (cashier, cashiertl, commrectl, remit, adjuster, adjtl, reconhandler, ao).
    source: Seed data; existing Operations SIT/UAT users
  - id: TD-DM-02
    name: Reference extracts
    content: R01 (MARKET_SEGMENT with 12 values, one unmapped code OLD-RET and one Create value WALKIN), R04 and R04B (insurers and branches, one unmapped code), R05 (products), R06 (the package code map, 120 entries) mapping PKG-MC-PRIV v3 to MC-PRIVATE-STD v1 up to a sum insured of 2,000,000.00 and to MC-PRIVATE-HV v1 above, and PKG-HOME-01 v2 without a BIBS package (Reject), R08 (GL account map), R11 (receipt series).
    source: Masked test extracts prepared by the test lead in the workbook layouts
  - id: TD-DM-03
    name: Client extracts
    content: C01 and C02 from QPS (600 clients) and EBIX (400 clients) with 40 exact duplicates on TIN, 15 pairs with similar names and the same birth date, 5 clients already in BIBS, 3 rows without birth date; a client delta file of the next day with 10 new and 5 changed clients.
    source: Masked extracts prepared by the test lead
  - id: TD-DM-04
    name: Policy header and RA-sent extracts
    content: "P01 and P01S with 300 in-force headers (20 with two insurers, one with shares adding to 90; C-2027-004512-01 on PKG-MC-PRIV v3 with sum insured 950,000.00 expiring 15-Jan-2028; C-2027-004513-01 on the same package with 2,500,000.00; one header on PKG-HOME-01 v2 and one on PKG-XYZ-09 v1 without a map entry; C-2027-004600-02, the legacy renewal term of C-2027-004600-01; 412 headers expiring in May 2028, one on 31-May-2028 and one on 1-Jun-2028). P03 (P03_EXCEL_20271229_01.xlsx) with 45 RAs already sent - C-2027-004512-01 sent on 16-Nov-2027 by e-mail; one row for C-2027-009999 (no header); one row expiring 15-Jun-2028; one row with RA date 30-Dec-2027; one row with RA date 150 days before its expiry; one row for C-2027-004600-01 (renewed in legacy)."
    source: Masked extracts prepared by the test lead with the Renewal processing team
  - id: TD-DM-05
    name: Open legacy invoices
    content: F01, F01S, F01C with 1,000 invoices - I00123456 (basic 20,000.00, paid 10,000.00, open 10,000.00), invoices paid in full and not remitted, direct-payment invoices with open PR, invoices with PR2307 balance, 20 USD invoices, one invoice whose components do not add up to its gross premium, one invoice number used in EBIX and QPS; control file with totals per component and currency.
    source: Masked extracts prepared by the test lead with Comptrollership
  - id: TD-DM-06
    name: Legacy UPP
    content: F02 with 200 items - a 5,000.00 item quoting legacy invoice I00200001 (3,000.00 open) and new invoice BI-2028-000150 (2,000.00 open); a 1,500.00 item older than 2 years; items without references; one item with a refund in progress.
    source: Masked extracts prepared by the test lead
  - id: TD-DM-07
    name: GL trial balance
    content: G01 per branch and currency, balanced, whose legacy control-account lines equal the F01 and F02 detail; a second version with one control line 3,000.00 higher; the P&L accounts of MKT01 netting to a FY2027 income of 1,250,000.00; a version of MKT01 PHP out of balance by 100.00; two F01 variants for branch MKT01 - one without I00300001 (paid in full, not remitted - DTIP 5,000.00 and commission receivable 800.00 open) and one without I00300002 (unpaid - premium receivable 3,000.00, DTIP 3,000.00, commission receivable 480.00 unrealised).
    source: Prepared by the test lead with Comptrollership
  - id: TD-DM-11
    name: FY2027 true-up extracts
    content: "True-up 1 for branch MKT01 - G01 version TU1 (legacy TB after the close); G03 with JV-2027-12-0457 (accrual of professional fees 80,000.00, register ADJ-2027-014) and JV-2028-AUD-0003 (audit write-off of the 3,000.00 premium receivable of I00300002, dated 31-Dec-2027); G03D with the write-off detail on I00300002 basic; the legacy journal listing since the freeze. Variants - a journal dated 5-Jan-2028; a journal without a register reference; a control-account line without detail; a listing with JV-2028-AUD-0009 not in the register; a G03 missing an accrual line of 12,000.00; a final true-up (version FINAL) for January 2028 closed."
    source: Prepared by the test lead with Comptrollership
  - id: TD-DM-08
    name: Archive extracts
    content: H01 with 500 records over the record types (a closed 2022 invoice I00098765) and H02 with 50 documents and their SHA-256.
    source: Masked extracts prepared by the test lead
  - id: TD-DM-09
    name: Configuration for the tests
    content: "Settings as configured - the environment class Non-production, the staging retention days 5, the rows per load transaction 500, the partitions loaded in parallel 4, the amount tolerance 0.00, the error-rate limit of master data 0.5, the error-rate limit of financial objects 0, the automatic merge score 90, the review score 60, the archive export limit 1000, the unusual-export alert limit 5000, the opening value date 1 January 2028, the end of the go-live renewal window 31 May 2028, the urgent-renewal date 31 January 2028, the resubmission deadline T-1 12:00; legacy control accounts, Migration Clearing and the legacy accounting rules set up on the test chart."
    source: Configuration of the SIT environment (Handbook Part B, Configuration items); seed data
  - id: TD-DM-12
    name: Extracts of BRD V0.03 (proposed objects)
    content: "F07 with 12 open claims (claim CLM-L-2027-0456 with reserve 150,000.00 and 50,000.00 paid, on policy C-2026-001200-01 expired on 30-Jun-2027; one claim on a policy without header); the e-policy index with 30 files for in-force migrated accounts (one file whose insurer policy number matches no account, one matching two accounts, one with a wrong checksum); a P01 renewal term C-2027-004700-02 starting 15-Dec-2027 booked in legacy."
    source: Masked extracts prepared by the test lead with Claims and Placement
  - id: TD-DM-10
    name: New BIBS invoices and payments
    content: BIBS invoice BI-2028-000150 with 2,000.00 open; a Direct Credit payment file with one row carrying EBIX reference I00123457 and one row for a BIBS invoice; an approved client payout account.
    source: Operations seed data; payment file prepared by the test lead

scenarios:
  - id: SC-DM-01
    persona: DML
    title: Governance. The Data Migration Lead registers the objects, the owners decide their class, and every object passes the sign-off gates in order.
    pre: Users TD-DM-01.
  - id: SC-DM-02
    persona: OPERATOR
    title: Intake to load. Extracts are received with control files, staged, mapped, validated, loaded through the BIBS services, rerun and rolled back.
    pre: Reference TD-DM-02 and invoice TD-DM-05 extracts.
  - id: SC-DM-03
    persona: RECON
    title: Reconciliation. Each object is reconciled at L1-L4 and the financial objects at L5; Migration Clearing nets to zero.
    pre: Loads of SC-DM-02; TB TD-DM-07.
  - id: SC-DM-04
    persona: STEWARD
    title: Client master and reference data. Codes are mapped and created, the package code map is loaded for the Renewal sanitation, legacy clients are matched, deduplicated and created as active clients; reference data and clients load first in every trial migration.
    pre: Extracts TD-DM-02 and TD-DM-03.
  - id: SC-DM-05
    persona: CASHIER
    title: Legacy open items. Legacy invoices and UPP are processed with the BIBS screens - OTC, autopay, automatch, dispositions, refund and reclassification to income.
    pre: Invoices TD-DM-05, UPP TD-DM-06, payments TD-DM-10.
  - id: SC-DM-06
    persona: ACCT
    title: Reversals, remittance and endorsements on legacy invoices, and the Prod Recon change report.
    pre: Invoices TD-DM-05; headers TD-DM-04.
  - id: SC-DM-07
    persona: AUDIT
    title: History. Archived records are searched in Legacy Inquiry and every access is logged and reviewed.
    pre: Archive TD-DM-08.
  - id: SC-DM-08
    persona: PM
    title: Cutover. A trial-migration plan is run with reference data and clients first, go / no-go is decided on measured criteria, the January-May 2028 expiries are extracted at go-live with the RAs already sent and the later expiries move by RMEL cohort, and legacy systems are decommissioned on the checklist.
    pre: All objects loaded in a trial migration.
  - id: SC-DM-09
    persona: RECON
    title: Year-end cut-over. The provisional GL opening is loaded from the preliminary December trial balance, and the FY2027 closing and audit adjustments reach BIBS in approved true-ups that are reconciled to the legacy trial balance and closed.
    pre: Trial balance TD-DM-07; true-up extracts TD-DM-11.

  - id: SC-DM-10
    persona: DML
    title: Trial migrations and the dress rehearsal. Each trial migration runs every object on fresh masked extracts from intake to acceptance as a Mock run plan, with its timings and reconciliation; the dress rehearsal runs the production volume within the cut-over window.
    pre: All objects decided (G1) and layouts frozen (G2); extracts TD-DM-02 to TD-DM-08 prepared again for each run.
  - id: SC-DM-11
    persona: DML
    title: Rollback and rerun. A loaded batch with a wrong code map is rolled back, the map is corrected and the batch is loaded again and reconciles; rejected rows are corrected and rerun.
    pre: Loads of SC-DM-02.
  - id: SC-DM-13
    persona: CLAIMS
    title: Objects added by BRD V0.03 on BDOI confirmation. Open claims are carried forward and linked to their legacy policy headers, and e-policies are linked to the migrated accounts with the unmatched files flagged.
    pre: BDOI has confirmed CLR-DM-08 and CLR-DM-09; extracts TD-DM-12.
  - id: SC-DM-12
    persona: GONOGO
    title: Cut-over rehearsal. The production cut-over plan is rehearsed with its checkpoints; a NO-GO restores the snapshot and reopens legacy, and the rehearsal is run again to GO.
    pre: Dress rehearsal plan of SC-DM-10 with every object loaded.

frs:
  FR-DM-001:
    scenario: SC-DM-01
    persona: DML
    screen: OBJ
    data: [TD-DM-01]
    conditions:
      - A new object is saved as Proposed with its four criteria and shown in the register.
      - An object cannot be given a load order before an object it depends on.
      - An Excluded object stays in the register and cannot be loaded.
      - An object code is unique and the rationale is mandatory.
    cases:
      - c: 1
        type: Positive
        title: Register the client master object
        steps:
          - Click New Object; enter code C01, name, category Client, source systems QPS and EBIX, target, owner migowner, steward migsteward.
          - Enter the four criteria (Day-1 need Yes, compliance need Yes, archival option No, data trust Medium), proposed class Migrate, load order 5, rationale; Save.
        expected: C01 is listed with status Proposed, its criteria, owner and steward; the audit shows the creation.
      - c: 2
        type: Negative
        title: Load order before a dependency
        steps:
          - Open P01; set Depends on C01 and load order 4; Save.
        expected: Not saved.
        msg: [The load order must follow the objects this object depends on]
      - c: 3
        type: Negative
        screen: BATCH
        title: Excluded object cannot be loaded
        steps:
          - After R10 is Decided as Excluded, open Batches, New Batch and look for R10 in the object list.
        expected: R10 is not offered; the register still lists R10 as Excluded.
      - c: 4
        type: Negative
        title: Duplicate code and missing rationale
        steps:
          - Create a second object with code C01; Save.
          - Create object X99 without a rationale; Save.
        expected: "Both are refused. The second check shows \"Enter the rationale for the proposed class\"."
        msg: ["This object code already exists"]

  FR-DM-002:
    scenario: SC-DM-01
    persona: DML
    screen: OBJDEC
    data: [TD-DM-01]
    conditions:
      - A decision approved by the business owner sets the object to Decided with the approved class.
      - The submitter cannot approve their own decision.
      - A returned decision goes back to Proposed and needs a reason.
      - A class change from Migrate to Excluded is refused while a batch of the object is loaded.
      - The report Migration Decisions lists every decision with its approver.
    cases:
      - c: 1
        type: Workflow
        title: Submit and approve the decision of C01
        steps:
          - As miglead click Submit Decision on C01.
          - As migowner open My Approvals, open C01 and click Approve.
        expected: C01 moves For decision then Decided with class Migrate; miglead is notified of the approval.
      - c: 2
        type: Security-access
        title: Submitter approves own decision
        persona: OWNER
        pre: A user holding both Data Migration Lead and data owner submitted the decision.
        steps:
          - As that user click Approve.
        expected: Refused; the decision stays For decision.
        msg: [A record cannot be authorized by the user who maintained it]
      - c: 3
        type: Negative
        persona: OWNER
        screen: APPROVALS
        title: Return without a reason
        steps:
          - Click Return on a submitted decision without a reason; then enter a reason and Return.
        expected: The first attempt is refused; the second returns the object to Proposed.
        msg: [Enter the reason for the return]
      - c: 4
        type: Negative
        title: Change class with loaded data
        pre: A batch of R01 is Loaded and not rolled back.
        steps:
          - Submit a new decision for R01 with class Excluded.
        expected: Refused.
        msg: [Roll back the loaded batches before changing the class of this object]
      - c: 5
        type: Report-output
        screen: REPORTS
        title: Decision history report
        steps:
          - Run the report Migration Decisions for the test period; export to Excel.
        expected: Every decision is listed with class, criteria, submitter, approver and dates; the Excel file has the same rows.

  FR-DM-003:
    scenario: SC-DM-01
    persona: DML
    screen: SIGNOFF
    data: [TD-DM-01]
    conditions:
      - An object reaches G6 only after G1-G5 are signed in order.
      - The operator of a batch cannot sign its reconciliation; one person cannot sign two gates of the same batch.
      - G5 cannot be signed while a break is open.
      - The Sign-off screen shows per object and environment which gates are signed, by whom and when.
    cases:
      - c: 1
        type: Workflow
        title: Sign G1 to G6 of R01 in order
        steps:
          - Sign G1 and G2 as migowner, G3 as migsteward, G4 as miglead, G5 as migrecon, G6 as migowner2 and miglead.
        expected: Each gate is recorded with role, user, time and comment; R01 shows Accepted for SIT.
      - c: 1
        type: Negative
        title: Sign G6 before G5
        steps:
          - On a batch whose G5 is not signed, try to sign G6.
        expected: Refused.
        msg: [Sign the previous gate first]
      - c: 2
        type: Security-access
        persona: OPERATOR
        title: Operator signs the reconciliation of own batch
        pre: migops ran the batch and was given Data migration recon signoff for this test.
        steps:
          - As migops sign G5 of the batch.
        expected: Refused.
        msg: [A record cannot be authorized by the user who maintained it]
      - c: 3
        type: Negative
        persona: RECON
        title: Sign G5 with an open break
        steps:
          - Open a reconciliation with one Break without explanation; click Sign.
        expected: Refused.
        msg: [Explain and approve every break before signing the reconciliation]
      - c: 4
        type: Report-output
        title: Gate matrix
        steps:
          - Open Sign-off; filter environment SIT.
        expected: One row per object with G1-G7; signed gates show user and date; the report Sign-off Status gives the same content.

  FR-DM-010:
    scenario: SC-DM-02
    persona: OPERATOR
    screen: EXTRACTS
    data: [TD-DM-02, TD-DM-05]
    conditions:
      - A file whose rows, amounts and hash total agree with its control file is staged and numbered MGX-yyyy-nnnnnn.
      - A file with one row fewer than the control count, a wrong checksum, a wrong header, a wrong amount total or a wrong hash total is rejected and nothing is staged.
      - The same file sent twice and a delta with an earlier as-of date are refused.
      - In a non-production environment staged client names and TINs are masked, always the same way; in production they are not.
    cases:
      - c: 1
        type: Upload-download
        title: Upload F01C with its control file
        steps:
          - Choose object F01, layout F01C, source EBIX, mode FULL; upload F01C_EBIX_20271231_01.csv and its .ctl.csv.
        expected: The extract gets an MGX number, status Staged, and shows the row count and the totals per component and currency of the control file.
      - c: 2
        type: Negative
        title: One row missing
        steps:
          - Upload a data file with one row deleted and the original control file.
        expected: Rejected; nothing staged; alert to the Data Migration Lead.
        msg: ["The file has {999} rows; the control file says {1000}"]
      - c: 2
        type: Negative
        title: Checksum and header mismatch
        steps:
          - Upload a file edited after the control file was made; then a file with column open_balance renamed OpenBal.
        expected: "Both rejected. The second check shows \"The file columns do not match layout version 1: missing open_balance, extra OpenBal\"."
        msg: ["The file does not match the checksum in the control file"]
      - c: 2
        type: Negative
        title: Amount and hash totals mismatch
        steps:
          - Upload a file with one open_balance changed by 1.00 and its checksum recomputed; then a file with one invoice number changed.
        expected: "Both Rejected with the difference. The second check shows \"The hash total of the key column does not match the control file\"."
        msg: ["The total of {open_balance} in {PHP} is {x}; the control file says {y}"]
      - c: 3
        type: Negative
        title: Duplicate file and out-of-order delta
        steps:
          - Upload the accepted file of case 1 again.
          - Upload a C01 delta with as-of date one day before the last C01 extract.
        expected: "Both refused. The second check shows \"The as-of date is earlier than the last extract of this object\"."
        msg: ["This file was already received as extract {MGX-2027-000001}"]
      - c: 4
        type: Positive
        screen: ISSUES
        data: [TD-DM-03, TD-DM-09]
        title: Masking outside production
        steps:
          - Upload C01 twice in SIT under two different file names with one row changed; open the staged rows.
        expected: Names, TIN, e-mail, mobile and birth date are masked; the same client has the same masked values in both extracts; amounts and codes are unchanged.

  FR-DM-011:
    scenario: SC-DM-04
    persona: STEWARD
    screen: MAPS
    data: [TD-DM-02]
    conditions:
      - An approved version supersedes the previous one and is used by the next validated batch.
      - A version mapping to a BIBS code that does not exist cannot be approved.
      - A legacy code mapped twice in one version is refused.
      - The approver is never the submitter.
      - Each batch shows the map versions it used.
    cases:
      - c: 1
        type: Workflow
        title: New version of INSURER approved
        steps:
          - Create a Draft copied from the approved version; add MAL of QPS mapped to INS-MAL; Submit.
          - As migowner compare with the approved version and Approve.
        expected: Version 2 is Approved and version 1 Superseded; the comparison showed one added entry.
      - c: 2
        type: Negative
        persona: OWNER
        title: Target code does not exist
        steps:
          - Submit a version mapping XYZ to INS-NOPE; as migowner Approve.
        expected: Not approved.
        msg: ["Target code {INS-NOPE} does not exist in {INSURER}"]
      - c: 3
        type: Negative
        title: Same legacy code twice
        steps:
          - Add MAL of QPS twice in a Draft; Save.
        expected: Refused.
        msg: ["Legacy code {MAL} of {QPS} is mapped twice"]
      - c: 4
        type: Security-access
        title: Submitter approves own version
        pre: migsteward also holds Data migration mapping approve for this test.
        steps:
          - Submit a version and Approve it as the same user.
        expected: Refused.
        msg: [A record cannot be authorized by the user who maintained it]
      - c: 5
        type: Upload-download
        screen: BATCH
        title: Map versions on the batch and Excel round trip
        steps:
          - Export the INSURER set to Excel, add one entry, import it as a Draft.
          - Validate an R04 batch; open the batch page.
        expected: The import creates a Draft with the new entry; the batch lists the set versions it used.

  FR-DM-012:
    scenario: SC-DM-04
    persona: STEWARD
    screen: UNMAPPED
    data: [TD-DM-02]
    conditions:
      - A staged row whose insurer code is not mapped appears in the report Unmapped Legacy Codes with its legacy key.
      - The load of that batch cannot be approved until the code is mapped and the batch validated again.
      - The report exports to Excel and PDF.
    cases:
      - c: 1
        type: Report-output
        title: Unmapped insurer listed
        steps:
          - Validate the R04 batch with one unmapped insurer code; open the Unmapped tab.
        expected: The code is listed with set INSURER, source, row count and sample keys; alert to the steward.
      - c: 2
        type: Negative
        persona: DML
        screen: BATCH
        title: Approve load with unmapped codes
        steps:
          - Click Approve Load on that batch.
        expected: Refused.
        msg: ["The batch has {1} unmapped codes; map them before approving the load"]
