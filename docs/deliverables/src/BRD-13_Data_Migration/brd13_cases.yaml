# Test plan BRD-13 Data Migration - test data file.
# Build: python docs/deliverables/src/testplans/build_test_plan.py docs/deliverables/src/BRD-13_Data_Migration/brd13_cases.yaml
# Schema: see the header of build_test_plan.py. FR titles, BRD IDs and priorities come from the fr blocks of the
# Data Migration Handbook (Part B). The expected results quote the message texts of the handbook; screen paths follow
# the screens of Part B. Test data are masked extracts in the load templates of the Migration Workbook. Account names only: the legacy
# control accounts and Migration Clearing are assigned by Comptrollership (DMQ18).

