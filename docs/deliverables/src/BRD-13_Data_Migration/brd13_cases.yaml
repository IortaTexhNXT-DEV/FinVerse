    data: [TD-DM-07]
    conditions:
      - GO cannot be recorded while Migration Clearing is not 0.00.
      - The decision record shows each criterion value at the time of the decision.
      - NO-GO starts the fallback task.
      - GO cannot be recorded while the preliminary trial balance is not signed as the provisional opening.
      - In the cut-over rehearsal a NO-GO restores the snapshot taken before the production load and reopens legacy; the rehearsal run again reaches GO.
    cases:
      - c: 1
        type: Negative
        title: GO with clearing not zero
        pre: TB version with one control line 3,000.00 higher loaded.
        steps:
          - Click GO.
        expected: Refused.
        msg: ["Criterion {Migration Clearing} is not met"]
      - c: 2
        type: Positive
        title: GO recorded with values
        steps:
          - With all criteria met click GO with a comment; open the decision record.
        expected: The record shows every criterion with its value and status and the board member.
      - c: 3
        type: Workflow
        title: NO-GO starts the fallback
        steps:
          - In a trial-migration plan record NO-GO.
        expected: The fallback task starts and its owner is notified.
      - c: 4
        type: Negative
        title: GO without the signed provisional opening
        pre: All other criteria met; the preliminary trial balance not signed by Comptrollership.
        steps:
          - Click GO.
        expected: Refused.
        msg: ["Criterion {Provisional opening signed} is not met"]
      - c: 5
        type: Workflow
        scenario: SC-DM-12
        title: Cut-over rehearsal with a NO-GO and a second run
        pre: Dress rehearsal plan with every object loaded; snapshot taken before the production load (task of phase D).
        steps:
          - At the go / no-go checkpoint record NO-GO with the reason "clearing not zero".
          - Follow the rollback tasks - restore the snapshot, reopen the legacy systems, inform the users.
          - Run phases D and E of the plan again with the corrected extract and record GO.
        expected: After NO-GO the rollback tasks start with their owners; after the restore no migrated record is in BIBS and the legacy systems accept postings; the second run meets every criterion and GO is recorded with the values; the plan shows both runs with their times.

