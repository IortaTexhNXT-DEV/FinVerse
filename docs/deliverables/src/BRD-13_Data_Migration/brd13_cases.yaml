        expected: "The three rows are Invalid with \"Expiry {2028-06-15} is outside the go-live renewal window or differs from the header\" and \"RA date {2027-12-30} is after the last legacy business day\" for the second and third; the Excel report has the columns Correction, Corrected by and date, and Checked by."
