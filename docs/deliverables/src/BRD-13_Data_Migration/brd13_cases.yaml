    scenario: SC-DM-02
    persona: OPERATOR
    screen: BATCH
    data: [TD-DM-02, TD-DM-03]
    conditions:
      - Loading the same batch twice creates no duplicate; the second run marks the rows Skipped.
      - A client created by a load is found in client search and has a cross-reference to its legacy key.
      - The batch page shows staged, loaded, skipped, rejected and excluded counts that add up.
      - An object loads only after the objects it depends on are accepted, and the approver of the load is not the operator.
      - Every record created by a load carries the origin Migrated with its source system, legacy reference and batch, shown by the LEGACY badge and its tooltip.
    cases:
      - c: 1
        type: Positive
        title: Load R01 twice
        steps:
          - As miglead Approve Load; as migops click Load; after completion run Load again.
        expected: First run Loaded; second run marks every row Skipped; no LOV value is duplicated.
      - c: 2
        type: Positive
        screen: CLIENTS
        title: Loaded client found by legacy number
        steps:
          - After the C01 load, search client search with legacy number Q-0012345.
        expected: The BIBS client opens; it shows source QPS and legacy number Q-0012345.
      - c: 3
        type: Report-output
        title: Counts add up
        steps:
          - Open the batch page of the C01 load; run the report Migration Batches.
        expected: loaded + skipped + rejected + excluded = staged; the log lists each step with counts and times.
      - c: 4
        type: Negative
        title: Dependency not accepted
        steps:
          - Approve and load a P01 batch while C01 is not accepted (G6) in the environment.
        expected: Refused.
        msg: ["Object {C01} must be accepted before this object can load"]
      - c: 4
        type: Security-access
        persona: DML
        title: Operator approves own load
        pre: migops is given Data migration load approve for this test.
        steps:
          - As migops approve the load of the batch migops will run.
        expected: Refused.
        msg: [A record cannot be authorized by the user who maintained it]
      - c: 5
        type: Positive
        screen: CLIENTS
        title: Migrated flag and legacy source on a loaded client
        steps:
          - After the C01 load, search a client loaded from QPS; hover the LEGACY badge.
        expected: The client shows the LEGACY badge; the tooltip gives the source system QPS, the legacy client number and the batch; the Origin filter set to BIBS hides it.

  FR-DM-015:
    scenario: SC-DM-02
    persona: DML
    screen: BATCH
    data: [TD-DM-03, TD-DM-05]
    conditions:
      - A rerun batch loads only the previously rejected rows and its counts are added to the parent batch reconciliation.
      - A rollback of a client batch without later activity leaves no active migrated client of that batch.
      - A rollback is refused when a payment was applied to a legacy invoice of the batch.
      - The approver of a rollback is not the requester.
      - After a rollback the batch is loaded again with a corrected code map version and reconciles like a first load.
      - A rerun of rows selected among the rejected rows reprocesses only those rows; each shows whether it was migrated or failed again, a row that fails again keeps its error details, and the run log gives the counts reprocessed, migrated and failed with the times.
    cases:
      - c: 1
        type: Positive
        title: Rerun rejected clients
        steps:
          - Fix the 3 rejected rows at source; upload the new extract; click Rerun Rejects; approve and load.
        expected: A child batch with 3 rows loads them; the parent reconciliation shows the combined counts.
      - c: 2
        type: Workflow
        persona: RECON
        title: Roll back a client batch
        steps:
          - As miglead click Request Rollback with a reason; as migrecon approve.
        expected: The batch is Rolled back; no client of the batch is active; the log lists each undone record.
      - c: 3
        type: Negative
        title: Rollback after a payment
        steps:
          - Apply an OTC payment to one invoice of the F01 batch; request the rollback of F01.
        expected: Refused.
        msg: ["{1} records were changed after the load and cannot be rolled back"]
      - c: 4
        type: Security-access
        title: Requester approves own rollback
        pre: miglead is given Data migration rollback approve for this test.
        steps:
          - Request and approve the same rollback as miglead.
        expected: Refused.
        msg: [A record cannot be authorized by the user who maintained it]
      - c: 5
        type: Workflow
        scenario: SC-DM-11
        persona: DML
        title: Roll back, correct the map and load again
        pre: The R04 batch was loaded with insurer code MAL mapped to the wrong insurer; no record of the batch changed since.
        steps:
          - Request the rollback of the R04 batch with the reason "wrong insurer map"; as migrecon approve it.
          - As migsteward create a new version of the insurer code map with MAL mapped to INS-MAL; as migowner approve it.
          - Create a new batch of the same extract; validate, approve the load, load and reconcile.
        expected: The first batch is Rolled back; the new batch uses the new map version, loads every row and reconciles at L1-L4 with the control totals; the Code Map Versions report lists both versions and the batches that used them.
      - c: 6
        type: Positive
        scenario: SC-DM-11
        title: Rerun selected fall-out rows
        pre: The C01 batch has 3 rejected rows; 2 are corrected at source and the third is not.
        steps:
          - On the Rows tab select the 3 rejected rows; click Rerun Rejects; approve and load the rerun batch.
          - Open the run log of the rerun.
        expected: The rerun reprocesses the 3 rows only - 2 show Migrated on rerun and 1 shows Failed again with its error details; the run log shows reprocessed 3, migrated 2, failed 1 with the start and end times.
      - c: 6
        type: Negative
        scenario: SC-DM-11
        title: Rerun after the object is accepted
        pre: The R01 object is accepted (G6) in SIT.
        steps:
          - Open the accepted R01 batch and look for Rerun Rejects.
        expected: Rerun Rejects is not offered; the remaining row is keyed from the manual-entry plan.

