        expected: "Both journals are errors. The second shows \"Journal {JV-2027-12-0999} is not in the FY2027 adjustment register\"."
        msg: ["Journal {JV-2028-01-0005} is dated {2028-01-05}, outside FY2027"]
      - c: 4
        type: Security-access
        title: Preparer approves own true-up
        pre: The GL lead was also given Data migration trueup approve for this test.
        steps:
          - As the GL lead who submitted true-up 1, click Approve.
        expected: Refused; the true-up stays for approval.
        msg: [A record cannot be authorized by the user who maintained it]
      - c: 5
        type: Workflow
        persona: RECON
        title: Final true-up into a closed January
        pre: January 2028 CLOSED; final true-up approved.
        steps:
          - Reopen January 2028 with a reason; let BIBS post MIG-TU-F; close January 2028.
        expected: The journals post with value date 1 January 2028; the period shows REOPENED and CLOSED on the same day with the reason in its audit trail.
      - c: 6
        type: Negative
        persona: OPERATOR
        screen: ISSUES
        title: Control-account line without detail
        steps:
