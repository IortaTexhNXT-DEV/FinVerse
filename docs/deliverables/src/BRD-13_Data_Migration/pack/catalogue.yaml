    target: "General ledger journals of type OPENING (reference MIG-TU-<n>); opening adjustments of the legacy open items and unapplied payments"
    owner: Head, Comptrollership
    steward: Comptrollership GL lead (prepares each true-up)
    history: Legacy journals posted after the freeze, dated in FY2027
    delta: One set per true-up (true-up 1 about 18-Jan-2028; final after the audited FS, about March-April 2028)
    format: XLSX or CSV with control file
    controls: Row count; debit and credit totals per branch and currency; count of distinct legacy_journal_no
    due: T+16 (true-up 1); T+92 (final)
    order: 17
    brd: BRID_MIG 1.2, 5.1-8.1, 13.1
    questions: DMQ18, DMQ39
    bound: Tens to a few hundred journal lines per true-up
    layouts: [G03, G03D]
  - code: H01
    name: Closed transactions (paid and remitted invoices, receipts, remittances, endorsements, claims, renewal advices, letters)
    category: History
    decision: ARCHIVE
    rationale: History stays in read-only legacy or the BIBS archive with logged access (BRID_MIG 11.1).
    source: EBIX, QPS, ISYS
    target: "BIBS archive (Legacy Inquiry)"
    owner: Audit / Compliance; legacy system owners
    steward: Compliance data steward (to name)
    history: Per retention (5 years online, 15 years archive, umbrella p.45)
    delta: None
    format: CSV
    controls: Row count, amount totals and hash total per record type
    due: Before decommissioning
    order: 16
    brd: BRID_MIG 11.1
    questions: DMQ24, DMQ27
    bound: To supply
    layouts: [H01]
  - code: H02
    name: Legacy documents (policies, SOAs, ORs, certificates, letters)
    category: History
    decision: ARCHIVE
    rationale: Documents are kept with their archive record and a checksum.
    source: File shares, EBIX
    target: "Legacy documents attached to the archive records"
    owner: Audit / Compliance
    steward: Compliance data steward (to name)
    history: Per retention
    delta: None
    format: CSV index plus files
    controls: Row count; SHA-256 per file
    due: Before decommissioning
    order: 16
    brd: BRID_MIG 11.1
    questions: DMQ24
    bound: To supply
    layouts: [H02]

