# BRD-13 Data Migration - catalogue of the business sign-off set (release set v2.0): the data objects with their
# proposed decisions, owners and extract planning, the milestones, the open decisions and the proposed business
# rules for confirmation, the reconciliation and verification plan per object, and the examples of the Migration
# Workbook. Read by build_dm_pack.py for the Handbook (```pack blocks), the Migration Workbook and the guide deck.
#
# The extract layouts (the load templates), the code map sets, the data-quality rules and the masking rules are not
# typed here: they are read from the layout definitions that the Migration Console holds and exports (its seed
# catalogue), so the workbook and the console templates are always the same. build_dm_pack.py --check verifies
# that every object below agrees with that catalogue (code, category, class, load order, sources, layouts).

decision_classes:
  - [MIGRATE, "Clean master or reference data needed on Day 1; loaded into BIBS through the service of the owning module"]
  - [CARRY_FORWARD, "Open operational or financial item at cutover; loaded with its open position and processed in BIBS"]
  - [CONDITIONAL, "Migrated only when the condition decided by BDOI is met (BRID_MIG 4.1; DMQ09, DMQ30)"]
  - [ARCHIVE, "History kept read-only in legacy or loaded into the BIBS archive for inquiry (BRID_MIG 11.1)"]
  - [EXCLUDED, "Not migrated; set up again in BIBS or not needed"]

milestones:
  - [M0, "Business sign-off set issued to BDOI (release set v2.0, with the BDOI answers to DMQ36-DMQ39)", "5 Oct 2026"]
  - [M1, "Scope-shaping decisions (answers that change the migration functions)", "16 Oct 2026"]
  - [M2, "Owners, stewards, keys and remaining business rules; object decisions signed (gate G1); layouts frozen, version 1 (G2 part 1) - end of requirements and mapping", "30 Oct 2026"]
  - [M3, "First full extracts in the templates, with control files and volumes (profiling, performance sizing)", "29 Jan 2027"]
  - [M4, "Extracts for Trial migration 1 (SIT migration starts); reference data and clients first", "9 Apr 2027"]
  - [M5, "Code maps approved for Trial migration 2 (G2), including the package code map", "18 Jun 2027"]
  - [M6, "Cut-over date and window, fallback and decommissioning criteria agreed; Comptrollership confirms the year-end option A (DMQ39)", "1 Oct 2027"]

# --------------------------------------------------------------------------------------------------------------
# Data object register. decision: MIGRATE / CARRY_FORWARD / CONDITIONAL / ARCHIVE / EXCLUDED (proposal; BDOI
