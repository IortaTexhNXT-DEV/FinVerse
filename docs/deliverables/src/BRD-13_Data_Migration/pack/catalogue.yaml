# --------------------------------------------------------------------------------------------------------------
# Columns of the control file. The column names and their order are those of the control-file template that the
# Migration Console exports (Control File Template); the check refuses a difference. [name, what it holds,
# mandatory, format, example]
control_fields:
  - [object, Object code of the data file, Y, Upper case; matches the file name, F01]
  - [layout, Layout (template) code, Y, Upper case; matches the header row, F01C]
  - [source_system, "Source system: EBIX, QPS, ISYS, CMS or EXCEL", Y, Upper case; matches the file name, EBIX]
  - [data_file, Name of the data file the control file belongs to, Y, "<LAYOUT>_<SOURCE>_<yyyyMMdd>_<nn>.csv or .xlsx", F01C_EBIX_20271231_01.csv]
  - [as_of, Date and time the data represents, Y, "yyyy-MM-dd HH:mm:ss; not earlier than the previous extract of the layout", "2027-12-31 22:00:00"]
  - [extracted_at, When the extract ran, Y, "yyyy-MM-dd HH:mm:ss; after as_of", "2028-01-01 00:40:12"]
  - [extracted_by, BDOI IT user who ran the extract, Y, Free text, bdoi.it.jramos]
  - [measure, "Kind of control: ROW_COUNT, HASH_TOTAL, AMOUNT_TOTAL or SHA256", Y, Upper case, AMOUNT_TOTAL]
  - [column_name, Column the measure applies to, C, "As in the header; mandatory for HASH_TOTAL and AMOUNT_TOTAL", open_balance]
  - [currency, Currency of an AMOUNT_TOTAL, C, ISO 4217; mandatory for AMOUNT_TOTAL, PHP]
  - [filter, Optional filter of the measure, N, column=value, component=BASIC]
  - [value, Value of the measure, Y, Digits with a dot decimal for amounts; 64 hexadecimal characters for SHA256, "98450221.40"]

