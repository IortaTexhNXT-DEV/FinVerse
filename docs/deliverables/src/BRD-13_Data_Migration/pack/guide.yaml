# How the business unit reviews the Migration Workbook (sheet How to review).
howto:
  - "Read the Handbook part of your role with the screenshots, or walk through the Migration Console on the SIT environment during the sessions of the Start Here guide."
  - "On the sheets of your objects (Object catalogue, Data owners, Extract planning, the load template sheets, Code maps, Validation rules, Reconciliation sign-off) and on the screen sheets, set BU review to Accept, Change requested or Comment for each row you review, and write the change in BU comment."
  - "On the Proposed rules sheet, record the BDOI decision (Agree, Agree with change, Disagree, Need more information), the change asked for, who decided and the date."
  - "Put your name in Reviewer and the date in Review date. Leave the other columns unchanged."
  - "The load template sheets are the layouts of the Migration Console column for column; the console exports the same templates (Layouts and Rules, Load Templates Workbook)."
  - "Return the workbook to the iorta TechNXT project team by the date of the Start Here guide. Every Change requested row is answered in the Comments log before sign-off."
  - "Questions and change requests go to the Comments log; the project team answers each one there. On the Sign-off certificate sheet, each signatory records the decision and the date. The screenshots use fictitious seed data."
