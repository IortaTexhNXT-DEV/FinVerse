# Guide to the BRD-13 Data Migration business sign-off pack: the content of the 01 Guide deck (shared guide deck
# builder, with the migration slides of module_slides) and of the 00 Start Here guide (START_HERE_BRD13.md, ```pack
# blocks "guide-*"). The layout is the same for every BRD set; only this file changes.
meta:
  deck_title: Sign-off Pack Guide
  module: Data Migration
  owner: Program Manager, Business Project Services (BDO Unibank ESG)
  issued: Mon 5-Oct-2026
  signoff_date: Fri 30-Oct-2026
  # What the pack holds, on the purpose slide (every set has its own).
  purpose_detail: "Every screen of the Migration Console with numbered fields, the migration catalogue (objects, load templates, code maps, rules, owners), the cut-over plan and the reconciliation sign-off"
  # The process flow slide (figures/brd13_process_flow.png).
  process_caption: "The way of every data object: from its decision to its acceptance, with the gates G1 to G6"
  process_notes: "Each object goes through the same steps in every trial migration, the dress rehearsal and the production cut-over. The gates are signed in the Migration Console; a break sends the batch back to validation with a fix at source, a new code map version or a waiver. Gate G7 is the go / no-go of the whole cut-over."
  # The workbook slide: which sheet is pictured, with which columns, and what the reviewer does.
  workbook_sheet: "C01 Client master"
  workbook_columns: ["No.", "Column", "Description", "Type", "Mandatory", "BU review", "BU comment", "Reviewer", "Review date"]
  workbook_example: "Add the maiden name of married clients for the matching"
  workbook_caption: "Load template sheet C01 of the Migration Workbook"
  workbook_side:
    - "Review the rows of your objects: Object catalogue, Data owners, the load template sheets, Code maps, Validation rules, Cut-over tasks, Reconciliation sign-off"
    - "BU review: Accept, Change requested or Comment"
    - "BU comment: the change asked for"
    - "Proposed rules: the BDOI decision on each rule"
    - "Questions go to the Comments log"
    - "Leave the other columns unchanged; one workbook per unit"
  # References of the deck notes to the chapters of the 02 document of this set.
  chapters:
    document: Data Migration Handbook
    screens: Handbook Part B, chapter 19
    menus: Handbook Part B, chapter 17
    messages: Handbook Part B, chapter 21
    contract: Handbook Part B, chapter 28
    walkthroughs: the trial migrations of Handbook Part A, chapter 10

# The documents of the set in reading order. kind = document type of the file name (brand.READING_ORDER and
# READING_ORDER_EXTRA).
documents:
  - {kind: StartHere, name: Data Migration, ext: docx, what: "Start Here: the map of the set, who reads what, the steps up to sign-off and the dates", readers: Everyone, when: "First, on issue"}
  - {kind: GuideDeck, name: Data Migration, ext: pptx, what: "Guide deck: the migration approach, the objects and decisions, roles and data owners, trial migrations and dress rehearsal, sign-off gates, cut-over and go / no-go, migrated and new data, caveats, entry and exit criteria, handover", readers: "Business owner, data owners, Comptrollership, BDOI IT; presented at the kick-off", when: "Kick-off session"}
  - {kind: Handbook, name: Data Migration, ext: docx, what: "Data Migration Handbook: A strategy and approach; B functional specification of the Migration Console with screenshots, fields, actions, rules and messages, the markers of migrated data and the legacy batches; C reconciliation and the sign-off gates per object; D the cut-over runbook, run-off and decommissioning; the proposed rules for confirmation", readers: "Data owners and Comptrollership for their objects and parts; BDOI IT; the Renewal processing team", when: "During the review, with the console walkthroughs"}
  - {kind: Workbook, name: Data Migration, ext: xlsx, what: "Migration Workbook: object catalogue and decisions, extract planning, the load templates (one sheet per layout), code maps, validation rules, data owners, cut-over task plan, reconciliation sign-off per object, proposed rules with the BDOI decision, the screens; comments log, meeting minutes, version history, sign-off certificate", readers: "Every reviewer; the signatories sign it", when: "During the review and at sign-off"}
  - {kind: TestPlan, name: Data Migration, ext: xlsx, what: "Test plan workbook: the test cases traced to the requirements and to the screens, with the trial migration, reconciliation, rollback, rerun and cut-over rehearsal scenarios", readers: "Data owners who verify the trial migrations; BDOI IT", when: "After the handbook; used again in the trial migrations"}
  - {kind: TestPlan, name: Data Migration Summary, ext: docx, what: "Test plan summary: scope, approach, coverage and the cases by area", readers: "Business owner, BDOI IT", when: "Before sign-off"}

# Reading order per role (Handbook parts and chapter numbers of v2.0).
reading:
  - role: "Approver (Product Owner, Marketing Business System) and Program Manager, Business Project Services"
    order: "00 Start Here; 01 Guide deck; Handbook Part A (approach, objects and decisions, cycles, cut-over) and the chapter Proposed business rules and clarifications for confirmation; workbook sheets Object catalogue, Proposed rules and Sign-off certificate"
  - role: "Data owners per object: Marketing Business System (R01, R05, R06, C01, C03); Heads of Retail and Corporate Marketing (R03, C01); Operations (R04, R07, P01, F01-F04, F06); Comptrollership (R02, R08, F01, F02, G01, G03); Disbursement (R09, C03); Compliance and Analytics (C04, H01, H02); Renewal processing team (P03)"
    order: "Handbook Part A chapter 3 (objects and decisions) and chapter 6 (templates and mapping); the load template sheets of your objects, Code maps and Validation rules; Part C chapters 32 and 34 for the reconciliation and the samples you verify; workbook sheets Object catalogue, Data owners, Extract planning, Reconciliation sign-off"
  - role: Comptrollership
    order: "Handbook Part A chapter 7 (legacy invoices and sub-ledgers) and chapter 11 (cut-over strategy); Part D chapter 44 (year-end cut-over); Part B screens Reconciliation and Opening-Balance Adjustments; Part C chapter 33 (Migration Clearing and the adjustment reconciliation); the proposed rules PR-DM-01, 02, 06, 10 and 14; workbook sheets G01, G03, G03D, F01C and Reconciliation sign-off"
  - role: Renewal processing team
    order: "Handbook Part A chapter 8 (renewal-driven transition); Part B Batches (resubmissions of the RA-sent file); Part D tasks of the go-live renewal extraction and the day-1 queue; workbook sheet P03 and the load template workbook of P03 exported by the console"
  - role: BDOI IT
    order: "Handbook Part A chapter 6 (templates, secure transfer, masking) and chapter 12 (data security); Part B Extracts and Layouts and Rules; Part D (freeze, final extracts, rollback, decommissioning); proposed rules PR-DM-03 and PR-DM-04; workbook sheets File rules, Load templates, Control file, Cut-over tasks"
  - role: iorta TechNXT project team
    order: "All documents; keeps the comments log, the meeting minutes and the version history of the workbook, answers every comment and keeps the traceability to the trial migrations, SIT and UAT"

# Steps from issue to closure. raci: R responsible, A accountable, C consulted, I informed.
steps:
  - step: 1
    name: Set issued
    who: "R: iorta TechNXT Project Manager; A: iorta TechNXT delivery lead; I: all reviewers"
    inputs: "Handbook, Migration Workbook, test plan, guide and deck"
    outputs: "Release set v2.0 in the BRD-13 folder of Drop 0; invitations to the sessions"
    duration: "Day 0 (Mon 5-Oct-2026)"
  - step: 2
    name: Kick-off and walkthrough of the Migration Console on SIT
    who: "R: iorta TechNXT Business Analysis; A: Program Manager; C: data owners, Comptrollership, BDOI IT, Renewal processing team"
    inputs: "Guide deck; SIT users with seed data; one object from extract to acceptance"
    outputs: "Console shown live; first questions logged in the comments log; minutes"
    duration: "3 sessions, 7 to 9-Oct-2026"
  - step: 3
    name: Review with the workbook; decisions on the proposed rules
    who: "R: data owners and their stewards, Comptrollership, BDOI IT; A: Program Manager; C: iorta TechNXT (questions)"
    inputs: "Handbook parts of each role; workbook sheets with the BU review columns; the proposed rules"
    outputs: "Every row marked Accept, Change requested or Comment; decisions on the rules needed by 16-Oct-2026 (M1); comments log entries"
    duration: "Until Wed 21-Oct-2026 (M1 rules by Fri 16-Oct-2026)"
  - step: 4
    name: Comments consolidated and a Q&A session
    who: "R: iorta TechNXT Project Manager and Business Analysis; A: Program Manager; C: reviewers"
    inputs: "Returned workbooks"
    outputs: "One consolidated comments log, each item typed (clarification, correction, change request) and answered; Q&A minutes"
    duration: "3 working days, Q&A on Mon 26-Oct-2026"
  - step: 5
    name: One revision cycle (v2.1)
    who: "R: iorta TechNXT Business Analysis; A: iorta TechNXT delivery lead; C: reviewers who raised the items"
    inputs: "Agreed clarifications and corrections; decisions on the proposed rules"
    outputs: "Release set v2.1 with the changed rows marked and the decided rules applied; change requests raised for the rest"
    duration: "v2.1 on Wed 28-Oct-2026; check by the reviewers until Thu 29-Oct-2026"
  - step: 6
    name: Sign-off meeting and signature
    who: "R: iorta TechNXT Project Manager; A: Product Owner, Marketing Business System; C: Program Manager, data owners, Comptrollership, BDOI IT"
    inputs: "v2.1 (or v2.0 when no revision is needed); open decisions with their date"
    outputs: "Signed sign-off certificate; minutes; objects decided (G1) and layouts frozen, version 1 (M2)"
    duration: "Fri 30-Oct-2026 (M2)"
  - step: 7
    name: Handover to the migration runs
    who: "R: iorta TechNXT delivery lead; A: Program Manager; I: BDOI IT, other BRD owners"
    inputs: "Signed set; decided objects; frozen layouts; named owners and stewards"
    outputs: "Decisions and owners entered in the Migration Console; first full extracts in the templates by 29-Jan-2027 (M3)"
    duration: "From Mon 2-Nov-2026"
  - step: 8
    name: Traceability into the trial migrations, SIT and UAT
    who: "R: iorta TechNXT test lead; A: Program Manager; C: data owners"
    inputs: "Signed handbook, workbook and test plan"
    outputs: "Trial migrations 1 to 4 and the dress rehearsal run and signed against the set; results against each row"
    duration: "Trial migrations Apr - Oct 2027; dress rehearsal Nov 2027; cut-over Jan 2028"

