# Key business rules (highlights; the full list is in the workbook and Handbook Part B).
rules:
  - "Every object has one decision (migrate, carry forward, conditional, archive, excluded) approved by its business owner (G1)."
  - "Only approved code map versions are used; a batch with an unmapped code in a mandatory column is not loaded."
  - "Master data loads with at most 0.5 percent of rows failing or waived; open items and the trial balance with none."
  - "Records are created through the BIBS services, never written directly; migrated records carry the origin Migrated and raise no notification."
  - "Every object is reconciled at up to five levels; a break is explained and approved before the reconciliation is signed (G5)."
  - "The maker never approves: decisions, code maps, loads, rollbacks, adjustments, resubmissions and legacy batches."
  - "Migration Clearing is 0.00 per branch and currency at go-live; the go-live decision is taken on twelve measured criteria."
  - "A legacy invoice keeps its number, is processed with the BIBS screens and posts to the legacy accounts until it is settled."

# The migration slides of the deck (after the module at a glance). kind: content | table | columns | image.
module_slides:
  - kind: content
    title: "The migration approach"
    items:
      - "Selective, not a conversion: each legacy object gets one decision"
      - [1, "Master and reference data are migrated; open items are carried forward; history stays in read-only legacy or the BIBS archive"]
      - "Load through the BIBS services, so every BIBS rule, audit entry and accounting entry applies"
      - "Reconcile everything and keep the evidence: counts, amounts, hash totals, fields, GL"
      - "Rehearse before production: four trial migrations and a dress rehearsal on masked data"
      - "One processing system per item from the freeze; no parallel run"
      - "Go-live Monday 3 January 2028 at the year-end boundary (option A, for Comptrollership to confirm)"
    notes: "The approach follows the BRD: a stable Day-1 with clean master data and the open positions carried forward. History is not converted into BIBS transactions."
  - kind: table
    title: "The data objects and their decisions"
    plugin: build_dm_pack.py
    source: objects
    notes: "The decisions are proposals that each business owner confirms at gate G1 in the Migration Console. Conditional objects wait for BDOI's decision (proposed rule PR-DM-05)."
  - kind: table
    title: "Roles and the named data owners"
    headers: ["Role", "Who", "Does"]
    widths: [3.0, 4.0, 5.6]
    rows:
      - ["Approver of the set", "Product Owner, Marketing Business System", "Owns the set and approves all of its contents, with the approvers of the BRD-13 approval pages"]
      - ["Author of the BRD; cut-over", "Program Manager, Business Project Services", "Reviews the traceability and the completeness; accountable for the cut-over; chairs the go / no-go board"]
      - ["Data Migration Lead", "BDOI (to name)", "Object register and decisions, load approvals (G4), acceptance with the owners (G6), cut-over plan"]
      - ["Data owners", "Department heads per object (workbook sheet Data owners)", "Decide the class (G1), approve the code maps (G2), waivers, accept the object (G6)"]
      - ["Data stewards", "Named staff per object", "Profiling review, cleansing at source, code maps, client match review"]
      - ["Reconciliation approver", "Head, Comptrollership (financial objects)", "Signs the reconciliation (G5); approves breaks, rollbacks and the opening-balance adjustments"]
      - ["BDOI IT", "Legacy system owners", "Extracts and control files, transfer, freeze and read-only mode, decommissioning"]
      - ["iorta TechNXT", "Project Manager, Migration Lead, Migration Operator", "Loads, reconciliation runs, profiling, the console, the rehearsals"]
    notes: "BDOI names the owners and stewards by 30 October 2026 (M2). The workbook sheet Data owners has the columns for the names."
  - kind: table
    title: "Trial migrations and the dress rehearsal"
    headers: ["Run", "When and where", "What it proves"]
    widths: [2.6, 3.4, 6.6]
    rows:
      - ["Trial migration 1", "19-30 Apr 2027, SIT", "Reference data and clients first, then policy headers and the RA-sent file; timings; profiling report to the owners"]
      - ["Trial migration 2", "5-16 Jul 2027, SIT", "All objects end to end; L1-L5 reconciled; Migration Clearing 0.00"]
      - ["Trial migration 3", "2-13 Aug 2027, UAT", "Business verification on screen; the Drop 1 UAT runs on migrated data"]
      - ["Trial migration 4", "4-15 Oct 2027, UAT", "Timed as a cut-over; go-live renewal extraction; a test opening-balance adjustment"]
      - ["Dress rehearsal", "15-26 Nov 2027, production-sized", "Full volume within the window with 20 percent margin; rollback rehearsed"]
    notes: "Each run uses fresh masked extracts, so every fix is proven with new data. The production cut-over repeats the rehearsed plan."
  - kind: table
    title: "The sign-off gates of every object"
    headers: ["Gate", "What is signed", "By"]
    widths: [2.4, 6.6, 3.6]
    rows:
      - ["G1 Decision", "The class of the object with the four criteria", "Business owner"]
      - ["G2 Mapping", "Layouts frozen; the code maps used approved", "Business owner"]
      - ["G3 Validation", "Error rate within the limit; waivers approved; no pair to review", "Data Steward (waivers by the owner)"]
      - ["G4 Load approval", "The batch may be loaded", "Data Migration Lead; Head of Comptrollership for an adjustment"]
      - ["G5 Reconciliation", "L1-L5 matched or explained", "Reconciliation approver"]
      - ["G6 Acceptance", "Samples verified on the BIBS screens", "Business owner and Data Migration Lead"]
      - ["G7 Go-live", "Day-1 objects accepted; the twelve criteria met", "Go / no-go board"]
    notes: "The maker of a batch cannot sign its reconciliation or acceptance, and one person cannot sign two gates of one batch."
  - kind: columns
    title: "Cut-over and go / no-go"
    blocks:
      - ["Before the freeze", ["Pre-load of reference data and clients from 20 Dec 2027", "Daily client deltas", "Code map freeze 27 Dec", "December soft close by 20 Dec"]]
      - ["Cut-over weekend", ["Legacy freeze Fri 31 Dec 22:00", "Final extracts and loads Sat 1 Jan", "Reconciliation, samples, smoke test Sun 2 Jan", "Go / no-go Sun 2 Jan 18:00"]]
      - ["Go-live", ["Renewal extraction Mon 3 Jan 04:00", "BIBS open 08:00", "Point of no return 18:00", "Hypercare to the January close"]]
    notes: "Until the go / no-go decision the rollback restores the snapshot taken before the production load and legacy reopens. After the point of no return issues are fixed forward in BIBS."
  - kind: content
    title: "How migrated and new data are told apart"
    items:
      - "LEGACY badge next to the number on the lists and records, with the source system, legacy reference and batch in its tooltip"
      - "Origin filter on the lists that hold migrated records: All origins, BIBS, Migrated"
      - "Legacy numbers stay searchable: clients, policies and invoices are found by their legacy numbers"
      - "Invoice 360 of a legacy invoice shows the values at cut-over, never changed after the load"
      - "Legacy invoices and unapplied payments post to the legacy accounts until they are settled"
      - "Migrated records raise no notification to clients or insurers"
    notes: "Users work migrated and new records on the same screens. The report Changes to Legacy Invoices shows every change made in BIBS to a legacy invoice."

# Caveats and possibilities, and how each is handled.
caveats:
  - topic: Additional requirements
    text: "New needs can surface during the review, the trial migrations or UAT."
    handling: "In-scope clarification when the signed text already covers it; otherwise a change request with mandays."
    example: "A data owner asks for an extra column in the client template: a new layout version, so a change request; asking which rule rejects a row is a clarification."
  - topic: Decisions still open
    text: "The year-end option, the codes of the legacy accounts, the conditional objects and the approvers of the legacy batches wait for BDOI."
    handling: "Each is a proposed rule with its decision date; the proposal stands until BDOI decides, and most answers are configuration."
    example: "If Comptrollership chooses option B, go-live moves to April 2028 and the opening loads the year-to-date P&L: a change request with its mandays."
  - topic: Legacy data quality
    text: "Profiling of the first full extracts may show fewer components, shares or references than expected."
    handling: "Cleansing at source by the stewards; code maps; waivers within the thresholds; open-balance mode for invoices without their original amounts."
    example: "Legacy cannot give paid and remitted per component: invoices load with their open balance and the Legacy Invoice card says so."
  - topic: Other BRDs change the migrated objects
    text: "Operations, Collections, Accounting, Renewal and Product Maintenance own the records the migration creates."
    handling: "The change is raised against the other BRD and assessed against the cross-BRD contract of this set; a delta sign-off of the affected layouts."
    example: "Renewal adds a mandatory field to the policy header: the P01 layout gets a new version, signed as a delta."
  - topic: Items that depend on BDOI IT
    text: "The secure file drop, the legacy document folder and the read-only links wait for BDOI IT."
    handling: "Until named, files are uploaded on the Extracts screen and documents are loaded with their index; nothing else changes."
    example: "When BDOI IT names the secure file drop, extracts arrive there instead of the upload; the checks and templates stay the same."

# Entry and exit criteria of the sign-off, and the definition of done.
entry:
  - "The set is issued with the screenshots of the Migration Console taken on the SIT environment with seed data."
  - "Reviewers have their SIT users and the walkthrough sessions are held."
  - "The test plan is traced to the handbook and to the screens."
exit:
  - "Every row of the workbook reviewed by its unit (Accept, Change requested or Comment)."
  - "Every proposed rule decided, or accepted as the working assumption with its decision date."
  - "Every comments log item closed: answered, corrected in v2.1, or raised as a change request."
  - "The sign-off certificate signed as on the BRD-13 approval pages: prepared by iorta TechNXT and the Program Manager, input from the Data Migration Lead and the data owners, reviewed by MBS and BDOI IT, approved by the Product Owner and the approvers."
done:
  - "Signed certificate filed with the set; version history updated."
  - "Objects decided (G1) and layouts frozen, version 1, in the Migration Console (M2)."
  - "Owners and stewards named per object; deltas listed in the Change Management Register with mandays."
  - "Test plan agreed for the trial migrations, SIT and UAT."

# Handover to the migration runs.
handover:
  - "Signed handbook, Migration Workbook and screens"
  - "Decisions of the objects entered in the Migration Console (G1)"
  - "Layouts frozen, version 1; templates issued to BDOI IT"
  - "Owners and stewards named per object"
  - "Proposed rules decided or accepted as assumptions"
  - "Agreed test plan and trial migration calendar"
handover_note: "Handover means the objects are decided, the layouts are frozen and the first full extracts are prepared for 29 January 2027."

