# Elements shared by many screens, described once.
common:
  - name: Page header and section
    text: >-
      Every page shows its section (Data Migration, Legacy Inquiry, Cashiering or Commission) and title, a one-line
      description and its actions on the right. The migration screens are the Migration Console: one catalogue of
      objects, layouts, code maps and rules for the programme, and the extracts, batches, reconciliations and plans of
      the company chosen in the header.
  - name: Work lists and record panels
    text: >-
      Lists show a filter row where the list has filters and a paged table ("Showing 1 to n of N results"). A row
      opens its record in a panel under the list (object, code map, layout, reconciliation, cut-over plan, legacy
      record) or on a page of its own (batch, legacy batch). Dates show as dd-MMM-yyyy and times as dd-MMM-yyyy HH:mm
      in Philippine time; amounts with two decimals and thousand separators.
  - name: Status pills and the batch steps
    text: >-
      Statuses are pills of one colour per state group (Proposed, For decision, Decided; Planned, Validated, Loaded,
      Loaded with rejects, Reconciled, Accepted, Rolled back; Matched, Break, Explained). A batch shows its steps as a
      stepper: Planned, Validated, Load approved, Loaded, Reconciled, Accepted, with the steps done marked.
  - name: Confirmation and reason
    text: >-
      Every submit, approve, return, sign, load, rollback, post and decide action opens a confirmation dialog that
      names the record and the effect of the action. A return, a rejection, a rollback request, a NO-GO and a
      blocked task need a reason; an approval takes an optional comment. The reason is kept with the record and in
      the audit trail.
  - name: Maker-checker and gates
    text: >-
      The user who prepares a decision, code map version, load, rollback, opening-balance adjustment, resubmission or
      legacy batch never approves it: the approve button is not offered to that user and the system refuses it. The
      operator who ran a batch cannot sign its reconciliation or acceptance, and one person cannot sign two gates of
      the same batch. Gates G1 to G7 are signed in order.
  - name: Downloads
    text: >-
      Templates, workbooks, rejection files, evidence and reports download as Excel or CSV files. Extract files and
      staged rows are kept only until the staging purge (5 days after the batch is accepted or rolled back); counts,
      totals and sign-offs stay.
  - name: Migrated records in the business screens
    text: >-
      A record migrated from a legacy system shows a LEGACY badge next to its number on its list and record, with
      the source system, legacy reference and migration batch in the tooltip. Lists that hold migrated records have
      an Origin filter (All origins, BIBS, Migrated). Migrated records raise no notification to clients or insurers.
  - name: Messages
    text: >-
      Field errors appear under the field in red; a banner at the top of a dialog or card lists the refusal of a
      business rule with its message and a reference for support. Success is confirmed by a short message at the
      bottom right of the page. Intake, validation and load results are also written to the run log of the batch.
  - name: Notifications and alerts
    text: >-
      The migration raises alerts to the Data Migration Lead and the owners concerned: extract rejected, load
      failed, unmapped codes, reconciliation break, Migration Clearing not zero, staging purge overdue, unusual
      access to the legacy archive, and a break of an opening-balance adjustment. The bell in the header opens them.
