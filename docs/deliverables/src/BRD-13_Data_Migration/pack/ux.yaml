  scr-dm-02-02-object: pending-approval
  scr-dm-03-02-set: default
  scr-dm-03-03-entry: filled
  scr-dm-04-02-columns: default
  scr-dm-05-02-rejected: validation-error
  scr-dm-06-02-plan: filled
  scr-dm-06-03-resubmissions: pending-approval
  scr-dm-07-01-validated: default
  scr-dm-07-03-waive: confirmation
  scr-dm-07-04-signoffs: read-only
  scr-dm-07-05-log: read-only
  scr-dm-08-01-queue: pending-approval
  scr-dm-09-02-explain: confirmation
  scr-dm-10-01-matrix: read-only
  scr-dm-11-02-prepare: filled
  scr-dm-12-02-criteria: pending-approval
  scr-dm-12-03-new: default
  scr-dm-14-01-reason: default
  scr-dm-14-03-record: read-only
  scr-dm-15-01-log: read-only
  scr-dm-17-01-legacy: read-only
  scr-dm-18-03-approve: pending-approval

# Images taken for the deck only: states the screen specifications do not show.
states:
  - {screen: SCR-DM-14, state: no-results, user: legacyaudit, ux: empty, nocallouts: true, caption: "A search that finds no legacy record"}

# Points for the UX Design team to confirm with BDOI.
confirm:
  clarifications: [PR-DM-04, PR-DM-06, PR-DM-09, PR-DM-10]
  findings: []
