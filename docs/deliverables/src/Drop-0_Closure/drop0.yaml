# Where each generated list goes: the parameters named in a BRD template column (or all the parameters of a group)
# and the lists named in a BRD template are prepared there; every other one on the sheet of this workbook.
list_templates:
  parameters:
    - {template: UA-05, keys_from_column: 1}            # BRD-11 CI-05: the parameters listed in its first column
    - {template: PM-09, groups: [PRODUCT_MAINTENANCE]}  # BRD-03 CI-09: the Product Maintenance parameters
  lovs:
    - {template: UA-06, codes: [UAM_BUSINESS_UNIT, UAM_USER_LEVEL, UAM_DEACTIVATION_REASON]}
    - {template: PM-09, codes: [PKG_REQUEST_REASON, PKG_RESPONSE_OUTCOME, PKG_ADVISORY_GROUP, PKG_NOT_PROCEEDED_REASON,
                                PKG_REQUEST_TYPE, INCENTIVE_TYPE, COVERAGE_KIND, CLAUSE_KIND, DOCUMENT_TYPE]}
  documents:
