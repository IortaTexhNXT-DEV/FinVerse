  PM: {name: Product Maintenance, brd: BRD-03, drop: "Drop 0", owner: "Product Owner, Marketing Business System (MBS)"}
  CLX: {name: Collections, brd: BRD-04, drop: "Drop 1", owner: "VP and Head, BDOI Operations (Collections)"}
  ACC: {name: "Accounting, Disbursement and ACSL", brd: BRD-05, drop: "Drop 1", owner: "Head, Comptrollership"}
  RNW: {name: Renewal, brd: BRD-06, drop: "Drop 1", owner: "Product Owner, Renewal"}
  CLM: {name: Claims, brd: BRD-07, drop: "Drop 2", owner: "Product Owner, Claims"}
  EB: {name: Employee Benefits, brd: BRD-08, drop: "Drop 2", owner: "Product Owner, Employee Benefits"}
  CSF: {name: Customer Servicing Facility, brd: BRD-09, drop: "Drop 1", owner: "Product Owner, Customer Servicing Facility"}
