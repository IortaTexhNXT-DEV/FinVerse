# --------------------------------------------------------------------------------------------------------------
# Register items. One row per configuration item. area: the heading of the register. route: screen, template or
# migration; screen: the menu route of the screen where it is entered or uploaded; template: the template sheet
# (PM-nn of BRD-03, UA-nn of BRD-11, D0-nn of this workbook, or a generated list sheet LIST-...); object: the
# migration object. tables: the platform tables the item fills (checked against the seed data; not printed).
areas:
  - Organisation
  - Chart of accounts and accounting
  - Banks and bank accounts
  - Document numbering
  - Lists of values
  - System and security parameters
  - Notifications and documents
  - Products and packages
  - Insurers and partners
  - Users, roles and approvals
  - Module rules and set-up
  - Data migration reference data

