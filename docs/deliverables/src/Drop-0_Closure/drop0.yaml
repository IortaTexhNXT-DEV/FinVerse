# Drop 0 (Setup and Data Migration) closure: the source of
#   01_BIBS_Drop-0_Configuration_Inputs_v2.0.xlsx  (every configuration input BDOI provides before go-live) and
#   the tables of 02_BIBS_Drop-0_Closure_Summary_v2.0.docx (CLOSURE_SUMMARY_DROP0.md, ```pack blocks).
# Built by tools/deliverables/drop_closure.py:
#   python tools/deliverables/drop_closure.py            # workbook and summary
#   python tools/deliverables/drop_closure.py --check    # checks only
#
# What is typed here and what is read:
#   * typed: the register items (one per configuration item, with its owner, due date and one route), the Drop 0
#     templates D0-nn, the owner of each module, the due milestones, the decisions and the risks of the summary;
#   * read from the BRD-03 and BRD-11 packs: their configuration input templates (pack/config_inputs.yaml), the same
#     source as their 06 workbooks;
#   * read from the BRD-13 pack: the migration objects, milestones, proposals and open decisions (pack/catalogue.yaml);
#   * read from the platform: every system parameter, list of values, notification event and document template the
#     platform delivers, the chart of accounts upload template, the screens of the menu and the master tables that the
#     SIT seed data fills. The check refuses a seeded master table that no item claims or that two items claim, a
#     parameter, list, event or document template without exactly one route, a screen that is not in the menu, a
#     migration object that is not in the catalogue and a template field that is not a column of its table.
# Routes: screen (BDOI keys it on the named screen; its row of the Start here index records the decision), template (BDOI fills the
# template sheet; the rows are then entered on the named screen or uploaded), migration (loaded from the legacy
# extracts by the data migration object; prepared in the Migration Workbook, not in this workbook).

meta:
  title: Drop 0 Configuration Inputs
  doc_type: Configuration inputs workbook
  version: "2.0"
  date: 5 October 2026
  go_live: 2028-01-03
  go_live_text: "Go-live is proposed for Monday 3 January 2028 (T), at the year-end boundary (option A of the Data Migration set, for Comptrollership to confirm)."
  statuses: [Not started, In progress, Ready for review, Confirmed, Not applicable]

# Due milestones, in date order. weeks before go-live are computed from the date.
due:
  - {code: D1, label: "Drafts with the Drop 0 sign-off", date: 2026-12-01, note: "Sign-off of BRD-11 on 1-Dec-2026, the last of the three Drop 0 sets"}
  - {code: D2, label: "Platform set-up for Drop 1 SIT", date: 2027-01-04, note: "Drop 1 SIT runs Jan - Jul 2027 on the BDOI organisation, chart of accounts and banks"}
  - {code: D3, label: "Reference data for Trial migration 1 (M4)", date: 2027-04-09, note: "Extracts for Trial migration 1; reference data and clients first"}
  - {code: D4, label: "Code maps approved (M5)", date: 2027-06-18, note: "Code maps approved for Trial migration 2, including the package code map"}
  - {code: D5, label: "Values for UAT", date: 2027-07-16, note: "UAT plans and sign-off forms due 16-Jul-2027; UAT Aug - Dec 2027 runs on the production values"}
  - {code: D6, label: "Production values before the dress rehearsal", date: 2027-11-01, note: "Dress rehearsal in November 2027; the values loaded for it are the go-live values"}
  - {code: D7, label: "Map freeze (T-7)", date: 2027-12-27, note: "No change of a code map or reference value after the freeze except by change request"}

