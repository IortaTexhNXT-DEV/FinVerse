entry_exit:
  close_entry:
    - "The three sign-off sets v2.0 of Drop 0 are issued: BRD-03 Product Maintenance, BRD-11 User Access Maintenance and BRD-13 Data Migration, each with its test plan."
    - "The configuration inputs workbook of Drop 0 is issued and each owner has received the sheets of the items it owns."
    - "The walkthrough sessions of each set are held on the SIT environment with seed data."
  close_exit:
    - "The sign-off certificate of each of the three sets is signed (BRD-13 by 30-Oct-2026, BRD-03 by 30-Nov-2026, BRD-11 by 1-Dec-2026)."
    - "Every proposed rule and clarification of the three sets is decided, or accepted as the working assumption with its decision date."
    - "Every consolidated decision of this summary has an owner and a date; those due at M1 and M2 are taken."
    - "Every configuration item of the workbook has an owner, a due date and one route; the items due at D1 are Provided or In progress."
    - "The comments logs of the three sets are closed: answered, corrected in v2.1, or raised as change requests."
  drop1_entry:
    - "Drop 0 is closed: the three sets are signed and the decisions of this summary are recorded."
    - "The BRD-1 New Business sign-off set v2.0 is issued (folder Drop-1_Transactional); its review and sign-off follow the same steps."
    - "The platform set-up that Drop 1 SIT uses is provided by D2 (4-Jan-2027): company, branches, holidays, dimensions, chart of accounts and numbering, accounting rules, bank accounts."
    - "The users and group profiles of the SIT and UAT reviewers are created through access requests."
    - "The lists of values and parameters of New Business are confirmed on the sheets Lists of values and System parameters."

risks:
  - {id: RSK-01, risk: "Configuration inputs arrive after their due date, so Drop 1 SIT or a trial migration runs on seed values", impact: "SIT results do not hold for production; trial migrations are repeated", mitigation: "Owner per item and due date in the workbook; status reviewed at the weekly programme meeting from December 2026", owner: "Program Manager"}
  - {id: RSK-02, risk: "The production chart of accounts and the accounting rules are not final before Drop 1 SIT", impact: "Postings of Drop 1 are tested against a draft chart; the GL opening (G01) and Migration Clearing cannot be reconciled", mitigation: "Chart and rules due at D2; legacy accounts (D0-09) and the GL map (R08) due at D3 and D4", owner: "Head, Comptrollership"}
  - {id: RSK-03, risk: "Year-end option A is not confirmed by M6", impact: "The cut-over calendar, the GL opening and the true-ups change", mitigation: "Confirmation asked with the Drop 0 closure (DEC-01)", owner: "Head, Comptrollership"}
  - {id: RSK-04, risk: "EIAM and UIDM-ISC specifications are late", impact: "Sign-in stays local for SIT; the directory sign-in is tested late", mitigation: "Local sign-in with the Windows ID captured on every user; directory mode switched on when specified (DEC-05)", owner: "BDOI IT"}
  - {id: RSK-05, risk: "Conditional migration objects are decided late", impact: "Layouts, trial migrations and reconciliation of those objects are added late", mitigation: "Decisions at M1 and M2 (DEC-03); objects not decided are completed in legacy before the freeze", owner: "Program Manager"}
  - {id: RSK-06, risk: "An item reaches BIBS by two routes (keyed on a screen and loaded by the migration)", impact: "Duplicate or conflicting reference values at go-live", mitigation: "One route per item in the workbook; the Migration cross-reference sheet names the object of every migrated item", owner: "Data Migration Lead"}
  - {id: RSK-07, risk: "Changes to signed Drop 0 content during Drop 1 reviews", impact: "Rework of screens and templates of a signed set", mitigation: "Change control: every change is a change request with its effect on the other BRDs and a delta sign-off", owner: "Program Manager"}

