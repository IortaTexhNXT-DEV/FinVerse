# --------------------------------------------------------------------------------------------------------------
# Drop 0 templates. Columns: header | mandatory (Y, N or the condition) | format | what to enter | example, as in
# the BRD templates. table / fields: the platform table and the column of each template column, for the check
# (blank field = a column that is not a table column, such as a reference or a decision). upload: the template
# columns are read from the upload of the named screen instead of being typed. checks and depends: the drop-down or
# check of a column and the templates whose codes it uses, as in the BRD templates (BRD-03 pack/config_inputs.yaml);
# a code of a BRD template is named by its ID in this workbook (UA-02). The Start here index lists the register items
# by due date and, within a due date, in the order the templates are filled in (dependencies first).
lists:
  DIMENSION: {name: Dimension, values: [[COST_CENTER, Cost centre], [BUSINESS_LINE, Business line]]}
  ACCOUNT_CLASS: {name: Account class, values: [[ASSET, Asset], [LIABILITY, Liability], [EQUITY, Equity], [INCOME, Income], [EXPENSE, Expense]]}
  ACCOUNT_CLASS_CHART: {name: Account class of the chart, values: [[ASSET, Asset], [LIABILITY, Liability], [EQUITY, Equity], [INCOME, Income], [EXPENSE, Expense], [MEMORANDUM, Memorandum]]}
  ACCOUNT_LEVEL: {name: Account level, values: [[GROUP, Group], [MAIN, Main account], [SUB, Sub-account], [MICRO, Micro account]]}
  NEGATIVE_BALANCE: {name: Negative balance, values: [[ALLOW, Allowed], [WARN, Allowed with a warning], [BLOCK, Refused]]}
  CATEGORY_ROW: {name: Category or numbering row, values: [[CATEGORY, GL category], [NUMBERING, Numbering scheme under a parent account]]}
  ACCOUNTING_EVENT: {name: Accounting event, accounting_events: true}
  DEBIT_CREDIT: {name: Debit or credit, values: [[DEBIT, Debit], [CREDIT, Credit]]}
  LEGACY_ACCOUNT: {name: Legacy control account, values: [[Premium Receivable - Legacy, Per component], [PR 2307 - Legacy, ""], [Due to Insurers - Legacy, ""], [Commission Receivable - Legacy, ""], [Unrealised Commission - Legacy, ""], [Deferred Output VAT - Legacy, ""], [Unapplied Collections - Legacy, ""], [Migration Clearing, Nets to zero after the opening]]}
  TAX_TYPE: {name: Tax type, values: [[EWT, Expanded withholding tax], [FWT, Final withholding tax], [VAT, Value-added tax], [PT, Percentage tax]]}
  PAYEE_CLASS: {name: Payee class, lov: PAYEE_CLASS}
  APPROVAL_MODULE: {name: Module of an approval matrix, values: [[Submitted Policies, ""], [Employee Benefits, ""], [Sanction Screening, ""], [Disbursement, ""]]}
templates:
  - id: D0-01
    name: Company
    content: The company record of BDOI
    owner: "Head, Comptrollership"
    source: BDOI registration documents and the current chart of accounts
    load: "Companies (Setup & Administration), entered by the System Administrator and authorised by Comptrollership"
    table: org_company
    fields: [code, name, tax_id, address, base_currency, fiscal_year_start_month, back_value_days, forward_value_days, retained_earnings_account]
    checks:
      Company code: text:10
      Registered name: text:200
      Base currency: text:3
      Fiscal year start month: whole:1-12
      Back-value days: whole:0-365
      Forward-value days: whole:0-365
      Retained earnings account: code:D0-06/Account Code
    columns:
      - "Company code | Y | Up to 10 capitals | Code of the company on every record | BDOI"
      - "Registered name | Y | Up to 200 characters | Name as registered with the SEC | BDO Insurance and Reinsurance Brokers, Inc."
      - "TIN | Y | 000-000-000-00000 | Tax identification number with branch code | 000-000-000-00000"
      - "Registered address | Y | Text | Address printed on receipts and BIR forms | 7899 Makati Avenue, Makati City"
      - "Base currency | Y | ISO 4217 | Currency of the books | PHP"
      - "Fiscal year start month | Y | 1 to 12 | First month of the financial year | 1"
      - "Back-value days | Y | Whole number | How many days before today a posting may be dated | 5"
      - "Forward-value days | Y | Whole number | How many days after today a posting may be dated | 0"
      - "Retained earnings account | Y | Account code of D0-06 | Account that receives the year-end result | 3200"
  - id: D0-02
    name: Branches
    content: Every BDOI branch and invoicing branch
    owner: "Head, Comptrollership"
    source: BDOI branch list; EBIX branch codes for the code map BRANCH
    load: "Branches (Setup & Administration), before the first migration mock; the legacy branches are mapped to them by the code map BRANCH (object R02)"
    table: org_branch
    fields: [code, name, region, address, opening_date, head_office, forex_authorized, contact_phone, contact_email, manager_name, weekly_holidays, ""]
    checks:
      Branch code: text:10
      Branch name: text:120
      Opening date: date
      Head office: yn
      Foreign currency authorised: yn
    columns:
      - "Branch code | Y | Up to 10 capitals | Code of the branch; unique | HO"
      - "Branch name | Y | Up to 120 characters | Name shown on screens and documents | Head Office"
      - "Region | N | Text | Region of the branch | NCR"
      - "Address | N | Text | Address printed on documents | 7899 Makati Avenue, Makati City"
      - "Opening date | Y | dd-MMM-yyyy | Date the branch opened | 01-Jan-2010"
      - "Head office | Y | Y or N | Y for one branch only | Y"
      - "Foreign currency authorised | Y | Y or N | May receive and pay in foreign currency | Y"
      - "Contact phone | N | Text | Branch telephone | (02) 8888-0000"
      - "Contact e-mail | N | E-mail address | Branch mailbox | ho@bdoi.example.ph"
      - "Branch manager | N | Name | Head of the branch | -"
      - "Weekly rest days | N | SAT, SUN | Days the branch is closed each week | SAT,SUN"
      - "Legacy branch codes | N | EBIX codes separated by commas | For the code map BRANCH (R02) | 001"
  - id: D0-03
    name: Holiday calendar
    content: Public and company holidays of 2027 and 2028
    owner: "Head, Comptrollership; Human Resources"
    source: Proclamations of the national holidays; BDOI company holidays
    load: "Holiday Calendar (Setup & Administration); 2028 before the dress rehearsal, later years each December"
    table: org_holiday
    fields: ["", holiday_date, description]
    checks:
      Branch code: code:D0-02/Branch code
      Date: date
      Description: text:120
    columns:
      - "Branch code | N | Code of D0-02; blank = every branch | Branch the holiday applies to | -"
      - "Date | Y | dd-MMM-yyyy | Date of the holiday | 01-Jan-2028"
      - "Description | Y | Up to 120 characters | Name of the holiday | New Year's Day"
  - id: D0-04
    name: Cost centres and business lines
    sheet: Dimensions
    content: The values of the dimensions of journal lines
    owner: "Head, Comptrollership"
    source: Current cost centre list of Comptrollership; the product lines for the business lines
    load: "Dimensions (Setup & Administration); the legacy cost centres are mapped by the code map COST_CENTER"
    table: dim_value
    fields: [dimension_type, code, name, active]
    checks:
      Dimension: list:DIMENSION
      Code: text:20
      Name: text:120
      Active: yn
    columns:
      - "Dimension | Y | COST_CENTER or BUSINESS_LINE | Dimension of the value | COST_CENTER"
      - "Code | Y | Up to 20 capitals or digits | Code of the value | FIN"
      - "Name | Y | Up to 120 characters | Name shown on screens and reports | Finance and Accounting"
      - "Active | Y | Y or N | N keeps the value for history only | Y"
  - id: D0-05
    name: Employees
    content: Employees used by the cost-centre rules, petty cash and staff advances
    owner: "Human Resources; Head, Comptrollership"
    source: HR employee list
    load: "Employees (Setup & Administration)"
    table: org_employee
    fields: [employee_no, full_name, "", cost_center, position, email, hired_on]
    checks:
      Full name: text:120
      Branch code: code:D0-02/Branch code
      Cost centre: code:D0-04/Code
      Hired on: date
    columns:
      - "Employee number | Y | HR number | Unique | 1203344"
      - "Full name | Y | Up to 120 characters | Name of the employee | Andrea Mercado"
      - "Branch code | Y | Code of D0-02 | Home branch | HO"
      - "Cost centre | Y | Cost centre of D0-04 | Cost centre of the employee | FIN"
      - "Position | N | Text | Position title | Accounting Officer"
      - "E-mail | N | Company e-mail | For advices and statements | andrea.mercado@bdoi.example.ph"
      - "Hired on | N | dd-MMM-yyyy | Date of hire | 03-Mar-2019"
  - id: D0-06
    name: Chart of accounts
    content: The production chart of accounts, in the columns of the chart upload
    owner: "Head, Comptrollership"
    source: The BDOI chart of accounts in use, completed with the legacy control accounts (D0-09)
    load: "Chart Upload (General Ledger): the file is checked row by row and every account is created pending authorisation by Comptrollership"
    checks:
      Parent Code: code:D0-06/Account Code
      Class: list:ACCOUNT_CLASS_CHART
      Level: list:ACCOUNT_LEVEL
      Category: code:D0-07/Category code
      Control Account: yn
      Manual Posting: yn
      Cost Centre Required: yn
      Revaluation Required: yn
      Negative Balance: list:NEGATIVE_BALANCE
    upload: CoaUploadHandler
  - id: D0-07
    name: Account categories and numbering
    sheet: Categories and numbering
    content: The GL categories and the numbering scheme under each parent account
    owner: "Head, Comptrollership"
    source: The BDOI chart of accounts
    load: "Chart of Accounts (General Ledger)"
    table: coa_category
    fields: ["", code, name, account_class, bank_category, "", "", ""]
    checks:
      Row: list:CATEGORY_ROW
      Category code: text:20
      Account class: list:ACCOUNT_CLASS
      Bank category: yn
      Width: whole:1-6
    columns:
      - "Row | Y | CATEGORY or NUMBERING | What the row defines | CATEGORY"
      - "Category code | Cond.: CATEGORY | Up to 20 capitals | GL category | CASH_IN_BANK"
      - "Category name | Cond.: CATEGORY | Text | Name of the category | Cash in bank"
      - "Account class | Cond.: CATEGORY | ASSET, LIABILITY, EQUITY, INCOME, EXPENSE | Class of the accounts of the category | ASSET"
      - "Bank category | Cond.: CATEGORY | Y or N | Y for the accounts of bank accounts (D0-11) | Y"
      - "Parent account | Cond.: NUMBERING | Account code of D0-06 | Parent whose children are numbered | 1110"
      - "Separator | Cond.: NUMBERING | . or - or none | Between the parent code and the running number | ."
      - "Width | Cond.: NUMBERING | 1 to 6 | Digits of the running number | 2"
  - id: D0-08
    name: Accounting rules
    content: The debit and credit accounts of each accounting event of the platform
    owner: "Head, Comptrollership"
    source: The posting rules of EBIX and ISYS; the accounting events listed on the sheet Ref Accounting events
    load: "Accounting Rules (Accounting Engine), checked with the Rule Simulator and authorised by Comptrollership"
    table: acc_rule_line
    fields: ["", "", "", "", "", line_no, side, account_code, amount_component, narration]
    checks:
      Event type: list:ACCOUNTING_EVENT
      Business line: code:D0-04/Code
      Effective from: date
      Line: whole:1-99
      Debit or credit: list:DEBIT_CREDIT
      Account code: code:D0-06/Account Code
    columns:
      - "Event type | Y | Code of the sheet Ref Accounting events | Event that the rule posts | PREMIUM_BOOKED"
      - "Rule name | Y | Text | Name of the rule | Premium booked - non-life"
      - "Business line | N | Code of D0-04; blank = every line | Line the rule applies to | -"
      - "Currency | N | ISO 4217; blank = every currency | Currency the rule applies to | -"
      - "Effective from | Y | dd-MMM-yyyy | First posting date of the rule | 01-Jan-2028"
      - "Line | Y | 1, 2, 3 | Order of the line in the entry | 1"
      - "Debit or credit | Y | DEBIT or CREDIT | Side of the line | DEBIT"
      - "Account code | Y | Account of D0-06 | Account posted | 1210.07"
      - "Amount component | Y | Component of the event | Amount the line posts | GROSS_PREMIUM"
      - "Narration | N | Text | Text of the journal line | Premium receivable"
  - id: D0-09
    name: Legacy control accounts
    sheet: Legacy accounts
    content: The accounts that carry the migrated invoices and unapplied payments until they run off, and Migration Clearing
    owner: "Head, Comptrollership"
    source: Proposed rule PR-DM-02 of the Data Migration set
    load: "Created with the chart of accounts (D0-06); named in the accounting rules of the legacy items"
    table: ""
    fields: []
    checks:
      Legacy account: list:LEGACY_ACCOUNT
      BIBS account code: code:D0-06/Account Code
    columns:
      - "Legacy account | Y | Premium Receivable - Legacy (per component), PR 2307 - Legacy, Due to Insurers - Legacy, Commission Receivable - Legacy, Unrealised Commission - Legacy, Deferred Output VAT - Legacy, Unapplied Collections - Legacy, Migration Clearing | One row per account | Migration Clearing"
      - "Component | Cond.: Premium Receivable - Legacy | Basic premium, DST, premium tax or VAT, LGT, FST, other charges | Component the account holds | -"
      - "BIBS account code | Y | Account of D0-06 | Account in the production chart | 1990.01"
