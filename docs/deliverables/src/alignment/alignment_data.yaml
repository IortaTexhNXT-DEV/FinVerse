  - [IQ01, 1, 'Go-live date', 'Which date in January 2028 is T? We propose Monday 3 January 2028, with the legacy freeze after the EOD of Wednesday 29 December 2027 and the legacy December / year-end close completed in legacy before the final extracts. If T is later in January, the migration rule "first business day of a month after a legacy month-end close" (DMQ25) no longer holds and the GL opening needs a January stub period.', 'Timeline slide; answer A1; DMQ25, DMQ18']
  - [IQ02, 2, 'Renewals around cut-over', 'With the early renewal release withdrawn, please confirm that (a) legacy extracts, disposes, places and books all renewals up to T, (b) the RMEL cohorts expiring from T to T+140 days are carried forward into BIBS with their disposition (object P03), and (c) renewals expiring between the freeze and T are placed in legacy before the freeze or covered by hold covers.', 'Concept paper (superseded); answer A1; DMQ26']
  - [IQ03, 2, 'Package remapping', 'Who owns the remapping of legacy package names to BIBS packages, and where does it happen? We recommend a versioned PACKAGE code map applied at migration intake, plus a renewal sanitation check that sends unmapped or retired packages to Review for TSU.', 'Concept paper VII, VIII, Annex C']
  - [IQ04, 1, 'EIAM (Entra ID)', 'Please confirm OpenID Connect (authorisation code with PKCE) against Entra ID; the claim that identifies the user (UPN, Windows ID or employee number); MFA and conditional access; token and session lifetimes against the 30-minute inactivity rule; whether EIAM replaces EUA (DCR-143); how non-BDO users (if any) sign in; and whether a local break-glass administrator is allowed.', 'Drop plan Drop 0; answer A2; UAM-NFR-11, 17, 19']
  - [IQ05, 1, 'UIDM-ISC (IGA)', 'Does UIDM-ISC own access requests and approvals, replacing the BRD-11 request workflow in BIBS, or does it only provision approved changes? Which connector (SCIM 2.0, REST, flat file)? Are entitlements the BIBS group profiles (roles) only? Frequency of aggregation and certification; leaver timing.', 'Drop plan Drop 0; answer A2; BRD-11']
  - [IQ06, 2, 'LMS', 'Which LMS data does BIBS receive (paid-off and RMU loans for renewal, loan snapshot for Submitted Policies, CLPC loan credits), in which layout, how often and by which transport? Is LMS the system behind the LAMD reports?', 'Answer A2; BRRN.029; SP-SQ06']
  - [IQ07, 2, 'HL-LOAS', 'HLS (Drop 0) and LOAS (Drop 2) are one system: is there one interface or two (quotation requests, HLS insurance report, amortised loan data)? Formats, frequency and transport.', 'Drop plan; answer A2; Q11']
  - [IQ08, 3, 'LFS SaaS', 'In which drop is the LFS interface, and what is its layout and transport?', 'Answer A2; BRD-12 p.4-5']
  - [IQ09, 2, 'PMS', 'Layout of the daily PDC list from the PDC Management System; does BIBS also send PDC status (deposited, returned, pulled out) back to PMS? Frequency and transport.', 'Answer A2; OQ03; CSHID.008']
  - [IQ10, 1, 'Bank channels', 'For CMS / New BOB (outward payments), OBPCS (bills payment), Old BOB (SOA funds transfers) and AFTS: file layouts or APIs, host-to-host or user upload, cut-off times, status and debit confirmation. What is AFTS used for? Is ICBS out of scope (struck through)?', 'Drop plan Drop 0; answer A2; AQ09, OQ03']
  - [IQ11, 2, 'CCM', 'Does BIBS send through CCM by SMTP relay or by API? Attachment size limit, password-protected PDFs, volume (renewal advice batches), delivery status and bounces, sender addresses.', 'Answer A2']
  - [IQ12, 3, 'M365 Exchange', 'What does BIBS do with M365 Exchange that CCM does not cover (read the mailboxes of e-mailed quotation requests or insurer replies through Microsoft Graph)?', 'Answer A2; Q12']
  - [IQ13, 3, 'ECM', 'With documents in S3 only, is there any ECM touch-point left (source of legacy documents for the archive, transfer of records at the end of retention)?', 'Answers A2, A4']
  - [IQ14, 3, 'TFS', 'Which client onboarding data comes from TFS, and what is the layout of the Trade payment file uploaded to Cashiering?', 'Answer A2; CSHID.008']
  - [IQ15, 1, 'EDP (SD 11)', 'What is SD 11? Which BIBS data does EDP ingest, at what frequency and in which format (files to S3, change-data capture, events)? Masking of personal data?', 'Drop plan Drop 2; answer A2']
  - [IQ16, 1, 'EGL', 'Does EGL take journal detail or balances, daily or monthly? Mapping of the BIBS chart to EGL accounts and segments, currency handling, layout and transport, reconciliation owner; relation to the GARD submission (AQ31).', 'Drop plan Drop 2; answer A2']
  - [IQ17, 2, 'CARMS', 'What is CARMS, and which data flows between it and BIBS in which direction?', 'Drop plan Drop 2']
  - [IQ18, 2, 'Insurer System', 'Which insurers and which exchanges (production feedback, remittance ORs, DP billing responses, renewal responses, SOAs, e-policies, claims) are in scope, and by which channel (SFTP, API, e-mail)?', 'Drop plan Drop 2; Q06, OQ22']
  - [IQ19, 3, 'Bridger Insight XG', 'Is Bridger the screening engine (BIBS records its results) or a second check next to BIBS list matching (SNSRP-201, 301)? Is a batch export of clients for Bridger needed?', 'Drop plan Drop 2; answer A2; SQ01']
  - [IQ20, 1, 'Reinsurance transactions in Remittance', 'Which reinsurance transactions does Remittance handle in Drop 1 (premium received from cedants and remitted to reinsurers, RI claims recoveries), with which accounting? Please send the "Operations BRD (Remittance Addendum)" and "(Cashiering Addendum)" named on the slide.', 'Drop plan 1.D2, 1.D3; answer A3']
  - [IQ21, 2, 'Marketing Collection (extraction)', 'What is "Marketing Collection (extraction)" in Drop 2? BRD-4 Collections is a BIBS module fed by the Operations ledger; is a separate Collection Management System kept, with an extraction from BIBS?', 'Drop plan 2.1; BRD-4']
  - [IQ22, 1, 'Employee Benefits without portal', 'Please confirm that insurers and client HR send EB documents by e-mail and BDOI users upload them (BRID-005, 005.01, 014 changed), and that EB placement (Drop 1) uses the NB placement screens.', 'Drop plan 2.4, 1.U6; BRD-8']
  - [IQ23, 2, 'Unplaced BRDs', 'In which drop are BRD-10 Sanction Screening (we propose Drop 1 with Client Onboarding) and the CSF service-request functions (we propose Drop 2)?', 'Drop plan']
  - [IQ24, 2, 'Drop 0 items without a BRD', 'Which requirements govern Drop 0 items 1 (Accessibility & Login: sign-in, or WCAG accessibility, or both), 4 (Data Management) and 5 (Workflow)? We propose BRD-11 + EIAM, CORE-17 of the umbrella BRD, and the workflows of each BRD.', 'Drop plan Drop 0']
  - [IQ25, 1, 'Architecture in the IER', 'Please confirm that the IER describes BIBS as built: one backend (modular monolith) and one frontend on EKS, RDS PostgreSQL 16, ElastiCache Redis 7, MSK Kafka, S3; not the ten bv-* microservices, Aurora / MongoDB, Istio / OPA or EventBridge. Which edge is the BDO standard: ALB + WAF, CloudFront, Apigee X?', 'IER Architecture Diagram, K8s sheets']
  - [IQ26, 1, 'Disaster recovery', 'Which region hosts DR (the HW sheet says cross-region read replica; the diagram says ap-southeast-1 warm standby)? Does data residency allow a second region? DR drill frequency?', 'IER HW & SW Requirements; hosting appendix; DCR-135']
  - [IQ27, 2, 'Non-production hours', 'What are the 12 x 5 hours? We need extended hours for batch and month-end test cycles, weekend trial migrations and the dress rehearsal; MSK and ElastiCache cannot be stopped.', 'IER Assumptions 3']
  - [IQ28, 2, 'VDI and access', 'Does "access restricted to personnel in the Philippines" apply to DEV and SIT with masked data? Which vendor staff need VDI? Software list: Temurin 21, Maven 3.9, Node 22 (not JDK 17, Node 20, Angular).', 'IER VDI Requirements; hosting appendix']
  - [IQ29, 2, 'CI / CD toolchain', 'Which toolchain applies: GitLab (HW sheet), a second CI toolchain named in the IER (infra diagram) or ArgoCD + Helm (diagram)? Container registry, image base (RHEL UBI or Alpine), SonarQube instance.', 'IER sheets']
  - [IQ30, 3, 'Observability', 'Dynatrace (VDI, K8s sheets) or CloudWatch, X-Ray, Prometheus, Loki, Grafana (diagram)? Log platform and alert routing.', 'IER sheets']
  - [IQ31, 1, 'S3 document store', 'Please confirm the five decisions of DOCUMENT_STORAGE_DECISION.md section 5: option C with 5-minute presigned links (or option B, streaming through BIBS); the malware scanning service; Object Lock mode and the records under legal hold; KMS key ownership and rotation; whether ECM receives copies of any record class. Also the bucket account and the DR region for replication.', 'Answer A4; DOCUMENT_STORAGE_DECISION.md']
  - [IQ32, 2, 'Sizing basis', 'Which user figures size the platform: 1,200 internal users (IER diagram) or 1,344 named / 429 concurrent (umbrella BRD p.42)? Transactions per second per year (IER K8s guideline 3).', 'IER; DCR-166']
  - [IQ33, 2, 'IER completeness', 'Will BDOI IT add the Pre-Prod and DR cluster sheets, retitle the Pre-Prod sheet (it reads "UAT ENVIRONMENT") and replace the template rows of the environment cost sheets with the sizing of this document?', 'IER Pre-Prod, K8s sheets']
  - [IQ34, 3, 'ElastiCache mode', 'Please confirm cluster mode disabled (one shard, Multi-AZ replica) for Pre-Prod and PROD; "cluster" in the HW sheet would need a code change.', 'IER HW & SW Requirements']
  - [IQ35, 2, 'Security testing', 'Who runs the performance and penetration tests of Nov - Dec 2027, and may an earlier scan run in SIT in June 2027?', 'Timeline slide']
