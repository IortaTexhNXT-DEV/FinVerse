# ------------------------------------------------------------------------------------------------------------
# Integration inventory. fit: FIT / CONFIGURE / CHANGE / NEW / OUT. bdoi = meaning given by BDOI (answer A2);
# understanding = our reading, to be confirmed. seam = existing port or mechanism in BIBS.
integrations:
  - id: INT-01
    name: EIAM (Entra ID)
    drop: Drop 0
    bdoi: Enterprise Identity Access Management, on Microsoft Entra ID
    understanding: Single sign-on of BDO users. BIBS redirects to Entra ID (OpenID Connect, authorisation code with PKCE) and maps the returned identity to the BIBS user; roles stay in BIBS.
    direction: Both (browser redirect; tokens to BIBS)
    data: User identity (UPN or Windows ID, name, e-mail); optional group claims
    module: security; Setup & Administration > Users
    seam: 'security.service.directory.DirectoryAuthenticator (password check, LOCAL default; AUTH_MODE); SsoTokenExchange designed, not built (USER_ACCESS_DESIGN section 10)'
    fit: CHANGE
    build: 'OIDC log-in (frontend redirect, backend token validation with Spring Security OAuth2), user mapping by sec_user.windows_id or UPN, log-out to Entra, local break-glass administrator; lockout and password rules then sit in Entra ID'
    open: Protocol and claims, MFA and conditional access, session life against the 30-minute inactivity rule, non-BDO users
    questions: IQ04
  - id: INT-02
    name: UIDM-ISC (IGA)
    drop: Drop 0
    bdoi: User ID Maintenance - Identity Security Cloud, the identity governance and administration (IGA) tool
    understanding: Joiner, mover and leaver provisioning and access certification from the IGA. We read "Identity Security Cloud" as the SailPoint product; to confirm.
    direction: Inbound (provisioning) and outbound (account and entitlement aggregation)
    data: User accounts, enable / disable, group profiles (BIBS roles) as entitlements
    module: security, nbadmin (BRD-11 access requests)
    seam: 'None for provisioning. nbadmin request lifecycle and UserAdminService apply changes; ExternalUserProvisioner serves portal users only'
    fit: CHANGE
    build: 'Provisioning API (SCIM 2.0 Users / Groups, or the connector ISC offers), aggregation export, change-log rows with the ISC request number; decide which BRD-11 request types remain in BIBS'
    open: Who owns requests and approvals, connector type, entitlement level, certification
    questions: IQ05
  - id: INT-03
    name: LMS
    drop: Drop 0
    bdoi: Loans Management System
    understanding: Bank loan data used by Renewal (paid-off and RMU loans, BRRN.029), Submitted Policies (loan snapshot, PN) and CLPC billing. Probably the source of the "LAMD reports".
    direction: Inbound
    data: PN number, loan status (paid-off, RMU), loan release and amortisation for CLPC
    module: renewal (designed), submitted (designed), placement (CLPC reports), cashiering (PAY_CLPC)
    seam: 'Bulk handlers RNW_LAMD_REPORT and SBM LAMD upload (designed); PaymentReportService / NB-CLPC-BILLING; PAY_CLPC'
    fit: CHANGE
    build: 'Layouts per report; automated transfer if LMS delivers files (SFTP drop to S3) instead of user uploads'
    open: Which LMS extracts, layouts, frequency, transport
    questions: IQ06
  - id: INT-04
    name: HL-LOAS (HLS / LOAS)
    drop: Drop 0 (HLS) and Drop 2 (LOAS)
    bdoi: Home Loan System (Loan Origination and Admin)
    understanding: One system shown twice on the slide. Origination side sends home-insurance quotation requests (BRNB.023) and the daily HLS insurance report (Submitted Policies, CBG Fire); admin side gives the HLS amortised loan data for CLPC billing.
    direction: Inbound
    data: Quotation requests (borrower, property, sum insured, PN); HLS insurance report; amortised loan release
    module: quotation, submitted (designed), placement (CLPC)
    seam: 'quotation.service.QuotationRequestSource with job QUOTATION_REQUEST_INTAKE (cron off) and bulk QUOTATION_REQUEST; NB-CLPC-BILLING variants'
    fit: CHANGE
    build: 'QuotationRequestSource adapter (file or REST) with source authentication; SP intake handler; CLPC layout'
    open: One interface or two, formats, frequency, transport
    questions: IQ07
  - id: INT-05
    name: LFS SaaS
    drop: Not on the slide
    bdoi: Loan Front-End System (SaaS)
    understanding: Source of the LFS insurance report for Submitted Policies (BRD-12 p.4-5).
    direction: Inbound
    data: Loan-linked policies submitted by borrowers
    module: submitted (designed)
    seam: 'Submitted-policy intake handlers (SUBMITTED_POLICIES_DESIGN); Q11 / SP-SQ01'
    fit: NEW
    build: 'Intake layout and transfer; part of the SP build'
    open: Drop, layout, transport
    questions: IQ08
  - id: INT-06
    name: PMS
    drop: Drop 0
    bdoi: PDC Management System
    understanding: Holds the post-dated checks in the warehouse. BIBS Cashiering receives the daily PDC list and matures PDCs on their date (CSHID.008 item 4).
    direction: Inbound; outbound status to confirm
    data: PDC number, bank, date, amount, payor, account / invoice reference; possibly deposit, return and pull-out status
    module: cashiering
    seam: 'Payment file handler PAY_PDC (layout table, PdcFileHandler); job PDC_MATURITY'
    fit: CONFIGURE
    build: 'Layout in the payment-file layout table; an automated transfer if PMS drops files; outbound status feed if required'
    open: Layout (OQ03), direction, frequency
    questions: IQ09
  - id: INT-07
    name: CMS / New BOB
    drop: Drop 0
    bdoi: Cash Management System, outward payments (also called New BOB)
    understanding: Bank channel for BDOI's outgoing payments (insurer remittances, refunds, supplier and commission payments) from Disbursement; the bank returns the debit status.
    direction: Outbound (payment instructions); inbound (status, debit confirmation)
    data: Payee, account, amount, currency, value date, voucher reference; status per transaction
    module: disbursement
    seam: 'Payment instruments and EOD outputs (dsb_eod_output); DCTF file; upload DISB_BOB_APPROVED (BobApprovedHandler); BankChannelPort named in the design, not built (AQ09)'
    fit: CHANGE
    build: 'Outward payment file in the CMS layout (or host-to-host), status upload or pull, reconciliation to vouchers'
    open: Layout, host-to-host or upload, cut-off times, approvals in CMS
    questions: IQ10
  - id: INT-08
    name: OBPCS
    drop: Drop 0
    bdoi: Online Bills Payment Consolidation System
    understanding: The consolidated bills-payment collections file (today "Bills Payment FS01") that Cashiering uploads and automatches.
    direction: Inbound
    data: Payment date, reference (ARN, invoice, PN), payor, amount, channel
    module: cashiering
    seam: 'Payment file handler PAY_BILLS (configurable layout); PAYMENT_AUTOMATCH job'
    fit: CONFIGURE
    build: 'Layout; automated transfer if OBPCS drops files'
    open: Layout, frequency, transport
    questions: IQ10
  - id: INT-09
    name: Old BOB
    drop: Drop 0
    bdoi: Old Business Online Banking Collection System; SOA bills payments via funds transfer
    understanding: Corporate clients pay statements of account by funds transfer; the collection file is applied in Cashiering.
    direction: Inbound
    data: Funds-transfer credits with SOA or invoice reference
    module: cashiering (Direct Credit or a new layout)
    seam: 'Payment file handler PAY_DIRECT_CREDIT or a new layout row'
    fit: CONFIGURE
