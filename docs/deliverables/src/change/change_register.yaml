# Team roles used in the estimates (Effort basis sheet)
roles:
  - ['Business analyst', 'Analysis: impact analysis, BDOI workshops, rules and layouts, FRS and test plan updates (with the technical writer)']
  - ['Solution architect', 'Analysis of interfaces, data and infrastructure items; design updates']
  - ['Backend developer', 'Build: Java services, database migrations, jobs, adapters, reports']
  - ['Frontend developer', 'Build: React screens, forms and lists']
  - ['QA engineer', 'Test: unit and integration tests reviewed, SIT test cases written and run, regression']
  - ['Technical writer', 'Documentation: FRS, design, test plan, user and configuration guides, release notes']

assumptions:
  - 'A man-day is 8 working hours of one team member. Figures are rounded to whole days.'
  - 'Effort is the work still needed to close the deviation as proposed in the "As built / proposed" column. It is 0 when the behaviour is built (or decided and documented) and only needs acceptance.'
  - 'For an item parked pending a BDOI answer, the effort is the work to complete it once BDOI answers as proposed (adapter, values, layouts, screens). A different answer is re-estimated at impact analysis.'
  - 'The optional column "BRD as written" gives the indicative effort to build the BRD text instead of the proposed behaviour, for the CCB to compare.'
  - 'Build includes unit and integration tests written by the developers. Test covers SIT test cases (writing and running) and regression. Documentation covers the FRS, design, test plan and guides.'
  - 'Excluded: UAT support, BDOI staff time, infrastructure provisioning by BDO IT (buckets, keys, network routes, certificates), licences and third-party services, and the Phase 2 Reinsurance module.'
  - 'Excluded: the baseline build of the designed BRDs (BRD-6, BRD-8, BRD-9, BRD-12, BRD-13, the rest of BRD-7). Only the delta caused by the deviation is estimated.'
  - 'Estimates are at the accuracy of an impact analysis (about plus or minus 30 percent). The CCB re-estimates an item when BDOI''s answer differs from the proposal.'
  - 'Status and counts are as of the date on the cover and are refreshed with the final as-built refresh of the documents.'

# Change control process: [step, what happens, who, output, time]
process:
  - ['1. Request', 'Anyone in BDOI or the project team raises a change request on the CR form, or the project team raises a CR from a recorded deviation (FRS differences, register, alignment pack).', 'Requester; Project Manager (iorta TechNXT) logs it', 'CR row in this register, status Draft', 'Same day']
  - ['2. Impact analysis', 'The business analyst and solution architect assess scope, BRD and FRS references, affected modules, data, interfaces, tests, documents and drop; estimate effort in man-days (Analysis, Build, Test, Documentation).', 'Business analyst, Solution architect; BDOI owner of the BRD for business impact', 'Impact analysis on the CR form; status For CCB review', '5 working days (10 for L / XL)']
  - ['3. CCB review', 'The Change Control Board reviews the CR at its fortnightly meeting (or ad hoc for High priority items): accept, reject, defer, or ask for more analysis.', 'Change Control Board', 'Minutes with the decision per CR', 'Fortnightly']
  - ['4. Approval', 'Approved CRs are signed on the CR form by the BDOI decision owner and the BIBS Product Owner. A CR above 25 man-days, or one that moves a drop date, also needs the Program Manager.', 'Decision owner; BIBS Product Owner; Program Manager (L / XL, date change)', 'Status Approved or Rejected; signed CR form', 'Within 5 working days of the CCB']
  - ['5. Schedule', 'The Project Manager places the CR in a drop or build wave and updates the plan, the FRS change list and the test plan scope.', 'Project Manager (iorta TechNXT); BDOI Program Manager', 'Target drop / release set; plan updated', 'Next planning cycle']
  - ['6. Implement', 'The team builds and documents the change: code, configuration, FRS revision, design, test cases, user and configuration guides.', 'Delivery team', 'Build, FRS revision, test cases', 'As scheduled']
  - ['7. Verify', 'QA runs the SIT cases and regression; the BDOI owner checks the behaviour in SIT or UAT against the CR.', 'QA engineer; BDOI owner of the BRD', 'Test evidence; acceptance by the owner', 'Within the drop SIT / UAT window']
  - ['8. Close', 'The Project Manager records the result, the FRS version that carries it and the closing date; the CR is reported in the release notes.', 'Project Manager; BIBS Product Owner', 'Status Implemented; release note entry', 'At release']

# Proposed Change Control Board membership: [role, organisation, role on the board]
ccb:
  - ['BIBS Product Owner', 'BDOI', 'Chair; casting vote on scope and priority']
  - ['Program Manager, Business Project Services', 'BDO Unibank ESG', 'Plan, drops and budget; approves L / XL items and date changes']
  - ['Owner of the BRD concerned (department head or product owner)', 'BDOI', 'Decision owner of the CR; attends for the CRs of the BRD']
  - ['Head, Comptrollership', 'BDOI', 'Member for any CR that touches posting, GL, tax or BIR reports']
  - ['Chief Compliance Officer (or delegate)', 'BDOI', 'Member for any CR that touches screening, KYC, access control or retention']
  - ['BDOI IT (integration owner)', 'BDOI', 'Member for interfaces and infrastructure items']
  - ['Project Manager', 'iorta TechNXT', 'Secretary: agenda, register, minutes, schedule']
  - ['Solution Architect', 'iorta TechNXT', 'Presents impact analysis and effort']
  - ['Business Analyst lead', 'iorta TechNXT', 'Presents BRD / FRS references and test impact']

