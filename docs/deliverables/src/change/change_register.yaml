# Change Management Register - data file.
# Built into Excel and into the tables of the Word summary by build_change_register.py (same folder).
# Edit this file, then re-run the builder. Text fields are YAML single-quoted strings: write an apostrophe as two ('').
#
# The register is for documentation and change control. It does not change the platform build or the FRS baseline.
#
# Row keys
#   id      CR-nnnn, unique and in sequence (checked)
#   drop    Drop 0 | Drop 1 | Drop 2 | Programme | Phase 2
#   brd     primary BRD (BRD-00 to BRD-13); other BRDs are named in ref
#   ref     BRD requirement ID(s) with the BRD page (PDF page of the source BRD)
#   fr      FRS FR ID(s), or the FRS section when the item has no FR
#   module  BIBS module and screen
#   type    code of the deviation type (types: below)
#   req     what the BRD asks
#   built   as-built or proposed behaviour
#   reason  BDOI decision, question or technical constraint behind the deviation
#   impact  business impact
#   depts   affected BDOI departments
#   eff     [analysis, build, test, documentation] in man-days for the work still needed to close the deviation
#   alt     optional: man-days to build the BRD text as written instead (indicative)
#   prio    High | Medium | Low
#   status  code of the CR status (statuses: below)
#   owner   optional owner code (owners: below); default is the owner of the BRD
#   xref    register and question references (DCR-, question IDs, decisions)
#   target  code of the target drop or release (targets: below)
#   src     where the deviation is recorded (FRS section, spec, design, register, alignment)

meta:
  title: Change Management Register
  subtitle: Deviations from the BRDs that go through change control, with effort in man-days
  statement: 'For documentation and change control; does not change the platform build or the FRS baseline.'
  doc_type: Change Register
  brd: BRD-00
  name: Change Management
  doc_id: BIBS-CMR-BRD-00
  version: '1.0'
  date: 26 September 2026
  status_as_of: 26 September 2026
  baseline: 'FRS v1.0 of every BRD (BRD-2, BRD-6, BRD-11 and BRD-13 at v1.1 or later), discrepancy register v1.2, BDOI answers of 26 September 2026'

types:
  ADD: 'Scope addition — beyond BRD'
  RED: 'Scope reduction / descoped'
  DIFF: 'Behaviour differs from BRD (as built)'
  PARK: 'Deferred / parked pending BDOI answer'
  PH2: 'Deferred to Phase 2'
  DEC: 'BRD conflict resolved by decision'
  INT: 'Integration dependency'
  NFR: 'NFR / infrastructure change'
  MIG: 'Data migration'

type_meaning:
  ADD: 'BIBS does more than the BRD asks, or the umbrella FRS proposes a requirement that no function BRD owns. BDOI accepts the addition or removes it.'
  RED: 'A BRD requirement is not built, or is built with less than the BRD asks, by a BDOI instruction or a proposal. BDOI confirms the descoping.'
  DIFF: 'The requirement is met in a different way from the BRD text. Built (or designed) and working; BDOI accepts the behaviour or asks for the BRD text.'
  PARK: 'The element is built as a seam or with a documented default and waits for a BDOI answer (values, layouts, rules, a yes / no on scope).'
  PH2: 'Out of phase 1 by BDOI decision; kept for phase 2 with the seams left open.'
  DEC: 'Two BRDs, or two parts of one BRD, conflict. A binding decision (D1-D10) or a proposed resolution settles the conflict; BDOI confirms it.'
  INT: 'The requirement depends on an interface with a BDO or insurer system that is not yet specified. BIBS runs on an upload or a manual step until the interface exists.'
  NFR: 'A non-functional value (hours, availability, recovery, retention, sizing) or an infrastructure choice differs from one or more BRDs, or from the IER workbook.'
  MIG: 'The migration or cut-over treatment differs from what a BRD assumes, or adds work that a BRD does not state.'

statuses:
  DRAFT: 'Draft'
  CCB: 'For CCB review'
  APPR: 'Approved'
  REJ: 'Rejected'
  IMPL: 'Implemented (as built, for acceptance)'

status_meaning:
  DRAFT: 'Raised by the project team. Impact analysis done; the BDOI answer or decision it needs is still open.'
  CCB: 'Impact analysis complete; ready for the Change Control Board to approve, reject or defer.'
  APPR: 'Approved by the CCB; scheduled into a drop or release.'
  REJ: 'Rejected by the CCB; the BRD text stands, or the item is closed without change.'
  IMPL: 'The behaviour is built (or decided and documented) and differs from the BRD text; the CCB records the acceptance. No work remains.'

priorities:
  High: 'Affects money (premium, commission, GL, remittance), regulatory compliance, security or access, or blocks a drop. Decide before the FRS of the area is signed off.'
  Medium: 'Changes a rule, screen, report or interface; a documented default runs until BDOI decides.'
  Low: 'Wording, labels or presentation; no effect on money, control or data.'

