  - {n: 2, title: Quotations prepared in QPS or Excel, text: 'Rating and versions live outside one workflow; approvals by e-mail.', ref: 'BRD-1 p.133; FRS 2.1 row 2'}
  - {n: 3, title: Non-package placement by e-mail, text: 'TSU receives risks by e-mail and builds the comparative table in Excel.', ref: 'Other Lines addendum p.47'}
  - {n: 4, title: No standard client onboarding, text: 'Clients are created without a KYC verification step.', ref: 'Workshop addendum p.3-5; BRNB.090'}
  - {n: 5, title: Accounts in spreadsheets, text: 'No single account number; duplicates are found late.', ref: 'BRD-1 p.133; BRNB.032, 051'}
