# BRD-1 New Business: content of chapter 1 of the business process deck.
# Sources: BRD-1 "New Business (NB) BRD.pdf" p.47-48, p.82, p.132-134, p.210-212; FRS BRD-1 sections 2, 5, 9, 10;
# discrepancy register (DCR-001, 005, 006, 027, 112); open questions Q01-Q44.
id: brd01
key: nb
num: 1
title: New Business
brd: BRD-1
scope: Client onboarding to booking (Fire, Motor, Other Lines, Non-Package)
status: BUILT
status_text: Built; FRS v1.0 issued for review
department: Marketing, TSU and Processing
roles:
  - Marketing AO, TL / TH / UH (Retail, Commercial, Corporate, Institutional)
