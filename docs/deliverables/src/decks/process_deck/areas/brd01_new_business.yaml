asis:
  caption: 'Request to account today (New Business process flow; Day 1 p.18; NB-01 to NB-15)'
  notes: >-
    Requests reach the Marketing AO by e-mail: individual requests from bank AOs, branches, IBG or clients, and for
    CBG Fire a daily list of approved loans from CBG LAD. The AO builds the insurance report from HLS, CLAS and CTS
    and sanitises it by hand. Quotations are prepared in the IDF Excel templates (or ISYS for package accounts),
    saved as PDF and e-mailed; non-package risks go to TSU. There is no control on quote validity or SLA. Once the
    client accepts with proof of payment, KYC and the insurance declaration are done outside the system, the client
    is created in Broker and the account in ISYS. The Processing Officer then asks IT to migrate client and account
    from ISYS to QPS; when the migration fails the account is fixed and re-migrated, then pushed to the core system.
    Marketing submits the GRF / ARF and the TL reviews it.
  cols: 7
  lanes:
    - {id: bank, label: 'Bank units, clients', kind: external}
    - {id: mao, label: 'Marketing AO, TL'}
    - {id: tsu, label: TSU}
    - {id: prc, label: 'Processing, IT'}
    - {id: sys, label: 'Excel, Broker, ISYS, QPS', kind: system}
  steps:
    - {id: n1, lane: bank, col: 1, text: 'Request by e-mail; LAD daily loan list', kind: external}
    - {id: n2, lane: mao, col: 1, text: 'HLS, CLAS, CTS reports sanitised by hand', pain: [1]}
    - {id: n3, lane: sys, col: 2, text: 'Quotation in IDF Excel template, saved as PDF', kind: legacy, pain: [2]}
    - {id: n4, lane: tsu, col: 2, text: 'Non-package: TSU proposal'}
    - {id: n5, lane: mao, col: 3, text: 'Proposal e-mailed; no validity or SLA clock', pain: [3]}
    - {id: n6, lane: bank, col: 3, text: 'Accepts with proof of payment', kind: external}
    - {id: n7, lane: mao, col: 4, text: 'KYC and declaration form outside the system', pain: [4]}
    - {id: n8, lane: sys, col: 4, text: 'Client in Broker; account in ISYS', kind: legacy, pain: [5]}
    - {id: n9, lane: prc, col: 5, text: 'IT migrates ISYS to QPS', pain: [5]}
    - {id: n10, lane: prc, col: 6, text: 'Fall-out fixed, re-migrated, pushed to core', pain: [5]}
    - {id: n11, lane: mao, col: 7, text: 'GRF / ARF submitted; TL reviews'}
