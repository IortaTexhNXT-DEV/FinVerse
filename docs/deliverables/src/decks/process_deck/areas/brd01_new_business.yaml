# Sources: floor walks 22-Sep-2026 (New Business 43F; Placement and Booking 43F) and 25-Sep-2026 (New Business
# Corporate and Retail, Trade); discovery 21-Sep-2026 (floor-walk notes NB-01 to NB-15, DC-01, TR-01, TR-02);
# BDOI Day 1 overview p.11 and p.18; high-level New Business process flow confirmed by the process owners (Dec 2025 -
# Mar 2026); BRD-1 p.47-48, p.132-134, p.210-212; discrepancy register (DCR-001, 005, 006, 027, 112, 121, 132).
