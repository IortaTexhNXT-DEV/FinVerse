asis_extra:
  - caption: 'Placement to booking and e-policy delivery today (New Business process flow; Day 1 p.18)'
    notes: >-
      The Processing Officer sends the placement slip to each insurer by SFTP or, for insurers without SFTP, as a PDF
      by e-mail, and handles returns (revision, more documents, cancellation) with Marketing. Hold covers go by e-mail
      and the PDF is saved on the shared drive with the link in the e-mail. The insurer issues the e-policy. When SFTP
      works, IT updates the policy number in EBIX by batch and COG-OPRM sends the e-policy to the client; when the
      insurer is not on SFTP or the transfer falls out, the officer creates a text file for the policy-number update,
      IT runs an e-policy exception report, and Marketing fixes the fall-out and passes the e-policy to the BDOI
      contact centre to send. Placement and booking are done in ISYS or EBIX depending on who has access. For CBG Fire
      the AO prepares the billing file for CLPC and checks the CLPC masterlist to see whether billed accounts are paid.
      Status is kept in the NB masterlist in Excel.
    cols: 7
    lanes:
      - {id: mkt, label: 'Marketing, contact centre'}
      - {id: prc, label: 'Processing Officer, TL'}
      - {id: ins, label: Insurers, kind: external}
      - {id: it, label: 'IT, COG-OPRM'}
      - {id: cli, label: 'Client, CLPC', kind: external}
      - {id: sys, label: 'EBIX, ISYS, SFTP, e-mail', kind: system}
    steps:
      - {id: m1, lane: prc, col: 1, text: 'Placement slip by SFTP or e-mail per insurer', pain: [6]}
      - {id: m2, lane: ins, col: 2, text: 'Returns: revision, more documents', kind: external}
      - {id: m3, lane: prc, col: 3, text: 'Returns and hold cover by e-mail; PDF on drive', pain: [7]}
      - {id: m4, lane: ins, col: 4, text: 'Issues the e-policy (SFTP or e-mail)', kind: external}
      - {id: m5, lane: it, col: 4, text: 'SFTP fall-out; exception report', pain: [8]}
      - {id: m6, lane: prc, col: 5, text: Text file for policy-number update, pain: [8]}
      - {id: m7, lane: it, col: 5, text: Batch update of policy number in EBIX}
      - {id: m8, lane: mkt, col: 5, text: 'Fall-out fixed; contact centre sends', pain: [9]}
      - {id: m9, lane: sys, col: 6, text: 'Booked in ISYS or EBIX by whoever has access', kind: legacy, pain: [10]}
      - {id: m10, lane: cli, col: 6, text: 'CBG Fire: CLPC billing file, paid list', kind: external, pain: [11]}
