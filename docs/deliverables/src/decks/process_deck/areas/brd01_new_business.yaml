notes:
  glance: >-
    New Business turns a customer need into an issued, booked and delivered policy. It is the spine of the business:
    every other area reads the client, the account and the booked invoice it creates. The journey differs by segment
    (CBG Motor, CBG Fire and Home, Non-CBG Retail, Corporate, Branches, bank trade business) and by product type:
    package products go from quotation to policy on fixed terms, non-package risks go through TSU for insurer terms
    (chapter 5). Today one deal crosses five tools: Excel templates, Broker, ISYS, QPS and EBIX.
  heard: >-
    Notes of the business overview (21-Sep) and of the New Business sessions of 22 and 25-Sep. NB-01 has two
    versions from two sessions and is an open point.
  pains: >-
    Points 1 to 5 are on the request-to-account swimlane, 6 to 12 on the placement-to-booking swimlane. The BRD-1
    current-process section (p.133-134) names most of them; the process flow adds the ISYS to QPS migration loop and
    the e-policy fall-out chain.
  after: The BRD states objectives without turnaround targets; the benefit column names what the To-Be removes.
  missed: >-
    Quote validity, the risk survey, the e-policy fall-out queue and Marine open-cover declarations are not in any
    BRD. The other items are rules the BRD leaves open.
