tobe:
  caption: 'Request to booking in BIBS: workflows NB_CLIENT, NB_QUOTATION, NB_PROPOSAL, NB_ACCOUNT (FRS BRD-1 section 5)'
  notes: >-
    In BIBS, requests are captured in a request inbox or loaded from a source-system file. Every client starts as a
    prospect and is confirmed after a second user verifies the KYC documents. Package quotations are rated with the
    Appendix A formulas, approved and sent protected; non-package risks go through the PRF, with quotation slips to
    insurers and a comparative compiled by BIBS. One account per accepted risk group carries the ARN. BIBS produces
    the CLPC billing file and matches payment reports. Processing sends placement slips and hold cover requests with a
    send log, matches the e-policy and sends it protected. Booking posts the invoice, the GL entry and the service
    invoice in one transaction; batch booking runs at 20:00. Dashboards read the workflow history.
    The HLS interface, the mailbox reader and insurer SFTP / API are parked seams (Q11, Q12, Q06).
  cols: 7
  lanes:
    - {id: cli, label: 'Client, bank units (HLS, CLPC)', kind: external}
    - {id: mkt, label: Marketing AO / TL}
    - {id: tsu, label: TSU}
    - {id: prc, label: Processing}
    - {id: ins, label: Insurers, kind: external}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
  steps:
    - {id: b1, lane: cli, col: 1, text: Request by e-mail or HLS extract, kind: external}
    - {id: b2, lane: mkt, col: 1, text: 'Request inbox: capture or upload'}
    - {id: b3, lane: mkt, col: 2, text: 'Prospect; KYC checked by 2nd user'}
    - {id: b4, lane: bibs, col: 2, text: Duplicate check and screening, kind: auto}
    - {id: b5, lane: mkt, col: 3, text: Quotation rated and approved}
    - {id: b6, lane: tsu, col: 3, text: 'PRF: slips out, comparative built'}
    - {id: b7, lane: bibs, col: 4, text: Quotation / slip sent protected, kind: doc}
    - {id: b8, lane: mkt, col: 4, text: Account with ARN submitted}
    - {id: b9, lane: bibs, col: 5, text: CLPC billing file; payments matched, kind: auto}
    - {id: b10, lane: prc, col: 5, text: Placement slip; hold cover request}
    - {id: b11, lane: ins, col: 6, text: Returns policy and e-policy, kind: external}
    - {id: b12, lane: prc, col: 6, text: E-policy matched; sent protected}
    - {id: b13, lane: bibs, col: 7, text: 'Booking: invoice, GL, service invoice', kind: auto}
    - {id: b14, lane: mkt, col: 7, text: Dashboard and status reports}
