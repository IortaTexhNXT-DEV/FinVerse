chevrons: [Request, Onboarding, Quotation / PRF, Account, Payment, Placement, Issuance, Booking]
notes:
  glance: >-
    New Business is the spine of BIBS: every other area reads the client, the account (ARN) and the booked invoice
    that it creates. It is built, and FRS BRD-1 v1.0 describes the delivered screens. The volumes come from the usage
    tables of the BRD (p.210-212) and the retention values from the workshop addendum (p.82), which prevail over
    "follow QPS" (assumption A-NB-08).
  pains: The numbered markers on the As-Is swimlane refer to these points. The page numbers are PDF pages of the BRD-1 pack.
  after: >-
    Each row pairs a pain point with the BIBS behaviour that removes it. The BRD states objectives (batch processing
    across all segments, one workflow, reports) but no turnaround targets, so the measures are the NFR values and
    the controls added.
  gaps: >-
    High items first. The parked interfaces are built as seams: a port, a staging table or a manual upload, so adding
    the transport later needs no workflow change (FRS section 7).
asis:
  caption: 'Request to booking today (BRD-1 p.133-134, p.47)'
  notes: >-
    Today most New Business work is manual. Requests arrive by e-mail; HLS requests are keyed in. Quotations are
    prepared in QPS or Excel; non-package risks go to TSU by e-mail and the comparative is built in Excel. Clients
    are created without a standard onboarding step. Accounts are tracked in spreadsheets, so duplicates are found
    late. CBG Fire billing and payment matching are manual. Placement files, hold covers and e-policies go by e-mail
    without a log. Booking, GL entries and invoices are separate steps, and status reports are compiled by hand
    (BRD p.133-134; Other Lines addendum p.47). Bulk processing exists for CBG Home only.
  cols: 7
  lanes:
    - {id: cli, label: 'Client, bank units (HLS, CLPC)', kind: external}
    - {id: mkt, label: Marketing AO / TL}
    - {id: tsu, label: TSU}
    - {id: prc, label: Processing}
    - {id: ins, label: Insurers, kind: external}
    - {id: sys, label: 'QPS, EBIX, Excel, e-mail', kind: system}
  steps:
