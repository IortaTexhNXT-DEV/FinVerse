    - {id: a2, lane: mkt, col: 1, text: HLS request keyed in, pain: [1]}
    - {id: a3, lane: sys, col: 2, text: Quotation in QPS or Excel, kind: legacy, pain: [2]}
    - {id: a4, lane: tsu, col: 2, text: 'Non-package: comparative in Excel', pain: [3]}
    - {id: a5, lane: mkt, col: 3, text: Client created without KYC step, pain: [4]}
    - {id: a6, lane: sys, col: 4, text: Account tracked in a spreadsheet, kind: legacy, pain: [5]}
    - {id: a7, lane: prc, col: 4, text: CBG Fire billing matched by hand, pain: [6]}
    - {id: a8, lane: prc, col: 5, text: Placement and hold cover by e-mail, pain: [7]}
    - {id: a9, lane: ins, col: 5, text: Policy issued; e-policy by e-mail, kind: external}
    - {id: a10, lane: sys, col: 6, text: 'Booking in EBIX: invoice, GL, invoice apart', kind: legacy, pain: [8]}
    - {id: a11, lane: mkt, col: 7, text: Status report compiled by hand, pain: [9]}
