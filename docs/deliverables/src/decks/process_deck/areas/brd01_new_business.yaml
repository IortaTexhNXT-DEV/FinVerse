  - {n: 2, bibs: 'Quotation rated with the Appendix A formulas, versioned, approved before it is sent', measure: 'Approval before send'}
  - {n: 3, bibs: 'PRF workflow: TSU slips per insurer, insurer terms keyed once, comparative compiled by BIBS', measure: 'Comparative not re-keyed'}
  - {n: 4, bibs: 'Prospect, KYC documents, verification by a second user, then confirmed client', measure: 'Four-eyes KYC'}
  - {n: 5, bibs: 'One ARN per account; workflow stage; duplicate check at creation', measure: 'Duplicates stopped at entry'}
  - {n: 6, bibs: 'CLPC billing file produced and payment report matched in BIBS', measure: 'Matching automated'}
  - {n: 7, bibs: 'Slips, hold cover requests and e-policies generated, password protected and logged', measure: 'Send log per document'}
  - {n: 8, bibs: 'Booking posts invoice, GL entry and service invoice in one transaction; batch at 20:00', measure: 'One step instead of three'}
  - {n: 9, bibs: 'Dashboards and status reports read the workflow history', measure: '10 s response (p.211)'}
gaps:
  - {sev: High, gap: Quotation before the client exists, impact: Walk-in and bank-referred prospects may not be quotable, owner: Marketing / Product Owner, decision: 'May BIBS create a prospect code at quotation (BRNB.029 vs 063)?', ref: DCR-001}
  - {sev: High, gap: Fire premium tax rate and base, impact: Gross premium on every Fire quotation and invoice, owner: Comptrollership, decision: 'Which taxes, rates and bases apply to Fire?', ref: DCR-005}
  - {sev: High, gap: Motor OD / Theft base 81% or 90% of TSI, impact: Motor premium differs by 9 points of TSI, owner: Marketing / TSU, decision: When each base applies, ref: DCR-006}
  - {sev: High, gap: CLPC payments and endorsements specified twice, impact: Two payment intakes and two endorsement paths, owner: 'NB and Operations', decision: Confirm Cashiering as the single payment intake and Adjustment for endorsements, ref: DCR-027}
  - {sev: High, gap: Sanctions match blocks or warns, impact: Business placed with a possible sanctioned party, owner: Compliance, decision: Block or warn on quotation to booking, ref: DCR-112}
  - {sev: Parked, gap: 'HLS, mailbox, insurer SFTP / API, OCR', impact: Uploads and manual capture remain, owner: BDO IT and insurers, decision: Interface specifications, ref: 'Q11, Q12, Q06, Q24'}
best:
