  - {practice: KYC at onboarding and a single client view, status: BIBS, bibs: 'Prospect to confirmed client with four-eyes KYC; one client record for every module.', bdoi: 'Confirm the BDO KYC standard fields, CIF and duplicate keys (Q16, Q17).'}
  - {practice: Maker-checker on client documents, status: BIBS, bibs: 'Approval before a quotation, PRF or slip is sent; maker cannot approve.', bdoi: 'Set the approval chain and limits (Q05).'}
  - {practice: Protected digital documents, status: PARTLY, bibs: 'Password-protected PDF and Excel, password sent separately, send log.', bdoi: 'Agree the password convention (DCR-153).'}
  - {practice: Screening before binding, status: PARTLY, bibs: 'Screening on client creation and account submission (BRD-10 design).', bdoi: 'Decide block or warn while a match is open (DCR-112).'}
  - {practice: Production KPIs against target, status: ADOPT, bibs: 'Dashboard by region, department, team and officer.', bdoi: 'Provide the sales hierarchy and targets (Q41).'}
