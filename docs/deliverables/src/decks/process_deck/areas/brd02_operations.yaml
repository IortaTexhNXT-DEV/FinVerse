    - {id: b2, lane: csh, col: 1, text: AR from branch series; bank file upload}
    - {id: b3, lane: bibs, col: 2, text: Matched to invoice; applied by component, kind: auto}
    - {id: b4, lane: csh, col: 2, text: 'Unapplied workbench: apply, refund'}
