# Operations (BRD-2): chapter 7 of the business process reverse KT deck (Part C, Operations).
# Sources: floor walk 23-Sep-2026 (Cashiering, Remittance, Adjustment / Collateral Release, Production Reconciliation)
# and discovery sessions 21 and 23-Sep-2026 (floor-walk notes CA-, CM-, IC-, EN-, OV-03, TX-02); BDOI Day 1 overview
# p.20-25; high-level Operations process flow confirmed by the process owners; "Operations.pdf" p.10-13 and annex
# p.115-120; discrepancy register (DCR-013, 014, 015, 025, 027, 028); open questions OQ01-OQ49.
id: brd02
key: ops
num: 7
title: Operations
brd: BRD-2
scope: 'Cashiering, Remittance, Adjustment, Commission receivables, Production Reconciliation, DPPR / PR2307 reversal, invoicing'
department: Operations (Financial Transactions and Processing)
roles:
  - Cashiers at head office (11) and branches (5); Cashiering TL / TH
  - Remittance Processor (4) and TL / TH
  - Adjustment / Collateral Release Processor (6) and TL / TH (checker-poster)
  - Production Reconciliation Handler (4); CRU (Commission Receivable Unit)
  - IT (monthly extracts, reversal files, Autopay)
  - Marketing, Comptrollership, Disbursement (hand-offs)
figures:
  - ['~55', 'insurer partners, each settled and reconciled separately (OV-01)']
  - ['20-30K', 'production lines per insurer a month to reconcile (Day 1 p.24)']
  - ['~2,000', 'records in one bulk payment file (CA-05)']
  - ['4 days', 'check hold before a payment is applied (Cashiering flow)']
session:
  when: '23-Sep-2026, 1:00-5:00 pm, 44F; discovery 21 and 23-Sep-2026'
  pocs: 'Perjelyn Joy Gutierrez, Shirley Catapang, Ronna Marie Go, Aimee Medina, Renque Galos, Carolyn Pasia Baloto, Joy Ebuenga, Mark Andrew Francisco'
sources:
  - 'High-level Operations process flow (Cashiering, Remittance, Adjustment, Commission receivables, Production recon, DPPR / PR2307 reversal, Invoicing)'
  - BDOI Day 1 overview p.20-25
  - 'BRD-2 p.10-13; CSHID, RMTID, PRCID, ADJID, CMRID, MKTID, DBMID'
chevrons: [Payment files, Checks, Split and apply, Receipts, Remittance, Disbursement, Insurer OR, Reconciliation]
notes:
  glance: >-
    Operations takes over every invoice booked by Processing and follows its money until the insurer is paid, the
    insurer's official receipt is recorded and every difference is closed. BDOI collects premium on behalf of about
    55 insurers and remits it net of its commission. Seven sub-processes run side by side: Cashiering, Remittance,
    Adjustment and Cancellation, Commission receivables for direct-payment policies, Production Reconciliation,
    DPPR / PR2307 reversal and policy-fee invoicing. The floor walk added the volumes the BRD does not give (OQ44,
    DCR-025): 20-30 thousand production lines per insurer a month and bulk payment files of about 2,000 records.
  heard: >-
    The notes of the discovery sessions (21 and 23-Sep) and of the Operations floor walk (23-Sep). Joy was the
    single point of contact for the Cashiering items.
  pains: >-
    The twelve points combine the six current-process items of BRD-2 (p.11) with what the process owners showed on
    the floor. Points 1 to 7 are on the Cashiering and Remittance swimlane, 8, 11 and 12 on the Commission and
    Adjustment swimlane, 9 and 10 on the Reconciliation and Reversal swimlane.
  after: >-
    The BRD states the target (unified operations, scheduled extraction, automatic matching, validated entries,
    tracking) without turnaround targets; the benefit column names the control or the effort the To-Be removes.
  missed: >-
    Items the floor walk showed that BRD-2 does not state, or states differently. The first two are true gaps; the
    others are rules or values the BRD must carry. Each becomes a register item (DCR) or an answer to an open question.
heard:
  - {ref: OV-03, kind: pain, topic: Three references, asis: 'One transaction carries three numbers: ISYS invoice no., QPS reference and EBIX reference, plus the payment reference. QPS holds all three.', want: 'One reference across the lifecycle (to confirm).'}
  - {ref: CA-01, kind: pain, topic: Receipts, asis: 'The client pays against the ISYS invoice number; QPS has the insurer reference and EBIX its own. Receipts are created by hand.', want: 'Receipts generated by the system.'}
  - {ref: CA-02, kind: rule, topic: Threshold account, asis: 'Amounts below PHP 0.99 go to a separate adjustment (threshold) account, e.g. the .99 of 8,787.99.', want: 'Threshold and variance handling configurable.'}
  - {ref: CA-03, kind: pain, topic: Direct pay, asis: 'A direct-pay policy is tagged, so only commission entries exist. If the insured still pays BDOI, no accounting entry is created.', want: 'A solution, e.g. allow the direct-pay tag to be changed.'}
  - {ref: CA-04, kind: rule, topic: Receipt types, asis: 'Two receipts: AR to the client for premium, OR to the insurer for commission.', want: 'Both AR and OR generated from the system.'}
  - {ref: CA-05, kind: asis, topic: Bulk payment, asis: 'Bulk payment files of about 2,000 records.', want: 'Walk through bulk payment on the floor (open point).'}
  - {ref: 'Day 1 p.20', kind: asis, topic: Payment files, asis: 'Bills Payment, CLPC, PMS, Trade, Direct Credit and FS04 files; 4-day check hold, bounced-check list, QPS / EBIX reference and zero-PR checks; exact, excess or actual-payment files; Autopay; unapplied report.'}
  - {ref: 'Day 1 p.21', kind: asis, topic: Remittance, asis: 'Weekly EBIX extract of applied payments (Monday to Friday); DPPR reversal, endorsement / knock-off and invalid accounts removed; settlement approved on an MS Teams list; signed copy kept for audit; Disbursement posts.'}
  - {ref: EN-01, kind: want, topic: Endorsement, asis: 'Marketing e-mails the request with documents; Operations validates, keys it in the EBIX endorsement module; TL / TH checker-poster; posting one by one; entries flow to Comptrollership.', want: 'Endorsement computes the premium from the adjustment, like New Business, not just captures it.'}
  - {ref: EN-02, kind: open, topic: Cancellation, asis: 'Cancellation with refund of premium including applicable tax.', want: 'Tax treatment on refund to confirm (FRS).'}
  - {ref: CM-01, kind: rule, topic: Commission trigger, asis: 'Commission is confirmed from premium collected (Collections) and only after the full premium is collected, also for instalment and multi-year policies.'}
  - {ref: CM-02, kind: rule, topic: Co-insurance, asis: 'Co-insurance: commission can be processed when one insurer has paid. Direct policy: partial commission payment is not accepted.'}
  - {ref: CM-03, kind: rule, topic: Excess commission, asis: 'Excess commission is computed differently for Motor and Fire and kept in the incentive module.'}
  - {ref: IC-01, kind: rule, topic: Early-remittance incentive, asis: 'Insurers pay an incentive for early remittance, only on premium sold within credit terms. Rates agreed with each insurer; posted to Other Income (IC-02).', want: 'Incentive by insurer to walk through (open point).'}
  - {ref: 'Day 1 p.23-24', kind: pain, topic: 'DP commission, reversal', asis: 'DP lists per unit in a shared folder, consolidated in Excel, billed by e-mail; production recon of 20-30K lines per insurer; DPPR / PR2307 reversal through SharePoint, Teams, IT extract and VLOOKUP, with a 0.01-0.99 variance.'}
asis:
  caption: 'Cashiering and Remittance today (Operations process flow; Day 1 p.20-21; CA-01 to CA-05)'
  notes: >-
    Payment files arrive from bills payment, CLPC, PMS (post-dated checks), Trade, direct credit and the FS04 batch;
    cash is received at the counter. Before a payment is applied the cashier checks the 4-day hold on checks, the
    bounced-check list and the exclusion list, and whether the account is in QPS with an EBIX reference. Zero-PR
    accounts are tagged, and exact-payment, excess-payment and actual-payment files are built before upload or
    Autopay; items that do not apply end in the unapplied report. Receipts (AR to the client, OR to the insurer) are
    prepared by hand. When a direct-pay policy is paid to BDOI no premium entry is created (CA-03). Every week
    Remittance extracts the applied payments of Monday to Friday from EBIX, removes DPPR reversals, knock-offs and
    invalid accounts in Excel, and has the settlement list approved on an MS Teams list with a signed copy kept for
    audit; Disbursement then posts and pays the insurer.
  cols: 7
  lanes:
    - {id: cli, label: 'Clients, banks, CLPC, PMS', kind: external}
    - {id: csh, label: Cashiering}
    - {id: rem, label: Remittance}
    - {id: dis, label: Disbursement}
    - {id: sys, label: 'EBIX, QPS, ISYS, Excel, Teams', kind: system}
  steps:
    - {id: a1, lane: cli, col: 1, text: 'Pays: bills payment, OTC, CLPC, Trade, direct credit', kind: external}
    - {id: a2, lane: csh, col: 1, text: Payment files and cash received}
    - {id: a3, lane: csh, col: 2, text: '4-day hold, bounced-check and exclusion lists checked', pain: [1]}
    - {id: a4, lane: sys, col: 2, text: 'In QPS with an EBIX reference?', kind: legacy, pain: [2]}
    - {id: a5, lane: csh, col: 3, text: 'Zero PR tagged; exact / excess pay files in Excel', pain: [3]}
    - {id: a6, lane: sys, col: 4, text: 'Upload or Autopay; DP-tagged pay gets no entry', kind: legacy, pain: [5]}
    - {id: a7, lane: csh, col: 4, text: 'AR / OR by hand; unapplied report', pain: [4]}
    - {id: a8, lane: sys, col: 5, text: 'Weekly EBIX extract, Mon-Fri applied', kind: legacy}
