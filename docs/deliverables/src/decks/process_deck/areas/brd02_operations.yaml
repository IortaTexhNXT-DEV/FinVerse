asis_extra:
  - caption: 'Commission receivables (direct payment), Adjustment and policy-fee invoicing today (Operations process flow; Day 1 p.22-23, 25; EN-01)'
    notes: >-
      When a client pays the insurer directly, BDOI's commission is still due. Each unit lists these direct-payment
      (DP) transactions in a shared folder; the CRU consolidates the lists in Excel, removes duplicates and validates
      them against production reports and commission trackers, bills each insurer by e-mail and follows up by e-mail,
      phone and messaging. When the insurer pays, the CRU asks Cashiering for the OR, sends it to the insurer and
      prepares the DP reversal by hand. Endorsements and cancellations start with an e-mail from Marketing; Operations
      checks the documents, keys the request in the EBIX endorsement module and the TL or TH checks and posts each one
      individually; the entries flow to Comptrollership. Policy-fee (service) invoices are keyed in the EBIX report
      menu from the schedule of the requestor. Reports are requested from IT.
    cols: 7
    lanes:
      - {id: mkt, label: 'Marketing, business units'}
      - {id: cru, label: 'CRU, Collections'}
      - {id: ins, label: Insurers, kind: external}
      - {id: ops, label: 'Adjustment TL / TH'}
      - {id: csh, label: 'Cashiering, Comptrollership'}
      - {id: sys, label: 'EBIX, Excel, shared folder', kind: system}
    steps:
