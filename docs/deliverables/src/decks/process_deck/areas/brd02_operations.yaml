tobe:
  caption: 'Life of a booked invoice in BIBS: Cashiering, Remittance, Reconciliation, Adjustment, Commission (FRS BRD-2 section 2.2)'
  notes: >-
    In BIBS the booked invoice is copied into the invoice ledger with its components. The cashier issues an AR from
    the branch series; BIBS matches the payment to the invoice and applies it by component, and money it cannot apply
    goes to the unapplied workbench. A scheduled job extracts paid, cleared and eligible premium into batches per
    insurer and type; the TL approves the batch (four eyes), which posts the remittance, issues the commission OR and
    raises the payment request to Disbursement. The insurer's OR schedule is uploaded. The production register goes to
    the insurer and its feedback is matched within a 1.00 tolerance. Endorsements are requests recomputed per insurer
    and approved; direct-payment accounts are billed per insurer against a 10-working-day SLA.
  cols: 6
  lanes:
    - {id: cli, label: 'Clients, banks', kind: external}
    - {id: csh, label: Cashiering}
    - {id: rem, label: 'Remittance, Recon'}
    - {id: adj, label: 'Adjustment, Commission'}
    - {id: ins, label: Insurers, kind: external}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
  steps:
    - {id: b1, lane: cli, col: 1, text: 'Pays: counter, bank file, PDC', kind: external}
    - {id: b2, lane: csh, col: 1, text: AR from branch series; bank file upload}
    - {id: b3, lane: bibs, col: 2, text: Matched to invoice; applied by component, kind: auto}
    - {id: b4, lane: csh, col: 2, text: 'Unapplied workbench: apply, refund'}
    - {id: b5, lane: bibs, col: 3, text: Scheduled extraction into batches, kind: auto}
    - {id: b6, lane: rem, col: 3, text: Batch reviewed; TL approves}
    - {id: b7, lane: bibs, col: 4, text: 'Commission OR; payment request, DV', kind: auto}
    - {id: b8, lane: ins, col: 4, text: Paid; OR schedule returned, kind: external}
    - {id: b9, lane: rem, col: 5, text: Insurer feedback matched (1.00)}
    - {id: b10, lane: adj, col: 5, text: Endorsement recomputed and approved}
    - {id: b11, lane: adj, col: 6, text: DP billed per insurer; 10-day SLA}
    - {id: b12, lane: bibs, col: 6, text: Reports and exports by users, kind: doc}
  edges:
