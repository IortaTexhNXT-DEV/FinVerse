  - caption: 'Production reconciliation and DPPR / PR2307 reversal today (Operations process flow; Day 1 p.24)'
    notes: >-
      In the first week of each month IT extracts the accounts booked in the previous month. Operations filters the
      file per insurer, protects it with a password and e-mails it. The insurer marks matched accounts and
      discrepancies and adds a file of accounts it has but BDOI has not booked; the handler classifies 20-30 thousand
      lines per insurer as matched, matched with discrepancies or unbooked, sends the unbooked and discrepancy files to
      Marketing and Processing and keeps a ManCom masterlist in Excel. For the DPPR / PR2307 reversal the CRU uploads
      a reversal list to SharePoint and notifies IT on Teams; IT extracts the reversal and knock-off file; Cashiering
      matches it by invoice number with a VLOOKUP and a variance of 0.01 to 0.99, posts the EBIX sub-ledger reversal
      and the commission knock-off, copies the journal register to Excel and creates a zero-value remittance workfile
      for Disbursement.
    cols: 7
    lanes:
      - {id: it, label: IT}
      - {id: ops, label: 'Recon handler, Cashiering'}
      - {id: cru, label: CRU}
      - {id: ins, label: Insurers, kind: external}
      - {id: mp, label: 'Marketing, Processing'}
      - {id: sys, label: 'EBIX, Excel, SharePoint, Teams', kind: system}
    steps:
      - {id: d1, lane: it, col: 1, text: 'Monthly extract of prior-month bookings', pain: [9]}
      - {id: d2, lane: ops, col: 2, text: 'Filtered per insurer; password; e-mail', pain: [9]}
      - {id: d3, lane: ins, col: 3, text: 'Marks matched, discrepancy; adds unbooked', kind: external}
      - {id: d4, lane: ops, col: 4, text: 'Classifies 20-30K lines per insurer', pain: [9]}
      - {id: d5, lane: mp, col: 5, text: 'Books unbooked; ManCom list in Excel'}
      - {id: d6, lane: cru, col: 3, text: 'Reversal list to SharePoint; Teams notice', pain: [10]}
      - {id: d7, lane: it, col: 4, text: Extracts the reversal / KO file}
      - {id: d8, lane: ops, col: 6, text: 'VLOOKUP by invoice; variance 0.01-0.99', pain: [10]}
      - {id: d9, lane: sys, col: 6, text: 'EBIX SL reversal and commission knock-off', kind: legacy}
      - {id: d10, lane: ops, col: 7, text: Zero-value remittance workfile, pain: [10]}
      - {id: d11, lane: sys, col: 7, text: Journal register copied to Excel, kind: legacy}
