  - {sev: High, gap: Three minimal-balance rules, impact: Small balances post to different GL accounts, owner: 'Operations, Comptrollership', decision: 'One rule at 10.00; GL accounts; who approves write-off', ref: DCR-014}
  - {sev: High, gap: Paid AR above the DTIP balance, impact: Remittance capped or withheld, owner: Operations, decision: 'Remit the DTIP balance or exclude the account', ref: DCR-015}
  - {sev: High, gap: CWT 2307 cash payments without entries, impact: GL entries for CWT unclear, owner: Comptrollership, decision: 'Give the entries and when Dr DTIP / Cr PR2307 posts', ref: DCR-028}
  - {sev: High, gap: CLPC payments and endorsements also in BRD-1, impact: Two payment intakes and two endorsement paths, owner: 'Operations and NB', decision: Confirm Cashiering and Adjustment as owners, ref: DCR-027}
