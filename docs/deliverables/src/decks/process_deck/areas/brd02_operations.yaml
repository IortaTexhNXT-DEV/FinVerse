tobe:
  caption: 'Life of a booked invoice in BIBS: Cashiering, Remittance, Reconciliation, Adjustment, Commission (FRS BRD-2 section 2.2)'
  notes: >-
    In BIBS the booked invoice is copied into the invoice ledger with its components. The cashier issues an AR from
    the branch series; BIBS matches the payment to the invoice and applies it by component, and money it cannot apply
    goes to the unapplied workbench. A scheduled job extracts paid, cleared and eligible premium into batches per
    insurer and type; the TL approves the batch (four eyes), which posts the remittance, issues the commission OR and
    raises the payment request to Disbursement. The insurer's OR schedule is uploaded. The production register goes to
    the insurer and its feedback is matched within a 1.00 tolerance. Endorsements are requests recomputed per insurer
    and approved; direct-payment accounts are billed per insurer against a 10-working-day SLA.
  cols: 6
