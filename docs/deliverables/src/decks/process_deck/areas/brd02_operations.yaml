      - {id: c2, lane: cru, col: 2, text: 'Consolidated and validated in Excel', pain: [8]}
      - {id: c3, lane: ins, col: 3, text: 'Billed by e-mail; follow-up by phone, chat', kind: external}
      - {id: c4, lane: cru, col: 4, text: 'Paid: OR requested, tracker updated'}
