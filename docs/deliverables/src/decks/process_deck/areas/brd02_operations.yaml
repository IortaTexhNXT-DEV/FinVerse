notes:
  glance: >-
    Operations takes over every invoice booked in New Business and follows its money until the insurer is paid, the
    insurer's official receipt is recorded and every difference is closed. BDOI collects premium on behalf of insurers
    and remits it net of its commission (BRD-2 p.11). The modules are built; FRS BRD-2 describes the delivered screens.
    The BRD gives users and response times but no transaction volumes (OQ44). The annex names 11 head-office and 5 branch
    cashiers, 4 remittance processors, 4 reconciliation handlers and 6 adjustment processors, plus team leads.
  pains: The six points are the six "current process" items of the BRD (p.11), in the same order.
  after: >-
    The BRD states the target (unified operations, scheduled extraction, auto-matching, validated entries, tracking)
    without turnaround targets; the measures are the controls BIBS adds.
  gaps: >-
    Most Operations gaps are rules that the BRD states twice or leaves open. BIBS builds a documented default behind a
    parameter, so the answer is a configuration change (FRS BRD-2 section 1.6).
asis:
  caption: 'Payment to insurer today (BRD-2 p.11)'
  notes: >-
    Today receipts are issued by hand and payment details are not visible; payment application is fragmented.
    Remittances are extracted manually with no tracking of batches and no check of what is not for remittance. Booked
    accounts are matched with insurer reports by hand. Endorsements go through redundant steps with manual
    computation. Reports depend on IT, and direct-payment commission receivables are gathered, cleaned and billed by
    hand (BRD-2 p.11, current process items 1-6).
