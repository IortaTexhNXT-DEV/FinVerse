    - {id: a2, lane: tsu, col: 2, text: Quotation slips e-mailed, pain: [2]}
    - {id: a3, lane: ins, col: 3, text: Reply by e-mail with terms, kind: external, pain: [3]}
    - {id: a4, lane: sys, col: 3, text: Comparative compiled in Excel, kind: legacy, pain: [4]}
    - {id: a5, lane: mgt, col: 4, text: Sign-off and advisory by hand, pain: [5]}
    - {id: a6, lane: sys, col: 4, text: Documents sent without password, kind: legacy, pain: [6]}
    - {id: a7, lane: sys, col: 5, text: History kept in e-mail threads, kind: legacy, pain: [8]}
    - {id: a8, lane: sys, col: 6, text: Expiry watched in spreadsheets, kind: legacy, pain: [7]}
    - {id: a9, lane: mkt, col: 6, text: Renewal asked for when noticed}
