tobe:
  caption: 'Package lifecycle in BIBS: workflow PM_PACKAGE_REQUEST (FRS BRD-3 sections 2.2 and 5)'
  notes: >-
    In BIBS Marketing logs the Package Request Form, which BIBS numbers PKR-yyyy-n. A Marketing TL, TH or UH approves
    it (never the maker); the TSU TL recommends and the TSU Head approves. TSU prepares the quotation slips, which are
    approved and e-mailed per insurer, protected and logged. Insurer responses are keyed in with their outcome, over as
    many rounds as needed. BIBS keeps one comparative master per request and derives client views from it. ManCom
    signs off, which locks the slips; MBS creates the package version and the TSU Head or Business Administrator
    releases it. The advisory is drafted on release and sent with the signed package slip. A daily job raises expiry
    alerts and can draft the renewal request.
  cols: 7
  lanes:
    - {id: mkt, label: Marketing AO / TL}
    - {id: tsu, label: TSU}
    - {id: ins, label: Insurers, kind: external}
    - {id: mgt, label: 'ManCom, MBS, TSU Head'}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
  steps:
    - {id: b1, lane: mkt, col: 1, text: 'Package Request Form (PKR-yyyy-n)'}
    - {id: b2, lane: mkt, col: 2, text: TL approves; never the maker}
    - {id: b3, lane: tsu, col: 2, text: TSU TL recommends; Head approves}
    - {id: b4, lane: bibs, col: 3, text: Slips sent protected per insurer, kind: doc}
    - {id: b5, lane: ins, col: 4, text: Responds with terms, kind: external}
    - {id: b6, lane: tsu, col: 4, text: Terms keyed per round}
    - {id: b7, lane: bibs, col: 5, text: Comparative master and client views, kind: auto}
    - {id: b8, lane: mgt, col: 5, text: ManCom signs off; slips lock}
    - {id: b9, lane: mgt, col: 6, text: MBS set-up; TSU Head releases}
    - {id: b10, lane: bibs, col: 6, text: Advisory with signed package slip, kind: doc}
    - {id: b11, lane: bibs, col: 7, text: Daily expiry alerts; renewal draft, kind: auto}
    - {id: b12, lane: mkt, col: 7, text: Package used in quotations}
  edges:
    - [b1, b2]
    - [b2, b3]
    - [b3, b4]
    - [b4, b5, dashed, e-mail + log]
    - [b5, b6]
    - [b6, b7]
    - [b7, b8]
