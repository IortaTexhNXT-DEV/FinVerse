  - {sev: High, gap: Password convention for documents, impact: Clients and insurers cannot open files without a known rule, owner: 'MBS, Information Security', decision: Password rule per document type, ref: DCR-153}
  - {sev: Medium, gap: Role-to-action matrix; ManCom decision rule, impact: Approval routing and persona tests, owner: 'MBS and TSU', decision: 'Approve the matrix; ManCom membership and quorum', ref: DCR-035}
  - {sev: Medium, gap: Non-package product maintenance, impact: Scope of the module, owner: MBS, decision: Confirm out of scope for this phase, ref: DCR-036}
  - {sev: Medium, gap: BRQID.008 dropped without a revision entry, impact: Renewals repriced without client evidence, owner: MBS, decision: Confirm BRRN.038 now governs, ref: DCR-030}
