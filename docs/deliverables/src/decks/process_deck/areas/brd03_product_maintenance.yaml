chevrons: [Request, Completeness, Risk review, Quotation slip, Insurers, Comparative, Sign-off, Set-up and release]
notes:
  glance: >-
    TSU is the technical desk between Marketing and the insurers. Marketing decides whether a customer need is served
    by a package (fixed rates and conditions that BDOI designs and the insurer follows) or a non-package placement (terms
    negotiated per deal). TSU checks the request, assesses the risk, prepares the quotation slip, refers large or
    special risks to Reinsurance, negotiates with insurers, builds the comparative and prepares the proposal and
    sign-off. Packages are then set up by MBS and IT and released with an advisory. Product maintenance was named a key
    pain point (PM-01).
  heard: Notes of the business overview (21-Sep), the Product Maintenance floor walk (22-Sep) and the 25-Sep session.
  pains: 'The eight points of the BRD-3 current process (p.12-13); the TSU process flow confirms them and adds the reinsurance loop.'
  after: 'The benefit column names what the To-Be removes.'
  missed: 'Non-package product maintenance is out of BRD-3; the reinsurance referral has no requirement in phase 1.'
heard:
  - {ref: PM-01, kind: want, topic: Package and non-package, asis: 'Marketing decides package or non-package from the customer need; BDOI defines the product and the insurer follows.', want: 'Product maintenance in the system for both package and non-package.'}
  - {ref: PM-02, kind: rule, topic: Design and rates, asis: 'Marketing gives the requirement; the product team designs and negotiates with the insurer, incl. incentives for packages; commission rate as agreed by Marketing.', want: 'Package = fixed rates and conditions; non-package rates differ per deal.'}
  - {ref: PM-03, kind: pain, topic: Package set-up, asis: 'Packages are defined and maintained manually, starting from a customer-specific requirement of Marketing.', want: 'Packages defined and maintained in the system.'}
  - {ref: PM-04, kind: want, topic: Change at renewal, asis: 'At renewal a policy can move from package to non-package or back.', want: 'Allow the switch at renewal.'}
  - {ref: NB-08, kind: rule, topic: TSU step, asis: 'Non-package: the request goes to TSU before the quotation; once the customer accepts, to Placement.'}
  - {ref: 'TSU flow', kind: pain, topic: Tracking and evidence, asis: 'Request encoded in an Excel monitoring file; acceptance evidence (signed slip, stamped slip or explicit e-mail) checked by hand; placement status tracker kept by hand; comparative table built manually in Excel.'}
  - {ref: 'TSU flow', kind: asis, topic: Reinsurance loop, asis: 'Large sum insured, special risks or non-standard cover go to the Reinsurance team; RI comments come back to Marketing, who revises terms or closes the request.'}
  - {ref: 'TSU flow', kind: pain, topic: Set-up dependency, asis: 'Package creation needs a maintenance request to MBS / IT; screenshots kept as evidence; TSU validates rates and conditions; release advisory to Marketing, Operations and TSU.'}
asis:
  caption: 'Package set-up today (BRD-3 p.12-13)'
  notes: >-
    Marketing asks TSU for a package placement by e-mail with a TSU request form. TSU prepares quotation slips and
    e-mails them to insurers, who reply by e-mail with signed slips or approved terms. The comparative table is compiled
    in Excel and shared by e-mail. Sign-off and advisories are manual, documents go out without password protection,
    package expiry is watched in spreadsheets or calendars, and changes and approvals are tracked in e-mail threads.
  cols: 6
  lanes:
