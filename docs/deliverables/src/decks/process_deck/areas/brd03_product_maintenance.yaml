chevrons: [Request, Approval, TSU review, Negotiation, Comparative, ManCom, Set-up, Release]
notes:
  glance: >-
    A package is a pre-arranged programme whose terms, rates and conditions BDOI negotiates with one or more insurers
    and then offers through Marketing. Product Maintenance feeds the products and package versions that quotations,
    accounts and booking read. It is built; FRS BRD-3 is the reference FRS for the pack. The BRD states no volumes
    (the project assumes tens of package requests a month).
  pains: The eight points are the current-process rows of the BRD (p.12-13).
  after: No turnaround targets are given in the BRD; the measures are the controls BIBS adds.
  gaps: The High incentive item is shared with BRD-2, BRD-4 and BRD-5; the criteria are kept once in Product Maintenance.
asis:
  caption: 'Package set-up today (BRD-3 p.12-13)'
  notes: >-
    Marketing asks TSU for a package placement by e-mail with a TSU request form. TSU prepares quotation slips and
    e-mails them to insurers, who reply by e-mail with signed slips or approved terms. The comparative table is compiled
    in Excel and shared by e-mail. Sign-off and advisories are manual, documents go out without password protection,
    package expiry is watched in spreadsheets or calendars, and changes and approvals are tracked in e-mail threads.
  cols: 6
  lanes:
