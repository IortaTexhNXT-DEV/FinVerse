  - {n: 2, title: Follow-up by hand, text: 'New bookings within 10-15 days, commitment within 60 days, tracked by the handler.', ref: 'CMS BRD p.40-41, steps 3-4'}
  - {n: 3, title: CTE and escalation by e-mail, text: 'The AO asks the insurer for a credit term extension and escalates to the Unit Head.', ref: 'CMS BRD p.40-41, step 5'}
  - {n: 4, title: Dispositions kept by hand, text: 'Day-60 disposition, category A / B / C and remarks are updated manually.', ref: 'CMS BRD p.40-41, steps 6-7'}
  - {n: 5, title: Payment status by channel, text: 'Deposit with Cashiering, bills payment on the Unapplied screen, direct payment with the insurer.', ref: 'CMS BRD p.40-41, step 8'}
  - {n: 6, title: 2307 tagging handed over, text: 'A net-of-CWT payment stays a Marketing action until the BIR 2307 is collected.', ref: 'CMS BRD p.40-41, step 9'}
