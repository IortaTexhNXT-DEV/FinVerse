chevrons: [Booking, Nightly refresh, Assignment, Follow-up, Promise, Escalation, Disposition, Hand-off]
notes:
  glance: >-
    Collections follows unpaid premium receivables (PR) until they are paid, reversed or cancelled. The CMS BRD
    describes a separate application fed nightly from EBIX and QPS; in BIBS it is a module that reads the Operations
    invoice ledger and hands work to Cashiering and Commission inside the application. It posts no money itself.
    The module is in build; there is no FRS yet, so this chapter uses the requirements baseline and the design.
  pains: 'Steps 1-10 of the current process (CMS BRD p.40-41) and the handler''s other tasks (p.40).'
  after: 'The CMS BRD gives volume and response targets (NFR 15.01-15.14) but no collection-rate targets.'
  gaps: >-
    BRCLXN.061-064 appear only in the unsigned draft of the workshop addendum; they are designed as Draft and built only
    after BDOI confirms them (CQ01). The Operations Head's caveat on exports (p.93) is met by asynchronous,
    permission-gated exports.
asis:
  caption: 'Premium receivable follow-up today (CMS BRD p.40-41)'
  notes: >-
    Today the AO records the client's payment instruction in the Marketing Diary in ISYS. The Collection Handler takes
    the outstanding-PR list of the market segment from EBIX and follows up each account as the diary says: new
    bookings within 10 to 15 days, a payment commitment within 60 days. A commitment outside the credit term goes to the
    AO, who asks the insurer for a credit term extension and escalates to the Unit Head by e-mail. On day 60 without a
    commitment the handler sets a disposition and the A / B / C tag. Payment status is checked by channel with
    Cashiering, the Unapplied screen or the insurer. CWT 2307 tagging moves from Marketing to Operations by hand, and
    Operations extracts the Direct Payment report every month for PR reversal.
  cols: 6
  lanes:
    - {id: cli, label: Client, kind: external}
    - {id: mkt, label: Marketing AO}
    - {id: hdl, label: Collection Handler}
    - {id: ops, label: 'Operations, Cashiering'}
    - {id: sys, label: 'EBIX, QPS, ISYS, Excel', kind: system}
  steps:
    - {id: a1, lane: mkt, col: 1, text: Client instruction noted}
    - {id: a2, lane: sys, col: 1, text: Marketing Diary in ISYS, kind: legacy}
    - {id: a3, lane: sys, col: 2, text: PR list from EBIX by segment, kind: legacy, pain: [1]}
    - {id: a4, lane: hdl, col: 2, text: Follows up as the diary says, pain: [2]}
    - {id: a5, lane: cli, col: 3, text: Commitment within 60 days, kind: external}
    - {id: a6, lane: mkt, col: 3, text: CTE and escalation by e-mail, pain: [3]}
    - {id: a7, lane: hdl, col: 4, text: 'Day 60: disposition, A/B/C tag', pain: [4]}
    - {id: a8, lane: ops, col: 4, text: Payment status checked by channel, pain: [5]}
    - {id: a9, lane: hdl, col: 5, text: 2307 tag handed over by hand, pain: [6]}
    - {id: a10, lane: ops, col: 6, text: Monthly DP report for reversal, pain: [7]}
    - {id: a11, lane: hdl, col: 6, text: Cheque pick-up; 2307 printed, pain: [8]}
  edges:
