tobe:
  caption: 'Collections in BIBS: worklist, promises, escalation (workflow CLX_ESCALATION) and hand-offs (design COLLECTIONS_DESIGN)'
  notes: >-
    In BIBS a nightly job after the 22:00 end of day turns every invoice with PR above the threshold into a collection
    item, refreshes existing items and closes items at zero, keeping their history. The TL assigns items by rule
    (segment, unit, client). The handler records efforts, promises per installment, the collector disposition and the A
    / B / C category on the item, with the Marketing Diary in view. Rules escalate by ageing, commitments and broken
    promises to the TL / UH queue. Dispositions for Operations become in-app requests: "PR 2307 for reversal" to
    Cashiering, "DP PR for reversal" to Commission, "for check pick-up" to the Cashiering queue. The monthly and weekly
    files are produced on schedule, and billing statements are issued per billing cycle of multi-year policies.
  cols: 6
  lanes:
    - {id: cli, label: Client, kind: external}
    - {id: hdl, label: 'Collection Handler, AO'}
    - {id: tl, label: 'TL, Unit Head'}
    - {id: ops, label: 'Cashiering, Commission'}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
  steps:
    - {id: b1, lane: bibs, col: 1, text: Nightly refresh; balance on each payment, kind: auto}
    - {id: b2, lane: tl, col: 2, text: Items assigned by rule}
    - {id: b3, lane: hdl, col: 2, text: 'Worklist: efforts, diary view'}
    - {id: b4, lane: cli, col: 3, text: Promise per installment; pays, kind: external}
    - {id: b5, lane: hdl, col: 3, text: Promise and disposition recorded}
    - {id: b6, lane: bibs, col: 4, text: Escalation by ageing and broken promise, kind: auto}
    - {id: b7, lane: tl, col: 4, text: TL / UH escalation queue}
    - {id: b8, lane: hdl, col: 5, text: '2307, DP reversal, pick-up requests'}
    - {id: b9, lane: ops, col: 5, text: Request acted on in Cashiering / Commission}
    - {id: b10, lane: bibs, col: 6, text: 'Scheduled files; SOA per billing cycle', kind: doc}
  edges:
