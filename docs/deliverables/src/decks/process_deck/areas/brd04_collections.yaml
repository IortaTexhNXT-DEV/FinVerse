notes:
  glance: >-
    Collections follows every unpaid premium from booking until the payment is confirmed and handed to Cashiering. It
    is relationship-driven: the Marketing AO owns the client and records the client's payment instruction in the
    Marketing Diary; the Collection Handler follows up, secures a payment commitment and checks the credit term, and
    the AO asks the insurer for a credit term extension (CTE) when the client needs more time. Premium and commission
    collection are tracked today in ICS, the Internal Collection System, a call-centre style tool fed from EBIX.
  heard: Notes of the Collections floor walk (22-Sep) and of the Collections and Commission session (24-Sep).
  pains: >-
    Points 1 to 8 are the steps of the current process in BRD-4 (p.40-41), which the Marketing Collections flow
    confirms; points 9 and 10 were raised on the floor.
  after: The benefit column names the control or the effort the To-Be removes.
  missed: >-
    The credit policy is the one true gap: it drives the follow-up days, the CTE and the cancellation for non-payment.
heard:
  - {ref: CO-01, kind: pain, topic: Outstanding per client, asis: 'Collection information is captured in a separate system; the outstanding amount per customer is not shown properly.', want: 'The correct outstanding amount per customer.'}
  - {ref: CO-02, kind: pain, topic: ICS status and ageing, asis: 'ICS (Internal Collection System) tracks premium and commission collection; data flows from EBIX; the handler updates the contact status. After collection the status stays on the last action and ageing keeps running.', want: 'Status closes on payment; ageing stops.'}
  - {ref: CO-03, kind: open, topic: Credit policy, asis: 'Credit policy to be defined.', want: 'BDOI to confirm the credit policy.'}
  - {ref: 'Day 1 p.19', kind: rule, topic: Follow-up rules, asis: 'Newly booked and unpaid: collect within 10-15 days from booking; secure a payment commitment within 60 days; payment by deposit, bills payment or direct payment.'}
  - {ref: 'Day 1 p.19', kind: pain, topic: Friction named by BDOI, asis: 'Manual diary and status updates; e-mail-based CTE coordination; several payment-validation sources; follow-up that depends on the handler.'}
  - {ref: 'Collections flow', kind: asis, topic: Payment check, asis: 'Deposit: check with Cashiering. Bills payment: look in the Unapplied screen. Direct payment: check with the insurer. Then proceed to Cashiering.'}
asis:
  caption: 'Premium receivable follow-up today (Marketing Collections process flow; BRD-4 p.40-41; CO-01 to CO-03)'
  notes: >-
    The AO records the client's payment instruction in the Marketing Diary in ISYS. The Collection Handler takes the
    outstanding-PR list of the market segment and follows up each account as the diary says: new bookings within 10
    to 15 days, a payment commitment within 60 days. A commitment outside the credit term goes to the AO by e-mail;
    the AO asks the insurer for a credit term extension and escalates to the Unit Head. The handler updates the
    category and remarks and checks the payment by channel with Cashiering, the Unapplied screen or the insurer. In ICS
    the status stays on the last action and the ageing keeps running after the premium is paid, and the outstanding
    amount per client is not reliable. CWT 2307 tagging moves from Marketing to Operations by hand, and Operations
    extracts the Direct Payment report every month for PR reversal.
