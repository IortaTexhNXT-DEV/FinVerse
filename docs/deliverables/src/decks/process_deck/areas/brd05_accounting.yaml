notes:
  glance: >-
    BDOI handles two kinds of money: trust money (premium collected for insurers and remitted net of commission) and its
    own income (commission, service fee, profit share, incentives). BRD-2 covers the front of the cycle; BRD-5 covers
    the back office of Comptrollership. Most of the accounting core already exists in BIBS (chart, journals, accounting
    engine, sub-ledger, periods, FX revaluation, year-end, bank reconciliation, BIR returns and 2307). The large new
    build is Disbursement, then ACSL reconciliation and correction, the Marketing request flow and the BDOI report
    pack. There is no FRS yet; this chapter uses the requirements baseline and the design.
  pains: 'The points are the lettered current-process items of the BRD (A = Accounting, B = Disbursement, B.2 = Marketing requests, C = ACSL), p.44-45.'
  after: 'The BRD gives response times and yearly volumes; it states no turnaround targets. The measures are the controls BIBS adds.'
  gaps: 'The invoice-number question (DCR-058, AQ29) decides how ACSL links booking, adjustment and cancellation.'
asis:
  caption: 'Disbursement, accounting and ACSL today (BRD-5 p.44-45)'
  notes: >-
    Today Marketing refund and cash-advance requests arrive from AOs by e-mail; review and approval happen outside
    the system and signed paper is handed to Disbursement. Some disbursement requests still come on paper or by e-mail;
    not every payment method is integrated; processing and CWT tagging are manual; communication and approval run
    outside the system. In Accounting the input reports and the closing of the broking books depend on IT, output
    reports and reconciliations are manual, unbalanced transactions are not prevented and some entries are keyed by
    hand. In ACSL, input reports depend on IT, corrections and reversals are manual and posted by a separate unit, a
    cancellation gets a different invoice number, and reports lack the source-system references (BRD-5 p.44-45).
