notes:
  glance: >-
    Comptrollership turns every business event into accounting and pays everyone BDOI owes: insurers (remittance),
    clients (refunds), suppliers, employees and the government. Disbursement runs four routes (in the system, online
    banking, bank instruments outside the system and government payments) with three levels of signed approval. FRBS
    keeps the chart of accounts, reviews the reports IT prepares, reconciles, posts manual journals and closes the
    books at day, month and year end. ACSL keeps the accounts sub-ledger clean by finding abnormal balances and posting
    adjustments. Refund requests start in Marketing with five different approval chains.
  heard: Notes of the Cashiering, Other Income, Disbursement and Tax session (23-Sep) and of the Comptrollership floor walk.
  pains: Points 1 to 8 are on the Disbursement and Refund swimlane, 9 to 12 on the GL and ACSL swimlane.
  after: The benefit column names the control or the effort the To-Be removes.
  missed: >-
    Government remittances are the one true gap. The others are rules and values the floor showed (approval levels,
    tax rates, refund routing) that BRD-5 leaves open.
