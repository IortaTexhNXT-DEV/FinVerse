    - [p7, p9, dashed, documents]
    - [p9, p10]
asis_extra:
  - caption: 'General ledger, close and ACSL today (FRBS Accounting and ACSL process flows; Day 1 p.26)'
    notes: >-
      FRBS team leads add GL accounts in the EBIX account maintenance; EBIX creates entries from the source
      transactions and FRBS adds manual entries; sub-ledgers post automatically. IT generates the required reports
      and saves them in a shared folder; the accounting assistant reviews them, reconciles and prepares manual
      journals that the TL or TH reviews and posts. At day, month and year end IT extracts the output reports and
      closes the broking transactions before FRBS triggers the closing of the books and the balances are carried
      forward. ACSL receives reports from IT (PR, DTIP, CRU), looks for abnormal balances, analyses the invoices,
      prints the adjustment for the AP TL and routes it to an FRBS approver for posting; Cashiering e-mails invoices
      due for AR refund adjustment.
