tobe:
  caption: 'Disbursement, accounting and ACSL in BIBS (design ACCOUNTING_DISBURSEMENT_DESIGN; BRD-5 p.46-48)'
  notes: >-
    In BIBS refund and cash-advance requests are raised on the RRF / RFP with documents and approved in the workflow,
    then routed to Disbursement. Disbursement receives requests from the other modules, by upload or by encoding; BIBS
    creates the disbursement voucher with an editable proforma entry. The verifier and approvers decide in BIBS, and
    approval posts the entry to the GL and the sub-ledger, which refuses unbalanced entries. The payment runs in one of
    seven modes; statuses and CWT are tagged automatically and by bank files, and BIR 2307 is generated. ACSL uploads the
    insurer statements and reconciles them per invoice, and posts corrections through create, review, approve and post.
    Accounting reconciles the bank by check number and amount, closes the books on schedule and runs the reports on
    demand. The BDO Business Online Banking interface is parked (AQ09): approvals are confirmed manually or by file.
  cols: 6
  lanes:
    - {id: mkt, label: 'Marketing, requesters'}
    - {id: dsb, label: Disbursement}
    - {id: acc, label: Accounting (FRBS)}
    - {id: acs, label: ACSL}
    - {id: bank, label: 'Bank, insurers', kind: external}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
  steps:
    - {id: b1, lane: mkt, col: 1, text: RRF / RFP with documents; approved}
    - {id: b2, lane: bibs, col: 1, text: 'Requests from modules, upload, encoding', kind: auto}
    - {id: b3, lane: dsb, col: 2, text: DV with editable proforma entry}
    - {id: b4, lane: dsb, col: 3, text: Verifier and approvers decide}
    - {id: b5, lane: bibs, col: 3, text: Posted to GL and SL; balance checked, kind: auto}
    - {id: b6, lane: bank, col: 4, text: Paid in 7 modes; bank files back, kind: external}
    - {id: b7, lane: bibs, col: 4, text: Status and CWT tagged; BIR 2307, kind: auto}
    - {id: b8, lane: acs, col: 5, text: Insurer SOA reconciled per invoice}
    - {id: b9, lane: acs, col: 6, text: Correction reviewed and approved}
    - {id: b10, lane: acc, col: 5, text: Bank recon by check no. and amount}
    - {id: b11, lane: acc, col: 6, text: Scheduled close; reports on demand}
    - {id: b12, lane: bibs, col: 6, text: Correction posted; one root invoice, kind: auto}
