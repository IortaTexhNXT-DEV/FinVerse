asis:
  caption: 'Refunds and Disbursement today (Refund Request and Disbursement process flows; Day 1 p.27; DS-01 to DS-05)'
  notes: >-
    A refund starts with a Refund Request Form (client ID, CA / SA or check details, amount, reason) that the AO fills
    in; depending on the segment it goes through four to six signatures, and Marketing Admin, Collections or UPP fills
    an Excel template and keys the CA / SA in EBIX. Disbursement receives requests through the EBIX flow-in, by e-mail
    or on paper. Payee details are kept by MBS (insurers), the UPP handler (clients) and the DTL (sundry creditors).
    The DPO prepares the Excel disbursement template and bank forms; the DTL, DSH and DUH sign in turn. In-system
    payments run from EBIX to QPS by an IT batch, and the credit file is sent through WinSCP to the Transaction
    Processing Department (TPD); checks are printed in QPS. Credit tickets, ATDs, manager's checks, demand drafts and
    telegraphic transfers are bank forms done at a BDO branch. The signed documents go to FRBS for the GL entry. FRBS
    files taxes in EFPS and pays SSS, Pag-IBIG and PhilHealth through BancNet, then watches the government websites.
  cols: 7
  lanes:
    - {id: mkt, label: 'Marketing, UPP, Marketing Admin'}
    - {id: dpo, label: 'Disbursement DPO, DTL'}
    - {id: apr, label: 'DSH, DUH approvers'}
    - {id: bank, label: 'BDO TPD, branches, BancNet', kind: external}
    - {id: frbs, label: FRBS}
    - {id: sys, label: 'EBIX, QPS, WinSCP, Excel, paper', kind: system}
  steps:
    - {id: p1, lane: mkt, col: 1, text: 'Refund form signed by 4-6 people', pain: [1]}
    - {id: p2, lane: sys, col: 2, text: 'Excel template; CA / SA keyed in EBIX', kind: legacy, pain: [1]}
    - {id: p3, lane: dpo, col: 2, text: 'Request by EBIX flow-in, e-mail, hard copy', pain: [2]}
    - {id: p4, lane: dpo, col: 3, text: 'Payee keyed; Excel voucher template', pain: [3]}
    - {id: p5, lane: apr, col: 4, text: 'DTL, DSH, DUH sign in turn', pain: [4]}
    - {id: p6, lane: sys, col: 4, text: 'EBIX to QPS batch; credit file by WinSCP', kind: legacy, pain: [5]}
    - {id: p7, lane: bank, col: 5, text: 'TPD credits; branch MC, TT, ATD forms', kind: external, pain: [6]}
    - {id: p8, lane: sys, col: 5, text: Checks printed in QPS, kind: legacy, pain: [5]}
    - {id: p9, lane: frbs, col: 6, text: GL entry from signed documents, pain: [7]}
    - {id: p10, lane: dpo, col: 7, text: Confirmation e-mail; status tagged}
    - {id: p11, lane: frbs, col: 7, text: 'EFPS, BancNet; websites watched', pain: [8]}
