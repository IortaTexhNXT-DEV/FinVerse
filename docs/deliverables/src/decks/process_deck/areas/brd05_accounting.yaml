# Sources: floor walk 23-Sep-2026 (Disbursement / FRBS, ACSL, 44F) and discovery 21 and 23-Sep-2026 (floor-walk notes
# OI-, DS-, TX-, RC-, FN-, RP-); BDOI Day 1 overview p.26-27; high-level Disbursement, Refund Request, FRBS Accounting
# and ACSL process flows confirmed by the process owners; BRD-5 p.44-48; design ACCOUNTING_DISBURSEMENT_DESIGN;
# discrepancy register (DCR-052, 054, 055, 056, 234); open questions AQ01-AQ31.
