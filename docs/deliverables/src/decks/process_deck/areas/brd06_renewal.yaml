notes:
  glance: >-
    BDOI renews the policies it has placed. RMEL Phase 2 moves the renewal online: the Business Units extract the list
    themselves, disposition online in a staged workflow, export the accounts per insurer and monitor each renewal. The
    workshop addendum adds rule-based governance: sanitation, a mandatory reference, buckets, a decision matrix and
    automatic progression to booking. Renewal is designed; the build needs the shared business-type change BT0 first
    (decision D1).
  pains: The eight points are the current-process rows of the BRD (p.42-43) and the workshop addendum (p.3).
  after: The volumes and response times come from the usage table (p.186-188).
  gaps: >-
    Two contradictions inside the BRD decide the workflow triggers: disposition online or by upload (DCR-062), and
    manual initiation against straight-through processing (DCR-063). Renewal owns the renewal of submitted policies
    from the hand-off on (decision D2); the one-LAMD-intake question is still open (XQ01).
asis:
  caption: 'Renewal today (BRD-6 p.42-43; workshop addendum p.3)'
  notes: >-
    Today IT extracts the list of expiring accounts. Eligibility depends on manual pre-cleaning of the list. Marketing
    records dispositions in spreadsheets and communicates with Processing by e-mail. Accounts go to insurers by e-mail
    from Excel. Renewal Advices come from an IT text file and work for packaged accounts only, with the upload to QPS;
    non-packaged accounts and exceptions are handled by hand. Renewal status is monitored by hand, and accepted
    renewals are re-keyed for placement and booking.
