  - {ref: RN-02, kind: want, topic: Pro-forma entries, asis: 'Renewal accounting is not real time, so adjustments are made later for additional remittance or recovery.', want: 'Pro-forma accounting entries for renewals.'}
  - {ref: PM-04, kind: want, topic: Package switch, asis: 'At renewal a policy can move from package to non-package or back.', want: 'The system allows the switch at renewal.'}
  - {ref: DC-01, kind: rule, topic: Renewal advice template, asis: 'Policy schedules follow insurer templates; the renewal advice uses the BDOI template.', want: 'RA generated from the BDOI template.'}
  - {ref: 'Day 1 p.14', kind: asis, topic: Servicing path, asis: 'Send the sanitised renewal master expiry list; generate the renewal advice letter and send it to the client.'}
  - {ref: 'Renewal flow', kind: rule, topic: Notice days, asis: 'RMEL at -140 days; first notice at -70 days; final notice at -40 days (CBG) or -45 days (Non-CBG); CBG letters also by snail mail.'}
  - {ref: 'Renewal flow', kind: asis, topic: Non-package and exceptions, asis: 'Accounts with no QPS set-up are booked directly in EBIX; Processing computes, prepares the dispositioned files and coordinates with the AO when the insurer does not approve.'}
asis:
  caption: 'Renewal today (Renewal process flow: CBG automated RMEL, Non-CBG, exceptions; Day 1 p.14; RN-01, RN-02)'
  notes: >-
    IT extracts the RMEL from EBIX 140 days before the expiry month. For CBG the head-office sanitation handler tells
    the branch handlers; for Non-CBG the Marketing Admin TL tells Marketing Admin, who splits the file per segment for
    the Marketing TL, who passes it to the AO. The handlers identify the accounts for renewal, update the details and
    compute the premium in Excel; the AO gives a disposition and the TL reviews it by e-mail. The files are dropped in
    a folder for upload, and failed rows are corrected and re-uploaded. IT generates the RA text file into the
    ES-COG-OPRM folder; COG generates the RA letters at -70 and -40 or -45 days and sends them by e-mail and, for CBG,
    by snail mail. When the client accepts, the AO updates the account, Marketing Admin validates the payment and
    applies the changes, and Processing prepares the placement file in Excel and e-mails it to each insurer. The
    e-policy then follows the New Business path, and renewal accounting is adjusted after the fact.
  cols: 7
  lanes:
