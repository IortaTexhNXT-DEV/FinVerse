  - {practice: Omnichannel renewal notices, status: PARTLY, lever: Retention, what: 'E-mail, SMS, print and portal notices with delivery tracking.', rec: 'Add SMS and a print batch to the RA.'}
  - {practice: Pay-to-renew link, status: PARTLY, lever: Faster acceptance, what: 'The RA carries a payment link; payment is the acceptance.', rec: 'Add a payment reference and link to the RA template.'}
  - {practice: Experience-based renewal pricing, status: PARTLY, lever: Better terms, what: 'Claims and payment history feed the renewal terms and insurer choice.', rec: 'Show loss experience at sanitation (DCR-150).'}
  - {practice: Retention analytics, status: PARTLY, lever: Persistency, what: 'Lapse-risk scores, persistency and lost-business reasons per segment.', rec: 'Track reasons for non-renewal in the disposition list.'}
