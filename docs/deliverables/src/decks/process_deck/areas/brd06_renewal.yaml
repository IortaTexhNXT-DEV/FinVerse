    - {id: r5, lane: sys, col: 3, text: 'Upload to a folder; failed rows re-worked', kind: legacy, pain: [5]}
    - {id: r6, lane: it, col: 4, text: RA text file to the COG folder, pain: [6]}
    - {id: r7, lane: cog, col: 5, text: 'RA at -70 and -40 / -45 days; e-mail, snail mail', pain: [6]}
    - {id: r8, lane: ext, col: 5, text: 'Client accepts; insurer approves', kind: external}
