    - {id: mkt, label: 'Marketing Admin, TL, AO'}
    - {id: sh, label: 'Sanitation, Processing'}
    - {id: cog, label: 'ES-COG-OPRM'}
    - {id: ext, label: 'Clients, insurers', kind: external}
    - {id: sys, label: 'EBIX, Excel, folders, e-mail', kind: system}
  steps:
