notes:
  glance: >-
    Renewal starts 140 days before expiry, when IT extracts the renewal master expiry list (RMEL) from EBIX. Sanitation
    handlers and Marketing decide for each account whether and how it renews, BDOI sends the renewal advice (RA) to the
    client on its own template, the accepted accounts go to the insurers for placement and the renewal is booked like
    new business. CBG Fire and Motor renewals are sanitised centrally and in bulk; Non-CBG renewals pass through Marketing
    Admin, the TL and the AO; non-package and exception accounts are handled by Processing. At renewal a policy can move
    between package and non-package (PM-04).
  heard: Notes of the business overview (21-Sep) and of the Renewal Marketing and Processing floor walks (22-Sep).
  pains: 'Points 1 to 10 are on the swimlane; the BRD-6 current process (p.80-84) and the Renewal flow agree on them.'
  after: 'The benefit column names what the To-Be removes.'
  missed: 'Renewal pro-forma accounting and the snail-mail channel are not in the BRD.'
