tobe:
  caption: 'Renewal in BIBS: workflow RNW_CASE with the decision matrix (FRS BRD-6 sections 2.2 and 5)'
  notes: >-
    In BIBS a daily job extracts the accounts that expire within the lead days; users can also generate the list for
    any date range. BIBS runs the sanitation, matching and eligibility checks and classifies each record Clean, Review
    or Exception. An authorised user initiates the renewal, in bulk (for example CLG) or one by one. The decision matrix
    proposes a disposition; a Clean case with an automatic rule proceeds straight through. Otherwise the AO dispositions
    online and the TL reviews and posts. Processing updates the renewal account; BIBS builds the extract per insurer and
    sends it protected, and the insurer's decision file is applied: Renew As Is advances, Reject or Revise stops or
    reroutes. The Renewal Advice (first or second notice) goes out in batch, protected. Acceptance moves the account to
    placement and booking without re-keying, and it books as business type RENEWAL.
  cols: 7
  lanes:
    - {id: mkt, label: Marketing AO / TL}
    - {id: prc, label: Processing}
    - {id: ins, label: Insurers, kind: external}
    - {id: cli, label: Clients, kind: external}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
  steps:
