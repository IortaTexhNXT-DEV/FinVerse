notes:
  glance: >-
    BDOI supports the client from the notice of loss to settlement, as the client's advocate with the insurer. Motor
    claims end with a letter of authority (LOA) to a repair shop or dealer, or with a cash offer; Non-Motor claims go
    through the claims reporting form, the formal loss advice, an adjuster's inspection and an offer that the client
    accepts or contests. Claims are handled outside any system today and were called a major pain point (CL-01).
  heard: Notes of the business overview (21-Sep) and of the Claims floor walk (22-Sep).
  pains: 'The seven points of the BRD-7 current process (p.23-27); the Claims flow confirms them.'
  after: 'The benefit column names what the To-Be removes.'
  missed: 'The offer and contest loop, repair monitoring and a digital notice of loss are not in the BRD.'
heard:
  - {ref: CL-01, kind: pain, topic: Claims handling, asis: 'Claims are handled outside the system and manually.', want: 'Major pain point: claims in the system.'}
  - {ref: 'Day 1 p.8', kind: want, topic: What BDOI needs to see, asis: 'How a claim links to the policy; required documents and status values; who can update, review or approve; how customer communication is recorded.'}
  - {ref: 'Claims flow', kind: asis, topic: Motor, asis: 'Client, AO or branch sends the notice and PLA; handler completes the documents and sends them to the insurer; insurer issues an LOA to the preferred CASA / dealer or evaluates a cash offer; assured signs; repair monitored offline; claim tagged settled.'}
  - {ref: 'Claims flow', kind: asis, topic: Non-Motor, asis: 'Claims reporting form (CRF); formal loss advice to the insurer; initial assessment; adjuster inspection when needed; evaluation; offer reviewed and sent to the insured; accept, or contest and re-evaluate; payment; claim closed.'}
