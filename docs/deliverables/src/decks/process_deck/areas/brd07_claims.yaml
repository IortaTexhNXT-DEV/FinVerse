# FRS BRD-7 sections 2, 5, 9; cross-BRD decisions D3, D4, XQ05, XQ10; discrepancy register (DCR-078, 079, 085, 086, 157).
id: brd07
key: clm
num: 7
title: Claims
brd: BRD-7
scope: 'Claims logging and monitoring, from notice of loss to closure and loss analytics'
status: DESIGNED
status_text: Designed, not yet built; FRS v1.0 issued for review
department: Claims and Risk Management
roles:
  - Claims Officer / Claims Assistant (Motor and Non-Motor teams)
  - Team Lead, Team Head, Unit Head
  - Claims / Risk user (loss analytics)
  - Marketing AO and TL (notice, loss information)
  - Clients, insurers and adjusters (external)
