tobe:
  caption: 'Claim lifecycle in BIBS: workflow BCL_CLAIM (FRS BRD-7 sections 2.2 and 5)'
  notes: >-
    In BIBS the Claims Officer records the claim on the client's cover; the claim number is BCL-yyyy-nnnnnn. The
    cover, policy number, version, locations, Marketing unit and branch come from the BIBS account, read-only. BIBS reads
    the invoice ledger and disables the authorization code while premium is unpaid. The loss advice is generated and
    e-mailed to each insurer with a send log; insurer claim numbers are recorded per insurer. Status (restricted by role
    and unit), adjuster, reserve, next follow-up date, action plan and diary are on the claim, with history. Settlement
    type and amount are recorded; permanent closure needs a closing settlement type and a TL or TH. Ageing, outstanding,
    settled, loss experience and loss ratio reports run in BIBS and export to Excel.
  cols: 7
  lanes:
    - {id: cli, label: 'Client, AO, branch', kind: external}
    - {id: clm, label: Claims Officer}
    - {id: tl, label: 'Team Lead, Team Head'}
    - {id: ins, label: 'Insurers, adjusters', kind: external}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
  steps:
    - {id: b1, lane: cli, col: 1, text: 'Notice of loss: PLA or CRF', kind: external}
    - {id: b2, lane: clm, col: 1, text: Claim on the cover (BCL number)}
    - {id: b3, lane: bibs, col: 2, text: Cover read-only; premium check, kind: auto}
    - {id: b4, lane: bibs, col: 3, text: Loss advice to each insurer, kind: doc}
    - {id: b5, lane: ins, col: 4, text: 'Claim no., reserve, adjuster', kind: external}
    - {id: b6, lane: clm, col: 4, text: 'Status, reserve, adjuster recorded'}
    - {id: b7, lane: clm, col: 5, text: 'Follow-up date, action plan, diary'}
    - {id: b8, lane: bibs, col: 5, text: Ageing per status; reminders, kind: auto}
    - {id: b9, lane: tl, col: 6, text: Settlement type and amount}
    - {id: b10, lane: tl, col: 7, text: Permanent closure; reopen with reason}
    - {id: b11, lane: bibs, col: 7, text: 'Loss ratio, claims-prone locations', kind: doc}
  edges:
    - [b1, b2]
    - [b2, b3]
    - [b3, b4]
    - [b4, b5, dashed, e-mail + log]
    - [b5, b6, dashed, updates]
    - [b6, b7]
    - [b7, b8]
    - [b7, b9]
    - [b9, b10]
    - [b10, b11]
