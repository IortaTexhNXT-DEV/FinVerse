chevrons: [Renewal advice, Requirements, BOR and franchise, TOR, Proposals, Comparative, Client decision, Placement]
notes:
  glance: >-
    Business comes from five EB teams: BDO (captive bank group accounts), SM, Voluntary, Solicited and New Business.
    Renewals dominate. Insurers and client HR users are the first external users of BIBS: they work in the partner
    portal, and nothing they upload takes effect before BDOI validates it. Portal users are provisioned through User
    Access Maintenance as external users (decision D7). Employee Benefits is designed.
  pains: The seven points are the current-process rows of FRS BRD-8 section 2.1, from the addendum (Add. p.3).
  after: The BRD asks for automatic renewal advices, one repository, secure access and standard comparatives (Add. p.4-5); it gives no turnaround target.
  gaps: 'Member lists and utilization reports are health-related personal data: DCR-094 is the main compliance gap.'
asis:
  caption: 'Employee Benefits today (BRD-8 Add. p.3)'
  notes: >-
    Today renewal advices are prepared in Word or Excel. The TOR, master lists, utilization reports and proposals
    travel by e-mail with no repository, and insurers and clients reply by e-mail. The comparative is compiled by hand.
    Placement starts on an e-mail to Processing, member movements and billing are tracked in spreadsheets, booking is in
    EBIX, and reports are produced manually.
