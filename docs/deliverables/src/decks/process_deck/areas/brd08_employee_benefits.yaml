notes:
  glance: >-
    Employee Benefits places group programmes for corporate clients. It works like non-life business with more
    parties: the client's HR sends the master list (headcount only at quote stage), BDOI obtains the broker of record
    (BOR) and the insurers' franchise, releases the terms of reference (TOR), compares the proposals on premium,
    benefits and provider capabilities and presents a recommendation. After the client confirms, Processing receives the
    employee details and places the programme. BDOI handles more than 50,000 members today.
  heard: Notes of the business overview (21-Sep) and of the EB floor walk (23-Sep).
  pains: 'The seven points of the BRD-8 current process (Add. p.3-5); the EB process flow confirms them.'
  after: 'The benefit column names what the To-Be removes.'
  missed: 'EB claims capture and the ISACOM approval are not in the BRD; member volumes are not sized.'
