# Employee Benefits (BRD-8): chapter 4 of the business process reverse KT deck (Part A, Marketing and Sales).
# Sources: floor walk 23-Sep-2026 (Employee Benefits, 43F) and discovery 21-Sep-2026 (floor-walk notes EB-01 to
# EB-03); high-level Employee Benefits process flow (new business and renewal); BRD-8 main p.5 and workshop addendum
# p.3-14; discrepancy register (DCR-087, 088, 090, 094, 096, 211).
id: brd08
key: eb
num: 4
title: Employee Benefits
brd: BRD-8
scope: 'Group life, health (HMO) and accident programmes: renewal advice, BOR, TOR, proposals, comparative, placement, members'
department: 'Employee Benefits: Marketing, Processing and Collection'
roles:
  - EB Marketing AO and TL / UH (five EB teams)
  - BDOI Management (approval above the threshold); ISACOM (non-accredited provider)
  - EB Processing and Processing Supervisor; EB Collection
  - Client HR (master list, utilization)
  - Insurers and HMOs (proposals, claims validation)
figures:
  - ['50,000+', 'members handled today (EB-01)']
  - ['4,200', 'transactions in 2025, of which 4,150 renewals (Add. p.14)']
  - ['135 days', 'before expiry: default renewal advice (TAT annex)']
  - ['20', 'BDOI users: Marketing 13, Processing 4, Collection 3']
session:
  when: '23-Sep-2026, 9-10 am, 43F; discovery 21-Sep-2026'
  pocs: 'Marianne Alpapara, Jyneffer Liansing, Edwin Garcia'
sources:
  - 'High-level Employee Benefits process flow (new business and renewal)'
  - 'BRD-8 workshop addendum p.3-5 (current and envisioned); BRID-001-030'
  - 'Floor-walk notes EB-01 to EB-03'
chevrons: [Renewal advice, BOR, Franchise, TOR, Proposals, Comparative, Client decision, Placement]
notes:
  glance: >-
    Employee Benefits places group programmes for corporate clients. It works like non-life business with more
    parties: the client's HR sends the master list (headcount only at quote stage), BDOI obtains the broker of record
    (BOR) and the insurers' franchise, releases the terms of reference (TOR), compares the proposals on premium,
    benefits and provider capabilities and presents a recommendation. After the client confirms, Processing receives the
    employee details and places the programme. BDOI handles more than 50,000 members today.
  heard: Notes of the business overview (21-Sep) and of the EB floor walk (23-Sep).
  pains: 'The seven points of the BRD-8 current process (Add. p.3-5); the EB process flow confirms them.'
  after: 'The benefit column names what the To-Be removes.'
  missed: 'EB claims capture and the ISACOM approval are not in the BRD; member volumes are not sized.'
heard:
  - {ref: EB-01, kind: want, topic: Quote and placement, asis: 'Like non-life: Marketing gets the master list from the customer (headcount only at quote stage), sends it to insurers and negotiates; Processing then gets the employee details and places. More than 50,000 members today.', want: 'The system handles large member volumes (50K+).'}
  - {ref: EB-02, kind: asis, topic: EB claims, asis: 'Claims are validated by the provider; BDOI only captures the details from the provider.'}
  - {ref: EB-03, kind: rule, topic: Broker of record, asis: 'The broker of record is kept for corporate EB renewal.'}
  - {ref: 'EB flow', kind: asis, topic: Renewal, asis: 'Renewal advice before expiry; BOR, master list, utilization and indicative proposal secured; indicative renewal from the incumbent; client feedback; comparative; approval above the internal threshold; placement after confirmation.'}
  - {ref: 'EB flow', kind: rule, topic: New business, asis: 'New client tagged as prospect; BOR to insurers for franchise approval; TOR from existing benefits; TOR, master list and utilization released to the insurers with franchise; ISACOM approval if awarded to a non-accredited provider.'}
  - {ref: 'EB flow', kind: want, topic: Portals, asis: 'Insurer portal for uploads and management; client portal for uploads and policy management.', want: 'Portals for insurers and client HR (the drop plan says no portal at go-live).'}
asis:
  caption: 'Employee Benefits today (BRD-8 Add. p.3)'
  notes: >-
    Today renewal advices are prepared in Word or Excel. The TOR, master lists, utilization reports and proposals
    travel by e-mail with no repository, and insurers and clients reply by e-mail. The comparative is compiled by hand.
    Placement starts on an e-mail to Processing, member movements and billing are tracked in spreadsheets, booking is in
    EBIX, and reports are produced manually.
  cols: 6
  lanes:
    - {id: cli, label: Client HR, kind: external}
    - {id: mkt, label: EB Marketing AO}
    - {id: ins, label: 'Insurers, HMO', kind: external}
    - {id: prc, label: 'Processing, Collection'}
    - {id: sys, label: 'Word, Excel, e-mail, EBIX', kind: system}
  steps:
    - {id: a1, lane: mkt, col: 1, text: RA prepared in Word or Excel, pain: [1]}
    - {id: a2, lane: cli, col: 2, text: 'Master list, utilization by e-mail', kind: external, pain: [2]}
    - {id: a3, lane: mkt, col: 3, text: TOR and master list e-mailed}
    - {id: a4, lane: ins, col: 4, text: Proposal by e-mail, kind: external, pain: [3]}
    - {id: a5, lane: sys, col: 4, text: Comparative compiled by hand, kind: legacy, pain: [4]}
    - {id: a6, lane: cli, col: 5, text: Client confirms by e-mail, kind: external}
    - {id: a7, lane: prc, col: 5, text: Placement starts on an e-mail, pain: [5]}
    - {id: a8, lane: sys, col: 6, text: Booking in EBIX; members in Excel, kind: legacy, pain: [6]}
    - {id: a9, lane: mkt, col: 6, text: Reports produced by hand, pain: [7]}
  edges:
    - [a1, a2, dashed, e-mail]
    - [a2, a3, dashed]
    - [a3, a4, dashed]
    - [a4, a5]
    - [a5, a6, dashed]
    - [a6, a7, dashed]
    - [a7, a8]
    - [a8, a9]
pains:
  - {n: 1, title: Renewal advices by hand, text: 'Prepared in Word or Excel for each programme.', ref: 'BRD-8 Add. p.3; BRID-001'}
  - {n: 2, title: No document repository, text: 'TOR, master lists, utilization and proposals travel by e-mail.', ref: 'BRD-8 Add. p.3; BRID-002, 007'}
  - {n: 3, title: Insurers and clients reply by e-mail, text: 'No secure channel and no validation before use.', ref: 'BRD-8 Add. p.3-4; BRID-005'}
  - {n: 4, title: Comparative compiled by hand, text: 'Proposals are re-keyed into a comparative.', ref: 'BRD-8 Add. p.3; BRID-010'}
  - {n: 5, title: Placement starts on an e-mail, text: 'Hand-offs between Marketing, Processing and Collection run on e-mail.', ref: 'BRD-8 Add. p.3; BRID-017'}
  - {n: 6, title: Members and billing in spreadsheets, text: 'Member movements, direct billing, cards and SOAs tracked in Excel.', ref: 'BRD-8 Add. p.3; BRID-013, 021, 030'}
  - {n: 7, title: Reports by hand, text: 'Production, renewal and TAT reports compiled manually.', ref: 'BRD-8 Add. p.3; BRID-022'}
tobe:
  caption: 'EB cycle in BIBS: workflow EB_CYCLE and the partner portal (FRS BRD-8 sections 2.2 and 5)'
  notes: >-
    In BIBS a daily job sends the renewal advice 135 days before expiry (default), with reminders and a feedback
    request. Client HR users upload the master list, utilization and the signed BOR in the partner portal; the AO
    validates every upload before it takes effect. Target insurers approve the franchise in the portal; the TOR and the
    unnamed master list are released to them, and they submit proposals on a structured form. BIBS builds the comparative
    from the validated proposals; sign-off and the value-threshold approval are workflow steps. The client's
    confirmation creates one account per benefit line and notifies Processing, who place, issue and book on the BRD-1
    spine and release the SOA. Member changes, direct billing, contracts, HMO cards and SOAs are tracked items with
    automatic follow-ups.
  cols: 6
  lanes:
    - {id: cli, label: 'Client HR (portal)', kind: external}
    - {id: mkt, label: 'EB Marketing, Mgmt'}
    - {id: ins, label: 'Insurers, HMO (portal)', kind: external}
    - {id: prc, label: 'Processing, Collection'}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
  steps:
    - {id: b1, lane: bibs, col: 1, text: RA 135 days before expiry; reminders, kind: doc}
    - {id: b2, lane: cli, col: 2, text: 'Master list, utilization, BOR uploaded', kind: external}
    - {id: b3, lane: mkt, col: 2, text: AO validates every upload}
    - {id: b4, lane: mkt, col: 3, text: Franchise and TOR released}
    - {id: b5, lane: ins, col: 4, text: Proposal on the portal form, kind: external}
    - {id: b6, lane: bibs, col: 4, text: Comparative built; threshold check, kind: auto}
    - {id: b7, lane: cli, col: 5, text: Client confirms in the portal, kind: external}
    - {id: b8, lane: bibs, col: 5, text: One account per benefit line, kind: auto}
    - {id: b9, lane: prc, col: 6, text: 'Placement to booking; SOA released'}
    - {id: b10, lane: bibs, col: 6, text: 'Members, cards, billing tracked', kind: auto}
  edges:
    - [b1, b2, dashed, e-mail]
    - [b2, b3]
    - [b3, b4]
    - [b4, b5, dashed, portal]
    - [b5, b6]
    - [b6, b7, dashed]
    - [b7, b8]
    - [b8, b9]
    - [b9, b10]
after:
  - {n: 1, bibs: 'Daily job sends the RA 135 days before expiry, with reminders and a feedback request', measure: 'About 4,150 renewals a year'}
  - {n: 2, bibs: 'Every document registered with cycle, type, process and version; outbound files protected', measure: 'One repository'}
  - {n: 3, bibs: 'Insurers and client HR work in the partner portal; uploads take effect after BDOI validation', measure: 'Validation before use'}
  - {n: 4, bibs: 'Comparative built from the validated proposals; sign-off and threshold approval in the workflow', measure: 'No re-keying'}
  - {n: 5, bibs: 'Client confirmation creates one account per benefit line and notifies Processing', measure: 'Hand-off in the system'}
  - {n: 6, bibs: 'Member changes, direct billing, contracts, HMO cards and SOAs are tracked items with follow-ups', measure: 'Automatic follow-ups'}
  - {n: 7, bibs: 'Production, Renewal, Placement, New Business and TAT reports with a business type filter', measure: 'Live reports'}
missed:
  - {cov: NOT_IN_BRD, item: EB claims capture, seen: 'Provider validates; BDOI captures claim details (EB-02).', brd: 'No claims row in BRD-8; BRD-7 covers Motor and Non-Motor only.', rec: 'Capture provider claims and utilization per programme.', ref: EB-02}
  - {cov: NOT_IN_BRD, item: ISACOM approval, seen: 'Needed when a non-accredited provider wins.', brd: 'Only in the process flow.', rec: 'Approval step and document in the EB cycle.', ref: 'EB flow; DCR-090'}
  - {cov: PARTLY, item: Member volumes, seen: '50,000+ members (EB-01).', brd: 'NFR counts transactions (4,200 a year), not members.', rec: 'Size and test member uploads and roster at 50K+.', ref: 'EB-01; EBQ15'}
  - {cov: PARTLY, item: Census validation, seen: 'Master lists by e-mail and Excel.', brd: 'Upload with AO validation; no data checks.', rec: 'Checks for duplicates, eligibility and changes since the last list.', ref: 'BRID-007, 013'}
  - {cov: CONFIRM, item: Portals at go-live, seen: 'Insurer and client portals in the EB flow.', brd: 'Portal in BRD-8; drop plan says no portal.', rec: 'Confirm the portal timing and external-user security.', ref: 'DCR-211, 096'}
  - {cov: PARTLY, item: Member data privacy, seen: 'Employee data travels by e-mail.', brd: 'Masking and need-to-know rules open.', rec: 'Data Privacy Act controls on member data.', ref: DCR-094}
  - {cov: CONFIRM, item: Renewal advice lead days, seen: 'Advice sent before expiry.', brd: '180 or 135 days.', rec: 'Confirm the default per programme.', ref: DCR-087}
best:
  - {practice: HR self-service census, status: PARTLY, lever: Clean member data, what: 'Client HR uploads the census; the system checks duplicates, eligibility and changes.', rec: 'Start with an upload template and checks, portal later.'}
  - {practice: Automatic member endorsements, status: PARTLY, lever: Accurate billing, what: 'Additions and deletions billed pro rata and reconciled to the insurer invoice.', rec: 'Use BRID-013 / 025 / 030 as the base.'}
  - {practice: Utilization analytics, status: PARTLY, lever: Better renewals, what: 'Claims and utilization per programme drive the renewal negotiation.', rec: 'Capture provider claims (EB-02).'}
  - {practice: Digital member cards, status: BEYOND, lever: Member experience, what: 'HMO and life cards issued digitally to members.', rec: 'With the HMOs after go-live.'}
  - {practice: Privacy by design, status: NOT_IN_BRD, lever: Compliance, what: 'Masking, need-to-know access and retention for member data.', rec: 'Agree the rules with the DPO (DCR-094).'}
  - {practice: Provider scorecard, status: BEYOND, lever: Better advice, what: 'Insurer and HMO service levels, network and claims turnaround scored in the comparative.', rec: 'Add capability scores to the comparative.'}

