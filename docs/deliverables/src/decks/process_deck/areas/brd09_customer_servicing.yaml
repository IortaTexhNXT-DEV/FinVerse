# Customer Servicing Facility and case management (BRD-9): chapter 11 of the business process reverse KT deck
# (Part E, Claims and Customer Service). Sources: high-level Customer Servicing Facility process flow; BDOI "Case
# Management To-Be process flow" of 15-Jul-2026; New Business and Renewal flows (contact centre sends e-policies after
# a fall-out); BRD-9 p.3-5, p.13-17; discrepancy register (DCR-104, 163, 202); cross-BRD question XQ02.
id: brd09
key: csf
num: 11
title: Customer Servicing and Case Management
short: Customer Servicing
brd: BRD-9
scope: 'Contact centre search and servicing view, contact updates, document resends, case logging and referral'
department: Contact Center Management / Alternative Distribution
roles:
  - BDO Insure contact centre agent (CSR)
  - 'Contact centre supervisor; BDO contact centre (BDO CCC) personnel'
  - 'Fulfilment units: the Marketing unit that manages the account'
  - Contact centre management, leads and heads; System Administrator
  - Callers (clients)
figures:
  - ['144,400', 'access, retrieval and search transactions a year (BRD-9 p.13-14)']
  - ['24', 'concurrent agents, supervisors and personnel']
  - ['2', 'contact centres involved: BDO Insure and BDO CCC (XQ02)']
  - ['< 3 s', 'retrieval, update and search; 5 s documents']
session:
  when: 'Process flows walked with the contact centre owners; not a September floor-walk slot'
  pocs: 'Contact Center Management (BDO Insure)'
sources:
  - 'High-level Customer Servicing Facility process flow'
  - 'BDOI Case Management To-Be process flow, 15-Jul-2026'
  - 'BRD-9 p.3-5; e-mail clarification p.17; BRCSF-001-011'
chevrons: [Contact, Identify, Search, View, Verify, Update, Resend or refer, Close]
notes:
  glance: >-
    The BDO Insure contact centre answers clients by phone, e-mail and digital channels. Agents search the client's
    accounts, answer inquiries, update contact details and resend documents; concerns they cannot close go to the
    fulfilment unit that manages the account. Today the facility shows full details for CBG accounts only, and every
    contact is logged by hand in a separate case tool. BDOI has already drawn its own case-management To-Be (15-Jul-2026),
    which goes further than BRD-9.
  heard: 'Steps of the Customer Servicing flow and of BDOI''s case-management To-Be flow.'
  pains: 'The six points of the BRD-9 current process (p.3-5).'
  after: 'The benefit column names what the To-Be removes.'
  missed: 'Case management is the main gap: BRD-9 puts it out of scope while the umbrella BRD and BDOI''s own To-Be want it.'
heard:
  - {ref: 'CSF flow', kind: asis, topic: Search, asis: 'Account inquiry by invoice number, PN number, last, first or full name (CBG); client inquiry by name for Non-CBG; open the account from the invoice or client code; view contact and insurance details.'}
  - {ref: 'CSF flow', kind: pain, topic: Contact update, asis: 'When contact details change, the agent updates them and the system migration updates the source databases (QPS, EBIX).'}
  - {ref: 'Case To-Be', kind: want, topic: Case logging, asis: 'Agent identifies the client and the concern; logs every concern in CLS by typing it in; general inquiries answered from CC Nav and closed.', want: 'Client details filled in automatically in the case form.'}
  - {ref: 'Case To-Be', kind: want, topic: Positive identification, asis: 'Positive identification (PID) of the client before any account transaction; failed PID closes the case.', want: 'PID as a step of the case.'}
  - {ref: 'Case To-Be', kind: want, topic: Referral and TAT, asis: 'Concerns not solved at the first contact are referred to the fulfilment unit by e-mail and a CLS prompt.', want: 'Cases routed automatically to the Marketing unit of the account; open cases within or past TAT visible; invalid returns re-logged by BDO CCC.'}
  - {ref: 'NB and RN flows', kind: pain, topic: E-policy after fall-out, asis: 'After an SFTP fall-out Marketing fixes the e-policy and the BDOI contact centre sends it to the client.'}
asis:
  caption: 'Contact centre servicing today (BRD-9 p.4)'
  notes: >-
    Today the agent searches the Front-End on a limited set of keys. Full account details show for CBG accounts only;
    for non-CBG accounts the agent sees only contact details, account number and expiry date. Every agent has the same
    rights. Contact updates are written into QPS or EBIX. Renewal advice and e-policy resends are handled outside the
    tool by the fulfilment units, and management has no audit report. The servers have reached end of life.
  cols: 5
  lanes:
    - {id: cli, label: Caller (client), kind: external}
    - {id: agt, label: Contact centre agent}
    - {id: ful, label: 'Fulfilment units'}
    - {id: sys, label: 'Front-End over QPS, EBIX', kind: system}
  steps:
    - {id: a1, lane: cli, col: 1, text: Calls the contact centre, kind: external}
    - {id: a2, lane: agt, col: 1, text: Searches on a few keys, pain: [2]}
    - {id: a3, lane: sys, col: 2, text: Full details for CBG accounts only, kind: legacy, pain: [1]}
    - {id: a4, lane: agt, col: 2, text: Same rights for every agent, pain: [3]}
    - {id: a5, lane: sys, col: 3, text: Contact update keyed in QPS or EBIX, kind: legacy, pain: [4]}
    - {id: a6, lane: ful, col: 4, text: RA or e-policy resent by another unit, pain: [5]}
    - {id: a7, lane: cli, col: 5, text: Receives the document by e-mail, kind: external}
    - {id: a8, lane: sys, col: 5, text: No audit report; servers end of life, kind: legacy, pain: [6]}
  edges:
    - [a1, a2]
    - [a2, a3]
    - [a3, a4]
    - [a4, a5]
    - [a5, a6, dashed, e-mail]
    - [a6, a7, dashed]
    - [a5, a8]
pains:
  - {n: 1, title: Full details for CBG accounts only, text: 'Non-CBG accounts show contact details, account number and expiry date only.', ref: 'BRD-9 p.4; BRCSF-002, 005'}
  - {n: 2, title: Limited search keys, text: 'Agents cannot search by every key the caller gives.', ref: 'BRD-9 p.17 (e-mail); BRCSF-003'}
  - {n: 3, title: No role-based access, text: 'Agents, supervisors and management have the same rights.', ref: 'BRD-9 p.4'}
  - {n: 4, title: Updates written in QPS or EBIX, text: 'Contact details are changed in the legacy systems.', ref: 'BRD-9 p.3-5; BRCSF-004'}
  - {n: 5, title: Resends outside the tool, text: 'RA and e-policy resends are handled by other units.', ref: 'BRD-9 p.17 (e-mail item 9); BRCSF-006'}
  - {n: 6, title: No audit report; ageing servers, text: 'Management has no audit trail of agent actions; servers at end of life.', ref: 'BRD-9 p.4; BRCSF-010, 011'}
tobe:
  caption: 'Servicing contact in BIBS: no approval workflow, every action immediate and logged (FRS BRD-9 section 2.2)'
  notes: >-
    In BIBS the agent signs in to the Customer Search. One search box takes the name, client ID, account number, PN
    number or application number, and results group by client. The servicing view shows the client summary, every
    account (CBG and non-CBG) with its CSF status, payments of the last 12 months, RAs, e-policies and documents. Before
    an update the agent completes the verification checklist; only contact fields change, with a reason, in the BIBS
    client master. The agent resends the RA or the e-policy to the registered e-mail, password protected, with the
    password sent separately. The contact change is queued for QPS and EBIX while they coexist (parked seam, CSQ01).
    Management prints or saves the audit trail and agent activity in PDF or Excel.
  cols: 5
  lanes:
    - {id: cli, label: Caller (client), kind: external}
    - {id: agt, label: Contact centre agent}
    - {id: sup, label: 'Supervisor, management'}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
    - {id: leg, label: 'QPS, EBIX (coexisting)', kind: system}
  steps:
    - {id: b1, lane: cli, col: 1, text: Calls the contact centre, kind: external}
    - {id: b2, lane: agt, col: 1, text: 'One search: name, ID, account, PN'}
    - {id: b3, lane: bibs, col: 2, text: 'All accounts, 12 months payments, RAs', kind: auto}
    - {id: b4, lane: agt, col: 3, text: Caller verified; contact changed with reason}
    - {id: b5, lane: bibs, col: 3, text: Client master updated and logged, kind: auto}
    - {id: b6, lane: leg, col: 4, text: Write-back queued (parked), kind: parked}
    - {id: b7, lane: agt, col: 4, text: RA or e-policy resent}
    - {id: b8, lane: cli, col: 5, text: 'Protected file; password apart', kind: external}
    - {id: b9, lane: sup, col: 5, text: 'Audit trail, agent activity (PDF, Excel)'}
  edges:
    - [b1, b2]
    - [b2, b3]
    - [b3, b4]
    - [b4, b5]
    - [b5, b6, dashed]
    - [b5, b7]
    - [b7, b8, dashed, e-mail]
    - [b7, b9]
after:
  - {n: 1, bibs: 'Every account of the client, CBG and non-CBG, with status and payments', measure: 'All segments'}
  - {n: 2, bibs: 'One search box for name, client ID, account number, PN number and application number', measure: '< 3 s search'}
  - {n: 3, bibs: 'Agent, supervisor and management roles with separate rights to update, resend and upload', measure: 'Role-based access'}
  - {n: 4, bibs: 'Update made once in the BIBS client master after verifying the caller; write-back seam for QPS / EBIX', measure: 'Verification before change'}
  - {n: 5, bibs: 'Agent views, downloads and resends the RA and e-policy to the registered e-mail, protected', measure: 'Resend in one call'}
  - {n: 6, bibs: 'Every change and agent action logged; audit trail in PDF or Excel', measure: 'Full audit trail'}
variants:
  title: BDOI's case-management To-Be
  headers: [Step, What happens, Who]
  widths: [2.2, 7.6, 2.6]
  per_page: 7
  rows:
    - ['1 Contact', 'Customer contacts the BDO Insure contact centre by phone, e-mail, web or digital channel', Customer]
    - ['2 Identify', 'Agent identifies the client and whether the concern is account-related or a general inquiry', BDO Insure agent]
    - ['3 General inquiry', 'Answered from CC Nav; concern logged and closed', BDO Insure agent]
    - ['4 PID', 'Existing client: positive identification; failed PID ends the transaction and the case is logged and closed', BDO Insure agent]
    - ['5 First-contact fix', 'Solved at the point of contact: request fulfilled; case logged with client details filled in automatically; closed', BDO Insure agent]
    - ['6 Referral', 'Not solvable at first contact: case routed automatically to the Marketing unit of the account; unit notified', 'Agent, system']
    - ['7 Resolve or return', 'Fulfilment unit filters open cases within or past TAT, resolves and closes, or returns an erroneous case; BDO CCC re-logs valid returns', 'Fulfilment unit, BDO CCC']
  notes: BDOI's case-management To-Be flow of 15-Jul-2026. It is BDOI's own design, beyond BRD-9, and should be taken into the BRD.
missed:
  - {cov: NOT_IN_BRD, item: Case management, seen: 'Every contact logged by hand in CLS; BDOI''s To-Be wants cases in the system.', brd: 'Case logging out of BRD-9 (CSF-EM10); umbrella BRD wants it.', rec: 'Bring BDOI''s 15-Jul To-Be into scope as a change request.', ref: 'DCR-163; CRQ04'}
  - {cov: PARTLY, item: Positive identification, seen: 'PID before any account transaction.', brd: 'Caller verification topic only.', rec: 'PID questions and result recorded on the case.', ref: CSQ03}
  - {cov: NOT_IN_BRD, item: Referral routing and TAT, seen: 'Referral by e-mail; no TAT view.', brd: 'Not specified.', rec: 'Auto-route to the account''s unit; TAT per case type; return loop.', ref: 'Case To-Be'}
  - {cov: PARTLY, item: Write-back to legacy, seen: 'Contact updates written to QPS and EBIX.', brd: 'Write-back seam; open.', rec: 'No write-back after go-live; one client master.', ref: 'DCR-104, 202'}
  - {cov: PARTLY, item: E-policy after a fall-out, seen: 'Contact centre sends e-policies Marketing fixed.', brd: 'Resend on request only.', rec: 'One e-policy sender with an exception queue (chapter 1).', ref: 'NB flow'}
  - {cov: CONFIRM, item: Two contact centres, seen: 'BDO Insure and BDO CCC both handle cases.', brd: 'Roles open.', rec: 'Confirm who logs, who resolves, who re-logs.', ref: XQ02}
best:
  - {practice: Omnichannel case management, status: NOT_IN_BRD, lever: One view of every concern, what: 'Every call, e-mail and chat is a case with SLA, routing and history on the client record.', rec: 'Adopt BDOI''s 15-Jul To-Be.'}
  - {practice: Screen-pop and assisted PID, status: PARTLY, lever: Shorter calls, what: 'Caller recognised from the number; PID by OTP or questions from the client record.', rec: 'Add PID to the servicing view.'}
  - {practice: Self-service, status: BEYOND, lever: Fewer calls, what: 'Clients get RA, e-policy, SOA and payment status online or by chatbot.', rec: 'Phase after go-live; start with document download.'}
  - {practice: Knowledge base and scripts, status: BEYOND, lever: Consistent answers, what: 'Answers and call scripts per concern type, kept by the contact centre.', rec: 'Move CC Nav content into the case tool.'}
  - {practice: First-contact resolution metrics, status: BEYOND, lever: Service quality, what: 'First-contact resolution, TAT met and satisfaction per unit.', rec: 'Report from case data.'}

# Floor-walk edition (reverse KT v3.0): overrides for build_floorwalk_deck.py; floor walk and BDOI flows only.
fw:
  num: 10
  variants_place: wants
  variants_note: 'BDOI''s case-management To-Be flow of 15-Jul-2026: how the business wants the contact centre to work.'
  figures:
    - ['2 centres', 'BDO Insure contact centre and BDO CCC handle cases (Case To-Be)']
    - ['2 paths', 'search: CBG accounts by invoice or PN, non-CBG by name (CSF flow)']
    - ['7 steps', 'in BDOI''s case-management To-Be of 15-Jul-2026']
    - ['TAT', 'per referred case, which BDOI wants visible (Case To-Be)']
  sources:
    - 'Customer Servicing Facility process flow'
    - 'BDOI Case Management To-Be process flow, 15-Jul-2026'
    - 'New Business and Renewal flows (e-policy after a fall-out)'
  session:
    when: 'Process flows shared by BDOI; the contact centre was not in the September floor-walk slots'
    pocs: 'Contact Center Management (BDO Insure)'
  notes:
    glance: >-
      The BDO Insure contact centre answers clients by phone, e-mail and digital channels: searching accounts,
      answering inquiries, updating contact details, resending documents and referring what it cannot close to the
      Marketing unit that manages the account. Every contact is logged by hand in CLS. BDOI has drawn its own
      case-management To-Be (15-Jul-2026), shown after the pain points.
    pains: 'The seven points are on the Customer Servicing swimlane.'
    wants: 'For each pain point: what BDOI''s case-management To-Be asks for.'
  asis:
    caption: 'Contact-centre servicing today (CSF process flow; Case Management flow; NB flow)'
    notes: >-
      The client contacts the BDO Insure contact centre. The agent identifies the client and the concern, searches CBG
      accounts by invoice number, PN or name and non-CBG accounts by name only, and answers general inquiries from CC
      Nav. For an account concern the agent checks the client's identity (PID). Contact changes are updated and pushed
      to the QPS and EBIX databases. Every concern is typed into CLS; concerns that cannot be closed are referred to
      the fulfilment unit by e-mail and a CLS prompt, without a TAT view, and cases returned as erroneous are re-logged
      by BDO CCC. After an e-policy fall-out the contact centre also sends the e-policy to the client.
    cols: 7
    lanes:
      - {id: cal, label: Caller (client), kind: external}
      - {id: agt, label: Contact centre agent}
      - {id: ful, label: 'Fulfilment unit (Marketing)'}
      - {id: ccc, label: BDO CCC}
      - {id: sys, label: 'CC Nav, CLS, Front-End', kind: system}
    steps:
      - {id: s1, lane: cal, col: 1, text: 'Calls, e-mails or messages', kind: external}
      - {id: s2, lane: agt, col: 1, text: Identifies client and concern}
      - {id: s3, lane: sys, col: 2, text: 'Search: CBG by invoice or PN; others by name', kind: legacy, pain: [1]}
      - {id: s4, lane: agt, col: 3, text: 'PID; answers from CC Nav', pain: [2]}
      - {id: s5, lane: sys, col: 3, text: 'Contact update pushed to QPS, EBIX', kind: legacy, pain: [3]}
      - {id: s6, lane: agt, col: 4, text: Every concern typed into CLS, pain: [4]}
      - {id: s7, lane: ful, col: 5, text: 'Referral by e-mail; no TAT view', pain: [5]}
      - {id: s8, lane: ful, col: 6, text: 'Resolves, or returns the case'}
      - {id: s9, lane: ccc, col: 7, text: Re-logs valid returns, pain: [6]}
      - {id: s10, lane: agt, col: 7, text: 'Sends e-policies after fall-outs', pain: [7]}
    edges:
      - [s1, s2]
      - [s2, s3]
      - [s3, s4]
      - [s4, s5]
      - [s4, s6]
      - [s6, s7, dashed, e-mail]
      - [s7, s8]
      - [s8, s9, dashed, return]
  pains:
    - {n: 1, title: Two search paths, text: 'CBG accounts by invoice or PN; non-CBG accounts by name only.', ref: 'CSF flow'}
    - {n: 2, title: PID and answers by hand, text: 'Identity checked by questions; answers looked up in CC Nav.', ref: 'Case Management flow'}
    - {n: 3, title: Updates pushed to legacy, text: 'Contact changes written to the QPS and EBIX databases.', ref: 'CSF flow'}
    - {n: 4, title: Every concern keyed into CLS, text: 'Agents type every contact into CLS, even resolved ones.', ref: 'Case Management flow'}
    - {n: 5, title: Referrals by e-mail, text: 'Fulfilment units are told by e-mail; no view of TAT.', ref: 'Case Management flow'}
    - {n: 6, title: Returned cases re-logged, text: 'Erroneous cases go back and BDO CCC logs them again.', ref: 'Case Management flow'}
    - {n: 7, title: Contact centre sends fall-outs, text: 'E-policies fixed by Marketing are sent by the contact centre.', ref: 'NB flow'}
  wants:
    - {n: 1, bibs: 'One search across every account, CBG and non-CBG', measure: 'One view'}
    - {n: 2, bibs: 'PID as a step of the case; answers at hand', measure: 'PID step'}
    - {n: 3, bibs: 'Contact changes made once in one client record', measure: 'One client'}
    - {n: 4, bibs: 'Case form filled with the client''s details automatically', measure: 'Case management'}
    - {n: 5, bibs: 'Cases routed automatically to the Marketing unit of the account; TAT visible', measure: 'Routing and TAT'}
    - {n: 6, bibs: 'Return loop in the case, without re-logging', measure: 'Case history'}
