chevrons: [Sign in, Search, Servicing view, Verify caller, Update contact, Resend, Documents, Audit]
notes:
  glance: >-
    The BDO-Insure Front-End System was built by BDO IT for the contact centre agents. It shows full account details
    only for CBG accounts, lets agents update contact details only, has servers at end of life and no role-based access
    control (BRD-9 p.4). In BIBS the CSF reads the BIBS modules through their query services and stores only its own
    records. It has no approval workflow: every action is immediate and logged. It is designed. Note: the printed e-mail
    in the pack carries meeting credentials; circulate a redacted copy (DCR-098).
  pains: The six points are the current-process rows of FRS BRD-9 section 2.1, from the BRD (p.3-5, p.17).
  after: The usage table gives the volumes and response times (p.13-14).
  gaps: The write-back to QPS and EBIX (DCR-104) decides how long two systems of record coexist.
asis:
  caption: 'Contact centre servicing today (BRD-9 p.4)'
  notes: >-
    Today the agent searches the Front-End on a limited set of keys. Full account details show for CBG accounts only;
    for non-CBG accounts the agent sees only contact details, account number and expiry date. Every agent has the same
    rights. Contact updates are written into QPS or EBIX. Renewal advice and e-policy resends are handled outside the
    tool by the fulfilment units, and management has no audit report. The servers have reached end of life.
  cols: 5
  lanes:
    - {id: cli, label: Caller (client), kind: external}
    - {id: agt, label: Contact centre agent}
    - {id: ful, label: 'Fulfilment units'}
    - {id: sys, label: 'Front-End over QPS, EBIX', kind: system}
  steps:
    - {id: a1, lane: cli, col: 1, text: Calls the contact centre, kind: external}
    - {id: a2, lane: agt, col: 1, text: Searches on a few keys, pain: [2]}
    - {id: a3, lane: sys, col: 2, text: Full details for CBG accounts only, kind: legacy, pain: [1]}
    - {id: a4, lane: agt, col: 2, text: Same rights for every agent, pain: [3]}
    - {id: a5, lane: sys, col: 3, text: Contact update keyed in QPS or EBIX, kind: legacy, pain: [4]}
    - {id: a6, lane: ful, col: 4, text: RA or e-policy resent by another unit, pain: [5]}
    - {id: a7, lane: cli, col: 5, text: Receives the document by e-mail, kind: external}
    - {id: a8, lane: sys, col: 5, text: No audit report; servers end of life, kind: legacy, pain: [6]}
  edges:
    - [a1, a2]
    - [a2, a3]
    - [a3, a4]
    - [a4, a5]
    - [a5, a6, dashed, e-mail]
    - [a6, a7, dashed]
    - [a5, a8]
pains:
  - {n: 1, title: Full details for CBG accounts only, text: 'Non-CBG accounts show contact details, account number and expiry date only.', ref: 'BRD-9 p.4; BRCSF-002, 005'}
  - {n: 2, title: Limited search keys, text: 'Agents cannot search by every key the caller gives.', ref: 'BRD-9 p.17 (e-mail); BRCSF-003'}
  - {n: 3, title: No role-based access, text: 'Agents, supervisors and management have the same rights.', ref: 'BRD-9 p.4'}
  - {n: 4, title: Updates written in QPS or EBIX, text: 'Contact details are changed in the legacy systems.', ref: 'BRD-9 p.3-5; BRCSF-004'}
  - {n: 5, title: Resends outside the tool, text: 'RA and e-policy resends are handled by other units.', ref: 'BRD-9 p.17 (e-mail item 9); BRCSF-006'}
  - {n: 6, title: No audit report; ageing servers, text: 'Management has no audit trail of agent actions; servers at end of life.', ref: 'BRD-9 p.4; BRCSF-010, 011'}
tobe:
  caption: 'Servicing contact in BIBS: no approval workflow, every action immediate and logged (FRS BRD-9 section 2.2)'
  notes: >-
    In BIBS the agent signs in to the Customer Search. One search box takes the name, client ID, account number, PN
    number or application number, and results group by client. The servicing view shows the client summary, every
    account (CBG and non-CBG) with its CSF status, payments of the last 12 months, RAs, e-policies and documents. Before
    an update the agent completes the verification checklist; only contact fields change, with a reason, in the BIBS
    client master. The agent resends the RA or the e-policy to the registered e-mail, password protected, with the
    password sent separately. The contact change is queued for QPS and EBIX while they coexist (parked seam, CSQ01).
    Management prints or saves the audit trail and agent activity in PDF or Excel.
  cols: 5
  lanes:
    - {id: cli, label: Caller (client), kind: external}
    - {id: agt, label: Contact centre agent}
    - {id: sup, label: 'Supervisor, management'}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
    - {id: leg, label: 'QPS, EBIX (coexisting)', kind: system}
  steps:
    - {id: b1, lane: cli, col: 1, text: Calls the contact centre, kind: external}
    - {id: b2, lane: agt, col: 1, text: 'One search: name, ID, account, PN'}
    - {id: b3, lane: bibs, col: 2, text: 'All accounts, 12 months payments, RAs', kind: auto}
    - {id: b4, lane: agt, col: 3, text: Caller verified; contact changed with reason}
    - {id: b5, lane: bibs, col: 3, text: Client master updated and logged, kind: auto}
    - {id: b6, lane: leg, col: 4, text: Write-back queued (parked), kind: parked}
    - {id: b7, lane: agt, col: 4, text: RA or e-policy resent}
    - {id: b8, lane: cli, col: 5, text: 'Protected file; password apart', kind: external}
    - {id: b9, lane: sup, col: 5, text: 'Audit trail, agent activity (PDF, Excel)'}
  edges:
    - [b1, b2]
    - [b2, b3]
    - [b3, b4]
    - [b4, b5]
    - [b5, b6, dashed]
    - [b5, b7]
    - [b7, b8, dashed, e-mail]
    - [b7, b9]
