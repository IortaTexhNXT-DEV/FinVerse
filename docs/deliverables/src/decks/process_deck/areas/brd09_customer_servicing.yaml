# BRD-9 Customer Servicing Facility: chapter 9 of the business process deck.
# Sources: "Customer Servicing Facility.PDF" p.3-5 (current and envisioned), p.13-14 (NFR), e-mail clarification p.17;
# FRS BRD-9 sections 2, 5, 9; cross-BRD questions XQ02, XQ04, XQ05; discrepancy register (DCR-098, 100-104, 143).
id: brd09
key: csf
num: 9
title: Customer Servicing Facility
short: Customer Servicing
brd: BRD-9
scope: 'Contact centre search, servicing view, contact updates, document resends'
status: DESIGNED
