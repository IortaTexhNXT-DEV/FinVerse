  - {n: 3, title: List kept on SharePoint, text: 'Compliance consolidates and publishes the names on SharePoint.', ref: 'BRD-10 p.6'}
  - {n: 4, title: Matching by hand, text: 'Names are matched against new and existing clients manually.', ref: 'BRD-10 p.6'}
  - {n: 5, title: Risk profile tagged by hand, text: 'The client risk profile is tagged manually.', ref: 'BRD-10 p.6'}
  - {n: 6, title: Templates outside the system, text: 'Review templates are filled outside the system and e-mailed.', ref: 'BRD-10 p.6'}
  - {n: 7, title: Routing by e-mail, text: 'Review and approval items are routed by e-mail.', ref: 'BRD-10 p.6'}
