# BRD-10 Sanction Screening and Risk Profiling: chapter 10 of the business process deck.
# Sources: "Sanction Screening and Risk Profiling BRD.pdf" p.4-5 (benefits), p.6-7 (current process, image pages
# rendered and read), p.8 (to-be), p.22-25 (NFR); FRS BRD-10 sections 2, 5, 9; discrepancy register (DCR-107-112).
id: brd10
key: sanc
num: 10
title: Sanction Screening
brd: BRD-10
scope: 'Sanction and PEP screening, risk profiling, case review, escalation, STR'
status: DESIGNED
status_text: Designed, not yet built; FRS v1.0 issued for review
department: Compliance (Chief Compliance Officer)
roles:
  - Compliance Officer and Compliance Checker
  - Unit Compliance Coordinator; Investigators (287)
  - Approver (Unit Head, 8)
  - AML Committee (5 members)
  - Operations Lead; Auditor
figures:
  - ['64 h', 'a month freed for Compliance (p.4-5)']
  - ['4 h > 1 h', 'case cycle time, current to target (p.4-5)']
  - ['10 min', 'saved per case on name screening (p.4-5)']
  - ['300', 'list records a day at most (10 to 300; p.22-25)']
sources:
  - BRD-10 p.6-7 (current process, rendered from images), p.8 (to-be)
  - SNSRP-101 to 706
  - FRS BRD-10 v1.0, sections 2 and 5
chevrons: [Configure, List intake, Matching, Risk tagging, Case, Investigation, Approval, STR]
notes:
  glance: >-
    BDOI screens clients by hand today. The BRD asks for one in-system workflow with configurable criteria and
    matrices, a list updated on a schedule, automated matching, risk tagging and case creation, review templates, routing
    to approvers, escalation to Compliance and the AML Committee, STR preparation and extraction, and immutable audit
    logs. The benefits on p.4-5 are the only quantified targets in the twelve BRDs. The module is designed.
  pains: 'The nine points are the current-process rows of FRS BRD-10 section 2.1, read from the image pages of the BRD (p.6-7).'
  after: 'The measures are BDOI''s own benefit targets (p.4-5).'
  gaps: >-
    Whether an open match blocks business (DCR-112) is the key compliance decision; BIBS warns by banner and has the
    block behind a parameter, off by default. Filing on the AMLC portal stays manual; BIBS extracts the committee-approved
    STRs in the AMLC format and records the reference.
asis:
  caption: 'Name screening and risk profiling today (BRD-10 p.6-7)'
  notes: >-
    Today the risk-profile category is cascaded by memo. The AML unit sends sanctioned names by e-mail advisory;
    Compliance consolidates them and publishes them on SharePoint. Investigators match the names against new and
    existing clients by hand, tag the client risk profile by hand, fill review templates outside the system and route
    them by e-mail for review and approval. PEP lists are prepared every quarter by Marketing and validated in NLDS, to
    which one person has access. There is no Enhanced Due Diligence for PEPs. The STR is prepared by hand and filed on
    the AMLC portal.
  cols: 6
  lanes:
    - {id: cmp, label: Compliance}
    - {id: inv, label: Investigators}
    - {id: apr, label: 'Approvers, AML Committee'}
    - {id: amlc, label: AMLC, kind: external}
    - {id: sys, label: 'E-mail, SharePoint, NLDS', kind: system}
  steps:
    - {id: a1, lane: cmp, col: 1, text: Risk category cascaded by memo, pain: [1]}
    - {id: a2, lane: sys, col: 1, text: Sanctioned names by e-mail advisory, kind: legacy, pain: [2]}
    - {id: a3, lane: cmp, col: 2, text: Names consolidated on SharePoint, pain: [3]}
    - {id: a4, lane: sys, col: 3, text: 'PEP list quarterly; NLDS, one user', kind: legacy, pain: [8]}
    - {id: a5, lane: inv, col: 3, text: Names matched by hand, pain: [4]}
    - {id: a6, lane: inv, col: 4, text: Risk tag and template by hand, pain: [5, 6]}
    - {id: a7, lane: apr, col: 5, text: Review and approval by e-mail, pain: [7]}
    - {id: a8, lane: cmp, col: 6, text: STR prepared by hand, pain: [9]}
    - {id: a9, lane: amlc, col: 6, text: STR filed on the AMLC portal, kind: external}
  edges:
    - [a1, a3]
    - [a2, a3, dashed]
    - [a3, a5]
    - [a4, a5, dashed]
    - [a5, a6]
    - [a6, a7, dashed, e-mail]
    - [a7, a8, dashed]
    - [a8, a9]
