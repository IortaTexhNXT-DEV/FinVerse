tobe:
  caption: 'To-be screening in BIBS: case workflow SCR_CASE (FRS BRD-10 sections 2.2 and 5)'
  notes: >-
    In BIBS Compliance maintains the risk categories, rules, matrices, templates and dispositions; a checker approves
    each version. List files load on a schedule or by upload, and every run is logged. BIBS matches every new client,
    every identity change, every account application, every list change and the whole client base in a batch window,
    with exact, phonetic and fuzzy rules, and sets the risk rating and the PEP / watchlist tags. A case opens and is
    assigned by the assignment matrix. The Investigator completes the review template, uploads the KYC documents and
    submits. BIBS validates the case and routes it by the approval matrix to the Unit Head, Compliance and the AML
    Committee. The STR is prefilled from the case and the committee-approved STRs are extracted in the AMLC format; the
    AMLC reference is recorded after portal filing.
  cols: 7
  lanes:
    - {id: cmp, label: 'Compliance Officer, Checker'}
    - {id: inv, label: Investigator}
    - {id: apr, label: 'Unit Head, AML Committee'}
    - {id: amlc, label: AMLC, kind: external}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
  steps:
    - {id: b1, lane: cmp, col: 1, text: 'Rules, matrices, lists approved'}
    - {id: b2, lane: bibs, col: 1, text: List files loaded; runs logged, kind: auto}
    - {id: b3, lane: bibs, col: 2, text: Matching on every trigger; risk tags, kind: auto}
    - {id: b4, lane: bibs, col: 3, text: Case opened and assigned, kind: auto}
    - {id: b5, lane: inv, col: 3, text: 'Template, KYC documents, disposition'}
    - {id: b6, lane: bibs, col: 4, text: Checked; routed by the matrix, kind: auto}
    - {id: b7, lane: apr, col: 4, text: Unit Head approves or returns}
    - {id: b8, lane: cmp, col: 5, text: BU escalation review}
    - {id: b9, lane: apr, col: 6, text: AML Committee decides}
    - {id: b10, lane: cmp, col: 6, text: STR prefilled; AMLC-format extract}
    - {id: b11, lane: amlc, col: 7, text: Filed on the portal; reference kept, kind: external}
  edges:
    - [b1, b2]
    - [b2, b3]
    - [b3, b4]
    - [b4, b5]
    - [b5, b6]
    - [b6, b7]
    - [b7, b8]
    - [b8, b9]
    - [b9, b10]
    - [b10, b11, dashed, manual filing]
