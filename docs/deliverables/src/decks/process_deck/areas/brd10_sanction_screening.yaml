  - {ref: NB-04, kind: open, topic: 'KYC and AMLA', asis: 'KYC for every new customer (corporate and retail), then the AMLA check; both done outside the system with the insurance declaration form.', want: 'Confirm whether KYC and AMLA come into the system.'}
  - {ref: 'BRD-10 p.6', kind: pain, topic: Lists, asis: 'Sanctioned names arrive by e-mail advisory and are consolidated on SharePoint; the PEP list is refreshed quarterly through NLDS, which one person can access.'}
  - {ref: 'BRD-10 p.7', kind: pain, topic: Matching and cases, asis: 'Names matched by hand; risk tag and review template filled by hand; review and approval routed by e-mail; STR prepared by hand and filed on the AMLC portal.'}
  - {ref: CP-01, kind: open, topic: E-signature, asis: 'E-signature requirement to be checked with Legal and Compliance.', want: 'Decision on e-signature for approvals and documents.'}
asis:
  caption: 'Name screening and risk profiling today (BRD-10 p.6-7)'
  notes: >-
    Today the risk-profile category is cascaded by memo. The AML unit sends sanctioned names by e-mail advisory;
    Compliance consolidates them and publishes them on SharePoint. Investigators match the names against new and
    existing clients by hand, tag the client risk profile by hand, fill review templates outside the system and route
    them by e-mail for review and approval. PEP lists are prepared every quarter by Marketing and validated in NLDS, to
    which one person has access. There is no Enhanced Due Diligence for PEPs. The STR is prepared by hand and filed on
    the AMLC portal.
