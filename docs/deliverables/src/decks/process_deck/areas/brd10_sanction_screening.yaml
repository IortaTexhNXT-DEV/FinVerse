chevrons: [Configure, List intake, Matching, Risk tagging, Case, Investigation, Approval, STR]
notes:
  glance: >-
    Compliance screens clients against sanction and PEP lists, profiles their risk, reviews possible matches and files
    suspicious transaction reports with the AMLC. Today names are matched by hand against lists that arrive by e-mail
    and are kept on SharePoint, and the PEP list is refreshed quarterly through one NLDS user. On the floor, Marketing
    confirmed that KYC and the AMLA check for every new client happen outside the system (NB-04). BRD-10 is the only
    BRD with quantified benefits (p.4-5).
  heard: 'The floor-walk note that touches Compliance, and the current process of BRD-10.'
  pains: 'The nine points of the BRD-10 current process (p.6-7).'
  after: 'The benefit column names what the To-Be removes.'
  missed: 'Block or warn on a match is the decision that shapes New Business and Renewal.'
