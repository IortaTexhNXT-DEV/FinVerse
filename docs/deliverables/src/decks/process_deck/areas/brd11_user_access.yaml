pains:
  - {n: 1, title: Requests go through IT, text: 'The business unit coordinates every request with IT; this causes delays.', ref: 'BRD-11 p.5'}
  - {n: 2, title: Approver reached by e-mail, text: 'No queue of requests waiting for a decision.', ref: 'BRD-11 p.5; BRD 2.002'}
  - {n: 3, title: IT grants the access, text: 'The grant waits for IT; no effective date.', ref: 'BRD-11 p.5-6'}
  - {n: 4, title: Group profiles changed by IT, text: 'Profile changes are made on request with no approval trail.', ref: 'BRD-11 p.5-6; BRD 3.002'}
  - {n: 5, title: Access lists by hand, text: 'Who has which access, and since when, is compiled manually.', ref: 'BRD-11 p.5; BRD 3.003, 4.003'}
tobe:
  caption: 'User access and group-profile requests in BIBS (FRS BRD-11 section 2.2)'
  notes: >-
    In BIBS the Requestor raises the request (enrol, modify, deactivate or reactivate, alone or in bulk), as a draft or
    submitted, and chooses the approver. BIBS checks it, sets it PENDING and notifies the chosen approver, who sees it
    under "Assigned to me". A change to a high-privilege profile, or a submission outside working hours, needs a second
    approval and raises an alert. The approver approves, rejects with a reason or returns it with remarks. BIBS applies
    the change on approval or on the effective date, logs the from / to values and notifies the requester and the
    affected user. Group profiles are requested by the Business Administrator, approved in order and implemented by the
    System Administrator. Four reports and a structured audit log show who has which access, since when and who changed
    it. Sign-in by the BDO directory (EUA) is a parked port.
  cols: 6
  lanes:
    - {id: req, label: Requestor}
    - {id: apr, label: 'Approver, 2nd approver'}
    - {id: adm, label: 'Business and System Admin'}
    - {id: dir, label: BDO directory, kind: external}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
  steps:
    - {id: b1, lane: req, col: 1, text: 'Request: draft, submit or bulk'}
    - {id: b2, lane: bibs, col: 2, text: Checked; chosen approver notified, kind: auto}
    - {id: b3, lane: bibs, col: 3, text: 'Risk rule: high privilege, after hours', kind: auto}
    - {id: b4, lane: apr, col: 4, text: 'Approve, reject or return'}
    - {id: b5, lane: bibs, col: 5, text: Applied on approval or effective date, kind: auto}
    - {id: b6, lane: bibs, col: 6, text: Requester and user notified, kind: doc}
    - {id: b7, lane: adm, col: 5, text: Group profile approved and implemented}
    - {id: b8, lane: adm, col: 6, text: Four access reports; audit log}
    - {id: b9, lane: dir, col: 1, text: Sign-in by EUA (parked), kind: parked}
  edges:
