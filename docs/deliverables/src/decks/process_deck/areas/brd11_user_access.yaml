# BRD-11 User Access Maintenance: chapter 11 of the business process deck.
# Sources: "User Access Maintenance.pdf" p.5 (current and envisioned), p.6 (process diagrams), p.11-18 (NFR);
# FRS BRD-11 sections 2 (incl. the built baseline), 5, 9; decisions D5, D6, D7; register (DCR-096, 114, 115, 121, 141, 143).
id: brd11
key: uam
num: 11
title: User Access Maintenance
brd: BRD-11
scope: 'User access requests, approvals, group profiles, access reports'
status: PARTLY BUILT
status_text: 'Baseline built (users, roles, access requests); BRD-11 changes designed'
