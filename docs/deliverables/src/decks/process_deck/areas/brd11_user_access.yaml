chevrons: [Draft, Submit, Risk check, Decide, Correct, Apply, Group profile, Reports]
notes:
  glance: >-
    Today BDOI coordinates every QPS access request with IT, which causes delays (BRD-11 p.5). The BRD asks for a module
    in which the business unit manages permissions, roles and access levels itself, with self-service requests. Part of
    it is built: users, roles, permissions, sign-in with lock-out after 3 attempts, the session policy (warning at 15
    minutes, sign-out at 30), access requests under four eyes and the User Access Matrix. BRD-11 adds drafts, returns,
    chosen approvers, effective dates, bulk, second approval, group-profile requests and four reports. Directory sign-in
    (EUA) is a parked port until BDO supplies the interface (decision D6).
  pains: The five points are the current-process rows of the BRD (p.5).
  after: The volumes are small (p.11); the value is control and speed, not throughput.
  gaps: >-
    The BRD is written for the "QPS User Access Maintenance Module" (DCR-114); the project reads it as BIBS-wide.
    It has no acceptance criteria (DCR-115); the FRS proposes them for BDOI's concurrence.
asis:
  caption: 'Access requests today (BRD-11 p.5-6)'
  notes: >-
    Today the business unit sends access requests to IT and coordinates them. The approver is reached by e-mail. IT
    grants the access in QPS, and group profiles are created or changed by IT on request. Access lists are compiled by
    hand (BRD-11 p.5).
  cols: 5
  lanes:
