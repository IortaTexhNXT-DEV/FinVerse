    - {id: apr, label: Approver}
    - {id: it, label: BDO IT, kind: external}
    - {id: sys, label: 'QPS, e-mail, Excel', kind: system}
  steps:
    - {id: a1, lane: req, col: 1, text: Access request sent to IT, pain: [1]}
    - {id: a2, lane: apr, col: 2, text: Approver reached by e-mail, pain: [2]}
    - {id: a3, lane: it, col: 3, text: IT grants the access, kind: external, pain: [3]}
    - {id: a4, lane: sys, col: 3, text: User and roles set in QPS, kind: legacy}
    - {id: a5, lane: it, col: 4, text: Group profile changed on request, kind: external, pain: [4]}
    - {id: a6, lane: sys, col: 5, text: Access lists compiled by hand, kind: legacy, pain: [5]}
  edges:
