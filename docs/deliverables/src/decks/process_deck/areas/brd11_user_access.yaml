notes:
  glance: >-
    Today BDOI coordinates every access request with IT, which causes delays (BRD-11 p.5). The BRD asks for a module
    in which the business manages permissions, roles and access levels itself, with self-service requests, approvals
    and access reports. The floor walk showed why this matters beyond BRD-11: in New Business, who books depends on who
    has EBIX access; Combank account support books on behalf of Marketing; two contact centres handle cases; and EB
    portal users would be BDOI's first external users.
  heard: 'Access observations from the process flows and the floor walk.'
  pains: 'The five points of the BRD-11 current process (p.5-6).'
  after: 'The benefit column names what the To-Be removes.'
