notes:
  glance: >-
    When a bank client (home loan, auto loan, leasing) buys insurance outside BDOI and submits the policy to the bank,
    BDOI checks that the cover is adequate, issues an IAAF to the bank unit, monitors the policy on a masterlist and
    tries to win the business at renewal. Today it is tracked outside any system, on masterlists kept on a shared drive
    (Drive H) and SharePoint (SP-01).
  heard: 'Note of the 24-Sep session and the steps of the Submitted Policies process flow.'
  pains: 'The eight points of the BRD-12 current process (p.4-7); the process flow confirms each one.'
  after: 'The benefit column names what the To-Be removes.'
  missed: 'Mostly timing and channel details; the lead days of Submitted Policies and Renewal do not line up.'
heard:
  - {ref: SP-01, kind: pain, topic: Leasing and mortgage, asis: 'Leasing and mortgage accounts are "submitted policies"; they are tracked manually, not in a system.'}
  - {ref: 'SP flow p.1', kind: asis, topic: Intake, asis: 'Policy details extracted from LFS and CIU and the daily HLS insurance report; documents from the Home Loan AO and IBG / Leasing; validated and consolidated in the Submitted Masterlist on Drive H within 30 days; IAAF (PDF) issued when there are findings.'}
  - {ref: 'SP flow p.2', kind: asis, topic: Handling fee (CBG Motor), asis: 'UPP list on SharePoint filtered for handling-fee billing; NB TL assigns to the AO; disposition fed back by e-mail; client IDs saved in a shared folder.'}
  - {ref: 'SP flow p.3', kind: asis, topic: Renewal CBG Motor, asis: 'SPI list from Drive H mapped to NB and Renewal databases; matched with LAMD; FFY, BDO / SM employees and No Touch excluded; loan status updated; RA by snail mail at 90 days; NRNS list to COG and to AOs for call-outs.'}
  - {ref: 'SP flow p.4', kind: rule, topic: Renewal CBG Fire, asis: 'Assign an insurer different from the expiring one; proposal with a 30-day hold cover by e-mail; accepted within 3-5 days or re-assigned.'}
  - {ref: 'SP flow p.5', kind: asis, topic: Renewal Non-CBG Retail, asis: 'AO asks the insurer to quote on expiring terms, quotes the employee, prepares the ARF in ISYS; NRNS letter by e-mail if declined.'}
asis:
  caption: 'Submitted policies today (BRD-12 p.4-7)'
  notes: >-
    Today CBG Motor Team Leads extract policy details from LFS and CIU and the Submitted Handler consolidates them within
    30 days; CBG Fire policies come from Home Loan AOs; Non-CBG Corporate and Branch policies are reviewed by a Policy
    Reviewer who issues an IAAF on paper; Non-CBG Retail policies come from the LAMD report. Each segment keeps an Excel
    masterlist on a shared drive. At renewal a Sanitation Handler matches the list against LAMD by hand, excludes
    accounts that must not be renewed, assigns an insurer and sends a proposal with a 30-day hold cover request, and an
    RA text file goes to COG for mailing. Limit breaches are handled by e-mail with TSU, handling-fee payments are
    filtered from the UPP list on SharePoint, and status is monitored in the masterlists.
  cols: 7
  lanes:
    - {id: bank, label: 'Bank units: LFS, CIU, LAMD', kind: external}
    - {id: hdl, label: 'Handlers (CBG)'}
    - {id: rev, label: 'Policy Reviewer, AO, TSU'}
    - {id: ins, label: 'Insurers, COG', kind: external}
    - {id: sys, label: 'Excel on Drive H:, SharePoint', kind: system}
  steps:
    - {id: a1, lane: bank, col: 1, text: 'Reports from LFS, CIU, LAMD', kind: external}
    - {id: a2, lane: hdl, col: 1, text: Details consolidated by hand, pain: [1]}
    - {id: a3, lane: sys, col: 2, text: Masterlist per segment, kind: legacy, pain: [2]}
