notes:
  glance: >-
    Submitted policies are policies that bank clients (CBG Motor, CBG Fire, Non-CBG Corporate and Branches, Non-CBG
    Retail) placed outside BDOI and submitted to the bank. BDOI keeps them on a masterlist, reviews their adequacy, and
    at expiry converts them to BDOI-placed renewals. In BIBS the renewal from the hand-off on belongs to the Renewal
    module (decision D2). The module is designed; the build needs BT0, Collections and Cashiering for its ports.
  pains: The eight points are the current-process rows of FRS BRD-12 section 2.1, read from the image pages of the BRD (p.4-7).
  after: The usage table gives the volumes and the 2-second response target (p.13-14), the tightest in the twelve BRDs.
  gaps: The bucket list (DCR-124) and the LAMD intake (DCR-146) decide which submitted policies are renewed.
asis:
  caption: 'Submitted policies today (BRD-12 p.4-7)'
  notes: >-
    Today CBG Motor Team Leads extract policy details from LFS and CIU and the Submitted Handler consolidates them within
    30 days; CBG Fire policies come from Home Loan AOs; Non-CBG Corporate and Branch policies are reviewed by a Policy
    Reviewer who issues an IAAF on paper; Non-CBG Retail policies come from the LAMD report. Each segment keeps an Excel
    masterlist on a shared drive. At renewal a Sanitation Handler matches the list against LAMD by hand, excludes
    accounts that must not be renewed, assigns an insurer and sends a proposal with a 30-day hold cover request, and an
    RA text file goes to COG for mailing. Limit breaches are handled by e-mail with TSU, handling-fee payments are
    filtered from the UPP list on SharePoint, and status is monitored in the masterlists.
  cols: 7
