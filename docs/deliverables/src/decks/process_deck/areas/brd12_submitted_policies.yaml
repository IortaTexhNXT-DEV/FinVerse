# Sources: discovery 24-Sep-2026 (floor-walk note SP-01); high-level Submitted Policies process flow (new business
# intake, handling fee for CBG Motor, renewal for CBG Motor, CBG Fire and Non-CBG Retail); BRD-12 p.4-14;
# discrepancy register (DCR-124, 125, 126, 129, 146, 155).
