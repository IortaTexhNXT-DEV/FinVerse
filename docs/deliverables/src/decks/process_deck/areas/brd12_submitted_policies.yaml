    - {id: b6, lane: rev, col: 4, text: Review; IAAF by approval matrix}
    - {id: b7, lane: rev, col: 5, text: 'Limit breach: TOR via TSU matrix'}
    - {id: b8, lane: bibs, col: 5, text: Expiry scan; hand-off to Renewal, kind: auto}
    - {id: b9, lane: bibs, col: 6, text: 'Renewal: account, hold cover, RA', kind: doc}
    - {id: b10, lane: ins, col: 6, text: Confirms the 30-day hold cover, kind: external}
    - {id: b11, lane: hdl, col: 7, text: 'Reports, alerts; BOOKED shown'}
    - {id: b12, lane: bibs, col: 7, text: Handling fee tagged by PN, kind: auto}
