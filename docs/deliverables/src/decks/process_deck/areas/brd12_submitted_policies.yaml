tobe:
  caption: 'Submitted Policies in BIBS: workflow SBM_POLICY and the Renewal hand-off (FRS BRD-12 section 2.2; decision D2)'
  notes: >-
    In BIBS each source file is uploaded and validated, one masterlist record per policy; fields are proposed from the
    policy document and saved only after a user confirms them. One Submitted Masterlist keeps history and role-based
    access. A processing run sanitises, matches against LAMD by PN, classifies (Inforced or Submitted), buckets and tags
    each policy; fallout is listed with reason codes. Reviews and the IAAF follow the approval matrix, with stamped
    signatures. A limit breach produces a TOR approved by the TSU matrix and handed to the AO. The expiry scan hands
    renewable policies to the Renewal module, which creates the account, requests the 30-day hold cover and sends the
    letters. Handling-fee payments are tagged in the Unapplied Payment List by PN or location reference. The source
    feeds, OCR, qualified e-signature and COG transport are parked ports (upload, manual entry, stamped signature,
    print batch).
  cols: 7
  lanes:
    - {id: bank, label: 'Bank units: LFS, CIU, HLS, LAMD', kind: external}
    - {id: hdl, label: 'Handlers (CBG)'}
    - {id: rev, label: 'Policy Reviewer, AO, TSU'}
    - {id: ins, label: Insurers, kind: external}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
