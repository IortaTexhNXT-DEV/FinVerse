notes:
  glance: >-
    BDOI Reinsurance places facultative reinsurance for cedants and for risks TSU cannot place fully in the direct
    market. The RI officer reviews the request, prepares the facultative slip, approaches reinsurers or partner RI
    brokers, negotiates, confirms the closings and sends the debit note to the cedant; then monitors premium payment
    warranties, RI premium remittance and RI commission, and handles RI claims, cash calls and settlement. BDOI placed
    the reinsurance module in phase 2 (answer A3), so it is outside the January 2028 go-live, but the TSU referral and
    the RI transactions that Remittance handles in Drop 1 (DCR-210) touch phase 1.
  heard: 'Steps of the Reinsurance process flow; the RI team was not part of the September floor walks.'
  pains: 'Points 1 to 8 are on the As-Is swimlane.'
  after: 'The To-Be is the phase-2 RI BRD (FRID numbers).'
  missed: 'The TATs of the flow are not requirements in the RI BRD, and the RI transactions of Drop 1 are undefined.'
