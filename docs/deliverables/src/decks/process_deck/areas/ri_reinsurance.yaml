asis:
  caption: 'Reinsurance today (Reinsurance process flow: placement, commission collections, claims, settlement)'
  notes: >-
    TSU e-mails the facultative request. The RI officer acknowledges it within 24 hours, reviews the underwriting
    information and prepares the facultative slip within 3 working days, approaches reinsurers and partner RI brokers
    by e-mail and negotiates. Once enough capacity is secured the officer checks conditions and warranties, informs TSU
    in writing, sends the closings and the debit note to the cedant and chases the signed slips. Premium payment
    schedules, warranties and expected RI commission are tracked on a monitoring sheet shared with the Commission
    Receivable Unit, with reminders by e-mail. For claims the claims handler records the reserve, shares the adjuster's
    reports with every reinsurer within 48 hours, prepares the RCRF and the formal loss advice, and for cash calls
    invoices the panel within 72 hours, collects within 10 days and remits within 5 days. None of the deadlines is
    tracked by a system.
