tobe:
  caption: 'Reinsurance To-Be in the RI BRD (phase 2): FRID-001 to 106'
  notes: >-
    In the RI BRD, TSU creates the placement request in the system and it flows to BDOI RI with the slip information.
    Reinsurers and RI brokers are kept as contacts with their shares; the request and the slips are sent to them from
    the system, and non-acceptance reasons are captured and notified to TSU. Revised slips go back to the cedant or TSU
    for sign-off and then to the reinsurers; the signed slip is handed to Operations, booked with generated accounting
    entries and an SOA is scheduled and sent. Premium payments are applied and matched, instalment reminders go to the
    AO, and a proof of remittance and remittance schedule are generated. For claims the system records the net loss
    reserve per reinsurer, generates the PLA, RCRF and formal loss advice, sends cash calls and debit notes, captures
    paid proceeds with the cash entry and supports net settlement. Every action is logged with its turnaround time.
  cols: 7
  lanes:
    - {id: tsu, label: 'TSU, cedant', kind: external}
    - {id: ri, label: 'RI Officer'}
    - {id: mkt, label: 'Reinsurers, RI brokers', kind: external}
    - {id: clm, label: 'Claims, Comptrollership'}
    - {id: bibs, label: BIBS (automatic), kind: bibs}
  steps:
    - {id: t1, lane: tsu, col: 1, text: Placement request created, kind: external}
    - {id: t2, lane: bibs, col: 1, text: 'Request flows to RI with slip data', kind: auto}
    - {id: t3, lane: ri, col: 2, text: 'Reviews; picks reinsurers and shares'}
    - {id: t4, lane: bibs, col: 3, text: 'Slip sent; answers and reasons captured', kind: auto}
    - {id: t5, lane: mkt, col: 3, text: 'Accept, decline or sign the slip', kind: external}
    - {id: t6, lane: ri, col: 4, text: 'Revised slip to cedant / TSU for sign-off'}
    - {id: t7, lane: bibs, col: 5, text: 'Booked; entries; SOA scheduled', kind: auto}
    - {id: t8, lane: bibs, col: 6, text: 'Instalment reminders; proof of remittance', kind: doc}
    - {id: t9, lane: clm, col: 6, text: 'Loss reserve per reinsurer; PLA, RCRF, FLA'}
    - {id: t10, lane: bibs, col: 7, text: 'Cash call, debit note; net settlement', kind: auto}
    - {id: t11, lane: mkt, col: 7, text: 'Pays share; proceeds captured', kind: external}
