    notes: >-
      The BRDs together describe one application for the thirteen areas, grouped the way BDOI navigates: client and
      policy, operations, finance, claims and service, reports, and setup and administration. Every function uses the
      same shared capabilities: workflow with SLA, documents and templates, notifications, reports, the audit trail and
      the configuration masters the business maintains. External parties reach it by e-mail with a send log, by file,
      or later by portal and API; the bank, insurer, directory and data-platform interfaces are still to be specified
      with BDO IT (Part G).
