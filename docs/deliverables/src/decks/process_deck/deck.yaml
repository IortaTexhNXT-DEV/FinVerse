    notes: >-
      The scale is the project team's reading of what we saw on the floor, the BRDs and the practices in each chapter.
      It is a discussion aid, not an audit rating. Integration stays lowest in the To-Be because the bank, insurer and
      enterprise interfaces are still to be specified.
    basis: 'Scale: project team assessment from the floor walk, the process flows and the BRDs'
    levels: ['Manual: paper, e-mail', 'Tool-assisted: spreadsheets, separate systems', 'One workflow in one system', 'Automated, with exception queues', 'Integrated and measured']
    themes:
      - {theme: Automation, now: 1, bibs: 4, best: 5, why: 'Today: split files, receipts, reversals and journals by hand (Operations and FRBS flows). To-Be: jobs, matching and straight-through steps with exception queues.'}
      - {theme: Controls, now: 2, bibs: 4, best: 5, why: 'Today: wet signatures, Teams approvals, checker-poster one by one. To-Be: maker-checker and approval matrices in the workflow.'}
      - {theme: Data, now: 1, bibs: 4, best: 5, why: 'Today: three references, Excel masterlists, re-keying across five tools. To-Be: one client, one ARN, one invoice ledger.'}
      - {theme: Integration, now: 2, bibs: 3, best: 5, why: 'Today: e-mail, SFTP and WinSCP files, IT batches. To-Be: uploads and seams; APIs to specify.'}
      - {theme: Customer service, now: 2, bibs: 3, best: 5, why: 'Today: CBG-only view, cases logged by hand. To-Be: every account; case management not in BRD-9.'}
      - {theme: Compliance, now: 1, bibs: 4, best: 5, why: 'Today: KYC and AMLA outside the system, names matched by hand. To-Be: screening on every trigger with cases.'}
