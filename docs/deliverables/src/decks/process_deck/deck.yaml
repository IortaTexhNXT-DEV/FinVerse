  dm:
    num: 14
    short: Data migration
    context:
      title: '14. Data migration: the BRD and the floor'
      intro: 'A selective, continuity-first migration: clean masters and open items move; history stays readable in legacy or an archive.'
      notes: >-
        BRD-13 is a draft v0.01 of 14-Apr-2026, unsigned (DCR-189, 190). It asks for a selective migration, not a full
        history conversion: master and reference data migrate, open financial items are carried forward on legacy
        sub-ledgers, history is archived with logged access, and in-force policies are recreated cleanly when they
        renew. The floor walk showed where the data actually lives today and why it is hard to move.
      cards:
        - head: What BRD-13 asks
          body:
            - 'Migrate clean masters: clients, LOVs, insurers, products, packages, rates, chart of accounts map'
            - 'Carry forward open items: open invoices, unapplied payments, receivables, remittance in flight'
            - 'Archive history read-only; in-force policies recreated at renewal'
            - '23 requirements, all "must have"; draft, unsigned'
        - head: What the floor walk adds
          body:
            - 'Data also lives in ICS, CLS, SharePoint, Drive H and Excel trackers (DP lists, commission trackers, RI sheet, NB and ManCom masterlists)'
            - 'Three references per transaction to map (OV-03)'
            - 'Direct-pay tags, threshold accounts and 0.99 variances in the balances (CA-02, CA-03)'
            - 'Leads and clients in one category (OV-04)'
        - head: Key dates
          body:
            - 'Mock 1 Apr 2027; Mock 2 Jul 2027; Mock 3 Aug 2027; Mock 4 Oct 2027'
            - 'Dress rehearsal Nov 2027'
            - 'Freeze Fri 31-Dec-2027; load Sat 1-Jan-2028'
            - 'Go-live Mon 3-Jan-2028; true-ups to May 2028'
  # sources and objects are tables
    sources:
      title: '14. Data migration: where the data lives today'
      headers: [Source, What it holds, After the freeze, What the floor walk adds]
      widths: [1.8, 4.2, 2.6, 3.8]
      notes: 'Sources: DM strategy "Legacy systems in scope"; DATA_MIGRATION_DESIGN section 2; floor-walk notes and process flows.'
      rows:
        - [EBIX Evolution, 'Booking, invoices, AR / OR, remittance, unapplied, GL, payees, branches, EB programmes, claims', 'Read-only until the archive is loaded', 'Policy-fee invoices keyed in the report menu; DP tags without premium entries']
        - [QPS, 'Quotations, clients, covers, packages, rates, sales organisation, renewals, users', 'Read-only; retired after the last QPS policy renews', 'Holds the three references; receives accounts migrated from ISYS']
        - [ISYS / Broker, 'Leads, clients, accounts, Marketing Diary, claims and GL reports', 'Read-only; archived', 'Client codes kept for renewal (NB-15); leads not separated (OV-04)']
        - ['ICS (Collections)', 'Dispositions, promises, collector assignments, ageing', 'Read-only; archived', 'Status and ageing wrong after payment (CO-02); named CMS in the BRD: confirm']
        - ['Excel, Drive H, SharePoint', 'Submitted masterlists, RMEL dispositions, RA trackers, KYC documents', 'Migrated or archived with checksums', 'Also DP lists, commission trackers, RI sheet, NB masterlist, ManCom list']
        - ['CLS, CC Nav', 'Contact-centre cases and knowledge', 'Not in the object list', 'Every contact logged by hand; confirm scope']
    objects:
      title: '14. Data migration: objects and treatment'
      headers: [Group, Objects, Treatment, Planning volume]
      widths: [1.8, 5.0, 2.6, 3.0]
      notes: 'DM layouts, objects R01-H02. Real counts are due from BDOI by 29-Jan-2027 (DMQ28).'
      rows:
        - [Reference, 'LOVs and MIS values, branches, sales organisation, insurers, products and risk codes, packages, commission rates, chart of accounts map', Migrate, 'Under 100 insurers; ~600 AOs; a few hundred products']
        - [Users, 'Users and roles', 'Excluded: recreated by access requests', '~1,344 users']
        - [Clients, 'Clients, contacts, payout accounts; KYC documents; screening results', 'Migrate; KYC archived; full re-screen', 'Loaders sized for 1,000,000']
        - [Policies, 'In-force policy headers (every expiry to 31-May-2028); expired policies; RA-sent file; submitted masterlists; EB programmes', 'Conditional; archive', '250-310K renewable accounts a year']
        - [Open items, 'Open invoices with components and insurer shares; unapplied payments; open collection state; remittance in flight; PDCs; open claims', 'Carry forward on legacy sub-ledgers', 'Sized for 500,000 invoices; 55 new claims a day']
        - [Ledger, 'Opening trial balance; GL history; FY2027 true-ups', 'Migrate; archive; true-up', 'A few thousand lines']
        - [History, 'Closed transactions, legacy documents', Archive with legacy inquiry, To supply]
    approach:
      title: '14. Data migration: approach and gates'
      row1: What happens
      row2: Who signs
      notes: >-
        Every object passes seven gates with segregation of duties. Reconciliation runs at five levels, from counts to
        the general ledger, with Migration Clearing at 0.00 per branch and currency. Four mock loads and a dress
        rehearsal precede the cut-over weekend.
      stages: ['G1 Decide', 'G2 Map', 'G3 Validate', 'G4 Load', 'G5 Reconcile', 'G6 Accept', 'G7 Go-live']
      systems: ['Class per object: migrate, carry, archive, exclude', 'Code maps and rules', 'Quality checks: 0.5% masters, 0 money', 'Load through business services; rerunnable', 'Counts, amounts, hashes, fields, GL', 'Business acceptance per object', 'Go / no-go: 12 criteria']
      owners: ['Data owner', 'Data owner, steward', 'Migration lead', 'Migration lead', 'Comptrollership', 'Department head', 'Go / no-go board']
      flows:
        - head: Reconciliation levels
          body: ['L1 counts; L2 amounts, tolerance 0.00', 'L3 hash totals; L4 field by field', 'L5 GL: clearing 0.00 per branch and currency']
        - head: Rehearsals
          body: ['Mock 1-4 in SIT and UAT, Apr to Oct 2027', 'Dress rehearsal Nov 2027 with 20% time margin', 'Reference data and clients load first']
        - head: Cut-over weekend
          body: ['Freeze Fri 31-Dec-2027 22:00; load Sat', 'Go / no-go Sun 18:00; go-live Mon 3-Jan-2028', 'Hypercare 30 days; daily sub-ledger to GL check']
    challenges:
      title: '14. Data migration: challenges we see'
      notes: 'From the DM strategy risks, the design and the floor walk.'
      cards:
        - head: Duplicate clients
          chip: PARTLY
          body: ['Same client in Broker, QPS, EBIX, ICS with different numbers', 'Scored matching; steward queue for 60-89', 'Bank CIF as a key: BDOI to confirm (DMQ04)']
        - head: Several references per invoice
          chip: CONFIRM
          body: ['ISYS, QPS, EBIX and payment references (OV-03)', 'Uniqueness of EBIX vs QPS numbers unknown (DMQ11)', 'Mapping per reference needed (CQ22)']
        - head: Balances by component
          chip: PARTLY
          body: ['Legacy may not give open balances per component and insurer share (DMQ12)', 'Threshold accounts and DP tags distort balances (CA-02, CA-03)', 'Paid vs remitted split']
        - head: Data outside systems
          chip: NOT_IN_BRD
          body: ['DP lists, commission trackers, RI sheet, NB and ManCom masterlists in Excel', 'CLS cases; SharePoint lists', 'Not in the object list (DMQ30)']
        - head: January 2028 renewals
          chip: PARTLY
          body: ['RMEL normally at -140 days; January expiries get days to 4 weeks', 'Every header to 31-May-2028 must load', 'Package remapping at sanitation (DMQ36)']
        - head: People and time
          chip: CONFIRM
          body: ['Data owners and stewards not named', 'M1 decisions due 16-Oct-2026', 'Cut-over over the year-end holidays']
    missed:
      title: '14. Data migration: gaps'
      notes: 'BRD-13 gaps from the register (DCR-157, 189-209) and from the floor walk.'
      rows:
        - {cov: CONFIRM, item: BRD-13 status, seen: 'Draft v0.01, unsigned, template text.', brd: 'Draft only.', rec: 'Sign BRD-13 with the migration object list.', ref: 'DCR-189, 190'}
        - {cov: PARTLY, item: Go-live scope per BRD, seen: 'Each department keeps open items differently.', brd: 'Scope, cut-off and format uneven across BRDs.', rec: 'One object register approved by every data owner.', ref: 'DCR-157'}
        - {cov: NOT_IN_BRD, item: 'Objects outside BRD-13', seen: 'Claims, EB, SP masterlists, payees, PDCs, DP and RI trackers.', brd: 'Not listed.', rec: 'Add them with class and owner.', ref: 'DMQ30; DCR-196'}
        - {cov: CONFIRM, item: Collections source, seen: 'ICS on the floor.', brd: 'CMS (Collection Management System).', rec: 'Confirm ICS = CMS and its extract.', ref: 'CO-02; DCR-221'}
        - {cov: CONFIRM, item: Volumes, seen: 'Volumes heard on the floor only.', brd: 'Counts to be supplied.', rec: 'Supply counts per object by M3.', ref: DMQ28}
        - {cov: CONFIRM, item: Year-end option, seen: 'Cut-over at year end.', brd: 'Provisional opening, true-ups to May 2028 proposed.', rec: 'Comptrollership to confirm option A.', ref: DMQ39}
        - {cov: PARTLY, item: Data owners and stewards, seen: 'Owners implied by department.', brd: 'Roles described, people not named.', rec: 'Name an owner and a steward per object.', ref: 'DMQ01'}
    best:
      - {practice: Named data owners and stewards, status: PARTLY, lever: Accountability, what: 'Each object has a business owner who signs the class, the maps and the acceptance, and stewards who clean it.', rec: 'Name them in October 2026.'}
      - {practice: Clean at source now, status: PARTLY, lever: Fewer fall-outs, what: 'Duplicates, missing TINs and old unapplied items fixed in legacy long before the mocks.', rec: 'Start a cleansing sprint per department in Q4 2026.'}
      - {practice: Reconciled by construction, status: IN_BRD, lever: Audit comfort, what: 'Every load reconciles counts, amounts and GL; clearing account at zero.', rec: 'Comptrollership signs each financial object.'}
      - {practice: Rehearse the cut-over, status: IN_BRD, lever: Predictable go-live, what: 'Timed mocks and a dress rehearsal with the real run book.', rec: 'Keep the four mocks and the dress rehearsal.'}
      - {practice: Retire spreadsheets, status: BEYOND, lever: One source of truth, what: 'Every tracker either migrates into the system or is archived; none survives go-live.', rec: 'Inventory the trackers per department.'}
      - {practice: Legacy inquiry and archive, status: IN_BRD, lever: Decommissioning, what: 'History readable after legacy is switched off, with logged access.', rec: 'Agree retention per record type (DCR-136).'}

