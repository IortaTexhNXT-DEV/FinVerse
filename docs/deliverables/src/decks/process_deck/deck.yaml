  refs:
    title: 'One transaction, several references'
    caption: 'Seen in Cashiering (CA-01), the overview (OV-03), the e-policy text files (NB flow) and the reversal lists (DPPR).'
    notes: >-
      The same deal carries an ISYS invoice number (the client pays against it), a QPS reference, an EBIX reference and
      a payment reference; QPS holds all three. It is the single most repeated friction on the floor: it slows every
      trace, forces manual receipts and VLOOKUPs, and it will need careful mapping in the data migration.
    refs:
      - {system: 'ISYS / Broker', number: 'Invoice number', who: 'Marketing; the client pays against it'}
      - {system: QPS, number: 'QPS reference', who: 'Processing; holds all three numbers'}
      - {system: EBIX, number: 'EBIX reference', who: 'Booking, accounting, remittance'}
      - {system: 'Bank, Cashiering', number: 'Payment reference', who: 'Bills payment, CLPC, Autopay'}
    effects:
      - 'Tracing one transaction across systems is slow (OV-03)'
      - 'Receipts are created by hand against three numbers (CA-01)'
      - 'Each payment is checked: "in QPS with an EBIX reference?" (Cashiering flow)'
      - 'Reversal lists are matched to IT extracts by VLOOKUP on the invoice number (DPPR / PR2307)'
      - 'E-policy updates need text files with the policy, ISYS, EBIX and QPS numbers (NB flow)'
      - 'Migration must map several legacy references per invoice (CQ22, DMQ11)'
    brd:
      - 'One client master and one account number (ARN) per account (BRNB.102)'
      - 'One invoice ledger; related transactions carry the root invoice number (ACSL 2.16, DIS 3.27.2)'
      - 'Legacy references kept for search after migration'
    rec:
      - 'One lifecycle reference printed on quotation, invoice, AR / OR, SOA and e-policy letter'
      - 'A payment reference with a check digit derived from it, carried in bank files'
      - 'BDOI to confirm (open point OV-03)'

