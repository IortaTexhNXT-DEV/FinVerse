  summary:
    title: 'What we learned, in six messages'
    notes: >-
      The six messages of the reverse KT. Each is developed in the holistic chapter and the department chapters; the
      evidence refs point to the floor-walk notes and the process flows.
    cards:
      - head: '1. One deal, five tools, three references'
        body: ['Excel templates, Broker, ISYS, QPS and EBIX for one policy (NB flow)', 'ISYS, QPS and EBIX numbers on the same transaction (OV-03)', 'The BRDs answer it: one client, one ARN, one invoice ledger']
      - head: '2. E-mail and Excel carry the work'
        body: ['16 department hand-offs by e-mail, file, Teams or paper', 'Dispositions, recon, DP lists, trackers in Excel', 'Most move into workflows in the BRDs']
      - head: '3. Controls rely on people'
        body: ['Wet signatures at 3-6 levels; checker-poster one by one', 'Intake checks and reversals by hand', 'The BRDs add maker-checker; a DOA matrix is still to agree']
      - head: '4. IT is in the business path'
