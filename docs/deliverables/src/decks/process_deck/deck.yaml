roadmap:
  part:
    num: H
    title: 'Roadmap and best practice'
    subtitle: 'Streamline first, then automate: what BDOI can do now, at go-live and after'
    notes: >-
      The roadmap does not wait for the system. Some improvements are decisions BDOI can take now (rules, owners,
      templates, data clean-up); the BRD scope arrives at go-live in January 2028; automation and integration beyond the
      BRDs follow once the platform is stable.
    chapters:
      - {num: 17, title: 'Roadmap, gaps and open points', sub: 'Principles, automation map, horizons, KPIs, consolidated gaps, open points'}
  principles:
    title: '17. Five levers to streamline before we automate'
    notes: >-
      Automating a broken process only makes it fail faster. These five levers, applied in order, are how insurance
      brokers usually take cost and delay out of operations; each has BDOI examples from the floor walk.
    items:
      - head: Eliminate
        text: 'Remove steps that exist only because systems are separate'
        examples: ['ISYS to QPS migration', 'Split payment files', 'Text files for e-policy updates', 'Zero-value remittance workfile']
      - head: Simplify
        text: 'Fewer hand-offs and approval levels'
        examples: ['Five refund chains to one rule', '3-4 signatures to a DOA matrix', 'RMEL passed through 4 hands']
      - head: Standardise
        text: 'One rule, one value, one template'
        examples: ['One tolerance matrix', 'One credit policy', 'One insurer layout', 'Notice days per segment']
      - head: Automate
        text: 'Let the system do the routine; people handle exceptions'
        examples: ['Cash application', 'Insurer recon', 'Renewal decision matrix', 'Reversals and entries']
      - head: Integrate and measure
        text: 'Connect partners; run on KPIs'
        examples: ['Insurer and bank channels', 'SLA and TAT dashboards', 'Self-service reports']
  automation:
    title: '17. Automation opportunities by department'
    headers: [Department, Manual work today (floor walk), Lever, When, Benefit]
    widths: [2.0, 4.4, 3.8, 1.2, 1.0]
    notes: >-
      The benefit is the project team's estimate of effort removed and control gained, from what we saw on the floor.
      "Go-live" means the lever is in the BRD scope; "After" means beyond the BRDs.
    rows:
      - [New Business, 'Excel quotes; three systems; e-policy fall-outs', 'One client and account; e-policy exception queue; insurer standard', 'Go-live, After', High]
      - [Renewal, 'Excel sanitation and dispositions; RA text files; snail mail', 'Decision matrix; RA in batch; print batch', Go-live, High]
      - [Submitted Policies, 'Masterlists on Drive H; LAMD matching by hand', 'Rules on one masterlist; bank feeds', 'Go-live, After', Medium]
      - [Employee Benefits, '50K+ member lists by e-mail', 'Census upload with checks; portal', 'Go-live, After', Medium]
      - ['TSU, Product', 'Excel tracker and comparative; IT for set-up', 'Workflow; rules maintained by TSU', 'Go-live', Medium]
      - [Reinsurance, 'E-mail placement; monitoring sheet', 'RI module; SLA clocks', 'Phase 2', Medium]
      - [Cashiering, 'Intake checks; split files; receipts', 'Auto application; unique payment reference', 'Go-live, After', High]
      - ['Remittance, Recon', 'Excel sanitising; 20-30K lines per insurer', 'Scheduled batches; automatic matching', Go-live, High]
      - [Commission, 'DP lists in Excel; reversals via IT', 'DP billing tracked; reversal entries generated', Go-live, High]
      - [Collections, 'ICS status; CTE by e-mail', 'Worklist with rules; dunning; credit policy', 'Go-live, After', Medium]
      - [Comptrollership, 'Wet signatures; WinSCP; journals; IT close', 'E-approval; host-to-host; entries at source', 'Go-live, After', High]
      - [Claims, 'Offline claims and repairs', 'Claim on the cover; client notices', 'Go-live, After', Medium]
      - [Contact centre, 'Cases logged by hand in CLS', 'Case management (BDOI To-Be)', Change request, Medium]
  horizons:
    title: '17. Roadmap in four horizons'
    notes: >-
      H0 is what BDOI can decide and prepare now; H1 is the BRD scope at go-live; H2 and H3 go beyond the BRDs. The
      enablers make every horizon possible.
    columns:
      - title: 'H0: Prepare'
        when: 'Now to Dec 2027'
        theme: 'Streamline and decide'
        items: ['Credit policy, DOA matrix, tolerance matrix', 'One reference; notice days; SLA values', 'Data owners; clean-up at source', 'Insurer interface standard agreed', 'Retire trackers per department']
      - title: 'H1: Go-live'
        when: 'Jan 2028'
        theme: 'BRD scope in one system'
        items: ['One client, one ARN, one invoice ledger', 'Workflows with maker-checker', 'Matching, batches, decision matrix', 'Reports run by users', 'Migrated masters and open items']
      - title: 'H2: Automate'
        when: 'Feb 2028 - Dec 2028'
        theme: 'Exceptions only'
        items: ['Cash application with scoring; payment references', 'E-policy ingestion; fall-out queue', 'Case management; client notices', 'Bank host-to-host; EFPS calendar', 'Reinsurance module (phase 2)']
      - title: 'H3: Optimise'
        when: '2029 onward'
        theme: 'Integrated and measured'
        items: ['Insurer APIs and portals', 'Self-service for clients and HR', 'Analytics: retention, profitability', 'Continuous close', 'Assisted work: document reading, next best action']
    enablers_title: Enablers across the horizons
    enablers: ['Business owners for every master, rule and report', 'Change champions (21) and SMEs (38) per department', 'BDO IT specifications for bank, insurer and enterprise interfaces', 'Decisions on the open points of this deck', 'Training and quick-reference cards per role', 'KPIs measured from go-live']
  kpis:
