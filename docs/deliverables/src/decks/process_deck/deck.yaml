      - {text: 5 Booking, owner: 'Processing, FRBS', tobe: 'invoice, GL entry in one step'}
      - {text: 6 Cash, owner: Cashiering, tobe: 'matched, receipts generated'}
      - {text: 7 Remittance, owner: 'Remittance, Disbursement', tobe: 'scheduled batches, e-approval'}
      - {text: 8 Commission, owner: 'CRU, Operations', tobe: 'DP billing tracked'}
      - {text: 9 Accounting, owner: 'FRBS, ACSL', tobe: 'entries at source, close by job'}
      - {text: 10 Collections, owner: Collection Handlers, tobe: 'one worklist, rules'}
      - {text: 11 Renewal, owner: 'Marketing, Processing', tobe: 'decision matrix, RA in batch'}
      - {text: 12 Claims, owner: Claims, tobe: 'claim on the cover, ageing'}

  maturity:
