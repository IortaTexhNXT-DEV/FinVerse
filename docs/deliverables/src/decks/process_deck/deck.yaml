      - ['Straight-through renewals', 'None', 'Share renewed by the decision matrix', 'Marketing, Processing']
      - ['Unapplied cash', 'Unapplied report worked offline', 'Amount and age of unapplied', Cashiering]
      - ['Days sales outstanding', 'ICS ageing unreliable (CO-02)', 'DSO per segment; promises kept', Collections]
      - ['Remittance on time', 'Weekly, by hand', 'Share remitted in the incentive window', Remittance]
      - ['Recon match rate', '20-30K lines by hand', 'Share matched automatically', 'Production recon']
      - ['Close duration', 'IT runs the close', 'Working days to close the month', FRBS]
      - ['Claims cycle time', 'Offline', 'Notice to settlement, per insurer', Claims]
      - ['First-contact resolution', 'Cases by hand in CLS', 'Share closed at first contact', Contact centre]
  maturity_title: 'Summary: from today to best practice'
  maturity_notes: >-
    The To-Be moves every theme to one workflow in one system or better; the roadmap takes the themes to automated and
    integrated. Integration and customer service need the most work beyond the BRDs.
