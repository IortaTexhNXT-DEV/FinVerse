# Business process reverse KT deck (deliverable 41, v2.0): the understanding chapter, the holistic chapter, the
# department parts, the cross-cutting chapter and the roadmap. The business-area chapters are in areas/*.yaml.
# Build: python docs/deliverables/src/decks/build_process_deck.py
title: BDOI Business Process Reverse KT
subtitle: 'Our understanding: As-Is, pain points, To-Be in the BRDs, gaps and best practice'
date: 27 September 2026

notes:
  title: >-
    Reverse knowledge transfer from the iorta TechNXT team to BDOI after the Day 1 business overview (21-Sep-2026) and
    the floor walks and discovery sessions of 22 to 25-Sep-2026. The deck plays back how we understand BDOI's business,
    department by department and end to end: how the work runs today, where the business users feel the pain, what the
    BRDs ask for and how that answers the pain, what the BRDs do not cover yet, and which insurance-broker practices go
    beyond the BRDs. It closes with a roadmap for streamlining and automation, the data migration and integration
    challenges, and the open points we need BDOI to confirm. It is not a build status report.
  agenda: >-
    Chapter 0 is the enterprise view. Parts A to F follow the BDOI departments, one chapter per business area; each
    chapter has the same slides: at a glance, what we heard on the floor, the As-Is swimlane(s), the pain points, the
    To-Be in the BRD, how the BRD answers the pain points, what the BRD does not cover, and best practice. Part G covers
    data migration, integrations and shared capabilities; Part H the roadmap, the consolidated gaps and the open points.
  reading: >-
    Refs: floor-walk notes carry the row number of the floor-walk notes workbook (OV-, NB-, PM-, CA-, CO-...); "Day 1
    p.n" is a page of the BDOI Day 1 overview; "NB flow", "Renewal flow" and so on are the high-level process flows
    that the BDOI process owners confirmed; BRD-n p.n is the PDF page of the BRD; DCR-nnn is the discrepancy register;
    Qnn, AQnn, OQnn are open questions of the BRD specifications.

reading:
  - 'Each department chapter plays back: what we heard, the As-Is flow, the pain points, the To-Be in the BRD, what the BRD does not cover, and best practice'
  - 'Swimlanes: one lane per BDOI role, external party (grey) or system (light blue); dashed boxes are steps in today''s systems or files'
  - 'Yellow numbered circles are pain points; the slide after the swimlanes explains each one with its source'
  - 'On the To-Be swimlane (the BRD), light blue boxes are steps a user takes on a screen and solid blue boxes are steps the system runs by itself'
  - 'Coverage chips: In the BRD, Partly in BRD, Not in BRD, Beyond the BRD (industry practice), BDOI to confirm'
  - 'Refs: floor-walk notes (NB-03, CA-02...), Day 1 overview page, process flow, BRD page, register item (DCR-nnn), open question (Qnn)'
  - 'Not in this deck: build progress, test status or plans; those are in the programme status reports'

understanding:
  purpose:
    title: Why this reverse KT
    intro: 'We walked the floor with 40+ process owners. This deck gives back what we understood, so BDOI can correct it before the FRS sign-offs.'
    notes: >-
      The purpose is validation, not presentation: each department confirms or corrects the As-Is, the pain points and
      the gaps of its chapter. Corrections go to the floor-walk notes workbook and the discrepancy register.
    cards:
      - head: What this deck is
        body:
          - 'Our understanding of how BDOI works today, per department and end to end'
          - 'The pain points the business users raised on the floor, in their words'
          - 'What the BRDs ask for (To-Be) and how it answers those pain points'
          - 'What the BRDs miss, and industry practice beyond the BRDs'
      - head: What we ask of each department
        body:
          - 'Confirm or correct the As-Is swimlanes and the pain points'
          - 'Confirm the rules and values we heard (days, rates, tolerances, volumes)'
          - 'Decide the open points and the items marked "BDOI to confirm"'
          - 'Say which best practices BDOI wants on the roadmap'
      - head: What this deck is not
        body:
          - 'Not a build status or test report'
          - 'Not a change to the signed BRDs: gaps become register items or change requests through the normal governance'
          - 'Not a design: the FRS per BRD remains the reference for screens and rules'
  sources:
    title: How we built our understanding
    notes: >-
      Five sources, cross-checked: the Day 1 business overview BDOI presented on 21-Sep; the floor walks of 22 and 23-Sep
      with the designated process owners; the discovery sessions of 21, 23, 24 and 25-Sep and their notes; the
      high-level process flows the process owners confirmed by e-mail between Dec 2025 and Jul 2026; and the BRDs with
      the discrepancy register maintained by the project.
    foot: 'Floor-walk notes: 66 rows, 17 open points. Process flows: New Business, Renewal, Submitted Policies, EB, TSU, Reinsurance, Operations, Collections, Disbursement, Refund, FRBS, ACSL, Claims, CSF, Case Management, end to end.'
    tiles:
      - {value: '21-25 Sep', label: 'Day 1 business overview, floor walks and discovery sessions', source: 'BDOI Day 1 deck; floor-walk schedule'}
      - {value: '12', label: 'floor-walk sessions with designated process owners (22-23 Sep)', source: 'Iorta floor-walk POC schedule'}
      - {value: '66', label: 'floor-walk notes: As-Is, To-Be, pain points', source: 'Floor-walk notes workbook'}
      - {value: '17', label: 'open points raised on the floor', source: 'Floor-walk notes, Open Points'}
      - {value: '16', label: 'high-level process flows confirmed by BDOI process owners', source: 'HL Process Overview pack'}
      - {value: '13 + 1', label: 'BRDs in scope plus the Reinsurance BRD (phase 2)', source: 'BRD pack; answer A3'}
