  e2e_1:
    title: 'End to end today (1/2): prospect to booked policy'
    caption: 'From the client''s need to a booked policy (BDOIR end-to-end process flow; Day 1 p.11, p.18)'
    notes: >-
      The first half of BDOI's end-to-end flow. Marketing works the prospect and decides package or non-package; TSU
      (and Reinsurance for large risks) sources non-package terms. The quotation is prepared in Excel templates, QPS or
      ISYS; after acceptance and payment the client is created in Broker, the account in ISYS and both are migrated to
      QPS by IT. Processing places with the insurer, handles returns and hold covers, receives the e-policy, delivers it
      through COG, the officer or the contact centre, and books and invoices in EBIX.
