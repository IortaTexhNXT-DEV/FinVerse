roadmap:
  part:
    num: G
    title: 'Roadmap and open points'
    subtitle: 'Streamline first, then automate: what BDOI can do now, at go-live and after'
    notes: 'The roadmap does not wait for the system. Some improvements are decisions BDOI can take now; automation follows once the platform is live.'
    chapters:
      - {num: 14, title: 'Roadmap and open points', sub: 'Levers, automation map, horizons, KPIs, open points'}
  principles:
    title: '14. Five levers to streamline before we automate'
    notes: >-
      Automating a broken process only makes it fail faster. These five levers, applied in order, are how insurance
      brokers usually take cost and delay out of operations; each has BDOI examples from the floor walk.
    items:
      - head: Eliminate
        text: 'Remove steps that exist only because systems are separate'
        examples: ['ISYS to QPS migration', 'Split payment files', 'Text files for e-policy updates', 'Zero-value remittance workfile']
      - head: Simplify
        text: 'Fewer hand-offs and approval levels'
        examples: ['Five refund chains to one rule', '3-4 signatures to an approval matrix', 'RMEL passed through 4 hands']
      - head: Standardise
        text: 'One rule, one value, one template'
        examples: ['One tolerance table', 'One credit policy', 'One insurer layout', 'Notice days per segment']
      - head: Automate
        text: 'Let the system do the routine; people handle exceptions'
        examples: ['Cash application', 'Insurer recon', 'Renewal rules', 'Reversals and entries']
      - head: Integrate and measure
        text: 'Connect partners; run on KPIs'
        examples: ['Insurer and bank channels', 'SLA and TAT dashboards', 'Self-service reports']
  automation:
    title: '14. Automation opportunities by department'
    headers: [Department, Manual work today (floor walk), Lever, Benefit]
    widths: [2.2, 4.8, 4.2, 1.2]
    notes: 'The benefit is our estimate of effort removed and control gained, from what we saw on the floor.'
    rows:
      - [New Business, 'Excel quotes; three systems; e-policy fall-outs', 'One client and account; exception queue; insurer standard', High]
      - [Renewal, 'Excel sanitation and dispositions; RA text files; snail mail', 'Renewal rules; RA in batch; print batch', High]
      - [Submitted Policies, 'Masterlists on Drive H; LAMD matching by hand', 'Rules on one masterlist; bank feeds', Medium]
      - [Employee Benefits, '50K+ member lists by e-mail', 'Census upload with checks; portals', Medium]
      - ['TSU, Product', 'Excel tracker and comparative; IT for set-up', 'Workflow; rules maintained by TSU', Medium]
      - [Cashiering, 'Intake checks; split files; receipts', 'Auto application; unique payment reference', High]
      - ['Remittance, Recon', 'Excel sanitising; 20-30K lines per insurer', 'Scheduled batches; automatic matching', High]
      - [Commission, 'DP lists in Excel; reversals via IT', 'DP billing tracked; reversal entries generated', High]
      - [Collections, 'ICS status; CTE by e-mail', 'Worklist with rules; reminders; credit policy', Medium]
      - [Comptrollership, 'Wet signatures; WinSCP; journals; IT close', 'E-approval; host-to-host; entries at source', High]
      - [Claims, 'Offline claims and repairs', 'Claim on the policy; client notices', Medium]
      - [Contact centre, 'Cases logged by hand in CLS', 'Case management (BDOI''s To-Be)', Medium]
  horizons:
    title: '14. Roadmap in four horizons'
    notes: 'H0 is what BDOI can decide and prepare now; H1 is one system at go-live; H2 and H3 build on it. The enablers make every horizon possible.'
    columns:
      - title: 'H0: Prepare'
        when: 'Now to Dec 2027'
        theme: 'Streamline and decide'
        items: ['Credit policy, approval matrix, tolerance table', 'One reference; notice days; SLA values', 'Data owners; clean-up at source', 'Insurer interface standard agreed', 'Retire trackers per department']
      - title: 'H1: Go-live'
        when: 'Jan 2028'
        theme: 'One system for the daily work'
        items: ['One client, one account, one invoice', 'Workflows with maker-checker', 'Matching, batches, renewal rules', 'Reports run by users', 'Masters and open items moved']
      - title: 'H2: Automate'
        when: 'Feb 2028 - Dec 2028'
        theme: 'Exceptions only'
        items: ['Cash application with scoring; payment references', 'E-policy reading; fall-out queue', 'Case management; client notices', 'Bank host-to-host; government calendar']
      - title: 'H3: Optimise'
        when: '2029 onward'
        theme: 'Integrated and measured'
        items: ['Insurer APIs and portals', 'Self-service for clients and HR', 'Analytics: retention, profitability', 'Continuous close', 'Assisted work: document reading, next best action']
    enablers_title: Enablers across the horizons
    enablers: ['Business owners for every master, rule and report', 'Change champions (21) and SMEs (38) per department', 'BDO IT for bank, insurer and government channels', 'Answers to the open points of the floor walk', 'Training and quick-reference cards per role', 'KPIs measured from go-live']
