# Business process reverse KT deck, floor-walk edition (v3.0): the understanding chapter, the holistic chapter, the
# department parts, the cross-cutting chapter and the roadmap. Sources are only the BDOI Day 1 overview and
# floor-walk slides, the floor-walk notes taken by the project team, and the business process flows BDOI shared.
# The area chapters are the areas/*.yaml files with their `fw:` overrides.
# Build: python docs/deliverables/src/decks/build_floorwalk_deck.py
title: BDOI Reverse KT - Floor Walk
subtitle: 'What we saw and heard on the floor: As-Is, pain points and the way forward'
date: 27 September 2026

notes:
  title: >-
    Reverse knowledge transfer from the iorta TechNXT team to BDOI, based only on what we saw and heard: the Day 1
    business overview of 21-Sep-2026, the floor walks of 22 and 23-Sep with the designated process owners, the
    discovery sessions of 23 to 25-Sep and our notes of them, and the business process flows BDOI shared. The deck
    plays back our understanding of how each department works today, where the users feel the pain, what they asked
    for, and the practices and roadmap we suggest. It deliberately leaves out the BRD review and build status; those
    are in the end-to-end deck (v2.0). Reinsurance, Sanction Screening and User Access are not in this edition
    because they were not part of the floor walk.
  agenda: >-
    Chapter 0 is the enterprise view. Parts A to E follow the departments we walked; each chapter has the same slides:
    at a glance, what we heard, the As-Is swimlane(s), the pain points, what the business wants, and best practice.
    Part F covers data, integrations and shared needs; Part G the roadmap and the open points.
  reading: >-
    Refs: floor-walk notes carry the row number of our floor-walk notes workbook (OV-, NB-, PM-, CA-...); "Day 1 p.n"
    is a page of the BDOI Day 1 overview; "NB flow", "Renewal flow" and so on are the process flows BDOI shared.

reading:
  - 'Every statement comes from the floor walk, our notes or a process flow BDOI shared; the ref says which'
  - 'Each department chapter: at a glance, what we heard, the As-Is flow, the pain points, what the business wants, best practice'
  - 'Swimlanes: one lane per BDOI role, external party (grey) or system (light blue); dashed boxes are steps in today''s systems or files'
  - 'Yellow numbered circles are pain points; the slide after the swimlanes explains each one'
  - '"What the business wants" pairs each pain point with what users asked for, and the lever we suggest'
  - 'Not in this deck: the BRD review, build status, Reinsurance, Sanction Screening, User Access (not walked)'

understanding:
  purpose:
    title: Why this reverse KT
    intro: 'We walked the floor with 40+ process owners. This deck gives back what we saw and heard, so BDOI can correct it.'
    notes: >-
      The purpose is validation: each department confirms or corrects the As-Is, the pain points and what we
      understood the business wants. Corrections go into our floor-walk notes.
    cards:
      - head: What this deck is
        body:
          - 'How each department works today, as we saw it on the floor'
          - 'The pain points the business users raised, in their words'
          - 'What the users asked for, and the practices we suggest'
          - 'The end-to-end view across departments'
      - head: What we ask of each department
        body:
          - 'Confirm or correct the As-Is swimlanes and pain points'
          - 'Confirm the rules and values we heard (days, rates, volumes)'
          - 'Answer the 17 open points of the floor walk'
          - 'Say which suggestions BDOI wants on the roadmap'
      - head: What this deck is not
        body:
          - 'Not a review of the BRDs'
          - 'Not a build status or test report'
          - 'Not a design: it describes today and the business''s wishes'
  summary:
    title: 'What we learned, in six messages'
    notes: 'The six messages of the floor walk; each is developed in the chapters.'
    cards:
      - head: '1. One deal, five tools, three references'
        body: ['Excel templates, Broker, ISYS, QPS and EBIX for one policy (NB flow)', 'ISYS, QPS and EBIX numbers on the same transaction (OV-03)', 'IT migrates accounts from ISYS to QPS']
      - head: '2. E-mail and Excel carry the work'
        body: ['15 hand-offs between teams by e-mail, file, Teams or paper', 'Dispositions, recon, DP lists and trackers in Excel', 'Masterlists on Drive H and SharePoint']
      - head: '3. Controls rely on people'
        body: ['Wet signatures at 3-6 levels; checker-poster one by one', 'Intake checks, reversals and journals by hand', 'Approvals on Teams lists with signed copies']
      - head: '4. IT is in the business path'
        body: ['Extracts (RMEL, production recon), migrations, batches', 'Reports and the close need IT (RP-01)', 'WinSCP and text files between systems']
      - head: '5. Volumes are real'
        body: ['50,000+ EB members (EB-01)', '20-30K production lines per insurer a month', 'About 2,000 records in a bulk payment file (CA-05)']
      - head: '6. The business knows what it wants'
        body: ['Product maintenance, claims and renewals in a system', 'Receipts, endorsements and reports without manual work', 'One way to connect to about 55 insurers (OV-01)']
