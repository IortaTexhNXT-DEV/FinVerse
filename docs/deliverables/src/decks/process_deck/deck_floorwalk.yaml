  e2e_1:
    title: 'End to end today (1/2): prospect to booked policy'
    caption: 'From the client''s need to a booked policy (BDOIR end-to-end process flow; Day 1 p.11, p.18)'
    notes: >-
      The first half of BDOI's end-to-end flow. Marketing works the prospect and decides package or non-package; TSU
      sources non-package terms. The quotation is prepared in Excel templates, QPS or ISYS; after acceptance and
      payment the client is created in Broker, the account in ISYS and both are migrated to QPS by IT. Processing
      places with the insurer, handles returns and hold covers, receives the e-policy, delivers it through COG, the
      officer or the contact centre, and books and invoices in EBIX.
    cols: 7
    lanes:
      - {id: cli, label: 'Client, bank unit', kind: external}
      - {id: mkt, label: Marketing}
      - {id: tsu, label: TSU}
      - {id: prc, label: 'Processing, IT'}
      - {id: ins, label: Insurers, kind: external}
      - {id: sys, label: 'Broker, ISYS, QPS, EBIX, Excel', kind: system}
    steps:
      - {id: s1, lane: cli, col: 1, text: 'Need: client, bank referral, loan list', kind: external}
      - {id: s2, lane: mkt, col: 1, text: 'Prospect; package or non-package?'}
      - {id: s3, lane: tsu, col: 2, text: 'Non-package: slip, insurers, comparative'}
      - {id: s4, lane: sys, col: 2, text: 'Quote in IDF Excel, QPS or ISYS', kind: legacy}
      - {id: s5, lane: mkt, col: 3, text: 'Proposal sent; follow-up'}
      - {id: s6, lane: cli, col: 3, text: 'Accepts; proof of payment', kind: external}
      - {id: s7, lane: sys, col: 4, text: 'Client in Broker, account in ISYS, IT to QPS', kind: legacy}
      - {id: s8, lane: prc, col: 5, text: 'Placement to insurer; returns, hold cover'}
      - {id: s9, lane: ins, col: 5, text: 'Approves; issues e-policy', kind: external}
      - {id: s10, lane: prc, col: 6, text: 'E-policy delivered (COG, PO, contact centre)'}
      - {id: s11, lane: sys, col: 7, text: Booked and invoiced in EBIX, kind: legacy}
      - {id: s12, lane: mkt, col: 7, text: 'Servicing, renewal, claims (next slide)'}
    edges:
      - [s1, s2, dashed, e-mail]
      - [s2, s3, dashed, non-package]
      - [s2, s4]
      - [s3, s5]
      - [s4, s5]
      - [s5, s6, dashed, e-mail]
      - [s6, s7]
      - [s7, s8]
      - [s8, s9, dashed, 'e-mail, SFTP']
      - [s9, s10]
      - [s10, s11]
      - [s11, s12]

  e2e_2:
    title: 'End to end today (2/2): premium to books, and servicing'
    caption: 'Money and servicing after booking (BDOIR end-to-end process flow; Day 1 p.12-14)'
    notes: >-
      The second half. The client pays through bills payment, over the counter, CLPC, autopay or directly to the
      insurer; Cashiering applies the payment and monitors checks and PDCs; Collections follows unpaid premium with the
      AO. Every week Remittance prepares the settlement net of commission, Disbursement pays the insurer and FRBS books
      it; commission on direct payments is billed to the insurer; ACSL reconciles the insurer statements and adjusts the
      sub-ledger; FRBS closes the books. After booking three servicing paths start: adjustment or cancellation (with a
      refund), renewal from the expiring list 140 days ahead, and claims.
    cols: 7
    lanes:
      - {id: cli, label: Client, kind: external}
      - {id: ops, label: 'Cashiering, Collections, Remittance'}
      - {id: fin, label: 'Disbursement, FRBS, ACSL'}
      - {id: ins, label: Insurers, kind: external}
      - {id: svc, label: 'Adjustment, Renewal, Claims'}
      - {id: sys, label: 'EBIX, ICS, Excel, Teams', kind: system}
    steps:
      - {id: u1, lane: cli, col: 1, text: 'Pays: bills payment, OTC, CLPC, direct', kind: external}
      - {id: u2, lane: ops, col: 1, text: 'Applied; checks and PDCs monitored; AR'}
      - {id: u3, lane: ops, col: 2, text: 'Unpaid: Collections and AO follow up'}
      - {id: u4, lane: sys, col: 2, text: 'Applied payments in EBIX; ICS ageing', kind: legacy}
      - {id: u5, lane: ops, col: 3, text: 'Weekly remittance, net of commission'}
      - {id: u6, lane: fin, col: 4, text: 'Disbursement pays; FRBS books'}
      - {id: u7, lane: ins, col: 4, text: 'Premium received; OR; DP commission billed', kind: external}
      - {id: u8, lane: fin, col: 5, text: 'SOA reconciliation; SL adjustments (ACSL)'}
      - {id: u9, lane: fin, col: 6, text: 'Reports; EOD, EOM, EOY close'}
      - {id: u10, lane: svc, col: 5, text: 'Adjustment or cancellation; refund'}
      - {id: u11, lane: svc, col: 6, text: 'Renewal: expiring list at -140 days'}
      - {id: u12, lane: svc, col: 7, text: 'Claim: documents to insurer; settlement'}
    edges:
      - [u1, u2, dashed, files]
      - [u2, u3, dashed, unpaid]
      - [u2, u4]
      - [u4, u5]
      - [u5, u6, dashed, Teams list]
      - [u6, u7, dashed]
      - [u7, u8]
      - [u8, u9]

