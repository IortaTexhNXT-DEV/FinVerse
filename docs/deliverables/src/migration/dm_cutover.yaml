hypercare_exit:
  - No open Critical or High defect; Medium defects have an agreed fix date
  - Migration Clearing 0.00 and legacy control accounts equal their sub-ledgers on 10 consecutive business days
  - First month-end close completed with the ACSL GL-SL reconciliation (context LEGACY) without difference
  - Payment files, automatch, remittance, DPPR / PR2307 batches and endorsements on legacy invoices each processed at least once in production without incident
  - Staging and extract files of production purged within 5 days of sign-off (purge log)
  - True-up 1 posted, reconciled and signed
  - Every URGENT January renewal has an RA sent or an insurer request made
  - Service desk ticket volume back to the level agreed in the support model; production support runbook (deliverable 24) accepted

decommissioning:
  EBIX:
    - Final extracts reconciled - F01, F02, F03, F04, F06, G01 and C01 signed off
    - Final true-up reconciled - final true-up signed against the audited FY2027 TB; legacy GL locked
    - Archive reconciled - archive objects H01, H02 and G02 of EBIX loaded and reconciled (counts and hash totals per record type against legacy)
    - Legacy Inquiry verified - by Audit / Compliance on samples of each record type
    - No open item needs the system - no open legacy invoice or legacy UPP needs an EBIX document; the legacy context in BIBS may still be open
    - Claims tail covered - no open claim that needs EBIX (DMQ27, DMQ30)
    - Access logs archived - read-only access logs exported to the archive
    - Retention covered - database backup retained per the retention decision (DMQ27); retention obligations covered (5 years online, 15 years archive, umbrella p.45)
    - Owners signed - EBIX system owner, Compliance and Comptrollership
  QPS:
    - Final extracts reconciled - C01, P01, P03 and the R objects signed off
    - No open item needs the system - last QPS-issued policy expired and its renewal decided (run-off tracker shows no open cohort), or the policy is archived
    - Archive reconciled - archive objects of QPS loaded and reconciled
    - Legacy Inquiry verified - by Audit / Compliance
    - Access logs archived - read-only access logs exported to the archive
    - Retention covered - database backup retained per DMQ27
    - Owners signed - QPS system owner, Compliance and the Heads of Marketing
  ISYS:
    - No open item needs the system - claims and ACSL reports and the Marketing Diary replaced by BIBS reports
    - Archive reconciled - GL history (G02) and closed claims (H01 CLAIM) archived and reconciled
    - Final true-up reconciled - ISYS GL lines of the final true-up signed; ISYS GL locked
    - Owners signed - ISYS system owner, Claims and Comptrollership
  CMS:
    - Final extracts reconciled - collection state F03 and UPP F02 reconciled and signed off
    - Archive reconciled - disposition history archived (H01) if required by DMQ34
    - Owners signed - Head of Operations (Collections) and BDOI IT
  Excel masterlists and file shares:
    - Final extracts reconciled - submitted-policy masterlists migrated (P04) or archived
    - Archive reconciled - KYC documents and legacy documents (C04, H02) archived with checksums
    - Retention covered - folders set to read-only, then removed per the retention decision
    - Owners signed - owning department and Compliance
  Legacy context in BIBS:
    - No open legacy invoice - every legacy invoice paid, reversed, written off or reclassified
    - No legacy UPP balance - every legacy UPP applied, refunded or reclassified
    - Legacy accounts at zero - legacy control accounts and Migration Clearing at 0.00
    - Chart decision recorded - Comptrollership decides whether the legacy accounts are closed in the chart
