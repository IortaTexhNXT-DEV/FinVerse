  - [BIBS releases, T-7, T+14, "Deployments to production", "Hotfix of a Critical defect approved by the go / no-go board"]

checkpoints:
  - id: GNG-1
    when: T-15
    decision: Start the production pre-load
    criteria:
      - Dress rehearsal completed within the window with at least 20 percent margin, rollback rehearsed
      - Production environment, roles and PH-only access ready; masking off only in production
      - Legacy control accounts, Migration Clearing and LG_ rule lines approved in production (DMQ18)
      - Code map versions for production approved
      - Transfer path (SFTP or console) tested
      - No open Critical defect of the migration or of a Day-1 module
  - id: GNG-2
    when: T-4
    decision: Enter the legacy freeze on T-3
    criteria:
      - Reference data and clients loaded and accepted (G6) in production; daily deltas running
      - Client review queue empty
      - Final extract jobs timed within the window (dry run)
      - In-flight items and remittance batches closed or listed for carry-forward
      - RMEL cohorts to carry confirmed
      - Communications sent; branches and insurers informed
  - id: GNG-3
    when: T-1 18:00
    decision: Go live on T
    criteria:
      - Every Day-1 object at G6 (100 percent)
      - "Counts - received = control and loaded + skipped + rejected + excluded = staged, for every object"
      - "Financial rejects (F01, F02, G01) - 0, or each excluded item approved by the owner with a manual-entry plan"
      - Amount reconciliation of open items, UPP and trial balance - 0.00 difference per currency
      - Migration Clearing - 0.00 per branch and currency
      - Legacy control accounts equal their sub-ledgers (ACSL, context LEGACY) - 0.00
      - Client review queue empty; screening run complete
      - Business smoke test passed
      - Rollback point (snapshot) taken and verified
      - Hypercare roster and support channels in place
  - id: POINT OF NO RETURN
    when: T 18:00
    decision: Continue in BIBS; fallback to legacy no longer offered (DMQ32)
    criteria:
      - No Critical defect that stops receipts, payment application, remittance or booking
      - Migration Clearing still 0.00; no posting in legacy since the freeze
      - Every branch has transacted in BIBS

rollback:
  - [RB-1, Stop, "The go / no-go board records NO-GO (or a failure before T 18:00 that the board judges unrecoverable). The Program Manager announces the rollback on the bridge.", GNG]
  - [RB-2, Lock BIBS, "Disable business logins to BIBS; stop the scheduled jobs (PAYMENT_AUTOMATCH, payment file handlers, Renewal extraction, e-mail dispatch).", IDO]
  - [RB-3, Capture, "If business transactions were keyed in BIBS after 08:00 on T, export them (receipts, applications, bookings) with MIG-CUTOVER-STATUS and the Operations reports for re-keying in legacy.", IML]
  - [RB-4, Restore, "Restore the production database to the rollback-point snapshot (CT-037); restore the object store for attachments of the same time; verify the restore (row counts of key tables, application start).", IDO]
  - [RB-5, Reopen legacy, "Set EBIX, QPS and CMS back to read-write; re-enable the legacy batch jobs; confirm the last legacy EOD is intact.", BIT]
  - [RB-6, Re-key, "Operations re-keys in legacy the transactions captured in RB-3, with the BIBS AR numbers voided in the receipt register.", OPS]
  - [RB-7, Communicate, "Send the rollback notice to users, branches, insurers and bank channels (communication plan item 7).", PM]
  - [RB-8, Review, "Within 2 business days - root cause, new go-live date, which mocks to repeat; purge the production staging of the failed cutover within 5 days.", PM]

