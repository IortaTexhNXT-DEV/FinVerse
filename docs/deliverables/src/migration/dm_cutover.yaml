  - [IQA, iorta TechNXT QA (smoke tests, defect triage), iorta TechNXT]

phases:
  - [A, Readiness, T-30 to T-15]
  - [B, Pre-load and daily deltas, T-14 to T-4]
  - [C, Legacy freeze and final extracts, "T-3 (Friday)"]
  - [D, Production load, "T-2 (Saturday)"]
  - [E, "Reconciliation, verification and go / no-go", "T-1 (Sunday)"]
  - [F, Go-live, "T (Monday)"]
  - [G, Hypercare, T+1 to the first month-end close]

