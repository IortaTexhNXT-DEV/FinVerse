  - [Business transactions, "T-3 22:00 (after the last legacy EOD)", Go-live, "All postings in EBIX, QPS, CMS - bookings, receipts, UPP, dispositions, remittances, endorsements, GL journals", "None; an urgent item is recorded on paper and keyed in BIBS on T"]
