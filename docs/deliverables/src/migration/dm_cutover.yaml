# BRD-13 Data Migration - single source of the production cutover plan (BRID 12.1; R3 section 17).
# Read by build_migration_pack.py for the Cutover Task Plan workbook and the task tables of the Cutover Runbook.
# T = go-live. BDOI timeline: January 2028 (DMQ25); Monday 3 January 2028 at the year-end boundary, option A of DMQ39
# (recommended, awaiting Comptrollership confirmation): provisional GL opening and FY2027 true-ups to T+120. Days are calendar days. Times are Philippine time (PHT). Durations are elapsed hours.
# Tasks that would fall on the year-end holidays are placed on the nearest working day (section calendar).

roles:
  - [PM, BDOI Program Manager (ESG - Business Project Services), BDOI]
  - [DML, BDOI Data Migration Lead, BDOI]
  - [OWN, Data owners (department heads of each object), BDOI]
  - [STW, Data stewards, BDOI]
  - [COMP, Comptrollership (reconciliation approver for financial objects), BDOI]
  - [OPS, "Operations (Financial Transactions, Cashiering, Remittance, Collections)", BDOI]
  - [MKT, Marketing (Retail and Corporate), BDOI]
  - [RNW, "Renewal processing team (makers and checkers; Head of the Renewal processing team)", BDOI]
  - [CMP, Compliance and Audit, BDOI]
  - [BIT, "BDOI IT (legacy systems, extracts, network, SFTP)", BDOI]
  - [GNG, "Go / no-go board (Program Manager, heads of Operations, Comptrollership, Marketing, Compliance, IT; iorta Project Manager)", BDOI and iorta TechNXT]
  - [IPM, iorta TechNXT Project Manager, iorta TechNXT]
  - [IML, "iorta TechNXT Migration Lead (loaders, reconciliation, console)", iorta TechNXT]
  - [IOP, "iorta TechNXT Migration Operator (intake, validation, loads)", iorta TechNXT]
  - [IDO, "iorta TechNXT DevOps (AWS environment, snapshots, access, monitoring)", iorta TechNXT]
  - [IQA, "iorta TechNXT QA (smoke tests, defect triage)", iorta TechNXT]

phases:
  - [A, Readiness, "T-30 to T-15 (4 to 19 Dec 2027)"]
  - [B, Pre-load and daily deltas, "T-14 to T-4 (20 to 30 Dec 2027)"]
  - [C, Legacy freeze and final extracts, "T-3 (Friday 31 Dec 2027)"]
  - [D, Production load, "T-2 (Saturday 1 Jan 2028)"]
  - [E, "Reconciliation, verification and go / no-go", "T-1 (Sunday 2 Jan 2028)"]
  - [F, Go-live, "T (Monday 3 Jan 2028)"]
  - [G, "Hypercare and true-up 1", "T+1 to T+30 (4 Jan to 2 Feb 2028)"]
  - [H, "Final true-up and legacy GL close", "T+31 to T+120 (Feb to 2 May 2028)"]

