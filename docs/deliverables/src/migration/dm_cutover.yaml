hypercare_exit:
  - No open Critical or High defect; Medium defects have an agreed fix date
  - Migration Clearing 0.00 and legacy control accounts equal their sub-ledgers on 10 consecutive business days
  - First month-end close completed with the ACSL GL-SL reconciliation (context LEGACY) without difference
  - Payment files, automatch, remittance, DPPR / PR2307 batches and endorsements on legacy invoices each processed at least once in production without incident
  - Staging and extract files of production purged within 5 days of sign-off (purge log)
  - Service desk ticket volume back to the level agreed in the support model; production support runbook (deliverable 24) accepted

decommissioning:
  EBIX:
    - Final extracts reconciled and signed off (F01, F02, F03, F04, F06, G01, C01)
    - Archive objects H01, H02 and G02 of EBIX loaded and reconciled (counts and hash totals per record type against legacy)
    - Legacy Inquiry verified by Audit / Compliance on samples of each record type
    - No open legacy invoice or legacy UPP that needs an EBIX document; the legacy context in BIBS may still be open
    - Claims tail covered - no open claim that needs EBIX (DMQ27, DMQ30)
    - Read-only access logs exported to the archive
    - Database backup retained per the retention decision (DMQ27); retention obligations covered (5 years online, 15 years archive, umbrella p.45)
    - Sign-off by the EBIX system owner, Compliance and Comptrollership
  QPS:
    - Final extracts reconciled and signed off (C01, P01, P03, R objects)
    - Last QPS-issued policy expired and its renewal decided (run-off tracker shows no open cohort), or the policy is archived
    - Archive objects of QPS loaded and reconciled
    - Legacy Inquiry verified by Audit / Compliance
    - Read-only access logs exported; database backup retained per DMQ27
    - Sign-off by the QPS system owner, Compliance and the Heads of Marketing
  ISYS:
    - Claims and ACSL reports and the Marketing Diary no longer needed (replaced by BIBS reports)
    - GL history (G02) and closed claims (H01 CLAIM) archived and reconciled
    - Sign-off by the ISYS system owner, Claims and Comptrollership
  CMS:
    - Collection state F03 and UPP F02 reconciled and signed off
    - Disposition history archived (H01) if required by DMQ34
    - Sign-off by the Head of Operations (Collections) and BDOI IT
  Excel masterlists and file shares:
    - Submitted-policy masterlists migrated (P04) or archived
    - KYC documents and legacy documents (C04, H02) archived with checksums
    - Folders set to read-only, then removed per the retention decision
    - Sign-off by the owning department and Compliance
  Legacy context in BIBS:
    - No open legacy invoice (paid, reversed, written off or reclassified)
    - No legacy UPP with a balance
    - Legacy control accounts and Migration Clearing at 0.00
    - Comptrollership decides whether the legacy accounts are closed in the chart
