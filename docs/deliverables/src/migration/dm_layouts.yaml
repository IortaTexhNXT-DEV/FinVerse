    target: "lov_value through LovService; MIS field catalogue (Core Replacement CR-W1)"
    owner: Product Owner, Marketing Business System (MBS)
    steward: MBS data steward (to name)
    history: Current values and values used by any migrated record
    delta: None after the map freeze (T-7 days); changes by change request and a new map version
    format: CSV
    controls: Row count; count of distinct (list_type, code)
    due: M4
    order: 1
    brd: BRID 3.1
    questions: DMQ08
    bound: A few thousand values
    layouts: [R01]
