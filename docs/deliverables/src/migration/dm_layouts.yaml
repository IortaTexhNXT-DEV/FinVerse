# --------------------------------------------------------------------------------------------------------------
# Data-quality rules catalogue (R3 section 8). [id, layout, columns, kind, rule, severity, message, fixed by]
# fixed by: who corrects a failing row - BDOI (at source), Steward (code map / waiver), iorta (mapping or loader).
dq_rules:
  - [DQ-001, All, Mandatory columns, MANDATORY, "A column marked Y in the layout has a value; a column marked C has a value when its condition holds", ERROR, "{field} is mandatory", BDOI data steward (fix at source)]
  - [DQ-002, All, Date and amount columns, FORMAT, "Dates are yyyy-MM-dd; timestamps yyyy-MM-dd HH:mm:ss; amounts have a dot decimal, 2 decimals and no thousands separator", ERROR, "{field} {value} is not a valid {type}", BDOI IT (extract)]
  - [DQ-003, All, Coded columns, LOOKUP, "Every coded column has an entry in the APPROVED version of its code map set", "ERROR (mandatory column) / WARNING (optional column)", "Code {code} of {set} is not mapped", Data Steward (code map)]
  - [DQ-004, All, Key columns, UNIQUE, The legacy key of the layout is unique in the file, ERROR, "{key} appears twice", BDOI IT (extract)]
  - [DQ-005, All, Length, FORMAT, No value is longer than the length of the layout, ERROR, "{field} is longer than {n} characters", BDOI data steward]
  - [DQ-006, C01, "tin", FORMAT, TIN has 9 to 12 digits after removing separators, ERROR, "TIN {value} is not valid", BDOI data steward]
  - [DQ-007, C01, "email, mobile", FORMAT, "E-mail and PH mobile follow the crm formats (09xxxxxxxxx or +639xxxxxxxxx)", WARNING, "{field} {value} is not valid; it is loaded blank", BDOI data steward]
  - [DQ-008, C01, "birth_date", PLAUSIBILITY, "Birth date not in the future and age at most 120 years", ERROR, "Birth date {value} is not plausible", BDOI data steward]
  - [DQ-009, C01, "client_type, names", CROSS_FIELD, "Individual has last and first name; corporate has corporate name", ERROR, "{field} is mandatory for client type {type}", BDOI data steward]
  - [DQ-010, C01, All identity keys, DUPLICATE_CLIENT, "Pairs scoring 90 or more merge automatically; 60 to 89 go to the review queue (R3 section 9)", "WARNING (review)", "{n} client pairs are waiting for review", Data Steward (review queue)]
  - [DQ-011, C01, "created_date", PLAUSIBILITY, "Client in scope per DMQ05 (created from 2020, or with an in-force policy or open item)", WARNING, "Client {no} is outside the migration scope", Data owner (decision)]
  - [DQ-012, C02, legacy_client_no, REFERENTIAL, "The client exists in C01 of the same source", ERROR, "{parent} {key} is not loaded", BDOI IT (extract)]
  - [DQ-013, C02, "primary_flag", CROSS_FIELD, One primary ADDRESS per client, WARNING, "Client {no} has {n} primary addresses; the latest is kept", BDOI data steward]
  - [DQ-014, P01, "inception_date, expiry_date", CROSS_FIELD, Expiry after inception and on or after the cutover date, ERROR, The expiry date is before the inception date, BDOI data steward]
  - [DQ-015, P01S, share_pct, CROSS_FIELD, "Shares of a policy add up to 100 and exactly one lead", ERROR, "Insurer shares add up to {x} percent", BDOI data steward]
  - [DQ-016, P01, legacy_client_no, REFERENTIAL, The client is loaded (xref) or in the same load, ERROR, "{parent} {key} is not loaded", iorta (load order) / BDOI (extract)]
  - [DQ-017, P01, "risk_code, line_code", CROSS_FIELD, The product belongs to the line (cat_product.line_code), ERROR, "Product {code} is not in line {line}", Data Steward (code map)]
  - [DQ-018, P03, legacy_policy_ref, REFERENTIAL, The policy header exists in P01, ERROR, "Cover {no} has no migrated header", BDOI IT (extract)]
  - [DQ-019, P03, expiry_date, CROSS_FIELD, Expiry from the cutover date to cutover + 140 days, ERROR, "Expiry {date} is outside the carried cohorts", BDOI data steward]
  - [DQ-020, F01, legacy_invoice_no, UNIQUE, Invoice number unique across EBIX and QPS; a collision is prefixed with the source system (DMQ11), WARNING, "Invoice {no} exists in two source systems; loaded as {source}-{no}", iorta (loader)]
  - [DQ-021, F01, "gross_premium", CROSS_FIELD, Gross premium = sum of the booked amounts of the six premium components in F01C, ERROR, "The premium components add up to {x}; the gross premium is {y}", BDOI IT (extract)]
  - [DQ-022, F01C, "open_balance", BALANCE, "Premium components and PR2307 - open = booked + adjusted - paid - written_off; DTIP, commission, VAT on commission, WTAX - open = booked + adjusted - remitted - written_off", ERROR, "The open balance of {component} does not equal booked + adjusted - paid / remitted - written off", BDOI IT (extract)]
  - [DQ-023, F01C, "open_balance", BALANCE, Open balance within 0 and booked + adjusted (same sign as the invoice), ERROR, "The open balance of {component} is outside the booked amount", BDOI data steward]
  - [DQ-024, F01, "every row", CROSS_FIELD, "At least one component has an open balance (else the invoice is not carried forward, DMQ10)", WARNING, "Invoice {no} has no open balance", Data owner (decision)]
  - [DQ-025, F01S, share_pct, CROSS_FIELD, "Shares of an invoice add up to 100 and exactly one lead", ERROR, "Insurer shares add up to {x} percent", BDOI data steward]
  - [DQ-026, F01, parent_invoice_no, REFERENTIAL, The parent invoice of an endorsement invoice is in the file or loaded, ERROR, "{parent} {key} is not loaded", BDOI IT (extract)]
  - [DQ-027, F01, "commission_realised, deferred_vat_open", BALANCE, Realised commission within 0 and commission; deferred VAT within 0 and VAT on commission, ERROR, "{field} is outside 0 and {limit}", BDOI (Comptrollership)]
  - [DQ-028, F01, due_date, PLAUSIBILITY, Invoice open more than 5 years, WARNING, "Invoice {no} has been open since {date}", Data owner (review)]
  - [DQ-029, F01, "currency, booking_fx_rate", CROSS_FIELD, Foreign-currency invoice has a booking rate, ERROR, "booking_fx_rate is mandatory for currency {currency}", BDOI IT (extract)]
  - [DQ-030, F02, "balance, amount", BALANCE, Balance above 0 and at most amount, ERROR, The balance is more than the amount received, BDOI data steward]
  - [DQ-031, F02, "ref_ columns", PLAUSIBILITY, At least one match reference is given, WARNING, "UPP {ref} has no reference to match; it stays for manual disposition", BDOI data steward]
  - [DQ-032, F02, value_date, PLAUSIBILITY, UPP older than 2 years, WARNING, "UPP {ref} is older than 2 years", Data owner (review; candidate for income reclassification)]
  - [DQ-033, F03, legacy_invoice_no, REFERENTIAL, The invoice is in F01, ERROR, "{parent} {key} is not loaded", BDOI IT (extract)]
