    object | Object code of the data file | Code | 5 | Y | Register object codes | Upper case | F01 | mig_extract.object | Matches the file name | Extract job
    layout | Layout (template) code | Code | 5 | Y | Layout codes of this workbook | Upper case | F01C | mig_extract layout | Matches the header row | Extract job
    source_system | Source system | Code | 10 | Y | EBIX, QPS, ISYS, CMS, EXCEL | Upper case | EBIX | mig_extract.source_system | Matches the file name | Extract job
    data_file | Name of the data file | Text | 120 | Y | - | <LAYOUT>_<SOURCE>_<yyyyMMdd>_<nn>.csv | F01C_EBIX_20270226_01.csv | mig_extract file name | File received | Extract job
    as_of | Date and time the data represents | Timestamp | 19 | Y | - | yyyy-MM-dd HH:mm:ss | 2027-02-26 22:00:00 | mig_extract as-of | Not earlier than the previous extract of the layout | Extract job
    extracted_at | When the extract ran | Timestamp | 19 | Y | - | yyyy-MM-dd HH:mm:ss | 2027-02-26 23:40:12 | mig_extract extraction time | After as_of | Extract job
    extracted_by | BDOI IT user who ran the extract | Text | 50 | Y | - | Free text | bdoi.it.jramos | mig_extract extracted by | Not blank | Extract job
    measure | Kind of control | Code | 12 | Y | ROW_COUNT, AMOUNT_TOTAL, HASH_TOTAL, SHA256 | Upper case | AMOUNT_TOTAL | mig_extract control totals | In the list | Extract job
    column_name | Column the measure applies to (AMOUNT_TOTAL, HASH_TOTAL) | Text | 40 | C | Columns of the layout | As in the header | open_balance | Control total column | Mandatory for AMOUNT_TOTAL and HASH_TOTAL | Extract job
    currency | Currency of an AMOUNT_TOTAL | Code | 3 | C | ISO 4217 | Upper case | PHP | Control total currency | Mandatory for AMOUNT_TOTAL | Extract job
    filter | Optional filter of the measure (for example component=BASIC) | Text | 80 | N | - | column=value | component=BASIC | Control total filter | Column exists | Extract job
    value | Value of the measure | Text | 80 | Y | - | Digits; dot decimal for amounts; hex for SHA256 | 1284533.75 | Compared at intake (FR-DM-010) | Numeric or 64-character hex | Extract job

