# BRD-13 Data Migration - single source of the data objects, extract layouts, code map sets, data-quality
# rules and open decisions. Read by build_migration_pack.py, which produces:
#   * the BDOI Data Requirements Workbook (one sheet per layout, plus register, code maps, control totals,
#     rules and decisions);
#   * the CSV extract templates in docs/deliverables/out/Migration/templates/ (header row = field names);
#   * the object tables of the Strategy, Runbook and Reconciliation documents.
# Sources: docs/requirements/BDOI_DM_BRD_SPEC.md (R2), docs/architecture/DATA_MIGRATION_DESIGN.md (R3) sections 2,
# 5, 8, 12 and 27; target columns from the Flyway scripts named in each row. Columns marked "(new)" are proposed by
# R3 section 14.5 and are created by the migration build.
#
# Field lines: name | description | type | length | mandatory | allowed values or code list | format | example |
#              BIBS target | validation rule | source system hint
# type: Text, Code, Date, Timestamp, Amount, Integer, Decimal, Flag. mandatory: Y, N, C (conditional, see rule).

meta:
  version: "1.0"
  date: 26 September 2026
  issue_date: 26 Sep 2026

decision_classes:
  - [MIGRATE, "Clean master or reference data needed on Day 1; loaded into BIBS business tables through the owning service"]
  - [CARRY_FORWARD, "Open operational or financial item at cutover; loaded with its open position and processed in BIBS"]
  - [CONDITIONAL, "Migrated only when the condition decided by BDOI is met (BRID 4.1; DMQ09, DMQ30)"]
  - [ARCHIVE, "History kept read-only in legacy or loaded into the BIBS archive for inquiry (BRID 11.1)"]
  - [EXCLUDED, "Not migrated; rebuilt in BIBS or not needed"]

milestones:
  - [M0, "Pack issued to BDOI", "26 Sep 2026"]
  - [M1, "Build-shaping decisions (answers that change what is built)", "16 Oct 2026"]
  - [M2, "Owners, stewards, keys and remaining business rules", "6 Nov 2026"]
  - [M3, "Object decisions signed (gate G1); layouts frozen (G2 part 1)", "T-16 weeks"]
  - [M4, "First full extracts in the templates, with control files and volumes", "T-14 weeks"]
  - [M5, "Code maps approved for Mock 2 (G2)", "T-10 weeks"]
  - [M6, "Cutover calendar, fallback and decommissioning criteria agreed", "T-6 weeks"]

# --------------------------------------------------------------------------------------------------------------
# Data object register. decision: MIGRATE / CARRY_FORWARD / CONDITIONAL / ARCHIVE / EXCLUDED (proposal; BDOI
# confirms at gate G1). layouts: template codes; an object without a layout has no extract file.
