# --------------------------------------------------------------------------------------------------------------
# Extract layouts. key: legacy key column(s); hash: hash total rule of the control file; amounts: amount columns
# totalled per currency in the control file.
layouts:
  R01:
    title: Lists of values and MIS values
    object: R01
    key: [list_type, code]
    hash: Count of distinct (list_type, code)
    amounts: []
