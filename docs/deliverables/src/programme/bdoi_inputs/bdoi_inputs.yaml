    - ["Sign the hypercare exit and the hand-over to production support", 2028-02-02, "Go / no-go board; BDOI application support; BDO IT operations"]
  BRD-03:
    - ["Sign the BRD-03 Product Maintenance sign-off set", 2026-11-30, "Product Owner, Marketing Business System; MBS; TSU; Business Project Services"]
  BRD-11:
    - ["Sign the BRD-11 User Access Maintenance sign-off set", 2026-12-01, "Product Owner, Marketing Business System; BDOI Information Security; BDOI IT; Business Administrators"]
  BRD-13:
    - ["Sign the BRD-13 Data Migration sign-off set (re-based on BRD V0.03)", 2026-10-30, "Program Manager, Business Project Services; Data Migration Lead; Head, Comptrollership; Head, Operations; BDOI IT"]
    - ["Sign the dress rehearsal report", 2027-11-26, "Data Migration Lead"]
