      not according to the VAT or non-VAT registration of the insurer. Confirm this, or say that the insurer''s registration
      must decide, and list the lines that are VAT-exempt or zero-rated.'
    why: An insurer that is not VAT-registered on a line where VAT is set up would be billed the wrong tax.
