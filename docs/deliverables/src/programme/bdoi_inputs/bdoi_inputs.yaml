# Source of the two BDOI input workbooks of the programme (request of the BDOI product owner, 8 October 2026):
#   (A) BIBS_Inputs_BRD-00_BDOI_Requirements_and_Inputs_by_BRD_v1.0.xlsx - what the project needs from the BDOI
#       business users, one tab per BRD;
#   (B) BIBS_Templates_BRD-00_Master_Data_and_Configuration_Upload_Templates_v1.0.xlsx and its short Word guide
#       (MASTER_DATA_GUIDE.md) - every master, reference and configuration dataset BIBS needs before go-live.
# Built by build_bdoi_inputs.py (same folder):
#   python docs/deliverables/src/programme/bdoi_inputs/build_bdoi_inputs.py            # both workbooks and the guide
#   python docs/deliverables/src/programme/bdoi_inputs/build_bdoi_inputs.py --check    # checks only
#
# What is typed here and what is read:
#   * typed: the tabs, owners and default dates of workbook A, the rules that give each row its type, the
#     reinsurance (phase 2) rows, the test-data and sign-off rows, and for workbook B the groups, the extra
#     templates, the dependencies between the templates of the different sources and the gap notes;
#   * read: the proposed rules and clarifications and the open questions of every FRS and of the BRD-13 handbook
#     (pack/catalogue.yaml), the discrepancy and clarification register, the Drop 0 configuration register
#     (Drop-0_Closure/drop0.yaml), the earlier Drop 0 requirements list (drop0_requirements.yaml), the NFR
#     catalogue, the project plan (milestones, sign-offs, dependencies) and, for workbook B, the configuration input
#     templates of BRD-03, BRD-11 and Drop 0, the Migration Console layouts and the upload definitions of the
#     platform.

