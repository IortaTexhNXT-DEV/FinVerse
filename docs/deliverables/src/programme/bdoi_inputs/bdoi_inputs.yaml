  - [Premium tax, "Rate % of the net premium of the line, rounded to centavos. BIBS applies it per product line, not by the VAT or non-VAT registration of the insurer.", "PM-04, Rate PREMIUM_TAX (per line)", "The lines on which premium tax is billed instead of VAT, and the rate", "Yes", TX-Q02]
  - [VAT on premium, "Rate % of the net premium of the line, rounded to centavos. The charge follows the line; a zero-rated or exempt client is classified on the VAT worksheet by its VAT treatment (TX-01).", "PM-04, Rate VAT_PREMIUM (per line)", "The VAT rate per line, the lines that are VAT-exempt or zero-rated, and whether the insurer's VAT registration must decide VAT or premium tax", "Yes", TX-Q02]
  - [Fire service tax (FST), "Rate % of the net premium of the lines it is set for, rounded to centavos.", "PM-04, Rate FIRE_SERVICE_TAX (fire lines)", "The fire lines that carry FST, the rate and the basis", "Yes", TX-Q01]
  - [Local government tax (LGT), "Rate % of the net premium at the rate of the insurer branch that places the policy, rounded to centavos. BIBS keeps no rate per local government unit.", "R04B, column lgt_rate of each insurer branch", "The LGT rate of each insurer branch and the ordinance basis of the LGU behind it", "Yes", TX-Q03]
  - [VAT on BDOI's commission, "Rate % of the commission (commission rate x net premium), rounded to centavos.", "PM-04, Rate VAT_COMMISSION", "The VAT rate on commission and the cases where it is zero-rated or exempt", "Yes", TX-Q05]
  - [Motor own damage / theft coverage factors, "Percent of the sum insured taken as the own damage / theft coverage: one factor for annual cover, one for multi-year cover.", "PM-04, Rates MOTOR_OD_ANNUAL and MOTOR_OD_MULTI_YEAR", "The two factors", "Yes", TX-Q01]
