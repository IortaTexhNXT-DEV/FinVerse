  why: "UAT of {drop} runs on migrated data and the production values; testers without access or scenarios without data stop the UAT."
  proposal: "The test plan (04 workbook of the set) names the scenarios; the BDOI testers choose the cases from the migrated data and add the cases the legacy data does not hold."
  source: "Project plan: dependency DEP-20 (UAT testers), milestone MS-20 (UAT plans, values for UAT and testers, 16-Jul-2027)"
signoff_rows:
  # brd -> list of [what, due, signatories]; Drop 1 and Drop 2 BRDs follow the plan rows.
  BRD-00:
    - ["Approve the Drop 0 closure summary and the configuration inputs at the steering committee", 2026-12-09, "Steering committee (chair: Program Manager, Business Project Services)"]
    - ["Approve the ORR / PRR evidence pack (operational and production readiness)", 2027-12-31, "Head, BDOI IT; Head, BDOI Information Security"]
    - ["Take the go / no-go decision for the go-live of Monday 3 January 2028", 2028-01-02, "Go / no-go board"]
    - ["Sign the hypercare exit and the hand-over to production support", 2028-02-02, "Go / no-go board; BDOI application support; BDO IT operations"]
  BRD-03:
    - ["Sign the BRD-03 Product Maintenance sign-off set", 2026-11-30, "Product Owner, Marketing Business System; MBS; TSU; Business Project Services"]
  BRD-11:
    - ["Sign the BRD-11 User Access Maintenance sign-off set", 2026-12-01, "Product Owner, Marketing Business System; BDOI Information Security; BDOI IT; Business Administrators"]
  BRD-13:
    - ["Sign the BRD-13 Data Migration sign-off set (re-based on BRD V0.03)", 2026-10-30, "Program Manager, Business Project Services; Data Migration Lead; Head, Comptrollership; Head, Operations; BDOI IT"]
    - ["Sign the dress rehearsal report", 2027-11-26, "Data Migration Lead"]
    - ["Sign the reconciliation of the go-live migration and of each true-up", 2028-01-02, "Head, Comptrollership; Data Migration Lead"]
