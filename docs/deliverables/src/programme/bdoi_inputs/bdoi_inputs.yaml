# --------------------------------------------------------------------------------- workbook A: classification
# The type of a row comes from the text of what is asked (first rule that matches, in this order); a source may
# also set it. [type, pattern, scope]: the pattern is a regular expression, case-insensitive; scope "ask" applies it
# to what is asked (after the topic), "all" to the topic and what is asked.
types:
  - Decision
  - Clarification
  - Business rule confirmation
  - Configuration value
  - Master data
  - Sample document or template
  - Report layout
  - Integration detail
  - Test data
  - Sign-off
type_rules:
  - [Test data, '\b(test data|UAT testers?|test users?|testers|test cases? data)\b', all]
  - [Decision, '^(please )?(decide|choose|select)\b', ask]
  - [Integration detail, '\b(interfaces?|integrations?|feeds?|file layouts?|transport|EIAM|UIDM|ISC|SCIM|CCM|Apigee|HLS|LFS|OBPCS|AFTS|EGL|EDP|CARMS|Bridger|NLDS|ECM|TFS|M365|portal|secure file|connector|bank channels?|channel layouts?|directory sign-in)\b', all]
  - [Report layout, '\b(reports?|extract layouts?|counters?|dashboards?|columns|variants?)\b', all]
  - [Sample document or template, '\b(letters?|templates?|slips?|certificates?|cover letter|layouts? of the (letter|advice|slip|form|documents?)|document layouts?|forms? (layout|template)|sample (letter|advice|form)s?)\b', all]
  - [Master data, '^(please )?(give|provide|name|list|supply|send|share|prepare)\b[^.]*\b(insurers?|branches|banks?|employees|products?|clients?|payees|partners|adjusters|account officers|cost cent(re|er)s|reinsurers|chart of accounts|master data|group profiles)\b', ask]
  - [Master data, '\b(chart of accounts|holiday calendar|opening (balances|trial balance)|user access matrix|role matrix)\b', all]
  - [Configuration value, '\b(thresholds?|limits?|days|hours|minutes|rates?|percent(age)?|prefix(es)?|parameters?|SLA|turnaround|TAT|lead days|tolerances?|frequenc(y|ies)|schedules?|numbering|lists? of values|brackets|buckets|ageing|aging|reminders?|cut-off|values)\b', all]
  - [Decision, '^(which|whether|is|are|should|may|can|does|do|will|option)\b|\b(decide|choose|option [A-C]\b|in or out of scope|in scope|or not)\b', ask]
  - [Business rule confirmation, '\bconfirms?\b', all]
  - [Clarification, '.', all]
