extra_rows_more:
  - ref: TX-Q01
    tab: BRD-03
    type: Business rule confirmation
    need: 'Premium charges: confirm the rules BIBS applies to the charges billed to clients: every charge (DST, premium tax,
      VAT, fire service tax, LGT) is a rate of the net premium after the minimum premium, computed independently (no charge
      on another charge); DST is rounded up to the next half peso, the others to centavos; there is no minimum amount per
      charge. Give the rate of each charge per line in template PM-04.'
    why: The charges are part of every invoice and of the remittance to the insurers; a different basis, order, minimum or
      rounding changes every amount.
    proposal: The rules as listed on the sheet PM-04 Charges checklist of the templates workbook.
