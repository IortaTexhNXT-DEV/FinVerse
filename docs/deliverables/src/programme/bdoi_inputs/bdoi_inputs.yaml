# Upload definitions of the platform used as templates: ID -> upload code, name, provided by, load text.
uploads:
  UP-01:
    handler: ClientBulkHandler
    name: Clients not held in the legacy systems
    sheet: Clients (upload)
    owner: "Heads, Retail and Corporate Marketing; Product Owner, MBS"
    purpose: "One row per individual or corporate client that is not in the legacy client master (for example a bank-referred prospect), with the KYC values BIBS keeps on the client: ID type and number, nationality, source of funds and risk rating. The legacy clients come through the Migration Console (C01 to C03); this upload also updates a client found by code, TIN, ID or name and birth date."
    load: "Screen upload: Client & Policy › Clients › Clients, button Bulk Upload (upload type Bulk client creation and update); every row is checked and the result is shown per row"
  UP-02:
    handler: PayeeMigrationHandler
    name: Payees
    sheet: Payees (upload)
    owner: "Product Owner, Comptrollership - Disbursement"
    purpose: "One row per payee of Disbursement (suppliers, service providers, employees, government agencies and other payees) with the payment modes, currency and bank account. This is also the layout of the payees of the legacy systems (migration object R09, in scope if BDOI confirms it)."
    load: "Screen upload: Finance › Disbursement › Disbursement Uploads, upload type Payee Migration; the payees and their bank accounts come in for authorisation"
  UP-03:
    handler: ListRecord
    name: Watchlist entries (sanctions, PEP and internal lists)
    sheet: Watchlist entries (upload)
    owner: "Compliance (Chief Compliance Officer)"
    purpose: "One row per listed person or entity of a sanctions, PEP or internal list that BIBS screens clients against; the BDO negative list and the lists BDOI keeps itself. A known reference changes the entry, a new one adds it; aliases are separated by semicolons."
    load: "Screen upload: Setup & Administration › Compliance Setup › List Sources and Runs, action Upload List File for the list source; the changes wait for a Compliance checker before screening uses them"
    codes:
      Entity Type: [[INDIVIDUAL, Individual], [ENTITY, Entity]]
      List Type: [[SANCTION, Sanctions list], [PEP, Politically exposed persons], [INTERNAL, Internal list]]

# Templates entered on a screen that this workbook adds (no upload or migration layout exists for them).
screen_templates:
  MD-01:
    name: Business partners (reinsurers, intermediaries, suppliers)
    sheet: Business partners
    owner: "Head, Comptrollership; Head, Operations for the reinsurers and intermediaries"
    purpose: "One row per business partner other than an insurer or a client: agents and brokers (intermediaries), reinsurers and reinsurance brokers, co-insurers, suppliers, garages, surveyors and banks. Insurers come from R04; clients from C01 and the client upload."
    load: "Configuration screen: Setup & Administration › Setup › Business Partners, one partner at a time, authorised by a second user"
    source: "BDOI partner lists; legacy supplier masters"
    columns:
      - [Party code, "Y", "Text, up to 30; capitals, digits, - and .", "Code of the partner, unique", "RI-0001", "text:30"]
      - [Party type, "Y", "Code of the list", "Kind of partner", "REINSURER", "list:PARTY_TYPE"]
      - [Name, "Y", "Text, up to 200", "Registered name", "Asia Pacific Reinsurance Corp.", "text:200"]
      - ["TIN / tax id", "N", "000-000-000-000", "Tax identification number", "123-456-789-000", "text:30"]
      - [Address, "N", "Text, up to 300", "Registered address", "Makati City", "text:300"]
      - [E-mail, "N", "E-mail address", "E-mail for advices and statements", "treaty@apre.example.ph", "text:120"]
      - [Phone, "N", "Text, up to 40", "Phone number", "+63 2 8888 0000", "text:40"]
      - [Default currency, "Y", "ISO currency code, 3 letters", "Currency of the partner's transactions", "PHP", "list:CURRENCY"]
      - [Bank name, "N", "Text, up to 120", "Bank of the partner's account", "BDO Unibank", "text:120"]
      - [Bank account no., "N", "Text, up to 40", "Account number for payments", "001234567890", "text:40"]
      - [Licence no., "Cond.: intermediaries (agent, broker, reinsurance broker)", "Text, up to 40", "Insurance Commission licence number of an intermediary", "IC-RB-2026-015", "text:40"]
      - [Credit days, "N", "Whole number", "Credit days of the partner's items (0 when none)", "30", "whole:0-365"]
      - [Commission rate %, "N", "Number, 0 to 100", "Commission rate of an intermediary", "", "number:0-100"]
      - [Withholding tax rate %, "N", "Number, 0 to 100", "Withholding tax rate applied to the partner", "2", "number:0-100"]
    lists:
      PARTY_TYPE:
        name: Business partner type
        values: [[AGENT, Agent], [BROKER, Broker], [REINSURER, Reinsurer], [RI_BROKER, Reinsurance broker],
                 [COINSURER, Co-insurer], [SUPPLIER, Supplier], [GARAGE, Garage], [SURVEYOR, Surveyor or adjuster],
                 [BANK, Bank], [EMPLOYEE, Employee], [GOVERNMENT, Government agency], [OTHER_PAYEE, Other payee]]
      CURRENCY:
        name: Currency
        values: [[PHP, Philippine peso], [USD, US dollar], [EUR, Euro], [JPY, Japanese yen], [GBP, Pound sterling],
                 [SGD, Singapore dollar], [HKD, Hong Kong dollar], [AUD, Australian dollar], [CNY, Chinese yuan]]
        strict: false

# Notes on the gaps: datasets with a template whose rows the platform cannot take by file, keyed on the screen.
gap_note: "No new upload is provided for these datasets. The BDOI owner fills in the template; the BIBS configuration team keys the rows on the screen named, a second user authorises each record (maker-checker), and the owner checks the result against the template before the dress rehearsal."
