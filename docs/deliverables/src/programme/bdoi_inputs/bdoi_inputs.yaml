# Type of each row after the row-by-row review (overrides the rules); filled from type_review.yaml.

# ------------------------------------------------------------------------- workbook B v1.1: taxes, charges, coverage
# Templates added in v1.1 (entered on a screen; merged with screen_templates).
screen_templates_more:
  MD-02:
    name: Currencies
    sheet: Currencies
    owner: "Head, Comptrollership (Treasury)"
    purpose: "One row per currency BIBS accepts on transactions and bank accounts: the base currency PHP and each foreign currency BDOI deals in."
    load: "Configuration screen: Setup & Administration › Setup › Currencies & Rates, authorised by a second user"
    source: "BDOI currency list"
    columns:
      - [Currency code, "Y", "ISO 4217, 3 capitals", "Code of the currency", "USD", "text:3"]
      - [Name, "Y", "Text, up to 60", "Name of the currency", "US dollar", "text:60"]
      - [Symbol, "N", "Up to 5 characters", "Symbol printed on documents", "$", "text:5"]
      - [Decimal places, "Y", "Whole number 0 to 4", "Decimals of the amounts in the currency", "2", "whole:0-4"]
      - [Active, "Y", "Y or N", "Y when the currency may be used", "Y", "yn"]
  MD-03:
    name: Exchange rates and their source
    sheet: Exchange rates
    owner: "Head, Comptrollership (Treasury)"
    purpose: "The opening exchange rates of each foreign currency per rate type at go-live. BIBS keeps four rate types: SPOT (daily rate of postings), CLOSING (month-end revaluation), AVERAGE (period average) and BUDGET. The source of the daily rates (for example the BDO Treasury board rate or the BSP reference rate) and who enters them are asked in the BDOI requirements workbook."
    load: "Configuration screen: Setup & Administration › Setup › Currencies & Rates, one rate per currency, type and date"
    source: "BDO Treasury or BSP reference rates"
    columns:
      - [Currency code, "Y", "Code of MD-02", "Currency of the rate (not PHP)", "USD", "code:MD-02/Currency code"]
      - [Rate type, "Y", "Code of the list", "Kind of rate", "SPOT", "list:FX_RATE_TYPE"]
      - [Effective date, "Y", "dd-mmm-yyyy", "Date from which the rate applies", "03-Jan-2028", "date"]
      - [Rate, "Y", "Number, PHP per unit of the currency", "Pesos for one unit of the currency", "", "number:0-1000000"]
    lists:
      FX_RATE_TYPE:
        name: Exchange rate type
        values: [[SPOT, Daily transaction rate], [CLOSING, Month-end closing rate], [AVERAGE, Period average rate], [BUDGET, Planning rate]]
  TX-01:
    name: Party tax profiles (clients, insurers, payees)
    sheet: Party tax profiles
    owner: "Head, Comptrollership (Tax)"
    purpose: "One row per client, insurer, intermediary or payee whose tax details BIBS uses on the BIR forms, the 2307 certificates, the alphalists and the VAT classification of sales: the registered TIN and branch code, the payee class, the registered name and address, the VAT treatment and the default ATC withheld. The party code is the code of the client (C01 or the client upload), insurer (R04), business partner (MD-01) or payee (UP-02)."
    load: "Configuration screen: Finance › Tax & Statutory › Party Tax Profiles, authorised by a second user"
    source: "BIR registrations (COR) of the parties; client KYC files"
    columns:
      - [Party code, "Y", "Text, up to 30", "Code of the client, insurer, partner or payee", "C-000101", "text:30"]
      - [TIN, "Y", "Digits and dashes, up to 20", "Taxpayer identification number as registered", "123-456-789", "text:20"]
      - [Branch code, "N", "Up to 5 digits", "TIN branch code (000 or 00000 for the head office)", "00000", "text:5"]
      - [Payee class, "Y", "Code of the list", "Individual or corporate (decides the WI or WC ATC and the alphalist name)", "CORPORATE", "list:TAX_PAYEE_CLASS"]
      - [Registered name, "Y", "Text, up to 200", "Name as registered with the BIR", "Juan Dela Cruz Trading Corp.", "text:200"]
      - [Last name, "Cond.: individuals", "Text, up to 60", "Last name of an individual", "", "text:60"]
      - [First name, "Cond.: individuals", "Text, up to 60", "First name of an individual", "", "text:60"]
      - [Middle name, "N", "Text, up to 60", "Middle name of an individual", "", "text:60"]
      - [Registered address, "N", "Text, up to 300", "Address as registered with the BIR", "Makati City", "text:300"]
      - [ZIP code, "N", "Up to 10 characters", "ZIP code of the registered address", "1226", "text:10"]
      - [VAT treatment, "N", "Code of the list", "How a premium without VAT is classified on the VAT return", "REGULAR", "list:VAT_TREATMENT"]
      - [Default ATC, "N", "Tax code of D0-10", "Withholding tax code applied by default to payments to or from the party", "", "text:20"]
    lists:
      TAX_PAYEE_CLASS:
        name: Payee class (BIR)
        values: [[INDIVIDUAL, Individual], [CORPORATE, Corporate (juridical person)]]
      VAT_TREATMENT:
        name: VAT treatment
        values: [[REGULAR, "Regular: sales with VAT are taxable, without VAT exempt"], [ZERO_RATED, "Zero-rated (for example PEZA or BOI-registered exporters)"], [EXEMPT, Exempt]]
  TX-02:
    name: Tax forms and filing calendar
    sheet: Tax forms
    owner: "Head, Comptrollership (Tax)"
    purpose: "One row per tax return or remittance form BDOI files, with its frequency and due date, so that the tax calendar warns before each deadline and the return worksheets post to the right accounts. The forms BIBS knows are listed on the sheet D0-10 Tax checklist; BDOI confirms which apply to it as a broker."
    load: "Configuration screen: Finance › Tax & Statutory › Tax Codes & Forms (Forms panel), authorised by a second user"
    source: "BDOI tax calendar"
    columns:
      - [Form code, "Y", "Up to 20 characters", "BIR or local form number", "2550Q", "text:20"]
      - [Name, "Y", "Text, up to 150", "Name of the return", "Quarterly VAT return", "text:150"]
      - [Authority, "Y", "Code of the list", "Who the form is filed with", "BIR", "list:TAX_AUTHORITY"]
      - [Frequency, "Y", "Code of the list", "How often the form is filed", "QUARTERLY", "list:FILING_FREQUENCY"]
      - [Worksheet, "Y", "Code of the list", "Computation worksheet behind the form (NONE: prepared outside BIBS, reminder only)", "VAT", "list:TAX_WORKSHEET"]
      - [Months after period end, "Y", "Whole number", "Months after the end of the period in which the form is due", "0", "whole:0-12"]
      - [Due day, "Y", "1 to 31 (31 = month end)", "Day of the month the form is due", "25", "whole:1-31"]
      - [Tax payable account, "N", "Account of D0-06", "Account the tax payable is posted to", "", "code:D0-06/Account Code"]
      - [Credit account, "N", "Account of D0-06", "Input VAT account credited against the output VAT (VAT return only)", "", "code:D0-06/Account Code"]
      - [Tracked from, "Y", "dd-mmm-yyyy", "First period the filing is tracked", "01-Jan-2028", "date"]
    lists:
      TAX_AUTHORITY:
        name: Tax authority
        values: [[BIR, Bureau of Internal Revenue], [LGU, Local government unit], [BFP, Bureau of Fire Protection]]
      FILING_FREQUENCY:
        name: Filing frequency
        values: [[MONTHLY, Monthly], [QUARTERLY, Quarterly], [MONTHLY_EXCEPT_QUARTER_END, "Monthly except the quarter-end month"], [ANNUAL, Annual]]
      TAX_WORKSHEET:
        name: Tax worksheet
        values: [[VAT, VAT worksheet], [EWT, Withholding tax worksheet], [NONE, "Prepared outside BIBS (reminder only)"]]
depends_more:
  MD-03: [MD-02]
  TX-01: [D0-10, R04, C01, MD-01, UP-02]
  TX-02: [D0-06]
due_more:
  MD-02: D2
  MD-03: D5
  TX-01: D5
  TX-02: D5

