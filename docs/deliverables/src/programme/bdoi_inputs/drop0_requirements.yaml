  owner: Head, Technical Support Unit
  needed_by: 16-Jul-2027
  status: Open
  sources: BRD Product Maintenance p.5 (PMADD04), p.20 (BRPM.010), p.23 (BRPM.013); FRS BRD-03 v2.0 FR-PM-031, FR-PM-032
    (PQ05)
- ref: PM-Q22
  category: Clarification
  area: Insurer-specific terms
  need: Which package terms may differ by insurer (coverages included, limits, deductibles, warranties and clauses, rate,
    minimum premium, commission), and can a package have several panel insurers or co-insurance with shares?
  background: PMADD02 asks for insurer-specific coverage, deductible and warranty mappings maintained without IT (p.4) but
    does not list the attributes or say how several insurers share a package.
  proposal: Every attribute listed may differ by insurer; insurers have the role Lead, Participant or Panel; shares, when
