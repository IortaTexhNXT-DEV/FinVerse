    of scope until BDOI decides. Please confirm: (a) which claims migrate (open at the freeze only, or also closed claims
    and for how many years); (b) the source (EBIX, ISYS, files kept outside the legacy systems per 1.3); (c) whether claims
    on policies that have already expired must be linked to a legacy policy record in BIBS; (d) the data owner.'
  background: New in BRD V0.03 p.15 (BRID_MIG 14.1, capability 14, added in revision 0.02). Handbook 'Scope and basis' lists
    open claims as out of scope until BDOI decides (DMQ30, PR-DM-05, PR-DM-26); object F07 'Open claims' is Conditional;
    closed claims are archived (H01). The Claims module (BRD-07) is in Drop 2, built Mar-Apr 2027 with SIT Jul-Sep 2027.
