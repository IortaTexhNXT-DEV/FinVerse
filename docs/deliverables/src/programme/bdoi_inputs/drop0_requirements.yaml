    that historical transactions stay in read-only legacy or an archive. The new or changed BRID_MIG 1.3 (p.7-8), 10.1 (p.12),
    13.1 (p.14) and 14.1 (p.15) can be read as asking for closed history in BIBS. The handbook is built on the selective
    principle (Part A ''Principles'' 1-2 and ''What this migration does not do'': no conversion of closed transactions,
    GL history or expired policies).'
