    that breaks a BIBS separation-of-duties rule; how soon must a leaver be deactivated; and how are movers (change of unit
    or branch) handled?'
  background: BIBS checks separation-of-duties rules on every request and bulk line (FR-UA-053) and needs a second approval
    for privileged or out-of-hours changes (FR-UA-034). An IGA normally owns approvals; two approvals of the same change
    would duplicate work.
