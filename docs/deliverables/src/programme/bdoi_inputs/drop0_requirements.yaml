- ref: UA-Q11
  category: Decision
  area: Session
  need: How must the Entra ID session and token lifetimes work with the BRD rule of a 15-minute inactivity warning and a
    30-minute sign-out? After BIBS signs a user out for inactivity, must the user re-enter credentials at EIAM, or may Entra
    ID sign the user back in silently? Please also give the maximum length of a BIBS session (the 'fixed session expiry'
    before which BIBS warns 30 minutes ahead).
  background: BIBS keeps its own inactivity warning (15 minutes) and sign-out (30 minutes) in every mode (FR-UA-002). If
    the Entra ID session is still open, a user returning after the BIBS time-out would be signed in again without a password,
    which weakens the 30-minute rule. The FRS does not state the value of the fixed session expiry.
  proposal: BIBS asks EIAM to re-authenticate the user after an inactivity sign-out; BIBS inactivity 15 / 30 minutes; maximum
    session length 10 hours (one working day), to be confirmed by Information Security.
  impact: The session rule cannot be tested end to end with EIAM; the fixed session expiry has no agreed value.
  priority: High
  owner: Head, BDOI Information Security
  needed_by: 01-Dec-2026
  status: Open
  sources: BRD User Access Maintenance p.8, p.17 (Other BU NFR 5); FRS BRD-11 v2.0 FR-UA-002, section 9.1 (SESSION_EXPIRY_WARNING_MINUTES);
    Programme alignment IQ04
