# The Drop 0 requirements and questions list for BDOI (v1.0, 8 October 2026: BRD-03, BRD-11 and BRD-13 items
# PM-Qnn, UA-Qnn and DM-Qnn), kept here as a source of the BDOI requirements and inputs workbook
# (build_bdoi_inputs.py). One entry per item: category, area, the requirement or question, background,
# proposal, impact, priority, BDOI owner, needed by, status and the source references.
BRD-03:
- ref: PM-Q01
  category: Conflict in BRD
  area: BRD document and approvals
  need: Please confirm that the approval pages of the addendum and of the main BRD apply to Product Maintenance, and correct
    the copied headings in the next BRD revision?
  background: The addendum is headed 'Business Requirements for New Business' (p.3) and 'Table of New Business Requirements'
    (p.4), and its approval page says 'New Business Fire and Motor' (p.8). The main BRD approval says 'for the OPERATIONS
    request' (p.34). The revision log reads 'Added BRID PMADD07 and PMADD07' (p.2, presumably PMADD07 and PMADD08) and a
    preparer date reads '11/06/205' (p.34).
  proposal: The signatures on pp.8-9 and pp.34-35 are taken as the approval of the Product Maintenance BRD and its addendum;
    the headings are corrected by Business Project Services in the next revision or recorded in minutes of meeting.
  impact: The approval record of the baseline refers to other BRD titles; the traceability and the sign-off of the FRS rest
    on that approval.
  priority: Low
  owner: Business Analyst, Business Project Services; Product Owner, Marketing Business System
  needed_by: Before Drop 0 sign-off
  status: Open
  sources: BRD Product Maintenance p.2, p.3, p.4, p.8, p.34; Discrepancy register DCR-031
- ref: PM-Q02
  category: Conflict in BRD
  area: BRD document and approvals
  need: Please confirm which main BRD requirements each addendum requirement refines, since the 'Source BRD ID' column of
    the addendum is empty?
  background: The 'Source BRD ID' column is blank for PMADD01 to PMADD08 (pp.4-7). Read against the main BRD, we take PMADD03
    as refining BRPM.014, PMADD04 as refining BRPM.010 and BRPM.013, PMADD05 as refining BRPM.002 and PMADD06 as refining
    BRPM.015; PMADD01, PMADD02, PMADD07 and PMADD08 are new.
  proposal: Accept the mapping above; where an addendum row and a main BRD row differ, the addendum (April 2026) prevails.
  impact: Acceptance tests could be run against superseded wording; traceability of the FRS to the BRD is not confirmed.
  priority: Medium
  owner: Business Analyst, Business Project Services
  needed_by: Before Drop 0 sign-off
  status: Open
  sources: BRD Product Maintenance pp.4-7; FRS BRD-03 v2.0 section 1.2 and chapter 11; Discrepancy register DCR-032
- ref: PM-Q03
  category: Conflict in BRD
  area: BRD document and approvals
  need: Please confirm the priority of BRPM.003 and the acceptance criteria of BRPM.013?
  background: BRPM.003 (capture, store and validate product-specific fields, p.16) has no priority level. BRPM.013 asks
    for keying in insurer terms and feedback (p.23), but its acceptance criteria describe comparative tables and a monitoring
    sheet.
  proposal: BRPM.003 is a Must have. BRPM.013 is tested on the capture of insurer responses with their outcome and history
    (FR-PM-031); the comparative-table criteria are tested under BRPM.014 (FR-PM-034).
  impact: Test cases of BRPM.013 would not test the requirement; the priority of BRPM.003 is unknown for planning.
  priority: Low
  owner: Product Owner, Marketing Business System
  needed_by: Before Drop 0 sign-off
  status: Open
  sources: BRD Product Maintenance p.16, p.23; FRS BRD-03 v2.0 FR-PM-012, FR-PM-031; Discrepancy register DCR-033
- ref: PM-Q04
  category: Conflict in BRD
  area: BRD document and approvals
  need: Please confirm that no requirement is missing at BRPM.023, which does not appear in the BRD?
  background: BRPM.022 is followed by BRPM.024 (p.31). The earlier signed version (pp.36-61) also skips BRQID.023.
  proposal: Treat the gap as a numbering gap only (FRS assumption A-PM-07).
  impact: A requirement could be missing from the baseline and from the test plan.
  priority: Low
  owner: Business Analyst, Business Project Services
  needed_by: Before Drop 0 sign-off
  status: Open
  sources: BRD Product Maintenance p.31, pp.36-61; FRS BRD-03 v2.0 A-PM-07 (PQ20); Discrepancy register DCR-029
- ref: PM-Q05
  category: Confirmation
  area: BRD document and approvals
  need: Please confirm that the earlier rule requiring documented client negotiation before a new rate scheme applies to
    a renewal already advised (BRQID.008 of the earlier signed version) was dropped on purpose, and that the Renewal BRD
    rule BRRN.038 now governs it?
  background: The pack contains an earlier signed version of the BRD (pp.36-61). Its BRQID.008 is not in the final version,
    which keeps only 'old packages locked for new business but accessible for renewals' (BRPM.007, p.17-18); the revision
    log does not record the removal. The Renewal BRD (BRRN.038 AC 3) requires acceptance evidence when a renewal has a financial
    impact.
  proposal: BRQID.008 was removed on purpose; the acceptance evidence of BRRN.038 AC 3 in Renewal covers it, and Product
    Maintenance adds no separate control.
  impact: Renewals could be repriced after the renewal advice without client evidence if the Renewal control does not cover
    the case.
  priority: Medium
  owner: Product Owner, Marketing Business System; Product Owner, Renewal
  needed_by: Before Drop 0 sign-off
  status: Open
  sources: BRD Product Maintenance pp.17-18, pp.36-61; FRS BRD-03 v2.0 FR-PM-051 (PQ10); Discrepancy register DCR-030
- ref: PM-Q06
  category: Confirmation
  area: Scope
  need: Please confirm that maintenance of non-package products is out of scope for this phase, and that 'Non-Package Management'
    in the Core Replacement BRD means the non-package placement of New Business?
  background: The revision log of 27-Oct-2025 says 'Exclude Non-Package and include this as part of an addendum' (p.11),
    but the April 2026 addendum does not add it, and PMADD01 refers to non-package items 'if/when added' (p.4). BRD-00 capability
    4 'Non-Package Management' has no requirement rows.
  proposal: Non-package product maintenance is out of this phase (FRS assumption A-PM-06). Non-package products are held
    in the same product catalogue and hierarchy, and non-package placement (request form, quotation slip, comparative table,
    proposal slip) stays in New Business (BRD-1).
  impact: Scope of the module and of the BRD-00 capability is undefined; a later request would be a change request.
  priority: High
  owner: Product Owner, Marketing Business System
  needed_by: Before Drop 0 sign-off
  status: Open
  sources: BRD Product Maintenance p.4 (PMADD01), p.11; FRS BRD-03 v2.0 section 1.2, A-PM-06 (PQ19); Discrepancy register
    DCR-036; Core Replacement BRD capability 4 (CRQ02)
- ref: PM-Q07
  category: Confirmation
  area: Scope
  need: Please confirm that a package is a catalogue product (risk code) flagged as packaged, either generic for a market
    segment or specific to one client, and that every package has its own risk code?
  background: The BRD uses 'package', 'product', 'policies/packages' and 'insurance packages' without a definition (pp.12-31).
    The FRS models a package as a product with pre-negotiated terms, rates and insurers, changed only through numbered versions.
  proposal: Accept the definition (FRS assumption A-PM-02). One risk code may carry several panel insurers, each with its
    own terms, but not several packages.
  impact: The product catalogue structure, the package map of the data migration and the pricing of New Business depend
    on this definition.
  priority: High
  owner: Product Owner, Marketing Business System; Head, Technical Support Unit
  needed_by: Before Drop 0 sign-off
  status: Open
  sources: BRD Product Maintenance pp.12-31; FRS BRD-03 v2.0 section 1.4, A-PM-02 (PQ01)
- ref: PM-Q08
  category: Confirmation
  area: Scope
  need: Please confirm that the master screens added to this set beyond the package lifecycle (Insurers, Rates & Taxes,
    Sales Organisation, Premium Calculator, Coverages & Clauses, Incentive Criteria) are reviewed and signed under BRD-03,
    with the owners named for each?
  background: 'The BRD covers package products, their approval, set-up, versions, expiry and incentive criteria. The sign-off
    workbook also lists the shared catalogue screens SCR-PM-17 to SCR-PM-21 (insurers and branches, statutory rates and
    taxes, sales organisation, premium calculator), which New Business, Operations and Accounting use. Their data owners
    differ: Head of Operations (insurers, commission rates), Heads of Marketing (sales organisation), Comptrollership (taxes).'
  proposal: Sign these screens with BRD-03 as the single home of the product and pricing masters; each owner reviews the
    rows of its screens in the sign-off workbook.
  impact: Without an agreed home and owner, these masters have no signed specification before SIT.
  priority: Medium
  owner: Product Owner, Marketing Business System; Head, Operations; Head, Comptrollership
  needed_by: Before Drop 0 sign-off
  status: Open
  sources: Sign-off workbook BRD-03 v2.0, Screen catalogue SCR-PM-17 to SCR-PM-21; Cross-BRD contract IC-01 to IC-13; Drop
    0 closure, set BRD-03 'confirms'
- ref: PM-Q09
  category: Confirmation
  area: BRD document and approvals
  need: Please confirm the signatories of the BRD-03 sign-off set, in particular whether the Head of Comptrollership signs,
    given that the addendum approval page marks that signature as not required?
  background: The sign-off certificate follows the BRD approval sheets (pp.8-9, pp.34-35) and adds BDOI IT as reviewer of
    interfaces and access. The Head of Comptrollership signs the main BRD (p.35) but is marked not required on the addendum
    (p.9), while this set includes rates and taxes, commission rates and incentive criteria.
  proposal: The Head of Comptrollership signs the set for rates and taxes, commission rates and incentive criteria; BDOI
    IT reviews interfaces, user access and the Technical Specification.
  impact: Sign-off on 30-Nov-2026 could be incomplete or contested for the financial masters.
  priority: Medium
  owner: Product Owner, Marketing Business System
  needed_by: 23-Nov-2026
  status: Open
  sources: BRD Product Maintenance p.9, p.35; Sign-off workbook BRD-03 v2.0, Sign-off certificate; Start Here BRD-03 v2.0,
    Who signs what
- ref: PM-Q10
  category: Data or input needed
  area: Access and roles
  need: Please provide the final role-to-action matrix of Product Maintenance (create, amend, approve, view-only per role),
    including the definition of the MBS, ManCom and Business Administrator roles, or confirm the proposed matrix?
  background: PMADD05 asks for a role-to-action matrix (p.5), but the addendum persona 'User' says roles 'will be further
    defined in succeeding documentations' (p.4, footnote 2); MBS and ManCom are not defined as personas in the final version.
    The BIBS-wide access matrix is still a BDOI deliverable (OQ48). How role changes are approved is answered by BRD-11
    (PQ17).
  proposal: Adopt the proposed matrix of FRS section 3.3 (15 permissions over 10 roles, with fixed segregation-of-duties
    rules) as the go-live matrix; later changes go through approved role-permission requests.
  impact: Access tests and the menus by persona cannot be finalised; users cannot be loaded with their roles for SIT and
    UAT.
  priority: High
  owner: Product Owner, Marketing Business System; Business Administration
  needed_by: 30-Nov-2026
  status: Open
  sources: BRD Product Maintenance p.4 footnote 2, p.5 (PMADD05); FRS BRD-03 v2.0 sections 3.1-3.3, FR-PM-002 (PQ17, OQ48);
    Discrepancy register DCR-035
- ref: PM-Q11
  category: Dependency
  area: Access and roles
  need: Please confirm that Product Maintenance users sign in through the BIBS-wide directory sign-in decided under BRD-11
    User Access Maintenance (Entra ID), with no separate log-in rules for this module?
  background: BRPM.001 and BRPM.002 ask for log-in with valid credentials (p.15). FRS FR-PM-001 rule R2 still states that
    BDO single sign-on is not part of this phase, whereas BRD-11 has since required directory sign-in (answered Q42) and
    the drop plan lists Entra ID as a Drop 0 integration.
  proposal: Product Maintenance follows the sign-in, session and lock-out rules of BRD-11; FR-PM-001 is aligned in the next
    version of the set.
  impact: Inconsistent sign-in rules between the BRD-03 and BRD-11 sets; access testing of BRPM.001-002 depends on the BRD-11
    interface.
  priority: Medium
  owner: BDOI IT; BDOI Information Security
  needed_by: 01-Dec-2026
  status: Open
  sources: BRD Product Maintenance p.15 (BRPM.001, 002); FRS BRD-03 v2.0 FR-PM-001 R2 (Q42); BDOI drop plan, Drop 0 integrations;
    Drop 0 closure DEC-05
- ref: PM-Q12
  category: Dependency
  area: Access and roles
  need: When a change to the permissions of a Product Maintenance role is approved, should BIBS apply it at once, or should
    the System Administrator implement it as for other group-profile changes under BRD-11?
  background: PMADD05 asks that the Admin maintains roles and that changes are auditable (p.5). BRD-11 (p.6) shows group-profile
    changes requested, approved, then implemented by the System Administrator; the question of applying on approval is open
    under BRD-11 (UQ03).
  proposal: 'Follow BRD-11: the approved change waits for implementation by the System Administrator (one rule for every
    module).'
  impact: Role changes in Product Maintenance would behave differently from other modules.
  priority: Low
  owner: Business Administration; BDOI Information Security
  needed_by: 01-Dec-2026
  status: Open
  sources: BRD Product Maintenance p.5 (PMADD05); FRS BRD-03 v2.0 FR-PM-003 (PQ17); BRD User Access Maintenance p.6 (UQ03)
- ref: PM-Q13
  category: Decision
  area: Package request and approvals
  need: Is a Package Request Form approved by any one of the Marketing TL, TH or UH, or is there an approval chain or limit
    by segment, amount or product?
  background: BRPM.008 says the form is 'reviewed and approved by the Marketing Team Lead (TL), Team Head (TH), or Marketing
    Unit Head (UH)' (p.18) and BRPM.021 asks for 'multi-level approvals' (p.30), without an order or a limit.
  proposal: One Marketing approval by any holder of the approval permission other than the maker (FRS assumption A-PM-03,
    CLR-PM-03).
  impact: The workflow stages and the approval tests depend on the answer; a chain added later is a change request.
  priority: High
  owner: Head, Retail Marketing; Head, Corporate and Retail Marketing; Unit Head, Combank and Corbank
  needed_by: 30-Nov-2026
  status: Open
  sources: BRD Product Maintenance p.18 (BRPM.008), p.30 (BRPM.021); FRS BRD-03 v2.0 FR-PM-021, CLR-PM-03, A-PM-03 (PQ08,
    Q05); Drop 0 closure DEC-08
- ref: PM-Q14
  category: Clarification
  area: Package request and approvals
  need: Must a package request raised by TSU (for example a package renewal drafted from the expiry monitor, or a retirement)
    also be approved by Marketing before the TSU Team Lead reviews it?
  background: BRPM.008 names 'Marketing AO / TSU' as submitters of an approved Package Request Form (p.18). In the proposed
    workflow every request, whoever raises it, goes to Marketing approval first (FRS section 5.2).
  proposal: 'Keep one path: every request, including those raised by TSU, is approved by Marketing before the TSU review.'
  impact: TSU-raised renewals and retirements could be delayed by an approval Marketing does not need to give, or skip an
    approval BDOI expects.
  priority: Medium
  owner: Head, Technical Support Unit; Product Owner, Marketing Business System
  needed_by: 23-Nov-2026
  status: Open
  sources: BRD Product Maintenance p.18 (BRPM.008); FRS BRD-03 v2.0 FR-PM-020, FR-PM-021, section 5.2
- ref: PM-Q15
  category: Data or input needed
  area: Package request and approvals
  need: Please give the mandatory fields of the Package Request Form, and confirm that a generic programme needs no client
    while a client-specific package names a client (or prospect) from the client master?
  background: BRPM.008 asks that mandatory fields are 'clearly indicated' (p.18) but does not list them.
  proposal: 'Use the proposed mandatory fields of FR-PM-020: request type, scope, package or programme name, product line,
    cover type (new package) or existing package, reason, requested terms, package end date and, when negotiated, at least
    one target insurer; a client only for client-specific packages.'
  impact: Field validations of the form and their test cases are not confirmed.
  priority: Medium
  owner: Head, Retail Marketing; Head, Technical Support Unit
  needed_by: 30-Nov-2026
  status: Open
  sources: BRD Product Maintenance p.18 (BRPM.008); FRS BRD-03 v2.0 FR-PM-020 (PQ14)
- ref: PM-Q16
  category: Confirmation
  area: Package request and approvals
  need: Please confirm the six request types (new, amend terms, update details, renew, reactivate, retire), the difference
    between 'amend' and 'update', and that 'deletion' of a package means its retirement after the approvals and ManCom sign-off,
    with no record ever deleted?
  background: BRPM.011 speaks of requests for 'product creation, amend, updating, or deletion' (p.21) without defining them;
    BRPM.006 requires that records are archived, not deleted (p.17). The BRD does not say which approvals a retirement needs.
  proposal: Amend changes negotiated terms and always negotiates; update changes other package details and negotiates only
    when chosen; deletion is a retirement request that follows the Marketing, TSU and ManCom approvals without negotiation
    (CLR-PM-04, A-PM-05).
  impact: Request types, their workflow and the retirement path are fixed at sign-off.
  priority: Medium
  owner: Head, Technical Support Unit; Product Owner, Marketing Business System
  needed_by: 30-Nov-2026
  status: Open
  sources: BRD Product Maintenance p.17 (BRPM.006), p.21 (BRPM.011); FRS BRD-03 v2.0 section 2.3, FR-PM-045, CLR-PM-04,
    A-PM-05 (PQ13)
- ref: PM-Q17
  category: Data or input needed
  area: Workflow, service levels and escalation
  need: Please give the turnaround time of each stage of a package request (Marketing approval, TSU review, TSU approval,
    negotiation, ManCom sign-off, MBS set-up, validation), the insurer reply time for a quotation slip, and the timeframes
    for advisories and reports?
  background: The BRD refers to an 'agreed turn-around-time' (BRPM.012, p.22; BRPM.013, p.23), a 'defined SLA' (BRPM.018,
    p.29; BRPM.021, p.30) and a 'required timeframe' for advisories (BRPM.016, p.27) without values.
  proposal: 'Use the configurable defaults: 24 hours for each approval stage, 120 hours for negotiation, 72 hours for ManCom,
    48 hours for MBS set-up, requirements and Marketing review, 24 hours for validation; insurer reply within 5 days. BDOI
    can change them as parameters without a change request.'
  impact: Overdue indicators, SLA alerts and the home page tiles would run on unconfirmed values.
  priority: Medium
  owner: Head, Technical Support Unit; Product Owner, Marketing Business System
  needed_by: 16-Jul-2027
  status: Open
  sources: BRD Product Maintenance pp.22-31; FRS BRD-03 v2.0 sections 5.1, 5.4, 9.1 (PQ08)
- ref: PM-Q18
  category: Decision
  area: Workflow, service levels and escalation
  need: Should a request past its service level be escalated to a higher level (for example the unit head), or is an alert
    to the owners of its stage enough?
  background: BRPM.021 asks that approvals are tracked 'within the SLA' (p.30-31) but does not ask for escalation.
  proposal: Alert the stage owners and show the request in the red tiles of the Product Maintenance home; no escalation
    to a higher level (CLR-PM-16).
  impact: Escalation added after sign-off is a change request.
  priority: Low
  owner: Head, Technical Support Unit; Product Owner, Marketing Business System
  needed_by: 30-Nov-2026
  status: Open
  sources: BRD Product Maintenance pp.30-31 (BRPM.021); FRS BRD-03 v2.0 FR-PM-073, section 5.4, CLR-PM-16
- ref: PM-Q19
  category: Clarification
  area: Negotiation and quotation slips
  need: Who is the 'co-Officer' who may approve a quotation slip instead of the TSU Team Lead, and can the TSU Head also
    approve it?
  background: BRPM.012 says the quotation slip is 'approved by TL or co-Officer' (p.22) and remains editable by TSU TL/TH
    until ManCom sign-off.
  proposal: Any TSU user holding the quotation-slip approval permission other than the preparer may approve it; the permission
