- ref: PM-Q26
  category: Decision
  area: ManCom sign-off
  need: Who are the ManCom members for package sign-off, does the sign-off of one member complete the step or is a quorum
    or all members needed, and is the sign-off given in the system or on a physically signed sheet uploaded to it?
  background: BRPM.015 requires a mandatory ManCom review and sign-off in the system before MBS receives the requirements,
