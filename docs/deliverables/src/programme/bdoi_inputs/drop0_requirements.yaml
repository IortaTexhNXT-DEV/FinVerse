  category: Decision
  area: Migration scope and principle
  need: 'Please confirm that the selective, continuity-focused principle of the BRD still applies (migrate clean master
    and reference data, carry forward only open financial positions, keep history in read-only legacy or the archive), and
    that the new V0.03 requirements that mention history are read within it: 1.3 ''other data maintained outside the legacy
    systems'', 10.1 ''all data from the legacy system should be considered'', 13.1 ''transaction history and open/closed
    statuses'' and 14.1 ''no loss of historical information''.'
