- ref: PM-Q20
  category: Confirmation
  area: Negotiation and quotation slips
  need: Please confirm that one quotation slip is produced per negotiation round and e-mailed separately to each insurer,
    and that no package brochure is produced by the system?
  background: BRPM.012 asks that terms are sent to insurers 'directly from the system (e.g., via email, system message,
    or integrated portal)' (p.22). The BRD does not mention a brochure.
  proposal: One quotation slip per round, one protected e-mail per insurer; insurers are reached by e-mail only (no insurer
    portal); no brochure (CLR-PM-02).
  impact: The documents and channels to insurers are fixed at sign-off.
  priority: Low
  owner: Head, Technical Support Unit
  needed_by: 30-Nov-2026
  status: Open
  sources: BRD Product Maintenance p.22 (BRPM.012); FRS BRD-03 v2.0 FR-PM-030, chapter 7, CLR-PM-02
- ref: PM-Q21
  category: Data or input needed
  area: Negotiation and quotation slips
  need: Please give the full list of insurer response outcomes, the maximum number of negotiation rounds (if any), and whether
    the outcome states and revision rounds also apply to non-package placement requests in New Business?
  background: PMADD04 asks for exception states such as 'Approved w/ Changes, Declined, etc.' and revision loops (p.5) without
    the full list or a limit.
  proposal: 'Outcomes: Pending, Accepted as requested, Approved with changes, Counter-proposal, Declined, No response; no
