- ref: PM-Q23
  category: Decision
  area: Comparative tables
  need: Please confirm the fields that may be shown in a client-tailored comparative view, whether a view must have at least
    one field, and who may produce and send client views?
  background: PMADD03 asks that users 'include/exclude fields and insurers per output' while the system keeps an audit master
