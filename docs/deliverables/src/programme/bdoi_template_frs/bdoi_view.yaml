# BDOI view of the BDOI-template FRS packs (Renewal, Product Maintenance, Operations Cashiering), product owner direction
# of 11-Oct-2026: the FRS and its workbooks revolve around the BRD, BDOI's own FRS and the iNXT BrokerVerse OOTB platform
# only. Phrases of the added text that described the BIBS build (what was built or prepared for BIBS, as-built or
# delivered values, simulators, current layouts of the build) are rewritten as requirement wording; BIBS stays only as
# BDOI's name for the system. Applied by bdoi_view.py to the added text of the FRS (BDOI's own text is never touched) and
# to every text cell of the workbooks. The lists are applied in order.
replace:
  # what was built or prepared for BIBS
  - [", even where it was already delivered for BIBS in this project.", "."]
  - [" A point already delivered for BIBS in this project is still classified by the OOTB platform; the effort workbook says so in a separate column.", ""]
  - ["A point already delivered for BIBS in this project is still classified by the OOTB platform; the effort workbook says so in a separate column.", ""]
  - [", not the work done for BDOI in this project:", ":"]
  - [", not the work done for BDOI in this project", ""]
  - [" The effort is for the two BDOI texts on top of the routing already delivered for BIBS.", " The effort is for the routing and the two BDOI texts."]
  - ["Partly: the screens prepared for BIBS use the platform components; about 8 of 35 screen files carry accessibility labels", "-"]
  - [" is an extension of BIBS, available in the BIBS environment.", " is an extension of the platform."]
  - [", available in the BIBS environment", ""]
  - ["Extension of BIBS: ", "Extension of the platform: "]
  - ["not available in the system today", "not available in the OOTB platform"]
  - ["Not available in the system today", "Not available in the OOTB platform"]
  - ["Channel simulator (SIT and UAT only)", "Test files of the payment channels (SIT and UAT)"]
  - ["the BRD or the earlier BIBS behaviour differ are offered both ways in BIBS", "the BRD differ are offered both ways"]
  - ["differ are offered both ways in BIBS", "differ are offered both ways"]
  - ["a point that BIBS offers both ways", "a point offered both ways"]
  # interfaces: the channels and receiving systems as requirements, without the test simulators
  - ["Given (sample). Available in BIBS; the channel simulator writes the file for SIT and UAT", "Given (sample)"]
  - ["Given in part (sample). Available in BIBS; the channel simulator writes the file for SIT and UAT", "Given in part (sample)"]
  - ["Given in part (sample, file name). Available in BIBS: intake with the name, size, duplicate and header checks, run report, refusal alert and processing again; run end to end in SIT and UAT against the channel simulator.", "Given in part (sample, file name). Proposed: intake with the name, size, duplicate and header checks, run report, refusal alert and processing again."]
  - ["Available in BIBS: intake with the name, size, duplicate and header checks, run report, refusal alert and processing again; run end to end in SIT and UAT against the channel simulator.", "Proposed: intake with the name, size, duplicate and header checks, run report, refusal alert and processing again."]
  - ["To be provided. Available in BIBS in the proposed layout and run end to end against the channel simulator; layout", "To be provided. Proposed layout (Appendix D); layout"]
  - ["Available in BIBS in the proposed layout and run end to end against the channel simulator; layout", "Proposed layout (Appendix D); layout"]
  - ["To be provided. Available in BIBS in the proposed layout; the channel simulator writes the file for SIT and UAT", "To be provided. Proposed layout (Appendix D)"]
  - ["Available in BIBS in the proposed layout; the channel simulator writes the file for SIT and UAT", "Proposed layout (Appendix D)"]
  - ["Available in BIBS; the channel simulator writes the file for SIT and UAT", "Proposed layout (Appendix D)"]
  - ["Layout proposed in BIBS (Appendix D)", "Layout proposed (Appendix D)"]
  - ["Available in BIBS and run end to end in SIT and UAT against the receiving system simulator (Product Master Transfers screen); folder", "Proposed: the Product Master Transfers screen; folder"]
  - ["; in SIT and UAT a channel simulator writes the files in BDOI's layouts.", "."]
  - ["; run end to end in SIT and UAT against the channel simulator", ""]
  - [", Send Now and, in SIT and UAT, the inbox of the receiving system simulator.", " and Send Now."]
  - ["Name of the receiving system (the simulator in SIT and UAT)", "Name of the receiving system"]
  - ["The mode of the channel (live or simulator in SIT and UAT)", "The mode of the channel (live or test)"]
  - ["In SIT and UAT a simulator receives the files so that the flow runs end to end; the folder", "The folder"]
  - ["Simulator in SIT and UAT (Integration scope)", "(Integration scope)"]
  # settings and observations: the proposal, without the behaviour of the build
  - ["Available in BIBS: ", "Proposed (setting): "]
  - ["Available in BIBS; ", "Proposed; "]
  - ["Available in BIBS", "Proposed"]
  # delivered values are defaults
  - ["(as delivered: ", "(default: "]
  - ["the the system delivered value is 60", "the default value is 60"]
  - ["Value as delivered", "Default value"]
  - ["(as delivered, BDOI's FRS)", "(by default, BDOI's FRS)"]
  - ["(as delivered)", "(by default)"]
  - ["As delivered, ", "By default "]
  - ["As delivered ", "By default "]
  - ["As delivered", "By default"]
  - [" as delivered", " by default"]
  # layouts and screenshots
  - [": current layout in the BIBS DEV environment", ": proposed layout"]
  - ["and the current layout in the BIBS environment where one exists", "and an image of the proposed layout"]
  - ["where the system has one, an image of its current layout", "an image of the proposed layout"]
  - ["the system's current layouts of Annex AF apply", "the proposed layouts of Annex AF apply"]
  - ["Current layout of the system below", "Proposed layout below"]
  - [": current layout of the", ": proposed layout of the"]
  - ["current layout of the", "proposed layout of the"]
  - ["Draft layout in BIBS; ", "Proposed layout; "]
  - ["Draft columns in BIBS; ", "Proposed columns; "]
  - ["The screenshots were taken on the BIBS test environment with SIT/UAT data; the screens of BDOI's posting step, payment files, receipt forms and lists were taken on 10-Oct-2026.", "The screenshots show the screens with fictitious data."]
  - ["The screenshots were taken on the BIBS DEV environment: https://dev.brokerverse.cloud with SIT/UAT data;", "The screenshots show the screens with fictitious data;"]
  - ["The screenshots were taken on the ", "The screenshots are of the "]
  - ["; aligned on 10 Oct 2026 with BIBS: ", "; on 10 Oct 2026: "]
  - [" with current screenshots", " with screenshots"]
  # notices and wordings
  - ["'Sent by BIBS' texts are quoted word for word from the BIBS environment; 'Proposed' texts are the wording proposed by the iorta TechNXT Project Team where BDOI's FRS asks for a notice and has not given its text", "'Specified' texts are the notices of the specification; 'Proposed' texts are the wording proposed by the iorta TechNXT Project Team where BDOI's FRS asks for a notice and has not given its text"]
  - ["as sent by BIBS", "specified"]
  - ["Sent by BIBS", "Specified"]
  - ["BIBS sends the in-system notice", "the system sends the in-system notice"]
  - ["The texts are the wording of the system today (quoted word for word; ", "The texts are proposed wordings ("]
  - ["Wording of the system today, proposed by iorta TechNXT", "Wording proposed by iorta TechNXT"]
  - ["Proposed by iorta TechNXT for BDOI approval; not given by the system today", "Proposed by iorta TechNXT for BDOI approval"]
  # sizing and environment
  - ["Assumed within the BIBS sizing", "Assumed within the programme sizing"]
  - ["Within the BIBS sizing for all BRDs", "Within the programme sizing for all BRDs"]
  - ["the specifications of the BIBS reports", "the specifications of the reports of the system"]
  - ["The sign-in ID of every persona for the walkthrough in the BIBS DEV environment and the walkthrough script", "The persona accounts with which the Business Unit repeats the walkthroughs, and the walkthrough script"]
  # test steps: the systems BDOI connects are exercised with test accounts / test files of BDOI's systems provided
  # under the Integration scope (no simulator of the build is named)
  - ["a Bills Payment file of the channel simulator", "a Bills Payment test file of BDOI's systems (provided under the Integration scope)"]
  - ["(to the receiving system simulator in SIT and UAT)", "(in SIT and UAT, to the test account of BDOI's receiving system provided under the Integration scope)"]
  - ["the simulator inbox shows the file with its records", "the test account of BDOI's receiving system (Integration scope) shows the file with its records"]
  - ["Joiner and leaver from the Enterprise SSO simulator", "Joiner and leaver from the Enterprise SSO test accounts"]
  - ["Enterprise SSO simulator of the SIT and UAT environment", "Test accounts of BDOI's Enterprise SSO provided under the Integration scope for SIT and UAT"]
  - ["On Identity Synchronisation › Enterprise SSO Simulator add the account", "With the Enterprise SSO test accounts provided under the Integration scope, set up the account"]
  - ["correct the account in the simulator", "correct the account in the Enterprise SSO test accounts"]
  - ["the the system", "the system"]
  - ["renewal renewal", "renewal"]
  - ["The the system", "The system"]
# Regular expressions (applied after the phrases): the build's behaviour quoted beside a proposal.
regex:
  - [' ?\(The system today: [^()]*(?:\([^()]*\)[^()]*)*\)', '']
  # any other mention of a simulator of the build
  - ['(?i)the Enterprise SSO simulator', "the Enterprise SSO test accounts provided under the Integration scope"]
  - ['(?i)the (?:payment )?channel simulator', "the test files of BDOI's systems provided under the Integration scope"]
  - ['(?i)the receiving[- ]system simulator', "the test account of BDOI's receiving system provided under the Integration scope"]
  - ['(?i)\b(?:an?|the) simulator\b', "the test accounts and test files of BDOI's systems provided under the Integration scope"]
# Paragraphs and table rows of the added FRS text that only described the build or its test tools: removed.
drop:
  - "Channel simulator (SIT and UAT only)"
  - "Files received by the simulator with their records"
  - "Simulator inbox"
