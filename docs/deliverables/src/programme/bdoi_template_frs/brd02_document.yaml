observations:
  - topic: Official receipts and the Ease of Paying Taxes Act
    bdoi: "ORs for service fee, profit share, commissions, incentives and others (FRS.CSH.02.02, FRS.CSH.02.06.02)."
    brd: "CSHID.002, CSHID.006."
    proposal: "Under the Ease of Paying Taxes Act (Republic Act 11976) and its revenue regulations, the invoice is the primary document for the sale of services and the official receipt a supplementary document. Comptrollership (Tax) confirms whether BDOI's income receipts are issued as invoices and the wording of the OR form and footer; the series and forms follow the BIR registration of BDOI."
    impact: "Form, name and series of the OR (FRS.CSH.02.06.02); BIR registration."
    decide_by: "Comptrollership (Tax)"
  - topic: Value added tax and withholding tax printed on the OR
    bdoi: "OR body: Received From, Address, TIN, Form of Payment, Paid Amount, In payment of, Bank/Branch, Check No, Check Date, AC No, Date Issued (FRS.CSH.02.06.02)."
    brd: "CSHID.002: \"Commissions (e.g. VAT or W/Tax)\"."
    proposal: "Print the gross amount, the VAT and the withholding tax of each OR line (FRS.CSH.02.02.10), as the BIR invoicing rules require for a VAT-registered seller."
    impact: "OR template."
    decide_by: "Comptrollership (Tax); MBS"
  - topic: Insurance Profit Share and Contingent Profit Commission
    bdoi: "Official Receipt Type \"Contingent Profit Commission (CPC)\" (FRS.CSH.02.02.02)."
