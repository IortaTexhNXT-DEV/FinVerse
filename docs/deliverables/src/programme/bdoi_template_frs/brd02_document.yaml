# ------------------------------------------------------------------------------------- Appendix D: file layouts
annex_d:
  intro: >-
    The layouts of the payment files of FRS.CSH.05.01 and of the Commission Schedule of FRS.CSH.02.02, field by field,
    with BDOI's samples of Appendix A where BDOI gave them. Each layout is kept in Cashiering Setup and can be changed
    without a change to the system (FRS.CSH.05.01.06). "To be confirmed" marks a point BDOI confirms with the channel
    owner (requirements collection workbook, sheet Integration inputs).
  files:
    - id: D.1
      name: Bills Payment file (OBPCS, via MFT)
      convention: "BDOIYYYYMMDD.txt (example BDOI201506181.TXT); text file, values separated by a pipe (|); a header record (type 1) then detail records (type 2), without a line of column names (sample of Appendix A)."
      header: ["Pos.", "Field", "Format (sample)", "Mandatory", "Use in the system"]
      rows:
        - ["H1", "Record type", "1", "Yes", "Identifies the header record"]
        - ["H2", "Record count", "5 digits, zero-filled (00048)", "Yes", "Checked against the number of detail records (FRS.CSH.05.01.06)"]
        - ["H3", "Total amount", "12 characters, 2 decimals (000623704.80)", "Yes", "Checked against the total of the detail records"]
        - ["H4", "File date", "MM/DD/YYYY (04/03/2025)", "Yes", "Shown on the run"]
        - ["1", "Record type", "2", "Yes", "Identifies a detail record"]
        - ["2", "Incremental #", "5 digits (00001)", "Yes", "Row number in the run report"]
        - ["3", "Reference (invoice #)", "10 digits (0250193490)", "Yes", "Match key: account number or a legacy number (QPS, ISYS, Ebix, PN, Loan Application Number), FRS.CSH.05.01.08"]
        - ["4", "Assured / payor name", "Text", "Yes", "Payor of the AR"]
        - ["5", "Amount", "12 characters, 2 decimals (000015159.21)", "Yes", "Paid amount"]
        - ["6", "Late deposit", "Y / N", "No", "Kept with the payment"]
        - ["7", "(not named)", "2 on every row", "To be confirmed", "To be confirmed by BDOI"]
        - ["8", "Paying bank", "BDO, PNB, BNK0131", "To be confirmed", "Bank of the payment (to be confirmed)"]
        - ["9", "(not named)", "8 digits (00411335)", "To be confirmed", "Phone number, check or account number (to be confirmed)"]
        - ["10-11", "(empty)", "-", "-", "Not read"]
        - ["12", "Reference (repeated)", "Same value as position 3", "To be confirmed", "Second reference (to be confirmed)"]
        - ["13", "(empty)", "-", "-", "Not read"]
        - ["14", "Branch code", "5 digits (00300)", "No", "Paying branch"]
        - ["15", "Date of payment", "MM/DD/YYYY (04/03/2025)", "Yes", "Payment date of the AR"]
        - ["16", "Time of payment", "HH:MM:SS (00:00:00)", "No", "Kept with the payment"]
    - id: D.2
      name: Post-dated checks file (PMS, via MFT; or Excel upload)
      convention: "BDOIYYYYMMDDPMS.txt (example BDOI201506181PMS.TXT), values separated by a pipe (|); header and details of BDOI's FRS to be given (FRS.CSH.05.01.06). The BRD names an Excel file; the Excel template of the system is used until BDOI gives the PMS layout."
      header: ["No.", "Field", "Format (example)", "Mandatory", "Use in the system"]
      rows:
        - ["1", "Client code", "Text (CL-2026-000001)", "No", "Client of the check"]
        - ["2", "Payor", "Text", "Yes", "Payor of the AR"]
        - ["3", "Reference", "Account, invoice, ARN, policy or PN number", "Yes", "Match key at maturity"]
        - ["4", "Check number", "Text (0012345)", "Yes", "With the bank, unique in the warehouse"]
        - ["5", "Bank code", "Text (PNB)", "Yes", "Drawee bank"]
        - ["6", "Check branch", "Text (Makati)", "No", "Branch of the drawee bank"]
        - ["7", "Maturity date", "Date", "Yes", "Date of the daily maturity run"]
        - ["8", "Amount", "Number, 2 decimals", "Yes", "Check amount"]
        - ["9", "Market segment", "Text (CBG)", "No", "Segment for the reports"]
    - id: D.3
      name: CLPC file
      convention: "CLPC-MonDDYYYY.xlsx (example CLPC-Jun032025.xlsx); Excel sheet with a line of column names and a TOTAL row at the end (sample of Appendix A)."
      header: ["Col.", "Field", "Format (sample)", "Mandatory", "Use in the system"]
      rows:
        - ["1", "COUNT", "1 to n", "Yes", "Row number"]
        - ["2", "DATE CREDIT", "MM/DD/YYYY (04/04/2025)", "Yes", "Payment date"]
        - ["3", "AMOUNT", "Number without thousands separator (28695.75)", "Yes", "Paid amount"]
        - ["4", "AR NUMBER", "Empty on upload", "No", "Filled by the system"]
        - ["5", "INVOICE", "Text", "No", "Match key (account or invoice)"]
        - ["6", "ASSURED", "Text", "Yes", "Payor of the AR"]
        - ["7", "PN NUMBER", "Text", "No", "Match key when the invoice is blank"]
        - ["8", "CORP.DEPT", "Text (SMALLBUSINESSLOAN)", "No", "Kept with the payment"]
        - ["9", "RISK CODE", "Text (FIP)", "No", "Kept with the payment"]
        - ["10", "REMARKS", "Text", "No", "Kept with the payment"]
        - ["-", "TOTAL row", "Label TOTAL with the total amount", "Yes", "Control total, not a payment (FRS.CSH.05.01.06)"]
    - id: D.4
      name: Trade file (TFS, from CIB)
      convention: "UploadTrade_MM.DD.YYYY.txt (example UploadTrade_01.01.2025.TXT); text file with a line of column names; the sample of Appendix A is aligned with spaces or tabs although the FRS says pipe (|): separator to be confirmed."
      header: ["Col.", "Field", "Format (sample)", "Mandatory", "Use in the system"]
      rows:
        - ["1", "Transaction Date", "MM/DD/YYYY (04/03/2025)", "Yes", "Payment date"]
        - ["2", "Branch Name", "Text (RECON)", "No", "Kept with the payment"]
        - ["3", "Transaction Description", "Risk code / 10-digit reference / code (FIP/0250088368/FSA7041259859IVF)", "Yes", "Each part is tried as a match key"]
        - ["4", "Debit", "Number (0)", "No", "Kept with the payment"]
        - ["5", "Credit", "Number (31080.04)", "Yes", "Paid amount; a row without credit is failed"]
        - ["6", "Running Balance", "Number", "No", "Kept with the payment"]
        - ["7", "Check No.", "Text (0)", "No", "Kept with the payment"]
    - id: D.5
      name: Direct Credit file
      convention: "OTCYYYYMMDD-<branch>.txt (example OTC202506101- AUTOCREDIT.TXT); text (pipe) or Excel. BDOI's FRS uses the file to identify payments already received (FRS.CSH.05.01.09): the columns below are those of the BRD."
      header: ["Col.", "Field", "Format", "Mandatory", "Use in the system"]
      rows:
        - ["1", "Transaction date", "Date", "Yes", "Payment date"]
        - ["2", "BP filename", "Text", "Yes", "Priority 1 match with the payment record (FRS.CSH.05.01.09)"]
        - ["3", "Transaction no", "Text", "Yes", "Priority 1 match with the payment record"]
        - ["4", "Paid amount", "Number, 2 decimals", "Yes", "Must equal the amount of the payment record"]
        - ["5", "Payment type", "Text", "No", "Kept with the payment"]
        - ["6", "Payor", "Text", "Yes", "Payor"]
        - ["7", "Account ref no", "Text", "No", "Priority 2 and 3 match keys"]
        - ["8", "Assured", "Text", "No", "Kept with the payment"]
        - ["9", "Ebix reference no.", "Text", "No", "Match key"]
        - ["10", "Logged by", "Text", "No", "Kept with the payment"]
        - ["11", "Requestor", "Text", "No", "Kept with the payment"]
    - id: D.6
      name: Commission Schedule (FRS.CSH.02.02.03)
      convention: "Pipe-delimited .csv (FRS.CSH.02.02.04); BDOI's list of fields is blank (FRS.CSH.02.02.07): the fields below are proposed (the Commission Payment Details template of the system)."
      header: ["Col.", "Field", "Format (example)", "Mandatory", "Use in the system"]
      rows:
        - ["1", "Insurer code", "Text (INS-MGIC)", "Yes", "Insurer paying the commission"]
        - ["2", "Payee name", "Text", "Yes", "Received From of the OR"]
        - ["3", "Certificate ref", "Text (2307-0001)", "No", "BIR 2307 certificate of the insurer"]
        - ["4", "Payment ref", "Text (check or credit reference)", "Yes", "Check number or credit reference"]
        - ["5", "Invoice no", "Text", "No", "Match key (reference number)"]
        - ["6", "Basic commission", "Number, 2 decimals", "Yes", "Commission paid"]
        - ["7", "VAT", "Number, 2 decimals", "Yes", "VAT on the commission"]
        - ["8", "Withholding tax", "Number, 2 decimals", "Yes", "Tax withheld by the insurer"]
        - ["9", "Payment date", "Date", "Yes", "Date of the payment"]

# ------------------------------------------------------------------------------------- Appendix H: rules and roles
annex_h:
  intro: >-
    The roles of Cashiering, the permissions of each action, the configurable parameters and lists, the scheduled runs
    and the statuses of the records. The roles and permissions are proposed until BDOI confirms the access matrix in
    the User Access Maintenance FRS ("Based on UAM"); the values are changed in the system by the owner named, with
    an audit record, without a change to the system.
  personas:
    - ["Cashier, Head Office (11 users in the BRD)", "Creates ARs and ORs, uploads payment files, keeps the post-dated check warehouse, creates cancellation and reinstatement records, assigns dispositions, prints", "CSHID.001-008, 010-025"]
    - ["Cashier, branches (5 users)", "Creates ARs of the branch, prints, creates cancellation and reinstatement records", "CSHID.001, 006, 019"]
