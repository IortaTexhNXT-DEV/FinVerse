    impact: "List of OR types."
    decide_by: "Cashiering Process Owner; Comptrollership"
  - topic: Owner of MKTID.013 and DBMID.001
    bdoi: "Mapping rows MKTID.013 and DBMID.001: \"Com rec\" (the Commission Receivable FRS)."
