    brd: "-"
    proposal: "The AR / OR number status stays Issued; the Reinstatement Record Status is For Posting."
    impact: "Column of the list."
    decide_by: "System Analyst (BDO ITG)"
  - topic: Record number of the returned reinstatement list
    bdoi: "FRS.CSH.01.03.04 Returned - Reinstatement: \"Cancellation Record Number\"."
    brd: "-"
    proposal: "Reinstatement Record Number."
    impact: "Column of the list."
    decide_by: "System Analyst (BDO ITG)"
  - topic: Drafting notes left in the text
    bdoi: "FRS.CSH.03.01.08.08: \"Copy from reinstatement\", \"no UPP\"; FRS.CSH.01.03.02: \"Refund to Client (?)\", \"Refund to Insurer (?)\"; FRS.CSH.02.06.01: \"AR Template set up ... the following fields:\" with no list (the list is in FRS.CSH.02.06.03); FRS.CSH.02.04.12 \"See template:\" and FRS.CSH.02.04.07 \"Convention:\" blank."
    brd: "-"
    proposal: "Remove the notes and question marks in the next BDOI revision; the certificate convention is proposed in FRS.CSH.02.04.07 and the template is Appendix A."
    impact: "Clarity of the signed baseline."
