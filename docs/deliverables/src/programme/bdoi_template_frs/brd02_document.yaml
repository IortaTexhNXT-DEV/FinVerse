revision_row: ["09 Oct 2026", "3.2", "Draft for BDOI review: full coverage of the Cashiering scope of the Operations BRD (v1.01 with the Cashiering annex of May 2026; version of 8-Oct-2026), functional requirements elaborated with numbered acceptance criteria, new items FRS.CSH.05.02 to FRS.CSH.10.04, Appendices C to V added, observations and points for decision in Appendix R; Business Unit review edition: summary for the Business Unit, end-to-end flows, workflow and approvals, e-mail texts, document prints and formats, reports and schedules, integrations, non-functional requirements, data set-up, open questions not answered in the BDOI FRS, change control, review checklist", "iorta TechNXT Project Team (drafting); for review by Abegail Panghulan"]

