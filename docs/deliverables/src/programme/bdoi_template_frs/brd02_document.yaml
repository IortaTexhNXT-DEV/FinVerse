removed:
  - id: CSHID.009
    after: CSHID.008
    text: "Facility to accept check with “for check pick up” from Collection."
    fr: "Removed from the BRD by the Cashiering annex of May 2026 (annex p.4-6): check pick-up is no longer part of BDOI's target process; no FR item."
  - id: CSHID.026
    after: CSHID.025
    text: "Facility to receive tagged BIR 2307 data from Marketing Collection, process payments (cash or certificate), and remit accordingly. Issue ARs, reverse premiums, and forward transactions to Disbursement."
    fr: "Deleted in BRD v1.01 (e-mail record p.67-69, p.186-188): the BIR 2307 processing is done by Marketing Collection (MKTID.013); no FR item."
  - id: CSHID.027
    after: CSHID.026
    text: "Facility to provide capability to Operations to process BIR 2307 reversals using reference numbers generated by Marketing. This is to validate the data, generate the transaction report, and route it directly to Disbursement without going through the Remittance function."
    fr: "Deleted in BRD v1.01 (e-mail record p.67-69, p.186-188); no FR item."

