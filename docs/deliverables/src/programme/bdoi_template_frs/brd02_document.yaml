# ------------------------------------------------------------------------------------- Appendix I: accounting entries
annex_i:
  intro: >-
    The default entry of each event of Cashiering, filling the "Debit: Credit:" lines of BDOI's FRS.CSH.02.05.15,
    FRS.CSH.03.01.09 and FRS.CSH.04.01.10. The accounts are named by their purpose; Comptrollership gives the account
    of each line in the accounting rules of the system (maker-checker), and no account is fixed in the system (open
    question S.3, OQ07). Amounts in USD are converted to pesos at the rate of BDOI's FRS with two decimals.
  header: ["Event (BDOI's line)", "GL Reference / Description", "Debit", "Credit", "BDOI FR item"]
  rows:
    - ["AR issued (premium payment received)", "AR Number / AR; Account Numbers <xxx>", "Cash in bank (the Post to Bank Account of the receipt)", "Unapplied collections – client", "FRS.CSH.02.05.15"]
    - ["Applied to invoice AR (payments)", "AR Number / AR; Account Numbers <xxx>", "Unapplied collections – client", "Premium receivable by component (DST, Premium Tax (VAT), LGT, Other Charges, Basic Premium); with the commission realised on collection: Commission income and Output VAT against Unrealised commission and Deferred output VAT", "FRS.CSH.02.05.15"]
    - ["Excess AR", "AR Number / AR; Account Numbers <xxx>", "-", "The excess stays in Unapplied collections – client as an Excess payment record (no further entry)", "FRS.CSH.02.05.15"]
    - ["Minimal Balance (Outstanding PR)", "AR Number / Minimal balance reversal", "Minimal balance write-off", "Premium receivable of the component", "FRS.CSH.02.05.15"]
    - ["Minimal Balance (Excess)", "AR Number / Minimal balance reversal", "Unapplied collections – client", "Overages (minimal excess)", "FRS.CSH.02.05.15"]
    - ["OR Issuance", "OR Number / OR; Account Numbers <xxx>", "Cash in bank; Creditable withholding tax receivable (tax withheld by the payor)", "Income of the Official Receipt Type (service fee, profit share, commission, incentive, others); Output VAT. Commission ORs: Commission receivable; Deferred output VAT to Output VAT", "FRS.CSH.02.05.15"]
    - ["AR Insurance (non-premium payment of an insurer)", "AR Number / AR Insurance", "Cash in bank", "AR Insurer – insurer", "FRS.CSH.02.01.15"]
    - ["Cancellation of Applied to invoice AR (not yet remitted)", "<Cancellation Record Number> / Cancellation of AR due to <reason> <AR Number>", "Premium receivable by component (application reversed); Unapplied collections – client", "Unapplied collections – client; Cash in bank (receipt reversed)", "FRS.CSH.03.01.09"]
    - ["Cancellation of Applied to invoice AR (remitted)", "<Cancellation Record Number> / Cancellation of AR due to <reason> <AR Number>", "AR Insurer Refund – insurer", "Cash in bank (receipt reversed)", "FRS.CSH.03.01.09"]
    - ["Cancellation of OR Issuance", "<Cancellation Record Number> / Cancellation of OR due to <reason> <OR Number>", "Income of the Official Receipt Type; Output VAT (commission ORs: Commission receivable restored)", "Cash in bank; Creditable withholding tax receivable", "FRS.CSH.03.01.09"]
    - ["Cancellation of Minimal Balance", "<Cancellation Record Number>", "Premium receivable of the component (or Overages)", "Minimal balance write-off (or Unapplied collections)", "FRS.CSH.03.01.09"]
    - ["Reinstatement AR (not yet remitted)", "<Reinstatement Record Number> / Reinstatement of AR due to <reason> <AR Number>", "Premium receivable by component", "Unapplied collections – client (Unapplied payment record)", "FRS.CSH.04.01.10"]
    - ["Reinstatement AR (remitted)", "<Reinstatement Record Number> / Reinstatement of AR due to <reason> <AR Number>", "Premium receivable by component; AR Insurer Refund – insurer", "Unapplied collections – client; Due to insurer (remittance reversed, with the commission receivable and the withholding tax of the remittance)", "FRS.CSH.04.01.10"]
    - ["Reinstatement OR", "<Reinstatement Record Number> / Reinstatement of OR due to <reason> <OR Number>", "Commission receivable (application reversed)", "AP Unapplied Commission – insurer", "FRS.CSH.04.01.10"]
    - ["Reinstatement of Minimal Balance (compound entry)", "<Reinstatement Record Number>", "Premium receivable of the component", "Minimal balance write-off", "FRS.CSH.04.01.10"]
    - ["Refund of an Unapplied payment record", "Unapplied Payment No.", "Unapplied collections – client", "Refund payable – client (paid by Disbursement)", "FRS.CSH.06.02.01"]
    - ["Reclass / transfer of an Unapplied payment record", "Unapplied Payment No.", "Unapplied collections – old client or unit", "Unapplied collections – new client or unit", "FRS.CSH.06.02.01"]

# ------------------------------------------------------------------------------------- Appendix R: observations
# Observations that are not conflicts of the comparison workbook. section R.2: slips of BDOI's text (proposed
# corrections, BDOI's text not changed); R.4: other observations and proposals of this version.
slips:
  - topic: Excess amount formula
    bdoi: "FRS.CSH.02.01.03, FRS.CSH.02.05.13 and FRS.CSH.05.01.11: \"Excess Amount = Paid Amount – Outstanding Balance – PR 2307\" under the condition \"Paid Amount > (Outstanding Balance – PR 2307)\"."
    brd: "CSHID.020: for accounts with 2% CWT only 98% is applied."
    proposal: "The excess is Paid Amount – (Outstanding Balance – PR 2307), that is Paid Amount – Outstanding Balance + PR 2307. Example: outstanding 10,200.00, PR 2307 200.00, paid 10,100.00: applied 10,000.00, excess 100.00 (the formula as written gives -300.00)."
    impact: "Amount of every Excess payment record of a BIR 2307 account."
    decide_by: "System Analyst (BDO ITG); Comptrollership"
  - topic: Duplicate and missing item numbers
    bdoi: "FRS.CSH.03.01.05 and FRS.CSH.04.01.03 are each used twice; FRS.CSH.02.02.05 and FRS.CSH.02.02.09.06 to .09 are not used; FRS.CSH.04.01.04.01 follows FRS.CSH.04.01.03; numbers with a space (\"FRS.CSH.01.03 .01\", \"FRS.CSH.02.05.08 .01\")."
    brd: "-"
    proposal: "Renumber in the next BDOI revision; this version refers to the second FRS.CSH.03.01.05 as \"FRS.CSH.03.01.05 (Reason for Cancellation)\" and keeps BDOI's numbers otherwise."
    impact: "References from the test cases and the traceability."
    decide_by: "System Analyst (BDO ITG)"
  - topic: Tabs quoted in the mapping
    bdoi: "Mapping row CSHID.025 quotes three tabs (Unapplied, Monitoring, For Approval); FRS.CSH.06.02.02 has four (For Reversal)."
    brd: "CSHID.025: Unapplied, Monitoring, For Approval, For Reversal."
    proposal: "Read the mapping row with the four tabs of FRS.CSH.06.02.02."
    impact: "None on the system."
    decide_by: "System Analyst (BDO ITG)"
  - topic: Rule of the Cancelled Acknowledgement Receipts report
    bdoi: "FRS.CSH.09.02.05: \"Rules: Extract all cancelled OR within the covered period\"."
    brd: "Annex II #6 Cancelled Acknowledgment Receipts."
    proposal: "Extract all cancelled AR within the covered period (AR status = Cancelled, as the next line says)."
    impact: "Content of the report."
    decide_by: "System Analyst (BDO ITG)"
  - topic: Cross-reference to batch printing
    bdoi: "FRS.CSH.05.01.10: \"Allow the user to print the AR (see FRS.CSH.02.03)\"."
    brd: "-"
    proposal: "The reference is FRS.CSH.02.04 (Batch Printing); FRS.CSH.02.03 is the number series."
    impact: "None on the system."
    decide_by: "System Analyst (BDO ITG)"
  - topic: Status of the record in a depleted series
    bdoi: "FRS.CSH.02.05.09.02: \"Status will remain unchanged (AR/OR Creation Record = Created)\", while the records posted are For Posting."
    brd: "CSHID.015."
    proposal: "The record keeps its status For Posting and the poster sees the message; read \"Created\" as \"unchanged\"."
    impact: "Status after a failed posting."
    decide_by: "System Analyst (BDO ITG)"
