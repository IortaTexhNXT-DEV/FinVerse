integrations:
  - "Trade (TFS) and Direct Credit files to BIBS by upload; CLPC file by upload"
  - "BIBS Collections module to Cashiering: disposition requests on unapplied payments, commission payment details"
  - "Cashiering to BIBS Disbursement module: refund requests; Disbursement to Cashiering: payment request status and the approved insurer settlements that trigger the automatic OR"
