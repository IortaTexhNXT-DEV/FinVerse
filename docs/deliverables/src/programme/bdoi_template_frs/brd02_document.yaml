# ------------------------------------------------------------------------------------- Appendix V: glossary
glossary:
  - ["AC No.", "Acknowledgement certificate number printed on an AR or OR"]
  - ["Approver/Poster", "The user who posts or returns a creation, cancellation or reinstatement record (Cashiering Team Leader or Team Head, proposed)"]
  - ["AR", "Acknowledgement Receipt, issued by Cashiering for premium collected on behalf of an insurer and for non-premium payments"]
  - ["AR Insurance", "Non-premium payment of an insurer received by Cashiering (CSHID.021)"]
  - ["AR Insurer Refund", "Receivable from an insurer for premium already remitted and later reversed"]
  - ["AP Unapplied Commission", "Commission payment reversed by the reinstatement of an OR, kept for Commission Receivable"]
  - ["ARN", "Account Reference Number of a New Business account"]
  - ["ATP", "BIR Authority to Print of a receipt series"]
  - ["BIR", "Bureau of Internal Revenue"]
  - ["BIR 2307", "Certificate of Creditable Tax Withheld at Source given by a client who withholds 2% on the premium"]
  - ["CLPC", "Consumer Lending Processing Center"]
  - ["CPC", "Contingent Profit Commission"]
  - ["CRU", "Commission receivable of BDOI still unpaid on an account"]
  - ["CWT", "Creditable withholding tax"]
  - ["Disposition", "The decision on an Unapplied payment record (apply, refund, reclass, transfer, others)"]
  - ["DST", "Documentary Stamp Tax"]
  - ["DTIP", "Due To Insurer Provider: premium payable to the insurer"]
  - ["EOPT", "Ease of Paying Taxes Act (Republic Act 11976)"]
  - ["EWT", "Expanded withholding tax"]
  - ["Excess payment", "Payment above the outstanding balance of the account, kept as an Unapplied payment record"]
