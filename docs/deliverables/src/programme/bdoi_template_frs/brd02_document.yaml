  drafting: "iorta TechNXT Project Team (drafting support)"

introduction:
  preparation: >-
    Version 3.2 of this document was drafted with the iorta TechNXT Project Team, from the inputs of the business unit
    and BDO ITG, for review by the System Analyst. BDOI's text of version 3.1 is kept as issued; the additions are
    written in the same style and listed in the change summary of the review copy; the points where a decision is
    needed are in Appendix R.
  overview: >-
    The Operations BRD of 8-Oct-2026 (BRD v1.01 of 15-Apr-2026 with the Cashiering annex of May 2026) removes check
    pick-up from Collection (CSHID.009) and the Cashiering processing and reversal of BIR 2307 (CSHID.026, CSHID.027),
    and clears minimal balances when the payment is processed (CSHID.016). This FRS covers the Cashiering
    requirements (BRQID.001 to BRQID.007, CSHID.001 to CSHID.025) and states where MKTID.013 and DBMID.001 are
    specified; the rest of Operations (Remittance, Adjustment / Cancellation, Production Reconciliation, Commission
    Receivables and the Marketing activities) stays in the BIBS FRS BRD-2 Operations v2.1.
  references_title: "References added in version 3.2:"
  references:
    - "- Operations BRD v1.01 (15-Apr-2026, signed 23 to 28-Apr-2026): pages 71-185 of the file Operations_WS Addendum; the Cashiering annex of May 2026 (Operations Central - Addendum 1, pages 1-8); the e-mail record of the BIR 2307 changes (pages 67-70 and 186-189)."
    - "- BIBS FRS BRD-2 Operations v2.1 (8-Oct-2026) and its test plan: the reference requirements FR-OP-nnn and the test conditions TC-OP-nnn.n quoted in Appendix Q."
    - "- Comparison of BDOI's Operations Cashiering FRS with the BIBS FRS BRD-2 Operations, v1.0 (9-Oct-2026): the conflicts and slips of Appendix R."
    - "- Review workbooks of BRD-02 Operations Cashiering, v1.0 (9-Oct-2026): Business Unit Requirements Collection; BRD vs Out-of-the-Box vs Best Practice; Change Request Register; Test Cases and Traceability; Business Unit Walkthrough Users."
    - "- BIBS Non-Functional Requirements Register v1.0; BIBS Master Data and Configuration Upload Templates v1.2; BDOI Requirements and Inputs by BRD v1.2."

