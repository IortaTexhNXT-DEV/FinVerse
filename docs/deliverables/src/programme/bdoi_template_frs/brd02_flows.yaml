          fpr [label="For Printing\n(system-generated)"]; iss [label="Issued"]; canc [label="Cancelled", fillcolor="#D9D9D9"];
          n0 -> iss [label="Manual AR / OR\nposted"]; n0 -> fpr [label="Upload, PDC,\nautomatic OR"];
          fpr -> iss [label="Printed"]; iss -> iss [label="Re-print;\nreinstatement"];
