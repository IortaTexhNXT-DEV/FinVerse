      - {id: y2, lane: sys, row: 3, kind: system, text: "Lines per account: commission, VAT, withholding tax"}
      - {id: y3, lane: sys, row: 4, kind: system, text: "GL; OR in the print queue (For Printing)"}
      - {id: c1, lane: cas, row: 5, text: "Print the OR (Batch Print)"}
      - {id: e1, lane: cas, row: 6, kind: end, text: OR issued}
    edges:
      - [s0, d1]
      - [d1, y1, "", "", right]
      - [y1, y2]
      - [y2, y3]
      - [y3, c1, "", "", right]
      - [c1, e1]

