          app [label="Applied Payment", fillcolor="#D9D9D9"]; exc [label="Excess Payment"]; pre [label="Matched on\nPre-booked"];
          unb [label="Unbooked /\nUnmatched"]; fail [label="Failed / Invalid /\nDuplicate", fillcolor="#D9D9D9"];
