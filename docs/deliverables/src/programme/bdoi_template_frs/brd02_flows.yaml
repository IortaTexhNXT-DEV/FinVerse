    steps:
      - {id: s0, lane: m, row: 0, kind: start, text: Start}
      - {id: m1, lane: m, row: 1, text: "Maintain series: branch, kind, prefix, start, end, year, ATP, warning level"}
      - {id: k1, lane: k, row: 2, kind: decision, text: "Authorise?"}
      - {id: m2, lane: m, row: 3, text: "Correct the series"}
      - {id: y1, lane: sys, row: 3, kind: system, text: "Series usable"}
      - {id: y2, lane: sys, row: 4, kind: system, text: "Each posting takes the next number"}
      - {id: y3, lane: sys, row: 5, kind: decision, text: "At warning level?"}
      - {id: k2, lane: k, row: 6, text: "Alert: numbers left"}
      - {id: y4, lane: sys, row: 7, kind: decision, text: "Depleted?"}
      - {id: n1, lane: k, row: 8, kind: note, text: "Message: series depleted. Contact your Administrator."}
      - {id: e1, lane: sys, row: 9, kind: end, text: Issued}
    edges:
      - [s0, m1]
      - [m1, k1, "", "", right]
      - [k1, m2, "No", "", left]
      - [k1, y1, "Yes", "", right]
      - [y1, y2]
      - [y2, y3]
      - [y3, k2, "Yes", "", left]
      - [y3, y4, "No"]
      - [y4, n1, "Yes", "", left]
      - [y4, e1, "No"]

  - id: brd02_fig_states_records
    kind: states
    where: C
    caption: "Status life-cycle of the AR / OR creation, cancellation and reinstatement records"
    read: "Each box is a status of BDOI's FRS; each arrow is an action with the persona who takes it. Grey boxes are final. The cancellation and reinstatement records follow the same statuses and end in AR/OR Cancelled or AR/OR Reinstated."
    brd: "CSHID.001 to CSHID.005; FRS.CSH.02.01, 02.05, 03.01, 04.01"
    dot: |
      digraph R {
        graph [rankdir=LR, nodesep=0.3, ranksep=0.45, fontname="Arial", pad=0.15, size="9.4,6"];
        node [fontname="Arial", fontsize=10, shape=box, style="rounded,filled", fillcolor="#EAF1FB", color="#1F3864", margin="0.12,0.06"];
        edge [fontname="Arial", fontsize=8.5, color="#404040", arrowsize=0.7];
        new [label="(new)", shape=circle, fillcolor="#C6E0B4", width=0.5, fixedsize=true];
        cre [label="Created"]; fp [label="For Posting"]; ret [label="Returned"];
        iss [label="AR/OR Issued\n(cancellation: AR/OR Cancelled;\nreinstatement: AR/OR Reinstated)", fillcolor="#D9D9D9"];
        can [label="Record Cancelled", fillcolor="#D9D9D9"];
        new -> cre [label="Save\n(Cashier)"];
        cre -> cre [label="Edit"];
        cre -> fp [label="Submit for\nPosting"];
        cre -> can [label="Cancel\n(creator)"];
        fp -> iss [label="Post\n(Approver / Poster,\nnot the creator)"];
        fp -> ret [label="Return\n(reason)"];
        ret -> fp [label="Edit and\nre-submit"];
        fp -> fp [label="Series depleted:\nunchanged"];
      }

  - id: brd02_fig_states_receipts
    kind: states
    where: C
    caption: "Status life-cycle of the AR / OR number and of a payment record of a file"
    read: "Top: the status of an AR or OR number. Bottom: the record status of a payment of a file after matching (BDOI FRS.CSH.05.01.08 to .10)."
