    kind: swimlane
    where: C
    caption: "AR and OR number series: maintenance, authorisation, numbering and depletion"
    read: "Read from top to bottom. A series is usable only when another authorised user authorises it."
    brd: "CSHID.006, 015; FRS.CSH.02.03, FRS.CSH.02.05.08, FRS.CSH.02.05.09"
