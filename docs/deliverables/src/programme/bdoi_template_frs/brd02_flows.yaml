  - id: brd02_fig_autoor
    kind: swimlane
    where: C
    caption: "Automatic generation of the OR of an insurer settlement"
    read: "Read from top to bottom. The OR is generated once Disbursement approves the settlement (BDOI FRS.CSH.07.01.01; Appendix R, C12)."
