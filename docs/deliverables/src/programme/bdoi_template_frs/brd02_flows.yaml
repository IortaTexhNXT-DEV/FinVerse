# Figures of the Operations Cashiering FRS in BDOI's template, version 3.2, drawn by brd11_figures.render (Graphviz, PNG
# at 200 dpi) and placed by build_brd02_bdoi_frs.py.
# swimlane: lanes (one per persona, system lanes marked system: true) and steps placed in rows (row 0 at the top);
#   kind task (default), decision, start, end, note, system; edges [from, to, label, style, port].
# states / context / table: Graphviz dot source; a table takes @HEADER@ and @ROWS@ from header and rows.
# where: summary (section 1.4), C (Appendix C), E (Appendix E), J (Appendix J), N (Appendix N).
figures:
  # ------------------------------------------------------------------------------------------ 1.4 Summary
  - id: brd02_fig_e2e
    kind: swimlane
    where: summary
    caption: "Operations Cashiering from end to end: from the payment received to the receipt, the application, the unapplied payments and the reports"
    read: "Read from top to bottom. Each column is a persona; the green column is what the system does by itself. The numbers in brackets are the FR items of section 3."
    brd: "BRQID.001 to BRQID.007; CSHID.001 to CSHID.025"
    lanes:
      - {id: pay, label: Client / payor / bank channel}
      - {id: cas, label: Cashier}
      - {id: tl, label: "Approver / Poster"}
      - {id: sys, label: System, system: true}
      - {id: mkt, label: Marketing / Comm. Receivable}
      - {id: oth, label: Disbursement / Remittance}
    steps:
      - {id: s0, lane: pay, row: 0, kind: start, text: Payment}
      - {id: p1, lane: pay, row: 1, text: "Files via MFT or for upload (05.01)"}
      - {id: y0, lane: sys, row: 1, kind: system, text: "Validate, match, AR for printing (05.01)"}
      - {id: c1, lane: cas, row: 2, text: "Create AR / OR record, submit for posting (02.01, 02.02)"}
      - {id: t1, lane: tl, row: 3, text: "Post or return (02.05)"}
      - {id: y1, lane: sys, row: 4, kind: system, text: "AR / OR number; apply by hierarchy; minimal balance; GL (02.05)"}
      - {id: y2, lane: sys, row: 5, kind: decision, text: "Fully applied?"}
      - {id: c2, lane: cas, row: 5, text: "Batch print AR / OR (02.04)"}
      - {id: m1, lane: mkt, row: 6, text: "Excess, pre-booked, unmatched: disposition (06.01, 06.02)"}
      - {id: t2, lane: tl, row: 7, text: "Approve disposition"}
      - {id: o1, lane: oth, row: 7, text: "Refund paid; remittance; automatic OR (07.01)"}
      - {id: c3, lane: cas, row: 8, text: "Cancellation or reinstatement record (03.01, 04.01)"}
      - {id: t3, lane: tl, row: 9, text: "Post or return"}
      - {id: y3, lane: sys, row: 10, kind: system, text: "Inquiry, reports, audit trail (08, 09)"}
      - {id: e1, lane: sys, row: 11, kind: end, text: Closed}
    edges:
      - [s0, p1]
      - [s0, c1]
      - [p1, y0, "", "", right]
      - [c1, t1]
      - [t1, y1]
      - [y0, y1]
      - [y1, y2]
      - [y2, c2, "Yes", "", left]
      - [y2, m1, "No", "", right]
      - [m1, t2, "", "", left]
      - [t2, o1, "Refund", "", right]
      - [c2, c3, "", "dashed"]
      - [c3, t3]
      - [t3, y3]
      - [y3, e1]

  # ------------------------------------------------------------------------------------------ Appendix C
  - id: brd02_fig_ar
    kind: swimlane
    where: C
    caption: "Creation and posting of an Acknowledgement Receipt (premium and non-premium payments)"
    read: "Read from top to bottom. The AR number is generated only when the Approver/Poster posts the record (BDOI FRS.CSH.02.05.08); the creator never posts his or her own record."
    brd: "CSHID.001, 006, 014, 015, 016, 020, 021, 022; FRS.CSH.02.01, FRS.CSH.02.05"
    lanes:
      - {id: cas, label: Cashier}
      - {id: sys, label: System, system: true}
      - {id: tl, label: "Approver / Poster"}
    steps:
      - {id: s0, lane: cas, row: 0, kind: start, text: Payment}
      - {id: c1, lane: cas, row: 1, text: "Create AR: type, entry type, accounts, payment, bank account"}
      - {id: y1, lane: sys, row: 1, kind: system, text: "Account table: outstanding, PR 2307, excess preview"}
      - {id: y2, lane: sys, row: 2, kind: decision, text: "Validations pass?"}
      - {id: y3, lane: sys, row: 3, kind: system, text: "Status Created; record no. CR-AR-n"}
      - {id: c3, lane: cas, row: 4, text: "Submit for Posting"}
      - {id: y4, lane: sys, row: 5, kind: system, text: "For Posting; notice to the Approver / Poster"}
      - {id: t1, lane: tl, row: 6, kind: decision, text: "Post?"}
      - {id: c4, lane: cas, row: 7, text: "Returned: edit and re-submit"}
      - {id: y5, lane: sys, row: 7, kind: decision, text: "Series depleted?"}
      - {id: n1, lane: tl, row: 8, kind: note, text: "Message; status unchanged"}
      - {id: y6, lane: sys, row: 9, kind: system, text: "AR number of the branch; Issued; apply by hierarchy; minimal balance; excess; GL"}
      - {id: c5, lane: cas, row: 10, text: "Print the AR (Batch Print)"}
      - {id: e1, lane: cas, row: 11, kind: end, text: AR issued}
    edges:
      - [s0, c1]
      - [c1, y1, "", "", right]
      - [y1, y2]
      - [y2, c1, "No: correct", "dashed", left]
      - [y2, y3, "Yes"]
      - [y3, c3, "", "", left]
      - [c3, y4, "", "", right]
      - [y4, t1, "", "", right]
      - [t1, c4, "Return", "", left]
      - [t1, y5, "Post"]
      - [y5, n1, "Yes", "", right]
      - [y5, y6, "No"]
      - [y6, c5, "", "", left]
      - [c5, e1]

  - id: brd02_fig_or
    kind: swimlane
    where: C
    caption: "Creation and posting of an Official Receipt, with the Commission Schedule upload and other income"
    read: "Read from top to bottom. ORs are issued by Head Office only. A Commission Schedule with a failed or unmatched line is not processed (BDOI FRS.CSH.02.02.06, 02.02.09.01; Appendix R, C10)."
    brd: "CSHID.002, 006, 007, 014; FRS.CSH.02.02, FRS.CSH.02.05.14"
    lanes:
      - {id: cas, label: Head Office Cashier}
      - {id: sys, label: System, system: true}
      - {id: tl, label: "Approver / Poster"}
    steps:
      - {id: s0, lane: cas, row: 0, kind: start, text: Income}
      - {id: c1, lane: cas, row: 1, kind: decision, text: "Commission Schedule?"}
      - {id: c2, lane: cas, row: 2, text: "Upload the Commission Schedule files"}
      - {id: y1, lane: sys, row: 2, kind: system, text: "File checks: .csv pipe, 50 MB, fields, duplicate"}
      - {id: y2, lane: sys, row: 3, kind: decision, text: "All lines valid and matched?"}
      - {id: c3, lane: cas, row: 4, text: "Validation report, unmatched list: correct the file"}
      - {id: c4, lane: cas, row: 5, text: "Create OR: type, insurer, payment, bank account; SOA or fee invoice"}
      - {id: y3, lane: sys, row: 5, kind: system, text: "Created; Submit for Posting"}
      - {id: t1, lane: tl, row: 6, kind: decision, text: "Post?"}
      - {id: y4, lane: sys, row: 7, kind: system, text: "OR number of Head Office; apply; GL; print queue"}
      - {id: e1, lane: sys, row: 8, kind: end, text: OR issued}
    edges:
      - [s0, c1]
      - [c1, c2, "Yes"]
      - [c1, c4, "No", "", left]
      - [c2, y1, "", "", right]
      - [y1, y2]
      - [y2, c3, "No", "", left]
      - [y2, y4, "Yes", "", right]
      - [c4, y3, "", "", right]
      - [y3, t1, "", "", right]
      - [t1, y4, "Post"]
      - [y4, e1]

  - id: brd02_fig_auto
    kind: swimlane
    where: C
    caption: "Automatic payment processing of the Bills Payment, CLPC, Trade, Direct Credit and post-dated check files"
    read: "Read from top to bottom. Every row is processed on its own; a failed row never stops the others (BRQID.006). The right-hand column is the Unapplied list."
    brd: "BRQID.005, 006; CSHID.008, 020, 022; FRS.CSH.05.01"
    lanes:
      - {id: src, label: "OBPCS, PMS, bank channels"}
      - {id: cas, label: Cashier}
      - {id: sys, label: System (matching and application), system: true}
      - {id: unp, label: Unapplied list, system: true}
    steps:
      - {id: s0, lane: src, row: 0, kind: start, text: Files}
      - {id: a1, lane: src, row: 1, text: "Bills Payment and PDC files via MFT"}
      - {id: c1, lane: cas, row: 2, text: "Upload: several files per type"}
      - {id: y1, lane: sys, row: 2, kind: system, text: "File checks: name, format, size, template, totals, duplicate"}
      - {id: y2, lane: sys, row: 3, kind: decision, text: "File valid?"}
      - {id: c2, lane: cas, row: 3, text: "Refused: validation report; alert"}
      - {id: y3, lane: sys, row: 4, kind: decision, text: "Priority 1: booked account?"}
      - {id: y4, lane: sys, row: 5, kind: system, text: "Apply by hierarchy; BIR 2307; minimal balance; excess to the Unapplied list"}
      - {id: u1, lane: unp, row: 5, kind: decision, text: "Priority 2: pre-booked?"}
      - {id: u3, lane: unp, row: 6, text: "Pre-booked payment: applied when booked"}
      - {id: u4, lane: unp, row: 7, text: "Unbooked / Unmatched record"}
      - {id: y5, lane: sys, row: 9, kind: system, text: "AR for printing; run report"}
      - {id: c3, lane: cas, row: 10, text: "Review the run report; correct and reprocess failed rows"}
      - {id: e1, lane: cas, row: 11, kind: end, text: Closed}
    edges:
      - [s0, a1]
      - [s0, c1, "", "", right]
      - [a1, y1, "", "", right]
      - [c1, y1, "", "", right]
      - [y1, y2]
      - [y2, c2, "No", "", left]
      - [y2, y3, "Yes"]
      - [y3, y4, "Yes"]
      - [y3, u1, "No", "", right]
      - [u1, u3, "Yes", "", left]
      - [u1, u4, "No", "", right]
      - [y4, y5]
      - [y5, c3, "", "", left]
      - [c3, e1]

  - id: brd02_fig_cancel
    kind: swimlane
    where: C
    caption: "Cancellation of an AR or OR: record, posting and reversal"
    read: "Read from top to bottom. The right-hand column shows what the posting creates in each case (remitted AR, AR not remitted, OR); the GL reversal entries are in Appendix I."
    brd: "CSHID.001, 002, 003, 012; FRS.CSH.03.01"
    lanes:
      - {id: cas, label: Cashier}
      - {id: tl, label: "Approver / Poster"}
      - {id: sys, label: System, system: true}
      - {id: rec, label: Records created, system: true}
    steps:
      - {id: s0, lane: cas, row: 0, kind: start, text: Start}
      - {id: c1, lane: cas, row: 1, text: "Search issued AR or OR; select; reason"}
      - {id: y1, lane: sys, row: 2, kind: decision, text: "Validations pass?"}
      - {id: y2, lane: sys, row: 3, kind: system, text: "Created: CN-AR / CN-OR record"}
      - {id: c3, lane: cas, row: 4, text: "Submit for Posting"}
      - {id: t1, lane: tl, row: 5, kind: decision, text: "Post?"}
      - {id: c4, lane: cas, row: 6, text: "Returned: edit and re-submit"}
      - {id: y3, lane: sys, row: 6, kind: decision, text: "AR or OR? AR remitted?"}
      - {id: r1, lane: rec, row: 7, text: "AR remitted: AR Insurer Refund per account and insurer"}
      - {id: r2, lane: rec, row: 8, text: "AR not remitted: PR and DTIP reversed; account outstanding"}
      - {id: r3, lane: rec, row: 9, text: "OR: re-class to Commission Receivable; CRU reversed"}
      - {id: y4, lane: sys, row: 10, kind: system, text: "AR / OR number Cancelled; GL reversal"}
      - {id: e1, lane: sys, row: 11, kind: end, text: Cancelled}
    edges:
      - [s0, c1]
      - [c1, y1, "", "", right]
      - [y1, c1, "No", "dashed", left]
      - [y1, y2, "Yes"]
      - [y2, c3, "", "", left]
      - [c3, t1, "", "", right]
      - [t1, c4, "Return", "", left]
      - [t1, y3, "Post", "", right]
      - [y3, r1, "", "", right]
      - [r1, r2, "or", "dashed"]
      - [r2, r3, "or", "dashed"]
      - [y3, y4]
      - [y4, e1]

  - id: brd02_fig_reinstate
    kind: swimlane
    where: C
    caption: "Reinstatement of an AR or OR: partial or full, remitted or not remitted"
    read: "Read from top to bottom. The receipt stays Issued; the reversed payment becomes an Unapplied, AR Insurer Refund or AP Unapplied Commission record (BDOI FRS.CSH.04.01.09)."
    brd: "CSHID.001, 002, 004, 005, 013; FRS.CSH.04.01"
    lanes:
      - {id: cas, label: Cashier}
      - {id: tl, label: "Approver / Poster"}
      - {id: sys, label: System, system: true}
      - {id: rec, label: Records created, system: true}
    steps:
      - {id: s0, lane: cas, row: 0, kind: start, text: Start}
      - {id: c1, lane: cas, row: 1, text: "Search issued AR or OR; Partial (AR) or Full; accounts; reason; CSHID.005 information"}
      - {id: y1, lane: sys, row: 2, kind: decision, text: "Validations pass?"}
      - {id: y2, lane: sys, row: 3, kind: system, text: "Created: RE-AR / RE-OR record"}
      - {id: c3, lane: cas, row: 4, text: "Submit for Posting"}
      - {id: t1, lane: tl, row: 5, kind: decision, text: "Post?"}
      - {id: c4, lane: cas, row: 6, text: "Returned: edit and re-submit"}
      - {id: y3, lane: sys, row: 6, kind: decision, text: "AR or OR? AR remitted?"}
      - {id: r1, lane: rec, row: 7, text: "AR remitted: AR Insurer Refund; remittance status reversed"}
      - {id: r2, lane: rec, row: 8, text: "AR not remitted: Unapplied payment per account"}
      - {id: r3, lane: rec, row: 9, text: "OR: AP Unapplied Commission per account and insurer"}
      - {id: y4, lane: sys, row: 10, kind: system, text: "AR / OR stays Issued; GL; record AR/OR Reinstated"}
      - {id: e1, lane: sys, row: 11, kind: end, text: Reinstated}
    edges:
      - [s0, c1]
      - [c1, y1, "", "", right]
      - [y1, c1, "No", "dashed", left]
      - [y1, y2, "Yes"]
      - [y2, c3, "", "", left]
      - [c3, t1, "", "", right]
      - [t1, c4, "Return", "", left]
      - [t1, y3, "Post", "", right]
      - [y3, r1, "", "", right]
      - [r1, r2, "or", "dashed"]
      - [r2, r3, "or", "dashed"]
      - [y3, y4]
      - [y4, e1]

  - id: brd02_fig_unapplied
    kind: swimlane
    where: C
    caption: "Unapplied payments: disposition, approval, refund and reversal"
    read: "Read from top to bottom. The tabs of the Unapplied list follow the record: Unapplied, Monitoring, For Approval, For Reversal and Done."
    brd: "CSHID.016, 024, 025; FRS.CSH.06.01, FRS.CSH.06.02"
    lanes:
      - {id: src, label: "Sources: excess, unmatched, reversals"}
      - {id: cas, label: "Cashier / Marketing"}
      - {id: tl, label: "Cashiering TL (Team approval)"}
      - {id: sys, label: System, system: true}
      - {id: dsb, label: Disbursement}
    steps:
      - {id: s0, lane: src, row: 0, kind: start, text: Start}
      - {id: y1, lane: sys, row: 1, kind: system, text: "Unapplied payment record (tab Unapplied)"}
      - {id: c1, lane: cas, row: 2, text: "Assign disposition: type, amount, target (tab Monitoring)"}
      - {id: c2, lane: cas, row: 3, kind: decision, text: "Needs approval?"}
      - {id: c3, lane: cas, row: 4, text: "Submit (tab For Approval)"}
      - {id: t1, lane: tl, row: 5, kind: decision, text: "Approve?"}
      - {id: t2, lane: tl, row: 6, text: "Return to Monitoring with reason"}
      - {id: y2, lane: sys, row: 7, kind: system, text: "Apply, DST, reclass, transfer, others; Done"}
      - {id: d1, lane: dsb, row: 8, text: "Refund request paid"}
      - {id: c4, lane: cas, row: 9, text: "Mark for reversal with reason (tab For Reversal)"}
      - {id: t3, lane: tl, row: 10, text: "Approve or reject the reversal"}
      - {id: e1, lane: sys, row: 11, kind: end, text: Done}
    edges:
      - [s0, y1, "", "", right]
      - [y1, c1, "", "", left]
      - [c1, c2]
      - [c2, y2, "No: execute at once", "", right]
      - [c2, c3, "Yes"]
      - [c3, t1, "", "", right]
      - [t1, t2, "No"]
      - [t1, y2, "Yes", "", right]
      - [y2, d1, "Refund", "", right]
      - [y2, c4, "", "dashed", left]
      - [c4, t3, "", "", right]
      - [t3, e1, "", "", right]

  - id: brd02_fig_pdc
    kind: swimlane
    where: C
    caption: "Post-dated checks: warehouse, release before maturity and maturity"
    read: "Read from top to bottom. A post-dated check is not matched before its maturity (CSHID.020)."
    brd: "CSHID.008, 020; FRS.CSH.05.01.04, FRS.CSH.05.02"
    lanes:
      - {id: src, label: "Client / PMS"}
      - {id: cas, label: Cashier}
      - {id: sys, label: System, system: true}
    steps:
      - {id: s0, lane: src, row: 0, kind: start, text: Checks}
      - {id: a1, lane: src, row: 1, text: "Matured checks of PMS via MFT: processed as payments (05.01)"}
      - {id: c1, lane: cas, row: 2, text: "Add a check or upload the PDC list"}
      - {id: y1, lane: sys, row: 3, kind: decision, text: "Already in the warehouse?"}
      - {id: c2, lane: cas, row: 4, text: "Refused: check already in the warehouse"}
      - {id: y2, lane: sys, row: 5, kind: system, text: "Warehoused with its PDC warehouse number"}
      - {id: c3, lane: cas, row: 6, kind: decision, text: "Released before maturity?"}
      - {id: c4, lane: cas, row: 7, text: "Returned, Replaced or Pulled Out with reason"}
      - {id: y3, lane: sys, row: 8, kind: system, text: "Maturity run 08:30: payment, AR, matching and application"}
      - {id: e1, lane: sys, row: 9, kind: end, text: Applied}
    edges:
