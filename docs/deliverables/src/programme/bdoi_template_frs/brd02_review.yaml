# Business Unit review edition of the Operations Cashiering FRS in BDOI's template, version 3.2: the summary for the
# Business Unit (section 1.4), Appendices G and J to U, and the walkthrough of Appendix K.
# Read by build_brd02_bdoi_frs.py (the FRS) and build_brd02_workbooks.py (the review workbooks).
# Business wording only. Every passage traces to a BRD ID of the Operations BRD of 8-Oct-2026; anything beyond the BRD
# is a proposal listed in Appendix R. "C1" etc. are the conflicts of Appendix R (written R-nn (Cn) in the document).

meta:
  references_review: >-
    The review workbooks of BRD-02 Operations Cashiering issued with this version (Business Unit Requirements
    Collection, BRD vs Out-of-the-Box vs Best Practice, Change Request Register, Test Cases and Traceability,
    Business Unit Walkthrough Users, all v1.0 of 9-Oct-2026) carry the same numbers as this document.

# ------------------------------------------------------------------------- 1.4 Summary for the Business Unit Review
summary:
  intro: >-
    This section is the short way into the document for the Business Unit. It shows on a few pages what Operations
    Cashiering covers, how the work flows from one persona to the next, the numbers behind the document, the
    decisions the Business Unit must take before signing, and which part each reviewer reads. The detail is in
    sections 2 and 3 and in the appendices; every statement traces to a BRD ID of the Operations BRD of 8-Oct-2026.
  scope_header: ["In scope of this FRS", "Out of scope", "Handled in another FRS or document"]
  scope:
    - ["Log-in, access by role and the Cashiering dashboard (FRS.CSH.01)", "Check pick-up from Collection (CSHID.009, removed from the BRD)", "Remittance, Adjustment / Cancellation, Production Reconciliation, Commission Receivables and the Marketing activities: BIBS FRS BRD-2 Operations v2.1"]
    - ["AR and OR creation, posting, number series, batch printing, templates (FRS.CSH.02)", "Cashiering processing and reversal of BIR 2307 (CSHID.026, CSHID.027, deleted in BRD v1.01)", "PR 2307 reversal and the release of the certificates (MKTID.013, DBMID.001): \"Com rec\" in BDOI's mapping (Appendix R)"]
    - ["Cancellation and reinstatement of ARs and ORs with their accounting (FRS.CSH.03, 04)", "The bank deposit slip of the day's collections (Accounting module; Appendix R)", "User access, roles and sign-in: User Access Maintenance FRS (\"Based on UAM\")"]
    - ["Automatic payment processing of the Bills Payment, CLPC, Trade, Direct Credit and post-dated check files; post-dated check warehouse; pre-booked payments (FRS.CSH.05)", "Transport of the channel files other than MFT (to be agreed with BDOI IT)", "GL accounts and the accounting rules: Accounting FRS (BRD-5); the default entries are in Appendix I"]
    - ["Unapplied payments and their dispositions; requests of other modules (FRS.CSH.06)", "Payment of refunds (Disbursement module)", "Refund payment and the insurer settlement: Disbursement (BRD-5)"]
    - ["Automatic OR, inquiry, payment history, audit trail, reports, interfaces, batch runs and notices (FRS.CSH.07 to FRS.CSH.10)", "Screen standards (programme level)", "Data migration of the open accounts and unapplied payments: BRD-13 Data Migration (Appendix P)"]
  numbers_intro: "The key numbers of this document (counted by the builder of the document; the workbooks give the same numbers):"
  decisions_intro: >-
    The ten decisions below shape the rest of the document. Each points to the row of Appendix R (observations and
    points for decision) or Appendix S (open questions) where both readings, the BRD text and the proposal are given.
  decisions:
    - [1, "Must every AR and OR be posted by a second user before its number is issued (BDOI's posting step), or is the AR issued when the cashier saves?", "C1", "Cashiering Process Owner; Comptrollership"]
    - [2, "What reinstatement means: restoring a cancelled receipt (BRD reason \"Due to Cancellation\"), reversing the application of an issued receipt (BDOI's FRS), or both", "C2", "Cashiering Process Owner"]
    - [3, "Direct Credit file: identification of payments already received (BDOI's FRS) or new payments", "C8", "Cashiering Process Owner; BDOI IT"]
    - [4, "Cancellation of an AR already remitted: AR Insurer Refund per account and insurer", "C9", "Comptrollership; Cashiering Process Owner"]
    - [5, "When the commission OR is generated: at the approval of the insurer settlement by Disbursement (BDOI's FRS) or at the remittance approval", "C12", "Comptrollership"]
    - [6, "Minimal balance threshold: -1.00 to 1.00 (BDOI's FRS) or Php 10.00 (BRD)", "C5", "Comptrollership; Cashiering Process Owner"]
    - [7, "Application hierarchy: place of the Fire Service Tax and the meaning of check before cash", "C6", "Comptrollership; insurers"]
    - [8, "BIR 2307: tag per account or per client, and the base of the 2% (basic or gross premium)", "C26", "Comptrollership (Tax)"]
    - [9, "Check holding period at the counter (4 working days) or only before remittance (3 banking days)", "C7", "Cashiering Process Owner"]
    - [10, "Formats of the AR and OR numbers, of the acknowledgement certificate number and of the record numbers", "C4, C3", "Comptrollership (BIR registration); System Analyst (BDO ITG)"]
  review_intro: "How to review: each reviewer reads the parts of his or her role; the times are a guide for a first reading."
  review_header: ["Reviewer (role)", "Read first", "Then", "About"]
  review:
    - ["Product Owner", "1.4 Summary; Appendix C figures; Appendix U checklist", "Appendix R decisions; Appendix S open questions", "2 hours"]
    - ["Cashiering Process Owner (Head Office and branches)", "Section 3 FRS.CSH.01 to FRS.CSH.06; Appendix C; Appendix J workflow", "Appendices D, E, F, K (files, screens, messages, walkthroughs); G e-mails; L documents; M reports", "5 hours"]
    - ["Comptrollership (accounting and tax)", "FRS.CSH.02.05, 03.01.08-.09, 04.01.09-.10; Appendix I entries", "Appendix R decisions 4 to 8 and 10; Appendix H parameters", "3 hours"]
    - ["Marketing and Commission Receivable", "FRS.CSH.06; FRS.CSH.07", "Appendix R C13, C14; Appendix M reports", "1.5 hours"]
    - ["BDOI IT", "Appendix N integrations; FRS.CSH.05.01.04 (MFT)", "Appendix O non-functional requirements; Appendix P data set-up; Appendix S integration questions", "2 hours"]
    - ["System Analyst (BDO ITG)", "Section 2 mapping; Appendix Q traceability; Appendix R", "Appendix T change control; the review workbooks", "4 hours"]
  workbooks_intro: "The review workbooks issued with this version (same numbers as this document):"
  workbooks:
    - ["Business Unit Requirements Collection", "What the Business Unit provides: document layouts, e-mail and message wordings, schedules, parameters, lists, master data, approvers, integration inputs, open decisions"]
    - ["BRD vs Out-of-the-Box vs Best Practice", "For every BRD requirement: what the system offers as standard, broking best practice, fit and recommendation"]
    - ["Change Request Register", "How a change after sign-off is raised and decided; candidate changes; the decision log of every Appendix R observation"]
    - ["Test Cases and Traceability", "BRD ID to FR item, test cases, screens and walkthrough steps; the questions answered in BDOI's FRS; UAT entry and exit criteria"]
    - ["Business Unit Walkthrough Users", "The sign-in ID of every persona for the walkthrough in the BIBS UAT environment and the walkthrough script"]

# ------------------------------------------------------------------------------------- Appendix C introduction
annex_c:
  intro: >-
    One figure for every process of the Cashiering scope of the BRD, drawn from end to end with one column per
    persona and one for the system, then the status life-cycles of the records. The figures follow BDOI's text of
    section 3; where the BRD or the BIBS reference reads differently, the point is in Appendix R.

# ------------------------------------------------------------------------------------- Appendix J workflow and approvals
workflow:
  intro: >-
    How each Cashiering record is made, checked and posted or approved: the stages, who acts at each stage, the
    controls, the time rules, escalation and the paths to return or cancel a record. The figure gives the routes at a
    glance; the table gives the detail. The BRD and BDOI's FRS set no time for posting or approval; the times marked
    "proposed" are a proposal of iorta TechNXT for the Business Unit to confirm (Appendix R and the requirements
    collection workbook, sheet Schedules and timings).
  header: ["Process", "Stage", "Who acts (maker / checker)", "Controls", "Time rule, reminder, escalation", "Return or cancel"]
  rows:
    - ["AR / OR creation (FRS.CSH.02.01, 02.02, 02.05)", "1 Created", "Cashier (maker); ORs Head Office only", "Validations of FRS.CSH.02.01.08; editable; creation record number", "No limit", "Cancel the record (Record Cancelled)"]
    - ["", "2 For Posting", "Approver / Poster (Cashiering TL / TH), not the creator", "Series checked; number generated at posting; four eyes", "Proposed: posted the same business day; records For Posting shown on the dashboard with their age", "Return with reason (Returned; edit and re-submit)"]
    - ["", "3 AR/OR Issued", "System", "Application, minimal balance, excess, GL", "-", "Cancellation or reinstatement record"]
    - ["Cancellation (FRS.CSH.03.01)", "1 Created / 2 For Posting", "Cashier; Approver / Poster", "Reason; check reasons for check payments; no disposition in process", "Proposed: posted within 1 working day", "Return; cancel while Created"]
    - ["Reinstatement (FRS.CSH.04.01)", "1 Created / 2 For Posting", "Cashier; Approver / Poster", "Type, accounts, reason, CSHID.005 information", "Proposed: posted within 1 working day", "Return; cancel while Created"]
    - ["Unapplied disposition (FRS.CSH.06.02)", "Unapplied, Monitoring", "Cashier or Marketing (own unit)", "Amount within the outstanding; target required", "Proposed: disposition assigned within 2 working days", "Withdraw to Unapplied"]
    - ["", "For Approval", "Cashiering TL (Team approval), not the submitter", "Types needing approval: setting of the type (Appendix S)", "Proposed: decided within 1 working day", "Return to Monitoring with reason"]
    - ["", "For Reversal", "Cashier (mark); Cashiering TL (approve)", "Reason required; a refund only after Disbursement returned it", "Proposed: 1 working day", "Reject the reversal"]
    - ["Payment reversal request of Accounting Controls (FRS.CSH.06.03.02)", "Request; approval", "Accounting Controls; Cashiering TL", "Requester never approves", "Proposed: 1 working day", "Reject"]
    - ["Receipt series (FRS.CSH.02.03)", "Maintain; authorise", "Cashiering TL (maker); another Cashiering TL (checker)", "End not below issued numbers; OR series Head Office only", "Before the series is needed; warning level alert", "Not authorised"]
    - ["AR / OR template (FRS.CSH.02.06)", "Change; approve", "MBS (maker); another authorised user", "Earlier versions kept", "-", "Not approved"]
  matrix_intro: "Role-to-stage matrix: M = makes, P = posts or approves, V = views, U = uploads."
  matrix_header: ["Stage", "Cashier HO", "Cashier branch", "Cashiering TL / TH", "Marketing", "Comm. Receivable", "Comptroller-ship", "Auditor"]
  matrix:
    - ["AR creation record", M, M, M, "", "", "", V]
    - ["OR creation record; Commission Schedule", "M, U", "", M, "", "", "", V]
    - ["Posting of creation records", "", "", P, "", "", "", V]
    - ["Cancellation / reinstatement record", M, M, M, "", "", "", V]
    - ["Posting of cancellation / reinstatement", "", "", P, "", "", "", V]
    - ["Payment files; PDC warehouse", U, "", U, "", "", "", V]
    - ["Disposition", M, "", M, "M (own unit)", "M (AP Unapplied Commission)", "", V]
    - ["Approval of dispositions and reversals", "", "", P, "", "", "", V]
    - ["Receipt series", "", "", "M / P (another TL)", "", "", "", V]
    - ["Journals and reports", V, V, V, "", V, V, V]
  escalation: >-
    Escalation today: the records For Posting and For Approval are counted on the dashboard with their amounts, and
    each list shows the age of the record; the Cashiering Team Head works the records of the team. An automatic
    reminder and escalation after a number of working days is a proposal (Appendix R) for the Business Unit to decide.

# ------------------------------------------------------------------------------- Appendix G notices and e-mails
emails:
  intro: >-
    Every notice, alert and e-mail of Operations Cashiering, word for word as the system gives it today; the parts in
    angle brackets are filled in by the system. A notice "in the system" appears under the bell in the page header
    and opens the record; an alert appears in the alert inbox of the role. The system sends one e-mail for
    Cashiering: the failed batch run. BDOI has not given wordings for these messages: the texts below are proposed
    by iorta TechNXT for BDOI's approval (requirements collection workbook, sheet E-mail wordings). The notices
    marked "Proposed" follow BDOI's posting step and are not given by the system today.
  common:
    attachments: None
    protection: "No attachment, amount above the record's own or personal data beyond the names; the link opens the record only for a signed-in user who holds the right."
  items:
    - id: G-01
      platform: NT-07
      name: Cancellation or reinstatement record for approval
      trigger: "A cancellation or reinstatement record is submitted for posting."
      recipients: "Every holder of the posting right (Cashiering Team Leaders and Team Heads), except the submitter."
      channel: "Notice in the system (the user may also choose an e-mail copy on Notification Settings: proposed, Appendix R)"
      subject: "<record number> for approval"
      body: "<Cancellation / Reinstatement> of receipt, reason: <reason>"
      frequency: "Once per submission or re-submission."
      brd: "CSHID.001, CSHID.002"
      frs: "FRS.CSH.03.01.11, FRS.CSH.04.01.12"
      code: ['action.getTransactionNo() + " for approval"', '" of receipt, reason: "']
    - id: G-02
      platform: NT-07
      name: Disposition for approval
      trigger: "A disposition of a type that needs Team approval is submitted."
      recipients: "Every holder of the disposition approval right (Cashiering Team Leaders), except the submitter."
      channel: Notice in the system
      subject: "<Unapplied Payment No.> disposition for approval"
      body: "<disposition type> <currency> <amount>"
      frequency: "Once per submission."
      brd: "CSHID.024, CSHID.025"
      frs: "FRS.CSH.06.02.01, FRS.CSH.10.04.01"
      code: ['" disposition for approval"']
    - id: G-03
      platform: NT-07
      name: Payment reversal for approval
      trigger: "Accounting Controls requests the reversal of a payment application."
      recipients: "Every holder of the posting right (Cashiering Team Leaders)."
      channel: Notice in the system
      subject: "<request number>: payment reversal for approval"
      body: "Receipt <AR number> on invoice <invoice number>"
      frequency: "Once per request."
      brd: "CSHID.024; BRQID.004"
      frs: "FRS.CSH.06.03.02"
      code: ['": payment reversal for approval"']
    - id: G-04
      platform: NT-08
      name: Request of a collector
      trigger: "A collector asks Cashiering to apply, refund or transfer an Unapplied payment record."
      recipients: "Every holder of the disposition right (Cashiers)."
      channel: Notice in the system
      subject: "<request number>: <action> requested by a collector"
      body: "<Unapplied Payment No.> to invoice <invoice number>"
      frequency: "Once per request."
      brd: "CSHID.024; BRQID.004"
      frs: "FRS.CSH.06.03.01"
      code: ['" requested by a collector"']
    - id: G-05
      platform: NT-08
      name: Refund validation requested
      trigger: "Payment Requests asks Cashiering to confirm that a cancelled premium is back in the Unapplied list before a refund."
      recipients: "Every holder of the disposition right (Cashiers)."
      channel: Notice in the system
      subject: "<task number>: refund validation requested"
      body: "Confirm that the premium of <invoice number> is back in the unapplied list"
      frequency: "Once per request."
      brd: "CSHID.024; BRQID.004"
      frs: "FRS.CSH.06.03.02"
      code: ['": refund validation requested"', '"Confirm that the premium of "']
    - id: G-06
      platform: NT-01
      name: Record moved to another stage
      trigger: "A cancellation or reinstatement record or an Unapplied payment record is returned, posted, approved or moved by a workflow action."
      recipients: "The creator of the record and its current assignee, unless they made the move themselves."
      channel: Notice in the system
      subject: "<record number>: <new stage>"
      body: "<record description> - <comment typed with the action>"
      frequency: "Once per move."
      brd: "CSHID.001, CSHID.002, CSHID.024"
      frs: "FRS.CSH.02.05.07, FRS.CSH.03.01.11, FRS.CSH.04.01.12, FRS.CSH.10.04.01"
      code: ['workCase.getReference() + ": " + target.getName()']
    - id: G-07
      platform: NT-01
      name: Work assigned
      trigger: "A Team Leader assigns a record to a user."
      recipients: "The user assigned."
      channel: Notice in the system
      subject: "<record number> assigned to you"
      body: "<record title>"
      frequency: "Once per assignment."
      brd: "CSHID.024"
      frs: "FRS.CSH.10.04.01"
      code: ['" assigned to you"']
    - id: G-08
      platform: NT-02
      name: Work handed over
      trigger: "A module hands Cashiering work it cannot complete because the other module is not in use (an OR or an unapplied item to set up)."
      recipients: "The users of the team named in the hand-over."
      channel: Notice in the system
      subject: "Work handed over: <work>"
      body: "<what to do>"
      frequency: "Once per hand-over."
      brd: "BRQID.004"
      frs: "FRS.CSH.10.01.01"
      code: ['"Work handed over: "']
    - id: G-09
      platform: NT-03
      name: Refund request to Disbursement
      trigger: "A Refund disposition is approved: Cashiering sends a payment request to Disbursement."
      recipients: "Disbursement (holders of the Disbursement queue right)."
      channel: Notice in the system
      subject: "Payment request <request number>"
      body: "<type>, <payee>, <amount>"
      frequency: "Once per request."
      brd: "CSHID.024"
      frs: "FRS.CSH.06.02.01, FRS.CSH.10.01.01"
      code: ['"Payment request " + saved.getRequestNo()']
    - id: G-10
      platform: NT-04
      name: Status of a refund request
      trigger: "Disbursement acknowledges, pays or returns a refund request."
      recipients: "The user who sent the request."
      channel: Notice in the system
      subject: "Payment request <request number> is now <status>"
      body: "<DV number, status and return reason>"
      frequency: "Once per change of status."
      brd: "CSHID.024"
      frs: "FRS.CSH.06.02.01"
      code: ['" is now "']
    - id: G-11
      platform: NT-06
      name: Receipt series low
      trigger: "The numbers left in an AR or OR series reach its warning level."
      recipients: "Cashiering Team Leader (alert inbox)."
      channel: Alert
      subject: "<AR / OR> series <prefix> has <n> numbers left"
      body: "The series; the alert opens Receipt Series."
      frequency: "When each number at or below the warning level is issued; once per series and number left."
      brd: "CSHID.015"
      frs: "FRS.CSH.02.03.03, FRS.CSH.10.04.02"
      code: ['" numbers left"']
    - id: G-12
      platform: NT-09
      name: Pre-booked payment waiting
      trigger: "A Pre-booked payment waits for the booking of its account beyond the ageing threshold (5 days as delivered)."
      recipients: "Cashiering Team Leader (alert inbox)."
      channel: Alert
      subject: "Payment for <ARN> waits for the booking since <date>"
      body: "The pre-booked payment and its amount."
      frequency: "Once a day per payment while it waits (re-matching run)."
      brd: "CSHID.020"
      frs: "FRS.CSH.05.03.01, FRS.CSH.10.04.02"
      code: ['" waits for the booking since "']
    - id: G-13
      platform: NT-05
      name: Interface run failed
      trigger: "A flow-in run (booked accounts, files received, commission payment details) fails or has failed records."
      recipients: "System Administrator (alert inbox and notice)."
      channel: "Alert and notice in the system"
      subject: "Interface run <status>"
      body: "<feed> run <run number> <status>: <message>"
      frequency: "Once per run."
      brd: "BRQID.005, BRQID.006"
      frs: "FRS.CSH.10.02.01"
      code: ['"Interface run "']
    - id: G-14
      platform: JOB_FAILURE
      name: Batch run failed
      trigger: "A scheduled run of Cashiering (re-matching, post-dated check maturity, minimal balance run) fails as a whole."
      recipients: "The e-mail addresses of the failed-run recipients setting (System Administrator; proposed: the Cashiering Team Head)."
      channel: E-mail (plain text, from the system address of the environment)
      subject: "BIBS: batch job <job name> failed"
      body: "The batch job <job name> failed. Run: <run number>. Started: <date and time> (Philippine time). Trigger: <trigger>. Error: <message>. Open Administration > Scheduled Jobs to see the run history and run the job again."
      frequency: "Once per failed run."
      brd: "BRQID.006"
      frs: "FRS.CSH.10.03.01"
      code: ['"The batch job "', '": batch job "']
    - id: G-15
      platform: Proposed
      name: AR / OR creation record for posting
      trigger: "An AR or OR creation record is submitted for posting (BDOI FRS.CSH.02.01.10)."
      recipients: "The Approver / Poster of the branch (Head Office for ORs)."
      channel: "Notice in the system (proposed)"
      subject: "<record number> for posting"
      body: "<Acknowledgement / Official Receipt> <type>, <payor>, <currency> <amount>"
      frequency: "Once per submission or re-submission."
      brd: "CSHID.001, CSHID.002"
      frs: "FRS.CSH.02.01.10"
      code: []
    - id: G-16
      platform: Proposed
      name: AR / OR creation record returned or posted
      trigger: "The Approver / Poster returns or posts an AR or OR creation record."
      recipients: "The creator of the record."
      channel: "Notice in the system (proposed)"
      subject: "<record number> returned / <record number> posted: <AR / OR number>"
      body: "Returned: <reason>. Posted: <AR / OR number> issued and applied to <n> account(s)."
      frequency: "Once per return or posting."
      brd: "CSHID.001, CSHID.002"
      frs: "FRS.CSH.02.05.07"
      code: []
    - id: G-17
      platform: Proposed
      name: File received via MFT refused
      trigger: "A payment file received via MFT fails the file checks (FRS.CSH.05.01.04)."
      recipients: "Cashiering Team Leader (alert inbox)."
      channel: "Alert (proposed)"
      subject: "Payment file <file name> refused: <reason>"
      body: "The file and its validation report."
      frequency: "Once per file."
      brd: "CSHID.008; BRQID.005"
      frs: "FRS.CSH.05.01.04, FRS.CSH.10.04.02"
      code: []

# ------------------------------------------------------------------------------- Appendix L documents and formats
documents:
  intro: >-
    Every document Cashiering prints, downloads or exports: purpose, recipients, format, protection and the fields
    in order. Where the system has a layout today, it is shown; BDOI's own forms are the sample AR and the OR body of
    FRS.CSH.02.06 (Appendix A), which the system follows once BDOI confirms them (Appendix R, C16). The bank deposit
    slip of the day's collections is kept in the Accounting (Receivables) module and is not a Cashiering document
    (Appendix R).
  file_name_rule: >-
    File names: a printed receipt downloaded is named <Receipt Type>_<Receipt Number>.pdf (FRS.CSH.02.04.09.03);
    several receipts are one ZIP of these files; reports are named <Report Name>_<date of extraction MMDDYYYY>
    (FRS.CSH.09.02).
  items:
    - id: L.1
      name: Acknowledgement Receipt (AR)
      purpose: "Proof given to the payor that the premium or non-premium payment was received on behalf of the insurer (CSHID.001, 019)."
      recipients: "Client's Copy: the payor; BDOI Copy: kept with the receipt."
      format: "PDF, one per receipt; printed singly or in a print batch."
      protection: "Not protected; certificate number and REPRINT mark on re-prints."
      fields: ["Header: BDO Insure logo, company name, description, address, VAT TIN (company record)", "AR number and copy label", "Title ACKNOWLEDGEMENT RECEIPT; REPRINT tag on re-prints", "Received from; date; TIN", "The sum of: amount in words and in figures", "Payment received on behalf of insurance company: insurer", "Remarks; reference no.; policy no.", "Payment in form of; check details (check total, check no., check date, bank / branch); cash total", "Note line; THIS IS A SYSTEM GENERATED RECEIPT. NO SIGNATURE IS REQUIRED.", "Footer: trademark and licence line; acknowledgement certificate no., date issued, series range; THIS DOCUMENT IS NOT VALID FOR CLAIM OF INPUT TAX."]
      bdoi: "FRS.CSH.02.06.03; Sample AR of Appendix A"
      shot: doc-ar
      shot_caption: "the system's AR today; the form becomes BDOI's sample AR once confirmed"
      rc: RC-DOC-01
    - id: L.2
      name: Official Receipt (OR)
      purpose: "Receipt of BDOI income: service fee, profit share, commissions, incentives, others (CSHID.002)."
      recipients: "Client's Copy: the payor (insurer or client); BDOI Copy: kept with the receipt."
      format: "PDF, one per receipt; printed singly or in a print batch."
      protection: "Not protected; certificate number and REPRINT mark on re-prints."
      fields: ["Header: BDO Insure logo, company name, description, address, VAT TIN", "OR number and copy label", "Received From <Insurer Name>; Address; TIN", "Form of Payment; Paid Amount in words and in figures", "In payment of <Official Receipt Type>; lines with gross amount, VAT and withholding tax (Appendix R)", "Bank / Branch; Check No; Check Date", "AC No; Date Issued", "Footer: trademark line; acknowledgement certificate no. with series range; NOT VALID FOR CLAIM OF INPUT TAX; Client's Copy or BDOI Copy"]
      bdoi: "FRS.CSH.02.06.02"
      shot: doc-or
      shot_caption: "the system's OR today; the form becomes BDOI's OR template once confirmed"
      rc: RC-DOC-02
    - id: L.3
      name: Certification of Payment
      purpose: "Formal certification that a payment was received, processed and applied to a policy (CSHID.023, FRS.CSH.02.06.04)."
      recipients: "The requesting market unit and the client."
      format: "PDF, one per request."
      protection: "Not protected."
      fields: ["Title CERTIFICATION OF PAYMENT and series number", "Text: This certifies that payment was received", "From (payor); AR number; date paid; amount; policy number", "Requested by (market unit); date issued", "Signature: Cashiering"]
      bdoi: "FRS.CSH.09.02.15 (report)"
      shot: ""
      rc: RC-DOC-03
    - id: L.4
      name: Validation report of an upload
