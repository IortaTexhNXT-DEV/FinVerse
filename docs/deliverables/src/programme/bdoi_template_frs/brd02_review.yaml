# ---------------------------------------------------------------------------------- Appendix K walkthrough WT-E
walkthrough:
  id: WT-E
  title: A Cashiering day for the Business Unit walkthrough
  summary: >-
    The walkthrough of this FRS for the Business Unit in the BIBS UAT environment: the receipt series, a payment file
    of the day, the pre-booked and unapplied payments, a post-dated check, an OR of Head Office, an AR of a branch,
    the printing of the day's receipts and the reports. The steps follow the screens of Appendix E as they are today;
    the posting step of BDOI's FRS (Appendix R, C1) is walked through once it is decided.
  data: "SIT/UAT data: receipt series of Head Office and Cebu; a Bills Payment file of the UAT data; booked and pre-booked accounts of the UAT data."
  steps:
    - [CASHIER_TL, SCR-OP-21, "Opens Receipt Series and reads the AR series of Head Office and Cebu and the OR series of Head Office", "Each series with its prefix, range, numbers left, ATP number and warning level; OR series for Head Office only", "Series checked"]
    - [CASHIER, SCR-OP-15, "Opens Payment Uploads, chooses Bills Payment and uploads the file of the UAT data", "The run summary with the applied, unapplied, pre-booked, excess and failed rows; the run report to download", "File processed"]
    - [CASHIER, SCR-OP-14, "Opens Pre-booked Payments and clicks Re-match Now on the payment of the run", "The payment waits for the booking of its account, or is applied if the account is now booked", "Pre-booked followed"]
    - [CASHIER, SCR-OP-16, "Opens PDC Warehouse and adds a post-dated check with its maturity date", "The check in the warehouse with its number and maturity date", "Check warehoused"]
    - [CASHIER, SCR-OP-11, "Opens Unapplied Payments, the excess of the run, assigns a Refund and submits it", "The disposition is For Approval", "Disposition submitted"]
    - [CASHIER_TL, SCR-OP-12, "Opens the Unapplied payment and clicks Approve", "The disposition is approved and the refund request is in the Disbursement queue", "Refund requested"]
    - [CASHIER, SCR-OP-09, "Opens Receipts and issues an Official Receipt for a service fee", "The OR with the next Head Office OR number", "OR issued"]
    - [CASHIER_BR, SCR-OP-08, "Signs in as the Cebu cashier, opens Receive Payment, enters the account and the amount and checks the preview", "The preview of the application by component; the AR takes the next Cebu number", "AR issued"]
    - [CASHIER, SCR-OP-18, "Opens Batch Print, selects the receipts of the day and prints them", "One print batch with the receipts selected", "Receipts printed"]
    - [CASHIER, SCR-OP-63, "Opens the Report Centre and runs the Applied Premium Report for the day in Excel", "The report with the payments of the day", "Report run"]
    - [AUDITOR, SCR-OP-64, "Signs in as the Auditor and opens the same report", "The report on the screen without download", "View only"]

