# ------------------------------------------------------------------------------- Appendix S open items
open_items:
  intro: >-
    The assumptions and dependencies of this FRS and the questions that BDOI's FRS has not answered. Questions that
    BDOI's FRS answers are not repeated: they are listed in the Test Cases and Traceability workbook (sheet Answered
    in the BDOI FRS) with BDOI's clause; where BDOI's answer differs from the BRD, the decision is in Appendix R. Our
    reference numbers (OQ, CLR-OP, IQ, A-OP, D-OP) are kept so that the link to earlier decisions is not lost.
  assumptions:
    - ["A-OP-01", "The Operations BRD v1.01 (p.71-185) is the baseline; the Cashiering annex of May 2026 governs where it changes a requirement; the e-mail record (p.67-70, 186-189) documents the BIR 2307 decision.", "Introduction"]
    - ["A-OP-02", "Every Cashiering function starts from the account booked in New Business; Cashiering does not book.", "BRQID.007"]
    - ["A-OP-03", "GL accounts are kept in the system; Comptrollership configures the rules of the Cashiering events.", "Appendix I"]
    - ["A-OP-05", "Cashiering is the single payment intake; New Business placement uses its result.", "FRS.CSH.05.04"]
    - ["A-OP-09", "Where BRD v1.01 and a May 2026 annex differ, the annex governs.", "Introduction"]
  dependencies:
    - ["D-OP-01", "BDOI gives the layouts of the channel files not yet given (PMS, Direct Credit, Commission Schedule, positions of the Bills Payment file).", "FRS.CSH.05.01.06; Appendix D"]
    - ["D-OP-02", "BDOI gives the BIR-registered AR and OR series and formats (ATP).", "FRS.CSH.02.03"]
    - ["D-OP-03", "Comptrollership gives the GL accounts of the entries and the source of the exchange rate.", "Appendix I"]
    - ["D-OP-04", "The BIBS Collections and Disbursement modules (BRD-4, BRD-5) are in use for the requests, refunds and settlements.", "FRS.CSH.06.03, 07.01, 10.01"]
    - ["D-OP-07", "The e-mail relay of the BIBS environment is available for the failed-run e-mail.", "Appendix G"]
  open_header: ["No.", "Our reference", "Question", "Why it matters (BRD)", "Format of the answer", "Owner", "Needed by"]
  open:
    - {refs: "OQ15", q: "Which disposition types need Team approval, and who approves each (Cashiering TL only, or the Marketing Unit Head for its unit)?", why: "CSHID.024 asks for approval of dispositions; FRS.CSH.06.02.02 lists For Approval \"if disposition needs approval\" without saying which.", fmt: "Per disposition type: Yes / No and the approver role", owner: "Cashiering Process Owner", by: 2026-12-01}
    - {refs: "OQ03", q: "Give the layouts not in BDOI's FRS: the PMS post-dated check file (header and details), the Direct Credit file, the Commission Schedule fields, and the meaning of positions 7 to 13 of the Bills Payment file.", why: "CSHID.008; FRS.CSH.05.01.06 and FRS.CSH.02.02.07 leave them blank.", fmt: "One real file of each channel and its field list", owner: "Cashiering Process Owner; BDOI IT", by: 2027-01-31}
