# ---------------------------------------------------------------------------------- Appendix T change control
change_control:
  intro: >-
    Once this FRS is signed it is the baseline of Operations Cashiering (section 1.3). This appendix says what the
    signature freezes, how a change is raised and decided, and where it is recorded: the Change Request Register
    workbook of BRD-02 Operations Cashiering.
  freezes:
    - "The functional requirements of section 3 with their acceptance criteria, and the Business Requirements Mapping of section 2."
    - "The screens, fields, actions, messages and walkthroughs (Appendices E, F and K), the notice and e-mail texts (Appendix G), the document formats (Appendix L), the reports and schedules (Appendix M) and the file layouts (Appendix D)."
    - "The workflow and approvals (Appendix J), the business rules and the default entries (Appendices H and I) and the integrations at business level (Appendix N)."
  not_frozen: >-
    Not frozen: the content of the configuration - users and roles, receipt series, bank accounts, branches, list
    values, the thresholds and parameters of Appendix H and the accounts of the entries. They change in the system
    through audited, maker-checker changes, without a change request.
  steps_header: ["Step", "What happens", "Who", "Record"]
  steps:
    - ["1 Raise", "The change is written with the BRD ID, the FR item or appendix concerned, the reason and the business priority", "Any signatory or the Cashiering Process Owner", "Register: new row, status Raised"]
    - ["2 Assess", "Impact on scope, schedule, cost (mandays), the other BRDs (interfaces of Appendix N), the test cases and the training", "iorta TechNXT Project Team with the System Analyst (BDO ITG)", "Impact assessment form; status Assessed"]
    - ["3 Approve", "Decision by the owners of every BRD touched; a change to an entry or a tax rule also by Comptrollership; a change to an interface also by BDOI IT", "Business owner; Cashiering Process Owner; Comptrollership; BDOI IT", "Decision, approved by, date; status Approved or Rejected"]
    - ["4 Schedule", "The change is given a drop and a version of this FRS (3.3, 3.4 and so on)", "Project managers", "Target drop; status Scheduled"]
    - ["5 Test", "The test cases linked to the change are updated and run", "Test lead; Business Unit testers", "Linked test cases; result"]
    - ["6 Close", "The new version of the FRS and of the workbooks is issued with the change marked", "System Analyst (BDO ITG)", "Status Closed"]
  candidates: >-
    The Change Request Register is seeded with the candidate changes already known - the points where this FRS or
    BDOI's FRS goes beyond the BRD text - with the status "Candidate - for decision", and with one decision row per
    observation of Appendix R so that the Business Unit records its decision on each.

