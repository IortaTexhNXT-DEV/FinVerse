glossary_add:
  - ["Business Unit review edition", "This version of the FRS with the summary, flows and appendices the Business Unit needs to sign it"]
  - ["Maker-checker", "A control where the user who makes a record is not the user who posts, approves or authorises it"]
  - ["Notice", "A message given in the system under the bell in the page header, which opens its record"]
  - ["Alert", "A message in the alert inbox of a role, for a condition that needs action"]
