# Operations Cashiering FRS in BDOI's template, version 3.3: the content of this round. Read by brd02_v33.py and
# build_brd02_workbooks.py. Same layout as brd03_v13.yaml (see there for the meaning of each key).

revision_row: ["11 Oct 2026", "3.3", "Simplified and end-to-end swimlane process flows; colour coding of the points not in the BRD (green: available in the iNXT BrokerVerse OOTB edition; orange: change request); Appendix W with the change requests and their effort, the points beyond the BRD available OOTB in iNXT BrokerVerse and the check of the BRD non-functional lines; Appendix O: BRD maintenance and disaster lines and programme NFRs 10.07 and 4.03 added, peak hours aligned with the BRD", "iorta TechNXT Project Team (drafting support)"]

intro_note: "Version 3.3 adds the simplified process flow (Figure 1, section 1.4) and the end-to-end process flow by actor and system (Figure 2, Appendix C) with the change requests marked; it colours the points of this FRS that are not requirements of the BRD (section 1.5); it adds Appendix W with the change requests and their effort, the points beyond the BRD that the iNXT BrokerVerse OOTB edition already provides, and the check of the non-functional lines of the BRD. BDOI's text and the content of version 3.2 are otherwise unchanged."

how_to_read:
  title: How to Read this Document
  intro: "Most of this FRS states requirements of the Operations BRD for Cashiering (BRQID and CSHID IDs, and its non-functional table) or of the programme-wide non-functional requirements of the BDOI addenda. BDOI's own text (version 3.1) is kept word for word. Where version 3.2 or 3.3 states a point that is not a BRD requirement, the point is coloured where it is stated, so that the Business Unit sees at once what goes beyond the BRD and whether it costs anything. Out of the box (OOTB) means the iNXT BrokerVerse OOTB platform (brokerverse-platform), checked against the platform itself with the programme Feature List as a cross-check, not the work done for BDOI in this project:"
  legend:
    - [black, "Black text", "A BRD requirement, BDOI's own FRS text, or the detail needed to meet a BRD requirement.", "In scope"]
    - [green, "Green text", "Not in the BRD, and available out of the box in the iNXT BrokerVerse OOTB platform. No development needed; the Business Unit may keep or drop it.", "No cost; listed in Appendix W.3"]
    - [grey, "[Integration scope] / [Data Migration scope]", "Grey label on an interface with another system or on a data load at go-live: covered by the Integration scope or the Data Migration scope (BRD-13), not a change request.", "Listed in Appendix W.5"]
    - [blue, "Blue table", "Insurance-broking best practice for this area that is not in the BRD, this FRS or the OOTB platform: a recommendation with an indicative effort, not a commitment.", "Appendix W.6; not in the change request total"]
    - [orange, "Orange text", "Not in the BRD and not available, or only partly available, in the iNXT BrokerVerse OOTB platform edition: a change request (CR-CSH-1nn), even where it was already delivered for BIBS in this project. It is delivered only if the Business Unit approves it.", "Effort in Appendix W.2 and the CR effort workbook"]
  after: "In the end-to-end process flow (Figure 2, Appendix C) the change requests are tagged: yellow for a change request not in any BRD, blue for a change request that extends a BRD requirement, green for a point that is already a BRD requirement (the programme NFRs 10.07 and 4.03). The walkthroughs and screenshots use the BIBS DEV environment: https://dev.brokerverse.cloud."

figures:
  simple: {png: csh_simple, caption: "Operations Cashiering – simplified process flow (swimlanes by actor, stages across)", read: "Each lane is an actor or system and the columns are the stages of a payment, from its receipt to the reports. The end-to-end flow with every unit and the change requests is Figure 2 (Appendix C); each process is drawn in detail in Appendix C.", brd: "BRQID and CSHID IDs of the Cashiering scope"}
  e2e: {id: brd02_fig_e2e_swimlane, png: csh_e2e, caption: "End-to-end process flow of Operations Cashiering (all actors and systems)", read: "The lanes are the payors and channels, the Cashier, the Approver / Poster, BIBS, Marketing, the accounting units, Disbursement and the reports and audit; the tags name the change requests of Appendix W.2 (blue: extends a BRD requirement; yellow: not in any BRD) and the programme NFRs that are BRD requirements (green). The figures that follow draw each process in detail.", brd: "BRQID and CSHID IDs of the Cashiering scope; programme NFRs 10.07 and 4.03"}

