points:
  # Classified against the code of the iNXT BrokerVerse OOTB platform (brokerverse-platform), with the programme
  # Feature List as a cross-check. Green = not in the BRD and available OOTB; orange = not in the BRD and partial or
  # not available OOTB. The run report of each automatic payment run is a BRD requirement (BRQID.006) and stays black.
  # The payment channel simulator of SIT and UAT is an interface tool: Integration scope (grey label).
  # ---- class brd: former green points that a BRD line asks for (product owner decision of 11-Oct-2026: BRD-00
  # and programme NFRs count; elaboration of a BRD line stays in the BRD): black, in scope, offered OOTB, no effort
  # ---- green
  - {id: G-01, class: brd, brd_line: "CSHID.023 \"Capability to generate reports. See Cashiering Reports list under Annex\"; Report List (Operations - Cashiering): \"Daily Cash Reconciliation Reports - Summarizes daily cash receipts and deposits\", frequency \"Daily\"", frs: "FRS.CSH.09.02.10; Appendix M", fl: "RPT-007 Available (user-scheduled reports with recipients)", ev: "Reports > Schedules: timing, format and recipients", match: "Daily, after the close of the business day (proposed 18:30); on demand", title: "Scheduled daily run of the Daily Cash Reconciliation Reports", where: "Report schedules"}
  - {id: G-01b, class: ootb, frs: "FRS.CSH.09.02.11; Appendix M", fl: "RPT-007 Available (user-scheduled reports with recipients)", ev: "Reports > Schedules: timing, format and recipients", match: "On demand; weekly (proposed Monday 08:00)", title: "Scheduled weekly run of the Unapplied Premium Payment Transaction report", where: "Report schedules"}
  # ---- orange: change requests
  - {id: CR-CSH-101, class: cr, match: "Proposed: posted the same business day"}
  - {id: CR-CSH-101b, class: cr, match: "Proposed: posted within 1 working day"}
  - {id: CR-CSH-101c, class: cr, match: "Proposed: disposition assigned within 2 working days"}
  - {id: CR-CSH-101d, class: cr, match: "Proposed: decided within 1 working day"}
  - {id: CR-CSH-101e, class: cr, match: "Proposed: 1 working day", exact: true}
  - {id: CR-CSH-102, class: cr, match: "the user may also choose an e-mail copy on Notification Settings"}

crs:
  - cr: CR-CSH-101
    brd_check: "None found: CSHID.024 asks to track the status of dispositions (pending, in process); no BRD line sets a time for posting or approval"
    ev: "not found for receipts: deadlines exist for claims, leads and collections only"
    title: "Time rules of the Cashiering stages: overdue marker and reminder"
    frs: "Appendix J (time rules); FRS.CSH.02.05, FRS.CSH.03.01, FRS.CSH.04.01, FRS.CSH.06.02"
    brd: "Not in BRD"
    tag: NEW
    fl: "WFL-007 Partial (deadlines and escalation for claims, complaints, leads and collections; no general turnaround engine)"
    built: "No: BIBS shows the records For Posting and For Approval with their age, without a time rule"
    source: "FRS v3.2 Appendix J (times proposed by iorta TechNXT; the BRD and BDOI's FRS set no time)"
    why: "Records waiting for posting or approval are visible on the dashboard but nothing marks them late; a time rule per stage with a marker and a reminder keeps receipts issued the same day."
    ootb: "Partial in BrokerVerse OOTB; the effort covers the missing part only: time rules, overdue marker and reminder for the Cashiering stages."
    md: [1.0, 2.5, 1.0, 1.5, 0.5]
    complexity: Medium
    priority: Medium
    deps: "BDOI to confirm the times (Appendix R, Appendix S)"
    assumptions: "Four stages (posting, cancellation / reinstatement posting, disposition, approval); times as parameters; one reminder to the poster or approver; no escalation."
    basis: "Turnaround parts of the platform reused; Cashiering decision services and dashboard counts extended."
  - cr: CR-CSH-102
    brd_check: "None found: CSHID.019 AC7 asks for a notice when a document fails to print; no BRD line gives users a choice of channel"
    ev: "Notifications: in-app notices; no per-user choice of an e-mail copy"
    title: "Each user chooses an e-mail copy of the Cashiering notices"
    frs: "Appendix G (channel of each notice)"
    brd: "Not in BRD"
    tag: NEW
    fl: "WFL-011 Available (e-mail notifications from templates); WFL-012 Partial. Disagreement: the Feature List says Available, the OOTB code has no per-user e-mail choice"
    built: "Yes: the Notification Settings screen of BIBS gives this choice"
    source: "FRS v3.2 Appendix G (proposed, Appendix R)"
    why: "Team Leaders who post from branches want the notices also by e-mail; the choice per user and per notice avoids e-mail floods."
    ootb: "Partial in BrokerVerse OOTB; the effort is that of the missing part (per-user, per-notice e-mail choice)."
    md: [0.5, 1.0, 1.0, 0.5, 0.5]
    complexity: Low
    priority: Low
    deps: "E-mail channel of BDOI"
    assumptions: "Choice per user and per notice type; default in-app only."
    basis: "Notification service of the platform; one settings screen."

# BDOI FRS points first proposed as change requests and found to be covered, fully or partly, by a BRD line:
# BRD requirements (black, in scope); their gap against the OOTB platform is delivery work, with planning effort.
brd_deliver:
- id: D-CSH-01
  title: E-mail to a recipient list when a scheduled Cashiering run fails
  brd: 'BRQID.005 AC5: ''System alerts users in case of failed data fetch or mismatched data''; BRQID.006 batch job processing'
  frs: FRS.CSH.10.03; Appendix G (failed batch run)
  fl: WFL-013 Partial (a failed job raises an in-app notification to the schedule administrators; no e-mail to a recipient list)
  gap: Partial in BrokerVerse OOTB; the planning effort is that of the missing part (e-mail to a recipient list).
  md: 2.5
- id: D-CSH-02
  title: Excel export of the Cashiering lists
  brd: 'CSHID.017 AC4: ''Download reports in supported formats (e.g., PDF, Excel)''; CSHID.023 ''Capability to generate reports'''
  frs: FRS.CSH.01.03.04
  fl: 'BIL-016 Available (receipts register with filters); RPT-003 Partial. Disagreement: the Feature List says Available, the OOTB code exports the receipt list to PDF only'
  gap: Partial in BrokerVerse OOTB; the planning effort is that of the missing part (Excel export of the lists).
  md: 3.0

