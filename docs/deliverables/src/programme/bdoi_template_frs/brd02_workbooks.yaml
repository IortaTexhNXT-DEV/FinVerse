# ------------------------------------------------------------------------------------------------ fit-gap
fit_values: [Fit, Configure, Extend, Recommend change, Removed from the BRD, Specified in another FRS]
fitgap_groups:
  - ids: [BRQID.001, BRQID.002]
    name: Log-in and access by role
    features: []
    fit: Configure
    ootb: "Sign-in, roles and permissions per action and segregation of duties are standard; the Cashiering permissions are given to the roles by configuration (Appendix H)."
    best: "Least privilege and four eyes on every cash movement; access only from managed devices (BSP IT risk management guidelines; ISO 27001 access control)."
    rec: "Confirm the access matrix in the User Access Maintenance FRS; enforce BDO-issued devices through the network policy."
    impact: "FRS.CSH.01.01, 01.02; Appendix H"
  - ids: [BRQID.003]
    name: Cashiering dashboard
    features: []
    fit: Extend
    ootb: "Role home pages with live work counts are standard; the Cashiering dashboard with count and amount per receipt type and status is an extension (the counts are available, the amounts per type follow BDOI's FRS.CSH.01.03.02)."
    best: "A cashier's work queue by status with amounts, so that the day closes with nothing For Posting."
    rec: "Add the amounts and the per-type items of BDOI's dashboard."
    impact: "FRS.CSH.01.03"
  - ids: [BRQID.004, BRQID.005]
    name: Integrations and flow-in
    features: [INT-006]
    fit: Extend
    ootb: "File uploads with runs, records and alerts, and the exchanges between the BIBS modules are standard; the MFT intake of the OBPCS and PMS files is an extension to agree with BDOI IT."
    best: "Bank and channel files received automatically through the bank's managed file transfer, with control totals and a missing-file alert."
    rec: "Agree the MFT folders and times with BDOI IT (Appendix S)."
    impact: "FRS.CSH.05.01.04, 10.01, 10.02; Appendix N"
  - ids: [BRQID.006]
    name: Batch runs past failed records
    features: []
    fit: Fit
    ootb: "Every upload and scheduled run processes each record on its own, logs the failed records and reports the run; failed runs are e-mailed."
    best: "Partial processing with reprocessing of corrected rows and a run report; never a whole batch lost for one row."
    rec: "Keep line-level processing also for the Commission Schedule (Appendix R, C10)."
    impact: "FRS.CSH.05.01.12, 10.03"
  - ids: [BRQID.007]
    name: Payment history at invoice level
    features: [BIL-020]
    fit: Fit
    ootb: "Each booked account keeps its payment and remittance history with the AR numbers, view-only outside Cashiering."
    best: "One view of an account with its payments, remittances and adjustments for every team."
    rec: "None."
    impact: "FRS.CSH.08.01, 08.02"
  - ids: [CSHID.001]
    name: Acknowledgement Receipts (premium and non-premium)
    features: [BIL-003]
    fit: Extend
    ootb: "Receipts with payor, references, amount, currency and mode, matched and applied at once, are standard; the posting step by a second user, the entry type and the bank account of BDOI's FRS are extensions (Appendix R, C1)."
    best: "A receipt given to the payor at once, from a BIR-registered series; premium received by a broker held in trust for the insurer and identified to the insurer."
    rec: "Decide C1: issue at save with a daily review, or keep the posting step as a configurable approval."
    impact: "FRS.CSH.02.01, 02.05"
  - ids: [CSHID.002]
    name: Official Receipts for BDOI income
    features: [BIL-004, TAX-013]
    fit: Configure
    ootb: "Head Office receipts of income with VAT and withholding tax lines and the income account of each type are standard; the types are a maintained list."
    best: "Under the Ease of Paying Taxes Act (RA 11976) the invoice is the primary document for services; series and forms registered with the BIR."
    rec: "Comptrollership (Tax) confirms the document name, form and series (Appendix R)."
    impact: "FRS.CSH.02.02, 02.06; Appendix L"
  - ids: [CSHID.003, CSHID.004, CSHID.005]
    name: Cancellation and reinstatement with reasons
    features: [BIL-005, BIL-022]
    fit: Extend
    ootb: "Cancellation and reinstatement as requests with a reason, approved by a second user, with reversal entries, are standard; the remitted / not remitted branches and AP Unapplied Commission of BDOI's FRS are extensions."
    best: "Every reversal of a receipt approved by a second person, with the reason, and the remitted premium recovered from the insurer."
    rec: "Decide C2 (meaning of reinstatement) and C9 (remitted AR)."
    impact: "FRS.CSH.03.01, 04.01"
  - ids: [CSHID.006, CSHID.015]
    name: Receipt numbering per branch and depletion
    features: [BIL-006]
    fit: Configure
    ootb: "Series per branch and kind with ATP, range, warning level and maker-checker; numbering under a lock and a depleted-series stop are standard."
    best: "Sequential numbers without gaps from the BIR-registered series; alert before depletion."
    rec: "BDOI gives one format per receipt kind (Appendix R, C4)."
    impact: "FRS.CSH.02.03, 02.05.08, 02.05.09"
  - ids: [CSHID.007]
    name: Commission ORs
    features: [COM-003]
    fit: Extend
    ootb: "Commission payment details uploaded and issued as ORs per insurer and certificate are standard; the Commission Schedule matching and the trigger at the Disbursement approval of BDOI's FRS are extensions."
    best: "One OR per insurer and settlement with the commission, VAT and withholding tax per account."
    rec: "Decide C11 and C12."
    impact: "FRS.CSH.02.02, 02.05.14, 07.01"
  - ids: [CSHID.008]
    name: Payment files and post-dated checks
    features: [BIL-007, BIL-008, INT-006]
    fit: Extend
    ootb: "Uploads of the channel files with configurable layouts, duplicate refusal and the post-dated check warehouse with its daily maturity are standard; MFT intake, several files per event, file-name and header total checks are extensions."
    best: "Channel files received automatically with control totals; post-dated checks warehoused and turned into payments on maturity."
    rec: "BDOI gives the layouts not yet given (Appendix S); decide C8 (Direct Credit) and C15 (PDC source)."
    impact: "FRS.CSH.05.01, 05.02; Appendix D"
  - ids: [CSHID.009, CSHID.026, CSHID.027]
    name: Removed from the BRD
    features: []
    fit: Removed from the BRD
    ootb: "Not offered for Cashiering (check pick-up and the Cashiering BIR 2307 processing are withdrawn)."
    best: "-"
    rec: "None."
    impact: "Section 2 (rows added with the reason)"
  - ids: [CSHID.010, CSHID.011]
    name: Search and audit trail
    features: [BIL-016]
    fit: Fit
    ootb: "Receipt search on the ten criteria, a search log and an audit trail that no user can change are standard."
    best: "The seven items of the IT audit trail standard, refused actions included."
    rec: "Confirm the audit items and the search log retention (Appendix S)."
    impact: "FRS.CSH.08.01, 08.03"
  - ids: [CSHID.012, CSHID.013, CSHID.014]
    name: Accounting entries
    features: [BIL-017, ACC-002]
    fit: Configure
    ootb: "Every Cashiering event posts a balanced journal through rules maintained by Comptrollership; no account is fixed in the system."
    best: "Rules owned by the controller with maker-checker; foreign currency at the official rate with two decimals."
    rec: "Comptrollership gives the accounts of Appendix I."
    impact: "Appendix I"
  - ids: [CSHID.016]
    name: Minimal balances
    features: [BIL-013]
    fit: Configure
    ootb: "Minimal balances cleared when the payment is processed with a configurable threshold and the three exceptions are standard."
    best: "Small differences cleared automatically under a threshold approved by the controller, never left in the unapplied list."
    rec: "Decide the threshold (Appendix R, C5)."
    impact: "FRS.CSH.02.05.12"
  - ids: [CSHID.017, CSHID.018, CSHID.023]
    name: Reports
    features: [BIL-018]
    fit: Extend
    ootb: "Reports with separate view and export rights and an archive of every run are standard; the layouts of BDOI's FRS.CSH.09.02 are set up as report layouts."
    best: "Daily cash reconciliation and ageing of unapplied payments for management."
    rec: "BDOI confirms the filters and timing of Appendix M."
    impact: "FRS.CSH.09; Appendix M"
  - ids: [CSHID.019]
    name: Batch printing
    features: [BIL-015]
    fit: Extend
    ootb: "Batch printing of receipts with a print log is standard; the ZIP of single PDFs, the certificate number and the REPRINT mark of BDOI's FRS are extensions."
    best: "Re-printed receipts visibly marked; every print logged."
    rec: "Confirm the certificate number convention (Appendix R, C4)."
    impact: "FRS.CSH.02.04"
  - ids: [CSHID.020]
    name: Matching at acceptance and pre-booked payments
    features: [BIL-009, BIL-011]
    fit: Extend
    ootb: "Matching on the account references with pre-booked, excess, unmatched and cancelled-reference outcomes is standard; the legacy numbers as keys and the Direct Credit identification of BDOI's FRS are extensions."
    best: "Straight-through matching of bank payments with the legacy references of migrated accounts."
    rec: "Load the legacy numbers with the migrated accounts (Appendix P)."
    impact: "FRS.CSH.05.01.08, 05.03, 05.04"
  - ids: [CSHID.021]
    name: Non-premium payments of insurers
    features: [BIL-014]
    fit: Fit
    ootb: "Non-premium receipts of insurers posted to AR Insurer the same day, apart from client premium."
    best: "Insurer refunds kept apart from client trust money."
    rec: "None."
    impact: "FRS.CSH.02.01.15"
  - ids: [CSHID.022]
    name: Application hierarchy
    features: [BIL-010, TAX-018]
    fit: Configure
    ootb: "Application by component in a fixed order (DST, VAT, LGT, FST, other charges, basic premium), never to the premium due to the insurer."
    best: "Taxes collected first so that DST, VAT and LGT are always covered; order confirmed with the insurers."
    rec: "Decide C6 (FST and check before cash)."
    impact: "FRS.CSH.02.05.11"
  - ids: [CSHID.024, CSHID.025]
    name: Unapplied payments and dispositions
    features: [BIL-012]
    fit: Extend
    ootb: "Unapplied workbench with disposition types, approval rule per type, tabs by status, reversal and refund to Disbursement is an extension of BIBS, available in the BIBS environment."
    best: "Every unapplied amount owned, aged and disposed with approval; refunds paid only by Disbursement."
    rec: "Decide C13 and C14 and the types needing approval (Appendix S)."
    impact: "FRS.CSH.06"
  - ids: [MKTID.013, DBMID.001]
    name: BIR 2307 reversal and certificates
    features: []
    fit: Specified in another FRS
    ootb: "Specified in the FRS of Marketing Collection and Disbursement; Cashiering keeps the PR 2307 outstanding at payment."
    best: "The certificate validated against the computed amount before the premium receivable is reversed."
    rec: "Confirm the owner FRS (Appendix R)."
    impact: "FRS.CSH.02.05.13"
fitgap_nfr: {fit: Configure, rec: "Confirm the values of Appendix O (Appendix S)."}

