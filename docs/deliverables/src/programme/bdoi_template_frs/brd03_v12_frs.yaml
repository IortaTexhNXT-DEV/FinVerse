observations:
  - ref: "FRPM.004.01"
    topic: "Expiry alert days: 90 days in BDOI's FRS"
    bdoi: "FRPM.004.01: alerts beginning 90 calendar days before the package expiry date and the anniversary date."
    brd: "BRPM.017: TSU monitors the expiry or anniversary date of each package."
    proposes: "The alert days are a configurable value; the go-live value is set to BDOI's 90 days (the BIBS delivered value is 60 with reminders at 30 and 7 days). The anniversary alert is added to the daily check."
    impact: "Configuration value at go-live; anniversary alert to be made available."
    role: [TSU]
  - ref: "FRPM.014.01"
    topic: "ManCom e-mail through Microsoft 365"
    bdoi: "FRPM.014.01: e-mail notifications to all selected approvers via Microsoft 365; the President after the other approvers."
    brd: "BRPM.015: ManCom review and in-system sign-off."
    proposes: "Annex P gives the proposed texts NT-13 and NT-14 for BDOI's approval; the e-mail channel of BDOI is an integration input (Annex S, IN-08)."
    impact: "Wording and channel of the ManCom e-mails."
    role: [MANCOM, ITG]
  - ref: "FRPM.007.01"
    topic: "Weekly run of the Consolidated Placement Update Report"
    bdoi: "FRPM.007.01: generated automatically every Thursday at 8am; stored in a repository."
    brd: "BRPM.018: Placement Update Reports for individual accounts and collectively."
    proposes: "The report runs on request and its runs are kept; the scheduled weekly run with its repository and notice (NT-17, proposed) is planned with the report scheduling of the platform."
    impact: "Until the scheduled run is available, TSU runs the report on Thursday morning."
    role: [TSU, ITG]
  - ref: "FRPM.017.01"
    topic: "Notice to the original assignee on reassignment"
    bdoi: "FRPM.017.01: the system notifies the replacement and the original reviewer or approver."
    brd: "BRPM.021: workflow enforcement."
    proposes: "The notice to the new assignee is sent (NT-10); the notice to the original assignee is proposed (NT-15)."
    impact: "One more notice."
    role: [SA]
  - ref: "FRPM.021.01"
    topic: "Old and new values of changed master records in the audit logs"
    bdoi: "FRPM.021.01: audit logs with Old Value and New Value."
    brd: "BRPM.024: audit trail for all actions and changes."
    proposes: "The audit trail records every action with the user and time; the field-by-field old and new values of changed product masters are planned with the programme master data change log."
    impact: "Reviewers of master changes see old and new values."
    role: [SA, ITG]
  - ref: "Open questions"
    topic: "Open questions answered by BDOI's FRS"
    bdoi: "BDOI's FRS states the Marketing approval chain (TL, TH, UH), the ManCom routing, the Placement Update Report columns, the client-view fields, the status names, the sign-in reference and the non-package scope."
    brd: "-"
    proposes: "The open questions of the earlier reviews that BDOI's FRS answers are no longer asked (Annex V); they are listed with BDOI's clause in the traceability workbook (sheet 'Answered in the BDOI FRS'). Where BDOI's answer differs from the earlier proposal, the point is in M.1 (C05, C17, C03, C16)."
    impact: "Fewer open questions for the Business Unit."
    role: [PO, SA]
  - ref: "Annex P"
    topic: "Rate exception notice added to the notifications"
    bdoi: "Not stated."
    brd: "BRPM.007: outdated rates cannot be selected for new business."
    proposes: "The notice sent by BIBS when a rate exception is approved or rejected (NT-12) is added to Annex P."
    impact: "Completeness of the notification texts."
    role: [MKT]
  - ref: "Annex T"
    topic: "Non-functional values to confirm"
    bdoi: "Not stated in BDOI's FRS."
    brd: "BRD non-functional table: users, response time under 5 seconds, availability 99.9%, recovery 4 hours."
    proposes: "Annex T aligns the BRD values with the programme register; volumes, retention and accessibility are proposed values for BDOI to confirm (PQ18)."
    impact: "Sizing and tests of the module."
    role: [PO, ITG]
