# ------------------------------------------------------------------------------------------------ Annex W
change_control:
  intro: "How the content of this FRS is controlled once it is signed (BDOI's 'Document Preparation, Review and Approval': changes are governed by the project's change management process)."
  freezes:
    - "The functional requirements FRPM.001 to FRPM.030 with their acceptance criteria, and the Business Requirements Mapping."
    - "The process flows, the workflow and approvals (Annex O), the screens (Annex G), the messages (Annex H), the e-mail and notification texts (Annex P), the documents (Annex Q), the reports and schedules (Annex R) and the integrations (Annex S)."
    - "Not frozen: the content of the configuration (products, versions, rates, clauses, lists, parameters such as service levels and alert days, templates), which authorized users maintain under maker-checker without a change request."
  steps:
    - ["1 Raise", "The business owner raises the change in the change request register with the BRD ID, the FRPM item, the reason and the priority.", "Business owner (Head of the unit)", "Same day"]
    - ["2 Assess", "The iorta TechNXT Project Team assesses the impact on scope, schedule, cost (mandays), the other BRDs (through the integrations of Annex S) and the tests.", "iorta TechNXT Project Team; BDO ITG System Analyst", "5 working days"]
    - ["3 Approve", "The owners of every BRD the change touches, the Product Owner and the Program Manager (BPS) approve or reject it.", "Product Owner; Program Manager BPS; owners of the BRDs touched", "At the weekly change board"]
    - ["4 Schedule", "An approved change is assigned to a drop and to a version of this FRS.", "Program Manager BPS; iorta TechNXT Project Manager", "At approval"]
    - ["5 Test", "The test cases of the traceability workbook are updated and run; the Business Unit retests the changed rows.", "iorta TechNXT test lead; Business Unit testers", "Within the drop"]
    - ["6 Close", "This FRS is re-issued (1.3, 1.4 ...) with the changed passages marked, and the delta is signed.", "System Analyst; signatories of this FRS", "End of the drop"]
  register: "BIBS_CR_BRD-03_Change_Request_Register_v1.0.xlsx (sheet Register; the candidate changes already known are listed with the status 'Candidate - for decision')"

