# ------------------------------------------------------------------------------------------------ Annex P
notifications:
  intro: "Every e-mail and in-system notice of Product Maintenance: what triggers it, who receives it, the channel, the subject and the full text with the parts the system fills in shown in angle brackets, the attachments, the protection and how often it is sent. 'Sent by BIBS' texts are quoted word for word from the BIBS environment; 'Proposed' texts are the wording proposed by the iorta TechNXT Project Team where BDOI's FRS asks for a notice and has not given its text, for BDOI to approve (Annex X). Documents e-mailed outside the system are password protected and the password follows in a separate e-mail (FRPM.027.01)."
  items:
    - id: NT-01
      name: Package request moved to another stage
      trigger: "Any workflow action on a package request: submit, approve, recommend, return, reject or void, terms final, ManCom approval, set-up, the release or return of its version"
      recipients: "The creator of the request and its current assignee (not the user who made the move)"
      channel: In-system notice
      subject: "<request no.>: <new stage name>"
      body: "<request description> - <comment typed with the action>"
      attachments: "None; the notice opens the request"
      protection: "-"
      frequency: "Once per workflow action"
      source: Sent by BIBS
      frpm: "FRPM.003.03, FRPM.011.02, FRPM.011.03, FRPM.012.01, FRPM.014.01, FRPM.029.01"
      platform: "workflow stage change"
    - id: NT-02
      name: Package available
      trigger: "A package version set up from a request is validated and released"
      recipients: "Marketing users who create quotations"
      channel: In-system notice
      subject: "Package available: <risk code>"
      body: "<package name> (version <n>) sells from <effective date dd-MMM-yyyy>."
      attachments: "None; the notice opens the package request"
      protection: "-"
      frequency: "Once per release"
      source: Sent by BIBS
      frpm: "FRPM.003.03, FRPM.016.02, FRPM.029.01"
      platform: "Package available: "
    - id: NT-03
      name: Package advisory (in-system)
      trigger: "TSU sends an advisory (Send Advisory)"
      recipients: "The users of each recipient group chosen: Marketing, Technical Support Unit, Marketing Business Services, Processing, Operations"
      channel: In-system notice
      subject: "<advisory subject>"
      body: "<advisory text as edited by TSU>"
      attachments: "The advisory PDF and the supporting documents are listed on the request"
      protection: "-"
      frequency: "Once per advisory sent"
      source: Sent by BIBS
      frpm: "FRPM.025.01"
      platform: "advisory notice"
    - id: NT-04
      name: Package expired
      trigger: "The daily check finds a package whose expiry date has passed without a released renewal; the package becomes Inactive"
      recipients: "TSU users and MBS users"
      channel: In-system notice
      subject: "Package expired: <risk code>"
      body: "Version <n> ended on <expiry date dd-MMM-yyyy> without a renewal; the package is no longer sold for new business."
      attachments: "None; the notice opens Package Expiry"
      protection: "-"
      frequency: "Once per package"
      source: Sent by BIBS
      frpm: "FRPM.003.05, FRPM.029.01"
      platform: "Package expired: "
    - id: NT-05
      name: Package Quotation Slip to insurers
      trigger: "A Quotation Slip is approved and sent (Approve and Send), or resent to one insurer (Resend)"
      recipients: "The placement e-mail addresses of each insurer of the round"
      channel: E-mail
      subject: "Package quotation slip <PQS no.> - <package name>"
      body: "Dear <insurer>,\n\nPlease find attached our package quotation slip <PQS no.> (round <n>) for <package name>. Kindly send your best terms on or before <reply date>. The document is password protected; the password follows separately.\n\nBDO Insurance and Reinsurance Brokers, Inc."
      attachments: "The Quotation Slip (PDF)"
      protection: "Password protected; password in NT-07"
      frequency: "Once per insurer per send or resend; each send logged on the E-mails tab"
      source: Sent by BIBS
      frpm: "FRPM.012.01, FRPM.027.01"
      platform: "Package quotation slip "
    - id: NT-06
      name: Package advisory (e-mail)
      trigger: "An advisory is sent with e-mail addresses entered in E-mail to"
      recipients: "The addresses entered on the advisory"
      channel: E-mail
      subject: "<advisory subject>"
      body: "<advisory text>\n\nThe advisory is attached (password protected; the password follows separately).\n\nBDO Insurance and Reinsurance Brokers, Inc."
      attachments: "The advisory (PDF) with the list of supporting documents kept in the system"
