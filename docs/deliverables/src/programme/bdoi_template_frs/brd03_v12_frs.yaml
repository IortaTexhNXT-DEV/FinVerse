# ------------------------------------------------------------------------------------------------ Annex Q
documents:
  intro: "Every document Product Maintenance prints, e-mails or exports: purpose, recipients, format, protection, the fields in order, and the current layout in the BIBS environment where one exists. Where BDOI has not given its layout, the layout is to be provided by the Business Unit; the item number of the Business Unit requirements-collection workbook (BIBS_Inputs_BRD-03) is given. BDOI's own templates (Annex D and Annex F) are loaded as the Quotation Slip layouts."
  items:
    - id: DO-01
      name: Package Request Form
      purpose: "Record of a package request with its requested terms and approvals"
      recipients: "Internal: Marketing, TSU, MBS (kept in the system)"
      format: "PDF"
      protection: "Not e-mailed; kept in the system"
      fields: "Request number, type, scope, date, requester; client or programme; line, cover type, product; reason; requested terms by section; coverages (included, limit, deductible); rate scheme and package dates; target insurers; approvals with names and dates; signature lines Prepared by and Approved by"
      image: "BRD-03:doc-request-form"
      layout: "Draft layout in BIBS; BDOI layout to be provided (RC-DOC-01)"
      frpm: "FRPM.011.02, FRPM.030.01"
    - id: DO-02
      name: Package Quotation Slip
      purpose: "Request for terms sent to each insurer of a negotiation round"
      recipients: "Insurers (placement e-mail)"
      format: "PDF, one per insurer per round; file name QS_<Reference Number>_<Insurer>_MMDDYYYY.pdf (BDOI's convention)"
      protection: "Password protected when e-mailed (NT-05, NT-07)"
      fields: "As BDOI's Annex F template of the line; slip number PQS-yyyy-nnnnnn, round, reply date; requested cover by section; coverages; rate and minimum premium; period; contact"
      image: "BRD-03:doc-quotation-slip"
      layout: "BDOI's Annex F templates (given)"
      frpm: "FRPM.012.01, FRPM.027.01"
    - id: DO-03
      name: Comparative Table (master and client view)
      purpose: "Side-by-side comparison of the insurer responses; the master is kept for audit, client views are derived from it"
      recipients: "Internal (master); client (client view, through Marketing)"
      format: "PDF and Excel (.xlsx)"
      protection: "Password protected when e-mailed"
      fields: "Title (Audit master or client view title), request, round; one column per insurer (and the QS value column); rows per selected field: outcome, rate, minimum premium, coverages, deductibles, conditions and warranties, valid until, remarks; lowest rate marked"
      image: "BRD-03:doc-comparative"
      layout: "Draft layout in BIBS; client layout to be provided (RC-DOC-02)"
      frpm: "FRPM.006.02, FRPM.012.02, FRPM.012.04"
    - id: DO-04
      name: Package slip
      purpose: "Agreed package terms, printed, signed and uploaded before the ManCom approval"
      recipients: "Internal: TSU, ManCom, MBS"
      format: "PDF"
      protection: "Not e-mailed; kept in the system"
      fields: "Package name and code; insurers with role and share; rate scheme; coverages and insurer terms; clauses; package dates; signature blocks"
      image: "BRD-03:doc-package-slip"
      layout: "Draft layout in BIBS; BDOI layout to be provided (RC-DOC-03)"
      frpm: "FRPM.014.02"
    - id: DO-05
      name: ManCom approval record
      purpose: "Evidence of the ManCom approval when no signed sheet is uploaded"
      recipients: "Internal (kept on the request)"
      format: "PDF"
      protection: "Not e-mailed"
      fields: "Request, package, line, client or programme; reference MC-<request no.>; decision; approved by; date and time; comment"
      image: "BRD-03:doc-mancom-signoff"
      layout: "Standard layout of the system; BDOI to confirm (RC-DOC-04)"
      frpm: "FRPM.014.01"
    - id: DO-06
      name: Package advisory (new, updated, renewed, deactivated)
      purpose: "Notice to the business units that a package is ready, renewed, updated or deactivated"
      recipients: "Recipient groups chosen by TSU; e-mail addresses entered"
      format: "PDF, stored on the request and e-mailed when addresses are given"
      protection: "Password protected when e-mailed (NT-06, NT-07)"
      fields: "Subject; advisory type; package and version; effective date; what changed; supporting documents (signed package slip, ManCom approval) with file names; instructions to units"
      image: "BRD-03:doc-advisory"
      layout: "Draft layout in BIBS; BDOI layout and wording to be provided (RC-DOC-05)"
      frpm: "FRPM.025.01"
    - id: DO-07
      name: Non-package Quotation Slip
      purpose: "Request for terms sent to each insurer approached for a non-package risk"
      recipients: "Insurers"
      format: "PDF, one per insurer; file name QS_<Reference Number>_<Insurer>_MMDDYYYY.pdf"
      protection: "Password protected (NT-18, NT-07)"
      fields: "As BDOI's Annex D template of the line"
      image: "BRD-01:doc-quotation-slip"
      layout: "BDOI's Annex D templates (given)"
      frpm: "FRPM.006.01"
    - id: DO-08
      name: Proposal Slip (non-package)
      purpose: "Proposal to the client with the final terms of one selected insurer"
      recipients: "Client (through Marketing)"
      format: "PDF, versioned; file name ProposalSlip_<Reference Number>_<Insurer Name>_<Version Number>_MMDDYYYY.pdf"
      protection: "Password protected when e-mailed (NT-19, NT-07)"
      fields: "Client, product and risk; selected insurer; Final Terms for Proposal; validity; signature"
      image: "BRD-01:doc-proposal-slip"
      layout: "Layout of the New Business FRS; BDOI to confirm (RC-DOC-06)"
      frpm: "FRPM.009.02, FRPM.013.01"
    - id: DO-09
      name: Consolidated Placement Update Report
      purpose: "Weekly status of the quotation requests active or processed in the period"
      recipients: "TSU and Marketing (repository)"
      format: "Excel (.xlsx); file name PlacementUpdate_MMDDYYYY.xlsx"
      protection: "Internal"
      fields: "Item No.; Insured's Name; Marketing Segment; Team; Account Officer; TSU Handler; Line of Insurance; Sub-Line; PRF Received Date; PRF Received Time; Aging; Status (Placement Update Status)"
      image: ""
      layout: "BDOI's FRPM.007.01 (given)"
      frpm: "FRPM.007.01"
    - id: DO-10
      name: Package reports (status, expiry, version history)
      purpose: "Monitoring of package requests and packages (Annex R)"
      recipients: "Authorized users"
      format: "PDF, Excel, CSV"
      protection: "Internal"
      fields: "Columns as in Annex R"
      image: ""
      layout: "Draft columns in BIBS; BDOI to confirm (RC-RPT-01)"
      frpm: "FRPM.007.02, FRPM.019.01 to FRPM.019.03"
    - id: DO-11
      name: Dashboard and list exports
      purpose: "Export of the dashboard drill-down and of the Product Matrix and request lists"
      recipients: "The user who exports"
      format: "Excel (.xlsx), PDF, CSV (BDOI's FRPM.001.01)"
      protection: "Internal; the export holds only the rows the user may see"
      fields: "The columns shown on the screen, in the same order"
      image: ""
      layout: "As the screen"
      frpm: "FRPM.001.01, FRPM.003.01"
    - id: DO-12
      name: Audit log export
      purpose: "Extract of the audit logs for review"
      recipients: "Auditor, authorized users"
      format: "CSV or Excel; file name Audit Logs_MMDDYYYY"
      protection: "Internal"
      fields: "Timestamp; Module; Reference Number; Client / Assured's Name; Action Type; Description; Old Value; New Value; Performed By; Remarks"
      image: ""
      layout: "BDOI's FRPM.021.01 (given)"
      frpm: "FRPM.021.01, FRPM.021.02"

