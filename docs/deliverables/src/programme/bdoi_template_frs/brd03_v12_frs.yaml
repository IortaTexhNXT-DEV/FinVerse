# ------------------------------------------------------------------------------------------------ Annex O
workflow:
  intro: "Who makes, checks and approves at each stage of every Product Maintenance process, the service level of each stage, the reminders and the return, reject and void paths. A user never approves or validates what he or she made or submitted (four eyes, FRPM.028.01). Service levels are the defaults proposed in FRPM.028.01 and are configurable values for BDOI to confirm (Annex V, PQ08)."
  sla_rules:
    - "The service level of a stage starts when the request enters the stage and stops when it leaves it (aging, FRPM.001.01)."
    - "A request is marked amber from 80% of the stage service level and red once it has passed; the daily check at 09:30 raises the alert 'Work item overdue' (Annex P) and the dashboard counts the overdue requests."
    - "Escalation beyond the owners of the stage is not in the BRD; it is an open question (Annex V, CLR-PM-16). An absent approver is replaced through reassignment (FRPM.017.01)."
    - "Reminders of package expiry follow FRPM.004.01: from 90 days before the expiry and anniversary dates, then at the configured reminder days."
  columns: ["Stage", "Makes / performs", "Checks / approves", "Four-eyes rule and limit", "Service level and reminder", "Return, reject or void", "FRPM"]
  processes:
    - name: "O.2.1 Package request and approval"
      brd: "BRPM.008, BRPM.009, BRPM.011, BRPM.021"
      rows:
        - ["Create and submit", "Marketing AO or TSU Officer (source Marketing, TSU or Insurer)", "-", "Mandatory fields and documents checked on submission", "-", "Requester may void a draft", "FRPM.011.02"]
        - ["Marketing approval (source Marketing)", "-", "Marketing TL, then TH, then UH; each approves independently", "Requester is never offered as approver; minimums of 20 policies and PHP 5,000,000.00 basic premium (Annex E)", "24 hours per level", "Return with remarks (Returned for Revision) or reject with remarks", "FRPM.011.02, FRPM.011.03"]
        - ["TSU review and recommendation", "-", "TSU Team Lead (assigns the TSU Officer)", "Not the requester", "24 hours", "Return with remarks", "FRPM.011.03"]
        - ["TSU Head approval", "-", "TSU Head", "Not the recommender (proposed, C06)", "24 hours", "Return or reject with remarks; approve without negotiation", "FRPM.011.03"]
    - name: "O.2.2 Quotation Slip and negotiation"
      brd: "BRPM.010, BRPM.012, BRPM.013, BRPM.014, PMADD03, PMADD04"
      rows:
        - ["Prepare Quotation Slip (each round)", "TSU Officer", "-", "-", "Within the negotiation stage, 120 hours", "-", "FRPM.012.01"]
        - ["Approve Quotation Slip", "-", "TSU Team Lead (or the co-officer, PM-Q19)", "The preparer cannot approve", "Within the negotiation stage", "Return or reject with remarks", "FRPM.012.01"]
        - ["Send to insurers", "System, from the approved slip", "-", "Protected document; password in a separate e-mail", "Insurer reply days: 5 (configurable)", "Resend to one insurer", "FRPM.012.01, FRPM.027.01"]
        - ["Key in insurer terms; Comparative Table; further rounds", "TSU Officer", "-", "Every earlier value kept in the history", "-", "Not proceeded with reason (TSU Officer or TSU Head)", "FRPM.012.02 to FRPM.012.04"]
        - ["Select insurers; terms final", "TSU Officer", "-", "Only insurers with terms can be selected; shares total 100%", "-", "-", "FRPM.013.01"]
    - name: "O.2.3 Terms review, requirements and ManCom approval"
      brd: "BRPM.013, BRPM.015, BRPM.016"
      rows:
        - ["Review of negotiated terms", "-", "TSU Head", "-", "24 hours", "Back to negotiation", "FRPM.013.02"]
        - ["Marketing review (client-specific package)", "-", "Marketing requester", "-", "48 hours", "Changes requested (back to negotiation) or not proceeded", "FRPM.013.02"]
        - ["Product requirements and signed package slip", "TSU Officer or TSU Team Lead", "-", "Signed package slip required", "48 hours", "-", "FRPM.014.02"]
        - ["ManCom approval", "-", "Selected ManCom approvers in parallel, then the President", "The submitter cannot approve; Quotation Slips lock on approval", "72 hours", "Return for revision or reject with remarks", "FRPM.014.01"]
    - name: "O.2.4 Deployment, set-up and post-setup validation"
      brd: "BRPM.015, PMADD06, BRPM.007"
      rows:
        - ["Request for deployment", "TSU (BDOI's FRPM.015.01); automatic on ManCom approval proposed (C20)", "-", "Only after every required approval", "-", "-", "FRPM.015.01"]
        - ["Set up package version (draft)", "MBS", "-", "Terms equal the ManCom-approved terms", "48 hours", "Return incomplete requirements to TSU with reason", "FRPM.016.01, FRPM.016.02"]
        - ["Post-setup validation", "-", "TSU Head or Business Administrator (PQ09)", "The MBS user who set up cannot validate; checklist and test premium", "24 hours", "Return to MBS with reason", "FRPM.003.03, FRPM.016.02"]
        - ["Release", "System on validation", "-", "Previous version ends the day before the new one takes effect", "-", "-", "FRPM.024.01"]
    - name: "O.2.5 Advisories"
      brd: "BRPM.016"
      rows:
        - ["Draft advisory", "System on release, renewal or deactivation", "-", "-", "-", "-", "FRPM.025.01"]
        - ["Check and send advisory", "TSU Officer or TSU Team Lead", "-", "Signed package slip and ManCom sign-off attached", "-", "-", "FRPM.025.01"]
    - name: "O.2.6 Deactivation and expiry"
      brd: "BRPM.006, BRPM.011, BRPM.017"
      rows:
        - ["Deactivation request", "Authorized users (TSU, MBS)", "Selected approver", "The requester cannot approve", "-", "Reject with remarks", "FRPM.003.04, FRPM.003.07"]
        - ["Automatic expiry", "System (daily check)", "-", "-", "Alerts from 90 days before expiry", "-", "FRPM.003.05, FRPM.004.01"]
    - name: "O.2.7 Renewal of a package"
      brd: "BRPM.017"
      rows:
        - ["Expiry and anniversary alerts", "System (daily check)", "-", "Once per alert day", "From 90 days; reminders at the configured days", "-", "FRPM.004.01"]
        - ["Renewal request", "TSU Officer (generated from the expiry list, or drafted automatically if switched on)", "As O.2.1 to O.2.4", "One open renewal request per package", "As O.2.1 to O.2.4", "As O.2.1 to O.2.4", "FRPM.026.01"]
    - name: "O.2.8 Product masters and clause library"
      brd: "PMADD01, PMADD02, BRPM.003, BRPM.004, BRPM.005"
      rows:
        - ["Add or change a line, cover type, coverage, clause, field rule or template", "MBS (templates: System Administrator)", "Business Administrator", "The maker cannot authorize", "-", "Reject with reason", "FRPM.003.08, FRPM.022.01, FRPM.022.02, FRPM.030.01"]
        - ["Product Matrix record (BDOI's FRPM.003.02)", "Authorized users", "Selected approver", "The maker cannot approve", "-", "Return or reject with remarks", "FRPM.003.02, FRPM.003.03"]
        - ["Insurer commission rate for a new product", "Business Administrator", "New Business Approver", "The maker cannot authorize", "-", "Reject with reason", "FRPM.023.01"]
    - name: "O.2.9 Incentive rules"
      brd: "PMADD07, PMADD08"
      rows:
        - ["Add, change, activate or deactivate a rule", "MBS (incentive maintainer)", "Business Administrator", "Only on active products; no overlap in time for the same code", "-", "Reject with reason", "FRPM.018.01"]
        - ["Review when a product ends", "System raises the notice; MBS reviews", "-", "-", "-", "-", "FRPM.018.02"]
    - name: "O.2.10 Rate exception on new business"
      brd: "BRPM.007"
      rows:
        - ["Request a rate exception", "Marketing AO", "-", "Reason required", "-", "-", "FRPM.024.02"]
        - ["Decide the rate exception", "-", "New Business approver or Business Administrator", "The requester cannot decide; a rejection needs its reason", "Validity 30 days", "Reject with reason", "FRPM.024.02"]
    - name: "O.2.11 Non-package quotation request (BDOI's FRPM.005 to FRPM.010)"
      brd: "BRPM.010 to BRPM.014"
      rows:
        - ["Create and submit request", "Marketing AO", "Marketing approvers", "The submitter cannot approve", "As O.2.1", "Return with remarks", "FRPM.005.01, FRPM.005.02"]
        - ["TSU review", "-", "TSU approver", "-", "24 hours", "Return or reject with remarks", "FRPM.005.02"]
        - ["Quotation Slip per insurer", "TSU Officer", "TSU approver", "The preparer cannot approve", "-", "Return or reject with remarks", "FRPM.006.01"]
        - ["Insurer responses, Comparative Table, insurer selection", "TSU Officer; requester selects insurers", "-", "Only insurers with responses", "-", "-", "FRPM.006.02, FRPM.008.01"]
        - ["Proposal Slips and approval", "TSU Officer", "A second TSU officer", "The preparer cannot approve", "-", "Return or reject with remarks", "FRPM.009.01, FRPM.009.02"]
        - ["Client response", "Marketing AO", "-", "Client acceptance e-mail attached", "-", "Rejected or returned for revision", "FRPM.010.01"]
    - name: "O.2.12 Reassignment"
      brd: "BRPM.021"
      rows:
        - ["Reassign a reviewer or approver", "Team leaders and authorized users", "-", "-", "-", "-", "FRPM.017.01"]
  matrix_intro: "Role-to-stage matrix: M = makes or performs, A = approves, checks or validates, R = reviews or recommends, N = is notified, V = views. The role-to-action matrix of the access rights is in Annex J.5 and the User Access Maintenance FRS (PMADD05)."
  matrix_roles: ["Mkt AO", "Mkt TL/TH/UH", "TSU Officer", "TSU TL", "TSU Head", "ManCom", "MBS", "Bus. Admin", "NB Appr.", "System"]
  matrix:
    - ["Package request", "M", "A", "M", "R", "A", "", "", "", "", "N"]
