# Product Maintenance FRS in BDOI's template, version 1.2 (Business Unit review edition): the content added in this
# round. Read by brd03_v12.py (called from build_bdoi_frs_pm.py). Every passage traces to a BRD ID of the Product
# Maintenance BRD of 8-Oct-2026; anything beyond the BRD is a proposal logged in Annex M (section M.5).
#
#   revision        the row of the Document Revision Log
#   summary         Introduction > Summary for the Business Unit Review (scope, key numbers, decisions, how to review)
#   flows           the figures added to the Process Flow section (Graphviz sources in figures/)
#   workflow        Annex O  Workflow and Approvals
#   notifications   Annex P  E-mail and Notification Texts (BIBS texts quoted; proposed texts marked as proposed)
#   documents       Annex Q  Document Prints and Output Formats
#   reports         Annex R  Reports and Schedules
#   integrations    Annex S  Integrations
#   nfr             Annex T  Non-functional Requirements
#   data_setup      Annex U  Data Set-up and Migration at Go-live
#   change_control  Annex W  Change Control after Sign-off
#   checklist       Annex X  Business Unit Review Checklist
#   observations    Annex M, section M.5 (new observations of this round)
# Annex V (assumptions, dependencies and open questions) comes from brd03_v12_items.yaml (open_items), which also
# feeds the workbooks.

revision:
  date: 09 Oct 2026 - 10 Oct 2026
  version: "1.2"
  description: "Business Unit review edition: summary for the Business Unit, end-to-end flows, workflow and approvals, e-mail texts, document formats, reports and schedules, integrations, non-functional requirements, open questions not answered in the BDOI FRS, change control, review checklist; aligned on 10 Oct 2026 with BIBS: new and changed screens with current screenshots (workspace, dashboard, deactivation, routing and deployment, product master transfer, comparative table with Final Terms, proposal slips and client response, Consolidated Placement Update Report, audit logs), settings for the points BDOI decides (Annex J.7)"
  by: "iorta TechNXT Project Team (drafting support)"

intro_note: "Version 1.2 adds, for the review of the Business Unit, a summary of the module in pictures and tables (section 1.4), the end-to-end process flows and status life-cycles of every process of the BRD, and Annexes O to X: workflow and approvals, e-mail and notification texts, document prints, reports and schedules, integrations, non-functional requirements, data set-up at go-live, the open questions that BDOI's FRS does not answer, change control after sign-off and the review checklist. BDOI's text and the content of version 1.1 are unchanged."

summary:
  title: Summary for the Business Unit Review
  purpose: "This section gives the Business Unit the whole module on a few pages: what is in scope, how the process runs end to end, the key numbers of this FRS, the decisions the Business Unit must take before signing, and which annexes each reviewer reads. The details are in the functional requirements (section 3), the process flows (section 4) and the annexes."
  scope:
    in:
      - ["Product hierarchy, product matrix and clause library (packaged and non-packaged products)", "PMADD01, PMADD02, BRPM.003, BRPM.004"]
      - ["Insurer-specific coverages, deductibles, warranties and clauses", "PMADD02"]
      - ["Package requests: creation, update, deactivation and renewal, with Marketing and TSU approvals", "BRPM.008, BRPM.009, BRPM.011, BRPM.021"]
      - ["Quotation Slips, negotiation rounds, insurer responses and Comparative Tables (master and client views)", "PMADD03, PMADD04, BRPM.010, BRPM.012, BRPM.013, BRPM.014"]
      - ["Review of negotiated terms, product requirements and ManCom approval", "BRPM.013, BRPM.015"]
      - ["MBS set-up, post-setup validation and release of package versions", "PMADD06, BRPM.015"]
      - ["Latest approved rate scheme for new business and rate exceptions", "BRPM.007"]
      - ["Advisories with supporting documents", "BRPM.016"]
      - ["Expiry and anniversary alerts, renewal requests, deactivation and archive", "BRPM.006, BRPM.017"]
      - ["Incentive eligibility rules (for example CPC2) on maintained products", "PMADD07, PMADD08"]
      - ["Dashboard, Placement Update and package reports, reports builder", "BRPM.018, BRPM.019"]
      - ["Document protection, workflow enforcement, notifications, audit trail", "BRPM.020, BRPM.021, BRPM.022, BRPM.024"]
      - ["Non-package quotation requests, as kept in BDOI's FRS (FRPM.005 to FRPM.010)", "BRPM.010 to BRPM.014 (see C01)"]
    out:
      - "Computation and payout of incentives (the module keeps the rules and the indicator; PM-Q43)"
      - "Renewal of client policies sold on a package (Renewal BRD-06)"
      - "Transfer of product master changes to other BDOI systems until BDOI names them (BRPM.022, PQ16)"
      - "Insurer portals: insurers are reached by e-mail (BRPM.012)"
    other:
      - ["Sign-in, access, roles and the role-to-action matrix", "User Access Maintenance FRS (BRPM.001, BRPM.002, PMADD05)"]
      - ["Quotations, accounts and booking that use the packages", "New Business FRS (BRD-01)"]
      - ["Endorsement re-rating and commission on package accounts", "Operations FRS (BRD-02)"]
      - ["Go-live load of products, insurers and the package map", "Data Migration (BRD-13)"]
  decisions:
    # top 10 decisions; where = annex row
    - ["Who validates a package configuration after set-up (TSU Head, Business Administrator or either) and the checklist", "No package reaches sales without an accountable check (PMADD06)", "Annex V (PQ09); Annex M (C06)", "Head, TSU; Head, MBS"]
    - ["ManCom approval: approver list, the President's step and the service level", "ManCom approval time and evidence (BRPM.015)", "Annex M (C17); Annex V (PQ07)", "ManCom; Product Owner"]
    - ["BRPM.020 document protection: confirm it is not waived and give the password convention", "Insurer and client documents leave BDOI by e-mail", "Annex M (M.2); Annex V (PQ21)", "Product Owner; BPS"]
    - ["Service level of each workflow stage and who is alerted when it passes", "Overdue marking, alerts and reports (BRPM.021)", "Annex O; Annex V (PQ08, CLR-PM-16)", "Head, TSU; Head, Retail Marketing"]
    - ["Expiry and anniversary dates of a package, alert days and automatic drafting of renewal requests", "Renewal of packages on time (BRPM.017)", "Annex V (PQ11, CLR-PM-22)", "Head, TSU"]
    - ["Definition of CPC2 and the other incentive types", "Incentive rules cannot be set up without it (PMADD08)", "Annex V (PQ04)", "Head, MBS; Product Owner"]
    - ["The other BDOI systems that receive product master changes, the format and the timing", "BRPM.022 integration", "Annex S; Annex V (PQ16)", "Product Owner; BDO ITG"]
    - ["Layouts of the package documents not yet given (request form, Comparative Table, package slip, advisory, ManCom record)", "Documents printed and e-mailed by the module (BRPM.005, BRPM.016)", "Annex Q; Annex V (D-PM-02)", "Head, TSU; Head, MBS"]
    - ["Packages in force at go-live: set up through package requests, and how many", "Effort of TSU and MBS before go-live (BRPM.007)", "Annex U; Annex V (CLR-PM-21)", "Head, TSU; Head, MBS"]
    - ["Non-package quotation requests: stay in this FRS as BDOI wrote them, or in the New Business FRS", "Scope of this sign-off and the menu (C01)", "Annex M (C01)", "Product Owner; BPS"]
  review:
    # role, what to read, about how long
    - ["Head, Technical Support Unit (and TSU Team Leads)", "Section 1.4; process flows; FRPM.004 to FRPM.016, FRPM.024 to FRPM.026; Annexes O, P, Q, V, X", "3 hours"]
    - ["Head, Marketing Business Services and System Support (MBS)", "Section 1.4; FRPM.002, FRPM.003, FRPM.016, FRPM.018, FRPM.022 to FRPM.024, FRPM.030; Annexes A, J, O, U, V", "3 hours"]
    - ["Head, Retail Marketing (and Marketing approvers)", "Section 1.4; package request flow; FRPM.011, FRPM.013.02, FRPM.024.02; Annexes E, K, P", "1.5 hours"]
    - ["ManCom representative", "Section 1.4; FRPM.014; Annex O (ManCom stage); Annex P (ManCom e-mails)", "30 minutes"]
    - ["Product Owner, Marketing Business System", "Section 1.4; Annexes M, V, W, X; the decisions above", "2 hours"]
    - ["BDO ITG System Analyst and Tech Lead", "Whole document; Annexes L, R, S, T, W", "4 hours"]
    - ["Program Manager, Business Project Services", "Section 1.4; Annexes M, V, W, X", "1 hour"]

