# Fit-gap per BRD ID. fit: Fit | Configure | Extend | Recommend change.
fitgap:
  PMADD01: {bibs: "One product hierarchy: line, cover type / sub-line, subtype, product (risk code), coverages and perils per line, under maker-checker.", fit: Configure, rec: "Load BDOI's sub-lines (Annex A) and the coverages per line; state the risk-code naming convention.", impact: "Product data consistent across New Business, Renewal and reports."}
  PMADD02: {bibs: "Clause library; insurer-specific coverages, deductibles, warranties and clauses on each package version; co-insurance roles and shares.", fit: Configure, rec: "Load the clause library and the insurer terms of the packages in force (templates PM-03, PM-06).", impact: "Insurer variability kept as data, without IT."}
  PMADD03: {bibs: "Master Comparative Table per round with superseded masters kept; client views with chosen insurers and fields; PDF and Excel.", fit: Fit, rec: "Adopt; BDOI to give the client layout.", impact: "Auditable record of what the client saw."}
  PMADD04: {bibs: "Negotiation rounds with revised slips; response outcomes including declines and counter-proposals; not proceeded with reason.", fit: Configure, rec: "Confirm the response list (BDOI: Approved, Not Covered, Others) and the maximum rounds.", impact: "Negotiation outcomes reported consistently."}
  PMADD05: {bibs: "Role-based access with permissions per action; four-eyes rules; role changes through the User Access Maintenance process.", fit: Fit, rec: "Follow the User Access Maintenance FRS; confirm the role-to-action matrix of Annex J.5.", impact: "Access controlled; audit risk reduced."}
  PMADD06: {bibs: "Post-setup validation of each package version by a user other than the maker, with checklist and test premium.", fit: Fit, rec: "Name the validator role and the checklist items.", impact: "No unvalidated package reaches sales."}
  PMADD07: {bibs: "Incentive rules on maintained products, under maker-checker; applied at booking; review notice when a product ends.", fit: Configure, rec: "Define the incentive types and load the rules (template PM-10).", impact: "Incentives applied only to eligible products."}
  PMADD08: {bibs: "Maintenance screen of incentive rules with history and successors.", fit: Configure, rec: "Define CPC2 and the other types.", impact: "CPC2 cannot be set up until defined."}
  BRPM.001: {bibs: "Sign-in through BDO sign-in (Entra ID) once switched on; lock-out and sign-out per the User Access Maintenance FRS.", fit: Fit, rec: "Follow the User Access Maintenance FRS.", impact: "-"}
  BRPM.002: {bibs: "Menus, screens and actions by role; direct requests without the right are refused and logged.", fit: Fit, rec: "Follow the User Access Maintenance FRS.", impact: "-"}
  BRPM.003: {bibs: "Mandatory and product-specific fields per line; field rules (presence, list, range, pattern).", fit: Configure, rec: "Give the mandatory fields and rules per line (Annex A to C, template PM-02).", impact: "Complete risk data for insurers."}
  BRPM.004: {bibs: "Validation rules by product, maintained by MBS under maker-checker.", fit: Configure, rec: "Give the rules per product type.", impact: "Fewer returned requests."}
  BRPM.005: {bibs: "Shared document templates with product-specific sections; versioned; layouts replaced without a release.", fit: Configure, rec: "Provide the layouts of the package documents (Annex Q); load Annex D and F as the slip templates.", impact: "Documents in BDOI's layouts."}
  BRPM.006: {bibs: "Expired and deactivated packages archived with their versions and documents; visible to authorized users; return to sale through a new request.", fit: Fit, rec: "Confirm reactivation through a package request (C11).", impact: "History kept for servicing and audit."}
  BRPM.007: {bibs: "New business priced on the version in force; other rates only with an approved rate exception; version kept on quotation, account and invoice.", fit: Fit, rec: "Confirm the approver and validity of rate exceptions.", impact: "Outdated rates cannot be used."}
  BRPM.008: {bibs: "Package Request Form with numbering, documents, Marketing approval and routing by source.", fit: Extend, rec: "Adopt BDOI's TL, TH, UH sequence and the Annex E fields (platform change).", impact: "Requests reach TSU complete and approved."}
  BRPM.009: {bibs: "TSU Team Lead recommendation and TSU Head approval, never by the recommender.", fit: Fit, rec: "Keep the two TSU steps of BRPM.009 (C06).", impact: "Accountable TSU review."}
  BRPM.010: {bibs: "Negotiation by TSU with insurers in rounds; terms final; review of negotiated terms.", fit: Fit, rec: "Adopt.", impact: "-"}
  BRPM.011: {bibs: "Requests to create, amend, update, renew, reactivate or deactivate a package, visible in the request list.", fit: Recommend change, rec: "Deactivation in place of deletion (records kept).", impact: "No loss of history."}
  BRPM.012: {bibs: "Quotation Slip approved and sent from the system to each insurer as a protected document; send log and resend.", fit: Fit, rec: "Adopt sending from the system; keep BDOI's file naming (C12, C23).", impact: "Evidence of transmission."}
  BRPM.013: {bibs: "Key-in of insurer terms with history; Marketing review of client-specific terms.", fit: Fit, rec: "Adopt.", impact: "-"}
  BRPM.014: {bibs: "Comparative Table compiled from the responses, one master per request.", fit: Fit, rec: "Adopt; QS value column (BDOI) as a platform change.", impact: "No manual spreadsheets."}
  BRPM.015: {bibs: "Requirements with signed package slip; ManCom approval in the system; forwarded to MBS; set-up and validation.", fit: Extend, rec: "Adopt BDOI's parallel approvers then President routing (platform change).", impact: "ManCom evidence in the system."}
  BRPM.016: {bibs: "Advisories drafted on release with the supporting documents; sent to groups and by protected e-mail.", fit: Fit, rec: "Name the recipient units.", impact: "Units informed formally."}
  BRPM.017: {bibs: "Daily expiry check with alerts; Package Expiry list; renewal requests generated from the version in force.", fit: Extend, rec: "Set 90 days; add the anniversary alert (platform change); decide automatic drafting.", impact: "Renewals started in time."}
  BRPM.018: {bibs: "Package Status Update Report and Placement Update Report on request, PDF and Excel.", fit: Extend, rec: "Add the weekly Thursday 08:00 run with repository (platform change).", impact: "Weekly report without manual run."}
  BRPM.019: {bibs: "Dashboard tiles by stage with overdue marking, expiring packages, validation queue.", fit: Extend, rec: "Add BDOI's KPIs, filters and PDF and CSV export (platform change).", impact: "Management visibility as BDOI specified."}
  BRPM.020: {bibs: "Every document e-mailed outside BDOI is password protected; password in a separate e-mail.", fit: Recommend change, rec: "Do not waive BRPM.020; give the password convention.", impact: "Data privacy of client and insurer documents."}
  BRPM.021: {bibs: "Workflow enforcement; maker-checker; service levels with overdue alerts; reassignment.", fit: Fit, rec: "Confirm the service levels.", impact: "-"}
  BRPM.022: {bibs: "Notifications at each step; product master changes recorded for other BDOI systems.", fit: Extend, rec: "Name the receiving systems, format and timing.", impact: "Data flow to BDOI systems."}
  BRPM.024: {bibs: "Audit trail of every action that no user can change; per-record history; export.", fit: Extend, rec: "Add old and new values of master changes and the export file name (platform change).", impact: "Complete audit for reviewers."}

