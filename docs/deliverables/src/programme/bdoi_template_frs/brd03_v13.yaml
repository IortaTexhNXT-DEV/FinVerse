crs:
  - cr: CR-PM-101
    title: "Quotation Slip decision notice to the preparer"
    frs: "FRPM.006.01, FRPM.012.01; Annex P NT-16"
    brd: "BRPM.012 (extends)"
    tag: EXT
    source: "BDOI FRS v1.0 FRPM.006.01 and FRPM.012.01; FRS v1.2 Annex P (proposed text NT-16)"
    why: "The TSU Officer who prepares a Quotation Slip learns of its approval or return only by opening the request; the notice lets the slip go to the insurers the same day."
    ootb: "Not available: the slip approval (negotiation service) sends the slip to the insurers but no notice to the preparer; the notice service of the platform is available and is reused."
    md: [0.5, 1.5, 0, 1.0, 0.5]
    complexity: Low
    priority: Medium
    deps: "Notice service and e-mail channel (Annex S, IN-08)"
    assumptions: "Text NT-16 of Annex P approved as written; in-system notice with e-mail copy by preference."
    basis: "Negotiation service about 410 lines; stage notices about 70 lines used as the pattern."
  - cr: CR-PM-102
    title: "ManCom e-mails in BDOI's wording, with the President's text"
    frs: "FRPM.014.01; Annex P NT-13, NT-14"
    brd: "BRPM.015 (extends)"
    tag: EXT
    source: "BDOI FRS v1.0 FRPM.014.01; FRS v1.2 Annex P (proposed texts NT-13, NT-14)"
    why: "BDOI's FRS asks for the ManCom approval e-mail in its own wording and a separate text when the request reaches the President."
    ootb: "Partly available: each ManCom approver is told in the system with an e-mail copy, in one standard text; the two BDOI texts are to be added."
    md: [0.5, 1.0, 0, 0.5, 0.5]
    complexity: Low
    priority: Medium
    deps: "E-mail channel of BDOI (Annex S, IN-08)"
    assumptions: "Two texts; no attachment beyond the link to the request."
    basis: "ManCom routing about 270 lines; one notice method to extend."
  - cr: CR-PM-103
    title: "Old and new field values of product master changes in the audit log"
    frs: "FRPM.021.01, FRPM.021.02; Annex M.5"
    brd: "BRPM.024 (extends)"
    tag: EXT
    source: "FRS v1.2 Annex M.5 (observation: planned with the programme master data change log)"
    why: "BRPM.024 asks for the audit trail of every action; the auditors also expect to see, for a changed master record, which field changed from which value to which value."
    ootb: "Partly available: every create, change and authorize of a product master is in the audit log with user and time; the field-by-field old and new values are kept today for package terms only."
    md: [1.0, 4.0, 1.5, 2.0, 0.5]
    complexity: Medium
    priority: High
    deps: "Audit log of the platform (old and new value columns exist)"
    assumptions: "Product masters of the catalogue (products, coverages, clauses, field rules, incentive criteria, insurers, rates and taxes, sales organisation); values shown on the record audit tab."
    basis: "15 catalogue services write the audit log; catalogue services about 35 files; record audit tab of the screens to show the two values."
  - cr: CR-PM-104
    title: "Accessibility of the Product Maintenance screens (WCAG 2.2 level AA)"
    frs: "Annex T, T-15"
    brd: "Not in BRD"
    tag: NEW
    source: "Programme register of non-functional requirements (NFR-ACC-01, NFR-ACC-02), proposed in FRS v1.2 Annex T"
    why: "No BDOI BRD asks for an accessibility level; the programme register proposes WCAG 2.2 AA so that keyboard and screen-reader users can work in the module."
    ootb: "Partly available: the screens use the platform components and are usable with the keyboard; no WCAG 2.2 AA conformance check has been made on the module (about 8 of 35 screen files carry accessibility labels)."
    md: [1.5, 0, 6.0, 3.0, 1.0]
    complexity: Medium
    priority: Low
    deps: "BDOI's decision on the accessibility level (Annex V, PQ18)"
    assumptions: "Check and fixes on the 35 Product Maintenance screen files (about 3,800 lines) and the product master screens; no redesign."
    basis: "Product Maintenance screens: 35 files, about 3,800 lines."
  - cr: CR-PM-105
    title: "'Due soon' marker at 80% of the stage service level"
    frs: "FRPM.001.01"
    brd: "BRPM.021 (extends)"
    tag: EXT
    source: "FRS v1.1 FRPM.001.01 (amber from 80% of the stage service level)"
    why: "BRPM.021 asks that each approval step is completed within the defined service level; an amber marker relative to each stage's own service level warns before the breach on short and long stages alike."
    ootb: "Partly available: a request is marked 'due soon' when it is due within 8 hours, whatever the service level of the stage; overdue (red) is available."
    md: [0.5, 1.0, 0.5, 1.0, 0.5]
    complexity: Low
    priority: Medium
    deps: "-"
    assumptions: "The percentage is a parameter (default 80%) maintained by the System Administrator."
    basis: "Package query service about 275 lines (fixed 8-hour window); stage age marker of the screens."

