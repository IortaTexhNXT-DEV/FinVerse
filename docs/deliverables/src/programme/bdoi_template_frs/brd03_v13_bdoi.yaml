# ------------------------------------------------------------------------------------------------ walkthroughs
# Business walkthroughs (Annex K). Steps: [persona, screen, what the user does, what the user sees, result, screenshot].
# Persona names are business roles; the people and records named are fictitious.
walk_intro: >-
  End-to-end business walkthroughs of Product Maintenance, step by step (storyboard): who acts, on which screen, what
  the user does, what the user sees and the result; each step is illustrated by a full-page screenshot (Figures
  K.n). The routes are those of the end-to-end process flow (Figure 2); the screens are specified in Annex G. The
  people, packages and records named are fictitious.
# persona -> fictitious user named in the walkthroughs (the walkthrough users workbook gives the same names)
people:
  Marketing AO: Aileen Torres
  Marketing TL / TH / UH: Marites Hernandez
  TSU Officer: Teodoro Valdez
  TSU Team Lead: Teresa Villareal
  TSU Head: Tomas Vergara
  Marketing Business Services: Monica Vergara
  ManCom member: Manuel Uy
  ManCom President: Patricia Valdez
  Business Administrator: Bea Garcia
  New Business approver: Andres Bautista
walkthroughs:
  - id: WT-A
    title: A new package from the request to its first New Business quotation
    summary: >-
      Marketing asks for a new generic motor package for SME fleets. MBS first adds a clause wording to the library,
      which the Business Administrator authorises. The request is approved by Marketing, recommended and approved by
      TSU, negotiated with two insurers and made final; the requirements pack with the signed package slip is signed
      off by ManCom. MBS sets up version 1 with its rate scheme, coverages, panel insurers and clauses; the TSU Head
      validates and releases it, the Business Administrator adds the insurer's commission rate for the new product and
      the New Business approver authorises it. TSU sends the advisory. Marketing then prices the package and quotes
      it; a quotation with a different item rate needs a rate exception, which the New Business approver approves, so
      the quotation can be submitted.
    data: "Example: new package Motor Fleet Plus, line Motor, cover type Comprehensive, insurers Mabuhay General Insurance Corp. and Luzon Assurance Co., risk code MTR30, clause FLEET_REPAIR (accredited repair shops for fleets); Marketing AO Aileen Torres, Marketing TL Marites Hernandez, TSU Officer Teodoro Valdez, TSU Team Lead Teresa Villareal, TSU Head Tomas Vergara, MBS Monica Vergara, ManCom member Manuel Uy, ManCom President Patricia Valdez, Business Administrator Bea Garcia, New Business approver Andres Bautista."
    steps:
      - [Marketing Business Services, SCR-PM-15, "Opens Coverages & Clauses › Clause Library, clicks New Clause, enters the code FLEET_REPAIR, kind, line Motor, title, effective date and wording, and clicks Save for Authorization", "Toast: Clause FLEET_REPAIR saved – pending authorization; the row shows Pending Authorization", Clause pending authorisation, wt-a-01]
      - [Business Administrator, SCR-PM-15, "Opens the Clause Library and clicks Authorize on FLEET_REPAIR", "Toast: FLEET_REPAIR authorized; the status is Active", Clause active, wt-a-02]
      - [Marketing AO, SCR-PM-03, "Opens Package Requests › New Package Request, chooses New package and Generic programme, enters Motor Fleet Plus, line Motor, cover type Comprehensive, reason New programme for a market segment, the segments, the requested coverages, rate 1.20%, minimum premium and package dates, ticks Mabuhay General Insurance Corp. and Luzon Assurance Co., and clicks Submit for Approval", "Toast: the request number (PKR-yyyy-nnnnnn) submitted for Marketing approval; the request opens in For Marketing approval", For Marketing approval, wt-a-03]
      - [Marketing TL / TH / UH, SCR-PM-04, "Opens the request from the For Approval tab and clicks Approve and send to TSU", "The stage becomes For TSU review; the history lists the approval", For TSU review, wt-a-04]
      - [TSU Team Lead, SCR-PM-04, "Clicks Recommend for approval, writes the recommendation and clicks Recommend", "The TSU recommendation shows on the Details tab; the stage becomes For TSU Head approval", For TSU Head approval, wt-a-05]
      - [TSU Head, SCR-PM-04, "Reads the recommendation and clicks Approve for negotiation", "The stage becomes Insurer negotiation; round 1 is opened with the two target insurers", Insurer negotiation, wt-a-06]
      - [TSU Officer, SCR-PM-05, "Opens the Negotiation tab, adds a note to the insurers and clicks Submit for Approval", "Toast: the quotation slip (PQS-yyyy-nnnnnn) submitted for approval; round 1 shows For approval", Slip for approval, wt-a-07]
      - [TSU Team Lead, SCR-PM-05, "Clicks Approve and Send on round 1", "Toast: the slip sent to 2 insurer(s); both responses show Pending; the E-mails tab lists the slip and password e-mails", Slip sent, wt-a-08]
      - [TSU Officer, SCR-PM-05, "Clicks Key In for each insurer, enters the outcome, rate, minimum premium and deductibles, attaches the insurer's reply and clicks Save Terms", "Toast: Terms of <insurer> saved; the responses show Approved with changes and Counter-proposal with their rates", Responses recorded, wt-a-09]
      - [TSU Officer, SCR-PM-05, "Clicks Terms final, ticks the offer of Mabuhay General Insurance Corp. and clicks Make Terms Final", "The stage becomes Negotiated terms review; the chosen insurer shows in the header", Terms final, wt-a-10]
      - [TSU Officer, SCR-PM-06, "Opens the Comparative tab", "The round 1 comparison with the Lowest rate tag and the current audit master in Stored outputs", Comparative master stored, wt-a-11]
      - [TSU Head, SCR-PM-04, "Clicks Proceed to requirements (generic package)", "The stage becomes Requirements preparation", Requirements preparation, wt-a-12]
      - [TSU Officer, SCR-PM-07, "Enters the computation basis, clicks Save Requirements, downloads the Package Slip, uploads the signed slip on the Documents tab as Package slip (signed), clicks Submit requirements for ManCom sign-off, then on the Routing & Approvals tab ticks the ManCom member Manuel Uy and the President Patricia Valdez and clicks Send for ManCom Approval", "The checklist reads The requirements pack is complete.; the stage becomes For ManCom sign-off; the ManCom Approval table lists the member Pending Approval and the President Waiting for the others", For ManCom sign-off, wt-a-13]
      - [ManCom member, SCR-PM-29, "Manuel Uy reviews the proposed terms and clicks Approve on the Routing & Approvals tab; the President Patricia Valdez, asked once the member approved, clicks Approve", "The ManCom Approval table shows both Approved; ManCom decisions lists the sign-off reference (MC-PKR-yyyy-nnnnnn) Signed; the slips show Locked; the stage becomes With MBS for set-up (forwarding automatic)", Signed off, wt-a-14]
      - [Marketing Business Services, SCR-PM-08, "Clicks Set up package version, enters the risk code MTR30 and the product name, and clicks Set Up Version", "Toast: Version 1 set up; the Set-up tab shows MTR30 version 1; the stage becomes Package version for validation", Draft version 1, wt-a-15]
      - [Marketing Business Services, SCR-PM-13, "Clicks Open Version Editor, adds the clause FLEET_REPAIR on the insurer terms, saves and clicks Submit for Validation", "Toast: Version 1 submitted for validation; the version shows For validation", For validation, wt-a-16]
      - [TSU Head, SCR-PM-13, "Opens the version from the Validation Queue, ticks the five checklist items and clicks Validate and Release", "Toast: Version 1 released; the Validation card shows the result Passed, the validator, the date, the test premium and the checks with their figures", Released, wt-a-17]
      - [Business Administrator, SCR-PM-18, "Opens Insurers › Mabuhay General Insurance Corp., clicks Add rate, chooses MTR30, 15% from today and clicks Save for Authorization", "Toast: Commission rate saved – pending authorization", Commission rate pending, wt-a-18]
      - [New Business approver, SCR-PM-18, "Opens the insurer and clicks Authorize on the new commission rate", "The rate for MTR30 shows Active", Commission rate active, wt-a-19]
      - [TSU Officer, SCR-PM-08, "Opens the Advisories tab of the released request, checks that both supporting documents are Attached and clicks Send Advisory", "Toast: Advisory sent; the advisory shows Sent with the date; Marketing users receive the notice", Advisory sent, wt-a-20]
      - [Marketing AO, SCR-PM-21, "Opens Premium Calculator, chooses MTR30 and Mabuhay General Insurance Corp., enters a vehicle value and clicks Calculate", "Priced on package version 1 (effective <date>, scheme rate 1.2%) with every charge and the commission", Priced on version 1, wt-a-21]
      - [Marketing AO, SCR-PM-22, "Creates a New Business quotation of MTR30 for a fleet client with an item rate of 1.10%, opens it and clicks Request Rate Exception with the reason", "The rate scheme panel shows the exception pending approval", Exception requested, wt-a-22]
      - [New Business approver, SCR-PM-22, "Opens My Approvals, clicks the rate exception of the quotation, compares the requested rate with the scheme in force on the exception record, clicks Approve, writes the comment and confirms", "Toast: the rate exception (RSE-yyyy-nnnnnn) approved; the record shows Approved with the approver, the date and the comment; the Account Officer receives the notice", Exception approved, wt-a-23]
      - [Marketing AO, SCR-PM-22, "Opens the quotation again after the approval", "The Rate Exceptions table lists the exception Approved; the quotation can be submitted for review", Quotation ready for review, wt-a-24]
    downstream:
      - "New Business (BRD-1): New Quotation and New Account offer MTR30 to the segments of the package; the quotation, the account and the booked invoice keep version 1 and the approved exception."
      - "Booking and Operations: the booked invoice stores version 1 and the incentive criteria it matches; endorsements re-rate on version 1."
      - "Renewal (BRD-6): renewal candidates of MTR30 accounts are priced on version 1 while it is released or superseded; the package map of the data migration may name MTR30 version 1 as the target of a legacy package."
      - "Package Expiry: MTR30 appears on the Expiring tab 90 days before its package end date; the expiry alerts follow FRPM.004.01."
  - id: WT-B
    title: Returns and refusals, and the messages the user sees
    summary: >-
      The same process when something is missing or not allowed: an incomplete form, an approval by the maker, a
      return by TSU, a slip approved by its preparer, terms made final before every insurer answered, a ManCom return,
      a requirements pack without the signed slip, and a version returned by the validator. Each step shows the message
      on the screen and what the user does next.
    data: "Example: the package requests Motor package MTR10 - lower deductible (For TSU review), Pacific Harbor Warehouse Property Package (round 2 with one insurer pending), Motor package MTR12 - roadside assistance (For ManCom sign-off) and Motor package MTR15 renewal (With MBS), and the draft version 2 of the MTR12 package; the users of walkthrough A."
    steps:
      - [Marketing AO, SCR-PM-03, "Opens New Package Request and clicks Save Draft without the name, line and reason", "Under the fields: Enter the package or programme name; Select the product line; Select the reason. Nothing is saved", Form corrected, wt-b-01]
      - [Marketing AO, SCR-PM-03, "Completes the header only and clicks Submit for Approval", "The hint Before submitting, complete the requested terms (coverages or sections); at least one target insurer; the package end date, and the refusal Complete the request: ... with its reference", Request stays a draft, wt-b-02]
      - [Marketing TL / TH / UH, SCR-PM-04, "Creates and submits a request herself, then clicks Approve and send to TSU on it", "A package request is approved by someone other than its maker", Another Marketing approver is needed, wt-b-03]
      - [TSU Team Lead, SCR-PM-04, "Opens Motor package MTR10 - lower deductible and clicks Return to requester, chooses the reason and writes what is missing", "The stage becomes Draft request; the requester receives the workflow notice with the comment", Returned to the requester, wt-b-04]
      - [TSU Team Lead, SCR-PM-05, "Prepares and submits a slip herself, then clicks Approve and Send on it", "The quotation slip is approved by a TL or a co-officer", Another approver is needed, wt-b-05]
      - [TSU Officer, SCR-PM-05, "Opens Pacific Harbor Warehouse Property Package and clicks Terms final while Luzon Assurance Co. is still pending in round 2", "Every insurer of round 2 needs an outcome before the terms are final (1 pending)", Outcome to be keyed in first, wt-b-06]
      - [ManCom member, SCR-PM-04, "Opens Motor package MTR12 - roadside assistance and clicks Return to TSU with the reason", "The stage becomes Requirements preparation; ManCom decisions lists the return", Returned to TSU, wt-b-07]
      - [TSU Officer, SCR-PM-07, "Clicks Submit requirements for ManCom sign-off before uploading the signed package slip", "The checklist lists the missing signed package slip; the refusal Complete the requirements: ...", Signed slip to be uploaded, wt-b-08]
      - [Marketing Business Services, SCR-PM-08, "Opens Motor package MTR15 renewal and clicks Return incomplete requirements to TSU with the reason", "The stage becomes Requirements preparation", Returned to TSU, wt-b-09]
      - [Marketing Business Services, SCR-PM-13, "Opens MTR12 version 2, clears the minimum premium and sets an effective date before today, then clicks Submit for Validation", "Toast Correct the highlighted fields; under the fields Enter the minimum premium and The effective date cannot be before today", Version stays a draft, wt-b-10]
      - [TSU Head, SCR-PM-13, "Opens the submitted MTR12 version 2 and clicks Return to MBS with the reason", "Toast: Version 2 returned to MBS", Returned to MBS, wt-b-11]
      - [Marketing Business Services, SCR-PM-13, "Opens MTR12 version 2", "The banner Returned by the validator: <reason> above the tabs; the draft can be corrected and submitted again", Draft to correct, wt-b-12]
    downstream:
      - "Every return keeps its reason and comment in the history of the request, and the notice reaches the user who must act."
      - "A refused action changes nothing; the message names what to correct, and a refusal by the system shows its reference for support."

