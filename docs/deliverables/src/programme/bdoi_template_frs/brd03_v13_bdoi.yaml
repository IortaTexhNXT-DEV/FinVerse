# Product Maintenance FRS v1.3 in BDOI's template, BDOI view (product owner direction of 11/12-Oct-2026, the treatment
# of BRD-11 v1.4): the FRS revolves around three sources only - the Product Maintenance BRD (with BRD-00 and the
# programme NFRs of the addenda), BDOI's own FRS (v1.0) and the iNXT BrokerVerse OOTB platform. It does not describe
# the BIBS build of this project; BIBS gives the full-page screenshots only, so that the reader can picture the
# functions and the flows. Read by brd03_bdoi.py, build_bdoi_frs_pm.py (Annexes G and K) and build_brd03_workbooks.py
# (walkthrough users workbook, built from Annex K).

# ------------------------------------------------------------------------------------------------ screenshots
# Full-page screenshots (whole window: header, menu and page) taken at device scale 2 and a window 1440 pixels wide on
# the DEV environment (BROKERVERSE_ENVIRONMENT=dev) with realistic, fictitious data, by
#   FULL_PAGE=1 OUT_DIR=<this folder>/figures/brd03_screens node tools/screenshots/capture_pack.cjs brd03 <regex>
# (tools/screenshots/packs/brd03.cjs, brd03_walkthrough.cjs and brd03_realistic.sql), in the order '^wt-a-',
# '^(scr-pm-..-01-|doc-)', '^wt-b-' on a fresh database. One screenshot per figure.
screens_dir: figures/brd03_screens
portrait_screens: []
screen_note: >-
  Each screen is shown by one full-page screenshot (the whole window with the page header and the menu of the
  persona), taken on the DEV environment with realistic, fictitious data, so that the reader can picture the screen
  and its place in the flow. The screenshot illustrates the requirement; the text of this FRS is the requirement.
  Mandatory: Y = mandatory, N = optional, Cond. = mandatory when the condition stated applies. Dates are shown as
  dd-MMM-yyyy and amounts with thousands separators.
