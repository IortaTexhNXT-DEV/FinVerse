cover:
  drafting: "Drafting support: iorta TechNXT Project Team"

revision_log:
  date: 09 Oct 2026
  version: "1.1"
  description: >-
    Draft for BDOI review: full coverage of the Renewal BRD (version of 8-Oct-2026 with the Walkthrough addendum; the
    42 BRRN requirements and the 1,033 requirement lines of the main BRD), functional requirements elaborated with
    acceptance criteria, new sub-items and entries FRRN.045 to FRRN.049, annexes AA onwards added, observations and
    points for decision listed in Annex AN. Business Unit review edition: summary for the Business Unit, end-to-end
    flows, workflow and approvals, e-mail texts, document formats, reports and schedules, integrations,
    non-functional requirements, open questions not answered in the BDOI FRS, change control, review checklist
  by: iorta TechNXT Project Team (drafting); for review by Angela V. Ramirez

introduction:
  preparation: >-
    This version 1.1 was drafted with the iorta TechNXT Project Team, from the inputs of the business unit and BDO ITG
    and the Renewal BRD of 8-Oct-2026, for review by the System Analyst. BDOI's text of version 1.0 is kept word for
    word; every addition traces to a BRD requirement, and every point where the additions differ from BDOI's text is
    listed for decision in Annex AN.
  overview: >-
    The Renewal BRD issued on 8-Oct-2026 adds, in front of the earlier content, the Renewal Addendum (Walkthrough)
    approved on 14 and 15 May 2026: rule-based sanitation with the TSI threshold to TSU, KYC for visibility, the routing
    of exceptions, the NRNS reminders and the No Advice and Non-Renewal Letters on the effective expiry date (the end of
    a confirmed hold cover), the client confirmation recorded by Marketing with placement and booking kept under
    manual control, the hold cover request from the renewal (BRRN.042) and the incentive eligibility after booking and
    full payment (BRRN.041). This version covers that BRD in full: the 42 BRRN requirements of the addenda and the
    1,033 requirement lines of the main BRD (RMEL Phase 2 - Online Dispositioning).
  references_title: References
  references_intro: "The following documents are used as reference in version 1.1:"
  references:
    - ["Renewal (RN) BRD, issued 8-Oct-2026 (Walkthrough addendum v01.01, Workshop addendum, Addendum 1, RMEL Phase 2 - Online Dispositioning; 215 pages)", "BDO Unibank ESG - Business Project Services", "The baseline of this FRS: every BRD ID is mapped in section Business Requirements Mapping"]
    - ["Concept Paper - Advance Implementation of Renewal Processing v1.0 (signed)", "BDOI", "Superseded by BDOI's decision of 26-Sep-2026 (single go-live; FRRN.045)"]
    - ["BIBS Functional Requirements Specification BRD-06 Renewal v2.0 (8-Oct-2026), with its screens, messages, notifications, walkthroughs and test plan", "iorta TechNXT", "Reference requirements FR-RN-001 to FR-RN-112 incorporated in this FRS (Annex AL)"]
    - ["Comparison of BDOI's Renewal FRS with the BIBS FRS v1.0 (9-Oct-2026)", "iorta TechNXT", "The conflicts and slips listed in Annex AN"]
    - ["User Access Maintenance FRS (BDOI format)", "BDO ITG", "Profiles, functions and access requests (FRRN.001.05)"]
    - ["Review workbooks of BRD-06 v1.0 (9-Oct-2026): Business Unit Requirements Collection; BRD vs Out-of-the-Box vs Best Practice; Change Request Register; Test Cases and Traceability; Business Unit Walkthrough Users", "iorta TechNXT", "Issued with this edition for the review of the Business Unit"]
    - ["BIBS Master Data and Configuration Upload Templates v1.2; BDOI Requirements and Inputs by BRD v1.2; BIBS Non-Functional Requirements Register v1.0", "iorta TechNXT", "Data set-up, inputs and non-functional requirements (Annexes AI, AJ)"]

