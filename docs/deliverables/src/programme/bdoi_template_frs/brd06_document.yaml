    - ["Marketing Account Officer / Admin (Account Broker)", "Views the assigned accounts; gives the disposition; remarks; requests transfers; updates returned accounts; Renewal Advices; client acceptance; reports", "BRD 2.001-2.009"]
    - ["Processing Team Lead", "Generates the RMEL for processing; uploads dispositioned files; assigns Processing Officers; updates data; computations; request to the insurers and their dispositions; Renewal Advices; reports", "BRD 3.001-3.011"]
    - ["Processing Officer / Broker", "Processes the assigned accounts; uploads; updates data; computations; request to the insurers and their dispositions; Renewal Advices; reports", "BRD 4.001-4.09"]
