# Rows added to BDOI's annexes (table index of the source document: B 5, M 18, V 23); logged in Annex AN.4
annex_rows:
  B:
    table: 5
    rows:
      - ["All lines (generated renewal accounts)", "Expiring policy and renewal reference: one open renewal account per expiring policy (BRRN.005)", "Expiring policy and renewal reference: one open renewal account per expiring policy (BRRN.005)", "Expiring policy and renewal reference: one open renewal account per expiring policy (BRRN.005)", "Expiring policy and renewal reference: one open renewal account per expiring policy (BRRN.005)"]
    why: "BRRN.005 asks that the list has no duplicates; the rule applies to every line on top of the criteria per line."
  M:
    table: 18
    rows:
      - ["Non-Acceptance Letter", "All", "1. A Renewal Advice was sent and the client has not accepted it by the effective expiry date (BRRN.025, BRRN.037).", "On the effective expiry date (end of a confirmed hold cover, otherwise the policy expiry date); days after it are a parameter (0 as delivered)"]
    why: "BRRN.025 asks for non-acceptance letters, which the matrix does not list."
  V:
    table: 23
    rows:
      - ["Disapproved", "Returned by the Marketing Team Lead at review because the disposition is disapproved (BRD 1.008.2; counted in the summary counter Disapproved Accounts, BRD 1.009.3.2)", "All Lines"]
    why: "The Renewal Status Report counts the disapproved accounts (BRD 1.009.3.2), which needs this return reason."

