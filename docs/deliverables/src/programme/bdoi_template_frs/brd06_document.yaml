# Annex AN.2 - slips noticed in BDOI's FRS (BDOI's text is not changed)
slips:
  - {ref: S01, topic: "Item number used twice", bdoi: "FRRN.004.06 is used for Endorsement Synchronization and for Export, Save, and Print.", proposal: "Renumber the second item FRRN.004.07 in BDOI's next revision; this version refers to it as FRRN.004.06 (2nd).", impact: "References to FRRN.004.06 are ambiguous (BRRN.007, 008, 011, 032)."}
  - {ref: S02, topic: "Item number used twice", bdoi: "FRRN.038.03 is used for Add Risk Code and for Update of Existing Risk Code Entries.", proposal: "Renumber the second item FRRN.038.04.", impact: "References are ambiguous."}
  - {ref: S03, topic: "Items of another entry", bdoi: "Under FRRN.013 the upload summary and the record-level view are numbered FRRN.012.03 and FRRN.012.04.", proposal: "Renumber them FRRN.013.03 and FRRN.013.04.", impact: "They repeat the numbers of the LAMD items."}
  - {ref: S04, topic: "Numbering starts at .03", bdoi: "FRRN.015 starts at FRRN.015.03; FRRN.002 goes from FRRN.002.02.09 to FRRN.002.05.", proposal: "Keep the numbers (they may be referred to); state in the entry that .01, .02, .03 and .04 are not used.", impact: "Readers look for the missing items."}
  - {ref: S05, topic: "Numbers without the leading zero", bdoi: "FRRN.26.01, FRRN.27.01 to FRRN.27.03 and FRRN.29.03 to FRRN.29.05.", proposal: "Write FRRN.026.01, FRRN.027.01-03 and FRRN.029.03-05.", impact: "Searches for FRRN.026, 027 and 029 miss them."}
  - {ref: S06, topic: "Mapping reference mistyped", bdoi: "BRRN.020 maps to \"RRN.040\"; BRRN.031 maps to \"FRRN.08\".", proposal: "Read FRRN.040 and FRRN.008; this version adds the items (Annex AN.3).", impact: "Two BRRN rows point to no item."}
  - {ref: S07, topic: "Example file names", bdoi: "FRRN.029.02.01: \"PGAI_MTR_FIP_PlacementSlip_...\" carries two product codes; FRRN.029.02.02: the example of the .xlsx placement file is \"MTR_FIP_PlacementFile_1234567890_07172026.pdf\".", proposal: "Use one product code in the slip example; the placement file example ends in .xlsx without a reference number.", impact: "The examples contradict the naming conventions they illustrate."}
  - {ref: S08, topic: "Annex C rows 2 and 3", bdoi: "The same criterion (dollar-denominated TSI above PHP 250M) gives For Quotation in row 2 and For Proposal in row 3.", proposal: "BDOI states the distinguishing condition (for example package and non-package).", impact: "The rule cannot be applied as written."}
  - {ref: S09, topic: "Annex D multi-year expiry", bdoi: "Annex D gives the expiry of the 2-year policy as +730 days and of the 3, 4 and 5-year policies as +365 days.", proposal: "Confirm +1,095, +1,460 and +1,825 days, or the one-year renewal of a multi-year policy.", impact: "The renewal period of multi-year policies."}
  - {ref: S10, topic: "Empty list", bdoi: "FRRN.009.01: \"For CBG Home and Non-CBG accounts, the system shall automatically update the following fields.\" is followed by no field.", proposal: "BDOI gives the fields (requirements collection workbook), or the sentence is removed.", impact: "No automatic update can be specified for CBG Home and Non-CBG."}
  - {ref: S11, topic: "Report specifications", bdoi: "FRRN.044.01: \"The detailed specifications for each report shall be documented in the Annex.\" No annex holds them.", proposal: "The reports of Annex AG carry the specifications of the BIBS reports; BDOI gives the layouts of its other reports (requirements collection workbook).", impact: "13 named reports have no columns or filters."}
  - {ref: S12, topic: "Annexes with a heading only", bdoi: "Annexes I, J, N, O, P, Q, R, T and Z (proposal templates, NRNS, No Advice, Non-Renewal, SFU and FFY letters, placement slip, hold cover) and the CBG Home rules of Annex C hold a heading only.", proposal: "BDOI provides the templates (requirements collection workbook); until then the system's current layouts of Annex AF apply.", impact: "The wording of nine documents is not agreed."}
  - {ref: S13, topic: "QPS reference in a file name", bdoi: "FRRN.017.01: the Full Proposal file name uses the \"BDOI QPS Reference Number\".", proposal: "Use the renewal reference (QPS references are out of scope, BRD Addendum 1 p.60).", impact: "The file name cannot be built."}
  - {ref: S14, topic: "Quotation words in the proposal item", bdoi: "FRRN.017.01 speaks of \"Full Quotation (Package)\" and \"Full Quote\" in the proposal item.", proposal: "Write Full Proposal throughout, once the meaning of For Quotation and For Proposal is decided (Annex AN.1).", impact: "Wording only."}
  - {ref: S15, topic: "Two wordings of one reason", bdoi: "FRRN.007.02: \"Non-Renewable Account\"; FRRN.038.03: \"Non-Renewable Risk Code\"; the BRD: \"Non-renewable Accounts\" (BRD 2.004.4.9).", proposal: "Use the BRD label in both items.", impact: "Reports count two reasons for one cause."}
  - {ref: S16, topic: "Title of FRRN.011", bdoi: "The entry FRRN.011 is titled Account Transfer Request although the request is a referral that keeps the account in its unit.", proposal: "Title it Referral to Another Marketing Unit, if BDOI keeps the referral (Annex AN.1).", impact: "Readers expect the transfer of BRD 1.006."}
  - {ref: S17, topic: "Mapping of BRRN.011", bdoi: "BRRN.011 maps to FRRN.004.06, which is the endorsement or the export item.", proposal: "Keep FRRN.004.06 (endorsements reflected on the mother policy); this version adds FRRN.002.08.", impact: "Ambiguous reference (S01)."}
  - {ref: S18, topic: "Process flow and Annex C", bdoi: "The process flow sends paid-off and RMU loans to Not for Renewal; Annex C makes them Clean / For Renewal when the insurer renews as is.", proposal: "See conflicts C04 and C05 of Annex AN.1.", impact: "Two rules for one case."}

# Annex AN.4 - other observations of version 1.1 (the rows added to BDOI's annexes are added by the builder)
observations:
  - {topic: "Fields not in Annex A", bdoi: "Annex A (embedded catalogue of 224 renewal fields) is kept as issued.", brd: "BRRN.004, 022, 023; BRD 2.006", proposal: "The fields the BRD adds (renewal reference, classification, flags Returned, Transferred, Endorsed, Claims, Outstanding, KYC due, NRNS, Hold Cover confirmed, effective expiry date) are specified with the screens in Annex AA; BDOI adds them to Annex A in its next revision.", impact: "Annex A as issued cannot be extended in this document (embedded object).", by: "System Analyst (BDO ITG)"}
  - {topic: "Signatories of the Business Unit", bdoi: "Signoff Sheet: \"Project Owner / Project Sponsor (add BU signatories, as applicable)\".", brd: "Approval sheets of the Renewal BRD and its addenda", proposal: "Add the approvers of the BRD: Shellah Marie C. Miranda (AVP, Product Owner), Jose Melvin Jarin (AVP, Product Owner), Mark Joseph C. Makalintal (SAVP, Unit Head - Combank and Corbank), Edmundante F. Ramirez (VP, Head - Retail Marketing), Roderick Lim (FVP, Head - Corporate and Retail Marketing).", impact: "Business sign-off of the FRS.", by: "Project Owner; PMO"}
  - {topic: "Delivery channel CCM and MFT", bdoi: "FRRN.017.02, 022.02, 023.02, 029.03-04, 032.02, 033.01, 033.04, 036.06, 037.01 send through CCM and receive through MFT.", brd: "The BRD asks for sending; it does not name CCM or MFT.", proposal: "BDO ITG decides whether CCM and MFT are in scope for go-live; the system's e-mail, with the protection of FRRN.024, and manual uploads are the fall-back (Annex AH).", impact: "Two integrations for BDOI IT; the delivery statuses of BDOI's items depend on them.", by: "BDO ITG; Product Owner, Renewal"}
  - {topic: "Scope beyond the BRD in BDOI's FRS", bdoi: "Dashboards of FRRN.002.02.01-07 (budget, pipeline, closing ratio, top deals, persistency, product mix), FRRN.042 budget maintenance, FRRN.033 e-policy, FRRN.027 billing, FRRN.029-030 placement.", brd: "BRD 1.009.7 and 3.010.7 ask for dashboards of the accounts per officer; placement, billing and issuance are New Business (BRD-01) and Cashiering (BRD-02).", proposal: "Kept as BDOI's requirements; the New Business FRS specifies the shared placement, issuance and billing; the change request register lists them as candidates so that BDOI confirms their priority.", impact: "Scope and schedule of Drop 1.", by: "Product Owner, Renewal; PMO"}
  - {topic: "Main BRD line IDs in the mapping", bdoi: "The mapping lists the 42 BRRN requirements of the addenda.", brd: "The main BRD holds 1,033 requirement lines (BRD 1.001.1 to 6.002.2.25).", proposal: "The 1,033 lines are added to the mapping under the heading of their BRD function, each with its BRD text and its FRRN items; 9 lines are out of scope by Addendum 1 (p.60).", impact: "Full coverage of the BRD.", by: "System Analyst (BDO ITG)"}
  - {topic: "Acceptance criteria", bdoi: "BDOI's items have no acceptance criteria.", brd: "Each BRD line gives a result and a negative scenario.", proposal: "Each item carries numbered acceptance criteria, the basis of the test cases (Test Cases and Traceability workbook).", impact: "UAT is run against the signed criteria.", by: "System Analyst (BDO ITG); Business Unit"}

glossary:
  - ["Account Officer (AO)", "Marketing officer who gives the disposition of a renewal account"]
  - ["ARN", "Account reference number of an account of the system"]
  - ["BDOFC / BDOSOLD (SOLD)", "Reports of BDO's finance company and of sold accounts, uploaded and matched on the PN (FRRN.012.06)"]
  - ["BRD", "Business Requirements Document; here the Renewal BRD of 8-Oct-2026"]
  - ["BRRN", "Requirement of the Renewal addenda (BRRN.001 to BRRN.042)"]
  - ["CBG / Non-CBG", "Consumer Banking Group market segment (CBG Motor, CBG Home) and the other segments (Retail, Corporate)"]
  - ["CCM", "Customer Communication Management, BDO's channel for client communications"]
  - ["CLG", "Consumer lending group accounts initiated in bulk (FRRN.004.07)"]
  - ["CLPC", "The unit that receives the billing files of CBG loans (FRRN.027)"]
  - ["Classification (bucket)", "Clean, Review or Exception (BRRN.023); BDOI's FRS uses Clean, Review and Non-Renewable (Annex AN)"]
  - ["Decision matrix", "Versioned rules that give a disposition to a renewal account, automatically or as a proposal (FRRN.040.02)"]
  - ["DST, VAT, LGT", "Documentary stamp tax, value added tax, local government tax"]
  - ["Effective expiry date", "End of a confirmed hold cover, otherwise the policy expiry date; it drives the NRNS tag and the closing letters"]
  - ["FFY / FFYMI", "Free first year (motor insurance) accounts of CBG Motor"]
  - ["FRRN", "Functional requirement of this FRS"]
  - ["FR-RN", "Reference requirement of the BIBS FRS BRD-06 Renewal, incorporated in this FRS (Annex AL)"]
  - ["Hold cover", "Temporary cover the insurer grants while the renewal is completed (FRRN.036)"]
  - ["IBG", "Institutional Banking Group segment"]
  - ["Initiation", "The explicit start of renewal processing of a generated account (BRRN.021)"]
  - ["KYC", "Know your customer review"]
  - ["LAMD", "Loans administration unit of BDO that provides the loan reports (FRRN.012)"]
  - ["Maker-checker", "A change made by one user takes effect only after a second user approves it"]
  - ["MFT", "Managed file transfer with the insurers"]
  - ["MYP", "Multi-year policy"]
  - ["NAL", "No Advice Letter"]
  - ["NFR / NRL", "Not for Renewal Letter / Non-Renewal Letter (the same letter)"]
  - ["NRNS", "No renew, no submit: an account not submitted at the checkpoint (BRRN.025, 037)"]
  - ["PN", "Promissory note number of a BDO loan"]
  - ["RA", "Renewal Advice"]
  - ["Renewal reference", "Unique reference of a renewal account; the matching key of every upload (BRRN.022)"]
  - ["RMEL", "Renewal Master Expiry List"]
  - ["RMU", "Remedial management unit of BDO loans"]
  - ["Sanitation", "The checks run on a renewal account before classification (BRRN.020)"]
  - ["SFU", "Special follow-up letter for mortgaged accounts"]
  - ["SIT / UAT", "System integration test and user acceptance test; the environments and their users"]
  - ["STP", "Straight-through processing: a Clean account moves on without user action (BRRN.031, 039)"]
  - ["TAT", "Turnaround time"]
  - ["TL / UH", "Team Lead / Unit Head"]
  - ["TSI", "Total sum insured"]
  - ["TSU", "Technical support unit that prepares the non-package proposals"]
  - ["Walkthrough, Workshop addendum, Addendum 1", "The three addenda of the Renewal BRD (May 2026, the workshop addendum and Addendum 1)"]
