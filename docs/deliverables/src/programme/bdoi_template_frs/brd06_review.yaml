# Business Unit review edition of BDOI's Renewal FRS (version 1.1): the summary for the Business Unit (Introduction),
# Annexes AD to AK, AN, AP and AQ, and the observations of Annex AP.5. Read by build_brd06_bdoi_frs.py and by
# build_brd06_workbooks.py. Business words only; the e-mail texts are those of the system (checked at every build
# against the platform: the fragments under "code" must be found word for word).

summary:
  intro: >-
    This section is for the business owners of Renewal who sign this FRS. It shows on a few pages what the
    Renewal Module does, from the RMEL to the booking of the renewal, who does what, the key numbers of the
    document, the decisions the Business Unit must take before signing, and which annex each role reads. BDOI's
    text of version 1.0 is unchanged; the additions of version 1.1 trace to the Renewal BRD of 8-Oct-2026.
  scope_header: ["In scope of this FRS", "Out of scope", "Specified in another FRS"]
  scope:
    - ["RMEL: daily extraction at the lead days and generation by date range; filters, list, export and print (FRRN.002-004)", "EBIX and BDOIsys references and QPS / EBIX searches (BRD Addendum 1, p.60)", "Profiles, functions and access requests: User Access Maintenance FRS"]
    - ["Sanitation, classification, decision matrix, LAMD and insurer dispositions (FRRN.006-013, 038-041)", "Renewal of Employee Benefits lines (HMO, group life, group personal accident): Employee Benefits", "Placement, issuance, booking, service invoice, CLPC billing of the shared New Business flow: New Business FRS"]
    - ["Assignment, transfer, disposition, review and posting by Marketing (FRRN.010-016, 020)", "Gating of the renewal by KYC (KYC is for visibility only, BRRN.028)", "Payments, bounced checks, unapplied payments and refunds: Operations Cashiering FRS"]
    - ["Processing, request to the insurers and their dispositions (FRRN.003, 015, 021)", "Automatic escalation of accounts to the Unit Head (BRRN.036)", "Claims summary and total-loss indicator: Claims FRS"]
    - ["Renewal Advice, letters, NRNS, client acceptance, hold cover, incentive (FRRN.022-028, 034, 036-037)", "Renewals in progress in the legacy systems at go-live (none is carried over; FRRN.045)", "Hand-off of submitted policies: Submitted Policies FRS (FRRN.048 is the Renewal side)"]
    - ["Dashboards, reports, audit, maintenance; go-live take-over (FRRN.002.02, 042-049)", "-", "Migrated policies and their packages: Data Migration FRS"]
  numbers_intro: "The key numbers of this version, by where they are in the document:"
  decisions_intro: >-
    The ten decisions with the widest effect, of the points listed in Annex AO (conflicts between BDOI's FRS and the
    BRD or the system) and Annex AN (open questions not answered in BDOI's FRS). Each must be decided before the
    sign-off, or signed as proposed in this version.
  decisions:
    - [1, "Third classification: Non-Renewable (BDOI) or Exception (BRD BRRN.023); missing data Review or Exception", "C01", "Product Owner, Renewal"]
    - [2, "Paid-off and RMU loans: Not for Renewal (process flow) or renewed as is (Annex C)", "C04, C05", "Product Owner, Renewal; CBG"]
    - [3, "Assignment: automatic round robin (BDOI) or by the Team Lead (BRD 1.005, 3.005)", "C06", "Marketing and Processing Heads"]
    - [4, "Transfer: referral that keeps the account (BDOI) or transfer of the account (BRD 1.006)", "C07", "Marketing Heads"]
    - [5, "Extraction and initiation: by date range only, accounts created at generation (BDOI), or daily at the lead days with an explicit initiation (BRRN.021, 030)", "C08, C09", "Product Owner, Renewal"]
    - [6, "Meaning of For Quotation and For Proposal, and their routing to TSU", "C03, C02", "Marketing; TSU"]
    - [7, "Second approval after the client's acceptance and the automatic Submitted for Placement", "C23, C28", "Product Owner, Renewal; Processing"]
    - [8, "Delivery through CCM and MFT at go-live, with e-mail as the fall-back", "C17", "BDO ITG"]
    - [9, "Letters: lock at the Renewal Advice (BRD 2.004.9) or after posting and placement; NAL and NRL rules", "C11, C15", "Product Owner, Renewal"]
    - [10, "KYC blocking or visibility only; the incentive criteria", "AN.3", "Compliance; Product Owner, Renewal"]
  review_intro: "Which part each role reads, in this order:"
  review_header: ["Role", "Read first", "Then", "About"]
  review:
    - ["Product Owner, Renewal", "This summary; Annex AO; Annex AN", "Annex AD; Annex AQ", "2 hours"]
    - ["Marketing Team Leads and Account Officers", "Process Flow; FRRN.002-020", "Annexes AA, AE, AL", "3 hours"]
    - ["Processing Team Leads and Officers", "Process Flow; FRRN.003, 013, 015, 021-037", "Annexes AA, AF, AL", "3 hours"]
    - ["LAMD, Contact Center", "FRRN.012, FRRN.047", "Annex AA (their screens)", "1 hour"]
    - ["Business Administrator (MBS)", "Annex AC; FRRN.038-042, 049", "Annexes AE, AF, AK", "2 hours"]
    - ["BDO ITG (System Analyst, Tech Lead)", "Business Requirements Mapping; Annex AO", "Annexes AH, AJ, AM, AP", "4 hours"]
  workbooks_intro: "The workbooks issued with this edition:"
  workbooks:
    - ["Business Unit Requirements Collection", "What the Business Unit provides: templates and print formats, e-mail wordings to confirm, schedules, parameters, lists, master data, approvers and users, inputs of BDOI IT, open decisions"]
    - ["BRD vs Out-of-the-Box vs Best Practice", "Every BRD requirement against what the system offers and insurance-broking practice, with the fit"]
    - ["Change Request Register", "How a change is raised after sign-off, the candidate changes and the decision log of Annex AO"]
    - ["Test Cases and Traceability", "BRD ID to FR item to test cases, screens and walkthrough steps; the test cases; the questions answered in BDOI's FRS"]
    - ["Business Unit Walkthrough Users", "The users of the walkthrough with their sign-in IDs, menus and the walkthrough script"]

# Annex AD - Workflow and Approvals
workflow:
  intro: >-
    The stages of the renewal, who makes, checks and approves at each stage, the time rules and the return paths.
    The figure shows the approvals and controls; the process flows in section Process Flow draw each route step by
    step. Four-eyes controls apply to every change of a rule, parameter set, risk code, list of values and package
    choice: the change takes effect only after a second authorised user approves it.
  header: ["Process", "Stage", "Maker", "Checker / approver", "Time rule (SLA, reminder, escalation)", "Return / void"]
  rows:
    - ["RMEL", "Generation and initiation", "Marketing or Processing Team Lead; the daily run", "-", "Daily run at 01:00; lead days 140 (parameter)", "-"]
    - ["Sanitation", "Classification and rule-based disposition", "System", "Team Lead reclassifies or overrides with remarks", "Exception ageing alert after 5 working days", "Reclassification with justification"]
    - ["Assignment", "Assign / re-assign", "Marketing Team Lead; Processing Team Lead", "-", "Until the account is locked", "Re-assign"]
    - ["Transfer", "Request and decision", "Team Lead or Account Officer", "Team Lead of the receiving unit", "-", "Decline with remarks; cancel by the sender"]
    - ["Disposition", "Disposition and submission for posting", "Account Officer", "Marketing Team Lead (approver chosen, FRRN.016.01)", "Ageing flag 30 days before expiry (IBG, Leasing 60); no automatic escalation", "Return with reason and remarks"]
    - ["Posting", "Review and post", "Marketing Team Lead", "-", "-", "Return to the Account Officer"]
    - ["Overrides", "Outstanding balance, classification, disposition, insurer mismatch, RA cancellation", "Marketing Team Lead", "Remarks recorded (no second approver in the BRD; Annex AO)", "-", "-"]
    - ["Processing", "Update, computations, request to the insurer", "Processing Officer", "Processing Team Lead (assignment)", "Insurer reply 10 days; overdue alert", "Return to Marketing"]
    - ["Insurer", "Insurer disposition", "Insurer (file) or Processing", "-", "Late answer blocks straight-through progress", "Revise or Reject reroutes"]
    - ["Renewal Advice", "Generate and send", "Authorised Marketing or Processing user", "-", "First notice 75 days, last notice 45 days before expiry; warning below 30 days", "RA cancellation by override"]
    - ["Acceptance", "Client acceptance", "Account Officer", "Approver of FRRN.26.01 (BDOI); none in the BRD (Annex AO)", "NRNS reminder 75 days before expiry; non-acceptance at the effective expiry date", "Request for Revision returns to the revision"]
    - ["Placement and booking", "Placement, booking", "Processing; booking user", "Override approval for For Booking Only; Unit Head for Direct-to-Insurer Payment", "Placement TAT 3 / 10 business days, cut-off 3 PM", "Rejected Placement returns to Marketing"]
    - ["Hold cover", "Request, extension, confirmation", "System or user", "Insurer", "CBG 75 days before expiry; extension from 7 days before the end", "Rejected returns to the user"]
    - ["Letters", "NRNS, No Advice, Non-Renewal, non-acceptance", "System; Operations; Account Officer", "-", "On the effective expiry date (+1 / +3 days, Annex M)", "Re-open until expiry plus 30 days"]
    - ["Maintenance", "Rules, parameters, risk codes, lists, templates, budget", "Business Administrator", "Second authorised user (four eyes)", "Effective date", "Rejected change stays draft"]
    - ["Go-live", "Package choices; Renewal Advices already sent", "Renewal processing team (maker)", "Second member of the team (checker)", "Once at go-live", "Rejected row corrected"]
  matrix_intro: "Who acts at each stage (M = makes, A = approves or decides, V = views):"
  matrix_header: ["Stage", "Mkt TL", "Mkt AO", "Proc. TL", "Proc. Off.", "Bus. Admin", "LAMD", "Contact Ctr"]
  matrix:
    - ["RMEL generation and initiation", M, V, M, V, "", "", V]
    - ["Assignment", M, V, M, V, "", "", ""]
    - ["Transfer", "M / A", M, "", "", "", "", ""]
    - ["Disposition", V, M, "", "", "", "", V]
    - ["Review and posting; overrides", A, "", "", "", "", "", ""]
    - ["Processing and insurer", V, "", "M / A", M, "", "", ""]
    - ["Renewal Advice and letters", M, M, M, M, "", "", V]
    - ["Client acceptance", M, M, M, M, "", "", V]
    - ["LAMD uploads", V, V, V, V, "", M, ""]
    - ["Follow-ups", V, V, "", "", "", "", M]
    - ["Rules, parameters, lists, templates", "", "", "", "", "M / A", "", ""]
  escalation: >-
    Escalation is by visibility: the attention flags of the renewal listing (ageing, overdue, high risk) and the
    tiles of the dashboard show the accounts that need action, and the Account Officer escalates outside the system;
    the system never escalates an account by itself (BRRN.036). The alerts of Annex AE go to the administrators and
    Team Leads for the runs that failed, the insurer answers that are overdue, the letters not delivered and the
    exceptions that stay open beyond the ageing days.

# Annex AE - E-mail and Notification Texts
emails:
  intro: >-
    Every notice in the system, alert and e-mail of Renewal, with its trigger, recipients, channel, subject or title,
    full text, attachments, protection and frequency. The texts are the wording of the system today (quoted word for
    word; <name> parts are filled in by the system), proposed by iorta TechNXT for BDOI's approval where BDOI has not
    given its own. Where BDOI's FRS gives the wording (Annexes L, S, W, X), BDOI's wording prevails and the difference
    is listed in Annex AP.5; the Business Unit approves each text in the requirements collection workbook (sheet
    E-mail wordings).
  common:
    notice: "A notice appears under the bell in the page header and opens the renewal account; the user chooses on Notification Settings whether the events of Renewal also come by e-mail."
    protection_mail: "The attachment is a password-protected PDF or Excel file; the password is sent in a separate e-mail (AE.24) and is never written in the e-mail that carries the file, on the screens or in the audit log (FRRN.024.01)."
  items:
    - id: AE.01
      name: Account assigned to the Account Officer
      trigger: The Marketing Team Lead assigns or re-assigns renewal accounts (FRRN.010).
      recipients: The Account Officer assigned
      channel: Notice in the system
      subject: "<renewal reference> assigned to you"
      body: "Give the disposition of the renewal of <client>, expiring <expiry date>"
      attachments: None
      frequency: Once per account assigned
      brd: BRD 1.005.1.2; 1.005.2
      frrn: FRRN.010.01
      code: ['" assigned to you"', '"Give the disposition of the renewal of "']
    - id: AE.02
      name: Account assigned for processing
      trigger: The Processing Team Lead assigns renewal accounts to a Processing Officer (FRRN.010.01, FRRN.003.05).
      recipients: The Processing Officer assigned
      channel: Notice in the system
      subject: "<renewal reference> assigned to you for processing"
      body: "<client>"
      attachments: None
      frequency: Once per account assigned
      brd: BRD 3.005.1
      frrn: FRRN.010.01
      code: ['" assigned to you for processing"']
    - id: AE.03
      name: Account classified Exception
      trigger: A sanitation rule fails with the severity Exception on a re-evaluation (FRRN.007.01, FRRN.008.01).
      recipients: The Account Officer and the Processing Officer of the account
      channel: Notice in the system
      subject: "<renewal reference>: Exception"
      body: "A check failed on the renewal of <client>"
      attachments: None
      frequency: Once per change to Exception
      brd: BRRN.023
      frrn: FRRN.008.01
      code: ['": Exception"', '"A check failed on the renewal of "']
    - id: AE.04
      name: LAMD line applied to an account
      trigger: A line of a LAMD report matches a renewal account and is applied (FRRN.012.02).
      recipients: The Team Leads of the unit of the account
      channel: Notice in the system
      subject: "<renewal reference>: LAMD loan fully paid, or <renewal reference>: LAMD loan under RMU"
      body: "Moved from <status> to <status>, or Checks run again; stage <status>"
      attachments: None
      frequency: Once per line applied
      brd: BRRN.029, 039
      frrn: FRRN.012.02
      code: ['": LAMD "', '"loan fully paid"', '"loan under RMU"', '"Checks run again; stage "', '"Moved from "']
    - id: AE.05
      name: Transfer to another unit requested
      trigger: An account is transferred to another Marketing Unit (FRRN.011.06, FRRN.011.05).
      recipients: The Team Leads of the receiving unit
      channel: Notice in the system; e-mail by the user's choice
      subject: "<renewal reference> transferred to your unit"
      body: "Accept or decline the renewal of <client>: <remarks>"
      attachments: None
      frequency: Once per request
      brd: BRD 1.006.5; 1.007.1
      frrn: FRRN.011.05, FRRN.011.06
      code: ['" transferred to your unit"', '"Accept or decline the renewal of "']
    - id: AE.06
      name: Transfer accepted or declined
      trigger: The receiving Team Lead accepts or declines the transfer (FRRN.011.02).
      recipients: The user who requested the transfer
      channel: Notice in the system
      subject: "<renewal reference>: transfer accepted, or <renewal reference>: transfer declined"
      body: "The transfer to <unit> was accepted, or The transfer to <unit> was declined: <remarks>"
      attachments: None
      frequency: Once per decision
      brd: BRD 1.007.4, 1.007.5
      frrn: FRRN.011.05
      code: ['": transfer "', '"The transfer to "', '" was declined: "']
    - id: AE.07
      name: Account returned to the Account Officer
      trigger: The Marketing Team Lead returns an account (FRRN.020.02).
      recipients: The Account Officer of the account
      channel: Notice in the system; e-mail by the user's choice
      subject: "<renewal reference> returned to you"
      body: "<return reason>: <remarks>"
      attachments: None
      frequency: Once per return
      brd: BRD 1.008.2; 2.007.1
      frrn: FRRN.020.02, FRRN.002.08
      code: ['" returned to you"']
    - id: AE.08
      name: Account returned by Processing
      trigger: Processing returns an account to Marketing (FRRN.031.01).
      recipients: The Account Officer, or the Team Leads of the unit for a return to the Team Lead
      channel: Notice in the system; e-mail by the user's choice
      subject: "<renewal reference> returned by Processing"
      body: "<return reason>: <remarks>"
      attachments: None
      frequency: Once per return
      brd: BRD 3.008.2; 4.006.2
      frrn: FRRN.031.01
      code: ['" returned by Processing"']
    - id: AE.09
      name: Account re-opened
      trigger: An account tagged Not for Renewal is re-opened (FRRN.014.07).
      recipients: The Account Officer of the account and the Team Leads of its unit
      channel: Notice in the system
      subject: "<renewal reference> re-opened"
      body: "To the Account Officer - Give a new disposition: <reason>; to the Team Leads - <reason>"
      attachments: None
      frequency: Once per re-open
      brd: BRD 2.004.10; 3.004.5
      frrn: FRRN.014.07
      code: ['" re-opened"', '"Give a new disposition: "']
    - id: AE.10
      name: Account posted for processing
      trigger: The Marketing Team Lead posts an account For Renewal (FRRN.020.01).
      recipients: The Processing Team Leads
      channel: Notice in the system
      subject: "<renewal reference> posted for processing"
      body: "<client>"
      attachments: None
      frequency: Once per account posted
      brd: BRD 1.008.3
      frrn: FRRN.020.01
      code: ['" posted for processing"']
    - id: AE.11
      name: Insurer disposition recorded
      trigger: An insurer disposition is uploaded or recorded on the account (FRRN.013.02, FRRN.013.05).
      recipients: The Processing Officer of the account
      channel: Notice in the system
      subject: "<renewal reference>: insurer response <disposition>"
      body: "Applied to the renewal, or Not applied: check the Insurer tab"
      attachments: None
      frequency: Once per disposition recorded
      brd: BRD 3.009.6; BRRN.035
      frrn: FRRN.013.02, FRRN.013.05
      code: ['": insurer response "', '"Applied to the renewal"', '"Not applied: check the Insurer tab"']
    - id: AE.12
      name: Client accepted the renewal
      trigger: The client's acceptance is recorded (FRRN.025.01).
      recipients: The Account Officer and the Processing Officer of the account
      channel: Notice in the system
      subject: "<renewal reference> accepted by the client"
      body: "<client> accepted the renewal by <method>"
      attachments: None
      frequency: Once per acceptance
      brd: BRRN.040
      frrn: FRRN.025.01
      code: ['" accepted by the client"', '" accepted the renewal by "']
    - id: AE.13
      name: Renewal account ready for placement
      trigger: The accepted renewal account reaches placement and its placement slips are generated (FRRN.028.02, FRRN.029).
      recipients: The Processing Officer of the account
      channel: Notice in the system
      subject: "<renewal reference>: ready for placement"
      body: "<n> placement slip(s) of <ARN> generated; send them from Placement"
      attachments: None
      frequency: Once per renewal account
      brd: BRRN.040
      frrn: FRRN.028.02, FRRN.029.02
      code: ['": ready for placement"', '" generated; send them from Placement"']
    - id: AE.14
      name: Renewal booked
      trigger: The renewal account is booked (FRRN.035.01).
      recipients: The Account Officer and the Processing Officer of the account
      channel: Notice in the system
      subject: "<renewal reference> renewed"
      body: "Booked with invoice <invoice no.>"
      attachments: None
      frequency: Once per renewal
      brd: BRRN.040
      frrn: FRRN.035.01
      code: ['" renewed"', '"Booked with invoice "']
    - id: AE.15
      name: Renewal closed, expired without renewal
      trigger: The effective expiry date passes without acceptance (FRRN.023.03).
      recipients: The Account Officer and the Processing Officer of the account
      channel: Notice in the system
      subject: "<renewal reference> closed: expired without renewal"
      body: "The policy of <client> expired on <date>; Operations sends the No Advice Letter, or The policy of <client> expired on <date>; the Account Officer sends the Non-Renewal Letter"
      attachments: None
      frequency: Once per account
      brd: BRRN.025, 037
      frrn: FRRN.023.03
      code: ['" closed: expired without renewal"', '"; Operations sends the No Advice Letter"', '"; the Account Officer sends the Non-Renewal Letter"']
    - id: AE.16
      name: Go-live take-over completed
      trigger: The go-live extraction of the migrated policies completes (FRRN.045.01).
      recipients: The users who generate the RMEL (Marketing and Processing Team Leads)
      channel: Notice in the system; e-mail by the user's choice
      subject: "Go-live renewals taken over (<n>)"
      body: "<n> renewals, <n> urgent; by expiry month <month>: <count>, ..."
      attachments: None
      frequency: Once at go-live
      brd: BRRN.005
      frrn: FRRN.045.01
      code: ['"Go-live renewals taken over ("', '" urgent"', '"; by expiry month "']
    - id: AE.17
      name: Package choice approved or rejected
      trigger: The checker decides the package chosen for a migrated policy (FRRN.046.01).
      recipients: The user who chose the package
      channel: Notice in the system
      subject: "<renewal reference>: package choice approved, or <renewal reference>: package choice rejected"
      body: "<package version> applies to the renewal, or <package version> was rejected: <remarks>"
      attachments: None
      frequency: Once per decision
      brd: BRRN.020
      frrn: FRRN.046.01
      code: ['": package choice "', '" applies to the renewal"', '" was rejected: "']
    - id: AE.18
      name: Alert - extraction run failed
      trigger: The daily extraction fails (FRRN.004.04).
      recipients: The administrators who receive the alerts of Renewal
      channel: Alert (alert inbox)
      subject: Renewal extraction failed
      body: "The renewal extraction of <date> failed: <reason>"
      attachments: None
      frequency: Once per failed run; the next run takes the missed dates
      brd: BRRN.030
      frrn: FRRN.004.04
      code: ['"The renewal extraction of "', '" failed: "']
    - id: AE.19
      name: Alert - insurer answer overdue
      trigger: An insurer has not answered a request by its reply date (FRRN.021).
      recipients: The administrators and the Processing Team Leads who receive the alerts of Renewal
      channel: Alert (alert inbox)
      subject: Insurer renewal batch overdue
      body: "Insurer <insurer> has not answered batch <batch no.> due <date>"
      attachments: None
      frequency: Once per request and day overdue, until answered
      brd: BRD 3.009.6
      frrn: FRRN.021
      code: ['" has not answered batch "']
    - id: AE.20
      name: Alert - letter not delivered
      trigger: A Renewal Advice or letter could not be delivered (FRRN.022.02, FRRN.023.02).
      recipients: The administrators who receive the alerts of Renewal
      channel: Alert (alert inbox)
      subject: Renewal letter not delivered
      body: "Letter <letter no.> was not delivered: <error>"
      attachments: None
      frequency: Once per letter
      brd: BRRN.010
      frrn: FRRN.022.02, FRRN.023.02
      code: ['" was not delivered: "']
    - id: AE.21
      name: Alert - exception ageing
      trigger: An account stays Exception beyond the ageing days, 5 working days as delivered (FRRN.008.01).
      recipients: The administrators and Team Leads who receive the alerts of Renewal
      channel: Alert (alert inbox)
      subject: Renewal exception ageing
      body: "Renewal <renewal reference> is an Exception since <date>"
      attachments: None
      frequency: Once per account and day while it stays Exception
      brd: BRRN.029 (R29-05)
      frrn: FRRN.008.01
      code: ['" is an Exception since "']
    - id: AE.22
      name: Renewal Advice e-mail (first notice)
      trigger: Send on the Letters screen (FRRN.022.02).
      recipients: The client's registered e-mail address
      channel: E-mail
      subject: "Renewal Advice - <assured name> - policy <policy no.>"
      body: "Dear <client name>,\n\nYour policy <policy no.> with <insurer name> expires on <expiry date>. We are pleased to offer its renewal for the period <renewal from> to <renewal to> on the following terms:\n\nProduct: <product name>\nSum insured: <currency> <sum insured>\nRenewal premium: <currency> <gross premium>\n\nTo renew, please reply to this e-mail, sign and return this Renewal Advice, or pay the renewal premium on or before <expiry date>.\n\nRenewal reference: <renewal reference>\nAccount officer: <account officer name>\n\nThank you for your continued trust,\nBDO Insurance and Reinsurance Brokers, Inc."
      attachments: "<letter no.>.pdf (the Renewal Advice), password protected"
      frequency: Once per Renewal Advice sent; resent on request
      brd: BRRN.010; BRD 1.010.7
      frrn: FRRN.022.01, FRRN.022.02
      code: ["Renewal Advice - {{assuredName}} - policy {{policyNo}}", "We are pleased to offer its renewal for the period"]
      source: [renewal/letter/service/LetterWriter.java]
      bdoi: "BDOI's approved Renewal Advice templates BDOI-005 to BDOI-008 (one per line) and e-mails BDOI-009 to BDOI-011 (Annex L) prevail; the system's text is replaced by them (Annex AP.5)."
    - id: AE.23
      name: Renewal Advice e-mail (second / last notice)
      trigger: Send of a second notice on the Letters screen (FRRN.022.01).
      recipients: The client's registered e-mail address
      channel: E-mail
      subject: "Second notice: Renewal Advice - <assured name> - policy <policy no.>"
      body: "Dear <client name>,\n\nThis is our second notice on the renewal of your policy <policy no.> with <insurer name>, which expires on <expiry date>. The renewal terms remain:\n\nSum insured: <currency> <sum insured>\nRenewal premium: <currency> <gross premium>\n\nPlease reply to this e-mail, sign and return this Renewal Advice, or pay the renewal premium on or before <expiry date> to keep your cover.\n\nRenewal reference: <renewal reference>\nAccount officer: <account officer name>\n\nBDO Insurance and Reinsurance Brokers, Inc."
      attachments: "<letter no.>.pdf, password protected"
      frequency: Once per notice
      brd: BRRN.010
      frrn: FRRN.022.01
      code: ["Second notice: Renewal Advice - {{assuredName}}", "This is our second notice on the renewal of your policy"]
      bdoi: "BDOI's templates mark the last notice FINAL NOTICE (Annex L); BDOI's wording prevails (Annex AP.5)."
    - id: AE.24
      name: Password e-mail
      trigger: Follows every protected e-mail of Renewal (Renewal Advice, letters, request to the insurer).
      recipients: The same recipients as the protected e-mail
      channel: E-mail
      subject: "Password for: <subject of the protected e-mail>"
      body: "The documents sent to you in the e-mail \"<subject>\" are password protected.\n\nPassword: <password>\n\nThis e-mail was sent separately for your security. Please do not forward it."
      attachments: None
      frequency: Once per protected e-mail
      brd: BRRN.010; BRD 1.010.7.1
      frrn: FRRN.024.01, FRRN.022.02
      code: ['"Password for: "', '" are password protected.', '"\n\nThis e-mail was sent separately for your security. Please do not forward it."']
      bdoi: "BDOI's convention (FRRN.024.01) lets the client derive the password, which BDOI's e-mails BDOI-009 to BDOI-011 explain; whether the separate password e-mail is still sent is a decision (Annex AP.5)."
    - id: AE.25
      name: No Advice Letter e-mail
      trigger: Send Letters on the No Advice tab (FRRN.023.02).
      recipients: The client's registered e-mail address
      channel: E-mail
      subject: "Notice on your policy <policy no.>"
      body: "Dear <client name>,\n\nThis is to inform you that your policy <policy no.> with <insurer name>, expiring on <expiry date>, will not be renewed through BDO Insurance and Reinsurance Brokers, Inc. No further action is needed from you.\n\nReference: <renewal reference>\nAccount officer: <account officer name>"
      attachments: "<letter no.>.pdf, password protected"
      frequency: Once per account
      brd: BRRN.001
      frrn: FRRN.023.01, FRRN.023.02
      code: ["Notice on your policy {{policyNo}}", "will not be renewed through BDO Insurance and Reinsurance Brokers, Inc."]
      bdoi: "Annex O (No Advice Letter Template) is a heading only: the Business Unit confirms this text or gives its template."
    - id: AE.26
      name: Non-Renewal Letter e-mail
      trigger: Send Letters on the Non-Renewal tab (FRRN.023.02; FRRN.038.03).
      recipients: The client's registered e-mail address
      channel: E-mail
      subject: "Your policy <policy no.> will not be renewed"
      body: "Dear <client name>,\n\nWe regret to inform you that your policy <policy no.> with <insurer name>, expiring on <expiry date>, is not for renewal: <reason>.\n\nFor questions, please contact your account officer <account officer name>.\n\nReference: <renewal reference>\nBDO Insurance and Reinsurance Brokers, Inc."
      attachments: "<letter no.>.pdf, password protected"
      frequency: Once per account
      brd: BRRN.009, 037
      frrn: FRRN.023.02, FRRN.038.03
      code: ["Your policy {{policyNo}} will not be renewed", "We regret to inform you that your policy"]
      bdoi: "Annex P (Non-Renewal Letter Template) is a heading only: the Business Unit confirms this text or gives its template."
    - id: AE.27
      name: NRNS reminder letter e-mail
      trigger: The nightly letter run at the NRNS checkpoint (FRRN.023.03).
      recipients: The client's registered e-mail address
      channel: E-mail
      subject: "Reminder: renewal of your policy <policy no.>"
      body: "Dear <client name>,\n\nYour policy <policy no.> with <insurer name> expires on <expiry date> and its renewal has not been confirmed yet. Please contact your account officer <account officer name> to renew your cover.\n\nReference: <renewal reference>"
      attachments: "<letter no.>.pdf, password protected"
      frequency: Once per account and checkpoint
      brd: BRRN.025
      frrn: FRRN.023.03
      code: ["Reminder: renewal of your policy {{policyNo}}", "its renewal has not been confirmed yet"]
      bdoi: "Annex N (NRNS Reminder Letter Template) is a heading only: the Business Unit confirms this text or gives its template."
    - id: AE.28
      name: Non-acceptance letter e-mail
      trigger: The effective expiry date passes without acceptance (FRRN.023.03).
      recipients: The client's registered e-mail address
      channel: E-mail
      subject: "Your policy <policy no.> has expired"
      body: "Dear <client name>,\n\nYour policy <policy no.> with <insurer name> expired on <expiry date> without renewal, as we did not receive your acceptance of the Renewal Advice. Your property or risk is no longer covered by this policy.\n\nPlease contact your account officer <account officer name> if you wish to be covered again.\n\nReference: <renewal reference>"
      attachments: "<letter no.>.pdf, password protected"
      frequency: Once per account
      brd: BRRN.025, 037
      frrn: FRRN.023.03
      code: ["Your policy {{policyNo}} has expired", "as we did not receive your acceptance of the Renewal Advice"]
      bdoi: "Not in BDOI's matrix; added as a row of Annex M (Annex AP.4)."
    - id: AE.29
      name: Renewal Advice of a free-first-year account (FFY)
      trigger: The Renewal Advice of a submitted FFY policy (FRRN.048.01).
      recipients: The client's registered e-mail address (or print through the mail house)
      channel: E-mail or print
      subject: "Renewal Advice (first year free) - <assured name> - policy <policy no.>"
      body: "Dear <client name>,\n\nThe first year of your policy <policy no.> with <insurer name> was free of charge and ends on <expiry date>. To keep your cover, we offer its renewal for the period <renewal from> to <renewal to>:\n\nSum insured: <currency> <sum insured>\nRenewal premium: <currency> <gross premium>\n\nTo renew, please sign and return this Renewal Advice, or pay the renewal premium on or before <expiry date>.\n\nRenewal reference: <renewal reference>\nAccount officer: <account officer name>\n\nThank you for your trust,\nBDO Insurance and Reinsurance Brokers, Inc."
      attachments: "<letter no.>.pdf, password protected"
      frequency: Once per account
      brd: BRRN.010 (submitted policies)
      frrn: FRRN.048.01
      code: ["Renewal Advice (first year free) - {{assuredName}}", "was free of charge and ends on"]
      bdoi: "Annex R (FFY Reminder Letter Template) is a heading only: the Business Unit confirms this text or gives its template."
    - id: AE.30
      name: SFU letter (mortgaged accounts)
      trigger: Follow-up of a mortgaged submitted policy without answer to the Renewal Advice (FRRN.048.01).
      recipients: The client's registered e-mail address (or print)
      channel: E-mail or print
      subject: "Follow-up on the renewal of your mortgaged property - policy <policy no.>"
      body: "Dear <client name>,\n\nYour property is mortgaged to the bank and must stay insured. Your policy <policy no.> expires on <expiry date> and we have not received your answer to our Renewal Advice.\n\nPlease sign and return the Renewal Advice, or pay the renewal premium, on or before <expiry date>.\n\nRenewal reference: <renewal reference>\nAccount officer: <account officer name>\n\nThank you,\nBDO Insurance and Reinsurance Brokers, Inc."
      attachments: "<letter no.>.pdf, password protected"
      frequency: Once per account
      brd: BRRN.010 (submitted policies)
      frrn: FRRN.048.01
      code: ["Follow-up on the renewal of your mortgaged property", "Your property is mortgaged to the bank and must stay insured."]
      bdoi: "Annex Q (SFU Letter Template) is a heading only: the Business Unit confirms this text or gives its template."
    - id: AE.31
      name: Request for renewal disposition to the insurer
      trigger: Send on a request to the insurer (FRRN.021).
      recipients: The renewal e-mail addresses of the insurer (Insurer Maintenance)
      channel: E-mail
      subject: "Renewals for your decision - batch <batch no.>"
      body: "Dear <insurer name>,\n\nPlease find attached the policies expiring from <expiry from> to <expiry to> that we propose for renewal (<count> accounts). Please return the file with your decision on each account (Renew As Is, Revise or Reject) by <reply date>.\n\nBDO Insurance and Reinsurance Brokers, Inc. - Processing"
      attachments: "The request file (Excel, 28 fields), password protected"
      frequency: Once per request; resent on failure
      brd: BRD 3.009.5; 4.007.5
      frrn: FRRN.021
      code: ["Renewals for your decision - batch {{batchNo}}", "Please return the file with your decision on each account"]
      source: [renewal/insurer/service/InsurerBatchService.java]
      bdoi: "BDOI's FRS gives the success message of FRRN.021 but no e-mail text: the Business Unit confirms this text."
