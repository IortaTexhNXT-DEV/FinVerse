    of this FRS, and the programme register of non-functional requirements they trace to. The BRD gives no IDs to its
    usage requirements; they are numbered RN-NFR-nn here.
  header: ["No.", "Topic", "Requirement (BRD / BDOI FRS)", "How the system meets it", "FR item", "NFR register"]
  rows:
    - ["RN-NFR-01", "Users", "Marketing Team Leads 75 (23 concurrent); Account Officers / Brokers 319 (50); Processing Team Leads 50 (15) for lists, 9 (3) for assignment and upload; Processing Officers 73 (22); reports and Renewal Advices 485 (145) (BRD p.212)", "Within the sizing of 145 concurrent users of the broking modules; Renewal adds load, not users", "FRRN.001.02", "NFR-CAP-01"]
    - ["RN-NFR-02", "Volumes", "25,800 transactions a month per process, growth 20% a year (BRD p.212)", "About 26,000 renewal accounts a month, without decline for five years", "FRRN.004.04", "NFR-CAP-02, NFR-CAP-03"]
    - ["RN-NFR-03", "Response time", "10 seconds online; 20 seconds for reports and Renewal Advice generation (BRD p.213)", "Lists served in parts; Renewal Advice generation and batch sending in the background with progress; reports within 20 seconds at 30,000 rows", "FRRN.002.05, 022.01, 044.01", "NFR-PRF-01, NFR-PRF-03, NFR-PRF-06"]
    - ["RN-NFR-04", "Peak", "Month-end; 08:00-10:00 and 15:00-17:00 daily (BRD p.213)", "Extraction, re-evaluation and letter runs at night", "FRRN.004.04", "NFR-CAP-05, NFR-PRF-07"]
    - ["RN-NFR-05", "One view without pages", "\"The system shall not use pagination\" (FRRN.004.04); one scrollable view (BRRN.004)", "Lists of up to 30,000 rows in one scrollable view with the row count", "FRRN.002.05", "NFR-USE-02"]
