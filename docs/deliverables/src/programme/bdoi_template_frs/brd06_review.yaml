# Annex AN - Assumptions, dependencies and open questions; classification of every earlier question
open_items:
  intro: >-
    Only the points that BDOI's FRS does not answer. Every open question, assumption and clarification of the BIBS
    FRS of Renewal (references RQ, CLR-RN, A-RN, D-RN, DMQ) and every Renewal row of the BDOI Requirements and Inputs
    by BRD v1.2 was checked against BDOI's FRS: a point BDOI's FRS answers is not repeated here and is listed, with
    BDOI's clause, in the sheet "Answered in the BDOI FRS" of the Test Cases and Traceability workbook; where BDOI's
    answer differs from the BRD, the decision is in Annex AO. Values and data the Business Unit provides are in the
    requirements collection workbook. The reference numbers keep the link to the earlier decisions.
  assumptions:
    - ["A-RN-01", "The Walkthrough addendum is the latest layer and governs the BRRN it restates; the Workshop addendum governs the other BRRN.020-040; a BRRN of Addendum 1 governs the main-BRD IDs it restates; the main BRD governs the rest.", "BRD of 8-Oct-2026"]
    - ["A-RN-08", "The renewal is a new account of business type Renewal; the expiring account is never endorsed to renew it.", "Decision D1; FRRN.005.01"]
    - ["A-RN-09", "The payment rules of BRRN.040 and BRRN.041 are those of the payment gate of New Business and Cashiering.", "FRRN.028; FRRN.034"]
    - ["A-RN-11", "Renewal volume is 25,800 transactions a month per process, growing 20% a year.", "BRD p.212; Annex AJ"]
    - ["A-RN-13", "The hold cover of a renewal uses the hold cover request and confirmation of New Business on the renewal account.", "BRRN.042; FRRN.036"]
  dependencies:
    - ["D-RN-01", "The business type Renewal of the account is shared with the New Business booking.", "FRRN.005.01, 018.02, 035.01"]
    - ["D-RN-02", "The Claims module gives the claims of the expiring term and the total-loss settlement tag.", "FRRN.007.02, 014.01"]
    - ["D-RN-03", "Submitted Policies hands its expiring records over to Renewal.", "FRRN.048"]
    - ["D-RN-06", "The e-mail relay (or CCM) of the BDOI environment is available for client and insurer e-mails.", "FRRN.021, 022.02"]
    - ["D-RN-08", "The incentive criteria of Product Maintenance are given.", "FRRN.034.01"]
  open_header: ["No.", "Our reference", "Question", "Why (BDOI's FRS)", "Format of the answer", "Owner", "Needed by"]
  open:
    - {refs: "RQ04", q: "Lead days of the daily extraction per segment or line (140 proposed), in addition to the generation by date range of FRRN.004.", why: "BDOI's FRS has the generation by date range only; BRRN.030 asks for configurable lead days (Annex AO C08).", fmt: "Days per market segment (Non-CBG, CBG Motor, CBG Home)", owner: "Product Owner, Renewal", by: 2026-11-30}
    - {refs: "RQ09", q: "Outstanding balance: which balances count (the expiring invoice only, the client, all years), the threshold, and who may override.", why: "Annex C routes an outstanding balance to Review without threshold or override (BRD 1.011).", fmt: "Scope; amount; role", owner: "Product Owner, Renewal", by: 2026-11-30}
    - {refs: "RQ10", q: "Definition of the 34 summary counters of the Renewal Status Report, including For ARF, Renew to TSU, Disapproved and to Other Bank.", why: "BDOI's FRS does not specify the Renewal Status Report.", fmt: "Rule per counter (status, disposition, reason)", owner: "Product Owner, Renewal", by: 2026-11-30}
    - {refs: "RQ11; CLR-RN-35", q: "Ageing, overdue and high-risk criteria of the renewal listing, and whether the Account Officer may be notified.", why: "BDOI's FRS has no listing with attention flags (BRRN.036).", fmt: "Days per segment; criteria; Yes / No", owner: "Product Owner, Renewal", by: 2026-11-30}
    - {refs: "RQ16; CLR-RN-12", q: "Approved recipient domains for the Renewal Advice e-mails, if any.", why: "BDOI's FRS gives the password rule (FRRN.024.01) but not the approved domains of the BRD.", fmt: "List of domains, or None", owner: "BDOI IT", by: 2027-01-31}
    - {refs: "RQ21", q: "Contact Center follow-up outcomes and the lists the Contact Center sees.", why: "BDOI's FRS refers to the User Access Matrix only (BRRN.026).", fmt: "List of outcomes; lists", owner: "Contact Center Head", by: 2026-11-30}
    - {refs: "RQ22", q: "Source of the KYC data of bank clients and the KYC review dates.", why: "FRRN.039.01 makes the criteria configurable without naming the source.", fmt: "Source system; field", owner: "Compliance", by: 2027-01-31}
    - {refs: "RQ25", q: "Financial-impact tolerance (any change, or an amount or %) for the routing to the New Business path.", why: "BDOI's FRS has no financial-impact rule (BRRN.038).", fmt: "Amount or %", owner: "Product Owner, Renewal", by: 2026-11-30}
