  - {topic: "Renewal at risk", bdoi: "-", brd: "BRRN.036: no automatic escalation", proposal: "The at-risk accounts are shown by the ageing flag and the dashboard; no message is sent (Annex AE).", impact: "None; to be confirmed with RQ11.", by: "Product Owner, Renewal"}
