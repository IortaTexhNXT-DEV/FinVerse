  rows:
    - ["Scope", "Summary for the Business Unit Review", "In scope, out of scope and the other FRS", "Product Owner, Renewal"]
    - ["BRD coverage", "Business Requirements Mapping; Annex AM", "Every BRD ID maps to an FR item", "System Analyst (BDO ITG)"]
