# Annex AF - Document Prints and Output Formats
documents:
  intro: >-
    Every document the Renewal Module prints, e-mails or exports: purpose, recipients, format, protection, the fields
    in order and, where the system has one, an image of its current layout. Where BDOI's FRS gives the template, BDOI's
    template prevails; where it does not, the layout is to be provided or confirmed by the Business Unit (item of the
    requirements collection workbook, sheet Documents and print formats). Every PDF letter carries the BDO Insure
    letterhead, the page number and the template version.
  file_name_rule: >-
    File names follow BDOI's conventions where BDOI's FRS gives them (RMEL_<MMM>_<YYYY>_<MMDDYYYY>.xlsx,
    <Product>_RA_<Notice>_<Reference>_<MMDDYYYY>.pdf, <Product>_<Letter Type>_<Reference>_<MMDDYYYY>.pdf, IA_<Reference>_
    <MMDDYYYY>.pdf, Renewal Account Details.xlsx, LAMD Processing Result_ MMDDYYYY.xlsx, Audit Logs_MMDDYYYY); the
    others use the document number of the system (for example RA-2027-000123.pdf).
  items:
    DO-01: {purpose: "Offer the renewal to the client: first and last notice (BRRN.010)", recipients: "Client (e-mail, protected)", bdoi: "Annex L: approved templates BDOI-005 to BDOI-008, one per line (Motor, PAR CLG, PAR Non-CLG, Other Lines) - they prevail", rc: RC-DOC-01}
    DO-02: {purpose: "Tell the client that the policy is not renewed: No Advice Letter and Non-Renewal Letter (BRRN.001, 009, 037)", recipients: "Client (e-mail, protected)", bdoi: "Annexes O and P: heading only - layout to be provided", rc: RC-DOC-02}
    DO-03: {purpose: "Request the insurer's renewal disposition: the 28 fields of BRD 3.009.1.4", recipients: "Insurer (e-mail, protected)", bdoi: "FRRN.021 lets the user choose the fields; Annex H gives the CBG return layout", rc: RC-DOC-03}
    DO-04: {purpose: "The RMEL and every renewal list as displayed (BRRN.007)", recipients: "The user (download)", bdoi: "FRRN.004.06: file name RMEL_<MMM>_<YYYY>_<MMDDYYYY>.xlsx", rc: RC-DOC-04}
    DO-05: {purpose: "The details of one renewal account (BRD 1.004.1.3)", recipients: "The user (download)", bdoi: "FRRN.014.06: Renewal Account Details.xlsx", rc: RC-DOC-05}
  extra:
    - {id: DO-06, name: "Quick Proposal and Full Proposal", purpose: "Proposal of a For Proposal renewal (FRRN.017.01)", recipients: "Client", format: "PDF", produced: "Renewal account, Generate Proposal Slip", protected: "Yes when sent", fields: ["Client and risk", "Insurers and terms of the comparative table", "Premium", "Signatories (two; three for a non-package TSI above PHP 500M)"], bdoi: "Annexes I and J: heading only", rc: RC-DOC-06}
    - {id: DO-07, name: "TSU quotation request", purpose: "Request of a For Quotation renewal to TSU (FRRN.018.01)", recipients: "TSU", format: "Request in the system", produced: "Renewal account, TSU request", protected: "No (in the system)", fields: ["The fields per line of Annex K"], bdoi: "Annex K: given (14 lines)", rc: RC-DOC-07}
    - {id: DO-08, name: "NRNS reminder, SFU and FFY reminder letters", purpose: "Reminders before expiry (FRRN.023.03, FRRN.048.01)", recipients: "Client (e-mail, protected, or print)", format: "PDF", produced: "Nightly letter run; Letters", protected: "Yes when e-mailed", fields: ["Client and policy", "Expiry date", "What to do and by when", "Renewal reference and Account Officer"], bdoi: "Annexes N, Q and R: heading only", rc: RC-DOC-08}
    - {id: DO-09, name: "Non-acceptance letter", purpose: "Tell the client that the policy expired without renewal (FRRN.023.03)", recipients: "Client (e-mail, protected)", format: "PDF", produced: "Nightly letter run", protected: "Yes", fields: ["Client and policy", "Expiry date", "No cover", "Account Officer"], bdoi: "Not in BDOI's FRS (row added to Annex M)", rc: RC-DOC-09}
    - {id: DO-10, name: "CLPC billing file and e-mail", purpose: "Billing of CBG Home and FFY Motor renewals (FRRN.027)", recipients: "BDO CBG Loan Services", format: "CSV (Built-in, Non-Built-in) with e-mail", produced: "Scheduled and manual billing", protected: "As BDO ITG decides (Annex AH)", fields: ["The 13 fields of Annex S"], bdoi: "Annex S: given (form BFP-001-2026-0)", rc: RC-DOC-10}
    - {id: DO-11, name: "Placement slip and placement file", purpose: "Placement with the insurer (FRRN.029.02)", recipients: "Insurer", format: "PDF slip per insurer and account; Excel file per insurer", produced: "Generate Placement", protected: "Yes when e-mailed", fields: ["The 42 fields of Annex U", "Risk description per package and line (Annex U)"], bdoi: "Annex T: heading only (slip); Annex U: given (file)", rc: RC-DOC-11}
    - {id: DO-12, name: "Insurance Advice", purpose: "Advice to the mortgagee bank (FRRN.032)", recipients: "Client and the BDO unit of the mortgage", format: "PDF", produced: "On sending of the placement", protected: "Yes when e-mailed", fields: ["As templates IA-001 to IA-004 (Annex W)"], bdoi: "Annex W: given", rc: RC-DOC-12}
    - {id: DO-13, name: "E-policy e-mail", purpose: "Sending of the e-policy to the client (FRRN.033.04)", recipients: "Client", format: "E-mail with the e-policy PDF", produced: "E-policy sending", protected: "Yes (FRRN.024.01)", fields: ["As templates BDOI-012 to BDOI-014 (Annex X)"], bdoi: "Annex X: given", rc: RC-DOC-13}
    - {id: DO-14, name: "Service invoice", purpose: "Invoice of the brokerage service on booking (FRRN.035)", recipients: "Insurer", format: "PDF", produced: "Booking", protected: "No", fields: ["As the image of Annex Y"], bdoi: "Annex Y: given (image)", rc: RC-DOC-14}
    - {id: DO-15, name: "Hold cover request", purpose: "Request of a hold cover or extension (FRRN.036)", recipients: "Insurer", format: "PDF with e-mail, or Excel batch per insurer (CBG)", produced: "Hold cover request; scheduled CBG requests", protected: "No as delivered (Annex AP.5)", fields: ["Insurer and ARN", "Client and risk", "Start date and duration", "Reference"], bdoi: "Annex Z: heading only", rc: RC-DOC-15}
    - {id: DO-16, name: "Upload results and exports of lists", purpose: "Processing results of the LAMD, BDOFC/SOLD, insurer disposition, renewal update, hold cover and e-policy uploads; audit log export", recipients: "The user (download)", format: "Excel or CSV", produced: "Each upload summary; Audit Logs", protected: "No", fields: ["The columns of the record-level views (FRRN.012.04, 015.06, 030.04, 033.03, 037.04)"], bdoi: "File names given (FRRN.012.03, 012.08, 043.01)", rc: RC-DOC-16}

# Annex AG - Reports and Schedules
reports:
  intro: >-
    The reports of Renewal: who uses each, its filters, columns, sort and output. Every report applies the user's data
    scope, exports to Excel and PDF (the operational reports also to ODS and CSV), has a print preview and saved
    variants, and is produced within 20 seconds for up to 30,000 rows. BDOI's reports of FRRN.044.01 that the BRD does
    not specify are listed with the layout to be provided by the Business Unit.
  header: ["Report", "Users", "Filters", "Columns", "Summary", "Sort", "Output", "BRD / FR item"]
  rows:
    - ["Renewal Status Report", "All report users", "Expiry date range; the 20 criteria of BRD 1.009.2", "37 (Marketing) or 40 (Processing) columns of BRD 1.009.3.1", "34 counters of BRD 1.009.3.2", "Expiry date", "Excel, PDF", "BRRN.019; BRD 1.009, 2.008, 3.010, 4.008; FRRN.044.02"]
    - ["RMEL (List of Expiring Accounts)", "Marketing and Processing", "Expiry date range; the filters of FRRN.004.03", "The columns of FRRN.002.05", "Row count", "Expiry date", "Excel; print", "BRRN.004, 007; FRRN.004.06"]
    - ["Renewal listing with attention flags", "Marketing Team Leads, Unit Heads, Account Officers", "Unit, segment, expiry window, status", "Account, status, days to expiry, flag and its rule", "Counts by status", "Days to expiry", "Excel, PDF", "BRRN.036; FRRN.044.03"]
    - ["Request per insurer", "Processing", "Insurer, expiry range", "The 28 fields of BRD 3.009.1.4", "Number of accounts", "Expiry date", "Excel", "BRD 3.009, 4.007; FRRN.021"]
    - ["Letter log", "Marketing, Processing", "Letter type, period, status", "Letter, account, recipient, sent on, delivery status", "Counts by status", "Sent on", "Excel, PDF", "BRRN.001, 010, 025, 037; FRRN.044.04"]
    - ["Sanitation results", "Processing, Business Administrator", "Date range, rule, result", "Account, rule, result, detail, classification and changes", "Counts by rule", "Date", "Excel, PDF", "BRRN.020, 023; FRRN.044.04"]
