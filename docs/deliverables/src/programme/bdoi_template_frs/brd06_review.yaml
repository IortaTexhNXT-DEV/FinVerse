# Annex AP - Change control after sign-off
change_control:
  intro: >-
    Once BDOI signs this FRS, it is the baseline of the Renewal Module. A change is raised, assessed, approved,
    scheduled, tested and closed through the Change Request Register workbook, under the project's change management
    process stated in the Introduction.
  freezes:
    - "The FR items, their statements and acceptance criteria, and the Business Requirements Mapping."
    - "The screens, fields, messages, e-mail and letter texts, documents, reports and uploads of Annexes AA to AG."
    - "The workflow and approvals of Annex AD and the interfaces of Annex AH."
  not_frozen: >-
    Not frozen: the values the Business Administrator maintains in the system (parameters, lists of values, rules
    and the decision matrix, risk codes, templates) - they are changed in the system with four eyes, without a change
    request - and the answers to the open questions of Annex AN, which are applied as configuration or, where they
    change a frozen item, through a change request.
  steps_header: ["Step", "What happens", "Who", "Record"]
  steps:
    - ["Raise", "The requester describes the change, the reason, the BRD ID and the FR item.", "Any Business Unit or BDO ITG member", "Register, status Raised"]
    - ["Assess", "The project assesses the impact on scope, schedule, cost, other BRDs and the tests.", "iorta TechNXT Project Team with the System Analyst", "Impact assessment form"]
    - ["Approve", "The owners of every BRD the change touches approve or reject it.", "Product Owner, Renewal; Project Owner; BDO ITG", "Register, decision and date"]
    - ["Schedule", "The approved change gets its drop.", "PMO", "Register, target drop"]
    - ["Test", "The test cases are added or changed and run.", "Test lead; Business Unit", "Linked test cases"]
    - ["Close", "The FRS is revised (next version) and the change is closed.", "System Analyst", "Register, status Closed"]
  candidates: >-
    The candidate changes known at this version - the points where this FRS proposes more than the BRD text or where
    BDOI's FRS goes beyond the BRD - are seeded in the register with the status "Candidate - for decision".

# Annex AQ - Business Unit review checklist
