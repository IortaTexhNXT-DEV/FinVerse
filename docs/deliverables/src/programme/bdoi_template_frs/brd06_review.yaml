      frrn: FRRN.036.02, FRRN.036.06
      code: ['"Hold cover request - "', "Please hold cover the risk below for thirty (30) days from {{startDate}}"]
      bdoi: "Annex Z (Hold Cover Template) is a heading only. The text names thirty days whatever the duration (30, 60 or 90 days, FRRN.036.01): Annex AP.5."
