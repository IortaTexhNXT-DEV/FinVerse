  - {topic: "Separate password e-mail", bdoi: "FRRN.024.01 derives the password of individuals from their names and BDOI's e-mails explain it to the client.", brd: "BRD 1.010.7.1: \"Encrypt and add password prior to sending\"", proposal: "Keep BDOI's convention; the separate password e-mail (Annex AE.24) is sent only for corporate clients, whose password is random, unless BDOI decides otherwise.", impact: "One e-mail less per individual client.", by: "Product Owner, Renewal; Information Security"}
  - {topic: "Hold cover request text", bdoi: "FRRN.036.01: durations of 30, 60 and 90 days; Annex Z: heading only.", brd: "BRRN.042", proposal: "The request text of the system names thirty days whatever the duration (Annex AE.32); the text takes the duration of the request, and BDOI gives its template.", impact: "Wording of a document sent to insurers.", by: "Processing Head"}
