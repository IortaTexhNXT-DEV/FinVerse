# Version 1.2 of BDOI's Renewal FRS: the review points of the Product Owner on v1.1 (11-Oct-2026). Read by
# build_brd06_bdoi_frs.py (colour code, legend, Annex AJ rows, Annex AM.4, Annex AP.1) and build_brd06_workbooks.py
# (CR effort estimate, CR register, RTM). Business words only.
#
#   green   points of this FRS that are not in the Renewal BRD or the signed Concept Paper and that the iNXT BrokerVerse platform
#           edition offers out of the box (Feature List: Available or OOTB extra; no cost); `frrn` colours BDOI's text of that item, `match` colours the annex row holding
#           the text. Baseline: column "OOTB platform" of the Feature List vs OOTB workbook (sheet Feature Comparison), not
#           the BIBS work of this project.
#   orange  points neither in the BRD nor Available in the platform edition (Partial, Not available, BDOI-specific or
#           not in the feature list): each is a change request with its effort, also when already prepared for BIBS.
#   Points of the BRD stay black. A requirement of another BRD of the programme (for example the non-functional
#   requirements of the Collections, Claims and Reinsurance addenda) is a BRD requirement, not a new point.

#   integration / data_migration: interfaces and migration items - grey label, not change requests.
#   best_practice: blue recommendations (Annex AP.2), excluded from the CR totals.

version: '1.2'
date: 11 Oct 2026
colours:
  green: 2E7D32
  orange: E65100
revision:
  date: 11 Oct 2026
  version: '1.2'
  description: 'Review of the Product Owner on version 1.1: colour code of the points beyond the BRD (green out of the box,
    orange change request) with its legend; Annex AP.1 lists them with the effort of each change request (CR effort workbook);
    the requirement lines of the BRD and the signed Concept Paper validated end to end (Annex AM.4); the programme non-functional
    requirements of the other BRDs that also apply to Renewal (Annex AJ); the environment of the screenshots and walkthroughs;
    figure captions kept with their figures'
  by: iorta TechNXT Project Team (drafting support); for review by Angela V. Ramirez
legend:
  title: How to read this document
  intro: 'The colour of a point tells where it comes from and whether it costs a change:'
  items:
  - - black
    - 'Black: in the Renewal BRD (or the signed Concept Paper, or a programme-wide requirement of another BRD), also where
      BDOI''s FRS elaborates a BRD line; in scope. A gap against the platform is a BRD item to deliver (Annex AP.1), not a
      change request.'
  - - green
    - 'Green: not in the BRD, from BDOI''s FRS; offered by the iNXT BrokerVerse platform out of the box, at no cost (Annex
      AP.1).'
  - - orange
    - 'Orange: in no BRD line at all and not (or only partly) in the iNXT BrokerVerse platform; a change request with its
      effort for that part only (Annex AP.1; CR Effort Estimate workbook).'
  - - grey
    - '[Integration scope] / [Data Migration scope]: an interface with an external system or a migration item, delivered in
      that scope; not a change request (Annex AP.1).'
  - - blue
    - 'Blue: insurance-broking best practice not in the BRD, this FRS or the platform; a recommendation with indicative effort,
      not a commitment (Annex AP.2).'
  note: Out of the box means the iNXT BrokerVerse platform edition (its code and manual), cross-checked with the Feature List
    vs OOTB workbook; the work prepared for BIBS in this project is not out of the box.
environment: 'BIBS DEV environment: https://dev.brokerverse.cloud'
