best_practice:
- id: BP-RN-01
  practice: 'Suitability review at renewal: the officer confirms the client''s needs and covers are still adequate and records
    the advice given'
  why: Fair treatment of clients and market-conduct expectations of the Insurance Commission for intermediaries; protects
    the broker against claims of poor advice
  priority: High
  effort: 6.0
- id: BP-RN-02
  practice: 'Remarketing check: renewals above a premium threshold or with a large premium increase are quoted with at least
    one other insurer before the renewal is accepted'
  why: The broker acts for the client (Insurance Code); shows best terms were sought, especially on hardening rates
  priority: Medium
  effort: 5.0
- id: BP-RN-03
  practice: 'Sum-insured adequacy prompt: property and motor renewals flag values not reviewed for two years or below an indexed
    value'
  why: Avoids underinsurance and average at claim time, a common cause of client disputes
  priority: Medium
  effort: 4.0
- id: BP-RN-04
  practice: 'Key-account renewal plan: accounts above a premium threshold get a stewardship review 120 days before expiry
    with claims, service and market summary'
  why: Retention of the largest corporate accounts; market practice of corporate brokers
  priority: Low
  effort: 5.0
- id: BP-RN-05
  practice: 'Remuneration disclosure on request: the Renewal Advice states that the commission or fee earned on the policy
    is disclosed on request'
  why: Transparency expected of intermediaries by the Insurance Commission and good conduct practice
  priority: Low
  effort: 2.0
