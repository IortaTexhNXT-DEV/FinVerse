# Change requests: neither in the BRD nor out of the box. effort = man-days [analysis and design, back end, front end,
# testing, documentation and UAT support]; based on the Renewal screens of the system (83 screen components,
# about 14,400 lines of screen code, 16 screens of Annex AA).
orange:
  - id: CR-RN-024
    match: "WCAG 2.2"
    frs: "Annex AJ RN-NFR-16"
    title: "Accessibility conformance (WCAG 2.2 level AA) of the Renewal screens"
    brd: Not in BRD
    source: "Programme register of non-functional requirements (NFR-ACC-01); market practice for bank systems"
    why: >-
      The BRD has no accessibility requirement; BDO's policies and the programme register expect screens usable with
      the keyboard and a screen reader, with sufficient contrast. A conformance claim needs a check of every Renewal
      screen and the corrections it finds.
    ootb: >-
      Partly: the screens have labelled fields, keyboard navigation and the programme colours; no conformance check
      of the Renewal screens against WCAG 2.2 AA and no conformance statement.
    effort: [2.0, 0.0, 12.0, 4.0, 2.0]
    complexity: Medium
    priority: Medium
    type: Enhancement
    dependencies: "BDOI confirms the accessibility standard (WCAG 2.2 AA or BDO's own); shared screen components of the programme"
    assumptions: "16 Renewal screens and their dialogs; corrections in the shared components benefit every module and are counted once here; no change to the business rules"

# Requirements of other BRDs of the programme that also apply to Renewal (Annex AJ, black: BRD requirements)
programme_nfr:
  - ["RN-NFR-17", "One session per device", "\"Limit the number of concurrent sessions to a single device; an opened session on a different device prompts a log-off of the previous device session\" (Collections addendum NFR 10.07; the same programme rule for every module)", "Every sign-in is recorded in the session log; the single-device rule is a programme setting that BDOI confirms for all modules (programme change CR-0025; discrepancy DCR-044: NFR 9.02 allows concurrent sessions)", "FRRN.001.01", "NFR-SEC-05"]
  - ["RN-NFR-18", "Audit source", "Each audit entry records the source of the event (workstation, device or IP address; behind a load balancer the original address) (Claims, Collections and Reinsurance addenda NFR 4.03)", "Audit entries with the user, time, action and source address; read-only for every user", "FRRN.043.01", "NFR-AUD-01, NFR-AUD-02"]

# Annex AM.4 - the signed Concept Paper (Advance Implementation of Renewal Processing v1.0, 9-Jun-2026)
concept_paper:
  intro: >-
    The signed Concept Paper proposed an early release of Renewal before the core cut-over. BDOI decided on
    26-Sep-2026 that every module goes live together in January 2028; the points of the Concept Paper are traced
    below with that decision.
  header: ["Concept Paper point", "Where in this FRS", "Status"]
  rows:
    - ["Renewal intake and pipeline tracking; RMEL extract ingestion and validation", "FRRN.002, FRRN.004, FRRN.045", "Covered"]
    - ["Data sanitation and enrichment; RMEL data quality with exception handling (Annex C risk)", "FRRN.006 to FRRN.009, FRRN.040.02; Annex AC.4", "Covered"]
    - ["Disposition management", "FRRN.014 to FRRN.016, FRRN.020", "Covered"]
    - ["Proposal / quotation generation; TSU quotation capability", "FRRN.017 to FRRN.019 (Product Maintenance and New Business FRS for the quotation)", "Covered; TSU functions in their own FRS"]
    - ["Insurer engagement and approval tracking", "FRRN.013, FRRN.021, FRRN.029", "Covered"]
    - ["Renewal Advice generation; NAL and NRL processing", "FRRN.022 to FRRN.024; Annex AE", "Covered"]
    - ["Pre-placement adjustments", "FRRN.018.02, FRRN.025", "Covered"]
    - ["Submitted Policy and Free First Year renewal processing", "FRRN.048.01; FRRN.27.01", "Covered"]
    - ["Package remapping: design decision on upload or sanitation", "FRRN.046.01 (at sanitation); Annex AO", "Covered; BDOI confirms (Concept Paper decision owner)"]
    - ["Early migration of the Client Master and reference data (LOV, MIS, insurer, branch, product)", "Annex AK", "Covered"]
    - ["User readiness: role-based training and a pilot or batch dry run", "Annex AQ; walkthrough users workbook (Annex AL)", "Covered by the programme's training and UAT plan"]
    - ["Early release by 15-Aug-2027 for January to May 2028 expiries; no placement or booking before the January 2028 cut-over", "FRRN.045 (go-live take-over of expiries to 31-May-2028)", "Superseded by BDOI's decision of 26-Sep-2026: single go-live in January 2028, so no pre-cut-over placement rule is needed"]
