# Version 1.2 of BDOI's Renewal FRS: the review points of the Product Owner on v1.1 (11-Oct-2026). Read by
# build_brd06_bdoi_frs.py (colour code, legend, Annex AJ rows, Annex AM.4, Annex AP.1) and build_brd06_workbooks.py
# (CR effort estimate, CR register, RTM). Business words only.
#
#   green   points of this FRS that are not in the Renewal BRD or the signed Concept Paper but that the system offers
#           out of the box (no cost); `frrn` colours BDOI's text of that item, `match` colours the annex row holding
#           the text. Each was checked against the Renewal module of the system (screen or run named in `ootb`).
#   orange  points that are neither in the BRD nor out of the box: each is a change request with its effort.
#   Points of the BRD stay black. A requirement of another BRD of the programme (for example the non-functional
#   requirements of the Collections, Claims and Reinsurance addenda) is a BRD requirement, not a new point.

version: "1.2"
date: 11 Oct 2026
colours: {green: "2E7D32", orange: "E65100"}

revision:
  date: 11 Oct 2026
  version: "1.2"
  description: >-
    Review of the Product Owner on version 1.1: colour code of the points beyond the BRD (green out of the box,
    orange change request) with its legend; Annex AP.1 lists them with the effort of each change request (CR effort
    workbook); the requirement lines of the BRD and the signed Concept Paper validated end to end (Annex AM.4); the
    programme non-functional requirements of the other BRDs that also apply to Renewal (Annex AJ); the environment
    of the screenshots and walkthroughs; figure captions kept with their figures
  by: iorta TechNXT Project Team (drafting support); for review by Angela V. Ramirez

legend:
  title: How to read this document
  intro: >-
    BDOI's text of version 1.0 and every point that traces to the Renewal BRD (or to the signed Concept Paper) is in
    black. The points of this FRS that are not in the BRD are coloured where they are stated:
  green: "Green: not in the BRD; offered by the system out of the box, at no cost (listed in Annex AP.1)."
  orange: "Orange: not in the BRD and not offered out of the box; needs a change request with the effort of Annex AP.1 and the CR Effort Estimate workbook."
  note: >-
    A requirement of another BRD of the programme that also applies to Renewal (for example the session and audit
    rules of the Collections, Claims and Reinsurance addenda) is a BRD requirement and stays black; its source is
    named where it is stated (Annex AJ).

environment: "BIBS DEV environment: https://dev.brokerverse.cloud"

