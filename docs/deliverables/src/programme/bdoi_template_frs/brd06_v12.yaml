concept_paper:
  intro: The signed Concept Paper proposed an early release of Renewal before the core cut-over. BDOI decided on 26-Sep-2026
    that every module goes live together in January 2028; the points of the Concept Paper are traced below with that decision.
  header:
  - Concept Paper point
  - Where in this FRS
  - Status
  rows:
  - - Renewal intake and pipeline tracking; RMEL extract ingestion and validation
    - FRRN.002, FRRN.004, FRRN.045
    - Covered
  - - Data sanitation and enrichment; RMEL data quality with exception handling (Annex C risk)
    - FRRN.006 to FRRN.009, FRRN.040.02; Annex AC.4
    - Covered
  - - Disposition management
    - FRRN.014 to FRRN.016, FRRN.020
    - Covered
  - - Proposal / quotation generation; TSU quotation capability
    - FRRN.017 to FRRN.019 (Product Maintenance and New Business FRS for the quotation)
    - Covered; TSU functions in their own FRS
  - - Insurer engagement and approval tracking
    - FRRN.013, FRRN.021, FRRN.029
    - Covered
  - - Renewal Advice generation; NAL and NRL processing
    - FRRN.022 to FRRN.024; Annex AE
    - Covered
  - - Pre-placement adjustments
    - FRRN.018.02, FRRN.025
    - Covered
  - - Submitted Policy and Free First Year renewal processing
    - FRRN.048.01; FRRN.27.01
    - Covered
  - - 'Package remapping: design decision on upload or sanitation'
    - FRRN.046.01 (at sanitation); Annex AO
    - Covered; BDOI confirms (Concept Paper decision owner)
  - - Early migration of the Client Master and reference data (LOV, MIS, insurer, branch, product)
    - Annex AK
    - Covered
  - - 'User readiness: role-based training and a pilot or batch dry run'
    - Annex AQ; walkthrough users workbook (Annex AL)
    - Covered by the programme's training and UAT plan
  - - Early release by 15-Aug-2027 for January to May 2028 expiries; no placement or booking before the January 2028 cut-over
    - FRRN.045 (go-live take-over of expiries to 31-May-2028)
    - 'Superseded by BDOI''s decision of 26-Sep-2026: single go-live in January 2028, so no pre-cut-over placement rule is
      needed'
