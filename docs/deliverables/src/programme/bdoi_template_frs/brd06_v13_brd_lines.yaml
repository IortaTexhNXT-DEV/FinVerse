# Mapping of the Renewal BRD (8-Oct-2026) to the FRRN items: the 42 BRRN requirements, the 47 sections and the 1,033
# requirement lines of the main BRD. Taken from the Business Requirements Mapping of the FRS v1.2 (numbers of the items
# corrected as in the FRS v1.3). Read by brd06_v13_content.py and build_brd06_v13_workbooks.py.
brrn:
- id: BRRN.001
  text: System must allow the user to generate and send a No Advice Letter (NAL) to clients whose expiring policies do not
    require either a Renewal Advice (RA) or a Not for Renewal Letter (NFR) or Non-Renewal Letter (NRL), typically when no
    action or advice is needed regarding the expiring policy.
  frrn:
  - FRRN.022
  - FRRN.023
- id: BRRN.002
  text: The system must allow users to select and change the date range (month, day, year) for generating the list of expiring
    accounts.
  frrn:
  - FRRN.004
- id: BRRN.003
  text: System provides filter criteria for generating the list, including all specified options, and allows filter management
    (apply, cancel, clear)
  frrn:
  - FRRN.004
- id: BRRN.004
  text: System displays the generated list in a scrollable view with all required columns.
  frrn:
  - FRRN.004
- id: BRRN.005
  text: System captures expired/expiring and unbooked accounts.
  frrn:
  - FRRN.004
  - FRRN.004.04
  - FRRN.045.01
- id: BRRN.006
  text: System allows column filtering and search.
  frrn:
  - FRRN.002
- id: BRRN.007
  text: System allows download, save, and print in .xlsx format.
  frrn:
  - FRRN.004.06
- id: BRRN.008
  text: System provides print preview and settings.
  frrn:
  - FRRN.004.06
- id: BRRN.009
  text: System tags non-renewable risk codes, excludes them, maintains codes, and sends NFR letters.
  frrn:
  - FRRN.007
  - FRRN.038
  - FRRN.023
- id: BRRN.010
  text: '- Generate Renewal Advice (RA) - Ability to select accounts for RA generation (single, multiple, all, all except)
    - Generate RA for selected accounts - Prevent RA generation for locked accounts - Identify if RA is for first or second
    notice - View, preview, and close RA details - Download and save RA (single or batch) - Extract details for RA sending
    - Send RA in batch, with encryption and password protection'
  frrn:
  - FRRN.022
  - FRRN.024.01
- id: BRRN.011
  text: System allows users to view all accounts assigned to them in a single, scrollable view. Any updates or endorsements
    made to an account are automatically reflected on the mother policy.
  frrn:
  - FRRN.014
  - FRRN.004.06
  - FRRN.010
  - FRRN.002.08
- id: BRRN.012
  text: System allows users to select any account from the displayed list for further action or review.
  frrn:
  - FRRN.014
  - FRRN.002.08
- id: BRRN.013
  text: System displays all renewal fields for the selected account, sourced from the generated expiring account list.
  frrn:
  - FRRN.014
- id: BRRN.014
  text: System provides filtering options for each column in the account list, allowing users to narrow down results.
  frrn:
  - FRRN.002
  - FRRN.002.08
- id: BRRN.015
  text: System provides sorting options for the account list, allowing users to order accounts by any column.
  frrn:
  - FRRN.002
  - FRRN.002.08
- id: BRRN.016
  text: System provides a search function that allows users to find specific information within the account list, similar
    to a Ctrl+F feature.
  frrn:
  - FRRN.002
  - FRRN.002.08
- id: BRRN.017
  text: System allows users to search for a particular account using name or unique reference number.
  frrn:
  - FRRN.002
  - FRRN.002.08
- id: BRRN.018
  text: Upload file(s) Select the source path Select the file(s) for upload System allows users to select a source path
    and upload one or more dispositioned files to update account details in the system.
  frrn:
  - FRRN.015
  - FRRN.015.07
- id: BRRN.019
  text: The system must allow users to generate comprehensive reports on accounts and transactions relevant to their role.
    - Users should be able to define the report scope using flexible filters (such as invoice number, date range, unit,
    region, product, account type, status, and other relevant fields). - Reports must be viewable in a single, scrollable
    interface and include all necessary columns for business review (e.g., invoice number, account details, transaction
    status, renewal information, remarks). Users must have the ability to download, save, and print reports in standard
    formats (e.g., .xlsx, .pdf), with print preview and customizable print settings. Each report should also provide a summary
    section showing aggregate figures and key performance indicators.
  frrn:
  - FRRN.044
  - FRRN.044.02
- id: BRRN.020
  text: As a renewal processor, I want data sanitation to occur within the system after extraction or upload, so that renewal
    eligibility is determined consistently and not dependent on manual pre-cleaning.
  frrn:
  - FRRN.007
  - FRRN.040
  - FRRN.040.01
  - FRRN.046.01
- id: BRRN.021
  text: As an authorized user, I want expiring accounts to be extracted (e.g. within the system and displayed on the screen/dashboard),
    with renewal processing starting only upon explicit user initiation, so that accounts do not renew prematurely and proper
    governance is maintained.
  frrn:
  - FRRN.004
  - FRRN.003
  - FRRN.004.07
- id: BRRN.022
  text: As a renewal user, I want to have a unique reference number to be mandatory and used as the primary matching key,
    so that renewal records reliably link to the correct existing policies.
  frrn:
  - FRRN.004
- id: BRRN.023
  text: I want the system to automatically classify renewal records into rule-based buckets (i.e. Clean, Review, Exception),
    so that renewal work is prioritized, straight through cases are processed efficiently, and exceptions are controlled
    and isolated.
  frrn:
  - FRRN.007
  - FRRN.008
  - FRRN.020.03
- id: BRRN.024
  text: As an authorized user, I want the LAMD role limited to early validation only, so that booking, placement, and customer
    communications remain role-appropriate and controlled.
  frrn:
  - FRRN.012
  - FRRN.001.02
- id: BRRN.025
  text: I want expiry-driven reminder letters generated for expiring policies that are not yet submitted at the defined
    follow-up checkpoint (e.g., +90 days), so that follow-ups are standardized and time-bound.
  frrn:
  - FRRN.023
  - FRRN.023.03
- id: BRRN.026
  text: As a Contact Center user, I want system access to renewal lists and the ability to update renewal statuses, so that
    follow-ups are done via system.
  frrn:
  - FRRN.047.01
- id: BRRN.027
  text: As a Renewal User, I want to view the full historical account record (i.e. policies, renewals, endorsements, payment
    history, and claims) during renewal review so that I can make an informed and auditable renewal decision.
  frrn:
  - FRRN.014
- id: BRRN.028
  text: I want the system to identify and view accounts that are due or upcoming for KYC review, so that compliance monitoring
    and follow up can be performed without blocking or interrupting the renewal process.
  frrn:
  - FRRN.039
- id: BRRN.029
  text: The system shall ingest LAMD-provided reports and match paid-off loan records against RMEL policies to determine
    renewal eligibility and proper routing.
  frrn:
  - FRRN.012
  - FRRN.041.01
- id: BRRN.030
  text: The system shall automatically extract renewal candidates based on policy expiry date using configurable lead days
    (e.g., -140 days).
  frrn:
  - FRRN.004
  - FRRN.004.04
  - FRRN.040.03
- id: BRRN.031
  text: I want the system to apply rule-based disposition automatically and isolate exceptions, so that straight-through
    renewals proceed without manual effort and manual handling is focused only on high-impact or non-standard cases.
  frrn:
  - FRRN.007
  - FRRN.008
  - FRRN.008.01
  - FRRN.040.02
  - FRRN.020.03
- id: BRRN.032
  text: Endorsements occurring before or during renewal must be reflected on the mother (expiring) policy prior to renewal
    approval.
  frrn:
  - FRRN.004.06
- id: BRRN.033
  text: The system shall allow renewal-identified accounts to follow the New Business flow when financial or structural
    changes require repricing or restructuring.
  frrn:
  - FRRN.017
  - FRRN.018
  - FRRN.019
  - FRRN.020
  - FRRN.018.02
- id: BRRN.034
  text: The system shall provide a configurable decision matrix defining which renewal scenarios are automated versus manual.
  frrn:
  - FRRN.040
  - FRRN.040.02
- id: BRRN.035
  text: As a renewal user, I want the system to capture insurer responses (e.g., Approve/ Renew As-ls, Reject, Revise) and
    automatically apply them to the renewal workflow, so that renewal status progression is accurate, controlled, and does
    not rely on manual re-encoding or interpretation.
  frrn:
  - FRRN.013
  - FRRN.013.05
- id: BRRN.036
  text: I want the system to generate customizable, centralized renewal listings (e.g., by unit, segment, UH, IBG, Leasing),
    expiry window, and current status, so that renewal exposure is clearly visible, proactively monitored, and escalated
    appropriately without relying on manual tracking.
  frrn:
  - FRRN.002.05
  - FRRN.044.03
- id: BRRN.037
  text: I want the system to identify NRNS (No Renew/ No Submit) accounts and trigger reminder or non-acceptance letters
    to manage lapse risk.
  frrn:
  - FRRN.023
  - FRRN.023.03
  - FRRN.037.02
- id: BRRN.038
  text: The system shall enforce routing of renewal changes based on financial impact, ensuring proper approval and proposal
    handling.
  frrn:
  - FRRN.017
  - FRRN.009.01
  - FRRN.018.02
- id: BRRN.039
  text: The system shall support LAMD-driven matching and categorization for CBG Motor and Fire renewals, including straight-through
    processing and letter generation.
  frrn:
  - FRRN.012
- id: BRRN.040
  text: I want the system to automatically proceed to placement and booking once the client has accepted the Renewal Advice
    (RA) and applicable payment rules are satisfied, so that the renewal process is completed without delay, duplicate handling,
    or manual re initiation, and the policy can be issued on time.
  frrn:
  - FRRN.029
  - FRRN.025.01
  - FRRN.026.01
  - FRRN.028.02
- id: BRRN.041
  text: The system shall evaluate renewal transactions for incentive eligibility after successful placement, booking, and
    full payment confirmation, and assign an incentive eligibility indicator based on predefined, rule-based criteria, including
    applicable endorsements, so that incentive processing and reporting are accurate, consistent, and auditable.
  frrn:
  - FRRN.034
- id: BRRN.042
  text: As a renewal user, I want to be able to send request for Hold Cover to insurer/s and to record the Hold Cover confirmation
    details received from the insurer.
  frrn:
  - FRRN.036
  - FRRN.037.02
