uat_criteria:
  entry:
    - "The FRS in BDOI's template v1.1 is signed, or signed with the open decisions listed in Annex AO."
    - "The parameters, lists, rules, templates and data of Annex AK are loaded and checked."
    - "The walkthrough users of the Business Unit Walkthrough Users workbook are active, with their passwords issued separately."
    - "SIT is closed with no open severity-1 or severity-2 finding on Renewal."
    - "The test cases of this workbook are reviewed by the Business Unit."
  exit:
    - "Every test case of priority High is passed."
    - "No open severity-1 or severity-2 finding; the others have an agreed plan."
    - "Every acceptance criterion of the FRS has a passed test case."
    - "The walkthrough of Annex AL is run with the Business Unit users and signed."
    - "The UAT sign-off certificate of BRD-06 is signed (SO-06-3)."

# Items available in full in the BIBS environment, with the business tests that show them (longest prefix wins).
coverage_available:
  FRRN.001.02: "Data scope tests: an Account Officer sees My Dispositions and his assigned accounts only, a Team Lead the accounts of his units and of every unit under a unit he heads, LAMD and Contact Center users without premium columns; persona menu test of each Renewal role (no Processing Worklist or Renewal Setup for Marketing, no Renewal Advice for LAMD)."
  FRRN.001.04: "Platform session tests of User Access Maintenance: sign-out after the inactivity time with the message Your session timed out. Please log in again to continue, the warning before the system-triggered end of the session, and the session log with the reason; the Renewal screens use the platform session."
  FRRN.002.01: "Renewal module tests: the Processing Team Lead's menu with the Processing Worklist, Insurer Batches and uploads, none of them for a Marketing Account Officer; the same file uploaded twice is refused and nothing is updated; the upload result lists every refused row with its message and downloads."
  FRRN.002.02: "Renewal dashboard tests: open accounts per Account Officer for the Team Lead, Expiring within 30 days opening exactly the accounts counted, every figure and drill-down following the Market Segment filter; production against the Annual Renewal Budget with % vs Budget and variance and Show Details totalling the actual; pipeline and ageing totals equal to the sum of their stages and buckets; closing ratio, Top 50/75/100 open deals, count and YTD persistency, product mix, insurer approval and the KPI cards with their drill-down lists."
  FRRN.002.05: "Renewal Accounts panel tests: Clean, Review, Non-Renewable and All panels with BDOI's columns and sort, continuous scrolling with the row count, the Claims flag never in Clean, the padlock of a locked account; list export to Excel, PDF and CSV."
  FRRN.002.08: "My Dispositions tests: the Account Officer's accounts of the current and previous years without a filter, sorted by expiry both ways, the Endorsed flag with its effective date, the red Returned flag with the Team Lead's remarks leaving Returned to me once submitted again."
  FRRN.003.01: "Processing dashboard tests: Combined View equal to New Business View plus Renewal View, open accounts per Processing Officer for the Processing Team Lead."
  FRRN.003.02: "Processing KPI card tests: For Placement, For Booking, With and Without Policy, Released and Unreleased with the reason, Directly Booked and Returned Accounts with the return reason, the ageing in business days from submission or sending, Unassigned and Assigned tabs with the Placement Processor, TAT Status Beyond TAT; each card lists exactly the accounts counted with search, filter, sort and export."
  FRRN.003.05: "Processing Worklist tests: In Processing shows only the accounts assigned to the Processing Officer when the processing scope is set so; sorting and column filters on every column of every tab."
  FRRN.004.04: "RMEL generation tests: a booked account expiring at the lead days is listed once with its renewal reference even after a second run, a change of the lead days applies at the next run, HMO accounts are left out, No records found. and Generation of RMEL successful! messages."
  FRRN.004.06: "Endorsement synchronisation tests: posting is refused while an endorsement of the expiring policy is open and the message names it; Refresh Endorsements brings the endorsed sum insured and the endorsement number to the renewal account."
  FRRN.004.06 (2nd): "RMEL export tests: the file named RMEL_<Month>_<Year>_<MMDDYYYY>.xlsx with the rows and columns of the screen; the RMEL report of the Report Centre printed with the paper size and orientation chosen in the print options."
  FRRN.005.01: "Create Renewal Account tests: a renewal account from an expiring Motor account with the same client, vehicle, insurer and PN, the business type Renewal and the link to the expiring account; every missing mandatory field named; the new account goes through sanitation, assignment and classification."
  FRRN.006.01: "Duplicate checking tests: the potential-duplicate warning on the same plate, serial and motor numbers and an overlapping period, the cancelled-match warning with the save allowed, a generated duplicate For Review with the reason Potential Duplicate Account and the link."
  FRRN.007.02: "Sanitation rule tests per market segment: above the sum insured threshold For Quotation to the TSU, personal accident lines For Proposal, Risk Code is not maintained as Renewable/Not Renewable to Review, a non-renewable risk code Not for Renewal and out of the assignment list, a CBG Motor account without PN not Clean."
  FRRN.008.01: "Classification tests: an open claim always Review, Clean at the next evaluation once the claim is closed with both classifications in the history, a manual reclassification to Clean refused when a rule failed, the rule version and the rule shown per classification."
  FRRN.009.01: "CBG Motor automatic update tests: the Computations tab with the expiring values and the differences, own damage and theft sum insured depreciated by 10% for a Regular renewal with the other fields of Annex D, the financial impact flagged with the difference."
  FRRN.010.01: "Automatic assignment tests: accounts assigned per segment to the Account Officer with the fewest open accounts and then in turn appear in his My Dispositions and leave the unassigned list, no assignment to an officer of another unit, the notice <reference> assigned to you."
  FRRN.011: "Transfer request tests: a referral never changes the owner of the renewal account; Transfer Request Number with Pending Acceptance and the receiving Team Leads notified, a request to the own unit refused, acceptance with its date and time, rejection without remarks refused, the New Business account created from the copied data and linked to the request, Transfer Request Monitoring with the New Business account number, the audit log of every step and the requester notified of a rejection or return."
  FRRN.011.06: "Tests of the transfer to another unit: the account leaves the sender's list for the receiving Team Lead's Transfers inbox, appears in the receiving unit's unassigned list with the Transferred flag once accepted, and returns to the sender with the decline remarks."
  FRRN.012: "LAMD and BDOFC/SOLD upload tests: the success message of a processed report, the invalid format and missing-required-data refusals, paid-off and RMU matching on the PN and the motor serial and motor numbers with the Annex C rules, a PN on two accounts updating neither, one summary row per upload latest first with the Processing Result workbook, the record-level view filtered by Matched and Unmatched, the paid-off repository keeping an account once."
