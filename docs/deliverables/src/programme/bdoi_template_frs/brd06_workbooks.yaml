# Fit-gap groups: BRD ID prefixes (main BRD functions or BRRN IDs), the features of the programme Feature List
fitgap_groups:
  - name: Log-in, session and several tabs
    keys: ["1.001", "2.001", "3.001", "4.001", "5.001", "6.001", "1.002", "2.002", "3.002", "4.002", "5.002"]
    features: [RNW-037]
    ootb: "Standard sign-in with role-based menus, inactivity warning and session end by parameter, several tabs on one session."
    best: "Single sign-on with the bank's identity provider; idle time-out of 15 to 30 minutes as Philippine bank IT practice (BSP Circular 982 on IT risk)."
    fit: Fit
    rec: "Keep; BDOI decides the session-end wording (Annex AO)."
    impact: "FRRN.001"
  - name: RMEL - extraction, generation, filters, list and export
    keys: ["1.003", "3.003", "BRRN.002", "BRRN.003", "BRRN.004", "BRRN.005", "BRRN.006", "BRRN.007", "BRRN.008", "BRRN.021", "BRRN.022", "BRRN.030"]
    features: [RNW-001, RNW-002, RNW-003, RNW-004]
    ootb: "Daily extraction at lead days and generation by date range, multi-select filters, one scrollable list, export and print; explicit initiation."
    best: "Brokers extract renewals 90 to 150 days before expiry with a unique renewal reference and no manual re-keying of the expiry list."
    fit: Configure
    rec: "Set the lead days per segment; decide extraction and initiation (Annex AO C08, C09)."
    impact: "FRRN.004, FRRN.045"
  - name: Sanitation, classification and decision matrix
    keys: ["BRRN.009", "BRRN.020", "BRRN.023", "BRRN.031", "BRRN.034", "BRRN.039"]
    features: [RNW-005, RNW-006, RNW-007, RNW-008]
    ootb: "Rule checks with severities, Clean / Review / Exception classification with the rule shown, versioned decision matrix with maker-checker."
    best: "Straight-through renewal of clean risks with exception queues; rules owned by the business with four eyes and effective dates."
    fit: Extend
    rec: "Load BDOI's Annex C rules into the rule sets; decide the third classification (Annex AO C01)."
    impact: "FRRN.006-008, FRRN.038, FRRN.040"
  - name: LAMD reports and RMU
    keys: ["BRRN.024", "BRRN.029"]
    features: [RNW-009]
    ootb: "Upload of loan reports matched on the PN, with matching results; LAMD profile limited to validation."
    best: "Mortgage-linked policies follow the loan status from the bank's loan system (bancassurance practice)."
    fit: Extend
    rec: "Adopt BDOI's layouts of Annex G; decide paid-off and RMU routing (Annex AO C04, C05)."
    impact: "FRRN.012, FRRN.041"
  - name: KYC visibility
    keys: ["BRRN.028"]
    features: [RNW-010]
    ootb: "KYC due flag from the client's review date, for information."
    best: "KYC refresh before renewal of high-risk clients (AMLC rules); gating is a compliance decision."
    fit: Configure
    rec: "Keep KYC non-blocking (BRRN.028); KYC statuses and dashboard as a candidate change."
    impact: "FRRN.039"
  - name: Endorsements before renewal
    keys: ["BRRN.032"]
    features: [RNW-011]
    ootb: "Renewal prepared from the policy as of the last posted endorsement; open endorsements block the posting."
    best: "Renewal terms always reflect the latest endorsed policy."
    fit: Fit
    rec: "Keep."
    impact: "FRRN.004.06"
  - name: View the account and its history
    keys: ["1.004", "2.003", "3.006", "4.003", "BRRN.011", "BRRN.012", "BRRN.013", "BRRN.014", "BRRN.015", "BRRN.016", "BRRN.017", "BRRN.027"]
    features: [RNW-015]
    ootb: "Account details read live, account history with policies, endorsements, payments and claims; officer list without pages."
    best: "Full client and policy history before the renewal decision (TCF / fair treatment of customers)."
    fit: Fit
    rec: "Keep."
    impact: "FRRN.002.08, FRRN.014.01"
  - name: Assignment of accounts
    keys: ["1.005", "3.005"]
    features: [RNW-012]
    ootb: "Assignment and re-assignment by the Team Lead, single, multiple, all and all-except."
    best: "Book-of-business ownership by officer, with rule-based allocation for high volumes."
    fit: Configure
    rec: "Keep the Team Lead's assignment; automatic round robin as a candidate change (Annex AO C06)."
    impact: "FRRN.010"
  - name: Transfer between units
    keys: ["1.006", "1.007", "2.005"]
    features: [RNW-013]
    ootb: "Transfer request with acceptance or decline by the receiving unit."
    best: "Hand-over of accounts between units with an audit trail."
    fit: Extend
    rec: "Decide referral or transfer (Annex AO C07)."
    impact: "FRRN.011"
  - name: Disposition, remarks and re-opening
    keys: ["2.004", "2.006", "2.007", "3.004.5"]
    features: [RNW-014]
    ootb: "Disposition with reasons, remarks stamped with user and time, returned accounts, re-open of Not for Renewal."
    best: "Documented reason for every non-renewal (Insurance Code, fair treatment)."
    fit: Fit
    rec: "Keep; add BDOI's reasons as list values."
    impact: "FRRN.014, FRRN.016"
  - name: Team Lead review and overrides
    keys: ["1.008", "1.011"]
    features: [RNW-016]
    ootb: "Review, return and posting; controlled overrides with remarks."
    best: "Four-eyes review of renewal decisions; overrides justified and logged."
    fit: Configure
    rec: "Keep; the approver selection of FRRN.016 is configured."
    impact: "FRRN.020"
  - name: Upload of dispositioned files
    keys: ["3.004", "4.004", "BRRN.018"]
    features: [RNW-017]
    ootb: "Upload with row checks keyed on the renewal reference; complete-file declaration."
    best: "Bulk handling of bancassurance renewals with reconciliation of every row."
    fit: Extend
    rec: "Adopt BDOI's Renewal Update template."
    impact: "FRRN.015"
  - name: Processing, computations and the New Business path
    keys: ["3.007", "3.008", "4.005", "4.006", "BRRN.033", "BRRN.038"]
    features: [RNW-018, RNW-019, RNW-020]
    ootb: "Renewal account update, re-rating and comparison with the expiring terms, New Business path for changes."
    best: "Material changes need the client's informed consent (Insurance Code disclosure)."
    fit: Fit
    rec: "BDOI defines a structural change (Annex AN)."
    impact: "FRRN.009, FRRN.018.02, FRRN.031"
  - name: Insurer round trip
    keys: ["3.009", "4.007", "BRRN.035"]
    features: [RNW-021]
    ootb: "Request per insurer with the 28 fields, protected; upload of the insurer's file; responses drive the renewal."
    best: "Electronic exchange of renewal terms with insurers; single source of the insurer's answer."
    fit: Configure
    rec: "Load the insurer dispositions of FRRN.013.02 as list values mapped to the three outcomes."
    impact: "FRRN.013, FRRN.021"
  - name: Renewal Advice and letters
    keys: ["1.010", "2.009", "3.011", "4.09", "BRRN.001", "BRRN.010", "BRRN.025", "BRRN.037"]
    features: [RNW-022, RNW-023, RNW-024, RNW-025]
    ootb: "Renewal Advice from versioned templates, batch sending, password protection, letters with failure alerts, NRNS on the effective expiry date."
    best: "Renewal notice before expiry (market practice 30-60 days; Insurance Code for non-renewal notice), data privacy (RA 10173) for documents sent."
    fit: Configure
    rec: "Load BDOI's Annex L templates; set 75 / 45 days; adopt BDOI's password rule."
    impact: "FRRN.022-024"
  - name: Acceptance, placement and booking
    keys: ["BRRN.040"]
    features: [RNW-026, RNW-027]
    ootb: "Client acceptance with evidence; renewal account to placement and booking without re-keying."
    best: "No duplicate keying between renewal and booking; payment before inception (premium payment warranty, Insurance Code)."
    fit: Fit
    rec: "Decide the second approval (Annex AO C23)."
    impact: "FRRN.025-035"
  - name: Hold cover
    keys: ["BRRN.042"]
    features: [RNW-028]
    ootb: "Hold cover request and insurer confirmation from the renewal account."
    best: "Cover note / hold cover to avoid a gap in cover while the renewal completes."
    fit: Configure
    rec: "Set BDOI's durations; automatic requests and extensions as candidate changes."
    impact: "FRRN.036-037"
  - name: Incentive eligibility
    keys: ["BRRN.041"]
    features: [RNW-029]
    ootb: "Incentive evaluated after booking and full payment from the incentive criteria."
    best: "Incentives paid on collected premium only."
    fit: Configure
    rec: "BDOI gives the criteria (Annex AN)."
    impact: "FRRN.034"
  - name: Contact Center follow-up
    keys: ["BRRN.026"]
    features: [RNW-030]
    ootb: "Follow-ups with channel, outcome and next action; documents from the client."
    best: "Multi-channel renewal reminders with consent."
    fit: Fit
    rec: "BDOI gives the outcome list."
    impact: "FRRN.047"
  - name: Reports, dashboards and listings
    keys: ["1.009", "2.008", "3.010", "4.008", "BRRN.019", "BRRN.036"]
    features: [RNW-032, RNW-033, RNW-034, RNW-035]
    ootb: "Renewal home and dashboards, status report with summary counters, listing with attention flags, operational reports."
    best: "Renewal retention ratio and pipeline by officer; exception ageing."
    fit: Configure
    rec: "BDOI defines the summary counters and gives the layouts of its other reports."
    impact: "FRRN.002.02, FRRN.044"
  - name: Maintenance, users and profiles
    keys: ["5.003", "5.004", "5.005", "6.002"]
    features: [RNW-036, RNW-037]
    ootb: "Lists of values, templates and rules maintained by the business with four eyes; profiles and functions through access requests."
    best: "Business-owned configuration with segregation of duties."
    fit: Fit
    rec: "Keep."
    impact: "FRRN.001.05, FRRN.049"

