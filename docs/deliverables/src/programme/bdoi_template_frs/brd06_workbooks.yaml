uat_criteria:
  entry:
    - "The FRS in BDOI's template v1.1 is signed, or signed with the open decisions listed in Annex AO."
    - "The parameters, lists, rules, templates and data of Annex AK are loaded and checked."
    - "The walkthrough users of the Business Unit Walkthrough Users workbook are active, with their passwords issued separately."
    - "SIT is closed with no open severity-1 or severity-2 finding on Renewal."
    - "The test cases of this workbook are reviewed by the Business Unit."
  exit:
    - "Every test case of priority High is passed."
    - "No open severity-1 or severity-2 finding; the others have an agreed plan."
    - "Every acceptance criterion of the FRS has a passed test case."
    - "The walkthrough of Annex AL is run with the Business Unit users and signed."
    - "The UAT sign-off certificate of BRD-06 is signed (SO-06-3)."
