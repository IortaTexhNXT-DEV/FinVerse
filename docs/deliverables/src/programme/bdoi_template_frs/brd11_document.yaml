  intro: >-
    This review copy shows in light yellow every passage added or extended in version 1.2. BDOI's text of version 1.1
    is unchanged; where the additions differ from it or a correction is proposed, the point is in Annex Q for BDOI's
    decision.
  points:
    - "Cover and front matter: revision 1.2, \"Drafting support: iorta TechNXT Project Team\", Document Revision Log."
    - "Business Requirements Mapping: BDOI's {bdoi_rows} rows kept; {leaf_rows} BRD lines added under them so that all {brd_ids} BRD IDs are mapped; {mapping_changes} rows given the FRUM items that cover them."
    - "Functional Requirements: BDOI's {bdoi_entries} entries and {bdoi_items} items kept word for word; {elaborated} items elaborated; {new_subitems} new sub-items; {new_items} new entries FRUM.009 to FRUM.013 with {new_item_subitems} sub-items; {requirements_added} requirements and {ac_total} acceptance criteria added."
    - "Annexes A to I kept; {annex_rows} rows added to Annexes E, F and H."
    - "New annexes: J Screen specifications ({screens} screens, {screenshots} screenshots), K Messages and validations ({messages}), L Notifications and e-mails ({notifications}), M Business rules and parameters, N Sign-in and identity integration, O Process walkthroughs ({walk_steps} steps), P Traceability ({trace_rows} rows), Q Observations and points for BDOI decision ({observations}), R Glossary ({glossary} terms)."
    - "Signoff Sheet: signatories unchanged; \"iorta TechNXT Project Team (drafting support)\" added under Prepared by."
  legend: The first decision BDOI must take is where access requests are raised and approved (Annex Q, conflict C01).

