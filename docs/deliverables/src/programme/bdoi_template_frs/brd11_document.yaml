    proposal: New entries FRUM.009 to FRUM.013 specify what the BRD asks; their scope follows the decision on conflict C01 (requests in UIDM or in the system).
    impact: FRUM.009 to FRUM.013; Business Requirements Mapping.
    decide_by: BDOI IT; Process Owner (Business Administration)
  - topic: Duplicate BRD IDs
    bdoi: "-"
    brd: "The BRD prints BRD 2.002.7.1 and BRD 3.003.1.1 twice; BRD 1.005 is numbered one level up."
    proposal: "The second occurrence is shown as \"(2nd)\" in the mapping and in Annex P; the printed IDs are kept."
    impact: Mapping and Annex P.
    decide_by: ES-BPDS (BRD owner)
  - topic: Non-functional rows of the BRD
    bdoi: "-"
    brd: "Section 6 has no IDs; most rows read \"Follow existing QPS set up\"."
    proposal: "Annex P lists the rows that carry a function with the analyst's IDs UAM-NFR-nn of the BIBS FRS; the infrastructure rows are answered in the Technical Specification reviewed by BDOI IT."
    impact: Annex P.
    decide_by: BDOI IT
  - topic: User Access Matrix (Annex C)
    bdoi: "Annex C: \"Disclaimer: This document contains preliminary and partially completed set of capabilities, roles and permissions ...\""
    brd: "2.2: the assumption is there is a defined User Access Matrix in place."
    proposal: BDOI issues the final matrix; the system holds it as group profiles created through group-profile requests (FRUM.005), and the configuration template of the matrix is provided with the BIBS sign-off set.
    impact: Annex C; FRUM.005.
    decide_by: Process Owner (Business Administration); Information Security
  - topic: Password guidelines (Annex I)
    bdoi: "Annex I refers to the Application Security Requirement workbook and the Password Protection Guidelines v2 of 10-Sep-2026."
    brd: "Other BU NFR 7: enforce strong password policies."
    proposal: The values of Annex M for the break-glass accounts are reconciled with the guidelines once BDOI shares them; single sign-on users follow EIAM.
    impact: Annex M; FRUM-004.
    decide_by: Information Security
  - topic: Acceptance criteria of version 1.2
    bdoi: No acceptance criteria.
    brd: "Usage instruction 4: all requirements testable."
    proposal: The numbered acceptance criteria added under each item are the basis of the BIBS test plan BRD-11 (Annex P); BDOI accepts or amends them with the review.
    impact: All FRUM items.
    decide_by: Process Owner (Business Administration); Information Security

