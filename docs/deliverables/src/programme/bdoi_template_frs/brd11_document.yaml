annex_why:
  E: The BRD asks for the actor of each action (3.003.1.6) and the user fields of NFR p.14; the BIBS User Access Report shows them.
  F: BRD 3.003.2.3 to 3.003.2.6 ask for the dates and actors of each group profile; Annex F does not list them.
  H: FRUM.008.01 lists Activity and IP Address, which Annex H omits (slip S10); approved by and the request number come from sample D of the BRD and the BIBS audit log.

