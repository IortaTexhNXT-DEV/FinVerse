# Annex N - sign-in and identity integration (business level)
annex_n:
  modes:
    - [Single sign-on (production), "The user signs in once with the BDO account at EIAM (BDO Enterprise Identity Access Management on Microsoft Entra ID), with EIAM's password, second factor and device rules; the system opens a session with the user's group profiles. OpenID Connect is proposed, SAML 2.0 is the fall-back if BDOI IT prefers it.", "BDO users"]
    - [Local sign-in (break-glass), "User ID, password and second factor held in the system", "Two named System Administrators of BDOI IT"]
    - [Local sign-in (SIT only), User ID and password held in the system, "SIT and UAT users until BIBS is registered in EIAM for the environment"]
  steps:
    - The user opens the system and clicks Sign in with the BDO identity provider on the Login page.
    - EIAM signs the user in with the BDO account and its second factor, applying the BDO device and access policies, and returns the user to the system.
    - The system checks EIAM's answer, finds the active user that matches the returned Windows ID (or user principal name) and opens the session with the user's group profiles; the sign-in is recorded with its method.
    - An identity that matches no active user is refused with the not-linked message; EIAM unavailable shows "Your organisation's sign-in service could not complete the sign-in. Try again in a moment."
    - Log Out ends the session in the system and at EIAM; an inactivity sign-out asks for the EIAM sign-in again at the next access.
  rules:
    - "The system never creates a user from a sign-in; users exist through an approved enrolment or the UIDM-ISC provisioning."
    - "Roles and permissions stay in the system and change only through requests; no EIAM group is mapped to a role. EIAM may restrict who reaches the system through a 'BIBS users' group kept by BDOI IT."
    - "The Windows ID held on each user identifies the EIAM account; the user ID keeps the BDOI format a999999999."
    - "Switching to single sign-on is a setting of the environment once BDOI IT has registered the system in EIAM, not a change request."
  provisioning:
    - ["(a) UIDM-ISC provisions the user accounts; role changes stay requests in the system (proposed)", "Joiners, movers and leavers come from UIDM-ISC: create, change, deactivate and reactivate users, each with its UIDM request number. The assignment and change of group profiles and the group-profile requests stay requests in the system under four eyes (FRUM.009 to FRUM.011 for them).", "Standard user-provisioning interface (SCIM 2.0) from UIDM-ISC; extract of accounts, group profiles and permissions for certification"]
    - ["(b) UIDM-ISC provisions users and roles", "Every access change is requested and approved in UIDM-ISC and applied by the system; requests in the system only for the break-glass path.", "The same interface with the group profiles as entitlements"]
    - ["(c) No provisioning from UIDM-ISC", "Every access change is a request in the system, as the BRD reads; UIDM-ISC only reads the accounts for certification.", "Extract only"]
  provisioning_rules:
    - Every change applied from UIDM-ISC is recorded in the access-change log with the source UIDM-ISC and the UIDM request number, so the reports of FRUM.007 and FRUM.008 stay complete.
    - A refused provisioning event is answered to UIDM-ISC and alerted to the System Administrators; it is re-sent from UIDM-ISC once corrected.
    - A leaver deactivates the user and ends the user's open sessions.
  break_glass:
    - [Who, "Two named System Administrators of BDOI IT, listed in the configuration of the environment; no shared account"]
    - [When, "EIAM, or the network path to it, is not available, or the single sign-on settings must be repaired"]
    - [How, "Local password (Annex M) and the second factor, always"]
    - [Control, "Every sign-in recorded and alerted to Information Security; credentials kept in the BDOI privileged access vault; each use reviewed within one working day; password changed after each use"]
  bdoi_it:
    - "Registration of BIBS in EIAM for each environment: sign-in and sign-out addresses, the identifier of the user returned (Windows ID or user principal name) and test accounts for SIT and UAT."
    - "The choice of the UIDM-ISC option (a, b or c) and, for (a) or (b), the connection of UIDM-ISC to the system."
    - "Confirmation that EIAM's policies meet the BRD rules: lock-out after 3 invalid attempts, password expiry, second factor and BDO-issued devices."
    - "The holders of the break-glass accounts and the privileged access vault."

glossary:
  - [Access request, "A request to create, change, deactivate or reactivate a user, or to change a group profile, decided under four eyes; numbered AR-yyyy-nnnnnn"]
  - [Access-change log, "The log of every applied access change, one line per attribute with from and to values, request number, done by and approved by; no user can change it"]
  - [AD, Active Directory]
  - [Approver, "The user who reviews and approves, rejects or returns access requests (BRD section B)"]
  - [BDOI-BROKERSYS, "BDO Insure Brokering System (BIBS), the system specified in this document"]
  - [Break-glass administrator, "A named System Administrator account that keeps a local password and the second factor, so that the system can be administered when EIAM is not available"]
  - [BRD, Business Requirements Document]
  - [Business Administrator, "The BDOI user who defines and manages group profiles and raises group-profile requests (BRD section C)"]
  - [Dormant user, A user who has not signed in for the dormancy period]
  - [Effective date, The date on which an approved access change applies]
  - [EIAM, "BDO Enterprise Identity Access Management on Microsoft Entra ID, the Enterprise SSO platform of BDO users"]
  - [Enterprise SSO, "The BDO single sign-on platform (EIAM)"]
  - [Four eyes, The rule that an access change is decided by a user other than the one who requested it]
  - [FR, Functional requirement]
  - [FRUM, Functional requirement of User Access Maintenance in this document]
  - [FR-UA, Functional requirement of the BIBS FRS BRD-11 User Access Maintenance (reference of Annex P)]
  - [Group profile, A set of permissions assigned to a group of users (BRD 1.3); a role]
  - [Information Security Officer, "The BDOI Information Security user who authorises separation-of-duties rules and changes of security settings"]
  - [OpenID Connect, A single sign-on standard; the proposed way for the system to sign users in through EIAM]
  - [Permission, "One function or action of the system, with its module and action class (View, Create, Amend, Approve)"]
  - [Privilege level, "Low, Standard, High or Admin; given to each group profile; High and Admin changes need a second approval"]
  - [Provisioning, The creation and change of user accounts in the system from the identity governance tool]
  - [Requestor, The user who submits user access requests (BRD section A)]
  - [SAML 2.0, The other single sign-on standard the system supports]
  - [Second factor, A code of an authenticator application asked in addition to the password]
  - [Separation of duties, Pairs of group profiles one user may not hold together]
  - [Session log, "The record of every session: user, sign-in method, start, last activity, end and end reason"]
  - [SIT / UAT, System integration testing / user acceptance testing]
  - [SSO, Single sign-on]
  - [System Administrator, "The IT user who implements group profiles and maintains users and roles (BRD section D)"]
  - [UIDM / UIDM-ISC, "BDO's identity governance tool for joiner, mover and leaver requests and access certification"]
  - [UPN, "User principal name, the sign-in name of a BDO account (for example name@bdo.com.ph)"]
  - [User Access Matrix, The screen and export that show which roles hold which permissions]
  - [User ID, "The identifier of a user in the system, in the BDOI format a999999999"]
  - [Windows ID, "The user's BDO network log-on name, held on every user and used to match the EIAM account"]

