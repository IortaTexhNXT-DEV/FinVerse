    This version 1.2 was drafted with the iorta TechNXT Project Team, from the inputs of the business unit and BDO
    ITG, for review by the System Analyst. BDOI's text of version 1.1 is kept as issued; the additions elaborate it,
    and every point where the additions differ from it, or where BDOI's text needs a correction, is listed for BDOI's
    decision in Annex Q.
