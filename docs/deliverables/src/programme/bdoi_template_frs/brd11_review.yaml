# ----------------------------------------------------------------------------------- Annex V reports and schedules
reports:
  intro: >-
    Every report of User Access Maintenance and every run the system starts by itself. The reports run on demand
    from User Access › User Access Reports for the holders of the report right and export to PDF, Excel and CSV
    with the header of the BRD (report name, generated by, date coverage, date and time generated; BRD p.18). No
    report is sent by e-mail on a schedule today; a monthly access review report to Information Security is a
    proposal (Annex Q.5, UA-Q51).
  header: ["Report", "Frequency", "Who runs it", "Filters", "Columns (in order)", "Sort", "Output", "BRD / FR"]
  rows:
    - ["User Access Report", "On demand", "Business Administrator, System Administrator, Approver, Information Security, Auditor", "As-of date; business unit group; status; group profile", "User Name; User ID / Windows ID; User Group Profile; Business Unit / User Level; Status; Created by / Date Created; Modified by / Date Modified; Last Action / by", "User name", "PDF (landscape), Excel, CSV", "BRD 3.003.1; FRUM.007; Annex E"]
    - ["User Group Profile Report", "On demand", "As above", "Group profile; module; active", "Group Profile; Module Name; Task Name; Access (With Access / No Access); Date Created / Created by; Date Modified / Modified by", "Profile, then module", "PDF (portrait), Excel, CSV", "BRD 3.003.2; FRUM.007; Annex F"]
    - ["Group Profile Membership", "On demand", "As above", "Group profile; as-of date", "Group Profile; Member Username; Member User ID; Created by / Date Created; Modified by / Date Modified", "Profile, then member", "PDF (portrait), Excel, CSV", "BRD 3.003.3; FRUM.007; Annex G"]
    - ["User Access Audit Log", "On demand", "System Administrator, Information Security, Auditor", "Date from / to; user; activity; include log-ins and log-outs", "Date; Activity; From; To; Done By; Approved By / Request No.", "Date and time", "PDF (landscape), Excel, CSV", "BRD 4.003.1; FRUM.008; Annex H"]
    - ["Access Requests", "On demand", "Business Administrator, System Administrator, Approver, Auditor", "Period; status; request type", "Request No.; Request Type; User / Group Profile; Requester; Approver; Date Created; Date Decided; Effective Date; Age (days)", "Date created", "PDF, Excel, CSV", "BRD 1.008; FRUM.007.03"]
    - ["Audit Trail (screen)", "On demand", "Information Security, Auditor, System Administrator", "Period; user; module; action", "Timestamp; Module; User; Action; Record; Summary", "Newest first", "Screen; export CSV, PDF, Excel", "BRD 4.003.1; FRUM.008.02"]
    - ["User Access Matrix", "On demand", "Business Administrator, System Administrator, Approver, Information Security, Auditor", "Area; action class", "Permission; Area; Action class; one column per group profile", "Area, permission", "Excel (two sheets)", "BRD 4.002.2; FRUM.007.03; Annex C"]
  schedules_intro: "Runs the system starts by itself (Philippine time; each run is listed with its history on Administration › Scheduled Jobs and can be run again there):"
  schedules_header: ["Run", "When", "What it does", "Who is told", "Setting and owner", "BRD / FR"]
