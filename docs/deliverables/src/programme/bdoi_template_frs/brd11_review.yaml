    - ["Document formats", "Annexes B, D and U", "The layout of each report and export, the file names", "Process Owner; Auditor"]
    - ["Reports and schedules", "Annex V", "Report filters and columns; the times of the daily runs", "Process Owner; Information Security"]
    - ["Audit log", "FRUM.008; Annex H", "The activities recorded and the fields shown", "Information Security; Auditor"]
