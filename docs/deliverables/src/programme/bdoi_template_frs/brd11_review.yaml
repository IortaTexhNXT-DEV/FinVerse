# ----------------------------------------------------------------------------------- Annex Y data set-up at go-live
data_setup:
  intro: >-
    What User Access Maintenance needs loaded before go-live (and before each test cycle), where it comes from, the
    template, who provides it and who checks it. Users are not migrated from the legacy systems (data migration
    decision DMQ30): they are loaded with the bulk request and approved like single requests. The templates are the
    tabs UA-01 to UA-06 of the BIBS Master Data and Configuration Upload Templates v1.2.
  header: ["What is loaded", "Source", "Template", "Provided by", "Checked by", "How it is loaded", "Needed by"]
  rows:
    - ["Lists of values: business unit group, user level, deactivation reasons", "BDOI Business Administration", "UA-06 Lists of values (CI-06)", "Business Administration", "Process Owner", "Lists of Values under maker-checker", "1-Nov-2027 (before the users)"]
    - ["Group profiles and their permissions (role-to-permission matrix)", "BDOI's User Access Matrix (Annex C), completed", "UA-02 Role matrix (CI-02)", "Business Administration with the unit heads", "Information Security (signs)", "Group-profile requests, approved and implemented; checked with the User Group Profile Report", "9-Apr-2027 (trial migration 1)"]
    - ["Users with their group profiles", "BDOI HR and unit heads; for SSO users the EIAM accounts", "UA-01 Users and roles (CI-01)", "Business Administration with the unit heads", "Approver of the bulk request", "Bulk request, checked row by row and approved", "SIT/UAT reviewers 9-Apr-2027; production 1-Nov-2027"]
    - ["Approvers, approval rules and authorisation limits", "BDOI Business Administration; Comptrollership for amounts", "UA-03 Approval rules (CI-03)", "Business Administration; Comptrollership", "Information Security", "Requests (users' profiles and limits); settings", "16-Jul-2027"]
    - ["Separation-of-duties rules", "BDOI Information Security", "UA-04 SoD rules (CI-04)", "Information Security", "Information Security (authoriser)", "Separation of Duties screen, authorised", "16-Jul-2027"]
    - ["Password, session and sign-in settings", "BDOI Information Security; BDOI IT for the sign-in mode", "UA-05 Parameters (CI-05)", "Information Security; BDOI IT", "Information Security (approver)", "System Parameters, approved", "16-Jul-2027"]
    - ["Break-glass administrators and their second factor", "BDOI IT and Information Security", "-", "BDOI IT", "Information Security", "Enrolment of two named local accounts", "Before single sign-on is switched on"]
  not_loaded: "Not loaded: the access requests, access history and audit logs of the legacy systems stay in the legacy systems for their retention period (retention values, UA-Q53)."

# ------------------------------------------------------------- Annex Z assumptions, dependencies and open questions
# Every item of our sources is classified once: open (Annex Z.3), input (a value or data the Business Unit provides:
# requirements collection workbook and Annex Y), assumption / dependency (Z.1, Z.2), or answered by BDOI's FRS (dropped
# from the document, listed in the RTM workbook sheet "Answered in the BDOI FRS" with the BDOI clause).
open_items:
  intro: >-
    Only the points that BDOI's FRS does not answer. Each of our earlier references (CLR-UA, UQ, IQ, UA-Q, A-UA,
    D-UA) is kept in a column so that the link to earlier decisions is not lost. The points that BDOI's FRS answers
    were checked one by one and are listed, with the clause of BDOI's FRS that answers them, in the Test Cases and
    Traceability workbook (sheet "Answered in the BDOI FRS"). The values and data the Business Unit provides are in
    the requirements collection workbook.
  assumptions:
    - [A-UA-02, "Group profiles are the roles of the system; a user may hold several (BRD NFR 1.c-d).", "FRUM.001.02, FRUM.005"]
    - [A-UA-03, "BDOI's User Access Matrix (Annex C, preliminary) is completed and approved by the Business Unit before UAT.", "Annex C; UA-Q29"]
    - [A-UA-05, "The approvers of a group-profile request decide in the order chosen and all must approve.", "FRUM.005.03"]
    - [A-UA-06, "Single sign-on through EIAM is switched on by configuration once BDOI IT registers BIBS for each environment; SIT uses local sign-in until then; the break-glass administrators keep local sign-in.", "Annex N"]
    - [A-UA-07, "The infrastructure rows answered \"Follow existing QPS set up\" are met by the BIBS standards agreed for all BRDs.", "Annex X; UA-Q57"]
    - [A-UA-08, "The duplicate BRD IDs 2.002.7.1 and 3.003.1.1 are kept as printed and marked \"(2nd)\".", "Section 2; Annex P"]
  dependencies:
    - [D-UA-01, "BDOI IT registers BIBS in EIAM for each environment, with test accounts for SIT and UAT.", "FRUM.001.02 (CLR-UA-01)"]
    - [D-UA-02, "BDOI supplies the business unit groups and user levels.", "FRUM.002.03 (CLR-UA-05)"]
    - [D-UA-03, "BDOI names the Requestors, Approvers, Second Approvers and the high-privilege profiles.", "Section 3; FRUM.010.05 (UQ01, UQ07)"]
    - [D-UA-05, "The e-mail relay of each BIBS environment is available.", "FRUM.013 (UA-Q56)"]
    - [D-UA-07, "The decision on C01 (where requests are raised) is taken before the provisioning from UIDM-ISC is set up.", "FRUM.002, FRUM.003, FRUM.009 to FRUM.011"]
  open_header: ["No.", "Our references", "Question", "Why it matters", "Format of the answer needed", "Owner", "Needed by"]
  open:
    - {refs: "CLR-UA-01; UA-Q06; IQ04", q: "Which single sign-on standard does EIAM use for BIBS (OpenID Connect proposed, SAML 2.0 fall-back), and when is BIBS registered for each environment?", why: "BDOI's FRS onboards BIBS in the Enterprise SSO (FRUM.001.02) but does not name the standard or the registration.", fmt: "Choice: OpenID Connect or SAML 2.0; per environment: registration date, sign-in and sign-out addresses, identifier returned, two test accounts", owner: BDOI IT, by: 2026-12-01}
    - {refs: "CLR-UA-23; UA-Q12", q: "Should Log Out also end the user's EIAM session (single sign-out)?", why: "Ending the EIAM session also signs the user out of the other BDO applications.", fmt: "Yes / No", owner: BDOI IT, by: 2026-12-01}
    - {refs: "UA-Q11", q: "What is the longest a session may last before the system asks to sign in again (the fixed end before which the session-end warning appears)?", why: "BRD x.001.1.3 asks for a warning before the system-triggered log-out; BDOI's FRUM.001.04 gives the 30-minute inactivity time-out only.", fmt: "Number of hours (proposed: 10)", owner: Information Security, by: 2026-12-01}
    - {refs: "CLR-UA-24; UA-Q13", q: "Are local break-glass System Administrator accounts allowed when EIAM is the sign-in? If yes: how many, who holds them, where the credentials are kept and how each use is reviewed.", why: "BDOI's FRS requires the Enterprise SSO for every sign-in; the system must stay manageable when EIAM is not available.", fmt: "Yes / No; number; names of the holders; vault; review period", owner: Information Security, by: 2026-12-01}
    - {refs: "CLR-UA-17; UA-Q10", q: "Which BDO network and device policy enforces access from BDO-issued devices only?", why: "BRD 1.001.1 a; the system cannot see the device a browser runs on.", fmt: "Name of the policy and confirmation that it applies to BIBS", owner: BDOI IT, by: 2026-12-01}
    - {refs: "CLR-UA-09; UQ09; UA-Q44", q: "Must one session per user or per device be enforced?", why: "BDOI's FRUM.001.01 allows several tabs; one session per device is not stated.", fmt: "Yes (per user / per device) / No", owner: Information Security, by: 2026-12-01}
    - {refs: "UQ13", q: "Must the user list show who is online in real time, and must an administrator be able to end a user's session?", why: "BRD NFR p.14 lists the status Online.", fmt: "Yes / No for each", owner: Business Administration, by: 2026-12-01}
    - {refs: "UQ07", q: "Which group profiles are high privilege, what are the working hours, and who gives the additional review of privileged or out-of-hours changes?", why: "BRD NFR 11 asks for the escalation of such changes; Annex Q, C17.", fmt: "List of profiles with level High or Admin; hours (e.g. 08:00-18:00 Mon-Fri); role of the second approver", owner: Information Security, by: 2027-07-16}
    - {refs: "CLR-UA-14; UA-Q37", q: "Do public holidays count as out of hours for the second approval?", why: "The working hours have no holiday calendar.", fmt: "Yes / No", owner: Information Security, by: 2027-07-16}
    - {refs: "CLR-UA-08; UA-Q42", q: "Dormant accounts: after how many days without a sign-in is a user deactivated, and how many days before is the user told?", why: "Information Security practice; BRD NFR 1.e allows accounts to be disabled.", fmt: "Number of days (proposed 90) and notice days (proposed 7); 0 switches it off", owner: Information Security, by: 2027-07-16}
    - {refs: "CLR-UA-15; UA-Q31", q: "When a new separation-of-duties rule is made, does Information Security review the users who already hold both profiles and raise the requests?", why: "Existing access changes only through requests.", fmt: "Yes / No and who raises the requests", owner: Information Security, by: 2027-07-16}
    - {refs: "CLR-UA-04; UA-Q24", q: "Do external (portal) users stay switched off?", why: "The BDOI drop plan has no portal.", fmt: "Yes / No", owner: BDOI IT, by: 2026-12-01}
    - {refs: "CLR-UA-06; UQ06; UA-Q39", q: "Effective dates: may a user access change start on a later date, and may access be given until an end date (temporary access)?", why: "BRD NFR 1.k asks for an effective date; an end date is not stated. Applies to the changes raised in the system (decision C01).", fmt: "Start date: Yes / No; End date: Yes / No", owner: Business Administration, by: 2026-12-01}
    - {refs: "CLR-UA-13", q: "If temporary access is needed: who is told before the end date and how many days before?", why: "Follows the answer above.", fmt: "Role and number of days", owner: Business Administration, by: 2026-12-01}
    - {refs: "CLR-UA-11; UA-Q32", q: "Should the Requestor read the User Access Matrix?", why: "BRD 4.002.2.7 (view function) does not name the matrix.", fmt: "Yes / No", owner: Business Administration, by: 2026-12-01}
    - {refs: "CLR-UA-18; CLR-UA-19; CLR-UA-20; UA-Q36", q: "Confirm the stages and labels shown on a request (Draft, Pending Approval, Second approval, Approved / For implementation, Implemented, Scheduled, Returned, Rejected, Cancelled) and the full status labels.", why: "The screens show these stages (Annex J).", fmt: "Confirm / give the labels", owner: Business Administration, by: 2026-12-01}
    - {refs: "CLR-UA-27; UA-Q04", q: "Accept the numbered acceptance criteria of section 3 and the IDs UAM-NFR-01 to 41 as the acceptance basis; BRD rows without a Mandatory flag treated as Must have.", why: "The BRD has no acceptance criteria and no NFR IDs; they are the basis of the test cases.", fmt: "Accept / amend per item", owner: "Business Administration; Information Security", by: 2026-12-01}
