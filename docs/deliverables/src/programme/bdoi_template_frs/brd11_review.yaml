# ---------------------------------------------------------------------------------- Annex AA change control
change_control:
  intro: >-
    Once this FRS is signed it is the baseline of User Access Maintenance (section 1.6). This annex says what the
    signature freezes, how a change is raised and decided, and where it is recorded: the Change Request Register
    workbook of BRD-11.
  freezes:
    - "The functional requirements of section 3 with their acceptance criteria, and the Business Requirements Mapping of section 2."
    - "The screens, fields, actions, messages and walkthroughs (Annexes J, K and O), the e-mail texts (Annex T), the document formats (Annex U), the reports and schedules (Annex V)."
    - "The workflow and approvals (Annex S), the business rules (Annex M) and the integrations at business level (Annexes N and W)."
  not_frozen: >-
    Not frozen: the content of the configuration - users, group profiles and their permissions, approvers, list
    values and the settings of Annex M (password, session, working hours, dormancy). They change in the system
    through approved requests and audited changes, without a change request.
  steps_header: ["Step", "What happens", "Who", "Record"]
  steps:
    - ["1 Raise", "The change is written with the BRD ID, the FR item or annex concerned, the reason and the business priority", "Any signatory or the Process Owner", "Register: new row, status Raised"]
    - ["2 Assess", "Impact on scope, schedule, cost (mandays), the other BRDs (interface lines of Annex W), the test cases and the training", "iorta TechNXT Project Team with the System Analyst (BDO ITG)", "Impact assessment form; status Assessed"]
    - ["3 Approve", "Decision by the owners of every BRD touched; a change to a separation-of-duties rule, the sign-in or a security setting also by Information Security; a change to an integration also by BDOI IT", "Business owner; Process Owner; Information Security; BDOI IT", "Decision, approved by, date; status Approved or Rejected"]
    - ["4 Schedule", "The change is given a drop and a version of this FRS (1.4, 1.5 and so on)", "Project managers", "Target drop; status Scheduled"]
    - ["5 Test", "The test cases linked to the change are updated and run", "Test lead; Business Unit testers", "Linked test cases; result"]
    - ["6 Close", "The new version of the FRS and of the workbooks is issued with the change marked", "System Analyst (BDO ITG)", "Status Closed"]
  candidates: >-
    The Change Request Register is seeded with the candidate changes already known - the points where this FRS or
    BDOI's FRS goes beyond the BRD text - with the status "Candidate - for decision", and with one decision row per
    observation of Annex Q so that the Business Unit records its decision on each.

