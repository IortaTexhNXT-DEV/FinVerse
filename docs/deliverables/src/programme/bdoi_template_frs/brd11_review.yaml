    be confirmed is recorded as a comment in the requirements collection workbook (sheet Questions and comments) or,
    when it changes the document, in the Change Request Register.
  header: ["No.", "Point", "Where", "What to confirm", "Role", "Done"]
  rows:
    - ["Scope", "1.8, section 2", "In scope, out of scope and handled elsewhere are as the Business Unit expects", "Product Owner"]
