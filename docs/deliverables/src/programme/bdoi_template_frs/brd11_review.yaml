# ---------------------------------------------------------------------------------- Annex Q.5 observations of v1.3
observations:
  - topic: E-mail copy of the request notices
    bdoi: "-"
    brd: "BRD 1.006.1.1, 1.008.1.4 and 2.002.1 a: receive notification on the returned, decided and to-approve request."
    proposal: "The notices of requests (NT-01 to NT-06) are given in the system (bell); Annex L of version 1.2 said they were also e-mailed by preference, which the system does not do today. Annex L is corrected and the e-mail copy is a point for decision (Annex Z)."
    impact: "Annexes L and T; FRUM.013.01."
    decide_by: Process Owner (Business Administration)
  - topic: Notices not listed in version 1.2
    bdoi: "-"
    brd: "BRD NFR p.17 (1, 11)."
    proposal: "The two notices of the reset of a break-glass authenticator app (NT-19, NT-20) are added to Annex T."
    impact: "Annex T."
    decide_by: Information Security - for information
  - topic: Wording of three system texts
    bdoi: "-"
    brd: "-"
    proposal: "Proposed wording for BDOI's approval: NT-17 \"New rule <rule>: <reason>\" instead of \"The new rule of rule <rule>\"; NT-13 \"(emergency role edit)\" instead of the setting code shown today; NT-18: the system says \"<user> requests a change from ... to ...\" while Annex L of version 1.2 showed \"asks to change it from\"; Annex L now quotes the system and BDOI chooses the wording."
    impact: "Annexes L and T."
    decide_by: Process Owner (Business Administration)
  - topic: Approval times, reminders and escalation
    bdoi: "-"
    brd: "No service level in the BRD."
    proposal: "Proposed: 2 working days per approval stage, 1 for the second approval and the implementation; a reminder on the next working day and escalation to the Business Administrator after 5 working days. Not available in the system today: the age of each request is shown on the Access Requests list and report."
    impact: "Annex S; Change Request Register (candidate)."
    decide_by: Process Owner (Business Administration)
  - topic: Scheduled access review report
    bdoi: "-"
    brd: "BRD NFR p.11 (audit log report weekly, monthly, yearly) - UA-Q51."
    proposal: "Proposed as best practice: the User Access Report and the User Access Audit Log of the month sent to Information Security on the first working day of each month. Not available today (reports run on demand)."
    impact: "Annex V; Change Request Register (candidate)."
    decide_by: Information Security
  - topic: Alert of a break-glass sign-in
    bdoi: "FRUM.001.02: SSO for every user."
    brd: "BRD NFR p.17 (11): changes systematically monitored."
    proposal: "FRUM.001.06 asks that Information Security is alerted at every break-glass sign-in. The system records the sign-in with its method in the audit trail today; the alert is planned for the release that switches single sign-on on."
    impact: "FRUM.001.06; Annex N."
    decide_by: Information Security
  - topic: Non-functional rows without an FR item
    bdoi: "-"
    brd: "BRD section 6 (41 rows, no IDs)."
    proposal: "Annex X lists all 41 rows with how each is met; version 1.2 traced only the 25 rows that carry a function (Annex P)."
    impact: "Annex X."
    decide_by: BDOI IT - for information
  - topic: Open questions answered in BDOI's FRS
    bdoi: "Sections 1 to 3 and Annexes E to I."
    brd: "-"
    proposal: "Our earlier questions that BDOI's FRS answers are no longer asked; each is listed with the BDOI clause that answers it in the Test Cases and Traceability workbook (sheet Answered in the BDOI FRS). Where BDOI's answer differs from the BRD, the decision stays in Annex Q."
    impact: "Annex Z."
    decide_by: System Analyst (BDO ITG) - for information
  - topic: E-mail sender and footer
    bdoi: "-"
    brd: "BRD NFR p.17 (10)."
    proposal: "The e-mails are plain text without a footer; BDOI gives the sender address of each environment and, if required, its standard footer or disclaimer (requirements collection workbook)."
    impact: "Annex T."
    decide_by: BDOI IT; Process Owner (Business Administration)

