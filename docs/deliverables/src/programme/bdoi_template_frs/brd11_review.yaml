    - ["Dormant users", "Daily 00:15", "Tells users 7 days before the deactivation; deactivates users without a sign-in for 90 days (System Administrator profile exempt)", "The user (NT-15, NT-07); Business and System Administrators (NT-16)", "Dormancy period and notice days: Information Security (CLR-UA-08)", "BRD NFR p.13 (1.e); FRUM.003.04"]
    - ["Password expiry notice", "Daily 06:00", "Tells the holders of local (break-glass) accounts whose password expires within 7 days", "The holder (NT-09)", "Information Security", "BRD NFR p.17 (7); FRUM-004.01"]
    - ["Retention review", "Monthly, 2nd day 11:00", "Counts the records that have reached their retention period under each rule; archives or deletes nothing", "System Administrator (run history)", "Retention periods: Compliance (UA-Q53)", "BRD NFR p.11, p.14 (retention); Annex X"]
    - ["E-mail dispatch", "Every 2 minutes", "Sends the queued e-mails of the notices above", "-", "System Administrator; relay by BDOI IT (UA-Q56)", "BRD NFR p.17 (10)"]
