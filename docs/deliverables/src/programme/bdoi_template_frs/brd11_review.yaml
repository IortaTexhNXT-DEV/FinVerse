# Additions of version 1.3 (Business Unit review edition) to the User Access Maintenance FRS in BDOI's template.
# Read by build_brd11_bdoi_frs.py (the FRS) and build_brd11_workbooks.py (the workbooks of the review pack).
# Business wording only. Every passage traces to a BRD ID of the BRD of 8-Oct-2026; anything beyond the BRD is a
# proposal and is listed in Annex Q.5. "C01" etc. are the conflicts of Annex Q (written Q-nn (Cnn) in the document).

meta:
  version: "1.3"
  date: 09 Oct 2026
  clean: BIBS_FRS-BDOI_BRD-11_User_Access_Maintenance_v1.3.docx
  highlighted: BIBS_FRS-BDOI_BRD-11_User_Access_Maintenance_v1.3_Changes_Highlighted.docx
  revision_row: ["09 Oct 2026", "1.3", "Business Unit review edition: summary for the Business Unit, end-to-end flows, workflow and approvals, e-mail texts, document formats, reports and schedules, integrations, non-functional requirements, open questions not answered in the BDOI FRS, change control, review checklist", "iorta TechNXT Project Team (drafting)"]
  references: >-
    References added in version 1.3: the review workbooks of BRD-11 issued with this edition (Business Unit
    Requirements Collection, BRD vs Out-of-the-Box vs Best Practice, Change Request Register, Test Cases and
    Traceability, Business Unit Walkthrough Users, all v1.0 of 9-Oct-2026); BIBS Non-Functional Requirements Register
    v1.0; BIBS Master Data and Configuration Upload Templates v1.2; BDOI Requirements and Inputs by BRD v1.2.

# ------------------------------------------------------------------------- 1.8 Summary for the Business Unit Review
summary:
  intro: >-
    This section is the short way into the document for the Business Unit. It shows on a few pages what User Access
    Maintenance covers, how the work flows from one persona to the next, the numbers behind the document, the
    decisions the Business Unit must take before signing, and which part each reviewer reads. The detail is in
    sections 2 and 3 and in the annexes; every statement traces to a BRD ID of the User Access Maintenance BRD of
    8-Oct-2026.
  scope_header: ["In scope of this FRS", "Out of scope", "Handled in another FRS or document"]
  scope:
    - ["Sign-in through the BDO single sign-on (EIAM), inactivity warning, session end, log-out (FRUM.001)", "Creation of EIAM accounts, their passwords, lock-out and second factor (BDO Enterprise SSO platform; FRUM.002, FRUM-004)", "Permissions of each business module (the FRS of each BRD; the matrix of Annex C)"]
    - ["Users: creation, update, deactivation, reactivation, dormant users (FRUM.002, FRUM.003)", "AD group creation and its request (FRUM.005, as BDOI states)", "Loading the users at go-live: Data Set-up (Annex Y) with BRD-13 Data Migration"]
    - ["Passwords of the break-glass accounts only (FRUM-004, FRUM.001.06)", "Authorisation through an external access-control list (BRD NFR 1.i, on hold)", "Technical settings of single sign-on and provisioning: Technical Specification reviewed by BDOI IT"]
    - ["Roles (group profiles) and their permissions (FRUM.005, FRUM.006)", "Portal (external) users: no portal in the BDOI drop plan", "Screen standards: programme level (BIBS screen standards)"]
    - ["Access requests, approvals, bulk requests (FRUM.009 to FRUM.011), within the decision on C01", "Infrastructure set-up answered 'Follow existing QPS set up' (Annex X)", "Hosting, back-up, disaster recovery: programme NFR register"]
    - ["Reports and audit logs (FRUM.007, FRUM.008); separation of duties and security settings (FRUM.012); notices and e-mails (FRUM.013)", "The device policy itself (BDO network and EIAM conditional access)", "Access certification campaigns in UIDM-ISC (BDOI IT)"]
  numbers_intro: "The key numbers of this document (counted by the builder of the document; the workbooks give the same numbers):"
  decisions_intro: >-
    The ten decisions below shape the rest of the document. Each points to the row of Annex Q (observations and
    points for decision) or Annex Z (open questions) where both readings, the BRD text and the proposal are given.
  decisions:
    - [1, "Where access requests are raised and approved: in UIDM-ISC (BDOI's FRS, \"c/o UIDM\") or in the system (BRD sections A and B)", "C01", "BDOI IT; Process Owner (Business Administration); Information Security"]
    - [2, "Roles assigned and changed only through approved requests and implemented by the System Administrator, or directly by authorised users", "C02, C03, C22", "Process Owner (Business Administration); Information Security"]
    - [3, "User ID and Windows ID, duplicate check and the user fields synchronised from the SSO platform", "C04, C05, C06, C28", "Process Owner (Business Administration); BDOI IT"]
    - [4, "Message at session time-out and the warning before the fixed end of a session", "C07, C08", "Process Owner (Business Administration)"]
    - [5, "Lock-out, password history of 10 and the reset of the break-glass accounts; number and holders of break-glass accounts", "C09, C10, C11; Z: CLR-UA-24", "Information Security; BDOI IT"]
    - [6, "Revocation on an SSO status change, synchronisation status and on-demand synchronisation", "C13, C14", "BDOI IT"]
    - [7, "Which profiles are high privilege, the working hours and who gives the second approval", "C17; Z: UQ07", "Information Security"]
    - [8, "Conflicting permissions inside a role and the separation-of-duties pairs of profiles", "C16", "Information Security"]
    - [9, "Dormant accounts: period and notice", "C26; Z: CLR-UA-08", "Information Security"]
    - [10, "Export file names and the role and IP address in the audit log", "C18, C19", "Process Owner (Business Administration); Information Security"]
  review_intro: "How to review: each reviewer reads the parts of his or her role; the times are a guide for a first reading."
  review_header: ["Reviewer (role)", "Read first", "Then", "About"]
  review:
    - ["Product Owner, Marketing Business System", "1.8 Summary; Annex A figures; Annex AB checklist", "Annex Q decisions; Annex Z open questions", "2 hours"]
    - ["Process Owner, User Access Maintenance (Business Administration)", "Sections 2 and 3; Annex A; Annex S workflow", "Annexes J, K, O (screens, messages, walkthroughs); T e-mails; U documents; V reports", "4 hours"]
    - ["BDOI Information Security", "FRUM.001, FRUM-004, FRUM.008, FRUM.012; Annex M rules", "Annex N sign-in; Annex X non-functional requirements; Annex Q decisions 5 to 9", "3 hours"]
    - ["BDOI IT", "Annex N sign-in and identity; Annex W integrations", "Annex Y data set-up; Annex Z integration questions", "2 hours"]
    - ["Internal Audit and Compliance", "FRUM.007, FRUM.008; Annex V reports", "Annex U document formats; Annex X retention and audit", "1.5 hours"]
    - ["System Analyst (BDO ITG)", "Section 2 mapping; Annex P traceability; Annex Q", "Annex AA change control; the review workbooks", "4 hours"]
  workbooks_intro: "The review workbooks issued with this edition (same numbers as this document):"
  workbooks:
    - ["Business Unit Requirements Collection", "What the Business Unit provides: document layouts, e-mail wordings, schedules, parameters, lists, master data, approvers, integration inputs, open decisions"]
    - ["BRD vs Out-of-the-Box vs Best Practice", "For every BRD requirement: what the system offers as standard, broking best practice, fit and recommendation"]
    - ["Change Request Register", "How a change after sign-off is raised and decided; candidate changes; the decision log of every Annex Q observation"]
    - ["Test Cases and Traceability", "BRD ID to FR item, test cases, screens and walkthrough steps; the questions answered in BDOI's FRS; UAT entry and exit criteria"]
    - ["Business Unit Walkthrough Users", "The sign-in ID of every persona for the walkthrough in the BIBS UAT environment and the walkthrough script"]

# ------------------------------------------------------------------------------------- Annex A additions (figures)
annex_a:
  intro: >-
    Added in version 1.3: one figure for every process of the BRD, drawn from end to end with one column per persona
    and one for the system, then the status life-cycle of each record and the integration context. BDOI's four
    process flows above are kept as issued; where the figures below follow the BRD and BDOI's FRS reads differently,
    the point is in Annex Q.

# ------------------------------------------------------------------------------------- Annex S workflow and approvals
workflow:
  intro: >-
    How each change of access is made, checked and approved: the stages, who acts at each stage, the limits and
    controls, the time rules, escalation and the paths to return or void a request. The figure gives the routes at a
    glance; the table gives the detail. The BRD sets no service level for approvals; the times marked "proposed" are
    a proposal of iorta TechNXT for the Business Unit to confirm (Annex Q.5 and the requirements collection
    workbook, sheet Schedules and timings).
  header: ["Process", "Stage", "Who acts (maker / checker / approver)", "Limits and controls", "Time rule, reminder, escalation", "Return or void"]
  rows:
    - ["User access request (BRD 1.002 to 1.008, 2.002)", "1 Draft", "Requestor (maker)", "Seen and edited by its creator only; justification mandatory; one open request per user", "No time limit; draft kept until submitted or cancelled", "Cancel with a reason (BRD 1.002.1.3)"]
    - ["", "2 Pending Approval", "Approver chosen on the request (checker)", "Four eyes: not the requester, not the user concerned; checks repeated at approval", "Proposed: decision within 2 working days; reminder on day 3; age shown in the Access Requests report", "Return with remarks (BRD 2.002.7); reject with a reason (BRD 2.002.6); requester may cancel (BRD 1.007)"]
    - ["", "3 Pending Second Approval", "Second Approver (Information Security)", "Only for a privileged profile (High, Admin) or an out-of-hours change; not the first approver", "Proposed: within 1 working day; alert Privileged access change to System Administrators and Auditors", "Return or reject as stage 2"]
    - ["", "4 Scheduled / Approved", "System", "Applied at once, or on the effective date by the daily run at 00:05", "Failed application alerted (high) to System Administrators and Auditors", "Creator or approver may cancel a Scheduled request"]
    - ["Bulk request (BRD 1.009)", "1 Upload and draft batch", "Requestor (maker)", "Every row checked before the batch is created; rows in error listed for correction", "-", "Cancel the draft batch"]
    - ["", "2 Decision on the batch", "Approver chosen on the batch", "Decided as a whole (CLR-UA-16 answered by BDOI's mapping \"c/o UIDM\"; Annex Q, C24)", "As stage 2 above", "Return or reject the whole batch"]
    - ["Group-profile request (BRD 3.002)", "1 Draft", "Business Administrator (maker)", "Unique profile name; no permission both added and removed; privilege level given", "-", "Cancel"]
    - ["", "2 Approvals in order", "Approvers chosen on the request, in order; all must approve", "The next approver is asked only after the previous one approves", "Proposed: 2 working days per approver", "Return or reject ends the round"]
    - ["", "3 For Implementation", "System Administrator (implementer)", "Not the requester of the request (four eyes)", "Proposed: implemented within 1 working day of the last approval", "-"]
    - ["Separation-of-duties rule (BRD NFR 11)", "Create or deactivate; authorise", "Business Administrator (maker); Information Security Officer (checker)", "The maker cannot authorise; rule applies to every later request and bulk line", "Proposed: 2 working days", "Reject: rule not created / deactivation refused"]
    - ["Security setting (BRD NFR 11; p.14)", "Change; approve", "System Administrator (maker); Information Security Officer (approver)", "Old value stays in force until approved; change audited", "Proposed: 2 working days", "Reject: setting unchanged"]
    - ["Second-factor reset (break-glass)", "Request; approve", "System Administrator; another holder of the reset approval right", "The requester cannot approve", "Same working day", "Reject"]
    - ["Dormant users (Information Security practice; CLR-UA-08)", "Notice; deactivation", "System (daily run 00:15)", "Notice 7 days before; deactivation after 90 days without sign-in; System Administrator profile exempt", "Business and System Administrators receive the list", "Reactivation request"]
  matrix_intro: "Role-to-stage matrix: M = makes, C = checks or approves, 2 = second approval, I = implements, V = views."
  matrix_header: ["Stage", "Requestor", "Approver", "Second Approver", "Business Admin.", "System Admin.", "Information Security", "Auditor"]
  matrix:
    - ["User access request: raise, correct, cancel", M, "", "", M, "", "", V]
    - ["User access request: approve, reject, return", "", C, "", "", "", "", V]
    - ["Privileged or out-of-hours change", "", C, "2", "", "", "", V]
    - ["Bulk request", M, C, "2", M, M, "", V]
    - ["Group-profile request", "", C, "", M, I, V, V]
    - ["Separation-of-duties rule", "", "", "", M, "", C, V]
    - ["Security setting", "", "", "", "", M, C, V]
    - ["Second-factor reset", "", "", "", "", M, C, ""]
    - ["Reports and audit log", "", V, "", V, V, V, V]
  escalation: >-
    Escalation today: the request ages on the Access Requests list and report (Age in days); the Business
    Administrator may cancel it and raise it again to another approver, or the setting "Any approver may decide"
    lets every holder of the approval right decide it. An automatic reminder and escalation after a number of
    working days is a proposal (Annex Q.5) for the Business Unit to decide.

# ------------------------------------------------------------------------------- Annex T e-mail and notification texts
emails:
  intro: >-
    Every notice and e-mail of User Access Maintenance, word for word as the system sends it today. The parts in
    angle brackets are filled in by the system. BDOI has not given wordings for these messages: the texts below are
    proposed by iorta TechNXT for BDOI's approval (requirements collection workbook, sheet E-mail wordings). The
    e-mails are plain text, sent from the system address of the environment, with no attachment; no password is
    ever sent by e-mail (the temporary password of a new user is shown once to the approver on the screen). A
    notice "in the system" appears under the bell in the page header and opens the record.
  common:
    attachments: None
    protection: "No attachment and no password in the message; the link opens the record only for a signed-in user who holds the right."
  items:
    - id: NT-01
      name: Request to approve
      trigger: "A user access request is submitted or re-submitted; a group-profile request approved by one approver waits for the next approver in order."
      recipients: "The approver chosen on the request (group profiles: the next approver in order); for a request raised without a chosen approver, every holder of the approval right."
      channel: Notice in the system
      subject: "Access request <request no> to approve"
      body: "<description of the change>, for example: Create user a013000196 with group profiles Marketing Account Officer"
      frequency: "Once per submission or re-submission; once per approver in order."
      brd: "BRD 2.002.1 (a); BRD 3.002.1.2"
      frum: "FRUM.010.01, FRUM.005.03, FRUM.013.01"
      code: ['notice(r, "to approve"']
    - id: NT-02
      name: Request for second approval
      trigger: "The first approval of a request with a risk flag (privilege increase, outside working hours)."
      recipients: "Every holder of the second-approval right (Second Approver), except the first approver."
      channel: Notice in the system
      subject: "Access request <request no> for second approval"
      body: "<description of the change> (<risk flags: privilege increase, outside working hours>)"
      frequency: Once per request.
      brd: "BRD NFR p.17 (11)"
      frum: "FRUM.010.05"
      code: ['"for second approval"', 'riskLabels(r) + ")"']
    - id: NT-03
      name: Request to implement
      trigger: "The last approval of a group-profile request (the request waits for implementation)."
      recipients: "Every holder of the role management right (System Administrators)."
      channel: Notice in the system
      subject: "Access request <request no> to implement"
      body: "<description of the change>"
      frequency: Once per request.
      brd: "BRD 3.002; p.6"
      frum: "FRUM.005.04"
      code: ['"to implement"']
    - id: NT-04
      name: Decision on the request
      trigger: "A request is approved and applied, approved with a later effective date, approved for implementation, rejected, implemented, or applied on its effective date by the daily run."
      recipients: "The requester (the user who submitted the request)."
      channel: Notice in the system
      subject: "Access request <request no> approved | approved, applies on <dd-MMM-yyyy> | approved, for implementation | rejected | implemented | applied on its effective date"
      body: "<description of the change> (<comment of the decider>)"
      frequency: Once per decision.
      brd: "BRD 1.008.1.4"
      frum: "FRUM.009.09, FRUM.013.01"
      code: ['"approved, applies on "', '"approved, for implementation"', '"rejected"', '"implemented"', '"applied on its effective date"']
    - id: NT-05
      name: Request returned
      trigger: "The approver returns a request for correction."
      recipients: "The requester."
      channel: Notice in the system
      subject: "Access request <request no> returned"
      body: "<description of the change> - <remarks of the approver>"
      frequency: Once per return.
      brd: "BRD 1.006.1.1; 2.002.7"
      frum: "FRUM.009.07, FRUM.010.04"
      code: ['"returned"']
    - id: NT-06
      name: Request cancelled
      trigger: "The creator cancels a request that was assigned to an approver."
      recipients: "The approver the request was assigned to."
      channel: Notice in the system
      subject: "Access request <request no> cancelled"
      body: "<description of the change> - <reason for the cancellation>"
      frequency: Once per cancellation.
      brd: "BRD 1.007.1"
      frum: "FRUM.009.08"
      code: ['"cancelled"']
    - id: NT-07
      name: Your access changed
      trigger: "An approved change to a user is applied (at approval, or on the effective date)."
      recipients: "The user whose access changed (e-mail to the user's registered address)."
      channel: "Notice in the system and e-mail"
      subject: "BIBS: your access changed (e-mail); Your access changed (notice)"
      body: "Your access changed: <description of the change> (request <request no>)."
      frequency: "Once per applied change."
      brd: "BRD NFR p.17 (10)"
      frum: "FRUM.013.01"
      code: ['"Your access changed: "', '": your access changed"']
    - id: NT-14
      name: Your access changed (group profile deactivated or reactivated)
      trigger: "A request that deactivates or reactivates a group profile is implemented."
      recipients: "Each active member of the group profile (e-mail to the member's registered address)."
      channel: "Notice in the system and e-mail"
      subject: "BIBS: your access changed (e-mail); Your access changed (notice)"
      body: "Your access changed: <description of the change>, a group profile you hold (request <request no>)."
      frequency: "Once per member and request."
      brd: "BRD 3.002.3, 3.002.4; NFR p.17 (10)"
      frum: "FRUM.006.04, FRUM.013.01"
      code: ['", a group profile you hold (request "']
    - id: NT-15
      name: Your account will be deactivated
      trigger: "The daily run of dormant users (00:15) finds a user whose deactivation is 7 days away."
      recipients: "The dormant user."
      channel: "Notice in the system and e-mail"
      subject: "BIBS: sign in to keep your account (e-mail); Your account will be deactivated (notice)"
      body: "You have not signed in to BIBS for a long time. Sign in before <dd-MMM-yyyy>, or your account is deactivated and a new access request is needed."
      frequency: "Once, 7 days before the deactivation."
      brd: "BRD NFR p.13 (1.e)"
      frum: "FRUM.003.04"
      code: ['" for a long time. Sign in before "', '": sign in to keep your account"']
    - id: NT-16
      name: Dormant users deactivated
      trigger: "The daily run of dormant users deactivates one or more users (each user also receives NT-07)."
      recipients: "Every holder of the request right (Business Administrators, System Administrators)."
      channel: Notice in the system
      subject: "Dormant users deactivated"
      body: "<count> user(s) without a sign-in for <days> days were deactivated: <user IDs>"
      frequency: "Once per run that deactivates users."
      brd: "BRD NFR p.13 (1.e)"
      frum: "FRUM.003.04"
      code: ['" user(s) without a sign-in for "']
    - id: NT-08
      name: Reset your password (break-glass accounts only)
      trigger: "A local account asks for a reset link (Forgot password?). Not offered to single sign-on users (BDOI's FRUM-004.03)."
      recipients: "The registered e-mail address of the user, when the account is active and has one."
      channel: E-mail
      subject: "BIBS: reset your password"
      body: "Dear <full name>, A new BIBS password was requested for user <user ID>. Open this link to set it: <link>. The link works once and expires at <date and time> (Philippine time). If you did not ask for it, ignore this e-mail; your password stays as it is."
      frequency: "Once per request; the link works once and for 30 minutes."
      brd: "BRD NFR p.17 (1, 8)"
      frum: "FRUM-004.03, FRUM.001.06"
      code: ['" password was requested for user "', '": reset your password"']
    - id: NT-09
      name: Your password expires soon (break-glass accounts)
      trigger: "The daily run (06:00) finds a local password that expires within 7 days."
      recipients: "The holder of the local account."
      channel: "Notice in the system; e-mail when the user's preference asks for it"
      subject: "BIBS: your password expires soon (e-mail); Your password expires soon (notice)"
      body: "Your BIBS password expires on <date and time> (Philippine time). Change it on My Profile before then."
      frequency: "Daily while the password expires within 7 days."
      brd: "BRD NFR p.17 (7)"
      frum: "FRUM-004.01"
      code: ['" password expires on "', '": your password expires soon"']
    - id: NT-10
      name: Batch job failed
      trigger: "A scheduled run fails (for example the daily application of dated access changes)."
      recipients: "The addresses of the setting \"failed-run recipients\" (to be named by BDOI, UA-Q52)."
      channel: E-mail
      subject: "BIBS: batch job <job> failed"
      body: "The batch job <job> failed. Run: <run>. Started: <date and time> (Philippine time). Trigger: <trigger>. Error: <message>. Open Administration > Scheduled Jobs to see the run history and run the job again."
      frequency: "Once per failed run."
      brd: "BRD NFR p.15 (batch failure e-mail)"
      frum: "FRUM.013.02"
      code: ['"The batch job "', '"\nError: "']
    - id: NT-11
      name: "Alert: privileged access change"
      trigger: "A request with a risk flag passes its first approval."
      recipients: "Holders of the alert right (System Administrators, Auditors)."
      channel: "Alerts inbox in the system (medium)"
      subject: "Privileged access change"
      body: "Access request <request no> (<risk flags>): <description of the change>"
      frequency: Once per request.
      brd: "BRD NFR p.17 (11)"
      frum: "FRUM.010.05"
      code: ['PRIVILEGED_CHANGE,', '+ AccessRequestNotifier.riskLabels(r)']
    - id: NT-12
      name: "Alert: scheduled access change failed"
      trigger: "A scheduled request cannot be applied on its effective date."
      recipients: "Holders of the alert right (System Administrators, Auditors)."
      channel: "Alerts inbox in the system (high)"
      subject: "Scheduled access change failed"
      body: "Access request <request no> could not be applied on <dd-MMM-yyyy>: <reason>"
      frequency: "Once per request and date."
      brd: "BRD NFR p.13 (1.k)"
      frum: "FRUM.009.10"
      code: ['" could not be applied on "']
    - id: NT-13
      name: "Alert: role edited outside a request"
      trigger: "A group profile is created or changed directly while the emergency role edit is switched on."
      recipients: "Holders of the alert right (System Administrators, Auditors)."
      channel: "Alerts inbox in the system (medium)"
      subject: "Role edited outside a request"
      body: "Role <profile code> <change> directly by <user> (emergency path <setting code>)"
      frequency: "Once per direct change."
      brd: "BRD NFR p.17 (11)"
      frum: "FRUM.005.01, FRUM.012.02"
      code: ['" directly by "']
    - id: NT-17
      name: Separation-of-duties rule to authorise
      trigger: "A separation-of-duties rule is created, or its deactivation is asked."
      recipients: "Every holder of the rule authorisation right (Information Security Officers), except the maker."
      channel: Notice in the system
      subject: "Separation-of-duties rule <rule> to authorise"
      body: "The new rule of rule <rule>: <reason> | The deactivation of rule <rule>: <reason>"
      frequency: "Once per rule change."
      brd: "BRD NFR p.17 (11)"
      frum: "FRUM.012.01"
      code: ['"Separation-of-duties rule "', '" to authorise"']
    - id: NT-18
      name: Security setting to approve
      trigger: "The System Administrator changes a security setting on System Parameters."
      recipients: "Every holder of the security setting approval right (Information Security Officers)."
      channel: Notice in the system
      subject: "Security setting to approve: <description of the setting>"
      body: "<user name> requests a change from '<current value>' to '<new value>'"
      frequency: "Once per change."
      brd: "BRD NFR p.17 (11); p.14"
      frum: "FRUM.012.02"
      code: ['"Security setting to approve: "', '" requests a change from ''']
    - id: NT-19
      name: Second-factor reset to approve
      trigger: "A System Administrator asks for the reset of the authenticator app of a break-glass account."
      recipients: "Every holder of the reset approval right, except the requester."
      channel: Notice in the system
      subject: "Second factor reset to approve: <user name>"
      body: "<user name of the requester> asks for the reset. Reason: <reason>"
      frequency: "Once per reset request."
      brd: "BRD NFR p.17 (1)"
      frum: "FRUM.001.06"
      code: ['"Second factor reset to approve: "', '" asks for the reset. Reason: "']
    - id: NT-20
      name: Authenticator app reset
      trigger: "The reset of the authenticator app is approved and applied."
      recipients: "The holder of the break-glass account."
      channel: Notice in the system
      subject: "Your authenticator app was reset"
      body: "Enrol your authenticator app again at your next sign-in."
      frequency: "Once per reset."
      brd: "BRD NFR p.17 (1)"
      frum: "FRUM.001.06"
      code: ['"Your authenticator app was reset"']

# ----------------------------------------------------------------------- Annex U document prints and output formats
documents:
  intro: >-
    Every document User Access Maintenance prints, e-mails or exports: purpose, recipients, format, protection, the
    fields in order and an image of the current layout in the system. BDOI's samples in Annexes B and D remain the
    reference; where the layout must still be given or confirmed by the Business Unit, the item of the requirements
    collection workbook is named. User Access Maintenance prints no letter, slip or certificate.
  file_name_rule: >-
    File names: BDOI's FRUM.007.02 and FRUM.008 (export) set <Report_Name>_MMDDYYYY and Audit Logs_MMDDYYYY; the
    system names the download after the report and the date in another order today (Annex Q, C18).
  items:
    DO-01: {purpose: "Users with their group profiles and who created and changed them (BRD 3.003.1; sample A; Annex E)", recipients: "Business Administrator, System Administrator, Approver, Information Security, Auditor", rc: RC-DOC-01, bdoi: "Annex B (User Access Report) and Annex E"}
