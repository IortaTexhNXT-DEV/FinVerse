    - ["Where requests are raised", "Annex Q, C01", "The choice between UIDM-ISC and the system for user access requests", "Process Owner; BDOI IT; Information Security"]
    - ["Roles and group profiles", "FRUM.005, FRUM.006; Annex Q C02, C03, C22", "How roles are created, changed and implemented", "Process Owner; Information Security"]
    - ["Process flows", "Annex A", "Each flow matches the way the Business Unit works", "Process Owner"]
    - ["Status life-cycles", "Annex A", "The statuses and who moves a record from one to the next", "Process Owner"]
    - ["Workflow and approvals", "Annex S", "Maker, checker and approver of each change; the approval times", "Process Owner; Information Security"]
    - ["Second approval", "FRUM.010.05; Annex Z (UQ07)", "The high-privilege profiles and the working hours", "Information Security"]
    - ["Separation of duties", "FRUM.012; Annex M.6", "The pairs of profiles one user may not hold", "Information Security"]
    - ["Sign-in and sessions", "FRUM.001; Annex N", "Single sign-on, inactivity warning, time-out, session end, log-out", "Information Security; BDOI IT"]
    - ["Passwords and break-glass", "FRUM-004, FRUM.001.06; Annex M.4", "Password rules of the break-glass accounts and who holds them", "Information Security"]
    - ["User data", "FRUM.002; Annexes E and J", "User ID, Windows ID and the user fields", "Process Owner; BDOI IT"]
