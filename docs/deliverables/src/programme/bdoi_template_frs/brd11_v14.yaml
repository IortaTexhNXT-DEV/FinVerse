change_points:
  - "Second product owner review: the FRS revolves around three sources only - the BRD (with BRD-00 and the programme NFRs of the addenda), BDOI's FRS v1.1 and the iNXT BrokerVerse OOTB platform. Statements that described the BIBS system as configured for BDOI (delivered values, installation, test data and test tools, insurer roles hidden at installation, 'available in BIBS') are rewritten as requirement wording or removed (Annexes J, K, M.10, N, O, Q, U, W, AA)."
  - "Screenshots: every screen of Annex J, every walkthrough step of Annex O, the document layouts of Annex U and the sample of Annex AC are full-page screenshots (whole window with the page header and menu) of the DEV environment with realistic, fictitious data, one per figure, each scaled to fit on its own page with its caption (landscape for a wide screen)."
  - "Annex O: four business walkthroughs; WT-D is now the evidence of access for the Auditor and Information Security (matrix, profile content, membership, audit log of the group-profile changes, User Access Report)."
  - "BDOI's review comments (Annex Q.6): the correction, cancellation and viewing of user access requests, bulk requests and the approver's decision are done in UIDM-ISC ('c/o UIDM'): labelled [Integration scope - UIDM-ISC] (FRUM.009.07 to .09, FRUM.010.01 to .05, FRUM.011.01) and moved to Annex AA.5 (IS-UA-06 to IS-UA-09); their effort is removed from the BRD items to deliver (Annex AA.4: {deliver_days} man-days, 51.75 less). Annex N.3 explains the split."
  - "Annex AC (new): the User Access Report fields and a sample layout, at the request of BDOI's reviewer; Ruby's e-mail address and sample are asked from BDOI (Annex Q.6)."
  - "Colour code unchanged: {green} points offered by the OOTB platform (green), {orange} change requests ({days} man-days, orange), {integration} integration and data migration items (grey), {bp} best-practice recommendations (blue); Annex X.2 {nfr} programme-wide rows; end-to-end flow Figure {e2e}."
