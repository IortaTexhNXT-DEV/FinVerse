legend:
  intro: >-
    The requirements of this document are written in three colours, so that the reader sees at once what the BRD asks
    for, what the system offers beyond it at no cost, and what would need a change request. The colour is applied to
    the requirement or rule where it is stated (section 3 and the annexes); headings, tables of reference and BDOI's
    original wording keep their colours otherwise.
  rows:
    - ["Black", "In the BRD", "The point is a requirement of the User Access Maintenance BRD, or a programme-wide non-functional requirement of another BRD or addendum (Annex X.2).", "In scope."]
    - ["Green", "Not in the BRD - offered as standard (OOTB)", "The point is not asked by any BRD; the standard iNXT BrokerVerse system already offers it, usually behind a setting BDOI confirms (Annex M.10). Listed in Annex AA.3.", "No change request, no cost."]
    - ["Orange", "Not in the BRD - change request", "The point is asked by neither the BRD nor offered by the standard system; it is a candidate change request with its effort (Annex AA.2 and the CR Effort Estimate workbook).", "Delivered only when BDOI approves the change request."]

# ------------------------------------------------------------------------------------------------ change requests
# One row per orange point. effort: [analysis and design, backend, frontend, testing, documentation / UAT support]
# in man-days of 8 hours, estimated on the size of the work in the system today (+-20%).
crs:
  - id: CR-UA-007
    title: Supervisory and record-ownership access
    frs: "FRUM.001.02 (b), FRUM.005.01; Annex Q (C15)"
    brd: Not in BRD
    source: BDOI FRS v1.1
    why: >-
      BDOI's FRS asks that a user with a supervisory role sees and manages the records of the personnel assigned to
      him or her, with record-ownership rules per role. The system limits each user's data by company and branch
      (data scope) and by role; it has no supervisor-to-personnel link and no record-owner rule.
    ootb: "Partly: data scope by company and branch on every user; no supervisor hierarchy or record-owner rule."
    scope: >-
      Supervisor (reports-to) on the user record and in the access requests; data scope "own records", "own and
      assigned personnel" and "unit" per group profile; the rule applied to the lists, records, documents and reports
      of every module; audit of the scope changes; screens of the user and the group profile.
    effort: [3, 10, 3, 5, 2]
    complexity: High
    priority: Medium
    depends: "BDOI to name the supervisory roles and the record owner of each module (User Access Matrix, Annex C); module FRS of each BRD for the records concerned."
    assumptions: "The rule reuses the data scope of the system; the personnel of a supervisor come from the user record (or UIDM-ISC), not from a separate organisation chart."
  - id: CR-UA-011
    title: Approval times, reminders and escalation
    frs: "Annex S (time rules), Annex Q.5, Annex Z"
    brd: Not in BRD
    source: Best practice (iorta TechNXT)
    why: >-
      The BRD sets no service level for the approval of access requests. Today the age of each request shows on the
      Access Requests list and report; a reminder and an escalation after a number of working days keep requests
      from waiting unseen.
    ootb: "No: the age of each request is shown; no reminder or escalation run for access requests."
    scope: >-
      Settings for the working days per stage, the reminder day and the escalation role; a daily run that sends the
      reminder notice and escalates overdue requests to the Business Administrator; the overdue marker on the lists;
      audit of each reminder and escalation.
    effort: [1, 3, 1, 2, 1]
    complexity: Medium
    priority: Medium
    depends: "Working-day calendar with the public holidays (shared with the out-of-hours rule, Annex Z)."
    assumptions: "Reminders use the notices and e-mails of Annex T; one escalation level."
  - id: CR-UA-012
    title: Monthly access review report to Information Security
    frs: "Annex V, Annex Q.5 (UA-Q51)"
    brd: "Not in BRD (BRD p.11 lists report volumes only)"
    source: Best practice (iorta TechNXT)
    why: >-
      Information Security practice is a periodic review of who holds which access. The reports exist and run on
      demand; producing them each month for Information Security makes the review routine.
    ootb: "Partly: User Access Report and User Access Audit Log run on demand and export; no monthly schedule."
    scope: >-
      A monthly run on the first working day that produces the User Access Report and the audit log of the month,
      keeps the files for download and notifies Information Security (in the system and by e-mail, with no
      attachment); run history and failure notice as for the other runs.
    effort: [1, 2.5, 0.5, 1.5, 0.5]
    complexity: Low
    priority: Low
    depends: "UA-Q51 answered (reports, frequency and recipients)."
    assumptions: "No new report layout; the files follow the export names of FRUM.007.02."
  - id: CR-UA-014
    title: Temporary access with an end date
    frs: "Annex Z (CLR-UA-06, CLR-UA-13); FRUM.009.10"
    brd: "Not in BRD (BRD NFR 1.k asks for an effective date only)"
    source: Best practice (iorta TechNXT)
    why: >-
      Access given for a project or a leave cover should end by itself. The system applies changes on an effective
      date; it has no end date on access.
    ootb: "Partly: effective date and the daily run of scheduled changes; no end date."
    scope: >-
      End date on the user requests and the bulk template; validation (after the effective date); the end date on the
      user's group profiles and in the reports; the daily run removes the access on the end date with a notice a
      number of days before; audit of each removal.
    effort: [1.5, 4, 2.5, 2.5, 1]
    complexity: Medium
    priority: Low
    depends: "Answers to CLR-UA-06 and CLR-UA-13 (Annex Z): who is told and how many days before."
    assumptions: "The removal is a scheduled change of the existing daily run, checked again as the other scheduled changes."

