# Version 1.4 of the User Access Maintenance FRS in BDOI's template (product owner review of v1.3, 11-Oct-2026).
# Read by brd11_v14.py (the FRS builder) and build_brd11_workbooks.py (the CR Effort Estimate, the CR Register and the
# RTM). Business wording only.
#
# Colour code of the FRS (legend in "How to read this document"):
#   black  - the point is in the BRD (User Access Maintenance BRD, or a programme-wide NFR of another BRD / addendum);
#   green  - the point is in no BRD and the iNXT BrokerVerse OOTB platform offers it: feature "Available" (or "OOTB
#            extra") in column "OOTB platform" of the BIBS BDOI Feature List vs OOTB workbook; no cost;
#   orange - the point is in no BRD and the OOTB platform does not offer it (Not available, Partial, BDOI-specific or no
#            feature row): a change request (CR) with an effort - also when it was already built for BDOI in BIBS.
# OOTB is the iNXT BrokerVerse OOTB platform (repo IortaTexhNXT-DEV/BDOI-OOTB, branch brokerverse-platform), tested in its
# code with the Feature List as a cross-check; NOT the BIBS build of this project (which holds BDOI-specific work).
#   grey label - integration (EIAM / Entra ID SSO, UIDM-ISC, any external interface) or data migration (BRD-13) scope;
#   blue       - insurance-broking best practice in no BRD, FRS or OOTB: separate table (Annex AA.7), indicative effort.

