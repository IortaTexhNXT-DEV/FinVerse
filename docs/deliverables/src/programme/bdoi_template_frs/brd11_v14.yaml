# ------------------------------------------------ best practice (blue): in no BRD, not in the FRS, not in OOTB
# [ID, practice, why it matters for a broker, suggested priority, indicative man-days]
best_practice:
  - [BP-UA-01, "Monitoring of privileged sessions", "System Administrator and break-glass sessions logged in detail (screens opened, data exported) and reviewed by Information Security; expected by the IC and by the BDO group's IT risk rules for privileged access to client and policy data.", High, 8]
  - [BP-UA-02, "Alert on unusual sign-in", "Sign-in at an unusual hour, from a new device or network, or many failures across users raised to Information Security; early sign of account takeover of client personal data (Data Privacy Act, NPC breach rules).", Medium, 6]
  - [BP-UA-03, "Log of views of sensitive records", "Who viewed (not only changed) the records of PEP, high-risk and claims clients; supports AMLA confidentiality and Data Privacy Act accountability.", Medium, 6]
  - [BP-UA-04, "Joiner-mover-leaver timeliness report", "Time from the UIDM-ISC approval to access given or removed, and leavers still active; evidence for internal audit that leavers lose access the same day.", Medium, 4]
  - [BP-UA-05, "Separation-of-duties what-if check", "Before a request is submitted the requester sees which separation-of-duties rules the new access would break, so conflicts are fixed before approval.", Low, 4]
  - [BP-UA-06, "Generic and shared account register", "Every non-personal account (service, interface, training) with an owner, purpose and review date; a common audit finding in Philippine financial institutions.", Low, 3]

