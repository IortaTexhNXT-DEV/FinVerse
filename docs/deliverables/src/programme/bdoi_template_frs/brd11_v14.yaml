# Version 1.4 of the User Access Maintenance FRS in BDOI's template (product owner review of v1.3, 11-Oct-2026).
# Read by brd11_v14.py (the FRS builder) and build_brd11_workbooks.py (the CR Effort Estimate, the CR Register and the
# RTM). Business wording only.
#
# Colour code of the FRS (legend in "How to read this document"):
#   black  - the point is in the BRD (User Access Maintenance BRD, or a programme-wide NFR of another BRD / addendum);
#   green  - the point is not in the BRD and the standard system (iNXT BrokerVerse) already offers it (OOTB), no cost;
#   orange - the point is in no BRD and not offered by the standard system: a change request (CR) with an effort.

