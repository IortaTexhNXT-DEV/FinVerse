  references: >-
    References added in version 1.4: BIBS CR Effort Estimate BRD-11 v1.0 and Change Request Register BRD-11 v1.1 of
    11-Oct-2026; BIBS BDOI Feature List vs OOTB and Best Practice v1.0 (column "OOTB platform", the baseline of the
    colour code); the non-functional requirements of the Collections (CLXN), Claims (CLM) and ReInsurance addenda and
    of the Operations addendum, read for the programme-wide security rules (Annex X.2).
