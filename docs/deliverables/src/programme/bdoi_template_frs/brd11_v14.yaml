legend:
  intro: >-
    The requirements of this document are written in colours, so that the reader sees at once what the BRD asks for,
    what the iNXT BrokerVerse OOTB platform offers beyond it at no cost, and what would need a change request. OOTB
    (out of the box) means the iNXT BrokerVerse OOTB platform (brokerverse-platform), checked in its code and against
    the BIBS BDOI Feature List vs OOTB workbook (column "OOTB platform"): the standard platform, before any
    configuration or extension for BDOI. The colour is applied to the requirement or rule where it is stated
    (section 3 and the annexes); headings, tables of reference and BDOI's original wording keep their colours
    otherwise.
  # rows: colour_code.legend_rows (shared by the packs)

# ------------------------------------------------------------------------------------------------ change requests
# One row per orange point. effort: [analysis and design, backend, frontend, testing, documentation / UAT support]
# in man-days of 8 hours (+-20%), sized against the OOTB platform (for a Partial feature: the missing part only).
# fl: Feature List ID / OOTB status; built: already built for BDOI in the BIBS system of this repository.
crs:
  - id: CR-UA-003
    evidence: "Not found: no break-glass account or break-glass sign-in alert in the OOTB sign-in"
    verdict: NOT IN BRD
    quote: "No BRD line: the UAM BRD asks for \"Integration with Single Sign On (SSO) or LDAP\" (Other BU NFR 4) and \"Supports LDAP or Active Directory authentication\" (1.h); no fallback sign-in or break-glass account"
    title: Break-glass administrators
    frs: "FRUM.001.06; Annex N.4, Annex Q.5"
    brd: Not in BRD
    source: Best practice (iorta TechNXT)
    fl: "No feature row (related UAM-007 two-factor authentication: Available)"
    built: "Yes"
    why: >-
      BDOI's FRS signs every user in through EIAM; two named administrator accounts must still get in when EIAM is
      down, with each such sign-in alerted to Information Security. The OOTB platform has local accounts only and no
      break-glass accounts or alert.
    ootb: "Not offered: no feature row; the OOTB platform has local accounts with a second factor (UAM-007) but no break-glass accounts kept beside the Enterprise SSO and no sign-in alert."
    scope: >-
      Two named System Administrator accounts with a local password and second factor while every other user signs
      in through EIAM; the sign-in method recorded; a notice and e-mail to Information Security at each break-glass
      sign-in; the setting of the alert addresses.
    effort: [1, 2, 1, 1.5, 0.5]
    complexity: Medium
    priority: High
    depends: "Sign-in through EIAM (IS-UA-03, Integration scope)."
    assumptions: "Uses the second factor of the OOTB platform (UAM-007)."
  - id: CR-UA-007
    evidence: "Partial: own-records scope of scoped roles and the reporting line on the user; no branch or unit scope, no supervisor rule"
    verdict: NOT IN BRD
    quote: "No BRD line: the UAM BRD asks to \"Manage end-user application access and privileges via roles\" (1.b) and holds \"Business Unit Group\" and \"User Level\" on the user record (NFR 13); no record-ownership or supervisor data scope"
    title: Supervisory and record-ownership access
    frs: "FRUM.001.02 (b), FRUM.005.01; Annex Q (C15)"
    brd: Not in BRD
    source: BDOI FRS v1.1
    fl: "UAM-017 Data-scope restriction: Partial"
    built: "Partly (data scope by company and branch; no supervisor link)"
    why: >-
      BDOI's FRS asks that a user with a supervisory role sees and manages the records of the personnel assigned to
      him or her, with record-ownership rules per role. The OOTB platform limits scoped roles to their own records and
      clients (UAM-017 Partial); it has no scope by branch or unit, no supervisor-to-personnel link and no
      record-owner rule per role.
    ootb: "Partial (UAM-017): scoped roles see only their own records and clients. Missing, and estimated here: scope by company, branch and unit, the supervisor link and the record-owner rule per role."
    scope: >-
      Data scope by company, branch and unit on the user and the group profile; supervisor (reports-to) on the user
      record and in the access requests; data scope "own records", "own and assigned personnel" and "unit" per group
      profile; the rule applied to the lists, records, documents and reports of every module; audit of the scope
      changes; screens of the user and the group profile.
    effort: [3.5, 12, 4, 6, 2]
    complexity: High
    priority: Medium
    depends: "BDOI to name the supervisory roles and the record owner of each module (User Access Matrix, Annex C); module FRS of each BRD for the records concerned."
    assumptions: "Effort for the missing part only (the own-records scope of the OOTB platform is reused); the personnel of a supervisor come from the user record (or UIDM-ISC), not from a separate organisation chart."
  - id: CR-UA-011
    evidence: "Not found for access requests: escalation only in the AML and user screens; no access request flow"
    title: Approval times and reminders of access requests
    frs: "Annex S (time rules), Annex Q.5, Annex Z"
    brd: "Not in BRD (UAM BRD Other BU NFR 11 asks for a configurable, monitored workflow with escalation of risky changes, not for time limits or reminders)"
    source: Best practice (iorta TechNXT)
    fl: "WFL-007 Turnaround-time tracking and escalation: Partial (UAM-019 access requests: Not available)"
    built: "No"
    verdict: PARTLY
    quote: "UAM BRD Other BU NFR 11: \"With configurable workflow for user access requests and approvals - any changes on the access to user privileges are systematically monitored, evaluated and if necessary escalated for additional review. For example, modifications done outside working hours or from low privilege to high-privilege access, etc.\""
    why: >-
      Only the time-based part is beyond the BRD: a number of working days per approval stage, a reminder to the
      approver before the limit and the escalation of an overdue request to the Business Administrator. The monitoring
      of the pending requests (configurable workflow, systematically monitored) is the BRD (NFR 11) and is a BRD item
      to deliver for the requests that stay in the system (group-profile requests), the monitoring of the user access
      requests is done in UIDM-ISC (IS-UA-09, BDOI's review comments); the escalation of out-of-hours and low-to-high
      privilege changes is BRD-UA-12.
    ootb: "Partial (WFL-007): deadlines and escalation exist in other modules, not for access requests. Missing, and estimated here: the working days per stage, the reminder and the escalation of an overdue access request."
    scope: >-
      Settings for the working days per stage, the reminder day and the escalation role; a daily run that sends the
      reminder notice and escalates overdue requests to the Business Administrator; audit of each reminder and
      escalation.
    effort: [0.5, 2, 0.5, 1.5, 0.75]
    complexity: Medium
    priority: Medium
    depends: "BRD item BRD-UA-09 (group-profile requests); the user access requests in UIDM-ISC (IS-UA-06, IS-UA-08, IS-UA-09); working-day calendar of the OOTB platform (ADM-008)."
    assumptions: "Reminders use the notices and e-mails of Annex T; one escalation level."
  - id: CR-UA-014
    evidence: "Not found: no effective or end date on role assignment"
    title: End date captured on the granting request (temporary access)
    frs: "Annex Z (CLR-UA-06, CLR-UA-13); FRUM.009.10"
    brd: "Not in BRD (BRD NFR 1.k asks for an effective date of user and role changes; the removal of access on a date is that BRD item)"
    source: Best practice (iorta TechNXT)
    fl: "UAM-024 Effective-dated access changes: Not available"
    built: "No"
    verdict: PARTLY
    quote: "UAM BRD NFR System Operation 1.k: \"Ability to specify effective date for user and role changes\""
    why: >-
      Only the end date entered with the grant is beyond the BRD: one request that gives access until an end date,
      with a notice some days before and the end date shown on the user's group profiles and in the reports. A
      removal of access requested with an effective date is a role change with an effective date (BRD NFR 1.k) and is
      a BRD item to deliver (BRD-UA-22, on the daily run of BRD-UA-11).
    ootb: "Not offered: UAM-024 Not available (no effective or end date). The effective date and the scheduled removal are in scope (BRD-UA-11, BRD-UA-22); this CR is the end date on the grant only."
    scope: >-
      End date on the user requests and the bulk template; validation (after the effective date); the end date on the
      user's group profiles and in the reports; the notice a number of days before the end date.
    effort: [1, 2.5, 2, 1.5, 0.75]
    complexity: Medium
    priority: Low
    depends: "BRD items BRD-UA-11 and BRD-UA-22 (effective dates, scheduled removal); answers to CLR-UA-06 and CLR-UA-13 (Annex Z)."
    assumptions: "The removal itself runs on the daily run of BRD-UA-11 (BRD-UA-22)."
  - id: CR-UA-016
    evidence: "Not found: roles edited directly, no emergency path"
    verdict: NOT IN BRD
    quote: "No BRD line: the UAM BRD gives the System Administrator \"Group Administration\" (NFR 15.c) and routes group profile changes through approvers (BRD 3.002.1 to 3.002.4); no emergency direct-edit path"
    title: Emergency role edit
    frs: "FRUM.005.01; Annex J"
    brd: Not in BRD
    source: Best practice (iorta TechNXT)
    fl: "No feature row (UAM-022 group profile requests: Not available)"
    built: "Yes"
    why: >-
      With group profiles changed only by approved requests, an emergency path lets the System Administrator edit
      users and group profiles directly, when Information Security opens it, with every edit audited and alerted.
      The OOTB platform has no request flow and no emergency edit; the feature list has no row for it.
    ootb: "Not offered: no feature row; in the OOTB platform roles are edited directly with no request, so no controlled emergency path exists."
    scope: >-
      The emergency role edit setting, opened by Information Security; the direct edit of users and group profiles by
      the System Administrator while it is open, closed by default; every edit audited and alerted to Information
      Security; the marker on the screens.
    effort: [1, 2.5, 1, 1.5, 0.5]
    complexity: Medium
    priority: Medium
    depends: "BRD items BRD-UA-09 and BRD-UA-13 (group profile requests, second approval of security settings)."
    assumptions: "Alerts use the notices and e-mails of Annex T."

