# ------------------------------------------------------------------------------------------------ walkthroughs
# Business walkthroughs (Annex O). Steps: [persona, screen, what the user does, what the user sees, result, screenshot].
# Persona names are business roles; the people named are fictitious.
walk_intro: >-
  End-to-end business walkthroughs of User Access Maintenance, step by step: who acts, on which screen, what the
  user does, what the user sees and the result; each step is illustrated by a full-page screenshot (Figures O.n). The
  routes are those of the end-to-end flow (Figure @E2E@, Annex N.0); the screens are specified in Annex J. The people
  and records named are fictitious.
walk_uidm: >-
  BDOI's review comments on the Business Requirements Mapping (Annex Q.6) place the raising, correction,
  cancellation and viewing of user access requests, the bulk requests and the approver's decision (approve, reject,
  return) in UIDM-ISC ("c/o UIDM"). The steps labelled [Integration scope – UIDM-ISC] show the flow as the BRD
  describes it; with the request lifecycle in UIDM-ISC the same decision is taken there and the system receives the
  approved change through the provisioning interface (Annex N.3), records it with the UIDM request number and applies
  it; the rest of each walkthrough is unchanged.
walkthroughs:
  - id: WT-A
    title: A new user from the enrolment request to the first sign-in with the menus of the persona
    summary: >-
      Marketing hires an account officer. The Requestor raises an enrolment request with the user's data, the group
      profile Marketing Account Officer and the chosen approver, saves it as a draft and submits it. The Approver finds
      it in Assigned to Me and approves it; the user is created and the temporary password is shown once. The new
      user signs in, must choose a personal password first, and then sees exactly the menu of the Marketing Account
      Officer. The Auditor finds the enrolment, the approval and the first sign-in in the User Access Audit Log.
    data: "Example: new user a013000196, Isabel Navarro, Windows ID INAVARRO, home branch Head Office, group profile Marketing Account Officer; Requestor Rhea Santiago, Approver Ulysses Abad, Auditor Audrey Lim."
    uidm_steps: [1, 2, 3, 4]
    steps:
      - [Requestor, SCR-UA-07, "Opens User Access › Access Requests › New Request, keeps Enrol new user, enters the user ID, full name, e-mail, Windows ID and home branch, ticks Marketing Account Officer, chooses the approver Ulysses Abad, writes the justification and clicks Save Draft", "The request is saved as a draft with its number; the approver is notified only on submission", Draft request, wt-a-01]
      - [Requestor, SCR-UA-08, "Clicks Edit Request, checks the data and clicks Submit", "The request is submitted: the status is Pending Approval and the History tab lists Saved and Submitted", Pending Approval, wt-a-02]
      - [Approver, SCR-UA-06, "Opens the notice of the request to approve, or User Access › Access Requests", "The request is on the Assigned to Me tab with its change: Create user a013000196 with the group profile Marketing Account Officer", Request found, wt-a-03]
      - [Approver, SCR-UA-08, "Opens the request, reads the Details tab (current and requested values), clicks Approve and Apply, adds a comment and confirms", "The user is created; the temporary password is shown once, to be given through a secure channel; the status is Approved", Approved and applied, wt-a-04]
      - [New user (Marketing Account Officer), SCR-UA-01, "Opens the system and signs in with the user ID and the temporary password", "Change Your Password: Your password was set by an administrator. Choose your own password to continue.", Forced change, wt-a-05]
      - [New user (Marketing Account Officer), SCR-UA-03, "Enters the temporary password as the current password and a personal password twice, and clicks Change Password", "Password changed; the home page opens", Signed in, wt-a-06]
      - [New user (Marketing Account Officer), SCR-UA-05, "Opens the menu and My Profile", "The menu holds exactly the entries of the Marketing Account Officer; My Profile lists the group profile Marketing Account Officer, its permissions and the first session", Menus of the persona, wt-a-07]
      - [Auditor, SCR-UA-17, "Opens User Access Reports › User Access Audit Log for today, ticks Include Log-ins and Log-outs and clicks Run Report", "Enrol New User with the from and to values of the full name, e-mail and profiles, Done By and Approved By, the request number, and the first sign-in of the new user", Evidence of the enrolment, wt-a-08]
    downstream:
      - "Every module opens its screens to the new user according to the Marketing Account Officer profile (clients, quotation and proposal, accounts and placement, renewal and the reports of that profile); nothing else is shown or accepted."
      - "The user appears in the User Access Report and in the Group Profile Membership of Marketing Account Officer, with the approver and the request number."
      - "The change is logged once: the access change log cannot be edited by any user."
  - id: WT-B
    title: A change and a revocation under four eyes, and a group-profile change approved in order and implemented
    summary: >-
      The new account officer also covers as team leader: the Requestor asks to add the profile, the Approver
      approves it and the user is told. A privileged change (a back-up System Administrator) is flagged and needs the
      Second Approver. The Business Administrator asks for a new group profile; two approvers approve it in order and
      the System Administrator implements it. When the officer resigns, the Requestor deactivates the user; the
      Approver approves and the user's sessions end at once.
    data: "Example: the user enrolled in walkthrough A; a request giving Ramon Aguilar a System Administrator profile, waiting for the second approval; a new group profile Renewal enquiry with two permissions; approvers Ulysses Abad and Andres Bautista."
    uidm_steps: [1, 2, 3, 8, 9]
    steps:
      - [Requestor, SCR-UA-07, "Opens a New Request of type Modify user for the new officer, ticks Marketing Team Leader / Head besides the current profile, chooses the approver, writes the justification and clicks Submit", "The group profiles show the current one and the one added; the request is submitted", Pending Approval, wt-b-01]
      - [Approver, SCR-UA-08, "Opens the request: the Details tab shows the group profile added; clicks Approve and Apply", "The status is Approved; the user is told Your access changed in the system and by e-mail", Change applied, wt-b-02]
      - [Second Approver, SCR-UA-08, "Opens the privileged change from the Second Approval tab: tagged Privilege increase and first approved by the Approver; clicks Second Approval and confirms", "The status is Approved; the alert Privileged access change is kept as evidence", Second approval given, wt-b-03]
      - [Business Administrator, SCR-UA-12, "Opens Group Profile Requests › New Group Profile Request, enters the name Renewal enquiry and its description, keeps the level Standard, ticks two permissions, adds the approvers Ulysses Abad then Andres Bautista, writes the justification and clicks Submit", "The request is submitted; the Approvers tab lists the two approvers in order", Pending Approval (first approver), wt-b-04]
      - [Approver, SCR-UA-08, "Approves the group-profile request", "The status stays Pending Approval; the request moves to the second approver, who receives the notice", Next approver, wt-b-05]
      - [Second approver of the group profile, SCR-UA-08, "Opens the request from My Approvals and approves it", "The status is For Implementation; the System Administrators receive the notice to implement it", For implementation, wt-b-06]
      - [System Administrator, SCR-UA-16, "Opens Roles & Permissions, finds the request under Approved Requests to Implement, clicks Implement Request and confirms", "The request is implemented; the profile appears in the matrix with its two permissions", Implemented, wt-b-07]
      - [Requestor, SCR-UA-07, "Opens a New Request of type Deactivate user for the officer, chooses the reason Resigned, leaves the effective date blank, chooses the approver and clicks Submit", "The request is submitted", Pending Approval, wt-b-08]
      - [Approver, SCR-UA-08, "Approves the deactivation", "The status is Approved; the user is Disabled and every open session of the user has ended", User deactivated, wt-b-09]
      - [System Administrator, SCR-UA-15, "Opens Administration › Users with the status Disabled", "The officer is listed Disabled with the profiles held; the sessions show the last session ended", Evidence of the revocation, wt-b-10]
    downstream:
      - "Each change is in the User Access Audit Log with its from and to values, the approver and the request number; the deactivated user keeps the history but can no longer sign in."
      - "The new group profile can be given to users at once; its content is in the User Group Profile Report and the User Access Matrix."
  - id: WT-C
    title: Refused cases and the messages the user sees
    summary: >-
      The same processes when something is wrong or not allowed: an incomplete or badly formatted enrolment, a second
      request for a user who already has one open, a change of one's own profiles, two profiles that one user may not
      hold together, a decision by someone other than the chosen approver, an implementation by the requester, a
      locked account, a deactivated user signing in, and a password that breaks the rules. Each step shows the message
      and what the user does next.
    data: "Example: a request waiting for the Approver Ulysses Abad; user a013000101 Maria Santos (active) and the officer deactivated in walkthrough B; a group-profile request raised by the System Administrator and approved for implementation."
    uidm_steps: [1, 2, 3, 4, 5, 6]
    steps:
      - [Requestor, SCR-UA-07, "Opens New Request, enters the user ID ab and clicks Submit without a full name, profile, approver or justification", "Under the fields: Use 3 to 50 letters, digits, dots, dashes or underscores; Enter the full name of the new user; Select at least one role; Select the approver; Enter the justification. Nothing is saved", Form corrected, wt-c-01]
      - [Requestor, SCR-UA-07, "Enters the user ID a01300019X with the other fields complete and clicks Submit", "Under the user ID: The user ID must be a letter followed by nine digits, for example a013000196", User ID corrected, wt-c-02]
      - [Requestor, SCR-UA-07, "Raises a Modify user request for a user who already has a pending request, and clicks Submit", "A request for the user is already waiting for approval, with its reference", Wait for the open request, wt-c-03]
      - [Requestor, SCR-UA-07, "Raises a Modify user request for his or her own user, ticks an additional profile and clicks Submit", "You cannot change your own roles", Another requester raises it, wt-c-04]
      - [Requestor, SCR-UA-07, "Enrols a new user with both the User Access Requestor and the User Access Approver profiles and clicks Submit", "One user may not hold both User Access Requestor and User Access Approver (separation-of-duties rule): the rule authorised by Information Security", One of the two profiles removed, wt-c-12]
      - [Another approver, SCR-UA-08, "Opens a request assigned to Ulysses Abad", "The request shows no decision button for this approver; a decision would be refused: the request is assigned to another approver", Left to the chosen approver, wt-c-05]
      - [System Administrator, SCR-UA-16, "Clicks Implement Request on a group-profile request he or she raised", "A request is implemented by someone other than its requester", Another System Administrator implements it, wt-c-06]
      - [Business user, SCR-UA-01, "Maria Santos enters a wrong password three times, then the right one", "Invalid user name or password each time, also for the right password: a locked account is refused with the same message as a wrong password; Users shows the lock to the System Administrator", Account locked, wt-c-07]
      - [System Administrator, SCR-UA-15, "Opens Users with the status Locked and clicks Unlock on Maria Santos", "The user is Active again; the unlock is in the access change log", Account unlocked, wt-c-08]
      - [Business user, SCR-UA-01, "The deactivated officer tries to sign in", "Invalid user name or password, the same message as a wrong password; the attempt does not count towards the lock-out", Refused, wt-c-09]
      - [Requestor, SCR-UA-05, "On My Profile, types a new password that is too short and has no symbol", "Still needed: At least 10 characters; A symbol; Change Password stays disabled", Password rules shown, wt-c-10]
      - [Requestor, SCR-UA-05, "Enters the current password as the new password and clicks Change Password", "You used this password recently. Choose another one", Another password chosen, wt-c-11]
    downstream:
      - "A refused action changes nothing; the message names what to correct, and a refusal by the server shows its reference for support."
      - "Every failed sign-in, lock and unlock is in the audit trail and the User Access Audit Log."
      - "A combination of profiles refused by a separation-of-duties rule is refused the same way on a bulk line and again at approval."
  - id: WT-D
    title: The evidence of access for the Auditor and Information Security
    summary: >-
      The Auditor and Information Security review who can do what and what changed: the User Access Matrix, the User
      Group Profile Report, the Group Profile Membership of a profile, the audit log of the group-profile changes and
      the User Access Report as of a date (BRD 3.003 and 4.003; Annexes B to H).
    data: "Example: the group profiles and users of walkthroughs A and B; the group profile Renewal enquiry implemented in walkthrough B."
    uidm_steps: []
    steps:
      - [Auditor, SCR-UA-13, "Opens User Access › User Access Matrix, By Action, and searches USER ACCESS", "The User Access area by action class, with the permissions each profile holds: the Requestor creates and amends, the Approver approves, the Second Approver gives the second approval", Matrix reviewed, wt-d-01]
      - [Auditor, SCR-UA-17, "Runs the User Group Profile Report for the profile User Access Approver", "The modules and tasks of the profile with With Access, and the dates and actors of its creation and last change", Profile content reviewed, wt-d-02]
      - [Auditor, SCR-UA-17, "Runs Group Profile Membership for Marketing Account Officer as of today", "The members of the Marketing Account Officer profile with who added each and when", Members reviewed, wt-d-03]
      - [Auditor, SCR-UA-17, "Runs the User Access Audit Log for today with the activity Group Profile Changes", "The creation of the group profile Renewal enquiry with its permissions, the request number, Done By and Approved By, with the from and to values", Group-profile changes reviewed, wt-d-04]
      - [Auditor, SCR-UA-17, "Runs the User Access Report as of today for every status", "Every user with the group profiles held, the status, who created and last changed the access and when, under the report header", Access as of a date reviewed, wt-d-05]
    downstream:
      - "Information Security signs the role matrix (Annex C) and the separation-of-duties rules on the basis of these reports; later changes to the matrix are group-profile requests and show in the same reports."

