# Version 1.4 (rebuilt after the product owner's second review of 11-Oct-2026) of the User Access Maintenance FRS in
# BDOI's template: the FRS revolves around three sources only - the BRD (with BRD-00 and the programme NFRs of the
# addenda), BDOI's own FRS (v1.1) and the iNXT BrokerVerse OOTB platform. It does not describe the BIBS build of this
# project; BIBS gives the full-page screenshots only, so that the reader can picture the functions and the flows.
# Read by brd11_v14.py (bdoi_view, figures) and build_brd11_bdoi_frs.py (Annexes J, O, Q.6 and AC).

# ------------------------------------------------------------------------------------------------ screenshots
# Full-page screenshots (whole window: header, menu and page) taken at device scale 2 and a window 1440 pixels wide on
# the DEV environment (BROKERVERSE_ENVIRONMENT=dev) with realistic, fictitious data, by
#   FULL_PAGE=1 OUT_DIR=<this folder>/figures/brd11_screens node tools/screenshots/capture_pack.cjs brd11 <regex>
# (tools/screenshots/packs/brd11.cjs, brd11_walkthrough.cjs and brd11_realistic.sql). One screenshot per figure.
screens_dir: figures/brd11_screens
screen_note: >-
  Each screen is shown by one full-page screenshot (the whole window with the page header and the menu of the
  persona), taken on the DEV environment with realistic, fictitious data, so that the reader can picture the screen
  and its place in the flow. The screenshot illustrates the requirement; the text of this FRS is the requirement.
  Mandatory: Y = mandatory, N = optional, Cond. = mandatory when the condition stated applies.
# SCR id -> [screenshot, caption]
screens:
  SCR-UA-01: [scr-ua-01-01-empty, "Login page with the environment name and the notice on authorised use"]
  SCR-UA-02: [scr-ua-02-01-request, "Forgot Password with the user ID entered"]
  SCR-UA-03: [wt-a-05, "Change Your Password after a password set by an administrator"]
  SCR-UA-04: [scr-ua-04-01-idle, "Your session is about to expire: inactivity warning with Stay Logged In and Log Out"]
  SCR-UA-21: [scr-ua-21-01-page, "Session Timed Out with the Log In button"]
  SCR-UA-05: [scr-ua-05-01-view, "My Profile of the Requestor"]
  SCR-UA-06: [scr-ua-06-01-list, "Access Requests of the Approver, Assigned to Me tab"]
  SCR-UA-07: [scr-ua-07-02-filled, "New Request with the new user's data, group profile and approver"]
  SCR-UA-08: [scr-ua-08-01-pending, "An access request waiting for the Approver, Details tab"]
  SCR-UA-09: [scr-ua-09-01-list, "Bulk Request with the upload steps and the batches"]
  SCR-UA-10: [scr-ua-10-01-pending, "A bulk request of three new account officers waiting for the Approver"]
  SCR-UA-11: [scr-ua-11-01-list, "Group Profile Requests of the Business Administrator, All tab"]
  SCR-UA-12: [scr-ua-12-01-new_profile, "New group profile with its permissions and two approvers in order"]
  SCR-UA-13: [scr-ua-13-01-permission, "User Access Matrix by permission"]
