# ------------------------------------------------------------------------------------------------ BDOI's comments
# The comments of BDOI's reviewers carried in word/comments.xml of BDOI's FRS (kept as they are in this document),
# with our response (Annex Q.6). anchor: the BRD row of the Business Requirements Mapping.
bdoi_comments:
  - id: 23
    author: "Ma. Carmela A. Morfe"
    text: "UIDM na to..."
    anchor: "BRD 1.006.1 – Apply correction on returned requests"
    frum: "FRUM.009.07"
    response: >-
      Agreed: the correction of a returned request is done in UIDM-ISC ("c/o UIDM"). FRUM.009.07 is labelled
      [Integration scope – UIDM-ISC] and listed in Annex AA.5 (IS-UA-06); the system receives the corrected and
      approved change through the provisioning interface (Annex N.3). Its delivery effort is removed from the BRD
      items to deliver.
  - id: 24
    author: "Ma. Carmela A. Morfe"
    text: "UIDM"
    anchor: "BRD 1.007.1 – Cancel a submitted request"
    frum: "FRUM.009.08"
    response: >-
      Agreed: a submitted request is cancelled in UIDM-ISC. FRUM.009.08 is labelled [Integration scope – UIDM-ISC]
      (Annex AA.5, IS-UA-06); nothing reaches the system for a cancelled request.
  - id: 25
    author: "Ma. Carmela A. Morfe"
    text: "UIDM"
    anchor: "BRD 1.008.1 – View the submitted requests"
    frum: "FRUM.009.09"
    response: >-
      Agreed: the requester follows the submitted requests in UIDM-ISC. FRUM.009.09 is labelled [Integration scope –
      UIDM-ISC] (Annex AA.5, IS-UA-06); the system keeps the UIDM request number on every change it applies, so the
      reports of FRUM.007 and FRUM.008 still show it.
  - id: 26
    author: "Ma. Carmela A. Morfe"
    text: "UIDM"
    anchor: "BRD 1.009.1 – Bulk request"
    frum: "FRUM.011.01"
    response: >-
      Agreed: bulk requests are raised and approved in UIDM-ISC. FRUM.011.01 is labelled [Integration scope –
      UIDM-ISC] (Annex AA.5, IS-UA-07); the loading of the users at go-live stays data migration (DM-UA-01).
  - id: 27
    author: "Ma. Carmela A. Morfe"
    text: "UIDM"
    anchor: "BRD 2.002.1 – Review and approve requests (receive, list, approve, reject, return)"
    frum: "FRUM.010.01 to FRUM.010.05"
    response: >-
      Agreed: the approver reviews, approves, rejects and returns the user access requests in UIDM-ISC, with the
      notices of each step. FRUM.010.01 to FRUM.010.05 are labelled [Integration scope – UIDM-ISC] (Annex AA.5,
      IS-UA-08 and IS-UA-09). The group-profile requests of BRD 3.002 (FRUM.005, FRUM.006, FRUM.011 group profiles)
      have no such comment and stay in the system; if BDOI keeps the assignment of group profiles as requests in the
      system (option (a) of Annex N.3), the approval of those requests also stays in the system (Q-01).
  - id: 28
    author: "Ma. Carmela A. Morfe (for John V. Barbachano)"
    text: "@John V. Barbachano please use the email of Ruby. Please add as appendix"
    anchor: "BRD 3.003.1.1 – User Access Report fields"
    frum: "FRUM.007.01, FRUM.007.02"
    response: >-
      Added: Annex AC gives the User Access Report fields of BRD 3.003.1 and Annex E with a sample layout. The sample
      sent in Ruby's e-mail will replace it once received: Ruby's e-mail address and the sample are an open question
      to BDOI (Q.6, last row); the address is not assumed.
ruby_question:
  topic: "User Access Report sample from Ruby's e-mail"
  bdoi: "Comment on BRD 3.003.1.1: \"please use the email of Ruby. Please add as appendix\" (John V. Barbachano)."
  brd: "BRD 3.003.1: User Access Report - user name, group profile, date created, date modified, created by, added / modified / deactivated / reactivated by."
  proposal: >-
    BDOI to give Ruby's e-mail address (and Ruby's full name and unit) and to forward the e-mail with the User Access
    Report sample; Annex AC is then updated to the sample. Until then Annex AC shows the layout of BRD 3.003.1 and
    Annex E.
  impact: "Layout of the User Access Report (FRUM.007.01, FRUM.007.02; Annex AC)."
  decide_by: "John V. Barbachano (BDO ITG); Process Owner (Business Administration)"
  status: "Open - BDOI to provide"

# ------------------------------------------------------------------------------------------------ Annex AC
user_access_report:
  intro: >-
    The User Access Report of BRD 3.003.1, added as an appendix at the request of BDOI's reviewer (comment on BRD
    3.003.1.1, Annex Q.6). The fields are those of the BRD and of Annex E of this FRS; the layout below is a sample
    for review, generated as of a date for every status. BDOI's own sample (Ruby's e-mail) is awaited and will
    replace it (open question in Annex Q.6).
  header: ["No.", "Column of the report", "BRD 3.003.1", "Annex E", "Source and rule"]
