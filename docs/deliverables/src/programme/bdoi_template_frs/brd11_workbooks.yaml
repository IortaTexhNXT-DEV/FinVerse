  FRUM.002.02: ["Yes", "Joiner events of UIDM-ISC create the user with the UIDM request number, directory details and last synchronisation; refused events alerted and reprocessed on the Identity Synchronisation screen (Enterprise SSO simulated in SIT and UAT; connection details from BDOI IT at SIT) (TC-FRUM.002.02 cases)."]
  FRUM.003.01: ["Yes", "User details updated from the Enterprise SSO directory on each event and with Synchronise Now on the Users screen (Enterprise SSO simulated in SIT and UAT; connection details from BDOI IT at SIT) (TC-FRUM.003.01 cases)."]
  FRUM.003.02: ["Yes", "Deactivation and reactivation of users from the Enterprise SSO status and by approved request (TC-FRUM.003.02 cases)."]
