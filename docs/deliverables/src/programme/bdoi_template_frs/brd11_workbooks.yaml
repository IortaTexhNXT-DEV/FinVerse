  FRUM.001.06: ["Yes", "Break-glass sign-in with password and second factor; Information Security alerted at each break-glass sign-in (setting of the recipients) (TC-FRUM.001.06 cases)."]
  FRUM.013.01: ["Yes", "Notices in the system and, by each user's preference, by e-mail (setting) (TC-FRUM.013.01 cases)."]
