# ------------------------------------------------------------------------------------ requirements collection
uat_criteria:
  entry:
    - "The FRS v1.3 is signed, or the open decisions of Annex Q that affect the cases are recorded."
    - "The UAT environment is ready with the users of the walkthrough users workbook and the SIT/UAT data."
    - "The SIT exit report shows no open severity 1 or 2 finding on User Access Maintenance."
    - "The testers are named (TD-11) and have their sign-in IDs; the passwords are issued separately by the iorta TechNXT Project Team."
    - "The test cases of this workbook are approved by the Process Owner (SO-11-2)."
  exit:
    - "Every test case of priority High is run and passed, or its observation is accepted by the Process Owner."
    - "Every BRD ID has at least one passed test case (sheet Traceability)."
    - "No open severity 1 or 2 observation; severity 3 observations have an agreed date."
    - "The walkthrough of the Business Unit is completed and recorded (walkthrough users workbook)."
    - "The UAT sign-off certificate is signed (SO-11-3)."
