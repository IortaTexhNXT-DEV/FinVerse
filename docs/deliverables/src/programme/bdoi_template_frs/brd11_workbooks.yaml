# Data of the five review workbooks of BRD-11 User Access Maintenance and of the internal coverage workbook, read by
# build_brd11_workbooks.py together with the FRS v1.3 (built in memory, so that every number agrees with it),
# brd11_review.yaml, the BIBS FRS BRD-11, its test plan and the programme workbooks. Business wording only.

meta:
  version: "1.0"
  date: 9 October 2026
  folder: Programme/BDOI_Template_FRS/BRD-11_User_Access_Maintenance
  quality: Programme/Quality
  frs: "FRS User Access Maintenance in BDOI's template v1.3"
  environment: "BIBS UAT environment (address issued with the passwords)"
  password_text: "Issued separately by the iorta TechNXT Project Team"
  dates:
    decision: 2026-12-01      # sign-off of the BRD-11 FRS (drop plan)
    sit: 2027-04-09           # master data for trial migration 1 and the SIT reviewers
    uat: 2027-07-16           # values for UAT
    prod: 2027-11-01          # production values before the dress rehearsal

# Persona of each FR entry for the acceptance test cases: role code of the test plan, screen
entry_persona:
  FRUM.001: [UAM_REQUESTOR, "Login page; any screen"]
  FRUM.002: [SYSADMIN, "Administration › Users"]
  FRUM.003: [SYSADMIN, "Administration › Users; Access Requests"]
  FRUM-004: [SYSADMIN, "Login page; My Profile"]
  FRUM.005: [BUSINESS_ADMIN, "User Access › Group Profile Requests; Roles & Permissions"]
  FRUM.006: [BUSINESS_ADMIN, "User Access › Group Profile Requests"]
  FRUM.007: [AUDITOR, "User Access › User Access Reports"]
  FRUM-008: [AUDITOR, "User Access Reports › User Access Audit Log; Audit Trail"]
  FRUM.008: [AUDITOR, "User Access Reports › User Access Audit Log; Audit Trail"]
  FRUM.009: [UAM_REQUESTOR, "User Access › Access Requests › New Request"]
  FRUM.010: [UAM_APPROVER, "User Access › Access Requests (Assigned to Me)"]
  FRUM.011: [UAM_REQUESTOR, "User Access › Bulk Request"]
  FRUM.012: [INFOSEC_OFFICER, "User Access › Separation of Duties; System Parameters"]
  FRUM.013: [UAM_REQUESTOR, "Notifications (bell); test mailbox"]

# ------------------------------------------------------------------------------------------------ fit-gap
fit_values: [Fit, Configure, Extend, Recommend change]
fitgap_groups:
  # key: the BRD function (first IDs of the BRD line); features: rows of the BIBS Feature List vs OOTB workbook
  - keys: ["1.001", "2.001", "3.001", "4.001"]
    name: Log in, inactivity warning and session end
    features: [UAM-001, UAM-003, UAM-006, UAM-007, UAM-033]
    fit: Configure
    ootb: "Sign-in with named users, lock-out, idle sign-out and several tabs in one session are standard; single sign-on (OpenID Connect or SAML 2.0) is switched on by configuration for EIAM; the inactivity and session-end times are settings."
    best: "Corporate users sign in once through the enterprise identity provider with a second factor and device rules; idle sessions are warned and closed; only named break-glass accounts keep a local password (ISO 27001 access control; BSP Circular 808 cited by the BRD)."
    rec: "Register BIBS in EIAM per environment and keep two named break-glass accounts (Annex Z)."
    impact: "BDOI IT registration; no change to the screens."
  - keys: ["1.002", "1.003", "1.004", "1.005"]
    name: User access requests (enrol, modify, deactivate, reactivate)
    features: [UAM-019, UAM-020, UAM-012]
    fit: Extend
    ootb: "The base product creates and changes users directly by an administrator; the request with a chosen approver, draft, edit, cancel and submit is an extension of BIBS, available in the BIBS environment."
    best: "Every access change requested with a justification and decided by another person (four eyes); least privilege; joiners, movers and leavers driven from the identity governance tool where the bank has one."
    rec: "Decide C01: accounts from UIDM-ISC and role changes as requests in the system (option a) keeps four eyes on every role change."
    impact: "Scope of FRUM.009; UIDM-ISC interface (Annex N)."
  - keys: ["1.006", "1.007", "1.008"]
    name: Correction, cancellation and view of requests; notices
    features: [UAM-019, UAM-027]
    fit: Extend
    ootb: "Extension of BIBS: returned requests corrected and re-submitted, cancellation with a reason, own requests with status and history, notices in the system."
    best: "The requester sees the status and the decision of each request; every return and cancellation is reasoned and kept."
    rec: "Confirm whether the notices are also e-mailed (Annex Z)."
    impact: "Annex T."
  - keys: ["1.009"]
    name: Bulk request
    features: [UAM-023]
    fit: Extend
    ootb: "Extension of BIBS: upload of a template file checked row by row, draft batch decided by an approver as a whole."
    best: "Bulk loads for mass joiners or reorganisations, with the same controls as single requests and a report of the rows refused."
    rec: "BDOI's mapping reads \"c/o UIDM\" (Annex Q, C24); keep the bulk request for the go-live load of users (Annex Y)."
    impact: "FRUM.011; go-live load."
  - keys: ["2.002"]
    name: Review and approve requests
    features: [UAM-021, UAM-025]
    fit: Extend
    ootb: "Extension of BIBS: requests assigned to the approver, approve, reject or return with remarks, automatic application on approval, second approval of privileged or out-of-hours changes."
    best: "The approver sees current and requested access side by side; privileged changes get a second approval; decisions within an agreed time with reminders."
    rec: "Agree the approval times and the escalation (Annex S, proposal)."
    impact: "FRUM.010; Annex S."
  - keys: ["3.002"]
    name: Group-profile requests
    features: [UAM-022, UAM-015]
    fit: Extend
    ootb: "Extension of BIBS: group-profile requests approved by approvers in order and implemented by the System Administrator, with the privilege level of the profile."
    best: "Role engineering owned by the business, approved by the role owner and Information Security, and applied by a different person than the requester."
    rec: "Decide C03 (requests and implementation, or direct change by authorised users as in BDOI's FRS)."
    impact: "FRUM.005, FRUM.006."
  - keys: ["3.003"]
    name: Reports
    features: [UAM-029, UAM-030]
    fit: Configure
    ootb: "Report runner with the header of the BRD (report name, generated by, coverage, time generated) and export to PDF, Excel and CSV; the four reports of the BRD samples are set up as report definitions."
    best: "Periodic access review: the users and their profiles certified by the unit heads every quarter; the audit log reviewed by Information Security."
    rec: "Confirm the layouts against Annexes B, E to G (requirements collection workbook) and consider the monthly access review report (Annex Q.5)."
    impact: "FRUM.007; Annex V."
  - keys: ["4.002.1"]
    name: Define user profiles (roles)
    features: [UAM-014, UAM-016]
    fit: Configure
    ootb: "Roles with several roles per user and menus by persona are standard; the profiles of the access personas are set up as configuration."
    best: "A role catalogue per job function, approved by the business and Information Security, with privileged roles marked."
    rec: "Complete BDOI's User Access Matrix (Annex C) into the role-to-permission template UA-02."
    impact: "Annex C; Annex Y."
  - keys: ["4.002.2"]
    name: Assign functions to profiles
    features: [UAM-015]
    fit: Configure
    ootb: "Every access function has its own permission; permissions are given to profiles by configuration (group-profile requests)."
    best: "Fine-grained permissions per function and action (view, create, amend, approve)."
    rec: "Confirm the matrix of Annex M.3 with the final User Access Matrix."
    impact: "FRUM.005.06."
  - keys: ["4.003"]
    name: Audit logs
    features: [UAM-031, UAM-002]
    fit: Fit
    ootb: "Audit trail and access-change log that no user can change, with from and to values, done by, approved by and the request number; sign-in log."
    best: "Every access event logged with actor, time, source and outcome, kept for the retention period and reviewed."
    rec: "BDOI's FRS adds the IP address and the role at the time of the action (Annex Q, C19)."
    impact: "FRUM.008."
