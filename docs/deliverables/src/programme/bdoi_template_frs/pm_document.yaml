  drafting: "Drafting support: iorta TechNXT Project Team"

revision_log:
  date: 09 Oct 2026
  version: "1.1"
  description: "Draft for BDOI review: full coverage of the Product Maintenance BRD (version of 8-Oct-2026), functional requirements elaborated with acceptance criteria, annexes G onward added, observations and points for decision listed in Annex M"
  by: "iorta TechNXT Project Team (drafting support); for review by Angela V. Ramirez"

introduction:
  preparation: "This version 1.1 was elaborated with the iorta TechNXT Project Team (drafting support), from the inputs of the business unit and BDO ITG, for review by the System Analyst."
  overview: "Version 1.1 also covers the points of the Product Maintenance BRD (version of 8-Oct-2026) that version 1.0 did not detail: the product hierarchy and clause library, insurer-specific package terms, package versions with the latest approved rate scheme for new business and the approval of rate exceptions, the review of negotiated terms and the product requirements submitted to ManCom, the post-setup validation checkpoint, package advisories, renewal requests, the password protection of documents shared outside the system, the enforcement of approvals and service levels, and the recording of product master changes for other BDOI systems. The requirements added in this version are listed under each functional requirement with their acceptance criteria; the points that need a BDOI decision are listed in Annex M."

