  A:
    - [Risk Code, Text, All, "Code of the package product; follows the naming convention of its Line of Insurance once stated (FRPM.003.02)"]
    - [Cover Type / Subtype, Dropdown, All, "Level below the Line of Insurance; mandatory for a package (FRPM.022.01)"]
    - [Version Number, Number, All, "Version of the package terms; set by the system (FRPM.024.01)"]
    - [Version Status, Dropdown, All, "Values: Draft, For Validation, Released, Superseded, Expired"]
    - [Insurer Role, Dropdown, All, "Values: Lead, Participant, Panel (per insurer of the package)"]
    - [Insurer Share, Percentage, All, "Co-insurance share per insurer; shares total 100% when used"]
    - [Minimum Premium, Currency, All, "Per package and per insurer"]
    - [Package TSI Limit, Currency, All, "Maximum total sum insured of the package"]
    - [Package Start Date, Date, All, "Start of the package term"]
    - [Anniversary Date, Date, All, "Optional; used for the anniversary alert (FRPM.004.01)"]
    - [Computation Basis, Text, All, "How the premium is computed, as approved by ManCom (FRPM.014.02)"]
    - [ManCom Sign-off Reference, Text, All, "MC-<package request number>; set by the system"]
    - [Change Summary, Text, All, "What changed in this version"]
    - [Market Segments, Dropdown, All, "Multi-select; segments to which the package is offered"]
  B:
    - [Market Segment, Dropdown, All Product Lines, "Segment of the client; must be one allowed for the product"]
  C:
    - [Market Segment, Dropdown, All, "Segment of the client; must be one allowed for the product"]
    - [Risk Details, Text, All, "Free sections (heading and details); risk details or risk items are required before submission"]
    - [Risk Items, Table, All, "Items with sum insured and risk group, per the item fields of the line"]
    - [Mandatory Documents, Attachment, All, "Document checklist of the product; each shown as Attached or Missing"]
    - [Recommended Insurer, Dropdown, All, "Insurer with received terms flagged by TSU (FRPM.008.01)"]
  E:
    - [Request Type, Dropdown, All, "Values: New, Update (FRPM.002.02); Renew and Reactivate proposed (Annex M)"]
    - [Scope, Option, All, "Values: Generic programme, Client-specific package; a client-specific package needs the Insured's Name"]
    - [Package / Programme Name, Text, All, "Mandatory"]
    - [Package Product, Dropdown, All, "The existing package of an update, renewal or deactivation request"]
    - [Reason for Request, Dropdown, All, "Values: Client requirement; New programme for a market segment; Market competitiveness; Change in insurer terms or rates; Loss experience; Regulatory change; Package expiry or anniversary; Others"]
