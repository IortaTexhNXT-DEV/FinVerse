    - [Package documents, "Package request form; Quotation Slip; Insurer response; Comparative Table; Package slip (signed); ManCom sign-off; Advisory"]
  stages:
    - [Draft, Requester (Marketing Account Officer or TSU Officer), "-"]
    - [Marketing approval, "Marketing TL, TH, UH", "24"]
    - [TSU review, TSU Team Lead, "24"]
    - [TSU Head approval, TSU Team Head, "24"]
    - [Negotiation, TSU Officer / Team Lead, "120"]
    - [Negotiated terms review, TSU Team Head, "24"]
    - [Marketing review (client-specific), Marketing requestor, "48"]
    - [Product requirements preparation, TSU Officer / Team Lead, "48"]
    - [ManCom approval, ManCom approvers, "72"]
    - [MBS set-up, MBS, "48"]
    - [Post-setup validation, TSU Head or Business Administrator, "24"]
  rules:
    - ["A request, Quotation Slip, Proposal, ManCom approval, package configuration or rate exception is never approved by the user who made or submitted it.", FRPM.028.01]
    - ["One released version of a package is in force at any date; the previous version ends on the day before the next takes effect.", FRPM.024.01]
    - ["New business is priced on the version in force on the transaction date; another rate needs an approved rate exception.", FRPM.024.02]
    - ["Renewals and endorsements use the version of the original account.", FRPM.024.02]
    - ["Package records, versions, clauses, audit entries and documents are never deleted; they are end-dated, deactivated or expired.", "FRPM.003.04, FRPM.021.01"]
    - ["Expired and deactivated packages are visible only to users authorized to view archived packages.", FRPM.003.05]
    - ["Quotation Slips lock at the ManCom approval.", FRPM.014.01]
    - ["MBS receives product requirements only after the ManCom approval.", "FRPM.014.01, FRPM.015.01"]
    - ["A package configuration is used only after the post-setup validation.", FRPM.016.02]
    - ["Every document e-mailed outside the system is password protected; the password is sent separately.", FRPM.027.01]
    - ["Advisories are sent only with their supporting documents attached.", FRPM.025.01]
    - ["A package has at most one open renewal request.", FRPM.026.01]
    - ["Incentive rules apply only to products active on their effective date and do not overlap in time for the same code.", FRPM.018.01]
