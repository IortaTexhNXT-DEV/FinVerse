# Annex N – Glossary.
glossary:
  - [Advisory, "Notice to the business units that a package is available, renewed, updated or deactivated, with its supporting documents"]
  - [AO, Account Officer (Marketing)]
  - [BIBS, "BDO Insure Brokering System, the system specified in this document"]
  - [BRD, Business Requirements Document]
  - [BRPM, Requirement ID prefix of the Product Maintenance BRD (BRPM.001 to BRPM.024; there is no BRPM.023)]
  - [Client view, "Comparative output for a client presentation, derived from the master Comparative Table with selected fields and insurers"]
  - [Comparative Table, "Side-by-side comparison of the insurer responses of a request"]
  - [CPC2, "An incentive type named in PMADD08 as an example; its definition is to be supplied by BDOI"]
  - [FRPM, Functional requirement ID prefix of this FRS]
  - [Generic programme, "Package offered to a market segment, not to one client"]
  - [Client-specific package, "Package negotiated for one client"]
  - [Line of Insurance, "Level 1 of the product hierarchy (for example Motor, Property, Engineering)"]
  - [ManCom, Management Committee]
  - [Master Comparative Table, "The one current Comparative Table of a package request, compiled from the latest round; earlier masters are kept as superseded"]
  - [MBS, Marketing Business Services and System Support]
  - [Negotiation round, "One Quotation Slip sent to insurers and the responses received to it; a request may have several rounds"]
  - [Package, "Pre-arranged insurance programme whose terms, rates and conditions BDOI negotiates with insurers and offers repeatedly through Marketing"]
  - [Package slip, "Document of the agreed package terms, signed before the ManCom approval"]
  - [Package version, "One effective-dated set of package terms (rate scheme, coverages, insurers, dates)"]
  - [PKR, Prefix of package request numbers (PKR-yyyy-nnnnnn)]
  - [PMADD, Requirement ID prefix of the Product Maintenance Addendum (PMADD01 to PMADD08)]
  - [Post-setup validation, "Checkpoint by the TSU Head or the Business Administrator before a package configuration is used (PMADD06)"]
  - [PQS, Prefix of package Quotation Slip numbers (PQS-yyyy-nnnnnn)]
  - [PRF, "Proposal Request Form: the non-package request of the New Business BRD; called Quotation Request in this FRS"]
  - [QS, Quotation Slip sent to insurers]
  - [Rate exception, "Approved use of a rate different from the package rate scheme on one new-business transaction"]
  - [Rate scheme, "Package rate, minimum premium, commission and TSI limit of a package version"]
  - [Risk code, "Code of a product in the product hierarchy"]
  - [Service level, "Target hours of a workflow stage"]
  - [TH, Team Head]
  - [TL, Team Lead]
  - [TSI, Total sum insured]
  - [TSU, Technical Support Unit]
  - [UH, Unit Head (Marketing)]

# One-page change summary at the front of the review copy (Changes_Highlighted) only. {counts} are filled in.
change_summary:
  title: "Version 1.1 – summary of changes for BDO ITG review"
  intro: "This review copy is BDOI's Functional Requirements Specifications for Product Maintenance, version 1.0 of 19-Aug-2026, with the changes of version 1.1. Every passage added or extended in version 1.1 is shaded light yellow; BDOI's own text is not shaded and is unchanged. The clean copy has the same content without shading and without this page."
  points:
    - "Cover, Document Revision Log, Document Preparation and Signoff Sheet: version 1.1, drafting support by the iorta TechNXT Project Team; BDOI's details and signatories unchanged."
    - "Project Overview: one paragraph on the BRD scope that version 1.0 did not detail."
    - "Business Requirements Mapping: all {brd_ids} requirement IDs of the BRD (PMADD01 to PMADD08, BRPM.001 to BRPM.022 and BRPM.024) with BDOI's mappings kept; {mapping_changes} rows extended with the new or elaborated items; BRPM.020 'Under negotiation if can be waived' mapped to FRPM.027 (decision in Annex M)."
    - "Functional Requirements: BDOI's {bdoi_items} items and {bdoi_subitems} sub-items kept word for word; {elaborated} sub-items elaborated with further requirements; {new_subitems} new sub-items within BDOI's items; {new_items} new items (FRPM.022 to FRPM.030); {ac_total} acceptance criteria added."
    - "Process Flow: BDOI's two figures kept; {flows} figures added."
    - "Annexes A to F kept; rows added to Annex A, B, C and E ({annex_rows} rows)."
    - "New annexes: G Screen specifications ({screens} screens), H Messages and validations ({messages} messages), I Notifications ({notifications}), J Business rules and configurable parameters, K Process walkthroughs ({walk_steps} steps), L Requirements traceability, M Observations and points for BDOI decision ({observations} items, all Open), N Glossary ({glossary} terms)."
  legend: "Where another behaviour is proposed, BDOI's text is kept and the point is listed in Annex M with the original text, the proposed behaviour, the BRD text and a recommendation. Slips noticed in BDOI's text are proposed for correction in Annex M only; they are not changed in the text."
