    - [Market Segments, Dropdown, All, "Multi-select"]
    - [Effective From, Date, All, "Date from which the package is offered"]
    - [Package Start Date, Date, All, ""]
    - [Package Expiry Date, Date, All, "Mandatory on submission; after the start date"]
    - [Anniversary Date, Date, All, "Optional"]
    - [Minimum Premium, Currency, All, "Cannot be negative"]
    - [Package TSI Limit, Currency, All, "Cannot be negative"]
    - [Supporting Documents, Attachment, All, "Preview and download (FRPM.011.02)"]

# Annex J – Business rules and configurable parameters.
annex_j:
  parameters:
    - [Package request number prefix, "PKR-", "Prefix of package request numbers; the year and a sequence are added (PKR-yyyy-nnnnnn)", System Administrator]
    - [Quotation slip number prefix, "PQS-", "Prefix of package Quotation Slip numbers (PQS-yyyy-nnnnnn)", System Administrator]
    - [Insurer reply days, "5", "Days insurers have to reply to a Quotation Slip (1 to 60)", System Administrator]
    - [Expiry alert days, "90", "Days before the package expiry date of the first alert (FRPM.004.01)", System Administrator]
    - [Expiry reminder days, "30, 7", "Days of the further reminders before the expiry date", System Administrator]
    - [Automatic drafting of renewal requests, "Off (proposed On)", "The first expiry alert also drafts the renewal request (FRPM.026.01)", System Administrator]
    - [Default advisory recipients, "Marketing, TSU, MBS, Operations", "Recipient groups proposed on a new advisory (FRPM.025.01)", System Administrator]
    - [Service level per stage, "See FRPM.028.01", "Hours of each workflow stage; amber from 80%, red past the service level", System Administrator]
    - [Rate exception validity, "30 days", "Days an approved rate exception can be used (FRPM.024.02)", System Administrator]
    - [Daily package checks, "01:00 daily", "Time of the expiry alerts and of the expiry of packages", System Administrator]
    - [Placement Update Report schedule, "Thursday 08:00", "Schedule of the Consolidated Placement Update Report (FRPM.007.01)", System Administrator]
    - [Minimum policies of a package request, "20", "Estimated No. of Policies to be Issued (Annex E)", System Administrator]
    - [Minimum premium of a package request, "PHP 5,000,000.00", "Estimated Total Basic Premium to be Issued (Annex E)", System Administrator]
  decision_settings:
    - [Expiry and anniversary notices, "Days before the expiry date and before the anniversary date at which TSU is told; MBS told as well or not", "90 days and 90 days; TSU Officers and TSU Team Leads only (BDOI's FRS)", C02, Head TSU]
    - [Consolidated Placement Update Report, "Weekday, time, length of the reporting period and scope (quotation requests, or quotation and package requests)", "Thursday 08:00, 7 days, quotation requests (BDOI's FRS)", C03, Head TSU; Head Retail Marketing]
    - [Marketing approval chain, "One approval by the Marketing Team Leader, Team Head or Unit Head; or Team Leader, then Team Head, then Unit Head (BDOI's FRS)", "One approval (the BRD)", C05, Head Retail Marketing; Product Owner]
    - [Direct maintenance of the Product Matrix, "On: authorised users add and update Product Matrix records directly, with the approval of the named approver; Off: new packages only from package requests", "On (BDOI's FRS)", C09, Head MBS; Head TSU]
    - [Package deactivation route, "Deactivate Package with effective date, reason and approver (BDOI's FRS); or a retirement package request", "Deactivate Package (BDOI's FRS)", C10, Head TSU; ManCom]
    - [ManCom routing, "The selected approvers approve in parallel, then the President (BDOI's FRS); or one sign-off by any member; the President is named in the setting", "Selected approvers, then the President (BDOI's FRS); President to be named", C17, ManCom; Product Owner]
    - [Forwarding to MBS after ManCom, "Automatic at the ManCom approval (BRPM.015); or by the Request for Deployment button (BDOI's FRS)", "Automatic (the BRD)", C20, Head MBS; Head TSU]
    - [File names of the documents and exports, "BDOI's names with MMDDYYYY (QS_, ProposalSlip_, PlacementUpdate_, Audit Logs_); or the reference numbers", "BDOI's names (BDOI's FRS)", C23, BDO ITG System Analyst]
    - [Least volume of a package request, "Least estimated number of policies and least estimated total basic premium of a package request", "20 policies; PHP 5,000,000.00", "-", Head TSU]
    - [Deactivation and deployment request numbers, "Prefixes of the deactivation and deployment requests; the year and a sequence are added", "PKD-; PDR-", "-", System Administrator]
  lists:
    - [Request reasons,"Client requirement; New programme for a market segment; Market competitiveness; Change in insurer terms or rates; Loss experience; Regulatory change; Package expiry or anniversary; Others (see comment)"]
    - [Return reasons, "Incomplete or incorrect details; Missing supporting documents; Declined by insurer; Additional insurer requirements; Rate or terms to be reviewed; Insurer underwriting review; Others"]
    - [Not proceeded reasons, "Declined by the insurers; Negotiated terms not accepted; Client withdrew the request; Business decision; Others (see comment)"]
    - [Insurer response values, "Approved; Not Covered; Others (BDOI's list, FRPM.006.02); proposed additions: Approved with changes; Counter-proposal; Declined; No response (Annex M, C14)"]
    - [Advisory recipient groups, "Marketing; Technical Support Unit; Marketing Business Services; Processing; Operations"]
    - [Coverage kinds, "Section; Coverage; Peril; Extension"]
    - [Clause kinds, "Warranty; Clause; Exclusion; Deductible wording"]
    - [Insurer roles, "Lead; Participant; Panel"]
