# BDOI's Functional Requirements Specifications for Product Maintenance (BDO ITG, v1.0 of 19-Aug-2026), extracted
# word for word from docs/source-documents (business requirements mapping, functional requirement items, annex field
# tables and the labels of the quotation slip templates embedded as Annex D and F). Data for the comparison workbook.
meta:
  title: Functional Requirements Specifications - BDO Insurance Brokering System - Product Maintenance
  project: PRJ0012475
  version: '1.0'
  date: 19-Aug-2026
  prepared_by: Angela V. Ramirez, BDO ITG
  file: FRS - BDOI BROKERSYS Product Maintenance v1.0 (BDOI, 19-Aug-2026).docx
  approx_words: 8872
  process_flows:
  - Non-Package Request Process Flow (swimlanes Marketing, TSU, Insurer, MBS)
  - New Request Process Flow (package; swimlanes Marketing, TSU, Insurer, MBS)
brm:
- id: PMADD01
  requirement: I want a standard reusable product structure hierarchy so that product data is consistent and scalable across
    packaged and non-packaged products.
  bdoi_frs: FRPM.003
- id: PMADD02
  requirement: I want insurer-specific coverage, deductibles, and warranty mappings maintained without IT intervention so
    that insurer variability is supported in a controlled manner.
  bdoi_frs: FRPM.003
- id: PMADD03
  requirement: I want configurable comparative tables so that client-specific outputs can be generated without manual Excel
    rework while retaining an auditable master version.
  bdoi_frs: FRPM.006
- id: PMADD04
  requirement: I want to have explicit exception states and iterative negotiation loop support so that non-linear insurer
    negotiations, revisions, and declines are handled as formal workflow outcomes rather than informal handling.
  bdoi_frs: FRPM.006
- id: PMADD05
  requirement: I want a role-to-action access matrix so that access is controlled appropriately and audit risk is reduced.
  bdoi_frs: Refer to User Access Maintenance FRS
- id: PMADD06
  requirement: I want an explicit post-setup validation checkpoint (e.g., by TSU Head / Business Administrator role) so
    that incorrect package/product configurations do not propagate downstream without accountability.
  bdoi_frs: FRPM.003.03
- id: PMADD07
  requirement: I want to define and maintain Incentive criteria based on the Maintained Products Matrix, so that incentives
    are accurately configured and applied only to eligible product combinations.
  bdoi_frs: FRPM.018 / FRPM.003.02
- id: PMADD08
  requirement: I must have a maintenance facility to define and update Incentives (i.e. CPC2) criteria based on the maintained
    products.
  bdoi_frs: FRPM.018 / FRPM.003.02
- id: BRPM.001
  requirement: Access and log-in to the system.
  bdoi_frs: Refer to User Access Maintenance FRS
- id: BRPM.002
  requirement: Restrict access to authorized users.
  bdoi_frs: Refer to User Access Maintenance FRS
- id: BRPM.003
  requirement: There must be a capability to capture, store, and validate all mandatory, critical and product-specific fields.
  bdoi_frs: FRPM.002 / FRPM.003
- id: BRPM.004
  requirement: There must be a capability to apply validation rules based on product type.
  bdoi_frs: FRPM.003
- id: BRPM.005
  requirement: There must be a capability to use shared templates with dynamic fields for product-specific data.
  bdoi_frs: FRPM.020
- id: BRPM.006
  requirement: There must be a capability to store and archive details of expired insurance products (policies/packages)
    for future reference or potential reactivation.
  bdoi_frs: FRPM.002.02
- id: BRPM.007
  requirement: The system ensures that all new business (new insurance placements) must automatically use the latest approved
    rate scheme. Outdated rates cannot be selected for new business.
  bdoi_frs: FRPM.003.03
- id: BRPM.008
  requirement: Submit approved Package Request Form.
  bdoi_frs: FRPM.011
- id: BRPM.009
  requirement: Review package requests and recommends for approval.
  bdoi_frs: FRPM.011.03
- id: BRPM.010
  requirement: The system must support the process where the Technical Support Unit (TSU) or authorized users negotiate
    terms, rates, and conditions with insurers for insurance packages.
  bdoi_frs: FRPM.006.02 / FRPM.008 / FRPM.009 / FRPM.010 / FRPM.013
- id: BRPM.011
  requirement: Facility to allow User to receive and view requests for product creation, amend, updating, or deletion based
    on client or business needs.
  bdoi_frs: FRPM.005 / FRPM.017
- id: BRPM.012
  requirement: Prepare and send quotation slip to Insurers indicating applicable terms and conditions.
  bdoi_frs: FRPM.006 / FRPM.012 / FRPM.013
- id: BRPM.013
  requirement: Facility to allow user to key-in the terms and conditions / feedback from the Insurers, which may be edited
    by TSU later on.
  bdoi_frs: FRPM.006.02 / FRPM.008 / FRPM.009
- id: BRPM.014
  requirement: The system must automatically compile all insurers’ feedback and responses into a single, consolidated comparative
    table for each package.
  bdoi_frs: FRPM.006.02 / FRPM.008 / FRPM.009
- id: BRPM.015
  requirement: Received product requirements from TSU. (i.e. computation and details that Marketing needed for their transactions).
    / Product requirements and details from TSU are submitted via the system, triggering a ManCom review and signoff workflow.
    Only after ManCom’s in-system approval are requirements automatically forwarded to MBS for processing. MBS receives
    only validated, signed-off requirements and returns incomplete submissions. Marketing is notified by the system when
    the package is ready. While some manual steps (like physical signatures) may still occur, most information should flow
    through the system.
  bdoi_frs: FRPM.014 / FRPM.015 / FRPM.016
- id: BRPM.016
  requirement: 'The system must allow Users to access supporting documents necessary for creating advisories. This means
    users should be able to retrieve, view, and utilize all relevant documentation directly within the system when preparing
    advisory communications (e.g., notifications, emails, or reports about product/package status). / Documents could be
    but not limited to the following: Advisory / email broadcast that Package is ready. / Package slip (signed) ManCom signed
    off'
  bdoi_frs: FRPM.011
- id: BRPM.017
  requirement: The system must enable the TSU Officer to monitor the expiry or anniversary date of each insurance package
  bdoi_frs: FRPM.004 / FRPM.019
- id: BRPM.018
  requirement: 'Facility to allow User to generate Placement Update Reports (both for individual accounts and collectively
    for all accounts). / This is to track and report the status of package creation, including key details such as but not
    limited to the following: account information, package status, expiry dates, terms, rates, and recent actions. Reports
    should support business monitoring, audit, and operational needs.'
  bdoi_frs: FRPM.007
- id: BRPM.019
  requirement: Dashboard for real-time tracking and reporting
  bdoi_frs: FRPM.001
- id: BRPM.020
  requirement: Capability to check for document security (password protection/ encryption).
  bdoi_frs: Under negotiation if can be waived
- id: BRPM.021
  requirement: Validation and approval workflow enforcement.
  bdoi_frs: FRPM.003.03 / FRPM.003.07 / FRPM.005.02 / FRPM.011.03 / FRPM.012.01 / FRPM.014
- id: BRPM.022
  requirement: Notification and integration for seamless data flow.
  bdoi_frs: FRPM.003 / FRPM.004 / FRPM.005 / FRPM.006 / FRPM.008 / FRPM.009 / FRPM.010 / FRPM.011 / FRPM.012 / FRPM.013
    / FRPM.014 / FRPM.015 / FRPM.017
- id: BRPM.024
  requirement: Ensure audit trail for all actions and changes.
  bdoi_frs: FRPM.021
