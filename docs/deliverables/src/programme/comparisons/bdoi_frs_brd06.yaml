    YEAR 2'
  ctpl: RETAIN
- field: ACCOUNT TYPE
  criteria: LOAN FULLY PAID (NOT LTO)
  regular: CLG AUTO OPEN MARKET
  auto_promo: 'Retain existing Account Type and increment by 1year / **Example: From CLG AUTO FFYMI YEAR 1 to CLG AUTO FFYMI
    YEAR 2'
  ctpl: RETAIN
- field: ACCOUNT TYPE
  criteria: 'BDO MORTGAGED (LTO) / Account Type is CLG Auto for Hire / LAMD Loan Status: ACTIVE/RMU'
  regular: CLG AUTO FOR HIRE
  auto_promo: 'Retain existing Account Type and increment by 1year / **Example: From CLG AUTO FFYMI YEAR 1 to CLG AUTO FFYMI
    YEAR 2'
  ctpl: RETAIN
- field: ACCOUNT TYPE
  criteria: LOAN FULLY PAID (LTO) / Account Type is CLG Auto for Hire
  regular: CLG AUTO OPM LTO
  auto_promo: 'Retain existing Account Type and increment by 1year / **Example: From CLG AUTO FFYMI YEAR 1 to CLG AUTO FFYMI
    YEAR 2'
  ctpl: RETAIN
- field: NEW INSURER
  criteria: ''
  regular: = PREVIOUS INSURER
  auto_promo: = PREVIOUS INSURER
  ctpl: = PREVIOUS INSURER
- field: NEW INCEPTION
  criteria: ''
  regular: = POLICY EXPIRY
  auto_promo: = POLICY EXPIRY
  ctpl: = POLICY EXPIRY
- field: NEW EXPIRY
  criteria: 1 YEAR (NON-MYP)
  regular: = NEW INCEPTION + 365 DAYS (+366 days if leap year)
  auto_promo: = NEW INCEPTION + 365 DAYS (+366 days if leap year)
  ctpl: = NEW INCEPTION + 365 DAYS (+366 days if leap year)
- field: NEW EXPIRY
  criteria: 2 YEARS
  regular: = NEW INCEPTION + 730 DAYS (+731 days if leap year)
  auto_promo: N/A
  ctpl: = NEW INCEPTION + 365 DAYS (+366 days if leap year)
- field: NEW EXPIRY
  criteria: 3 YEARS
  regular: = NEW INCEPTION + 365 DAYS (+366 days if leap year)
  auto_promo: N/A
  ctpl: = NEW INCEPTION + 365 DAYS (+366 days if leap year)
- field: NEW EXPIRY
  criteria: 4 YEARS
  regular: = NEW INCEPTION + 365 DAYS (+366 days if leap year)
  auto_promo: N/A
  ctpl: = NEW INCEPTION + 365 DAYS (+366 days if leap year)
- field: NEW EXPIRY
  criteria: 5 YEARS
  regular: = NEW INCEPTION + 365 DAYS (+366 days if leap year)
  auto_promo: N/A
  ctpl: = NEW INCEPTION + 365 DAYS (+366 days if leap year)
- field: NEW OD/THEFT COVERAGE
  criteria: 1 YEAR (NON-MYP)
  regular: = PREVIOUS TSI x 90% (DEPRECIATE PREVIOUS TSI BY 10%)
  auto_promo: = PREVIOUS TSI x 90% (DEPRECIATE PREVIOUS TSI BY 10%)
  ctpl: =EXPIRING TSI
- field: NEW OD/THEFT COVERAGE
  criteria: 2 YEARS (1st YEAR)
  regular: = PREVIOUS TSI /1.9 x .81
  auto_promo: N/A
  ctpl: =EXPIRING TSI
- field: NEW OD/THEFT COVERAGE
  criteria: 2 YEARS (2nd YEAR)
  regular: = 2 YEAR (1st YEAR) x .9
  auto_promo: N/A
  ctpl: =EXPIRING TSI
- field: NEW OD/THEFT COVERAGE
  criteria: 3 YEARS
  regular: = PREVIOUS TSI /2.71 x .729
  auto_promo: N/A
  ctpl: =EXPIRING TSI
- field: NEW OD/THEFT COVERAGE
  criteria: 4 YEARS
  regular: = PREVIOUS TSI /3.439 x .6561
  auto_promo: N/A
  ctpl: =EXPIRING TSI
- field: NEW OD/THEFT COVERAGE
  criteria: 5 YEARS
  regular: = PREVIOUS TSI /4.0951 x .59049
  auto_promo: N/A
  ctpl: =EXPIRING TSI
- field: NEW OD/ THEFT PREMIUM
  criteria: ''
  regular: = NEW OD/THEFT COVERAGE x EXPIRING PREMIUM RATE
  auto_promo: = NEW OD/THEFT COVERAGE x EXPIRING PREMIUM RATE
  ctpl: N/A
- field: NEW BI COVERAGE
  criteria: ''
  regular: IF EXPIRING BI COVERAGE < NEW OD/THEFT COVERAGE, THEN, EXPIRING BI COVERAGE
  auto_promo: = EXPIRING BI COVERAGE
  ctpl: N/A
- field: NEW BI COVERAGE
  criteria: ''
  regular: IF EXPIRING BI COVERAGE > NEW OD/THEFT COVERAGE, THEN, LOWER BI COVERAGE BY GETTING THE NEXT TIER DOWN UNTIL
    BI COVERAGE IS < NEW OD/THEFT COVERAGE
  auto_promo: = EXPIRING BI COVERAGE
  ctpl: N/A
- field: NEW PD COVERAGE
  criteria: ''
  regular: IF EXPIRING PD COVERAGE < NEW OD/THEFT COVERAGE, THEN, EXPIRING PD COVERAGE
  auto_promo: = EXPIRING PD COVERAGE
  ctpl: N/A
- field: NEW PD COVERAGE
  criteria: ''
  regular: IF EXPIRING PD COVERAGE > NEW OD/THEFT COVERAGE, THEN, LOWER PD COVERAGE BY GETTING THE NEXT TIER DOWN UNTIL
    PD COVERAGE IS < NEW OD/THEFT COVERAGE
  auto_promo: = EXPIRING PD COVERAGE
  ctpl: N/A
- field: NEW BI PREMIUM
  criteria: 1 YEAR (NON-MYP)
  regular: IF NEW BI COVERAGE = EXPIRING BI COVERAGE, THEN EXPIRING BI PREMIUM, ELSE, GET NEW BI PREMIUM
  auto_promo: = EXPIRING BI PREMIUM
  ctpl: NA
- field: NEW BI PREMIUM
  criteria: MYP
  regular: GET THE CORRESPONDING BI PREMIUM BASED ON NEW BI COVERAGE
  auto_promo: = EXPIRING BI PREMIUM
  ctpl: NA
- field: NEW PD PREMIUM
  criteria: 1 YEAR (NON-MYP)
  regular: IF NEW PD COVERAGE = EXPIRING PD COVERAGE, THEN EXPIRING PD PREMIUM, ELSE, GET NEW PD PREMIUM
  auto_promo: = EXPIRING PD PREMIUM
  ctpl: NA
- field: NEW PD PREMIUM
  criteria: MYP
  regular: GET THE CORRESPONDING PD PREMIUM BASED ON NEW PD COVERAGE
  auto_promo: = EXPIRING PD PREMIUM
  ctpl: NA
- field: AUTO PA PREMIUM
  criteria: ''
  regular: =EXPIRING AUTO PA PREMIUM
  auto_promo: =EXPIRING AUTO PA PREMIUM
  ctpl: N/A
- field: BASIC PREMIUM
  criteria: ''
  regular: = NEW OD/ THEFT PREMIUM + NEW BI PREMIUM + NEW PD PREMIUM + AUTO PA PREMIUM
  auto_promo: = NEW OD/ THEFT PREMIUM + NEW BI PREMIUM + NEW PD PREMIUM + AUTO PA PREMIUM
  ctpl: =EXPIRING BASIC PREMIUM
- field: DST (DOCSTAMPS)
  criteria: ''
  regular: '''=BASIC PREMIUM x 12.5% ROUNDED UP TO P0.50 **EXAMPLE: P1,537.12 THEN P1,537.50 / P1,537.60 THEN P1,538.00'
  auto_promo: '''=BASIC PREMIUM x 12.5% ROUNDED UP TO P0.50 **EXAMPLE: P1,537.12 THEN P1,537.50 / P1,537.60 THEN P1,538.00'
  ctpl: =EXPIRING DST (DOCSTAMPS)
- field: VAT
  criteria: ''
  regular: =BASIC PREMIUM x 12%
  auto_promo: =BASIC PREM x 12%
  ctpl: =EXPIRING VAT
- field: LGT
  criteria: ''
  regular: =BASIC PREMIUM x (EXPIRING LGT AMOUNT/ EXPIRING BASIC PREMIUM)
  auto_promo: =BASIC PREMIUM x (EXPIRING LGT AMOUNT/ EXPIRING BASIC PREMIUM)
  ctpl: =EXPIRING LGT
- field: OTHER CHARGES
  criteria: ''
  regular: N/A
  auto_promo: N/A
  ctpl: =EXPIRING OTHER CHARGES
- field: TOTAL PREMIUM
  criteria: ''
  regular: =BASIC PREMIUM + DST (DOCSTAMPS) + VAT + LGT
  auto_promo: =BASIC PREM + DST (DOCSTAMPS) + VAT + LGT
  ctpl: =EXPIRING TOTAL PREMIUM
