annex_m:
- letter: Renewal Advice (RA) First Notice
  segment: All
  eligibility: 1. Account disposition is For Renewal. / 2. Exclude CBG Home amortized accounts.
  schedule: 75 days prior to the policy expiry date
- letter: Renewal Advice (RA) Last Notice
  segment: All
  eligibility: 1. Account disposition is For Renewal. / 2. Exclude CBG Home amortized accounts.
  schedule: 45 days prior to the policy expiry date
- letter: FFY Reminder Letter
  segment: CBG
  eligibility: 1. Account is tagged as FFY (Free First Year).
  schedule: 75 days prior to the policy expiry date
- letter: NRNS Reminder Letter
  segment: CBG Motor
  eligibility: 1. Account has an active loan based on the latest LAMD Report. / 2. No corresponding insurance policy (inforce/
    submitted) record exists in BDOI.
  schedule: 75 days prior to the policy expiry date
- letter: No Advice Letter (NAL)
  segment: CBG Motor/ Non- CBG
  eligibility: 1. A Renewal Advice (RA) has been issued. / 2. The client has not responded to the Renewal Advice. / 3. The
    policy has expired. / 4. Exclude paid accounts. / 5. Include mortgaged accounts and/or fully paid loan accounts.
  schedule: 1 day after the policy expiry date
- letter: Service Fulfillment Unit (SFU) Letter
  segment: CBG Motor
  eligibility: 1. The property is mortgaged to BDO. / 2. A Renewal Advice (RA) has been issued. / 3. The client has not
    responded to the Renewal Advice. / 4. Exclude paid accounts.
  schedule: 1 day after the policy expiry date
- letter: Non-Renewal Letter (NRL)
  segment: CBG Motor
  eligibility: 1. The client has confirmed the non-renewal of the policy; or / 2. The account is tagged as Not for Renewal.
  schedule: 1 day after the policy expiry date
- letter: Non-Renewal Letter (NRL)
  segment: Non- CBG
  eligibility: 1. The client has confirmed the non-renewal of the policy; or / 2. The account is tagged as Not for Renewal.
    / 3. The system sent an NAL letter to the client
  schedule: 3 days after the policy expiry date
annex_s_fields:
- field: No.
  description: Sequential number assigned to each record or item in the report for reference
  type: Number
  applies: Both
  mapping: Not Applicable
- field: 'PN #'
  description: Promissory Note Number associated with the loan account. This serves as the unique loan reference number
    used in the bank's loan system.
  type: Number
  applies: Both
  mapping: PN Number
- field: Account No.
  description: Unique account number assigned to the borrower's loan account. Used for identification and tracking of the
    loan facility.
  type: Number
  applies: Both
  mapping: Renewal Reference Number
- field: Assured's Name
  description: Full name of the insured borrower, property owner, or client covered by the insurance policy.
  type: Text
  applies: Both
  mapping: Assured's Name
- field: Loan Booking Date
  description: Date when the loan was approved, released, and officially booked in the bank's records.
  type: Date
  applies: Home
  mapping: Loan Booking Date (LAMD)
- field: Loan Maturity Date
  description: Date when the loan obligation is scheduled to mature or become fully due and payable.
  type: Date
  applies: Home
  mapping: Loan Maturity Date (LAMD)
- field: Inception Date
  description: Start date of the insurance policy coverage. This is the effective date when insurance protection begins.
  type: Date
  applies: Home
  mapping: Inception Date
- field: Expiry Date
  description: End date of the insurance policy coverage. Insurance protection remains valid until this date unless renewed
    earlier.
  type: Date
  applies: Home
  mapping: Expiry Date
- field: Loan Type
  description: Classification or type of loan granted to the borrower (e.g., Home or MPL.).
  type: Text
  applies: Home
  mapping: IBG/CBG Tag (LAMD)
- field: Total Premium (1 Year)
  description: Total annual insurance premium amount payable for one (1) year of coverage based on the insured property
    or risk.
  type: Number
  applies: Both
  mapping: Total Premium
- field: Logical Branch Description PN
  description: Name or description of the branch that originated, booked, or currently manages the loan account associated
    with the Promissory Note (PN).
  type: Text
  applies: Home
