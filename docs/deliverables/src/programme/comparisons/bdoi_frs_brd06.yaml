annex_u_package:
- package: Motor
  sequence: Year / Make / Model / Variant / Serial No./Chassis No. / Engine No./Motor No. / Plate No./Conduction Sticker
    / MV File No. / Color
- package: Property
  sequence: 'Location of Risk: [House No. / Apt. No. / Unit No. / Floor] [space] [Street Name / Sitio / Purok] [space] [Province][space]
    [City / Municipality] [space] Occupancy: [Building Occupancy] / Mortgagee: [Mortgagee]'
- package: Contractors All Risk
  sequence: 'Location of Risk: [House/Unit/Floor No. / Building Name / Street] [space] [Subdivision/Village/Barangay] [space]
    [Province/State] [space] [City/Town] [/] [Project Name] Contract/PO No. [Contract/PO No] / Scope of Work [Scope of Work]'
- package: Marine Cargo
  sequence: 'Items Insured: [Item/s Insured] [Sum Insured] [/] [Letter of Credit No.]'
- package: Fire Trust Receipt
  sequence: '[House/Unit/Floor No. / Building Name / Street] [space] [Subdivision/Village/Barangay] [space] [Province/State]
    [City/Town] [/] [TR Reference Number] [/] [LC No] [/] [Sum Insured]'
- package: Equipment Floater
  sequence: '[Unit Description] [/] [Serial No.] [/] [Sum Insured] [/] Location of Risk: [Location of Risk]'
- package: Electronic Equipment
  sequence: '[Item Insured] [Item Description] [Item Value] [Total Sum Insured] [/] Location of Risk: [Location of Risk]'
- package: CGL / Public Liability
  sequence: '[Item insured / Project Description/ Undertaking] [/] [TSI] [/] [Location of Risk]'
- package: Inland Marine
  sequence: '[Insured Items] [Type] [Make and Model] [Plate No.] [Engine No] [Chassis No.]'
- package: Personal Accident (PA)
  sequence: Personal Accident for [Assured Name]
annex_u_non_package:
- line: Aviation
  syntax: 'Risk Description: / Type of Vessel: <Vessel Description> / Year: <Year Manufactured> / Serial / RPC No.: <Serial
    / RPC No.> / Sum Insured: <Value> / Mortgagee: <Name of Mortgagee>'
- line: Bonds (Construction)
  syntax: 'Risk Description: / Type of Works: <NTP/Contract No, Generic Scope of Works> / Project Name: <Project Name> /
    Contract Amount: <Value> / Obligee: <Name of Project Owner / Bond Obligee>'
- line: Liability / CGL – Completed Operations
  syntax: 'Risk Description: / LOR: <Location of Risk> / Property Use: <Occupancy / Property Use> / Establishment Name:
    <Name of Property (as applicable)> / Annual Turn-over: <Value> / Floor Area: <Value (in sqm)>'
- line: Liability / CGL – Premises Operations
  syntax: 'Risk Description: / LOR: <Location of Risk> / Property Use: <Occupancy / Property Use> / Establishment Name:
    <Name of Property (as applicable)>'
- line: Liability / Employer’s Liability
  syntax: 'Risk Description: / Business Operations: <Employer’s Nature of Business> / Employee Count: <Value>'
- line: Liability / Products Liability
  syntax: 'Risk Description: / Covered Products: <Products Covered> / Annual Turn-over: <Value>'
- line: Contractors All Risk / Erection All Risk
  syntax: 'Risk Description, Location of Risk: / Type of Works: <Generic Scope of Works> / Project Description: <Description
    of the Structure under Construction> / Project Name: <Project Name> / LOR: <Location of Risk> / Mortgagee: <Name of
    Mortgagee>'
- line: Equipment Floater / Electronic Equipment
  syntax: 'Risk Description, Location of Risk: / Brand: <Brand Name of Equipment> / Year: <Year Manufactured> / Model: <Risk
    Model / Description> / Serial / Ref No.: <Serial / Ref No. > / LOR: <Location of Risk> / Mortgagee: <Name of Mortgagee>'
- line: Fire Trust Receipt
  syntax: 'Risk Description: / Stocks Description: <Stocks Description> / LOR: <Location of Risk.> / LC/TR Reference No.:
    <Reference No.> / Mortgagee: <Name of Mortgagee>'
- line: Marine
  syntax: 'Risk Description: / Cargo Description: <Qty., Cargo description> / Invoice No.: <Invoice No.> / Bill of Lading
    No.: <BL No.> / LC/TR Reference No.: <Reference No.> / Mortgagee: <Name of Mortgagee>'
- line: Marine Hull
  syntax: 'Risk Description: / Vessel Name: <Name of Vessel> / Type of Vessel: <Vessel Description> / Year: <Year Manufactured>
    / Sum Insured: <Value> / Mortgagee: <Name of Mortgagee>'
- line: Motor (non-package)
  syntax: 'Risk Description: / Year: <Year Manufactured> / Make: <Vehicle make> / Model: <Risk Model / Description> / Plate
    No. / Conduction Sticker: <Plate No. / CS No. > / User Assigned: <Name of Assigned User of the Vehicle, as applicable>
    / Mortgagee: <Name of Mortgagee>'
- line: Property
  syntax: 'Risk Description, Location of Risk / Building Description: <Construction Class>, <# of Storey / Bldg. Description>
    / Occupancy: <Property Use> / LOR: <Location of Risk> / Breakdown of Items & Sums Insured (BI/Loss of Profit/Loss of
    Rent) to be encoded as part of Items Insured): / Item 1 - <Item Description>: <Value> / Item 2 - <Item Description>:
    <Value> / Item N - <Item Description>: <Value> / Total Sum Insured: <Value> / Mortgagee: <Name of Mortgagee>'
- line: Stock Throughput
  syntax: 'Risk Description, Location of Risk / Cargo/Stock Description: <Goods description> / LOR: <Location of Risk> /
    Breakdown of Sums Insured: / Loc 1: <Value> / Loc 2 <Value> / Loc N: <Value> / Total Sum Insured: <Value> / Mortgagee:
    / Mortgagee: <Name of Mortgagee>'
