- field: RISK CODE
  criteria: ''
  regular: RETAIN
  auto_promo: RETAIN
  ctpl: RETAIN
- field: ACCOUNT TYPE
  criteria: 'BDO MORTGAGED (NOT LTO) / LAMD Loan Status: ACTIVE/RMU'
  regular: CLG AUTO
