brm:
- id: BRRN.001
  requirement: System must allow the user to generate and send a No Advice Letter (NAL) to clients whose expiring policies
    do not require either a Renewal Advice (RA) or a Not for Renewal Letter (NFR) or Non-Renewal Letter (NRL), typically
    when no action or advice is needed regarding the expiring policy.
  bdoi_frs: FRRN.022 / FRRN.023
- id: BRRN.002
  requirement: The system must allow users to select and change the date range (month, day, year) for generating the list
    of expiring accounts.
  bdoi_frs: FRRN.004
- id: BRRN.003
  requirement: System provides filter criteria for generating the list, including all specified options, and allows filter
    management (apply, cancel, clear)
  bdoi_frs: FRRN.004
- id: BRRN.004
  requirement: System displays the generated list in a scrollable view with all required columns.
  bdoi_frs: FRRN.004
- id: BRRN.005
  requirement: System captures expired/expiring and unbooked accounts.
  bdoi_frs: FRRN.004
- id: BRRN.006
  requirement: System allows column filtering and search.
  bdoi_frs: FRRN.002
- id: BRRN.007
  requirement: System allows download, save, and print in .xlsx format.
  bdoi_frs: FRRN.004.06
- id: BRRN.008
  requirement: System provides print preview and settings.
  bdoi_frs: FRRN.004.06
- id: BRRN.009
  requirement: System tags non-renewable risk codes, excludes them, maintains codes, and sends NFR letters.
  bdoi_frs: FRRN.007 / FRRN.038 / FRRN.023
- id: BRRN.010
  requirement: '- Generate Renewal Advice (RA) / - Ability to select accounts for RA generation (single, multiple, all,
    all except) / - Generate RA for selected accounts / - Prevent RA generation for locked accounts / - Identify if RA is
    for first or second notice / - View, preview, and close RA details / - Download and save RA (single or batch) / - Extract
    details for RA sending / - Send RA in batch, with encryption and password protection'
  bdoi_frs: FRRN.022
- id: BRRN.011
  requirement: System allows users to view all accounts assigned to them in a single, scrollable view. Any updates or endorsements
    made to an account are automatically reflected on the mother policy.
  bdoi_frs: FRRN.014 / FRRN.004.06 / FRRN.010
- id: BRRN.012
  requirement: System allows users to select any account from the displayed list for further action or review.
  bdoi_frs: FRRN.014
- id: BRRN.013
  requirement: System displays all renewal fields for the selected account, sourced from the generated expiring account
    list.
  bdoi_frs: FRRN.014
- id: BRRN.014
  requirement: System provides filtering options for each column in the account list, allowing users to narrow down results.
  bdoi_frs: FRRN.002
- id: BRRN.015
  requirement: System provides sorting options for the account list, allowing users to order accounts by any column.
  bdoi_frs: FRRN.002
- id: BRRN.016
  requirement: System provides a search function that allows users to find specific information within the account list,
    similar to a Ctrl+F feature.
  bdoi_frs: FRRN.002
- id: BRRN.017
  requirement: System allows users to search for a particular account using name or unique reference number.
  bdoi_frs: FRRN.002
- id: BRRN.018
  requirement: Upload file(s) / Select the source path Select the file(s) for upload / System allows users to select a source
    path and upload one or more dispositioned files to update account details in the system.
  bdoi_frs: FRRN.015
- id: BRRN.019
  requirement: The system must allow users to generate comprehensive reports on accounts and transactions relevant to their
    role. / - Users should be able to define the report scope using flexible filters (such as invoice number, date range,
    unit, region, product, account type, status, and other relevant fields). / - Reports must be viewable in a single, scrollable
    interface and include all necessary columns for business review (e.g., invoice number, account details, transaction
    status, renewal information, remarks). / Users must have the ability to download, save, and print reports in standard
    formats (e.g., .xlsx, .pdf), with print preview and customizable print settings. Each report should also provide a summary
    section showing aggregate figures and key performance indicators.
  bdoi_frs: FRRN.044
- id: BRRN.020
  requirement: As a renewal processor, I want data sanitation to occur within the system after extraction or upload, so
    that renewal eligibility is determined consistently and not dependent on manual pre-cleaning.
  bdoi_frs: FRRN.007 / RRN.040
- id: BRRN.021
  requirement: As an authorized user, I want expiring accounts to be extracted (e.g. within the system and displayed on
    the screen/dashboard), with renewal processing starting only upon explicit user initiation, so that accounts do not
    renew prematurely and proper governance is maintained.
  bdoi_frs: FRRN.004 / FRRN.003
- id: BRRN.022
  requirement: As a renewal user, I want to have a unique reference number to be mandatory and used as the primary matching
    key, so that renewal records reliably link to the correct existing policies.
  bdoi_frs: FRRN.004
- id: BRRN.023
  requirement: I want the system to automatically classify renewal records into rule-based buckets (i.e. Clean, Review,
    Exception), so that renewal work is prioritized, straight through cases are processed efficiently, and exceptions are
    controlled and isolated.
  bdoi_frs: FRRN.007 / FRRN.008
- id: BRRN.024
  requirement: As an authorized user, I want the LAMD role limited to early validation only, so that booking, placement,
    and customer communications remain role-appropriate and controlled.
  bdoi_frs: FRRN.012 / Refer to User access matrix for access restriction
- id: BRRN.025
  requirement: I want expiry-driven reminder letters generated for expiring policies that are not yet submitted at the defined
    follow-up checkpoint (e.g., +90 days), so that follow-ups are standardized and time-bound.
  bdoi_frs: FRRN.023
- id: BRRN.026
  requirement: As a Contact Center user, I want system access to renewal lists and the ability to update renewal statuses,
    so that follow-ups are done via system.
  bdoi_frs: Refer to User access matrix for access restriction
- id: BRRN.027
  requirement: As a Renewal User, I want to view the full historical account record (i.e. policies, renewals, endorsements,
    payment history, and claims) during renewal review so that I can make an informed and auditable renewal decision.
  bdoi_frs: FRRN.014
- id: BRRN.028
  requirement: I want the system to identify and view accounts that are due or upcoming for KYC review, so that compliance
    monitoring and follow up can be performed without blocking or interrupting the renewal process.
  bdoi_frs: FRRN.039
- id: BRRN.029
  requirement: The system shall ingest LAMD-provided reports and match paid-off loan records against RMEL policies to determine
    renewal eligibility and proper routing.
  bdoi_frs: FRRN.012
- id: BRRN.030
  requirement: The system shall automatically extract renewal candidates based on policy expiry date using configurable
    lead days (e.g., -140 days).
  bdoi_frs: User will select date range to generate RMEL / FRRN.004
- id: BRRN.031
  requirement: I want the system to apply rule-based disposition automatically and isolate exceptions, so that straight-through
    renewals proceed without manual effort and manual handling is focused only on high-impact or non-standard cases.
  bdoi_frs: FRRN.007 / FRRN.08
- id: BRRN.032
  requirement: Endorsements occurring before or during renewal must be reflected on the mother (expiring) policy prior to
    renewal approval.
  bdoi_frs: FRRN.004.06
- id: BRRN.033
  requirement: The system shall allow renewal-identified accounts to follow the New Business flow when financial or structural
    changes require repricing or restructuring.
  bdoi_frs: FRRN.017 / FRRN.018 / FRRN.019 / FRRN.020
- id: BRRN.034
  requirement: The system shall provide a configurable decision matrix defining which renewal scenarios are automated versus
    manual.
  bdoi_frs: FRRN.040
- id: BRRN.035
  requirement: As a renewal user, I want the system to capture insurer responses (e.g., Approve/ Renew As-ls, Reject, Revise)
    and automatically apply them to the renewal workflow, so that renewal status progression is accurate, controlled, and
    does not rely on manual re-encoding or interpretation.
  bdoi_frs: FRRN.013
- id: BRRN.036
  requirement: I want the system to generate customizable, centralized renewal listings (e.g., by unit, segment, UH, IBG,
    Leasing), expiry window, and current status, so that renewal exposure is clearly visible, proactively monitored, and
    escalated appropriately without relying on manual tracking.
  bdoi_frs: FRRN.002.05
- id: BRRN.037
  requirement: I want the system to identify NRNS (No Renew/ No Submit) accounts and trigger reminder or non-acceptance
    letters to manage lapse risk.
  bdoi_frs: FRRN.023
- id: BRRN.038
  requirement: The system shall enforce routing of renewal changes based on financial impact, ensuring proper approval and
    proposal handling.
  bdoi_frs: FRRN.017
- id: BRRN.039
  requirement: The system shall support LAMD-driven matching and categorization for CBG Motor and Fire renewals, including
    straight-through processing and letter generation.
  bdoi_frs: FRRN.012
- id: BRRN.040
  requirement: I want the system to automatically proceed to placement and booking once the client has accepted the Renewal
    Advice (RA) and applicable payment rules are satisfied, so that the renewal process is completed without delay, duplicate
    handling, or manual re initiation, and the policy can be issued on time.
  bdoi_frs: FRRN.029
- id: BRRN.041
  requirement: The system shall evaluate renewal transactions for incentive eligibility after successful placement, booking,
    and full payment confirmation, and assign an incentive eligibility indicator based on predefined, rule-based criteria,
    including applicable endorsements, so that incentive processing and reporting are accurate, consistent, and auditable.
  bdoi_frs: FRRN.034
- id: BRRN.042
  requirement: As a renewal user, I want to be able to send request for Hold Cover to insurer/s and to record the Hold Cover
    confirmation details received from the insurer.
  bdoi_frs: FRRN.036
frrn:
- id: FRRN.001
  screen: Login
  capability: Login, Inactivity Warning, and Timeout
  items:
  - id: FRRN.001.01
    title: The system shall allow the user to access BDOI-BROKERSYS application using any BDO-issued device and even on
      multiple tabs.
    text: []
  - id: FRRN.001.02
    title: Login and Role-Based Access
    text:
    - The system shall allow the user to log in using a valid profile.
    - The system shall enforce role-based access control, ensuring that each user only sees and interacts with features
      assigned to their role by the System Administrator.
    - User - Can manage only records assigned to them.
    - Team Lead/ Team Head/ Unit Head - Can manage records assigned to them and to users within their reporting hierarchy.
  - id: FRRN.001.03
    title: Inactivity Warning
    text:
    - The system shall monitor user activity and display an inactivity warning after 15 minutes of no interaction.
    - The warning shall prompt the user to either stay logged in or log out.
    - Message – “You have been inactive for 15 minutes. For your security, your session is about to expire. Would you like
      to stay logged in or log out?”
    - 'The warning dialog shall display two buttons:'
    - “Stay Logged In” – keeps the current session active and resets the inactivity timer.
    - “Log Out” – terminates the session and securely logs the user out of the system.
  - id: FRRN.001.04
    title: Session Timeout Warning
    text:
    - The system shall notify the user 30 minutes after inactivity that the session automatically ended due to timeout.
    - The warning message shall clearly state: “Your session timed out. Please log in again to continue”
    - The notification shall display a “Log In” button that redirects the user to the system login page.
- id: FRRN.002
  screen: Renewal Landing Page
  capability: Marketing Dashboard and Renewal Account Listing
  items:
  - id: FRRN.002.01
    title: Renewal Module
    text:
    - The system shall provide a dedicated Renewal Module that manages the end-to-end renewal process, including identification,
      classification, assignment, tracking, and processing of renewal accounts accessible via the main system menu.
    - 'The module shall display:'
    - Renewal account listings (per bucket)
    - Filters and search tools
    - Report extraction
    - Document upload facility
    - LAMD Reports
    - Insurer Disposition
    - Account Update
    - Insurer Placement Report
    - Hold Cover Response
  - id: FRRN.002.02
    title: Dashboard Visibility
    text:
    - The system shall provide a Dashboard that delivers real-time visibility into renewal operations based on role.
    - The dashboard shall provide summary KPIs, operational statistics, trend indicators, and monitoring information through
      dashboard cards, tables, and grids.
    - The dashboard shall support drill-down capabilities enabling users to view detailed transaction information from any
      dashboard metric, count, amount, chart, card, or table.
    - 'The system shall provide dashboard filters including:'
    - Period From Date
    - Period To Date
    - Market Segment
    - Account Officer
    - The dashboard shall refresh dynamically based on the selected filters.
    - 'The marketing drill-down screen shall display the following information at a minimum:'
    - Reference Number
    - Invoice Number
    - Expiring Invoice Number
    - Assured's Name
    - Product Line
    - Risk Code
    - Premium
    - Commission
    - Renewal Status
    - Assigned User
    - Insurer Disposition
    - Insurer Remarks
  - id: FRRN.002.02.01
    title: Basic Premium and Gross Commission
    text:
    - The dashboard shall display production metrics.
    - Information Displayed
    - Basic Premium
    - Actual
    - Budget
    - '% vs Budget (Current Actual YoY/ Current Budget YoY) x 100'
    - 'Variance: Difference of Actual - Budget'
    - 'Growth: (Previous Actual YoY/ Current Budget YoY) x 100'
    - 'Adjustments: Sum of Adjusted amount'
    - Gross Commission
    - Actual
    - Budget
    - '% vs Budget'
    - 'Variance: Difference of Actual - Budget'
    - 'Growth: (Previous Actual YoY/ Current Budget YoY) x 100'
    - 'Adjustments: Sum of Adjusted amount'
    - Users shall be able to click Show Details to view the underlying transactions.
  - id: FRRN.002.02.02
    title: Pipeline Summary
    text:
    - The dashboard shall display a Pipeline Summary section showing workload and account movement across processing stages.
    - Pipeline Categories
    - New
    - Organic
    - Submitted
    - Renewal
    - Deferred
    - Workflow Stages
    - For Survey
    - For Proposal
    - For Confirm
    - For Booking
    - For Delivery
    - Metrics Displayed
    - 'Count:'
    - Count of Accounts per Status
    - 'Premium:'
    - Sum (Premium Amount) for all accounts in the selected pipeline stage
    - 'Commission:'
    - Sum (Commission Amount) for all accounts in the selected pipeline stage
    - The system shall calculate totals for all pipeline stages.
    - Users shall be able to click on any count or total to view the associated accounts.
  - id: FRRN.002.02.03
    title: Outstanding Renewal Accounts
    text:
    - The dashboard shall display outstanding renewal accounts during the aging period.
    - Aging Buckets
    - Prior Month
    - Current Month
    - +1 Month
    - +2 Months
    - Total
    - Metrics
    - 'Count:'
    - Number of renewal accounts not yet renewed/booked
    - 'Premium:'
    - Sum of Premium Amount for outstanding renewal accounts
    - 'Commission:'
    - Sum of Commission Amount for outstanding renewal accounts
    - Users shall be able to drill down into each aging category.
  - id: FRRN.002.02.04
    title: Closing Ratio
    text:
    - The dashboard shall display renewal conversion metrics.
    - Categories
    - New
    - Organic
    - Submitted
    - Renewal
    - Deferred
    - Metrics
    - In-Process Pipeline
    - Accounts that are in Tier 3
    - Posted Pipeline
    - Accounts that are in Tier 2
    - Booked
    - Accounts successfully booked/ Tier 1
    - Closing Ratio (%)
    - (Booked Accounts / Total Accounts) X 100
    - Users shall be able to view the accounts contributing to each ratio.
  - id: FRRN.002.02.05
    title: Biggest Open Deals
    text:
    - The dashboard shall display the largest open opportunities.
    - Information Displayed
    - Ranking
    - Account Number
    - Assured Name
    - Risk Code
    - Business Type
    - Team
    - Premium Amount
    - Commission Amount
    - Viewing Options
    - Top 50
    - Top 75
    - Top 100
    - Users shall be able to navigate directly to the account details.
  - id: FRRN.002.02.06
    title: Renewal Persistency Ratio
    text:
    - The dashboard shall display renewal persistency performance.
    - Periods
    - Current
    - -1 Month
    - -2 Month
    - -3 Month
    - -4 Month
    - -5 Month
    - -6 Month
    - YTD
    - Metrics
    - Count
    - (Renewed Accounts / Total Renewable Accounts) x 100
    - Premium
    - (Renewed Premium / Total Renewable Premium) x 100
    - Commission
    - (Renewed Commission / Total Renewable Commission) x 100
  - id: FRRN.002.02.07
    title: Product Mix
    text:
    - The dashboard shall display production distribution by product line.
    - Information Displayed
    - Product Line
    - Count
    - Premium
    - Commission
  - id: FRRN.002.02.08
    title: Insurer Renewal Remarks
    text:
    - The system shall display an Insurer Renewal Approval Monitoring table for the selected reporting period.
    - The organization's hierarchy displayed shall depend on the Market Segment selected.
    - Information Displayed
    - Market Segment
    - Total Renew As Is
    - Represents all renewal accounts identified as renewal opportunities within the selected reporting period.
    - Count of Accounts where Renewal Disposition = “For Renewal”
    - Insurer Approved
    - Count of Accounts where Insurer Disposition = “Approved”
    - Pending for Insurer Approval
    - Count of Accounts with no Insurer Disposition yet
    - Return to Marketing
    - Count of Accounts where Insurer Disposition is not “Approved” (either rejected or with revisions)
    - '% of Approval'
    - '% Approval = Insurer Approved / Total Renew As Is × 100'
    - The dashboard shall display a separate table showing Pending for Insurer Approval accounts grouped by insurer.
    - Information Displayed
    - Insurer Name
    - Number of Pending Accounts
    - Count of Accounts with no Insurer Disposition yet
  - id: FRRN.002.02.09
    title: KPI Summary Cards
    text:
    - The system shall display KPI summary cards to provide users with visibility of key renewal, operational, payment,
      and exception metrics.
    - Users shall be able to click on any KPI card and view the corresponding accounts.
    - 'The system shall display the following Marketing Renewal KPI Cards:'
    - Total Expiring
    - Displays the total number of expiring accounts within the selected reporting period.
    - 'For Disposition:'
    - Displays the total number of Accounts without Disposition yet
    - 'For Renewal:'
    - Displays the total number of Accounts with “For Renewal” Disposition
    - 'For Quotation/ Proposal:'
    - Displays the total number of Accounts with “For Quotation/ Proposal” Disposition
    - 'Not for Renewal:'
    - Displays the total number of Accounts with “Not for Renewal” Disposition
    - 'Renewed:'
    - Displays the total number of Accounts already renewed/booked
    - 'Unrenewed:'
    - Displays the total number of Accounts not yet renewed/booked
    - Returned Accounts
    - Count of Accounts with Status = “Returned”.
    - Display the returned date and return reason in the drilldown
    - Cancelled
    - Count of Accounts with Status = Cancelled
    - Display the cancellation date and reason in the drilldown
    - Adjustments
    - Count of Accounts with adjustments
    - Display adjustment type (financial/ non-financial) in the drilldown
    - Bounced Check
    - Count of Bounced Checks received from Cashiering
    - Display check number, bank name, and bounced date in the drilldown
    - Unapplied Payment
    - Count of Unapplied Payment Transactions
    - Refund
    - Count of Refund Transactions
    - Display amount, refund date, and category (Excess Payment Refund/ Cancellation Refund) in the drilldown
    - Expiring Hold Cover
    - Count of accounts with hold cover expiring within the next 7 days.
    - 'Users shall be able to:'
    - Search
    - Filter
    - Sort
    - Export
    - Open Account Details
  - id: FRRN.002.05
    title: Renewal Account Bucket List
    text:
    - 'The system shall display renewal records in four distinct panels, each representing a classification bucket:'
    - Clean Panel
    - Review Panel
    - Non-Renewable Panel
    - All
    - Shall display the Renewal accounts from previous years, including both booked and unbooked accounts.
    - Shall display the Renewal accounts for the current year.
    - Each panel shall display only the records assigned to its respective classification.
    - 'Each classification panel shall:'
    - Display records in a table/grid format
    - 'Include consistent columns across all panels, such as:'
    - Expiring Invoice Number
    - Renewal Reference Number
    - With Claim
    - Invoice Number
    - Assured's Name
    - Client
    - Expiry Date
    - Sum Insured
    - Premium Rate
    - Premium
    - Commission Rate
    - Commission Amount
    - Mailing Address
    - Mortgaged (Y/N)
    - Renewal Status
    - Renewal Disposition
    - Assigned User
    - Upon selection of a specific record, the system shall display the renewal account details.
  - id: FRRN.002.06
    title: Column Filtering and Search
    text:
    - 'The system shall provide:'
    - A global search box
    - Support keywords and phrases
    - Search across all columns
    - Column-level filters (dropdowns or text inputs)
    - Each column shall support individual filtering.
    - Sorting
    - Default is ascending
    - The system shall allow users to enter partial or complete values.
    - The system shall return matching accounts based on the search criteria.
  - id: FRRN.002.07
    title: Export, Save, and Print
    text:
    - The system shall allow users to export and print every drilldown list using an Export button.
    - 'Once clicked, the system shall display a preview of the generated list and provide options to:'
    - Download as .xlsx and save file to a preferred local destination
    - Print the list
    - The system shall display a print preview screen before printing.
    - 'The system shall allow configuration of:'
    - Page size
    - Orientation (portrait/landscape)
    - Margins
    - 'The exported file shall:'
    - Match the displayed list
    - Include all visible columns
    - Reflect applied filters
- id: FRRN.003
  screen: Dashboard
  capability: Processing Dashboard and Account Listing
  items:
  - id: FRRN.003.01
    title: Processing Dashboard Visibility
    text:
    - 'The system shall provide a Processing Dashboard that displays operational workload, processing progress, policy issuance
      status, booking status, and placement performance for both:'
    - New Business Accounts
    - Renewal Accounts
    - The dashboard shall provide a consolidated view of accounts currently being processed and completed within the production
      workflow.
    - The dashboard shall support the following using dashboard filters.
    - Combined View (New Business + Renewal)
    - New Business View
    - Renewal View
    - 'The system shall provide filtering options including:'
    - Business Type
    - New Business
    - Renewal
    - All
    - Period From Date
    - Period To Date
    - Unit/Market Segment
    - Account Officer
  - id: FRRN.003.02
    title: Processing KPI Cards
    text:
    - 'The system shall display the following KPI Cards:'
    - For Placement
    - Count of Accounts where Current Status = "Submitted for Placement"
    - For Booking
    - Count of Accounts already submitted for placement but not yet booked.
    - With Policy
    - Displays count of accounts with policy numbers already received and recorded.
    - Without Policy
    - Displays count of accounts with no policy received yet from insurers
    - For Releasing
    - Count of Accounts where Current Status = "For E-Policy Sending"
    - Released Policy
    - Count of Policies successfully sent
    - Unreleased Policy
    - Count of Policies unsuccessfully sent
    - Directly Booked
    - Count of Accounts with tagging “Direct Booking”
    - Returned Accounts
    - Count of Accounts with Status = “Returned”.
    - Display the returned date and return reason in the drilldown
    - All Processing Dashboard KPI Cards shall support drill-down functionality.
    - Users shall be able to click any KPI card and view the corresponding accounts.
    - 'Users shall be able to:'
    - Search
    - Filter
    - Sort
    - Export
    - Open Account Details
  - id: FRRN.003.02.01
    title: For Placement Details
    text:
    - 'When the user clicks the For Placement KPI card, the system shall display two tabs:'
    - Assigned
    - Display accounts assigned to a Placement Processor.
    - Unassigned
    - Accounts that are not yet assigned to any Processor.
    - 'Both tabs will display the following information:'
    - Account Reference Number
    - BDOI Branch
    - Unit Head
    - Account Officer
    - Assured's Name
    - Insurer
    - Inception Date
    - Expiry Date
    - Date Posted
    - Date when the account is approved and submitted for placement
    - Processor
    - Blank if Unassigned
    - Name of the Processor if Assigned
    - Insurance Line
    - Aging (Days)
    - No. of business day from “Submitted for Placement” date
    - When an account is selected, the system shall display the renewal account details.
  - id: FRRN.003.02.02
    title: For Booking Details
    text:
    - 'When the user clicks the For Booking KPI card, the system shall display the following information:'
    - Account Reference Number
    - BDOI Branch
    - Unit Head
    - Account Officer
    - Assured’s Name
    - Insurer
    - Inception Date
    - Expiry Date
    - Placement Date
    - Date when the placement is sent to the insurer
    - Processor
    - Insurance Line
    - Aging (Days)
    - No. of business day from submission of placement to insurer
    - When an account is selected, the system shall display the renewal account details.
  - id: FRRN.003.02.03
    title: With/ Without Policy Details
    text:
    - 'When the user clicks the With Policy or Without Policy KPI card, the system shall display the following information:'
    - Department
    - Assured's Name
    - Reference No.
    - Insurer
    - Risk Code
    - Inception Date
    - Expiry Date
    - Processed Date
    - Date when the placement is submitted to the insurer
    - Booking Date
    - Date when the placement is approved by the insurer
    - Unit Head
    - Account Officer
    - Processor
    - Sum Insured
    - Basic Premium
    - Commission
    - Policy Number
    - Market Segment
    - Month
    - Policy Status
    - Pending
    - Received
    - Spoiled
    - Canceled
    - With Issue
    - Placement Aging
    - No. of business day from submission of placement to insurer
    - Policy Delivery Date
    - Policy Delivery Aging (No. of Days)
    - TAT Status
    - Within TAT
    - Beyond TAT
    - Placement Issue
    - Placement Issue Resolution Date
    - When an account is selected, the system shall display the renewal account details.
  - id: FRRN.003.02.04
    title: For Releasing/ Released/ Unreleased Details
    text:
    - 'When the user clicks the For Releasing or Released or Unreleased KPI card, the system shall display the following
      information:'
    - Department
    - Assured's Name
    - Reference No.
    - Insurer
    - Risk Code
    - Inception Date
    - Expiry Date
    - Processed Date
    - Date when the placement is submitted to the insurer
    - Booking Date
    - Date when the placement is approved by the insurer
    - Unit Head
    - Account Officer
    - Processor
    - Sum Insured
    - Basic Premium
    - Commission
    - Policy Number
    - Market Segment
    - Month
    - Policy Transmittal Status
    - Sent
    - Pending
    - Unsuccessful
    - Policy Received Date
    - Policy Transmittal Date
    - Policy Delivery Aging (No. of Days)
    - TAT Status
    - Reason for Reject
    - When an account is selected, the system shall display the renewal account details.
  - id: FRRN.003.02.05
    title: Direct Booking Details
    text:
    - 'When the user clicks the Direct Booking KPI card, the system shall display the following information:'
    - Account Reference Number
    - BDOI Branch
    - Unit Head
    - Account Officer
    - Assured's Name
    - Insurer
    - Inception Date
    - Expiry Date
    - Date Posted
    - Date when the account is approved and submitted for placement
    - Processor
    - Insurance Line
    - When an account is selected, the system shall display the renewal account details.
  - id: FRRN.003.02.06
    title: Returned Account Details
    text:
    - 'When the user clicks the Returned Account KPI card, the system shall display the following information:'
    - Account Reference Number
    - BDOI Branch
    - Unit Head
    - Account Officer
    - Assured's Name
    - Insurer
    - Inception Date
    - Expiry Date
    - Date Posted
    - Date when the account is approved and submitted for placement
    - Processor
    - Insurance Line
    - Reason for Return
    - When an account is selected, the system shall display the renewal account details.
  - id: FRRN.003.03
    title: Column Filtering and Search
    text:
    - 'The system shall provide:'
    - A global search box
    - Support keywords and phrases
    - Search across all columns
    - Column-level filters (dropdowns or text inputs)
    - Each column shall support individual filtering.
    - Sorting
    - Default is descending
    - The system shall allow users to enter partial or complete values.
    - The system shall return matching accounts based on the search/filter criteria.
  - id: FRRN.003.04
    title: Export, Save, and Print
    text:
    - The system shall allow users to export and print every drilldown list using an Export button.
    - 'Once clicked, the system shall display a preview of the generated list and provide options to:'
    - Download as .xlsx and save file to a preferred local destination
    - Print the list
    - The system shall display a print preview screen before printing.
    - 'The system shall allow configuration of:'
    - Page size
    - Orientation (portrait/landscape)
    - Margins
    - 'The exported file shall:'
    - Match the displayed list
    - Include all visible columns
    - Reflect applied filters
- id: FRRN.004
  screen: Renewal List
  capability: Generate List of Expiring Accounts
  items:
  - id: FRRN.004.01
    title: Generate RMEL Modal
    text:
    - The system shall provide a Generate RMEL Modal that allows users to generate an RMEL (Renewal Master Expiry List)
      by entering the required information and submitting the request.
    - When the user clicks Generate RMEL on the Renewal Dashboard, the system shall display the Generate RMEL modal.
    - 'The modal shall allow the following:'
    - Date Range selection
    - Filter Management
    - Sorting functionality
    - 'The modal shall display the following buttons:'
    - Generate
    - Cancel – close the modal without saving any data.
  - id: FRRN.004.02
    title: Date Range Selection
    text:
    - The system shall allow users to select and modify a date range (month, day, year) to generate the list of expiring
      accounts.
    - The system shall provide date picker fields for Start Date and End Date.
    - The system shall allow selection of month, day, and year.
    - The system shall allow users to modify the selected date range at any time before or after list generation.
    - 'The system shall validate date inputs to ensure:'
    - Start Date is not later than End Date.
  - id: FRRN.004.03
    title: Filter Management
    text:
    - The system shall provide filtering capabilities to refine the list of expiring accounts.
    - The system shall provide filter functionality.
    - All available fields
    - 'Each filter shall support:'
    - Single selection
    - Multiple selection
    - “Select All”
    - “All Except” selection
    - 'The system shall provide filter management actions:'
    - Apply - Applying filters shall update the list immediately.
    - Cancel - Canceling filters shall revert to the previous filter state.
    - Clear - Clearing filters shall reset all filters and display the full list.
  - id: FRRN.004.04
    title: Generate Action
    text:
    - Upon clicking the Generate button,
    - The system shall identify and include relevant accounts in the generated list based on the selected date range and
      applied filter criteria.
    - 'The system shall include:'
    - Expired accounts with no linked new renewal account
    - Booked accounts expiring within the selected date range
    - Free-First Year accounts with In Process status
    - The system shall display an informative message when no accounts match the selected date range.
    - 'Message: “No records found.”'
    - The system shall automatically create a renewal account for each account included in the generated expiry list.
    - 'Upon successful creation of accounts, the system shall:'
    - 'Display a success message: “Generation of RMEL successful!”'
    - Close the modal.
    - Display the newly created records in the Renewal Account Bucket List – All panel.
    - If generation fails due to a system error, the system shall display an appropriate error message and prevent record
      creation.
    - 'The system shall ensure that:'
    - Each renewal account is linked to its original account (latest cover version).
    - Relevant data from the original account is carried over.
    - The system shall assign a sequential unique identifier to each renewal account.
    - 'Each created renewal account shall have a default renewal disposition: “For Disposition” and renewal status: “In
      Process Renewal”.'
    - 'The system shall allow users to:'
    - View newly created renewal accounts
    - Access and edit renewal account details.
    - The system shall not use pagination.
    - The system shall ensure that all columns are populated where data is available.
    - The system shall ensure no data truncation or missing rows.
  - id: FRRN.004.06
    title: Endorsement Synchronization Prior to Renewal Booking
    text:
    - The system shall identify endorsements associated with the expiring (mother) policy.
    - 'The system shall consider endorsements that are:'
    - Issued before renewal generation.
    - Issued after renewal generation but prior to renewal placement/booking.
    - Approved or processed while the renewal account is still in progress.
    - The system shall provide a Refresh Endorsements action allowing authorized users to retrieve the latest endorsement
      information from the mother policy.
    - The system shall compare the following to determine whether endorsement updates are pending synchronization.
    - Current mother policy information
    - Renewal account information
    - 'Upon refresh, the system shall:'
    - Re-evaluate endorsement changes.
    - Update renewal information.
    - Recalculate premiums when applicable.
  - id: FRRN.004.06
    title: Export, Save, and Print
    text:
    - The system shall allow users to export and print the generated list using an Export button.
    - 'Once clicked, the system shall display a preview of the generated list and provide options to:'
    - Download as .xlsx and save file to a preferred local destination
    - Print the list
    - The system shall display a print preview screen before printing.
    - 'The system shall allow configuration of:'
    - Page size
    - Orientation (portrait/landscape)
    - Margins
    - 'The exported file shall:'
    - Match the displayed list
    - Include all visible columns
    - Reflect applied filters
    - File Name Convention
    - RMEL_<MMM>_<YYYY>_<MMDDYYYY>.xlsx
    - 'Where:'
    - RMEL is constant
    - <MMM> = expiry month
    - <YYYY> = expiry year
    - <MMDDYYYY> = date of extraction
- id: FRRN.005
  screen: Account Creation
  capability: Manual Account Creation
  items:
  - id: FRRN.005.01
    title: Manual Account Creation
    text:
    - The system shall provide a Create Renewal Account function accessible to authorized users.
    - The system shall allow users to search and select an expiring account and link it to the renewal account.
    - Client linked to the expiring account shall be linked to the new renewal account.
    - Upon selecting an expiring account, the system shall automatically populate the Renewal Account with information from
      the expiring account.
    - Inception Date
    - One day after the expiry date of the expiring account
    - Expiry Date
    - One year after the new inception date
    - The system shall allow users to update renewal-specific details.
    - The system shall validate all required information before allowing the Renewal Account to be saved.
    - 'Upon successful validation, the system shall:'
    - Create the Renewal Account.
    - Generate a Renewal Account Number.
    - Establish a link to the Client Record.
    - Establish a link to the Expiring Account.
    - Record the creator and creation date.
    - All the manually created renewal account will be included in the Renewal list for auto sanitation, assignment, and
      bucket classification.
    - See Annex A for Renewal Fields
- id: FRRN.006
  screen: Account Creation
  capability: Duplicate Checking
  items:
  - id: FRRN.006.01
    title: Duplicate Account Checking
    text:
    - The system shall automatically perform duplicate validation whenever an account is being created or generated or updated.
    - The system shall identify potential duplicate accounts using the following criteria.
    - Client Number
    - Risk Code
    - PN (CBG Home)
    - Expiring Policy Number
    - The applicable duplicate criteria shall be configurable by product line of insurance.
    - The system shall identify an exact duplicate when all configured duplicate criteria match an existing account.
    - The system shall identify a Potential Duplicate when one or more duplicate criteria match an existing account.
    - For manually created accounts and account updates, the system shall display a warning message when a potential duplicate
      record is identified.
    - 'Message: “Potential Duplicate Account Detected'
    - A similar account was found based on the configured duplicate validation criteria.
    - 'Click here to review the possible duplicate account:'
    - '[Duplicate Account Link]'
    - Please review before proceeding.”
    - Available Actions
    - Open Duplicate Account
    - Update Details
    - Cancel Transaction
    - If Update Details is clicked, the system shall allow the user to update the renewal account details to resolve duplicate
      issue.
    - If Cancel Transaction is clicked, the account will not be saved after the user confirms to discard all inputs.
    - For automatically generated accounts with a potential duplicate, the system shall assign the Bucket Classification
      "For Review" and set the Reason field to "Potential Duplicate Account - [Duplicate Account Link]".
    - The account link shall provide direct navigation to the matching account.
    - The system shall allow creation of accounts that match an existing account when the matching account has a status
      of “Cancelled”.
    - Duplicate validation shall still be performed and displayed to the user; however, the system shall not prevent creation
      solely because the matching account is cancelled.
    - 'Warning Message: "A matching account was found with a status of Cancelled. Account creation may proceed."'
    - See Annex B for Additional Duplicate Checking Criteria
- id: FRRN.007
  screen: Account Sanitation
  capability: Account Sanitation and Validation
  items:
  - id: FRRN.007.01
    title: Sanitation Execution
    text:
    - 'The system shall automatically perform sanitation checks upon:'
    - Renewal account creation
    - Renewal account updates (individual/upload)
    - The system shall enforce sanitation as a mandatory preprocessing step, ensuring that no record proceeds to classification,
      routing, or renewal workflows unless it has undergone sanitation.
    - The system shall maintain a Sanitation Rule Engine configurable via UI.
  - id: FRRN.007.02
    title: Sanitation Rules (For All Market Segment)
    text:
    - Data Completeness Check
    - The system validates the presence of mandatory fields.
    - If complete, the system shall proceed to the next validation. If not, flag as Review Record.
    - Risk Code Filtering
    - The system shall check if the risk code is tagged as renewable or non-renewable.
    - If renewable, then proceed to the next validation.
    - If non-renewable, the system shall automatically tag the Renewal Disposition as “Not for Renewal”.
    - 'Disposition Reason: Non-Renewable Account'
    - The system shall exclude accounts associated with non-renewable risk codes from the assignment list and include them
      in the Non-Renewable bucket.
    - If risk code is not found in configuration, then flag as Review Record with Reason “Risk Code is not maintained as
      Renewable/Not Renewable”.
    - Product Line Filtering
    - The system shall check if the product line is either a Personal Accident or Group Personal Accident.
    - Classify as Clean
    - 'Disposition: “For Proposal”'
    - Endorsement
    - The system shall validate endorsements associated with the expiring policy.
    - The system shall verify that all approved endorsements are reflected in the renewal account and mother policy.
    - Records with endorsements shall be routed to the Review bucket.
    - Claims
    - The system shall validate claims associated with the expiring policy.
    - 'The system shall determine whether the policy has:'
    - Open claims
    - Pending claims
    - Closed claims
    - Total loss claims
    - Policies with active or unresolved claims shall be routed to the Review bucket.
    - 'Policies with “Total Loss” claims Settlement tagging shall be classified as “Not for Renewal” with Disposition reason:
      Total Loss Claim and included in the Non-Renewable Bucket.'
    - TSI Threshold
    - The system shall evaluate the Total Sum Insured (TSI) of each policy against predefined financial thresholds.
    - Automatically classify policies with TSI values less than or equal to the configured threshold (e.g., 250 million)
      as Clean Record.
    - Identify policies with TSI values exceeding the defined threshold and classify them as Clean Record with “For Quotation”
      disposition.
    - Automatically route such policies to TSU Queue for proposal processing.
    - Once quotation is available, update the classification to Review.
    - See Annex C for Sanitation Rules per Market Segment
- id: FRRN.008
  screen: Account Classification
  capability: Bucket Classification
  items:
  - id: FRRN.008.01
    title: Bucket Classification
    text:
    - The system shall automatically classify the generated renewal records into predefined rule-based buckets (Clean, Review,
      Non-Renewable) to enable prioritization, streamline straight-through processing, and isolate non-compliant records.
    - 'The system shall automatically classify renewal records into the following buckets:'
    - Clean
    - No data issues
    - No endorsements
    - No claims requiring review
    - No rates/terms and conditions changes
    - Paid premium
    - Single Insurer
    - Meets all eligibility requirements
    - Personal Accident or Group Personal Accident (For Proposal)
    - TSI > 250M (For Quotation (initial))
    - Review
    - Missing or inconsistent information
    - With Endorsements
    - With Claims
    - With “For Revision” Insurer Disposition
    - TSI > 250M (For Proposal (once quotation is available))
    - Non-packages with risk code mapping
    - Non-Renewable
    - Non-packages with no risk code mapping
    - Total Loss Claims (Not for Renewal)
    - Non-renewable Risk Codes (Not for Renewal)
    - For renewal accounts in the Clean bucket, the system shall update the following details.
    - 'Renewal Disposition: For Renewal'
    - 'Except for: TSI > 250M (For Quotation (initial))'
    - Renewal Status
    - 'CBG: For RA Generation'
    - 'Non- CBG: Posted'
    - Classification shall occur immediately after data sanitation and validation.
    - 'The system shall assign bucket classification strictly based on defined rules, including:'
    - Sanitation results
    - Matching outcomes
    - Eligibility criteria
    - Dynamic Reclassification
    - 'The system shall automatically move records between buckets when underlying conditions change, such as:'
    - Updates to validation results
    - Resolution of exceptions
    - Changes in eligibility status
    - Manual Reclassification
    - The system shall allow authorized users to update the renewal account classification and require a mandatory justification
      for any reclassification.
- id: FRRN.009
  screen: Account Details
  capability: Automatic Renewal Information Update
  items:
  - id: FRRN.009.01
    title: Automatic Renewal Information Update
    text:
    - The system shall automatically retrieve, calculate, and update CBG Motor renewal account information after the Renewal
      Account has been created using the information provided in the Annex.
    - Risk Code / Premium Rate
    - Account Type
    - BDOI Reference Number
    - New Insurer
    - New Inception Date
    - New Expiry Date
    - New OD/Theft Coverage
    - New BI Coverage
    - New PD Coverage
    - New OD/Theft Premium
    - New BI Premium
    - New PD Premium
    - Auto PA Premium
    - Basic Premium
    - DST (Documentary Stamp Tax)
    - VAT
    - LGT
    - Other Charges
    - Total Premium
    - For CBG Home and Non-CBG accounts, the system shall automatically update the following fields.
    - See Annex D for CBG Motor Automatic Field Update Details
    - See Annex E for Automatic Field Update Details (Auto Promo to Regular)
- id: FRRN.010
  screen: Assignment
  capability: Auto Assignment and Reassignment of Accounts
  items:
  - id: FRRN.010.01
    title: Auto Assignment Capability
    text:
    - For Marketing, the system shall support automatic assignment of accounts to users based on teams and sub teams.
    - If there are multiple AOs assigned to a specific sub team/ location, the system shall distribute the accounts evenly
      (round robin/ workload balancing)
    - For Processing, the system shall support round robin/ workload balancing automatic assignment.
    - Auto assignment shall take place after sanitation and account classification.
    - Users have visibility into records that are assigned to them, based on their role and hierarchical access level.
    - User - Can manage only records assigned to them.
    - Team Lead/ Team Head/ Unit Head - Can manage records assigned to them, including records assigned to users within
      their respective team or reporting hierarchy.
    - See Annex F for Auto Assignment Logic Per Market Segment
  - id: FRRN.010.02
    title: Manual Renewal Account Reassignment Capability
    text:
    - The system shall allow users to select accounts for reassignment within the same Department.
    - 'The system shall support:'
    - Single selection
    - Multiple selection
    - Select all
    - Select all except specific accounts
    - Deselect previously selected accounts
    - The system shall allow users to select a user for assignment.
    - 'The system shall provide:'
    - Search functionality by name
    - A dropdown list displaying the users available based on their assigned access rights and organizational hierarchy.
    - The system shall allow users to reassign selected accounts to the chosen user using the Assign button.
    - Upon assignment, the system shall update the account ownership details.
- id: FRRN.011
  screen: Renewal Account Transfer
  capability: Account Transfer Request for New Business Opportunity Creation
  items:
  - id: FRRN.011
    title: Account Transfer Request for New Business Opportunity Creation
    text:
    - The system shall allow authorized users to create a transfer request to another Market Segment when an account is
      identified as a potential New Business opportunity for another segment.
    - Unlike a standard account transfer, the original renewal account shall remain under the ownership of the current Marketing
      Unit and Account Officer. The receiving Marketing Unit shall review, approve, and accept the transfer request and,
      upon acceptance, create a new New Business account using information copied from the renewal account.
    - The transfer request shall serve as an opportunity for endorsement and referral mechanisms between Marketing Units.
  - id: FRRN.011.01
    title: Initiate Transfer Request
    text:
    - The system shall allow authorized users to initiate a transfer request from a renewal account.
    - 'Button: Transfer to Other Unit'
    - The system shall allow the user to review the complete renewal account information before submission.
    - The system shall allow the user to select the target Marketing Unit from a dropdown list.
    - The system shall not allow selection of the same Marketing Unit as the originating unit.
    - The system shall require the requesting user to provide business justification for the transfer request.
    - The system shall allow authorized users to submit the transfer request.
    - 'Upon submission, the system shall:'
    - Generate a Transfer Request Number.
    - Store the request information.
    - Route the request to the receiving Marketing Unit.
    - Update the request status to Pending Acceptance
    - The transfer request shall create a referral opportunity and shall not update ownership of the original renewal account.
  - id: FRRN.011.02
    title: Receiving Unit Review/ Approval
    text:
    - The receiving Marketing Unit shall be able to review the transfer request.
    - 'The receiving unit shall be able to:'
    - Accept
    - Record the accepting user.
    - Record acceptance date and time.
    - Update the transfer status to Accepted
    - Reject
    - Require justification/remarks
    - Update the transfer status to Rejected
    - Return for Clarification
    - Require remarks
    - Update the transfer status to Returned
  - id: FRRN.011.03
    title: Creation of New Business Account
    text:
    - Upon acceptance of the transfer request, the system shall create a New Business account using information copied from
      the renewal account.
    - The receiving unit shall be allowed to modify the copied information before saving the New Business account.
    - Route to New Business workflow
  - id: FRRN.011.04
    title: Transfer Request Monitoring
    text:
    - The system shall provide a Transfer Request Monitoring screen.
    - Information Displayed
    - Transfer Request Number
    - Renewal Account Number
    - Assured's Name
    - Source Marketing Unit
    - Receiving Marketing Unit
    - Request Date
    - Transfer Status
    - Draft
    - Pending Acceptance
    - Accepted
    - Rejected
    - Returned for Clarification
    - Accepted By
    - New Business Account Number
    - All transfer requests, acceptance, and New Business account creation activities shall be fully auditable and traceable.
  - id: FRRN.011.05
    title: Notifications
    text:
    - 'The system shall generate notifications when:'
    - A transfer request is submitted.
    - Transfer requests are accepted.
    - The transfer request has been rejected.
    - The transfer request is returned for clarification.
- id: FRRN.012
  screen: Renewal Home
  capability: LAMD, BDOFC, and BDOSOLD Report Upload
  items:
  - id: FRRN.012.01
    title: LAMD Reports Upload
    text:
    - The system shall display a “LAMD Report Upload” button on the Renewal landing page.
    - Upon clicking the button, the system shall display a pop-up where the user will select which LAMD type to be uploaded.
    - CBG Loans excluding Personal
    - List of Paid Off Accounts
    - After selecting the LAMD Type, the user shall select the file to be uploaded.
    - 'The system shall support predefined file formats (Example: Excel/ CSV).'
    - 'The system shall validate the uploaded file for:'
    - Correct format and structure
    - Required fields (For All)
    - PN Number
    - Officer (AO Code) PN
    - Additional Required Field (For Motor)
    - Serial Number
    - Motor Number
    - The system shall process and save the following details from the uploaded CBG Loans excluding Personal report immediately
      upon successful upload.
    - PN Number
    - Book Date
    - Maturity Date
    - Logical Branch Description PN
    - Product Type Description
    - Officer (AO Code) PN
    - Email Address
    - Mailing Address
    - Serial Number
    - Motor Number
    - The system shall process and save the following details from the uploaded List of Paid Off Accounts report immediately
      upon successful upload.
    - PN Number
    - IBG/ CBG Tag
    - Product Type Description
    - Email Address
    - Mailing Address
    - Serial Number
    - Motor Number
    - 'The system shall provide real-time feedback:'
    - Upload in progress
    - Upload completed
    - Upload failed
    - 'The system shall display success/error messages:'
    - 'Upload and Processing Complete: “LAMD report is successfully processed. Records have been matched and updated accordingly.”'
    - 'Invalid File Format: “Upload failed. Invalid file format. Please upload a supported file type (.xlsx or .csv).”'
    - 'Missing Required Data: “Upload failed. The file is missing required fields (e.g., PN, account status). Please verify
      and try again.”'
    - 'Corrupted or Unreadable File: “Upload failed. The file is corrupted or cannot be read.”'
    - 'Processing Error: “Upload successful, but an error occurred during processing. Please review logs or contact support.”'
    - See Annex G for LAMD Upload File Details
  - id: FRRN.012.02
    title: LAMD Record Matching
    text:
    - 'The system shall match loan records from LAMD reports with RMEL accounts using:'
    - 'CBG Home:'
    - Promissory Note (PN) Number
    - CBG Motor
    - Promissory Note (PN) Number
    - Serial Number
    - Motor Number
    - The system shall evaluate matched records to determine renewal eligibility based on the sanitation rules.
  - id: FRRN.012.03
    title: LAMD Report Upload Outcome Summary
    text:
    - The system shall display a file-level upload summary in tabular format showing each uploaded report and its processing
      outcome.
    - 'The table shall be:'
    - Scrollable
    - Filterable
    - Paginated
    - 'The system shall include the following columns:'
    - Upload ID (unique identifier per upload)
    - File Name
    - Upload Date and Time
    - 'Upload Status:'
    - Successful
    - Failed
    - Partially Successful
    - 'Reason/Remarks:'
    - Description of failure or partial processing
    - Action
    - Download Processing Result
    - Each uploaded file shall be recorded as a separate row.
    - The system shall display the latest uploads at the top (default sorting).
    - Clicking a row shall allow users to view detailed record-level results.
    - 'The system shall provide search functionality for:'
    - File name (file-level)
    - 'The system shall allow filtering by:'
    - Processing Status (Success / Failed)
    - The system shall allow the user to download the Processing Result in excel format.
    - 'Filename: LAMD Processing Result_ MMDDYYYY.xlsx where MMDDYYYY is the upload date.'
  - id: FRRN.012.04
    title: Record-Level Summary View
    text:
    - The system shall provide a detailed view of each upload showing individual record processing results.
    - 'The system shall display records in a:'
    - Scrollable grid
    - Paginated table
    - 'Each record shall include:'
    - PN Number
    - IBG/ CBG Tag
    - Book Date
    - Maturity Date
    - Logical Branch Description PN
    - Product Type Description
    - Officer (AO Code) PN
    - Email Address
    - Mailing Address
    - Serial Number
    - Motor Number
    - 'Matching Status:'
    - Matched
    - Unmatched
    - 'Processing Status:'
    - Success
    - Failed
    - Reason (if failed or unmatched)
    - 'The system shall allow filtering by:'
    - Matching Status (Matched / Unmatched)
    - 'The system shall provide search functionality for:'
    - PN
    - Account Name
  - id: FRRN.012.05
    title: Paid-Off Accounts Repository
    text:
    - The system shall maintain a dedicated backend repository/table for Paid-Off Accounts.
    - The repository shall store all accounts identified as paid off from uploaded LAMD reports.
    - Compare records against the Paid-Off Accounts Repository.
    - Add qualified records that do not already exist.
    - 'If a matching record already exists:'
    - No new record shall be created.
    - The existing record shall remain unchanged.
  - id: FRRN.012.06
    title: BDOFC Reports Upload
    text:
    - The system shall display a “BDOFC/SOLD Report Upload” button on the Renewal landing page.
    - Upon clicking the button, the system shall display a pop-up where the user will select which type to be uploaded.
    - BDOFC
    - BDOSOLD
    - Once the type is selected, the user shall be required to select the file to be uploaded.
    - The system shall support excel and csv formats.
    - 'The system shall validate the uploaded file for:'
    - Correct format and structure
    - Required fields
    - PN
    - Assured's Name
    - Remarks
    - The system shall process and save the following details upon successful upload.
    - BDOI Location
    - PN
    - Assured's Name
    - Inception Date
    - Expiry Date
    - Remarks
    - 'The system shall display success/error messages:'
    - 'Upload and Processing Complete: “BDOFC/SOLD report is successfully processed. Records have been matched and updated
      accordingly.”'
    - 'Invalid File Format: “Upload failed. Invalid file format. Please upload a supported file type (.xlsx or .csv).”'
    - 'Missing Required Data: “Upload failed. The file is missing required fields (e.g., PN, Remarks). Please verify and
      try again.”'
    - 'Corrupted or Unreadable File: “Upload failed. The file is corrupted or cannot be read.”'
    - 'Processing Error: “Upload successful, but an error occurred during processing. Please review logs or contact support.”'
  - id: FRRN.012.07
    title: BDOFC/SOLD Record Matching
    text:
    - The system shall match records from BDOFC/SOLD reports with RMEL accounts using the Promissory Note (PN) Number.
    - The system shall evaluate matched records to determine renewal eligibility based on the sanitation rules.
  - id: FRRN.012.08
    title: BDOFC/SOLD Report Upload Outcome Summary
    text:
    - The system shall display a file-level upload summary in tabular format showing each uploaded report and its processing
      outcome.
    - 'The table shall be:'
    - Scrollable
    - Filterable
    - Paginated
    - 'The system shall include the following columns:'
    - Upload ID (unique identifier per upload)
    - File Name
    - Upload Date and Time
    - 'Upload Status:'
    - Successful
    - Failed
    - Partially Successful
    - 'Reason/Remarks:'
    - Description of failure or partial processing
    - Action
    - Download Processing Result
    - Each uploaded file shall be recorded as a separate row.
    - The system shall display the latest uploads at the top (default sorting).
    - Clicking a row shall allow users to view detailed record-level results.
    - 'The system shall provide search functionality for:'
    - File name (file-level)
    - 'The system shall allow filtering by:'
    - Processing Status (Success / Failed)
    - The system shall allow the user to download the Processing Result in excel format.
    - 'Filename: BDOFC/SOLD Processing Result_ MMDDYYYY.xlsx where MMDDYYYY is the upload date.'
  - id: FRRN.012.09
    title: Record-Level Summary View
    text:
    - The system shall provide a detailed view of each upload showing individual record processing results.
    - 'The system shall display records in a:'
    - Scrollable grid
    - Paginated table
    - 'Each record shall include:'
    - BDOI Location
    - PN
    - Assured's Name
    - Inception Date
    - Expiry Date
    - Remarks
    - 'Matching Status:'
    - Matched
    - Unmatched
    - 'Processing Status:'
    - Success
    - Failed
    - Reason (if failed or unmatched)
    - 'The system shall allow filtering by:'
    - Matching Status (Matched / Unmatched)
    - The system shall provide search functionality.
- id: FRRN.013
  screen: Renewal Home
  capability: Insurer Disposition Upload
  items:
  - id: FRRN.013.01
    title: Insurer Disposition Upload
    text:
    - The system shall display an “Insurer Disposition Upload” button on the Renewal landing page.
    - Upon clicking the button, the system shall display a pop-up where the user will select the file to be uploaded.
    - 'The system shall support predefined file formats (sample: Excel/ CSV).'
    - 'The system shall validate the uploaded file for:'
    - Correct format and structure
    - Required fields
    - The system shall process the uploaded report immediately upon successful upload.
    - CBG
    - Assured's Name
    - Renewal Reference Number
    - Expiring Reference Number
    - Expiring Policy No.
    - Inception Date
    - Expiry Date
    - Location of Risk (Property)
    - Unit Description
    - Serial No. (For Motor)
    - Motor No. (For Motor)
    - Plate No.
    - Color
    - TSI
    - Premium Rate
    - Insurer's Approval
    - Insurer Remarks
    - Insurer
    - Insurer's Branch
    - Non-CBG
    - Fields in the insurer disposition request file
    - Insurer's Approval
    - Insurer
    - Insurer's Branch
    - Insurer Remarks
    - 'The system shall provide real-time feedback:'
    - Upload in progress
    - Upload completed
    - Upload failed
    - 'The system shall display success/error messages:'
    - 'Upload Successful: “Insurer Disposition file is uploaded successfully. Processing is in progress.”'
    - 'Upload and Processing Complete: “Insurer Disposition file is successfully processed. Records have been matched and
      updated accordingly.”'
    - 'Invalid File Format: “Upload failed. Invalid file format. Please upload a supported file type (.xlsx or .csv).”'
    - 'Missing Required Data: “Upload failed. The file is missing required fields (e.g., PN, account status). Please verify
      and try again.”'
    - 'Corrupted or Unreadable File: “Upload failed. The file is corrupted or cannot be read.”'
    - 'Processing Error: “Upload successful, but an error occurred during processing. Please review logs or contact support.”'
    - See Annex H for Insurer Disposition Upload File Details (CBG)
  - id: FRRN.013.02
    title: Record Matching
    text:
    - The system shall match renewal records from the uploaded Insurer Disposition file using Expiring Policy Number or
    - Expiring Reference Number or Renewal Reference Number
    - Update the Insurer Disposition field, Bucket classification, and Renewal Disposition based on the corresponding Disposition
      value provided in the uploaded file.
    - 'Insurer Disposition: Renew As is/ Approved'
    - 'Bucket: Clean'
    - 'Renewal Disposition: For Renewal'
    - 'Insurer Disposition: Rejected'
    - 'Bucket: Review'
    - 'Renewal Disposition: For Disposition'
    - 'Insurer Disposition: Total Loss'
    - 'Bucket: Non-Renewable'
    - 'Renewal Disposition: Not for Renewal'
    - 'Insurer Disposition: Renew with surcharge'
    - 'Bucket: Review'
    - 'Renewal Disposition: For Disposition'
    - 'Insurer Disposition: Renew under another package'
    - 'Bucket: Review'
    - 'Renewal Disposition: For Disposition'
    - 'Insurer Disposition: Non-Renewal due to frequent loss/ high-loss ratio'
    - 'Bucket: Review'
    - 'Renewal Disposition: For Disposition'
    - 'Insurer Disposition: Non-Renewal due to old unit'
    - 'Bucket: Review'
    - 'Renewal Disposition: For Disposition'
    - 'Insurer Disposition: Non-Renewal due to Non-Payment of Premium'
    - 'Bucket: Review'
    - 'Renewal Disposition: For Disposition'
    - 'Insurer Disposition: Apply minimum premium'
    - 'Bucket: Review'
    - 'Renewal Disposition: For Disposition'
  - id: FRRN.012.03
    title: Insurer Disposition File Upload Outcome Summary
    text:
    - The system shall display a file-level upload summary in tabular format showing each uploaded report and its processing
      outcome.
    - 'The table shall be:'
    - Scrollable
    - Filterable
    - Paginated
    - 'The system shall include the following columns:'
    - Upload ID (unique identifier per upload)
    - File Name
    - Upload Date and Time
    - 'Upload Status:'
    - Successful
    - Failed
    - Partially Successful
    - 'Reason/Remarks:'
    - Description of failure or partial processing
    - Each uploaded file shall be recorded as a separate row.
    - The system shall display the latest uploads at the top (default sorting).
    - Clicking a row shall allow users to view detailed record-level results.
    - 'The system shall provide search functionality for:'
    - File name (file-level)
    - 'The system shall allow filtering by:'
    - Processing Status (Success / Failed)
  - id: FRRN.012.04
    title: Record-Level Summary View
    text:
    - The system shall provide a detailed view of each upload showing individual record processing results.
    - 'The system shall display records in a:'
    - Scrollable grid
    - Paginated table
    - 'Each record shall include:'
    - Fields in the upload file
    - 'Processing Status:'
    - Success
    - Failed
    - Reason (if failed or unmatched)
    - Record not found
    - 'The system shall allow filtering by:'
    - Insurer Disposition
    - Processing Status
    - The system shall provide search functionality using the fields in the uploaded file.
- id: FRRN.014
  screen: Renewal List
  capability: View and Update Account Details (Individual)
  items:
  - id: FRRN.014.01
    title: View Renewal Account Details
    text:
    - The system shall allow users to view the complete renewal information of an expiring account, including the ability
      to download, save, and print the account details.
    - Display link to related records
    - Expiring account
    - Endorsement (if applicable)
    - Claims (if applicable)
    - Payment
    - Refund
    - The system shall allow users to select an account from the bucket list.
    - Upon account selection, the system shall display the complete renewal details of the selected account.
    - The account details page shall display all renewal-related fields.
    - The system shall ensure all displayed information reflects the latest updates saved.
  - id: FRRN.014.02
    title: Update Account Details/ Disposition (Individual)
    text:
    - The system shall allow authorized users to update the details of a renewal account prior to its submission for placement.
    - Edit information
    - Upload additional supporting documents
    - Delete existing document
    - The system shall allow the user to cancel any updates made to an existing account record before the changes are saved.
    - 'The system shall clearly identify mandatory fields through a visual indicator: red asterisk.'
    - The system shall allow users to modify editable fields.
    - The system shall allow users to assign a disposition to the renewal account by selecting a value in the dropdown list.
    - For Renewal
    - Not for Renewal
    - For Quotation
    - For Proposal
    - If Disposition is Not for Renewal, the system shall require the user to select a disposition reason from a dropdown.
    - Remedial Management Unit (RMU)
    - With submitted policy
    - Loan fully paid
    - Direct to Insurer
    - Total Loss Claim
    - Unit Sold
    - Canceled Policy
    - Transfer to Another Marketing Unit
    - Non-renewable Accounts
    - Booked to New Invoice
    - One time policy/event
    - Project completed
    - Invoice for cancellation
    - Egress
    - Expat returning to home country
    - Business/ Store closed
    - Endorsement Only
    - Time on risk / Short period only
    - Properties returned to the originating Unit
    - No renewal instruction from RMU UH and Team
    - 'The system shall allow users to upload supporting documents in the following file formats:'
    - Microsoft Word documents (.doc, .docx)
    - PDF (.pdf)
    - Microsoft Excel files (.xls, .xlsx)
    - JPEG and PNG images (.jpg, .jpeg, .png)
    - OpenDocument Spreadsheet (.ods)
    - Comma-Separated Values (.csv)
    - Upon saving, the system shall validate the renewal fields to ensure required fields are populated.
    - Users shall see a prompt confirmation message upon successful updating of details.
    - “Renewal account details have been updated successfully.
    - 'Invalid/ Incomplete input: “Invalid or Incomplete Input. 

      One or more required fields are missing or contain invalid data. Please review your input and ensure all mandatory fields
      are correctly filled out.”'
    - The system shall automatically lock the account when already posted and placement has been completed.
    - The system shall disable all editing functions for locked accounts.
  - id: FRRN.014.03
    title: Multiple Insurer Allocation for Renewal Accounts
    text:
    - The system shall allow authorized users to assign multiple insurers to a renewal account when the risk is to be placed
      with more than one insurer.
    - 'Users shall be able to:'
    - Add Insurer
    - Edit Insurer Allocation
    - Remove Insurer
    - View Allocation Summary
    - 'The system shall support allocation of coverage using either:'
    - Percentage Allocation; or
    - Coverage Amount Allocation
    - Only one allocation method shall be used per renewal account.
    - When Percentage Allocation is selected, the system shall allow users to specify the percentage assigned to each insurer.
    - The system shall validate that Total Percentage Allocation = 100%
    - The system shall prevent saving when the total is less than or greater than 100%.
    - When Coverage Amount Allocation is selected, the system shall allow users to specify the coverage amount assigned
      to each insurer.
    - The system shall validate that Total Coverage Allocation = Total Sum Insured (TSI)
    - The system shall prevent submission when the allocated amount does not equal the TSI.
    - The system shall display and maintain coverage and premium information at the insurer level.
    - The system shall automatically calculate the allocated coverage and premium amount per insurer based on the selected
      allocation method.
  - id: FRRN.014.04
    title: Direct Booking Tagging
    text:
    - The system shall provide a For Booking Only toggle on the renewal account record.
    - 'The system shall allow authorized users to tag an account as For Booking Only during:'
    - Renewal Account Creation
    - Individual/ Bulk Account Update
    - 'For accounts tagged as For Booking Only, the system shall perform the following validations before allowing submission
      to proceed:'
    - Policy Number is available.
    - OR (Official Receipt) Number is available.
    - At least one insurer-issued policy document has been uploaded.
    - Payment Status is Paid.
    - If the account is not fully paid or policy details are not available yet, the system shall prevent account submission
      and require the user to submit the account for override approval.
    - 'Error message upon submission for placement: "The account is not fully paid. Override approval is required before
      you can proceed."'
    - The approver shall be required to provide an override justification when approving an account for submission.
    - The system shall allow authorized users to tag multiple accounts as For Booking Only.
    - 'The system shall support:'
    - Single Selection
    - Multiple Selection
    - Select/ Deselect All
    - Bulk Upload Tagging
    - Each account shall be processed independently.
  - id: FRRN.014.05
    title: Direct-to-Insurer Payment Tagging and Approval
    text:
    - The system shall allow authorized users to tag an account as “Direct-to-Insurer Payment”.
    - 'The system shall allow authorized users to tag an account as Direct-to-Insurer Payment during:'
    - Renewal Account Creation
    - Individual/Bulk Account Update
    - 'When an account is tagged as Direct-to-Insurer Payment, the system shall display the following options:'
    - With Blanket Approval
    - Route for UH Approval
    - The user shall be required to select one option before proceeding.
    - 'If the user selects “With Blanket Approval”, the system shall:'
    - Bypass the Unit Head approval workflow.
    - Allow the account to proceed to the next workflow stage.
    - If the user selects “Route for UH Approval”, the system shall route the account to the Unit Head of the assigned user.
    - The system shall allow the Unit Head to review the Direct-to-Insurer Payment account.
    - 'The Unit Head shall be able to:'
    - Approve
    - Reject
    - Rejection reason shall be required for rejected account.
    - If the request is rejected, the user shall only be allowed to proceed after removing the "Direct to Insurer Payment"
      tag.
    - When the Unit Head approves the request, the system shall proceed to the next workflow.
  - id: FRRN.014.06
    title: Download and Print Account Details
    text:
    - The system shall allow users to export and print the account details.
    - 'The system shall provide options to:'
    - Download as .xlsx
    - Save file locally
    - Print the list
    - The system shall display a print preview screen before printing.
    - 'The system shall allow configuration of:'
    - Page size
    - Orientation (portrait/landscape)
    - Margins
    - The file shall contain all available account details displayed on the screen.
    - The system shall preserve data completeness and formatting during export.
    - 'File Name Convention: Renewal Account Details.xlsx'
- id: FRRN.015
  screen: ''
  capability: Update Account Details (Bulk)
  items:
  - id: FRRN.015.03
    title: Bulk Upload of Dispositioned Account Files
    text:
    - The system shall provide a Download Template link on the Renewal landing page.
    - Upon clicking Download Template, the system shall download the template in XLSX format.
    - The system shall display an “Renewal Update Upload” button on the Renewal landing page.
    - Upon clicking the button, the system shall display a pop-up where the user will select the file to be uploaded.
    - The system shall support excel file formats
    - 'The system shall validate the uploaded file for:'
    - Correct format and structure
    - Required fields
    - The system shall process the uploaded report immediately upon successful upload.
    - 'The system shall provide real-time feedback:'
    - Upload in progress
    - Upload completed
    - Upload failed
    - 'The system shall display success/error messages:'
    - 'Upload Successful: “Renewal Update file is uploaded successfully. Processing is in progress.”'
    - 'Upload and Processing Complete: “Renewal Update file is successfully processed. Records have been matched and updated
      accordingly.”'
    - 'Invalid File Format: “Upload failed. Invalid file format. Please upload a supported file type (.xlsx or .csv).”'
    - 'Missing Required Data: “Upload failed. The file is missing required fields. Please verify and try again.”'
    - 'Corrupted or Unreadable File: “Upload failed. The file is corrupted or cannot be read.”'
    - 'Processing Error: “Upload successful, but an error occurred during processing. Please review logs or contact support.”'
  - id: FRRN.015.04
    title: Record Matching and Updating
    text:
    - The system shall match renewal records from the uploaded Renewal Update file using the Reference Number.
    - Update the renewal account fields based on the corresponding value provided in the uploaded file.
  - id: FRRN.015.05
    title: Bulk Update Upload Outcome Summary
    text:
    - The system shall display a file-level upload summary in tabular format showing each uploaded report and its processing
      outcome.
    - 'The table shall be:'
    - Scrollable
    - Filterable
    - Paginated
    - 'The system shall include the following columns:'
    - Upload ID (unique identifier per upload)
    - File Name
    - Upload Date and Time
    - 'Upload Status:'
    - Successful
    - Failed
    - Partially Successful
    - 'Reason/Remarks:'
    - Description of failure or partial processing
    - Each uploaded file shall be recorded as a separate row.
    - The system shall display the latest uploads at the top (default sorting).
    - Clicking a row shall allow users to view detailed record-level results.
    - 'The system shall provide search functionality for:'
    - File name (file-level)
    - 'The system shall allow filtering by:'
    - Processing Status (Success / Failed)
  - id: FRRN.015.06
    title: Record-Level Summary View
    text:
    - The system shall provide a detailed view of each upload showing individual record processing results.
    - 'The system shall display records in a:'
    - Scrollable grid
    - Paginated table
    - The system shall allow filtering, sort, and search functionality
- id: FRRN.016
  screen: Renewal Account Screen
  capability: Submit for Approval
  items:
  - id: FRRN.016.01
    title: Submit Account for Posting
    text:
    - After finalizing the renewal account details, the system shall allow the user to submit the “In Process Renewal" for
      TL review and approval.
    - Button: Submit for Posting
    - When clicked, the system shall check the completeness of the required fields and the correctness of the input format.
    - Display an informative error message if any of the required details is missing.
    - If passed, then the system shall require the user to select an approver.
    - The system shall update the account status to “Submitted for Posting”
- id: FRRN.017
  screen: Proposal
  capability: Generate Quick and Full Proposal
  items:
  - id: FRRN.017.01
    title: Generate Quick and Full Proposal
    text:
    - The system shall allow proposal generation only for renewal accounts For Proposal disposition.
    - The system shall prevent generation of proposals for accounts with other dispositions.
    - Disable Generate Proposal Slip button
    - 'The system shall provide users with the option to generate:'
    - Quick Proposal
    - Full Proposal
    - Users shall select the proposal type prior to generation.
    - 'Quick Proposal File name: Renewal_QuickProposal_XXXXXXXXXX_MMDDYYYY.pdf'
    - 'where:'
    - Renewal_QuickProposal_ is constant
    - XXXXXXXXXX_ is the Reference Number
    - MMDDYYYY is the generation date
    - 'Full Proposal File name: Renewal_FullProposal_XXXXXXXXXX_MMDDYYYY.pdf'
    - 'where:'
    - Renewal_FullProposal_ is constant
    - XXXXXXXXXX_ is BDOI QPS Reference Number
    - MMDDYYYY is the generation date
    - For Full Proposal printing, the system shall prompt the user to select signatories depending on the TSI of the record.
    - 'For Full Quotation (Package):'
    - Need provision for 2 signatories.
    - 'For Full Quotation (Non-Package):'
    - Need provision for 2 signatories for TSI below 500M.
    - Need provision for 3 signatories for TSI above 500M.
    - The system shall validate that all required signatories have been selected before generating the quotation.
    - 'Error Message: "Required signatories must be selected before the Full Quote can be generated."'
    - After generation, the system shall provide a preview of the generated proposal slip.
    - The system shall attach the generated file to the renewal account.
    - Users shall be able to download the generated quotation to their preferred local destination, with the ability to
      specify a custom file name.
    - Users should be able to print the generated proposal slip.
    - The system shall display a print preview screen before printing.
    - 'The system shall allow configuration of:'
    - Page size
    - Orientation
    - Margins
    - See Annex I for Quick Proposal Template
    - See Annex J for Full Proposal Template
  - id: FRRN.017.02
    title: Send Proposal via CCM API
    text:
    - The system shall transmit the generated proposal to the nominated client email recipient(s) by invoking the Customer
      Communication Management (CCM) API.
    - The system shall provide a Send Proposal button for authorized users.
    - 'Upon user initiation, the system shall:'
    - Generate the CCM handoff payload containing the quotation and recipient details.
    - Invoke the CCM API to transmit the quotation to the nominated recipient.
    - The system shall receive and process the response returned by the CCM API.
    - The system shall store the CCM transaction reference number returned by the API for tracking and audit purposes.
    - The system shall update the quotation delivery status based on the API response.
    - 'The system shall support the following statuses:'
    - Pending Transmission
    - Submitted to CCM
    - Sent
    - Delivered
    - Failed
    - Cancelled
    - 'Success Message:'
    - '"Proposal has been successfully submitted to CCM for delivery to the client."'
    - 'Error Messages:'
    - '"Unable to send the proposal. CCM service is currently unavailable."'
    - '"Unable to send the proposal. One or more recipient email addresses are invalid."'
    - '"Quotation transmission failed. Please review the error details and try again."'
- id: FRRN.018
  screen: Quotation Request
  capability: Quotation Request
  items:
  - id: FRRN.018.01
    title: Quotation Request to TSU Creation
    text:
    - The system shall allow the user to create a TSU request for renewal accounts with a "For Quotation" disposition that
      requires TSU processing.
    - 'The TSU request shall inherit the relevant renewal account information including:'
    - Reference Number
    - Client Information
    - Risk Code
    - Insurer Information
    - Risk Information Details
    - Assigned Account Officer
    - The system shall allow the user to upload supporting documents.
    - Before routing the request to TSU, the system shall require approval from the appropriate Marketing Team Lead.
    - The system shall allow users to submit the request for approval.
    - 'Change the request status to: Pending Team Lead Approval'
    - Notify the Team Lead of the pending action.
    - The system shall allow the Team Lead to review the quotation request details.
    - 'The Team Lead shall be able to:'
    - Approve
    - Reject
    - Return for Revision
    - Upon Team Lead approval, the system shall allow the user to assign a TSU Officer.
    - The system shall then route the request to the designated TSU work queue.
    - 'Update status to: For TSU Processing'
    - The system shall notify the responsible TSU officer of the new request.
    - The system shall prevent duplicate TSU requests for the same renewal account.
    - The system shall allow users to view the status of TSU requests.
    - The system shall notify the user every time there is an update in their TSU request.
    - The system shall allow the Marketing user to select insurer/s from the updated Comparative Table after the TSU Officer
      has incorporated all insurer responses, quotations, terms, and conditions.
    - 'Once the proposal has been completed by TSU, authorized users shall be able to:'
    - View the proposal from the renewal account record.
    - Download the proposal in PDF format.
    - Save the proposal using a custom file name.
    - Print the proposal.
    - Access print preview and print settings.
    - Send the proposal to the client through CCM.
    - See Annex K for Non –Package Quotation Request Details
- id: FRRN.019
  screen: Renewal Account Screen
  capability: Update Proposal Status
  items:
  - id: FRRN.019.01
    title: Update Client Acceptance Status
    text:
    - The system shall allow authorized users to update the client's acceptance status after receiving the client's decision.
    - 'The system shall provide the following status options:'
    - Pending Client Response
    - Accepted
    - Rejected
    - Request for Revision
    - 'Remarks shall be mandatory for:'
    - Rejected
    - Request for Revision
    - 'The system shall allow users to upload supporting documents related to the client response, including:'
    - Signed proposal
    - Client confirmation email
    - Workflow Progression Based on Client Response
    - Accepted
    - The system will allow the user to finalize the renewal account details prior to sending for review and approval.
    - 'Submit for Approval button should be available. Once clicked, the system shall display a success message: “Renewal
      account submitted for review and approval.”'
    - Rejected
    - The system will update the renewal disposition to “Not for Renewal” and the disposition reason to “Lost Business”
    - 'Submit for Approval button should be available. Once clicked, the system shall display a success message: “Renewal
      account submitted for review and approval.”'
    - Request for Revision
    - The system shall allow the user to update the renewal quotation/proposal, generate a revised copy and send it to the
      client again.
    - Once revised quotation/ proposal is sent, the client acceptance status will revert to “Pending Client Response”.
- id: FRRN.020
  screen: Renewal Account Screen
  capability: Manage “Submitted for Posting” Renewal Accounts
  items:
  - id: FRRN.020.01
    title: Review and Posting of Account
    text:
    - The system shall allow the authorized users to view the list of renewal accounts with status “Submitted for Posting”.
    - The user shall review the correctness and completeness of the renewal account details then do the necessary updates
      (minimal and optional) before proceeding with posting/approval.
    - Button: Approve
    - When clicked, the system shall
    - Automatically update the status of the renewal account to “Posted”
    - 'Display a success message: “Renewal account successfully posted.”'
    - Workflow progression after renewal account posting according to renewal disposition.
    - For Proposal/ Quotation
    - The system will route the renewal account for placement processing and update the renewal account status to “Submitted
      for Placement”
    - Not For Renewal
    - The system shall proceed with the generation and processing of the Not for Renewal (NFR) letter.
    - For Renewal
    - The system shall check if the Insurer Disposition field has value.
    - If available and insurer approves the renewal account, the system shall proceed with the generation and processing
      of Renewal Advice letter.
    - If none, the system shall proceed with the generation and processing of insurer disposition file.
  - id: FRRN.020.02
    title: Return the Renewal Account
    text:
    - If there are further updates needed, the approver may opt to return the renewal account to the assigned officer.
    - 'Button: Return'
    - A prompt will be displayed by the system requiring the user to provide a reason or remarks for the return.
    - When clicked, the system shall
    - Automatically update the status of the renewal account to “In Process Renewal”.
    - 'Display a success message: “Renewal account successfully returned.”'
    - Assigned user needs to make the necessary updates then resend for review and approval.
- id: FRRN.021
  screen: Renewal List
  capability: Insurer Disposition File Generation and Processing
  items:
  - id: FRRN.021
    title: Send RMEL Insurer Disposition Request
    text:
    - The system shall allow insurer disposition requests to be generated from the Renewal list.
    - 'The system shall allow users to select:'
    - Entire RMEL
    - Selected accounts from the RMEL
    - Filtered RMEL records based on business criteria
    - The system shall allow users to select the data fields to be included in the generated export file.
    - The system shall provide an Export button for authorized users.
    - Upon user initiation, the system shall transmit the file to the nominated recipient.
    - The system shall update the delivery status.
    - Delivered
    - Failed
    - Display error reason
    - 'Success Message:'
    - '"Insurer Disposition Request file has been successfully sent to the insurer/s."'
- id: FRRN.022
  screen: Renewal List
  capability: Renewal Advice Letter Generation and Sending
  items:
  - id: FRRN.022.01
    title: Renewal Advice (RA) Letter Generation
    text:
    - The system shall generate and send a Renewal Advice (RA) Letter via CCM to the client after receipt of insurer approval
      and successful completion of all required renewal validations.
    - The system shall allow users to select renewal accounts for RA generation.
    - 'The system shall support:'
    - Single account selection
    - Multiple account selection
    - Select/Deselect All
    - The system shall provide a Generate and Send RA button for authorized users.
    - The system shall generate a Renewal Advice document for each selected account.
    - The system shall utilize the latest BDOI-approved Renewal Advice template.
    - The system shall generate RA in PDF format.
    - 'The system shall automatically determine whether the Renewal Advice is:'
    - First Notice
    - Second Notice
    - The Generate RA action shall be disabled for locked accounts.
    - The system shall display an appropriate error or warning message.
    - 'Message: “Renewal Advice cannot be generated because the account is locked.”'
    - 'The system shall allow users to:'
    - Preview the generated RA Letter.
    - The preview shall display the exact version sent to the client.
    - Download the attached RA Letter.
    - Users shall be able to download the attachment to a preferred local destination.
    - Users shall be able to specify a custom file name when downloading without changing the original attached document.
    - Print the attached RA Letter.
    - The system shall provide print preview and allow users to configure the print settings.
    - 'Resend the attached RA Letter to the client when:'
    - Delivery fails
    - The client requests another copy
    - Attach a copy of the generated RA Letter to the renewal account record.
    - The attached RA Letter shall serve as the system copy of the communication sent to the client.
    - 'The attachment record shall include:'
    - File Name
    - Document Type = RA Letter
    - Generation Date and Time
    - Sent Date and Time
    - CCM Transaction Reference Number
    - Delivery Status
    - Generated By
    - 'File naming convention: <Product>_RA_<Notice#>_XXXXXXXXXX_MMDDYYYY.pdf'
    - 'Where:'
    - <Product> = Product Code
    - RA = Constant Value
    - _<Notice#>_ = First/Last Notice
    - XXXXXXXXXX = Reference Number
    - MMDDYYYY = Generation Date
    - 'Sample: MTR_RA_First Notice_1234567890_06302026.pdf'
    - See Annex L for Renewal Advice Template
  - id: FRRN.022.02
    title: Renewal Advice (RA) Letter Sending
    text:
    - 'After letter generation and encryption, the system shall:'
    - Generate the CCM handoff payload containing the renewal and recipient details.
    - Invoke the CCM API to transmit the file to the nominated recipient.
    - The system shall receive and process the response returned by the CCM API.
    - The system shall store the CCM transaction reference number returned by the API for tracking and audit purposes.
    - The system shall update the delivery status based on the API response.
    - 'The system shall support the following statuses:'
    - Pending Transmission
    - Submitted to CCM
    - Sent
    - Delivered
    - Failed
    - Cancelled
    - 'Success Message:'
    - '"Renewal Advice file has been successfully submitted to CCM for delivery to the client/s."'
    - 'Error Messages:'
    - '"Unable to send the file. CCM service is currently unavailable."'
    - '"Unable to send the file. One or more recipient email addresses are invalid."'
    - '"File transmission failed. Please review the error details and try again."'
- id: FRRN.023
  screen: Renewal Letters
  capability: Automated Client Letter Determination, Generation, and Sending
  items:
  - id: FRRN.023.01
    title: Automated Client Letter Determination
    text:
    - The system shall automatically evaluate renewal accounts and determine the appropriate client communication to generate.
    - 'The system shall support the following letter types:'
    - NRNS Reminder Letter
    - FFY Reminder Letter
    - No Advice Letter (NAL)
    - Non-Renewal Letter
    - SFU Letter
    - See Annex M for Letter Eligibility Matrix
  - id: FRRN.023.02
    title: Letter Generation and Sending
    text:
    - 'The system shall:'
    - Generate the applicable client letter using the approved template on the appropriate
    - Populate the template with relevant renewal, client, and policy information.
    - Generate the document in PDF format.
    - File naming convention
    - <Product>_<Letter Type>_XXXXXXXXXX_MMDDYYYY.pdf
    - 'Where:'
    - <Product> = Product Code
    - <Letter Type> = Reminder/ NFR/ NAL/ NRL/ SFU
    - XXXXXXXXXX = Reference Number
    - MMDDYYYY = Generation Date
    - 'Sample: MTR_NFR_1234567890_06302026.pdf'
    - 'After the letter generation, the system shall:'
    - Create the CCM communication payload.
    - Invoke the CCM API to send the Letter to the nominated client recipient(s).
    - Record the CCM transaction reference number returned by CCM.
    - Update the communication status of the letter.
    - Attach a copy of the generated letter to the renewal account record.
    - The attached letter shall serve as the system copy of the communication sent to the client.
    - 'The attachment record shall include:'
    - File Name
    - Document Type = Letter Type
    - Generation Date and Time
    - Sent Date and Time
    - CCM Transaction Reference Number
    - Delivery Status
    - Generated By
    - Success Message
    - '"<Letter Type> Letter generated and successfully submitted to CCM for delivery."'
    - Error Message
    - '"<Letter Type> Letter generated but transmission to CCM failed. Please review the communication details and retry."'
    - The attachment shall remain accessible regardless of the delivery status.
    - 'The system shall allow authorized users to:'
    - Preview the generated letter.
    - The preview shall display the exact version sent to the client.
    - Download the attached letter.
    - Users shall be able to download the attachment to a preferred local destination.
    - Users shall be able to specify a custom file name when downloading without changing the original attached document.
    - Print the attached letter.
    - The system shall provide print preview and allow users to configure the print settings.
    - 'Resend the attached letter to the client when:'
    - Delivery fails
    - The client requests another copy
    - 'Upon resend, the system shall:'
    - Generate a new CCM transmission request
    - Maintain the original attached document
    - Record the resend transaction in the audit logs.
    - See Annex N for NRNS Reminder Letter Template
    - See Annex O for No Advice Letter Template
    - See Annex P for Non-Renewal Letter Template
    - See Annex Q for SFU Letter Template
    - See Annex R for FFY Reminder Letter Template
- id: FRRN.024
  screen: File Encryption
  capability: File Encryption
  items:
  - id: FRRN.024.01
    title: Generated File Encryption
    text:
    - The system shall automatically generate a unique encryption key (password) for each outbound file prior to transmission.
    - The encryption key shall be based on the client type (Individual or Corporate).
    - 'For Individual Renewal Accounts:'
    - The encryption key shall be derived from the client's first name and last name.
    - 'Password Generation Rules:'
    - Remove spaces from the client's first name and last name.
    - Remove special characters from the client's first name and last name.
    - Convert all resulting characters to uppercase.
    - Extract the first three (3) characters of the cleaned first name.
    - Extract the first three (3) characters of the cleaned last name.
    - Concatenate both extracted values to create the encryption key.
    - If the client's first name or last name contains fewer than three characters, the system shall use all available characters
      from the name.
    - The system shall not pad missing characters with blanks or special characters.
    - 'For Corporate Clients, the system shall generate a random password consisting of:'
    - One (1) lowercase alphabetic character
    - One (1) uppercase alphabetic character
    - One (1) special character
    - Five (5) numeric digits
    - The system shall encrypt the PDF document using the generated encryption key.
    - The system shall ensure the encrypted document cannot be opened without the corresponding password.
    - The system shall validate successful encryption before transmission.
- id: FRRN.025
  screen: Renewal Account Screen
  capability: Client RA Acceptance Update
  items:
  - id: FRRN.025.01
    title: Update Client Acceptance Status
    text:
    - The system shall allow authorized users to update the client's acceptance status and other account details (as needed)
      after receiving the client's decision.
    - Not required for CBG Home and FFY accounts
    - Automatically update status to “For Billing Generation” after RA/ FFY Reminder Letter sending.
    - 'The system shall provide the following RA status options:'
    - Pending Client Response
    - Accepted
    - Rejected
    - Request for Revision
    - Not Applicable
    - 'Remarks shall be mandatory for:'
    - Rejected
    - Request for Revision
    - The system shall allow users to upload supporting documents related to the client response. (i.e. client confirmation
      email)
    - Workflow Progression Based on Client Response
    - Accepted
    - The system will allow the user to finalize the renewal account details prior to sending for approval.
    - 'Submit for Approval button should be available. Once clicked, the system shall display a success message: “Renewal
      account submitted for review and approval.”'
    - Update status to “Submitted for Approval”.
    - Rejected
    - The system shall issue a Non-Renewal Letter to the client according to the configured letter-sending schedule.
    - Request for Revision
    - The system shall allow the user to update the renewal details, generate a revised renewal advice copy and send it
      to the client again.
    - Once revised RA is sent, the client acceptance status will revert to “Pending Client Response”.
- id: FRRN.026
  screen: Renewal Account Screen
  capability: Review and Submission of Account
  items:
  - id: FRRN.26.01
    title: Review and Submission of Account
    text:
    - The system shall allow the authorized users to view the list of accounts with status “Submitted for Approval”.
    - The user shall review the correctness and completeness of the account details.
    - The system shall provide an Approve button for authorized users.
    - 'When the authorized user clicks Approve, the system shall:'
    - Validate that all required fields are complete.
    - Determine the account's assigned Department.
    - If the account is classified under CBG Motor, the system shall monitor payment application and automatically proceed
      with submission for placement upon successful payment posting.
    - Update the account status to "Submitted for Placement" then route the renewal account to the Placement process.
    - For Non-CBG accounts, the system shall require the user to indicate the client's payment confirmation status before
      proceeding.
    - Client Payment Confirmation shall be mandatory.
    - 'Error message: "Please select the client''s payment confirmation status."'
    - If the user selects a payment confirmation, the system shall update the account status to "Submitted for Placement"
      then route the renewal account to the Placement process.
    - 'Success Message: "Account successfully approved and submitted for Placement."'
    - 'Button: Reject'
    - A prompt will be displayed by the system requiring the user to provide a reason or remarks for the rejection.
    - When clicked, the system shall automatically update the status of the account to “Returned Account”.
    - 'Success message: "Account successfully returned for correction."'
    - The system shall return the account to the originating work queue of the authorized user responsible for the renewal
      account.
    - After making the necessary corrections, the authorized user shall be able to resubmit the account for review and approval.
    - 'Upon resubmission, the system shall:'
    - Update the account status to "Submitted for Approval"
    - Record the resubmission date and time.
    - Route the account to the appropriate approval queue.
- id: FRRN.027
  screen: Billing File
  capability: Billing File Generation and Sending
  items:
  - id: FRRN.27.01
    title: Automatic (Scheduled) Billing File Generation
    text:
    - The system shall provide an automated scheduler service that executes billing file generation based on configured
      schedules without user intervention.
    - The scheduler shall run automatically according to the configured processing calendar and generate billing files for
      eligible accounts.
    - CBG Home Billing Generation Job
    - The system shall execute the CBG Home Billing Generation Job daily.
    - 'During execution, the system shall identify accounts where:'
    - 10 calendar days prior to expiry date
    - Renewal Account Status = For Billing Generation
    - FFY Billing Generation Job
    - 'The system shall execute the FFY Motor Billing Generation Job on:'
    - 10th day of the month
    - 25th day of the month
    - 'During execution, the system shall identify accounts where:'
    - Renewal Account Status = For Billing Generation
    - The system shall automatically classify eligible accounts into the appropriate billing file.
    - 'File types:'
    - Built-in: contains amortized accounts
    - 'File Name: <Product Line>_CLPC Billing Built in_MMDDYYYY.csv'
    - 'where:'
    - <Product Line> is Product Line
    - _CLPC Billing Built in_ is constant
    - MMDDYYYY is the generation date
    - Non-Built-in: contains non-amortized accounts
    - 'File Name: <Product Line>_CLPC Billing NonBuilt in_MMDDYYYY.csv'
    - 'where:'
    - <Product Line> is Product Line
    - _CLPC Billing NonBuilt in_ is constant
    - MMDDYYYY is the generation date
    - The generated billing files shall contain billing information required by CLPC.
    - The system shall populate all fields using the most current renewal data.
    - The system shall attach the generated file to each account included in the file and record the corresponding file
      generation details.
    - 'The system shall allow authorized users to:'
    - Preview the generated Billing file.
    - Download the generated Billing file.
    - Users shall be able to download the file to a preferred local destination.
    - Users shall be able to specify a custom file name when downloading without changing the original attached document.
    - If LMS integration is available, the system shall automatically upload the billing files into the designated shared
      LMS directory.
  - id: FRRN.27.02
    title: Manual Billing File Generation
    text:
    - The system shall provide a Generate Billing File function for authorized users.
    - Upon clicking the Generate Billing File button, the system shall display a modal window that allows the user to specify
      the From Date and To Date filters to determine which eligible accounts will be included in the billing file.
    - Filter Fields
    - From Date
    - User-editable field.
    - The selected date shall not exceed 31 calendar days prior to the selected To Date.
    - From Date must not be later than To Date.
    - From Date cannot be more than 31 calendar days before the selected To Date.
    - To Date
    - Default value shall be the current system date.
    - User may modify the value subject to system date validation.
    - The system shall generate billing files containing accounts with the status "For Billing Generation".
    - The system shall automatically classify eligible accounts into the appropriate billing file.
    - 'File types:'
    - Built-in: contains amortized accounts
    - 'File Name: <Product Line>_CLPC Billing Built in_MMDDYYYY.csv'
    - 'where:'
    - <Product Line> is Product Line
    - _CLPC Billing Built in_ is constant
    - MMDDYYYY is the generation date
    - Non-Built-in: contains non-amortized accounts
    - 'File Name: <Product Line>_CLPC Billing NonBuilt in_MMDDYYYY.csv'
    - 'where:'
    - <Product Line> is Product Line
    - _CLPC Billing NonBuilt in_ is constant
    - MMDDYYYY is the generation date
    - The generated billing files shall contain billing information required by CLPC.
    - The system shall populate all fields using the most current renewal data.
    - The system shall attach the generated file to each account included in the file and record the corresponding file
      generation details.
    - 'The system shall allow authorized users to:'
    - Preview the generated Billing file.
    - Download the generated Billing file.
    - Users shall be able to download the file to a preferred local destination.
    - Users shall be able to specify a custom file name when downloading without changing the original attached document.
    - If LMS integration is available, the system shall automatically upload the billing files into the designated shared
      LMS directory.
    - See Annex S for Billing File Template
  - id: FRRN.27.03
    title: Billing File Sending
    text:
    - After file generation, the system shall transmit the file to the nominated recipient..
    - The system shall update the delivery status
    - Delivered
    - Failed
    - Display error reason
- id: FRRN.028
  screen: Payment
  capability: Automatic Payment Status Update from Cashiering
  items:
  - id: FRRN.028.01
    title: Automatic Payment Status Update from Cashiering
    text:
    - The system shall automatically synchronize payment information once a payment has been applied in the Cashiering module.
    - The synchronization shall occur automatically without user intervention.
    - 'Upon receiving the payment application update, the system shall:'
    - Match the payment to the corresponding Renewal Account.
    - Recalculate payment balances.
    - Update Renewal Account payment status
    - Outstanding Balance is Zero = Paid
    - Outstanding Balance is greater than Zero but lesser than the Total Premium = Partially Paid
    - Outstanding Balance is equal to Total Premium = Unpaid
  - id: FRRN.028.02
    title: Automatic Update of Renewal Account Status (CBG)
    text:
    - Once a CBG renewal account's payment status is updated to "Paid," the system shall automatically change the renewal
      status to "Submitted for Placement."
- id: FRRN.029
  screen: Placement and Booking
  capability: Placement Processing
  items:
  - id: FRRN.029.01
    title: View Submitted for Placement Accounts
    text:
    - The system shall provide a Submitted for Placement listing that displays all accounts that has been posted and submitted
      for placement and booking based on the logged-in user's profile, role, and organizational hierarchy.
    - The system shall allow users to search, filter, and sort Submitted for Placement accounts.
    - The system shall allow users to select an account and view placement details.
    - The system shall allow authorized users to export Submitted for Placement accounts.
    - 'Supported formats:'
    - Excel (.xlsx)
    - PDF (.pdf)
    - CSV (.csv)
  - id: FRRN.029.02
    title: Placement Files Generation
    text:
    - The system shall provide a Generate Placement button.
    - 'The system shall support:'
    - Single account processing
    - Multiple account processing
    - 'The system shall generate placement documents for renewal accounts submitted for placement. The system shall support:'
    - Placement Slip Generation
    - The system shall generate one PDF Placement Slip per insurer per renewal account.
    - For renewal accounts with multiple insurers,
    - separate Placement Slips shall be generated for each co-insurer.
    - Placement File Generation
    - One consolidated placement file per insurer in excel format (for packaged accounts)
    - Where co-insurers exist, the file shall reflect the corresponding premium share and coverage allocation for each insurer.
      (for packaged accounts)
    - When the user clicks on Generate Placement, the system shall generate placement files using the approved insurer placement
      template.
    - Exclude accounts tagged as “For Booking only”
    - 'The system shall allow authorized users to:'
    - Preview the generated placement documents.
    - Download the generated placement documents.
    - Users shall be able to download the file to a preferred local destination.
    - Users shall be able to specify a custom file name when downloading without changing the original attached document.
  - id: FRRN.029.02.01
    title: Placement Slip
    text:
    - 'Placement slip naming convention:'
    - <InsurerCode>_<Product Line>_PlacementSlip_XXXXXXXXXX_MMDDYYYY.pdf
    - 'Where:'
    - <InsurerCode> = Insurer Code
    - <Product Line> = Product Line
    - PlacementSlip = Constant Value
    - XXXXXXXXXX = Reference Number
    - MMDDYYYY = Generation Date
    - 'Sample: PGAI_MTR_FIP_PlacementSlip_1234567890_07172026.pdf'
    - 'Upon successful generation, the system shall:'
    - Automatically attach the placement slip to the corresponding renewal account.
    - 'Update the following fields:'
    - 'Is Generated Placement: Yes'
    - 'Generation Date: Current Date'
    - 'Generated By: Logged-in User'
    - 'The system shall store:'
    - File Name
    - Document Type = Placement Slip
    - Generation Date and Time
    - Generated By
    - Insurer Name
    - Placement Status
    - See Annex T for Placement Slip Template
  - id: FRRN.029.02.02
    title: Consolidated Placement File per Insurer
    text:
    - The system shall generate a consolidated placement file per insurer.
    - The file shall combine all eligible renewal accounts for the same insurer.
    - 'Sample: If 150 renewal accounts belong to Insurer ABC:'
    - 150 individual Placement Slips shall be generated.
    - One consolidated Placement File shall be generated for Insurer ABC.
    - 'Placement file naming convention:'
    - <InsurerCode>_<Product Line>_PlacementFile_MMDDYYYY.xlsx
    - 'Where:'
    - <InsurerCode> = Insurer Code
    - <Product Line> = Product Line
    - Placement File = Constant Value
    - MMDDYYYY = Generation Date
    - 'Sample: MTR_FIP_PlacementFile_1234567890_07172026.pdf'
    - See Annex U for Placement File Template
  - id: FRRN.29.03
    title: Automatic Placement File Upload via MFT
    text:
    - MFT Eligibility Validation
    - 'The system shall validate the following before initiating the upload:'
    - Insurer is tagged as MFT Enrolled in Insurer Maintenance.
    - MFT integration is active and available.
    - Shared directory configuration exists for the insurer.
    - Placement file generation completed successfully.
    - Automatic Upload Process
    - 'The system shall:'
    - Identify the target insurer's configured MFT directory.
    - Establish connection to the MFT service.
    - Upload the file(s) to the designated shared directory.
    - Record upload results.
    - Update the transmission status.
    - 'The system shall support the following statuses:'
    - Pending Upload
    - Uploaded to MFT
    - Upload Failed
    - 'If the MFT upload fails, the system shall:'
    - Record the error.
    - 'Update the upload status to: Upload Failed'
    - Notify the appropriate users.
    - Upon successful placement sending, the system shall update the status of the renewal account to “For Booking”.
  - id: FRRN.29.04
    title: Placement Files Sending via CCM
    text:
    - The system shall allow authorized users to select one or more accounts from the generated Placement Slip or Placement
      File for transmission to insurers.
    - 'The selected accounts may include:'
    - Single Insurer Accounts
    - Multiple Insurer Accounts
    - The system shall automatically retrieve the recipient email address(es) from the Insurer Maintenance configuration
      based on the insurer associated with each selected account.
    - Primary Recipient Email Address
    - Secondary Recipient Email Address (if configured)
    - The system shall display the recipient information before sending.
    - 'Users shall be able to:'
    - View default recipients
    - Modify recipient email addresses
    - Add additional recipients
    - Remove recipients
    - The system shall allow users to specify Carbon Copy (CC) recipients.
    - The system shall validate email address formats before transmission.
    - 'After recipient validation, the system shall, the system shall:'
    - Generate the CCM handoff payload containing the renewal and recipient details.
    - Invoke the CCM API to transmit the file to the nominated recipient.
    - The system shall receive and process the response returned by the CCM API.
    - The system shall store the CCM transaction reference number returned by the API for tracking and audit purposes.
    - The system shall update the delivery status based on the API response.
    - 'The system shall support the following statuses:'
    - Pending Transmission
    - Submitted to CCM
    - Sent
    - Delivered
    - Failed
    - Cancelled
    - Upon successful placement sending, the system shall update the status of the renewal account to “For Booking”.
  - id: FRRN.29.05
    title: Placement Response Turnaround Time (TAT) Monitoring
    text:
    - The system shall automatically calculate and monitor the insurer response Turnaround Time (TAT) from the date the
      placement submission was sent to the insurer.
    - For Packaged Accounts, the system shall apply a target SLA of 3 business days starting from the Placement Submission
      Date.
    - For Non-Package Accounts, the system shall apply a target SLA of 10 business days starting from the Placement Submission
      Date.
    - Cut-Off Rule
    - Placement submissions sent after 3PM shall be considered as received on the next business day for TAT computation
      purposes.
    - The system shall calculate TAT using business days only.
    - 'The calculation shall:'
    - Exclude Saturdays.
    - Exclude Sundays.
    - Exclude Holidays.
    - The system shall allow users to record and track issues encountered during insurer placement processing.
    - The system should display a checkbox to tag if placement is “With Issue”.
    - If checked, the system shall provide a Resolution Date field for placement response issue tracking.
    - 'The Resolution Date shall:'
    - Be editable by authorized users.
    - Allow entry of a historical date.
    - Not allow a date earlier than the Placement Submission Date.
    - When a placement is tagged with an issue, the system shall continue counting TAT until the issue is resolved.
    - Upon recording the Resolution Date, the system shall use the Resolution Date as the end date for SLA measurement.
    - The system shall display SLA compliance indicators.
    - SLA Status Values
    - Within SLA
    - Beyond SLA
- id: FRRN.030
  screen: Placement Response
  capability: Insurer Placement Response Processing
  items:
  - id: FRRN.030.01
    title: Insurer Placement Response Processing
    text:
    - 'The system shall support the following placement response channels:'
    - Non-MFT Insurers
    - The system shall allow authorized users to upload insurer placement response files manually.
    - MFT-Enrolled Insurers
    - The system shall automatically retrieve and process insurer placement response files from the configured shared directory.
    - The system shall monitor the designated MFT directory and identify newly received placement response files.
    - 'Upon receipt of the insurer placement response file, the system shall:'
    - Validate the file structure.
    - Validate mandatory fields.
    - Validate record completeness.
    - Validate insurer information.
    - Validate response values.
    - The system shall match insurer responses to the corresponding renewal account.
    - 'Matching criteria: Renewal Reference Number'
    - 'The system shall support the following insurer responses:'
    - Approved
    - Rejected
  - id: FRRN.030.01.01
    title: “Approved” Response
    text:
    - 'When the insurer response is Approve, the system shall:'
    - Update the insurer placement response status to Approved.
    - Record the insurer response date.
    - Store insurer remarks, if provided.
    - Update the status to “Booked”
    - Lock the renewal account
  - id: FRRN.030.01.02
    title: “Rejected” Response
    text:
    - 'When the insurer response is Reject, the system shall:'
    - Update the insurer response status to Rejected.
    - Record the insurer response date.
    - Store insurer remarks and rejection reasons.
    - Claims/Losses
    - Duplicate request for policy issuance
    - Outstanding Premium
    - With Existing Cover under Another Intermediary
    - Client Initiated, will not push through / Spoilage request
    - Insurer's non-acceptance of the risk
    - Update the status to “Rejected Placement”
    - Allow the user to return the account to Marketing team to address rejection reason or cancel the placement of the
      renewal account.
  - id: FRRN.030.03
    title: Placement Response Receipt Processing Summary
    text:
    - The system shall display a file-level upload summary in tabular format showing each uploaded report and its processing
      outcome.
    - 'The table shall be:'
    - Scrollable
    - Filterable
    - Paginated
    - 'The system shall include the following columns:'
    - ID (unique identifier per file)
    - File Name
    - Upload Date and Time
    - 'Upload Status:'
    - Successful
    - Failed
    - 'Reason/Remarks:'
    - Description of failure
    - Each uploaded file shall be recorded as a separate row.
    - The system shall display the latest uploads at the top (default sorting).
    - Clicking a row shall allow users to view detailed record-level results.
    - 'The system shall provide search functionality for:'
    - File name (file-level)
    - 'The system shall allow filtering by:'
    - Processing Status (Success / Failed)
  - id: FRRN.030.04
    title: Record-Level Summary View
    text:
    - The system shall provide a detailed view of each upload showing individual record processing results.
    - 'The system shall display records in a:'
    - Scrollable grid
    - Paginated table
    - 'Each record shall include:'
    - Renewal Reference Number
    - Assured’s Name
    - 'Matching Status:'
    - Matched
    - Unmatched
    - 'Placement Status:'
    - Approved
    - Rejected
    - Remarks (if rejected or unmatched)
    - 'The system shall allow filtering by:'
    - Matching Status (Matched / Unmatched)
    - Placement Status (Approved/ Rejected)
    - 'The system shall provide search functionality for:'
    - Renewal Reference Number
    - Assured’s Name
- id: FRRN.031
  screen: Return Account
  capability: Return Renewal Account to Marketing
  items:
  - id: FRRN.031.01
    title: Return the Renewal Account to Marketing
    text:
    - If there are further updates needed or the placement was rejected by the insurer, the Processor may opt to return
      the account to Marketing.
    - The system shall display a Return button for renewal accounts with “Submitted for Placement” and “Rejected Placement”
      statuses.
    - The system shall require the user to select a reason and add remarks for returning the account.
    - When the return button is clicked, the system shall automatically update the status of the account to “Returned -
      Renewal”.
    - The user should make the necessary updates, then resend renewal account for review and approval.
    - See Annex V for Return Reasons
- id: FRRN.032
  screen: Insurance Advice
  capability: Insurance Advice / Generation and Sending
  items:
  - id: FRRN.032.01
    title: Insurance Advice Generation
    text:
    - 'The system shall automatically generate an Insurance Advice document when:'
    - Placement Slip has been successfully generated and sent to the insurer; or
    - Placement File has been successfully generated and sent to the insurer.
    - The system shall generate Insurance Advice only for renewal accounts associated with a mortgage account under BDO
    - The system shall generate the Insurance Advice in PDF format.
    - 'File Naming Convention: IA_<Reference Number>_MMDDYYYY.pdf'
    - 'Where:'
    - IA = Insurance Advice
    - Reference Number = Renewal Account Reference Number
    - MMDDYYYY = Generation Date
    - Upon successful generation, the system shall automatically attach the Insurance Advice document to the corresponding
      Renewal Account.
    - Information Recorded
    - File Name
    - File Type
    - Generation Date and Time
    - Generated By
    - Version Number
    - Authorized users shall be able to access the generated Insurance Advice from the Renewal Account.
    - Available Actions
    - View Insurance Advice
    - Download Insurance Advice
    - Print Insurance Advice
    - View Generation Details
    - When placement information changes after initial generation, the system shall automatically generate a new version
      of the Insurance Advice.
    - The previous version shall remain available for audit purposes.
    - For renewal accounts tagged as "For Booking Only," the system shall automatically generate an Insurance Advice upon
      submission of the account for placement.
    - See Annex W for Insurance Advice Template
  - id: FRRN.032.02
    title: Send Insurance Advice via CCM
    text:
    - The system shall provide a Send Insurance Advice button.
    - The functionality shall allow users to select a single or multiple accounts for Insurance Advice transmission.
    - The button shall only be enabled when generated Insurance Advice documents are available for all selected accounts.
    - Upon clicking Send via CCM, the system shall display all selected accounts and nominate recipient/s for all of them.
    - The system shall allow users to add one or more CC (carbon copy) recipients
    - 'Upon confirmation, the system shall:'
    - Generate the CCM handoff payload for each selected account.
    - Attach the corresponding Insurance Advice document.
    - Include the designated recipient(s).
    - Include the specified CC recipient(s).
    - Submit the communication request to CCM.
    - Process the CCM response.
    - The system shall receive and process the response returned by the CCM API.
    - The system shall store the CCM transaction reference number returned by the API for tracking and audit purposes.
    - The system shall update the delivery status based on the API response.
    - 'The system shall support the following statuses:'
    - Pending Transmission
    - Submitted to CCM
    - Sent
    - Delivered
    - Failed
    - Cancelled
- id: FRRN.033
  screen: E-Policy
  capability: E-policy Processing and Sending
  items:
  - id: FRRN.033
    title: E- Policy File Processing
    text:
    - The system shall be capable of receiving, validating, processing, and updating renewal account records using E-Policy
      files provided by insurers. The system shall extract policy information from the insurer's E-Policy file and update
      the corresponding renewal records.
  - id: FRRN.033.01
    title: Receipt of E-Policy Artifacts
    text:
    - The system shall support the receipt, validation, processing, and storage of insurer-issued E-Policy artifacts through
      both manual upload and Managed File Transfer (MFT) integration.
    - Non-MFT Insurers
    - 'The system shall allow authorized users to upload:'
    - One E-Policy Summary File (.txt)
    - One ZIP File containing E-Policy documents
    - MFT-Enrolled Insurers
    - The system shall automatically retrieve the following from the insurer's designated shared directory.
    - E-Policy Summary File (.txt)
    - E-Policy Document ZIP File
    - No manual upload shall be required for MFT-enrolled insurers.
    - 'For insurers enrolled in MFT, the system shall automatically:'
    - Monitor the designated shared directory.
    - Identify newly received E-Policy files.
    - Retrieve the E-Policy Summary File.
    - Retrieve the ZIP file containing E-Policy documents.
    - Validate the file structure and contents.
    - Process the E-Policy records.
    - Update the corresponding renewal accounts.
    - Store processing results.
    - The system shall not process E-Policy files unless the required files are available.
    - E-Policy Summary File
    - E-Policy ZIP File
    - 'The summary file shall contain:'
    - Sequence Number
    - Reference Number
    - Policy Number
    - PDF File Name
    - Document Tag
    - The system shall extract all files contained in the uploaded ZIP file.
    - The system shall verify that every uploaded document corresponds to a record contained in the uploaded summary file.
    - The system shall automatically match extracted documents using the Reference Number.
    - 'For successfully matched records, the system shall:'
    - Update the Policy Number using the value from the summary file.
    - Attach the corresponding E-Policy document(s) to the renewal account.
    - 'The documents shall be available for:'
    - Viewing
    - Downloading
    - Printing
    - Sending
  - id: FRRN.033.02
    title: E-Policy Receipt Processing Summary
    text:
    - The system shall display a file-level upload/MFT-processed summary in tabular format showing each uploaded report
      and its processing outcome.
    - 'The table shall be:'
    - Scrollable
    - Filterable
    - Paginated
    - 'The system shall include the following columns:'
    - ID (unique identifier per upload)
    - File Name
    - Receipt Date and Time
    - 'Receipt Type:'
    - MFT
    - Upload
    - 'Processing Status:'
    - Successful
    - Failed
    - 'Reason/Remarks:'
    - Description of failure
    - Each file shall be recorded as a separate row.
    - The system shall display the latest file at the top (default sorting).
    - Clicking a row shall allow users to view detailed record-level results.
    - 'The system shall provide search functionality for:'
    - File name (file-level)
    - 'The system shall allow filtering by:'
    - Processing Status (Success / Failed)
  - id: FRRN.033.03
    title: Record-Level Summary View
    text:
    - The system shall provide a detailed view of each received file showing individual record processing results.
    - 'The system shall display records in a:'
    - Scrollable grid
    - Paginated table
    - 'Each record shall include:'
    - Renewal Reference Number
    - Policy Number
    - 'Matching Status:'
    - Matched
    - Unmatched
    - Remarks (if unmatched)
    - 'The system shall allow filtering by:'
    - Matching Status (Matched / Unmatched)
    - 'The system shall provide search functionality for:'
    - Renewal Reference Number
    - Policy Number
  - id: FRRN.033.04
    title: E-Policy Sending via CCM
    text:
    - The system shall allow authorized users to select multiple renewal accounts for E-Policy delivery.
    - 'The system shall support the following selection options:'
    - Single account selection
    - Multiple account selection
    - Select All/ Deselect All
    - 'The system shall only allow selection of renewal accounts that:'
    - Have an attached E-Policy document.
    - Have a valid Policy Number.
    - Have at least one valid client email address.
    - Status is “For E-Policy Sending”
    - The system shall automatically exclude accounts that do not meet the eligibility criteria.
    - The system shall allow users to specify Carbon Copy (CC) recipients.
    - The system shall validate email address formats before transmission.
    - 'When users select multiple accounts and click Send E-Policy, the system shall:'
    - Validate each selected account independently.
    - Generate the CCM handoff payload containing the E-Policy artifacts and recipient details.
    - Invoke the CCM API to transmit the file to the nominated recipients.
    - The system shall receive and process the response returned by the CCM API.
    - The system shall store the CCM transaction reference number returned by the API for tracking and audit purposes.
    - The system shall update the delivery status based on the API response.
    - The system shall maintain transmission status for each selected renewal account independently.
    - Pending Transmission
    - Submitted to CCM
    - Sent
    - Delivered
    - Failed
    - Cancelled
    - 'Upon completion of bulk sending, the system shall display a summary containing:'
    - Total Accounts Selected
    - Successfully Submitted
    - Failed Submission
    - Pending Submission
    - See Annex X for E-Policy Email Template
  - id: FRRN.033.05
    title: Batch Upload of E-Policy Numbers
    text:
    - The system shall provide an Upload E-Policy Numbers function accessible to authorized users.
    - The system shall allow users to upload a file containing e-policy numbers for multiple renewal accounts.
    - 'Format: Excel/ CSV/ ODS'
    - The system shall provide a downloadable upload template.
    - 'The upload template shall contain the following fields:'
    - Reference Number
    - Policy Number
    - The system shall validate the uploaded data before processing.
    - Reference Number is required.
    - E-Policy Number is required.
    - Reference Number must exist in the system.
    - Upon upload, the system shall match each uploaded record to an existing renewal account using the Reference Number.
    - 'The system shall verify that:'
    - The Reference Number exists.
    - The Reference Number belongs to an active renewal account.
    - The renewal account is eligible for e-policy updating.
    - The system shall validate whether the uploaded E-Policy Number already exists in another active account prior to updating
      the renewal account.
    - 'If the uploaded E-Policy Number already exists in another active account, the system shall:'
    - Reject the update.
    - Exclude the record from processing.
    - Record the validation error in the upload exception report.
    - 'For successfully matched records, the system shall:'
    - Update the E-Policy Number in the corresponding renewal account.
    - Record the upload batch number.
    - Record the update date and time.
    - Record the user who performed the upload.
    - Upon completion of processing, the system shall display a processing summary.
    - Information Displayed
    - Total Records Uploaded
    - Successfully Updated Records
    - Failed Records
    - Duplicate Policy Number
    - Processing Date and Time
    - The system shall generate an exception report for records that fail processing.
    - Reference Number
    - E-Policy Number
    - Error Description
    - Users shall be able to download the exception report.
- id: FRRN.034
  screen: Booked Accounts
  capability: Incentive Code Determination
  items:
  - id: FRRN.034.01
    title: Incentive Code Determination
    text:
    - Upon booking, the system shall evaluate whether the renewal account is eligible for an incentive.
    - 'The system shall:'
    - Determine incentive eligibility based on configured business rules.
    - Retrieve the corresponding incentive code.
    - Display the incentive code in the booking screen when applicable.
- id: FRRN.035
  screen: Booked Accounts
  capability: Automatic Invoice Number Assignment, GL Entry Generation, and Service Invoice Creation
  items:
  - id: FRRN.035.01
    title: Automatic Invoice Number Assignment, GL Entry Generation, and Service Invoice Creation
    text:
    - 'Upon successful booking, the system shall:'
    - Automatically generate a unique Invoice Number to the booked account.
    - Automatically generate the required GL entries.
    - The booked transaction is automatically reflected in the accounting records.
    - The system shall automatically post the generated GL Entry on the booking date.
    - Automatically generate a Service Invoice document
    - Attach the generated file to the renewal account
    - See Annex Y for Service Invoice Document Template
- id: FRRN.036
  screen: Hold Cover
  capability: Hold Cover Processing
  items:
  - id: FRRN.036.01
    title: Hold Cover Request Duration
    text:
    - The system shall automatically assign the default Hold Cover duration based on account type.
    - 'Non CBG (Retail/ Corporate): 30 days'
    - 'CBG (Motor/Home): 90 days'
    - 'For transferred accounts, the default Hold Cover duration shall be:'
    - 'CBG Home: 30 days'
    - 'CBG Motor: 60 days'
    - 'Transferred accounts refer to accounts where:'
    - The originally selected insurer rejected the Hold Cover request; or
    - The account was transferred to another insurer.
  - id: FRRN.036.02
    title: Hold Cover Request Generation for Non-CBG Accounts
    text:
    - For Non-CBG accounts, the system shall automatically generate a Hold Cover request after client confirmation/ RA acceptance.
    - The system shall generate separate request for accounts with co-insurer.
    - 'The generated Hold Cover request shall:'
    - Be created in PDF format.
    - Use the approved Hold Cover template.
    - Include the required policy and coverage information.
    - Be attached to the account.
  - id: FRRN.036.03
    title: Hold Cover Extension Generation for Non-CBG
    text:
    - The system shall allow users to generate a Hold Cover Extension request.
    - The extension request may be generated 7 calendar days prior to Hold Cover expiry.
    - 'The generated request shall contain:'
    - Original Hold Cover Agreement
    - Extension Duration
    - Current Coverage Information
    - The system shall allow 15- or 30-days extension duration.
  - id: FRRN.036.04
    title: Hold Cover Request Generation for CBG Accounts
    text:
    - The system shall automatically generate Hold Cover requests for all eligible CBG accounts classified under the Clean
      Bucket
    - 'CBG Motor Trigger: 75 Days prior to account expiry'
    - 'CBG Home Trigger: 75 Days prior to account expiry'
    - The system shall generate one batch file per insurer in excel format.
    - Generate separate file for accounts with co-insurer
  - id: FRRN.036.05
    title: Hold Cover Extension Processing for CBG Home
    text:
    - 'The system shall automatically generate a 30-Day Hold Cover extension every 15th day of the month for the following:'
    - Expired Accounts
    - Unbooked Accounts
  - id: FRRN.036.06
    title: Hold Cover Request Transmission
    text:
    - Immediately after successful Hold Cover generation, the system shall automatically transmit the file/s to the insurer.
    - Before transmitting a Hold Cover request, the system shall verify the insurer's configured transmission method from
      Insurer Maintenance.
    - MFT Enrolled
    - CCM Transmission
    - 'For MFT-Enrolled Insurers, the system shall automatically:'
    - Upload the Hold Cover request to the configured MFT location.
    - Record the upload result.
    - Update the transmission status.
    - 'For Non-MFT Insurers, the system shall:'
    - allow the user to send the Hold cover request via email
    - Attach the Hold Cover document(s).
    - Determine recipient email addresses.
    - See Annex Z for Hold Cover Template
- id: FRRN.037
  screen: Hold Cover
  capability: Upload and Process Hold Cover Response from Insurer
  items:
  - id: FRRN.037.01
    title: Receive Hold Cover Responses
    text:
    - 'The system shall support the following response channels:'
    - Non-MFT Enrolled Insurers
    - The system shall provide an Upload Hold Cover Response function that allows authorized users to upload the Hold Cover
      response file
    - 'MFT-Enrolled Insurers- the system shall automatically:'
    - Monitor the designated MFT shared directory.
    - Detect newly received Hold Cover response files.
    - Retrieve the response file and supporting documents.
    - Validate and process the received files.
    - No manual upload shall be required for MFT-enrolled insurers.
    - The system shall automatically match uploaded or MFT-retrieved Hold Cover responses to the corresponding Renewal Account
      and Hold Cover Request using the “Reference Number”.
  - id: FRRN.037.02
    title: Auto Update Renewal Account Based on Insurer Response
    text:
    - 'When the insurer response is Approved, the system shall:'
    - Update the Hold Cover Status to Approved.
    - Record the insurer response date
    - Record the hold cover coverage date
    - Record insurer remarks.
    - 'When the insurer response is Rejected, the system shall:'
    - Update the Hold Cover Status to Rejected.
    - Record the insurer response date.
    - Record insurer remarks and rejection reason.
    - Route the account back to the responsible user for amendment and resubmission.
  - id: FRRN.037.03
    title: Hold Cover Upload Outcome Summary
    text:
    - The system shall display a file-level upload summary in tabular format showing each uploaded report and its processing
      outcome.
    - 'The table shall be:'
    - Scrollable
    - Filterable
    - Paginated
    - 'The system shall include the following columns:'
    - Upload ID (unique identifier per upload)
    - File Name
    - Upload Date and Time
    - 'Upload Status:'
    - Successful
    - Failed
    - 'Reason/Remarks:'
    - Description of failure
    - Each uploaded file shall be recorded as a separate row.
    - The system shall display the latest uploads at the top (default sorting).
    - Clicking a row shall allow users to view detailed record-level results.
    - 'The system shall provide search functionality for:'
    - File name (file-level)
    - 'The system shall allow filtering by:'
    - Processing Status (Success / Failed)
  - id: FRRN.037.04
    title: Record-Level Summary View
    text:
    - The system shall provide a detailed view of each upload showing individual record processing results.
    - 'The system shall display records in a:'
    - Scrollable grid
    - Paginated table
    - 'Each record shall include:'
    - Reference Number
    - Account Name
    - 'Matching Status:'
    - Matched
    - Unmatched
    - 'Hold Cover Status:'
    - Approved
    - Rejected
    - Remarks (if rejected or unmatched)
    - 'The system shall allow filtering by:'
    - Matching Status (Matched / Unmatched)
    - Hold Cover Status (Approved/ Rejected)
    - 'The system shall provide search functionality for:'
    - Reference Number
    - Account Name
  - id: FRRN.037.05
    title: Manual Hold Cover Response Update
    text:
    - The system shall allow authorized users to manually update Hold Cover response information on an individual account
      basis.
    - 'The user shall be able to:'
    - Select the Renewal Account
    - Select the Hold Cover Request
    - Update Hold Cover Status
    - Enter Response Date
    - Enter Coverage End Date
    - Enter Insurer Remarks
    - Enter Rejection Reason
    - Attach Supporting Documents
    - The system shall require mandatory remarks when the response is Rejected.
- id: FRRN.038
  screen: Maintenance
  capability: Maintenance of Risk Codes
  items:
  - id: FRRN.038.01
    title: Risk Code Maintenance Module
    text:
    - The system shall provide a Risk Code Maintenance facility that allows authorized users to create, update, activate,
      deactivate, and classify risk codes as Renewable or Non-Renewable. The renewable classification shall be used by the
      renewal process to determine account eligibility for renewal processing.
    - The system shall provide a dedicated sub-module for the maintenance of risk codes.
    - 'Module Name: Risk Code Maintenance'
    - 'The system shall allow authorized users to configure risk codes by:'
    - Adding risk code to the list
    - Updating risk code details
    - 'The system shall enforce role-based access control to:'
    - Restrict maintenance functions to authorized users only.
    - Provide read-only access to non-authorized users.
  - id: FRRN.038.02
    title: View Risk Codes
    text:
    - The system shall allow authorized users to view all maintained risk codes.
    - 'The system shall display the following information:'
    - Risk Code
    - Risk Description
    - Product Line
    - Renewable Indicator
    - Status (Active/Inactive)
    - Created By
    - Created Date
    - Last Updated By
    - Last Updated Date
    - 'The system shall support:'
    - Search
    - Filter
    - Sort
  - id: FRRN.038.03
    title: Add Risk Code to the List
    text:
    - The system shall allow authorized users to create new entries in the Risk Code Maintenance Module.
    - 'The system shall maintain the following attributes for each risk code:'
    - ID (unique identifier)
    - Risk Code
    - Dropdown list containing active risk codes
    - Risk Code Description
    - Renewable Indicator
    - Renewable
    - Non-Renewable
    - Effective Date – default to current date
    - Remarks (optional)
    - The system shall prevent duplicate risk codes.
    - 'Error message: “Duplicate entry detected. The risk code already exists in the list.”'
    - The system shall validate mandatory fields before saving.
    - 'Invalid/ Incomplete input error message: “Invalid or Incomplete input. One or more required fields are missing or contain invalid
      data. Please review your input and ensure all mandatory fields are correctly filled out.”'
    - 'The system shall save and display the following creation details:'
    - Created by (Username)
    - Created on (Date & Time)
    - Users shall see a prompt confirmation message upon successful creation of entries.
    - “Record successfully saved.”
    - Effective dates for entries must be current or future-dated; retroactive dates are not allowed.
    - 'The system shall allow users to:'
    - Search risk codes by ID, risk code
    - Filter risk codes (Effective date, Renewable Indicator)
    - 'When tagged as Renewable:'
    - Accounts using the risk code shall be eligible for renewal processing.
    - The risk code shall be included during renewal account generation.
    - 'When tagged as Non-Renewable:'
    - Accounts using the risk code shall not be eligible for renewal processing.
    - The system shall automatically classify the account as Not for Renewal during renewal account generation.
    - The corresponding non-renewal reason shall be recorded.
    - 'Reason: “Non-Renewable Risk Code”'
  - id: FRRN.038.03
    title: Update of Existing Risk Code Entries
    text:
    - The system shall allow authorized users to update existing entries.
    - 'Success message: “Record successfully updated.”'
    - When the effective date is updated, the system shall validate that the new date is either current or future dated.
      Retroactive effective dates are not allowed.
    - 'When Renewable indicator has been updated, the system shall:'
    - 'When tagged as Renewable:'
    - Accounts using the risk code shall be eligible for renewal processing.
    - The risk code shall be included during renewal account generation.
    - 'When tagged as Non-Renewable:'
    - Accounts using the risk code shall not be eligible for renewal processing.
    - The system shall automatically classify the account as Not for Renewal during renewal account generation.
    - The corresponding non-renewal reason shall be recorded.
    - 'Reason: “Non-Renewable Risk Code”.'
    - Saving Validation
    - The system shall validate updated fields to prevent incomplete/invalid or duplicate values (Risk Code)
    - 'Duplicate record error message: “Duplicate entry detected. The risk code already exists in the list.”'
    - 'Invalid/ Incomplete input: “Invalid or Incomplete Input. One or more required fields are missing or contain invalid
      data. Please review your input and ensure all mandatory fields are correctly filled out.”'
    - 'All updates shall be logged with:'
    - Updated on (Date & Time)
    - Updated by (Username)
- id: FRRN.039
  screen: KYC
  capability: KYC Monitoring
  items:
  - id: FRRN.039.01
    title: KYC Identification
    text:
    - The system shall identify renewal accounts that are due or approaching KYC review based on configurable KYC reference
      data and review timelines.
    - 'The identification criteria shall be configurable and may include:'
    - Periodic KYC review schedules
    - KYC expiration dates
    - Customer classification (e.g., Bank or Non-Bank)
    - Product-specific KYC requirements
    - Regulatory review periods
    - When a renewal account meets KYC monitoring criteria, the system shall automatically tag the account for KYC monitoring.
  - id: FRRN.039.02
    title: KYC Status Tracking
    text:
    - The system shall maintain KYC monitoring statuses for reporting and tracking purposes.
    - KYC Due
    - KYC Upcoming
    - KYC Not Required
    - Pending Follow-Up
    - KYC Completed
    - The system shall record status history.
    - 'Authorized users shall be able to:'
    - Record KYC review activities.
    - Add monitoring remarks.
    - Update follow-up notes.
    - Record completion of KYC review activities.
  - id: FRRN.039.03
    title: KYC Monitoring Dashboard
    text:
    - 'The system shall provide a KYC Monitoring Dashboard displaying:'
    - Total Accounts Due for KYC Review
    - Total Accounts with Upcoming KYC Reviews
    - Total Accounts Completed KYC
    - Total Accounts Pending Follow-up
    - The dashboard shall support drill-down to account-level details.
- id: FRRN.040
  screen: Maintenance
  capability: Sanitation Rules Configuration
  items:
  - id: FRRN.040.01
    title: Sanitation Rules Configuration
    text:
    - The system shall provide a Sanitation Rules Configuration menu accessible only to authorized users.
    - 'The system shall support role-based access to:'
    - View Rules
    - Create Rules
    - Edit Rules
    - Activate Rules
    - Deactivate Rules
    - View Audit Logs
    - 'The system shall provide a Rule Maintenance screen where users can:'
    - Create Rules
    - Edit Rules
    - Clone Existing Rules
    - Activate Rules
    - Deactivate Rules
    - View Rule Details
    - 'The screen shall support:'
    - Search
    - Filter
    - Sort
    - Pagination
    - The system shall allow users to create a new rule by copying an existing rule.
    - 'Upon cloning, the system shall:'
    - Create a new Rule ID.
    - Copy all rule conditions.
    - Set the new rule status to Draft.
    - The system shall support rule effectiveness periods.
    - Effective Date
    - Expiry Date
    - 'The system shall evaluate only rules that are:'
    - Active; and
    - Within their effective period.
    - Upon saving, the system shall validate the renewal list against the configured criteria based on the selected effective
      date.
- id: FRRN.041
  screen: Maintenance
  capability: RMU Account Maintenance
  items:
  - id: FRRN.041.01
    title: RMU Account Maintenance
    text:
    - The system shall provide an RMU Account Maintenance screen displaying all maintained RMU Account records.
    - Account Officer Code
    - Remarks
    - Status
    - Active
    - Inactive
    - Created By
    - Created Date
    - Last Updated By
    - Last Updated Date
    - All users should be able to view the RMU Account List.
    - The system shall allow authorized users to create a new RMU Account record.
    - Required Fields
    - Account Officer Code
    - Optional
    - Remarks
    - 'Validations:'
    - Account Officer Code must be unique.
    - Duplicate active Account Officer Codes shall not be allowed.
    - The system shall allow authorized users to update an existing RMU Account record.
    - The system shall record the update history.
    - The system shall allow authorized users to deactivate an active RMU Account record.
    - 'Upon deactivation, the system shall:'
    - Update the Status to Inactive.
    - Record the deactivation date.
    - Record the user who performed the action.
    - The system shall allow authorized users to reactivate an inactive RMU Account record.
    - 'Upon reactivation, the system shall:'
    - Update the Status to Active.
    - Record the reactivation date.
    - Record the user who performed the action.
    - The system shall allow users to search, sort, and filter RMU Account records.
- id: FRRN.042
  screen: Maintenance
  capability: Annual Renewal Budget Maintenance
  items:
  - id: FRRN.042.01
    title: Access Renewal Annual Budget Maintenance Module
    text:
    - The system shall provide a Renewal Annual Budget Maintenance menu accessible to authorized users.
    - 'Authorized users shall be able to:'
    - Create Annual Budgets
    - Update Annual Budgets
    - View Annual Budgets
    - View Budget History
  - id: FRRN.042.02
    title: Create/ Update Annual Budget
    text:
    - The system shall allow authorized users to create and update existing annual budget records.
    - Information Captured
    - Budget Information
    - Fiscal Year
    - Organizational Information
    - Unit Head
    - Market Segment
    - Region (Not Applicable to Corporate)
    - Team (Corporate Only)
    - Sub-Team (Corporate Only)
    - Section Head
    - Team Head
    - Team Lead
    - Account Officer (Not Applicable to CBG)
    - Budget Targets
    - Monthly New Budget
    - Monthly Renewal Budget
    - Monthly Organic Budget
    - Totals
    - Annual New Budget
    - Annual Renewal Budget
    - Annual Organic Budget
    - Grand Total
    - The system shall automatically compute annual totals.
  - id: FRRN.042.03
    title: Budget Upload
    text:
    - The system shall allow authorized users to upload annual budget to create or update records.
    - Supported File Formats
    - Excel (.xlsx)
    - CSV (.csv)
    - The system shall provide a downloadable upload template.
  - id: FRRN.042.04
    title: Budget Validation
    text:
    - The system shall validate budget entries before saving.
    - Fiscal Year is required.
    - Market Segment is required.
    - Monthly budget amounts must be numeric.
    - Budget values cannot be negative.
    - Region is mandatory for Non-Corporate segments.
    - Team and Sub-Team are mandatory for Corporate segments.
    - AO budget assignment shall not be required for CBG.
  - id: FRRN.042.05
    title: View Annual Budgets
    text:
    - The system shall provide a Budget Inquiry screen where users can view the maintained renewal annual budget.
    - Information Displayed
    - Fiscal Year
    - Market Segment
    - Region
    - Team
    - Sub-Team
    - Section Head
    - Team Head
    - Team Lead
    - Account Officer
    - Monthly New Budget
    - Monthly Renewal Budget
    - Monthly Organic Budget
    - Annual New Budget
    - Annual Renewal Budget
    - Annual Organic Budget
    - 'The screen shall support:'
    - Search
    - Filter
    - Sort
    - Pagination
  - id: FRRN.042.06
    title: Budget History
    text:
    - The system shall maintain historical versions/ audit trail of budget records.
    - Information Captured
    - Fiscal Year
    - Market Segment
    - Region
    - Team
    - Sub-Team
    - Section Head
    - Team Head
    - Team Lead
    - Account Officer
    - Previous Budget
    - Updated Budget
    - Created By
    - Created Date
    - Modified By
    - Modification Date
- id: FRRN.043
  screen: Audit Logs
  capability: Audit Logs
  items:
  - id: FRRN.043.01
    title: Audit Logs Module and List View
    text:
    - The system shall include an "Audit Logs" section within the menu, for tracking all renewal activities.
    - The system shall display audit logs in a tabular format with sortable columns.
    - The system shall allow users to filter audit logs by
    - Date range
    - Action Type
    - Reference Number
    - User
    - 'The system shall display the following fields in the Audit logs table:'
    - Timestamp (Date & Time)
    - Module
    - Renewal
    - Reference Number (ID)
    - Client/Assured’s Name
    - Action Type (e.g., View, Create, Update, Delete)
    - Description
    - Old Value
    - New Value
    - Performed By (User Name)
    - Remarks
    - The system shall enable users to export audit log details as a CSV or Excel file containing only the records that
      match the applied filters.
    - 'File name: Audit Logs_MMDDYYYY where:'
    - Audit Logs_ is constant
    - MMDDYYYY is the extraction date
  - id: FRRN.043.02
    title: Audit Logs per record display
    text:
    - Upon opening a specific record, the system shall display a new section for audit logs.
    - Audit log fields
    - Timestamp (Date & Time)
    - Action Type (e.g., View, Create, Update Details, Update Status, Delete)
    - Description
    - Old Value
    - New Value
    - Performed By (Username)
    - Remarks
    - The system shall enable users to export audit log details as a CSV or Excel file.
- id: FRRN.044
  screen: Reports
  capability: Report Generation
  items:
  - id: FRRN.044.01
    title: Report Generation
    text:
    - The system shall provide authorized users with the ability to generate, preview, download, print, and export the following
      reports.
    - Pipeline Report
    - Full Production Report
    - Audit Log Report
    - CLPC Billing Report (Non-Built-In FIP)
    - CLPC Billing Report (Built-In HLS Amortized and Non-Built-In)
    - CLPC Billing Report (HLS Amortized Loan Release)
    - Successful and Fall-Out Accounts Report per Stage
    - Placement Summary Report
    - Successfully and Unsuccessfully Sent ePolicy Report
    - List of Expiring Accounts Report
    - Renewal Status Report
    - Generated Renewal Advice Report
    - Penetration Report
    - Hold Cover Report
    - Booked Non-Bank Client Report
    - Booked PEP Client Report
    - Accounts without Policy Number Report
    - Insurer Scorecard Report
    - Unapplied Payment Report with Disposition
    - Accounts Tagged as RMU from LAMD Report
    - Accounts Tagged as RMU but No Booking in System Report
    - Accounts Not Tagged as RMU but with Booking in System Report
    - Accounts from LAMD Report Tagged as Submitted in System Report
    - Accounts from LAMD Report Not Tagged as RMU and with No Submitted Records in System Report
    - The detailed specifications for each report shall be documented in the Annex.
    - All report generation, downloading, printing, and export activities shall be fully auditable and traceable.
    - All reports shall support filtering and date range selection where applicable.
    - 'The system shall allow authorized users to download generated reports in the following formats:'
    - Microsoft Excel (.xlsx)
    - PDF (.pdf)
    - CSV (.csv)
process_flow:
- Start
- Generate RMEL
- Sanitize List; Classify Accounts into Buckets
- Upload LAMD Report
- 'Paid / RMU tagged: update the disposition reason to ''Loan Fully Paid'' or ''Remedial Management Unit'', update the disposition
  to ''Not For Renewal'', flag as Exception'
- 'Upload Insurer Disposition: Accept - flag as Clean; Revise - flag as Review; Reject - flag as Exception'
- Assign Accounts to Officers
- Review and Provide Disposition
- 'Not for Renewal: provide the disposition reason, send the Not for Renewal letter'
- 'For Quotation: create quotation, send quote to client; client accept / revise / reject (reject: update the client disposition
  to ''Rejected''); accept: update account details and review computations, then validate payment'
- 'For Renewal: update account details and review computations, send to MTL for review; MTL approves? (no: back to update)'
- 'Check if the account has an insurer disposition; none: send to insurer for approval; insurer approves? (no: back to update)'
- 'Generate and send letters: For Renewal - generate and send RA; otherwise generate and send the Not for Renewal Letter'
- 'Client accepts? (no: back to review and provide disposition)'
- 'Validate payment: CBG - generate and send the CLPC billing file, receive the CLPC payment file, update the payment tagging,
  paid?; Non-CBG - provide the client payment confirmation'
- Submit for Placement
- 'Generate and send the placement file; insurer accepts? (no: receive the placement return file, return the account to
  Marketing for updating, update account details)'
- Receive E-Policy artifacts, update the policy number, send the e-policy to the client, book account
- End
