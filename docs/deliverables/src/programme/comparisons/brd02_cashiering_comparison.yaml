# ---------------------------------------------------------------------------------------------------------- 8 Conflicts
conflicts:
  - id: C1
    kind: Between the documents
    priority: High
    topic: Posting step for AR / OR issuance (maker-checker)
    bdoi: "The creator saves (status Created), submits for posting; the poster posts and only then the AR / OR number is generated (FRS.CSH.02.01.08-.10, 02.05)."
    ours: "“Issue AR and Apply” issues the AR from the branch series, applies the payment and opens the receipt (FR-OP-011); ORs likewise (FR-OP-012)."
    brd: Both
    brd_note: "CSHID.006 AC4: numbering “will be generated upon posting”; no BRD ID asks for a second person to post an issuance."
    platform: Our FRS
    decision: Must every AR and OR be posted by a second user before its number is issued?
    recommendation: "Issue at save for counter, file and PDC payments, so the client gets the AR at once and the series is used in order; give the TL a daily review list. If BDOI keeps the posting step, make it a configurable approval per receipt type (for example manual ORs only)."
  - id: C2
    kind: Between the documents
    priority: High
    topic: Meaning of reinstatement
    bdoi: "Reinstate an issued AR / OR: the receipt stays Issued and the payment is reversed to unapplied, AR Insurer Refund or AP Unapplied Commission (FRS.CSH.04.01)."
    ours: "Reinstate a cancelled receipt in full or in part; the reinstated amount is applied to the encoded invoice (FR-OP-014). Reversal of an issued receipt's application is the payment reversal of Incoming Requests."
    brd: Both
    brd_note: "CSHID.004 lists “Due to Cancellation” and “Mis-application of payment”; the BRD summary speaks of “payment application reinstatement” (p.84)."
    platform: Our FRS
    decision: Does reinstatement mean restoring a cancelled receipt, reversing a payment application, or both?
    recommendation: "Both, under one Reinstate action with the BRD's reasons: “Due to Cancellation” and bounced check restore a cancelled receipt; mis-application and withholding tax adjustment reverse the application of an issued receipt for re-application."
  - id: C3
    kind: Between the documents
    priority: Medium
    topic: Numbers of creation, cancellation and reinstatement records
    bdoi: "“<Prefix>-<Receipt Type>-<Sequence Number>” with CR, CN, RE and AR / OR (FRS.CSH.02.01.09)."
    ours: Cancellation CAN-yyyy-n and reinstatement RIN-yyyy-n (FR-OP-013, 014).
    brd: BRD silent
    brd_note: "CSHID.001: “auto-generates a transaction number for reinstatement”."
    platform: Our FRS
    decision: Which numbering applies?
    recommendation: Adopt BDOI's prefixes with the year (for example CN-AR-2026-000001); the numbering is configuration.
  - id: C4
    kind: Within BDOI's FRS
    priority: Medium
    topic: AR / OR number format and acknowledgement certificate number
    bdoi: "“<Prefix>-<Year>-<Branch Indicator>-<Sequence>”, “AR number digits: 10”; example AR20260000000001; the sample AR shows “AR 000149” and certificate “AC_125_022025_00482”; certificate convention blank."
    ours: Prefix per series (AR-HO-, AR-CEB-, OR-HO-) with a number range and the BIR ATP number (FR-OP-010).
    brd: BRD silent
    brd_note: "CSHID.006: “sequential or predefined format”."
    platform: Our FRS
    decision: The BIR-registered format of AR and OR numbers and of the certificate number (OQ05).
    recommendation: BDOI to give one format per receipt kind; BIBS sets it as the series prefix and range without a change.
  - id: C5
    kind: Between the documents
    priority: High
    topic: Minimal balance threshold
    bdoi: "“Minimal Balance (default PHP -1.00<= x <=1.00)” (FRS.CSH.02.05.12.01); report rule “Outstanding Amount <1”; its own mapping row quotes “Php 10.00 and below”."
    ours: Default 10.00 for premium and excess, configurable (FR-OP-023).
    brd: Our FRS
    brd_note: "CSHID.016: “Php 10.00 and below”; the Cashiering annex: “the defined minimal balance threshold”, configurable."
    platform: Our FRS
    decision: The threshold value for premium and for excess (OQ11).
    recommendation: Keep 10.00 as in the BRD unless BDOI decides otherwise; it is a parameter.
  - id: C6
    kind: Between the documents
    priority: High
    topic: Application hierarchy
    bdoi: "Check before cash; DST, Premium Tax (VAT), LGT, Other Charges, Basic Premium (FRS.CSH.02.05.11); review comment “Confirm first with Insurers for payment hierarchy”."
    ours: "DST, VAT, LGT, FST, other charges, basic premium; check before cash open (FR-OP-019, OQ09)."
    brd: BDOI's FRS
    brd_note: "CSHID.022 lists the five components without FST and “Mode of Payment hierarchy: Check, Cash”."
    platform: Our FRS
    decision: Where Fire Service Tax sits, and what “check before cash” means when one receipt has both.
    recommendation: "Keep FST as its own component after LGT (it is booked on fire policies); apply check payments before cash payments on the same invoice on the same day."
  - id: C7
    kind: Between the documents
    priority: Medium
    topic: Check holding period
    bdoi: "AR validation: “Check date should be less than Current Date – 4 working days (holding period)” (FRS.CSH.02.01.08)."
    ours: No check-date validation at receipt; 3 banking days before the payment is remitted (FR-OP-031, RMTID.017).
    brd: Our FRS
    brd_note: "No receipting rule in CSHID; RMTID.017: checks held 3 banking days before remittance."
    platform: Our FRS
    decision: Is a check refused at the counter within 4 working days of its date, and is it 4 working or 3 banking days?
    recommendation: Accept the check when it is presented (a post-dated check goes to the PDC warehouse); keep the holding period for remittance only.
  - id: C8
    kind: Between the documents
    priority: High
    topic: Direct Credit file
    bdoi: "Priority 1 matches the file against the payment records on BP filename and transaction number; the record must be Unbooked / Unmatched; else Invalid BP filename, Invalid Transaction Number or Duplicate (FRS.CSH.05.01.09)."
    ours: Every Direct Credit row is a new payment with its own AR (FR-OP-015).
    brd: BDOI's FRS
    brd_note: "CSHID.008 Direct Credit fields include BP Filename and Transaction No, which point to an earlier bills payment."
    platform: Our FRS
    decision: Is the Direct Credit file an identification of payments already received, or new money?
    recommendation: "Adopt BDOI's reading: the file identifies unmatched payments already receipted, so no second AR; new money arrives through the other channels."
  - id: C9
    kind: Between the documents
    priority: High
    topic: Cancellation of a remitted AR
    bdoi: "“If already remitted, Create/re-class reversed payment to AR Insurer Refund ... If not remitted, Reverse entry PR, DTIP” (FRS.CSH.03.01.08)."
    ours: "Every application is reversed and the invoices are outstanding again (FR-OP-013)."
    brd: BRD silent
    brd_note: "CSHID.012: “Post Accounting entries once cancellation is posted”."
    platform: Our FRS
    decision: How a cancelled AR whose premium was already remitted is accounted for.
    recommendation: Adopt BDOI's rule; it matches how our Adjustment FRs handle remitted premium (AR Insurer, FR-OP-057).
  - id: C10
    kind: Between the documents
    priority: Medium
    topic: Commission Schedule with failed or unmatched lines
    bdoi: "“The system shall not process the file if there are failed validations”; “If unmatched, the system shall not process the file”; paid amount must equal the outstanding balance."
    ours: Valid lines are staged and issued; failed lines stay staged with their reason (FR-OP-021).
    brd: Our FRS
    brd_note: "BRQID.006: batch processing continues when records fail and logs them."
    platform: Our FRS
    decision: Whole-file rejection or line-level processing; exact amount match or partial commission payments.
    recommendation: Line-level processing as BRQID.006 asks, with the exceptions listed; partial payments allowed and shown as such.
  - id: C11
    kind: Between the documents
    priority: Medium
    topic: One OR per commission schedule or per insurer and certificate
    bdoi: "“Generate/Issue one OR for the total commission schedule/commission check” (FRS.CSH.02.05.14); “single OR per Insurer or Payee, per batch” (FRS.CSH.07.01.02)."
    ours: One OR per insurer, certificate and payment for Collection details; one OR per remittance batch (FR-OP-021, OQ49).
    brd: Both
    brd_note: "CSHID.007: individual OR per check, or consolidated when the same insurer / payee and the same certificate; “One OR per Remittance Batch number”."
    platform: Our FRS
    decision: The consolidation rule of commission ORs.
    recommendation: One OR per insurer / payee and certificate per schedule or batch, as CSHID.007 states.
  - id: C12
    kind: Between the documents
    priority: High
    topic: When the remittance OR is generated
    bdoi: "“Insurer Settlement coming from Disbursement ... OR to be generated once disbursement is approved” (FRS.CSH.07.01.01, added 09-Oct-2026)."
    ours: The commission OR is issued when the Remittance TL approves the batch (FR-OP-035).
    brd: Both
    brd_note: "BRD p.84: “OR issuance for commission deducted from for remittance. There should be one OR per settlement batch per Insurer.”"
    platform: Our FRS
    decision: The trigger of the commission OR (remittance approval or Disbursement approval).
    recommendation: "Comptrollership decides the point at which the commission OR is issued; moving it to the Disbursement approval is a platform change."
  - id: C13
    kind: Between the documents
    priority: Medium
    topic: Who works the unapplied payments
    bdoi: "Marketing, Cashiering and Commission Receivable users; Marketing Support and Cashiering assign dispositions; reclass by Cashiering only; Marketing may transfer to Cashiering (FRS.CSH.06.01-06.02)."
    ours: The Cashier assigns and the Cashiering TL approves; Collections asks through Incoming Requests (FR-OP-022; BRD-4).
    brd: BRD silent
    brd_note: "CSHID.024: “Users can assign a disposition” (no persona)."
    platform: Our FRS
    decision: Do Marketing and Commission Receivable users work the unapplied list directly?
    recommendation: Keep Cashiering ownership with requests from Collections, as the BRD-4 Collections FRS specifies; give Marketing read access to the items of its unit.
  - id: C14
    kind: Between the documents
    priority: Medium
    topic: AP Unapplied Commission and AR Insurer Refund as unapplied types
    bdoi: "Unapplied types include “AR Insurer Refund” and “AP Unapplied Commission ... for Commission Receivable users” (FRS.CSH.06.01.03)."
    ours: AR Insurer is a receivable from the insurer set up by Adjustment; no AP Unapplied Commission.
    brd: BRD silent
    brd_note: No BRD ID names these types.
    platform: Our FRS
    decision: Are these two types items of the unapplied list?
    recommendation: Add AP Unapplied Commission for reversed ORs; keep AR Insurer as a receivable, shown on the list for information.
  - id: C15
    kind: Between the documents
    priority: Medium
    topic: Post-dated checks
    bdoi: "“The system shall process list of matured post dated checks ... integrated from PMS to new Core via MFT” (FRS.CSH.05.01.04)."
    ours: Checks are warehoused in BIBS with a PDCW number and matured by the daily run (FR-OP-016).
    brd: Our FRS
    brd_note: "CSHID.008: upload of the list of received PDCs for the day, a system-generated number, a repository, a list; matured checks transacted automatically."
    platform: Our FRS
    decision: Is PMS or BIBS the warehouse of post-dated checks?
    recommendation: "Keep the BIBS warehouse (BRD); load it from the PMS list, so PMS stays the source of the checks."
  - id: C16
    kind: Between the documents
    priority: Medium
    topic: AR form and signature
    bdoi: "“THIS IS A SYSTEM GENERATED RECEIPT. NO SIGNATURE IS REQUIRED.”; header, footer and certificate lines (FRS.CSH.02.06.03, Sample AR)."
    ours: The AR / OR PDF has a Cashier signature line; layout draft (chapter 17).
    brd: BRD silent
    brd_note: "CSHID.019: “formatted according to standards”."
    platform: Our FRS
    decision: Confirm BDOI's AR and OR forms as the standard.
    recommendation: Adopt BDOI's forms.
  - id: C17
    kind: Within BDOI's FRS
    priority: Low
    topic: Note on the AR
    bdoi: "FRS text: “Note: Official receipt to be issued by the insurance company.”; Sample AR: “Note: Invoice to be issued by the insurance company”."
    ours: "-"
    brd: Not stated
    brd_note: "-"
    platform: "-"
    decision: Which note is printed?
    recommendation: BDOI to choose; the text is part of the form.
  - id: C18
    kind: Between the documents
    priority: Low
    topic: File size limit
    bdoi: "“File size is within limit (max of 50MB)”."
    ours: Not stated; BIBS accepts files up to 25 MB.
    brd: Not stated
    brd_note: "-"
    platform: Neither
    decision: Confirm 50 MB.
    recommendation: Set 50 MB.
  - id: C19
    kind: Within BDOI's FRS
    priority: Medium
    topic: File formats
    bdoi: "“Uploaded files are in .csv format with pipe delimiter”, but Bills Payment, PDC and Trade are .txt, CLPC is .xlsx, Direct Credit .txt or Excel; the Trade sample is separated by spaces or tabs, not pipes."
    ours: One configurable layout per channel (any of Excel, CSV, delimited or fixed-width text).
    brd: Our FRS
    brd_note: "CSHID.008: Bills TXT, Trade TXT, CLPC Excel, PDC Excel, Direct Credit TXT."
    platform: Our FRS
    decision: The definitive format of each channel's file (OQ03).
    recommendation: Keep one layout per channel as configuration; BDOI to confirm each layout with the channel owner.
  - id: C20
    kind: Between the documents
    priority: Medium
    topic: Exchange rate for USD receipts
    bdoi: "“effective revaluation rate (Revaluation - Transaction Rate)” for issuance and cancellation; “Conversion rate at time of issuance” for reinstatement."
    ours: Comptrollership BOOK rate with 2 decimals at the receipt date; cancellation and reinstatement at the receipt's rate (FR-OP-027).
    brd: Our FRS
    brd_note: "CSHID.012-014: “Comptrollership exchange rate table”, 2 decimals."
    platform: Our FRS
    decision: Name and source of the rate.
    recommendation: One rate from the Comptrollership table; reversals at the rate of the original receipt.
  - id: C21
    kind: Between the documents
    priority: Low
    topic: Cancellation reasons
    bdoi: "Error in Issuance Details, Double issuance, Others; for checks only Discrepancy in check amount, No signature, Incorrect payee, Incorrect check details; Incorrect payment details."
    ours: "The BRD lists in four groups, including Check not picked-up, Negative VAT, Discount not applied, PDC retrieval / replacement, Bounced or returned check, Error printing."
    brd: Our FRS
    brd_note: CSHID.003 lists all of ours.
    platform: Our FRS
    decision: Which reasons stay, and whether check payments are limited to check reasons.
    recommendation: Keep the BRD list (it is a maintained list); add the check-payment restriction if BDOI wants it.
  - id: C22
    kind: Between the documents
    priority: Low
    topic: Partial reinstatement
    bdoi: "“select single or multiple account numbers within the selected AR number”; not for ORs."
    ours: Partial reinstatement by amount.
    brd: Both
    brd_note: "CSHID.001 AC9: “Full / Partial Reinstatement”; CSHID.005: “Amount reinstated”."
    platform: Our FRS
    decision: Partial by account, by amount, or both.
    recommendation: By account, with the amount per account shown.
  - id: C23
    kind: Between the documents
    priority: Low
    topic: Encoded reinstatement fields
    bdoi: "Inputs: type, account numbers, remarks (100 characters), reason."
    ours: "Invoice, AR / OR no., assured / payor, amount, Account Officer, Unit Head, Team Leader (premium); not required for a bounced check."
    brd: Our FRS
    brd_note: CSHID.005 lists the fields of ours.
    platform: Our FRS
    decision: Are the BRD's fields still required?
    recommendation: Keep them, defaulted from the receipt.
  - id: C24
    kind: Between the documents
    priority: Low
    topic: Device for access
    bdoi: "“System shall be accessible using BDO issued device” (FRS.CSH.01.01)."
    ours: Log-in from a browser; responsive screens.
    brd: Our FRS
    brd_note: "NFR: “same performance on mobile and desktop”."
    platform: Our FRS
    decision: Is access limited to BDO-issued devices?
    recommendation: Enforce it through BDO's network and device policy if required; no change to the screens.
  - id: C25
    kind: Between the documents
    priority: Low
    topic: Remarks and bank account mandatory on the AR
    bdoi: "Remarks (max 200 characters) and Post to Bank Account are required fields (FRS.CSH.02.01.06)."
    ours: Neither field exists on Receive Payment.
    brd: BRD silent
    brd_note: "-"
    platform: Our FRS
    decision: Are remarks and the bank account mandatory?
    recommendation: Bank account mandatory (defaulted by currency as BDOI proposes); remarks optional.
  - id: C26
    kind: Between the documents
    priority: Medium
    topic: PR 2307 base and tag
    bdoi: "Account “BIR 2307 tag”; “PR2307 = 2% of Premium Amount” (FRS.CSH.02.05.13)."
    ours: 2% CWT client flag; 98% of the premium applied (FR-OP-018; OQ10).
    brd: Both
    brd_note: "CSHID.020: “only 98% will be applied” for accounts with 2% CWT."
    platform: Our FRS
    decision: Is the tag on the client or the account, and is the 2% of the basic premium or of the gross premium?
    recommendation: "Tag per account, defaulted from the client; Comptrollership states the base of the 2% (basic or gross premium); BIBS keeps the share applied as a parameter."
  - id: C27
    kind: Within BDOI's FRS
    priority: Low
    topic: Sample Billspayment file
    bdoi: "Appendix A “Sample Billspayment file” shows a file named “BDOI202504031PMSEBIX_sample.TXT”, which follows the PDC convention BDOIYYYYMMDDPMS.txt, not BDOIYYYYMMDD.txt."
