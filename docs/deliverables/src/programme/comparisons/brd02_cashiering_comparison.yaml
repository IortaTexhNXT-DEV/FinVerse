# ---------------------------------------------------------------------------------------------------------- 5 Requirement mapping
mapping:
  - id: "FRS.CSH.01.01"
    capability: "Access / Log in"
    quote: "“System shall be accessible using BDO issued device”"
    ours: "FR-OP-001"
    match: "Different"
    difference: "Ours does not restrict the device; the BRD asks for the same performance on mobile and desktop."
    platform: "No"
    action: "Needs BDOI decision"
    action_detail: "C24. A device restriction is enforced by BDO's network and device policy, not by a screen."
  - id: "FRS.CSH.01.02"
    capability: "Role / Profile Log In"
    quote: "“block access ... User is not defined; User access is already expired”"
    ours: "FR-OP-001, 002"
    match: "Same"
    difference: "Ours shows one message for every refused log-in (“Invalid user name or password”) so that the reason is not revealed."
    platform: "Yes"
    action: "Keep ours"
    action_detail: "Keep the single message; the lock shows to the System Administrator."
  - id: "FRS.CSH.01.03.01-.02"
    capability: "Dashboard"
    quote: "“display both count and amount per item” for AR / OR for posting by type, cancellation and reinstatement for posting, returned lists, unapplied by type and auto payment files"
    ours: "FR-OP-003; SCR-OP-07"
    match: "Partial"
    difference: "Ours shows live counts per queue (unapplied, dispositions and receipt actions for approval, pre-booked, PDCs) without amounts and without per-type rows; no “for posting” or “returned” tiles because issuance posts at once."
    platform: "Partly"
    action: "Platform change"
    action_detail: "Add amounts and per-type tiles; the posting tiles depend on C1."
  - id: "FRS.CSH.01.03.03"
    capability: "Main navigation"
    quote: "Create AR/OR, Post- Issuance, Edit, Cancel AR/OR, Reinstate AR/OR, Batch Print, Unapplied Payments, Automatic Payment Processing Uploading, Reports"
    ours: "FR-OP-002, 003; chapter 12"
    match: "Partial"
    difference: "Ours: Receive Payment, Receipts, Unapplied Payments, Incoming Requests, Pre-booked Payments, Payment Uploads, PDC Warehouse, Batch Print, Commission ORs, Receipt Series, Cashiering Setup; no separate posting entries."
    platform: "Partly"
    action: "Needs BDOI decision"
    action_detail: "Follows C1."
  - id: "FRS.CSH.01.03.04"
    capability: "Lists per summary group"
    quote: "tabular form ... Allow user to filter status"
    ours: "SCR-OP-09; SCR-OP-11"
    match: "Partial"
    difference: "Ours lists receipts and unapplied payments with filters; BDOI's columns (creation record number, receipt type, account / invoice, client, insurer) are partly shown."
    platform: "Partly"
    action: "Adopt BDOI wording"
    action_detail: "Take BDOI's column lists into the screen specifications."
  - id: "FRS.CSH.02.01.01-.02"
    capability: "Create AR – inputs"
    quote: "Receipt Type; AR type Premium / Non-Premium (Refund from Insurer, Other Expenses, AR Insurance); Entry Type Client / Insurer / Other; Post to Bank Account; Paid Amount (max of 1B); Remarks (max 200); Receipting Branch"
    ours: "FR-OP-011, 020; SCR-OP-08"
    match: "Partial"
    difference: "Ours has the AR class (channels and non-premium types), payor, references, amount, currency, mode, check no. and bank, payment date. Not in ours: entry type, bank account to post to, receipting branch choice (ours uses the user's branch), the 1B limit, remarks."
    platform: "Partly"
    action: "Platform change"
    action_detail: "Add entry type, bank account and branch; adopt BDOI's lists (bank accounts and branches maintained as lists, per the review comments)."
  - id: "FRS.CSH.02.01.03-.05"
    capability: "Create AR – account table"
    quote: "Premium Receivable, Commission Receivable, Total Invoice, Total Paid, Outstanding, PR 2307 Amount, Paid Amount (per account), Excess Amount; “Add” button"
    ours: "FR-OP-011, 018, 019; SCR-OP-08 preview"
    match: "Partial"
    difference: "Ours previews each invoice by component with the amount applied, the 2% CWT withheld and the excess; the payment is applied oldest first, not split per account by the user."
    platform: "Partly"
    action: "Needs BDOI decision"
    action_detail: "Manual split per account (BRD summary 1.j) or automatic oldest first; to settle in the decision session with C1."
  - id: "FRS.CSH.02.01.06"
    capability: "Create AR – mandatory fields"
    quote: "required fields ... Payor Name, Payment Type, Post to Bank Account, Paid Amount, ... Currency, Remarks"
    ours: "SCR-OP-08"
    match: "Different"
    difference: "Remarks and bank account are mandatory in BDOI's; ours has neither field."
    platform: "No"
    action: "Needs BDOI decision"
    action_detail: "C25."
  - id: "FRS.CSH.02.01.08 (currency)"
    capability: "Create AR – validation"
    quote: "“Account's booked currency should be the same as the receipt record currency”"
    ours: "FR-OP-011"
    match: "Not in ours"
    difference: "Ours receipts in the currency received and converts at the BOOK rate; no check against the booked currency."
    platform: "No"
    action: "Platform change"
    action_detail: "Add the check (or the conversion rule if a USD payment of a peso account is allowed)."
  - id: "FRS.CSH.02.01.08 (check date)"
    capability: "Create AR – validation"
    quote: "“Check date should be less than Current Date – 4 working days (holding period)”"
    ours: "FR-OP-031 (Remittance)"
    match: "Different"
    difference: "Ours has no check-date check at receipt; a 3 banking day holding period applies before the payment is remitted (RMTID.017)."
    platform: "No"
    action: "Needs BDOI decision"
    action_detail: "C7."
  - id: "FRS.CSH.02.01.08.02-.12"
    capability: "Create AR – save, request number, submit for posting"
    quote: "Set AR Creation Record Status = Created ... <Prefix>-<Receipt Type>-<Sequence Number> ... “Record is now submitted for Posting”"
    ours: "FR-OP-011"
    match: "Different"
    difference: "Ours issues the AR when the cashier saves (“Issue AR and Apply”); there is no created record, request number or posting step."
    platform: "No"
    action: "Needs BDOI decision"
    action_detail: "C1 and C3."
  - id: "FRS.CSH.02.01.13"
    capability: "Create AR – edit"
    quote: "“edit created AR Creation Record if status is not equal to ... For Posting, Issued”"
    ours: "-"
    match: "Not in ours"
    difference: "No draft receipt to edit in ours."
    platform: "No"
    action: "Needs BDOI decision"
    action_detail: "Follows C1."
  - id: "FRS.CSH.02.01.14"
    capability: "Create AR – audit trail"
    quote: "Module, Transaction type, Username, Date and Timestamp, Transaction Number, AR Number, modifications"
    ours: "FR-OP-024"
    match: "Same"
    difference: "Ours records the seven items of the IT audit standard (adds origin of the event and success or failure)."
    platform: "Yes"
    action: "Keep ours"
    action_detail: "Use the seven items in every audit sub-item."
  - id: "FRS.CSH.02.02.01-.02"
    capability: "Create OR – inputs"
    quote: "Official Receipt Type: Fee Invoice, Contingent Profit Commission (CPC), Commissions, Incentives, Others; Receipting Branch default HO; Entry Type Insurer (default); Payment Type Cash, Check, Direct Credit; Post to Bank Account"
    ours: "FR-OP-012; SCR-OP-09 Issue Official Receipt"
    match: "Partial"
    difference: "Ours: OR type (service fee, profit share, commission, incentive, others), payor, currency, mode, gross, VAT, withholding tax, 2307 certificate ref.; no bank account and no entry type."
    platform: "Partly"
    action: "Adopt BDOI wording"
    action_detail: "OR types as a maintained list with BDOI's values; bank account as in FRS.CSH.02.01."
  - id: "FRS.CSH.02.02.03-.07"
    capability: "Create OR – Commission Schedule file intake"
    quote: "“.csv format, pipe delimiter”; “max of 50MB”; duplicate check; validation report; “shall not process the file if there are failed validations”"
    ours: "FR-OP-021; SCR-OP-20"
    match: "Partial"
    difference: "Ours uploads the commission payment details (insurer, payee, certificate, payment ref., invoice, basic commission, VAT, WTAX, date) from the Excel template; failed rows stay staged with their reason. BDOI's field list is blank."
    platform: "Partly"
    action: "Needs BDOI decision"
    action_detail: "C10; BDOI to give the Commission Schedule fields."
  - id: "FRS.CSH.02.02.08"
    capability: "Create OR – other income"
    quote: "incentive payments, allow selection of Valid for Collection SOA; Fee Policy payment, allow selection of Fee Policy invoice"
    ours: "FR-OP-012"
    match: "Not in ours"
    difference: "Ours enters OR lines with a description; no selection of the SOA or the fee invoice."
    platform: "No"
    action: "Platform change"
    action_detail: "Link the OR to the SOA or fee invoice it settles."
  - id: "FRS.CSH.02.02.09.01-.05"
    capability: "Create OR – matching of the schedule"
    quote: "Match Reference Number ... Account Number (new core); Paid amount = outstanding balance; “If unmatched, the system shall not process the file”"
    ours: "FR-OP-021"
    match: "Different"
    difference: "Ours does not require the paid commission to equal the outstanding amount and processes the valid lines."
    platform: "No"
    action: "Needs BDOI decision"
    action_detail: "C10."
  - id: "FRS.CSH.02.02.09.10-.19"
    capability: "Create OR – save, submit, edit, audit"
    quote: "Same cycle as the AR (Created, request number CR-OR, For Posting)"
