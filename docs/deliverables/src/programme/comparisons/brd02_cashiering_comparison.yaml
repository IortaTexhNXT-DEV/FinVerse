# Comparison of BDOI's Operations Cashiering FRS (BDO ITG) with the BIBS FRS BRD-2 Operations v2.1, cashiering scope.
# Read by build_brd02_cashiering_comparison.py (same folder). Sheets 1-5, 8 and 10; the lists of sheets 6, 7 and 9 are in
# brd02_cashiering_comparison_lists.yaml. Quotes of BDOI's FRS are short and word for word (typing errors kept).
# Values of the drop-down columns are listed in the builder (MATCH, PLATFORM, ACTIONS, COVERAGE and the others).

meta:
  title: BDOI FRS vs BIBS FRS – Operations Cashiering
  doc_type: Comparison workbook
  brd: BRD-02
  version: "1.0"
  date: 09 October 2026
  filename: BIBS_Comparison_BRD-02_BDOI_FRS_vs_BIBS_FRS_Operations_Cashiering_v1.0.xlsx
  subtitle: >-
    BDOI's FRS “Operations - Cashiering” (BDO ITG, revision 1.1 of 09-Oct-2026) and the BIBS FRS BRD-2 Operations v2.1
    (08-Oct-2026), cashiering scope: pros and cons, coverage, mapping, conflicts and the plan to bring our content into
    BDOI's format
  bdoi_file: FRS - BDOI Core Replacement Operations Cashiering v3.1 (BDOI).docx
  ours_name: BIBS FRS BRD-2 Operations v2.1 (08-Oct-2026), cashiering scope

# ---------------------------------------------------------------------------------------------------------- 1 Summary
summary:
  purpose:
    - item: What the document is for
      bdoi: >-
        BDO ITG's Functional Requirements Specification of the Cashiering module of the New BDO Insure Brokering System
        (project PRJ0012475, Drop 1): “how business requirements which are baselined in the Business Requirements
        Document (BRD) ... are to be implemented in the IT systems”. Once approved it is “the official baseline of
        functional requirements” under BDOI's change management.
      ours: >-
        The project team's FRS of BRD-2 Operations v2.1, issued for BDOI business sign-off: how BIBS meets every
        Operations requirement with actors, flows, rules, validations, screens, messages, notifications, audit and
        acceptance criteria. Cashiering is one of eight areas; it is the basis of the BRD-2 test plan and UAT.
      note: >-
        The two documents serve the same purpose for the same BRD. BDOI's is the document BDOI's SDLC signs; ours is the
        detailed specification of the proposed BIBS screens and the source of the test plan.
    - item: Author, version and status
      bdoi: >-
        Prepared by Abegail Panghulan (System Analyst, BDO ITG). Revision log: 1.0 of 26-Aug-2026 (initial) and 1.1 of
        09-Oct-2026 (“Updated Automatic Generation of OR – coming from Disbursement”); the file is named v3.1. Reviewers
        and approvers not yet named on the sign-off sheet; 15 review comments in the file.
      ours: >-
        iorta TechNXT Business Analysis; v2.1 of 08-Oct-2026, re-based on the Operations BRD v1.01 and the May 2026
        annexes; status “Issued for BDOI business sign-off”; approvers named in the distribution list.
      note: Ask BDOI ITG which number is the version of record (1.1 in the log, 3.1 in the file name).
    - item: Scope and structure
      bdoi: >-
        One document for Cashiering: Introduction, Business Requirements Mapping (33 BRD IDs), one Functional
        Requirements table of 18 FR items in 9 groups, Signoff Sheet, Appendix A (sample AR, Billspayment, CLPC and
        Trade files) and Appendix B (references). 95 pages.
      ours: >-
        One FRS for all of Operations (24 chapters, 82 FRs). Cashiering scope: FR-OP-008 to FR-OP-028 and FR-OP-132
        (20 FRs; FR-OP-017 and FR-OP-026 removed from scope), with the access FRs FR-OP-001 to 003, 15 screen
        specifications, messages, notifications, walkthroughs, documents, upload layouts and traceability.
      note: Sheet 2 compares the structure section by section.
  pros_cons:
    bdoi_pros:
      - Written by BDO ITG in its own FRS template with the sign-off sheet that BDOI's SDLC expects; BDOI owns it.
      - "Concise: the whole cashiering cycle in one table of 18 FR items, in the order the cashier works."
      - "Exact field lists for creating an AR or OR (types, defaults, bank accounts, receipting branches, limits) and for every list and filter."
      - 18 reports with description, fields, file name and format; this fills 11 of the 12 report layouts that are draft in ours.
      - "Business rules we lack: remitted and not remitted cases on cancellation and reinstatement, legacy matching keys (QPS, ISYS, Ebix, loan application number), Direct Credit identification, the AR template with its certificate number, and four sample files."
    bdoi_cons:
      - "Blank placeholders: “User Role:” in every item, GL entries without accounts, certificate number convention, staging fields, Commission Schedule fields, PDC layout, unapplied data elements, OR mapping."
      - No acceptance criteria, worked examples, screen layouts, message catalogue, notifications or process flows; not testable as it stands.
      - "Traceability gaps: BRQID.001-007 and CSHID.011 have no FR ID; no BRD page references; reason lists shorter than the BRD (CSHID.003, 004); the encoded fields of CSHID.005 are not captured."
      - "Internal inconsistencies: AR number “10” digits vs AR20260000000001 vs “AR 000149”; minimal balance ±1.00 vs Php 10.00; “.csv format, pipe delimiter” vs TXT and Excel files; numbering gaps and duplicates."
      - "Not yet sign-off ready: reviewers and approvers blank, 15 open review comments, revision 1.1 in a file named v3.1."
    ours_pros:
      - Every in-scope BRD ID of the cashiering scope traced with its page to FRs, screens and test cases (76 test cases for the cashiering FRs).
      - "Testable: 55 numbered acceptance criteria with worked amounts and 52 validations with the exact message."
      - "The screens as BIBS shows them: 15 screen specifications with screenshots, field and action tables; 124 messages quoted; notifications."
      - Rules marked configurable or fixed with default values and where they are maintained; default accounting entries per event.
      - Re-based on BRD v1.01 and the May 2026 Cashiering annex; removed IDs explained; open questions and clarifications listed for decision.
    ours_cons:
      - "Length and spread: Cashiering is one area of a 24-chapter Operations FRS; a cashier reads chapters 4, 5, 6, 9, 11 and 13 to 18."
      - Not in BDO ITG's template and not authored by BDOI; FR-OP IDs differ from BDOI's FRS.CSH IDs.
      - 12 of the 24 cashiering report layouts and the AR / OR layout are draft (OQ42); BDOI's FRS gives 11 of the 12.
      - "Reads some requirements differently from BDOI: no posting step for AR / OR issuance, reinstatement only of a cancelled receipt, Direct Credit as new payments, remitted AR cancellation (sheet 8)."
      - "Technical traces in a business document: message codes, list and parameter names, seed references in acceptance criteria."
  recommendation:
    - item: Recommended way forward
      note: >-
        Option A. Make BDOI's ITG FRS the master document of the Cashiering sign-off and bring our content into it. Keep
        BDOI's FR IDs (FRS.CSH.nn.nn.nn) as the primary IDs and write our FR-OP-nnn, screen IDs and test case IDs as
        cross-references in BDOI's own empty column “Application Feature Model”. Fill BDOI's blanks from ours (user
        roles, GL entries, field lists, report rules); add our rules, validations and acceptance criteria to each FR item
        as numbered sub-items in BDOI's “The system shall ...” style; add Annexes C to K (upload layouts, report layouts,
        roles and configuration, accounting entries, screen specifications, messages, notifications, walkthroughs and
        storyboard, open items). First settle the decisions of sheet 8 with BDOI Cashiering, Comptrollership and ITG.
        Our FRS v2.1 stays the supporting specification of the screens and the test plan until the merged document is
        signed; its cashiering chapter then refers to BDOI's IDs. Sheet 10 gives the order of work and the effort.
    - item: Why this option
      note: >-
        BDOI's SDLC signs ITG's template and ITG keeps it after go-live; BDOI's business users already know its
        structure; our detail closes its gaps without changing its shape; one document is signed, so the two cannot
        drift; the cross-reference column keeps the test plan and the screens traceable.
    - item: "Alternative B: our FRS as the master"
      note: >-
        Wrap our cashiering chapter in BDOI's cover, revision log and sign-off sheet and list BDOI's FR IDs as
        cross-references. Fastest to complete (the content exists), but BDOI ITG loses authorship, reviews a long vendor
        document and must maintain a structure it did not choose; BDOI's own field and report lists still have to be
        merged in.
    - item: "Alternative C: two documents side by side"
      note: >-
        Sign BDOI's FRS as the business baseline and our FRS as the system specification, linked by sheet 5 of this
        workbook. Least editing now, but two documents to keep in step after every change, the decisions of sheet 8 are
        still needed, and the test plan traces to a document that is not the signed baseline.
  decisions_intro: >-
    Decisions needed from BDOI before the merge (sheet 8 gives each side's text and our recommendation):

# ---------------------------------------------------------------------------------------------------------- 2 Structure
structure:
  - bdoi: Cover (project, title, prepared by)
    ours: Front matter (title page, document control, distribution)
    bdoi_content: "“PRJ0012475 – New BDO Insure Brokering System | Operations - Cashiering”, preparer."
    ours_content: Title, BRD, version, status, document control 0.9 to 2.1, distribution with 12 roles and their purpose.
    depth: Ours deeper
    assessment: Keep BDOI's cover; add the distribution of ours as a table after the revision log.
  - bdoi: Document Revision Log
    ours: Document control
    bdoi_content: Two entries (1.0 of 26-Aug-2026, 1.1 of 09-Oct-2026).
    ours_content: Six versions with author, reviewer, approver and the change of each.
    depth: Similar
    assessment: Keep BDOI's log; add an entry for the merged version (for example 1.2) naming the BIBS content added.
  - bdoi: "Introduction: Document Purpose; Project Overview with Key Objectives; Document Preparation, Review and Approval"
    ours: "1 Introduction (purpose, scope, references, definitions, how to read); 2 Business context and process overview"
    bdoi_content: Purpose of an FR document, module overview and six objectives, who prepares and approves.
    ours_content: Scope table with BRD IDs, removed and moved IDs, out of scope items, 8 references with pages, glossary of 36 terms, before / after process, process figure, invoice statuses.
    depth: Ours deeper
    assessment: Keep BDOI's text; add scope (in, out, removed CSHID.009, 026, 027), definitions and the process overview of the cashiering steps.
  - bdoi: Business Requirements Mapping (BRD Req No → FR IDs) and List of Integrations
    ours: 11 Traceability; 7 Interfaces and integration; 22 User-story view
    bdoi_content: 33 BRD IDs with the BRD text and the FR IDs; two integrations (OBPCS via MFT, PMS for PDC).
    ours_content: Every BRD ID with page, FRs, screens and test cases; coverage summary; 20 interfaces and feeds with direction and scope; user story per BRD ID.
    depth: Ours deeper
    assessment: "Keep BDOI's table; fill the eight blank rows; add columns for the BRD page, our FR-OP IDs and the test cases; complete the list of integrations."
  - bdoi: "Functional Requirements: Log in and Dashboard (FRS.CSH.01.01-01.03)"
    ours: 4.1 FR-OP-001 to 003; 12 Navigation; SCR-OP-07
    bdoi_content: BDO device, log-in, profile-based access, dashboard tiles with count and amount, main navigation, lists per group.
    ours_content: Log-in and lock rules, permissions and four-eyes rules, home by role with live tiles, menus by persona.
    depth: Similar
    assessment: Merge; BDOI's tile list is more detailed (amounts, per type), ours adds roles and permissions.
  - bdoi: "Creation of AR/OR (FRS.CSH.02.01-02.06)"
    ours: FR-OP-010, 011, 012, 018 to 021, 023, 025, 027; SCR-OP-08, 09, 10, 18, 20, 21
    bdoi_content: Create AR, create OR with commission schedule upload, series, batch printing, manual posting with application, minimal balance, BIR 2307, GL posting, AR / OR template.
    ours_content: Same topics with rules, validations, fields, ACs; no posting step and no template set-up; default entries in chapter 5.
    depth: Both detailed
    assessment: Merge sub-item by sub-item (sheet 5); decide the posting step first (C1).
  - bdoi: "Cancellation of AR/OR (FRS.CSH.03.01)"
    ours: FR-OP-013; workflow OPS_RECEIPT_ACTION (chapter 5)
    bdoi_content: Search, select one or many, reasons, save, submit, post, remitted and not remitted reversal, GL, audit.
    ours_content: Request, approval by the Cashiering TL / TH, reversal of every application, reasons of the BRD, validations, ACs.
    depth: Both detailed
    assessment: Merge; decide the remitted case (C9) and the numbering (C3).
  - bdoi: "Reinstatement of AR/OR (FRS.CSH.04.01)"
    ours: FR-OP-014; Incoming Requests (payment reversals)
    bdoi_content: Reinstatement of an issued receipt by account, with remitted, not remitted and OR branches.
    ours_content: Reinstatement of a cancelled receipt, full or by amount, with the BRD's encoded fields.
    depth: Both detailed
    assessment: The two read the requirement differently (C2); merge after the decision.
  - bdoi: "Automatic Payment Processing (FRS.CSH.05.01)"
    ours: FR-OP-008, 015, 016, 018, 132; SCR-OP-14, 15, 16; chapter 18 Bank payment files
    bdoi_content: Manual and MFT intake, validation, file names, matching priorities with legacy keys, Direct Credit matching, ARs, application, run report.
    ours_content: Uploads per channel with configurable layouts, PDC warehouse, pre-booked queue and re-matching, payment gate of New Business, run report.
    depth: Both detailed
    assessment: Merge; Direct Credit (C8), PDC (C15) and MFT intake to decide.
  - bdoi: "Unapplied Payment Disposition Facility (FRS.CSH.06.01-06.02)"
    ours: FR-OP-022, 023; SCR-OP-11, 12, 13; workflow OPS_DISPOSITION
    bdoi_content: Sources of unapplied records, filters and columns, disposition types, tabs.
    ours_content: Origins, disposition types with actions and approval, reversal, bulk actions, requests of other modules, 11 validations.
    depth: Ours deeper
    assessment: Merge; decide who disposes (C13) and the AP Unapplied Commission type.
  - bdoi: "Automatic Generation of OR (FRS.CSH.07.01)"
    ours: FR-OP-021; FR-OP-035 (Remittance)
    bdoi_content: OR generated when Disbursement approves the insurer settlement; one OR per insurer per batch; mapping blank.
    ours_content: Commission OR issued at the approval of the remittance batch; commission ORs from Collection details.
    depth: Similar
    assessment: Decide the trigger (C12).
  - bdoi: "Record Inquiry (FRS.CSH.08.01)"
    ours: FR-OP-024, FR-OP-004, FR-OP-005; SCR-OP-02, 03, 09
    bdoi_content: Payment record inquiry and account record inquiry with policy, endorsement, payment and remittance details.
    ours_content: Receipt search on the ten BRD criteria with search log; Invoice 360 with the payment history and the records of every team.
    depth: Similar
    assessment: Adopt BDOI's two inquiries as the headings and map them to our two screens.
  - bdoi: "Generate Reports (FRS.CSH.09.01-09.02)"
    ours: FR-OP-009, 028; 6.1 Cashiering reports
    bdoi_content: Report facility and 18 reports with fields, file names and formats.
    ours_content: Report Centre with view and export rights, archive; 24 reports, 12 with draft layouts.
    depth: BDOI's deeper
    assessment: Take BDOI's report fields into Annex D; add our six reports BDOI does not list.
  - bdoi: (no section)
    ours: 3 Personas and roles; permissions matrix
    bdoi_content: "“User Group: Cashiering”, “User Role:” blank in every item."
    ours_content: 15 personas with their BIBS role, the Operations permissions, role-to-permission matrix, segregation of duties.
    depth: Only ours
    assessment: Fill the user role line of each FR item; matrix as Annex E.
  - bdoi: (no section)
    ours: 5 Workflows and accounting events
    bdoi_content: "Statuses inside the FR text; GL entries “Debit: Credit:” left blank."
    ours_content: Workflows with stages, owners and SLA hours; diagrams; default entry of every cashiering event.
    depth: Only ours
    assessment: Workflow stages into the FR items; entries as Annex F, confirmed by Comptrollership.
  - bdoi: (no section)
    ours: 8 Non-functional requirements; 9 Configuration items; 10 Assumptions, dependencies and open questions
    bdoi_content: Only the 50 MB file limit and the BDO device.
    ours_content: NFR targets from BRD p.178-183, parameters, lists of values, jobs, masters; assumptions, dependencies, open questions.
    depth: Only ours
    assessment: Configuration as Annex E; open items as Annex K; NFRs stay in the programme NFR catalogue.
  - bdoi: (no section)
    ours: 13 Screen specifications; 14 Walkthroughs; 15 Messages; 16 Notifications; 17 Documents; 18 Upload screens; 19 Cross-BRD contract; 21 Clarifications; 23 Storyboard; Appendix screen standards
    bdoi_content: None.
    ours_content: The business view of the screens, messages, notifications, documents and uploads, with screenshots.
    depth: Only ours
    assessment: Annexes G to K of the merged document; the cross-BRD contract stays a supporting document.
  - bdoi: Signoff Sheet
    ours: 20 Sign-off and change control
    bdoi_content: Prepared by (System Analyst), Reviewed by (Tech Lead, Application or Platform Owner), Approved by (Project Owner / Sponsor, BU signatories).
    ours_content: What is signed, how the review is recorded, what signing freezes, change after sign-off, signatures.
    depth: Similar
    assessment: Keep BDOI's sheet; fill the names from the BRD approval sheet; our change-control text is not needed in BDOI's document.
  - bdoi: Template Revision Log
    ours: (none)
    bdoi_content: History of ITG's template (1.0 of 11-May-21 to 2.0 of 10-Mar-25).
    ours_content: "-"
    depth: Only BDOI's
    assessment: Keep as it is.
  - bdoi: Appendix A – Templates (Sample AR, Sample Billspayment file, Sample CLPC file, Sample Trade file)
    ours: 17 Document outputs; 18 Upload screens and Bank payment files
    bdoi_content: Four images of real documents and files.
    ours_content: AR / OR and Certification of Payment PDFs (layout draft); column lists of the four bank files and the upload templates.
    depth: Similar
    assessment: Keep BDOI's images; add the field-by-field layouts of sheet 9 as Annex C.
  - bdoi: Appendix B – References
    ours: 1.3 References
    bdoi_content: "“Operations_WS Addendum”."
    ours_content: R1 to R9 with versions, dates and the page ranges of the 321-page file.
    depth: Ours deeper
    assessment: Add the BRD v1.01, the May 2026 Cashiering annex and the e-mail record with their pages.

# ---------------------------------------------------------------------------------------------------------- 3 Pros and cons
pros_cons:
  - group: Completeness
    bdoi:
      pros: ["Covers the whole cycle, including items absent from the BRD and from ours: the OR from Disbursement approval, the Commission Schedule upload, the AR / OR template set-up, the account record inquiry with remittance details.", "18 reports with their fields."]
      cons: ["Placeholders left blank: “User Role:” in every item, GL entries, certificate number “Convention:”, “See template:”, the example “Application of 5000”, staging fields per file, “Commission Schedule list of fields”, PDC header and details, data elements of the unapplied record (FRS.CSH.06.01.07), OR mapping (FRS.CSH.07.01.04).", "Open marks: “Refund to Client (?)”, “Payment to Premium (manual?)”."]
    ours:
      pros: ["All 33 in-scope BRD IDs of the cashiering scope have FRs; removed IDs (CSHID.009, 026, 027) are explained.", "PDC warehouse, pre-booked queue, payment gate, AR Insurance, series warning level, minimal balance safety net, requests of other modules."]
      cons: ["12 of 24 report layouts and the AR / OR layout are draft (OQ42).", "No posting step, no MFT intake, no legacy matching keys, no AR template set-up (see sheet 7)."]
  - group: Traceability
    bdoi:
      pros: ["One mapping table in BRD order that a business reader checks at a glance."]
      cons: ["BRQID.001-007 and CSHID.011 have no FR ID; MKTID.013 and DBMID.001 point to “Com rec”.", "No BRD page references; FRS.CSH.02.06, 06.02 and 09.02 are not referenced from any BRD row.", "Wrong cross-reference: “Allow the user to print the AR (see FRS.CSH.02.03)” (printing is FRS.CSH.02.04)."]
    ours:
      pros: ["Each FR cites the BRD ID and page; traceability to screens and test cases; coverage summary; user-story view per BRD ID."]
      cons: ["Traceability is kept in three places (FR headers, chapter 11, chapter 22)."]
  - group: Testability and acceptance criteria
    bdoi:
      pros: ["Statuses, confirmations and messages are written out (“Record will be Saved. Do you wish to continue?”), so many statements can be tested as written."]
      cons: ["No acceptance criteria, no negative scenarios, no worked examples (the 5,000 example is blank)."]
    ours:
      pros: ["55 numbered acceptance criteria with worked amounts (a payment of 9,995.00 on 10,000.00 clears 5.00); 76 test cases in the test plan."]
      cons: ["Acceptance criteria use seed references (ARN-2026-940001) that BDOI's testers map to their own data."]
  - group: Screens and fields
    bdoi:
      pros: ["Field-level detail of the create AR / OR screens: types, defaults, bank accounts, branches, maximum 1B, remarks 200 characters; filters and columns of every list."]
      cons: ["No screen images or layouts; fields are nested lists inside a table cell; the mandatory list contains “Details”."]
    ours:
      pros: ["15 cashiering screen specifications with screenshots, numbered field tables (type, length, mandatory, source, default, editable status, validation, message) and action tables."]
      cons: ["Some screenshots still show items withdrawn in v2.1 (Check Pick-ups Due tile, BIR 2307 to Validate), explained in notes."]
  - group: Rules and validations
    bdoi:
      pros: ["Clear accounting rules for the remitted and not remitted cases of cancellation and reinstatement, matching priorities with legacy numbers, Direct Credit priorities, excess formula with PR 2307."]
      cons: ["Ambiguous or inconsistent rules: “Check date should be less than Current Date – 4 working days”; minimal balance “-1.00<= x <=1.00” against the BRD's Php 10.00; “PR2307 = 2% of Premium Amount” (which premium); cancellation reasons shorter than the BRD."]
    ours:
      pros: ["47 rules, each marked configurable or fixed with where it is maintained; 52 validations with message and code."]
      cons: ["Some proposed rules go beyond the BRD and wait for BDOI's confirmation (TL approval of cancellations, OQ06; OR grouping, OQ49)."]
  - group: Messages and notifications
    bdoi:
      pros: ["Key messages quoted (“Receipt Number series for this Branch is depleted. Contact your Administrator.”)."]
      cons: ["No message catalogue and no notifications (only “Record will be assigned to Approver/Poster”); typing errors in quoted messages (“You you wish to continue”)."]
    ours:
      pros: ["124 messages of the cashiering screens quoted as the screens show them, with what the user does; notifications NT-06 to NT-09 and the common ones."]
      cons: ["Some messages carry a BRD reference inside the user text (“... for this branch (CSHID.015)”)."]
  - group: Process flows
    bdoi:
      pros: ["Each FR walks through save, submit, post and return step by step."]
      cons: ["No process flow diagram; the five images are the BDO logo and the four sample files."]
    ours:
      pros: ["Process overview figure, workflow diagrams of the receipt action and the disposition, walkthroughs WT-A and WT-D with screenshots."]
      cons: ["Walkthroughs span all Operations teams; only part of WT-A and WT-D is Cashiering."]
  - group: Approvals and maker-checker
    bdoi:
      pros: ["Maker-checker on every receipt transaction, issuance included (“Submit for Posting”, “Return to creator”)."]
      cons: ["The approver is not named (“Based on UAM”); no segregation rule that the creator cannot post."]
    ours:
      pros: ["Four-eyes rules that cannot be switched off; the requester never approves; TL approval of cancellations, reinstatements, dispositions and series."]
      cons: ["AR / OR issuance posts on save without a posting approval, unlike BDOI's FRS (C1)."]
  - group: Reports
    bdoi:
      pros: ["Description, file name, format, rules and fields of 18 reports, including the 28 columns of the unapplied premium payment report with ageing brackets."]
      cons: ["Rules blank for 11 of 18 reports; “Cancelled Acknowledgement Receipts” rule reads “Extract all cancelled OR”; three reports of the BRD annex (PDC Warehousing, Priority Posted Accounts, Payment Reversals) are not listed."]
    ours:
      pros: ["24 reports including AR outstanding with ageing and the batch run report; view and export rights; archive of every run."]
      cons: ["12 layouts draft until BDOI gives them (OQ42); ageing buckets open (OQ43)."]
  - group: Non-functional
    bdoi:
      pros: ["States the 50 MB file limit and the BDO-issued device."]
      cons: ["No NFR section (response time, availability, retention, volumes)."]
    ours:
      pros: ["NFR table from BRD p.178-183 with targets, including the audit standard required at the BRD sign-off."]
      cons: ["NFRs cover all of Operations; cashiering volumes are not stated (OQ44)."]
  - group: Sign-off readiness
    bdoi:
      pros: ["ITG template with the sign-off statement and roles BDOI's SDLC requires; prepared by BDOI."]
      cons: ["Reviewer and approver names blank; 15 open review comments; revision 1.1 in a file named v3.1; document properties still titled “Business Requirements Document Template”."]
    ours:
      pros: ["Issued for sign-off with distribution, change control and a list of clarifications for confirmation."]
      cons: ["Not in BDOI ITG's template; BDOI ITG has to review a vendor document."]
  - group: Ease of maintenance
    bdoi:
      pros: ["Short and in Word; ITG edits it without tools."]
      cons: ["Repeated blocks (create AR and create OR repeat about 15 statements; cancellation and reinstatement repeat the save and submit cycle); numbering gaps and duplicates (FRS.CSH.02.02.05 missing, FRS.CSH.03.01.05 and 04.01.03 used twice)."]
    ours:
      pros: ["Produced from one source with the screens, messages and test plan, so they stay consistent; IDs stable across versions."]
      cons: ["Length: the whole Operations FRS in one document; a cashiering change touches several chapters."]
  - group: Alignment with the BRD of 08-Oct-2026
    bdoi:
      pros: ["Uses the BRD v1.01 IDs including BRQID.007; drops CSHID.009, 026 and 027 consistently."]
      cons: ["Differs from the BRD on the minimal balance (±1.00 vs “Php 10.00 and below”), the reinstatement (“Due to Cancellation” reason dropped), the cancellation reasons (CSHID.003) and the encoded fields (CSHID.005)."]
    ours:
      pros: ["Re-based on BRD v1.01 and the May 2026 annex with page citations; “Changed in v2.1” notes."]
      cons: ["Proposes approvals and rules the BRD does not state (OQ06, CLR-OP-06)."]
  - group: Alignment with the platform
    bdoi:
      pros: ["Most of the core matches BIBS: matching categories, application hierarchy, minimal balance at processing, series depletion, unapplied tabs, full and partial reinstatement, report facility."]
      cons: ["Asks for what BIBS does not do today: posting step, MFT intake, record-type Bills Payment file, Direct Credit identification, legacy matching keys, reprint watermark, ZIP download, AR template set-up, OR on Disbursement approval, AP Unapplied Commission."]
    ours:
      pros: ["Describes the screens as BIBS shows them, with screenshots and messages quoted from the platform."]
      cons: ["Draft report layouts mean the reports shown may change after BDOI's answer."]

# ---------------------------------------------------------------------------------------------------------- 4 BRD coverage
coverage:
  - id: "BRQID.001"
