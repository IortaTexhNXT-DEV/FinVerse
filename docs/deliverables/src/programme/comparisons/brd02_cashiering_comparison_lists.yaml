# Lists of the cashiering comparison workbook: 6 Only in ours, 7 Only in BDOI FRS, 9 File and field comparison.
# Read by build_brd02_cashiering_comparison.py. Every value is quoted; quotes of BDOI's FRS use typographic quotes.

only_ours:
  - ref: "FR-OP-016; SCR-OP-16"
    kind: "Functional requirement"
    content: "PDC warehouse: each check stored with a PDCW number, client, reference, bank, maturity and segment; release before maturity as returned, replaced or pulled out; daily maturity run (08:30) that turns a matured check into a payment with its AR."
    brd: "CSHID.008 (PDC items a-f)"
    where: "New item FRS.CSH.05.02 Post-dated check warehouse"
    recommendation: "Include"
  - ref: "FR-OP-018; SCR-OP-14"
    kind: "Functional requirement"
    content: "Pre-booked payments queue with Re-match Now and Release, re-matching every 2 hours, ageing alert after 5 days (default)."
    brd: "CSHID.020"
    where: "New item FRS.CSH.05.03 Pre-booked payments"
    recommendation: "Include"
  - ref: "FR-OP-132"
    kind: "Functional requirement"
    content: "A pre-booked payment opens the New Business payment gate of the account, so placement does not wait for the booking."
    brd: "CSHID.020"
    where: "New item FRS.CSH.05.04 Payment confirmation to New Business"
    recommendation: "Include"
  - ref: "FR-OP-020"
    kind: "Rule"
    content: "Non-premium ARs of insurers (refund, other expenses, AR Insurance) post to AR Insurer the same business day and never enter matching or remittance; the paying insurer is mandatory."
    brd: "CSHID.021"
    where: "Sub-items of FRS.CSH.02.01"
    recommendation: "Include"
  - ref: "FR-OP-010; SCR-OP-21"
    kind: "Rule"
    content: "Receipt series with BIR ATP number and warning level (alert when the numbers left reach it), authorised by a second user; the last number cannot go below the numbers issued; deactivation moves to the next series."
    brd: "CSHID.006, 015"
    where: "Sub-items of FRS.CSH.02.03"
    recommendation: "Include"
  - ref: "FR-OP-002"
    kind: "Rule"
    content: "Segregation of duties enforced by the system and never switched off: no requester approves a cancellation, reinstatement, disposition or series."
    brd: "BRQID.002"
    where: "Sub-item of FRS.CSH.01.02 and each posting item"
    recommendation: "Include"
  - ref: "FR-OP-013"
    kind: "Validation"
    content: "A receipt whose unapplied item has a disposition in process cannot be cancelled until the disposition is withdrawn; a receipt with a request waiting cannot get a second one."
    brd: "CSHID.001, 003"
    where: "Sub-items of FRS.CSH.03.01"
    recommendation: "Include"
  - ref: "FR-OP-014"
    kind: "Rule"
    content: "A bounced or returned check is reinstated without the encoded fields (BRD note); the reinstated amount is above zero and at most the receipt amount."
    brd: "CSHID.003, 005"
    where: "Sub-items of FRS.CSH.04.01"
    recommendation: "Include"
  - ref: "FR-OP-022; SCR-OP-11, 12"
    kind: "Rule"
    content: "Disposition types with an action and an approval rule (apply, DST payment application, refund, reclass, transfer, others); reversal of a completed disposition with a reason; a refund reversed only after Disbursement returned it; bulk submit and approve; 11 validations."
    brd: "CSHID.024, 025"
    where: "Sub-items of FRS.CSH.06.02"
    recommendation: "Include"
  - ref: "SCR-OP-13 Incoming Requests"
    kind: "Screen"
    content: "Requests of other modules worked by Cashiering: collector requests on unapplied payments (Collections), refund validations (Payment Requests), payment reversals (Accounting Controls), with accept, reject and approve."
    brd: "CSHID.024; BRQID.004"
    where: "New item FRS.CSH.06.03 Requests from other modules"
    recommendation: "Include"
  - ref: "FR-OP-023"
    kind: "Rule"
    content: "Minimal excess within the threshold moved to AP overages at processing; a component cleared once; the daily safety-net run (04:00) for balances left by later events; an invoice written off by the minimal balance file is skipped."
    brd: "CSHID.016; ADJID.026"
    where: "Sub-items of FRS.CSH.02.05.12"
    recommendation: "Include"
  - ref: "FR-OP-015; SCR-OP-22"
    kind: "Configuration"
    content: "Layout of each payment file kept in Cashiering Setup (Excel, CSV, delimited text with its separator, or fixed-width text), changed without a release."
    brd: "CSHID.008"
    where: "Sub-item of FRS.CSH.05.01.06; Annex E"
    recommendation: "Include"
  - ref: "FR-OP-008"
    kind: "Functional requirement"
    content: "Every upload processes each row on its own; the run summary per outcome, the run report CSH-BATCH-RUN and the reprocessing of corrected failed rows."
    brd: "BRQID.006"
    where: "Sub-items of FRS.CSH.05.01; Annex D"
    recommendation: "Include"
  - ref: "FR-OP-009"
    kind: "Rule"
    content: "View and export are separate rights per report; every run is archived with its parameters, creator and file."
    brd: "CSHID.017, 018"
    where: "Sub-items of FRS.CSH.09.01"
    recommendation: "Include"
  - ref: "6.1 Cashiering reports"
    kind: "Report"
    content: "Six reports BDOI's list does not have: PDC Warehousing (BRD annex #3), Priority Posted Accounts (#8), Payment Reversals (#15), AR Outstanding with Ageing (BRD 4.c), Payment Batch Run Report (BRQID.006), BIR 2307 Transaction Report (Marketing Collection)."
    brd: "CSHID.023; BRQID.006"
    where: "FRS.CSH.09.02.19 to 09.02.24; Annex D"
    recommendation: "Include"
  - ref: "5.3 Accounting events"
    kind: "Rule"
    content: "Default entry of each cashiering event: AR issued, payment applied by component with commission realised, minimal balance reversal, excess to overages, refund, reclass, reinstatement, AR Insurance receipt, OR issue, cancellation as negative re-posting."
    brd: "CSHID.012-014"
    where: "Annex F (fills BDOI's “Debit: Credit:”)"
    recommendation: "Include as annex"
  - ref: "3 Personas and roles"
    kind: "Configuration"
    content: "Personas of the BRD annex (Cashier HO 11 and branches 5, TL / TH 5 and 5) with their BIBS roles, the permissions and the role-to-permission matrix."
    brd: "BRQID.002; NFR"
    where: "User Role line of each FR item; Annex E"
    recommendation: "Include as annex"
  - ref: "5.1-5.2 Workflows"
    kind: "Process flow"
    content: "Workflows of the receipt action and of the disposition: stages, owner of each stage, SLA hours (default) and the diagrams."
    brd: "CSHID.001-005, 024, 025"
    where: "Stages in FRS.CSH.03, 04, 06; diagrams in Annex J"
    recommendation: "Include"
  - ref: "9 Configuration items"
    kind: "Configuration"
    content: "Parameters (minimal balance threshold 10.00, share applied for 2% CWT clients 98%), lists of values (AR class, OR type, cancellation and reinstatement reasons, disposition types), jobs (pre-booked re-match, re-matching, PDC maturity, minimal balance run), masters and who maintains them."
    brd: "CSHID.003, 004, 016, 020, 024"
    where: "Annex E"
    recommendation: "Include as annex"
  - ref: "10 Open questions; 21 Clarifications"
    kind: "Other"
    content: "Cashiering open questions OQ03 to OQ15, OQ42, OQ43, OQ47 to OQ49 and clarifications CLR-OP-06 to 09 and 37 to 40, each with the proposed answer."
    brd: "-"
    where: "Annex K Open items and decisions"
    recommendation: "Include as annex"
  - ref: "Acceptance criteria of FR-OP-008 to 028, 132"
    kind: "Acceptance criteria"
    content: "55 numbered acceptance criteria with worked amounts, for example a payment of 10,050.00 on 10,000.00 creates an unapplied item of 50.00."
    brd: "CSHID.001-025"
    where: "Numbered “Acceptance” sub-items of each FR item"
    recommendation: "Include"
  - ref: "Validations of FR-OP-008 to 028, 132"
    kind: "Message"
    content: "52 validations with the condition and the exact message the user sees."
    brd: "CSHID.001-025"
    where: "Validation sub-items of each FR item"
    recommendation: "Include"
  - ref: "13 Screen specifications (SCR-OP-07 to 22)"
    kind: "Screen"
    content: "15 cashiering screens with screenshots, field tables (type, length, mandatory, source, default, status, validation, message) and action tables; screen standards (labels, dd-MMM-yyyy dates, amounts, row actions)."
    brd: "CSHID.001-025"
    where: "Annex G"
    recommendation: "Include as annex"
  - ref: "15 Messages catalogue"
    kind: "Message"
    content: "124 messages of the cashiering screens with their type and what the user does."
    brd: "CSHID.003, 015 and others"
    where: "Annex H"
    recommendation: "Include as annex"
  - ref: "16 Notifications catalogue"
    kind: "Notification"
    content: "NT-01 to NT-03 (stage changes, hand-offs, payment requests) and NT-06 to NT-09 (receipt series low, approval request, requests from other modules, pre-booked ageing) with trigger, recipient and text."
    brd: "CSHID.015, 020, 024"
    where: "Annex I"
    recommendation: "Include as annex"
  - ref: "14 Walkthroughs; 23 Storyboard"
    kind: "Walkthrough"
    content: "WT-A (the cashier receives and applies the client's payment, up to the insurer's OR) and WT-D (controls and the messages the user sees), with screenshots; storyboard index."
    brd: "CSHID.001, 020, 022"
    where: "Annex J"
    recommendation: "Include as annex"
  - ref: "17 Document outputs"
    kind: "Document"
    content: "AR, OR and Certification of Payment as PDF, with the fields and their source."
    brd: "CSHID.019, 023"
    where: "Appendix A, next to BDOI's sample AR"
    recommendation: "Include"
  - ref: "18 Upload screens; Bank payment files"
    kind: "Configuration"
    content: "Template columns of the Bills Payment, Trade, CLPC, Direct Credit, PDC and commission payment uploads, with the column checks."
    brd: "CSHID.007, 008"
    where: "Annex C"
    recommendation: "Include as annex"
  - ref: "FR-OP-004, 005"
    kind: "Functional requirement"
    content: "Invoice ledger with the payment history of each invoice (date, amount, AR number), view-only outside Cashiering; Invoice 360 with the records of every team."
    brd: "BRQID.007"
    where: "Sub-items of FRS.CSH.08.01 (Account Record Inquiry)"
    recommendation: "Include"
  - ref: "FR-OP-006"
    kind: "Rule"
    content: "A payment may still be applied to an invoice locked by Remittance or Adjustment; any other action is refused with the name of the team holding it."
    brd: "RMTID.040"
    where: "Sub-item of FRS.CSH.02.05"
    recommendation: "Include"
  - ref: "FR-OP-024"
    kind: "Rule"
    content: "Search log of every receipt search; the seven items of BDO's IT audit trail standard in every audit record, failures included."
    brd: "CSHID.010, 011; BRD sign-off p.67"
    where: "Audit sub-items of every FR item"
    recommendation: "Include"
  - ref: "8 Non-functional requirements"
    kind: "Other"
    content: "Response time, peaks, availability, recovery, retention and audit targets from BRD p.178-183."
    brd: "NFR"
    where: "Reference to the programme NFR catalogue"
    recommendation: "Keep as supporting document"
  - ref: "Test plan BRD-2 (76 test cases of the cashiering FRs)"
    kind: "Acceptance criteria"
    content: "Test conditions and cases per FR with steps, data and expected results."
    brd: "CSHID.001-025"
    where: "Cross-reference in the Application Feature Model column"
    recommendation: "Keep as supporting document"
  - ref: "22 User-story view"
    kind: "User story"
    content: "Each cashiering BRD ID as a user story with its FRs, acceptance criteria and test cases; source of the working backlog."
    brd: "CSHID.001-025"
    where: "Not needed in BDOI's FRS"
    recommendation: "Keep as supporting document"
  - ref: "19 Cross-BRD contract"
    kind: "Other"
    content: "What Cashiering exchanges with New Business, Collections, Disbursement and Accounting, when and who owns the data."
    brd: "BRQID.004, 005"
    where: "List of Integrations (summary only)"
    recommendation: "Keep as supporting document"

