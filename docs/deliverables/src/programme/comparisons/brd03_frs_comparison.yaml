  - id: FRPM.019.01
    quote: "Renewal Request Report ... all expiring package accounts within the selected reporting period, regardless of whether a renewal request has been created"
    ours: FR-PM-071, FR-PM-060
    match: Partial
    difference: "Ours: Package Expiry Report of released packages by end date with the open renewal request and its stage, and the expiry list for a date range. 'Package accounts' may mean the client accounts sold on packages, which BRD-6 Renewal reports."
