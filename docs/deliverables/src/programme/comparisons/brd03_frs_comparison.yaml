# ------------------------------------------------------------------ 3 Pros and cons
pros_cons:
  - group: Completeness
    BDOI's FRS:
      pros: "Covers package and non-package work in one module (quotation request, quotation slip, comparative, proposal, client response) as the business works today; includes dashboard, reports, audit logs and incentives."
      cons: "No FR for BRPM.020 (waiver under negotiation); BRPM.007 (non-current rate approval), BRPM.016 (advisory drafting and sending), BRPM.017 (renewal request routing) and BRPM.022 (integration with BDOI systems) only partly; Placement Update Status rules missing; incentive criteria content not defined."
    Our FRS:
      pros: "39 FRs cover all 31 BRD IDs with flows, rules and alternate paths; workflow, reports, interfaces, NFRs and configuration are stated."
      cons: "Package products only; non-package requests are in the New Business FRS. No reports builder, weekly scheduled report or anniversary-based alert."
  - group: Traceability
    BDOI's FRS:
      pros: "One mapping table from each BRD ID to FRPM IDs; FRPM sub-item numbering is easy to cite."
      cons: "Some mappings point to items that do not hold the requirement (BRPM.005 to the reports builder, BRPM.016 to package request attachments, BRPM.011 to the non-package quotation request); no BRD page references; no trace to tests."
    Our FRS:
      pros: "Each FR cites BRD ID and page; traceability to screens and 270 test cases; user-story view per BRD ID."
      cons: "Its own FR-PM numbering, not BDOI's; the trace lives in several places (FR headers, chapter 11, appendix, test plan)."
  - group: Testability and acceptance criteria
    BDOI's FRS:
      pros: "Many statements are concrete and testable as written (for example 'Remarks shall be mandatory for Rejected and Returned requests', 'must be at least 20')."
      cons: "No acceptance criteria and no negative cases; UAT cases would have to be derived."
    Our FRS:
      pros: "104 numbered acceptance criteria and 92 validations with messages, the basis of 138 test conditions and 270 test cases."
      cons: "Acceptance criteria are written against the proposed system; any BDOI decision that differs needs the criteria and cases updated."
  - group: Screens and fields
    BDOI's FRS:
      pros: "Named fields per product line with list values (Annex A, B, C, E); list screen columns stated for each list."
      cons: "No screen layouts, actions or mandatory flags per field; some data types blank (for example Currency, Basis of Valuation, Cover/Undertaking in Annex B)."
    Our FRS:
      pros: "22 screen specifications with screenshots, 325 fields (type, mandatory, source, validation, message) and 104 actions."
      cons: "Line-specific fields are configured as field rules rather than listed per line; no Business Origin, Unit Head, estimated policies or premium on the request."
  - group: Rules and validations
    BDOI's FRS:
      pros: "Clear numeric rules where given: incentive amount above zero, rate above 0% and up to 100%, 20 policies and PHP 5M minimum, deactivation effective date today or later, expiry date the later of effective and approval date."
      cons: "Most rules are left to 'configure rules per field'; no segregation of duties; no service levels; no rule for who may approve."
    Our FRS:
      pros: "115 business rules marked fixed or configurable, four-eyes rules that cannot be switched off, service level hours per stage."
      cons: "Some rules are proposals awaiting BDOI (PQ05 to PQ12); the volume can hide the few that need a decision."
  - group: Messages and notifications
    BDOI's FRS:
      pros: "Notifications are named at each step (notify approver, requestor, next approver, MBS user, replacement and original assignee); e-mail to ManCom via Microsoft 365."
      cons: "No message texts; no catalogue of notifications with recipients and content."
    Our FRS:
      pros: "Messages catalogue (276 texts word for word) and notifications catalogue (11 notices with trigger, recipient and text)."
      cons: "Mostly in-app notices; the e-mail channel for internal users depends on user preferences."
  - group: Process flows
    BDOI's FRS:
      pros: "Two readable swimlane flows that show the real hand-offs, including the insurer lane and MBS set-up loop."
      cons: "Flows and text differ in places (for example Marketing 'Agree on Terms and select insurer/s' vs requestor selection in FRPM.008; 'Upload ISACOM Approval' not described in the text)."
    Our FRS:
      pros: "Lifecycle figure, workflow figure with every transition, version states and two walkthroughs with screenshots."
      cons: "No non-package flow in this FRS (it is in BRD-1)."
  - group: Approvals and maker-checker
    BDOI's FRS:
      pros: "Approve, Return and Reject at most steps with mandatory remarks; Marketing chain until Unit Head; ManCom parallel approval with the President last; reassignment of approvers."
      cons: "Approvers are picked by name by the requester; no rule that a maker cannot approve; deactivation and matrix approval by one selected approver."
    Our FRS:
      pros: "Role-based approval queues with four-eyes rules everywhere (request, slip, ManCom, version validation, masters, rate exceptions); validation checklist with test premium (PMADD06)."
      cons: "One Marketing approval and one ManCom signature until BDOI states the chain and quorum (PQ07, PQ08); no explicit 'Reject' outcome (return, void or not proceeded instead)."
  - group: Reports
    BDOI's FRS:
      pros: "Weekly Consolidated Placement Update Report with columns, file name and repository; Renewal Request Report; reports builder; export to Excel, PDF and CSV."
      cons: "Placement Update Status rules missing; the report is on quotation requests, not on package creation status as BRPM.018 describes."
    Our FRS:
      pros: "Three report layouts with parameters and columns; runs logged; export to PDF, Excel, ODS and CSV; saved variants."
      cons: "No scheduled run or report repository; report name and columns still to confirm (PQ15)."
  - group: Non-functional
    BDOI's FRS:
      pros: "Audit of all report generation, download, print and export activities stated."
      cons: "No non-functional section (volumes, response time, availability, retention)."
    Our FRS:
      pros: "NFR table from the BRD (users, response time under 5 seconds, 99.9% availability, RTO 4 hours, RPO 24 hours) with the proposed approach."
      cons: "Several NFR values still to be agreed BIBS-wide (PQ18, XQ08)."
  - group: Sign-off readiness
    BDOI's FRS:
      pros: "Sign-off sheet in ITG's format; BDOI authored, so approval by ITG roles is straightforward."
      cons: "Version 1.0 with an empty revision history beyond the first issue; several open points (BRPM.020 waiver, missing rules) to close before sign-off."
    Our FRS:
      pros: "Issued for business sign-off with the sign-off workbook, test plan, configuration templates and UX screen documents; 'what signing freezes' and change control stated."
      cons: "Not in ITG's template; ITG roles (System Analyst, Tech Lead, Application Owner) are not on its signature page."
  - group: Ease of maintenance
    BDOI's FRS:
      pros: "One Word table; easy to edit by ITG."
      cons: "Repeated text between package and non-package items (FRPM.006 and 012, 009 and 013) makes changes error-prone; manual numbering."
    Our FRS:
      pros: "Generated from structured sources with automatic consistency checks; messages and notifications taken from the system."
      cons: "Needs the project team's tooling to regenerate; long."
  - group: "Alignment with the BRD (baseline of 8-Oct-2026: BRD v1.0 and Addendum v1.1)"
    BDOI's FRS:
      pros: "Uses the BRD's own wording for the requirements in the mapping table; covers PMADD01 to 08."
      cons: "Goes beyond the BRD in places (non-package in scope although the BRD revision of 27-Oct-2025 excluded it; deployment request; reports builder for BRPM.005) and below it in others (BRPM.020 waiver; BRPM.009 recommendation step; BRPM.012 sending from the system with confirmation and resend)."
    Our FRS:
      pros: "Follows the BRD acceptance criteria closely (for example BRPM.009 TL recommendation then TH approval; BRPM.015 automatic forwarding to MBS; BRPM.012 sent history and resend)."
      cons: "Reads 'TL, TH or UH' in BRPM.008 as one approval and states proposals where the BRD is silent; both need BDOI confirmation."
  - group: Alignment with the platform
    BDOI's FRS:
      pros: "Many items match BIBS already (package request, quotation slip approval, comparative export, ManCom step, MBS set-up and approval, expiry, incentive rules, audit)."
      cons: "Items that BIBS does not support today: deployment request, sequential Marketing approval, ManCom parallel routing with the President, proposal slips in the package path, multiple options per insurer, reports builder, weekly scheduled report, anniversary alerts, dashboard filters."
    Our FRS:
      pros: "Written against the proposed system: screens, messages and notifications are taken from it, so what is signed is what is delivered."
      cons: "Because it follows the system, operational choices of BDOI not yet in the system are absent until decided."

# ------------------------------------------------------------------ 4 BRD coverage (BDOI's FR IDs come from bdoi_frs_brd03.yaml)
coverage:
  - id: PMADD01
    bdoi_status: Partial
    bdoi_note: "Product Matrix by Line of Insurance with sub-lines and line-specific fields; no explicit levels for type, subtype, coverage and peril."
    ours_frs: FR-PM-010
    ours_status: Full
    note: "Ours holds line > cover type > subtype > product, and coverages / perils per line. BDOI's sub-line lists (Annex A) give the values ours waits for (PQ02)."
