  - id: FRPM.016.01
    quote: "MBS Deployment Queue ... For Deployment, Draft Setup, Pending Approval, Approved, Deployed, Returned"
    ours: FR-PM-024, FR-PM-042, FR-PM-043
    match: Partial
    difference: "Ours: the With MBS tab of Package Requests and the Validation Queue; version states Draft, For validation, Released; return to MBS. Equivalent steps under other names; no package name, effective date or requestor columns in one queue."
