  - id: C20
    kind: Between the documents
    topic: "Hand-over to MBS after ManCom"
    bdoi: "'Request for Deployment button ... available when all required approvals have been completed ... Assign a unique Deployment Request Number' (FRPM.015.01)."
    ours: "'The sign-off locks the quotation slips and forwards the request to MBS automatically' (FR-PM-041)."
    brd: Ours
    brd_note: "BRPM.015: 'Only after ManCom’s in-system approval are requirements automatically forwarded to MBS'."
    platform: Ours
    decision: "Automatic forwarding (BRD) or a manual deployment request with its own number."
    recommendation: "Keep automatic forwarding; show BDOI's 'For Deployment' as the label of the With MBS stage if wanted."
  - id: C21
    kind: Between the documents
    topic: "BRPM.005 shared templates: reports builder or document templates"
    bdoi: "BRPM.005 mapped to FRPM.020 'custom reports using the Reports Builder'."
    ours: "BRPM.005 met by versioned document templates with line-specific sections (FR-PM-013); reports have saved variants, no designer."
    brd: Ours
    brd_note: "BRPM.005: 'shared document templates that can dynamically adjust to include fields specific to each insurance product line (e.g., CGL, Equipment Floater, Marine Cargo, Fire, Motor, etc.)'."
    platform: Ours
    decision: "Is a reports builder required (and under which BRD requirement)?"
    recommendation: "Map BRPM.005 to the document templates (BDOI's Annex D and F); treat a reports builder as a programme-wide request, not a Product Maintenance one."
  - id: C22
    kind: Between the documents
