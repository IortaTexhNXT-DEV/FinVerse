# ------------------------------------------------------------------ 5 Requirement mapping (one row per FRPM.nnn.nn)
mapping:
  - id: FRPM.001.01
    quote: "dashboard that delivers real-time visibility ... filter ... Period From Date, Period To Date, TSU Officer, Product Line, Package Type ... export ... Excel, PDF, CSV"
    ours: FR-PM-070, FR-PM-073
    match: Partial
    difference: "BDOI: six KPIs (incoming, in progress, for approval, expiring packages, issued proposals, deactivation requests), five filters, drill-down with eight columns, aging per stage, export to Excel, PDF and CSV. Ours: tiles by stage with overdue marking, packages ending in 30/60/90 days, versions for validation, advisories pending, comparative outputs of the week; each tile opens its list, exported to Excel; no filters."
    platform: "Yes"
    evidence: "Product Maintenance Dashboard with BDOI's indicators (incoming, in progress, for approval, expiring, issued, deactivation), date, officer, line and packaged filters, drill-down list and PDF, Excel and CSV export (TC-FRPM.001.01 cases)."
    action: Platform change
    action_detail: "Adopt BDOI's KPIs and filters in the FRS text; add the filters and PDF/CSV export to the home page; keep our service-level colours."
  - id: FRPM.002.01
    quote: "centralized repository for package-related configurations and quotation requests for non-package products"
    ours: "FR-PM-010; Navigation (chapter 12)"
    also: "FR-NB-050 to FR-NB-057 (non-package)"
    match: Partial
    difference: "BDOI puts non-package quotation requests in the Product Maintenance module. Ours covers packages only; BIBS handles non-package proposal requests under New Business."
    platform: "Yes"
    evidence: "Quotation requests of non-package products listed and opened from the Product Maintenance landing page, with the requests of the package path (TC-FRPM.002.01 cases)."
    action: Needs BDOI decision
    action_detail: "Decide where non-package requests are documented and placed in the menu (sheet 8, C01)."
  - id: FRPM.002.02
    quote: "landing page ... tabs: Product Matrix (Active Products, Expiring Products ... within 90 days, Expired Products), Quotation Request List, Package Request List"
    ours: FR-PM-070, FR-PM-024, FR-PM-052, FR-PM-060
    also: FR-NB-052
    match: Different
    difference: "BDOI: one landing page with three tabs and the stated list columns. Ours: a home page of tiles; Products (lifecycle filter), Package Requests and Package Expiry (Expiring, Renewal in Progress, Expired) are separate screens; non-package Proposal Requests are under New Business. Our Package Requests list has no Account Officer or submission date column."
    platform: "Yes"
    evidence: "Landing page tabs Product Matrix, Quotation Request List and Package Request List with Account Officer and Submission Date (TC-FRPM.002.02 cases)."
    action: Adopt BDOI wording
    action_detail: "Describe the landing page in BDOI's terms with our screens behind each tab; add Account Officer and Submission Date to the Package Requests list (small platform change)."
  - id: FRPM.003.01
    quote: "Line of Insurance, Sub-Line, Package Name, Package Description, Insurer, Status, Effective Date, Expiry Date, Last Updated By, Last Updated Date ... Search, Filter, Sort, Pagination, Export"
    ours: FR-PM-010, FR-PM-050, FR-PM-052
    match: Partial
    difference: "Our Products list shows code, name, line, package flag, version, segments, rate and minimum premium, status, with filters; it has no insurer, effective or expiry date, last-updated columns or export."
    platform: "Yes"
    evidence: "Product Matrix with Active, Expiring and Expired Products tabs, BDOI's columns, search, sort and export (TC-FRPM.003.01 cases)."
    action: Platform change
    action_detail: "Add BDOI's columns and the export to the Products list."
  - id: FRPM.003.02
    quote: "create and update a Product Matrix record. Product type: Package/ Non-Package ... Incentive Eligible indicator ... select an approver and send the 'Draft' matrix for approval"
    ours: FR-PM-010, FR-PM-012, FR-PM-014, FR-PM-042, FR-PM-050, FR-PM-080
    match: Different
    difference: "BDOI: authorised users create and update package and non-package records directly, with line-specific fields, incentive flag with amount or rate, supporting documents, Draft status and a named approver. Ours: a package is created from a signed-off package request by MBS set-up; its terms live in versions changed only through a new version; masters are maker-checker with any authoriser; no non-package records; no incentive flag on the product (criteria are separate)."
