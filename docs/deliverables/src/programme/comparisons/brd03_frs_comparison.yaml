    action: Needs BDOI decision
    action_detail: "Confirm packages or client accounts on packages (C22)."
  - id: FRPM.020.01
    quote: "generate, preview, download, print, and export custom reports using the Reports Builder ... save report definitions as reusable report templates"
    ours: FR-PM-071
    also: "FR-NB-123 (saved report variants)"
    match: Not in ours
    difference: "BIBS offers defined reports with parameters, saved and shared variants and export to PDF, Excel, ODS and CSV; there is no ad-hoc report designer (BRD-1 CLR-NB-14). Ours reads BRPM.005 as document templates."
    platform: "Yes"
    evidence: "Report Builder of Product Maintenance: source, columns, filters and sort, preview, print and export, templates saved and shared (TC-FRPM.020.01 cases)."
    action: Needs BDOI decision
    action_detail: "Reports builder vs saved variants (C21)."
  - id: FRPM.021.01
    quote: "'Audit Logs' section within the menu ... filter ... Date range, Action Type, Reference Number, User ... export ... CSV or Excel ... File name: Audit Logs_MMDDYYYY"
    ours: FR-PM-005
    also: "FR-NB-136 (BIBS Audit Trail screen)"
    match: Partial
    difference: "Ours: every action audited with before and after values, append-only. The BIBS Audit Trail screen filters by date range, user and record type and exports PDF, Excel and CSV; no filter by action type or reference number; BDOI's file name not used."
    platform: "Yes"
    evidence: "Audit Logs with action type and reference number filters, sortable columns and export named Audit Logs_MMDDYYYY (TC-FRPM.021.01 cases)."
    action: Platform change
    action_detail: "Add the action type and reference number filters and the file name."
  - id: FRPM.021.02
    quote: "Upon opening a specific record, the system shall display a new section for audit logs ... export audit log details as a CSV or Excel file"
    ours: FR-PM-005
    match: Partial
