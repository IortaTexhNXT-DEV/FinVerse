    action_detail: "Add export of the record history."

# ------------------------------------------------------------------ 8 Conflicts
# brd: which side matches the BRD; platform: which side matches BIBS today. Values: BDOI's, Ours, Both, Neither,
# Not stated (the BRD is silent).
conflicts:
  - id: C01
    kind: Between the documents
    topic: "Scope: non-package requests and products in Product Maintenance"
    bdoi: "'centralized repository for package-related configurations and quotation requests for non-package products' (FRPM.002.01); Product type 'Package/ Non-Package' (FRPM.003.02); Annex B, C, D."
    ours: "'Maintenance of non-package products' is out of scope; 'The BRD revision log of 27-Oct-2025 (p.11) moved it to an addendum' (FRS 1.2). Non-package proposals are in the New Business FRS (FR-NB-050 to 057)."
    brd: Ours
    brd_note: "BRD revision log 27-Oct-2025: 'Exclude Non-Package and include this as part of an' addendum; the addendum's PMADD01 speaks of 'packaged and non-packaged products' for the product structure only."
    platform: Both
    decision: "Confirm whether the non-package quotation request, proposal and client response are specified in the Product Maintenance FRS or in the New Business FRS, and under which menu they appear."
    recommendation: "Specify them once, in the New Business FRS where BIBS already supports them; in the Product Maintenance FRS keep FRPM.005 to 010 as short items that refer to it, and keep Annex B, C and D as the field lists of that process."
  - id: C02
    kind: Between the documents
    topic: "Expiry alerts: notice days, anniversary alerts, recipients"
    bdoi: "'alerts beginning: 90 calendar days before the package expiry date; 90 calendar days before the package anniversary date'; recipients 'TSU Officer, TSU Team Lead' (FRPM.004.01); Expiring Products tab 'expiring within 90 days' (FRPM.002.02)."
    ours: "'First alert 60 days before the end date (default)'; 'Reminders at 30 and 7 days (default)'; to TSU and MBS users (FR-PM-060); home tiles at 30, 60 and 90 days."
    brd: Not stated
    brd_note: "BRPM.017 asks to monitor 'the expiry or anniversary date' without days or recipients."
    platform: Ours
    decision: "Confirm the notice days (90, with or without reminders), whether the anniversary date raises its own alert, and the recipients (TSU Officer and Team Lead; MBS too?)."
    recommendation: "Adopt 90 days as the default value (a parameter, no change to the system) and keep the 30 and 7-day reminders; add the anniversary alert if BDOI confirms; keep MBS among the recipients for renewal set-up."
  - id: C03
    kind: Between the documents
    topic: "Placement Update Report: schedule, scope and columns"
    bdoi: "'automatically generate a Consolidated Placement Update Report every Thursday at 8am. The schedule shall be configurable'; 'all quotation requests that are active or processed within the reporting period'; 12 columns; 'PlacementUpdate_MMDDYYYY.xlsx'; repository (FRPM.007.01)."
    ours: "Package Status Update Report run on demand for one or all package requests, 'distinct from the BRD-1 Placement Update Report (name and columns to confirm, PQ15)' (FR-PM-071)."
    brd: Neither
    brd_note: "BRPM.018: 'generate Placement Update Reports (both for individual accounts and collectively for all accounts) ... to track and report the status of package creation'; no schedule."
    platform: Ours
    decision: "Say what the report covers (package requests, non-package quotation requests or accounts), whether it runs weekly on Thursday 08:00 and is kept in a repository, and give the Placement Update Status rules that BDOI's text announces but does not list."
    recommendation: "Keep the on-demand individual and collective report (BRD) and add the weekly scheduled run with BDOI's columns and file name as a configurable schedule (platform change)."
  - id: C04
    kind: Between the documents
    topic: "Decision outcomes: Reject as well as Return"
    bdoi: "'approve, return, or reject' at the matrix, quotation request, package request, quotation slip, proposal and ManCom steps; 'Remarks shall be mandatory for Rejected and Returned'."
    ours: "Approve or Return to requester (with a reason) at each step; a request is ended by Void (before negotiation) or Not proceeded (from negotiation); versions are returned, not rejected."
    brd: Not stated
    brd_note: "The BRD uses 'approved', 'returns incomplete submissions' and negative scenarios; it does not define a rejected state."
    platform: Ours
    decision: "Confirm whether a Reject outcome distinct from Return is needed, and what happens to a rejected request (closed, cannot be resubmitted)."
    recommendation: "Map BDOI's Reject to our Void / Not proceeded with a reason (same effect: the request closes); rename the action 'Reject' if BDOI prefers the word."
  - id: C05
    kind: Between the documents
    topic: "Marketing approval chain"
    bdoi: "'route the Package Request through the Marketing approval hierarchy (until Unit Head) ... Each approver shall approve or reject independently ... shall not proceed to TSU until the Marketing Unit Head has approved' (FRPM.011.02); statuses Pending Marketing TL, TH, UH Approval."
    ours: "'One approval by TL, TH or UH is enough (a chain by segment or amount waits for PQ08)' (FR-PM-021, CLR-PM-03)."
    brd: Both
    brd_note: "BRPM.008: 'reviewed and approved by the Marketing Team Lead (TL), Team Head (TH), or Marketing Unit Head (UH)'; BRPM.021: 'multi-level approvals'."
    platform: Ours
    decision: "One approval by any of TL, TH or UH, or the sequential chain TL, TH, UH for every request (or by segment or amount)."
    recommendation: "If BDOI wants the chain, specify three stages and their service levels; it is a workflow change with no effect on the other steps."
  - id: C06
    kind: Between the documents
    topic: "TSU review: one step or recommendation then approval"
    bdoi: "'enable approvers to approve, return, or reject the quotation request with For TSU Review status' (FRPM.011.03), then 'For Quotation Slip Creation'."
    ours: "TSU TL reviews and writes a mandatory recommendation; the TSU Head approves, never the recommender (FR-PM-022, 023)."
    brd: Ours
    brd_note: "BRPM.009: 'TSU TL provides a recommendation for approval ... TSU Team Head (TH) reviews the recommendation and provides formal approval'."
    platform: Ours
    decision: "Confirm the two TSU steps of the BRD."
    recommendation: "Keep ours; write it into FRPM.011.03 as two sub-items."
  - id: C07
    kind: Between the documents
    topic: "Source of a package request and its routing"
    bdoi: "Source 'Marketing / TSU / Insurer'; 'When source is TSU or Insurer, ... route ... through the TSU approval hierarchy'; 'If Source is Insurer, proceed to proposal preparation' (no quotation slip)."
    ours: "Requester is a Marketing AO or a TSU Officer; every request goes to Marketing approval, then TSU review and approval; negotiation is always, never or chosen by request type."
    brd: Not stated
    brd_note: "BRPM.008 persona 'Marketing AO / TSU' with approval by Marketing TL, TH or UH; insurer-initiated packages are not mentioned."
    platform: Ours
    decision: "Should a TSU-raised request skip Marketing approval; and is an insurer-offered package a request source that skips the quotation slip?"
    recommendation: "Add the Source field; route TSU and Insurer sources to TSU approval only; for Insurer source open the request with the insurer's offer as the first response (platform change)."
  - id: C08
    kind: Between the documents
    topic: "Who approves: approver picked by name or role queue with four-eyes"
    bdoi: "'select an approver and send the Draft matrix for approval' (FRPM.003.02); 'require the user to select an Approver' (FRPM.003.04); ManCom approvers selected (FRPM.014.01); reassignment (FRPM.017.01)."
    ours: "Each step is owned by a permission; any holder other than the maker approves; team leaders assign work; 'a request is never approved by its maker' (FRS 3.3)."
    brd: Not stated
    brd_note: "BRPM.021: 'Each approval step is completed by the designated authority (e.g., TSU TL, TSU TH, Marketing TL/TH/UH)'."
    platform: Ours
    decision: "Confirm role-based approval queues, or named approver selection by the requester."
    recommendation: "Keep role queues (no blocked items when an approver is absent; four-eyes enforced); allow an optional 'preferred approver' notice if BDOI wants to name one."
  - id: C09
    kind: Between the documents
    topic: "How a package is created and changed"
    bdoi: "Authorised users 'create and update a Product Matrix record' directly, Draft, then approval; MBS 'Maintain package as draft' after ManCom (process flow)."
    ours: "A package exists only through a signed-off package request; MBS sets up a draft version; 'A package is never edited in place' (FR-PM-050); validation and release (FR-PM-043)."
    brd: Ours
    brd_note: "BRPM.015 (set-up by MBS after ManCom) and BRPM.007 (latest approved rate scheme; old packages locked) support versions set up from signed-off requirements."
    platform: Ours
    decision: "Confirm that package terms change only through a request and a new version; say whether direct edits of non-commercial details (description, documents) are allowed."
    recommendation: "Keep the request and version route for terms and rates; allow direct maker-checker edits of descriptive fields only."
  - id: C10
    kind: Between the documents
    topic: "Package deactivation route and dates"
    bdoi: "Deactivation request with 'Deactivation Effective Date ... current and future dates only', one selected approver; on approval 'expiry date shall be set using the later of: Deactivation Effective Date or Approval Date' (FRPM.003.04 to 07)."
    ours: "Retire package request: Marketing approval, TSU review and approval, ManCom sign-off; MBS retires the product (Retired), retirement advisory (FR-PM-045)."
    brd: Not stated
    brd_note: "BRPM.011 lists 'deletion' among requests; the route is not described."
    platform: Ours
    decision: "Full retirement route with ManCom, or a lighter deactivation with one approval and an effective date."
    recommendation: "If BDOI wants the lighter route, add it as a request type with effective-dated end (platform change) and keep the retirement advisory."
  - id: C11
    kind: Between the documents
    topic: "Expired package: label and reactivation"
    bdoi: "'automatically update the package status to Inactive. The package shall no longer be available for: Update Package Requests ...' (FRPM.003.05)."
    ours: "Status Expired; an expired package returns to sale only through a request of type Reactivate expired package (FR-PM-052)."
    brd: Ours
    brd_note: "BRPM.006: 'store and archive details of expired insurance products ... for future reference or potential reactivation'."
    platform: Ours
    decision: "Label (Expired or Inactive) and whether an expired package can be reactivated by request."
    recommendation: "Keep reactivation (BRD); use the label BDOI prefers."
  - id: C12
    kind: Between the documents
    topic: "Quotation slip: sent by the system or by the user; one slip per insurer or per round"
    bdoi: "'generate a Quotation Slip (QS) per insurer'; 'The downloaded QS shall be the official insurer-facing document and may be used by users for manual email transmission' (FRPM.006.01, 012.01)."
    ours: "One slip per round, the same to every insurer; 'BIBS then sends one protected e-mail per insurer and opens a pending response for each'; resend and sent history (FR-PM-030)."
    brd: Ours
    brd_note: "BRPM.012: 'send ... to insurers directly from the system (e.g., via email ...)'; 'Users receive confirmation of successful transmission'; 'view sent history and resend'."
    platform: Ours
    decision: "Sending from BIBS (with download kept) or manual e-mail; slip per insurer or one per round for packages."
    recommendation: "Keep sending from BIBS and allow download; produce one slip per insurer if BDOI's templates name the insurer (platform change for packages; non-package already one per insurer)."
  - id: C13
    kind: Between the documents
    topic: "Document security (BRPM.020)"
    bdoi: "'Under negotiation if can be waived' (Business Requirements Mapping)."
    ours: "'Every Product Maintenance document e-mailed outside BIBS is protected; protection cannot be switched off per e-mail'; password in a separate e-mail (FR-PM-004)."
    brd: Ours
    brd_note: "BRPM.020 'Must have': 'All shared documents are password protected or encrypted'."
    platform: Ours
    decision: "Is BRPM.020 waived? If not, confirm the password convention (Q07, PQ21)."
    recommendation: "Do not waive: BIBS already protects the documents at no extra effort; confirm the password convention."
  - id: C14
    kind: Between the documents
    topic: "Insurer response values and options per insurer"
    bdoi: "'Approved', 'Not Covered', 'Others' (specify); 'capture multiple quotation options from the same insurer' (FRPM.006.02, 012.02)."
    ours: "'Pending, Accepted as requested, Approved with changes, Counter-proposal, Declined, No response (list to confirm, PQ05)'; one response per insurer per round, with revisions (FR-PM-031)."
    brd: Ours
    brd_note: "PMADD04 asks for 'explicit exception states'; options per insurer are not mentioned."
    platform: Ours
    decision: "The response list (BDOI's three values or ours) and whether one insurer may give several options in one round."
    recommendation: "Keep our list as a list of values and add BDOI's labels if wanted (configuration); several options per insurer is a platform change."
  - id: C15
    kind: Between the documents
    topic: "Comparative table: capture in the table, QS value column, retained master"
    bdoi: "'The second column shall display the corresponding QS value'; 'Users shall be able to input insurer responses directly into the corresponding insurer column'; 'The table shall always reflect the latest available insurer responses'."
    ours: "Responses keyed in per insurer; 'One current MASTER per request'; earlier masters kept as superseded; client views derived from the master (FR-PM-034, 035)."
    brd: Ours
    brd_note: "PMADD03: 'retaining an auditable master version'; BRPM.014: one consolidated table per package."
    platform: Ours
    decision: "Confirm the master and client-view model; whether the QS value column is shown."
    recommendation: "Keep the master; add the QS value column (platform change)."
  - id: C16
    kind: Between the documents
    topic: "Status names of package and quotation requests"
    bdoi: "20 statuses for package requests (for example 'Pending Marketing TL Approval', 'QS for Approval', 'Under Negotiation', 'Terms Agreed', 'Proposal Ready', 'Awaiting Mancom Approval', 'For Deployment', 'Deployed')."
    ours: "15 stages (for example 'For Marketing approval', 'For TSU Head approval', 'Insurer negotiation', 'Negotiated terms review', 'For ManCom sign-off', 'With MBS for set-up', 'Package version for validation', 'Released')."
    brd: Not stated
    brd_note: "The BRD does not name statuses."
    platform: Ours
    decision: "Agree one list of status names (after C04 to C20 are decided)."
    recommendation: "Take BDOI's names where the step exists in both; keep ours for steps BDOI lacks (review, requirements, validation); the stage list is configurable labels (CLR-PM-17, CLR-PM-20)."
  - id: C17
    kind: Between the documents
    topic: "ManCom approval routing"
    bdoi: "'select one or more approvers from the maintained ManCom approver list'; 'parallel approval for all approvers except the President'; 'Route the request to the President only after all preceding approvers have approved'; e-mail 'via Microsoft 365'."
    ours: "'One member's sign-off completes the step (quorum PQ07)'; signed sheet may be uploaded; in-app notices (FR-PM-041, CLR-PM-05)."
    brd: Not stated
    brd_note: "BRPM.015: 'ManCom reviews and signs off within the system; approval is mandatory and logged'."
    platform: Ours
    decision: "ManCom membership list, who selects the approvers, parallel approval and the President's final approval, and e-mail notice."
    recommendation: "Adopt BDOI's routing if confirmed (platform change: parallel approvals then the President); keep the slip lock and the automatic hand-over to MBS."
  - id: C18
    kind: Between the documents
    topic: "Package path after negotiation: proposal slips or package slip; who selects insurers"
    bdoi: "Requestor selects insurers, 'Proceed to Proposal', status 'Terms Agreed' (FRPM.008); 'Final Terms for Proposal' column (FRPM.009.01); 'Generate Proposal ... separate Proposal Slips' then ManCom (FRPM.013, 014)."
    ours: "TSU makes the terms final (chosen insurers, roles, shares); TSU Head review; Marketing review for client-specific packages; requirements pack with the package slip, signed copy uploaded; ManCom (FR-PM-033, 036, 040)."
    brd: Ours
    brd_note: "BRPM.013: Marketing reviews client-specific terms before any client presentation; BRPM.015: 'Product requirements and details from TSU are submitted ... triggering a ManCom review'; BRPM.016: 'Package slip (signed)'."
    platform: Ours
    decision: "Is a proposal slip per insurer produced for packages; does Marketing select the insurers; is the signed package slip still required before ManCom?"
    recommendation: "Keep the package slip and requirements pack (BRD); if Marketing selects insurers, add that as Marketing's 'Accept Terms' with insurer choice; proposal slips per insurer for packages only if BDOI confirms (platform change)."
  - id: C19
    kind: Between the documents
    topic: "Incentive eligibility on the product or in criteria"
    bdoi: "'Incentive Eligible indicator. Default value is No ... require ... either: Incentive Amount; or Incentive Commission Rate' on the product (FRPM.003.02) and incentive rules (FRPM.018)."
    ours: "Incentive criteria (for example CPC2) list the products of the matrix they apply to, with value basis rate, fixed amount or rule; at booking the matched criteria set the incentive flag (FR-PM-080, 081; BRD-1 FR-NB-118)."
    brd: Both
    brd_note: "PMADD07: 'define and maintain Incentive criteria based on the Maintained Products Matrix'."
    platform: Ours
    decision: "One place for incentive eligibility: on the product record, in the criteria, or both (and which wins)."
