# Comparison of BDOI's Product Maintenance FRS (BDO ITG, v1.0 of 19-Aug-2026) with the BIBS FRS BRD-3 Product
# Maintenance v2.1 (8-Oct-2026): summary, structure, pros and cons, BRD coverage, requirement mapping, conflicts and the
# incorporation plan. The lists (only in ours, only in BDOI's, field mapping) are in brd03_frs_comparison_lists.yaml;
# BDOI's own text is in bdoi_frs_brd03.yaml. Read by build_frs_comparison.py.
meta:
  title: "BDOI FRS vs BIBS FRS – Product Maintenance"
  subtitle: "Comparison of BDOI's FRS (BDO ITG, v1.0, 19-Aug-2026) with the BIBS FRS BRD-3 v2.1 (8-Oct-2026), and the plan to bring our content into BDOI's format"
  doc_type: Comparison workbook
  brd: BRD-03
  version: "1.0"
  date: 9 October 2026
  filename: BIBS_Comparison_BRD-03_BDOI_FRS_vs_BIBS_FRS_Product_Maintenance_v1.0.xlsx
  ours:
    title: "BIBS FRS BRD-3 Product Maintenance v2.1, 8-Oct-2026 (iorta TechNXT), with its sign-off workbook, test plan, configuration input templates and UX screen documents"
    baseline: "Product Maintenance BRD v1.0 (24-Nov-2025, approved Nov-2025 to Jan-2026) and Addendum v1.1 (10-Apr-2026), the baseline restated in our FRS v2.1 of 8-Oct-2026 (no newer BRD received)"

# ------------------------------------------------------------------ 1 Summary and recommendation
summary:
  purpose:
    - doc: BDOI's FRS
      text: >-
        Written by BDO ITG (System Analyst Angela V. Ramirez) in the BDO ITG FRS template for project PRJ0012475. It is
        meant to become "the official baseline of functional requirements" after approval, owned by BDO ITG and changed
        through the project's change management. It maps each BRD requirement to functional requirement IDs (FRPM.001 to
        FRPM.021, 35 numbered sub-items), describes the capabilities as "The system shall ..." statements, shows two
        swimlane process flows (non-package and new package request) and lists the fields per product line in Annex A to
        F, with the quotation slip templates of 14 lines embedded in Annex D and F.
    - doc: Our FRS (BIBS FRS BRD-3 v2.1)
      text: >-
        Written by the iorta TechNXT project team as the business sign-off document of the BIBS release set BRD-3. It
        turns each BRD requirement into 39 functional requirements (FR-PM-001 to FR-PM-081) with actors, flows, business
        rules, validations and messages, fields, notifications, audit and 104 numbered acceptance criteria, and adds the
        business view of the proposed system: workflow and status model, reports, 22 screen specifications with
        screenshots, two end-to-end walkthroughs, the messages and notifications catalogues, document outputs,
        configuration inputs, cross-BRD contract, sign-off and change control and 24 proposed rules for confirmation.
        It is traced to the 270 test cases of the test plan.
  headline_pros:
    BDOI's FRS:
      - "In BDO ITG's own FRS template, prepared by ITG: BDOI owns it and it fits ITG's approval and change process."
      - "Concise (about 8,900 words): one table of capabilities that a business reader can review in one sitting."
      - "Named field lists per product line (Annex A, B, C, E) with list values (policy types, sub-lines, vehicle and engine types, building classes, occupancy, basis of valuation)."
      - "The real quotation slip templates of 14 lines for package and non-package requests (Annex D and F), which our FRS still waits for (Q03)."
      - "Covers the non-package quotation request, proposal and client response in the same module, as Marketing and TSU work today, with two process flows."
      - "Concrete operational choices: 90-day expiry alerts, a weekly Placement Update Report (Thursday 8am), file naming conventions, dashboard filters and export formats."
    Our FRS:
      - "Every BRD requirement (31 IDs) is met by at least one FR, with BRD page references, and each FR has numbered acceptance criteria traced to 270 test cases."
      - "Business rules, validations and the exact messages, the segregation of duties (four-eyes) rules and the full status model with service levels are stated."
      - "Covers the BRD points BDOI's FRS leaves out or waives: rate-scheme versions and the approval of non-current rates (BRPM.007), advisories (BRPM.016), document protection (BRPM.020), negotiation rounds (PMADD04), the requirements pack and the post set-up validation checklist (BRPM.015, PMADD06)."
      - "Screen specifications with screenshots, walkthroughs, messages and notifications catalogues that match the proposed system, so the business sees what it signs."
      - "Lists every point that needs a BDOI decision (CLR-PM-01 to 24, PM-Q01 to PM-Q58)."
  headline_cons:
    BDOI's FRS:
      - "No acceptance criteria and no validation messages; several items say what the system shall show but not the rule (for example the Placement Update Status rules are announced but missing)."
      - "BRPM.020 document security is marked 'Under negotiation if can be waived'; BRPM.007 non-current rate approval, BRPM.016 advisories and BRPM.017 renewal requests are only partly addressed."
      - "Package and non-package text is copied between items, with some inconsistencies (status names, list headings, 'Renewal' in the audit fields)."
      - "Approvers are chosen by name by the user; segregation of duties and service levels are not stated."
      - "Not aligned with the proposed system on several points (deployment request, sequential Marketing approval, ManCom routing, proposal slips in the package path, reports builder)."
    Our FRS:
      - "Long (about 30,000 words of source, 22 screen specifications and over 100 figures and screenshots): heavy for a business reader."
      - "Not in BDO ITG's template and numbering; ITG did not prepare it."
      - "Scoped to package products only; the non-package quotation request is in the New Business FRS (BRD-1), not in Product Maintenance."
      - "Field lists per product line are generic (configurable field rules) rather than BDOI's named fields; document layouts are draft until BDOI provides its own."
      - "Some BDOI operational choices are not reflected (90-day alerts, weekly scheduled report, dashboard filters, named approver selection)."
  recommendation:
    title: "Recommended: merge our content into BDOI's FRS, keep BDOI's template and FRPM numbering as primary, carry our FR-PM IDs as cross-reference"
    text: >-
      Use BDOI's FRS v1.0 as the master document and issue it as BDOI's v1.1 (draft for review), owned by BDO ITG, with our
      content inserted: our rules, validations and acceptance criteria as numbered sub-items under each FRPM item, our
      functional requirements that BDOI's FRS lacks as new FRPM items (FRPM.022 onwards), and our screen specifications,
      messages, notifications, walkthroughs and storyboard, role-to-action matrix, workflow and configuration and
      traceability as Annex G to M. BDOI's FRPM.nnn.nn stays the primary ID; each sub-item carries the FR-PM-nnn it
      matches in brackets, and the Business Requirements Mapping table gets a fourth column "BIBS FR (cross-reference)",
      so our test plan, sign-off workbook and UX screen documents stay valid without renumbering. Before merging, BDOI
      decides the conflicts in sheet 8 in one working session with TSU, MBS, Marketing and ITG; the decisions set the
      text that goes in. Our BIBS sign-off set then becomes the supporting pack referenced from Annex G to M.
    why:
      - "BDOI ITG's process makes the approved FRS the official baseline; working in its template avoids a second baseline and a later reconciliation."
      - "BDOI's document is short and structured by capability; our detail fits under each capability as sub-items and annexes without rewriting either side."
      - "Keeping FR-PM IDs as cross-reference keeps the 270 test cases, the 325 field rows and the 276 messages traced."
      - "BDOI's annexes (fields, sub-line values, quotation slip templates) answer open questions of ours (PQ02, Q03) and go in unchanged."
  alternatives:
    - option: "A. Keep both documents: BDOI's FRS as the business baseline, our FRS as its detailed specification referenced from it"
      tradeoff: "Least effort now (about 3 person-days for a cross-reference table). Two documents to keep in step; the conflicts of sheet 8 remain in two places and every change is made twice; a reader must open both."
    - option: "B. Reverse merge: our FRS stays the master, BDOI's annexes, process flows and operational choices are merged into it"
      tradeoff: "Our document is already sign-off ready and test-traced (about 10 person-days). It is not in BDO ITG's template and ITG did not prepare it, so ITG may not accept it as the baseline; BDOI's numbering is lost."
    - option: "C. Rewrite in BDOI's template with our FR-PM IDs as the primary numbering"
      tradeoff: "One numbering across our test plan and BDOI's document. Every FRPM reference in BDOI's mapping table and process notes changes; the most effort (about 45 person-days) and the least familiar to BDOI readers."
  notes:
    - "Counts are taken from the documents: BDOI's FRS as received (19-Aug-2026); our FRS v2.1 with its sign-off workbook (22 screens, 325 fields, 104 actions, 84 screen rules, 276 messages, 11 notifications) and test plan (138 test conditions, 270 test cases)."
    - "Platform status says whether BIBS supports the item today: Yes, Partly or No. Where BIBS supports a non-package item, it is described in the BIBS FRS BRD-1 New Business (FR-NB-050 to FR-NB-057), not in the BRD-3 FRS."

