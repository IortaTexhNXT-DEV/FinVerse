    action_detail: "Add the notice to the original assignee (small platform change)."
  - id: FRPM.018.01
    quote: "create and maintain Incentive Eligibility rules ... Add Rule, Edit Rule, Activate Rule, Deactivate Rule, View Rule Details ... Users shall be able to define one or more criteria"
    ours: FR-PM-080, FR-PM-081
    match: Same
    difference: "Same purpose; ours is more detailed (type, value basis, value, rule parameters, products matrix, maker-checker, successor on amendment, review alert when a product ends). BDOI calls it 'Incentive Eligibility rules' with 'Activate'; ours 'Incentive Criteria' with authorisation."
