    evidence: "Direct add and update of Product Matrix records with package description, incentive flag and named approver; the request route stays available by setting (TC-FRPM.003.02 cases)."
    action: Needs BDOI decision
    action_detail: "Decide direct maintenance vs request route, the incentive flag and named approvers (sheet 8, C09, C19, C08); add Annex A fields to the package version (platform change)."
  - id: FRPM.003.03
    quote: "approve, return, or reject ... Remarks shall be mandatory for Rejected and Returned ... Upon approval ... status to Active ... available ... Proposal Creation, New Business Account Creation, and Renewal Account Creation"
