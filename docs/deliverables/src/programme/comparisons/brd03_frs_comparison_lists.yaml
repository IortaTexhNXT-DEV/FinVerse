# ------------------------------------------------------------------ 7 Only in BDOI's
# action: Add to our FRS | Platform change needed | Ask BDOI
only_bdoi:
  - ref: "FRPM.002.01, 003.02; Annex B, C, D"
    item: "Non-package products and quotation requests inside Product Maintenance"
    impact: "Scope of the FRS and menu placement; BIBS supports the process under New Business."
    action: Ask BDOI
    detail: "C01."
  - ref: "FRPM.005, 008, 009, 010"
    item: "Non-package quotation request list and review, insurer selection by the requestor, proposal generation per insurer, client response (Accepted, Rejected, Return for Revision)"
    impact: "Mostly supported in BIBS New Business (FR-NB-050 to 057); client return for revision and several insurers per proposal slip are not."
    action: Ask BDOI
    detail: "C01, C18; platform change for client return for revision."
  - ref: "FRPM.002.02"
    item: "Landing page with Product Matrix tabs Active, Expiring (within 90 days), Expired, and the two request lists"
    impact: "Different navigation; same information spread over our screens."
    action: Add to our FRS
    detail: "Describe our screens under BDOI's tabs."
  - ref: "FRPM.003.01"
    item: "Product Matrix columns Insurer, Effective Date, Expiry Date, Last Updated By, Last Updated Date; export"
    impact: "List columns and export missing on Products."
    action: Platform change needed
    detail: "Small change."
  - ref: "FRPM.003.02; Annex A, B, C, E"
    item: "Incentive Eligible indicator (default No) with Incentive Amount (greater than zero) or Incentive Commission Rate (above 0%, at most 100%) on the product and requests"
    impact: "Two places for incentive eligibility if criteria also stay."
    action: Ask BDOI
    detail: "C19."
  - ref: "FRPM.003.02"
    item: "Supporting documents on the Product Matrix record"
    impact: "Ours keeps documents on the package request, not on the product."
    action: Ask BDOI
    detail: "Confirm the request documents are enough."
  - ref: "FRPM.003.02, 003.04, 014.01"
    item: "Approver chosen by name by the requester"
    impact: "Role queues in BIBS."
    action: Ask BDOI
    detail: "C08."
  - ref: "FRPM.003.04 to 007"
    item: "Deactivation request with effective date (today or later), reason, remarks, documents, one approver; list of deactivation requests; expiry date set to the later of effective and approval date"
    impact: "BIBS retires through the full request route."
    action: Ask BDOI
    detail: "C10; platform change if adopted."
  - ref: "FRPM.004.01"
    item: "Alerts 90 days before expiry and 90 days before the anniversary; recipients TSU Officer and Team Lead; non-package products included"
    impact: "Notice period is a parameter; anniversary alert not in BIBS."
    action: Platform change needed
    detail: "C02."
  - ref: "FRPM.001.01"
    item: "Dashboard KPIs Issued Proposals and Deactivation Requests; filters by period, TSU officer, product line, package type; drill-down columns; export to Excel, PDF and CSV"
    impact: "BRPM.019 asks for filters; our home page has none."
    action: Platform change needed
    detail: "Add filters and export formats."
  - ref: "FRPM.007.01"
    item: "Consolidated Placement Update Report every Thursday at 8am, configurable schedule, 12 columns (Item No., Insured's Name, Marketing Segment, Team, Account Officer, TSU Handler, Line, Sub-Line, PRF Received Date and Time, Aging, Status), Excel, file name, repository with preview and download"
    impact: "No scheduled run or repository for this report in BIBS."
    action: Ask BDOI
    detail: "C03; platform change for the schedule and repository."
  - ref: "FRPM.006.01, 009.02, 007.01, 021.01"
    item: "File naming conventions (QS_, ProposalSlip_, PlacementUpdate_, Audit Logs_ with MMDDYYYY)"
    impact: "BIBS names files after the document number."
    action: Platform change needed
    detail: "C23."
  - ref: "FRPM.006.01, 012.01"
    item: "Quotation slip per insurer; QS-specific values edited before generation; version history on regeneration; manual e-mail of the downloaded slip"
    impact: "Package slip is one per round in BIBS and sent by BIBS."
    action: Ask BDOI
    detail: "C12."
  - ref: "FRPM.006.02, 012.02"
    item: "Comparative table with QS value column, choice of fields before capture, responses captured in the table, several quotation options per insurer, responses Approved / Not Covered / Others"
    impact: "Different capture model; several options per insurer not supported."
    action: Ask BDOI
    detail: "C14, C15."
  - ref: "FRPM.009.01"
    item: "Final Terms for Proposal column"
    impact: "Not in BIBS."
    action: Platform change needed
    detail: "Only if the proposal step is kept (C18)."
  - ref: "FRPM.011.02"
    item: "Request Source Marketing / TSU / Insurer with routing; Insurer source skips the quotation slip"
    impact: "BIBS routes every request through Marketing approval and TSU review."
    action: Ask BDOI
    detail: "C07."
  - ref: "FRPM.011.02"
    item: "Marketing approval hierarchy TL, TH, UH, each approving independently"
    impact: "BIBS has one Marketing approval stage."
    action: Ask BDOI
    detail: "C05."
  - ref: "FRPM.003.03, 005.02, 006.01, 011.03, 013.01, 014.01"
    item: "Reject as an outcome distinct from Return"
    impact: "BIBS uses Void or Not proceeded with a reason."
    action: Ask BDOI
    detail: "C04."
  - ref: "Annex E"
    item: "Business Origin, Account Officer, Unit Head, Estimated No. of Policies (at least 20), Estimated Total Basic Premium (at least PHP 5M), Other Instructions, Incentive fields on the package request"
    impact: "Fields and two minimum rules missing on our request form."
    action: Platform change needed
    detail: "Sheet 9."
  - ref: "Annex A; Sub Line Dropdown Values"
    item: "Package product fields per line (Policy Type, Package Description, Business Origin, Account Officer, Unit Head, Insured's Name, Mailing Address, Type of Cover, Description of Cover, Other Conditions, Premium) and sub-line values for Engineering, Liability, Crime, Bonds, Personal Accident, Miscellaneous"
    impact: "Values answer PQ02 in part; several fields have no place on our product or version."
    action: Add to our FRS
    detail: "Load the values as configuration (CI-01, CI-02); fields per sheet 9."
  - ref: "Annex A, B, C"
    item: "Lines of insurance: Motor, Property, Engineering, EEI, Floater, Marine Cargo, Marine Hull, Aviation, Stock Throughput, Liability, Crime, Bonds, Personal Accident, Miscellaneous"
    impact: "BDOI's list of product lines for the catalogue."
    action: Add to our FRS
    detail: "Use as the product line list (CI-01)."
  - ref: "Annex B, C"
    item: "Non-package fields per line (for example Vehicle Type, Engine Type, Basis of Valuation, Building Description, Contractor's Name, Vessel and Aircraft details, Bond Amount, No. of Persons) and Transaction Type with expiring policy, insurer, share, rate and commission per insurer"
    impact: "BIBS captures most of these as risk details text or field rules; no dedicated fields."
    action: Ask BDOI
    detail: "After C01; sheet 9."
  - ref: "Annex D, F"
    item: "Quotation slip templates for 14 lines, package and non-package (letterhead text, law and jurisdiction clause, TSU handler signature, insured's conforme)"
    impact: "The layouts our FRS waits for (Q03, CLR-PM-02)."
    action: Add to our FRS
    detail: "Load as template versions (CI-08)."
  - ref: "FRPM.014.01"
    item: "ManCom approver list, several approvers in parallel, the President last, approval progress per approver, e-mail via Microsoft 365"
    impact: "BIBS completes the step with one member."
    action: Ask BDOI
    detail: "C17."
  - ref: "FRPM.015.01, 016.01"
    item: "Request for Deployment with a Deployment Request Number; MBS Deployment Queue with statuses For Deployment, Draft Setup, Pending Approval, Approved, Deployed, Returned"
    impact: "BIBS forwards to MBS automatically and uses its own stage names."
    action: Ask BDOI
    detail: "C20."
  - ref: "FRPM.017.01"
    item: "Notice to the original reviewer or approver when reassigned"
    impact: "Only the new assignee is notified in BIBS."
    action: Platform change needed
    detail: "Small change."
  - ref: "FRPM.019.01"
    item: "Renewal Request Report of expiring package accounts regardless of a renewal request"
    impact: "Close to our Package Expiry Report; may mean client accounts."
    action: Ask BDOI
    detail: "C22."
  - ref: "FRPM.020.01"
    item: "Reports Builder: choose fields from a data source, save report templates, print"
    impact: "BIBS has saved variants, no designer."
    action: Ask BDOI
    detail: "C21."
  - ref: "FRPM.021.01, 021.02"
    item: "Audit Logs menu with filters by action type and reference number, Old Value and New Value columns, export file name; audit section with export on each record"
    impact: "BIBS Audit Trail filters by date, user and record type; record history has no export."
    action: Platform change needed
    detail: "Add filters and export."
  - ref: "Process flows"
    item: "'Upload ISACOM Approval' and 'Generate and send Placement Update to Marketing' in the non-package flow; MBS 'Maintain package as draft' and TSU 'Review package configuration' for non-package products"
    impact: "ISACOM approval is not described anywhere else; non-package products would also be set up by MBS."
    action: Ask BDOI
    detail: "What ISACOM approval is and when it is needed; after C01."
  - ref: "Signoff Sheet"
    item: "ITG roles: System Analyst (prepared), Tech Lead and Application or Platform Owner (reviewed), Project Owner / Sponsor (approved)"
    impact: "Our signature page has business units only."
    action: Add to our FRS
    detail: "Use BDOI's sheet with the business unit signatories added."

# ------------------------------------------------------------------ 9 Field comparison
# For each annex field of BDOI's FRS (bdoi_frs_brd03.yaml): our screen and field, mandatory and type in ours, and the
# difference. 'match' is Same, Partial, Different or Not in ours. Fields not listed under a key fall back to the default
# of their annex.
fields:
  A:
    default: {screen: "-", field: "-", mandatory: "-", type: "-", match: Not in ours, difference: "No such field on our product or package version."}
    map:
