# Quotation slip templates of Annex D (non-package) and F (package) against the BIBS quotation slips. 'covered' are the
# labels of BDOI's templates that the BIBS slip also fills; the other labels are listed as the difference.
qs_compare:
  package:
    annex: "Annex F – Package QS template"
    screen: "Package quotation slip (draft layout), Negotiation tab (FR-PM-030, DO-02)"
    ours: "One slip per round: slip number, round, request, package, line, client or programme, reply date; round notes; requested terms (sections; coverages with included, limit, sub-limit, deductible; rate %, minimum premium, commission %, TSI limit, computation basis, dates; insurers); opening text; signature lines Prepared by and Approved by."
    covered: [Reference No, Line of Insurance, Insured’s Name, Perils / Coverages, Perils/Coverages, Cover, Deductibles, Maximum Limit/s, Premium Rates/ Commission Rates, Premium Rates / Commission Rates, Description of Cover, Benefits / Coverages, Extensions of Cover, Cover / Undertaking, Type of Cover]
    extra: "BDOI's template also has the law and jurisdiction clause, the TSU handler's signature and the insured's conforme; ours adds the round, reply due date and round notes."
  non_package:
    annex: "Annex D – Non-package QS template"
    screen: "BIBS New Business quotation slip, Proposal Request record (FR-NB-053, BRD-1 DO-02)"
    ours: "One slip per insurer approached: QS number, PRF, ARN, client, product, period, reply date; risk details and risk items with sums insured; request text with the reply date."
    covered: [Reference No, Line of Insurance, Insured’s Name, Period of Insurance]
    extra: "Line-specific details appear only as keyed in the risk details or risk items of the request. BDOI's template also has the law and jurisdiction clause, the TSU handler's signature and the insured's conforme."
