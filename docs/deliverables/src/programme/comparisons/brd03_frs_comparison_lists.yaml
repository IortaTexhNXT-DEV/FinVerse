# Lists of the comparison of BDOI's Product Maintenance FRS (v1.0, 19-Aug-2026) with the BIBS FRS BRD-3 v2.1:
# what only ours has (sheet 6), what only BDOI's has (sheet 7) and the field mapping of BDOI's Annex A to F against our
# screen specifications (sheet 9). Read by build_frs_comparison.py with brd03_frs_comparison.yaml.

# ------------------------------------------------------------------ 6 Only in ours
# recommendation: Include | Include as annex | Keep as supporting document
only_ours:
  - ref: FR-PM-004
    kind: Functional requirement
    content: "Protect documents that leave BIBS: password-protected PDF or Excel, password in a separate e-mail, access to package documents by permission."
    brd: BRPM.020
    where: "New FRPM.031 Document protection (unless BDOI waives BRPM.020, C13)"
    recommendation: Include
  - ref: FR-PM-005
    kind: Functional requirement
    content: "Audit entries can only be added, never changed or deleted; retention 5 years online, 15 years archive until BDOI states otherwise; the History tab shows workflow and audit rows."
    brd: BRPM.024
    where: "Sub-items of FRPM.021.01 and 021.02"
    recommendation: Include
  - ref: FR-PM-010
    kind: Functional requirement
    content: "Product hierarchy line > cover type > subtype (depth 2) > product (risk code), coverages and perils per line; risk-code naming pattern per line; maker-checker."
    brd: PMADD01
    where: "New FRPM.022 Product hierarchy and clause library"
    recommendation: Include
  - ref: FR-PM-011
    kind: Functional requirement
    content: "Clause library of warranties, clauses, exclusions and deductible wordings with effective dates; the source list of BDOI's 'Warranties, Clauses' drop-down (Annex A, E)."
