frum:
- id: FRUM.001
  component: Login
  capability: Login, Inactivity Warning, and Timeout
  scope: []
  items:
  - id: FRUM.001.01
    title: The system shall allow the user to access BDOI-BROKERSYS application using any BDO-issued device and even on multiple
      tabs on supported web browser.
    text: []
  - id: FRUM.001.02
    title: Login and Role-Based Access
    text:
    - The system shall allow the user to log in using a valid profile.
    - The BDOI-BROKERSYS application shall be onboarded as an authorized application in the Enterprise SSO platform to enable
      Single Sign-On (SSO) authentication.
    - The system shall require users to sign in using their authorized Enterprise SSO account.
    - '  Access to the application disables after three (3) invalid password tries.'
    - The system shall integrate with Enterprise SSO platform for user authentication.
    - The system shall establish a session upon successful authentication and grant access based on the user's assigned roles
      and permissions.
    - '  User shall only access (read, update, approve) modules based on the permission on the access matrix provided and
      approved by the Business. Refer to Annex C -User Access Matrix.'
    - '  User with Supervisory roles have the same view as their assigned personnels (e.g. UH can manage the records of all
      assigned personnels including access to uploaded documents).'
    - '  Access to unauthorized records and documents shall be denied in the BDOI-BROKERSYS application or any document repositories
      where the uploaded document is stored.'
    - The system shall deny access to users whose Enterprise SSO accounts are inactive, locked, disabled, or unauthorized
      to access the application.
    - The system shall redirect unauthenticated users to page with appropriate error message.
    - '  Users with unauthorized access to the page should be displayed an unauthorized error message.'
    - '  Users with expired sessions attempting to access pages should be redirected to the Login page and should go through
      re-authentication.'
    - The system shall record account login and logout activities in the audit trail.
  - id: FRUM.001.03
    title: Inactivity Warning
    text:
    - The system shall monitor user activity and display an inactivity warning after the inactivity timer has elapsed.
    - '  Default inactivity timeout setting to 15 minutes.'
    - '  Inactivity timer shall be reset upon system detection of user activity.'
    - The warning shall prompt the user to either stay logged in or log out.
    - '  Message – “You have been inactive for x minutes. For your security, your session is about to expire. Would you like
      to stay logged in or log out?”'
    - '  x minutes refers to the configured inactivity timer.'
    - 'The warning dialog shall display two buttons:'
    - '  “Stay Logged In” – keeps the current session active and resets the inactivity timer.'
    - '  “Log Out” – terminates the session and securely logs the user out of the system.'
    - The system shall record user inactivity in the audit trail.
  - id: FRUM.001.04
    title: Session Timeout Warning
    text:
    - The system shall notify the user x minutes after inactivity that the session automatically ended due to timeout.
    - '  The warning message shall clearly state: “Your session timed out. Please log in again to continue”'
    - '  x minutes refer to the configurable timeout session.'
    - '  Default session timeout setting for 30 minutes.'
    - The notification shall display a “Log In” button that redirects the user to the Login page.
    - The system shall record timeout in the audit trail.
- id: FRUM.002
  component: User Management
  capability: User Creation
  scope:
  - 'In-Scope: Creation of new user and sync of user details to BDOI-BROKERSYS application'
  - 'Out-of-Scope: New User request and Enterprise SSO account creation are done outside of the BDOI-BROKERSYS application.'
  items:
  - id: FRUM.002.01
    title: New User Creation
    text:
    - New User requests and Enterprise SSO account creation shall be performed outside the BDOI-BROKERSYS application.
    - The system shall allow authorized users to create a BDOI-BROKERSYS user using an existing and active Enterprise SSO
      account.
    - The system shall validate that the Enterprise SSO account exists and is active before allowing user creation.
    - The system shall retrieve available user information from the Enterprise SSO platform during automatic user creation
      via API.
    - '  Windows ID'
    - '  AD Email'
    - '  AD Group'
    - '  AD Status'
    - '  AD Sync Date/Time'
    - '  Firstname'
    - '  Lastname'
    - '  Display Name'
    - '  Team Leader'' Name'
    - '  Team Head'' Name'
    - '  Section Head''s Name'
    - '  Unit Head''s Name'
    - '  Unit/Segment'
    - '  Department'
    - '  Location (i.e. CCO, Makati, etc.)'
    - '  UIDM Request No'
    - '  Created By'
    - '  Created Date'
    - '  Modified By'
    - '  Modified Date'
    - The system shall allow authorized users to assign the user's access role and applicable permissions.
    - The system shall allow authorized users to assign the user's organizational hierarchy, region, branch, department, section,
      or other attributes as per defined in the access matrix.
    - The system shall prevent the creation of duplicate users mapped to the same Enterprise SSO account.
    - '  Duplication Criteria: Validate if there is existing AD email AND Windows ID combination.'
    - The system shall generate a unique user record within BDOI-BROKERSYS upon successful user creation.
    - The system shall maintain the association between the BDOI-BROKERSYS user and Enterprise SSO account.
    - The system shall record user creation activities in the audit trail.
    - Only users with appropriate permissions shall be authorized to create users.
    - The system shall display an appropriate error message when user creation cannot be completed due to invalid, inactive,
      or unavailable Enterprise SSO account information.
    - '  Error messages should not give clues on exact error.'
  - id: FRUM.002.02
    title: New User details sync to BDOI-BROKERSYS application
    text:
    - The system shall retrieve user details from the Enterprise SSO platform.
    - The system shall synchronize user profile information maintained in the Enterprise SSO platform to the BDOI-BROKERSYS
      application.
    - The system shall update user details in BDOI-BROKERSYS whenever changes are detected from the Enterprise SSO platform.
    - The system shall synchronize user status information including Active, Inactive, Locked, Disabled, and other supported
      user status.
    - The system shall synchronize user organizational attributes maintained in the Enterprise SSO platform.
    - The system shall preserve application-specific roles and permissions maintained within BDOI-BROKERSYS application.
    - The system shall prevent the creation of duplicate user records during synchronization.
    - The system shall log all user synchronization activities and processing results in the audit trail.
    - The system shall identify and record synchronization failures for administrative review.
    - The system shall allow authorized users to initiate on-demand synchronization of user details.
    - The system shall display the latest synchronization status and timestamp of the user.
    - The system shall maintain data consistency between Enterprise SSO and BDOI-BROKERSYS user details based on the configured
      synchronization rules.
- id: FRUM.003
  component: User Management
  capability: User Details Update
  scope:
  - 'In-Scope: Sync of user details and status to BDOI-BROKERSYS application.'
  - 'Out of Scope: User update request, User status update request and User details update done outside the BDOI-BROKERSYS
    application.'
  items:
  - id: FRUM.003.01
    title: User Details Update
    text:
    - The system shall retrieve updated user details from the Enterprise SSO platform.
    - The system shall synchronize user details maintained in the Enterprise SSO platform to BDOI-BROKERSYS.
    - The system shall update the corresponding BDOI-BROKERSYS user when changes are detected in the Enterprise SSO platform.
    - The system shall synchronize the account details and other user attributes maintained in the Enterprise SSO platform.
    - The system shall maintain the user's existing application-specific roles and permissions unless modified by an authorized
      user.
    - The system shall prevent the creation of duplicate user records during synchronization.
    - The system shall record user detail update activities in the audit trail.
    - The system shall identify and log synchronization failures for administrative review.
    - The system shall display the latest synchronized user details within the BDOI-BROKERSYS application.
    - The system shall update user details without requiring recreation of the user.
  - id: FRUM.003.02
    title: User Status Update
    text: []
  - id: FRUM.003.02.01
    title: Deactivate User
    text:
    - The system shall retrieve user status changes from the Enterprise SSO platform.
    - The system shall synchronize user deactivation status to BDOI-BROKERSYS.
    - The system shall automatically revoke access to BDOI-BROKERSYS when the synchronized user status is marked as Inactive,
      Disabled, Locked, or Deactivated.
    - The system shall prevent deactivated users from logging in to the application.
    - The system shall terminate active sessions upon detection of user deactivation.
    - The system shall record user deactivation activities in the audit trail.
  - id: FRUM.003.02.02
    title: Reactivate User
    text:
    - The system shall retrieve user reactivation status changes from the Enterprise SSO platform.
    - The system shall synchronize user reactivation status to BDOI-BROKERSYS.
    - The system shall restore application access for users whose user status is changed to Active.
    - The system shall maintain previously assigned application roles and permissions.
    - The system shall allow reactivated users to access the application through Enterprise SSO authentication.
    - The system shall record user reactivation activities in the audit trail.
  - id: FRUM.003.03
    title: User details sync to BDOI-BROKERSYS application
    text:
    - The system shall integrate with the Enterprise SSO platform as the source of user details
    - The system shall retrieve and synchronize user details and status from the Enterprise SSO platform and update BDOI-BROKERSYS
      whenever changes are detected.
    - The system shall maintain data consistency between the Enterprise SSO platform and BDOI-BROKERSYS based on configured
      synchronization rules.
    - The system shall synchronize user status including Active, Inactive, Locked, Disabled, Deactivated, and Reactivated
      statuses and reflect immediately to BIBS.
    - The system shall preserve application-specific roles and permissions maintained within BDOI-BROKERSYS unless explicitly
      configured.
    - The system shall prevent duplicate user records from being created during synchronization.
    - The system shall maintain the association between the Enterprise SSO account and the corresponding BDOI-BROKERSYS user.
    - The system shall deny access to users whose synchronized user status indicates Inactive, Locked, Disabled, Deactivated,
      or Unauthorized status.
    - The system shall record all synchronization activities including successful and failed synchronization events in the
      audit trail.
    - The system shall identify, record, and notify authorized users of synchronization failures.
    - The system shall display the latest synchronization status and timestamp for each user.
- id: FRUM-004
  component: User Management
  capability: Password Maintenance
  scope:
  - 'In-Scope: All password maintenance activities should reflect immediately to the BDOI-BROKERSYS application.'
  - 'Out of Scope: All password maintenance requests and servicing are done outside the BDOI-BROKERSYS application.'
  items:
  - id: FRUM-004.01
    title: Password Expiry
    text:
    - The system shall integrate with the Enterprise SSO platform for user authentication.
    - The system shall rely on the Enterprise SSO platform for password expiry validation.
    - '  Expires at least once every 90 days.'
    - The system shall prevent user access when the Enterprise SSO platform indicates that the user's password has expired.
    - The system shall redirect users with expired passwords to the Login Page displaying applicable error message.
    - '  Error messages should not give clues on exact error.'
    - The system shall not allow users to bypass password expiry requirements enforced by the Enterprise SSO platform.
    - The system shall automatically recognize password expiry status changes upon the user's next authentication attempt.
    - The system shall display an appropriate message when access is denied due to password expiry.
    - The system shall record authentication failures related to password expiry in the audit trail.
  - id: FRUM-004.02
    title: Reset Password
    text:
    - The system shall not provide a password reset function within the BDOI-BROKERSYS application.
    - '  Prevent reuse of at least the last ten (10) passwords.'
    - The system shall rely on the Enterprise SSO platform to validate user credentials during authentication.
    - The system shall allow users to authenticate using their newly reset password.
    - The system shall invalidate existing application sessions when required by the Enterprise SSO platform following a password
      reset.
    - The system shall require re-authentication after a password reset has been completed.
    - The system shall prevent access when authentication using the updated credentials fails.
    - The system shall record authentication events following password reset activities in the audit trail.
  - id: FRUM-004.03
    title: Forgot Password
    text:
    - The system shall not provide a forgot password function within the BDOI-BROKERSYS application.
    - '  Prevent reuse of at least the last ten (10) passwords.'
    - The system shall rely on the Enterprise SSO platform to perform identity verification and password recovery activities.
    - The system shall not store, manage, retrieve, or disclose user passwords.
    - The system shall allow users to authenticate after successful completion of the Enterprise SSO password recovery process.
    - The system shall require successful authentication through the Enterprise SSO platform before granting access to the
      application.
    - The system shall display an appropriate error message when authentication fails.
    - '  Error messages should not give clues on exact error.'
    - The system shall maintain audit logs of login attempts and authentication outcomes.
    - The system shall ensure that all password-related activities remain governed by the Enterprise SSO platform.
- id: FRUM.005
  component: Roles Management
  capability: Role Creation
  scope:
  - 'In-Scope: Role creation and permission configuration in BDOI-BROKERSYS application.'
  - 'Out of Scope: AD Group creation request and AD Group creation are done outside the BDOI-BROKERSYS application.'
  items:
  - id: FRUM.005.01
    title: Role Creation and Permission configuration
    text:
    - The system shall allow authorized users to create application roles within BDOI-BROKERSYS Application.
    - The system shall allow authorized users to define a unique role name and role description.
    - The system shall prevent the creation of duplicate role names.
    - The system shall allow authorized users to configure permissions for each role.
    - The system shall allow permissions to be assigned based on modules, functions, transactions, pages, and actions within
      the application.
    - The system shall allow authorized users to configure record ownership access rules.
    - The system shall allow authorized users to configure supervisory access rules for users managing subordinate personnel.
    - The system shall enforce configured permissions during user access and transaction processing.
    - The system shall prevent users from accessing functions and records not included in their assigned role.
    - The system shall maintain role creation and permission configuration activities in the audit trail.
    - The system shall allow authorized users to view all configured roles and associated permissions.
- id: FRUM.006
  component: Roles Management
  capability: Role Details Update
  scope:
  - 'In-Scope: Role update and permission update to BDOI-BROKERSYS application.'
  - 'Out of Scope: Role update request, permission update request are done outside the BDOI-BROKERSYS application.'
  items:
  - id: FRUM.006.01
    title: Role Details Updates
    text:
    - The system shall allow authorized users to search for existing roles.
    - The system shall allow authorized users to modify role information, including role name and role description.
    - The system shall prevent the use of duplicate role names.
    - The system shall validate role update before saving changes.
    - The system shall display the current users assigned to the selected role.
    - The system shall maintain the association between users and their assigned roles after role updates.
    - The system shall apply approved role updates to all users assigned to the role.
    - The system shall record role update activities in the audit trail.
  - id: FRUM.006.02
    title: Role Status Updates
    text: []
  - id: FRUM.006.02.01
    title: Deactivate Role Status Updates
    text:
    - The system shall allow authorized users to search for existing roles.
    - The system shall allow authorized users to deactivate an active role.
    - The system shall display the users currently assigned to the selected role prior to deactivation.
    - The system shall prevent deactivated roles from being assigned to new users.
    - The system shall retain role assignments for historical and audit purposes.
    - The system shall enforce access restrictions based on the deactivated role status.
    - The system shall record role deactivation activities in the audit trail.
    - The system shall maintain historical records of role status changes.
  - id: FRUM.006.02.02
    title: Reactivate Role Status Updates
    text:
    - The system shall allow authorized users to search for inactive user roles.
    - The system shall allow authorized users to reactivate an inactive role.
    - The system shall restore the role to Active status upon successful update.
    - The system shall allow the reactivated role to be assigned to users.
    - The system shall enforce permissions associated with the reactivated role.
    - The system shall record role reactivation activities in the audit trail.
    - The system shall maintain historical records of role status changes.
  - id: FRUM.006.03
    title: Permission Updates
    text:
    - The system shall allow authorized users to search for existing roles and permissions.
    - The system shall allow authorized users to add, modify, or remove permissions assigned to a role.
    - The system shall allow authorized users to update permissions based on the approved access matrix.
    - The system shall validate permission configurations before saving changes.
    - The system shall prevent the assignment of conflicting or invalid permission combinations.
    - The system shall automatically enforce updated permissions after successful save.
    - The system shall immediately restrict access to functions and records for permissions that have been removed.
    - The system shall record all permission update activities in the audit trail.
- id: FRUM.007
  component: Reports Managements
  capability: Reports Generation and Exports
  scope: []
  items:
  - id: FRUM.007.01
    title: View and filter reports
    text:
    - The system shall allow authorized users to access the Reports module and generate or export reports
    - The system shall display only reports that the user is authorized to access.
    - '  User Access Report'
    - '  User Group Profile Report'
    - '  Group Profile Membership List'
    - The system shall follow the report design from the Annex C - Report Templates.
    - The system shall allow users to filter report data using search criteria.
    - The system shall allow users to sort report results based on available report fields.
    - The system shall display the total number of records returned from the selected criteria.
    - The system shall maintain audit logs of report generation activities.
  - id: FRUM.007.02
    title: Export Reports
    text:
    - The system shall allow authorized users to export reports below.
    - '  User Access Report'
    - '  User Group Profile Report'
    - '  Group Profile Membership List'
    - The system shall support report export in CSV, XLSX and PDF format.
    - '  File name:<Report_Name>_MMDDYYYY where'
    - '    Report_Name is the generated report'
    - '    MMDDYYYY is the extraction date'
    - The system shall export only the data returned by the user's selected filters and search criteria.
    - The system shall preserve report headers and column formatting during export.
    - The system shall prevent users from exporting data that they are not authorized to view.
    - The system shall display a confirmation message upon successful report generation and export.
    - The system shall record export activities in the audit trail.
- id: FRUM-008
  component: Generate Logs
  capability: Audit Trail
  scope: []
  items:
  - id: FRUM.008.01
    title: Generate audit logs for compliance, monitoring, security, and audit purposes.
    text:
    - The system shall automatically record audit logs for all create, update, delete/deactivate, reactivate, submit, approve,
      reject, cancel, login, logout, export and other actions.
    - The system shall capture user activities performed within the application.
    - 'The system shall record the following audit information for each transaction:'
    - Timestamp
    - Module
    - User Id (Windows ID)
    - Performed By (Username)
    - Role
    - Action (e.g. Create, Update, Delete, Submit, Approve, Reject, Cancel, Login, Logout, Inactivity, Timeout, Generate and
      Export)
    - Activity (Short description of action)
    - From (Old Value)
    - To (New Value)
    - IP Address
    - The system shall generate audit logs automatically upon successful completion or upon failure of the action.
    - The system shall maintain audit logs prevent unauthorized modification or deletion.
    - The system shall generate separate audit log entries for each action performed on a record.
    - The system shall retain audit logs in accordance with the organization's data retention policy.
  - id: FRUM.008.02
    title: View audit trail records.
    text:
    - The system shall have a dedicated Audit Trail page.
    - The system shall display audit logs in chronological order sorted by the most recent record.
    - The system shall display the following audit details for each transaction.
    - '  Timestamp'
    - '  Module'
    - '  User Id (Windows ID)'
    - '  Performed By (Username)'
    - '  Role'
    - '  Action (e.g. Create, Update, Delete, Submit, Approve, Reject, Cancel, Login, Logout, Inactivity, Timeout, Generate
      and Export)'
    - '  Activity (Short description of action)'
    - '  From (Old Value)'
    - '  To (New Value)'
    - '  IP Address'
    - The system shall allow authorized users to filter audit logs based on selected criteria.
    - The system shall allow authorized users to sort audit log records by available columns.
    - Users without the required authorization shall be denied access to audit trail page.
  - id: FRUM.008.01 (2nd)
    title: Export audit trail records.
    text:
    - The system shall support export to CSV, PDF and XLSX.
    - '  File name: Audit Logs_MMDDYYYY'
    - '    Audit Logs_ is constant'
    - '    MMDDYYYY is the extraction date'
    - The system shall include all audit trail records in the exported file based on the applied search and filter criteria.
    - The exported audit trail report shall follow template as per Annex D – Audit Log Export
    - The system shall allow export only to users with the appropriate access rights.
    - The system shall maintain an audit record of all audit trail exports for compliance purposes.
