  - 1.2 Add remarks (i.e reason for deactivation)
  - 1.3 Save remarks
  - 1.4 Select approver from the drop-down
  - 2. Edit a drafted request
  - 3. Cancel a drafted request
  - 4. Submit a request
  bdoi_frs: FRUM.003
- id: BRD 1.005
  requirement:
  - V. Reactivate User
