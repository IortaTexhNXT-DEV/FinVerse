# Comparison of BDOI's User Access Maintenance FRS (BDO ITG template D051, FR document PRJ0012475, revision 1.1,
# prepared by John Barbachano) with the BIBS FRS of BRD-11 User Access Maintenance (v2.1 of 8-Oct-2026): the
# assessment, the mapping of every BDOI functional requirement item, the conflicts and slips, the annex and field
# comparison and the incorporation plan. BDOI's text comes from brd11_bdoi_frs.yaml; the BIBS FRs, their acceptance
# criteria and the BRD traceability are read from the BIBS FRS source at build time (build_brd11_comparison.py).
# The conflicts are also the source of Annex Q of the incorporated FRS v1.2 (docs/deliverables/src/programme/
# bdoi_template_frs/build_brd11_bdoi_frs.py): keep their ids stable.
#
# Values used in the sheets
#   match:    Same | Partial | Different | Not in ours
#   platform: Yes (the BIBS platform provides it) | Partly (it provides part; the rest is configuration or a change)
#             | No (it needs a platform change)
#   action:   Adopt BDOI wording | Keep ours | Needs BDOI decision | Platform change
meta:
  title: BDOI User Access Maintenance FRS compared with the BIBS User Access Maintenance FRS
  subtitle: BRD-11 User Access Maintenance - BDOI's FRS revision 1.1 (BDO ITG) and the BIBS FRS v2.1, with the incorporation plan
  version: "1.0"
  date: 09 October 2026
  file: BIBS_Comparison_BRD-11_BDOI_FRS_vs_BIBS_FRS_User_Access_Maintenance_v1.0.xlsx
  ours_version: "2.1"
  ours_date: 8-Oct-2026
  bdoi_created: 21-Sep-2026

purpose:
  bdoi: >-
    BDOI's FRS is the BDO ITG Functional Requirements Specifications of project PRJ0012475 "BDO Insure Brokering
    System (BIBS) - User Access Maintenance, Release 1 / Drop 0" (template D051, revision 1.1, created 21-Sep-2026 and
    last updated 9-Oct-2026 by John Barbachano). It maps the BRD functions to eight FRUM entries (25 numbered items)
    and rests on the BDO Enterprise SSO platform: users, their details, status and passwords come from the SSO
    platform, and the access requests and approvals are made outside the system (UIDM). Nine annexes give the process
    flows, the report samples and fields, the audit log and references to the User Access Matrix and the password
    guidelines.
  ours: >-
    The BIBS FRS of BRD-11 (v2.1, 8-Oct-2026, iorta TechNXT) is the business sign-off specification of user access in
    BIBS, re-based on the User Access Maintenance BRD and the Drop 0 decisions of 26-Sep-2026. It turns each of the
    160 BRD requirement lines and the 41 non-functional rows into 40 functional requirements with flows, rules,
    messages, screens, notifications, audit and numbered acceptance criteria: sign-in with EIAM single sign-on and
    break-glass administrators, access requests under four eyes with second approval of risky changes, group-profile
    requests implemented by the System Administrator, separation-of-duties rules, reports and an access-change log.

recommendation:
  title: Use BDOI's FRS as the master document and incorporate the BIBS content into it (version 1.2)
  text: >-
    Keep BDOI's ITG template D051, its section order, its FRUM numbering and every one of its sentences, because BDO
    ITG owns the FRS and its sign-off route. Elaborate each FRUM item with the BIBS rules, validations, fields,
    statuses, approvals and messages in BDOI's "The system shall ..." style, followed by numbered acceptance criteria;
    add the BIBS-only capabilities as new sub-items and as new entries FRUM.009 onwards (access requests, approval,
    bulk requests, separation of duties and security settings, notifications); extend the Business Requirements
    Mapping to every BRD line; keep Annexes A to I and add Annexes J to R (screens, messages, notifications, rules and
    parameters, sign-in and identity integration, walkthroughs, traceability, observations for decision, glossary).
    Where the two disagree, BDOI's text stays and the point goes to the observations annex with both readings and a
    proposal. The first decision BDOI must take is where access requests are raised and approved (conflict C01):
    it settles the scope of FRUM.002, FRUM.003 and the new FRUM.009 to FRUM.011.
  alternatives:
    - name: "B. BIBS FRS as the master, re-laid in BDOI's ITG template"
      tradeoff: >-
        Our structure, IDs and test traceability stay; BDOI's FRUM become a cross-reference column. But BDO ITG
        loses its numbering and wording, and its SSO-centred design (users and statuses from the SSO platform) would
        read as replaced rather than decided.
    - name: "C. Two documents: BDOI's FRS signed as the baseline, the BIBS FRS kept as the supporting specification"
      tradeoff: >-
        Least effort now. But the two documents disagree on where requests are made, on role creation and on several
        values, so UAT would test against acceptance criteria the signed FRS does not contain, and every later change
        is made twice.
    - name: "D. A new joint document with new numbering"
      tradeoff: >-
        One numbering for BRD, FRS and tests, but the highest effort and BDO ITG has to re-baseline a document it
        issued on 9-Oct-2026.

structure:
  - bdoi: Cover box (template D051, FR document PRJ0012475, prepared by, creation date, revision, last updated)
    ours: Cover, document control (versions 0.9 to 2.1), distribution list
    bdoi_has: Template reference, document number, preparer, dates and revision 1.1; no Document Revision Log table
    ours_has: Version history with author, reviewer, approver and change; distribution with role and purpose
    depth: Both short
    assessment: Keep BDOI's cover; move to revision 1.2, add "Drafting support - iorta TechNXT Project Team" and a Document Revision Log.
  - bdoi: "1 Introduction: purpose, intended audience, project background, objectives, rationale, preparation / review / approval, references"
    ours: "1 Introduction (purpose, scope with out-of-scope items, references R1-R10, definitions, how to read); 2 Business context and process overview"
    bdoi_has: Programme-level background and seven objectives of BIBS; template instructions still in place; references not filled in
    ours_has: Scope table by area, out-of-scope list, references with versions, glossary, before / after process, process steps, access functions
    depth: BDOI programme-level; ours module-level
    assessment: Keep BDOI's text; add the drafting sentence, the references and the scope boundaries; glossary as Annex R.
  - bdoi: 2 Business Requirements Mapping (23 rows)
    ours: 11 Traceability (160 BRD lines with FR and test cases); 8 NFR table (41 rows)
    bdoi_has: One row per BRD function with the BRD text and FRUM IDs; 9 rows "c/o UIDM" or FRID items of another document
    ours_has: Every BRD line with page, Mandatory flag, FR and test cases; NFR rows with the BIBS approach and FR
    depth: BDOI function level; ours line level
    assessment: Keep BDOI's 23 rows; add the BRD lines under each row and an FRUM for every "c/o UIDM" and FRID row.
  - bdoi: 3 Functional Requirements (8 FRUM entries, 25 items)
    ours: 4 Functional requirements (40 FRs in 7 groups)
    bdoi_has: "\"The system shall\" lists per item, scope statements (in / out of scope), field lists and messages"
    ours_has: Per FR the BRD trace, actor, priority, screens, description, preconditions, flows, rules (configurable or fixed), validations and messages, fields, notifications, audit and acceptance criteria
    depth: BDOI covers sign-in, sync, roles, reports and audit; ours also requests, approvals, bulk, SoD and notifications
    assessment: Elaborate each FRUM item with our rules and acceptance criteria; add FRUM.009-013 for the BIBS-only capabilities.
  - bdoi: Annex A To-Be Process Flows (4 images)
    ours: 2.2 Process overview (figure by actor), 5 Request lifecycle (two status figures), 7 Interfaces (figure), 12 Screen flow
    bdoi_has: Login and integration, user maintenance, roles maintenance and report generation flows
    ours_has: Process by actor, request and group-profile statuses, interfaces, screen flow
    depth: Comparable
    assessment: Keep BDOI's flows; our statuses go to Annex M and our walkthroughs to Annex O.
  - bdoi: Annexes B, D, E to H (report and audit log samples and fields)
    ours: 6 Reports (5 reports with columns and parameters); 17 Document outputs
    bdoi_has: Images of the three report samples and the audit log; field tables E to H
    ours_has: Columns, formats, parameters and layout of five reports, generated from SIT data
    depth: Comparable; titles of F and G swapped in BDOI's FRS
    assessment: Keep BDOI's annexes; extend the fields the BRD asks for (dates and actors of 3.003.2, last action of 3.003.1.6, approved by and request number of sample D).
  - bdoi: Annex C User Access Matrix; Annex I Password Guidelines
    ours: 3 Personas and roles (permissions, role-to-action matrix); 9 Configuration items (password and session parameters); 19 Configuration inputs (matrix template)
    bdoi_has: References to two external files each (matrix target state and personnel list; ASR workbook and password guidelines) with a disclaimer that the matrix is preliminary
    ours_has: The permissions of every access function, the proposed matrix, the menu by persona, the password, lock-out and session values
    depth: BDOI by reference; ours in the document
    assessment: Keep BDOI's references; add our values to Annex M and point Annex C to the User Access Matrix screen and its export.
  - bdoi: Signoff Sheet
    ours: 21 Sign-off and change control
    bdoi_has: ITG roles - prepared by System Analyst, approved by BU Project Owner, reviewed by Delivery Manager, Application Owner and Platform Owner, approved by BU Product Owner Supervisor / Sponsor
    ours_has: Business owner, process owner, Information Security, BDOI IT, ES-BPDS and the project manager, with what each confirms
    depth: Different roles
    assessment: Keep BDOI's sheet exactly; add "iorta TechNXT Project Team (drafting support)" under Prepared by.
  - bdoi: "-"
    ours: 12 Navigation, 13 Screen specifications (19 screens), 14 Walkthroughs (4), 15 Messages, 16 Notifications, 18 Upload screens
    bdoi_has: Messages quoted inside items only; no screen specification
    ours_has: The business view of every screen with screenshots, persona journeys and the catalogues
    depth: Ours only
    assessment: New Annexes J (screens), K (messages), L (notifications), O (walkthroughs).
  - bdoi: "-"
    ours: 7 Interfaces, 8 NFR, 9 Configuration items, 10 Assumptions and open questions, 22 Clarifications, authentication and identity integration requirements (R9)
    bdoi_has: Integration with the Enterprise SSO platform inside FRUM.001-004
    ours_has: EIAM single sign-on, UIDM-ISC provisioning options, break-glass, parameters, 27 clarifications
    depth: Ours only
    assessment: New Annexes M (rules and parameters), N (sign-in and identity integration), Q (observations and points for decision).

pros_cons:
  - [BDOI, Completeness, Pro, "Clear statement of the SSO-centred model: the application is onboarded in the Enterprise SSO platform, users and statuses come from it, passwords are never held or reset in the application."]
  - [BDOI, Completeness, Con, "Nine of the 23 BRD functions are mapped \"c/o UIDM\" or to FRID items of another document (requests, correction, cancellation, view, bulk, approval, System Administrator); no capacity, effective-date, notification, escalation or bulk requirement."]
  - [Ours, Completeness, Pro, "Every BRD line and NFR row is specified, including the in-system requests and approval, bulk, effective dates, second approval of risky changes, separation of duties and notifications."]
  - [Ours, Completeness, Con, "No synchronisation status of users from the SSO platform, no ending of open sessions on an SSO status change, no hierarchy fields (team leader to unit head), no IP address in the audit log."]
  - [BDOI, Traceability, Pro, "A compact mapping from each BRD function to the FRUM entries."]
  - [BDOI, Traceability, Con, "Mapping at function level only; FRID references to another document; the 4.001.1 row is titled Business Administrator; FRUM.008.01 is used twice; FRUM-004 and FRUM-008 written with a hyphen."]
  - [Ours, Traceability, Pro, "Each of the 160 BRD lines leads to its FR, screen and test cases; each FR cites the BRD lines and pages."]
  - [Ours, Traceability, Con, "The non-functional rows carry the analyst's IDs UAM-NFR-01 to 41, because the BRD gives none."]
  - [BDOI, Testability and acceptance criteria, Con, "No acceptance criteria; several statements have no measurable value (\"appropriate error message\", \"configured synchronization rules\", \"reflect immediately\")."]
  - [Ours, Testability and acceptance criteria, Pro, "Numbered acceptance criteria per FR, the basis of the BRD-11 test plan."]
  - [BDOI, Screens and fields, Pro, "Named lists of user fields from the SSO platform (Windows ID, AD e-mail, AD group, hierarchy names, unit, department, location, UIDM request number) and of every report and audit field."]
  - [BDOI, Screens and fields, Con, "No screen layout, flow or mandatory flag; Annex F and G titles swapped; 'Modified by' typed as a date."]
  - [Ours, Screens and fields, Pro, "19 screen specifications with screenshots, field tables with type, mandatory flag, list and message, and the menu by persona."]
  - [Ours, Screens and fields, Con, "The screenshots of New Request were taken on 29-Sep-2026 and still show the earlier check-box list of group profiles, now a searchable profile picker with separation-of-duties warnings."]
  - [BDOI, Rules and validations, Pro, "Concrete values from BDO standards: password expiry 90 days, history of 10, duplicate criterion AD e-mail and Windows ID, inactivity message text and buttons, file names of exports."]
  - [BDOI, Rules and validations, Con, "Roles are created and permissions changed directly by authorised users, without the request, approval and implementation steps of BRD 3.002 and the process diagram of p.6."]
  - [Ours, Rules and validations, Pro, "Four eyes on every access change, segregation of requester, approver and implementer, separation-of-duties rules authorised by Information Security, second approval of privileged or out-of-hours changes and of security settings."]
  - [Ours, Rules and validations, Con, "Several values are proposals waiting for BDOI (history 8, dormancy 90 days, working hours, high-privilege profiles) where BDOI's FRS or guidelines give some of them."]
  - [BDOI, Messages and notifications, Pro, "Exact texts of the inactivity and timeout dialogs and their buttons."]
  - [BDOI, Messages and notifications, Con, "No notification of requesters, approvers or affected users; only synchronisation failures are notified."]
  - [Ours, Messages and notifications, Pro, "A messages catalogue quoted from the screens and the notices of every request event, to the approver, the requester and the affected user, in the system and by e-mail."]
  - [BDOI, Process flows, Pro, "Four to-be flows (login and integration, user maintenance, roles maintenance, report generation) that business readers follow at a glance."]
  - [Ours, Process flows, Pro, "Process by actor, request and group-profile status models, four end-to-end walkthroughs with screenshots."]
  - [BDOI, Approvals and maker-checker, Con, "No approval inside the system: approvals happen in UIDM for users and are not stated for roles and permissions."]
  - [Ours, Approvals and maker-checker, Pro, "Chosen approver, approvers in order for group profiles, second approver, Information Security as checker of rules and settings."]
  - [BDOI, Reports, Pro, "Report and audit log templates as images, file name rules and a confirmation on export."]
  - [Ours, Reports, Pro, "Five reports with columns, parameters, as-of date and the access-change log behind them; the User Access Matrix with Excel export."]
  - [BDOI, Non-functional, Con, "Only session times, lock-out and password expiry; capacity, retention, batch failure e-mail and documentation rows of the BRD are not addressed."]
  - [Ours, Non-functional, Pro, "All 41 NFR rows answered, with the BIBS approach and the FR that meets each functional one."]
  - [BDOI, Sign-off readiness, Pro, "In BDO ITG's template D051 with the ITG review and approval route; revision 1.1 of 9-Oct-2026 is current."]
  - [BDOI, Sign-off readiness, Con, "Template instructions, an empty table and unfilled references remain; the User Access Matrix is marked preliminary."]
  - [Ours, Sign-off readiness, Pro, "Issued for business sign-off with a sign-off workbook, test plan, UX deck and configuration templates in the same release set."]
  - [Ours, Sign-off readiness, Con, "Not in BDO ITG's template; 27 proposed rules and clarifications still need BDOI's confirmation."]
  - [BDOI, Alignment with the BRD, Con, "Moves requests, approvals and bulk outside the system although the BRD asks for a module in which the business manages access itself (p.5), and leaves out the request and implementation steps of group profiles (p.6)."]
  - [Ours, Alignment with the BRD, Pro, "Follows the BRD functions and its process diagram; every difference from the BRD text is listed for confirmation."]
  - [BDOI, Alignment with the platform, Con, "Assumes a synchronisation of users and statuses from the SSO platform with an on-demand trigger and status display that the BIBS platform does not provide."]
  - [Ours, Alignment with the platform, Pro, "Describes what the BIBS screens and rules do, with screenshots of the platform; single sign-on with OpenID Connect and SAML 2.0 is part of BIBS."]
  - [Ours, Alignment with the platform, Con, "The UIDM-ISC provisioning interface is a proposal (option a) and is not yet agreed with BDOI IT."]

mapping:
  - [FRUM.001.01, "FR-UA-001, FR-UA-002", Same, "Yes", Keep ours, "Both: any BDO-issued device and several browser tabs in one session (ours: activity in any tab keeps every tab signed in). The BDO-device rule is enforced by the BDO network and device policy, not by the application (CLR-UA-17)."]
  - [FRUM.001.02, "FR-UA-001, FR-UA-003, FR-UA-051", Partial, "Yes", Adopt BDOI wording, "Both sign in through the BDO single sign-on (EIAM) and grant access by role. Ours adds the account match by Windows ID or UPN, the refusal of an unlinked account and the named break-glass administrators with a local password and second factor; BDOI adds the supervisory view of assigned personnel and the denial on document repositories. Lock-out after 3 tries: EIAM's policy for SSO users, the application's for local accounts."]
  - [FRUM.001.03, FR-UA-002, Partial, Partly, Adopt BDOI wording, "Same warning after 15 minutes that any activity resets. BDOI gives the dialog text and the buttons Stay Logged In and Log Out; the BIBS dialog has its own wording. BDOI records the inactivity in the audit trail; ours records the sign-out with its reason in the session log."]
  - [FRUM.001.04, "FR-UA-002, FR-UA-004", Different, Partly, Needs BDOI decision, "BDOI ends the session after 30 minutes of inactivity and then shows \"Your session timed out\" with a Log In button; ours signs out after 30 minutes of inactivity and, separately, warns 30 minutes before the fixed end of the session, as BRD x.001.1.3 reads (\"warning prior to system triggered log out\")."]
  - [FRUM.002.01, "FR-UA-011, FR-UA-031, FR-UA-052", Different, Partly, Needs BDOI decision, "BDOI: the request and the SSO account are made outside; authorised users create the user from an existing active SSO account whose details are retrieved; duplicates are an existing AD e-mail and Windows ID. Ours (BRD 1.002): an enrolment request in the system under four eyes, or the account provisioned by UIDM-ISC (proposal); the Windows ID is unique on its own; the user ID follows the a999999999 format. BDOI's retrieved fields (AD group, hierarchy names, unit, department, location, UIDM request number) are not held."]
  - [FRUM.002.02, "-", Not in ours, "No", Platform change, "Ours lists UIDM-ISC provisioning as an open interface option (IQ05), with the standard provisioning interface proposed; no synchronisation status, timestamp or on-demand synchronisation per user. BDOI retrieves user details and status from the SSO platform and keeps them in step."]
  - [FRUM.003.01, FR-UA-012, Different, Partly, Needs BDOI decision, "BDOI updates user details from the SSO platform; ours changes user data and group profiles through a Modify user request under four eyes (BRD 1.003). Both keep the roles unless an authorised user changes them."]
  - [FRUM.003.02, "FR-UA-013, FR-UA-014", Partial, Partly, Needs BDOI decision, "Heading of the deactivation and reactivation items below."]
  - [FRUM.003.02.01, "FR-UA-013, FR-UA-006", Different, Partly, Needs BDOI decision, "BDOI revokes access automatically when the SSO status is inactive, disabled, locked or deactivated and ends the open sessions; ours deactivates through a request (reason, effective date) or the dormant-user job, and EIAM refuses a disabled BDO account at the next sign-in. Ending the open sessions at once on a status change from the SSO platform is not provided."]
  - [FRUM.003.02.02, FR-UA-014, Partial, Partly, Needs BDOI decision, "Both restore the roles held before; BDOI on the SSO status Active, ours through a Reactivate user request that can also unlock a locked account."]
  - [FRUM.003.03, "-", Not in ours, "No", Platform change, "Status synchronisation reflected immediately, notification of synchronisation failures and the latest synchronisation status per user; ours has no synchronisation with the SSO platform (EIAM is checked at each sign-in) and provisioning from UIDM-ISC is an open option."]
  - [FRUM-004.01, "FR-UA-005, FR-UA-003", Partial, "Yes", Adopt BDOI wording, "Both: the password of SSO users belongs to the SSO platform, with expiry at least every 90 days. Ours keeps a local password policy (expiry 90 days, history, minimum age) for the break-glass administrators only."]
  - [FRUM-004.02, FR-UA-005, Different, Partly, Needs BDOI decision, "BDOI: no reset function in the application; reuse of the last 10 passwords prevented. Ours: for local accounts an administrator reset (temporary password shown once, change at the next sign-in) and a history of 8 (to confirm); SSO users reset at EIAM."]
  - [FRUM-004.03, FR-UA-005, Different, Partly, Needs BDOI decision, "BDOI: no forgot-password function. Ours: a single-use e-mailed link valid for 30 minutes, for local accounts only; none for SSO users."]
  - [FRUM.005.01, "FR-UA-040, FR-UA-044, FR-UA-045, FR-UA-050, FR-UA-051", Different, "Yes", Needs BDOI decision, "BDOI: authorised users create roles and configure permissions directly in the application (the request is made outside). Ours (BRD 3.002 and p.6): the Business Administrator requests the new group profile, approvers decide in order and the System Administrator implements it; each profile has a privilege level; a direct edit is an audited emergency only. Both: unique names, permissions by module, function and action, audit. BDOI adds record ownership and supervisory access rules."]
  - [FRUM.006.01, "FR-UA-041, FR-UA-045", Partial, "Yes", Needs BDOI decision, "Same checks (unique name, members shown, the change applies to all members); ours through a change request approved and implemented."]
  - [FRUM.006.02, "FR-UA-042, FR-UA-043", Partial, "Yes", Keep ours, "Heading of the role deactivation and reactivation items below."]
  - [FRUM.006.02.01, FR-UA-042, Partial, "Yes", Needs BDOI decision, "Same effect: not assignable, history kept, members lose the access. Ours through a request that lists and notifies the members; whether a profile with members may be deactivated is open (UQ16); the System Administrator profile cannot be deactivated."]
  - [FRUM.006.02.02, FR-UA-043, Same, "Yes", Keep ours, "Both restore the role with its last permissions; ours through a request."]
  - [FRUM.006.03, "FR-UA-041, FR-UA-053", Partial, Partly, Adopt BDOI wording, "Both add and remove permissions by the approved matrix and apply them at once. BDOI prevents conflicting permission combinations within a role; ours refuses a permission both added and removed and the pairs of group profiles one user may not hold (separation-of-duties rules)."]
  - [FRUM.007.01, "FR-UA-060, FR-UA-061, FR-UA-062", Partial, "Yes", Adopt BDOI wording, "Same three reports; ours adds the as-of date, the User Access Audit Log and the Access Requests report; BDOI adds sorting and the total count, and refers to \"Annex C - Report Templates\" while the samples are in Annex B."]
  - [FRUM.007.02, "FR-UA-060, FR-UA-061, FR-UA-062", Partial, Partly, Adopt BDOI wording, "Both export the filtered data to CSV, XLSX and PDF; BDOI fixes the file name <Report_Name>_MMDDYYYY and a confirmation message; the BIBS download names differ."]
  - [FRUM.008.01, "FR-UA-064, FR-UA-063, FR-UA-004", Partial, Partly, Adopt BDOI wording, "Both log every action in a log that no user can change. BDOI's fields add module, role and IP address; ours adds approved by and the request number, and the access-change log with from and to values per attribute. BIBS records the user, time, action, record and summary today."]
  - [FRUM.008.02, FR-UA-063, Partial, Partly, Adopt BDOI wording, "A dedicated audit trail page, newest first, with filters, sorting and an access right in both; BIBS shows no IP address and no role at the time of the action."]
  - [FRUM.008.01 (2nd), FR-UA-063, Partial, Partly, Adopt BDOI wording, "Both export the filtered records to CSV, PDF and XLSX for holders of the right and audit the export; the file name \"Audit Logs_MMDDYYYY\" and the template of Annex D are BDOI's. BDOI numbers this item FRUM.008.01 a second time."]

