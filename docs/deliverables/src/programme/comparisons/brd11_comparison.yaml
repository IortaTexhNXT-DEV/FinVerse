conflicts:
  - id: C01
    kind: Between the documents
    topic: Where access requests are raised and approved
    bdoi: "Mapping rows BRD 1.006 to 1.009 and 2.002: \"c/o UIDM\". FRUM.002: \"New User requests and Enterprise SSO account creation shall be performed outside the BDOI-BROKERSYS application.\" FRUM.003 and FRUM-004: update, status and password requests \"done outside\"."
    ours: "FR-UA-010 to FR-UA-020 and FR-UA-030 to FR-UA-034: every access change is a request in the system, decided by a chosen approver under four eyes; the UIDM-ISC option is open (CLR-UA-03)."
    brd: "Sections A and B: the Requestor creates, edits, cancels, corrects and bulk-submits requests and the Approver approves, rejects or returns them; p.5: a module in which the business unit manages access itself, reducing the dependency on IT."
    platform: Access Requests, approval, return, cancellation, bulk and effective dates on the User Access screens; no provisioning interface from UIDM-ISC.
    matches: Ours (BRD and platform)
    recommendation: "Option (a): UIDM-ISC provisions the user accounts (create, deactivate, reactivate) through the standard provisioning interface, each change logged with its UIDM request number; the assignment and change of group profiles and the group-profile requests stay as requests in the system under four eyes. FRUM.009 to FRUM.011 then apply to the changes not requested in UIDM; all of them apply if BDOI keeps every request in the system."
    impact: Scope of FRUM.002, FRUM.003 and the new FRUM.009 to FRUM.011; provisioning interface to agree with BDOI IT; Annex A flows.
    decide_by: BDOI IT; Process Owner (Business Administration); Information Security
  - id: C02
    kind: Between the documents
    topic: Assignment of roles to a user
    bdoi: "FRUM.002.01: \"The system shall allow authorized users to assign the user's access role and applicable permissions.\""
    ours: "FR-UA-011, FR-UA-012, FR-UA-031: group profiles are assigned through an enrolment or modify request approved by another user; a direct change is an audited emergency of the System Administrator (FR-UA-045, FR-UA-052)."
    brd: "BRD 1.002.1.1.2 and 1.003.1.1.3: select the User Access Group profile in the request; 2.002.5: approve the request."
    platform: Group profiles chosen on New Request; Users screen changes through a request; emergency direct edit off.
    matches: Ours (BRD and platform)
    recommendation: Assign roles through the request with four eyes; read BDOI's "authorized users" as the requester and the approver together.
    impact: FRUM.002.01, FRUM.009.02 and .03.
    decide_by: Information Security; Process Owner (Business Administration)
  - id: C03
    kind: Between the documents
    topic: Creation and change of roles (group profiles)
    bdoi: "FRUM.005.01 and FRUM.006: authorised users create, update, deactivate and reactivate roles and permissions in the application; \"Role update request, permission update request are done outside the BDOI-BROKERSYS application.\""
    ours: "FR-UA-040 to FR-UA-045: the Business Administrator requests, the approvers decide in order, the System Administrator implements; a direct role edit is refused unless the emergency setting is on."
    brd: "BRD 3.002 and the process diagram of p.6: the Business Administrator submits the request, the approver approves, declines or returns it, the System Administrator creates or modifies the group profile."
    platform: Group Profile Requests with approvers in order and the implementation step.
    matches: Ours (BRD and platform)
    recommendation: Keep BDOI's capabilities as the System Administrator's implementation of an approved group-profile request (FRUM.005.02 to .04, FRUM.006.04).
    impact: FRUM.005, FRUM.006.
    decide_by: Process Owner (Business Administration); Information Security
  - id: C04
    kind: Between the documents
    topic: Creating the user from the SSO account
    bdoi: "FRUM.002.01: create a user from an existing and active Enterprise SSO account; validate that it exists and is active; retrieve the user information from the Enterprise SSO platform during automatic user creation."
    ours: "FR-UA-003, FR-UA-011: the system never creates a user from a sign-in; the EIAM identity is linked to an existing active user by the Windows ID or the UPN (CLR-UA-22); the user is created by an approved enrolment or, as proposed, by UIDM-ISC provisioning."
    brd: "BRD 1.002.1.1.1: input new user data; NFR p.14: interface the user ID with EUA using the Windows ID."
    platform: Users created by approved requests; single sign-on links to existing users; no look-up of the SSO directory on the enrolment screen.
    matches: Both partly
    recommendation: Create the user from the UIDM-ISC provisioning (which carries the SSO account) or from an approved enrolment; the Windows ID is checked against EIAM at the first sign-in. A look-up of the SSO directory on the enrolment screen is a platform change for BDOI to decide.
    impact: FRUM.002.01, Annex N.
    decide_by: BDOI IT
  - id: C05
    kind: Between the documents
    topic: Duplicate user check
    bdoi: "FRUM.002.01: \"Duplication Criteria: Validate if there is existing AD email AND Windows ID combination.\""
    ours: "FR-UA-011: the user ID is unique and the Windows ID is unique on its own (\"Windows ID <id> belongs to another user\")."
    brd: Not stated in the BRD.
    platform: User ID and Windows ID unique.
    matches: Ours (platform)
    recommendation: Keep the Windows ID unique on its own, which is stricter than the combination and also refuses BDOI's duplicates; warn when the e-mail address is already used by another user.
