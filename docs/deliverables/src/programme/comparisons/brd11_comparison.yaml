id_scheme:
  recommended: >-
    BDOI's FRUM IDs stay primary (FRUM.nnn, FRUM.nnn.mm, FRUM.nnn.mm.nn), with BDOI's FRUM-004 and FRUM-008 and the
    second FRUM.008.01 kept as written; new sub-items continue BDOI's numbering and new capabilities take FRUM.009
    onwards. The acceptance criteria are numbered under each item, and Annex P links every FRUM item to the BIBS
    FR-UA requirements and their test cases, so UAT traces to the signed numbers.
  alternative: >-
    FR-UA IDs primary with FRUM as cross-reference: less renumbering for the project team but a new numbering for
    BDO ITG, against its ownership of the FRS.
itg_review:
  - The scope of requests in the system against UIDM (C01) and the new entries FRUM.009 to FRUM.013
  - The elaborations under each FRUM item and the acceptance criteria
  - The annexes after I (J to R) and the rows added to Annexes E to H
  - The slips S01 to S12 and the mapping changes
  - The sign-off route with the drafting support line

headline:
  bdoi_pros:
    - In BDO ITG's own template D051, owned and routed for approval by BDO ITG, revision of 9-Oct-2026
    - "Concise: about 6,300 words, 8 FRUM entries with 25 items"
    - "A clear single sign-on model: Enterprise SSO for authentication, password and status"
    - Named field lists for users (from the SSO platform), reports and the audit log
    - Exact dialog texts, file names and BDO values (90-day expiry, history of 10)
  bdoi_cons:
    - Requests, approvals, correction, cancellation and bulk left to UIDM, against BRD sections A and B
    - Roles created and changed directly, without the request, approval and implementation of BRD 3.002 and p.6
    - No acceptance criteria, screens, notifications, effective dates, escalation or separation-of-duties rules
    - "Slips: FRID references, swapped annex titles, FRUM.008.01 twice, template instructions left in"
    - User Access Matrix and password guidelines only as external files, the matrix marked preliminary
  ours_pros:
    - All 160 BRD lines and 41 NFR rows traced to FRs and test cases
    - Four eyes on every access change, second approval of risky changes, separation-of-duties rules
    - 19 screen specifications with screenshots, walkthroughs, messages and notifications catalogues
    - Single sign-on with EIAM in the system, break-glass administrators and the UIDM-ISC options described
    - Numbered acceptance criteria for every FR
  ours_cons:
    - Not in BDO ITG's template and not owned by BDO ITG
    - No synchronisation status or on-demand synchronisation with the SSO platform
    - No hierarchy fields, IP address or role in the audit log
    - The New Request screenshots still show the earlier check-box list of group profiles
    - 27 proposed rules and clarifications still await BDOI

