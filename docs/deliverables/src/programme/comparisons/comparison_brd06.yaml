id_scheme:
  recommended: >-
    BDOI's FRRN IDs stay primary (FRRN.nnn and FRRN.nnn.mm); each item carries "Related BIBS FR: FR-RN-nnn", and the
    acceptance criteria take FRRN.nnn.mm.ACn. The BIBS test cases keep their FR-RN numbers and add the FRRN item, so
    UAT traces to the signed numbers.
  alternative: >-
    FR-RN IDs primary with FRRN as cross-reference: less renumbering for the project team but a new numbering for
    BDO ITG, against its ownership of the FRS.
itg_review:
  - The template deviations (annexes after Z, the acceptance criteria items, the Related BIBS FR column)
  - The renumbered repeated items and the new FRRN entries 045 onwards
  - The scope of CCM and MFT for go-live and the e-mail fallback
  - The completed annexes I, J, N to R, T, Z and the CBG Home rules
  - The decision log of the conflicts and their values (parameters)
  - The sign-off roles (ITG and business approvers)

# Summary sheet: the five headline pros and cons of each document
headline:
  bdoi_pros:
    - In BDO ITG's own template, owned and routed for approval by BDO ITG
    - "Concise: about 27,700 words, one table of 44 FRRN entries"
    - Named field lists and layouts (224 renewal fields, LAMD, insurer, billing and placement files, 14 quotation request sheets)
    - "Business rules from the business: CBG Motor matrix and field updates, letter matrix with schedules, hold cover durations, password convention"
    - Approved templates (Renewal Advice, Insurance Advice, e-policy e-mails) and the whole chain to booking in one document
  bdoi_cons:
    - Maps the 42 BRRN IDs only; the 1,033 line IDs of the main BRD are untraced
    - No acceptance criteria, screen specifications or non-functional requirements
    - Nine annexes are a heading only and the 24 reports have no specification
    - "Contradictions (paid-off and RMU loans in the flow against Annex C) and repeated or skipped item numbers"
    - "Departs from the BRD in places (automatic assignment, referral transfer, extraction by date range only, incentive upon booking, no re-open) and predates the BRD pack of 8-Oct-2026"
  ours_pros:
    - Every BRD ID traced (42 BRRN and 1,033 line IDs) with pages, screens and test cases
    - 160 numbered acceptance criteria, the basis of 406 test cases
    - 20 screen specifications with screenshots, five walkthroughs, messages and notifications catalogues
    - Rules marked configurable or fixed, with maker-checker and versioned rule sets
    - Re-based on the BRD pack of 8-Oct-2026 and describing what the BIBS screens do
  ours_cons:
    - "Long: about 69,000 words and 78 figures"
    - Not in BDO ITG's template and not owned by BDO ITG
    - Placement, billing, e-policy and booking are left to the New Business FRS
    - No CBG Motor field updates, automatic assignment, budget or RMU maintenance, production dashboard
    - 40 points still await BDOI although BDOI's FRS answers several; the letter wording is a draft

# Sheet 4: notes per BRRN ID
brrn_notes:
  BRRN.001: "NAL 1 day after expiry for unanswered RAs (BDOI, Annex M) against the NAL / NRL routing at the effective expiry date (ours)."
  BRRN.004: Both show one scrollable view without pagination.
  BRRN.005: BDOI cites the generation (FRRN.004); ours adds the daily run and the no-omission rule.
  BRRN.007: BDOI cites FRRN.004.06, a number BDOI uses twice (endorsements and export).
  BRRN.008: BDOI cites FRRN.004.06, a number BDOI uses twice (endorsements and export).
  BRRN.009: "Risk code maintenance with a Renewable indicator (BDOI) against a list of non-renewable codes (ours); reason wording differs."
  BRRN.010: "Notice timing (75 / 45 days against the user's choice) and channel (CCM against e-mail) differ."
  BRRN.011: BDOI cites FRRN.010 (assignment) for the AO's own list.
  BRRN.018: A general update upload (BDOI) against the dispositioned-file upload of Processing (ours).
  BRRN.019: BDOI lists 24 reports without layouts; ours specifies the status report, the listing and six other reports.
  BRRN.020: BDOI's mapping reads "RRN.040", mistyped for FRRN.040.
  BRRN.021: BDOI creates renewal accounts at generation; ours separates extraction and initiation.
  BRRN.023: Third bucket Non-Renewable (BDOI) against Exception (ours, BRD).
  BRRN.024: BDOI also refers to the User Access Matrix.
  BRRN.025: NRNS checkpoint 75 days (BDOI) against 90 days (ours).
  BRRN.026: BDOI refers to the User Access Matrix only; ours specifies the follow-ups (FR-RN-085).
  BRRN.028: Both non-blocking; BDOI adds KYC statuses and a dashboard.
  BRRN.029: Paid-off and RMU routing conflict (sheet 8).
  BRRN.030: "User date range only (BDOI) against the daily run at the lead days and on demand (ours)."
  BRRN.031: BDOI's mapping reads "FRRN.08".
  BRRN.032: A Refresh action (BDOI) against the block of pending endorsements (ours).
  BRRN.033: The meaning of For Quotation and For Proposal is swapped between the two FRS.
  BRRN.034: BDOI maps the sanitation rule configuration; ours a versioned decision matrix.
  BRRN.035: Nine insurer values (BDOI) against three (ours, BRD).
  BRRN.036: BDOI cites the bucket list only; ours a listing with attention flags.
  BRRN.039: BDOI's CBG Motor matrix (Annex C) differs from ours on paid-off and RMU loans.
  BRRN.040: BDOI adds a second approval after acceptance and automatic placement status.
  BRRN.041: BDOI evaluates upon booking; BRRN.041 and ours after full payment.
  BRRN.042: Durations and automation of the hold cover differ.

