# Comparison of BDOI's Renewal FRS (BDO ITG, v1.0 of 11-Jun-2026) with the BIBS FRS of BRD-6 Renewal (v2.0 of
# 8-Oct-2026): the assessment, the mapping of every BDOI functional requirement item, the conflicts, the annex
# comparison and the incorporation plan. BDOI's text comes from bdoi_frs_brd06.yaml; the BIBS FRs, their acceptance
# criteria and the BRD traceability are read from the BIBS FRS source at build time (build_comparison_brd06.py).
#
# Values used in the sheets
#   match:    Same | Partial | Different | Not in ours
#   platform: Yes (the BIBS platform provides it) | Partly (it provides part; the rest is configuration or a change)
#             | No (it needs a platform change)
#   action:   Adopt BDOI wording | Keep ours | Needs BDOI decision | Platform change
meta:
  title: BDOI Renewal FRS compared with the BIBS Renewal FRS
  subtitle: BRD-6 Renewal - BDOI's FRS v1.0 (BDO ITG) and the BIBS FRS v2.0, with the incorporation plan
  version: "1.0"
  date: 09 October 2026
  file: BIBS_Comparison_BRD-06_BDOI_FRS_vs_BIBS_FRS_Renewal_v1.0.xlsx
  ours_version: "2.0"
  ours_date: 8-Oct-2026
  bdoi_version: "1.0"
  bdoi_date: 11-Jun-2026

purpose:
  bdoi: >-
    BDOI's FRS is the BDO ITG Functional Requirements Specifications of project PRJ0012475 "BDO Insurance Brokering
    System - Renewal" (v1.0, 11-Jun-2026, prepared by Angela V. Ramirez, System Analyst). It states, in the ITG
    template, how the 42 BRRN requirements of the Renewal addenda are met by 44 functional requirement items
    (FRRN.001-044, 143 numbered items) and 26 annexes of rules, layouts and templates, for review by the Tech Lead and
    the Application Owner and approval by the Project Owner and Sponsor.
  ours: >-
    The BIBS FRS of BRD-6 (v2.0, 8-Oct-2026, iorta TechNXT) is the business sign-off specification of the Renewal
    module of BIBS, re-based on the Renewal BRD pack of 8-Oct-2026 with the Walkthrough addendum. It turns every BRD
    requirement (42 BRRN IDs and 1,033 line IDs of the main BRD) into 58 functional requirements with flows, rules,
    messages, screens, notifications, audit and numbered acceptance criteria, and carries the screen specifications,
    walkthroughs, catalogues, traceability and test basis of the sign-off set.

recommendation:
  title: Use BDOI's FRS as the master document and insert the BIBS content into it
  text: >-
    Keep BDOI's ITG template, its section order and its FRRN numbering as the signed baseline, because BDO ITG owns
    the FRS and its sign-off route. Insert the BIBS detail into it: each BIBS functional requirement becomes numbered
    items of the matching FRRN entry in BDOI's "The system shall ..." style (rules, validations and messages, then the
    acceptance criteria as items FRRN.nnn.mm.ACn), the BIBS-only requirements become new FRRN entries 045 onwards, and
    the BIBS screen specifications, messages, notifications, walkthroughs, status model, configuration items, report
    specifications and the line-ID traceability become new annexes after Annex Z (Annex AA onwards, because BDOI's
    letters A to Z are already used). Every FRRN entry carries a "Related BIBS FR" cross-reference (FR-RN-nnn), so
    the BIBS test plan and screens stay traceable. Before the merge, BDOI decides the conflicts of sheet 8 in one
    workshop; the merged FRS then states one rule per point.
  alternatives:
    - name: "B. BIBS FRS as the master, re-laid in BDOI's ITG template"
      tradeoff: >-
        Fastest for the project team (our structure and IDs stay; BDOI's FRRN become a cross-reference column), and
        the 1,033 line IDs stay traced. But BDO ITG loses its numbering and wording, must re-review a 69,000-word
        document, and the BDOI annexes (rules, layouts, approved templates) have to be re-homed.
    - name: "C. Two documents: BDOI's FRS signed as the baseline, the BIBS FRS kept as the supporting
        specification"
      tradeoff: >-
        Least effort now, and each team keeps its document. But there are two sources of truth: the 28 conflicts stay
        open in two places, every later change is made twice, and UAT is tested against the BIBS acceptance criteria
        that the signed FRS does not contain.
    - name: "D. A new joint document with new numbering"
      tradeoff: >-
        Cleanest result, with one numbering for BRD, FRS and tests. But it has the highest effort (both documents and
        the test plan are renumbered) and BDO ITG has to re-baseline a document it has already issued.

# Sheet 2: section by section
structure:
  - bdoi: Cover, Table of Contents, Document Revision Log
    ours: Cover, document control (versions 0.9 to 2.0), distribution list
    bdoi_has: ITG cover with project PRJ0012475, revision log (one row, v1.0 of June 11, 2026)
    ours_has: Version history with author, reviewer, approver and change; distribution with role and purpose
    depth: Both short
    assessment: Equivalent. Keep BDOI's cover and log; add the BIBS version history as rows of the log.
  - bdoi: "Introduction: Document Purpose, Project Overview, Document Preparation, Review and Approval"
    ours: "1 Introduction (purpose, scope with out-of-scope items, references R0 to R9, definitions of 35 terms, how to
      read the FRs); 2 Business context and process overview"
    bdoi_has: Purpose of an FRS, a three-paragraph overview of the module, who prepares and approves
    ours_has: Scope table by area, out-of-scope list (BDOIsys, EBIX, QPS references; EB renewals; package renewal),
      BRD pack references with page rule and order of precedence, glossary, before/after process, 14 process steps,
      dispositions and their paths
    depth: BDOI brief; ours detailed
    assessment: Ours adds the scope boundaries, the order of precedence of the addenda and the glossary that BDOI's
      FRS lacks. Insert them in BDOI's Introduction.
  - bdoi: Business Requirements Mapping
    ours: 11 Traceability (BRRN IDs; 1,033 main BRD line IDs; out-of-scope IDs), each with screens and test cases
    bdoi_has: 42 rows BRRN.001-042 with the requirement text and FRRN IDs (two rows refer to the User Access Matrix
      only)
    ours_has: 42 BRRN rows and every line ID of the main BRD (RMEL Phase 2) with page, FR, screen and test cases
    depth: BDOI covers the addenda only; ours covers the addenda and the main BRD
    assessment: BDOI's mapping leaves the 1,033 line IDs of the main BRD untraced. Keep BDOI's table and add the
      line-ID trace as an annex.
  - bdoi: Functional Requirements (table of 44 FRRN entries with component, capability and numbered descriptions)
    ours: 4 Functional requirements (58 FRs in 13 groups)
    bdoi_has: 143 numbered items, each a list of "The system shall" statements, field lists, messages and file names
    ours_has: Per FR the BRD trace, actor, priority, screens, description, preconditions, main and alternate flows,
      business rules (configurable or fixed), validations and messages, fields, notifications, audit and numbered
      acceptance criteria
    depth: BDOI broader in placement, billing, e-policy, dashboards and maintenance; ours deeper per requirement
    assessment: Complementary. BDOI's breadth beyond Renewal (placement, booking, issuance, billing) is specified in
      BIBS by the New Business FRS; ours gives the testable detail BDOI's items lack (actors, flows, acceptance).
  - bdoi: Process Flow (one flowchart image)
    ours: 2.2 Process overview (figure by actor), 5 Workflow and status model (stages, transitions, checks and
      buckets, insurer batch and letter states, SLA), 12 Navigation (screen flow)
    bdoi_has: One end-to-end flowchart from Generate RMEL to Book account
    ours_has: Process figure by actor, two workflow figures, the stage and transition tables, the screen flow
    depth: BDOI one diagram; ours diagrams with state tables
    assessment: BDOI's flow differs from its own Annex C on paid-off and RMU loans (sheet 8). Keep BDOI's flow after
      the decision and add our status model as an annex.
  - bdoi: Signoff Sheet
    ours: 20 Sign-off and change control (what is signed, how the review is recorded, what signing freezes, change
      after sign-off, signatures), sign-off workbook (03)
    bdoi_has: Prepared by System Analyst; reviewed by Tech Lead and Application Owner; approved by Project Owner and
      Sponsor (BU signatories as applicable)
    ours_has: The BRD approvers by part (Who signs what), the review record and the change rule after sign-off
    depth: BDOI ITG roles only; ours business signatories
    assessment: Combine. BDOI's ITG roles and the business approvers of the Renewal BRD sign the same sheet.
  - bdoi: "Annex A - Renewal Fields (embedded PDF, 224 fields)"
    ours: 6.2 Expiring list columns, 13 Screen specifications (fields), New Business account fields
    bdoi_has: 224 fields by section and sub-section with line of business, applicability and data type
    ours_has: The listing columns of the BRD and the fields per screen
    depth: BDOI one field catalogue; ours fields per screen
    assessment: Keep Annex A as the field catalogue; link each screen field of ours to it.
  - bdoi: "Annexes B to H - duplicate criteria, sanitation rules, CBG Motor field updates, assignment logic, LAMD and
      insurer disposition layouts"
    ours: 5.3 Checks, buckets and decision matrix; FR-RN-020 to 028; 18 Upload screens
    bdoi_has: Rule tables per market segment and line, upload layouts with data types
    ours_has: Named checks with severities, bucket rule sets, decision matrix, upload layouts of the BIBS uploads
    depth: BDOI more specific for CBG Motor; ours more general and configurable
    assessment: BDOI's rule tables are the business content our default rule sets need. Several rules conflict
      (sheet 8).
  - bdoi: "Annexes I to Z - proposal, quotation request, letter, billing, placement, return, advice, e-policy, invoice
      and hold cover templates and the letter eligibility matrix"
    ours: 6.6 Documents, 17 Document outputs (5 documents), FR-RN-080 to 087
    bdoi_has: Approved templates for the Renewal Advice (4 lines, 3 e-mails), Insurance Advice (4), e-policy e-mails
      (3), billing e-mail, placement file fields, return reasons, the letter matrix; 9 annexes have a heading only
    ours_has: Field lists and sources of the RA, closing letters, insurer extract, list download and account details
      (wording to confirm, RQ26)
    depth: BDOI has the approved wording; ours has the data sources
    assessment: Adopt BDOI's approved templates in place of our draft wording; BDOI still owes the 9 empty annexes.
  - bdoi: "-"
    ours: 3 Personas and roles (personas, 22 permissions, role-to-permission matrix)
    bdoi_has: Refers to the User Access Matrix
    ours_has: Ten personas, permissions with the BRD functions they carry, the matrix and the data scope
    depth: Ours only
    assessment: Add as an annex "Roles and access" or point to the User Access Maintenance FRS.
  - bdoi: "-"
    ours: 7 Interfaces, 8 Non-functional requirements, 9 Configuration items, 10 Assumptions, dependencies and open
      questions
    bdoi_has: Not in the ITG template
    ours_has: 15 interfaces with scope, 10 NFR topics of BRD p.212-214, parameters, lists of values, masters, open
      questions
    depth: Ours only
    assessment: Add as annexes; the open questions move to the decision log after the workshop.
  - bdoi: "-"
    ours: 12 Navigation, 13 Screen specifications (20 screens), 14 Walkthroughs (5), 15 Messages, 16 Notifications
      (19), 17 Document outputs, 18 Upload screens, 19 Cross-BRD contract
    bdoi_has: Messages are quoted inside the FR items; no screen specification
    ours_has: The business view of every screen with screenshots, the persona journeys and the catalogues
    depth: Ours only
    assessment: Add as annexes after Z.
  - bdoi: "-"
    ours: 21 Proposed business rules and clarifications (40); appendices User-story view (89 stories), Storyboard index
      (25 frames), Screen standards
    bdoi_has: Not in the ITG template
    ours_has: The points needing BDOI's confirmation; the story view for the backlog; the storyboard
    depth: Ours only
    assessment: The clarifications become BDOI's decision log; the story view and storyboard stay supporting
      documents.

# Sheet 3: pros and cons
pros_cons:
  - [BDOI, Completeness, Pro, "Covers the whole renewal chain to booking in one document: dashboards, placement, billing, e-policy, Insurance Advice, service invoice, hold cover and its extensions, risk code, RMU and budget maintenance."]
  - [BDOI, Completeness, Con, "Nine annexes are a heading only (I, J, N to R, T, Z) and the CBG Home sanitation rules are empty; FRRN.009 ends with an empty list for CBG Home and Non-CBG; FRRN.044 refers to report specifications \"in the Annex\" that the document does not contain."]
  - [Ours, Completeness, Pro, "Every BRD requirement is specified: 42 BRRN IDs and every one of the 1,033 line IDs of the main BRD, with the out-of-scope IDs named."]
  - [Ours, Completeness, Con, "Placement, CLPC billing, e-policy, Insurance Advice and booking are referred to the New Business FRS, so a reader of the Renewal FRS alone does not see them; no CBG Motor field update, no auto-assignment, no budget or RMU maintenance."]
  - [BDOI, Traceability, Pro, "A compact mapping table from each BRRN to the FRRN items."]
  - [BDOI, Traceability, Con, "Only the 42 BRRN IDs are mapped; the main BRD is not; two IDs point to the User Access Matrix only (BRRN.024, 026); two references are mistyped (\"RRN.040\", \"FRRN.08\"); item numbers repeat or skip (two FRRN.004.06, two FRRN.038.03, FRRN.012.03/.04 inside FRRN.013, FRRN.015 starts at .03)."]
  - [Ours, Traceability, Pro, "Every FR cites the BRD IDs with their pages; every BRD ID leads to the FR, the screen and the test cases."]
  - [Ours, Traceability, Con, "The traceability summary table of chapter 11 repeats the Walkthrough row six times; the line-ID table is long (112 rows)."]
  - [BDOI, Testability and acceptance criteria, Con, "No acceptance criteria; the expected results must be derived from the \"shall\" statements, and several have no measurable value (\"appropriate error message\", \"configurable criteria\")."]
  - [Ours, Testability and acceptance criteria, Pro, "160 numbered acceptance criteria that are the basis of 236 test conditions and 406 test cases of the BRD-6 test plan."]
  - [BDOI, Screens and fields, Pro, "Named field lists everywhere: 224 renewal fields (Annex A), listing and drill-down columns, upload layouts (Annexes G, H, K, S, U), placement risk description syntax per line."]
  - [BDOI, Screens and fields, Con, "No screen layout or screen flow; fields are lists without mandatory flags (the \"Required?\" column of Annex A holds the applicability, not the mandatory flag)."]
  - [Ours, Screens and fields, Pro, "20 screen specifications with screenshots, the fields of each screen with type, mandatory flag, source and validation, and the navigation by persona."]
  - [Ours, Screens and fields, Con, "No single field catalogue like Annex A; the CBG Motor and line-specific fields are those of the New Business account."]
  - [BDOI, Rules and validations, Pro, "Concrete business rules from the business: CBG Motor sanitation matrix, depreciation and BI/PD tier rules, DST rounding, duplicate criteria per line, the letter eligibility matrix with schedules, hold cover durations, password convention."]
  - [BDOI, Rules and validations, Con, "Some rules contradict each other: the process flow sends paid-off and RMU loans to Not for Renewal while Annex C makes them Clean / For Renewal; Annex C rows 2 and 3 have the same criterion with two dispositions; FRRN.008 requires a single insurer for Clean while Annex C row 5 makes multi-insurer accounts Clean."]
  - [Ours, Rules and validations, Pro, "Every rule is marked configurable or fixed with its parameter or list; named checks with severities, versioned bucket rules and decision matrix with maker-checker."]
  - [Ours, Rules and validations, Con, "Many defaults are placeholders awaiting BDOI (lead days, notice days, NRNS checkpoint, matrix content), while BDOI's FRS already gives several of these values."]
  - [BDOI, Messages and notifications, Pro, "Exact message texts for uploads, saves, CCM sending and the inactivity dialog, ready for the screens."]
  - [BDOI, Messages and notifications, Con, "Notifications appear in a few items (transfer request, TSU request, MFT failure) without a catalogue of recipients, channels and texts."]
  - [Ours, Messages and notifications, Pro, "A messages catalogue (about 150 messages read from the platform, with where they appear and the user's fix) and 19 notifications with trigger, recipient, channel and template."]
  - [Ours, Messages and notifications, Con, "Many Renewal message codes are still \"To be confirmed\"; texts are the platform's wording, not BDOI's."]
  - [BDOI, Process flows, Pro, "One end-to-end flowchart that a business reader follows at a glance."]
  - [BDOI, Process flows, Con, "One flow only, without swimlanes, statuses or exception paths; it differs from Annex C on paid-off and RMU loans."]
  - [Ours, Process flows, Pro, "Process by actor, Marketing and Processing workflows, stage and transition tables, five end-to-end walkthroughs with screenshots."]
  - [BDOI, Approvals and maker-checker, Pro, "Approvals named where BDOI wants them: TL approval of TSU requests, Unit Head approval of Direct-to-Insurer payment, override approval for For Booking Only, second approval after client acceptance."]
  - [BDOI, Approvals and maker-checker, Con, "No maker-checker on rule and risk code changes; manual reclassification needs only a justification."]
  - [Ours, Approvals and maker-checker, Pro, "Maker-checker on bucket rules, decision matrix, non-renewable risk codes, package choices and go-live corrections; overrides need remarks and are logged."]
  - [Ours, Approvals and maker-checker, Con, "No approver step on overrides (TL override with remarks only) and no second approval after the client's acceptance."]
  - [BDOI, Reports, Pro, "A list of 24 named reports that BDOI needs, including LAMD reconciliation reports and the insurer scorecard; rich dashboard metrics (budget, pipeline, closing ratio, persistency)."]
  - [BDOI, Reports, Con, "No report layout, column list or filter is given for any of the 24 reports."]
  - [Ours, Reports, Pro, "The renewal status report with 37 or 40 columns and 34 summary counters, the listing with attention flags and seven operational reports, each with columns and filters."]
  - [Ours, Reports, Con, "No production dashboard (budget against actual, closing ratio, persistency, biggest open deals, product mix)."]
  - [BDOI, Non-functional, Con, "No non-functional section; only the inactivity timings and the \"no pagination\" rule appear."]
  - [Ours, Non-functional, Pro, "Users, volumes, response times, peaks, availability, retention, security and audit from BRD p.212-214 with the BIBS target."]
  - [BDOI, Sign-off readiness, Pro, "In BDO ITG's own template, owned by BDO ITG, with the ITG review and approval route; BDOI's business users know the RMEL vocabulary it uses."]
  - [BDOI, Sign-off readiness, Con, "Version 1.0 of 11-Jun-2026 predates the Renewal BRD pack of 8-Oct-2026; nine annexes are empty; open contradictions remain."]
  - [Ours, Sign-off readiness, Pro, "Issued for business sign-off with the Who-signs-what matrix of the BRD approval sheets, a sign-off workbook, a test plan and a UX screen deck in the same release set."]
  - [Ours, Sign-off readiness, Con, "Not in BDO ITG's template, and 40 proposed rules and clarifications still need BDOI's confirmation."]
  - [BDOI, Ease of maintenance, Pro, "Concise: about 27,700 words plus about 11,800 in embedded annexes; one table holds all FR items."]
  - [BDOI, Ease of maintenance, Con, "Embedded PDF and packages hide content from search and review; repeated and skipped item numbers make references fragile."]
  - [Ours, Ease of maintenance, Pro, "Generated from one source with the test plan, screens and catalogues, so the documents cannot drift."]
  - [Ours, Ease of maintenance, Con, "Long: about 69,000 words and 78 figures; some codes of the configuration (parameter and list names) appear in the business text."]
  - [BDOI, Alignment with the BRD of 8-Oct-2026, Pro, "Carries the Walkthrough addendum items that BDOI knew in June: hold cover (BRRN.042), incentive (BRRN.041), TSI threshold to TSU."]
  - [BDOI, Alignment with the BRD of 8-Oct-2026, Con, "Departs from the BRD in places: automatic assignment and referral-style transfer instead of BRD 1.005-1.007; extraction only by user date range instead of BRRN.030 lead days; incentive \"upon booking\" instead of after full payment; no re-open of Not for Renewal (BRD 2.004.10); a Non-Renewable bucket instead of Exception (BRRN.023)."]
  - [Ours, Alignment with the BRD of 8-Oct-2026, Pro, "Re-based on the BRD pack of 8-Oct-2026, with the Walkthrough addendum applied and every difference from the BRD text listed for confirmation."]
  - [Ours, Alignment with the BRD of 8-Oct-2026, Con, "Where the BRD is silent, BDOI's FRS has the business answer that ours still lists as an open question (letter schedules, hold cover durations, password convention, return and non-renewal reasons)."]
  - [BDOI, Alignment with the platform, Con, "Assumes CCM for every client and insurer communication and MFT for insurer files, which the BIBS platform does not provide; adds placement, billing and e-policy automation beyond the platform."]
  - [Ours, Alignment with the platform, Pro, "Describes what the BIBS screens and rules do, with screenshots of the platform."]
  - [Ours, Alignment with the platform, Con, "Takes the platform as given where BDOI wants more (automatic assignment, hold cover automation, CBG Motor field updates)."]

