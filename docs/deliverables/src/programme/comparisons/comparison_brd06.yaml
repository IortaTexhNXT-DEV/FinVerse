# Sheet 8: conflicts
conflicts:
  - topic: Third bucket and missing data
    kind: Rule
    bdoi: "FRRN.008.01: \"Clean ... Review ... Non-Renewable\"; FRRN.007.02: missing mandatory fields \"flag as Review Record\"."
    ours: "FR-RN-022: buckets Clean, Review and Exception; missing mandatory data is a sanitation failure (Exception)."
    brd: "BRRN.023: \"Clean, Review, Exception\"; the Walkthrough annex rules R23 (p.21) make missing mandatory data a sanitation failure."
    platform: Clean, Review, Exception
    matches: Ours (BRD and platform)
    recommendation: Keep Clean / Review / Exception as the BRD says; show the Not for Renewal accounts as BDOI's "Non-Renewable" panel (a filter on the disposition).
  - topic: TSI above PHP 250M
    kind: Rule
    bdoi: "FRRN.007.02: above the threshold \"Clean Record with 'For Quotation' disposition\", routed to the TSU queue, \"Review\" once the quotation is available."
    ours: "FR-RN-020: above PHP 250M the candidate is Review and the decision matrix proposes For Proposal to TSU."
    brd: "Walkthrough SC-12, SC-13: above the threshold the renewal goes to TSU or proposal handling."
    platform: Review with a proposed disposition
    matches: Both partly
    recommendation: Keep the Review bucket (the TSU route is manual work) and use BDOI's disposition word once the For Quotation / For Proposal meaning is settled.
  - topic: Meaning of For Quotation and For Proposal
    kind: Naming and routing
    bdoi: "FRRN.017: Quick and Full Proposal only for \"For Proposal\"; FRRN.018: \"For Quotation\" goes to a TSU request (non-package quotation, Annex K)."
    ours: "Dispositions table: For Quotation - a package quotation; For Proposal - a non-package proposal request (TSU)."
    brd: "BRD 2.004.3 lists both dispositions without defining the route."
    platform: For Quotation to the package quotation, For Proposal to the proposal request
    matches: Not stated
    recommendation: Adopt BDOI's meaning (BDOI's process vocabulary) after Marketing confirms it; the platform change is the routing of the two values.
  - topic: Paid-off loans (Loan Fully Paid)
    kind: Rule
    bdoi: "Annex C CBG Motor: \"Loan Fully Paid ... Renew As Is ... Clean / For renewal\" (account type becomes CLG Auto Open Market, Annex D); Process Flow: Paid goes to \"Not For Renewal\" and \"Flag as Exception\"."
    ours: "FR-RN-025: a paid-off loan tags the account Not for Renewal with reason \"Loan fully paid\"."
    brd: "BRRN.029: match paid-off loans \"to determine renewal eligibility and proper routing\"."
    platform: Not for Renewal, reason Loan fully paid
    matches: Ours and BDOI's flow; not BDOI's Annex C
    recommendation: Ask BDOI which of its two rules applies; we recommend Annex C (renew in the open market) as the detailed rule, with the change of account type.
  - topic: RMU loans
    kind: Rule
    bdoi: "Annex C: RMU with Renew As Is is \"Clean / For renewal\"; Process Flow: RMU goes to \"Not For Renewal\"; RMU is derived from the AO code in the RMU list (FRRN.041)."
    ours: "FR-RN-025: RMU tags Not for Renewal with reason RMU, or transfers to the Corporate RMU unit; RMU comes from the LAMD report."
    brd: "BRRN.029, BRD 2.004.4.1 (reason RMU)."
    platform: Not for Renewal or transfer; RMU from the report
    matches: Ours and BDOI's flow; not BDOI's Annex C
    recommendation: Ask BDOI; take RMU from the AO code list if LAMD sends the full loan list (FRRN.012).
  - topic: Assignment of accounts
    kind: Rule
    bdoi: "FRRN.010.01: \"automatic assignment ... based on teams and sub teams\", round robin, for Marketing and Processing."
    ours: "FR-RN-030, 061: the TL assigns and re-assigns; CBG accounts are not assigned."
    brd: "BRD 1.005, 3.005: the TL assigns accounts to the AO or Processing Officer."
    platform: Manual assignment
    matches: Ours (BRD and platform)
    recommendation: Keep the TL assignment of the BRD and add automatic assignment as an option per segment (platform change), if BDOI confirms.
  - topic: Transfer to another unit
    kind: Rule
    bdoi: "FRRN.011: \"the original renewal account shall remain under the ownership of the current Marketing Unit\"; the receiving unit creates a New Business account."
    ours: "FR-RN-031, 032: the renewal moves to the receiving unit when it accepts."
    brd: "BRD 1.006, 1.007, 2.005: transfer the account to another unit; the receiving unit accepts or declines."
    platform: Ownership transfer
    matches: Ours (BRD and platform)
    recommendation: Keep the BRD transfer; add BDOI's referral as a second action (New Business opportunity) if BDOI wants both.
  - topic: Extraction trigger
    kind: Schedule
    bdoi: "Mapping of BRRN.030: \"User will select date range to generate RMEL\"."
    ours: "FR-RN-010, 011: a daily run extracts at 140 lead days (configurable); users also generate any range."
    brd: "BRRN.030: \"automatically extract renewal candidates ... using configurable lead days (e.g., -140 days)\"."
    platform: Daily run and on-demand range
    matches: Ours (BRD and platform)
    recommendation: Keep both triggers; BDOI confirms the lead days per segment.
  - topic: When the renewal account is created
    kind: Status
    bdoi: "FRRN.004.04: generation creates a renewal account per listed account with \"For Disposition\" and \"In Process Renewal\"."
    ours: "FR-RN-010, 015, 063: extraction creates a renewal record; nothing starts until initiation; the renewal account is created when processing starts."
    brd: "BRRN.021: renewal processing starts \"only upon explicit user initiation\"."
    platform: Renewal record first, account at processing
    matches: Ours (BRD and platform)
    recommendation: Keep ours; use BDOI's status names on the renewal record (In Process Renewal for an initiated renewal).
  - topic: Insurer disposition values
    kind: Rule
    bdoi: "FRRN.013.02: nine values (Renew As Is / Approved, Rejected, Total Loss, Renew with surcharge, Renew under another package, three non-renewal causes, Apply minimum premium); Rejected goes to Review / For Disposition."
    ours: "FR-RN-071: Renew As Is, Revise, Reject; Reject tags Not for Renewal (insurer declined) or returns to Marketing."
    brd: "BRRN.035: insurer responses Approve / Renew As-Is, Reject and Revise."
    platform: Three responses
    matches: Ours (BRD wording); BDOI more detailed
    recommendation: Adopt BDOI's nine values as a list mapped to the three BRD outcomes, with BDOI's bucket and disposition per value (platform change).
  - topic: Lock of the account
    kind: Status
    bdoi: "FRRN.014.02: lock \"when already posted and placement has been completed\"; FRRN.022.01: RA generation disabled for locked accounts."
    ours: "FR-RN-080: RA generation locks the account on the Marketing side; an RA cancellation unlocks it."
    brd: "BRD 2.004.9: the account is locked once the RA is generated."
    platform: Lock at RA generation
    matches: Ours (BRD and platform)
    recommendation: Keep the RA lock of the BRD and add BDOI's lock after placement (edits after placement are already refused by the account).
  - topic: Hold cover duration and trigger
    kind: Rule
    bdoi: "FRRN.036: default 30 days Non-CBG, 90 days CBG; transferred 30 (CBG Home) or 60 (CBG Motor); automatic request after RA acceptance (Non-CBG) and at 75 days before expiry (CBG Clean); extensions."
    ours: "FR-RN-086: the user requests 30 or 60 days (default 30) when the renewal will not complete in time."
    brd: "BRRN.042: \"send request for Hold Cover to insurer/s and ... record the Hold Cover confirmation\"."
    platform: User request, 30 or 60 days
    matches: Both meet the BRD; BDOI more specific
    recommendation: Adopt BDOI's durations as parameters now; automatic requests and extensions are a platform change for BDOI to prioritise.
  - topic: Renewal Advice notices
    kind: Schedule
    bdoi: "Annex M: first notice 75 days and last notice 45 days before expiry, automatic; FRRN.022.01: the system determines First or Second Notice; templates print \"FINAL NOTICE\"."
    ours: "FR-RN-080: the user chooses First or Second Notice; second notice after 15 days without acceptance; warning below 30 days."
    brd: "BRRN.010: \"Identify if RA is for first or second notice\"."
    platform: User choice; second-notice days parameter
    matches: Both meet the BRD
    recommendation: Adopt BDOI's 75 / 45 days and the automatic determination; name the notices First and Final as in the approved templates.
  - topic: NRNS reminder
    kind: Schedule
    bdoi: "Annex M: NRNS Reminder for CBG Motor with an active loan and no policy in BDOI, 75 days before expiry."
    ours: "FR-RN-083: accounts not yet submitted at the checkpoint, 90 days before expiry by default, all segments."
    brd: "BRRN.025: \"at the defined follow-up checkpoint (e.g., +90 days)\"; BRRN.037."
    platform: 90-day parameter
    matches: Both (example value)
    recommendation: Adopt BDOI's definition and 75 days (parameter value).
  - topic: NAL and Non-Renewal Letter
    kind: Rule and schedule
    bdoi: "Annex M: NAL 1 day after expiry when an RA was issued and not answered; NRL 1 day (CBG Motor) or 3 days (Non-CBG) after expiry, the Non-CBG NRL after an NAL was sent."
    ours: "FR-RN-082: at the effective expiry date (hold cover end), NAL when an RA was sent, NRL when none; the two exclude each other."
    brd: "Walkthrough R37-HC-05 to 10: no letter before the effective expiry date; NAL and NRL are mutually exclusive."
    platform: Mutually exclusive, effective expiry date
    matches: Ours (BRD)
    recommendation: Keep the mutual exclusion and the effective expiry date of the BRD; adopt BDOI's day offsets (1 and 3 days) as parameters.
  - topic: Password of protected files
    kind: Rule
    bdoi: "FRRN.024.01: individuals - first three letters of first and last name in capitals; corporate - one lower case, one upper case, one special character and five digits; approved e-mail templates BDOI-009 to 011 explain it to clients."
    ours: "FR-RN-081: password convention per Q07; until then a generated password per e-mail."
    brd: "BRRN.010: send RA \"with encryption and password protection\"."
    platform: Random 12-character password in a separate e-mail
    matches: Both meet the BRD; BDOI's is the approved convention
    recommendation: Adopt BDOI's convention (answers Q07); platform change of the password rule.
  - topic: Delivery channel to clients and insurers
    kind: Integration
    bdoi: "CCM for proposals, RA, letters, Insurance Advice, e-policies and placement files; MFT for placement, hold cover and e-policy files."
    ours: "Outgoing e-mail, protected, with a send log; no file-transfer channel with insurers (on hold)."
    brd: "The BRD asks for sending; it does not name CCM or MFT."
    platform: Outgoing e-mail; CCM listed as an option in the integration inventory (IQ11)
    matches: Neither stated in the BRD
    recommendation: BDO ITG decides whether CCM and MFT are in scope for go-live; BIBS keeps e-mail as the fallback channel.
  - topic: Incentive timing
    kind: Rule
    bdoi: "FRRN.034.01: \"Upon booking, the system shall evaluate whether the renewal account is eligible\"."
    ours: "FR-RN-087: after booking, confirmed acceptance and full payment."
    brd: "BRRN.041: \"after successful placement, booking, and full payment confirmation\"."
    platform: After booking and full payment
    matches: Ours (BRD and platform)
    recommendation: Keep ours; align BDOI's wording with BRRN.041.
  - topic: Session timeout
    kind: Rule
    bdoi: "FRRN.001.04: notify \"30 minutes after inactivity that the session automatically ended\"."
    ours: "FR-RN-001: warning 30 minutes before the system-triggered log-out."
    brd: "BRD x.001: warning after 15 minutes of inactivity and 30 minutes before the system-triggered log-out."
    platform: Idle warning and log-out timings by parameter
    matches: Ours (BRD wording)
    recommendation: Ask BDOI which timing it means; both are parameter values.
  - topic: Booking on the insurer's approval
    kind: Status
    bdoi: "FRRN.030.01.01: on \"Approved\" the system shall \"Update the status to 'Booked'\" and lock the account."
    ours: "FR-RN-084: placement and booking stay user actions."
    brd: "Walkthrough addendum p.4: client confirmation, placement and booking stay under manual control."
    platform: Booking is a user action (automatic booking rules exist in New Business)
    matches: Ours (BRD)
    recommendation: Keep the booking a user action as the Walkthrough addendum says, unless BDOI changes it.
  - topic: Endorsements at sanitation
    kind: Rule
    bdoi: "FRRN.007.02: \"Records with endorsements shall be routed to the Review bucket\"."
    ours: "FR-RN-027: posted endorsements are taken into the renewal; an endorsement in progress blocks post, RA and acceptance."
    brd: "BRRN.032: endorsements must be reflected on the mother policy before renewal approval."
    platform: Pending endorsement blocks
    matches: Both meet the BRD
    recommendation: Keep ours and add BDOI's Review routing for endorsements of the term if Marketing wants to see them.
  - topic: Dispositions and non-renewal reasons
    kind: Naming
    bdoi: "FRRN.014.02: four dispositions and 21 non-renewal reasons; FRRN.019.01: \"Lost Business\" is a reason."
    ours: "FR-RN-043: five dispositions (with Lost Business) and ten reasons."
    brd: "BRD 2.004.3 (dispositions) and 2.004.4.1-10 (ten reasons)."
    platform: Five dispositions; eleven reasons (list values)
    matches: Ours (BRD); BDOI's reasons extend the list
    recommendation: Keep the five dispositions of the BRD and add BDOI's eleven extra reasons as list values.
  - topic: Second approval after acceptance
    kind: Approval
    bdoi: "FRRN.025, 026: accepted accounts go to \"Submitted for Approval\" and are approved again before placement."
    ours: "FR-RN-084: the accepted account moves to placement and booking without resubmission."
    brd: "BRRN.040: proceed to placement and booking \"without delay, duplicate handling, or manual re initiation\"."
    platform: No second approval
    matches: Ours (BRD)
    recommendation: Ask BDOI; a second approval is a platform change and slows BRRN.040.
  - topic: Clean accounts and posting
    kind: Status
    bdoi: "FRRN.008.01: Clean accounts get \"For Renewal\" and status \"For RA Generation\" (CBG) or \"Posted\" (Non-CBG)."
    ours: "FR-RN-023: the decision matrix gives a system disposition to Clean accounts whose rule is automatic; others are proposed to the AO; the TL posts."
    brd: "BRRN.031, 034: rule-based disposition and a matrix of automated versus manual scenarios."
    platform: Matrix proposal or automatic disposition
    matches: Both meet the BRD
    recommendation: Keep the matrix and load BDOI's rule (Clean is automatic For Renewal) as its first content.
  - topic: Status names
    kind: Naming
    bdoi: "In Process Renewal, Submitted for Posting, Posted, Submitted for Approval, Submitted for Placement, For Booking, Booked, Returned - Renewal, Rejected Placement, For Billing Generation, For E-Policy Sending."
    ours: "Extracted, Evaluating, Unassigned Disposition, For Disposition, Review in Progress, For Processing, With Insurer, RA Ready, RA Sent, Accepted, For Placement and Booking, Renewed, Closed."
    brd: "The main BRD uses Review in progress, Returned and the RA statuses."
    platform: The BIBS stages
    matches: Ours (main BRD terms)
    recommendation: Map the two lists one to one in the status model annex and use BDOI's names where the BRD is silent.
  - topic: Name of the expiring list and letters
    kind: Naming
    bdoi: "RMEL (Renewal Master Expiry List); NRL (Non-Renewal Letter)."
    ours: "Expiry List; Not for Renewal Letter (NFR)."
    brd: "RMEL in the BRD title; NFR in BRRN.009, NRL in the Walkthrough addendum."
    platform: Expiry List; NAL / NFR
    matches: Both used in the BRD
    recommendation: Use BDOI's names RMEL and NRL in the merged FRS and on the screens.
  - topic: Reason of a non-renewable risk code
    kind: Naming
    bdoi: "FRRN.007.02: \"Non-Renewable Account\"; FRRN.038.03: \"Non-Renewable Risk Code\"."
    ours: "FR-RN-024: \"Non-renewable Accounts\"."
    brd: "BRD 2.004.4.9: Non-renewable Accounts."
    platform: Non-renewable Accounts
    matches: Ours (BRD)
    recommendation: Keep the BRD label and correct BDOI's two variants.
  - topic: Automatic placement status for paid CBG renewals
    kind: Status
    bdoi: "FRRN.028.02: a paid CBG renewal automatically becomes \"Submitted for Placement\"; FRRN.026.01 for CBG Motor."
    ours: "FR-RN-084: the accepted renewal moves to placement and booking when the payment rules are met; automatic placement is off for renewals."
    brd: "BRRN.040 (automatic progression) and the Walkthrough addendum p.4 (manual placement)."
    platform: Fast track to placement; placement by the user
    matches: Both
    recommendation: Adopt BDOI's automatic status change; the placement itself stays a user action.

