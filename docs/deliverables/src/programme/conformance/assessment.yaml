  FR-CR-020: [NotificationEventWordingIT, MessagingIT]
  FR-CR-030: [AuditTrailImmutabilityIT, SessionLogIT]
  FR-CR-040: [ReportRenderingIT, ReportArchiveIT, ExportOptionsTest]
  FR-CR-041: [NbReportApiIT, ConfigCatalogueSchemaIT]
  FR-CR-050: [DocTemplateServiceIT, DocumentWordIT]
  FR-CR-060: [LovServiceIT]
  FR-CR-061: [CatalogIT]
  FR-CR-070: [UserAdminApiIT, LoginProtectionTest, SignInTokensIT]
  FR-CR-071: [DocumentProtectorTest]
  FR-CR-080: [WorkflowServiceIT]
  FR-CR-081: [ServiceInvoiceIT]
  FR-CR-083: [BulkServiceIT, BulkExtensionsIT, AdvisoryJobLockIT]
