# Review of the end-to-end conformance run (read by build_conformance.py): the decisions on requirements that the
# evidence alone cannot give, notes on walkthrough steps checked by hand, the cycle steps of each requirement, the
# fixes made during the run, the open gaps with their proposals and the corrections of the FRS texts.
version: "1.0"
date: 09 October 2026
scope: >-
  Run on a fresh SIT/UAT environment (seed data of the release) on 09-Oct-2026: the 367 steps of the UAT walkthrough
  script, the walkthroughs of the sign-off packs performed live by their personas, one client taken through the whole
  broking cycle, the sidebar of every persona of the FRS persona tables, and the automated checks of the release
  mapped to the 744 requirements and 1,772 acceptance criteria of the FRSs.

