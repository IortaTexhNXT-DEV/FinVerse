# Steps of the broking cycle not run on the account of the scenario, with how they are covered.
cycle_notes:
  - step: C15
    area: Renewal
    action: Renewal of the policy of the scenario
    observed: >-
      Not run on the account of the scenario: its policy expires in one year and enters the expiry list 120 days
      before. Renewal is shown on the expiring accounts of the SIT/UAT data by the BRD-6 walkthroughs (see
      Walkthrough results, BRD-06).
    result: Blocked
  - step: C16
    area: Employee Benefits
    action: Employee benefits programme of a corporate client
    observed: >-
      Employee Benefits runs on its own programmes, not on a retail policy; it is shown on the programmes of the
      SIT/UAT data by the BRD-8 steps of the walkthrough script (see Walkthrough results, BRD-08).
    result: Blocked

