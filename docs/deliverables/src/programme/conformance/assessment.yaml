# Walkthrough steps checked by hand after the run: "BRD step" -> result, observed, evidence.
step_notes: {}

fixes:
  - id: F01
    brd: BRD-00
    area: Configuration promotion
    found: >-
      The standard report variants (the saved report settings offered to every user) did not move with the
      configuration from one environment to the next; only users' own variants should stay behind.
    fix: >-
      The standard variants are now part of the configuration promoted from SIT to UAT and production, with the
      same comparison and approval as the other configuration; users' own variants stay in their environment.
    check: Automated check that the standard variants move with the configuration and the users' variants stay behind
  - id: F02
    brd: BRD-05
    area: Tax set-up
    found: Party tax profiles (TX-01) and tax forms (TX-02) could only be entered one by one on their screens.
    fix: >-
      Upload of both from the screen: template with the layout of the BDOI input tabs, preview with the rules of the
      screen, approval by a second user, and export of the current values.
    check: Automated checks of the uploads of the configuration screens
  - id: F03
    brd: BRD-05
    area: Currencies and exchange rates
    found: Currencies (MD-02) and exchange rates (MD-03) could only be entered one by one.
    fix: >-
      Upload of both from the Currency Rates screen with the same template, preview, approval and export; the base
      currency and a currency of an active bank account cannot be deactivated; the export of rates covers the last
      90 days.
    check: Automated checks of the uploads of the configuration screens
  - id: F04
    brd: BRD-00
    area: SIT/UAT data
    found: 64 standard reports returned no row on a fresh SIT/UAT environment, so UAT could not check them.
    fix: >-
      SIT/UAT data added in line with the seed story (Cebu branch receipts, cancellations, minimal balances,
      disbursements and end-of-day runs, remittance batches, commission certificates, employee benefits invoices,
      submitted policies, screening cases, LAMD results, migration batches, headcount, payment requests, PDCs,
      completed collections, a claims follow-up due today, the GL to sub-ledger reconciliation of the day): 50 of
      the 64 reports now return rows; the other 14 are listed as gap G03.
    check: Each of the 64 reports run on a fresh SIT/UAT environment

  - id: F05
    brd: BRD-03
    area: Product lines and accounting
    found: >-
      A product line added in the catalog had no business line for the accounting entries, so a payment applied
      to an account of the line was refused (seen on the Employee Benefits lines HMO, GLI and GPA).
    fix: >-
      A new product line gets its business line in every company when it is created; the business lines of the
      Employee Benefits lines are added to the SIT/UAT data.
    check: Automated check that a new product line has its business line for the accounting entries
  - id: F06
    brd: BRD-00
    area: SIT/UAT data
    found: >-
      Records added to the SIT/UAT data for the reports took numbers that the platform would also issue later
      (for example DV-2026-000901), the Employee Benefits accounts had no sales unit and an opening-balance
      adjustment of FY2027 was recorded before the cut-off.
    fix: >-
      The records are numbered in the block kept for the SIT/UAT data of each series (900901 and up), the
      Employee Benefits accounts belong to their corporate sales unit, and the adjustment is removed (the
      reconciliation of the trial load stays).
    check: The automated checks of the SIT/UAT data and of the numbering of booked invoices

gaps:
  - id: G01
    brd: BRD-09
    frs: [FR-CSF-050, FR-CSF-051, FR-CSF-052, FR-CSF-053, FR-CSF-054, FR-CSF-055, FR-CSF-056, FR-CSF-057, FR-CSF-058,
          FR-CSF-059, FR-CSF-060, FR-CSF-061]
    gap: Case management of the Customer Service Facility is not on the platform yet (logging, categories and turnaround, statuses,
      notes, documents, routing to the fulfilment units, ageing and SLA, follow-up cases, dashboard).
    impact: Storyboard P2 of BRD-9 (12 steps of the walkthrough script) cannot be run; customer requests are tracked
      outside BIBS.
    proposal: >-
      Add the case module on the existing workflow, documents and notification services: case types with their
      turnaround times and routing table (lists of values), the case record with notes, documents and history, the
      team and fulfilment unit queues with reassign, escalate, resolve and return, SLA ageing with reminders, linked
      follow-up cases, the case dashboard and the case reports; log a case from the Servicing View.
    size: Large
    status: Closed
    closed: >-
      Delivered in the release of 17-Oct-2026: Log Case on the Servicing View and on the Cases list (caller who is not a
      client), with the Case ID, the due date from the turnaround time of the case type in working days and the
      duplicate rule; routing to the fulfilment unit proposed by the routing table; the queues My Cases, Returned to
      Me, CSR Action Required, Team Queue, Fulfilment Unit Queue, All Open and Closed; Resolve and Close, Return to
      Agent, Request CSR Action, Re-endorse and Close by the agent; Reassign, Escalate and Change Category by the
      supervisor; append-only notes, documents linked to the case and the client, linked follow-up cases and the case
      history on the audit trail; the CSF_CASE_SLA check every 15 minutes with the approaching-breach and breach
      notices and automatic escalation; the Case Dashboard and the reports Case Register, Case Ageing and SLA and Case
      Summary; Case Routing (turnaround times, routing table, fulfilment unit members) on Broking Setup. The automated
      checks of case management pass and steps P2.1 to P2.12 of the walkthrough script pass on a fresh SIT/UAT
      environment. Open: the complete lists of values of the addendum (natures of transaction, product types, market
      segments, fulfilment units) to be loaded from the list of Contact Center Management (CSQ19); the copy of the
      routing notice to the account officer of the account.
  - id: G02
    brd: BRD-08
    frs: [FR-EB-010, FR-EB-011, FR-EB-012, FR-EB-013, FR-EB-014, FR-EB-015, FR-EB-045, FR-EB-056]
    result: Not testable yet
    gap: The insurer and client HR portal is outside Drop 2 (Employee Benefits without the portal feature).
    impact: Insurers and client HR send proposals, confirmations, member changes and billing by e-mail; the EB officer
      records them in BIBS. Steps P1.2 to P1.4, P3.1 and P3.3 of the walkthrough script are blocked.
    proposal: >-
      Deliver the portal in the drop agreed with BDOI: external users provisioned through User Access requests,
      the task inbox and structured proposal form for insurers, the client HR pages, and the staging and review of
      portal uploads; until then the officer keys in what is received by e-mail.
    size: Large
  - id: G03
    brd: BRD-00
    frs_text: "Reports BCL-OUTSTANDING-PAST-DUE, EB-PLACEMENT, RNW-RA-DISPATCH, ADJ-VALIDATION-LIST, ADJ-MINBAL-FILE,
      FIN-AR-SOO-FC, FIN-BRS-PAYNOTIFY, FIN-GL-ALLOCJV, PRC-LEGACY-CHANGES, TAX-MAP, TAX-QAP, TAX-SLS,
      MIG-TRUEUP-REGISTER, MIG-TRUEUP-RECON"
    gap: 14 standard reports still return no row on a fresh SIT/UAT environment until the walkthroughs have created
      their records.
    impact: UAT checks these reports after the walkthrough steps that create their records (or on a later day for the
      past-due claims), not on day one.
    proposal: >-
      Add the records through the business services of the SIT/UAT data loader (posted adjustments with an
      accounting entry, a minimal-balance invoice between PHP 10 and 100, foreign-currency receivables, bank
      payment notifications, allocation journals, legacy invoice changes, withholding and VAT postings for the
      tax returns, renewal advices dispatched, an EB placement with its confirmation, and a claim reported 90 days
      before the seed date); the two reports of the opening-balance adjustments fill after the FY2027 cut-off.
    size: Medium
    status: Closed
    closed: >-
      Re-measured on the fresh SIT/UAT environment of 16-Oct-2026 through the report service with the standard
      variant: BCL-OUTSTANDING-PAST-DUE 1 row, EB-PLACEMENT 2, RNW-RA-DISPATCH 1, ADJ-VALIDATION-LIST 5, ADJ-MINBAL-FILE
      1, FIN-AR-SOO-FC 9, FIN-BRS-PAYNOTIFY 1, FIN-GL-ALLOCJV 1, PRC-LEGACY-CHANGES 5, TAX-MAP 1, TAX-QAP 1; the automated
      check of the standard reports on the SIT/UAT data passes. Exceptions, accepted: TAX-SLS (0 rows: the broker's sales are entered on the
      VAT return and not read from a source document, so the worksheet has no line to list) and MIG-TRUEUP-REGISTER and
      MIG-TRUEUP-RECON (0 rows: they fill only after the FY2027 cut-off of the opening-balance true-up).
  - id: G04
    brd: BRD-00
    frs: [FR-CR-043]
    gap: Reports cannot be scheduled or subscribed to; they are run on demand and saved in the report archive.
    impact: Recurring reports (daily, weekly, month-end) are run by hand by their users.
    proposal: >-
      Add Schedule on the report runner for a saved variant (daily, weekly on chosen days, monthly on a chosen day or
      the last working day, time in Philippine time, formats, BIBS users and allowed e-mail recipients) and My
      Subscriptions under Reports; a scheduled job runs the variant with the owner's access, stores the file in the
      report archive and e-mails it, password protected when the report is confidential.
    size: Medium
    status: Closed
    closed: >-
      Delivered in the release of 16-Oct-2026: Subscribe on the report screen (parameters of the screen, daily, weekly on a
      day or monthly on a day with the last day of a shorter month, file format, e-mail recipients) and My Report
      Subscriptions under Reports with the runs of each subscription and Stop. The REPORT_SUBSCRIPTIONS job runs the
      subscriptions due on the business date as their subscriber, checks the export permission and the data scope of
      the parameters at run time (a refused run is recorded as denied), archives the file in the report archive and
      e-mails it; one run per subscription and date. The automated checks of the
      subscriptions pass. Delivered in the release of 17-Oct-2026: the time of day of a run (the job checks every hour),
      the last working day of the month on the holiday calendar of the company of the report, and relative periods of
      the date parameters (previous day, month to date, previous month, quarter to date, previous quarter, year to
      date, previous year). Open: the password protection of confidential reports.
  - id: G05
    brd: BRD-00
    frs: [FR-CR-031]
    gap: There is no master data change log with the old and new value of each changed field; the audit trail
      records the action and the access change log covers users and roles only.
    impact: A reviewer cannot see field by field what changed on a product, insurer, commission rate, list of values,
      account of the chart, payee or parameter.
    proposal: >-
      Record each approved change of the registered master data field by field (old value, new value, maker,
      approver, time, approval reference) through the common maker-checker of the set-up screens, and add the
      Master Data Change Log screen under Setup & Administration with filters by data, record, user and date and an
      export.
    size: Medium
    status: Closed
    closed: >-
      Delivered in the release of 16-Oct-2026: every insert and update of a maker-checker master record (products, insurers
      and their branches, contacts, bank accounts and commission rates, rates, coverages, clauses, rules, lists of
      values, parties and the other authorizable masters) and of a client writes one row per changed field (field,
      old value, new value, maker, time) in the same transaction; the authorization adds the checker and its time.
      The history is shown in a Change History tab on the insurer, product and client records and read by the
      Auditor (AUDIT_VIEW, MASTER_VIEW). The automated checks of the change log pass. Delivered in the release of
      17-Oct-2026: the programme-wide Master Data Change Log screen under Administration with filters by record type,
      date range, maker and checker and the export to Excel, both limited to the records of the reader's data scope;
      the history of a record owned by a company outside the reader's data scope answers as not found.
  - id: G06
    brd: BRD-00
    frs: [FR-CR-042, FR-CR-062]
    gap: The report runner offers the choice and order of columns and the filters, but no grouping, subtotals or
      chart, and there is no catalogue of MIS fields.
    impact: Users regroup and chart report exports in Excel.
    proposal: >-
      Add the MIS Fields set-up screen (business label, data type, list of values per core entity, delivered with
      the fields of BR-173 and the MIS columns of the Report List) and a Layout panel on the report runner (one or two
      grouping fields, subtotals and counts, one bar or line chart) saved with the variant and applied to the screen,
      Excel and PDF.
    size: Large
  - id: G07
    brd: BRD-00
    frs: [FR-CR-010]
    result: Partly conformant
    gap: The role home pages and their widgets are in place, but the System Administrator cannot maintain the widgets
      of a role (Role Home Set-up).
    impact: A change of the widgets of a role needs a release.
    proposal: Add Role Home Set-up under Setup & Administration to choose and order the widgets of each role, with
      approval.
    size: Small
    status: Closed
    closed: >-
      Role Home Set-up under Setup & Administration: the System Administrator chooses and orders the widgets of each
      role with approval; the home page reads them. The automated checks of Role Home Set-up
      and of the home widgets pass.
  - id: G08
    brd: BRD-00
    frs: [FR-CR-061]
    result: Partly conformant
    gap: The insurer page shows the profile, the branches with their LGT rates and the commission rates; the
      contacts, the payment terms and remittance schedule per remittance type, the risk participation (CRQ08) and the
      read-only views of the products and packages and of the GL and sub-ledger accounts are not on it.
    impact: The insurer's contacts and payment terms are kept outside BIBS.
    proposal: Add the Contacts, Payment Terms and Remittance, Products and Packages and Accounts sections to the
      insurer page with the catalog maker-checker; add Risk Participation when BDOI confirms CRQ08.
    size: Medium
    status: Closed
    closed: >-
      Delivered in the release of 16-Oct-2026: the insurer page has the tabs Details, Contacts, Payment & Remittance (payment
