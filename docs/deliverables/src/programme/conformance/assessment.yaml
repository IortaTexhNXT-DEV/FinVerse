# Review of the end-to-end conformance run (read by build_conformance.py): the decisions on requirements that the
# evidence alone cannot give, notes on walkthrough steps checked by hand, the cycle steps of each requirement, the
# fixes made during the run, the open gaps with their proposals and the corrections of the FRS texts.
version: "1.7"
date: 17 October 2026
scope: >-
  Run on a fresh SIT/UAT environment (seed data of the release) on 09-Oct-2026: the 367 steps of the UAT walkthrough
  script, the walkthroughs of the sign-off packs performed live by their personas, one client taken through the whole
  broking cycle, the sidebar of every persona of the FRS persona tables, and the automated checks of the release
  mapped to the 744 requirements and 1,772 acceptance criteria of the FRSs. Version 1.1 (16-Oct-2026): the walkthrough
  script and the walkthroughs of the sign-off packs run again on a fresh SIT/UAT environment after the fixes since version 1.0
  (gaps G03, G07, G10, G12 and G13 closed); BRD-02, BRD-03, BRD-06 and BRD-11 measured against the requirements of
  their re-baselined BDOI-template FRS (v3.4, v1.4, v1.3 and v1.6; BRD-11 on the UIDM-ISC and Entra ID model), the
  other BRDs against their FRS as before. Version 1.2 (16-Oct-2026): the walkthroughs of BRD-01, BRD-04 and BRD-11 and
  journey step J1.1 run again on a fresh SIT/UAT environment with the updated recipes (KYC checklist, statement of
  account by the Operations billing user, BRD-11 walkthroughs and J1.1 rewritten on the UIDM-ISC and Entra ID model
  of FRS v1.6); gaps G14, G15 and G16 closed; the other results are carried over from version 1.1. Version 1.3
  (16-Oct-2026): gaps G04 (report scheduling and subscriptions), G05 (master data change log), G08 (full
  insurer page) and G09 (daily service-invoice batch per insurer) closed on the automated checks of the release; the
  walkthrough and persona results are carried over from version 1.2. Version 1.4 (17-Oct-2026): case management of
  the Customer Service Facility delivered (gap G01 closed); the 23 BRD-9 steps of the walkthrough script run again on
  a fresh SIT/UAT environment (P2.1 to P2.12 now pass); the remaining parts of G04, G05, G08 and G09 delivered (run
  time of day, last working day and relative periods of the report subscriptions; programme-wide Master Data Change
  Log with export and the data scope of the change history; the insurer's ledger accounts; supplementary batches,
  merged PDF and manifest of the service invoices); the other results are carried over from version 1.3. Version 1.5
  (17-Oct-2026): the walkthrough-script steps of BRD-00, BRD-08, BRD-12 and BRD-13 run again on a fresh SIT/UAT
  environment after the fixes of 17-Oct-2026: gap G11 closed (New Policy and Edit of Submitted Policies), gap G06 closed
  (Layout panel of the report runner and the MIS fields catalogue), recipes of BRD-00 J1.3, BRD-08 P1.3, P3.1, P3.3
  and BRD-13 FR-DM-125.1 and .2 corrected; the data scope of records addressed by id checked on every screen action; the
  case routing notice copied to the account officer (BRD-9 FRS v1.2); the other results are carried over from v1.4.
  Version 1.6 (17-Oct-2026): client decisions of 17-Oct-2026 - the partner portal (G02) and reinsurance (G17) are
  deferred to Phase 2; their requirements and walkthrough steps are listed with the result Deferred to Phase 2 and left
  out of the current-phase counts and percentages (the figures of v1.5 below are restated without them). The data
  scope of records addressed by a text business key is checked; the case routing notice is e-mailed and copied to the
  unit of the account (BRD-9 FRS v1.2); eleven partly conformant requirements of BRD-07, BRD-09 and BRD-10 are shown in
  full by automated checks. The walkthrough-script steps of BRD-00, BRD-07, BRD-08, BRD-09, BRD-10, BRD-12 and BRD-13
  run again on a fresh SIT/UAT environment (152 pass, none fail, 2 deferred); requirement evidence refreshed from the
  automated checks of the release. The FRS in BDOI's format of Remittance (BRD-02) and Claims (BRD-07), v1.0 of 17-Oct-2026, are listed item
  by item as not yet assessed and counted apart, so the current-phase figures stay comparable.
  Version 1.7 (17-Oct-2026): co-insurance is in scope (client decision of 17-Oct-2026; only reinsurance stays in
  Phase 2): the default co-insurance participation of the insurer delivered (CRQ08, FR-OP-007). The Remittance FRS
  (BRD-02, v1.0) and the Claims FRS (BRD-07, v1.0) in BDOI's format are assessed item by item and counted: BRD-02 is
  measured against the Cashiering FRS v3.4 and the Remittance FRS v1.0, BRD-07 against the Claims FRS v1.0. Items
  delivered in the release of 17-Oct-2026 (extract files, settlement numbering, shared folder copy and Remittance
  Settings; claim follow-ups, document checklist, motor details, return to the account officer, worklist export and
  the BDOI heading, presentation and grouping of the claims reports) are shown by automated checks and the new
  walkthrough steps; the other items take the result of their fit-gap in the FRS (Fit conformant, Partial partly
  conformant, Gap not conformant, change requests not testable yet until BDOI approves them); the two items specified
  in another FRS are not counted.

