    result: Conformant
    reason: ""
    evidence: Automated checks of the single sign-on through the identity provider (OpenID Connect, an unknown or
      inactive identity refused), run against the identity provider simulator; the connection to the bank's Entra ID
      is confirmed in SIT.
  FRUM.002:
    result: Conformant
    reason: ""
    evidence: Automated checks of identity provisioning over SCIM (joiner creates the user without a group profile; a
      duplicate User ID or Windows ID refused and listed; the user maintenance screens no longer create or change
      users); the connection to the bank's UIDM-ISC is confirmed in SIT.
