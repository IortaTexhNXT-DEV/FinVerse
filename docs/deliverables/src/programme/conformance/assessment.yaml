  FRUM.003.02:
    result: Conformant
    reason: ""
    evidence: Automated checks of the SCIM leaver event (user deactivated, open sessions ended).
  FRUM.010:
    result: Conformant
    reason: ""
    evidence: >-
      Walkthrough WT-B of the BRD-11 pack run on 16-Oct-2026 (FRS v1.6 storyboard SB-3): the maker proposes the change
      of a group profile and cannot decide it, the checker approves with a remark and the System Administrator
