  - [Migration, "Cut-over execution and go / no-go", "Cut-over log; go decision", "A:SC R:DML,IML,BIT C:BO,IPM I:KU"]
  # Deployment
  - [Deployment, "Environment provisioning (SIT, UAT, Pre-Prod, production, DR)", "Accepted environment", "A:BIT R:BIT,OPS C:IDO,ISA I:IPM"]
  - [Deployment, "Release deployment to SIT and UAT", "Deployment record", "A:IPM R:IDO C:BIT I:IQA"]
  - [Deployment, "Release deployment to Pre-Prod and production", "Change record; deployment record", "A:BIT R:IDO,OPS C:ISEC I:BPO"]
  - [Deployment, "DR set-up and DR drill", "DR drill report", "A:BIT R:OPS C:IDO,ISA I:SC"]
  - [Deployment, "Operational and production readiness review (ORR / PRR)", "ORR / PRR evidence pack", "A:BIT R:IPM,IDO C:OPS,ISEC,APS I:SC"]
  # Training
  - [Training, "Training needs and impact analysis", "Training needs per persona", "A:BPO R:ICT C:BO,KU I:IPM"]
  - [Training, "Training material, user guides and quick-reference guides", "Material per persona", "A:BPO R:ICT C:KU,IBA I:BO"]
  - [Training, "Training environment and training users", "Training environment ready", "A:BIT R:BIT,IDO C:ICT I:BPO"]
