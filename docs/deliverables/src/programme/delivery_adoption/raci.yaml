  - [Design, "UX screen design and screen register", "UX screen deck; screen register", "A:BPO R:IBA C:KU,BO I:ICT"]
  - [Design, "Data migration design: objects, layouts, code maps, reconciliation", "Handbook; Migration Workbook", "A:DML R:IML C:BO,BIT,CMP I:PGM"]
  - [Design, "Infrastructure sizing and IER restatement", "Restated IER", "A:BIT R:ISA C:OPS,IDO I:PGM"]
  # Development
  - [Development, "Application development and configuration", "Release with release notes", "A:IPM R:IDEV C:ISA,IBA I:BPO"]
  - [Development, "Code review and quality gates on every change", "Gate results per change", "A:ISA R:IDEV C:IQA I:IPM"]
  - [Development, "Security scans and remediation of findings", "Scan reports; SBOM", "A:ISA R:IDEV,IDO C:ISEC I:BIT"]
  - [Development, "EIAM application registration and conditional access", "Registered application; claims", "A:EIAM R:EIAM C:ISA,ISEC I:BIT"]
  - [Development, "UIDM-ISC connector and provisioning set-up", "Connector configured", "A:IGA R:IGA C:ISA,ISEC I:BIT"]
  - [Development, "Apigee X proxies, products and credentials", "Proxies per environment", "A:API R:API C:ISA,BIT I:IPM"]
  - [Development, "Integration development on the BIBS side", "Interfaces in the release", "A:ISA R:IDEV C:BIT,API I:IPM"]
  - [Development, "Configuration inputs (lists, parameters, products, chart of accounts)", "Configuration workbook rows", "A:BO R:KU,IBA C:DML I:IPM"]
  # Test
  - [Test, "Test plans and test cases per BRD", "Approved test plan", "A:BO R:IQA C:IBA,KU I:IPM"]
  - [Test, "System integration test (SIT) and regression", "SIT exit report", "A:IPM R:IQA C:IDEV,IBA I:BPO,BO"]
  - [Test, "Integration test with BDO systems", "Integration test report", "A:BIT R:IQA,BIT C:API,EIAM,IGA,ISA I:IPM"]
  - [Test, "UAT preparation: scenarios, testers, data, sign-off forms", "UAT plan", "A:BPO R:KU,IQA C:BO,IBA I:IPM"]
  - [Test, "UAT execution", "UAT results", "A:BO R:KU C:IQA,IBA I:BPO,IPM"]
  - [Test, "Performance test", "Performance test report", "A:BIT R:IQA,IDO C:ISA,OPS I:SC"]
