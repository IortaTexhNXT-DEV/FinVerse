  # Migration
  - [Migration, "Extracts from the legacy systems with control files", "Extract files", "A:BIT R:BIT C:DML,IML I:PGM"]
  - [Migration, "Data cleansing and code maps", "Approved code maps", "A:DML R:DML,KU C:IML I:BO"]
  - [Migration, "Trial migrations and the dress rehearsal", "Trial reports; dress rehearsal report", "A:DML R:IML C:BIT,IQA I:PGM"]
