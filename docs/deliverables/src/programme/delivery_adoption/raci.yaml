# BIBS programme RACI (BRD-00). Read by build_delivery_adoption.py for the RACI workbook and the summary tables of the
# Delivery Methodology and the Knowledge Transfer Plan.
# R = responsible (does the work), A = accountable (one per activity, approves), C = consulted, I = informed.
# Each activity: [area, activity, deliverable or evidence, "A:role R:role,role C:role,role I:role,role"].

roles:
  # code: [name, organisation, description]
  SC: ["Steering committee", BDOI, "Chaired by the Program Manager, Business Project Services; BIBS Product Owner, heads of Operations, Comptrollership, Marketing, Compliance, BDOI IT and Information Security; iorta TechNXT engagement lead"]
  PGM: ["Program Manager, Business Project Services", "BDO Unibank ESG", "Plan, drops, budget and traceability check against the BRDs"]
  BPO: ["BIBS Product Owner", BDOI, "Owner of the BIBS scope and backlog of change requests; chairs the Change Control Board"]
  BO: ["Business owner of the BRD", BDOI, "Product owner or department head named on the BRD approval sheet (for example Head, Comptrollership for BRD-05; Product Owner, Renewal for BRD-06)"]
  BPS: ["Business Project Services analysts", "BDO Unibank ESG", "BRD owners; traceability review of the FRS"]
  KU: ["Key users and UAT testers", BDOI, "Named business users per unit and persona; test, coach and feed back"]
  DML: ["Data Migration Lead and data owners", BDOI, "Owner of the migration objects, extracts, code maps and reconciliation"]
  COMP: ["Head, Comptrollership", BDOI, "Owner of the finance set-up, the GL opening and the reconciliation of the financial objects"]
  CMP: ["Compliance", BDOI, "Chief Compliance Officer and unit: screening, KYC, retention, audit"]
  BIT: ["BDOI IT", BDOI, "Owner of the environments, extracts, interfaces and the Technical Specification review"]
  ISEC: ["BDOI Information Security", BDOI, "Owner of the security settings, role matrix, separation of duties and security tests"]
  EIAM: ["BDO IT EIAM team", "BDO Unibank", "Microsoft Entra ID: application registration, single sign-on, conditional access"]
  IGA: ["BDO IT IGA team", "BDO Unibank", "UIDM-ISC: joiner, mover and leaver provisioning, aggregation and certification"]
  API: ["BDO IT API team", "BDO Unibank", "Apigee X gateway: proxies, products, credentials, policies"]
  OPS: ["BDO IT operations", "BDO Unibank", "ITIO-SRE and ITSD-AMS: monitoring, backups, DR, service desk tooling"]
  APS: ["BDOI application support", BDOI, "L1 and L2 support of BIBS after hypercare"]
  IPM: ["iorta Project Manager", "iorta TechNXT", "Plan, RAID log, status, change requests, releases"]
  ISA: ["iorta Solution Architect", "iorta TechNXT", "Architecture, integrations, security design, technical specification"]
  IBA: ["iorta Business Analyst lead", "iorta TechNXT", "FRS, clarifications, traceability, functional configuration"]
  IDEV: ["iorta development team", "iorta TechNXT", "Application development, configuration and code review"]
  IQA: ["iorta QA lead and testers", "iorta TechNXT", "Test plans, SIT, regression, UAT support"]
  IDO: ["iorta infrastructure team", "iorta TechNXT", "Deployment pipeline, environments set-up support, monitoring, releases"]
  IML: ["iorta Migration Lead", "iorta TechNXT", "Migration Console, loads, reconciliation reports, cut-over runbook"]
  ICT: ["iorta change and training lead", "iorta TechNXT", "Change management, training, user guides, knowledge base"]

order: [SC, PGM, BPO, BO, BPS, KU, DML, COMP, CMP, BIT, ISEC, EIAM, IGA, API, OPS, APS, IPM, ISA, IBA, IDEV, IQA, IDO, IML, ICT]

activities:
  # Governance
  - [Governance, "Steering committee: direction, drop closure, go-live decision", "Minutes; decisions", "A:SC R:PGM,IPM C:BPO,BO I:BIT,ISEC"]
  - [Governance, "Programme plan and weekly programme meeting", "Project Plan; weekly status report", "A:PGM R:IPM C:BPO,BO,BIT I:SC"]
  - [Governance, "RAID log upkeep and escalation of High items", "RAID log", "A:PGM R:IPM C:BPO,BO,BIT,ISEC I:SC"]
  - [Governance, "Change Control Board: CR approval, rejection, deferral", "Signed CR form; change register", "A:BPO R:IPM C:BO,PGM,ISA,IBA,BIT,CMP I:SC"]
  # Requirements
  - [Requirements, "Issue BRDs and new BRD versions", "BRD with approval sheet", "A:BO R:BPS C:KU I:IPM,IBA"]
  - [Requirements, "Write and re-base the FRS, test plans and sign-off sets", "FRS; sign-off set", "A:IPM R:IBA C:BO,KU,ISA,IQA I:BPO,BPS"]
  - [Requirements, "Review the FRS and record comments", "Comments log of the sign-off workbook", "A:BO R:KU,BPS C:BIT,ISEC,CMP I:IPM"]
  - [Requirements, "Decide the proposed business rules and clarifications", "Decided CLR rows; decision log", "A:BO R:KU C:IBA,BPS,CMP I:BPO,IPM"]
  - [Requirements, "Sign the FRS and sign-off set of a BRD", "Sign-off certificate", "A:BO R:BO C:BPS,BIT,ISEC I:SC,IPM"]
  - [Requirements, "Traceability check against the BRD", "Traceability chapter checked", "A:PGM R:BPS C:IBA I:BO"]
