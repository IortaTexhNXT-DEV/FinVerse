risks:
  - {id: R-01, category: Scope, title: "New BRD versions of 8-Oct-2026 to absorb", cause: "BDOI issued new versions of ten documents on 8-Oct-2026 (New Business, Operations re-issue v1.01 and topic annexes, Collections, Accounting, Renewal addendum, Claims, CSF with Case Management, Submitted Policies, Data Migration V0.03, report list of 13-May-2026)", effect: "FRS, traceability, test cases and sign-off sets cite superseded pages and miss restated requirements; Drop 1 sign-off on 30-Nov-2026 at risk", prob: 5, impact: 3, owner: "iorta Business Analyst lead", mitigation: "Comparison of every old and new version done; FRS re-based to v2.1 or the next minor version with a user-story view and storyboard index; restated requirements raised as clarifications; re-issue by 23-Oct-2026 (proposed)", contingency: "Sign the unchanged chapters first and re-sign the changed pages only (delta sign-off)", due: 2026-10-23, status: In progress, source: "Source-document comparison of 8-Oct-2026"}
  - {id: R-02, category: Scope, title: "Customer Servicing Case Management enters scope", cause: "The signed CSF Addendum - Case Management (11 requirements BRCSFCM.001-.012; case types with turnaround times, 125 natures of transaction, 51 product types, 33 market segments, 53 fulfilment units; a new Fulfilment Unit persona) replaces SharePoint tracking; FRS BRD-09 v1.0 had case management out of scope (CR-0005, DCR-163)", effect: "New module (case record, routing, SLA and escalation, reports, dashboards) with effort not in the plan; Drop 1 or Drop 2 dates at risk", prob: 5, impact: 4, owner: "Product Owner, CSF; Program Manager", mitigation: "Change request to the CCB by 30-Oct-2026 with the impact analysis; proposed delivery with Drop 2 (requirements to 26-Feb-2027, development Mar-Apr 2027, SIT Jul-Sep 2027)", contingency: "Deliver case logging and the supervisor queue for go-live and the dashboards in the first release after hypercare", due: 2026-10-30, status: Open, source: "CSF BRD with the Case Management addendum (8-Oct-2026)"}
  - {id: R-03, category: Data, title: "Data Migration BRD V0.03 conflicts with earlier BDOI answers", cause: "The signed V0.03 brings into scope objects held as conditional or excluded (claims, submitted policies, payees, in-progress renewals, e-policy linking) and asks to migrate the renewals in progress, against the answer of 26-Sep-2026 (DMQ37); it also drops the '(legacy)' qualifier of the sub-ledgers (DMQ18)", effect: "Data object register, layouts and the Handbook v2.0 are not aligned; new layouts after the M2 freeze; Trial migration scope changes", prob: 4, impact: 4, owner: "Data Migration Lead; Program Manager", mitigation: "Position paper per conflict with our proposal; decision at M2 (30-Oct-2026); Handbook and test plan re-based on V0.03", contingency: "Objects not decided by M2 are completed in legacy before the freeze", due: 2026-10-30, status: Open, source: "Data Migration BRD V0.03; Handbook; DEC-03"}
  - {id: R-04, category: Integration, title: "EIAM and UIDM-ISC decisions late", cause: "EIAM sign-in (tenant, claims, session life, OIDC or SAML 2.0) and the UIDM-ISC option (accounts only, accounts and roles, aggregation only; SCIM provisioning) are not yet specified (DEC-05, IQ04, IQ05)", effect: "Sign-in stays local in SIT; directory sign-in, single sign-on, provisioning and MFA tested late; user loading at go-live becomes manual", prob: 3, impact: 4, owner: "BDOI IT; BDO IT EIAM and IGA teams", mitigation: "Local sign-in with the Windows ID captured on every user; directory mode switched on when specified; decision workshop with the EIAM and IGA teams in November 2026; specifications by 31-Jan-2027", contingency: "Go-live with EIAM sign-in and bulk user loading through access requests; UIDM-ISC provisioning in the first release after hypercare", due: 2027-01-31, status: Open, source: "Drop 0 closure RSK-04; alignment pack IQ04, IQ05"}
  - {id: R-05, category: Security, title: "Spring Framework 6.2 security advisories", cause: "The Spring project publishes security advisories for the Spring Framework 6.2 and Spring Security lines used by Spring Boot 3.5; new advisories will appear during SIT, UAT and production", effect: "The dependency gate fails (CVSS 7.0 or higher); unplanned patch releases during test windows; exposure in production if a patch is late", prob: 4, impact: 3, owner: "iorta Solution Architect; BDOI Information Security", mitigation: "Dependency, container and secret scans on every change; monthly patch release; critical findings patched within 7 days and high within 30 days; SBOM kept with every release; regression run on every patch", contingency: "Temporary compensating control at the Gateway API or Apigee X layer, approved by Information Security, with a dated acceptance at most six months", due: 2026-11-30, status: In progress, source: "Quality gates; component baseline of 8-Oct-2026"}
  - {id: R-06, category: Technology, title: "Spring Boot 4 upgrade path", cause: "The client baseline of 8-Oct-2026 is Spring Boot 3.5; its open-source support window ends before the first years of production are over; Spring Boot 4 brings Spring Framework 7 and Jakarta EE 11 changes", effect: "A late upgrade lands in UAT or hypercare; or production runs on a line without open-source patches", prob: 3, impact: 4, owner: "iorta Solution Architect; BDOI IT", mitigation: "Compatibility assessment Jan-Mar 2027; CCB decision by 31-Mar-2027; if approved, upgrade release in May-Jun 2027 before Trial migration 2 so that the full SIT regression, UAT and the performance test run on the upgraded stack", contingency: "Stay on Spring Boot 3.5 with extended support through go-live; upgrade in the first release after hypercare (Q2 2028)", due: 2027-03-31, status: Open, source: "Component baseline of 8-Oct-2026"}
  - {id: R-07, category: Adoption, title: "Screenshots and training material out of date after screen changes", cause: "The BRD versions of 8-Oct-2026, Case Management, the UX points and change requests change screens after the sign-off sets, UX decks, user guides and training material were captured", effect: "Users trained on screens that differ from production; sign-off sets show superseded screens; re-capture effort", prob: 4, impact: 2, owner: "iorta change and training lead", mitigation: "Screen register with a change flag per screen; re-capture of the changed screens with every release; user guides refer to screen IDs; content freeze for training at Drop 1 UAT mid-point (29-Oct-2027) and delta notes after it", contingency: "Release notes per persona and a 30-minute delta session before go-live", due: 2027-10-29, status: Open, source: "UX screen register per sign-off set"}
  - {id: R-08, category: Environment, title: "Environment provisioning late", cause: "SIT (4-Jan-2027), UAT (19-Jul-2027), Pre-Prod (1-Oct-2027), production and DR (1-Nov-2027) depend on BDOI IT; the IER has no Pre-Prod and DR cluster sheets and does not cost the declared components (IQ33)", effect: "SIT, UAT, performance test or dress rehearsal start late; go-live date at risk", prob: 3, impact: 5, owner: "BDOI IT", mitigation: "Environment checklist per environment agreed by 30-Nov-2026; restated IER sizing; monthly environment review at the steering committee; acceptance test of each environment one week before its date", contingency: "Run Drop 1 SIT on a temporary cluster managed by iorta TechNXT with masked data, if Information Security approves", due: 2026-11-30, status: Open, source: "Alignment pack 6.2, 6.6; IQ27, IQ33"}
  - {id: R-09, category: Technology, title: "IER and the component baseline differ", cause: "The IER describes ten microservices, Redis 7 and ingress-nginx; the baseline of 8-Oct-2026 is one application on managed Kubernetes with Valkey 8, Kafka 3.9 and the Gateway API", effect: "Environments ordered with the wrong components; re-work and delay", prob: 3, impact: 3, owner: "BDOI IT; iorta Solution Architect", mitigation: "IER restated with the baseline and the Kubernetes sizing of the alignment pack by 30-Nov-2026 (IQ25)", contingency: "Component substitutions recorded in the environment acceptance", due: 2026-11-30, status: Open, source: "Alignment pack IQ25; client decisions of 8-Oct-2026"}
  - {id: R-10, category: Data, title: "Configuration inputs late", cause: "Configuration items of the Drop 0 workbook arrive after their due dates D1-D7", effect: "Drop 1 SIT or a trial migration runs on seed values; results do not hold for production", prob: 3, impact: 4, owner: "Program Manager", mitigation: "Owner and due date per item; status reviewed weekly from December 2026", contingency: "Retest the affected cases on the production values in UAT", due: 2027-01-04, status: Open, source: "Drop 0 closure RSK-01"}
  - {id: R-11, category: Finance, title: "Chart of accounts and accounting rules not final before Drop 1 SIT", cause: "The production chart and the accounting rules are not final by D2", effect: "Postings tested against a draft chart; GL opening and Migration Clearing not reconcilable", prob: 3, impact: 4, owner: "Head, Comptrollership", mitigation: "Chart and rules due at D2 (4-Jan-2027); legacy accounts and GL map at D3 and D4", contingency: "Posting retest cycle in UAT before Trial migration 3", due: 2027-01-04, status: Open, source: "Drop 0 closure RSK-02"}
  - {id: R-12, category: Finance, title: "Year-end option A not confirmed by M6", cause: "Comptrollership has not confirmed go-live at the year-end boundary with a provisional opening and true-ups", effect: "Cut-over calendar, GL opening and true-ups change", prob: 2, impact: 5, owner: "Head, Comptrollership", mitigation: "Confirmation asked with the Drop 0 closure (DEC-01); decision by 1-Oct-2027 at the latest", contingency: "January interim period in legacy and a later go-live date in January 2028", due: 2027-10-01, status: Open, source: "Drop 0 closure RSK-03"}
  - {id: R-13, category: Data, title: "Conditional migration objects decided late", cause: "F04, F06, F07, P04, P05 and R09 are not decided at M1 and M2", effect: "Layouts, trials and reconciliation of those objects added late", prob: 3, impact: 3, owner: "Program Manager", mitigation: "Decisions at M1 and M2 (DEC-03)", contingency: "Objects not decided are completed in legacy before the freeze", due: 2026-10-30, status: Open, source: "Drop 0 closure RSK-05"}
  - {id: R-14, category: Scope, title: "Changes to signed content during later reviews", cause: "Drop 1 reviews ask to change signed Drop 0 screens, rules or templates", effect: "Re-work of signed sets and their tests", prob: 3, impact: 3, owner: "Program Manager", mitigation: "Change control: every change is a CR with its effect on the other BRDs and a delta sign-off", contingency: "Defer non-critical changes to the first release after hypercare", due: 2026-12-09, status: Open, source: "Drop 0 closure RSK-07"}
  - {id: R-15, category: Scope, title: "Insurer-company functions visible to BDOI users", cause: "BIBS is broker-only; the insurer-company modules (insurer underwriting, insurer claims, treaty and cession accounting, actuarial reserves, group consolidation, insurer taxes) are being removed from the BIBS release", effect: "A residual menu, report or posting option confuses users or auditors", prob: 2, impact: 3, owner: "iorta Solution Architect", mitigation: "Removal completed and verified in SIT; menu check per persona in every regression; UAT test case per BRD that the insurer suite is absent", contingency: "Hide through the module switches and remove in the next release", due: 2026-12-18, status: In progress, source: "Client instruction (broker-only scope)"}
  - {id: R-16, category: Schedule, title: "Short lead time of the January 2028 renewals", cause: "Expiries of January 2028 get days to four weeks instead of 140 days for insurer requests and Renewal Advices", effect: "Late renewals, hold covers, client complaints in the first weeks", prob: 4, impact: 4, owner: "Head of the Renewal processing team", mitigation: "Day-1 priority queue (go-live extraction at 04:00, January expiries flagged urgent); January staffing plan signed; Renewal team trained and practised on Trial migration 4 and dress-rehearsal data by 14-Dec-2027", contingency: "Overtime and back-up handlers from Processing; daily review at the hypercare triage", due: 2027-12-14, status: Open, source: "Handbook risk 16; cut-over CT-013"}
