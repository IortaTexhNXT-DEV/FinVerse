  - {id: R-19, category: Technology, title: "Sizing basis for the peak load not agreed", cause: "The IER uses 1,200 internal users; the umbrella BRD gives 1,344 named and 429 concurrent users (IQ32)", effect: "Production under-sized or over-sized; performance test target disputed", prob: 2, impact: 4, owner: "BDOI IT", mitigation: "Agree 1,344 named and 429 concurrent users as the test target by 31-Dec-2026", contingency: "Horizontal scaling headroom kept in the production cluster", due: 2026-12-31, status: Open, source: "Alignment pack IQ32"}
