# Data of the operations and go-live documents of BIBS (programme level, BRD-00).
# Read by build_operations_pack.py, which expands the <!-- op:... --> markers of the Markdown sources.
#
# Scheduled jobs: read from the job registry of the backend (every scheduled job of the platform, its name, its
# description and its schedule in the application settings, converted from UTC to Philippine time, PHT = UTC+8).
# The insurer-company jobs (reinsurance allocation, reserve valuation, insurer quotation expiry) are left out: they
# belong to the modules that BIBS does not use.
# Columns: [job, area, schedule (PHT), workload, what it does, class, when it fails]
# Class A: protects a business deadline or a financial position (failure = P2; P1 when it blocks the next business
# day). Class B: daily operational work (failure = P3, rerun the same day). Class C: housekeeping (failure = P4, rerun
# at the next run).
jobs:
  - [BOOKING_BATCH, New Business - Booking, "Daily 20:00", jobs, "Books the accounts queued for booking and the multi-year policy years that have started", A, "Rerun from Scheduled Jobs before 22:00; accounts stay queued until booked"]
  - [PAYMENT_CONFIRMATION_SWEEP, New Business, "Hourly at :00", jobs, "Opens the payment gate of accounts whose payment a payment source confirmed", B, "Next hourly run catches up; check the payment source file"]
  - [HOLD_COVER_EXPIRY, New Business, "Daily 08:30", jobs, "Alerts Processing of hold covers about to expire and expires lapsed hold covers", B, Rerun the same morning]
  - [KYC_REVIEW_DUE, New Business - Client, "1st of month 10:00", jobs, "Expires overdue client KYC and notifies Account Officers of the KYC reviews due", B, Rerun the same day]
  - [RETENTION_REVIEW, Platform, "2nd of month 11:00", jobs, "Counts records eligible for archiving under the retention rules (no deletion)", C, Rerun at any time]
  - [QUOTATION_REQUEST_INTAKE, New Business - HL-LOAS, "Manual until the HL-LOAS interface is live", integration, "Stores the quotation requests received from the source systems in the request inbox", B, "Check the HL-LOAS file or call through Apigee; rerun"]
  - [PREBOOKED_REMATCH, Cashiering, "Every 2 hours", jobs, "Applies pre-booked payments whose account is now booked", B, Next run catches up]
  - [PAYMENT_AUTOMATCH, Cashiering, "Hourly at :30", jobs, "Matches unapplied payments again against booked invoices", A, "Rerun; unapplied payments stay in the queue; check the latest payment upload"]
  - [PDC_MATURITY, Cashiering, "Daily 08:30", jobs, "Creates the payment and AR of post-dated checks at maturity", A, "Rerun before 10:00 so that matured checks are deposited the same day"]
  - [PDC_ISSUED_DUE, Cashiering, "Daily 08:15", jobs, "Flags post-dated cheques issued whose cheque date has been reached as due", B, Rerun the same morning]
  - [MINIMAL_BALANCE_SWEEP, Cashiering, "Daily 04:00", jobs, "Reverses minimal premium balances and moves minimal excess to AP overages", B, Rerun before 06:00]
  - [REMITTANCE_EXTRACTION, Remittance, "Daily 20:00", jobs, "Extracts the paid and cleared premium due to insurers into remittance batches", A, "Rerun before 23:00; alert REMIT_EXTRACTION_FAILED; Remittance informed before 08:00"]
  - [HOLD_EXPIRY, Remittance, "Daily 08:15", jobs, "Releases expired remittance holds and warns of holds expiring tomorrow", B, Rerun the same morning]
  - [OPS_INVOICE_FEED_REPLAY, Operations ledger, Manual, jobs, "Copies booked invoices missing from the Operations invoice ledger", B, "Run on request of L2 after an OPS_FLOW_IN_FAILED alert"]
  - [ADJ_DAILY_REPORT, Adjustment, "Daily 18:00", jobs, "Exports and archives the Adjustment and Daily Endorsement Report of the day", B, Rerun the same evening]
  - [DP_FEEDBACK_SLA, Commission, "Daily 09:30", jobs, "Flags direct payment billings whose insurer feedback is overdue", B, Rerun the same day]
  - [PRODUCTION_EXTRACT, Production Reconciliation, "Daily 09:00", jobs, "Extracts the production register of every insurer whose schedule is due", B, Rerun the same day]
  - [RECON_AUTOMATCH, Production Reconciliation, "Manual until the frequency is agreed (OQ30)", jobs, "Re-matches the insurer production of the open reconciliation cycles", B, Rerun]
  - [PACKAGE_EXPIRY_MONITOR, Product Maintenance, "Daily 01:00", jobs, "Alerts TSU and MBS of packages reaching their end date and drafts renewal requests", B, Rerun the same day]
  - [PACKAGE_VERSION_LIFECYCLE, Product Maintenance, "Daily 01:00", jobs, "Supersedes ended package versions, applies versions that took effect and expires packages past their end date", A, "Rerun before 06:00: quotations of the day use the package versions in force"]
  - [CLX_DAILY_REFRESH, Collections, "Daily 22:15", jobs, "Refreshes the collection worklist from the invoice ledger and assigns new accounts", A, "Rerun before 06:00; alert CLX_REFRESH_FAILED"]
  - [CLX_DAILY_FILES, Collections, "Daily 22:30", jobs, "Publishes the daily Outstanding PR List and Full Production Report", B, "Rerun before 06:00; alert CLX_FILE_NOT_PUBLISHED"]
  - [CLX_PROMISE_CHECK, Collections, "Daily 22:45", jobs, "Allocates payments to installments and checks the promises to pay due", B, Rerun before 06:00]
  - [CLX_ESCALATION, Collections, "Daily 23:00", jobs, "Escalates the accounts meeting the escalation rules and closes collected ones", B, Rerun before 06:00]
  - [CLX_APPLICATION_FILE, Collections, "Daily 05:00", jobs, "Writes the daily For Application To Invoice file before 06:00", A, "Rerun at once; the file must be on the share before 06:00"]
  - [CLX_WEEKLY_FILES, Collections, "Friday 22:30", jobs, "Publishes the weekly DP PR and PR 2307 for reversal files, available Monday 08:00", B, Rerun before Monday 08:00]
  - [CLX_MONTHLY_FILES, Collections, "Daily check 05:00", jobs, "Publishes the monthly DP PR and PR 2307 for reversal files on the first working day", A, Rerun the same morning]
  - [RECURRING_JOURNALS, General Ledger, "Daily 09:00", jobs, "Generates due recurring and accrual journals (drafts or submitted for approval)", B, Rerun the same day]
  - [JOURNAL_AUTO_REVERSAL, General Ledger, "Daily 00:05", jobs, "Posts the automatic reversal of accruals on their reversal date", A, "Rerun before 06:00; Comptrollership informed"]
  - [GL_PERIOD_CLOSE, Closing, "Every 15 minutes", jobs, "Runs the scheduled month-end closes that are due", A, "Alert GL_CLOSE_FAILED; the close checklist lists the blocking items; Comptrollership decides"]
  - [BROKING_BOOKS_CLOSE, Closing, "Last day of month 23:00", jobs, "Closes the broking books of the month on its last day", A, "Rerun after the blocking items are cleared; Comptrollership informed at once"]
  - [BOOK_RATE_FROM_CLOSING, Currency, "1st of month 00:30", jobs, "Copies the month-end revaluation rates as the BOOK rates of the next month", A, "Rerun before 06:00 of the first business day"]
  - [ACSL_GL_SL_RECON, ACSL, "Daily 20:00", jobs, "Reconciles the general ledger with the sub-ledgers per control account", A, "Rerun; a difference raises ACSL_GLSL_DIFFERENCE for Comptrollership"]
  - [DISB_CHECK_STALE, Disbursement, "Daily 00:20", jobs, "Tags as stale the checks not negotiated DISB_STALE_DAYS after their print date", B, Rerun the same day]
  - [DISB_EOD_CONFIRMATION, Disbursement, "Started by each Disbursement EOD run", jobs, "E-mails the payment confirmations of the Disbursement end-of-day runs", B, Rerun from Scheduled Jobs]
  - [DISB_EOD_REPORTS, Disbursement, "Started by each Disbursement EOD run", jobs, "Produces the Disbursement end-of-day reports of the runs that miss one", B, Rerun from Scheduled Jobs]
  - [RNW_EXTRACTION, Renewal, "Daily 01:00", jobs, "Extracts the policies reaching the renewal lead days as renewals and runs their checks", A, "Rerun before 06:00; the next run also takes the missed dates; alert RNW_EXTRACTION_FAILED"]
  - [RNW_REEVALUATE, Renewal, "Daily 01:30", jobs, "Runs the checks of the open renewals again and moves their bucket", B, Rerun before 06:00]
  - [RNW_NRNS_LETTERS, Renewal, "Daily 06:00", jobs, "Flags the renewals not submitted at the NRNS checkpoint and sends their reminder", B, Rerun the same morning]
  - [RNW_EXPIRY_SWEEP, Renewal, "Daily 00:15", jobs, "Closes the renewals expired without renewal and sends the non-acceptance letter", B, Rerun the same day]
  - [RNW_LETTER_BATCH, Renewal, "Hourly at :05", jobs, "Updates the delivery status of the renewal letters sent by e-mail", B, Next run catches up; alert RNW_LETTER_FAILED]
  - [RNW_GOLIVE_EXTRACTION, Renewal - go-live, "Once, at T 04:00 (cutover task CT-062)", jobs, "Takes over as renewals the migrated policies expiring in the go-live window", A, "Cutover stop condition; rerun skips headers already extracted"]
  - [SBM_INTAKE_PULL, Submitted Policies, "Manual until a bank feed is connected", jobs, "Pulls the submitted policy source files from the bank systems and loads them", B, Rerun after the file is corrected]
  - [SBM_PROCESSING, Submitted Policies, "Daily 21:30", jobs, "Classifies and buckets the submitted policies received or changed, with the approved rules", B, Rerun before 06:00]
  - [SBM_EXPIRY_SCAN, Submitted Policies, "Daily 22:00", jobs, "Hands the submitted policies for renewal that near their expiry to Renewal", A, Rerun before the 01:00 renewal extraction]
  - [SBM_LETTER_DISPATCH, Submitted Policies, "Daily 06:30", jobs, "Sends the letters on submitted policies that are due and prepares the print batches", B, Rerun the same morning]
  - [SBM_HOLD_COVER_WATCH, Submitted Policies, "Daily 07:00", jobs, "Follows the hold covers and the outcome of the renewals of submitted policies", B, Rerun the same morning]
  - [SBM_HANDLING_FEE_TAGGER, Submitted Policies, "Every 30 minutes", jobs, "Tags the unapplied payments of billed handling fees and has them applied with an official receipt", B, Next run catches up]
  - [BCL_PREMIUM_RECHECK, Claims, "Daily 05:30", jobs, "Re-checks the premium of open claims without an authorization code", B, Rerun the same morning]
  - [BCL_FOLLOW_UP_DUE, Claims, "Daily 06:00", jobs, "Reminds claims handlers of follow-ups and diary entries due; flags overdue ones", B, Rerun the same morning]
  - [BCL_AGEING_ALERTS, Claims, "Daily 06:00", jobs, "Flags outstanding claims older than BCL_PAST_DUE_DAYS", C, Rerun at the next run]
  - [EB_RENEWAL_ADVICE, Employee Benefits, "Daily 06:00", jobs, "Sends the renewal advice of Employee Benefits programmes before expiry and the reminders", A, Rerun the same morning]
  - [EB_ITEM_FOLLOWUP, Employee Benefits, "Daily 07:00", jobs, "Follows up Employee Benefits pending items past due and escalates them to the AO", B, Rerun the same morning]
  - [EB_FRANCHISE_EXPIRY, Employee Benefits, "Daily 06:30", jobs, "Expires Employee Benefits franchise requests left without an insurer decision", B, Rerun the same morning]
  - [CSF_LEGACY_SYNC, Customer Servicing, "Off at go-live (legacy is read-only); every 15 minutes when enabled", integration, "Sends the client contact changes of the contact centre to the legacy policy systems", C, "Changes stay queued; alert CSF_SYNC_FAILED"]
  - [SCR_WATCHLIST_INGEST, Sanction Screening, "Daily 01:00", integration, "Reads the sanctions and PEP list files of the active sources and logs each run", A, "Rerun before 06:00; alert SCR_INGEST_FAILED to Compliance"]
  - [SCR_PERIODIC_SCREENING, Sanction Screening, "Daily 01:30", jobs, "Screens the clients in scope against the changed watchlist entries (monthly: the whole list)", A, "Rerun after the ingestion succeeded; Compliance informed"]
  - [SCR_SLA_MONITOR, Sanction Screening, "Hourly", jobs, "Sends the SLA reminders, flags and escalates SLA breaches of the open screening cases", B, Next run catches up]
  - [SCR_INGEST_ERROR_DIGEST, Sanction Screening, "Monday to Friday 07:00", jobs, "E-mails the records that failed watchlist ingestion to the recipients", C, Rerun]
  - [UAM_EFFECTIVE_CHANGES, User Access, "Daily 00:05", jobs, "Applies approved user access requests on their effective date", A, "Rerun before 06:00; alert UAM_SCHEDULED_APPLY_FAILED; ISO informed"]
  - [UAM_DORMANT_USERS, User Access, "Daily 00:15", jobs, "Deactivates the users who have not signed in for the dormancy period, after a notice", B, Rerun the same day]
  - [PASSWORD_EXPIRY_NOTICE, User Access, "Daily 06:00", jobs, "Tells users with local sign-in (break-glass) whose password expires within the notice days", C, Rerun]
  - [USER_SESSION_SWEEP, Security, "Every 15 minutes", jobs, "Ends idle, expired, locked and disabled users' sign-in sessions in the session log", B, Next run catches up]
  - [SHARED_STATE_CLEANUP, Platform, "Daily 08:40", jobs, "Deletes expired revoked tokens and shared counters kept in the database fallback of Valkey", C, Rerun]
  - [ALERT_DAILY_CHECKS, Platform, "Daily 09:30", jobs, "Evaluates the exception codes (cash, trial balance, suspense, approval ageing)", B, Rerun the same morning]
  - [MAIL_DISPATCH, Messaging, "Every 2 minutes", jobs, "Delivers queued e-mails (quotations, slips, e-policies, invoices, letters) and retries failures", A, "Check CCM (SMTP) reachability; queued mail is sent when CCM answers"]
  - [EVENT_OUTBOX_RELAY, Integration events, "Every minute", integration, "Sends pending integration events of the outbox to Kafka and retries failed sends", A, "Check MSK; events wait in the outbox and are sent when Kafka answers"]
  - [EVENT_HOUSEKEEPING, Integration events, "Daily 08:50", jobs, "Deletes delivered outbox rows, old archived events and resolved dead letters", C, Rerun]
  - [FILE_SCAN_RESULTS, Document store, "Every 5 minutes", jobs, "Reads the malware scan results of stored files and quarantines infected ones", A, "Uploads stay pending (not downloadable) until the scan result is read; check GuardDuty"]
  - [FILE_ECM_ARCHIVE, Document store, "Every 15 minutes", jobs, "Publishes final records of the ECM record classes for archiving in the ECM", B, Next run catches up]
  - [FILE_ORPHAN_RECONCILIATION, Document store, "Daily 10:10", jobs, "Deletes stored objects that have had no metadata for 24 hours", C, Rerun]
  - [FILE_RETENTION, Document store, "Daily 10:40", jobs, "Removes stored files past retention or deleted (never under legal hold)", C, Rerun]
  - [FILE_BYTEA_MIGRATION, Document store, "Manual, once before go-live (Content Migration screen)", jobs, "Copies the files still held in the database to the document store and checks each copy", B, "Rerun; it continues where it stopped"]
  - [MIG_VALIDATE, Data Migration, "On demand from the Migration Console", jobs, "Validates the planned migration batches against the code maps and the data-quality rules", A, "Cutover: rerun within the task window; Migration Lead decides"]
  - [MIG_LOAD, Data Migration, "On demand from the Migration Console", jobs, "Loads the approved migration batches through the owning services", A, "Cutover: rerun the rejected rows after the fix; stop condition if a financial object stays incomplete"]
  - [MIG_RECONCILE, Data Migration, "On demand from the Migration Console", jobs, "Reconciles the loaded batches on counts, amounts, hash totals, fields and the GL", A, Rerun after each load]
  - [MIG_INTAKE_SCAN, Data Migration, "Manual until an extract inbox is connected", jobs, "Takes the legacy extracts waiting in the inbox through the intake checks", B, Upload on the Extracts screen instead]
  - [MIG_CLIENT_DELTA, Data Migration, "Daily 00:30 from T-11 to T-3 (cutover task CT-024)", jobs, "Loads the daily delta of new and changed legacy clients until the freeze", A, "Delta accepted by 07:00; otherwise the Data Migration Lead decides"]
  - [MIG_STAGING_PURGE, Data Migration, "Daily 02:00", jobs, "Purges migration staging data and extract files after the retention days", A, "Rerun the same day; alert MIG_STAGING_PURGE_OVERDUE (5-day rule)"]
  - [MIG_RUNOFF_SNAPSHOT, Data Migration, "1st of month 01:30", jobs, "Counts the legacy in-force headers by expiry month: renewed, not renewed, lapsed", C, Rerun]
  - [MIG_ACCESS_LOG_DIGEST, Data Migration, "1st of month 08:00", jobs, "Sends Compliance the monthly digest of the legacy archive access log", B, Rerun the same day]

# Responders of the application exception codes (Administration > Exception Codes), by module of the code.
# [module, L2 responder, business owner told]
exception_owners:
  GL: [L2 Finance, Comptrollership]
  ACCOUNTING: [L2 Finance, Comptrollership]
  CLOSING: [L2 Finance, Comptrollership]
  ACSL: [L2 Finance, Comptrollership]
  DISBURSEMENT: [L2 Finance, "Comptrollership - Disbursement"]
  WORKFLOW: [L2 Operations, Owner of the work item]
  SYSTEM: [L2 Platform, "iorta TechNXT L3 (on-call for CRITICAL)"]
  CASHIERING: [L2 Operations, "Operations - Cashiering"]
  OPSLEDGER: [L2 Operations, "Operations - Financial Transactions"]
  REMITTANCE: [L2 Operations, "Operations - Remittance"]
  ADJUSTMENT: [L2 Operations, "Operations - Financial Transactions"]
  COMMISSION: [L2 Operations, "Operations - Commission"]
  PRODRECON: [L2 Operations, "Operations - Production Reconciliation"]
  PRODUCT_MAINTENANCE: [L2 Front office, "TSU and Marketing Business System"]
  COLLECTIONS: [L2 Operations, "Operations - Collections"]
  RENEWAL: [L2 Front office, Renewal processing team]
  CLAIMS_HANDLING: [L2 Front office, Claims unit]
  EMPLOYEE_BENEFITS: [L2 Front office, Employee Benefits unit]
  CUSTOMER_SERVICE: [L2 Front office, Customer Servicing Facility]
  SCREENING: [L2 Platform, Compliance]
  USER_ACCESS: [L2 Platform, Information Security Officer]
  SUBMITTED: [L2 Front office, Submitted Policies team]
  DATA_MIGRATION: [L2 Platform, Data Migration Lead]
  STORAGE: [L2 Platform, Information Security Officer]
# Modules of the insurer-company suite that BIBS does not use: their codes are not listed.
exception_excluded_modules: [REINSURANCE, CLAIMS, TAX]
