# BIBS Non-Functional Requirements catalogue (BRD-00, programme level).
# Read by build_requirements_quality.py for the NFR register (Excel), the tables of the NFR catalogue (Word) and the
# NFR targets quoted in the SRS and the Test Strategy ({{nfr:<ID>}} tokens), so every document carries the same values.
#
# Precedence of the sources for a target: (1) a BDOI decision or answer; (2) the IER workbook v20 (BDO Cloud and
# Digital Operations Engineering); (3) the BIBS-wide value proposed in the discrepancy register v1.2 (NFR comparison
# sheet); (4) the BRD values; (5) a value proposed by iorta TechNXT. Status ALIGNED = the sources agree or BDOI has
# answered; DECISION = the BRDs conflict and BDOI decides (register item named); PROPOSED = our value, to confirm.
#
# Row keys: id, cat, title, req (requirement), target (measurable), measure (how it is measured), method (Test |
# Analysis | Inspection | Walk-through), test (test type of the Test Strategy), stage (where it is verified), owner
# (iorta TechNXT role accountable for meeting it), acceptor (BDOI role that accepts the evidence), source, frs (how it
# reconciles with the FRS non-functional chapters), status, prio (Must | Should).

meta:
  version: "1.0"
  date: 8 October 2026

categories:
  PRF: Performance
  CAP: Capacity and volume
  AVL: Availability
  REC: Recovery (RTO, RPO, backup and DR)
  SCL: Scalability
  SEC: Security
  PRV: Privacy
  ACC: Accessibility
  USE: Usability and low-click workflows
  RSP: Responsive and mobile-first
  LOC: Localisation
  MNT: Maintainability
  CFG: Configurability
  OBS: Observability
  SUP: Supportability
  AUD: Auditability
  RET: Data retention
  INT: Interoperability

statuses:
  ALIGNED: The sources agree, or BDOI has answered; the target stands unless BDOI changes it
  DECISION: The BRDs give conflicting values; BDOI decides (register item named in Source); our proposal applies until then
  PROPOSED: No BDOI value exists; iorta TechNXT proposes the target for BDOI to confirm

nfrs:
  # ------------------------------------------------------------------ Performance
  - id: NFR-PRF-01
    cat: PRF
    title: Screen response time
    req: Every screen opens, and every single-record action (save, submit, approve) completes, within the target at the design load.
    target: "p95 at most 2.0 seconds and p99 at most 4.0 seconds"
    measure: Click to usable screen, measured by the load tool over a 60-minute run at the design load of NFR-CAP-01 with the transaction mix of NFR-CAP-02, from the BDO network to the production-sized Pre-Prod
    method: Test
    test: Performance (load)
    stage: Baseline in SIT (Jun 2027); NFT on Pre-Prod (1 Nov to 15 Dec 2027)
    owner: iorta Performance Test Lead
    acceptor: BIBS Product Owner
    source: "BRD-00 p.42 (under 5 s for every role); BRD-12 p.13 (2 s); BRD-9 p.13 (3 s); BRD-1 p.210 and BRD-6 p.186 (10 s); register DCR-137, DCR-165; CRQ21"
    frs: "FRS BRD-00 and BRD-12 state 2 s; FRS BRD-01 to BRD-10 state online p95 under 3 s. The catalogue sets 2 s; the FRS chapters take this value at their next issue once BDOI confirms (XQ08)."
    status: DECISION
    prio: Must
  - id: NFR-PRF-02
    cat: PRF
    title: Search and work-list response time
    req: The first page of any search result or work list is shown within the target; lists are paged on the server.
    target: "First page (up to 50 rows) p95 at most 3.0 seconds; each further page p95 at most 2.0 seconds"
    measure: Load-tool timing of the searches of each persona (client, account, invoice, receipt, claim, case) at the design load
    method: Test
    test: Performance (load)
    stage: NFT on Pre-Prod
    owner: iorta Performance Test Lead
    acceptor: BIBS Product Owner
    source: "BRD-9 p.13 (retrieval and search under 3 s); BRD-4 NFR 15 (5 s); BRD-10 p.22-24 (3 to 5 s)"
    frs: "FRS BRD-04 and BRD-09 (server-side paging, indexed search keys) meet this target; no FRS states a slower value."
    status: PROPOSED
    prio: Must
  - id: NFR-PRF-03
    cat: PRF
    title: Interactive reports
    req: An on-screen report or its export is produced within the target; larger reports run as background jobs (NFR-PRF-04).
    target: "At most 20 seconds (p95) for a report of up to 30,000 rows"
    measure: Report run time from request to the first page shown or the file offered, at year-5 data volume
    method: Test
    test: Performance (volume)
    stage: NFT on Pre-Prod
    owner: iorta Performance Test Lead
    acceptor: BIBS Product Owner
    source: "BRD-6 p.186 and BRD-11 p.11 (20 s); BRD-5 p.133-137 (10 to 20 s first load); register DCR-137"
    frs: "FRS BRD-06 states 20 s at 30,000 rows; FRS BRD-05 and BRD-11 run heavy reports in batches. Aligned."
    status: DECISION
    prio: Must
  - id: NFR-PRF-04
    cat: PRF
    title: Long-running reports, extracts and scheduled files
    req: Reports and files that exceed NFR-PRF-03 run as background jobs with progress shown; the user keeps working meanwhile.
    target: "Daily file at most 3 minutes, weekly at most 10 minutes, monthly at most 15 minutes, at year-5 volumes"
    measure: Job run history (start, end, rows) of the scheduled report jobs during the volume test
    method: Test
    test: Performance (volume)
    stage: NFT on Pre-Prod; dress rehearsal (15 to 26 Nov 2027)
    owner: iorta Performance Test Lead
    acceptor: Head, Operations
    source: "BRD-4 NFR 15 (daily 3 min, weekly 10 min, monthly 15 min); BRD-7 p.39-40 (reports 5 min)"
    frs: "FRS BRD-04 generates the files off-peak in the background; FRS BRD-07 runs reports under 5 minutes. Aligned."
    status: ALIGNED
    prio: Must
  - id: NFR-PRF-05
    cat: PRF
    title: Bulk uploads
    req: An upload file is acknowledged at once and processed in the background with a result per row.
    target: "Acknowledgement within 3 seconds; a 5,000-row file validated and committed within 10 minutes"
    measure: Upload of a 5,000-row file of each bulk template during the volume test
    method: Test
    test: Performance (volume)
    stage: NFT on Pre-Prod
    owner: iorta Performance Test Lead
    acceptor: BIBS Product Owner
    source: "BRD-5 p.133-137 (upload or download 3 s per file); FRS BRD-01 (bulk uploads up to 5,000 rows per file)"
    frs: "FRS BRD-01 commits row by row; the 10-minute ceiling is new and is added at the next issue."
    status: PROPOSED
    prio: Should
  - id: NFR-PRF-06
    cat: PRF
    title: Document generation and batch printing
    req: Business documents (slips, advices, receipts, SOA, vouchers) are generated within the target.
    target: "One document p95 at most 5 seconds; a batch of 50 documents at most 10 seconds"
    measure: Time from request to the PDF offered, at the design load
    method: Test
    test: Performance (load)
    stage: NFT on Pre-Prod
    owner: iorta Performance Test Lead
    acceptor: Head, Operations
    source: "BRD-2 p.115 (batch print of 50 documents under 10 s)"
    frs: "FRS BRD-02 runs batch print as a background job with progress. Aligned."
    status: ALIGNED
    prio: Must
  - id: NFR-PRF-07
    cat: PRF
    title: Night batch window
    req: The scheduled jobs of the night (booking batch, remittance extraction, GL-SL reconciliation, Collections files, renewal extraction, screening, application file) finish before the service window opens.
    target: "The chain from 20:00 to 05:30 PHT completes before 06:00 PHT at year-5 volumes; a failed job can be re-run within the window"
    measure: Run history of every scheduled job in the volume test and the dress rehearsal
    method: Test
    test: Performance (volume)
    stage: NFT on Pre-Prod; dress rehearsal
    owner: iorta Solution Architect
    acceptor: Head, BDOI IT
    source: "Register DCR-133 (service window from 06:00); programme alignment pack, section 6.5 (job times)"
    frs: "Each FRS names the times of its jobs (for example FRS BRD-02 remittance extraction 20:00 PHT, FRS BRD-12 processing 21:30 PHT). Aligned."
    status: PROPOSED
    prio: Must
  - id: NFR-PRF-08
    cat: PRF
    title: Notifications and e-mail
    req: Users are told of status changes, approvals and pending work without delay.
    target: "In-app notification within 1 minute of the event; e-mail handed to CCM within 5 minutes"
    measure: Time stamps of the event, the notification and the hand-over to CCM in SIT and NFT
    method: Test
    test: System integration
    stage: SIT; NFT on Pre-Prod
    owner: iorta QA lead
    acceptor: BIBS Product Owner
    source: "FRS BRD-00 FR-CR-020; integration INT-13 (CCM)"
    frs: "No FRS gives a time; new value."
    status: PROPOSED
    prio: Should
  - id: NFR-PRF-09
    cat: PRF
    title: Sign-in time
    req: Single sign-on through EIAM completes quickly once the identity provider answers.
    target: "p95 at most 3 seconds from the identity provider's answer to the role home page, excluding the user's own MFA entry"
    measure: Load-tool timing of the sign-in journey at the morning peak (08:00 to 10:00)
    method: Test
    test: Performance (load)
    stage: NFT on Pre-Prod
    owner: iorta Performance Test Lead
    acceptor: Head, BDOI IT
    source: "Integration INT-01 (EIAM); BRD-1 p.210 peak hours 08:00-10:00"
    frs: "No FRS gives a time; new value."
    status: PROPOSED
    prio: Should

  # ------------------------------------------------------------------ Capacity and volume
  - id: NFR-CAP-01
    cat: CAP
    title: Users
    req: BIBS serves every named user of BDOI and the concurrent sessions of the peak.
    target: "1,344 named users; design load 150 concurrent users in year 1, growing 20% a year (311 in year 5); peak test at 429 concurrent sessions"
    measure: Concurrent sessions in the load and peak tests; named users from the user register at go-live
    method: Test
    test: Performance (peak)
    stage: NFT on Pre-Prod
    owner: iorta Performance Test Lead
    acceptor: BIBS Product Owner
    source: "BRD-00 p.42 (1,344 named, 429 concurrent); BRD-1 p.210 (485 / 145, growth 20%); IER architecture sheet (about 1,200 internal users); register DCR-166, DCR-232; CRQ21, CRQ24"
    frs: "FRS BRD-01 sizes for 150 concurrent plus 20% a year; the other FRS fall within that sizing. Aligned; the peak case follows the umbrella BRD."
    status: DECISION
    prio: Must
  - id: NFR-CAP-02
    cat: CAP
    title: Transaction volumes
    req: BIBS carries the business volumes of the BRDs for five years.
    target: "Year 1: New Business 21,200 transactions and 1,300 endorsements a month; Renewal 25,800 a month; Collections 1,200 updates a day; Claims 55 bookings and 1,096 updates a day; CSF 144,400 a year; Submitted Policies 63,000 sanitations a year. Growth 20% a year (Submitted Policies 25%)"
    measure: Volume test at year-5 volumes (year 1 x 2.07; Submitted Policies x 2.44); job and screen timings within NFR-PRF targets
    method: Test
    test: Performance (volume)
    stage: NFT on Pre-Prod
    owner: iorta Performance Test Lead
    acceptor: BIBS Product Owner
    source: "BRD-1 p.210; BRD-6 p.186; BRD-4 NFR 15.01-15.05; BRD-7 p.39; BRD-9 p.13; BRD-12 p.13; BRD-00 p.42-45"
    frs: "Same values in the FRS of BRD-01, 04, 06, 07, 09 and 12; FRS BRD-02 assumes its volumes within the BRD-1 sizing (OQ44)."
    status: ALIGNED
    prio: Must
  - id: NFR-CAP-03
    cat: CAP
    title: Data and document volume
    req: Storage is sized for five years of data and documents with headroom.
    target: "Five years (60 months) at 20% growth a year with at least 30% free capacity at the end of year 5; migrated base up to 1,000,000 client rows and 500,000 open items"
    measure: Capacity plan from the profiling extracts (M3) and the trial migrations, reviewed each quarter
    method: Analysis
    test: Capacity analysis
    stage: After Trial migration 2 (Jul 2027); before go-live
    owner: iorta Solution Architect
    acceptor: Cloud and Digital Operations Engineering (IER owner)
    source: "IER HW & SW Requirements (60 months; 15% growth a year); Data Migration Handbook (1,000,000 clients, 500,000 open items); programme alignment pack 6.3 (database re-sized without documents)"
    frs: "The Handbook states the migration sizing. The IER uses 15% growth; the catalogue uses the 20% of the BRDs, so the IER sizing is updated (open point)."
    status: PROPOSED
    prio: Must
  - id: NFR-CAP-04
    cat: CAP
    title: File sizes
    req: Users attach and upload files up to the limits; larger bulk files go straight to the document store.
    target: "Attachments up to 10 MB a file; uploads through the screens up to 25 MB; bulk files up to 5 GB by direct transfer; limits are parameters"
    measure: Upload at and one step above each limit in SIT
    method: Test
    test: System (boundary)
    stage: SIT
    owner: iorta QA lead
    acceptor: Head, BDOI IT
    source: "Platform configuration (attachment and upload limits); BDO UX guidelines (format hint on upload fields)"
    frs: "The upload screens of each FRS show the limit. Aligned."
    status: PROPOSED
    prio: Should
  - id: NFR-CAP-05
    cat: CAP
    title: Peak periods
    req: The month-end, mid-month and year-end peaks are carried without missing the response targets.
    target: "1.5 times the average daily volume on the 15th, the 30th, month-end and year-end, within NFR-PRF-01 and NFR-PRF-02"
    measure: Peak scenario of the load test (one hour at 1.5 times the design hourly rate)
    method: Test
    test: Performance (peak)
    stage: NFT on Pre-Prod
    owner: iorta Performance Test Lead
    acceptor: Head, Comptrollership
    source: "BRD-2 (15th and 30th); BRD-5 (month-end and year-end); BRD-9 (first quarter); BRD-1 and BRD-6 (08:00-10:00 and 15:00-17:00)"
    frs: "The FRS list the peaks and keep batch jobs outside them. Aligned."
    status: PROPOSED
    prio: Must

  # ------------------------------------------------------------------ Availability
  - id: NFR-AVL-01
    cat: AVL
    title: Availability in the service window
    req: BIBS is available to users throughout the service window.
    target: "99.9% of the service window each month (about 25 minutes of unplanned unavailability in a month of 26 service days)"
    measure: Synthetic sign-in and screen check every minute from the BDO network; monthly service report
    method: Analysis
    test: Operational acceptance
    stage: Pre-Prod soak (Nov 2027); measured monthly from go-live
    owner: iorta Solution Architect
    acceptor: Head, BDOI IT
    source: "Register DCR-134 (99.9% in service hours); BRD-2, 3, 9, 10, 12 (99.9%); BRD-8 (99.99%); BRD-5 Add.1 (100%)"
    frs: "FRS BRD-05 notes that 100% is not measurable; FRS BRD-08 notes 99.99% applied to the dropped portal. The catalogue sets 99.9% for all modules."
    status: DECISION
    prio: Must
  - id: NFR-AVL-02
    cat: AVL
    title: Service window
    req: One service window serves every module; production runs 24 x 7 so jobs and interfaces run outside it.
    target: "06:00 to 22:00 PHT Monday to Saturday, plus month-end weekends; production infrastructure 24 x 7"
    measure: Configuration of the monitoring calendar and the job schedule
    method: Inspection
    test: Operational acceptance
    stage: ORR / PRR (Dec 2027)
    owner: iorta Solution Architect
    acceptor: BIBS Product Owner
    source: "Register DCR-133; IER Assumptions 3 and 4 (non-production 12 x 5, production 24 x 7); BRD service hours from 06:00 (BRD-4, 7, 9) to 22:00 (BRD-1, 4, 6, 9)"
    frs: "FRS BRD-02, 03, 05 and 07 refer to the BRD-1 window 07:00-22:00; the catalogue opens at 06:00 for Collections, Claims and CSF."
    status: DECISION
    prio: Must
  - id: NFR-AVL-03
    cat: AVL
    title: Planned maintenance
    req: Planned work happens in one window outside every module's service hours.
    target: "00:00 to 04:00 PHT; at most 45 minutes of planned downtime a month; announced 5 business days ahead; releases without downtime where the change allows"
    measure: Change calendar and monthly service report
    method: Inspection
    test: Operational acceptance
    stage: ORR / PRR; monthly from go-live
    owner: iorta Solution Architect
    acceptor: Head, BDOI IT
    source: "Register DCR-138 and DCR-134; BRD-10 p.25 and BRD-12 p.14 (00:00-04:00, 45 minutes a month)"
    frs: "FRS BRD-09 notes the BRD window 21:00-05:00 overlaps use (CSQ12); FRS BRD-05 notes 19:00-07:00. The catalogue takes 00:00-04:00."
    status: DECISION
    prio: Must
  - id: NFR-AVL-04
    cat: AVL
    title: No single point of failure
    req: Production keeps running when one pod, node or availability zone fails.
    target: "Backend at least 3 pods over 3 availability zones (at least 2 available during changes); web tier at least 2 pods; PostgreSQL 16 Multi-AZ; Kafka 3 brokers; Valkey primary and replica in two zones"
    measure: Resilience test - stop a pod, drain a node, fail over the database and one zone - with users signed in; no lost transaction
    method: Test
    test: Resilience
    stage: NFT on Pre-Prod
    owner: iorta DevOps and Platform Lead
    acceptor: Cloud and Digital Operations Engineering (IER owner)
    source: "IER HW & SW Requirements (Multi-AZ PROD, MSK 3 brokers); programme alignment pack 6.4 (Kubernetes sizing); component baseline of 8-Oct-2026"
    frs: "The FRS refer to the platform deployment. Aligned."
    status: ALIGNED
    prio: Must
  - id: NFR-AVL-05
    cat: AVL
    title: Graceful degradation
    req: A failed cache or event-streaming service does not stop screen work.
    target: "Valkey outage - sign-in checks fall back to PostgreSQL; Kafka outage - events wait in the outbox and are delivered on recovery with none lost or delivered twice to the consumer"
    measure: Resilience test with Valkey and Kafka stopped for 15 minutes under load
    method: Test
    test: Resilience
    stage: NFT on Pre-Prod
    owner: iorta Solution Architect
    acceptor: Head, BDOI IT
    source: "Security controls (fail-closed fallback of the token checks); platform cache and events design (transactional outbox, dead letters)"
    frs: "Not in the FRS (platform behaviour)."
    status: ALIGNED
    prio: Must

  # ------------------------------------------------------------------ Recovery
  - id: NFR-REC-01
    cat: REC
    title: Recovery point objective (RPO)
    req: At most the target of committed work is lost in a disaster.
    target: "RPO at most 15 minutes for data and documents"
    measure: DR drill - time of the last transaction recovered against the time of the declared failure
    method: Test
    test: Disaster recovery
    stage: DR drill on the DR environment (Dec 2027), then twice a year
    owner: iorta DevOps and Platform Lead
    acceptor: Cloud and Digital Operations Engineering (IER owner)
    source: "IER Architecture Diagram and HW & SW Requirements (RPO 15 minutes, DR replica RPO at most 15 min); register DCR-135, DCR-225; BRD-9 BRCSF-011.001 (backup every 15 minutes)"
    frs: "FRS BRD-02, 03 and 08 quote the BRD value of 24 hours and FRS BRD-04, 07 and 09 4 hours; the IER value of 15 minutes is stricter and governs."
    status: ALIGNED
    prio: Must
  - id: NFR-REC-02
    cat: REC
    title: Recovery time objective (RTO)
    req: Service is restored within the target after a declared disaster; critical services first.
    target: "RTO at most 4 hours; sign-in, Cashiering, Remittance, booking and the GL first"
    measure: DR drill - time from the DR decision to the service open in the DR region with business verification passed
    method: Test
    test: Disaster recovery
    stage: DR drill (Dec 2027), then twice a year
    owner: iorta DevOps and Platform Lead
    acceptor: Head, BDOI IT
    source: "IER (RTO 4 hours); BRD-2, 3, 4, 7, 8, 9 (4 hours); BRD-12 p.14 (critical services 4 hours, full recovery 24 hours); register DCR-135"
    frs: "Every FRS that states an RTO states 4 hours. Aligned."
    status: ALIGNED
    prio: Must
  - id: NFR-REC-03
    cat: REC
    title: Backup
    req: Data and documents are backed up continuously and kept for the retention period.
    target: "Continuous transaction-log archiving plus a base backup every 4 hours; backups encrypted and kept 7 years; document store versioned with cross-region replication"
    measure: Backup reports and the restore test of NFR-REC-04
    method: Inspection
    test: Operational acceptance
    stage: ORR / PRR
    owner: iorta DevOps and Platform Lead
    acceptor: Cloud and Digital Operations Engineering (IER owner)
    source: "Register DCR-102, DCR-135, DCR-136; BRD-00 p.45 (every 4 hours, kept 5 years); BRD-2 and BRD-8 (kept 7 years)"
    frs: "FRS BRD-02 and BRD-08 keep backups 7 years; FRS BRD-01, 04, 05, 10, 12 quote 5 years. The catalogue takes 7 years (the longest)."
    status: DECISION
    prio: Must
  - id: NFR-REC-04
    cat: REC
    title: Restore and DR drills
    req: Recovery is proven before go-live and kept proven afterwards.
    target: "Point-in-time restore tested every quarter; DR failover drill before go-live (Dec 2027) and twice a year after; each with a written result"
    measure: Drill reports with RPO and RTO achieved
    method: Test
    test: Disaster recovery
    stage: Pre-Prod and DR (Dec 2027); quarterly and half-yearly after go-live
    owner: iorta DevOps and Platform Lead
    acceptor: Head, BDOI IT
    source: "Operations runbook (quarterly restore test); IER DR environment"
    frs: "Not in the FRS."
    status: PROPOSED
    prio: Must
  - id: NFR-REC-05
    cat: REC
    title: DR region
    req: A second AWS region hosts the DR copy of BIBS once BDOI confirms data residency.
    target: "Database cross-region replica, document store cross-region replication, standby Kubernetes cluster scaled from 0 to 6 backend pods at failover"
    measure: DR environment acceptance and the DR drill
    method: Test
    test: Disaster recovery
    stage: DR environment ready by 1 Nov 2027 (DEP-25)
    owner: iorta DevOps and Platform Lead
    acceptor: Cloud and Digital Operations Engineering (IER owner)
    source: "IER PROD DR (cross-region read replica) and diagram (warm standby); register DCR-225; programme alignment pack 6.4; IQ26"
    frs: "Not in the FRS."
    status: DECISION
    prio: Must

  # ------------------------------------------------------------------ Scalability
  - id: NFR-SCL-01
    cat: SCL
    title: Horizontal scaling without downtime
    req: The web, jobs and integration workloads scale out and in without interrupting users.
    target: "Production backend 3 to 6 pods in year 1 and 4 to 8 in year 5 by CPU-based autoscaling; a scale-out completes within 5 minutes"
    measure: Step-load test from the design load to the peak; pod count and response times recorded
    method: Test
    test: Performance (stress)
    stage: NFT on Pre-Prod
    owner: iorta DevOps and Platform Lead
    acceptor: Cloud and Digital Operations Engineering (IER owner)
    source: "Programme alignment pack 6.4; BRD-7 p.37 (no downtime when scaling the application); IER Kubernetes guideline 9 (autoscaling)"
    frs: "FRS BRD-07 refers to the Technical Specification. Aligned."
    status: ALIGNED
    prio: Must
  - id: NFR-SCL-02
    cat: SCL
    title: Data-tier scaling
    req: Database storage grows online; a compute change of the managed database fits the maintenance window.
    target: "Storage grows without downtime; a compute class change at most 120 minutes of downtime, inside the maintenance window"
    measure: Change rehearsal on Pre-Prod
    method: Test
    test: Operational acceptance
    stage: Pre-Prod (Nov 2027)
    owner: iorta DevOps and Platform Lead
    acceptor: Cloud and Digital Operations Engineering (IER owner)
    source: "BRD-4 p.54-55 and BRD-7 p.37 (up to 120 minutes for data storage scaling)"
    frs: "FRS BRD-04 and BRD-07 quote the BRD. Aligned."
    status: ALIGNED
    prio: Should
  - id: NFR-SCL-03
    cat: SCL
    title: Stateless application tier
    req: Any pod serves any request; a scheduled job runs once across pods.
    target: "No user session state in the pods; each job run holds a cluster-wide lock; 0 duplicate job runs in the volume test"
    measure: Inspection of the deployment; job run history with several pods in SIT and NFT
    method: Inspection
    test: System integration
    stage: SIT (two pods from Jan 2027); NFT
    owner: iorta Solution Architect
    acceptor: Head, BDOI IT
    source: "Operations runbook (stateless application, job lock); programme alignment pack 6.4 (SIT runs two pods to test the job lock)"
    frs: "Not in the FRS."
    status: ALIGNED
    prio: Must
  - id: NFR-SCL-04
    cat: SCL
    title: Growth headroom
    req: The production cluster carries the year-5 load with headroom.
    target: "At the year-5 peak, CPU and memory use of the cluster below 70%"
    measure: Resource metrics during the year-5 volume and peak tests
    method: Test
    test: Performance (stress)
    stage: NFT on Pre-Prod
    owner: iorta Performance Test Lead
    acceptor: Cloud and Digital Operations Engineering (IER owner)
    source: "IER K8S sheets (threshold 0.79 on worker nodes); programme alignment pack 6.4"
    frs: "Not in the FRS."
    status: PROPOSED
    prio: Should

  # ------------------------------------------------------------------ Security
  - id: NFR-SEC-01
    cat: SEC
    title: Single sign-on with EIAM
    req: BDO users sign in once with their enterprise identity; BIBS keeps the roles.
    target: "Every BDO user signs in through EIAM (Microsoft Entra ID) by OpenID Connect or SAML 2.0; local passwords only for the named break-glass administrators"
    measure: SIT sign-in cases for both protocols; list of local accounts at go-live
    method: Test
    test: System integration; security
    stage: SIT (after the EIAM specification, DEP-07)
    owner: iorta Security Lead
    acceptor: BDOI Information Security
    source: "Drop plan integration EIAM (INT-01); security controls (single sign-on, break-glass); BRD-11 UAM-NFR-11, 17, 33"
    frs: "FRS BRD-11 FR-UA-003 describes directory sign-in through EUA; the EIAM single sign-on replaces it at the next issue (IQ04)."
    status: ALIGNED
    prio: Must
  - id: NFR-SEC-02
    cat: SEC
