# OWASP ASVS 4.0.3 Level 2 control mapping of BIBS (BRD-00), read by build_secdata_pack.py for the workbook
# BIBS_Security_BRD-00_ASVS_L2_Control_Mapping and the summary table of the Security Architecture.
statuses:
  - {status: Met, meaning: "BIBS meets the requirement with the control and evidence named"}
  - {status: Partly met, meaning: "A control exists; the gap and its action are named with owner and date"}
  - {status: Planned, meaning: "No control yet in BIBS; the action is planned with owner and date"}
  - {status: BDOI, meaning: "Met by a BDOI or BDO platform service (EIAM, Apigee X, PKI, SIEM, DNS); BDOI confirms"}
  - {status: Not applicable, meaning: "BIBS has no such feature (for example GraphQL, SMS one-time codes)"}
cover_notes:
  - "Standard: OWASP Application Security Verification Standard 4.0.3, Level 2 (259 requirements). The requirement texts are those of the standard, published by the OWASP Foundation under the Creative Commons Attribution-ShareAlike 3.0 licence; a few words are adapted to the terms used in BIBS documents."
  - "Scope: the BIBS application (web client, backend, its Kubernetes deployment and its delivery pipeline) as of 08 October 2026. Infrastructure services run by BDO (EIAM, Apigee X, PKI, DNS, SIEM) are marked BDOI."
  - "Evidence names the control, the configuration or the pipeline job an assessor checks; the Security Architecture v1.0 explains each control. Gap actions are listed as open points SEC-xx and PRV-xx in chapter 15 of the Security Architecture."
  - "Use: the penetration test (November to December 2027) and BDOI Information Security's review verify a sample of the Met rows and every Partly met and Planned row."
owasp_top10:
  - id: A01
    name: Broken Access Control
    controls: "Permission check on every controller method; central company and branch data scope (fail closed); maker-checker and second approval; separation-of-duties rules; authorisation limits; CORS allow list; directory listing off"
    asvs: V4, V13.1.4, V1.4
    verify: "Architecture rule and data scope coverage check in the pipeline; negative access cases per persona in the test plans; penetration test"
  - id: A02
    name: Cryptographic Failures
    controls: "TLS 1.2/1.3 on every hop (verify-full to PostgreSQL); HSTS; SSE-KMS with BDOI-owned keys; RDS, Valkey and MSK encryption at rest; AES-256-GCM for second-factor secrets; BCrypt cost 12; no secrets in code"
    asvs: V6, V8.3.7, V9
    verify: "Start-up safeguards refuse plaintext in production; TLS scan of the edge; configuration review"
  - id: A03
    name: Injection
    controls: "JPA and bound parameters only (scan of 8 October 2026: no request value concatenated into SQL); Bean Validation on every request; React escaping; CSV formula neutralisation; XML parsers without DTDs; no eval"
    asvs: V5
    verify: "CodeQL and the SpotBugs security plug-in on every pipeline; DAST; penetration test"
  - id: A04
    name: Insecure Design
    controls: "STRIDE threat model per trust boundary; security requirements in every FRS; four eyes on money, access and master data; modular monolith with enforced module boundaries"
    asvs: V1, V11
    verify: "Threat model review per drop; architecture rules in the pipeline"
  - id: A05
    name: Security Misconfiguration
    controls: "Production start-up safeguards; hardened containers (non-root, read-only, no capabilities, restricted Pod Security); NetworkPolicies deny by default; security headers and CSP; API documentation and seed data refused in production"
    asvs: V14
    verify: "Trivy configuration and image scan; kubeconform; DAST baseline scan"
  - id: A06
    name: Vulnerable and Outdated Components
    controls: "OWASP dependency-check (CVSS 7 or higher fails), npm audit (high fails), Trivy (high and critical with a fix fail); weekly update proposals; SBOM per pipeline; time-boxed exceptions"
    asvs: V14.2, V1.14.3
    verify: "Pipeline gates; exception register reviewed monthly"
  - id: A07
    name: Identification and Authentication Failures
    controls: "Single sign-on with EIAM (OIDC or SAML 2.0); TOTP second factor; lockout after 3 failures; rate limits; server-side sessions with idle (30 min) and absolute (8 h) limits; refresh token rotation with reuse detection; break-glass accounts with second factor"
    asvs: V2, V3
    verify: "Sign-in, single sign-on and second-factor integration checks; penetration test"
  - id: A08
    name: Software and Data Integrity Failures
    controls: "Pipeline actions pinned by content hash; scanners verified by SHA-256; base images pinned by digest; no Java deserialisation of untrusted data; insert-only audit and ledger tables; image signing planned (SEC-11)"
    asvs: V10, V5.5, V14.2
    verify: "Pipeline review; gitleaks; Trivy"
  - id: A09
    name: Security Logging and Monitoring Failures
    controls: "Insert-only audit trail; sign-in audit; access change log; security store alarm and alerts; log forging protection; metrics on the management port; forwarding to the BDO SIEM (SEC-07)"
    asvs: V7, V8.1.4, V11.1.7
    verify: "Audit reports of BRD-11; SIEM use cases with BDOI Information Security"
  - id: A10
    name: Server-Side Request Forgery
    controls: "No outbound URL from user input; outbound addresses from configuration; egress NetworkPolicies to named subnets and VPC interface connections; file metadata never used as a URL"
    asvs: V5.2.6, V12.6.1
    verify: "Code review; penetration test"
requirements:
- id: V1.1.1
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.1 Secure Software Development Lifecycle
  text: Verify the use of a secure software development lifecycle that addresses security in all stages of development.
  status: Met
  how: 'The delivery follows a secure development lifecycle: security requirements in the FRS (BRD-11 and the non-functional
    requirements), threat model (Security Architecture chapter 9), peer review of every change, static and dependency analysis,
    secret detection and image scanning on every pipeline, penetration test before go-live.'
  evidence: Security Architecture chapters 9 and 10; quality gates of the CI pipeline; change register
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.1.2
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.1 Secure Software Development Lifecycle
  text: Verify the use of threat modeling for every design change or iteration planning to identify threats, plan for countermeasures,
    facilitate appropriate risk responses, and guide security testing.
  status: Partly met
  how: A STRIDE threat model per trust boundary is kept in the Security Architecture and reviewed at each drop.
  evidence: Security Architecture chapter 9
  gap: 'Review of the threat model for every change that adds a trust boundary or an integration: add it to the definition
    of done of the change register. iorta TechNXT, from 31 Oct 2026'
  owner: iorta TechNXT
  due: 31 Oct 2026
- id: V1.1.3
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.1 Secure Software Development Lifecycle
  text: Verify that all user stories and features contain functional security constraints, such as "As a user, I should be
    able to view and edit my profile. I should not be able to view or edit anyone else's profile"
  status: Met
  how: Every FRS functional requirement names its permission, data scope and the maker-checker rule; test plans carry negative
    access cases per persona.
  evidence: FRS BRD-01 to BRD-13 (preconditions, rules); test plans (access cases); persona menus
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.1.4
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.1 Secure Software Development Lifecycle
  text: Verify documentation and justification of all the application's trust boundaries, components, and significant data
    flows.
  status: Met
  how: Trust boundaries, components and data flows are documented with diagrams.
  evidence: Security Architecture chapters 2 and 9; Programme Alignment (integration context, deployment)
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.1.5
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.1 Secure Software Development Lifecycle
  text: Verify definition and security analysis of the application's high-level architecture and all connected remote services.
  status: Met
  how: The high-level architecture and every connected service (EIAM, UIDM-ISC, Apigee X, S3, Kafka, Valkey, SMTP, bank and
    insurer files) are analysed in the threat model.
  evidence: Security Architecture chapters 2 and 9; Integration Inventory
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.1.6
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.1 Secure Software Development Lifecycle
  text: Verify implementation of centralized, simple (economy of design), vetted, secure, and reusable security controls to
    avoid duplicate, missing, ineffective, or insecure controls.
  status: Met
  how: 'Security controls are central and reused: one security filter chain for users, one for system-to-system calls, one
    permission model, one data scope guard, one audit service, one file store with malware scan.'
  evidence: Security filter chains; data scope guard and interceptor; architecture rules that fail the pipeline when a company
    service interface has no scope check
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.1.7
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.1 Secure Software Development Lifecycle
  text: Verify availability of a secure coding checklist, security requirements, guideline, or policy to all developers and
    testers.
  status: Met
  how: The developer guide and the quality gates set the secure coding rules; the static analysis rules enforce them on every
    change.
  evidence: Developer Guide; Quality Gates; SpotBugs with its security plug-in, PMD, Checkstyle, SonarJS rule sets
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.2.1
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.2 Authentication Architecture
  text: Verify the use of unique or special low-privilege operating system accounts for all application components, services,
    and servers.
  status: Met
  how: Containers run as dedicated non-root users (backend uid 10001, nginx uid 101) with a read-only root file system, no
    Linux capabilities, no privilege escalation and the RuntimeDefault seccomp profile; the database runtime login is least-privilege.
  evidence: Kubernetes deployments (security context); Pod Security level restricted; database roles (DEPLOYMENT, Database
    roles)
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.2.2
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.2 Authentication Architecture
  text: Verify that communications between application components, including APIs, middleware and data layers, are authenticated.
    Components should have the least necessary privileges needed.
  status: Met
  how: 'Every connection is authenticated: PostgreSQL with its own login, Valkey with an ACL user, Kafka with SASL SCRAM-SHA-512
    or IAM, AWS services through the IAM role of the pod''s service account, BDO systems through Apigee X tokens.'
  evidence: Start-up safeguards refuse a missing credential; IRSA service accounts; integration security chain
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.2.3
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.2 Authentication Architecture
  text: Verify that the application uses a single vetted authentication mechanism that is known to be secure, can be extended
    to include strong authentication, and has sufficient logging and monitoring to detect account abuse or breaches.
  status: Met
  how: Users sign in through EIAM (Microsoft Entra ID) with OpenID Connect or SAML 2.0; BIBS then issues its own short-lived
    access token bound to a server-side session. Local passwords are kept only for break-glass administrators.
  evidence: Single sign-on module; sign-in session service; parameter AUTH_MODE
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.2.4
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.2 Authentication Architecture
  text: Verify that all authentication pathways and identity management APIs implement consistent authentication security
    control strength, such that there are no weaker alternatives per the risk of the application.
  status: Met
  how: All sign-in paths end in the same session and second-factor rules; break-glass administrators always need the second
    factor; system calls use a separate chain that refuses user tokens.
  evidence: Sign-in completion and second-factor step; integration security chain
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.4.1
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.4 Access Control Architecture
  text: Verify that trusted enforcement points, such as access control gateways, servers, and serverless functions, enforce
    access controls. Never enforce access controls on the client.
  status: Met
  how: Access control is enforced on the server for every request (method security with fine-grained permissions); the web
    client only hides what the server refuses.
  evidence: Method-level permission checks on every controller; persona menus derived from the same permissions
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.4.4
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.4 Access Control Architecture
  text: Verify the application uses a single and well-vetted access control mechanism for accessing protected data and resources.
    All requests must pass through this single mechanism to avoid copy and paste or insecure alternative paths.
  status: Met
  how: 'One mechanism: the Spring Security filter chain and method security with the BIBS permission model, plus the central
    data scope guard.'
  evidence: Security filter chain; data scope interceptor and body advice
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.4.5
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.4 Access Control Architecture
  text: Verify that attribute or feature-based access control is used whereby the application checks the user's authorization
    for a feature/data item rather than just their role. Permissions should still be allocated using roles.
  status: Met
  how: Permissions are checked per function (about 300 permissions bundled into roles) and per data item (company and branch
    data scope, authorisation limits, maker-checker).
  evidence: Permission catalogue; data scope design; authorisation limits
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.5.1
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.5 Input and Output Architecture
  text: Verify that input and output requirements clearly define how to handle and process data based on type, content, and
    applicable laws, regulations, and other policy compliance.
  status: Met
  how: Input and output handling is defined per screen and upload template in the FRS (types, lengths, lists of values) and
    per record class for retention and privacy.
  evidence: FRS field tables; upload templates; record classes of the file store
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.5.2
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.5 Input and Output Architecture
  text: Verify that serialization is not used when communicating with untrusted clients. If this is not possible, ensure that
    adequate integrity controls (and possibly encryption if sensitive data is sent) are enforced to prevent deserialization
    attacks including object injection.
  status: Met
  how: No native Java serialisation crosses a trust boundary; clients exchange JSON bound to typed request objects; Kafka
    events carry a versioned JSON envelope.
  evidence: Request objects with Bean Validation; event envelope (schema version 1)
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.5.3
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.5 Input and Output Architecture
  text: Verify that input validation is enforced on a trusted service layer.
  status: Met
  how: Validation runs in the backend service layer (Bean Validation on every request object, business rules in the services)
    whatever the client checks.
  evidence: Request objects; business rule exceptions (status 422)
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.5.4
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.5 Input and Output Architecture
  text: Verify that output encoding occurs close to or by the interpreter for which it is intended.
  status: Met
  how: 'Encoding is done by the interpreter: React escapes all rendered text, the database driver binds parameters, the CSV
    renderer neutralises formulas, the logger neutralises line breaks.'
  evidence: Web client (no raw HTML insertion); CSV report renderer; log message converter
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.6.1
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.6 Cryptographic Architecture
  text: Verify that there is an explicit policy for management of cryptographic keys and that a cryptographic key lifecycle
    follows a key management standard such as NIST SP 800-57.
  status: Partly met
  how: BDOI owns the customer-managed KMS keys and the rotation policy (decision of 26-Sep-2026); application keys (token
    signing, second-factor encryption, masking) are in AWS Secrets Manager with a rotation procedure.
  evidence: Document storage decision 4; Security Architecture chapter 6
  gap: BDOI to confirm the key management standard and rotation periods (open point SEC-04)
  owner: BDOI Information Security
  due: 31 Jan 2027
- id: V1.6.2
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.6 Cryptographic Architecture
  text: Verify that consumers of cryptographic services protect key material and other secrets by using key vaults or API
    based alternatives.
  status: Met
  how: Secrets come from AWS Secrets Manager through the secret of the namespace; encryption at rest uses KMS keys that never
    leave KMS.
  evidence: External Secrets or release pipeline; KMS key policies
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.6.3
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.6 Cryptographic Architecture
  text: Verify that all keys and passwords are replaceable and are part of a well-defined process to re-encrypt sensitive
    data.
  status: Met
  how: 'Every key and password is replaceable: the second-factor key rotates with a previous-key setting and re-encryption
    at next use; the token signing key rotates with re-issue through the refresh cookie; KMS keys rotate without data re-encryption
    by the application.'
  evidence: Configuration reference (previous MFA key); runbook (key rotation)
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.6.4
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.6 Cryptographic Architecture
  text: Verify that the architecture treats client-side secrets--such as symmetric keys, passwords, or API tokens--as insecure
    and never uses them to protect or access sensitive data.
  status: Met
  how: The web client holds no secret; it receives a short-lived access token only.
  evidence: Web client token handling (session storage only)
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.7.1
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.7 Errors, Logging and Auditing Architecture
  text: Verify that a common logging format and approach is used across the system.
  status: Met
  how: 'One log format for every component: ISO-8601 time with offset, level, thread, logger, message; container output collected
    by the platform.'
  evidence: Logging configuration (console pattern)
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.7.2
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.7 Errors, Logging and Auditing Architecture
  text: Verify that logs are securely transmitted to a preferably remote system for analysis, detection, alerting, and escalation.
  status: BDOI
  how: BIBS writes to the container output; the platform ships it to the BDO log platform and SIEM.
  evidence: Deployment (container logging)
  gap: BDOI IT to name the log platform and SIEM and the log forwarder (open point SEC-07)
  owner: BDOI IT
  due: 31 Mar 2027
- id: V1.8.1
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.8 Data Protection and Privacy Architecture
  text: Verify that all sensitive data is identified and classified into protection levels.
  status: Met
  how: Personal and sensitive data are identified per domain and record class (client KYC, employee benefits members, screening
    cases, payee bank accounts).
  evidence: Data Architecture chapter 10 (data classification); record classes
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.8.2
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.8 Data Protection and Privacy Architecture
  text: Verify that all protection levels have an associated set of protection requirements, such as encryption requirements,
    integrity requirements, retention, privacy and other confidentiality requirements, and that these are applied in the architecture.
  status: Partly met
  how: Each protection level has its controls (encryption, access class, masking outside production, retention, download logging).
  evidence: Data Architecture chapter 10; Security Architecture chapter 12
  gap: BDOI Information Security to approve the classification and the controls per level (open point SEC-09)
  owner: BDOI Information Security
  due: 31 Jan 2027
- id: V1.9.1
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.9 Communications Architecture
  text: Verify the application encrypts communications between components, particularly when these components are in different
    containers, systems, sites, or cloud providers.
  status: Met
  how: 'TLS on every hop: load balancer to pods, pods to PostgreSQL (verify-full), Valkey, Kafka, S3 and AWS services, Apigee
    X and SMTP (STARTTLS).'
  evidence: Encryption in transit table (DEPLOYMENT); start-up safeguards refuse plaintext in production
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.9.2
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.9 Communications Architecture
  text: Verify that application components verify the authenticity of each side in a communication link to prevent person-in-the-middle
    attacks. For example, application components should validate TLS certificates and chains.
  status: Met
  how: 'Certificates are validated: RDS CA bundle with verify-full, AWS Private CA chain for pod certificates, provider key
    sets for OIDC and Apigee tokens.'
  evidence: Database TLS settings; cert-manager certificates
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.10.1
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.10 Malicious Software Architecture
  text: Verify that a version control system is in use, with procedures to ensure that check-ins are accompanied by issues
    or change tickets. The version control system should have access control and identifiable users to allow traceability
    of any changes.
  status: Met
  how: Version control with access control and named users; every change is reviewed and linked to its change or requirement
    reference.
  evidence: Version control and merge rules; change register
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.11.1
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.11 Business Logic Architecture
  text: Verify the definition and documentation of all application components in terms of the business or security functions
    they provide.
  status: Met
  how: Every component and module is documented with its business and security function.
  evidence: Solution architecture; module guides; Security Architecture chapter 2
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.11.2
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.11 Business Logic Architecture
  text: Verify that all high-value business logic flows, including authentication, session management and access control,
    do not share unsynchronized state.
  status: Met
  how: Authentication, session and access state live in PostgreSQL (session log, data scope) with Valkey only as a cache;
    checks fail closed when a store does not answer.
  evidence: Session log; token denylist fallback; fail-closed filter
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.12.2
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.12 Secure File Upload Architecture
  text: Verify that user-uploaded files - if required to be displayed or downloaded from the application - are served by either
    octet stream downloads, or from an unrelated domain, such as a cloud file storage bucket. Implement a suitable Content
    Security Policy (CSP) to reduce the risk from XSS vectors or other attacks from the uploaded file.
  status: Met
  how: Files are served as downloads (Content-Disposition attachment, no-store) or by short-lived presigned links from the
    S3 bucket domain.
  evidence: File downloads; S3 file store
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.14.1
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.14 Configuration Architecture
  text: Verify the segregation of components of differing trust levels through well-defined security controls, firewall rules,
    API gateways, reverse proxies, cloud-based security groups, or similar mechanisms.
  status: Met
  how: 'Network segregation: WAF, internal load balancer, Kubernetes Gateway API routes, NetworkPolicies that deny by default,
    Apigee X for systems, data services in private subnets.'
  evidence: Deployment (edge, network policies)
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.14.2
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.14 Configuration Architecture
  text: Verify that binary signatures, trusted connections, and verified service interfaces are used to deploy binaries to
    remote devices.
  status: Partly met
  how: Images are pushed to ECR from the pipeline and deployed by digest-pinned manifests.
  evidence: Release pipeline; Kustomize overlays
  gap: Sign the images (cosign or AWS Signer) and verify signatures at admission (open point SEC-11)
  owner: iorta TechNXT
  due: 30 Jun 2027
- id: V1.14.3
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.14 Configuration Architecture
  text: Verify that the delivery pipeline warns of out-of-date or insecure components and takes appropriate actions.
  status: Met
  how: The pipeline fails on vulnerable dependencies (OWASP dependency-check CVSS 7 or higher, npm audit high, Trivy high
    and critical) and proposes updates weekly.
  evidence: CI pipeline jobs; dependency update proposals
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.14.4
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.14 Configuration Architecture
  text: Verify that the delivery pipeline contains a pipeline step to automatically package and verify the secure deployment
    of the application, particularly if the application infrastructure is software defined, such as cloud environment provisioning
    scripts.
  status: Met
  how: The pipeline compiles, tests, scans and packages the images; the Kubernetes manifests are validated and applied from
    the overlays.
  evidence: CI pipeline; kustomize and kubeconform checks
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.14.5
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.14 Configuration Architecture
  text: Verify that application deployments adequately isolate, containerize and/or isolate at the network level to delay
    and deter attackers from attacking other applications, especially when they are performing sensitive or dangerous actions
    such as deserialization.
  status: Met
  how: Each workload runs in its own deployment and service account with NetworkPolicies; pods never call each other; the
    namespace enforces the restricted Pod Security level.
  evidence: Deployment (workloads, network policies)
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V1.14.6
  chapter: V1 Architecture, Design and Threat Modeling
  section: V1.14 Configuration Architecture
  text: Verify the application does not use unsupported, insecure, or deprecated client-side technologies such as NSAPI plugins,
    Flash, Shockwave, ActiveX, Silverlight, NACL, or client-side Java applets.
  status: Met
  how: The web client is a React single-page application; no plug-ins or applets.
  evidence: Web client
  gap: null
  owner: iorta TechNXT
  due: ''
- id: V2.1.1
  chapter: V2 Authentication
  section: V2.1 Password Security
  text: Verify that user set passwords are at least 12 characters in length (after multiple spaces are combined).
  status: Partly met
  how: BDO users authenticate at EIAM, which applies the BDO password policy. Local passwords (break-glass only) need at least
    10 characters with upper and lower case, digit and symbol, as the BRD-11 password rule asks.
  evidence: Password policy check; parameter set of the password rules
  gap: Raise the local minimum to 12 characters (open point SEC-02)
  owner: iorta TechNXT
  due: 31 Jan 2027
- id: V2.1.2
