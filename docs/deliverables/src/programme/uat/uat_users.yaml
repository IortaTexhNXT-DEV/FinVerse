# UAT walkthrough users workbook (programme level, BRD-00): BRD -> personas -> UAT sign-in IDs.
# Built by build_uat_users.py into Programme/UAT/BIBS_UAT_BRD-00_Walkthrough_Users_and_Sign-in_v<version>.xlsx.
#
# Per BRD, the personas in the order of the business flow (maker before checker). Each persona:
#   persona  the business role as named in the persona table of the FRS (BRD-13: of the handbook)
#   role     the group profile code the persona's users hold (the profile name is read from seed_users.yaml)
#   users    the sign-in IDs, each a string or {id, note}; the first is the one the walkthrough script uses
#   unit     the unit of the user (default: units below, by group profile)
#   does     what the user does in the walkthrough (default: the responsibilities of the FRS persona table)
#   scope    the approval limits or data scope beyond what seed_users.yaml gives (authorisation limit, companies)
#   remarks  anything the business needs to know about the user
#   no_user  the reason why the persona has no UAT sign-in (a decision of BDOI); such a persona has no role/users
# menus gives the menu path to start of a sign-in ID (default: the menu entry of the user's first walkthrough step, or
# the first entry of the user's menu in the sections of the BRD); the builder checks that the user's menu has it.
# extra_steps adds the steps of an FRS process flow that the storyboard does not show.
# aliases maps the persona names of the walkthrough storyboards to the persona of the sheet when they differ.
# step_users gives the sign-in ID of a walkthrough step whose user is not the first user of its persona.
# exclude_steps drops steps of the insurer suite (removed from the platform). The persona list of each BRD is checked
# against seed_users.yaml (the users and group profiles of a fresh seed environment) by the builder, and by the
# backend integration test UatWalkthroughUsersIT.

