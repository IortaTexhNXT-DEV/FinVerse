         result: "The file is ready for the checker"}
      - {step: FR-DM-125.2, flow: FR-DM-125 Renewal advices already sent before go-live, persona: Renewal processing team (checker),
         action: "Compares the file with the trackers (row counts per tracker and 10 sample rows) and releases it",
         result: "The file goes to the Migration Operator"}
      - {step: FR-DM-125.3, flow: FR-DM-125 Renewal advices already sent before go-live, persona: Migration Operator,
         action: "Uploads the file with its control file on Extracts, plans the batch and validates it",
         result: "The batch is validated; the rejected rows are on the batch with an Excel rejection report and correction columns"}
      - {step: FR-DM-125.4, flow: FR-DM-125 Renewal advices already sent before go-live, persona: Renewal processing team (maker),
         action: "Corrects each rejected row in the correction columns and prepares the resubmission with the corrected rows only (Resubmit Corrected Rows)",
         result: "The resubmission waits for the checker on the Resubmissions tab of Batches"}
      - {step: FR-DM-125.5, flow: FR-DM-125 Renewal advices already sent before go-live, persona: Renewal processing team (checker),
         action: "Reviews each correction against the tracker and approves the resubmission, or returns it with a reason",
         result: "Approved, or Returned to the maker; the maker of a resubmission cannot approve it: A record cannot be authorized by the user who maintained it"}
      - {step: FR-DM-125.6, flow: FR-DM-125 Renewal advices already sent before go-live, persona: Migration Operator,
         action: "Loads the approved resubmission as a rerun batch after the load approval (G4)",
         result: "The valid rows are loaded; the go-live renewal extraction records the advices already sent, so that no advice is sent twice"}

# Personas without a UAT sign-in, and why (Gaps fixed sheet, BDOI decision).
no_user:
  portal: >-
    No UAT sign-in: insurers and client HR take part by e-mail, because the BDOI drop plan has no partner portal for
    Drop 2. A portal sign-in is added if BDOI brings the portal into a drop.
  fulfilment: >-
    No UAT sign-in: the Fulfilment Unit group profile and the membership of the 53 units are set up when BDOI
    confirms the units, their members and the first routing table (CLR-CSF-10).
  operations_lead: >-
    No UAT sign-in: BDOI names the existing team-lead group profile that monitors the screening SLAs and escalations
    (SQ19); the users of that profile then take this part.

# Gaps fixed sheet: personas of a BRD / FRS that had no UAT user, or no user with exactly that group profile, or no
# second user where the flow needs four eyes, before 08-Oct-2026, and what was done.
