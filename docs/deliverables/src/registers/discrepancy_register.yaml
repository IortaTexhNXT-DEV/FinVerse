# Built into Excel by build_discrepancy_register.py (same folder). Edit this file, then re-run the script.
#
# Text fields are YAML single-quoted strings: write an apostrophe as two ('').
# Page numbers are PDF page numbers of the source file in docs/source-documents/.
# Open questions are read from the "Open questions" tables of the specs in docs/requirements/;
# their status and grouping are kept in the sections question_status and question_groups below.

