# BDOI owner of an item, by the BRD involved (per the BRD approval sheets). Items with several BRDs name the owner explicitly.
owners:
  BRD-00: 'Business Project Services (BRD owner) with the BIBS Product Owner'
  BRD-01: 'Marketing and Processing - New Business (Product Owner)'
  BRD-02: 'Operations - Financial Transactions and Processing'
  BRD-03: 'Marketing Business Services (MBS) and TSU'
  BRD-04: 'Operations - Collections (Head of BDOI Operations)'
  BRD-05: 'Comptrollership - FRBS, Disbursement and ACSL'
  BRD-06: 'Marketing and Processing - Renewal (RMEL)'
  BRD-07: 'Claims and Risk Management'
  BRD-08: 'Employee Benefits - Marketing, Processing and Collection'
  BRD-09: 'Contact Center Management / Alternative Distribution'
  BRD-10: 'Compliance (Chief Compliance Officer)'
  BRD-11: 'UAM process owner (Product Owner) with ITIO'
  BRD-12: 'CBG and Non-CBG Marketing - Submitted Policies'
  BRD-13: 'Enterprise Services Group - Business Project Services (Program Manager) with BDOI Comptrollership and Operations'
  RL: 'Report SMEs named in the Report List'
  CROSS: 'BIBS Product Owner, with the owners of the BRDs involved'

severity_rule:
  - ['High', 'The item changes what is built or how data is structured, affects money (premium, commission, GL, remittance), regulatory compliance, security or access, or leaves a requirement without a testable result. Resolve before the FRS of the area is signed off.']
  - ['Medium', 'The item changes a rule, value, screen, report or test case, but a documented default can be built now and changed later by configuration or a small change.']
  - ['Low', 'Document quality only (typing, numbering, headings, working notes, names). No effect on the build; correct it in the next BRD revision.']

type_rule:
  - ['Contradiction within BRD', 'Two statements in the same BRD pack cannot both be met.']
  - ['Conflict between BRDs', 'Two BRDs give different owners, values, roles or rules for the same thing.']
  - ['Gap / missing detail', 'A value, list, layout or rule needed to build or test is missing or marked TBD.']
  - ['Ambiguity', 'The text can be read in more than one way.']
  - ['BRD vs platform', 'The BRD differs from BIBS as built or designed, or assumes a legacy system (EBIX, QPS, ISYS) that BIBS replaces.']
  - ['NFR inconsistency', 'Non-functional values (hours, availability, RPO / RTO, backup, retention, response time, session, password) differ within or between BRDs.']
  - ['Data / numbering issue', 'Duplicate, missing or misnumbered requirement IDs, or data values that do not add up.']
  - ['Document quality', 'Headings, names, dates, working notes, approvals or confidential content in the pack.']

status_rule:
  - ['Open', 'Waiting for a BDOI answer.']
  - ['Answered', 'A signed BDOI document answers the item (quoted in BDOI response). The project applies the answer; BDOI confirms to close.']
  - ['Closed', 'BDOI confirmed the resolution. Resolution date is filled in.']

# The 15 items BDOI is asked to resolve first: [ref, short title, why first]. Shown on the Summary sheet.
priority:
  - [DCR-143, 'Directory sign-in (EUA) for all users', 'Identity source for every BIBS user; the EUA interface is needed before go-live.']
  - [DCR-121, 'BIBS-wide user access matrix', 'Every module''s roles and persona tests depend on it.']
  - [DCR-129, 'Renewal of submitted policies: boundary', 'Two BRDs specify the same renewal letters, hold cover and booking.']
  - [DCR-146, 'One LAMD intake or two', 'Loan status drives both renewal eligibility and submitted-policy buckets.']
  - [DCR-124, 'Submitted-policy buckets', 'FFY, RMU and Fully Paid are on both the renewal and non-renewal side.']
  - [DCR-062, 'Online vs offline renewal disposition', 'Decides the AO disposition screens and the upload path.']
  - [DCR-063, 'Manual initiation vs straight-through renewal', 'Decides the renewal workflow triggers.']
  - [DCR-037, 'Incentive programmes across four BRDs', 'Incentive income; one model for Product Maintenance, Remittance and Commission.']
  - [DCR-014, 'Minimal-balance rules', 'Three overlapping GL rules for small balances.']
  - [DCR-015, 'Paid AR above the DTIP balance', 'Remittance to insurers capped or withheld.']
  - [DCR-005, 'Fire premium tax (PTX 12%)', 'Gross premium on every Fire quotation and invoice.']
  - [DCR-112, 'Sanctions match: block or warn', 'Compliance control on quotation, placement, booking and renewal.']
  - [DCR-135, 'RPO, RTO and backup frequency', 'Sets backup and DR design for the whole platform.']
  - [DCR-136, 'Retention schedule per record type', 'Legal record keeping and the archive design.']
  - [DCR-157, 'Go-live data migration scope', 'Open items and history from EBIX, ISYS, QPS and Excel at cut-over.']

