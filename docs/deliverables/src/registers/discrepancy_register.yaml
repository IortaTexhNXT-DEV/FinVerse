# Values: [status, answering document and ID, answer in short].
question_status:
  Q01: [Partially answered, 'BRD-3 p.12, PMADD01-02', 'The products matrix is maintained in BIBS by MBS / TSU with the hierarchy LOB, subline / type / subtype, coverage / peril. The MTR / PAR matrix files are still not provided.']
  Q05: [Partially answered, 'BRD-3 BRPM.008 / 009 / 012 / 015, PMADD06', 'Package requests: approved by the Marketing TL, TH or UH; TSU TL recommends, TH approves; ManCom sign-off. No amount limits.']
  Q06: [Partially answered, 'BRD-8 BRID-005, 005.01-005.02, 009', 'For EB, insurers use a secure portal or API. Other lines: still e-mail.']
  Q07: [Partially answered, 'BRD-8 BRID-007', 'Standard assigned password or system-generated with a defined syntax, sent separately. The convention itself is still missing.']
  Q08: [Partially answered, 'BRD-9 p.3 footnote 3; BRD-5 FRBS 2.5.0; BRD-13 p.5', 'QPS and EBIX receive client contact updates during coexistence (BRD-9); BRD-13 makes legacy read-only after cutover with no feed required (conflict DCR-202). Accounting is internal to BIBS. Other targets open.']
  Q10: [Partially answered, 'BRD-6 personas, tabs, counters, BRRN.040; BRD-3 PMADD04', 'Renewal stages and statuses, and package negotiation outcomes. Counter mapping still to confirm.']
  Q11: [Partially answered, 'BRD-12 p.4-5; Report List #138, #151', 'Sources named (LFS, HLS, CIU, SPI, LAMD, Loan Booking Report, IA masterlist), all Excel. Layouts and transport open.']
  Q14: [Partially answered, 'BRD-6 BRRN.020; BRD-12, Report List #151', 'Renewal sanitation is rule-based (criteria not listed); submitted-policy criteria listed.']
  Q15: [Partially answered, 'BRD-6 BRRN.022', 'A mandatory unique renewal reference is the matching key; no format given.']
  Q18: [Partially answered, 'BRD-10 SNSRP-302 / 303', 'PEP and high-risk tags are set by rules and trigger reviews. Block vs warn still open (SANC-SQ07).']
  Q21: [Partially answered, 'BRD-6 BRRN.028; BRD-10 SNSRP-102 / 303', 'KYC due is visibility only in renewal; high-risk / PEP clients with an active policy get a review case. Frequency per rating not given.']
  Q23: [Partially answered, 'BRD-8 BRID-002, 005.01, 014; BRD-9 BRCSF-007; BRD-10 SNSRP-601', 'File types listed for EB and CSF; naming syntax for screening documents only. Maximum size open.']
  Q24: [Partially answered, 'BRD-12 BRIDSP-02', 'Submitted policy documents are extracted and confirmed by a user; scanned input implies OCR.']
  Q27: [Partially answered, 'BRD-6 1.009.3.1.33-34; BRD-12 p.5, BRIDSP-24 / 32', 'Hold covers apply to renewals; 30-day hold cover for submitted renewals, accepted within 3-5 days. Expiry handling open.']
  Q28: [Partially answered, 'Report List #65-67', 'Three CLPC billing variants with sample files. Transport and schedule open.']
  Q31: [Partially answered, 'BRD-8 BRID-005.01', 'EB insurers upload policy forms and billing through the portal. Other lines open.']
  Q32: [Partially answered, 'BRD-5 ACSL 2.16.0, DIS 3.27.2', 'Related transactions must link to a single invoice number. No entries given.']
  Q33: [Partially answered, 'BRD-3 PMADD07 / 08; BRD-5 DIS 3.29.2', 'Incentive criteria kept on the products matrix; CPC2 = package Fire / Motor incentive computed per remittance. Rates not given.']
  Q35: [Partially answered, 'BRD-4 BRCLXN.058', 'Multi-year policies are billed per billing cycle. Accounting per cycle open.']
  Q36: [Partially answered, 'BRD-12 BRIDSP-13 / 14', 'FFY accounts get an FFY RA template; FFY is both a renewal and a non-renewal bucket. Payer not stated.']
  Q37: [Partially answered, 'BRD-7 BRCLM.007 / 039; BRD-9 p.3, BRCSF-002; BRD-13 p.5', 'Policy number flows from the policy system to Claims; QPS / EBIX are systems of record for contacts during coexistence; from cutover the new Core holds the trusted client master and reference data (BRD-13 draft).']
