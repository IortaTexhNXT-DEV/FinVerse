# Messages catalogue of BRD-1 New Business: sources, places and the fix the user makes.
# The message texts are read from the code by tools/deliverables/code_facts.py at every build (never typed here).
# This file says where each message appears (by the class or file that raises it) and what the user does.
sources:
  backend_packages: [crm, quotation, nonpackage, account, placement, issuance, booking, bulk, attachment, workflow, lov, nbreport, docgen, messaging]
  backend_classes_extra: [RetentionRule, RetentionService, ReportParameters, ReportVariantService]
  exclude_classes: [ClientPayoutAccounts, ClientRiskService, ClientController, AccessRequestService, PartyService,
                    DocRenditionController, NotificationPreferenceService, BulkController, ProposalTsuController]
  bulk_handlers: [ClientBulkHandler, QuotationRequestBulkHandler, QuotationCreateBulkHandler, QuotationAcceptanceBulkHandler,
                  AccountCreateBulkHandler, AccountUpdateBulkHandler, FfyTaggingBulkHandler, BookingUploadHandler]
  frontend_dirs: [features/crm, features/quotations, features/proposals, features/accounts, features/placement,
                  features/issuance, features/booking, features/bulk, features/workspace, features/nbreports,
                  features/approvals, features/brokingsetup, features/nbadmin/LovPage.tsx, features/nbadmin/LovValueDialog.tsx,
                  features/nbadmin/lovForm.ts, features/nbadmin/RetentionPage.tsx, features/nbadmin/RetentionDialogs.tsx,
                  features/reports/ReportRunnerPage.tsx, features/reports/ReportVariants.tsx, features/reports/reportParams.ts,
                  components/broking, components/attachments]

