# Elements shared by many screens, described once.
common:
  - name: Page header and company
    text: >-
      Every page shows its section and title, a one-line description and its actions on the right. The company in the
      header decides the records shown; lists and reports are always of that company.
  - name: Work lists
    text: >-
      Lists show status tabs or quick filters, a search box, a Filters button for the advanced filters, and the paged
      table ("Showing 1 to n of N results"). A row opens its record. Dates show as dd-MMM-yyyy and times as
      dd-MMM-yyyy HH:mm in Philippine time.
  - name: Record summary and reference chips
    text: >-
      A record opens with its reference (Proposal No., PRF, ARN, invoice), its status badge and the key facts. A
      reference chip copies the reference and an ARN chip opens the account.
  - name: Workflow panel
    text: >-
      Shows the stage, since when, the due time of the stage (SLA, overdue in red) and the assignee, with the actions
      the user may take now. Actions that need a reason (return, void, cancel) open a dialog with the mandatory reason
      from its list of values and an optional comment; the comment is kept in the history and sent with the
      notification. "Workflow notice" in the action tables means the in-app notice NT-01.
  - name: Documents panel
    text: >-
      Lists the documents of the record (File, Type, Description, Size, Uploaded by, Uploaded, SHA-256), with the
      upload bar (document type, description, files and the option to name the files after the record's reference),
      download of one file or a ZIP of the selected files, and removal. Documents linked from related records are
      marked. File type, size, content and malware checks apply to every upload.
  - name: Send via Email dialog
    text: >-
      Shows the proposed recipients, copy, subject and message, the attachments that will be generated, and the
      password protection with an optional hint. Protected attachments are encrypted and the password follows in a
      separate e-mail. The e-mail is queued and its outcome is shown on the record's E-mails tab and in Outbound Messages.
  - name: Notifications and help
    text: >-
      The bell in the header shows the in-app notices with their unread count; a notice opens its record. The Help
      button of each page explains the screen.
  - name: Bulk action results
    text: >-
      An action run on several selected rows processes each record on its own and lists the outcome of each (done or
      the message), so one failure does not stop the others.
