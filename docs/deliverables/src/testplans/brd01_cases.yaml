findings:
  - fr: FR-NB-130
    issue: 'The FRS messages "Invalid user ID or password" and "Your account is locked. Contact the System Administrator" (code "-") differ from the build: "Invalid user name or password" and "Account is locked. Contact your administrator.", both with code AUTHENTICATION_FAILED (HTTP 401).'
    proposal: Quote the built messages and code in FRS v1.1; the cases use the built wording.
  - fr: FR-NB-126
    issue: The FR is parked until BDOI answers Q09 and its only acceptance criterion is "Parked; acceptance criteria are written when Q09 is answered". It cannot be tested beyond checking that the report is not offered.
    proposal: Keep the FR parked in v1.1 and add the acceptance criteria when Q09 is answered; the two cases here only check that nothing is offered.
  - fr: FR-NB-020
    issue: The precondition "BDOI answers Q37" makes the FR untestable except for its one acceptance criterion (the policy number is read-only). The FR does not list the other data elements and their authoritative sources.
    proposal: List the data elements and their source systems once Q37 is answered; until then the cases test only the policy number rule.
  - fr: FR-NB-083
    issue: 'Rule "What happens at expiry without a policy waits for Q27" leaves the outcome of an expired hold cover open; the build raises the alert only.'
    proposal: State the expected outcome at expiry (alert only, return to Marketing or cancellation) when Q27 is answered.
  - fr: FR-NB-001
    issue: 'Several FRs trace to references that are not BRNB IDs ("Annex (p.84-90)", "Appendix A (p.216)", "BRD 2.1.16 (p.180)", "BRD 3.4.2.2.35 (p.208)", "BRD 2.3.1 (p.188)", "Data retention (p.82)"). The coverage by BRD ID lists them as separate items, so the BRD ID count differs from the number of BRNB IDs.'
    proposal: Keep BRD section references in a separate "BRD section" field of the FR header, so that the BRD trace holds requirement IDs only.
  - fr: FR-NB-066
    issue: 'The validation "Enter a valid e-mail address / mobile number" has code "-", but the account contact is checked by the same rules as the client (CLIENT_EMAIL_FORMAT, CLIENT_MOBILE_FORMAT). The FRS does not say whether the account screen returns those codes.'
    proposal: Quote the code the account contact check returns; TC-NB-066.2-01 records the actual message at first run.
  - fr: FR-NB-005
    issue: The FRS says a change to a TSU rule threshold applies to the next evaluation without a release, but does not say whether the change needs maker-checker authorisation like other catalogue masters.
    proposal: State whether TSU rule changes are authorised by a second user; TC-NB-005.3-02 assumes the change is authorised by the approver.
