access:
  - action: Create and update clients
    screen: NEWCLIENT
    permission: CLIENT_MAINTAIN
    allow: [MKT_AO, MKT_TL]
    deny: [PROCESSOR, TSU, AUDITOR]
    denied: New Client is not in the menu; POST /api/v1/crm/clients returns HTTP 403 (ACCESS_DENIED).
    auto: CrmAdminApiIT#clientIsCreatedValidatedAndOnboardedOverHttp
  - action: Verify a client's KYC
    screen: CLIENT
    permission: CLIENT_APPROVE
    allow: [MKT_TL]
    deny: [MKT_AO, PROCESSOR]
    denied: Verify KYC is not shown; the workflow action is refused (WORKFLOW_ACTION_NOT_PERMITTED).
    auto: ClientOnboardingIT#kycIsVerifiedByAnotherUserThanItsMaker
  - action: Create and send quotations
    screen: NEWQT
    permission: QUOTE_MAINTAIN
    allow: [MKT_AO, MKT_TL]
    deny: [TSU, PROCESSOR, NB_APPROVER, AUDITOR]
    denied: New Quotation is not in the menu; POST /api/v1/quotations returns HTTP 403.
    auto: QuotationProposalApiIT#quotationIsCreatedPricedAndSubmittedOverHttp
  - action: Approve quotations
