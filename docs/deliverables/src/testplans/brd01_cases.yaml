scenarios:
  - id: SC-NB-01
    persona: SYSADMIN
    title: Access and administration. Users log in with their role profile and use several tabs; lists of values, access requests and roles change only through maker-checker; the audit log and the retention review are read only.
    pre: SIT/UAT users of TD-NB-01; a second approver available.
  - id: SC-NB-02
    persona: BUSINESS_ADMIN
    title: Product rules and common controls. Every product line runs on one workflow with its own fields and validations; TSU routing, stages, queues, void, document protection, approvals before sending, notifications, audit, documents and bulk uploads work the same for every record.
    pre: Catalogue TD-NB-03; seed records TD-NB-04 to TD-NB-06.
  - id: SC-NB-03
    persona: MKT_AO
    title: Client onboarding. The AO finds or creates a client, avoids duplicates, uploads KYC documents; the TL verifies the KYC and the client is confirmed; tags, instructions, the client 360 view and the KYC review list support servicing.
    pre: Clients TD-NB-02; documents TD-NB-12.
  - id: SC-NB-04
    persona: MKT_AO
    title: Package quotation. A request is captured, quoted, approved by another user, sent protected, accepted by the client and converted into accounts under one ARN; bulk quotations for HLS.
    pre: Quotations TD-NB-04; confirmed client CL-2026-000001.
  - id: SC-NB-05
    persona: TSU
    title: Non-package placement. Marketing raises a PRF, TSU sends the quotation slip, keys in insurer terms, compiles the comparative table and releases the proposal slip; the client accepts and the account is created.
    pre: PRFs TD-NB-05; TSU officers tsu and tsulead.
  - id: SC-NB-06
    persona: MKT_AO
    title: Account creation and validation. Accounts are created singly or in bulk with the premium of Appendix A, checked for duplicates, submitted, returned and validated by Processing; FFY and direct payment are tagged.
    pre: Accounts TD-NB-06; bulk file TD-NB-11.
  - id: SC-NB-07
    persona: PROCESSOR
    title: Payment and placement. CBG Fire accounts are billed through CLPC and released by the payment report; other segments pass the gate by client confirmation; slips are generated per insurer branch and sent; hold covers, insurer returns, cancellation and reactivation are handled.
    pre: Placement data TD-NB-07; payment files TD-NB-13.
  - id: SC-NB-08
    persona: PROCESSOR
    title: Issuance. E-policies are received and matched, the policy number is extracted and confirmed, Insurance Advices are generated for mortgaged accounts, and the E-policy Sender dispatches e-policies and advices protected.
    pre: Issuance data TD-NB-08; e-policy files TD-NB-13.
  - id: SC-NB-09
    persona: PROCESSOR
    title: Booking. Issued accounts are booked with their GL entry and service invoice, singly, in batch, automatically or directly; multi-year policies, endorsements and cancellations are posted.
    pre: Booking data TD-NB-09.
  - id: SC-NB-10
    persona: MKT_TL
    title: Monitoring. The NB dashboard, placement update and operational reports show the state of every record; reports print, download in every format and are saved as variants.
    pre: All seed data; targets and variant TD-NB-10.

frs:
  FR-NB-001:
    scenario: SC-NB-02
    persona: MKT_AO
    screen: NEWQT
    data: [TD-NB-03]
    conditions:
      - A product of any line (for example CGL01) runs through quotation, account, placement, issuance and booking on the same stages as Motor.
      - A product that is not active, or a cover type of another line, cannot be used.
      - A product offered only to one segment cannot be used on another segment.
    cases:
      - c: 1
        type: Workflow
        title: A Liability account follows the Motor stages
        data: [TD-NB-06, TD-NB-03]
        steps:
          - Open ARN-2026-900004 (CGL01) and ARN-2026-900001 (MTR10), History tab of each.
          - Compare the stage list of the workflow panel.
        expected: Both accounts use workflow NB_ACCOUNT with the same stages (Draft, Submitted, Awaiting payment, Ready for placement, Placed, Policy issued, Booked).
        auto: AccountLifecycleIT#accountGoesFromPaymentToBookingAndCancellation
      - c: 2
        type: Negative
        persona: BUSINESS_ADMIN
        screen: PRODUCTS
        title: A product pending authorisation cannot be quoted
        pre: badmin created product CGL91 (Liability) and it is still Pending authorisation.
        steps:
          - As ao, New Quotation; look for CGL91 in the product list; call POST /api/v1/quotations with product CGL91.
        expected: CGL91 is not offered; the API call is refused.
        msg: [Product CGL91 is not authorized or is inactive, PRODUCT_NOT_ACTIVE]
        auto: CatalogIT#productsAreMakerCheckerAndListedInTheInbox
      - c: 2
        type: Negative
        persona: BUSINESS_ADMIN
        screen: PRODUCTS
        title: Cover type of another line is refused
        steps:
          - Products > New Product on line MOTOR with cover type FIRE_LIGHTNING; save.
        expected: Not saved.
        msg: [Cover type FIRE_LIGHTNING does not belong to MOTOR, COVER_TYPE_INVALID]
        auto: CatalogIT#productsAreMakerCheckerAndListedInTheInbox
      - c: 3
        type: Negative
        title: CBG-only product on a CORBANK quotation
        steps:
          - New Quotation for CL-2026-000003 (segment CORBANK) with product PAR01 (offered to CBG only).
        expected: The quotation is not saved.
        msg: [Product PAR01 is not offered to segment CORBANK, SEGMENT_NOT_ALLOWED]
        auto: AccountRulesIT#draftRulesComeFromTheProduct
      - c: 3
        type: Positive
        title: CBG product on a CBG quotation
        steps:
          - New Quotation for CL-2026-000001 (segment CBG) with product PAR01; save.
        expected: The quotation is saved with a QT number.
        auto: QuotationIT#createdQuotationHasNumbersPremiumTemplateVersionAndWorkCase

  FR-NB-002:
    scenario: SC-NB-02
    persona: MKT_AO
    screen: NEWACC
    data: [TD-NB-03, TD-NB-14]
    conditions:
      - A Motor account without an engine number cannot be submitted and the message names the field.
      - A Motor item with a conduction sticker and no plate number meets the plate rule.
      - A rule added by the Business Administrator for one product applies to the next submission without a release.
    cases:
      - c: 1
        type: Negative
        title: Motor account without engine number
        steps:
          - New Account for CL-2026-000001, product MTR10, one vehicle with plate, chassis, make, model and year but no engine number; attach the IDF; click Submit.
        expected: Submission is refused and the check panel names the engine number.
        msg: ["Complete the mandatory fields of {MTR10}: {engine number}", ACCOUNT_INCOMPLETE]
        auto: AccountIT#submitNeedsMinimumFieldsDocumentsAndPremiumThenProcessingValidates
      - c: 2
        type: Positive
        title: Conduction sticker instead of plate number
        steps:
          - Same account with the engine number entered, no plate number and conduction sticker CS-2026-0099; click Submit.
        expected: The account is submitted; the plate rule is met by the conduction sticker.
        auto: AccountRulesIT#draftRulesComeFromTheProduct
      - c: 3
        type: Positive
        persona: BUSINESS_ADMIN
        screen: RULES
        title: New product rule applies without a release
        steps:
          - As badmin open product CGL01, Field Rules tab; add a rule scope Product, target Account, field Contact e-mail, check Presence; have approver authorise it.
          - As ao submit a CGL01 account without a contact e-mail.
        expected: The submission is refused and names the contact e-mail; no deployment was needed.
        auto: CatalogIT#minimumFieldMatrixAppliesTheNarrowestScope
      - c: 3
        type: Negative
        persona: BUSINESS_ADMIN
        screen: RULES
        title: Rule for every product with a wrong scope code
        steps:
          - Add a rule with scope All products and scope code MOTOR; save.
        expected: Not saved.
        msg: ["Rules for every product use the scope code '*'", RULE_SCOPE_INVALID]
        auto: CatalogIT#minimumFieldMatrixAppliesTheNarrowestScope

  FR-NB-003:
    scenario: SC-NB-02
    persona: MKT_AO
    screen: NEWACC
    data: [TD-NB-03]
    conditions:
      - Product features (multi-year, direct payment, FFY, mortgagee) are accepted only where the product allows them.
      - The check panel of a draft lists all missing fields and documents at once.
      - Dates and list values are validated.
    cases:
      - c: 1
        type: Negative
        title: 3-year term on a product without multi-year
        steps:
          - New Account on MTR10 (maximum term 1 year) with a term of 3 years; save.
        expected: Not saved.
        msg: ["Product MTR10 allows a term of up to 1 year(s)", MULTI_YEAR_NOT_ALLOWED]
        auto: AccountRulesIT#draftRulesComeFromTheProduct
      - c: 1
        type: Negative
        title: FFY on a product that is not FFY eligible
        steps:
          - New Account on PAR01 with Free First Year from today; save.
        expected: Not saved.
        msg: [Product PAR01 is not Free First Year eligible, FFY_NOT_ELIGIBLE]
        auto: AccountRulesIT#freeFirstYearIsTaggedAndCancelledWithAudit
      - c: 1
        type: Negative
        title: Direct payment on a product that does not allow it
        steps:
          - New Account on PAR01 with Payment = Direct payment to the insurer; save.
        expected: Not saved.
        msg: [Product PAR01 cannot be paid directly to the insurer, DIRECT_PAYMENT_NOT_ELIGIBLE]
        auto: AccountIT#directPaymentAccountsSkipThePaymentGate
      - c: 2
        type: Positive
        data: [TD-NB-06]
        title: Check panel lists every gap at once
        steps:
          - Open draft ARN-2026-900008 (PA001); open the check panel.
        expected: The panel lists every missing mandatory field and the missing valid ID in one list.
        auto: accountForm.test.ts#lists what blocks the submission
      - c: 3
        type: Negative
        title: Period end before period start
        steps:
          - New Account with period from 01-Nov-2026 to 31-Oct-2026; save.
        expected: Not saved.
        msg: [The period end must be after the period start, ACCOUNT_PERIOD_INVALID]
        auto: AccountRulesIT#draftRulesComeFromTheProduct
      - c: 3
        type: Negative
        screen: API
        title: List value not valid on the date
        steps:
          - Call POST /api/v1/accounts with source channel XYZ.
        expected: Refused.
        msg: ["'XYZ' is not a valid value of {SOURCE_CHANNEL} on {2026-09-25}", LOV_VALUE_INVALID]
        auto: AccountRulesIT#freeFirstYearIsTaggedAndCancelledWithAudit

  FR-NB-004:
    scenario: SC-NB-02
    persona: BUSINESS_ADMIN
    screen: TEMPLATES
    data: [TD-NB-04]
    conditions:
      - A quotation records the intake template version it was captured with.
      - Fire and Motor quotation letters come from the same template with their own item details.
      - After a new template version, earlier documents keep their version; a template without text is refused.
    cases:
      - c: 1
        type: Positive
        persona: MKT_AO
        screen: QT
        title: Quotation shows its template version
        steps:
          - Open QT-2026-900003, Details tab.
        expected: The quotation shows the intake template code and version it was captured with.
        auto: QuotationIT#createdQuotationHasNumbersPremiumTemplateVersionAndWorkCase
      - c: 2
        type: Upload-download
        persona: MKT_AO
        screen: QT
        title: Fire and Motor letters from one template
        steps:
          - Download the quotation PDF of QT-2026-900003 (PAR01) and of QT-2026-900002 (MTR10).
        expected: Both use the same letter layout; the Fire letter lists the location and insured items, the Motor letter the vehicle details.
        auto: DocTemplateServiceIT#mergesTheVersionInForceOnTheDate
      - c: 3
        type: Positive
        title: New template version does not change earlier documents
        steps:
          - Save a new version of QUOTATION_LETTER effective today with an extra sentence.
          - Download the PDF of QT-2026-900003 again and create and download a new quotation.
        expected: The earlier quotation keeps the old text and version; the new quotation uses the new version.
        auto: DocTemplateServiceIT#mergesTheVersionInForceOnTheDate
      - c: 3
        type: Negative
        title: Template version without text
        steps:
          - New version of QUOTATION_LETTER with an empty body; save.
        expected: Not saved.
        msg: [Enter the template text, TEMPLATE_BODY_REQUIRED]
        auto: DocTemplateServiceIT#mergesTheVersionInForceOnTheDate

  FR-NB-005:
    scenario: SC-NB-02
    persona: MKT_AO
    screen: NEWQT
    data: [TD-NB-03]
    conditions:
      - A Motor quotation with 6 vehicles shows that TSU is required under FLEET_5.
      - An account that requires TSU cannot be validated before TSU records the clearance, and clearance after validation is refused.
      - A changed threshold applies to the next evaluation; a PRF for a package risk that no rule sends to TSU is refused.
    cases:
      - c: 1
        type: Positive
        title: Fleet of 6 vehicles routed to TSU
        steps:
          - New Quotation on MTR10 for CL-2026-000005 with 6 vehicles; open the routing result.
        expected: The quotation shows "TSU required (FLEET_5)".
        auto: CatalogIT#tsuRoutingFollowsTheRules
      - c: 1
        type: Boundary
        title: Fleet of 4 vehicles is not routed
        steps:
          - Same quotation with 4 vehicles.
        expected: No TSU routing is shown; the quotation is a package quotation.
        auto: CatalogIT#tsuRoutingFollowsTheRules
      - c: 2
        type: Negative
        persona: PROCESSOR
        screen: ACC
        title: Validation refused without TSU clearance
        pre: A submitted account with TSI above PHP 50,000,000 (rule TSI_50M).
        steps:
          - As proc click Validate.
        expected: Refused; the account stays SUBMITTED.
        msg: ["TSU must clear the account first: {TSI_50M}", TSU_CLEARANCE_REQUIRED]
        auto: AccountIT#validationNeedsAConfirmedClientAndTsuClearance
      - c: 2
        type: Workflow
        persona: TSU
        screen: ACC
        title: TSU clears the account, then Processing validates
        steps:
          - As tsu open the account, TSU Clearance; record the clearance with a comment.
          - As proc click Validate.
        expected: The clearance shows tsu and the time; the account moves to AWAITING_PAYMENT.
        auto: AccountIT#validationNeedsAConfirmedClientAndTsuClearance
      - c: 2
        type: Negative
        persona: TSU
        screen: ACC
        title: Clearance after validation
        steps:
          - Record a TSU clearance on an account already validated.
        expected: Refused.
        msg: [TSU clearance is given before the account is validated, TSU_CLEARANCE_CLOSED]
      - c: 3
        type: Negative
        screen: NEWPRF
        title: PRF for a package risk below every rule
        steps:
          - New Proposal Request on MTR10 with one vehicle of PHP 1,100,000; submit.
        expected: Refused.
        msg: ["No TSU rule applies to this package risk: quote it directly as a package quotation", PRF_NOT_NEEDED]
        auto: ProposalIT#packageRisksNeedDocumentsAndATsuReasonAndVoidedPrfsAreRetentionCandidates
      - c: 3
        type: Positive
        persona: BUSINESS_ADMIN
        screen: TSURULES
        title: Lower TSI threshold applies at the next evaluation
        steps:
          - Change TSI_50M to PHP 5,000,000 and have it authorised; as ao evaluate a PAR01 quotation of PHP 6,000,000.
        expected: The quotation shows "TSU required (TSI_50M)" without a release.

  FR-NB-010:
    scenario: SC-NB-02
    persona: MKT_AO
    screen: ACC
    data: [TD-NB-06]
    conditions:
      - An account's History tab shows every stage from Draft to Booked with user and time.
      - An action not allowed in the stage, or by a user without the permission, is refused.
      - An account without movement for 5 days is flagged stalled; business actions run only from their own screen and generic actions need a reason.
    cases:
      - c: 1
        type: Positive
        data: [TD-NB-09]
        title: History of a booked account
        steps:
          - Open a booked account of CL-2026-000001; History tab.
        expected: Every stage from Draft to Booked is listed with action, user and time; the status field cannot be edited.
        auto: WorkflowServiceIT#accountMovesThroughTheStagesWithPermissionChecksHistoryAndNotifications
      - c: 2
