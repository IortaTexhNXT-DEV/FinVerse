data:
  - id: TD-OP-01
    name: Demo users and roles
    content: cashier (CASHIER, Head Office), cashbr (CASHIER, Cebu branch), cashtl (CASHIER_TL), remit (REMIT_PROCESSOR), remittl (REMIT_TL), recon (RECON_HANDLER), adjust (ADJUSTMENT), adjtl (ADJUSTMENT_TL), commrec (COMMREC_HANDLER), commtl (COMMREC_TL), mktcoll (MKT_COLLECTION), mkttl (MKT_TL), comptrol (COMPTROLLERSHIP), disb (DISBURSEMENT), admin (SYSADMIN), auditor (AUDITOR). The demo password is issued by the test lead.
    source: Demo seeds V990 (Operations users), V980 (adjust, mkttl), V900 (admin, auditor); grants V760
  - id: TD-OP-02
    name: Booked demo invoices
    content: ARN-2026-940001 (Motor; booking and endorsement invoices paid in full; booking invoice remitted with the insurer OR), ARN-2026-940002 (Property; requests at every adjustment stage; gross premium differs in the insurer register), ARN-2026-940003 (direct payment), ARN-2026-940004 (CGL; partly paid; hold request waiting; flat cancellation ready for posting)
    source: Booking demo data (V988 and BookingDemoData), copied into the invoice ledger by the booking feed
  - id: TD-OP-03
    name: Cashiering storyline
    content: Receipt series AR-HO, AR-CEB and OR-HO (authorised); a payment without match with a refund disposition for approval; an excess; a pre-booked payment; a post-dated check in the warehouse; a Head Office service fee OR; a receipt cancellation for approval; a BIR 2307 tag; two check pick-up requests from Collection
    source: Demo seed V991 and CashieringDemoData
  - id: TD-OP-04
    name: Remittance storyline
    content: A remitted batch of ARN-2026-940001 with its insurer OR; a batch in review with the endorsement invoice; a hold request of ARN-2026-940004 waiting for approval; a special remittance request; incentive rule INS-MGIC Property CBG 2 % within 30 days of inception
    source: Demo seed V992 and RemittanceDemoData
  - id: TD-OP-05
    name: Production reconciliation storyline
    content: September 2026 register of INS-MGIC extracted, sent and answered; cycle RECONCILING with a gross premium discrepancy on ARN-2026-940002 and one insurer policy never booked; monthly schedules on the 5th; demo lists of company concerned and dispositions
    source: Demo seed V993 and ProdReconDemoData
  - id: TD-OP-06
    name: Adjustment storyline
    content: On ARN-2026-940002 a descriptive change in draft, an assured change for validation, a cover extension returned for documents and a premium rate increase for approval; a flat cancellation of ARN-2026-940004 for posting; an internal adjustment of ARN-2026-940001 posted
    source: Demo seed V994 and AdjustmentDemoData
  - id: TD-OP-07
    name: Commission storyline
    content: DP list HO_DP_20260930 with ARN-2026-940003 confirmed and billed to INS-MGIC (awaiting answer, 10 working days); incentive schemes No Touch, Top Up and Motor Mania inactive without tiers
    source: Demo seed V995 and CommissionDemoData
  - id: TD-OP-08
    name: Operations files
    content: Bills Payment file (20 rows, 2 with unknown invoices); Direct Credit fixed-width file; PDC upload; insurer OR schedule of the remitted batch; insurer production feedback in the register layout; DP lists named HO_DP_20260930.xlsx, CEB_DP_20260930.xlsx and "dp list.xlsx"; insurer DP answer file; minimal balance file with balances of 50.00 and 150.00; endorsement batch request file; hold and special remittance feed files
    source: Prepared by the test lead from the wizard templates and the layouts of the demo files; masked names
  - id: TD-OP-09
    name: USD receipt and BOOK rates
    content: A USD invoice of a demo client and the BOOK rate of the receipt date (2 decimals)
    source: Demo seed V990 (BOOK rates from the demo SPOT rates)
  - id: TD-OP-10
    name: Disbursement queue requests
    content: Payment requests created by the remittance approval, the refund disposition and the 2307 batch of the storylines
    source: Created by the demo storylines above

scenarios:
  - id: SC-OP-01
    persona: AUDITOR
    title: Access and invoice ledger. Users log in and see only their team's sections; every booked invoice is in the ledger with its components, statuses, locks and shares, visible in Invoice 360; batch jobs report their runs and reports respect view and export rights.
    pre: Demo users TD-OP-01; booked invoices TD-OP-02.
  - id: SC-OP-02
    persona: CASHIER
    title: Cashiering. The cashier receives payments and issues ARs and ORs from controlled series, uploads payment files and checks, and has cancellations and reinstatements approved; payments are matched and applied by component and posted.
    pre: Cashiering storyline TD-OP-03; files TD-OP-08.
  - id: SC-OP-03
    persona: CASHIER
    title: Unapplied money and BIR 2307. Unapplied payments are dispositioned under approval; minimal balances are swept; receipts are searched and printed; 2307 tags are validated, batched and released.
    pre: Cashiering storyline TD-OP-03.
  - id: SC-OP-04
    persona: REMIT_PROCESSOR
    title: Remittance. Paid and cleared premium is extracted by insurer, reviewed with exclusions, approved by another user, paid by Disbursement and closed with the insurer OR; early remittance incentives and reports follow.
    pre: Remittance storyline TD-OP-04.
  - id: SC-OP-05
    persona: MKT_COLLECTION
    title: Marketing collection items. Marketing asks for holds, special remittances, BIR 2307 tags and endorsement slips, and has the remittance schedule sent to the insurer.
    pre: Remittance storyline TD-OP-04; holdable invoices of TD-OP-02.
  - id: SC-OP-06
    persona: ADJUSTMENT
    title: Adjustment and cancellation. Endorsement requests are raised, checked for duplicates and locks, validated, approved, recomputed per insurer and posted; payments are re-applied or AR Insurer set up; minimal balances are written off.
    pre: Adjustment storyline TD-OP-06.
  - id: SC-OP-07
    persona: RECON_HANDLER
    title: Production reconciliation. The register is extracted and sent to the insurer, the feedback uploaded and matched within tolerance, differences worked to closure and the cycle closed.
    pre: Reconciliation storyline TD-OP-05; feedback file TD-OP-08.
  - id: SC-OP-08
    persona: COMMREC_HANDLER
    title: Commission receivables. DP lists are taken in and validated, billed per insurer, answered within the SLA, collected with the PR reversed; incentives are computed and BIR certificates submitted to Comptrollership.
    pre: Commission storyline TD-OP-07.
  - id: SC-OP-09
    persona: DISBURSEMENT
    title: Disbursement queue and interfaces. Payment requests from Operations are acknowledged, numbered and paid; 2307 certificates released; flow-in feeds run with logs and alerts.
    pre: Queue requests TD-OP-10.

frs:
  FR-OP-001:
    scenario: SC-OP-01
    persona: CASHIER
    screen: LOGIN
    data: [TD-OP-01]
    conditions:
      - A user with an Operations role logs in and sees the Operations sections of the role.
      - Wrong credentials are refused and the account locks after the configured attempts.
    cases:
      - c: 1
        type: Positive
        title: Cashier log-in
        steps:
          - Log in as cashier; open the menu.
        expected: The Operations and Cashiering sections are shown; Remittance, Adjustment and Commission Receivables are not.
        auto: OperationsFoundationApiIT#theHomeShowsOnlyTheUsersSections
      - c: 2
        type: Negative
        title: Wrong password
        steps:
          - Log in as remit with a wrong password.
        expected: Refused; no session.
        msg: [Invalid user name or password, AUTHENTICATION_FAILED]
        auto: ApiSmokeIT#loginReturnsTokenAndWrongPasswordIsRejected
      - c: 2
        type: Boundary
        neg: true
        title: Lock-out at the configured threshold
        pre: LOGIN_MAX_FAILED_ATTEMPTS is 3.
        steps:
          - Enter a wrong password 3 times for recon; then the correct one.
        expected: The account is locked at the third failure; the System Administrator unlocks it in Administration > Users.
        msg: [Account is locked. Contact your administrator., AUTHENTICATION_FAILED]
        auto: LoginLockoutTest#theAccountLocksAtTheConfiguredThreshold

  FR-OP-002:
    scenario: SC-OP-01
    persona: REMIT_PROCESSOR
    screen: OPSHOME
    data: [TD-OP-01]
    conditions:
      - Each role sees only its screens (for example the Remittance Processor does not see Cashiering Setup or the Disbursement queue).
      - A call to an approval endpoint without the approval permission is refused and logged.
      - A Marketing Collection user sees the holds, special remittance and 2307 tagging screens but cannot approve a hold.
    cases:
      - c: 1
        type: Security-access
        neg: false
        title: Remittance processor's menu
        steps:
          - Log in as remit; open the menu; type /cashiering/setup and /operations/disbursements.
        expected: Remittance screens are listed; Cashiering Setup and the Disbursement Queue are not, and the direct links show the no-access page.
        auto: OperationsFoundationApiIT#usersWithoutTheRightPermissionAreRefused
      - c: 2
        type: Security-access
        screen: API
        title: Batch approval without REMIT_APPROVE
        steps:
          - As remit call POST /api/v1/remittance/batches/{id}/approve on a batch for approval.
        expected: HTTP 403; the refusal is in the audit trail.
        msg: [You are not permitted to perform this action, ACCESS_DENIED]
        auto: RemittanceApiIT#usersWithoutTheRightPermissionAreRefused
      - c: 3
        type: Security-access
        persona: MKT_COLLECTION
        screen: HOLDS
        title: Marketing Collection cannot approve a hold
        steps:
          - As mktcoll open Remittance Holds, Special Remittance and BIR 2307; open the waiting hold of ARN-2026-940004.
        expected: The three screens open; Approve hold is not offered and the API call returns HTTP 403.
        msg: [You are not permitted to perform this action, ACCESS_DENIED]
        auto: RemittanceApiIT#holdsAreRequestedAndDecidedThroughTheApi

  FR-OP-003:
    scenario: SC-OP-01
    persona: CASHIER
    screen: OPSHOME
    data: [TD-OP-01]
    conditions:
      - The home shows a card only for the teams whose permissions the user holds, with its tiles.
      - A tile opens the filtered list.
      - A role without an Operations section sees an empty-state message.
    cases:
      - c: 1
        type: Positive
        title: Cashier's home
        steps:
          - Log in as cashier; open Operations Home.
        expected: The Cashiering card with its tiles is shown; there is no Remittance card.
        auto: OperationsFoundationApiIT#theHomeShowsOnlyTheUsersSections
      - c: 2
        type: Positive
        persona: REMIT_TL
        title: Batches for Approval tile
        steps:
          - As remittl click the tile Batches for Approval.
        expected: Remittance Batches opens filtered on For approval.
        auto: RemittanceOperationsIT#theOperationsHomeAndApprovalInboxShowRemittanceWork
      - c: 3
        type: Negative
        persona: COMPTROLLERSHIP
        title: Role without a team card
        steps:
          - As comptrol open Operations Home.
        expected: The page says "No Operations section is assigned to your role" and shows no card.

  FR-OP-004:
    scenario: SC-OP-01
    persona: AUDITOR
    screen: INVSEARCH
    data: [TD-OP-02]
    conditions:
      - A booked invoice appears in the ledger with the booked components, status UNPAID and WITH_OUTSTANDING_BALANCE.
      - A payment shows as an APPLIED movement per component; a direct payment invoice shows NOT_APPLICABLE.
      - Replaying an invoice already in the ledger changes nothing; a replay needs a scope and BOOKED movements come only from booking.
    cases:
      - c: 1
        type: Positive
        title: Newly booked invoice in the ledger
        pre: An account booked in this cycle (TC-NB-110.1-01 of the BRD-1 plan).
        steps:
          - Invoice Search on its ARN; open Invoice 360.
        expected: The components equal the booking; payment status UNPAID and remittance status WITH_OUTSTANDING_BALANCE.
        auto: InvoiceLedgerIT#aBookedInvoiceIsCopiedWithItsComponentsAfterCommit
      - c: 2
        type: Positive
        screen: INV360
        title: Payment movements and a DP invoice
        steps:
          - Open Invoice 360 of ARN-2026-940001, Movements; then of ARN-2026-940003.
        expected: 940001 shows APPLIED movements with AR number, date and amount per component; 940003 shows the DP chip and payment status NOT_APPLICABLE.
        auto: InvoiceLedgerIT#paymentsMoveBalancesAndStatusesOnceAndAreHistorised; InvoiceLedgerIT#aDirectPaymentInvoiceHasNothingToCollectOrRemit
      - c: 3
        type: Positive
        persona: SYSADMIN
        screen: INTERFACES
        title: Replay changes nothing
        steps:
          - Interfaces; replay invoice of ARN-2026-940001; compare Invoice 360 before and after.
        expected: The run ends with no new movement; the invoice is unchanged.
        auto: InvoiceLedgerIT#missingInvoicesAreReplayedFromBookingAsALoggedRun; OperationsFoundationApiIT#anInvoiceIsSearchedViewedAndReplayed
      - c: 3
        type: Negative
        persona: SYSADMIN
        screen: API
        title: Replay without scope
        steps:
          - Call POST /api/v1/ops/invoices/replay with no invoice, ARN or company.
        expected: Refused.
        msg: ["Give an invoice number, an ARN or a company to replay", REPLAY_SCOPE]
        auto: OperationsFoundationApiIT#anInvoiceIsSearchedViewedAndReplayed

  FR-OP-005:
    scenario: SC-OP-01
    persona: AUDITOR
    screen: INVSEARCH
    data: [TD-OP-02, TD-OP-04]
    conditions:
      - Searching an ARN lists its invoices and Invoice 360 shows receipts, remittance batch and insurer OR.
      - An invoice on hold shows the hold pill and the hold request with its dates.
      - A partial search on the assured name is case-insensitive; an empty result says so.
    cases:
      - c: 1
        type: Positive
        title: Invoices of ARN-2026-940001
        steps:
          - Search ARN-2026-940001; open the booking invoice.
        expected: The booking and endorsement invoices are listed; Invoice 360 shows the AR, the remittance batch and the insurer OR.
        auto: OperationsFoundationApiIT#anInvoiceIsSearchedViewedAndReplayed
      - c: 2
        type: Positive
        title: Invoice on hold
        pre: The hold of ARN-2026-940004 approved (TC-OP-111.1-01).
        steps:
          - Open Invoice 360 of ARN-2026-940004, Remittances tab.
        expected: The hold pill and the hold request with its until date are shown.
      - c: 3
        type: Positive
        title: Case-insensitive assured search
        steps:
          - Search "pacific harbor".
        expected: The invoices of Pacific Harbor Logistics Inc. are listed.
        auto: invoiceSearch.test.ts
      - c: 3
        type: Negative
        title: Nothing found
        steps:
          - Search "ZZZ-NO-MATCH".
        expected: The list shows the empty state; no error.

  FR-OP-006:
    scenario: SC-OP-01
    persona: ADJUSTMENT
    screen: NEWREQ
    data: [TD-OP-02, TD-OP-04]
    conditions:
      - An endorsement request on an invoice in a remittance batch is refused and names REMITTANCE.
      - A payment applied to an invoice locked by Adjustment is accepted.
      - Excluding the invoice from the batch releases the lock.
    cases:
      - c: 1
        type: Negative
        title: Request on an invoice in a batch
        steps:
          - New Request on the endorsement invoice of ARN-2026-940001 (in a batch for review).
        expected: Refused.
        msg: ["Invoice <no> is locked by REMITTANCE (<reason>)", INVOICE_LOCKED]
        auto: AdjustmentRequestIT#anInvoiceInTheRemittanceQueueCannotBeAdjusted
      - c: 2
        type: Positive
        persona: CASHIER
        screen: RECEIVE
        title: Payment on an invoice locked by Adjustment
        steps:
          - Receive a payment on the invoice of ARN-2026-940004 (open cancellation request, locked by ADJUSTMENT).
        expected: The payment is applied; the lock stays.
        auto: InvoiceLedgerIT#aLockBlocksOtherModulesExceptPaymentsAndFlagsAreLogged
      - c: 3
        type: Workflow
        persona: REMIT_PROCESSOR
        screen: BATCH
        title: Exclusion releases the lock
        steps:
          - Exclude the endorsement invoice from its batch with a reason; raise the endorsement request again.
        expected: The lock is gone and the request is accepted.
        auto: RemittanceIT#excludedInvoicesAreGivenBackAndCanBeRestoredBeforeSubmission

  FR-OP-007:
    scenario: SC-OP-01
    persona: ADJUSTMENT
    screen: INV360
    conditions:
      - A co-insured invoice shows every insurer and share on Invoice 360.
      - An adjustment is split by the original shares, never 100 % to the lead insurer.
    cases:
      - c: 1
        type: Positive
        pre: An invoice booked with shares 60 / 40 (booking with two insurers in SIT).
        title: Shares on Invoice 360
        steps:
          - Open Invoice 360 of the co-insured invoice.
        expected: Both insurers with 60 % and 40 % and their amounts.
        auto: BookingServiceIT#coInsuranceSplitsJournalsOpenItemsAndServiceInvoicesByShare
      - c: 2
        type: Positive
        screen: REQ
        title: Premium decrease split 600 / 400
        steps:
          - Raise a premium decrease of 1,000.00 on it; open Recompute.
        expected: The insurer breakdown shows -600.00 and -400.00.
        auto: OpsLedgerDomainTest#sharesSplitAmountsWithTheRemainderOnTheLastInsurer
      - c: 2
        type: Boundary
        neg: false
        screen: REQ
        title: Odd amount split with the remainder on the last insurer
        steps:
          - Raise a decrease of 1,000.01.
        expected: The breakdown is -600.01 / -400.00 or -600.00 / -400.01 with the remainder on the last insurer, and totals 1,000.01.
        auto: OpsLedgerDomainTest#sharesSplitAmountsWithTheRemainderOnTheLastInsurer
      - c: 1
        type: Negative
        screen: REQ
        title: Lead insurer never takes 100 %
        steps:
          - Check the posting lines of the decrease after posting.
        expected: No line gives the whole decrease to the lead insurer.

  FR-OP-008:
    scenario: SC-OP-02
    persona: CASHIER
    screen: PAYUP
    data: [TD-OP-08]
    conditions:
      - A file with a failing row commits the others and reports the failed row with its reason.
      - The run report lists successful, unsuccessful, applied, unapplied and failed records.
      - A duplicate file is refused; a corrected failed row is reprocessed alone.
    cases:
      - c: 1
        type: Upload-download
        title: 10 rows, one unknown invoice
        steps:
          - Payment Uploads, Bills Payment; upload a 10-row file with one unknown invoice; commit.
        expected: 10 ARs; 9 applied and 1 unapplied (no match) with its reason in the run summary.
        auto: PaymentUploadIT#aBillsPaymentFileIsMatchedRowByRowAndCannotBeUploadedTwice
      - c: 2
        type: Report-output
        screen: REPORTS
        title: Run report CSH-BATCH-RUN
        steps:
          - Run CSH-BATCH-RUN for the upload.
        expected: Counts of successful, unsuccessful, applied, unapplied and failed records equal the run summary.
        auto: CashieringReportsIT#everyCashieringReportRunsAndExportsInEveryFormat
      - c: 3
        type: Negative
        title: Same file again
        steps:
          - Upload the same file.
        expected: Refused.
        msg: [This file was already uploaded, BULK_DUPLICATE_FILE]
        auto: PaymentUploadIT#aBillsPaymentFileIsMatchedRowByRowAndCannotBeUploadedTwice
      - c: 3
        type: Positive
        persona: SYSADMIN
        screen: INTERFACES
        title: Reprocess a corrected failed row
        steps:
          - Interfaces; open a run with a failed record; correct and reprocess it.
        expected: Only that record is processed; the others keep their result.
        auto: BulkExtensionsIT#aFixedWidthFileIsCategorisedReprocessedAndNeverUploadedTwice

  FR-OP-009:
    scenario: SC-OP-01
    persona: AUDITOR
    screen: REPORTS
    data: [TD-OP-03]
    conditions:
      - A view-only user sees a report on screen but cannot download or print it.
      - A user with export rights downloads the report; the run is in the Report Archive.
    cases:
      - c: 1
        type: Security-access
        title: Auditor views but cannot download
        steps:
          - As auditor run CSH-APPLIED-PREM; look for download and print; call the export endpoint.
        expected: The report shows on screen; no download or print button; the export call returns HTTP 403.
        msg: [You are not permitted to perform this action, ACCESS_DENIED]
      - c: 2
        type: Report-output
        persona: CASHIER
        title: Cashier downloads to Excel
        steps:
          - As cashier run CSH-APPLIED-PREM and download Excel; open the Report Archive.
        expected: The Excel file has the rows of the screen; the archive lists the run with parameters and creator.
        auto: CashieringReportsIT#everyCashieringReportRunsAndExportsInEveryFormat; reportRuns.test.ts

  FR-OP-010:
    scenario: SC-OP-02
    persona: CASHIER_TL
    screen: SERIES
    data: [TD-OP-03]
    conditions:
      - A branch AR takes the next branch number and an OR the next Head Office number; no number is used twice.
      - OR series belong to Head Office only; ranges are validated; series are maker-checker.
      - When a series is used up the next receipt is refused.
    cases:
      - c: 1
        type: Positive
        persona: CASHIER_BR
        screen: RECEIVE
        title: Branch AR number
        steps:
          - As cashbr receive a payment; note the AR number; receive another.
        expected: The ARs take consecutive numbers of the AR-CEB series.
        auto: SeriesPrintPickupIT#aSmallSeriesIsAuthorizedWithFourEyesWarnsAndRunsOut
      - c: 2
        type: Negative
