access:
  - action: View Operations screens and Invoice 360
    screen: INVSEARCH
    permission: OPS_VIEW
    allow: [CASHIER, REMIT_PROCESSOR, RECON_HANDLER, ADJUSTMENT, COMMREC_HANDLER, MKT_COLLECTION, DISBURSEMENT, AUDITOR]
    deny: []
    denied: The Operations sections are not in the menu; the API returns HTTP 403 (ACCESS_DENIED).
    auto: OperationsFoundationApiIT#anInvoiceIsSearchedViewedAndReplayed; OperationsFoundationApiIT#usersWithoutTheRightPermissionAreRefused
  - action: Issue, cancel and apply receipts
