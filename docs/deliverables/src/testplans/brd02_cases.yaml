findings:
  - fr: FR-OP-001
    issue: 'The FRS messages "Invalid user ID or password" and "Your account is locked. Contact the System Administrator" (code "-") differ from the build: "Invalid user name or password" and "Account is locked. Contact your administrator.", both with code AUTHENTICATION_FAILED (HTTP 401).'
    proposal: Quote the built messages and code in FRS v1.1; the cases use the built wording.
  - fr: FR-OP-002
    issue: 'The FRS says a direct link without permission returns "You do not have access to this page"; the build shows "You do not have access to this screen. Contact your administrator if you need it."'
    proposal: Quote the built text in FRS v1.1.
  - fr: FR-OP-070
    issue: 'The FRS and the help text call the team "Production Reconciliation", but the menu section is labelled "Product Reconciliation" (frontend navigation). Testers and users will look for the wrong label.'
    proposal: Align the menu label with the FRS ("Production Reconciliation") or change the FRS; the cases use the built menu label.
  - fr: FR-OP-002
    issue: The role-permission matrix is provisional until BDOI confirms it (OQ48); the Roles and Access sheet tests the grants of the build (migration V760), not a signed-off matrix.
    proposal: Re-baseline the Roles and Access sheet when OQ48 is answered.
  - fr: FR-OP-074
    issue: Automatic pick-up of insurer feedback from a mailbox or SFTP is parked; only the manual upload can be tested in this release.
    proposal: Mark the automatic pick-up as out of scope in FRS v1.1 and add its acceptance criteria when the channel is agreed.
  - fr: FR-OP-075
    issue: The match keys and the automatch frequency wait for OQ30; the cases test the delivered default keys and the manual automatch only.
    proposal: Add the confirmed keys and schedule to the acceptance criteria when OQ30 is answered.
  - fr: FR-OP-095
    issue: The incentive schemes have no tiers until BDOI gives the targets and amounts (OQ39); the tier cases use tester-entered values.
    proposal: Replace the test tiers with the BDOI values when OQ39 is answered and re-run TC-OP-095.1-01.
  - fr: FR-OP-120
    issue: The Disbursement system is not known (OQ02); the in-app queue is the default and returns are re-sent manually. The hand-off to an external system cannot be tested.
    proposal: Add interface cases when OQ02 names the Disbursement system.
