          - Click Validate and release.
          - Open the Versions tab of MTR12.
        expected: Version 2 is RELEASED from its effective date; version 1 ends the day before; the checklist, tsuhead and the time are recorded; the linked request is RELEASED and an advisory draft exists.
        auto: CatalogVersionIT#aPackageVersionIsDraftedValidatedAndReleased; PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 2
        type: Boundary
        persona: MKT_AO
        screen: QUOTE
        data: [TD-PM-14]
