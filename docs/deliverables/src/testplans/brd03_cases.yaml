        expected: Both quotations show "Priced on version 1"; from the effective date new quotations show version 2.
        auto: RatingSchemeIT#newBusinessUsesTheCurrentVersionAndAnOldOneOnlyWithAnException
      - c: 3
        type: Workflow
        title: Return to MBS with a reason
        steps:
          - Open a version FOR_VALIDATION; click Return to MBS; reason "Deductible missing"; confirm.
        expected: The version is DRAFT and editable; the request is back in WITH_MBS; mbs is notified.
        auto: CatalogVersionIT#aSubmittedVersionIsReturnedAndACompleteHierarchyIsRequired; PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 3
        type: Negative
        title: Return without a reason
