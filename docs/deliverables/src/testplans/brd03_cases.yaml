    data: [TD-PM-12, TD-PM-11]
    conditions:
      - The preparer cannot approve the own quotation slip.
      - An approved QS is numbered, e-mailed to each insurer as a protected PDF and listed on the E-mails tab.
      - The officer sees the send status and resends to one insurer.
      - After the ManCom sign-off the QS cannot be edited or resent; a sent round cannot be edited.
      - A QS needs at least one insurer.
    cases:
      - c: 1
        type: Negative
        title: The preparer cannot approve the own QS
        steps:
          - As tsu open round 1; select INS-MGIC and INS-LAC; click Submit for approval.
          - As tsu click Approve and send.
        expected: The QS gets a number PQS-2026-nnnnnn and status For approval; tsu's approval is refused.
        msg: [The quotation slip is approved by a TL or a co-officer, QS_FOUR_EYES]
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 2
        type: Workflow
        persona: TSU_TL
        title: TSU TL approves and the QS goes to each insurer
        steps:
          - As tsulead open round 1; review the QS PDF; click Approve and send.
          - Open the E-mails tab.
        expected: Round 1 is SENT with a reply due date of send date + 5 days; two protected QS e-mails and two password e-mails are logged; each insurer has a Pending response.
        auto: ProductMaintenanceApiIT#aRequestIsCreatedAndSubmittedOverHttp; PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 3
        type: Positive
        title: Resend the QS to one insurer
        steps:
          - On the sent round, click Resend on INS-LAC.
        expected: One more QS e-mail to INS-LAC is logged; the send count of INS-LAC shows 2.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 3
        type: Negative
        title: Resend on a closed round is refused
        pre: Round 1 is closed by a revision (round 2 open).
        steps:
          - Open round 1 and call resend for INS-LAC.
        expected: The resend is refused.
        msg: ["Only the slip of an open, sent round can be resent", QS_NOT_RESENDABLE]
      - c: 4
        type: Negative
        data: [TD-PM-06]
        title: QS locked after ManCom sign-off
        steps:
          - Open PKR-2026-900005 (signed off) or a signed-off request with rounds; try to edit the insurers of the last round or resend.
        expected: The round shows Locked; edit and resend are refused.
        msg: [The slips are locked since the ManCom sign-off, QS_LOCKED]
      - c: 4
        type: Negative
        title: A sent round cannot be edited
        steps:
          - On a sent round, change the insurers and save.
        expected: The change is refused and the user is told to revise in a new round.
        msg: ["Round 1 was sent: revise the slip in a new round", QS_ALREADY_SENT]
      - c: 5
        type: Negative
        title: QS without insurer
        steps:
          - On a round in preparation remove all insurers; click Submit for approval.
        expected: The QS is not submitted.
        msg: [Select at least one insurer for the quotation slip, QS_NO_INSURER]

  FR-PM-031:
    scenario: SC-PM-04
    persona: TSU
    screen: NEG
    data: [TD-PM-04, TD-PM-13]
    conditions:
      - TSU records each outcome of the list, with rate and terms per coverage and the insurer's reply attached.
      - An offer without a rate or with a negative amount is refused.
      - The response history shows every earlier value with user and time.
    cases:
      - c: 1
        type: Positive
        title: Approved with changes for one insurer and Declined for another
        steps:
          - Open PKR-2026-900003, round 2, response of INS-MGIC; outcome Approved with changes, rate 0.34, EARTHQUAKE deductible "3% of value at risk"; attach the insurer reply; save.
          - Response of INS-LAC; outcome Declined; remarks "No capacity"; save.
        expected: Both responses are saved with their outcomes; the insurer reply is stored as document type PKG_INSURER_RESPONSE; the comparative of round 2 lists INS-MGIC first.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 1
        type: Positive
        title: No response recorded after the due date
        steps:
          - Response of the third insurer; outcome No response; save.
        expected: The response is saved without a rate; the round shows no pending insurer.
        auto: PackageLogicTest#theComparativePutsOffersFirstCheapestFirstAndSelectsFieldsAndInsurers
      - c: 2
        type: Negative
        title: Counter-proposal without a rate
        steps:
          - Outcome Counter-proposal; leave Rate % empty; save.
        expected: The response is not saved.
        msg: ["Enter the rate offered by {Luzon Assurance Co.} (COUNTER_PROPOSAL)", PKG_RESPONSE_RATE_REQUIRED]
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 2
        type: Negative
        title: Negative minimum premium
        steps:
          - Outcome Accepted as requested, rate 0.30, minimum premium -1; save.
        expected: The response is not saved.
        msg: [Rates and amounts cannot be negative, PKG_AMOUNT_NEGATIVE]
      - c: 2
        type: Negative
        title: Response keyed in a closed round
        steps:
          - Open round 1 of PKR-2026-900003 (closed) and edit a response.
        expected: The change is refused.
        msg: ["Round 1 is closed: key in the latest round", PKG_ROUND_CLOSED]
      - c: 3
        type: Positive
        title: Response history keeps every earlier value
        steps:
          - Change the INS-MGIC rate from 0.34 to 0.33 and save; open the response history.
        expected: The history lists 0.34 and 0.33 with user tsu and the times.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory

  FR-PM-032:
    scenario: SC-PM-04
    persona: TSU
    screen: NEG
    data: [TD-PM-04]
    conditions:
      - A request negotiated in two rounds shows both rounds, their QS numbers and the responses of each.
      - The next round opens by default without the insurers that declined.
      - A request closed as not proceeded shows the reason and cannot be reopened.
      - A round is revised only after its QS was sent; not proceeded needs a reason.
    cases:
      - c: 1
        type: Positive
        title: Two rounds with their QS numbers and responses
        steps:
          - Open PKR-2026-900003, Negotiation tab.
        expected: Rounds 1 (closed) and 2 (sent) are listed, each with its PQS number, insurers and responses; round 1 shows the three responses.
        auto: ProductMaintenanceApiIT#aDemoRequestIsReadableWithItsRoundsOutputsAndDocuments
      - c: 2
        type: Workflow
        title: Revise opens round n+1 without the declined insurer
        pre: Request of TD-PM-12 with round 1 sent, INS-LAC Declined and INS-MGIC Approved with changes.
        steps:
          - Click Revise quotation slip; write "Match the lower rate"; confirm.
        expected: Round 1 closes; round 2 opens with INS-MGIC only; the request stays in NEGOTIATION.
        data: [TD-PM-12]
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 3
        type: Workflow
        persona: TSU_HEAD
        title: Close as not proceeded with a reason
        pre: A request in NEGOTIATION created for this case.
        steps:
          - Click Not proceeded; reason Declined by the insurers; comment; confirm.
          - Look for any action to reopen the request.
        expected: The request is NOT_PROCEEDED in the Closed tab with the reason; no action is offered; the requester is notified.
      - c: 4
        type: Negative
        title: Revise before the QS is sent
        steps:
          - On a round in preparation, click Revise quotation slip.
        expected: The revision is refused.
        msg: [Send the slip of round 1 before revising it, QS_NOT_SENT]
      - c: 4
        type: Negative
        title: Not proceeded without a reason
        steps:
          - Click Not proceeded and confirm without a reason.
        expected: The request stays in NEGOTIATION.
        msg: ["Select a reason for 'Not proceeded'", WORKFLOW_REASON_REQUIRED]

  FR-PM-033:
    scenario: SC-PM-04
    persona: TSU
    screen: NEG
    data: [TD-PM-12]
    conditions:
      - Terms Final is refused while an insurer of the latest round is Pending.
      - Only insurers that offered terms can be chosen, and shares total 100.
      - After Terms Final the request shows the proposed terms and a current comparative master.
    cases:
      - c: 1
        type: Negative
        title: Terms Final with a pending insurer
        pre: Round 1 sent; INS-MGIC keyed in, INS-LAC still Pending.
        steps:
          - Click Terms final; choose INS-MGIC; confirm.
        expected: Terms Final is refused and the pending insurer is named.
        msg: ["Every insurer of round 1 needs an outcome before the terms are final (INS-LAC pending)", NEGOTIATION_INCOMPLETE]
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 2
        type: Negative
        title: Choose an insurer that declined
        steps:
          - Round 2 - INS-MGIC Accepted as requested, INS-LAC Declined; click Terms final; choose INS-LAC.
        expected: Refused.
        msg: [INS-LAC did not offer terms in this round, PKG_INSURER_NOT_OFFERED]
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 2
        type: Negative
        title: No insurer chosen
        steps:
          - Click Terms final; untick every insurer; confirm.
        expected: Refused.
        msg: ["Choose the insurer(s) whose terms the package takes", NEGOTIATION_INCOMPLETE]
      - c: 2
        type: Boundary
        neg: true
        title: Shares of two chosen insurers total 90
        steps:
          - Choose two offering insurers as Lead 50 and Participant 40; confirm. Repeat with 50 and 50.
        expected: 50 + 40 is refused; 50 + 50 is accepted.
        msg: [Co-insurance shares must be given for every insurer and total 100, PKG_SHARES_INVALID]
      - c: 3
        type: Workflow
        title: Terms final moves the request to TERMS_REVIEW with a master
        steps:
          - Choose INS-MGIC as Panel; comment "final"; confirm.
          - Open the Details and Comparative tabs.
        expected: The request is in TERMS_REVIEW; Chosen insurers shows INS-MGIC; Proposed terms are shown; the Comparative tab lists one current MASTER with a 64-character SHA-256 hash.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory

  FR-PM-034:
    scenario: SC-PM-04
    persona: TSU
    screen: COMP
    data: [TD-PM-04]
    conditions:
      - A request has one current master listing every insurer of the latest round with its terms.
      - A new compilation supersedes the previous master, which stays downloadable.
      - Marketing opens the master read only.
      - A master cannot be compiled before the QS of the round is sent.
    cases:
      - c: 1
        type: Report-output
        title: Master lists the three insurers of round 1
        steps:
          - Open PKR-2026-900003; Comparative tab; download the current master as PDF and Excel.
        expected: One column per insurer with outcome, rate, minimum premium, coverages, deductibles, conditions, valid until and remarks; offers are listed first, cheapest first; the lowest rate is marked; PDF and Excel show the same values.
        auto: PackageLogicTest#theComparativePutsOffersFirstCheapestFirstAndSelectsFieldsAndInsurers
      - c: 2
        type: Positive
        title: Recompiling supersedes the previous master
        steps:
          - Click Compile master; open Stored outputs.
        expected: The new master is Current; the previous one shows Superseded and still downloads with its original content and hash.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 3
        type: Security-access
        neg: false
        persona: MKT_AO
        title: Marketing sees the master without compile or generate buttons
        steps:
          - Log in as ao2; open PKR-2026-900003, Comparative tab.
        expected: The master is shown and downloads; Compile master and Generate client view are not shown.
      - c: 3
        type: Security-access
        persona: MKT_AO
        screen: API
        title: Marketing cannot compile a master through the API
        steps:
          - Call POST .../requests/{id}/comparatives/master with ao2's token.
        expected: HTTP 403; no new output.
        msg: [You are not permitted to perform this action, ACCESS_DENIED]
      - c: 4
        type: Negative
        data: [TD-PM-12]
        title: Compile before the QS is sent
        steps:
          - On a request whose round 1 is in preparation, click Compile master.
        expected: No master is produced.
        msg: [Send the quotation slip of round 1 first, COMPARATIVE_NO_TERMS]

  FR-PM-035:
    scenario: SC-PM-04
    persona: TSU
    screen: COMP
    data: [TD-PM-04]
    conditions:
      - A client view shows only the chosen fields and insurers, with the master's values.
      - The client view names the master it was derived from.
      - A view needs a current master, a title, a field and an insurer.
    cases:
      - c: 1
        type: Report-output
        title: Client view without one insurer and without Remarks
        steps:
          - Click Generate client view; title "Pacific Harbor options"; tick every field except Remarks; tick INS-MGIC and INS-VMI only; generate.
          - Download the PDF and the Excel file.
        expected: The files show two insurer columns and no Remarks row; each value equals the master.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 2
        type: Positive
        title: The view lists its master
        steps:
          - Open the stored outputs.
        expected: The client view shows kind CLIENT, the selection and the master it comes from.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 3
        type: Negative
        title: Client view without a title
        steps:
          - Generate client view with an empty title.
        expected: Nothing is generated.
        msg: [Enter the title of the view, COMPARATIVE_TITLE_REQUIRED]
      - c: 3
        type: Negative
        title: Client view without an insurer
        steps:
          - Generate client view with a title and fields but no insurer ticked.
        expected: Nothing is generated.
        msg: [Select at least one insurer of the master, COMPARATIVE_NO_INSURER]
      - c: 3
        type: Negative
        data: [TD-PM-12]
        title: Client view before a master exists
        steps:
          - On a request with a sent round and no master, call POST .../comparatives with a title and fields.
        expected: Nothing is generated.
        msg: [Compile the comparative master first, COMPARATIVE_NO_MASTER]

  FR-PM-036:
    scenario: SC-PM-04
    persona: TSU_HEAD
    screen: REQ
    data: [TD-PM-04, TD-PM-12]
    conditions:
      - A client-specific package cannot skip the Marketing review.
      - A generic programme goes straight to requirements and cannot be released to Marketing.
      - Marketing accepts the terms or requests changes with a reason, which returns the request to NEGOTIATION.
    cases:
      - c: 1
        type: Negative
        title: Skip review on a client-specific package
        pre: PKR-2026-900003 after Terms final (TERMS_REVIEW).
        steps:
          - As tsuhead call the action Proceed to requirements (generic package) through the API.
        expected: Refused; on screen the action is not offered for a client-specific package.
        msg: [Marketing reviews the terms of a client-specific package, PKG_SCOPE_CLIENT]
        auto: PackageRequestProcessIT#aClientSpecificPackageGoesThroughMarketingReviewAndReturns
      - c: 1
        type: Workflow
        title: Release terms to Marketing
        steps:
          - Click Release terms to Marketing with comment "for the client".
        expected: The request is in FOR_MKT_REVIEW; ao2 (requester) is notified.
        auto: PackageRequestProcessIT#aClientSpecificPackageGoesThroughMarketingReviewAndReturns
      - c: 2
        type: Negative
        title: Release a generic programme to Marketing
        pre: Request of TD-PM-12 in TERMS_REVIEW.
        steps:
          - Call the action Release terms to Marketing.
        expected: Refused.
        msg: [A generic programme goes straight to the requirements, PKG_SCOPE_GENERIC]
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 2
        type: Workflow
        title: Proceed to requirements for a generic programme
        steps:
          - Click Proceed to requirements (generic package).
        expected: The request moves to REQUIREMENTS_PREP.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 3
        type: Workflow
        persona: MKT_AO
        title: Marketing requests changes, then accepts the revised terms
        steps:
          - As ao2 open the request in FOR_MKT_REVIEW; click Request changes; reason Additional insurer requirements; comment "client wants a lower rate".
          - As tsu make the terms final again; as tsuhead release to Marketing.
          - As ao2 click Accept terms with comment "client agrees".
        expected: After Request changes the request is in NEGOTIATION with the reason shown; after Accept terms it is in REQUIREMENTS_PREP.
        auto: PackageRequestProcessIT#aClientSpecificPackageGoesThroughMarketingReviewAndReturns
      - c: 3
        type: Negative
        persona: MKT_AO
        title: Request changes without a reason
        steps:
          - Click Request changes and confirm without a reason.
        expected: The request stays in FOR_MKT_REVIEW.
        msg: ["Select a reason for 'Request changes'", WORKFLOW_REASON_REQUIRED]

  FR-PM-040:
    scenario: SC-PM-05
    persona: TSU
    screen: REQM
    data: [TD-PM-12, TD-PM-13]
    conditions:
      - Submission without a signed package slip or another pack item is refused and names every missing item.
      - A complete pack moves the request to FOR_MANCOM and notifies ManCom.
      - The package end date must be after the effective date.
    cases:
      - c: 1
        type: Negative
        title: Submit requirements with an empty pack
        pre: Request of TD-PM-12 in REQUIREMENTS_PREP.
        steps:
          - Click Submit requirements for ManCom sign-off.
        expected: Refused; the message lists every missing item (scheme rate or rate per insurer, computation basis, dates, signed package slip).
        msg: ["Complete the requirements: <missing items>", REQUIREMENTS_INCOMPLETE]
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 1
        type: Negative
        title: Only the signed package slip is missing
        steps:
          - Enter scheme rate 0.34, minimum premium 15,000, commission 10, TSI limit 50,000,000, computation basis "Contract value x 0.34%", effective from, package start and end; save.
          - Click Submit requirements for ManCom sign-off.
        expected: Refused; the Missing list shows only the signed package slip (document PKG_SLIP_SIGNED).
        msg: ["Complete the requirements: {the signed package slip (document PKG_SLIP_SIGNED)}", REQUIREMENTS_INCOMPLETE]
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 2
        type: Upload-download
        title: Download the slip, upload the signed copy and submit
        steps:
          - Download the package slip PDF; upload the signed slip of TD-PM-13 as PKG_SLIP_SIGNED.
          - Click Submit requirements for ManCom sign-off with comment "pack complete".
        expected: The package slip shows the rate scheme, insurers and coverages; after upload the checklist is complete; the request is in FOR_MANCOM and mancom is notified.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 3
        type: Negative
        title: Package end date before the effective date
        steps:
          - Set effective from 01-Jan-2027 and package end 31-Dec-2026; save.
        expected: Not saved.
        msg: [The package end date must be after the effective date, PKG_DATES_INVALID]
      - c: 3
        type: Negative
        title: Requirements edited outside REQUIREMENTS_PREP
        data: [TD-PM-05]
        steps:
          - On PKR-2026-900004 (FOR_MANCOM) call PUT .../requirements.
        expected: Refused.
        msg: [The requirements are prepared after the terms are accepted, PKG_NOT_IN_REQUIREMENTS]

  FR-PM-041:
    scenario: SC-PM-05
    persona: MANCOM
    screen: REQM
    data: [TD-PM-05, TD-PM-13]
    conditions:
      - The requirements reach MBS only after the ManCom sign-off.
      - After sign-off the QS of every round is locked.
      - Without an uploaded sheet the request carries a generated MANCOM_SIGNOFF document.
      - The member who submitted the requirements cannot sign them off; a return needs a reason.
    cases:
      - c: 1
        type: Workflow
        title: ManCom signs off with an uploaded sheet
        steps:
          - Log in as mancom; open PKR-2026-900004; Requirements & Sign-off tab.
          - Upload the signed ManCom sheet; click Sign off and send to MBS with comment "signed".
        expected: The request is in WITH_MBS; the decision SIGNED shows mancom, time and the sheet; mbs is notified.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory; ProductMaintenanceApiIT#aDemoRequestIsReadableWithItsRoundsOutputsAndDocuments
      - c: 1
        type: Negative
        persona: TSU
        screen: API
        title: The request cannot go to MBS without the sign-off
        steps:
          - As tsu call POST .../requests/{id}/signoff on PKR-2026-900004.
          - As mbs call POST .../requests/{id}/setup on the same request before sign-off.
        expected: Both calls are refused with HTTP 403; the request stays in FOR_MANCOM.
        msg: [You are not permitted to perform this action, ACCESS_DENIED]
        auto: ProductMaintenanceApiIT#permissionsAreEnforced
      - c: 2
        type: Negative
        persona: TSU
        screen: NEG
        title: Slips are locked after sign-off
        steps:
          - As tsu open the Negotiation tab of the signed-off request; try to resend a QS.
        expected: Every round shows Locked; the resend is refused.
        msg: [The slips are locked since the ManCom sign-off, QS_LOCKED]
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 3
        type: Positive
        data: [TD-PM-12]
        title: Sign-off without upload attaches a generated record
        steps:
          - Sign off a request without uploading a sheet; open the Documents tab.
        expected: A MANCOM_SIGNOFF document with the sign-off reference MC-<request number> is attached.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 4
        type: Negative
        title: The submitter of the requirements cannot sign off
        pre: A test user holds TSU and MANCOM (test lead sets it up for this case) and submitted the requirements.
        steps:
          - As that user click Sign off and send to MBS.
        expected: Refused.
        msg: [ManCom signs off requirements submitted by someone else, PKG_FOUR_EYES]
      - c: 4
        type: Workflow
        title: ManCom returns the pack to TSU
        steps:
          - Click Return to TSU; reason Missing supporting documents; confirm.
        expected: The request is in REQUIREMENTS_PREP; a RETURNED decision is recorded; tsu is notified.

  FR-PM-042:
    scenario: SC-PM-05
    persona: MBS
    screen: SETUP
    data: [TD-PM-06]
    conditions:
      - MBS cannot set up a package before the ManCom sign-off.
      - Set-up creates a draft version whose terms equal the signed-off proposed terms.
      - Incomplete requirements returned by MBS reach TSU with the reason.
      - A second draft for the same product and a risk code outside the line pattern are refused.
    cases:
      - c: 1
        type: Negative
        screen: API
        data: [TD-PM-05]
        title: Set-up before sign-off
        steps:
          - As mbs call POST .../requests/{id}/setup on PKR-2026-900004 (FOR_MANCOM).
        expected: Refused; the request stays in FOR_MANCOM.
        msg: [MBS receives signed-off requirements only (BRPM.015), PKG_NOT_WITH_MBS]
      - c: 2
        type: Workflow
        title: Set up the RENEW version of MTR15
        steps:
          - Open PKR-2026-900005 (WITH_MBS); click Set up package version; change summary "Renewal term"; confirm.
          - Open the linked version from the Set-up tab.
        expected: The request moves to FOR_VALIDATION; the draft version of MTR15 has the rate scheme, dates, coverages and insurers of the signed-off terms and shows the request number and ManCom reference as origin.
        auto: PackageRequestProcessIT#anAdvisoryIsBlockedWithoutItsDocumentsAndARenewalNeedsNoNegotiation; PackageLogicTest#proposedTermsBecomeAPackageSpecAndAVersionPrefillsTerms
      - c: 2
        type: Positive
        data: [TD-PM-12]
        title: NEW request - MBS gives the risk code and name
        steps:
          - On the signed-off NEW request of TD-PM-12, click Set up package version; risk code LIA41, product name "UAT CGL Programme", change summary; confirm.
        expected: Product LIA41 is created pending and version 1 is a draft linked to the request.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 3
        type: Workflow
        title: Return incomplete requirements to TSU
        steps:
          - Click Return incomplete requirements to TSU; reason Incomplete or incorrect details; comment "computation basis missing".
        expected: The request is in REQUIREMENTS_PREP; tsu is notified and sees the reason.
      - c: 3
        type: Negative
        title: Return without a reason
        steps:
          - Click Return incomplete requirements to TSU without a reason.
        expected: Refused.
        msg: ["Select a reason for 'Return incomplete requirements to TSU'", WORKFLOW_REASON_REQUIRED]
      - c: 4
        type: Negative
        data: [TD-PM-04, TD-PM-08]
        title: Second draft for MTR12
        steps:
          - Signed-off UPDATE request on MTR12 while MTR12 v2 is still DRAFT; click Set up package version.
        expected: Refused.
        msg: [Product MTR12 already has a version being set up, VERSION_IN_PROGRESS]
        auto: CatalogVersionIT#aPackageVersionIsDraftedValidatedAndReleased
      - c: 4
        type: Negative
        data: [TD-PM-12]
        title: Risk code outside the line pattern at set-up
        steps:
          - Set up the NEW request with risk code CGL-X (line LIABILITY has a pattern).
        expected: Refused.
        msg: [Risk code CGL-X does not follow the naming convention of LIABILITY, PRODUCT_CODE_PATTERN]

  FR-PM-043:
    scenario: SC-PM-05
    persona: TSU_HEAD
    screen: VALQ
    data: [TD-PM-08]
    conditions:
      - The MBS user who set up or submitted the version cannot validate it.
      - A released version prices new quotations from its effective date and not before.
      - A returned version is editable again and the request is back with MBS.
      - An incomplete version cannot be submitted, and Validate and Release needs every checklist item.
    cases:
      - c: 1
        type: Negative
        persona: MBS
        screen: API
        title: MBS cannot validate the version it made
        steps:
