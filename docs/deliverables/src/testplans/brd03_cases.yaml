          - As mbs call POST /api/v1/catalog/products/MTR12/versions/2/validate.
        expected: HTTP 403 (mbs does not hold PRODUCT_VALIDATE); the version stays FOR_VALIDATION.
        auto: CatalogProductMaintenanceApiIT#permissionsFollowTheActionMatrix
      - c: 1
        type: Negative
        persona: BUSINESS_ADMIN
        title: A validator who submitted the version cannot validate it
        pre: badmin also holds PRODUCT_MAINTAIN for this case and submitted the version.
        steps:
          - As badmin click Validate and release.
        expected: Refused.
        msg: [A package version is validated by someone other than its maker and submitter, MAKER_CHECKER_VIOLATION]
        auto: CatalogIT#productsAreMakerCheckerAndListedInTheInbox
      - c: 2
        type: Workflow
        title: TSU Head validates and releases MTR12 v2
        steps:
