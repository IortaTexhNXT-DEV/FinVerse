        expected: Nothing is saved.
        msg: [Select the cover type, PKG_REQUEST_INCOMPLETE]
        auto: packageRequest.test.ts#validates the mandatory fields
      - c: 2
        type: Negative
        title: Submission without target insurers and end date names both items
        steps:
          - Save a NEW request with name, line, cover type and reason only.
          - Click Submit for approval.
        expected: The request stays in DRAFT and the message lists the missing requested terms, package end date and target insurer.
        msg: ["Complete the request: <items>", PKG_REQUEST_INCOMPLETE]
        auto: packageRequest.test.ts#lists the gaps of the submission and builds the API body
      - c: 3
        type: Positive
        title: AMEND request pre-fills the terms of the current version
        data: [TD-PM-11]
        steps:
          - New Package Request, type Amend package terms, line MOTOR, package product MTR10.
        expected: The requested terms show the coverages, deductibles, rate scheme and insurers of the MTR10 version in force; they can be changed before saving.
        auto: PackageLogicTest#proposedTermsBecomeAPackageSpecAndAVersionPrefillsTerms
      - c: 3
        type: Negative
        title: AMEND request without package product
        steps:
          - New Package Request, type Amend package terms, line MOTOR, no package product; Save.
        expected: Nothing is saved.
        msg: [Select the package product of the AMEND request, PKG_REQUEST_INCOMPLETE]
      - c: 4
        type: Negative
        title: Client-specific request without client
        steps:
          - New Package Request, type Amend package terms, scope Client-specific package, package MTR34, no client; Save.
        expected: Nothing is saved.
        msg: [Select the client of the client-specific package (PQ14), PKG_REQUEST_INCOMPLETE]
        auto: PackageRequestProcessIT#aClientSpecificPackageGoesThroughMarketingReviewAndReturns
      - c: 5
        type: Negative
        title: Package end date before the start date
        steps:
          - On a draft, set package start 01-Jan-2027 and package end 31-Dec-2026; Save.
        expected: The draft is not saved.
        msg: [The package end date must be after its start date, PKG_DATES_INVALID]
      - c: 5
