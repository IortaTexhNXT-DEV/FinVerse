        title: Release logged by the product master feed
        steps:
          - Release a version (TC-PM-043.2-01); open the application log or Integration Events for the feed entry.
        expected: One entry with product, version and effective date; no external transport is called (PQ16).
      - c: 1
        type: Negative
        persona: MKT_AO
        title: A user who is not a stage owner is not notified
        steps:
          - As ao open the bell after the request of TC-PM-072.1-01 entered FOR_TSU_REVIEW.
        expected: ao, who is not an owner of FOR_TSU_REVIEW, has no notification for that stage entry.
        auto: WorkflowServiceIT#queuesShowOnlyTheStagesOfTheUsersTeamAndSupportClaimAndAssignment

  FR-PM-073:
    scenario: SC-PM-07
    persona: TSU
    screen: REQ
    data: [TD-PM-05, TD-PM-02]
    conditions:
      - A request cannot move past a stage without its checks and approvals, even through the API.
      - A request past its stage SLA raises an SLA alert to the stage owners.
      - Only the transitions of the workflow are possible.
    cases:
      - c: 1
        type: Negative
        persona: MBS
        screen: API
        title: MBS set-up without the ManCom sign-off through the API
        steps:
          - As mbs call POST .../requests/{id}/setup on PKR-2026-900004 (FOR_MANCOM).
        expected: Refused; the request stays in FOR_MANCOM.
        msg: [MBS receives signed-off requirements only (BRPM.015), PKG_NOT_WITH_MBS]
      - c: 1
        type: Security-access
        screen: API
        title: A user without the stage permission cannot move the case
        steps:
          - As tsu call the workflow action approve on a request in FOR_MKT_APPROVAL.
        expected: Refused.
        msg: ["You are not allowed to 'Approve and send to TSU'", WORKFLOW_ACTION_NOT_PERMITTED]
        auto: ProductMaintenanceFoundationIT#requestCaseMovesThroughTheApprovalChain
      - c: 2
        type: Positive
        persona: SYSTEM
        screen: NOTIF
        title: SLA alert to the stage owners
        steps:
          - Leave PKR-2026-900002 in FOR_TSU_REVIEW beyond 24 hours; let the SLA check run; as tsulead open the bell.
        expected: tsulead has an SLA alert for PKR-2026-900002; the request is red on the home page.
        auto: PackageExpiryIT#theSlaParametersAreCopiedIntoTheWorkflowStages
      - c: 3
        type: Negative
        screen: API
        title: Action not allowed in the stage
        steps:
          - Call the workflow action terms_final on PKR-2026-900001 (DRAFT).
        expected: Refused.
        msg: ["'terms_final' is not allowed while PKR-2026-900001 is in stage {Draft request}", WORKFLOW_TRANSITION_NOT_ALLOWED]
        auto: ProductMaintenanceFoundationIT#workflowIsSeededWithOwnersAndValidTransitions
      - c: 2
        type: Positive
        persona: SYSADMIN
        screen: PARAMS
        title: A changed SLA parameter reaches the stage
        steps:
          - Set PKG_SLA_NEGOTIATION to 96; run the daily job; open a request in NEGOTIATION.
        expected: The due time of the stage uses 96 hours.
        auto: PackageExpiryIT#theSlaParametersAreCopiedIntoTheWorkflowStages

  FR-PM-080:
    scenario: SC-PM-08
    persona: MBS
    screen: INCENT
    data: [TD-PM-09, TD-PM-11]
    conditions:
      - A criterion is active only after another user authorises it.
      - A criterion on an inactive product, without products or value, with invalid rule parameters or an overlapping period cannot be saved.
      - An amended active criterion stays active until its successor is authorised, with no gap; deactivation end-dates it.
      - The history shows every earlier version of the criterion.
    cases:
      - c: 1
        type: Workflow
        title: New criterion authorised by badmin
        steps:
          - Click New Criterion; code UAT1, name "UAT campaign", type Sales campaign (demo), value basis Fixed amount, value 500, effective from today; products MTR12; save.
          - As badmin authorise it in My Approvals.
        expected: Saved as Pending authorisation; after authorisation Active.
        auto: CatalogProductMaintenanceApiIT#coveragesClausesIncentivesAndExceptionsAreMaintainedOverHttp; IncentiveCriteriaIT#criteriaAreValidatedAuthorisedAmendedAndDeactivated
      - c: 1
        type: Negative
        screen: APPROVALS
        title: The maker cannot authorise the criterion
        steps:
          - As mbs open My Approvals.
        expected: UAT1 is not offered to mbs; a direct authorise call is refused.
        msg: [A record cannot be authorized by the user who maintained it, MAKER_CHECKER_VIOLATION]
        auto: IncentiveCriteriaIT#criteriaAreValidatedAuthorisedAmendedAndDeactivated
      - c: 2
        type: Negative
        title: Criterion without products
        steps:
          - New Criterion with every attribute but no product; save.
        expected: Not saved.
        msg: [Select at least one product of the products matrix, INCENTIVE_PRODUCTS_REQUIRED]
        auto: IncentiveCriteriaIT#criteriaAreValidatedAuthorisedAmendedAndDeactivated
      - c: 2
        type: Negative
        title: Criterion on a retired product
        steps:
          - New Criterion on product MTR32 (retired in TC-PM-045.1-01).
        expected: Not saved.
        msg: [Product MTR32 is not an active product of the matrix, INCENTIVE_PRODUCT_NOT_ACTIVE]
      - c: 2
        type: Negative
        title: Rate criterion without value
        steps:
          - Value basis Rate, value empty; save.
        expected: Not saved.
        msg: [Enter the value of the incentive criterion, INCENTIVE_VALUE_REQUIRED]
        auto: productMaintenanceForms.test.ts#requires products, a value and logical dates
      - c: 2
        type: Negative
        title: Rule parameters not valid JSON
        steps:
          - Value basis Rule, rule parameters "{minimumPremium 5000"; save.
        expected: Not saved.
        msg: [The rule parameters must be valid JSON, INCENTIVE_RULE_PARAMS_INVALID]
      - c: 2
        type: Negative
        title: Overlapping period for the same code
        steps:
          - New Criterion with code CPC2 effective from today.
        expected: Not saved.
        msg: [Criterion CPC2 already covers part of this period, INCENTIVE_PERIOD_OVERLAP]
        auto: IncentiveCriteriaIT#criteriaAreValidatedAuthorisedAmendedAndDeactivated
      - c: 3
        type: Workflow
        title: Amend CPC2 through a successor
        steps:
          - Open CPC2; click Amend; value 1.25, effective from next month; save.
          - Check CPC2 before authorisation; authorise as badmin; check again.
        expected: Before authorisation the old row stays Active; after authorisation the old row ends the day before the successor starts and the successor is Active.
        auto: IncentiveCriteriaIT#criteriaAreValidatedAuthorisedAmendedAndDeactivated
      - c: 3
        type: Negative
        title: Direct edit of an active criterion
        steps:
          - Call PUT /api/v1/catalog/incentive-criteria/{id} on the active CPC2.
        expected: Refused.
        msg: [An active criterion is changed by amending it (successor), INCENTIVE_ACTIVE_LOCKED]
      - c: 3
        type: Workflow
        title: Deactivate a criterion
        steps:
          - Open UAT1; click Deactivate; confirm.
        expected: UAT1 is Inactive with today as end date.
        auto: CatalogProductMaintenanceApiIT#coveragesClausesIncentivesAndExceptionsAreMaintainedOverHttp
      - c: 4
        type: Positive
        title: History of CPC2
        steps:
          - Open CPC2; History.
        expected: Every version of CPC2 is listed with its values, dates, maker and authoriser, linked to its successor.
        auto: CatalogProductMaintenanceApiIT#coveragesClausesIncentivesAndExceptionsAreMaintainedOverHttp

  FR-PM-081:
    scenario: SC-PM-08
    persona: MBS
    screen: BOOKING
    data: [TD-PM-09, TD-PM-14]
    conditions:
      - An invoice on a product covered by CPC2 carries CPC2 and the incentive flag.
      - Retiring or expiring the product raises INCENTIVE_PRODUCT_INACTIVE for its criteria without deleting them.
      - The former booking incentive rules are read-only.
    cases:
      - c: 1
        type: Positive
        title: Booked invoice on MTR12 carries CPC2
        steps:
          - Book an invoice on MTR12 that meets CPC2 (premium above PHP 5,000).
          - Open the booked invoice.
        expected: The invoice shows criteria code CPC2 and the incentive flag.
        auto: IncentiveCriteriaIT#bookingStampsTheMatchedCriteriaCodes
      - c: 1
        type: Negative
        title: Invoice on a product outside CPC2 has no code
        steps:
          - Book an invoice on a non-package product.
        expected: No criteria code and no incentive flag.
        auto: IncentiveCriteriaIT#bookingStampsTheMatchedCriteriaCodes
      - c: 2
        type: Positive
        screen: NOTIF
        title: Retirement flags the criteria of the product
        pre: A criterion active on MTR32 before its retirement.
        steps:
          - Retire MTR32 (TC-PM-045.1-01); as mbs open the bell and Incentive Criteria.
        expected: Alert INCENTIVE_PRODUCT_INACTIVE names the criterion and MTR32; the criterion is still listed.
        auto: IncentiveCriteriaIT#criteriaOfAPackageThatIsNoLongerSoldAreFlagged
      - c: 3
        type: Negative
        persona: BUSINESS_ADMIN
        screen: BOOKING
        title: Former booking incentive rule cannot be changed
        steps:
          - Open Booking > Booking Setup, incentive rules; try to edit a rule.
        expected: Refused.
        msg: [Incentive rules are maintained in Product Maintenance > Incentive Criteria, INCENTIVE_RULES_FROZEN]
        auto: IncentiveCriteriaIT#bookingStampsTheMatchedCriteriaCodes

access:
  - action: Create and submit a package request
    screen: NEWREQ
    permission: PKG_REQUEST
    allow: [MKT_AO, MKT_TL, TSU]
    deny: [MBS, MANCOM, AUDITOR]
    allowed: New Package Request is shown; the draft is saved and submitted.
    denied: New Package Request is not shown; POST /requests returns HTTP 403 (ACCESS_DENIED).
    auto: ProductMaintenanceApiIT#permissionsAreEnforced
  - action: Approve a package request (Marketing)
    screen: REQ
    permission: PKG_REQUEST_APPROVE
    allow: [MKT_TL]
    deny: [MKT_AO, TSU, TSU_HEAD]
    denied: Approve and send to TSU is not shown; the API call returns HTTP 403.
    auto: ProductMaintenanceApiIT#aRequestIsCreatedAndSubmittedOverHttp
  - action: Recommend a request (TSU TL)
    screen: TSUWB
    permission: PKG_TSU_RECOMMEND
    allow: [TSU_TL]
    deny: [TSU, TSU_HEAD, MKT_TL]
    denied: Recommend for approval is not shown; the API call returns HTTP 403.
  - action: Approve a request (TSU Head)
    screen: TSUWB
    permission: PKG_TSU_APPROVE
    allow: [TSU_HEAD]
    deny: [TSU, TSU_TL, MKT_TL]
    denied: Approve for negotiation is not shown; the API call returns HTTP 403.
  - action: Prepare quotation slips and key in responses
    screen: NEG
    permission: PKG_NEGOTIATE
    allow: [TSU, TSU_TL]
    deny: [MKT_AO, MKT_TL, MBS]
    denied: The Negotiation tab is read only; round and response calls return HTTP 403.
  - action: Approve a quotation slip
    screen: NEG
    permission: PKG_QS_APPROVE
    allow: [TSU_TL]
    deny: [TSU, TSU_HEAD]
    denied: Approve and send is not shown; the API call returns HTTP 403.
    auto: ProductMaintenanceApiIT#aRequestIsCreatedAndSubmittedOverHttp
  - action: ManCom sign-off
    screen: REQM
    permission: PKG_MANCOM_SIGNOFF
    allow: [MANCOM]
    deny: [TSU, TSU_HEAD, MBS]
    denied: Sign off and send to MBS is not shown; POST /signoff returns HTTP 403.
    auto: ProductMaintenanceApiIT#permissionsAreEnforced
  - action: Set up or retire a package (MBS)
    screen: SETUP
    permission: PRODUCT_MAINTAIN
    allow: [MBS]
    deny: [TSU, TSU_HEAD, BUSINESS_ADMIN]
    denied: Set up package version is not shown; POST /setup returns HTTP 403.
    auto: ProductMaintenanceApiIT#permissionsAreEnforced
  - action: Validate and release a package version
    screen: VALQ
    permission: PRODUCT_VALIDATE
    allow: [TSU_HEAD, BUSINESS_ADMIN]
    deny: [MBS, MKT_AO, TSU]
    denied: Validation Queue is not in the menu; POST /validate returns HTTP 403.
    auto: CatalogProductMaintenanceApiIT#permissionsFollowTheActionMatrix
  - action: Send a package advisory
    screen: ADV
    permission: PKG_ADVISORY
    allow: [TSU, TSU_TL]
    deny: [MKT_AO, MBS]
    denied: Send is not shown; POST /advisories/{aid}/send returns HTTP 403.
    auto: ProductMaintenanceApiIT#permissionsAreEnforced
  - action: Open Package Expiry and generate renewal requests
    screen: EXPIRY
    permission: PKG_NEGOTIATE, PRODUCT_MAINTAIN or PKG_REPORT_VIEW
    allow: [TSU, MBS, TSU_HEAD]
    deny: [MKT_AO]
    denied: Package Expiry is not in the menu; GET /expiry returns HTTP 403.
    auto: ProductMaintenanceApiIT#permissionsAreEnforced
  - action: View expired and retired packages
    screen: PRODUCTS
    permission: PRODUCT_ARCHIVE_VIEW
    allow: [MBS, TSU_HEAD, BUSINESS_ADMIN, AUDITOR]
    deny: [MKT_AO, TSU]
    denied: The Expired and Retired filters are not shown; ?lifecycle=EXPIRED returns HTTP 403.
    auto: CatalogProductMaintenanceApiIT#permissionsFollowTheActionMatrix
  - action: Maintain coverages, clauses and field rules
    screen: COVCL
    permission: PRODUCT_MAINTAIN
    allow: [MBS]
    deny: [MKT_AO, TSU_HEAD]
    denied: New buttons are not shown; POST /catalog/coverages returns HTTP 403.
    auto: CatalogProductMaintenanceApiIT#permissionsFollowTheActionMatrix
  - action: Authorise product masters, criteria and rate exceptions
    screen: APPROVALS
    permission: PRODUCT_AUTHORIZE
    allow: [BUSINESS_ADMIN, NB_APPROVER]
    deny: [MBS, TSU_HEAD]
    denied: The records are not offered in My Approvals; the authorise call returns HTTP 403.
  - action: Maintain incentive criteria
    screen: INCENT
    permission: INCENTIVE_CRITERIA_MAINTAIN
    allow: [MBS]
    deny: [MKT_AO, TSU]
    denied: New Criterion is not shown; the screen is read only.
  - action: Run the package reports
    screen: REPORTS
    permission: PKG_REPORT_VIEW
    allow: [MKT_TL, TSU_HEAD, MBS, AUDITOR]
    deny: [MKT_AO, TSU]
    denied: The three reports are not listed; the run call returns HTTP 403.

findings:
  - fr: FR-PM-002
    issue: The FRS gives the no-access text as "You do not have access to this page". The built screen shows "You do not have access to this screen. Contact your administrator if you need it." (frontend/src/auth/RequireAuth.tsx).
    proposal: Change the FRS text to the built wording in v1.1; the cases use the built wording.
  - fr: FR-PM-034
    issue: 'The FRS validation "Compile with no response - There are no responses to compare" has no code and no such message in BIBS. The build refuses the compilation before the QS of the round is sent with COMPARATIVE_NO_TERMS ("Send the quotation slip of round n first"); a sent round with only Pending responses compiles a master of Pending rows.'
    proposal: State in the FRS which case is refused (QS not sent) and whether a master of Pending rows is acceptable; the cases test COMPARATIVE_NO_TERMS.
  - fr: FR-PM-035
    issue: 'The FRS asks for "Select at least one field and one insurer". The build checks the insurer (COMPARATIVE_NO_INSURER) and the title; an empty field selection is not refused with its own message.'
    proposal: Confirm whether an empty field list is refused; if so add the check and its message to the FRS; until then only the insurer and title checks are tested.
  - fr: FR-PM-071
    issue: 'The message "Enter a whole number of days" in the FRS has no match in the code; the report engine validates parameter types with its own messages (ReportParametersTest).'
    proposal: Quote the report engine's parameter message in the FRS; TC-PM-071.3-02 records the actual text at first run.
  - fr: FR-PM-073
    issue: 'The FRS gives "The action <action> is not allowed in stage <stage>" without a code. The build returns WORKFLOW_TRANSITION_NOT_ALLOWED with "''<action>'' is not allowed while <reference> is in stage <stage name>".'
    proposal: Add the code and the built wording to the FRS.
  - fr: FR-PM-012
    issue: 'Acceptance criterion 3 ("The field list per line is set up by MBS as each package is set up (content Q02)") depends on BDOI content that is not yet given, so it cannot be tested as written. The unsafe-pattern message "The pattern is not a valid expression" differs from the build ("The risk-code pattern is not a valid regular expression", CODE_PATTERN_INVALID, for line patterns).'
    proposal: Replace criterion 3 with a testable statement (MBS adds a field rule for a line without IT) and align the pattern message with the build.
  - fr: FR-PM-001
    issue: 'The FRS messages "Invalid user ID or password" and "Your account is locked. Contact the System Administrator" differ from the build ("Invalid user name or password", "Account is locked. Contact your administrator.", code AUTHENTICATION_FAILED). The threshold is given only as "configured"; the build reads LOGIN_MAX_FAILED_ATTEMPTS (3 as delivered). The log-in endpoint also rate-limits (LOGIN_RATE_LIMITED, HTTP 429), which the FRS does not mention.'
    proposal: Quote the built messages and code, name the parameter and its value, and add the rate limit to FR-PM-001.
  - fr: FR-PM-021
    issue: Button labels in the FRS are in title case ("Approve and Send to TSU", "Sign Off and Send to MBS"); the screens use the workflow labels in sentence case ("Approve and send to TSU", "Sign off and send to MBS").
    proposal: Use the screen labels in FRS v1.1 so testers and users read the same words.
