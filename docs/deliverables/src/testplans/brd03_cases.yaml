  FR-PM-011:
    scenario: SC-PM-02
    persona: MBS
    screen: COVCL
    data: [TD-PM-11]
    conditions:
      - A clause is selectable in insurer terms only after authorisation and within its effective dates.
      - An end-dated clause stays readable on the versions that used it and is never deleted.
      - A clause without wording or with an end date before its start date is refused.
    cases:
      - c: 1
        type: Workflow
        title: New warranty is selectable after authorisation
        steps:
          - Coverages & Clauses > Clauses > New Clause; code UAT_W01, kind Warranty, line MOTOR, title "Garage warranty", effective from today, wording "Warranted that the vehicle is garaged overnight."; save.
          - Open MTR12 v2, Insurer Terms of INS-MGIC, coverage OD_THEFT, Clauses list.
          - As badmin, authorise UAT_W01 in My Approvals; reopen the Clauses list as mbs.
        expected: Before authorisation UAT_W01 is not in the list; after authorisation it is.
        data: [TD-PM-08]
        auto: CatalogProductMaintenanceApiIT#coveragesClausesIncentivesAndExceptionsAreMaintainedOverHttp
      - c: 1
        type: Boundary
        title: A clause effective from next month is not offered today
        steps:
          - Create and authorise clause UAT_W02 effective from the first day of next month.
          - Open the Clauses list of MTR12 v2 (version effective in 30 days) and of a version effective today.
        expected: UAT_W02 is offered only on a version whose effective date is on or after the clause start date.
      - c: 2
        type: Positive
        screen: VERSION
        title: An end-dated clause stays readable on the version that used it
        steps:
