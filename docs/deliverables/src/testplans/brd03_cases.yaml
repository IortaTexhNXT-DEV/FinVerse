        expected: Refused.
        msg: [The package needs its cover type and at least one included basic coverage (PMADD01), PACKAGE_HIERARCHY_INCOMPLETE]
        auto: CatalogVersionIT#aSubmittedVersionIsReturnedAndACompleteHierarchyIsRequired
      - c: 4
        type: Negative
        screen: VERSION
        title: Validate and release stays disabled until the checklist is complete
        steps:
