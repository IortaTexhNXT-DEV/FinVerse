scenarios:
  - id: SC-PM-01
    persona: SYSADMIN
    title: Access, roles and audit. Users log in, see only the Product Maintenance screens of their role, and every action leaves an audit trail; role changes go through an approved access request.
    pre: Demo users of TD-PM-01 are active; the audit trail is empty for the test period.
  - id: SC-PM-02
    persona: MBS
    title: Product structure and master data. MBS maintains coverages, clauses, field rules and insurer terms under maker-checker; documents are generated from shared templates.
    pre: Catalogue data of TD-PM-11; badmin available as authoriser.
  - id: SC-PM-03
    persona: MKT_AO
    title: Package request and approvals. Marketing raises a package request; the Marketing approver, the TSU TL and the TSU Head approve it under four-eyes rules.
    pre: Requests TD-PM-02 and TD-PM-03; a fresh request TD-PM-12.
  - id: SC-PM-04
    persona: TSU
    title: Negotiation and comparative tables. TSU sends quotation slips, records insurer outcomes over two rounds, makes the terms final and produces the comparative master and a client view; Marketing reviews client-specific terms.
    pre: Request TD-PM-04 in NEGOTIATION, or TD-PM-12 approved by the TSU Head.
  - id: SC-PM-05
    persona: TSU
    title: Sign-off, set-up and release. TSU submits the requirements pack, ManCom signs off, MBS sets up the version, the validator releases it and TSU sends the advisory; a RETIRE request retires a package.
    pre: Requests TD-PM-05, TD-PM-06 and TD-PM-07; version TD-PM-08.
  - id: SC-PM-06
    persona: MKT_AO
    title: Versions and pricing. A new package version is released while the old one keeps selling; new business is priced on the version in force; deviations need a rate exception; expired packages are archived.
    pre: Version TD-PM-08; quotation data TD-PM-14.
  - id: SC-PM-07
    persona: TSU
    title: Expiry, renewal and monitoring. The expiry monitor alerts TSU and MBS, TSU drafts renewal requests, and the home page, reports and notifications show the state of every request.
    pre: Package TD-PM-10; requests TD-PM-02 to TD-PM-07.
  - id: SC-PM-08
    persona: MBS
    title: Incentive criteria. MBS maintains CPC2 and other criteria on the products matrix under maker-checker; booking stamps the matched codes; retired products flag their criteria.
    pre: Criterion TD-PM-09; badmin available as authoriser.

frs:
  FR-PM-001:
    scenario: SC-PM-01
    persona: MKT_AO
    screen: LOGIN
    data: [TD-PM-01]
    conditions:
      - A user with valid credentials and a Product Maintenance role logs in and sees the Product Maintenance menu section.
      - Wrong credentials are refused and no session is created.
      - The account locks after the configured number of failed attempts and the System Administrator unlocks it.
      - Log-ins and failed attempts are recorded in the audit trail.
    cases:
      - c: 1
        type: Positive
        title: Marketing AO logs in and sees the Product Maintenance section
        steps:
          - Open the BIBS URL.
          - Enter user ID ao and the demo password; click Sign in.
          - Open the side menu.
        expected: The home page opens. The menu shows the section Product Maintenance with Product Maintenance Home, Package Requests, Products, Coverages & Clauses and Incentive Criteria.
        auto: ApiSmokeIT#loginReturnsTokenAndWrongPasswordIsRejected
      - c: 1
        type: Positive
        persona: TSU_HEAD
        title: TSU Head logs in and sees the TSU screens
        steps:
          - Log in as tsuhead.
          - Open the side menu, section Product Maintenance.
        expected: The section lists Product Maintenance Home, Package Requests, TSU Workbench, Package Expiry, Products, Validation Queue, Coverages & Clauses and Incentive Criteria.
      - c: 2
        type: Negative
        title: Log-in with a wrong password is refused
        steps:
          - Enter user ID ao and a wrong password; click Sign in.
        expected: The Login page stays open and no session starts.
        msg: [Invalid user name or password, AUTHENTICATION_FAILED]
        auto: ApiSmokeIT#loginReturnsTokenAndWrongPasswordIsRejected
      - c: 3
        type: Boundary
        neg: true
        title: The account locks at the configured number of failed attempts
        pre: Administration > System Parameters shows LOGIN_MAX_FAILED_ATTEMPTS (3 as delivered).
        steps:
          - Enter user ID ao2 with a wrong password as many times as the threshold.
          - Enter the correct password.
        expected: The last wrong attempt locks the account; the correct password is then refused until the System Administrator unlocks the user in Administration > Users.
        msg: [Account is locked. Contact your administrator., AUTHENTICATION_FAILED]
        auto: LoginLockoutTest#theAccountLocksAtTheConfiguredThreshold; UserAdminApiIT#userLifecycleLockoutUnlockAndPasswordReset
      - c: 3
        type: Boundary
        title: One attempt below the threshold does not lock the account
        steps:
          - Enter user ID ao2 with a wrong password (threshold minus 1) times.
          - Enter the correct password.
        expected: The log-in succeeds; the failed-attempt counter resets.
        auto: LoginLockoutTest#theDefaultThresholdIsFive
      - c: 4
        type: Positive
        persona: AUDITOR
        screen: AUDIT
        title: Successful and failed log-ins appear in the audit trail
        pre: Cases TC-PM-001.1-01 and TC-PM-001.2-01 ran today.
        steps:
          - Log in as auditor and open Administration > Audit Trail.
          - Filter on today's date and the users ao and ao2.
        expected: Each successful and failed log-in shows the user, time and source address.
        auto: LogoutIT#logoutRevokesTheTokenAndIsAudited

  FR-PM-002:
    scenario: SC-PM-01
    persona: MKT_AO
    screen: REQS
    data: [TD-PM-01]
    conditions:
      - The menu shows only the screens the user's roles allow.
      - A direct link or API call without the permission is refused and logged.
      - A four-eyes rule refuses the action even when the role holds the permission.
      - The User Access Matrix shows the areas each role may view, create, amend and approve and exports both views to Excel.
    cases:
      - c: 1
        type: Security-access
        neg: false
        title: Marketing AO does not see the TSU and validation screens
        steps:
          - Log in as ao and open the side menu.
        expected: Product Maintenance Home, Package Requests and the catalogue screens are shown; TSU Workbench, Package Expiry and Validation Queue are not in the menu.
        auto: ProductMaintenanceFoundationIT#demoPersonasHoldTheirProductMaintenancePermissions
      - c: 2
        type: Security-access
        screen: VALQ
        title: Direct link to the Validation Queue without PRODUCT_VALIDATE
        steps:
          - Log in as ao.
          - Type the address /catalog/validation in the browser.
        expected: The page shows "You do not have access to this screen. Contact your administrator if you need it." No queue data is loaded.
        auto: CatalogProductMaintenanceApiIT#permissionsFollowTheActionMatrix
      - c: 2
        type: Security-access
        screen: API
        title: Approval API called by a user without the approval permission
        steps:
          - Log in as ao and take the token.
          - Call POST /api/v1/product-maintenance/requests/{id}/approve for a request in FOR_MKT_APPROVAL.
          - Log in as auditor and open Administration > Audit Trail.
        expected: The call returns HTTP 403 and the request does not move. The refused call is logged with user, endpoint and time.
        msg: [You are not permitted to perform this action, ACCESS_DENIED]
        auto: ProductMaintenanceApiIT#permissionsAreEnforced
      - c: 3
        type: Negative
        persona: MKT_TL
        screen: REQ
        title: A Marketing TL cannot approve a request the TL submitted
        pre: mkttl creates and submits a request (TD-PM-12).
        steps:
          - Log in as mkttl and open the request.
          - Click Approve and send to TSU.
        expected: BIBS refuses the approval although MKT_TL holds PKG_REQUEST_APPROVE; the request stays in FOR_MKT_APPROVAL.
        msg: [A package request is approved by someone other than its maker, PKG_FOUR_EYES]
        data: [TD-PM-12]
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 4
        type: Report-output
        persona: BUSINESS_ADMIN
        screen: MATRIX
        title: User Access Matrix by action class, exported to Excel
        steps:
          - Log in as badmin and open Broking Setup > User Access Matrix.
          - Choose the view By Action and the area PACKAGE_REQUEST.
          - Switch to the view By Permission.
          - Click Export to Excel in each view.
        expected: The By Action view shows, per role, VIEW / CREATE / AMEND / APPROVE for the area (for example MKT_AO has CREATE on PACKAGE_REQUEST, MKT_TL has APPROVE). Both views download as .xlsx with the same content as the screen, and the export is audited.
        auto: RolePermissionRequestIT#matrixShowsActionClassesByPermissionAndByAction
      - c: 4
        type: Security-access
        screen: MATRIX
        title: A Marketing AO cannot open the User Access Matrix
        steps:
          - Log in as ao and type the address /broking-setup/access-matrix.
        expected: The screen is not in the menu and the direct link shows the no-access page.
        auto: AccessRequestIT#accessMatrixListsRolesAgainstPermissions

  FR-PM-003:
    scenario: SC-PM-01
    persona: BUSINESS_ADMIN
    screen: ACCREQ
    data: [TD-PM-01]
    conditions:
      - A role change takes effect only after another user approves the request.
      - The requester cannot approve the own request, and an empty change is refused.
      - A rejected request leaves the role unchanged.
      - The role history shows who requested, approved and applied each change.
    cases:
      - c: 1
        type: Workflow
        title: Add PKG_REPORT_VIEW to MKT_AO through an approved request
        steps:
          - Log in as badmin; open Broking Setup > Access Requests; click New Request.
          - Choose type Modify role permissions, role MKT_AO, permission to add PKG_REPORT_VIEW, justification "AO needs package reports".
          - Submit. Log in as ao and check the Reports list.
          - Log in as approver; open the request and click Approve.
          - Log in as ao again and open Reports.
        expected: Before approval ao has no package reports. After approval the role holds PKG_REPORT_VIEW and ao sees the Package Status Update Report.
        auto: RolePermissionRequestIT#approvedChangeAddsAndRemovesPermissionsOfTheRole
      - c: 2
        type: Negative
        title: The requester cannot approve the own role change
        pre: A test user holding ACCESS_REQUEST and ACCESS_APPROVE (set up by the test lead for this case) submitted a Modify role permissions request.
        steps:
          - As that user, open the request and click Approve.
        expected: The approval is refused; the request stays pending.
        msg: [A request cannot be decided by the user who submitted it, ACCESS_FOUR_EYES]
        auto: RolePermissionRequestIT#approvedChangeAddsAndRemovesPermissionsOfTheRole
      - c: 2
        type: Negative
        title: A request without any permission to add or remove is refused
        steps:
          - New Request, type Modify role permissions, role MKT_AO; leave both permission lists empty; enter a justification; submit.
        expected: The form marks the permission lists and the request is not submitted.
        msg: [Grant or withdraw at least one permission]
        auto: accessRequest.test.ts
      - c: 2
        type: Negative
        title: A request that changes nothing is refused
        steps:
          - New Request, type Modify role permissions, role MKT_AO; add PKG_REQUEST (already granted); justification; submit.
        expected: The request is not saved.
        msg: ["The request does not change the permissions of role {MKT_AO}", ACCESS_NO_PERMISSION_CHANGE]
        auto: RolePermissionRequestIT#invalidChangesAreRefused
      - c: 3
        type: Negative
        persona: NB_APPROVER
        title: A rejected role change leaves the role as it was
        pre: badmin submitted a request to remove PRODUCT_VIEW from AUDITOR.
        steps:
          - Log in as approver; open the request; click Reject and enter the reason "Auditor keeps read access".
          - Open Broking Setup > User Access Matrix for AUDITOR.
        expected: The request shows Rejected with the reason; AUDITOR still holds PRODUCT_VIEW; badmin is notified of the decision.
        auto: AccessRequestIT#createdUserIsAppliedOnApprovalWithATemporaryPassword
      - c: 4
        type: Positive
        persona: AUDITOR
        screen: AUDIT
        title: Role change history shows requester, approver and applied change
        pre: TC-PM-003.1-01 is done.
        steps:
          - Open the approved request in Access Requests (read only), then Administration > Audit Trail filtered on role MKT_AO.
        expected: The request shows requester badmin, approver approver, dates and the permissions added; the audit trail holds the request, the decision and the applied change with users and times.
        auto: RolePermissionRequestIT#roleChangeIsRequestedAndReadOverHttp

  FR-PM-004:
    scenario: SC-PM-02
    persona: TSU
    screen: EMAILS
    data: [TD-PM-04, TD-PM-11]
    conditions:
      - A document e-mailed outside BIBS is a protected file and its password goes in a separate e-mail.
      - Each e-mail is logged with recipient, time, subject, attachment name and SHA-256 hash; a failed send can be resent.
      - A user without Product Maintenance permissions cannot open the request's documents.
    cases:
      - c: 1
        type: Upload-download
        title: The quotation slip reaches the insurer as a protected PDF with the password separately
        pre: A round of TD-PM-12 is approved by tsulead and sent (TC-PM-030.2-01).
        steps:
          - Open the test mailbox of INS-MGIC.
          - Open the QS attachment without a password, then with the password from the second e-mail.
        expected: Two e-mails arrive for the insurer. The first carries the QS PDF, which asks for a password; the second carries the password only. The PDF opens with it.
        auto: MessagingIT#protectedAttachmentsAreEncryptedAndThePasswordFollowsSeparately
      - c: 2
        type: Positive
        title: The E-mails tab logs each send with the attachment hash
        steps:
          - Open the request, E-mails tab.
        expected: One row per e-mail with recipient, time, subject, attachment name, SHA-256 hash and status Sent; the password e-mails are listed without the password text.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 2
        type: Negative
        screen: MESSAGES
        title: A failed delivery shows Failed and is resent
        pre: The test mail relay refuses the address of one insurer (test lead sets a bad address on INS-MPI).
        steps:
          - Send a QS to INS-MPI.
          - Open the E-mails tab; open Broking Setup > Outbound Messages and resend the failed message after correcting the address.
        expected: The send shows Failed after the retries; the resend is logged as a new attempt with status Sent.
        auto: MessagingIT#failedDeliveriesAreRetriedThenMarkedFailedAndCanBeResent
      - c: 3
        type: Security-access
        screen: DOCS
        title: A user without Product Maintenance permissions cannot open the documents
        pre: A user holding only a non-broking role (for example a GL user of the finance demo) exists.
        steps:
          - Log in as that user and open /product-maintenance/requests/{id} of TD-PM-04.
          - Call GET .../requests/{id}/form.pdf with the user's token.
        expected: The page shows the no-access message; the download returns HTTP 403.
        msg: [You are not permitted to perform this action, ACCESS_DENIED]

  FR-PM-005:
    scenario: SC-PM-01
    persona: TSU_HEAD
    screen: HIST
    data: [TD-PM-07]
    conditions:
      - The History tab of a released request lists every step from submission to release with user and time.
      - A changed insurer response keeps its earlier values in the response history.
      - No screen or API edits or deletes audit rows.
    cases:
      - c: 1
        type: Positive
        title: History of a released request from submission to release
        steps:
          - Open PKR-2026-900006, History tab.
        expected: The list shows submit, approve, recommend, approve for negotiation, terms final, release or skip, submit requirements, sign off, set up and version released, each with user and time, in time order.
      - c: 2
        type: Positive
        screen: NEG
        data: [TD-PM-04]
        title: A corrected insurer response shows both values
        steps:
          - Open PKR-2026-900003, Negotiation tab, round 2, response of INS-MGIC; save rate 0.30.
          - Edit the same response to rate 0.32 and save.
          - Open the response history.
        expected: The history shows 0.30 and then 0.32 with the user and time of each save.
        auto: PackageRequestProcessIT#aNewPackageRunsFromDraftToReleasedWithTwoRoundsAndAnAdvisory
      - c: 3
        type: Negative
        persona: SYSADMIN
        screen: AUDIT
        title: The audit trail cannot be edited or deleted
        steps:
          - Log in as admin; open Administration > Audit Trail and look for edit or delete actions on a row.
          - Ask the DBA in the test environment to run an UPDATE and a DELETE on the audit table.
        expected: The screen has no edit or delete action. The database refuses the UPDATE, DELETE and TRUNCATE.
        auto: AuditTrailImmutabilityIT#updateDeleteAndTruncateAreRejected

  FR-PM-010:
    scenario: SC-PM-02
    persona: MBS
    screen: COVCL
    data: [TD-PM-11]
    conditions:
      - A new coverage or product is usable only after another user authorises it.
      - A packaged product cannot be saved without its cover type, and a subtype cannot have subtypes.
      - A risk code that breaks its line's naming pattern is refused.
      - The maker cannot authorise the own record; a rejected record stays unusable.
    cases:
      - c: 1
        type: Workflow
        title: New Motor coverage is pending until badmin authorises it
        steps:
          - Log in as mbs; open Coverages & Clauses; click New Coverage.
          - Line MOTOR, code UAT_ROADSIDE, name "Roadside assistance (UAT)", kind Extension; save.
          - Open the draft version MTR12 v2 and look for the coverage in the coverage list.
          - Log in as badmin; open My Approvals; authorise the coverage.
          - As mbs, open MTR12 v2 again.
        expected: After saving, the coverage shows Pending authorisation and is not offered on the version. After authorisation it is Active and can be added to the version.
        data: [TD-PM-08, TD-PM-11]
        auto: CatalogProductMaintenanceApiIT#coveragesClausesIncentivesAndExceptionsAreMaintainedOverHttp
      - c: 2
        type: Negative
        screen: PRODUCTS
        title: A packaged product without cover type is refused
        steps:
          - Products > New Product; line MOTOR, code MTR91, tick Packaged; leave Cover type blank; save.
        expected: The product is not saved.
        msg: [A package needs its cover type (PMADD01), PACKAGE_HIERARCHY_INCOMPLETE]
        auto: CatalogVersionIT#aSubmittedVersionIsReturnedAndACompleteHierarchyIsRequired
      - c: 2
        type: Negative
        screen: PRODUCTS
        title: A subtype under a subtype is refused
        steps:
          - Create a cover type under the existing subtype of COMPREHENSIVE (cover type level 3).
        expected: BIBS refuses the record.
        msg: [A subtype cannot have subtypes (Type > Subtype only), COVER_TYPE_DEPTH]
      - c: 3
        type: Negative
        screen: PRODUCTS
        title: A risk code outside the line pattern is refused
        pre: The line MOTOR has the code pattern ^MTR\d{2}$ (set by the test lead).
        steps:
          - New Product on line MOTOR with code MOTOR-X1 and cover type COMPREHENSIVE; save.
        expected: The product is not saved.
        msg: [Risk code MOTOR-X1 does not follow the naming convention of MOTOR, PRODUCT_CODE_PATTERN]
      - c: 3
        type: Boundary
        screen: PRODUCTS
        title: A risk code that matches the pattern is accepted
        steps:
