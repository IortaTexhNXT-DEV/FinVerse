        title: Effective to before effective from is refused
        steps:
          - New Clause UAT_W04, effective from 01-Nov-2026, effective to 31-Oct-2026; save.
        expected: The clause is not saved.
        msg: [The effective-to date is before the effective-from date, EFFECTIVITY_INVALID]

  FR-PM-012:
    scenario: SC-PM-02
    persona: MBS
    screen: RULES
    data: [TD-PM-11, TD-PM-14]
    conditions:
      - A presence rule stops submission of a quotation or account without the field and names the field.
      - A range rule refuses a value outside the range and accepts the limits.
      - The most specific scope applies in addition to the wider ones.
      - An incomplete rule or an unsafe pattern is refused when the rule is saved.
    cases:
      - c: 1
        type: Negative
        brd: [BRPM.004]
        persona: MKT_AO
        screen: QUOTE
        title: Motor account without plate number is refused and names the field
        pre: MBS added and badmin authorised a Line-scope rule on MOTOR, target Item, field Plate number, check Presence.
        steps:
          - Log in as ao; create a quotation on MTR12 with one vehicle without plate number; submit.
        expected: Submission is refused; the plate number field of the vehicle is marked and the message names the item and the field.
        msg: ["Item {1}: {Plate number} is required"]
        auto: CatalogIT#minimumFieldMatrixAppliesTheNarrowestScope
      - c: 1
        type: Positive
        brd: [BRPM.003]
        title: MBS sets up a presence rule for a line without IT
        steps:
          - Open product MTR12, Field Rules & Documents tab; click New Rule.
          - Scope Line, line MOTOR, target Item, field Plate number, check type Presence; save.
          - As badmin, authorise the rule.
        expected: The rule is listed with status Active for the line MOTOR.
        auto: CatalogIT#minimumFieldMatrixAppliesTheNarrowestScope
      - c: 2
        type: Boundary
        brd: [BRPM.004]
        persona: MKT_AO
        screen: QUOTE
        title: Range rule accepts the limits and refuses the value outside
        pre: An authorised Range rule on MOTOR, field Year of manufacture, minimum 2011, maximum 2027.
        steps:
          - Quote a vehicle with year 2011; then with 2027; then with 2010.
        expected: 2011 and 2027 are accepted; 2010 is refused with the field named.
        msg: ["{Year of manufacture} must be between 2011 and 2027"]
        neg: true
        auto: CatalogVersionIT#typedFieldRulesCheckTheGivenValues
      - c: 3
        type: Positive
        brd: [BRPM.003, BRPM.004]
        persona: MKT_AO
        screen: QUOTE
        title: Product rule applies on top of the line rule
        pre: Line rule of TC-PM-012.1-02 and a Product-scope rule on MTR12 requiring Chassis number.
        steps:
          - Quote MTR12 with neither plate nor chassis number; submit.
          - Quote MTR10 with neither; submit.
        expected: MTR12 lists both missing fields; MTR10 lists only Plate number.
        auto: CatalogIT#minimumFieldMatrixAppliesTheNarrowestScope
      - c: 4
        type: Negative
        brd: [BRPM.003]
        title: A Range rule without limits is refused
        steps:
          - New Rule, check type Range, leave minimum and maximum empty; save.
        expected: The rule is not saved.
        msg: [Complete the parameters of the RANGE rule, FIELD_RULE_INCOMPLETE]
        auto: CatalogVersionIT#typedFieldRulesCheckTheGivenValues
      - c: 4
        type: Negative
        brd: [BRPM.003]
        title: An unsafe pattern is refused
        steps:
          - New Rule, check type Pattern, pattern (a+)+\1; save.
        expected: The rule is not saved.
        msg: [Complete the parameters of the PATTERN rule, FIELD_RULE_INCOMPLETE]

