findings:
  - fr: FR-CL-001
    issue: 'The FRS messages "You do not have access to this page" and "Your account is locked. Contact the System Administrator" differ from the build ("You do not have access to this screen. Contact your administrator if you need it." in the frontend; "Account is locked. Contact your administrator." with code AUTHENTICATION_FAILED). The lock-out message is given without its code.'
    proposal: Quote the built wording and the code AUTHENTICATION_FAILED in FR-CL-001; the cases use the built wording.
  - fr: FR-CL-004
    issue: 'The validation "The end date must be on or after the start date" has no match in the code. The Report Centre checks the range with its own parameter message (ReportParametersTest).'
    proposal: Quote the report engine's range message in the FRS; TC-CL-004.2-01 records the actual text at first run.
  - fr: FR-CL-032
    issue: "The detail check \"'<value>' is not a date (yyyy-mm-dd) / an amount\" is written as one message; the build returns two messages under CLX_DISPOSITION_DETAIL (\"'<value>' is not a date (yyyy-mm-dd)\" and \"'<value>' is not an amount\"). The FRS also does not say which details each Operations action requires (only the pick-up date and check amount are named)."
    proposal: List the required details per action (check pick-up, 2307 CASH / CERTIFICATE, DP reversal) and give the two messages apart.
  - fr: FR-CL-074
    issue: 'The FRS gives the status note of a rejected request as "Rejected by Cashiering - <reason>"; the screen shows "Rejected by Cashiering: <reason>". The refusal texts Cashiering returns at once (unknown payment, no balance, amount above balance, no invoice) are not quoted.'
    proposal: Quote the refusal texts Cashiering returns and how the handler sees them on Requests to Cashiering.
  - fr: FR-CL-091
    issue: FR-CL-091 to FR-CL-094 specify draft requirements BRCLXN.061-064 that are not built; their validations ("The incentive is not eligible for billing", "The invoice has an unresolved adjustment and is excluded") have no code. The BRD trace of these FRs is written "BRCLXN.061 (p.8-9, draft)" without quotes, so the comma splits it into two BRD references ("BRCLXN.061 (p.8-9" and "draft)") when the FRS is read.
    proposal: Quote the trace values (for example "BRCLXN.061 (p.8-9, draft)") and keep the cases of these FRs marked "run when built" until BDOI confirms the draft (CQ01).
  - fr: FR-CL-033
    issue: 'Several trace values of FR-CL-033 and FR-CL-084 contain commas ("Report fields Last Collection Effort Date, Code, Remarks (p.59)", "Categories A, B, C (p.41 / 61)"); they are split into references such as "B", "C" and "Code" when the traceability is read.'
    proposal: Write these references without commas or quote them so they stay one trace each.
  - fr: FR-CL-005
    issue: 'Acceptance criterion 2 ("After 15 minutes without release, mkttl can take the lock") needs the tester to wait 15 minutes or change the lock time in the database; the FRS does not say whether the lock is renewed while the holder keeps working.'
    proposal: State whether activity on the account renews the lock and how the expiry is shown to the holder.
  - fr: FR-CL-017
    issue: The acceptance criterion "A payment applied at 10:00 reduces the account's outstanding before 10:05" has no parameter or design reference for the five minutes; the refresh after a ledger movement is event-driven.
    proposal: State the expected delay as a non-functional target, or remove the time from the criterion.
