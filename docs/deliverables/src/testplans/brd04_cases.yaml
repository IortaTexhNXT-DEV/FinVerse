        steps:
          - Open the account and its Summary tab.
        expected: The Summary shows 50,000.00 booked, -5,000.00 endorsements and adjustments, 20,000.00 payments applied and 25,000.00 net outstanding.
        auto: CollectionsApiIT#theWorklistAndTheAccountPageAreRead
      - c: 2
        type: Positive
        title: Components add up to the net
        steps:
          - On the same Summary tab, add the rows basic premium, DST, VAT, LGT, other charges and PR2307.
        expected: The sum equals the net outstanding shown.
      - c: 2
        type: Negative
        title: The Summary cannot be edited
        steps:
          - Try to change any amount on the Summary tab.
        expected: The figures are read only; there is no edit action.

  FR-CL-017:
    scenario: SC-CL-02
    persona: SYSTEM
    screen: JOBS
    conditions:
      - CLX_DAILY_REFRESH runs after the end of day and lists the invoices booked during the day.
      - A payment applied during the day reduces the listed account within minutes.
      - A failed run is recorded and raises CLX_REFRESH_FAILED.
      - Running the refresh twice gives the same result; a CLX_WORK user refreshes one account on demand.
    cases:
      - c: 1
        type: Positive
        persona: BUSINESS_ADMIN
        title: The nightly run lists the day's invoices and reports its counts
        steps:
          - The morning after TD-CL-09 is booked, log in as badmin and open the job run history of CLX_DAILY_REFRESH.
          - Search the worklist for the invoice.
        expected: The run of 22:15 shows start, end, counts and SUCCEEDED; the invoice is on Open Accounts.
        auto: CollectionsWorklistIT#theDailyRefreshJobListsTheLedgerAndReportsItsCounts
      - c: 2
        type: Positive
        persona: MKT_COLLECTION
        screen: WL
        title: A same-day payment is shown within five minutes
        steps:
          - At 10:00 ask the cashier to apply a payment of 5,000.00 to a listed account.
          - Before 10:05 open the account.
        expected: The outstanding is reduced by 5,000.00 without waiting for the nightly run.
      - c: 3
        type: Negative
        screen: ALERTS
        title: A failed run raises the alert
        pre: The test lead makes the run fail on SIT (for example by stopping the database connection pool of the job).
        steps:
          - Run CLX_DAILY_REFRESH.
          - Open the job run history and the alerts.
        expected: The run is FAILED and the alert CLX_REFRESH_FAILED is raised; the next run repeats the refresh.
      - c: 4
        type: Positive
        persona: MKT_SECTION_HEAD
        screen: SETUP
        title: A second refresh changes nothing
        steps:
          - Click Refresh now twice in a row.
        expected: The second run creates and completes no account; counts and balances are unchanged.
        auto: CollectionsSeedDataIT#aSecondStartChangesNothing
      - c: 4
        type: Positive
        persona: MKT_COLLECTION
        screen: ACC
        title: Refresh from Ledger on one account
        steps:
          - Open an account with a payment applied a minute ago and click Refresh from Ledger.
        expected: The outstanding, aging and flags of the account are refreshed.
      - c: 4
        type: Security-access
        persona: MKT_AO
        screen: API
        title: Whole refresh needs CLX_SETUP
        steps:
          - With the token of ao, POST /api/v1/collections/refresh.
        expected: HTTP 403; no run is started.
        msg: [You are not permitted to perform this action, ACCESS_DENIED]

  FR-CL-018:
    scenario: SC-CL-02
    persona: MKT_COLLECTION
    screen: WL
    data: [TD-CL-02]
    conditions:
      - A fully paid account moves to Completed Collections with all its history.
      - A new disposition supersedes the previous one, which stays on the tab.
      - Accounts, dispositions and efforts cannot be deleted.
    cases:
      - c: 1
        type: Workflow
        title: Fully paid account keeps its dispositions
        pre: An account with three dispositions.
        steps:
          - Ask the cashier to apply the full outstanding; run the refresh.
          - Open Completed Collections and the account.
        expected: The account is COMPLETED; the Dispositions & Efforts tab shows the three dispositions and the efforts.
        auto: CollectionsWorklistIT#aBookedInvoiceIsListedAssignedByRuleAndCompletedWhenPaid
      - c: 2
        type: Positive
        screen: DISP
        title: A new disposition supersedes the previous one
        steps:
          - Record "Coordinate further" on an account, then "Request bank AO assistance".
        expected: The current disposition is Request bank AO assistance; Coordinate further stays on the tab marked superseded.
        auto: CollectionsWorklistIT#aDpDispositionReachesTheCommissionDpListAndASecondDispositionWithdrawsIt
      - c: 3
        type: Negative
