      - c: 4
        type: Negative
        screen: API
        title: Account of another company
        pre: An invoice of the second seed company.
        steps:
          - POST a disposition for that invoice with the company FVI.
        expected: The account is refused.
        msg: ["{invoice} belongs to another company", CLX_ITEM_OTHER_COMPANY]

  FR-CL-032:
    scenario: SC-CL-04
    persona: MKT_COLLECTION
    screen: WL
    data: [TD-CL-02, TD-CL-05]
    conditions:
      - '"For check pick-up" queues a request in Cashiering''s Check Pick-up with the details given.'
      - '"DP PR for reversal" puts the account on the Commission DP list; "PR 2307 for reversal" queues a 2307 item for Cashiering.'
      - A later disposition withdraws a PENDING hand-off; an item pending for more than a day raises CLX_OUTBOX_STALE.
      - A DP account returned by the insurer reopens with the disposition "DP returned by insurer".
      - The details of a hand-off are validated.
    cases:
      - c: 1
        type: Workflow
        title: Check pick-up reaches Cashiering
        steps:
          - Record "For check pick-up" on an account with pick-up date tomorrow, address, contact person, check amount 12,000.00, check number and bank.
          - Log in as cashier and open Check Pick-up.
        expected: The request is in the pick-up queue with the date and address; the account's Hand-offs tab shows it PENDING, then TAKEN.
        auto: CollectionsWorklistIT#aCheckPickupDispositionReachesTheCashieringPickupQueue
      - c: 2
        type: Workflow
        persona: COMMREC
        screen: DPACC
        title: DP PR for reversal reaches the Commission DP list
        steps:
          - As clxhandler record "DP PR for reversal" on an account.
          - Log in as commrec and open DP Accounts.
        expected: The account is on the DP list with its invoicing branch.
        auto: CollectionsWorklistIT#aDpDispositionReachesTheCommissionDpListAndASecondDispositionWithdrawsIt
      - c: 2
        type: Workflow
        screen: HANDOFF
        title: PR 2307 for reversal queues a 2307 item
        steps:
          - Record "PR 2307 for reversal" with path CERTIFICATE and the certificate number.
          - Open the Hand-offs to Operations tab.
        expected: A COLLECTION_CWT2307 item is PENDING for Cashiering's 2307 intake.
      - c: 3
        type: Workflow
        screen: HANDOFF
        title: A later disposition withdraws the pending hand-off
        steps:
          - On the DP account above, before Commission takes it, record "Coordinate further".
        expected: The DP item is CANCELLED; the account leaves the DP list.
        auto: CollectionsWorklistIT#aDpDispositionReachesTheCommissionDpListAndASecondDispositionWithdrawsIt
      - c: 3
        type: Negative
        persona: SYSTEM
        screen: ALERTS
        title: Hand-off not taken for a day raises the alert
        pre: A PR 2307 item left PENDING for more than a day (Cashiering does not pull it yet).
        steps:
