        expected: The bars show the open amounts of CBG per bracket of CLX_AGING_BRACKETS, in bracket order.
        auto: collectionsLogic.test.ts#orders the brackets and scales the bars

  FR-CL-090:
    scenario: SC-CL-09
    persona: COMMREC
    screen: DPACC
    conditions:
      - An account is billed only after the CRU reviewer confirms it fully paid to the insurer.
      - A billing is refused for an account not confirmed, or when nothing is confirmed.
      - A disposition or an SOA never creates a CR billing.
    cases:
      - c: 1
        type: Workflow
        title: Confirmed DP account is billed
        steps:
          - Open DP Accounts, select the account tagged DP PR for reversal and confirm it fully paid to the insurer (commtl as reviewer).
          - Create a billing with the account.
        expected: The account is on the billing of its insurer.
        auto: CommissionIT#aBillingIsAnsweredCollectedAndThePremiumReceivableReversed
      - c: 2
        type: Negative
        title: Account not confirmed
        steps:
          - Try to add a DP account not yet confirmed to a billing.
        expected: The account is refused.
        msg: ["Account {invoice} is not confirmed for billing ({tag})", DP_ITEM_STATE]
      - c: 2
        type: Negative
        title: Nothing confirmed
        steps:
          - Create a billing when no account of the insurer is confirmed.
        expected: No billing is created.
        msg: [No account is confirmed for billing, DP_NOTHING_TO_BILL]
      - c: 3
        type: Negative
        title: A DP disposition alone creates no billing
        steps:
          - As clxhandler record DP PR for reversal on a new account; as commrec open DP Billings.
        expected: The account waits on DP Accounts with its tag; no billing line exists.

  FR-CL-091:
    scenario: SC-CL-09
    persona: COMMREC
    screen: DPACC
    conditions:
      - Regular commission and incentives are separate receivables with their own accounts.
      - An incentive is not billed before its eligibility is met.
    cases:
      - c: 1
        type: Positive
        title: Commission and incentive as two receivables (run when built)
        pre: Draft requirement BRCLXN.061, not built (CQ01). Run this case once BDOI confirms the draft and the function is delivered.
        steps:
          - Book an invoice with commission and an eligible incentive; open the receivables of the invoice.
        expected: Two receivables with different accounts - commission receivable and incentive receivable (Other Income).
      - c: 2
        type: Negative
        title: Incentive before eligibility (run when built)
        pre: As above.
        steps:
          - Try to bill the incentive of an invoice that does not meet the criteria.
        expected: The billing is refused; the incentive is not eligible for billing.

  FR-CL-092:
    scenario: SC-CL-09
    persona: COMMREC
    screen: DPACC
    conditions:
      - A campaign run bills the qualified invoices through a system-generated service invoice.
      - Invoices with unresolved adjustments, cancellations or partial payments are excluded.
    cases:
      - c: 1
        type: Positive
        title: Invoice paid within the campaign window (run when built)
        pre: Draft requirement BRCLXN.062, not built (CQ01).
        steps:
          - Run the campaign for a period with an invoice paid within X days of booking.
        expected: The invoice is billed on a system-generated service invoice with the withholding tax and the campaign code.
      - c: 2
        type: Negative
        title: Pending negative adjustment excluded (run when built)
        pre: As above.
        steps:
          - Run the campaign with a qualified invoice that has a pending negative adjustment.
        expected: The invoice is excluded and listed with the reason.

  FR-CL-093:
    scenario: SC-CL-09
    persona: COMMREC
    screen: DPACC
    conditions:
      - A negative adjustment on a collected commission creates a commission refund, not a negative CR line.
    cases:
      - c: 1
        type: Positive
        title: Refund from a negative endorsement (run when built)
        pre: Draft requirement BRCLXN.063, not built (CQ01).
        steps:
          - Book a negative endorsement on an invoice whose commission is collected.
        expected: A commission refund linked to the original commission and the endorsement is created.
      - c: 1
        type: Negative
        title: The refund stays off the CR statement (run when built)
        pre: As above.
        steps:
          - Open the CR statement of account and the CRU aging.
        expected: The refund is not a CR line and is not in the CR aging.

  FR-CL-094:
    scenario: SC-CL-09
    persona: COMMREC
    screen: DPACC
    conditions:
      - On a mixed payment only the confirmed direct portion is CR-collectible.
    cases:
      - c: 1
        type: Positive
        title: 40 % paid directly (run when built)
        pre: Draft requirement BRCLXN.064, not built (CQ01); formula to confirm (CQ19).
        steps:
          - Premium 100,000.00 with 40,000.00 paid directly and confirmed; open the CR receivable.
        expected: The collectible commission is 40 % of the commission.
      - c: 1
        type: Negative
        title: Unconfirmed direct portion not billed (run when built)
        pre: As above.
        steps:
          - Leave the direct portion unconfirmed and run the CR billing.
        expected: No CR is billed on the unconfirmed portion.

access:
  - action: View the PR Worklist and collection accounts
    screen: WL
    permission: CLX_VIEW
    allow: [MKT_AO, MKT_COLLECTION, CASHIER, DISBURSEMENT, COMPTROLLERSHIP, AUDITOR]
    deny: []
    allowed: The worklist and the account open read only for roles without CLX_WORK.
    auto: CollectionsAccountingFoundationIT#seedPersonasHoldTheirPermissions
  - action: Record dispositions, efforts and promises
    screen: WL
    permission: CLX_WORK
    allow: [MKT_AO, MKT_TL, MKT_HANDLER, MKT_COLLECTION, CLX_TL, MKT_SECTION_HEAD, PROCESSOR]
    deny: [UNAPPLIED_HANDLER, CASHIER, DISBURSEMENT, COMPTROLLERSHIP, AUDITOR]
