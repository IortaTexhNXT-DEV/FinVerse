  FR-CL-016:
    scenario: SC-CL-02
    persona: MKT_COLLECTION
    screen: SUM
    conditions:
      - The Summary tab shows the net outstanding and its movements in total and per component.
      - The component rows add up to the net outstanding.
    cases:
      - c: 1
        type: Positive
        title: Invoice with an endorsement and a payment
