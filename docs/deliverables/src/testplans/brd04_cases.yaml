    scenario: SC-CL-06
    persona: MKT_TL
    screen: ESCD
    data: [TD-CL-07]
    conditions:
      - The receiving level acknowledges and resolves an escalation with a resolution.
      - Resolve without a resolution is refused.
      - Escalate further and return need a reason; a returned escalation is resubmitted by the handler.
      - Only holders of CLX_ESCALATION_HANDLE act on an escalation.
    cases:
      - c: 1
