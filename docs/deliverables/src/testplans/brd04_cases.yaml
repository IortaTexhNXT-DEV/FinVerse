        expected: The invoice is not on Open Accounts; if listed, it is on the Excluded tab with status EXCLUDED_CANCELLED.
        auto: CollectionsWorklistIT#aDirectPaymentInvoiceWithoutReceivableIsNotListed
      - c: 2
        type: Positive
        screen: HOME
        title: Overpaid invoice shows as a credit balance
        pre: An invoice overpaid by 500.00 (total to collect -500.00).
        steps:
          - Run the refresh.
          - Open Collections Home and click the Credit Balances tile.
        expected: The account is on the Credit Balances tab with -500.00 and status CREDIT.

  FR-CL-014:
    scenario: SC-CL-02
    persona: MKT_COLLECTION
    screen: WL
    conditions:
      - By Account and By Client total the outstanding and PR2307 of the invoices of each group.
