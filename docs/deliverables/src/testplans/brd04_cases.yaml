        steps:
          - Run the refresh and view the client in By Client.
        expected: The group shows 1 invoice and 5,000.00; the 8.00 invoice is not an open account.

  FR-CL-015:
    scenario: SC-CL-02
    persona: MKT_COLLECTION
    screen: WL
