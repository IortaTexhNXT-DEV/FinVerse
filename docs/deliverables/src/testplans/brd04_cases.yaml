        steps:
          - Export the unfiltered worklist of more than 100 accounts; narrow the filter to fewer than 100 and export again.
        expected: The first export is refused; the second runs. Reset the cap to 50,000.
        msg: ["{101} accounts exceed the export limit of {100}; narrow the filters", CLX_EXPORT_TOO_LARGE]
        auto: CollectionsFilesIT#exportsAreCappedAndAFailedFileIsRecorded
      - c: 3
        type: Security-access
        persona: UNAPPLIED_HANDLER
        screen: FILES
        title: User without CLX_EXPORT cannot download
        steps:
          - Log in as upphandler, open Collections Files and click a file.
        expected: The files are listed; the download is refused (HTTP 403).

  FR-CL-085:
    scenario: SC-CL-09
    persona: MKT_COLLECTION
    screen: HOME
    conditions:
      - The home tiles count the user's work and open the worklist filtered to it.
      - The unapplied tiles are shown only to users with CLX_UNAPPLIED_WORK.
      - The chart shows the open amounts per aging bracket for all segments or one.
    cases:
      - c: 1
        type: Positive
        title: My Open Accounts opens the filtered worklist
        steps:
          - Log in as clxhandler; note the count of My Open Accounts; click the tile.
        expected: The worklist opens filtered on handler clxhandler and status OPEN with the same count.
        auto: collectionsLogic.test.ts#reads the tile links
      - c: 2
        type: Security-access
        persona: CASHIER
        title: No unapplied tiles without CLX_UNAPPLIED_WORK
        steps:
          - Log in as cashier and open Collections Home.
        expected: Unapplied Awaiting Disposition and My Requests in Cashiering are not shown.
        auto: CollectionsUnappliedIT#theHomeTilesAndReportsServeTheUnappliedHandlers
      - c: 2
