  FR-CL-042:
    scenario: SC-CL-05
    persona: MKT_COLLECTION
    screen: PROM
    data: [TD-CL-07, TD-CL-03]
    conditions:
      - A promise is KEPT, PARTIALLY_KEPT or BROKEN by the payments applied between its day and the promised date plus the grace days.
      - A broken promise notifies the recorder and the AO and escalates by the broken-promise rule.
      - A new promise replaces the running one; an open promise can be withdrawn, a closed one cannot.
      - Dates and amount of a promise are validated.
    cases:
      - c: 1
        type: Positive
        title: Kept promise
        steps:
          - Record a promise of 10,000.00 by the 15th on an invoice (day of promise today).
          - Ask the cashier to apply 10,000.00 on the 14th; after CLX_PROMISE_CHECK of the 15th open the promise.
        expected: Status KEPT.
        auto: CollectionsPlansRulesTest#aPromiseIsKeptPartlyKeptOrBroken; CollectionsEscalationIT#promisesAreKeptPartlyKeptSupersededAndWithdrawn
      - c: 1
        type: Positive
        title: Partly kept promise
        steps:
          - Record a promise of 10,000.00; apply 4,000.00 in time; run the promise check after the date.
        expected: Status PARTIALLY_KEPT.
        auto: CollectionsPlansRulesTest#aPromiseIsKeptPartlyKeptOrBroken
      - c: 2
        type: Workflow
        persona: SYSTEM
        screen: ESC
        title: Broken promise escalates to the team lead
        steps:
          - Record a promise with nothing applied; run the promise check after the date.
          - Log in as mkttl and open Escalations.
        expected: The promise is BROKEN; clxhandler and the AO are notified; an escalation of CLX-BROKEN-PROMISE is WITH_TL for mkttl the same night.
        auto: CollectionsEscalationIT#aBrokenPromiseEscalatesToTheTeamLead
      - c: 3
        type: Positive
        title: A new promise supersedes the running one; withdraw a promise
        steps:
          - Record a second promise on the invoice of a running promise.
          - Select the new promise and click Withdraw Promise.
        expected: The first promise is superseded; the second becomes CANCELLED.
        auto: CollectionsEscalationIT#promisesAreKeptPartlyKeptSupersededAndWithdrawn
      - c: 3
        type: Negative
        title: Withdraw a kept promise
        steps:
          - Select the KEPT promise of ARN-2026-940004 and click Withdraw Promise.
        expected: The withdrawal is refused.
        msg: ["The promise of {invoice} is already {KEPT}", CLX_PROMISE_CLOSED]
      - c: 4
        type: Negative
        title: Promised date before the day of the promise
        steps:
          - Record a promise dated yesterday with day of promise today.
        expected: The promise is refused.
        msg: [The promised date cannot be before the day of the promise, CLX_PROMISE_DATES]
        auto: labels.test.ts#checks the promise form
      - c: 4
        type: Negative
        title: Day of the promise in the future
        steps:
          - Record a promise with day of promise tomorrow.
        expected: The promise is refused.
        msg: [Enter the promised date; the day of the promise cannot be in the future, CLX_PROMISE_DATES]
      - c: 4
        type: Boundary
        neg: true
        title: Amount above the outstanding
        pre: An invoice with 12,000.00 outstanding.
        steps:
          - Record a promise of 12,000.01.
        expected: The promise is refused; 12,000.00 is accepted.
        msg: ["The promised amount {12,000.01} is above the outstanding {12,000.00}", CLX_PROMISE_OVER_BALANCE]
      - c: 4
        type: Negative
        title: Zero amount
        steps:
          - Record a promise of 0.00.
        expected: The promise is refused.
        msg: [The promised amount must be positive, CLX_PROMISE_AMOUNT]
      - c: 4
        type: Negative
        title: Promise on a paid invoice
        steps:
          - Record a promise on a fully paid invoice.
        expected: The promise is refused.
        msg: ["Invoice {no} has nothing to collect", CLX_PROMISE_NOTHING_DUE]
      - c: 4
        type: Negative
        screen: API
        title: Installment of another invoice
        steps:
          - POST a promise on invoice A with the installment id of the plan of invoice B.
        expected: The promise is refused.
        msg: ["The installment does not bill invoice {no}", CLX_PROMISE_INSTALLMENT]

