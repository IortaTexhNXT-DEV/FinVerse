  FR-CL-040:
    scenario: SC-CL-05
    persona: MKT_COLLECTION
    screen: PLANS
    data: [TD-CL-07]
    conditions:
      - A POLICY_YEARS plan splits each policy year of a multi-year account into the cycles of the billing frequency.
      - A GENERATED plan splits the outstanding of one invoice into equal installments; a MANUAL plan must add up to the outstanding.
      - An account or invoice that cannot be scheduled, or that already has a live plan, is refused.
      - An unpaid installment past its due date is OVERDUE and listed on Installments Due.
      - An active plan can be cancelled; a plan that is not active cannot.
    cases:
      - c: 1
        type: Positive
        title: Three-year account with a quarterly frequency
        pre: A three-year account booked with annual policy-year invoices and no live plan (book one with the TD-CL-07 values if the seed plan exists).
        steps:
          - Click New Installment Plan, basis POLICY_YEARS, the ARN, frequency Quarterly; save.
        expected: The plan has 12 installments, four per coverage year, each within its coverage year.
        auto: CollectionsPlansRulesTest#aThreeYearPeriodHasOneCycleAYearAnnuallyAndFourQuarterly; CollectionsPlansIT#aThreeYearAccountGetsAStatementOfAccountPerBillingCycle
      - c: 2
        type: Positive
        title: Generated plan of 4 installments
        pre: An invoice with 40,000.00 outstanding and no plan.
        steps:
          - New Installment Plan, basis GENERATED, the invoice, 4 installments, first due date next month; save.
        expected: Four installments of 10,000.00 a month apart; the rounding, if any, is on the last.
        auto: CollectionsPlansRulesTest#installmentsAreEqualWithTheRoundingOnTheLastAndAllocatedOldestFirst
      - c: 2
        type: Negative
        title: Manual plan that does not add up
        pre: An invoice with 40,000.00 outstanding.
        steps:
          - New Installment Plan, basis MANUAL, installments of 15,000.00 and 20,000.00; save.
        expected: The plan is refused.
        msg: ["The installments add up to {35,000.00} but the outstanding premium is {40,000.00}", CLX_PLAN_TOTAL_MISMATCH]
        auto: labels.test.ts#checks the new plan form per kind
      - c: 2
        type: Negative
        title: Manual plan with dates not increasing
        steps:
          - Enter two installments with the second due date before the first; save.
        expected: The plan is refused.
        msg: [Installment amounts must be positive and due dates increasing, CLX_PLAN_ENTRY_INVALID]
      - c: 2
        type: Negative
        title: Manual plan without installments
        steps:
          - Choose basis MANUAL, enter no installment; save.
        expected: The plan is refused.
        msg: [Enter at least one installment, CLX_PLAN_EMPTY]
      - c: 3
        type: Negative
        title: Second live plan on the same invoice
        steps:
          - Create a GENERATED plan on ARN-2026-940002's invoice, which has the quarterly plan.
        expected: The plan is refused.
        msg: ["Plan {no} already schedules this account; cancel it first", CLX_PLAN_EXISTS]
        auto: CollectionsPlansIT#onlyOpenReceivablesCanBeScheduled
      - c: 3
        type: Negative
        title: Invoice with nothing outstanding
        steps:
          - Create a GENERATED plan on a fully paid invoice.
        expected: The plan is refused.
        msg: ["Invoice {no} has no outstanding premium to schedule", CLX_PLAN_NOTHING_DUE]
        auto: CollectionsPlansIT#onlyOpenReceivablesCanBeScheduled
      - c: 3
        type: Negative
        title: Invoice not in the ledger
        steps:
          - Create a GENERATED plan on BI-2026-999999.
        expected: The plan is refused.
        msg: ["Invoice {BI-2026-999999} is not in the ledger", CLX_INVOICE_UNKNOWN]
      - c: 3
        type: Negative
        title: Direct-payment invoice
        steps:
          - Create a GENERATED plan on a direct-payment invoice.
        expected: The plan is refused; the invoice has no premium to collect.
        msg: ["Invoice {no} is {paid directly to the insurer} and has no premium to collect", CLX_INVOICE_NOT_COLLECTIBLE]
        auto: CollectionsPlansIT#onlyOpenReceivablesCanBeScheduled
      - c: 3
        type: Negative
        title: Account without a booked policy year
        steps:
          - Create a POLICY_YEARS plan on an ARN whose first policy year is not booked.
        expected: The plan is refused.
        msg: ["Account {ARN} has no booked policy year", CLX_PLAN_NOT_BOOKED]
      - c: 4
        type: Workflow
        screen: DUE
        title: Overdue installment is listed on Installments Due
        steps:
          - Open Installments Due.
        expected: The first installment of ARN-2026-940002 is listed OVERDUE with its due date and amount.
        auto: CollectionsPlansIT#aGeneratedPlanAllocatesPaymentsOldestDueFirstAndFlagsOverdue; CollectionsPlansRulesTest#theInstallmentStatusFollowsTheDueDateAndThePayments
      - c: 5
        type: Workflow
        screen: PLAN
        title: Cancel an active plan and cancel it again
        steps:
          - Open the generated plan of this FR, click Cancel with a reason.
          - Try to cancel the same plan again through POST .../plans/{id}/cancel.
        expected: The first cancel sets the plan CANCELLED; the second is refused.
        msg: ["Plan {no} is {CANCELLED} and cannot be cancelled", CLX_PLAN_NOT_ACTIVE]
        auto: registration.test.tsx#asks for a reason before confirming
      - c: 1
        type: Security-access
        persona: MKT_AO
        title: Marketing AO cannot create a plan
        steps:
          - Log in as ao and open Installment Plans.
        expected: New Installment Plan is not shown; POST .../plans/generated returns HTTP 403 (CLX_BILLING).

