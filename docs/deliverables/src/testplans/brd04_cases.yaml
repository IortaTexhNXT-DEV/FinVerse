        expected: The call is refused (HTTP 405 or 404) and the disposition stays.

  FR-CL-020:
    scenario: SC-CL-03
    persona: CLX_TL
    screen: ASSIGN
    conditions:
      - A new open account without a handler goes to the first active matching rule, tried in priority order.
      - An account without a matching rule goes to its AO, else stays unassigned.
      - A rule needs a name, ranges that start before they end and an eligible handler.
      - A deactivated rule is not tried.
    cases:
      - c: 1
        type: Positive
        data: [TD-CL-09]
        title: A CBG account goes to clxhandler
        steps:
          - Book TD-CL-09 for a CBG client and run the refresh.
          - Open the account.
        expected: The handler is clxhandler (rule "Consumer banking accounts", priority 10).
        auto: CollectionsWorklistIT#aBookedInvoiceIsListedAssignedByRuleAndCompletedWhenPaid
      - c: 2
        type: Positive
        title: No rule matches and the account goes to the AO
        pre: Deactivate rule 90 "All other accounts" for the case.
        steps:
          - Book an invoice for a non-CBG client of sales unit VIS and run the refresh.
        expected: The handler is the invoice's AO; activate rule 90 again after the case.
      - c: 3
        type: Negative
        title: Rule without a name
        steps:
          - Click New Rule, leave the name blank, give segment RETAIL and handler clxhandler; save.
        expected: The rule is not saved.
        msg: [Give the rule a name, CLX_RULE_NAME]
        auto: CollectionsWorklistIT#assignmentRulesAreMaintainedAndValidated
      - c: 3
        type: Negative
        title: Outstanding range reversed
        steps:
          - Enter a rule with outstanding from 50,000.00 to 10,000.00; save.
        expected: The rule is not saved.
        msg: [A range must start before it ends, CLX_RULE_RANGE]
        auto: CollectionsWorklistIT#assignmentRulesAreMaintainedAndValidated
      - c: 3
        type: Negative
        title: Handler without CLX_WORK
        steps:
          - Enter a rule with handler disb; save.
        expected: The rule is not saved.
        msg: ["{disb} is not an active collection handler", CLX_HANDLER_NOT_ELIGIBLE]
        auto: CollectionsWorklistIT#assignmentRulesAreMaintainedAndValidated
      - c: 4
        type: Workflow
        title: Deactivated rule is skipped
        steps:
          - Deactivate rule 10; book a CBG invoice and run the refresh.
        expected: The account goes to the next matching rule (90, mktcoll). Activate rule 10 again.
      - c: 1
        type: Security-access
        persona: MKT_AO
        title: Marketing AO cannot maintain rules
        steps:
          - Log in as ao and type /collections/assignments.
        expected: The screen is refused ("You do not have access to this screen. Contact your administrator if you need it."); POST .../assignment-rules returns HTTP 403.

  FR-CL-021:
    scenario: SC-CL-03
    persona: CLX_TL
    screen: ASSIGN
    data: [TD-CL-02]
    conditions:
      - A TL reassigns selected or matched accounts permanently or until an end date, after a preview.
      - A temporary assignment returns to the previous handler after its end date.
      - Each reassignment keeps the previous and new handler, kind, dates, reason and TL.
      - A reassignment needs accounts, a reason, a kind, a future end date when temporary and an eligible handler.
    cases:
      - c: 1
        type: Positive
        title: Temporary reassignment of the accounts of one unit
        steps:
          - Open Reassign by Criteria, choose sales unit T-CORP1 and click Preview.
          - Choose TEMPORARY until the last day of the month, new handler mktcoll, reason "Leave of handler"; confirm.
        expected: The preview lists the matched accounts; after confirming they show handler mktcoll.
        auto: CollectionsWorklistIT#reassignmentIsPreviewedAppliedAndATemporaryOneReverts
      - c: 2
        type: Workflow
        persona: SYSTEM
        title: Temporary assignment returns after its end date
        pre: The test lead sets the end date of the case above to yesterday.
        steps:
          - Run the refresh; open one of the accounts.
        expected: The handler is again mkthandler; both handlers are notified.
        auto: CollectionsWorklistIT#reassignmentIsPreviewedAppliedAndATemporaryOneReverts
      - c: 3
        type: Positive
        screen: HIST
        title: The history shows the reassignment
        steps:
          - Open one reassigned account, History tab (assignments).
        expected: The row shows previous handler, new handler, TEMPORARY, the dates, the reason and clxtl.
      - c: 4
        type: Negative
        title: Reassignment without a reason
        steps:
          - Select two accounts in the worklist, click Reassign, choose PERMANENT and handler mktcoll, leave the reason blank.
        expected: The reassignment is refused.
        msg: [Give the reason of the reassignment, CLX_REASSIGN_REASON]
        auto: CollectionsWorklistIT#reassignmentIsPreviewedAppliedAndATemporaryOneReverts
      - c: 4
        type: Boundary
        neg: true
        title: Temporary with today as end date
        steps:
          - Reassign one account TEMPORARY with end date today and a reason.
        expected: The reassignment is refused.
        msg: [A temporary reassignment needs an end date after today, CLX_REASSIGN_END_DATE]
      - c: 4
        type: Negative
        title: Criteria that match nothing
        steps:
          - Reassign by criteria with a client code that has no open account.
        expected: The reassignment is refused.
        msg: [No account matches the selection, CLX_REASSIGN_EMPTY]
      - c: 4
        type: Negative
        title: New handler not eligible
        steps:
          - Reassign one account to disb with a reason.
        expected: The reassignment is refused.
        msg: ["{disb} is not an active collection handler", CLX_HANDLER_NOT_ELIGIBLE]
      - c: 4
        type: Negative
        screen: API
        title: Kind missing
        steps:
          - POST /api/v1/collections/reassignments with accounts, reason and handler but no kind.
        expected: The call is refused with HTTP 422.
        msg: [A reassignment is PERMANENT or TEMPORARY, CLX_REASSIGN_KIND]

  FR-CL-030:
    scenario: SC-CL-04
    persona: MKT_SECTION_HEAD
    screen: LOV
    data: [TD-CL-05]
    conditions:
      - A value added and approved on CLX_PR_DISPOSITION is offered in Record Disposition.
      - A value past its end date is not offered and is refused on save.
      - The rules of a value (category, tagging owner, Operations action, allowed roles) are kept on Collections Setup and validated.
      - A value reserved to roles is refused for other roles.
    cases:
      - c: 1
        type: Positive
        persona: BUSINESS_ADMIN
        title: New disposition value usable after approval
        steps:
          - Log in as badmin, open Lists of Values, CLX_PR_DISPOSITION, add "Client disputes premium" effective today; save.
          - Log in as clxuh, approve it in My Approvals.
          - As clxhandler, open Record Disposition on an account.
        expected: The new value is offered after the approval, not before.
        auto: LovServiceIT#newValueIsUsableOnlyAfterAuthorizationAndWithinEffectivity
      - c: 2
        type: Negative
        persona: MKT_COLLECTION
        screen: API
        title: Value ended yesterday is refused
        pre: The test lead ends "Request bank AO assistance" yesterday.
        steps:
          - Open Record Disposition on an account.
          - POST the disposition with code of the ended value.
        expected: The value is not offered; the call is refused. Restore the end date afterwards.
        msg: ["{BANK_AO_ASSISTANCE} is not a value of {CLX_PR_DISPOSITION}", CLX_LOV_VALUE_UNKNOWN]
        auto: CollectionsWorklistIT#dispositionRulesAreEnforced
      - c: 3
        type: Positive
        screen: SETUP
        title: Section Head sets the category and tagging owner of a value
        steps:
          - Open Collections Setup, Disposition Rules; set category B and tagging owner MARKETING on "Cancel account"; save.
          - Record "Cancel account" on an account.
        expected: The account shows category B and tagging owner Marketing. Restore the rule (OPERATIONS) after the case.
      - c: 3
        type: Negative
        screen: SETUP
        title: Invalid category on a value
        steps:
          - Set the category of "Coordinate further" to D and save.
        expected: The rule is not saved.
        msg: ["'{D}' is not a valid {category}", CLX_LOV_ATTRIBUTE_VALUE]
      - c: 3
        type: Negative
        screen: API
        title: Unknown attribute of a value
        steps:
          - PUT /api/v1/collections/setup/lov-attributes with attribute colour on CLX_PR_DISPOSITION.
        expected: The call is refused.
        msg: ["{colour} is not an attribute of {CLX_PR_DISPOSITION}", CLX_LOV_ATTRIBUTE_UNKNOWN]
      - c: 4
        type: Security-access
        persona: MKT_HANDLER
        screen: WL
        title: Reserved value refused for a Marketing Handler
        steps:
          - Log in as mkthandler, select an own account and record "No / missing policy number".
        expected: The disposition is refused.
        msg: ["Disposition {NO_POLICY_NUMBER} is reserved to {PROCESSOR, MKT_COLLECTION, CLX_TL, MKT_SECTION_HEAD}", CLX_DISPOSITION_NOT_ALLOWED]
        auto: CollectionsWorklistIT#dispositionRulesAreEnforced
      - c: 4
        type: Security-access
        neg: false
        persona: PROCESSOR
        screen: WL
        title: Processing Unit records the reserved value
        steps:
          - Log in as proc, open an account and record "No / missing policy number".
        expected: The disposition is saved.

  FR-CL-031:
    scenario: SC-CL-04
    persona: MKT_COLLECTION
    screen: WL
    data: [TD-CL-02, TD-CL-05]
    conditions:
      - A disposition on one account becomes its current disposition with its category and tagging owner.
      - A user with CLX_BULK_UPDATE records one disposition on several accounts under one bulk reference, at most 500.
