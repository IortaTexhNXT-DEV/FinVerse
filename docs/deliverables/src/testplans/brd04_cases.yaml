          - Tag accounts of two sales units between Saturday and Friday.
          - On Monday after 08:00 open Collections Files, Weekly.
        expected: One DP PR and one PR 2307 file per sales unit and branch that has tags, each listing its accounts of the week.
        auto: CollectionsRulesTest#theWeekRunsSaturdayToFridayAndIsAvailableMonday
      - c: 2
        type: Negative
        title: Weekly file on Saturday
        steps:
          - On Saturday try to download the files generated on Friday.
        expected: The download is refused.
        msg: ["{file} is available from {Monday 08:00}", REPORT_FILE_NOT_AVAILABLE]
        auto: CollectionsFilesIT#weeklyAndMonthlyFilesWaitForTheirAvailabilityTime

  FR-CL-083:
    scenario: SC-CL-09
    persona: MKT_COLLECTION
    screen: FILES
    conditions:
      - Every day at 22:30 the Outstanding PR List and the Full Production Report are generated and available at once.
      - Each report is generated once per day.
    cases:
      - c: 1
        type: Report-output
        title: Yesterday's daily reports
        steps:
          - In the morning open Collections Files, Daily.
        expected: The Outstanding PR List (open accounts with outstanding) and the Full Production Report (invoices booked from the start of the month) of the previous evening are downloadable.
        auto: CollectionsFilesIT#dailyFilesArePublishedAvailableAtOnceAndOncePerDay
      - c: 2
        type: Negative
        persona: SYSTEM
        title: A second run the same day adds no file
        steps:
          - Run CLX_DAILY_FILES again the same evening.
        expected: No second file of the same report and date is created.
        auto: CollectionsFilesIT#dailyFilesArePublishedAvailableAtOnceAndOncePerDay

  FR-CL-084:
    scenario: SC-CL-09
    persona: MKT_COLLECTION
    screen: WL
    data: [TD-CL-03]
    conditions:
      - An export of the filtered worklist runs in the background and appears under Collections Files, Exports.
      - An export above CLX_EXPORT_MAX_ROWS is refused.
      - A user without CLX_EXPORT sees the files but cannot download them.
    cases:
      - c: 1
        type: Upload-download
