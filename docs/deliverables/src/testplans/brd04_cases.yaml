# Test plan BRD-4 Collections - test data file.
# Build: python docs/deliverables/src/testplans/build_test_plan.py docs/deliverables/src/testplans/brd04_cases.yaml
# Schema: see the header of build_test_plan.py. FR titles, BRD IDs and priorities come from the FRS.
# Messages and codes are the ones BIBS returns (backend/src/main, collections and the Operations
# modules it hands over to); labels are those of frontend/src/features/collections.

meta:
  brd: BRD-04
  name: Collections
  code: CL
  frs: FRS_BRD04_COLLECTIONS.md
  summary: TP_BRD04_COLLECTIONS.md
  version: "1.0"
  date: 25 September 2026
  built: true

personas:
  MKT_AO: {name: Marketing AO, user: ao, short: MKT AO}
  MKT_TL: {name: Marketing Team Lead, user: mkttl, short: MKT TL}
  MKT_HANDLER: {name: Marketing Handler, user: mkthandler, short: MKT Hdlr}
  MKT_COLLECTION: {name: Collection Handler, user: "clxhandler, mktcoll", short: Coll. Hdlr}
  CLX_TL: {name: Collection Team Lead, user: clxtl, short: CLX TL}
  MKT_SECTION_HEAD: {name: Section Head, user: clxuh, short: Sect. Head}
  UNAPPLIED_HANDLER: {name: Unapplied Payment Handler, user: upphandler, short: UPP Hdlr}
  PROCESSOR: {name: Processing Unit, user: proc, short: Proc.}
  CASHIER: {name: Cashier, user: "cashier, cashtl", short: Cashier}
  COMMREC: {name: Commission Receivables Unit, user: "commrec, commtl", short: CRU}
  DISBURSEMENT: {name: Disbursement Processor, user: disb, short: Disb.}
  COMPTROLLERSHIP: {name: Comptrollership, user: comptrol, short: Compt.}
  BUSINESS_ADMIN: {name: Business Administrator, user: badmin, short: Bus. Admin}
  SYSADMIN: {name: System Administrator, user: admin, short: Sys. Admin}
  AUDITOR: {name: Auditor, user: auditor, short: Audit.}
  SYSTEM: {name: BIBS scheduled job or event, user: "-"}

screens:
  LOGIN: Login page
  HOME: Finance > Collections > Collections Home
  WL: Finance > Collections > PR Worklist
  ACC: Finance > Collections > PR Worklist > Collection Account
  SUM: Finance > Collections > PR Worklist > Collection Account > Summary tab
  DISP: Finance > Collections > PR Worklist > Collection Account > Dispositions & Efforts tab
  HIST: Finance > Collections > PR Worklist > Collection Account > History tab
  TIMELINE: Finance > Collections > PR Worklist > Collection Account > Timeline tab
  PAYTAB: Finance > Collections > PR Worklist > Collection Account > Payments tab
  POLTAB: Finance > Collections > PR Worklist > Collection Account > Policy & Co-insurance tab
  HANDOFF: Finance > Collections > PR Worklist > Collection Account > Hand-offs to Operations tab
  CLIENT: Finance > Collections > PR Worklist > Client View
  ASSIGN: Finance > Collections > Assignments
  FILES: Finance > Collections > Collections Files
  SETUP: Finance > Collections > Collections Setup
  PLANS: Finance > Collections > Installment Plans
  PLAN: Finance > Collections > Installment Plans > Installment Plan
  DUE: Finance > Collections > Installments Due
  PROM: Finance > Collections > Promises to Pay
  ESC: Finance > Collections > Escalations
  ESCD: Finance > Collections > Escalations > Escalation (workflow panel)
  RULES: Finance > Collections > Escalation Rules
  BILL: Finance > Collections > Billing Statements
  SOA: Finance > Collections > Billing Statements > Statement of Account
  UPP: Finance > Collections > Unapplied Payments
  UPPD: Finance > Collections > Unapplied Payments > Unapplied Payment
  CREQ: Finance > Collections > Requests to Cashiering
  CASHREQ: Finance > Cashiering > Incoming Requests (Collector Requests)
  PICKUP: Finance > Cashiering > Check Pick-up
  DPACC: Finance > Commission Receivables > DP Accounts
  BULK: Client & Policy > Bulk Processing > Bulk Uploads (template Collections Bulk Update)
  LOV: Setup & Administration > Broking Setup > Lists of Values
  MATRIX: Setup & Administration > Broking Setup > User Access Matrix
  PARAMS: Setup & Administration > Administration > System Parameters
  JOBS: Operations > Interfaces (job runs)
  APPROVALS: My Approvals (home section)
  REPORTS: Reports > Report Centre (category Collections)
  ALERTS: Alerts (home section and bell icon in the page header)
  INV360: Operations > Invoice 360
  API: API call with the user's token (tester tool, for example Postman)

data:
  - id: TD-CL-01
    name: SIT/UAT users and roles
    content: ao (MKT_AO), mkttl (MKT_TL), mkthandler (MKT_HANDLER), clxhandler and mktcoll (MKT_COLLECTION), clxtl (CLX_TL), clxuh (MKT_SECTION_HEAD), upphandler (UNAPPLIED_HANDLER), proc (PROCESSOR), cashier and cashtl (CASHIER, CASHIER_TL), commrec and commtl (Commission), disb (DISBURSEMENT), comptrol (COMPTROLLERSHIP), badmin (BUSINESS_ADMIN), admin (SYSADMIN), auditor (AUDITOR). The SIT/UAT password is issued by the test lead.
    source: Seeds V980, V990, V1900 (Collections users) and the UnappliedSeedData runner (upphandler); grants V1000
  - id: TD-CL-02
    name: Seed worklist
    content: The unpaid seed invoices listed by the refresh of clxtl and assigned by the V1900 rules (segment CBG to clxhandler, team T-CORP1 to mkthandler, all others to mktcoll); an effort, dispositions of every kind (Coordinate further, DP PR for reversal, PR 2307 for reversal, For check pick-up, one superseded) and one temporary reassignment recorded
    source: Seed runner CollectionsSeedData on the seed bookings (V988 and the Operations runners)
  - id: TD-CL-03
    name: Collections parameters as delivered
    content: CLX_MIN_BALANCE_THRESHOLD 10.00; CLX_AGING_BASIS BOOKING; CLX_AGING_BRACKETS 0-30,31-45,46-60,61-90,91-120,121+; CLX_EDIT_LOCK_MINUTES 15 (1-240); CLX_PROMISE_GRACE_DAYS 0 (0-30); CLX_EXPORT_MAX_ROWS 50,000 (100-1,000,000); CLX_INVOICE_NO_PATTERN ^(I\d{8}|BI-.+)$; LOGIN_MAX_FAILED_ATTEMPTS 3
    source: Migration V1000 (Collections foundation) and V790
  - id: TD-CL-04
    name: Sales units and Unit Heads
    content: T-CBG1 headed by mkttl; CBG-NCR, CORP-NCR and VIS headed by clxuh
    source: Seed V1900 (on the sales organisation of V819)
  - id: TD-CL-05
    name: Disposition lists
    content: CLX_PR_DISPOSITION (DP PR for reversal, PR 2307 for reversal, For check pick-up, Cancel account, Coordinate further, Request bank AO assistance, No / missing policy number reserved to PROCESSOR, MKT_COLLECTION, CLX_TL, MKT_SECTION_HEAD, DP returned by insurer); CLX_UPP_DISPOSITION (For application to invoice, For refund, For reclass, For transfer to other unit, Coordinate further); CLX_EFFORT_CODE
    source: Migration V1000 (lists and Disposition Rules attributes)
  - id: TD-CL-06
    name: Escalation rules
    content: CLX-BROKEN-PROMISE (to mkttl), CLX-AGING-45 (TL), CLX-INCEPTION-60 (UH), CLX-INSTALLMENT-15 (TL), all ACTIVE; CLX-AMOUNT-1M pending authorisation, maker badmin
    source: Seed V1901
  - id: TD-CL-07
    name: Plans, promises and escalations
    content: Three-year PAR01 account of client CL-2026-000005 (1-Sep-2026 to 1-Sep-2029) with an annual policy-year plan and an SOA per billing cycle; quarterly plan on ARN-2026-940002 with the first installment overdue; promise kept on ARN-2026-940004; broken promise on the three-year account escalated to mkttl
    source: Seed runner CollectionsPlansSeedData with SeedMultiYearAccount
  - id: TD-CL-08
    name: Unapplied payments
    content: Payments received without a match - Grace Villanueva (application requested by upphandler, applied by Cashiering), Juan Dela Cruz (Coordinate further), Mega Traders Inc. (refund requested by clxhandler), Liza Manalo (no disposition)
    source: Seed runners UnappliedSeedPayments, UnappliedSeedData and CollectorRequestSeedData
  - id: TD-CL-09
    name: Invoice booked for the test
    content: A new Motor policy booked by proc on the test day for a CBG client with a total premium of PHP 25,000.00, no payment
    source: Keyed in by the tester through New Business booking (BRD-1 screens)
  - id: TD-CL-10
    name: Upload files
    content: Collections Bulk Update template with 10 promise rows and 1 row of a paid invoice; one row with a disposition column filled
    source: Prepared by the test lead from the template of the upload screen

scenarios:
  - id: SC-CL-01
    persona: SYSADMIN
    title: Access, audit and record lock. Each persona sees only the Collections screens of its role; changes are logged field by field and an account is locked while one user edits it.
    pre: SIT/UAT users of TD-CL-01; seed worklist TD-CL-02.
  - id: SC-CL-02
    persona: MKT_COLLECTION
    title: Worklist and daily refresh. New invoices above the threshold are listed at invoice level, totalled and filtered, refreshed every night and completed when paid.
    pre: Worklist TD-CL-02; parameters TD-CL-03; a new invoice TD-CL-09.
  - id: SC-CL-03
    persona: CLX_TL
    title: Assignment and reassignment. New accounts are assigned by rule; the team lead moves accounts permanently or until an end date.
    pre: Assignment rules of V1900; worklist TD-CL-02.
  - id: SC-CL-04
    persona: MKT_COLLECTION
    title: Follow-up and hand-offs. The handler logs efforts, records dispositions alone or in bulk and hands accounts to Cashiering and Commission.
    pre: Worklist TD-CL-02; lists TD-CL-05; upload file TD-CL-10.
  - id: SC-CL-05
    persona: MKT_COLLECTION
    title: Installment plans and promises to pay. Plans schedule multi-year and installment accounts, payments are allocated, promises are kept or broken.
    pre: Plans and promises TD-CL-07.
  - id: SC-CL-06
    persona: MKT_TL
    title: Escalation. Rules escalate accounts every night, users escalate by hand and the team lead or Unit Head works the escalation to its resolution.
    pre: Rules TD-CL-06; data TD-CL-07.
  - id: SC-CL-07
    persona: MKT_COLLECTION
    title: Billing statements. Statements of account are generated per billing cycle, e-mailed or cancelled; billing stays monitoring only.
    pre: Three-year account TD-CL-07.
  - id: SC-CL-08
    persona: UNAPPLIED_HANDLER
    title: Unapplied payments. The collector disposes of unapplied payments and asks Cashiering to apply, refund, reclass or transfer them; the daily application file lists the requests.
    pre: Payments TD-CL-08.
  - id: SC-CL-09
    persona: MKT_SECTION_HEAD
    title: Files, reports and commission receivable. Scheduled reversal files and daily reports are published on time, exports are capped, the home page shows the work and CR billing waits for the DP confirmation.
    pre: Worklist TD-CL-02 with DP and PR 2307 dispositions.

frs:
  FR-CL-001:
    scenario: SC-CL-01
    persona: MKT_AO
    screen: WL
    data: [TD-CL-01]
    conditions:
      - A read-only role opens the PR Worklist but has no work action.
      - The Collections set-up and assignment screens are not offered to roles without CLX_SETUP or CLX_ASSIGN, and a call without the permission is refused.
      - The User Access Matrix lists the CLX_* permissions in the area COLLECTIONS with their action classes.
      - The account locks after LOGIN_MAX_FAILED_ATTEMPTS consecutive wrong passwords.
    cases:
      - c: 1
        type: Security-access
        neg: false
        persona: DISBURSEMENT
        title: Disbursement user sees the worklist read only
        steps:
          - Log in as disb and open Finance > Collections > PR Worklist.
          - Open any account of the Open Accounts tab.
        expected: The list and the account open. Record Disposition, Log Effort, Update Remarks and Category and Reassign are not shown.
        auto: CollectionsAccountingFoundationIT#seedPersonasHoldTheirPermissions
      - c: 1
        type: Security-access
        persona: DISBURSEMENT
        screen: API
        title: Disbursement user cannot record a disposition through the API
        steps:
          - With the token of disb, POST a disposition "Coordinate further" for an open account to /api/v1/collections/dispositions.
        expected: HTTP 403; no disposition is recorded.
        msg: [You are not permitted to perform this action, ACCESS_DENIED]
        auto: ApiSmokeIT#missingPermissionIsForbiddenNotUnauthorized
      - c: 2
        type: Security-access
        title: Marketing AO does not see Collections Setup or Assignments
        steps:
          - Log in as ao and open the side menu, section Collections.
          - Type the address /collections/setup in the browser.
        expected: Collections Setup and Assignments are not in the menu. The direct link shows "You do not have access to this screen. Contact your administrator if you need it."
        auto: CollectionsAccountingFoundationIT#seedPersonasHoldTheirPermissions
      - c: 2
        type: Security-access
        neg: false
        persona: MKT_SECTION_HEAD
        screen: SETUP
        title: Section Head sees Collections Setup and Assignments
        steps:
          - Log in as clxuh and open the section Collections.
        expected: Collections Home, PR Worklist, Assignments, Collections Files, Collections Setup and Escalation Rules are in the menu.
        auto: CollectionsAccountingFoundationIT#seedPersonasHoldTheirPermissions
      - c: 3
        type: Positive
        persona: SYSADMIN
        screen: MATRIX
        title: User Access Matrix shows the Collections permissions
        steps:
          - Log in as admin and open Broking Setup > User Access Matrix.
          - Choose the view by action and the area COLLECTIONS.
        expected: CLX_VIEW (VIEW), CLX_WORK (CREATE / AMEND), CLX_BULK_UPDATE (AMEND), CLX_ESCALATE, CLX_ESCALATION_HANDLE (APPROVE), CLX_ASSIGN, CLX_UNAPPLIED_WORK, CLX_BILLING, CLX_SETUP, CLX_EXPORT, CLX_REPORT_VIEW and CLX_AUDIT_VIEW are listed with the roles of FRS section 3.3.
        auto: CollectionsAccountingFoundationIT#everyNewPermissionIsGrantedAndTheBrokingOnesAreClassified; AccessRequestIT#accessMatrixListsRolesAgainstPermissions
      - c: 4
        type: Boundary
        neg: true
        persona: MKT_HANDLER
        screen: LOGIN
        data: [TD-CL-01, TD-CL-03]
        title: Third wrong password locks the account
        steps:
          - Enter user ID mkthandler with a wrong password three times.
          - Enter the correct password.
        expected: The third attempt locks the account; the correct password is refused until the System Administrator unlocks the user.
        msg: [Account is locked. Contact your administrator., AUTHENTICATION_FAILED]
        auto: LoginLockoutTest#theAccountLocksAtTheConfiguredThreshold
      - c: 4
        type: Boundary
        persona: MKT_HANDLER
        screen: LOGIN
        data: [TD-CL-01, TD-CL-03]
        title: Two wrong passwords do not lock the account
        steps:
          - Enter user ID mkthandler with a wrong password twice.
          - Enter the correct password.
        expected: The log-in succeeds and the failed-attempt counter resets.
        msg: [Invalid user name or password, AUTHENTICATION_FAILED]
        auto: ApiSmokeIT#loginReturnsTokenAndWrongPasswordIsRejected

  FR-CL-002:
    scenario: SC-CL-01
    persona: MKT_COLLECTION
    screen: DISP
    data: [TD-CL-01, TD-CL-02]
    conditions:
      - Every Collections record shows the user and time that recorded it.
      - A changed record shows the user of the last update, taken from the session.
    cases:
      - c: 1
        type: Positive
        title: A disposition shows who recorded it
        steps:
          - Log in as clxhandler and open an open account assigned to clxhandler.
          - Record the disposition "Coordinate further" with remarks.
          - Open the Dispositions & Efforts tab.
        expected: The new row shows Recorded by clxhandler and the date and time of the save.
        auto: CollectionsWorklistIT#dispositionRulesAreEnforced
      - c: 2
        type: Positive
        persona: MKT_TL
        screen: PROM
        title: A promise changed by another user shows the last updater
        pre: A running promise recorded by mktcoll (TD-CL-07).
        steps:
          - Log in as mkttl, open Promises to Pay and select the running promise.
          - Click Withdraw Promise and confirm.
        expected: The promise is CANCELLED and shows mkttl as the user of the last update, with the time.
        auto: CollectionsEscalationIT#promisesAreKeptPartlyKeptSupersededAndWithdrawn
      - c: 2
        type: Negative
        screen: API
        title: The recorder cannot be sent in the request
        steps:
          - With the token of clxhandler, POST an effort to /api/v1/collections/efforts with an extra field recordedBy = mkttl.
          - Open the account's Dispositions & Efforts tab.
        expected: The effort is saved with clxhandler as the recorder; the field sent in the request is ignored.

  FR-CL-003:
    scenario: SC-CL-01
    persona: MKT_COLLECTION
    screen: HIST
    data: [TD-CL-02]
    conditions:
      - A field change writes one audit row with From, To, user, time and source IP.
      - A change on Collections Setup writes an audit row with the old and new value.
      - A bulk change writes rows for every account with the shared bulk reference.
      - No screen or API edits or deletes an audit row.
    cases:
      - c: 1
        type: Positive
        title: Category change from A to B is logged
        steps:
          - Open an account of clxhandler with category A.
          - Click Update Remarks and Category, set the category to B and save.
          - Open the History tab.
        expected: One row shows field Category, From A, To B, user clxhandler, the time and the source IP address.
        auto: CollectionsWorklistIT#effortsDetailsAndTheEditLock
      - c: 2
        type: Positive
        persona: MKT_SECTION_HEAD
        screen: SETUP
        data: [TD-CL-03]
        title: Threshold change is in the audit log
        steps:
          - Log in as clxuh, open Collections Setup, Parameters.
          - Change CLX_MIN_BALANCE_THRESHOLD from 10.00 to 12.00 and save.
          - Run the report Collections Audit Log for today.
        expected: A row shows the record CLX_MIN_BALANCE_THRESHOLD, From 10.00, To 12.00, the user clxuh and the time. Reset the value to 10.00 after the case.
      - c: 3
        type: Positive
        persona: MKT_TL
        title: Every account of a bulk disposition carries the bulk reference
        steps:
          - Log in as mkttl, select three open accounts in the PR Worklist and record "Coordinate further" on all.
          - Open the History tab of each account.
        expected: Each account has its own change rows with the same bulk reference CLXBU-yyyy-n.
        auto: CollectionsBulkUpdateIT#aRowRecordsThePromiseAndTheEscalationWithTheUploadNumber
      - c: 4
        type: Security-access
        persona: SYSADMIN
        screen: API
        title: Audit rows cannot be changed or deleted
        steps:
          - Open the History tab of an account and look for edit or delete actions.
          - With the token of admin, send PUT and DELETE to /api/v1/collections/items/{invoiceNo}/history.
        expected: The tab has no edit or delete action; both calls are refused (HTTP 405 or 404) and the rows are unchanged.

  FR-CL-004:
    scenario: SC-CL-01
    persona: MKT_SECTION_HEAD
    screen: REPORTS
    conditions:
      - A user with CLX_AUDIT_VIEW runs the Collections Audit Log for a period and exports it.
      - A period that ends before it starts is refused.
      - A user without CLX_AUDIT_VIEW cannot open the report.
    cases:
      - c: 1
        type: Report-output
        title: Section Head exports a month of the audit log
        steps:
          - Log in as clxuh and open the Report Centre, report Collections Audit Log.
          - Enter the company and the first to the last day of the current month; run.
          - Export to Excel.
        expected: The report shows the columns Changed On, User ID, Source IP, Record, Reference, Field, From, To and Bulk Reference; the Excel file holds the same rows.
        auto: CollectionsFilesIT#everyCollectionsReportRunsAndExports
      - c: 1
        type: Report-output
        persona: AUDITOR
        title: Auditor runs the audit log to PDF and CSV
        steps:
          - Log in as auditor, run Collections Audit Log for the current month.
          - Export to PDF and to CSV.
        expected: Both files are produced with the rows shown on screen and the run is kept in the report archive.
      - c: 2
        type: Negative
        title: Period ending before its start is refused
        steps:
          - Enter the start date 30 of the month and the end date 1 of the same month; run.
        expected: The report does not run; the parameter check names the reversed range.
        auto: ReportParametersTest#reversedDateAndNumberRangesAreRejected
      - c: 3
        type: Security-access
        persona: MKT_COLLECTION
        title: Collection Handler cannot open the audit log
        steps:
          - Log in as clxhandler and open the Report Centre, category Collections.
        expected: Collections Audit Log is not listed; running CLX-AUDIT-LOG through the API returns HTTP 403.

  FR-CL-005:
    scenario: SC-CL-01
    persona: MKT_COLLECTION
    screen: ACC
    data: [TD-CL-02, TD-CL-03]
    conditions:
      - The user who opens an account with CLX_WORK takes the edit lock; another user cannot change the account while it is held.
      - After CLX_EDIT_LOCK_MINUTES without release, the next user takes the lock.
      - The nightly refresh updates a locked account.
    cases:
      - c: 1
        type: Negative
        persona: MKT_TL
        title: Second user is refused while the lock is held
        pre: clxhandler has the account open (first browser session).
        steps:
          - In a second browser, log in as mkttl and open the same account.
          - Try to record the disposition "Coordinate further".
        expected: The account shows the banner "clxhandler is editing" and opens read only; the save is refused.
        msg: ["{clxhandler} is editing {invoice}", CLX_ITEM_LOCKED]
        auto: CollectionsWorklistIT#effortsDetailsAndTheEditLock; CollectionsApiIT#theCollectorWorksAnAccountThroughTheApi
      - c: 1
        type: Positive
        title: The lock is released when the holder leaves the account
        steps:
          - As clxhandler, open an account and then go back to the PR Worklist.
          - As mkttl, open the same account and record an effort.
        expected: No banner is shown to mkttl and the effort is saved.
      - c: 2
        type: Boundary
        persona: MKT_TL
        title: The lock expires after 15 minutes
        pre: The test lead sets the lock time of the account 16 minutes back, or waits 15 minutes.
        steps:
          - As clxhandler, open the account and leave the browser open without action.
          - After the lock time, as mkttl, open the account and record an effort.
        expected: mkttl takes the lock; the effort is saved.
      - c: 3
        type: Workflow
        persona: SYSTEM
        title: The refresh updates a locked account
        steps:
          - As clxhandler, open an account that has a payment applied today.
          - Ask the test lead to run CLX_DAILY_REFRESH (Collections Setup, Refresh now, by clxuh).
        expected: The outstanding of the account is updated although clxhandler holds the lock.

  FR-CL-010:
    scenario: SC-CL-02
    persona: MKT_COLLECTION
    screen: WL
    data: [TD-CL-02, TD-CL-09]
    conditions:
      - A booked invoice with outstanding premium becomes one collection account and appears on Open Accounts after the refresh.
      - An applied payment reduces the account's net outstanding.
      - The tabs group the accounts by status with their counts.
      - An invoice without a client receivable (direct payment, return invoice) is never listed.
    cases:
      - c: 1
        type: Positive
        title: New invoice appears on Open Accounts
        steps:
          - Book the invoice of TD-CL-09.
          - Ask clxuh to click Refresh now on Collections Setup (or wait for the nightly run).
          - Search the PR Worklist for the invoice.
        expected: One row on Open Accounts with net outstanding 25,000.00, client, assured, invoice, policy, ARN, booking and inception dates, aging 0 and bracket 0-30, segment, sales unit, Unit Head, AO and handler.
        auto: CollectionsWorklistIT#aBookedInvoiceIsListedAssignedByRuleAndCompletedWhenPaid
      - c: 2
        type: Positive
        title: A payment of 10,000.00 reduces the outstanding
        steps:
          - Ask the cashier to apply a payment of 10,000.00 to the invoice of TD-CL-09.
          - Open the account in the PR Worklist.
        expected: The net outstanding is 15,000.00.
        auto: CollectionsWorklistIT#aBookedInvoiceIsListedAssignedByRuleAndCompletedWhenPaid
      - c: 3
        type: Positive
        title: Status tabs show their counts
        steps:
          - Open the PR Worklist and click each tab.
        expected: Open Accounts, Credit Balances, Completed Collections, Excluded and All show their counts, and All equals the sum of the others.
        auto: collectionsLogic.test.ts#lists every status on the All tab and skips false flags
      - c: 4
        type: Negative
        title: Direct-payment invoice is not listed
        pre: A policy booked with direct payment to the insurer (payment status NOT_APPLICABLE).
        steps:
          - Run the refresh and search the worklist for the invoice.
        expected: No collection account exists for the invoice on any tab.
        auto: CollectionsWorklistIT#aDirectPaymentInvoiceWithoutReceivableIsNotListed
      - c: 1
        type: Security-access
        neg: false
        persona: CASHIER
        title: A CLX_VIEW-only user opens the list and the account
        steps:
          - Log in as cashier and open the PR Worklist and one account.
        expected: The list and the account open with no work action.

  FR-CL-011:
    scenario: SC-CL-02
    persona: SYSTEM
    screen: WL
    data: [TD-CL-03]
    conditions:
      - An invoice is listed only when its total to collect is above CLX_MIN_BALANCE_THRESHOLD.
      - A listed account at or below the threshold moves to COMPLETED at the next refresh.
      - A completed account reopens when its balance comes back above the threshold.
    cases:
      - c: 1
        type: Boundary
        title: 10.01 outstanding is listed
        pre: An invoice paid down to 10.01 by the cashier.
        steps:
          - Run the refresh; search the worklist for the invoice.
        expected: The account is OPEN on Open Accounts with 10.01.
      - c: 1
        type: Boundary
        neg: true
        title: 10.00 outstanding is not listed
        pre: A new invoice paid down to exactly 10.00 before its first refresh.
        steps:
          - Run the refresh; search the worklist for the invoice.
        expected: The invoice is not on Open Accounts.
      - c: 2
        type: Workflow
        title: Account paid down to 8.00 completes
        steps:
          - Apply a payment that leaves 8.00 on a listed account.
          - Run the refresh.
        expected: The account moves to Completed Collections with its history.
        auto: CollectionsWorklistIT#aBookedInvoiceIsListedAssignedByRuleAndCompletedWhenPaid
      - c: 3
        type: Workflow
        title: A reversed payment reopens the account
        steps:
          - Ask the cashier to reverse the payment of the completed account.
          - Run the refresh.
        expected: The account is OPEN again with the restored balance.

  FR-CL-012:
    scenario: SC-CL-02
    persona: MKT_SECTION_HEAD
    screen: SETUP
    data: [TD-CL-03]
    conditions:
      - A Section Head changes the threshold and Refresh now applies it at once.
      - Aging basis and aging brackets are validated.
      - A value outside its limits or a key that is not a Collections parameter is refused.
      - A Collection Handler does not see Collections Setup.
    cases:
      - c: 1
        type: Positive
        title: Threshold 100.00 applied by Refresh now
        steps:
          - Change CLX_MIN_BALANCE_THRESHOLD to 100.00 and save.
          - Click Refresh now.
        expected: Accounts with 100.00 or less move to Completed Collections; the audit log shows From 10.00 To 100.00. Reset to 10.00 afterwards.
        auto: CollectionsApiIT#homeFilesExportsAndSetup
      - c: 2
        type: Negative
        title: Aging basis other than BOOKING or INCEPTION
        steps:
          - Set CLX_AGING_BASIS to POLICY and save.
        expected: The value is refused.
        msg: [The aging basis is BOOKING or INCEPTION, CLX_AGING_BASIS]
      - c: 2
        type: Negative
        title: Aging bracket that ends before it starts
        steps:
          - Set CLX_AGING_BRACKETS to 0-30,45-31,61+ and save.
        expected: The value is refused.
        msg: ["Aging bracket '{45-31}' ends before it starts", CLX_AGING_BRACKETS_INVALID]
        auto: CollectionsRulesTest#invalidAgingBracketsAreRefused
      - c: 2
        type: Negative
        title: Brackets out of order
        steps:
          - Set CLX_AGING_BRACKETS to 0-30,61-90,31-60,91+ and save.
        expected: The value is refused.
        msg: ["Aging brackets must be in ascending order: {0-30,61-90,31-60,91+}", CLX_AGING_BRACKETS_INVALID]
        auto: CollectionsRulesTest#invalidAgingBracketsAreRefused
      - c: 3
        type: Boundary
        neg: true
        title: Lock time above its limit
        steps:
          - Set CLX_EDIT_LOCK_MINUTES to 241 and save.
        expected: The value is refused; 240 is accepted.
        msg: ["{CLX_EDIT_LOCK_MINUTES} must be between {1} and {240}", "-"]
        auto: SystemAdminIT#parametersAreTypedValidatedAndAudited
      - c: 3
        type: Negative
        screen: API
        title: A parameter of another module cannot be changed here
        steps:
          - With the token of clxuh, PUT /api/v1/collections/setup/parameters/LOGIN_MAX_FAILED_ATTEMPTS with value 5.
        expected: The change is refused and the parameter keeps its value.
        msg: ["{LOGIN_MAX_FAILED_ATTEMPTS} is not a Collections parameter", CLX_PARAMETER_NOT_COLLECTIONS]
      - c: 4
        type: Security-access
        persona: MKT_COLLECTION
        title: Collection Handler does not see Collections Setup
        steps:
          - Log in as clxhandler and open the section Collections.
        expected: Collections Setup is not in the menu; PUT .../setup/parameters returns HTTP 403.

  FR-CL-013:
