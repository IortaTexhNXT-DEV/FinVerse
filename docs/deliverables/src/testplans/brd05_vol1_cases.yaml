    auto: AccessRequestIT#requestsAreValidatedAndDecidedUnderFourEyes

findings:
  - fr: FR-AC-001
    issue: 'The FRS messages "Invalid user ID or password" and "Your account is locked. Contact the System Administrator" (no code) differ from the build ("Invalid user name or password" and "Account is locked. Contact your administrator.", code AUTHENTICATION_FAILED).'
    proposal: Quote the built messages and the code in FR-AC-001 and Volume 2 FR-DS-001.
  - fr: FR-AC-034
    issue: 'The FRS gives "Journal is not balanced - debit <x> vs credit <y>" and "Value date <date> is earlier / later than the permitted <n> back- / forward-dated days"; the build writes "Journal is not balanced: debit ... vs credit ..." and two separate value-date messages ("... is earlier than the permitted <n> back-dated days", "... is later than the permitted <n> forward-dated days"). The number of permitted days is a company setting that the FRS does not name.'
    proposal: Quote the two value-date messages apart, use the built punctuation and name the company fields (back-dated and forward-dated days) with their delivered values.
  - fr: FR-AC-042
    issue: 'The FRS message "The broking books of <period> are closed" is not what the user sees; the build names the source module that is locked ("The remittance books of <period> are closed", code BOOKS_CLOSED).'
    proposal: Change the message to "The <module> books of <period> are closed" in FR-AC-042.
  - fr: FR-AC-050
    issue: 'The row message "Row <n> - invalid date / amount ''<value>''" is two messages in the build ("Row <n>: invalid date ''<value>''" and "Row <n>: invalid amount ''<value>''").'
    proposal: Give the two messages apart with the built punctuation.
  - fr: FR-AC-071
    issue: 'The FRS messages "Unknown role(s) / permission(s) <list>" and "Permission(s) both added and removed - <list>" differ in punctuation from the build ("Unknown role(s): <list>", "Permission(s) both added and removed: <list>"); FR-AC-072 has the same for ACCESS_APPROVE_INDIVIDUALLY.'
    proposal: Use the built wording so that testers can compare the text exactly.
  - fr: FR-AC-070
    issue: The FRS and the persona table give the menu path "Administration > Lists of Values" and "Administration > Access Requests"; in BIBS these screens are under Setup & Administration > Broking Setup (with the User Access Matrix).
    proposal: Correct the screen paths of FR-AC-070 to FR-AC-072 in FRS v1.1.
  - fr: FR-AC-023
    issue: 'The FRS lists the paper sizes A4, Letter and Legal and the orientations portrait and landscape. The build also offers A3 and an automatic orientation (by report width), and an unknown value falls back to A4. Acceptance criterion 1 ("shows all its columns on one page width") gives no limit for very wide reports.'
    proposal: Add A3, the automatic orientation and the fallback to the FRS, and state the smallest font that fit to width may use.
  - fr: FR-AC-011
    issue: 'The permission table of section 3.2 gives action classes for the GL permissions (JOURNAL_CREATE and the other journal permissions, COA_UPLOAD, MASTER_MAINTAIN, MASTER_AUTHORIZE, GL_CLOSE_SCHEDULE), but the build leaves the finance permissions unclassified (V890), so the User Access Matrix by action class does not show them.'
    proposal: Either classify the finance permissions in the build or state in the FRS that the matrix by action class covers the broking areas only.
  - fr: FR-AC-054
    issue: The message of COST_CENTER_MISSING is given only as "<message naming the event and account>"; a tester cannot compare the text.
    proposal: Quote the message text the event register shows.
  - fr: FR-AC-062
    issue: 'Acceptance criterion 2 ("The GAP report totals match the open items of the sub-ledger") does not say which open items (receivables and payables of which accounts, at which date, in which currency) are compared.'
    proposal: Name the sub-ledger accounts and the date basis of the comparison.
