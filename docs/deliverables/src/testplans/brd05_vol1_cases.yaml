# Test plan BRD-5 Volume 1 (Accounting - FRBS, and business and system administration) - test data file.
# Build: python docs/deliverables/src/testplans/build_test_plan.py docs/deliverables/src/testplans/brd05_vol1_cases.yaml
# Schema: see the header of build_test_plan.py. FR titles, BRD IDs and priorities come from the FRS.
# Messages and codes are the ones BIBS returns (backend/src/main: journal, coa, closing, period,
# receivables, frbs, finreport, tax, nbadmin, lov); labels are those of frontend/src/features.

meta:
  brd: BRD-05
  name: Accounting Disbursement ACSL Vol1
  code: AC
  frs: FRS_BRD05_ACCOUNTING_VOL1.md
  summary: TP_BRD05_ACCOUNTING_VOL1.md
  version: "1.0"
  date: 25 September 2026
  built: true

personas:
  FRBS_PROCESSOR: {name: GL Officer (FRBS Processor), user: glofficer, short: GL Officer}
  FRBS_TL: {name: GL Team Lead, user: gltl, short: GL TL}
  FRBS_HEAD: {name: GL Team Head / Section Head, user: glhead, short: GL Head}
  BUSINESS_ADMIN: {name: Business Administrator, user: badmin, short: Bus. Admin}
  SYSADMIN: {name: System Administrator, user: admin, short: Sys. Admin}
  ACCESS_APPROVER: {name: Access approver (ACCESS_APPROVE), user: approver, short: Access Appr.}
  COMPTROLLERSHIP: {name: Comptrollership, user: comptrol, short: Compt.}
  AUDITOR: {name: Auditor, user: auditor, short: Audit.}
  DISBURSEMENT: {name: Disbursement Processor, user: disb, short: Disb.}
  REMIT_TL: {name: Remittance Team Lead, user: remittl, short: Remit TL}
  SYSTEM: {name: BIBS scheduled job or event, user: "-"}

screens:
  LOGIN: Login page
  HOME: Home page (dashboard) and side menu
  JOURNALS: Finance > General Ledger > Journals
  NEWJ: Finance > General Ledger > New Journal
  JOURNAL: Finance > General Ledger > Journals > Journal
  EDITJ: Finance > General Ledger > Journals > Edit Journal
  INQ: Finance > General Ledger > Account Inquiry
  COA: Finance > General Ledger > Chart of Accounts
  NUMB: Finance > General Ledger > Chart of Accounts > Numbering Schemes
  COAUP: Finance > General Ledger > Chart Upload
  RATES: Setup & Administration > Setup > Currencies & Rates (card Monthly revaluation rates)
  REPORTS: Reports > Report Centre
  REPORT: Reports > Report Centre > Report
  BATCH: Reports > Report Centre > Report Batch
  PACK: Finance > Accounting Reports > Report Pack
  SCHED: Finance > Accounting Reports > Account Schedules
  SFRUNS: Finance > Accounting Reports > Service Fee Runs
  SFRUN: Finance > Accounting Reports > Service Fee Runs > Service Fee Run
  SFRATES: Finance > Accounting Reports > Service Fee Rates
  GLCLOSE: Finance > Planning & Closing > GL Close & Cut-Off
  YEAREND: Finance > Planning & Closing > Period-End & Year-End (Year-End panel)
  FXREV: Finance > Planning & Closing > FX Revaluation
  BANKST: Finance > Receivables & Banking > Bank Statements
  BANKREC: Finance > Receivables & Banking > Bank Reconciliation
  LAYOUTS: Setup & Administration > Setup > Bank Statement Layouts
  CCRULES: Setup & Administration > Setup > Cost-Centre Rules
  EVREG: Finance > Accounting Engine > Event Register
  ACCRULES: Finance > Accounting Engine > Accounting Rules
  TAXFORMS: Finance > Tax & Statutory > BIR Forms & Books
  REMIT: Finance > Remittance > Remittance batch
  LOV: Setup & Administration > Broking Setup > Lists of Values
  ACCREQ: Setup & Administration > Broking Setup > Access Requests
  MATRIX: Setup & Administration > Broking Setup > User Access Matrix
  USERS: Setup & Administration > Administration > Users
  PARAMS: Setup & Administration > Administration > System Parameters
  JOBS: Setup & Administration > Administration > Scheduled Jobs
  APPROVALS: My Approvals (home section)
  ALERTS: Alerts (home section and bell icon in the page header)
  API: API call with the user's token (tester tool, for example Postman)

data:
  - id: TD-AC-01
    name: SIT/UAT users and roles
    content: glofficer (FRBS_PROCESSOR), gltl (FRBS_TL), glhead (FRBS_HEAD), badmin (BUSINESS_ADMIN), admin (SYSADMIN), approver (NB_APPROVER, holds ACCESS_APPROVE), comptrol (COMPTROLLERSHIP), auditor (AUDITOR), disb (DISBURSEMENT), remittl (REMIT_TL). The SIT/UAT password is issued by the test lead.
    source: Seeds V999 (BRD-5 users), V980, V990, V900; grants V890 and V899
  - id: TD-AC-02
    name: Seed chart and posting rules
    content: Seed chart of company FVI (placeholder for BDOI's chart, AQ01) with 1210 premium receivable, 2211 due to insurer, 2241 checks outstanding, 2250 service fee payable, 4130 incentive income, 4131 CPC2 income, 5614 service fee expense (cost centre required); seed accounting rules of the BRD-5 events
    source: Seeds V900, V901 and V999
  - id: TD-AC-03
    name: Currencies and rates
    content: Base currency PHP; USD active with BOOK and CLOSING rates; parameter OPS_BOOK_RATE_SOURCE as delivered
    source: Seed V900 and the currency master
  - id: TD-AC-04
    name: Chart upload sample file
    content: coa_upload_sample.xlsx with 8 parent and child accounts, among them 1913.01 with short code PRUSDBP (WARN negative-balance policy); a copy with one row whose parent is missing
    source: docs/samples/coa_upload_sample.xlsx (the copy is prepared by the test lead)
  - id: TD-AC-05
    name: Journals keyed in the test
    content: A MANUAL journal of 1,000.00 debit and credit on two postable accounts; an ACCRUAL of 5,000.00 dated the month end with reverse-on the first day of the next month; an unbalanced journal (1,000.00 / 900.00)
    source: Keyed in by the tester on New Journal
  - id: TD-AC-06
    name: Service fee rules and seed run
    content: Rules CBG 2.5 % (segments CBG, RETAIL) and IBG 1 % (COMBANK, CORBANK, INSTITUTIONAL); cost-centre rule of account 5614; a run of the invoices fully paid this month computed by glofficer and approved by gltl, its lines sent to Disbursement
    source: Migration V898 and seed runner FrbsSeedData
  - id: TD-AC-07
    name: Bank statement layout and file
    content: The statement layout of a seed bank account; a CSV bank file with check 000123 for 15,000.00 dated two days after the book payment of check 000123, and a deposit in transit left unmatched
    source: Receivables seed (ReceivablesSeedData) and a file prepared by the test lead
  - id: TD-AC-08
    name: Lists of values and access requests
    content: REFUND_REASON and the other lists of FRS section 9.3; a pending access request raised by badmin
    source: Migrations of the lists (V750, V890 onwards); requests keyed in by the tester

scenarios:
  - id: SC-AC-01
    persona: SYSADMIN
    title: Access and session. FRBS and administration users log in with their own profile, see only their screens and are warned before the idle and forced log-out.
    pre: SIT/UAT users of TD-AC-01.
  - id: SC-AC-02
    persona: FRBS_TL
    title: Chart of accounts and rates. The TL maintains and uploads the chart under maker-checker, numbers child accounts and searches them by short code; the Head enters the monthly revaluation rate.
    pre: Seed chart TD-AC-02; upload file TD-AC-04; rates TD-AC-03.
  - id: SC-AC-03
    persona: FRBS_PROCESSOR
    title: Reports on demand. FRBS users run, filter, export, print and batch any report they are allowed to see.
    pre: Posted seed journals of the current year.
  - id: SC-AC-04
    persona: FRBS_PROCESSOR
    title: Posting and manual entries. Events post through the accounting engine; the GL Officer prepares entries that the TL assigns, posts or returns; accruals reverse automatically.
    pre: Chart and rules TD-AC-02; journals TD-AC-05.
  - id: SC-AC-05
    persona: FRBS_TL
    title: Month-end and year-end. The broking books close at month end, FX balances are revalued, the GL close runs at its scheduled time and the year is closed and verified.
    pre: Open periods of the current year; rates TD-AC-03.
  - id: SC-AC-06
    persona: FRBS_PROCESSOR
    title: Bank reconciliation. The GL Officer uploads the bank file, BIBS matches it by check number and amount and the unmatched items are reported.
    pre: Layout and file TD-AC-07.
  - id: SC-AC-07
    persona: FRBS_PROCESSOR
    title: Service fee, cost centres and incentives. The service fee is computed, approved, paid, released and liquidated; cost centres are derived from rules; incentives post to Other Income.
    pre: Rules and run TD-AC-06.
  - id: SC-AC-08
    persona: FRBS_PROCESSOR
    title: Report pack. The Appendix A reports, account schedules, Mancom and government outputs run and export.
    pre: Posted seed data of the current year.
  - id: SC-AC-09
    persona: BUSINESS_ADMIN
    title: Business and system administration. Lists of values and user and role changes go through requests that another user approves, declines or returns.
    pre: Lists and requests TD-AC-08.

frs:
  FR-AC-001:
    scenario: SC-AC-01
    persona: FRBS_PROCESSOR
    screen: LOGIN
    data: [TD-AC-01]
    conditions:
      - A user logs in with an own profile from a browser and sees only the screens of the roles.
      - Wrong credentials are refused and the account locks after LOGIN_MAX_FAILED_ATTEMPTS.
    cases:
      - c: 1
        type: Positive
        title: GL Officer logs in and sees the FRBS screens
        steps:
          - Open the BIBS URL on a BDO laptop; log in as glofficer.
          - Open the side menu, group Finance.
          - Repeat on a BDO mobile device (responsive layout).
        expected: The menu shows General Ledger (Journals, New Journal), Accounting Reports (Report Pack, Service Fee Runs) and Tax & Statutory; the screens are usable on both devices.
        auto: ApiSmokeIT#loginReturnsTokenAndWrongPasswordIsRejected
      - c: 1
        type: Security-access
        title: GL Officer does not see Chart Upload or GL Close & Cut-Off
        steps:
          - As glofficer, open General Ledger and Planning & Closing in the menu.
          - Type the address /planning/gl-close.
        expected: Chart Upload and GL Close & Cut-Off are not in the menu; the direct link shows "You do not have access to this screen. Contact your administrator if you need it."
        auto: GlPlatformApiIT#permissionsAreEnforced
      - c: 2
        type: Negative
        title: Wrong password is refused
        steps:
          - Enter user ID glofficer and a wrong password.
        expected: The log-in page stays open; no session starts.
        msg: [Invalid user name or password, AUTHENTICATION_FAILED]
        auto: ApiSmokeIT#loginReturnsTokenAndWrongPasswordIsRejected
      - c: 2
        type: Boundary
        neg: true
        title: Third wrong password locks the account
        steps:
          - Enter a wrong password three times for gltl; then the right one.
        expected: The account is locked until the System Administrator unlocks it.
        msg: [Account is locked. Contact your administrator., AUTHENTICATION_FAILED]
        auto: LoginLockoutTest#theAccountLocksAtTheConfiguredThreshold

  FR-AC-002:
    scenario: SC-AC-01
    persona: FRBS_PROCESSOR
    screen: HOME
    conditions:
      - After SESSION_IDLE_WARNING_MINUTES without activity the inactivity warning is shown; the user stays signed in or is signed out.
      - SESSION_EXPIRY_WARNING_MINUTES before the forced log-out the user is warned whatever the activity.
    cases:
      - c: 1
        type: Positive
        title: Inactivity warning after 15 minutes
        steps:
          - Log in as glofficer and leave the browser without activity for 15 minutes.
          - Click Stay Signed In.
        expected: The dialog "Your session is about to expire" counts down the seconds; after Stay Signed In the session goes on.
        msg: [Your session is about to expire, "-"]
        auto: idleTimer.test.ts#moves from active to warning to expired
      - c: 1
        type: Negative
        title: No answer to the inactivity warning signs the user out
        steps:
          - Let the countdown of the warning run out.
        expected: The user is signed out and the Login page opens; unsaved data is not kept.
        auto: idleTimer.test.ts#warns, then expires and stops ticking
      - c: 2
        type: Positive
        title: Log-out warning 30 minutes before the end of the session
        pre: The test lead shortens the session so that its end is near, or waits for it.
        steps:
          - Keep working until 30 minutes before the session end.
        expected: The dialog "Your session will end soon" gives the minutes left and the end time; I Understand closes it.
        msg: [Your session will end soon, "-"]
        auto: sessionExpiry.test.ts#warns the configured minutes before the end and expires at the end
      - c: 2
        type: Positive
        persona: SYSADMIN
        screen: PARAMS
        title: The warning times are parameters
        steps:
          - Log in as admin and open System Parameters, area SECURITY.
        expected: SESSION_IDLE_WARNING_MINUTES shows 15 and SESSION_EXPIRY_WARNING_MINUTES 30.
        auto: SystemAdminIT#everyUserGetsAboutAndSessionPolicyButNotAdministration

  FR-AC-010:
    scenario: SC-AC-02
    persona: FRBS_HEAD
    screen: RATES
    data: [TD-AC-03]
    conditions:
      - The Section Head enters the revaluation rate of a currency for the month end; it is the CLOSING rate of that date.
      - With OPS_BOOK_RATE_SOURCE = CLOSING_PREV_MONTH the rate becomes the BOOK rate of the next month without overwriting a BOOK rate entered.
      - A rate that is not positive or a currency that is not active is refused.
      - A GL Officer cannot enter a revaluation rate.
    cases:
      - c: 1
        type: Positive
        title: USD 58.1234 for August
        steps:
          - Log in as glhead, open Currencies & Rates, card Monthly revaluation rates.
          - Enter USD 58.1234 for August; save.
        expected: The rate is the CLOSING rate of 31 August.
        auto: GlPlatformApiIT#revaluationRateIsTheMonthEndClosingRateAndBecomesTheNextBookRate
      - c: 2
        type: Positive
        title: Copy to BOOK makes it the September BOOK rate
        steps:
          - Click Copy to BOOK for August.
        expected: USD 58.1234 is the BOOK rate from 1 September; a BOOK rate already entered for September is kept.
        auto: GlPlatformApiIT#revaluationRateIsTheMonthEndClosingRateAndBecomesTheNextBookRate
      - c: 3
        type: Negative
        title: Rate zero
        steps:
          - Enter USD 0 for August; save.
        expected: The rate is refused.
        msg: [Exchange rate must be positive, INVALID_RATE]
      - c: 3
        type: Negative
        title: Inactive currency
        pre: A currency set inactive by the test lead (for example EUR).
        steps:
          - Enter a rate for EUR.
        expected: The rate is refused.
        msg: ["Currency {EUR} is not active", INACTIVE_CURRENCY]
      - c: 4
        type: Security-access
        persona: FRBS_PROCESSOR
        title: GL Officer cannot enter the rate
        steps:
          - Log in as glofficer and open Currencies & Rates.
        expected: The revaluation card has no entry action; POST /api/v1/currencies/revaluation-rates returns HTTP 403.
        auto: GlPlatformApiIT#permissionsAreEnforced

  FR-AC-011:
    scenario: SC-AC-02
    persona: FRBS_TL
    screen: COA
    data: [TD-AC-02]
    conditions:
      - A new or changed account is usable only after another user authorises it; users view the details of any account.
      - A child account has the class of its parent and a level allowed under it; sub and micro accounts need a parent.
      - An account with postings cannot become a heading.
      - The maker cannot authorise the own account.
    cases:
      - c: 1
        type: Workflow
        title: New account waits for authorisation
        steps:
          - As gltl, add a postable sub account under 1210 with the class of 1210; save.
          - As glofficer, try to use it on a new journal line.
          - As glhead, authorise it in My Approvals; use it again.
        expected: The account is PENDING_AUTHORIZATION and refused on the journal until glhead authorises it; then it is accepted.
        auto: ChartOfAccountsApiIT#accountLifecycleWithMakerCheckerFreezeAndClose
      - c: 1
        type: Positive
        persona: FRBS_PROCESSOR
        title: View the details of an account
        steps:
          - As glofficer, open Chart of Accounts and select 1210.
        expected: Level, class, category, parent, postable, control and sub-ledger type, currencies, cost-centre requirement, revaluation flag, negative-balance policy and short code are shown read only.
      - c: 2
        type: Negative
        title: Child class differs from the parent
        steps:
          - Add an account under 1210 with class LIABILITY.
        expected: The account is refused.
        msg: ["Child account class must match parent {1210}", CLASS_MISMATCH]
        auto: ChartOfAccountsApiIT#hierarchyRulesAreEnforced
      - c: 2
        type: Negative
        title: Sub account without a parent
        steps:
          - Add a SUB account without parent.
        expected: The account is refused.
        msg: [Sub and Micro GL accounts require a parent account, PARENT_REQUIRED]
        auto: ChartOfAccountsApiIT#hierarchyRulesAreEnforced
      - c: 2
        type: Negative
        title: Level not allowed under the parent
        steps:
          - Add a MAIN account under a MICRO account.
        expected: The account is refused.
        msg: ["A {MAIN} account cannot be placed under a {MICRO}", INVALID_TIER]
      - c: 3
        type: Negative
        title: Account with postings made a heading
        steps:
          - Add a child account under a postable account that has postings.
        expected: The account is refused.
        msg: ["Account {code} already has postings and cannot become a heading", PARENT_HAS_POSTINGS]
        auto: ChartOfAccountsApiIT#accountWithPostingsCannotBecomeHeading
      - c: 4
        type: Security-access
        title: Maker authorises the own account
        steps:
          - As gltl, open the account created above in My Approvals and authorise it.
        expected: The authorisation is refused.
        msg: [A record cannot be authorized by the user who maintained it, MAKER_CHECKER_VIOLATION]
        auto: ChartOfAccountsApiIT#makerCannotAuthorizeOwnAccount

  FR-AC-012:
    scenario: SC-AC-02
    persona: FRBS_TL
    screen: COAUP
    data: [TD-AC-04]
    conditions:
      - A valid file creates its accounts PENDING_AUTHORIZATION, parents before children.
      - Invalid rows are reported with their reason and not created; the TL commits only the valid rows or cancels the upload.
      - A file that is not XLSX, CSV or ODS is refused.
    cases:
      - c: 1
        type: Upload-download
        title: Sample file of 8 accounts
        steps:
          - Download the template; upload coa_upload_sample.xlsx; commit.
        expected: 8 valid rows, 0 invalid; after commit the 8 accounts are PENDING_AUTHORIZATION; 1913.01 has short code PRUSDBP.
        auto: GlPlatformApiIT#chartUploadSeedFileLoadsPendingAuthorization
      - c: 2
        type: Negative
        title: Row whose parent is missing
        steps:
          - Upload the copy of the sample with one row whose parent does not exist.
          - Download the row report.
        expected: The row is invalid with its reason; the other rows can be committed; the invalid one is not created.
      - c: 2
        type: Negative
        title: Row whose class differs from its parent
        steps:
          - Upload a file with a child row of another class than its parent.
        expected: The row is refused.
        msg: ["Child account class must match parent {code}", CLASS_MISMATCH]
      - c: 2
        type: Negative
        title: Short code already used
        steps:
          - Upload a row with short code PRUSDBP when 1913.01 exists.
        expected: The row is refused.
        msg: ["Short code {PRUSDBP} is already used by account {1913.01}", SHORT_CODE_TAKEN]
      - c: 2
        type: Negative
        title: Blank code under a parent without a numbering scheme
        steps:
          - Upload a row with a blank code under a parent that has no numbering scheme.
        expected: The row is refused.
        msg: ["Enter the account code: no numbering scheme under {parent}", NO_NUMBERING]
      - c: 2
        type: Workflow
        title: Cancel an upload that was not committed
        steps:
          - Upload the sample and click Cancel before committing.
        expected: The upload is CANCELLED and no account is created.
      - c: 3
        type: Negative
        title: File of another type
        steps:
          - Upload a .pdf file.
        expected: The upload is refused.
        msg: [Upload a .csv or .xlsx file, "-"]
        auto: SpreadsheetRowsTest#rejectsUnsupportedUnreadableAndOversizedFiles

  FR-AC-013:
    scenario: SC-AC-02
    persona: FRBS_TL
    screen: NUMB
    conditions:
      - A blank-coded child takes the next free number of the parent's scheme; numbers are never reused.
      - Child balances roll up to every parent level in the statements.
      - A scheme is validated; a top-level account needs a code; an exhausted scheme is refused.
    cases:
      - c: 1
        type: Positive
        title: Next codes under 1900
        steps:
          - Set the scheme of 1900 to separator "." and width 2; save.
          - Create two child accounts under 1900 with a blank code.
        expected: The children become 1900.01 and 1900.02.
        auto: GlPlatformApiIT#numberingProposesTheNextChildCode; CoaNumberingTest#codesArePaddedAndParsedBack
      - c: 2
        type: Report-output
        persona: FRBS_PROCESSOR
        screen: REPORTS
        title: Child balance in the parent on the trial balance
        steps:
          - Post a journal to 1900.01; run the trial balance.
        expected: The balance of 1900.01 is included in 1900.
        auto: FinanceReportsIT#mainTrialBalanceBalancesAndRollsUpSubAccounts; AccountHierarchyTest#subAndMicroAccountsRollUpToTheirMainAccount
      - c: 3
        type: Negative
        title: Width 7
        steps:
          - Set a scheme with width 7.
        expected: The scheme is refused.
        msg: ["Separator must be none, '.' or '-' and width 1 to 6 digits", INVALID_NUMBERING]
      - c: 3
        type: Negative
        screen: COA
        title: Top-level account without code
        steps:
          - Create a GROUP account with a blank code.
        expected: The account is refused.
        msg: [Enter the account code of a top-level account, ACCOUNT_CODE_REQUIRED]
      - c: 3
        type: Boundary
        neg: true
        title: No free number left
        pre: A parent with scheme width 1 and children 1 to 9.
        steps:
          - Create another blank-coded child.
        expected: The account is refused.
        msg: ["No free {1}-digit number under {parent}", NUMBERING_EXHAUSTED]

  FR-AC-014:
    scenario: SC-AC-02
    persona: FRBS_PROCESSOR
    screen: COA
    data: [TD-AC-04]
    conditions:
      - The chart search finds accounts by code, name or short code, and a journal line accepts the short code.
      - A short code is unique per company regardless of case; an unknown key on a journal line is refused.
    cases:
      - c: 1
        type: Positive
        title: Search by short code
        steps:
          - Search the chart for "prusdbp".
        expected: 1913.01 is found (search is case-insensitive).
        auto: GlPlatformApiIT#chartUploadSeedFileLoadsPendingAuthorization
      - c: 1
        type: Positive
        screen: NEWJ
        title: Short code on a journal line
        steps:
          - On New Journal, type the short code of an account in the account field.
        expected: The account code and name fill in.
        auto: JournalFrbsControlsIT#negativeBalanceControlBlocksOrWarnsAndShortCodesResolve
      - c: 2
        type: Negative
        persona: FRBS_TL
        title: Short code already used in another case
        steps:
          - Give another account the short code PrUsDbP.
        expected: The change is refused.
        msg: ["Short code {PRUSDBP} is already used by account {1913.01}", SHORT_CODE_TAKEN]
      - c: 2
        type: Negative
        screen: NEWJ
        title: Unknown key on a journal line
        steps:
          - Enter the account key XYZ123 on a journal line.
        expected: The line is refused.
        msg: ["Unknown GL account {XYZ123}", UNKNOWN_ACCOUNT]

  FR-AC-020:
    scenario: SC-AC-03
    persona: FRBS_PROCESSOR
    screen: REPORTS
    conditions:
      - A user runs any allowed report with its parameters, views it and exports it to XLSX, ODS, PDF or CSV; runs are archived.
      - The on-screen result can be selected and copied into Excel or Word.
      - A missing mandatory parameter is refused.
      - A report the user may not see is not offered.
    cases:
      - c: 1
        type: Report-output
        title: Trial balance of August to XLSX and ODS
        steps:
          - Open the Report Centre, category General Ledger, report Trial Balance; enter company FVI and August; run.
          - Export to XLSX and to ODS.
        expected: The result is shown on screen; both files hold the same rows; the run is in the report archive with the parameters, user and time.
        auto: FinanceReportsIT#everyFinanceReportRunsAndExportsInAllFormats; ReportArchiveIT#viewOnlyUsersRunButCannotExportAndExportsAreArchivedWithTheirFile
      - c: 2
        type: Positive
        screen: REPORT
        title: Copy the result into Excel
        steps:
          - Select the table of the trial balance on screen, copy it and paste it into Excel.
        expected: The columns and figures are pasted as cells.
      - c: 3
        type: Negative
        screen: REPORT
        title: Mandatory parameter left blank
        steps:
          - Run the trial balance with the period blank.
        expected: The report does not run.
        msg: ["Parameter {period} is required", MISSING_PARAMETER]
        auto: ReportParametersTest#requiredParameterSentBlankIsRejectedInsteadOfDefaulted
      - c: 4
        type: Security-access
        persona: DISBURSEMENT
        title: Report outside the user's permissions
        steps:
          - Log in as disb and open the Report Centre.
        expected: The General Ledger reports are not listed; running one through the API returns HTTP 403.
        auto: ReportArchiveIT#usersWithoutTheReportSeeNoRuns

  FR-AC-021:
    scenario: SC-AC-03
    persona: FRBS_PROCESSOR
    screen: REPORT
    conditions:
      - The filter row narrows the loaded rows by any column; totals are recomputed and the export holds the same rows with the filter noted.
      - A filter without matches shows no detail rows.
    cases:
      - c: 1
        type: Report-output
        title: Filter the Account column on 1210
        steps:
          - Run the trial balance; type 1210 in the filter of the Account column.
          - Export to XLSX.
        expected: Only the 1210 accounts are shown with their totals; the file holds the same rows and notes the filter.
        auto: GlPlatformApiIT#exportAppliesPrintOptionsAndColumnFilters; reportOptions.test.ts#keeps the matching detail rows only
      - c: 2
        type: Negative
        title: Filter that matches nothing
        steps:
          - Type ZZZZ in the Account filter.
        expected: No detail row is shown and the totals are zero; clearing the filter restores all rows.
        auto: reportOptions.test.ts#keeps every row without a filter

  FR-AC-022:
