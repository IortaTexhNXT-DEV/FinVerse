  FR-AC-052:
    scenario: SC-AC-07
    persona: FRBS_PROCESSOR
    screen: SFRUNS
    data: [TD-AC-06]
    conditions:
      - A run takes the invoices fully paid in the period, not cancelled, with commission and in no live run, and applies the rate of their segment on the net commission.
      - The run is approved by another user; approval posts the accrual and sends one Disbursement request per line.
      - A run is recomputed, returned or cancelled; a returned payout is sent again.
      - Period, rules and stages are validated.
    cases:
      - c: 1
        type: Positive
        title: CBG invoice with commission 10,000.00 and WTAX 200.00
        pre: A CBG invoice fully paid in the period with commission 10,000.00 and insurer WTAX 200.00.
        steps:
          - Compute a run for the period; open the run.
        expected: The CBG line carries a fee of 245.00 (9,800.00 x 2.5 %).
        auto: ServiceFeeCalculatorTest#feesAreTheRateOfTheCommissionNetOfWithholdingTax
      - c: 2
        type: Workflow
        persona: FRBS_TL
        screen: SFRUN
        title: Approval posts and sends the payouts
        steps:
          - As glofficer submit the run; as gltl approve it.
        expected: The run is APPROVED; one accrual journal (Dr 5614 / Cr 2250) and one Disbursement request of type SERVICE_FEE per line exist.
        auto: ServiceFeeIT#anApprovedRunIsAccruedPaidReleasedAndLiquidated
      - c: 2
        type: Security-access
        persona: FRBS_TL
        screen: SFRUN
        title: The preparer cannot approve
        steps:
          - As gltl, compute and submit a run; try to approve it.
        expected: The approval is refused.
        msg: [The run is approved by someone other than its preparer, SERVICE_FEE_FOUR_EYES]
        auto: ServiceFeeIT#theApproverIsNotThePreparerAndAReturnedLineIsSentAgain
      - c: 3
        type: Workflow
        screen: SFRUN
        title: Recompute and cancel a computed run
        steps:
          - Recompute a COMPUTED run after a rule change; then cancel it with a reason.
        expected: The recomputed lines use the new rule; after cancelling, its invoices can be taken by a new run.
        auto: ServiceFeeIT#aComputedRunIsRecomputedOrCancelledAndFreesItsInvoices
      - c: 3
        type: Workflow
        persona: FRBS_TL
        screen: SFRUN
        title: Returned run and payout sent again
        steps:
          - Return a run in FOR_APPROVAL with a reason; resubmit and approve it.
          - Ask Disbursement to return one payout; click Send Again on the line.
        expected: The run is COMPUTED after the return; the returned line is sent again as a new request.
        auto: ServiceFeeIT#theApproverIsNotThePreparerAndAReturnedLineIsSentAgain
      - c: 4
        type: Negative
        title: Period ending in the future
        steps:
          - Compute a run with an end date tomorrow.
        expected: The run is refused.
        msg: [Give a period that ends on or before today and after it starts, SERVICE_FEE_PERIOD]
        auto: frbs.test.ts#validates the period of a run
      - c: 4
        type: Negative
        title: Nothing to pay
        steps:
          - Compute a run for a period without fully paid invoices left.
        expected: The run is refused.
        msg: ["No invoice fully paid from {from} to {to} is left for a service fee", SERVICE_FEE_NOTHING]
      - c: 4
        type: Negative
        persona: FRBS_TL
        screen: SFRATES
        title: Rate zero on a rule
        steps:
          - Save a rule for segment CBG with rate 0.
        expected: The rule is refused.
        msg: [The rate is a percentage above 0, SERVICE_FEE_RATE]
        auto: ServiceFeeIT#rulesAndRecipientsAreMaintained; frbs.test.ts#validates a rate
      - c: 4
        type: Negative
        persona: FRBS_TL
        screen: SFRATES
        title: Rule without start date
        steps:
          - Save a rule with segment and rate but no start date.
        expected: The rule is refused.
        msg: ["Give the segment, the rate and the start date", SERVICE_FEE_RULE]
      - c: 4
        type: Negative
        screen: API
        title: Submit an approved run
        steps:
          - POST .../runs/{id}/submit on an APPROVED run.
        expected: The call is refused.
        msg: ["Run {no} is {APPROVED} and cannot be {submitted}", SERVICE_FEE_STAGE]

