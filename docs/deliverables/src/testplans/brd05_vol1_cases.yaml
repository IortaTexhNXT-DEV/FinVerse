          - Raise a second MODIFY_ROLES for glofficer while the first is pending.
        expected: The request is refused.
        msg: ["A request for {glofficer} is already waiting for approval", ACCESS_REQUEST_PENDING]
        auto: AccessRequestIT#requestsAreValidatedAndDecidedUnderFourEyes

  FR-AC-072:
    scenario: SC-AC-09
    persona: ACCESS_APPROVER
    screen: APPROVALS
    data: [TD-AC-08]
    conditions:
      - The approver sees the pending requests with a count and approves or declines them with remarks, alone or in bulk.
      - A returned request is RETURNED with remarks and resubmitted by its requester.
      - A request is never decided by its submitter; remarks are mandatory to decline or return; a decided request cannot be decided again.
      - A new-user request is approved on its own.
    cases:
      - c: 1
        type: Positive
        title: Approve two requests in bulk
        steps:
          - Open My Approvals; note the count of access requests; select two role changes and approve them.
        expected: Both are APPROVED with a result each; the count falls by two; the requester is notified.
        auto: AccessRequestReturnIT#returnedRequestIsResubmittedAndApprovedInBulk
      - c: 1
        type: Negative
        screen: ACCREQ
        title: Decline without a reason
        steps:
          - Decline a request with the remarks blank.
        expected: The decline is refused.
        msg: [Enter the reason of the rejection, ACCESS_REJECT_REASON]
      - c: 2
        type: Workflow
        screen: ACCREQ
        title: Return and resubmit
        steps:
          - Return a request with remarks "Add the ticket number".
          - As the requester badmin, resubmit it with a new justification.
        expected: The request is RETURNED with the remarks, then PENDING again.
        auto: AccessRequestReturnIT#returnedRequestIsResubmittedAndApprovedInBulk
      - c: 2
        type: Negative
        screen: ACCREQ
        title: Return without remarks
        steps:
          - Return a request with the remarks blank.
        expected: The return is refused.
        msg: [Enter the remarks for the requester, ACCESS_RETURN_REASON]
      - c: 2
        type: Negative
        persona: SYSADMIN
        screen: ACCREQ
        title: Resubmit by another user
        steps:
          - As admin, resubmit the request badmin raised.
        expected: The resubmission is refused.
        msg: ["Only {badmin} can resubmit this request", ACCESS_NOT_REQUESTER]
      - c: 3
        type: Security-access
        persona: BUSINESS_ADMIN
        screen: ACCREQ
        title: Requester approves the own request
        pre: badmin also holds ACCESS_APPROVE for the case (test user prepared by the test lead).
        steps:
          - Approve the request badmin raised.
        expected: The approval is refused.
        msg: [A request cannot be decided by the user who submitted it, ACCESS_FOUR_EYES]
        auto: AccessRequestIT#requestsAreValidatedAndDecidedUnderFourEyes
      - c: 3
        type: Negative
        screen: API
        title: Approve a decided request
        steps:
          - POST .../access-requests/{id}/approve on an APPROVED request.
        expected: The call is refused.
        msg: ["Request {no} is already {APPROVED}", ACCESS_REQUEST_DECIDED]
      - c: 4
        type: Negative
        title: New-user request in a bulk approval
        steps:
          - Select a CREATE_USER request with another request and approve in bulk.
        expected: The new-user request is not approved in the bulk; the other is.
        msg: ["Approve {ref} on its own: the new user's temporary password is shown once", ACCESS_APPROVE_INDIVIDUALLY]

access:
  - action: Prepare and submit manual journals
    screen: NEWJ
    permission: JOURNAL_CREATE
    allow: [FRBS_PROCESSOR, FRBS_TL]
    deny: [FRBS_HEAD, COMPTROLLERSHIP, AUDITOR]
