findings:
  - fr: FR-DS-001
    issue: 'The FRS message "Invalid user ID or password" differs from the build ("Invalid user name or password", code AUTHENTICATION_FAILED).'
    proposal: Quote the built message and code, as in Volume 1.
  - fr: FR-DS-025
    issue: The FRS names a Disbursement Workbench tab "Unregularised" (also FR-DS-045); the build shows the unregularised count as a KPI on the workbench and lists the DVs in the report DSB-UNREGULARIZED. The FRS also says a claimed DV is read only for others without naming the message or the release of the claim.
    proposal: Describe the KPI and the report instead of a tab, and state how a claim is released (leave the DV, time-out or by the TL).
  - fr: FR-PQ-005
    issue: '"Any handler can return a request to the previous handler" is broader than the workflow: there is no return from Preparing, the refund returns go reviewer to preparer and approver to reviewer, and the cash advance returns to the requester (Draft).'
    proposal: List the return actions per stage as in the workflow table of section 5.6.
  - fr: FR-PQ-009
    issue: '"A request is declined by returning or cancelling it with a reason" - at For Approval the approver has only Return to reviewer; cancellation is possible only in Draft, Preparing and For review.'
    proposal: State that the approver declines by returning, and who cancels afterwards.
  - fr: FR-PQ-017
    issue: The FRS names the checker "Marketing / Comptrollership" without the permission that allows posting a liquidation; testers cannot tell which demo user checks.
    proposal: Name the permission (and role) of the liquidation checker.
  - fr: FR-DS-092
    issue: FR-DS-092 (CPC2 report) and FR-AS-005 (ACSL aging reports) are not built (gaps G4 and G3); their acceptance criterion "to be accepted when built" cannot be tested.
    proposal: Keep the gaps open with a target release; the cases check the interim views and are re-run when the reports are delivered.
  - fr: FR-DS-055
    issue: 'Stale-check accounting and re-issue are "to be confirmed" (AQ02, AQ14), and FR-DS-044 leaves the cancellation after release open (AQ15); the expected entries of these cases may change.'
    proposal: Confirm the entries with Comptrollership before UAT.
  - fr: FR-DS-062
    issue: The FRS does not say at which number of remaining leaves CHECK_SERIES_LOW is raised (at 20 left or below 20).
    proposal: State the boundary of DISB_CHECK_SERIES_WARNING.
  - fr: FR-AS-020
    issue: The demo data has one ACSL processor (acsl); re-assigning a correction to "acslproc2" (acceptance criterion) needs a second processor that the demo does not provide.
    proposal: Add a second ACSL processor to the demo users or change the criterion.
