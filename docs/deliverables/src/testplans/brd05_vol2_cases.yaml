        steps:
          - After disbappr's approval, disbappr approves again.
        expected: The second approval is refused.
        msg: [The second approval must be given by another approver, FUNDING_FOUR_EYES]
        auto: DisbursementProcessingIT#fundingNeedsAVerifierAndTwoDifferentApprovers
      - c: 3
        type: Security-access
        title: Maker verifies
        steps:
          - disbtl verifies own request.
        expected: The verification is refused.
        msg: [The maker cannot verify the funding request, FUNDING_FOUR_EYES]
      - c: 3
        type: Negative
