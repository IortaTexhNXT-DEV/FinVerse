  - action: Process DVs, encode requests and tag instruments
    screen: DV
    permission: DISB_PROCESS
    allow: [DISBURSEMENT, DISB_TL]
    deny: [DISB_APPROVER, COMPTROLLERSHIP, AUDITOR]
