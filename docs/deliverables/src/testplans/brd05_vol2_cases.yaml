  DISBURSEMENT: {name: Disbursement Processor, user: disb, short: Disb. Proc.}
  DISB_TL: {name: Disbursement Team Leader, user: "disbtl, disbtl2", short: Disb. TL}
  DISB_APPROVER: {name: Disbursement Approver, user: "disbappr, disbappr2", short: Disb. Appr.}
