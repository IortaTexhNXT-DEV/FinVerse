# Test plan BRD-5 Volume 2 (Disbursement, Payment Requests and ACSL) - test data file.
# Build: python docs/deliverables/src/testplans/build_test_plan.py docs/deliverables/src/testplans/brd05_vol2_cases.yaml
# Schema: see the header of build_test_plan.py. FR titles, BRD IDs and priorities come from the FRS.
# Messages and codes are the ones BIBS returns (backend/src/main: disbursement, payrequest, acsl,
# remittance, tax, organization); labels are those of frontend/src/features.

meta:
  brd: BRD-05
  name: Accounting Disbursement ACSL Vol2
  code: DPA
  frs: FRS_BRD05_ACCOUNTING_VOL2.md
  summary: TP_BRD05_ACCOUNTING_VOL2.md
  version: "1.0"
  date: 25 September 2026
  built: true

