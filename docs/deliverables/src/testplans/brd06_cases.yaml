    deny: [LAMD, CONTACT_CENTER, SYSADMIN]
    denied: The Renewal category is not listed; the run call returns HTTP 403.
  - action: Export lists and reports
    screen: EXPIRY
    permission: RNW_EXPORT
    allow: [MKT_TL, MKT_AO, PROCESSING_TL]
