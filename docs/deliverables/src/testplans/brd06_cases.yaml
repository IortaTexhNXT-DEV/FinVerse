  FR-RN-090:
    scenario: SC-RN-10
    persona: SYSTEM
    screen: RECORD
    data: [TD-RN-11]
    conditions:
      - A hand-off creates one candidate (source SUBMITTED_POLICY, SBM number), initiates it at once, creates the renewal account with a hold cover request and queues the letters.
      - A second hand-off of the same SBM number creates nothing new; pending hand-offs are replayed once.
      - A Non-CBG Retail hand-off starts at Unassigned Disposition for a manual disposition.
      - Renewal answers the status query, so the masterlist shows the renewal outcome.
      - A second hold cover on the same account is refused.
    cases:
      - c: 1
        type: Workflow
        brd: [Cross-BRD decision D2, BRRN.021]
        title: CBG Motor submitted policy handed over
        steps:
          - In Submitted Policies run the expiry scan (or Renew with BDOI) for SBM-2026-000123.
          - Open the new candidate, its renewal account and its Letters tab.
        expected: One candidate with source SUBMITTED_POLICY and the SBM number, initiated at the hand-off; one renewal account (business type RENEWAL, renewal-of = SBM number, insurer INS-A) with a hold cover request; the FFY RA and the SFU letter are queued.
      - c: 2
        type: Negative
        brd: [BRD-12 BRIDSP-22, "23"]
        title: Second hand-off of the same SBM number
        steps:
          - Run the hand-off for SBM-2026-000123 again.
        expected: No second candidate, account or RA is created.
      - c: 2
        type: Workflow
        brd: ["25", "26"]
        title: Pending hand-offs replayed once
        pre: Hand-offs recorded as PENDING before the adapter was deployed.
        steps:
          - Run the replay; run it again.
        expected: Each pending SBM number produces one candidate; the second replay creates nothing.
      - c: 3
        type: Workflow
        persona: MKT_TL
        screen: EXPIRY
        brd: [BRRN.021]
        title: Non-CBG Retail hand-off waits for a manual disposition
        steps:
          - Hand off SBM-2026-000124; open Unassigned Disposition.
        expected: The candidate is listed in Unassigned Disposition for assignment.
      - c: 4
        type: Positive
        screen: SUBPOL
        brd: [BRRN.010, Cross-BRD decision D2]
        title: Masterlist shows BOOKED when the renewal books
        steps:
          - Book the renewal account of SBM-2026-000123; open the masterlist record.
        expected: The record shows BOOKED; a closed-not-renewed candidate shows its reason.
      - c: 5
        type: Negative
        brd: [Cross-BRD decision D2]
        title: Hold cover requested twice
        steps:
          - Request a hold cover again on the renewal account.
        expected: The request is refused.
        msg: ["Account {ARN-2027-000321} already has a hold cover requested or confirmed"]

