        steps:
          - Generate the list for the TD-RN-12 business date.
          - Scroll from the first to the last row.
        expected: No pager is shown; further rows load as the user scrolls; the row count shows 20,000 and the last row is reached; each chunk loads within 10 seconds.
      - c: 2
        type: Report-output
        brd: [1.003.4.1.1, 1.003.4.1.1.2-1.003.4.1.1.24]
