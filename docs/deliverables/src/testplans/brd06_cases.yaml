      - The Marketing list has the BRD columns (with the BIBS invoice number and renewal reference in place of the EBIX and BDOIsys columns), the Classification pill and the flag chips; the Processing list has the first 21 columns without the claims and outstanding-premium columns.
      - Each column filters, and the keyword search filters and highlights the matches.
