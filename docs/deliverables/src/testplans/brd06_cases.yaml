  FR-RN-083:
    scenario: SC-RN-09
    persona: SYSTEM
    screen: LETTERS
    data: [TD-RN-02, TD-RN-10]
    conditions:
      - At RNW_NRNS_REMINDER_DAYS before expiry an account not yet submitted gets the NRNS chip and one reminder letter per checkpoint.
      - Submitted or accepted accounts get no reminder.
      - At the non-acceptance point the candidate closes EXPIRED_UNRENEWED with a non-acceptance letter and the owners are notified.
    cases:
      - c: 1
        type: Workflow
        brd: [BRRN.025]
        title: Reminder 90 days before expiry
        pre: A candidate without disposition expires in 90 days.
        steps:
          - Run job RNW_NRNS_LETTERS; open the NRNS tab and the Expiry List.
        expected: One reminder (RNL-yyyy, template RNW_NRNS_REMINDER) is generated with its recipients logged; the candidate shows the NRNS chip.
      - c: 1
        type: Negative
        brd: [BRRN.025]
        title: Job run twice sends one reminder
        steps:
          - Run the job again the same day.
        expected: No second reminder is generated for the same candidate and checkpoint.
      - c: 2
        type: Negative
        brd: [BRRN.025, BRRN.037]
        title: Accepted account gets no reminder
        steps:
          - Run the job for a candidate disposed For Renewal with the RA accepted, 90 days before expiry.
        expected: No reminder and no NRNS chip.
      - c: 3
        type: Workflow
        screen: NOTIF
        brd: [BRRN.037]
        title: Non-acceptance at expiry
        pre: RNW_NON_ACCEPTANCE_DAYS = 0; a candidate in RA Sent expires today.
        steps:
          - Run job RNW_EXPIRY_SWEEP; open the candidate and the bell of the owners.
        expected: The non-acceptance letter (NAC-yyyy) is sent; the candidate is Closed with reason EXPIRED_UNRENEWED; the AO and TL are notified.

  FR-RN-084:
    scenario: SC-RN-09
    persona: MKT_AO
    screen: RECORD
    data: [TD-RN-13]
    conditions:
      - The user records the acceptance with method and evidence; the renewal is Accepted.
      - With no open exception and the payment gate passed, the renewal account moves to placement and booking without resubmission, and books as RENEWAL; the candidate closes RENEWED.
      - A payment on the renewal account records the acceptance with source SYSTEM.
      - Method, evidence and an open blocking check are validated; evidence is mandatory when FINANCIAL_IMPACT failed.
      - An incomplete renewal account stops the fast track with the account's message.
    cases:
      - c: 1
        type: Workflow
        brd: [BRRN.040]
        title: Record acceptance by e-mail
        steps:
          - Open an account in RA Sent; Record Acceptance; method E-mail; attach the acceptance e-mail PDF (RA_ACCEPTANCE); Accepted on today; Save.
        expected: The candidate is Accepted; the assigned users receive RNW_ACCEPTED; the History shows method, evidence and user.
      - c: 2
        type: Workflow
        persona: NB_BOOKING
        screen: BOOKING
        brd: [BRRN.040]
        title: Accepted renewal is placed and booked without re-keying
        steps:
          - After the payment gate passes, follow the renewal account through placement (slip sent automatically with RNW_AUTO_PLACEMENT = true), issuance and booking.
          - Open the booked invoice and the candidate.
        expected: No proposal is resubmitted and no field is re-keyed; the invoice shows business type RENEWAL; the candidate is Renewed and the users receive RNW_RENEWED.
      - c: 3
        type: Workflow
        screen: HIST
        brd: [BRRN.040]
        title: Payment records the acceptance
        steps:
          - Apply the payment of TD-RN-13 to the renewal account in Cashiering; open the candidate History.
        expected: The acceptance is recorded with method Payment and source SYSTEM.
      - c: 4
        type: Negative
        brd: [BRRN.038 AC3]
        title: Acceptance with a failed financial impact needs evidence
        steps:
          - On an account whose FINANCIAL_IMPACT failed, record method Signed RA without the attachment.
        expected: The acceptance is not saved.
        msg: [Attach the acceptance evidence]
      - c: 4
        type: Negative
        brd: [BRRN.040]
        title: Acceptance without a method
        steps:
          - Save Record Acceptance with no method.
        expected: Nothing is saved.
        msg: [Select the acceptance method]
      - c: 4
        type: Negative
        brd: [BRRN.040]
        title: Acceptance with an open endorsement
        steps:
          - Record acceptance on an account whose ENDORSEMENT_PENDING check fails.
        expected: The acceptance is refused.
        msg: ["Renewal {RNW-2026-000212} cannot be accepted: {ENDORSEMENT_PENDING} failed"]
      - c: 5
        type: Negative
        brd: [BRRN.040]
        title: Incomplete renewal account stops the fast track
        steps:
          - Clear a mandatory field of the renewal account; record acceptance.
        expected: The candidate is Accepted but the fast track stops; the account stays in draft for Processing with the account message.
        msg: ["Complete the mandatory fields of {MC01}: {Chassis No.}"]

