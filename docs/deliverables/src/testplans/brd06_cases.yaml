    allow: [MKT_TL, MKT_AO, PROCESSING_TL, PROCESSOR]
    deny: [LAMD, CONTACT_CENTER, BUSINESS_ADMIN]
    denied: Letters is not in the menu; POST /letters/ra and /letters/send return HTTP 403.
  - action: Record client acceptance
    screen: RECORD
    permission: RNW_ACCEPT
    allow: [MKT_AO, PROCESSOR]
    deny: [CONTACT_CENTER, LAMD]
    denied: Record Acceptance is not shown.
  - action: Record Contact Center follow-ups
    screen: FOLLOWUPS
    permission: RNW_FOLLOWUP
    allow: [CONTACT_CENTER]
    deny: [MKT_AO, LAMD]
    denied: Follow-ups is not in the menu; POST .../followups returns HTTP 403.
  - action: Upload LAMD reports and view match results
    screen: LAMDR
    permission: RNW_LAMD_UPLOAD, RNW_VALIDATE
    allow: [LAMD]
    deny: [MKT_TL, PROCESSING_TL, CONTACT_CENTER]
    denied: LAMD Reports is not in the menu; the upload call returns HTTP 403.
  - action: Run renewal reports
