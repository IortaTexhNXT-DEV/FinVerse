# Test plan BRD-6 Renewal - test data file.
# Build: python docs/deliverables/src/testplans/build_test_plan.py docs/deliverables/src/testplans/brd06_cases.yaml
# Schema: see the header of build_test_plan.py. FR titles, BRD IDs and priorities come from the FRS.
# Renewal is designed and not built: messages are the FRS texts (no codes), screen paths are those of the
# build design (docs/architecture/RENEWAL_DESIGN.md) and there is no automation reference. Where a check
# reuses a platform message that exists today (log-in, bulk upload, account checks), the case quotes the
# text BIBS shows and a finding records the FRS difference.

meta:
  brd: BRD-06
  name: Renewal
  code: RN
  frs: FRS_BRD06_RENEWAL.md
  summary: TP_BRD06_RENEWAL.md
  version: "1.1"
  date: 26 September 2026
  built: false

personas:
  MKT_TL: {name: Marketing Team Leader, short: MKT TL}
  MKT_AO: {name: Marketing AO / Admin (Account Broker), short: MKT AO}
  PROCESSING_TL: {name: Processing Team Leader, short: Proc. TL}
  PROCESSOR: {name: Processing Officer / Broker, short: Proc. Off.}
  BUSINESS_ADMIN: {name: Business Administrator, short: Bus. Admin}
  CHECKER: {name: Authoriser holding MASTER_AUTHORIZE (second Business Administrator), short: Checker}
  SYSADMIN: {name: System Administrator, short: Sys. Admin}
  LAMD: {name: LAMD user, short: LAMD}
  CONTACT_CENTER: {name: Contact Center user, short: Contact Ctr}
  NB_BOOKING: {name: New Business placement and booking user (BRD-1), short: NB Book.}
  SYSTEM: {name: BIBS scheduled job or event}

screens:
  LOGIN: Login page
  HOME: Renewal > Renewal Home
  EXPIRY: Renewal > Expiry List
  EXPGEN: Renewal > Expiry List > Generate Expiry List dialog
  EXPFILTER: Renewal > Expiry List > Filters panel
  MYDISP: Renewal > My Dispositions
  RECORD: Renewal > Expiry List > (reference) record page
  DETAILS: Renewal > record page > Details tab
  CHECKS: Renewal > record page > Checks & Bucket tab
  ACCHIST: Renewal > record page > Account History tab
  DISP: Renewal > record page > Disposition panel
  COMP: Renewal > record page > Computations tab
  INSTAB: Renewal > record page > Insurer tab
  LETTAB: Renewal > record page > Letters tab
  REMARKS: Renewal > record page > Remarks & Follow-ups tab
  HIST: Renewal > record page > History tab
  RACC: Renewal > record page > Renewal Account section
  TRANSFERS: Renewal > Transfers
  TLREVIEW: Renewal > TL Review
  PROCWL: Renewal > Processing Worklist
  BATCHES: Renewal > Insurer Batches
  LETTERS: Renewal > Letters
  LAMDR: Renewal > LAMD Reports
  FOLLOWUPS: Renewal > Follow-ups
  SETUP: Renewal > Renewal Setup
  REPORTS: Reports > Report Centre (category Renewal)
  LOV: Broking Setup > Lists of Values
  TEMPLATES: Broking Setup > Document Templates
  ACCREQ: Broking Setup > Access Requests
  MATRIX: Broking Setup > User Access Matrix
  PARAMS: Administration > System Parameters
  APPROVALS: My Approvals
  AUDIT: Administration > Audit Trail
  NOTIF: Notifications (bell icon in the page header)
  MAILBOX: Test mailbox of the client or insurer (SIT mail relay)
  QUOTE: Quotation / Proposal > Quotation or PRF page (BRD-1)
  BOOKING: Booking > Booking Workbench (BRD-1)
  SUBPOL: Submitted Policies > Masterlist (BRD-12)
  API: API call with the user's token (tester tool, for example Postman)

data:
  - id: TD-RN-01
    name: Test users per Renewal role
    content: rn.mkttl1 and rn.mkttl2 (MKT_TL of Retail Marketing 1 and Corporate Marketing 2), rn.ao1 and rn.ao2 (MKT_AO of Retail Marketing 1), rn.ao3 (MKT_AO of Corporate Marketing 2), rn.proctl (PROCESSING_TL), rn.po1 and rn.po2 (PROCESSOR), rn.badmin (BUSINESS_ADMIN), rn.checker (BUSINESS_ADMIN with MASTER_AUTHORIZE), rn.sysadmin (SYSADMIN), rn.lamd (LAMD), rn.cc (CONTACT_CENTER). Each user holds only the listed role unless a case says otherwise.
    source: Created by the test lead on SIT through approved access requests (BRD-11); roles and grants of FRS section 3.3
  - id: TD-RN-02
    name: Non-CBG expiring invoices
    content: 40 booked root invoices of Retail Marketing 1 (Motor MC01 and MC02, Fire FI01), policy expiry = business date + 140 days; 10 invoices of Corporate Marketing 2 with the same expiry; 12 invoices expiring in the next calendar month (range tests); one 3-year Motor policy (only the last year expires in the window)
