  FR-RN-101:
    scenario: SC-RN-11
    persona: MKT_TL
    screen: REPORTS
    data: [TD-RN-02, TD-RN-12]
    conditions:
      - The user sets the expiry range (or a preset current, prior or next month) and the twenty criteria, each with single, multiple, all except and all and a search in the drop-down.
      - The report shows the status per invoice in one scrollable view with 37 columns (Marketing) or 40 (Processing), and the 34 summary counters.
      - The report exports to Excel and PDF with the same rows, prints with preview and saves as a variant.
      - Data is limited to the user's scope, and the report answers within 20 seconds.
      - A missing range or an end date before the start is refused.
    cases:
      - c: 1
        type: Positive
        brd: [BRD 1.009.1-1.009.6, BRRN.019, restating BRD 1.009.3.1.6]
        title: Marketing TL runs RNW-STATUS with the twenty criteria
        steps:
          - Open RNW-STATUS; preset Next month; set in turn Unit Head, Risk Code, Insurance Company, Insurance Group, Business Origin, Market Category, BDO Branch, BDO Area, Region, Bank Officer, Bank Unit, Product Code, Account Type, BDOI Branch, Location, Account Broker, Business Type, Customer Segment, Specific Client and Renewal Status.
        expected: Every criterion offers single, multiple, all except and all with a search; each run lists only the matching invoices.
      - c: 1
        type: Positive
        persona: MKT_AO
        brd: [2.008.1-2.008.6, 2.008.3.1.6]
        title: AO runs RNW-STATUS for March with Risk Code "all except" MC01
        steps:
          - As rn.ao1 run RNW-STATUS for 01 to 31 March 2027, Risk Code all except MC01.
        expected: The March invoices of rn.ao1 except MC01 are listed, with the 34 counters below.
      - c: 2
        type: Report-output
        brd: [BRD 1.009.1-1.009.6, BRRN.019]
        title: 37 Marketing columns and the BIBS invoice number
        steps:
          - Compare the columns with FRS section 6.3.
        expected: Columns 1 to 37 are shown (Unit Head to Remarks of Acct Officer); column 6 is the BIBS Expiring Invoice No.; Hold Cover and HC End Date are read from the renewal account.
      - c: 2
        type: Report-output
        persona: PROCESSING_TL
        brd: [3.010.1-3.010.6, 3.010.3.1.6]
        title: Processing variant with 40 columns
        steps:
          - As rn.proctl run RNW-STATUS for March.
        expected: Columns 38 to 40 (Name of Renewal Processor, Name of Assigned Marketing AO, Sum Insured per Cover) are added.
      - c: 2
        type: Report-output
        persona: PROCESSOR
        brd: [4.008.1-4.008.6 with their sub-IDs, 4.008.3.1.6]
        title: 34 summary counters
        steps:
          - As rn.po1 run RNW-STATUS for March; compare each counter with FRS section 6.5 by counting the rows per stage, disposition and reason.
        expected: Each of the 34 counters equals its predicate; counters 5, 8, 14 and "to Other Bank" show 0 with "pending definition" (RQ10); counter 34 equals the row count.
      - c: 3
        type: Report-output
        brd: [BRD 1.009.1-1.009.6]
        title: Export, print and save as a variant
        steps:
          - Export to Excel and PDF; print with preview; save the criteria as variant "March MC01 excluded".
        expected: Both files have the same rows as the screen; the printout matches the preview; the variant reloads the criteria.
      - c: 4
        type: Boundary
        brd: [BRD 1.009.1-1.009.6]
        title: 30,000-row report within 20 seconds
        steps:
          - Run RNW-STATUS on the volume data TD-RN-12 for the whole range.
        expected: The result and summary show within 20 seconds, only for the user's scope.
      - c: 5
        type: Negative
        brd: [BRD 1.009.1-1.009.6]
        title: End date before the start date
        steps:
          - Set expiry from 31-Mar-2027 and to 01-Mar-2027; run.
        expected: The report does not run.
        msg: [The end date must be on or after the start date]

