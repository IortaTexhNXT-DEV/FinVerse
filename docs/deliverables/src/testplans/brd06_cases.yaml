    content: "PACKAGE code map loaded by the migration: QPS package HOME-01 v2 -> BIBS package version PKG-HOME-2027 (one entry); MOTOR-CLG v1 -> two BIBS versions by sum-insured band (ambiguous); FIRE-OLD v1 not in the map. Migrated policies of TD-RN-15 carry these legacy packages"
    source: Code map of the migration mock (maintained by MBS / TSU); package versions of the BRD-3 catalogue on SIT

scenarios:
  - id: SC-RN-01
    persona: SYSADMIN
    title: Access, roles and audit. Each Renewal persona logs in, sees only its own screens and records, profiles and function grants change only through approved access requests, and every renewal action is in the audit trail.
    pre: Users of TD-RN-01 are active.
  - id: SC-RN-02
    persona: MKT_TL
    title: Extraction and the expiring list. The daily job and on-demand ranges extract the expiring accounts; the TL filters, searches, exports and prints the list and initiates the candidates.
    pre: Invoices TD-RN-02 and TD-RN-03 are booked; the job RNW_EXTRACTION is active.
  - id: SC-RN-03
    persona: BUSINESS_ADMIN
    title: Governance rules. The checks, buckets and decision matrix classify each candidate; non-renewable risk codes, LAMD reports, KYC and endorsements are applied without manual pre-cleaning.
    pre: Matrix and bucket rules TD-RN-08 active; candidates TD-RN-04; LAMD files TD-RN-05.
  - id: SC-RN-04
    persona: MKT_TL
    title: Assignment and transfer. The Marketing TL assigns and re-assigns accounts to AOs and transfers accounts to another Marketing unit, whose TL accepts or declines them.
    pre: Initiated non-CBG candidates of TD-RN-02 in UNASSIGNED.
  - id: SC-RN-05
    persona: MKT_AO
    title: Disposition. The AO views his accounts and their history, gives the disposition with reason and remarks, updates returned accounts, re-opens Not for Renewal and starts the New Business path.
    pre: Accounts assigned to rn.ao1 in FOR_DISPOSITION.
  - id: SC-RN-06
    persona: MKT_TL
    title: TL review and overrides. The TL reviews, returns and posts the dispositioned accounts and overrides the outstanding-balance flag and other controlled blocks.
    pre: Accounts pushed by rn.ao1 in FOR_TL_REVIEW; RNW-2026-000203 with outstanding premium.
  - id: SC-RN-07
    persona: PROCESSOR
    title: Processing. Processing uploads dispositioned files, assigns officers, updates the renewal account, reviews the computations and returns accounts to Marketing.
    pre: Posted For Renewal accounts in FOR_PROCESSING; files TD-RN-06.
  - id: SC-RN-08
    persona: PROCESSING_TL
    title: Insurer round-trip. Processing builds the extract per insurer, sends it protected and applies the insurer's response file.
    pre: IN_PROCESSING accounts of INS-A, INS-B and INS-C; response file TD-RN-07.
  - id: SC-RN-09
    persona: MKT_AO
    title: Letters, acceptance and booking. Users generate and send RAs, NALs and NFRs; the jobs send NRNS reminders and non-acceptance letters; the Contact Center follows up; acceptance moves the renewal account to placement and booking without re-keying.
    pre: RA_READY accounts; templates TD-RN-14; evidence TD-RN-13.
  - id: SC-RN-10
    persona: SYSTEM
    title: Submitted policies. The Submitted Policies hand-off creates, initiates and renews a candidate once per SBM number and reports its status back to the masterlist.
    pre: Hand-off records TD-RN-11.
  - id: SC-RN-11
    persona: MKT_TL
    title: Monitoring and reports. Renewal Home, the renewal status report with its summary, the listings with escalation and the operational reports show the state of every renewal within the user's scope.
    pre: Candidates in every stage from the earlier scenarios; volume list TD-RN-12 for timing.
  - id: SC-RN-12
    persona: BUSINESS_ADMIN
    title: Administration. The Business Administrator maintains the renewal lists of values, templates, rules and parameters under maker-checker, without a release.
    pre: rn.badmin and rn.checker available.

frs:
  FR-RN-001:
    scenario: SC-RN-01
    persona: MKT_TL
    screen: LOGIN
    data: [TD-RN-01]
    conditions:
      - A user of each Renewal persona logs in and sees the Renewal section with the screens of that persona only.
      - Wrong credentials are refused and no session starts.
      - The account locks at the third failed attempt (LOGIN_MAX_FAILED_ATTEMPTS = 3, decision D5).
      - The idle warning appears after 15 minutes of inactivity and the expiry warning 30 minutes before the system log-out.
      - Renewal screens work in several browser tabs of one session without losing the work of either tab.
      - Every successful and failed log-in is recorded with user, time and source address.
    cases:
      - c: 1
        type: Positive
        brd: [BRD 1.001.1-1.001.3.1]
        title: Marketing TL logs in and sees the Marketing TL screens
        steps:
          - Open the BIBS URL on a BDO-issued laptop.
          - Enter user ID rn.mkttl1 and the password; click Sign in.
          - Open the side menu, section Renewal.
        expected: The home page opens. The Renewal section lists Renewal Home, Expiry List, TL Review, Transfers, Letters and Renewal Reports; Processing Worklist, Insurer Batches, LAMD Reports and Renewal Setup are not listed.
      - c: 1
        type: Positive
        persona: MKT_AO
        brd: [2.001.1-2.001.1.3]
        title: Marketing AO logs in and sees My Dispositions
        steps:
          - Log in as rn.ao1.
          - Open the side menu, section Renewal.
        expected: The section lists Renewal Home, My Dispositions, Letters and Renewal Reports only.
      - c: 1
        type: Positive
        persona: PROCESSING_TL
        brd: [3.001.1-3.001.1.3]
        title: Processing TL logs in and sees the Processing screens only
        steps:
          - Log in as rn.proctl.
          - Open the side menu, section Renewal.
        expected: The section lists Renewal Home, Expiry List, Processing Worklist, Insurer Batches, Letters and Renewal Reports; TL Review, Transfers and My Dispositions are not listed.
      - c: 1
        type: Positive
        persona: PROCESSOR
        brd: [4.001.1-4.001.1.3]
        title: Processing Officer logs in with the Processing Officer profile
        pre: The BRD text "Log in with a Operations Team Leader user profile" (4.001.1.1) is read as the Processing Officer profile.
        steps:
          - Log in as rn.po1.
          - Open the side menu, section Renewal.
        expected: The section lists Renewal Home, Processing Worklist, Insurer Batches, Letters and Renewal Reports; Expiry List Generate, TL Review and Renewal Setup are not offered.
      - c: 1
        type: Positive
        persona: BUSINESS_ADMIN
        brd: [5.001.1-5.001.1.3]
        title: Business Administrator logs in and sees the set-up screens
        steps:
          - Log in as rn.badmin.
          - Open the side menu.
        expected: Renewal Setup, Renewal Reports, Broking Setup > Lists of Values and Broking Setup > Document Templates are listed; no disposition, processing or letter screen is listed.
      - c: 1
        type: Positive
        persona: SYSADMIN
        brd: [6.001.1-6.001.1.1]
        title: System Administrator accesses the application
        steps:
          - Log in as rn.sysadmin.
          - Open the side menu.
        expected: Access Requests, User Access Matrix and Administration are listed; no Renewal work screen is listed.
      - c: 2
        type: Negative
        title: Log-in with a wrong password is refused
        steps:
          - Enter user ID rn.mkttl1 and a wrong password; click Sign in.
        expected: The Login page stays open and no session starts.
        msg: [Invalid user name or password]
      - c: 3
        type: Boundary
        neg: true
        persona: MKT_AO
        title: The third wrong password locks the account
        pre: Administration > System Parameters shows LOGIN_MAX_FAILED_ATTEMPTS = 3.
        steps:
          - Enter user ID rn.ao2 with a wrong password three times.
          - Enter the correct password.
        expected: The third wrong attempt locks the account; the correct password is refused until the System Administrator unlocks rn.ao2.
        msg: [Account is locked. Contact your administrator.]
      - c: 3
        type: Boundary
        persona: MKT_AO
        title: Two wrong passwords do not lock the account
        steps:
          - Enter user ID rn.ao2 (unlocked) with a wrong password twice.
          - Enter the correct password.
        expected: The log-in succeeds and the failed-attempt counter resets.
      - c: 4
        type: Boundary
        screen: EXPIRY
        title: Idle warning after 15 minutes without activity
        pre: SESSION_IDLE_WARNING_MINUTES = 15 and SESSION_EXPIRY_WARNING_MINUTES = 30.
        steps:
          - Log in as rn.mkttl1 and open the Expiry List.
          - Leave the browser idle for 14 minutes, then for one more minute.
        expected: No warning appears at 14 minutes; at 15 minutes the session warning dialog appears with Continue and Log out.
      - c: 4
        type: Positive
        screen: EXPIRY
        title: Warning 30 minutes before the system log-out
        pre: The test lead shortens the session lifetime so the end falls within the test.
        steps:
          - Work on the Expiry List until 30 minutes before the session end.
        expected: The dialog warns that the session ends in 30 minutes; the user continues working until the log-out.
      - c: 5
        type: Positive
        screen: RECORD
        brd: [BRD 1.002.1, 2.002.1, 3.002.1, 4.002.1, 5.002.1]
        title: Expiry List in one tab and a record page in a second tab
        steps:
          - Log in as rn.mkttl1 and open the Expiry List; apply the filter Risk Code MC01.
          - Open a record in a second browser tab and add a remark.
          - Return to the first tab and scroll the list.
        expected: Both tabs work in the same session; the filter of the first tab and the remark of the second tab are kept.
      - c: 6
        type: Positive
        persona: SYSADMIN
        screen: AUDIT
        title: Log-ins and failed log-ins appear in the audit trail
        pre: Cases TC-RN-001.2-01 and TC-RN-001.3-01 ran today.
        steps:
          - Log in as rn.sysadmin and open Administration > Audit Trail.
          - Filter on today and users rn.mkttl1 and rn.ao2.
        expected: Each successful and failed log-in and the lock of rn.ao2 are listed with user, time and source address.

  FR-RN-002:
    scenario: SC-RN-01
    persona: MKT_AO
    screen: MYDISP
    data: [TD-RN-01, TD-RN-02]
    conditions:
      - Menus and buttons show only the screens and actions the user's roles allow.
      - A direct link or API call without the permission is refused and logged.
      - Lists, records, reports and exports are limited to the user's data scope by the server.
      - The LAMD role uploads LAMD reports and views match results, and never generates, sends or disposes.
      - LAMD and Contact Center users see a projection without premium columns.
    cases:
      - c: 1
        type: Security-access
        neg: false
        brd: [BRD 6.002.2.1-6.002.2.24]
        title: Marketing AO sees My Dispositions and not the Processing Worklist
        steps:
          - Log in as rn.ao1; open the side menu.
          - Open an account of My Dispositions.
        expected: My Dispositions and the record pages of rn.ao1's accounts open; Processing Worklist and Renewal Setup are not in the menu; the record page offers no Post, Assign PO or Upload action.
      - c: 2
        type: Security-access
        screen: PROCWL
        title: Direct link to the Processing Worklist without RNW_PROCESS
        steps:
          - Log in as rn.ao1.
          - Type the address of the Processing Worklist in the browser.
        expected: The page shows "You do not have access to this screen. Contact your administrator if you need it." and loads no data.
      - c: 2
        type: Security-access
        screen: API
        title: API call to post an account without RNW_REVIEW
        steps:
          - With rn.ao1's token call POST /api/v1/renewal/candidates/post for an account in FOR_TL_REVIEW.
          - As rn.sysadmin open the Audit Trail.
        expected: The call returns HTTP 403 and the account stays in FOR_TL_REVIEW; the audit trail lists the refused call with user, endpoint and time.
        msg: [You are not permitted to perform this action]
      - c: 3
        type: Security-access
        persona: MKT_TL
        screen: EXPIRY
        brd: [BRD p.43 key capability]
        title: Marketing TL does not see the candidates of another sales unit
        steps:
          - Log in as rn.mkttl1 (Retail Marketing 1) and generate the Expiry List for the TD-RN-02 range.
          - Search the reference of a Corporate Marketing 2 candidate.
          - Open that record by its address.
        expected: Only the 40 Retail Marketing 1 candidates are listed; the search finds nothing; the record address shows no data.
      - c: 3
        type: Security-access
        persona: MKT_TL
        screen: REPORTS
        brd: [BRD p.43 key capability]
        title: Exports apply the same data scope
        steps:
          - As rn.mkttl1 run RNW-STATUS for the TD-RN-02 range without filters and export it to Excel.
        expected: The file holds only Retail Marketing 1 invoices.
      - c: 4
        type: Security-access
        neg: false
        persona: LAMD
        screen: LAMDR
        brd: [BRRN.024]
        title: LAMD user uploads a report and views the match results
        steps:
          - Log in as rn.lamd and open LAMD Reports.
          - Upload the paid-off report of TD-RN-05 and open the match results.
        expected: The upload and the match results are available.
      - c: 4
        type: Security-access
        persona: LAMD
        screen: LETTERS
        brd: [BRRN.024]
        title: LAMD user cannot generate or send an RA
        steps:
          - As rn.lamd look for Letters in the menu.
          - Call POST /api/v1/renewal/letters/ra with rn.lamd's token.
        expected: Letters is not in the menu and the record page shows no disposition or letter action; the call returns HTTP 403 and is logged.
        msg: [You are not permitted to perform this action]
      - c: 5
        type: Security-access
        persona: CONTACT_CENTER
        screen: FOLLOWUPS
        title: Contact Center list has no premium columns
        steps:
          - Log in as rn.cc and open Follow-ups.
          - Open the column chooser.
        expected: The list shows the renewal status columns; Amount of Outstanding Premium, premium and commission columns are not listed and cannot be added.

  FR-RN-003:
    scenario: SC-RN-01
    persona: SYSADMIN
    screen: ACCREQ
    data: [TD-RN-01]
    conditions:
      - The Renewal profiles exist as BIBS roles, and each of the 25 BRD functions maps to a permission.
      - A function is granted to a profile only through a role-permission change request approved by another user.
      - The Business Administrator assigns a profile to a user through an approved access request.
      - The requester cannot approve the own request, and a request without a role or permission is refused.
    cases:
      - c: 1
        type: Report-output
        screen: MATRIX
        brd: [BRD 6.002.2, 6.002.2.1-6.002.2.25]
        title: User Access Matrix lists the Renewal roles and the 25 functions
        steps:
          - Open Broking Setup > User Access Matrix, area Renewal.
          - Compare each BRD function 6.002.2.1 to 6.002.2.25 with the permission of FRS section 3.2.
          - Export the matrix to Excel.
        expected: Roles MKT_TL, MKT_AO, PROCESSING_TL, PROCESSOR, BUSINESS_ADMIN, LAMD and CONTACT_CENTER are shown with the grants of FRS section 3.3; every function 1 to 25 has its permission; the Excel file has the same rows.
      - c: 2
        type: Workflow
        brd: [BRD 6.002.1, 6.002.1.2-6.002.1.6]
        title: Grant "Extract accounts per insurer" to the Processing Officer profile
        steps:
          - As rn.sysadmin open Access Requests; New request, type Modify role permissions.
          - Select role PROCESSOR, permission RNW_INSURER (function 6.002.2.20), justification; submit to rn.badmin.
          - As rn.badmin open My Approvals and approve.
        expected: The request is Approved; PROCESSOR holds RNW_INSURER; the role history shows the change with requester, approver and times.
      - c: 3
        type: Workflow
        persona: BUSINESS_ADMIN
        brd: [BRD 5.004.1]
        title: Assign the Marketing AO profile to a new user
        steps:
          - As rn.badmin raise an access request of type Assign role for user rn.ao4 with role MKT_AO; submit to rn.sysadmin.
          - As rn.sysadmin approve.
          - Log in as rn.ao4.
        expected: At the next log-in rn.ao4 sees the Marketing AO screens of TC-RN-001.1-02.
      - c: 4
        type: Security-access
        title: The requester cannot approve the own request
        steps:
          - As rn.sysadmin raise a Modify role permissions request and choose rn.sysadmin as approver, or open the own request in My Approvals.
        expected: The requester is not offered as approver and Approve is not shown on the own request; the permission is unchanged.
      - c: 4
        type: Negative
        title: Request without a role or permission
        steps:
          - New request of type Modify role permissions for role PROCESSOR; select no permission; submit.
        expected: The request is not submitted.
        msg: [Select at least one role or permission]
      - c: 2
        type: Workflow
        title: Rejected request changes nothing
        steps:
          - Raise a request adding RNW_OVERRIDE to MKT_AO; as rn.badmin reject it with a reason.
        expected: The request is Rejected with the reason; MKT_AO does not hold RNW_OVERRIDE; the requester is notified.

  FR-RN-004:
    scenario: SC-RN-01
    persona: MKT_TL
    screen: HIST
    data: [TD-RN-01, TD-RN-02]
    conditions:
      - The History tab lists every action on a candidate with user or source and time, from extraction to booking.
      - Extraction and initiation are recorded as two events with their own users and times.
      - System actions carry the job or rule that made them (matrix version and rule id).
      - History and audit rows cannot be edited or deleted by any screen or API.
    cases:
      - c: 1
        type: Positive
        title: Full trail of a renewed account
        pre: RNW-2026-000110 has run from extraction to booking in SC-RN-02 to SC-RN-09.
        steps:
          - Open RNW-2026-000110, History tab.
        expected: The tab lists extraction, initiation, bucket, disposition, post, insurer response, RA generation and sending, acceptance and booking, each with user or source and time, in time order.
      - c: 2
        type: Positive
        brd: [BRRN.021]
        title: Extraction and initiation are separate events
        pre: A candidate extracted by the job and initiated by rn.mkttl1 the next day.
        steps:
          - Open the candidate, History tab.
        expected: EXTRACTED shows source RNW_EXTRACTION and the job time; INITIATED shows rn.mkttl1 and the initiation time.
      - c: 3
        type: Positive
        brd: [BRRN.023, BRRN.031]
        title: System disposition shows the matrix version and rule
        pre: A CBG candidate disposed automatically by matrix MX-2 rule 10.
        steps:
          - Open the candidate, History tab.
        expected: The disposition row shows source MATRIX, version MX-2 and rule 10; the bucket row shows the rule-set version and the check run.
      - c: 3
        type: Positive
        brd: [BRRN.022, BRRN.035, BRRN.040]
        title: Reference match, insurer response and acceptance are logged
        steps:
          - Open a candidate that was matched by an insurer response and accepted by e-mail.
        expected: The history shows the REFERENCE_MATCH outcome, the response with source upload and match outcome, and the acceptance with method, evidence and user.
      - c: 4
        type: Security-access
        screen: API
        title: History rows cannot be changed
        steps:
