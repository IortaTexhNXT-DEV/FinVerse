  - id: TD-RN-03
    name: CBG mortgaged accounts
    content: 6 CBG Motor and 4 CBG Fire accounts mortgaged to BDO, each with a PN (PN-2026-7001 to 7010); one CBG Motor account without a PN; segment CLG candidates (200) for bulk initiation; one Non-Mortgage candidate
    source: Booked on SIT with mortgagee BDO Unibank; PN values agreed with the LAMD test file TD-RN-05
