      - c: 3
        type: Negative
        title: Start date missing
        steps:
          - Leave the start date blank; enter an end date; click Generate.
        expected: The dialog is not submitted.
        msg: [Enter a valid start and end date]
      - c: 4
        type: Negative
        title: Range without expiring accounts
        steps:
          - Generate the list for a past month with no booked policies.
        expected: The grid is empty.
        msg: [No expiring accounts in the selected range]

  FR-RN-012:
    scenario: SC-RN-02
    persona: MKT_TL
    screen: EXPFILTER
    data: [TD-RN-02]
    conditions:
      - Each of the thirteen criteria filters the list with single, multiple, "all except" and all selections and a search in the drop-down.
      - Apply filters at once and shows the active filters as chips and in the page address; Cancel changes nothing; Clear restores all.
      - An "only" and an "all except" selection on the same criterion cannot be combined.
