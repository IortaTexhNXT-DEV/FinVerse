        expected: The grid has Expiring Invoice No. (BIBS), Renewal Reference No., Cover No., Version No., Invoicing Branch, Department Code, Department Name, Unit Head, Client Name, Assured's Name, Business Origin, Account Officer, Expiring Policy No., Insurance Company, Risk Code, Risk Name, Risk Description, Renewal Stage / Status, Renewal Disposition, Disposition Remarks, Number of Claims, Status of Each Claim and Amount of Outstanding Premium, plus Classification and the flag chips; no EBIX or BDOIsys column.
      - c: 2
        type: Report-output
        persona: PROCESSING_TL
        brd: [3.003.4.1, 3.003.4.1.2-3.003.4.1.21]
        title: Processing list columns
        steps:
          - As rn.proctl open the Expiry List and the column chooser.
        expected: The first 21 columns of section 6.2 are shown with Classification and the flags; Number of Claims, Status of Each Claim and Amount of Outstanding Premium are not offered.
      - c: 2
        type: Positive
        data: [TD-RN-04]
        title: Classification pill and flag chips
        steps:
          - Search RNW-2026-000201 to 000204.
        expected: RNW-2026-000201 shows the pill Review and the chip Claims; 000202 the chip Endorsed; 000203 the chip Outstanding; 000204 the chip KYC due with its pill unchanged.
      - c: 3
        type: Positive
        brd: [BRRN.006, restating BRD 1.003.4.1.3, 1.003.4.1.4]
        title: Keyword search filters and highlights
        steps:
          - Type a client name of TD-RN-02 in the search box.
        expected: Only the rows with that name remain and the name is highlighted in each row.
      - c: 3
        type: Positive
        persona: PROCESSOR
        screen: PROCWL
        brd: [3.003.4.3, 3.003.4.4, 3.006.1.5, 4.003.1.5]
        title: Column filters on the Processing list
        steps:
          - As rn.po1 filter Insurance Company = INS-A and Expiring Policy No. containing "MC".
          - Search a renewal reference.
        expected: Both filters combine; the search finds the reference and highlights it.
      - c: 3
        type: Negative
        title: Search for a legacy EBIX number finds nothing
        steps:
          - Type a legacy EBIX invoice number in the search box.
        expected: No row is found; the EBIX and BDOIsys searches are out of scope (Addendum 1, p.34).
      - c: 4
        type: Positive
        title: Column order kept after log-out
        steps:
