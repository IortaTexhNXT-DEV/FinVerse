          - Call PUT and DELETE on /api/v1/renewal/candidates/{ref}/history with rn.mkttl1's token.
        expected: No edit or delete action exists; both calls are refused and the rows are unchanged.

  FR-RN-010:
    scenario: SC-RN-02
    persona: SYSTEM
    screen: HOME
    data: [TD-RN-02]
    conditions:
      - The daily job extracts each booked root invoice whose expiry is the business date plus the lead days, with a renewal reference.
      - A second run does not create a second open candidate for the same invoice.
      - A change of the lead days takes effect at the next run without a release.
      - Employee Benefits lines (HMO, GLI, GPA) are not extracted.
      - For a multi-year account only the last policy year produces a candidate.
      - A failed run raises RNW_EXTRACTION_FAILED and the next run picks up the missed dates.
    cases:
      - c: 1
        type: Positive
        title: Policies expiring in 140 days are extracted
        steps:
          - As rn.sysadmin run job RNW_EXTRACTION from Administration > Scheduled Jobs.
          - As rn.mkttl1 open Renewal Home, Extraction runs, and the Expiry List for the expiry date.
        expected: The run RXR-yyyy shows the counts read, new, existing and skipped; each TD-RN-02 invoice is a candidate in stage EXTRACTED with a reference RNW-yyyy-nnnnnn, its expiring invoice number, ARN and policy number.
      - c: 2
        type: Negative
        title: A second run creates no duplicate
        steps:
          - Run RNW_EXTRACTION again for the same business date.
        expected: The run counts the invoices as existing; the Expiry List still shows one candidate per invoice.
      - c: 3
        type: Positive
        persona: SYSADMIN
        screen: PARAMS
        brd: [BRRN.030]
        title: Lead days changed to 150
        steps:
          - Set RNW_EXTRACTION_LEAD_DAYS to 150 and save.
          - Run the job.
        expected: The run extracts the invoices expiring 150 days after the business date; no release is needed.
      - c: 4
        type: Negative
        data: [TD-RN-04]
        title: HMO policy is not extracted
        steps:
          - Run the job on the expiry date of the HMO policy of TD-RN-04.
        expected: The HMO invoice is counted as skipped and is not on the Expiry List (RNW_EXCLUDED_LINES).
      - c: 5
        type: Positive
        brd: [BRRN.005, restating BRD 1.003.4.1.2, 3.003.4.2]
        title: 3-year Motor policy extracted once, in the last year
        steps:
          - Run the job on the business date where year 2 of the 3-year policy ends, then on the date the term ends.
        expected: No candidate is created at the end of year 2; one candidate is created for the last policy year.
      - c: 6
        type: Negative
        screen: NOTIF
        title: Failed run raises the alert and is caught up
        pre: The test lead makes the run fail (for example the ledger view is unavailable).
        steps:
          - Run the job; open the bell as the job owner.
          - Restore the ledger and run the job the next business day.
        expected: The run is Failed and alert RNW_EXTRACTION_FAILED is shown; the next run extracts the missed date and today's date.
      - c: 1
        type: Positive
        brd: [BRRN.005]
        title: Expired, not renewed candidates stay listed
        steps:
          - Open the Expiry List for a range that includes an expired candidate that is still open.
        expected: The candidate stays listed until it closes; no account of the range is missing or duplicated.

  FR-RN-011:
    scenario: SC-RN-02
    persona: MKT_TL
    screen: EXPGEN
    data: [TD-RN-02]
    conditions:
      - The TL generates the list for a start and end date and sees every candidate of the units in scope expiring in the range, and only those.
      - Changing the range refreshes the list; dates beyond the job's extraction are extracted on demand and recorded as MANUAL_RANGE.
      - A missing date or an end date before the start date is refused.
      - A range without expiring accounts shows the empty-list message.
    cases:
      - c: 1
        type: Positive
        brd: [BRRN.002, restating BRD 1.003.1, 1.003.1.1, 1.003.2]
        title: Marketing TL generates the list for one month
        steps:
          - Open Expiry List; click Generate Expiry List.
          - Enter 03/01/2027 and 03/31/2027 (the month of TD-RN-02); click Generate.
        expected: The list shows every Retail Marketing 1 candidate expiring in March 2027 and none of other months or units; the row count equals the TD-RN-02 count.
      - c: 1
        type: Positive
        persona: PROCESSING_TL
        brd: [3.003.1, 3.003.1.1, 3.003.2, BRD 3.003.4, 3.003.4.1]
        title: Processing TL generates the list for processing
        steps:
          - Log in as rn.proctl; Expiry List; Generate Expiry List for the same month.
        expected: The list shows the candidates of the month with the Processing column set of FR-RN-013.
      - c: 2
        type: Positive
        title: Range beyond the job is extracted on demand
        steps:
          - Generate the list for the month after the job's last extracted date.
          - Open Renewal Home, Extraction runs.
        expected: The candidates of that month are listed; a run with trigger MANUAL_RANGE, user rn.mkttl1, range and counts is recorded; no candidate is initiated.
      - c: 2
        type: Positive
        title: Changing the range refreshes the list
        steps:
          - Change the end date to 03/15/2027.
        expected: The list refreshes at once and shows only the expiries of 1 to 15 March.
      - c: 3
        type: Negative
        title: End date before the start date
        steps:
          - Enter 03/31/2027 as start and 03/01/2027 as end; click Generate.
        expected: The dialog is not submitted.
