      - c: 4
        type: Report-output
        screen: REPORTS
        title: RNW-SANITATION lists the failed checks of a range
        steps:
          - Run RNW-SANITATION for the TD-RN-04 expiry range, result = FAIL.
        expected: Each failed check is listed with the candidate reference, check, result, detail and run time; the rows match the Checks & Bucket tabs.

  FR-RN-021:
    scenario: SC-RN-03
    persona: PROCESSOR
    screen: RECORD
    data: [TD-RN-02, TD-RN-06]
    conditions:
      - Every candidate has a unique renewal reference RNW-yyyy-nnnnnn stored with the expiring ARN and invoice number.
      - An upload row without a reference, or with an unknown reference, is kept as an exception line and updates nothing.
      - REFERENCE_MATCH records MATCHED, MISSING, INVALID or AMBIGUOUS per record.
    cases:
      - c: 1
        type: Positive
        persona: MKT_TL
        screen: EXPIRY
        title: References are unique and follow the format
        steps:
          - Export the Expiry List of TD-RN-02 and sort the Renewal Reference No. column.
        expected: Every row has a reference RNW-yyyy-nnnnnn; no reference appears twice; each row also shows the expiring invoice number and ARN.
      - c: 2
        type: Negative
        screen: PROCWL
        title: Row with an unknown reference
        steps:
          - Upload RN_DISPO_500.xlsx; open the result.
        expected: The 3 rows with unknown references are exception lines and no account is updated by them.
        msg: ["Row {12}: renewal reference {RNW-2026-999999} does not exist"]
      - c: 2
        type: Negative
        screen: PROCWL
        title: Row without a reference
        steps:
          - Upload a file whose row 5 has a blank renewal reference.
        expected: Row 5 is an exception line; nothing is updated from it.
        msg: ["Row {5} has no renewal reference"]
      - c: 3
        type: Positive
        screen: CHECKS
        title: Match outcome visible on the record
        steps:
          - Open a candidate updated by the upload, tab Checks & Bucket.
        expected: REFERENCE_MATCH shows MATCHED with the upload job as source.

  FR-RN-022:
    scenario: SC-RN-03
    persona: MKT_TL
    screen: CHECKS
    data: [TD-RN-04, TD-RN-08]
    conditions:
      - The bucket follows the active rule set - FAIL_EXCEPTION gives Exception, FAIL_REVIEW or WARN gives Review, otherwise Clean.
      - Records move between buckets when conditions change, and each change is logged with rule-set version, rule, run and cause.
      - Users filter and export by bucket and see Exceptions in their own tab.
      - A failed check never gives Clean, by rule or by override; an override needs remarks.
      - The owners of the stage are notified when a candidate enters Exception.
    cases:
      - c: 1
        type: Positive
        title: Open claim gives Review
        pre: Claims is connected or its stub returns one open claim for RNW-2026-000201.
        steps:
          - Open RNW-2026-000201, tab Checks & Bucket.
        expected: CLAIMS is FAIL_REVIEW and the Classification pill is Review, never Clean; the tab names the check that set it.
      - c: 2
        type: Workflow
        persona: SYSTEM
        title: Closed claim moves the candidate to Clean
        steps:
          - Close the claim; wait for the nightly RNW_REEVALUATE run or trigger it.
          - Open the bucket history.
        expected: The candidate is Clean; the bucket history shows Review then Clean, each with rule-set version, rule, check run and cause RULE.
      - c: 3
        type: Report-output
        screen: EXPIRY
        title: Exceptions tab and bucket filter
        steps:
          - Open the Exceptions tab; then filter Bucket = Review on All and export.
        expected: The Exceptions tab lists only Exception candidates; the export holds only Review rows.
      - c: 4
        type: Negative
        title: Override to Clean with a failed check
        steps:
          - On RNW-2026-000201 (claim open) click Override Bucket; choose Clean.
        expected: Clean is not offered while a check fails; the API call with Clean is refused and the bucket stays Review.
        msg: ["Renewal {RNW-2026-000201} has failed checks and cannot be Clean"]
      - c: 4
        type: Negative
        title: Override without remarks
        steps:
          - Click Override Bucket on RNW-2026-000202; choose Exception; leave Remarks blank; Save.
        expected: The override is not saved.
        msg: [Enter the remarks of the override]
      - c: 4
        type: Positive
        title: Override to Exception with remarks
        steps:
          - Override RNW-2026-000202 to Exception with remarks "Client disputes the endorsement".
        expected: The pill is Exception; the bucket history shows cause OVERRIDE with rn.mkttl1 and the remarks.
      - c: 5
        type: Positive
        screen: NOTIF
        title: Stage owners notified on entry to Exception
        steps:
          - After the override, open the bell as rn.mkttl1 and rn.ao1.
        expected: Each owner of the stage has a notice naming RNW-2026-000202 and the Exception bucket.

  FR-RN-023:
    scenario: SC-RN-03
    persona: BUSINESS_ADMIN
    screen: SETUP
    data: [TD-RN-03, TD-RN-08]
    conditions:
      - A Clean candidate matching an AUTO rule receives a system disposition (source MATRIX) and moves on without user action.
      - A candidate with claims, endorsements, a missing PN or unresolved payment is not disposed automatically and shows the proposal to the AO.
      - A matrix version is activated only by a checker other than its maker; only one version is active.
      - A rule without an outcome disposition cannot be saved.
      - An authorised user overrides a system disposition with mandatory remarks; the override is logged.
      - Every system decision stores the matrix version and rule id, shown in RNW-DECISIONS.
    cases:
      - c: 1
        type: Workflow
        persona: MKT_TL
        screen: RECORD
        title: Clean CBG Motor candidate disposed For Renewal by the matrix
        steps:
          - Initiate a clean CBG Motor candidate of TD-RN-03 with a PN.
          - Open the record, Disposition panel and History tab.
        expected: The disposition is For Renewal with source MATRIX, version MX-2, rule 10; with RNW_STP_SKIP_TL_REVIEW = true the candidate moves to For Processing without AO or TL action.
      - c: 2
        type: Negative
        persona: MKT_AO
        screen: DISP
        brd: [BRRN.031]
        title: Candidate with an open claim is not disposed automatically
        steps:
          - Initiate a CBG Motor candidate with an open claim; open it as the AO.
        expected: No system disposition is recorded; the Disposition panel proposes For Renewal (rule 20) as the default for the AO.
      - c: 3
        type: Workflow
        title: Maker drafts a matrix version and a checker activates it
        steps:
          - As rn.badmin draft version MX-3 with the rules of TD-RN-08; submit.
          - As rn.checker open My Approvals, compare MX-3 with MX-2 and activate it from tomorrow.
        expected: MX-3 is Active from its effective date and MX-2 ends the day before; the checkers were notified on submission.
      - c: 3
        type: Security-access
        title: The maker cannot activate the own matrix version
        steps:
          - As rn.badmin try to activate MX-3 that rn.badmin drafted.
        expected: Activation is refused and MX-3 stays submitted.
        msg: [A matrix version is activated by someone other than its maker]
      - c: 4
        type: Negative
        title: Rule without an outcome
        steps:
          - Add rule 40 with Segment CBG and no Outcome disposition; save.
        expected: The rule is not saved.
        msg: [Select the disposition of the rule]
      - c: 5
        type: Positive
        persona: MKT_TL
        screen: RECORD
        brd: [BRRN.031]
        title: Override of a system disposition with remarks
        steps:
          - On a MATRIX-disposed candidate click Override; kind Disposition; choose For Quotation; reason; remarks; Save.
        expected: The disposition is For Quotation with source USER; the history keeps the MATRIX row and shows the override with remarks.
      - c: 5
        type: Negative
        persona: MKT_TL
        screen: RECORD
        title: Disposition override without remarks
        steps:
          - Repeat the override with blank remarks.
        expected: The override is not saved.
        msg: [Enter the remarks of the override]
      - c: 6
        type: Report-output
        persona: MKT_TL
        screen: REPORTS
        brd: [BRRN.034]
        title: RNW-DECISIONS shows matrix version and rule
        steps:
          - Run RNW-DECISIONS for today.
        expected: Each system disposition shows matrix version and rule id; the override of TC-RN-023.5-01 shows the user and remarks.

  FR-RN-024:
    scenario: SC-RN-03
    persona: BUSINESS_ADMIN
    screen: SETUP
    data: [TD-RN-04]
    conditions:
      - A candidate on a non-renewable risk code is tagged Not for Renewal (reason Non-renewable Accounts, source SYSTEM), kept out of Unassigned Disposition and an NFR is queued.
      - The NFR is sent protected to the client's registered e-mail and its sent status shows on the Letters tab.
      - A code change takes effect only after a checker authorises it; codes are end-dated, never deleted.
      - An effective-to date before the effective-from date, or a risk code not in the catalogue, is refused.
    cases:
      - c: 1
        type: Workflow
        title: Risk code XR99 tags the candidate Not for Renewal
        steps:
          - As rn.badmin add XR99 with reason "Line withdrawn" effective today; rn.checker authorises it.
          - Run the checks (RNW_REEVALUATE) and open RNW-2026-000205.
          - As rn.mkttl1 open the tab Unassigned Disposition.
        expected: RNW-2026-000205 has disposition Not for Renewal, reason Non-renewable Accounts, source SYSTEM, stage Letter pending; it is not in Unassigned Disposition.
      - c: 2
        type: Upload-download
        screen: LETTAB
        title: NFR generated and sent protected
        steps:
          - Open RNW-2026-000205, tab Letters; open the client's test mailbox.
        expected: The NFR (NFR-yyyy) from template RNW_NFR is listed with status Sent; the mailbox holds the password-protected NFR and a separate password e-mail.
      - c: 3
        type: Negative
        title: Code not in force before authorisation
        steps:
          - As rn.badmin add risk code MC02 as non-renewable; do not authorise; run the checks.
        expected: MC02 candidates are not tagged while the change waits in My Approvals.
      - c: 3
        type: Positive
        title: End-date a code instead of deleting it
        steps:
          - Open XR99 and set the effective-to date to today; rn.checker authorises.
        expected: No Delete action exists; XR99 is listed as ended with its history; candidates extracted after the end date are not tagged.
      - c: 4
        type: Negative
        title: Effective-to before effective-from
        steps:
          - Add a code with effective from 01-May-2027 and effective to 01-Apr-2027; save.
        expected: The code is not saved.
        msg: [The effective-to date is before the effective-from date]
      - c: 4
        type: Negative
        title: Risk code not in the catalogue
        steps:
          - Type risk code ZZ00 and save.
        expected: The code is not saved.
        msg: ["Risk code {ZZ00} does not exist"]

  FR-RN-025:
    scenario: SC-RN-03
    persona: LAMD
    screen: LAMDR
    data: [TD-RN-03, TD-RN-05]
    conditions:
      - A paid-off PN matching a candidate tags it Not for Renewal with reason Loan fully paid.
      - An RMU PN tags the candidate Not for Renewal (RMU) or transfers it to the unit in RNW_RMU_UNIT when set.
      - Unmatched, blank and ambiguous PN rows are kept and listed; a file of another type is refused.
      - A CBG Motor or Fire candidate without a PN fails PN_PRESENT and is Exception; matched Clean CBG candidates follow the straight-through path without AO assignment.
      - Upload, each match and routing are logged, and the owning TL is notified.
    cases:
      - c: 1
        type: Workflow
        brd: [BRRN.029]
        title: Paid-off report tags the matching candidate
        steps:
          - Choose Report type Paid-off, the period, and upload the paid-off file of TD-RN-05.
          - Open the match results; as rn.mkttl1 open the matched candidate.
        expected: PN-2026-7001 is matched; the candidate is Not for Renewal with reason Loan fully paid, source LAMD.
      - c: 2
        type: Workflow
        brd: [BRRN.029]
        title: RMU report without an RMU unit
        pre: RNW_RMU_UNIT is empty.
        steps:
          - Upload the RMU file with PN-2026-7002.
        expected: The candidate is Not for Renewal with reason RMU.
      - c: 2
        type: Workflow
        brd: [BRRN.029]
        title: RMU report with an RMU unit set
        pre: RNW_RMU_UNIT = Corporate RMU.
        steps:
          - Upload the RMU file again for a second candidate.
        expected: The candidate is transferred to Corporate RMU and appears in its Transfers inbox.
      - c: 3
        type: Negative
        title: Unmatched, blank and shared PN rows
        steps:
          - Upload the file with PN-2026-9999, a row without PN and a PN shared by two candidates.
          - Run RNW-LAMD-MATCH for the period.
        expected: The three rows are listed as unmatched or refused and change no candidate; row 6 shows "Row 6 - PN PN-2026-7005 matches several renewals"; RNW-LAMD-MATCH lists the three rows.
        msg: ["Row {4} has no PN number"]
      - c: 3
        type: Negative
        title: File of a type the upload refuses
        steps:
          - Upload the .exe file of TD-RN-05.
        expected: Nothing is uploaded.
        msg: ["Upload an Excel (.xlsx), OpenDocument (.ods), CSV (.csv) or text (.txt) file"]
      - c: 4
        type: Negative
        persona: MKT_TL
        screen: CHECKS
        brd: [BRRN.039]
        title: CBG Motor candidate without a PN is Exception
        steps:
          - Open the CBG Motor candidate without PN of TD-RN-03.
        expected: PN_PRESENT is FAIL_EXCEPTION; the pill is Exception; it is not on the straight-through path.
      - c: 4
        type: Workflow
        persona: MKT_TL
        screen: RECORD
        brd: [BRRN.039]
        title: Matched Clean CBG candidate goes straight through
        steps:
          - Open a CBG Fire candidate whose PN matched with no LAMD status and that is Clean.
        expected: The candidate was never in Unassigned Disposition; it moved by the matrix to For Processing (RA path) without AO assignment.
      - c: 5
        type: Positive
        persona: SYSADMIN
        screen: AUDIT
        brd: [BRRN.024, BRRN.029]
        title: LAMD actions logged and TL notified
        steps:
          - Open the Audit Trail for rn.lamd; as rn.mkttl1 open the bell.
        expected: The upload, each match and routing are logged with time and data source; rn.mkttl1 has a notice for each tagged account.
      - c: 5
        type: Security-access
        brd: [BRRN.024]
        title: LAMD user sees no RA or disposition action
        steps:
          - As rn.lamd open a matched candidate.
        expected: The page is read only; Generate RA, Disposition and Send are not offered.

  FR-RN-026:
    scenario: SC-RN-03
    persona: MKT_TL
    screen: EXPIRY
    data: [TD-RN-04]
    conditions:
      - A candidate whose client KYC review is due within the window shows the KYC due chip with the date it was first identified.
      - The KYC flag never changes the bucket or blocks the renewal.
      - The renewal status report shows the flag and the date identified.
      - The flag applies only to the segments in RNW_KYC_SEGMENTS when the parameter is set.
    cases:
      - c: 1
        type: Positive
        title: KYC due chip on a client due in 20 days
        steps:
          - Open RNW-2026-000204 in the Expiry List and on the record page.
        expected: The chip KYC due is shown with the date it was identified.
      - c: 2
        type: Negative
        screen: CHECKS
        title: KYC flag does not change the bucket
        steps:
          - Open RNW-2026-000204, tab Checks & Bucket; push it through disposition and posting.
        expected: KYC_DUE is INFO; the pill is Clean; post is not refused because of KYC.
      - c: 3
        type: Report-output
        screen: REPORTS
        title: Status report shows the KYC flag
        steps:
          - Run RNW-STATUS for the range of RNW-2026-000204.
        expected: The row shows KYC due and the date identified.
      - c: 4
        type: Negative
        persona: SYSADMIN
        screen: PARAMS
        title: Segment outside RNW_KYC_SEGMENTS
        steps:
          - Set RNW_KYC_SEGMENTS = CLG; run the checks.
        expected: RNW-2026-000204 (not CLG) no longer shows the chip; the history records when it was cleared.

  FR-RN-027:
    scenario: SC-RN-03
    persona: MKT_TL
    screen: TLREVIEW
    data: [TD-RN-04]
    conditions:
      - While an endorsement request on the expiring invoice family is open, the candidate is Review with the Endorsed flag and cannot be posted, get an RA or be accepted.
      - After the endorsement is posted, the renewal account reflects the endorsed values (the policy as of the last posted endorsement).
      - The record lists the linked endorsement numbers.
    cases:
      - c: 1
        type: Negative
        brd: [BRD 1.008.1.4, BRRN.032]
        title: TL cannot post while an endorsement is open
        steps:
          - Push RNW-2026-000202 as the AO; as rn.mkttl1 select it in TL Review and click Post.
        expected: The post is refused and the account stays in Review in progress.
        msg: ["Renewal {RNW-2026-000202} has an endorsement in progress ({END-2026-000450})"]
      - c: 1
        type: Negative
        persona: MKT_AO
        screen: LETTERS
        title: No RA while an endorsement is open
        pre: A candidate in RA_READY with a new endorsement request opened on its expiring invoice.
        steps:
          - Select it in RA Ready; Generate RA.
        expected: The RA is not generated.
        msg: ["Renewal {RNW-2026-000212} has an endorsement in progress ({END-2026-000455})"]
      - c: 2
        type: Positive
        persona: PROCESSOR
        screen: RACC
        title: Renewal account shows the endorsed sum insured
        steps:
          - Post END-2026-000450 (sum insured raised to PHP 1,800,000); after re-evaluation post and process the candidate.
          - Open the Renewal Account section.
        expected: The renewal account has sum insured PHP 1,800,000.
      - c: 3
        type: Positive
        screen: ACCHIST
        title: Linked endorsements listed on the record
        steps:
          - Open RNW-2026-000202, tab Account History, section Endorsements.
        expected: END-2026-000450 is listed with source and status at link time.

  FR-RN-028:
    scenario: SC-RN-03
    persona: PROCESSOR
    screen: CHECKS
    data: [TD-RN-15, TD-RN-16]
    conditions:
      - A migrated policy whose legacy package maps to one BIBS package version passes PACKAGE_REMAP and shows that version.
      - An unmapped or ambiguous legacy package fails PACKAGE_REMAP and puts the candidate in the Exception bucket.
      - The package chosen by a processor applies only after a second processor approves it; the maker cannot approve.
      - The check is Not applicable to candidates booked in BIBS.
    cases:
      - c: 1
        type: Positive
        title: Mapped legacy package resolves
        steps:
          - Open the candidate whose legacy package is HOME-01 v2, tab Checks & Bucket.
        expected: PACKAGE_REMAP is PASS; the Package panel shows PKG-HOME-2027.
      - c: 2
        type: Negative
        title: Unmapped and ambiguous packages go to Exception
        steps:
          - Open the candidates with legacy packages FIRE-OLD v1 and MOTOR-CLG v1.
        expected: PACKAGE_REMAP is FAIL for both, with the detail "not in the code map" and "several package versions"; the bucket is Exception.
      - c: 3
        type: Workflow
        title: Package chosen and approved
        steps:
          - As rn.po1 choose the BIBS package version of the FIRE-OLD candidate with a reason and submit.
          - As rn.po2 approve the choice.
        expected: The check turns PASS, the bucket is recomputed, and RNW-PACKAGE-REMAP lists the legacy package, chosen version, maker rn.po1 and checker rn.po2.
      - c: 3
        type: Negative
        title: Maker cannot approve his own package choice
        steps:
          - As rn.po1 choose a package version for the MOTOR-CLG candidate and try to approve it.
        expected: The approval is refused.
        msg: ["The package choice must be approved by another user"]
      - c: 3
        type: Negative
        title: Choice without a reason is refused
        steps:
          - As rn.po1 submit a package choice without a reason.
        expected: The choice is not saved.
        msg: ["Choose the package version and give the reason"]
      - c: 4
        type: Positive
        data: [TD-RN-02]
        title: Not applicable to candidates booked in BIBS
        steps:
          - Open a TD-RN-02 candidate, tab Checks & Bucket.
        expected: PACKAGE_REMAP shows Not applicable and does not affect the bucket.

  FR-RN-030:
    scenario: SC-RN-04
    persona: MKT_TL
    screen: EXPIRY
    data: [TD-RN-01, TD-RN-02]
    conditions:
      - The TL assigns selected Unassigned Disposition accounts (single, multiple, all except, all) to an AO of the own unit; they move to the AO's My Dispositions.
      - The AO list offers only the officers of the TL's unit; an AO of another unit is refused.
      - The TL re-assigns accounts to another AO until the RA is generated; after the RA the account is locked.
      - CBG accounts never appear in Unassigned Disposition.
      - Nothing changes when no account is selected or the selection is cleared before pushing.
    cases:
      - c: 1
        type: Workflow
        brd: [BRD 1.005.1, 1.005.1.1, 1.005.1.1.1, 1.005.1.1.2]
        title: Assign five accounts to rn.ao1 by name search
        steps:
          - Open the tab Unassigned Disposition; tick five accounts.
          - Click Assign Disposition; type "ao1" in Account Officer and select rn.ao1.
          - Click Assign and Push.
        expected: The five accounts leave Unassigned Disposition and appear in rn.ao1's My Dispositions in stage For disposition; rn.ao1 receives RNW_ASSIGNED.
      - c: 1
        type: Workflow
        brd: [1.005.1.2, 1.005.1.2.1-1.005.1.2.4]
        title: Assign with "all except" from the officer list
        steps:
          - Select all accounts, untick two ("all except"); click Assign Disposition.
          - Pick rn.ao2 from the list of the unit's officers; Assign and Push.
        expected: All selected accounts except the two go to rn.ao2; the two stay Unassigned.
      - c: 2
        type: Negative
        screen: API
        title: Assign to an officer of another unit
        steps:
          - Check the Account Officer list for rn.ao3 (Corporate Marketing 2).
          - Call POST /api/v1/renewal/candidates/assign with rn.ao3.
        expected: rn.ao3 is not in the list; the call is refused and the accounts stay Unassigned.
        msg: ["{rn.ao3} is not an officer of your unit"]
      - c: 3
        type: Workflow
        brd: [BRD 1.005.2]
        title: Re-assign an account to another AO
        steps:
          - Tick an account assigned to rn.ao1; click Re-assign Officer; select rn.ao2 and a reason; push.
        expected: The account moves to rn.ao2's list; the history shows from rn.ao1 to rn.ao2 with rn.mkttl1 and the time.
      - c: 3
        type: Negative
        brd: [BRD 1.005.2]
        title: Re-assign after the RA was generated
        steps:
          - Tick an account in RA Generated; click Re-assign Officer.
        expected: The re-assignment is refused.
        msg: ["Renewal {RNW-2026-000130} is locked since the Renewal Advice was generated"]
      - c: 4
        type: Negative
        data: [TD-RN-03]
        title: CBG account not in Unassigned Disposition
        steps:
          - Initiate the CBG accounts of TD-RN-03; open Unassigned Disposition and search their references.
        expected: No CBG account is listed; they follow the LAMD-driven path.
      - c: 5
        type: Negative
        title: Assign with no account selected, and unselect
        steps:
          - Click Assign Disposition with nothing ticked.
          - Tick three accounts, then clear the selection and close the dialog.
        expected: The first attempt shows the message; after unselecting nothing is changed.
        msg: [Select at least one account]

  FR-RN-031:
    scenario: SC-RN-04
    persona: MKT_TL
    screen: EXPIRY
    data: [TD-RN-01, TD-RN-02]
    conditions:
      - The TL or the AO submits a transfer with receiving unit and remarks; the account moves to Transfer pending and leaves the sender's list, and the receiving TLs are notified.
      - The receiving unit must be another active Marketing unit; the unit and the remarks are mandatory.
      - One open transfer request per account; the sender may cancel it before it is decided.
      - The non-renewal reason "Transfer to Another Marketing Unit" opens the same transfer.
    cases:
      - c: 1
        type: Workflow
        brd: [BRD 1.006.1-1.006.5]
        title: TL transfers an unassigned account to Corporate Marketing 2
        steps:
          - Tick one Unassigned account; click Transfer; view the account.
          - Select Corporate Marketing 2, reason, remarks "Client moved to corporate"; Submit and Push.
        expected: The account is Transfer pending and no longer in rn.mkttl1's lists; rn.mkttl2 receives RNW_TRANSFER_REQUESTED and sees it in Transfers, tab Incoming.
      - c: 1
        type: Workflow
        persona: MKT_AO
        screen: MYDISP
        brd: [BRD 2.005.1, 2.005.2, 2.005.3, 2.005.3.1, 2.005.3.2, 2.005.4, 2.005.5]
        title: AO requests the transfer of an assigned account
        steps:
          - As rn.ao1 select an account in My Dispositions; click Transfer; view it.
          - Select Corporate Marketing 2, write remarks; Submit and Push.
        expected: The account leaves My Dispositions and is Transfer pending; the receiving TLs are notified.
      - c: 2
        type: Negative
        title: Transfer to the same unit
        steps:
          - Transfer an account and try to select Retail Marketing 1 (the account's unit).
        expected: The own unit is not offered; the API call with it is refused.
        msg: [The receiving unit must be another unit]
      - c: 2
        type: Negative
        title: Transfer without remarks
        steps:
          - Select the receiving unit, leave Remarks blank; Submit and Push.
        expected: The transfer is not submitted.
        msg: [Enter the remarks]
      - c: 3
        type: Negative
        title: Second transfer on the same account
        steps:
          - Submit a transfer on an account that is already Transfer pending (API or a second tab).
        expected: The second request is refused.
        msg: ["Renewal {RNW-2026-000115} already has a transfer request"]
      - c: 3
        type: Workflow
        screen: TRANSFERS
        title: Sender cancels an open request
        steps:
          - Open Transfers, tab Outgoing; cancel the open request.
        expected: The account returns to its previous stage and list; the receiving TL no longer sees it.
      - c: 4
        type: Workflow
        persona: MKT_AO
        screen: DISP
        brd: [BRD 2.004.4.8]
        title: Reason Transfer to Another Marketing Unit opens the transfer
        steps:
          - Dispose Not for Renewal with reason Transfer to Another Marketing Unit; select the receiving unit; push.
        expected: The transfer request is created and the account is Transfer pending.

  FR-RN-032:
    scenario: SC-RN-04
    persona: MKT_TL
    screen: TRANSFERS
    data: [TD-RN-01]
    conditions:
      - The receiving TL is notified and sees the transferred accounts flagged Transferred.
      - An accepted account joins the receiving unit's Unassigned Disposition with the Transferred chip.
      - A declined account returns to the sending unit at its previous stage with the decline remarks; a decline needs remarks.
      - Only a TL of the receiving unit decides, and a decided request cannot be decided again.
    cases:
      - c: 1
        type: Positive
        screen: NOTIF
        brd: [BRD 1.007.1, 1.007.2]
        title: Receiving TL is notified
        steps:
          - Log in as rn.mkttl2; open the bell and Transfers, tab Incoming.
        expected: The notice names the account and sender; the Incoming tab lists the account with the Transferred flag.
      - c: 2
        type: Workflow
        brd: [1.007.3, 1.007.3.1, 1.007.5]
        title: Accept a transferred account
        steps:
          - As rn.mkttl2 view the account; click Accept and push.
        expected: The account is in Corporate Marketing 2's Unassigned Disposition with the Transferred chip; the requester and the sending TL receive RNW_TRANSFER_DECIDED.
      - c: 3
        type: Workflow
        brd: [1.007.4, 1.007.4.1, 1.007.4.2]
        title: Decline with remarks
        steps:
          - As rn.mkttl2 open another incoming request; click Decline; remarks "Not our client segment"; push.
        expected: The account is back in Retail Marketing 1 at its previous stage and shows the decline remarks.
      - c: 3
        type: Negative
        title: Decline without remarks
        steps:
          - Click Decline with blank remarks; push.
        expected: The decline is not saved.
        msg: [Enter the remarks of the decline]
      - c: 4
        type: Security-access
        persona: MKT_TL
        title: TL of another unit cannot decide
        steps:
          - As rn.mkttl1 (sending unit) open the request in Outgoing; call the accept endpoint.
        expected: Accept and Decline are not shown; the call returns HTTP 403.
        msg: [You are not permitted to perform this action]
      - c: 4
        type: Negative
        screen: API
        title: Request already decided
        steps:
          - Call accept on a request that rn.mkttl2 already declined.
        expected: The call is refused; the account is unchanged.
        msg: ["The transfer of {RNW-2026-000116} is already decided"]

  FR-RN-040:
    scenario: SC-RN-05
    persona: MKT_AO
    screen: MYDISP
    data: [TD-RN-01, TD-RN-02]
    conditions:
      - My Dispositions lists every account ever assigned to the AO, of every status and year, in one scrollable view without a filter being chosen.
      - Every column filters and sorts ascending and descending, and the keyword search highlights matches.
      - The AO finds an account by client name or by renewal reference, ARN, expiring invoice or policy number, PN or client code.
      - Policy fields are read live, so a posted endorsement shows without a new extraction.
      - The AO sees no account assigned to another AO.
    cases:
      - c: 1
        type: Positive
        brd: [BRRN.011, restating BRD 2.003.1, BRRN.012, restating BRD 2.003.1.1]
        title: Accounts of the current and previous years without a filter
        pre: rn.ao1 has renewals of 2025 (closed) and 2026 (open).
        steps:
          - Open My Dispositions.
        expected: Both years and all statuses are listed in one scrollable view with a row count; no filter was needed.
      - c: 2
        type: Positive
        brd: [BRRN.014, restating BRD 2.003.1.3, BRRN.015, restating BRD 2.003.1.4]
        title: Sort and filter every column
        steps:
          - Sort by Expiry Date ascending, then descending; repeat for three other columns.
          - Filter Status = For disposition.
        expected: Each sort orders the rows correctly; the filter keeps only For disposition rows.
      - c: 2
        type: Positive
        brd: [BRRN.016, restating BRD 2.003.1.5]
        title: Keyword search like Ctrl+F
        steps:
          - Type "MC01" in the search box.
        expected: Only rows containing MC01 remain and the text is highlighted.
      - c: 3
        type: Positive
        brd: [BRRN.017, restating BRD 2.003.1.6 without the QPS / EBIX references]
        title: Search by client name and by each reference
        steps:
          - Search the client's name; then the renewal reference, ARN, expiring invoice number, policy number, PN and client code of one account.
        expected: The name search returns rn.ao1's accounts of that client; each reference search returns the account.
      - c: 3
        type: Negative
        brd: [BRRN.017, restating BRD 2.003.1.6 without the QPS / EBIX references]
        title: Search by QPS or EBIX number is not offered
        steps:
          - Type a legacy QPS reference in the search box.
        expected: No account is found; there is no QPS / EBIX search field (out of scope, Addendum 1 p.34).
      - c: 4
        type: Positive
        brd: [BRRN.011, restating BRD 2.003.1]
        title: Posted endorsement shows at once
        steps:
          - Post an endorsement changing the sum insured of an account of rn.ao1; refresh My Dispositions.
        expected: The new sum insured is shown without a new extraction.
      - c: 5
        type: Security-access
        title: AO does not see another AO's accounts
        steps:
          - As rn.ao1 search the reference of an account assigned to rn.ao2.
        expected: Nothing is found; opening the record by address shows no data.

  FR-RN-041:
    scenario: SC-RN-05
    persona: MKT_AO
    screen: DETAILS
    data: [TD-RN-02]
    conditions:
      - The record page shows the summary card and every renewal field of the account, read live from the account and invoice.
      - The user downloads the account details as PDF and Excel with the same values as the Details tab.
      - The user saves and prints the details with a preview and print settings.
      - Downloads are logged, and a user without RNW_VIEW or out of scope cannot open the record.
    cases:
      - c: 1
        type: Positive
        brd: [BRRN.013, restating BRD 2.003.1.2, 2.003.2]
        title: AO views the current renewal details
        steps:
          - Open an account from My Dispositions.
        expected: The summary card shows reference, Classification pill, disposition and flag chips; the Details tab shows every field of the expiring list for the account.
      - c: 1
        type: Positive
        persona: MKT_TL
        brd: [BRD 1.004.1, 1.004.1.1, 1.004.1.2, 1.008.1.2, 1.008.1.3]
        title: TL views an account from the list and from TL Review
        steps:
          - As rn.mkttl1 open an account from the Expiry List, then one from TL Review.
        expected: Both open the record page with all tabs and live values.
      - c: 1
        type: Positive
        persona: PROCESSING_TL
        brd: [3.006.1.1, 3.006.1.2, 3.006.2]
        title: Processing TL views an account for processing
        steps:
          - As rn.proctl open an account from the Processing Worklist.
        expected: The record page opens with Details, Computations and Insurer tabs.
      - c: 1
        type: Positive
        persona: PROCESSOR
        brd: [4.003.1.1, 4.003.1.2, 4.003.2]
        title: Processing Officer views an assigned account
        steps:
          - As rn.po1 open an account of the In Processing tab.
        expected: The record page opens with the current values.
      - c: 2
        type: Upload-download
        brd: [BRD 1.004.1.3-1.004.1.5.2, 2.003.3, 2.003.3.1]
        title: Download the details as PDF and Excel
        steps:
          - Click Download, PDF; then Download, Excel; save both.
        expected: Both files (template RNW_ACCOUNT_DETAILS) hold the same values as the Details tab.
      - c: 3
        type: Report-output
        brd: [2.003.3.2, 3.006.3, 3.006.3.1, 3.006.3.2]
        title: Print the details with preview
        steps:
          - Click Print; set Legal, landscape in the settings; print.
        expected: The preview shows the settings; the printout matches the preview.
      - c: 3
        type: Report-output
        persona: PROCESSOR
        brd: [4.003.3, 4.003.3.1, 4.003.3.2]
        title: Processing Officer saves and prints the details
        steps:
          - As rn.po1 download the PDF, save it, and print it.
        expected: The saved file and the printout have the same values as the tab.
      - c: 4
        type: Security-access
        persona: MKT_AO
        brd: [BRRN.013]
        title: Download logged; out-of-scope record refused
        steps:
          - As rn.sysadmin check the audit for the downloads of TC-RN-041.2-01.
          - As rn.ao3 open by address an account of Retail Marketing 1.
        expected: Each download is logged with user and time; rn.ao3 gets no data for the out-of-scope record.

  FR-RN-042:
    scenario: SC-RN-05
    persona: MKT_AO
    screen: ACCHIST
    data: [TD-RN-02]
    conditions:
      - The Account History tab shows read-only the prior policies (chain of ARNs), endorsements, payments and claims, from the mother policy in BIBS.
      - The disposition is refused until the user has opened the history; the view is recorded with user and time.
      - Before the Claims module is connected the claims section shows "claims not connected".
    cases:
      - c: 1
        type: Positive
        title: History of an account renewed last year
        steps:
          - Open an account that was renewed from a 2025 policy; tab Account History.
        expected: The previous year's ARN, its endorsements, payments and claims are listed; no field can be edited; Extract and Print are offered.
      - c: 2
        type: Negative
        screen: DISP
        title: Disposition before the history was opened
        steps:
          - Open a new account; go straight to the Disposition panel; choose For Renewal; Save.
        expected: The disposition is refused.
        msg: [Open the Account History before you give the disposition]
      - c: 2
        type: Positive
        screen: DISP
        title: Disposition accepted after the history was opened
        steps:
          - Open the Account History tab, then give the disposition For Renewal; Save.
        expected: The disposition is saved; the audit shows the history view with user, time and sections viewed.
      - c: 3
        type: Positive
        title: Claims section before the Claims module
        pre: Claims not connected.
        steps:
          - Open the Account History, section Claims.
        expected: The section shows "claims not connected"; the other sections are shown.

  FR-RN-043:
    scenario: SC-RN-05
    persona: MKT_AO
    screen: DISP
    data: [TD-RN-02]
    conditions:
      - The AO gives one of the five dispositions (the matrix proposal is the default) and pushes; the account goes to TL review with status Review in progress.
      - Not for Renewal needs one of the ten reasons; Booked to New Invoice needs an existing invoice number; Transfer to Another Marketing Unit needs the receiving unit.
      - A push with missing mandatory fields names every missing field and keeps the account in For disposition; the AO may save and push later.
      - Every disposition is a new row; earlier rows are kept with their source.
      - A disposition is refused once the RA locks the account.
    cases:
      - c: 1
        type: Workflow
        brd: [BRD 2.004.1, 2.004.2, 2.004.3, 2.004.3.1-2.004.3.5]
        title: Dispose For Renewal and push
        steps:
          - Open the account (history viewed); select For Renewal; add a remark; Save; Push.
        expected: The account is in TL Review with status Review in progress; the TL queue is notified.
      - c: 1
        type: Positive
        brd: [2.004.3.1-2.004.3.5]
        title: The five dispositions are offered
        steps:
          - Open the Disposition list.
        expected: For Renewal, Not for Renewal, For Quotation, For Proposal and Lost Business are offered; the matrix proposal is pre-selected when one exists.
      - c: 2
        type: Positive
        brd: [BRD 2.004.4, 2.004.4.1-2.004.4.10]
        title: The ten non-renewal reasons
        steps:
          - Select Not for Renewal and open the reason list.
        expected: RMU, With submitted policy, Loan fully paid, Direct to Insurer, Total Loss Claim, Unit Sold, Canceled Policy, Transfer to Another Marketing Unit, Non-renewable Accounts and Booked to New Invoice are offered.
      - c: 2
        type: Negative
        brd: [BRD 2.004.4]
        title: Not for Renewal without a reason
        steps:
          - Select Not for Renewal; leave the reason blank; Push.
        expected: The push is refused.
        msg: [Select the reason for Not for Renewal]
      - c: 2
        type: Negative
        brd: [2.004.4.1-2.004.4.10]
        title: Booked to New Invoice without, then with an unknown invoice number
        steps:
          - Choose reason Booked to New Invoice; Push with the invoice number blank.
          - Enter INV-2026-999999; Push.
        expected: The first push shows "Enter the new invoice number"; the second is refused.
        msg: ["Invoice {INV-2026-999999} does not exist"]
      - c: 2
        type: Positive
        brd: [2.004.4.1-2.004.4.10]
        title: Booked to New Invoice with an existing invoice
        steps:
          - Enter an existing invoice number of the client; Push.
        expected: The account is in TL Review with the reason and invoice number.
      - c: 3
        type: Negative
        brd: [BRD 2.004.5, 2.004.5.1, 2.004.5.2, 2.004.5.3]
        title: Push with missing mandatory fields
        pre: The product field rules make Mortgagee and Plate No. mandatory.
        steps:
          - Dispose For Renewal leaving Mortgagee and Plate No. blank; Push.
        expected: The push is refused, both fields are named and marked, and the account stays For disposition.
        msg: ["Complete the mandatory fields: {Mortgagee, Plate No.}"]
      - c: 3
        type: Positive
        brd: [BRD 2.004.5, 2.004.5.1]
        title: Save now and push later
        steps:
          - Save the disposition with fields missing; log out; complete the fields next day; Push.
        expected: The saved disposition is kept; the push succeeds once complete.
      - c: 4
        type: Positive
        screen: HIST
        brd: [BRD 2.004.1, 2.004.2]
        title: A new disposition row keeps the earlier one
        steps:
          - Change a saved For Quotation disposition to For Renewal; open the History tab.
        expected: Both rows are listed with source USER, user and time; the latest one is current.
      - c: 5
        type: Negative
        brd: [BRD 2.004.1]
        title: Disposition refused on a locked account
        steps:
          - Open an account in RA Generated; change the disposition.
        expected: The Disposition panel is read only; the API call is refused.
        msg: ["Renewal {RNW-2026-000130} is locked since the Renewal Advice was generated"]

  FR-RN-044:
    scenario: SC-RN-05
    persona: MKT_AO
    screen: REMARKS
    data: [TD-RN-02]
    conditions:
      - A saved remark is stamped with user ID, date, time and stage and is shown on the Remarks tab and in the column Remarks of Acct Officer.
      - A remark has at most 200 characters; saved remarks are not edited.
    cases:
      - c: 1
        type: Positive
        brd: [BRD 2.004.6, 2.004.7, 2.004.8]
        title: Add a remark and push
        steps:
          - Type "Client asked for a lower deductible" and Save; push the account.
        expected: The remark shows rn.ao1, date, time and stage For disposition; the Expiry List column Remarks of Acct Officer shows it.
      - c: 1
        type: Positive
        screen: MYDISP
        brd: [BRD 2.006.1.5, 2.006.1.5.1, 2.006.1.5.2, 2.006.1.6]
        title: Remarks on a dispositioned account
        steps:
          - In the Dispositioned view select an account, add a remark, Save.
        expected: The remark is stamped and listed.
      - c: 2
        type: Boundary
        title: 200 characters are accepted
        steps:
          - Save a remark of exactly 200 characters.
        expected: The remark is saved in full.
      - c: 2
        type: Boundary
        neg: true
        title: 201 characters are refused
        steps:
          - Save a remark of 201 characters.
        expected: The remark is not saved.
        msg: [Remarks may have at most 200 characters]
      - c: 2
        type: Negative
        title: A saved remark cannot be edited
        steps:
          - Look for Edit on a saved remark; call PUT on it by API.
        expected: No edit action exists; the call is refused.

  FR-RN-045:
    scenario: SC-RN-05
    persona: MKT_AO
    screen: MYDISP
    data: [TD-RN-02, TD-RN-04]
    conditions:
      - The Dispositioned view lists the AO's dispositioned accounts with status, and the AO selects and views any of them.
      - Accounts with endorsements and claims carry the chips Endorsed and Claims next to the reference, with the latest endorsement effective date.
      - A padlock marks closed or locked accounts, which cannot be edited.
    cases:
      - c: 1
        type: Positive
        brd: [BRD 2.006.1, 2.006.1.1, 2.006.1.1.1, 2.006.1.1.2]
        title: Dispositioned view with renewal status
        steps:
          - Open My Dispositions, view Dispositioned; select an account.
        expected: Each dispositioned account shows its renewal status; the selected one opens its record.
      - c: 2
        type: Positive
        brd: [2.006.1.3, 2.006.1.4]
        title: Endorsed and Claims chips
        steps:
          - Find RNW-2026-000202 (posted endorsement) and RNW-2026-000201 (claim).
        expected: The Endorsed chip with the endorsement effective date and the Claims chip are shown next to the references, not inside the status pill.
      - c: 3
        type: Negative
        brd: [2.006.1.5.3]
        title: Closed account shows the padlock and cannot be edited
        steps:
          - Open a Lost Business account closed last week.
        expected: The padlock is shown; the Disposition panel and Remarks are read only.

  FR-RN-046:
    scenario: SC-RN-05
    persona: MKT_AO
    screen: MYDISP
    data: [TD-RN-02]
    conditions:
      - The AO is notified of a returned account, which carries the red Returned flag and the return remarks.
      - The AO edits, saves or cancels, and pushes the account back; the flag clears on push.
      - A push with missing fields is refused.
    cases:
      - c: 1
        type: Positive
        brd: [BRD 2.007.1, 2.007.2, 2.007.3]
        title: Returned account with flag and remarks
        pre: rn.mkttl1 returned an account with reason Incomplete details and remarks.
        steps:
          - Open the notification; open the quick filter Returned to me.
        expected: The account shows the red Returned chip, the return reason and the TL's remarks.
      - c: 2
        type: Workflow
        brd: [2.007.4, 2.007.4.2-2.007.4.7, 2.007.5]
        title: Correct and push back
        steps:
          - Search and select the returned account; correct the disposition details; add a remark; Save; Push.
        expected: The account is back in TL Review without the Returned chip; the history shows the resubmission.
      - c: 2
        type: Positive
        brd: [2.007.4.2-2.007.4.7]
        title: Cancel keeps the account returned
        steps:
          - Edit a returned account and click Cancel.
        expected: Nothing is saved; the Returned chip stays.
      - c: 3
        type: Negative
        brd: [2.007.5]
        title: Push of a returned account with a field missing
        steps:
          - Clear a mandatory field and Push.
        expected: The push is refused and the account stays returned.
        msg: ["Complete the mandatory fields: {Plate No.}"]

  FR-RN-047:
    scenario: SC-RN-05
    persona: MKT_AO
    screen: RECORD
    data: [TD-RN-02, TD-RN-04]
    conditions:
      - A Not for Renewal account (by AO, system or upload) is re-opened with a reason until expiry plus RNW_REOPEN_DAYS and returns to For disposition.
      - The earlier disposition and any NFR sent stay in the history; the record shows "NFR sent".
      - Re-opening after the limit, or without a reason, is refused.
    cases:
      - c: 1
        type: Workflow
        brd: [BRD 2.004.10]
        title: AO re-opens an account ten days before expiry
        steps:
          - Open a closed Not for Renewal account; click Re-open Disposition; reason "Client decided to renew".
        expected: The account is For disposition; rn.ao1 and rn.mkttl1 are notified.
      - c: 1
        type: Workflow
        persona: PROCESSING_TL
        brd: [BRD 3.004.5]
        title: Processing TL re-opens an account tagged by the upload
        steps:
          - Open an account tagged Not for Renewal by the complete-file upload (FR-RN-060); Re-open Disposition with a reason.
        expected: The account returns to For disposition for the assigned AO.
      - c: 2
        type: Positive
        screen: HIST
        brd: [BRD 2.004.10]
        title: History keeps the superseded disposition and the NFR
        steps:
          - Re-open RNW-2026-000205 (NFR sent); open the History and Letters tabs.
        expected: The earlier Not for Renewal row and the sent NFR are kept; the chip "NFR sent" is shown.
      - c: 3
        type: Boundary
        neg: true
        brd: [BRD 2.004.10]
        title: Re-open 31 days after expiry
        pre: RNW_REOPEN_DAYS = 30.
        steps:
          - Re-open an account that expired 31 days ago.
        expected: The re-open is refused.
        msg: ["Renewal {RNW-2026-000140} can no longer be re-opened (expired on {15-Feb-2027})"]
      - c: 3
        type: Boundary
        brd: [BRD 2.004.10]
        title: Re-open 30 days after expiry
        steps:
          - Re-open an account that expired 30 days ago.
        expected: The re-open succeeds.
      - c: 3
        type: Negative
        brd: [BRD 2.004.10]
        title: Re-open without a reason
        steps:
          - Click Re-open Disposition with a blank reason.
        expected: Nothing changes.
        msg: [Enter the reason for re-opening]

  FR-RN-048:
    scenario: SC-RN-05
    persona: MKT_AO
    screen: RECORD
    data: [TD-RN-02, TD-RN-07]
    conditions:
      - A posted For Quotation or For Proposal disposition, or a failed financial-impact check, tags the renewal For Proposal / New Business Path with the reason.
      - Start NB Path creates a package quotation or a PRF pre-filled from the expiring account and linked by the renewal reference; its booked invoice has business type RENEWAL.
      - The candidate closes RENEWED on booking of the quotation's account, or LOST when it is declined or voided.
      - Only one NB path per candidate.
    cases:
      - c: 1
        type: Workflow
        brd: [BRRN.038]
        title: Insurer revision with +10 % premium routes to the NB path
        pre: RNW_FIN_IMPACT_TOLERANCE = 0.00; the INS-A Revise row of TD-RN-07 was applied.
        steps:
          - Open the candidate, tab Checks & Bucket and the summary card.
        expected: FINANCIAL_IMPACT fails; the account is tagged For Proposal / New Business Path and the audit records the reason.
      - c: 2
        type: Workflow
        brd: [BRRN.033]
        title: Start NB Path creates a pre-filled quotation
        steps:
          - Post a For Quotation disposition; click Start NB Path; confirm quotation.
        expected: A package quotation opens with the client, product, items and insurer of the expiring account and the renewal reference; the candidate is For Proposal / New Business Path.
      - c: 2
        type: Workflow
        screen: QUOTE
        brd: [BRRN.033]
        title: For Proposal creates a PRF
        steps:
          - Post a For Proposal disposition on a non-package account; Start NB Path.
        expected: A PRF opens pre-filled and linked by the renewal reference.
      - c: 3
        type: Workflow
        persona: NB_BOOKING
        screen: BOOKING
        brd: [BRRN.033]
        title: Candidate closes RENEWED when the quotation's account is booked
        steps:
          - Run the quotation through the BRD-1 flow to booking.
          - Open the booked invoice and the candidate.
        expected: The invoice has business type RENEWAL and points to the expiring ARN; the candidate is Renewed; the AO is notified.
      - c: 3
        type: Workflow
        brd: [BRRN.033]
        title: Declined quotation closes the candidate LOST
        steps:
          - Decline the quotation of another NB-path candidate.
        expected: The candidate is Closed with reason LOST; the AO is notified.
      - c: 4
        type: Negative
        brd: [BRRN.033]
        title: Second NB path on the same candidate
        steps:
          - Click Start NB Path again on the candidate of TC-RN-048.2-01.
        expected: No second quotation is created.
        msg: ["Renewal {RNW-2026-000150} already has quotation {Q-2026-000812}"]

  FR-RN-050:
    scenario: SC-RN-06
    persona: MKT_TL
    screen: TLREVIEW
    data: [TD-RN-02, TD-RN-04]
    conditions:
      - The TL sees every dispositioned account of the unit in one scrollable view with status Review in progress until it is posted.
      - The TL posts selected accounts (single, multiple, all except, all) and each moves on by its disposition.
      - The TL returns selected accounts to the AO with a reason and remarks; they show the red Returned flag.
      - An account with a failing blocking check cannot be posted until the check is overridden.
    cases:
      - c: 1
        type: Positive
        brd: [BRD 1.008.1, 1.008.1.1]
        title: TL Review lists the unit's dispositioned accounts
        steps:
          - Open TL Review.
        expected: All accounts pushed by rn.ao1 and rn.ao2 are listed in one scrollable view with status Review in progress and a row count; no account of Corporate Marketing 2 is listed.
      - c: 2
        type: Workflow
        brd: [BRD 1.008.3, 1.008.3.1-1.008.3.4]
        title: Post routes each account by its disposition
        steps:
          - Select four accounts disposed For Renewal, For Quotation, Not for Renewal and Lost Business; click Post.
        expected: For Renewal is in the Processing Worklist, tab For Processing (Processing notified by RNW_POSTED); For Quotation is For Proposal / New Business Path; Not for Renewal is Letter pending; Lost Business is Closed.
      - c: 2
        type: Workflow
        brd: [BRD 1.008.3, 1.008.3.1-1.008.3.4]
        title: Post with "all except"
        steps:
          - Select all, untick one; Post.
        expected: All but the unticked account are posted; the unticked one stays Review in progress.
      - c: 3
        type: Workflow
        brd: [BRD 1.008.2, 1.008.2.1-1.008.2.7]
        title: Return accounts to the AO
        steps:
          - Select two accounts; click Return; reason Incomplete details; remarks "Add the plate number"; push.
        expected: Both are in rn.ao1's list with status Returned, the red flag and the remarks; rn.ao1 receives RNW_RETURNED.
      - c: 3
        type: Negative
        brd: [BRD 1.008.2, 1.008.2.1-1.008.2.7]
        title: Return without a reason
        steps:
          - Select an account; Return; leave Reason blank; push.
        expected: The return is refused.
        msg: ["Select a reason for 'Return'"]
      - c: 4
        type: Negative
        brd: [1.008.1.4]
        title: Post refused with a failing outstanding-premium check
        steps:
          - Select RNW-2026-000203 (outstanding PHP 12,500); Post.
        expected: The post is refused and the check is named.
        msg: ["Renewal {RNW-2026-000203} cannot be posted: {OUTSTANDING_PREMIUM} failed"]

  FR-RN-051:
    scenario: SC-RN-06
    persona: MKT_TL
    screen: TLREVIEW
    data: [TD-RN-04]
    conditions:
      - An account whose invoice family has an open premium above RNW_OUTSTANDING_THRESHOLD shows the Outstanding flag and is Review.
      - The TL overrides the flag on one or several accounts with a reason and remarks; the block clears and the account can be posted.
      - The same controlled override clears a bucket, a system disposition or an insurer mismatch and cancels an RA to unlock an account.
      - An override without remarks or without a reason is refused; overrides are listed in RNW-DECISIONS.
      - Only users with RNW_OVERRIDE see the override.
    cases:
      - c: 1
        type: Boundary
        brd: [BRD 1.011.1, 1.011.1.1]
        title: Balance above the threshold raises the flag
        pre: RNW_OUTSTANDING_THRESHOLD = 0.00; RNW-2026-000203 has PHP 12,500 open; a second account has PHP 0.00 open.
        steps:
          - Filter TL Review on the Outstanding flag.
        expected: RNW-2026-000203 shows the Outstanding flag and is Review; the account with PHP 0.00 has no flag.
      - c: 2
        type: Workflow
        brd: [1.011.1.2, 1.011.1.3]
        title: Override the outstanding balance and post
        steps:
          - Select RNW-2026-000203 and a second flagged account; click Override; kind Outstanding balance; reason; remarks "Payment promised by 30th"; Save.
          - Post RNW-2026-000203.
        expected: The block clears for both accounts; the post succeeds.
      - c: 3
        type: Workflow
        screen: RECORD
        brd: [BRRN.035 negative scenario 2d]
        title: Override an insurer-response mismatch
        pre: An account in WITH_INSURER in Exception because of a policy-number mismatch.
        steps:
          - Open the account; Override; kind Insurer mismatch; reason; remarks; Save.
        expected: The mismatch is cleared by the override and the account progresses on the latest valid response; the override is logged.
      - c: 3
        type: Workflow
        screen: RECORD
        brd: [BRRN.023 AC5, BRRN.031 AC4]
        title: Cancel an RA to unlock an account
        steps:
          - Open an account in RA Generated; Override; kind RA unlock; reason; remarks; Save.
        expected: The RA is cancelled and kept in the history; the account is unlocked for disposition.
      - c: 4
        type: Negative
        brd: [1.011.1.2]
        title: Override without remarks
        steps:
          - Override with a reason and blank remarks.
        expected: Nothing is saved.
        msg: [Enter the remarks of the override]
      - c: 4
        type: Negative
        brd: [1.011.1.2]
        title: Override without a reason
        steps:
          - Override with remarks and no reason.
        expected: Nothing is saved.
        msg: [Select the reason of the override]
      - c: 4
        type: Report-output
        screen: REPORTS
        brd: [BRRN.023 AC5, BRRN.031 AC4]
        title: Overrides in RNW-DECISIONS
        steps:
          - Run RNW-DECISIONS for today.
        expected: Each override of this FR is listed with kind, from, to, reason, remarks, rn.mkttl1 and time.
      - c: 5
        type: Security-access
        persona: MKT_AO
        screen: RECORD
        brd: [BRD 1.011.1]
        title: AO cannot override
        steps:
          - As rn.ao1 open RNW-2026-000203; call POST /api/v1/renewal/candidates/override.
        expected: Override is not shown; the call returns HTTP 403.
        msg: [You are not permitted to perform this action]

  FR-RN-060:
    scenario: SC-RN-07
    persona: PROCESSING_TL
    screen: PROCWL
    data: [TD-RN-06]
    conditions:
      - Processing uploads one or more dispositioned files; valid rows update the accounts (source UPLOAD) and push them to For Processing, and the result lists the errors per row.
      - Rows with errors update nothing and can be downloaded; the upload commits the valid rows.
      - With the complete-file scope ticked, candidates of the range and unit missing from the file are tagged Not for Renewal (Non-renewable Accounts); without it no account is tagged.
      - Files of a wrong type, without a header row, with an invalid disposition or with a locked account are refused with their message.
    cases:
      - c: 1
        type: Upload-download
        brd: [BRRN.018, restating BRD 3.004.1, 3.004.1.1, 3.004.1.2]
        title: 500-row file with 3 unknown references
        steps:
          - Click Upload Dispositioned File; select RN_DISPO_500.xlsx; confirm.
        expected: 497 accounts are updated with source UPLOAD and moved to For Processing; the 3 rows are listed with "renewal reference does not exist"; the uploader receives the job result.
      - c: 1
        type: Upload-download
        persona: PROCESSOR
        brd: [4.004.1, 4.004.1.1, 4.004.1.2, 4.004.2, 4.004.3, 4.004.3.1]
        title: Processing Officer uploads two files at once
        steps:
          - As rn.po1 select RN_DISPO_PARTIAL.xlsx and a second valid file; upload.
        expected: Each file runs as its own job with its own result and confirmation; the accounts are pushed to the processing list.
      - c: 2
        type: Upload-download
        brd: [BRD 3.004.2, 3.004.3, 3.004.3.1]
        title: Download the error rows
        steps:
          - Open the result of TC-RN-060.1-01; click Download errors.
        expected: The file lists the 3 rows with their reason; the disposition history of the 497 accounts shows source UPLOAD next to online dispositions.
      - c: 3
        type: Workflow
        brd: [BRD 3.004.4]
        title: Complete file for March, unit Retail Marketing 1
        steps:
          - Upload RN_DISPO_PARTIAL.xlsx (30 of 40 accounts) with "Complete file for" March 2027 and Retail Marketing 1 ticked.
        expected: The 10 missing accounts are tagged Not for Renewal, reason Non-renewable Accounts, source SYSTEM, and kept out of processing; they can be re-opened (FR-RN-047).
      - c: 3
        type: Negative
        brd: [BRD 3.004.4]
        title: Without the complete-file tick no account is tagged
        steps:
          - Upload the same file again without the tick for another month's set.
        expected: No missing account is tagged.
      - c: 4
        type: Negative
        brd: [BRRN.018]
        title: File without a header row
        steps:
          - Upload RN_DISPO_NOHEADER.csv.
        expected: The file is refused; nothing is updated.
        msg: [The file has no header row]
      - c: 4
        type: Negative
        brd: [BRRN.018]
        title: Wrong file type
        steps:
          - Upload a .pdf file.
        expected: The file is refused.
        msg: ["Upload an Excel (.xlsx), OpenDocument (.ods), CSV (.csv) or text (.txt) file"]
      - c: 4
        type: Negative
        brd: [BRRN.018]
        title: Invalid disposition and locked account rows
        steps:
          - Upload RN_DISPO_BADCODE.xlsx, then RN_DISPO_LOCKED.xlsx.
        expected: The RENEWLATER row is refused ("Row 2 - disposition RENEWLATER is not valid"); the RA_SENT row is refused; neither account changes.
        msg: ["Row {3}: renewal {RNW-2026-000160} cannot be updated in stage {RA_SENT}"]

  FR-RN-061:
    scenario: SC-RN-07
    persona: PROCESSING_TL
    screen: PROCWL
    data: [TD-RN-01]
    conditions:
      - The Processing TL assigns selected For Processing accounts (single, multiple, all except, all) to a Processing Officer found by name or ID, or to himself; they move to In Processing.
      - The TL re-assigns accounts to another PO.
      - Only Processing Officers and the TL are selectable; an assignment without account or officer is refused.
    cases:
      - c: 1
        type: Workflow
        brd: [BRD 3.005.1, 3.005.1.1, 3.005.1.1.1, 3.005.1.1.2]
        title: Assign accounts to rn.po1
        steps:
          - Tab For Processing; tick three accounts; Assign PO; search "po1"; push.
        expected: The accounts are In Processing with rn.po1 as assignee and appear in rn.po1's In Processing tab; rn.po1 receives RNW_ASSIGNED.
      - c: 1
        type: Workflow
        brd: [3.005.1.2, 3.005.1.2.1, 3.005.1.2.2, 3.005.1.3]
        title: Assign to Me with "all except"
        steps:
          - Select all, untick two; click Assign to Me; push.
        expected: The TL is the assignee of the selected accounts.
      - c: 2
        type: Workflow
        brd: [3.005.1.4, 3.005.1.5, 3.005.1.6]
        title: Re-assign to another officer
        steps:
          - Tick an account of rn.po1; Assign PO; select rn.po2; push.
        expected: The account moves to rn.po2; the history shows from, to, user and time.
      - c: 3
        type: Negative
        title: Officer list and missing officer
        steps:
          - Open Assign PO and search "ao1".
          - Push without selecting an officer.
        expected: No Marketing user is found; the push is refused.
        msg: [Select the Processing Officer]
      - c: 3
        type: Negative
        title: No account selected
        steps:
          - Click Assign PO with nothing ticked.
        expected: Nothing happens except the message.
        msg: [Select at least one account]

  FR-RN-062:
    scenario: SC-RN-07
    persona: PROCESSOR
    screen: PROCWL
    data: [TD-RN-01]
    conditions:
      - The Processing Worklist shows the processing stages in tabs, in one scrollable view with filter and sort on every column and the keyword search.
      - A Processing Officer sees only the accounts assigned to him; the TL sees the unit's.
    cases:
      - c: 1
        type: Positive
        brd: [BRD 3.006.1, 3.006.1.3, 3.006.1.4]
        persona: PROCESSING_TL
        title: TL works the list by tab, filter and sort
        steps:
          - Open each tab For Processing, In Processing, With Insurer, Insurer Responded and Returned.
          - Sort by Expiry Date; filter Insurance Company = INS-A.
        expected: Each tab lists the accounts of its stage; sort and filter work on every column.
      - c: 1
        type: Positive
        brd: [BRD 4.003.1, 4.003.1.3, 4.003.1.4]
        title: Officer sorts and searches his list
        steps:
          - As rn.po1 sort every column and search a reference.
        expected: Sorting and search work; the matched reference is highlighted.
      - c: 2
        type: Security-access
        brd: [BRD 4.003.1]
        title: Officer sees only his own accounts
        steps:
          - As rn.po1 open In Processing and search a reference assigned to rn.po2.
        expected: Only rn.po1's accounts are listed; the rn.po2 reference is not found.

  FR-RN-063:
    scenario: SC-RN-07
    persona: PROCESSOR
    screen: RACC
    data: [TD-RN-02]
    conditions:
      - At For Processing BIBS creates the renewal account (draft, business type RENEWAL) with the client, product, items, insurer, PN, mortgage and contact of the expiring account, the next period and a link to the expiring ARN.
      - Processing edits the renewal account; mandatory fields are prompted and the push is refused while any is missing.
      - The renewal account is rated with purpose RENEWAL on the expiring package version; a product not sellable for renewal is refused.
      - After placement the renewal account cannot be edited.
    cases:
      - c: 1
        type: Positive
        brd: [BRD 3.007.1, 3.007.2]
        title: Renewal account of a Motor policy
        steps:
          - Open a posted For Renewal Motor candidate; section Renewal Account.
        expected: A draft account of business type RENEWAL exists with start date = old end + 1 day, the same term, the same vehicle, insurer, PN and mortgagee, and a link to the expiring ARN.
      - c: 2
        type: Positive
        brd: [BRD 4.005.1, 4.005.2, 4.005.3, 4.005.3.1-4.005.3.4]
        title: Officer updates and saves the renewal account
        steps:
          - Change the sum insured and the contact number; Save.
        expected: The values are saved; the account audit shows before and after values.
      - c: 2
        type: Negative
        brd: [3.007.3, 3.007.3.1-3.007.3.4]
        title: Push with a mandatory field blank
        steps:
          - Clear the chassis number; push.
        expected: The push is refused and the missing fields are listed.
        msg: ["Complete the mandatory fields of {MC01}: {Chassis No.}"]
      - c: 3
        type: Negative
        brd: [3.007.3]
        title: Product no longer sellable for renewal
        pre: The package version of the expiring account is retired (RQ30 open).
        steps:
          - Rate the renewal account.
        expected: Rating is refused and PRODUCT_RENEWABLE is FAIL_REVIEW on the Checks & Bucket tab.
        msg: ["Product {MC01} is {RETIRED} and cannot be sold"]
      - c: 4
        type: Negative
        brd: [BRD 4.005.1]
        title: Edit after placement
        steps:
          - Open a renewal account in For Placement and Booking; try to edit.
        expected: The fields are read only; the save is refused by the account workflow.

  FR-RN-064:
    scenario: SC-RN-07
    persona: PROCESSOR
    screen: COMP
    data: [TD-RN-02, TD-RN-07]
    conditions:
      - The Computations tab shows every calculated field of the renewal account next to the expiring invoice, with the difference.
      - A renewal premium different from the expiring premium beyond the tolerance fails FINANCIAL_IMPACT, routes the account to Review and notifies the stage owner.
      - A renewal within the tolerance passes the check.
    cases:
      - c: 1
        type: Report-output
        brd: [BRD 3.008.1, 3.008.1.1]
        title: Computations next to the expiring invoice
        steps:
          - Open the Computations tab of a renew-as-is account.
        expected: The premium components, taxes, commission and total of the renewal account are shown next to the expiring premium, sum insured, rate, commission and charges with a zero difference; the components equal the account's premium breakdown.
      - c: 2
        type: Negative
        brd: [BRRN.038, BRD 4.006.1, 4.006.1.1]
        title: Different premium fails FINANCIAL_IMPACT
        steps:
          - Raise the rate of the renewal account so the premium rises by PHP 1,000; save; open Computations and Checks & Bucket.
        expected: The difference PHP 1,000 is shown; FINANCIAL_IMPACT is FAIL_REVIEW; the pill is Review; the stage owner is notified.
      - c: 3
        type: Boundary
        persona: SYSADMIN
        screen: PARAMS
        brd: [BRRN.038]
        title: Difference within the tolerance passes
        steps:
          - Set RNW_FIN_IMPACT_TOLERANCE to 1000.00; re-run the check on the same account.
        expected: FINANCIAL_IMPACT is PASS for a difference of PHP 1,000.00; a difference of PHP 1,000.01 fails.

  FR-RN-065:
    scenario: SC-RN-07
    persona: PROCESSOR
    screen: PROCWL
    data: [TD-RN-01]
    conditions:
      - Processing returns selected accounts (single, multiple, all except, all) to the assigned AO (For disposition) or to the Marketing TL (Review in progress) with a reason and remarks; they carry the Returned flag.
      - A return without a reason or remarks is refused.
    cases:
      - c: 1
        type: Workflow
        persona: PROCESSING_TL
        brd: [BRD 3.008.2, 3.008.2.1-3.008.2.7]
        title: Return to the AO
        steps:
          - Select two accounts; Return to Marketing; Return to Account Officer; reason; remarks; push.
        expected: Both are in rn.ao1's Returned to me filter with the red flag; rn.ao1 receives RNW_RETURNED.
      - c: 1
        type: Workflow
        brd: [BRD 4.006.2, 4.006.2.1-4.006.2.7]
        title: Officer returns to the Marketing TL
        steps:
          - As rn.po1 select an account; Return to Marketing; Team Leader; reason; remarks; push.
        expected: The account is in TL Review, status Review in progress, with the Returned flag and remarks.
      - c: 2
        type: Negative
        brd: [BRD 4.006.2]
        title: Return without a reason
        steps:
          - Return to Marketing with Reason blank.
        expected: The return is refused.
        msg: ["Select a reason for 'Return to Marketing'"]
      - c: 2
        type: Negative
        brd: [BRD 3.008.2]
        title: Return without remarks
        steps:
          - Return to Marketing with a reason and blank remarks.
        expected: The return is refused.
        msg: [Enter the remarks]

  FR-RN-070:
    scenario: SC-RN-08
    persona: PROCESSING_TL
    screen: BATCHES
    data: [TD-RN-09]
    conditions:
      - A batch for an insurer and expiry range lists every For Renewal account of that insurer with the 28 columns of BRD 3.009.1.4, in one scrollable view.
      - The extract downloads as .xlsx and is saved and printed with preview and settings.
      - Send e-mails the protected file to the insurer's renewal or placement mailbox with the password in a separate e-mail, and the accounts move to With Insurer; a failed send is resent.
      - An account is in one open batch at a time; a batch without accounts, an insurer without e-mail or without selection is refused.
      - After the reply due date the batch raises RNW_INSURER_OVERDUE.
    cases:
      - c: 1
        type: Report-output
        brd: [BRD 3.009.1, 3.009.1.1-3.009.1.4, 3.009.1.4.1-3.009.1.4.28]
        title: Batch for INS-A and March with 28 columns
        steps:
          - Click New Batch; expiry 03/01/2027 to 03/31/2027; insurer INS-A (searched by name).
        expected: Batch RIB-yyyy lists every For Renewal account of INS-A expiring in March with Insurance Company, Invoice No, Assured Name, Risk Code, Inception and Expiry Date, Sum Insured, Premium Amount, Commission Rate, AR Client, Is Mortgaged, Premium Rate, Policy No, Risk Description, Encoder Name (user who booked), Unit Head, Business Origin, Account Type, Region, Area, Branch, Account Officer Name, Remarks, BIPD, Seating Capacity, Auto PA, Sum Insured per cover and Packaged / Non-Packaged.
      - c: 1
        type: Report-output
        persona: PROCESSOR
        brd: [BRD 4.007.1, 4.007.1.1-4.007.1.4, 4.007.1.4.1-4.007.1.4.28]
        title: Processing Officer builds the batch of INS-B
        steps:
          - As rn.po1 build a batch for INS-B and March.
        expected: The 28 columns are shown for the INS-B accounts assigned in scope.
      - c: 2
        type: Upload-download
        brd: [BRD 3.009.2-3.009.5.1]
        title: Download, save and print the extract
        steps:
          - Click Download; save the .xlsx; click Print with preview; A4 landscape.
        expected: The file has the 28 columns and the batch rows; the preview matches the printout; the download is logged.
      - c: 3
        type: Upload-download
        screen: MAILBOX
        brd: [BRD 3.009.2-3.009.5.1, 4.007.2-4.007.5.1]
        title: Send the batch protected
        steps:
          - Click Send on the INS-A batch; open the INS-A test mailbox; open the batch accounts.
        expected: The mailbox holds the extract as a password-protected Excel file with cover e-mail RNW_INSURER_COVER and, separately, the password; the send is logged with recipient, time and file hash; the accounts are With Insurer.
      - c: 3
        type: Workflow
        brd: [4.007.2-4.007.5.1]
        title: Resend after a delivery failure
        pre: The test lead blocks the relay for the first send.
        steps:
          - Send the INS-B batch; restore the relay; click Resend.
        expected: The batch shows the failed send, then Sent after the resend.
      - c: 4
        type: Negative
        brd: [BRD 3.009.1]
        title: Insurer without renewal or placement e-mail
        steps:
          - Build and send a batch for INS-C.
        expected: The send is refused.
        msg: ["{INS-C} has no e-mail address for renewals"]
      - c: 4
        type: Negative
        brd: [BRD 3.009.1]
        title: Range with no For Renewal account
        steps:
          - Build a batch for INS-A and a month without accounts.
        expected: No batch is created.
        msg: ["No For Renewal account of {INS-A} expires in the range"]
      - c: 4
        type: Negative
        brd: [BRD 4.007.1]
        title: Account already in an open batch
        steps:
          - Build a second batch for INS-A and March.
        expected: The accounts of the open batch are not included again.
      - c: 5
        type: Negative
        screen: NOTIF
        brd: [BRD 3.009.2-3.009.5.1]
        title: Overdue reply raises the alert
        pre: The reply due date of the INS-B batch is yesterday.
        steps:
          - Open the bell as rn.proctl.
        expected: Alert RNW_INSURER_OVERDUE names the batch and insurer.

  FR-RN-071:
    scenario: SC-RN-08
    persona: PROCESSING_TL
    screen: BATCHES
    data: [TD-RN-07]
    conditions:
      - A matched Renew As Is moves the account to RA Ready with unchanged premium and terms, without re-keying.
      - Revise returns the account to In Processing and runs the financial-impact check; Reject tags it Not for Renewal or returns it to Marketing.
      - A mismatched, conflicting, unknown or late row never progresses the account; it is Exception until corrected or overridden.
      - The user views the uploaded file and records a single response manually on the Insurer tab; every response is kept (append-only).
    cases:
      - c: 1
        type: Workflow
        brd: [BRD 3.009.6, 3.009.6.1, 3.009.6.2, BRRN.035]
        title: Renew As Is rows advance to RA Ready
        steps:
          - On the INS-A batch click Upload Response; select the TD-RN-07 file; view the rows; confirm.
        expected: The matched Renew As Is accounts are RA Ready with the premium and terms unchanged; the officer receives RNW_INSURER_RESPONDED.
      - c: 2
        type: Workflow
        brd: [BRRN.035]
        title: Revise with a higher premium
        steps:
          - Open the account of the Revise row.
        expected: The account is In Processing; FINANCIAL_IMPACT fails with the difference.
      - c: 2
        type: Workflow
        brd: [BRRN.035]
        title: Reject tags the account Not for Renewal
        steps:
          - Open the account of the Reject row.
        expected: The account is Not for Renewal with reason insurer declined (Letter pending), or back For disposition when BDOI chooses re-marketing (RQ15).
      - c: 3
        type: Negative
        brd: [BRRN.035]
        title: Policy number mismatch
        steps:
          - Open the result line whose policy number differs from the candidate.
        expected: The row is not applied; the account stays With Insurer in Exception.
        msg: ["Row {7}: {RNW-2026-000171} does not match policy {MC01-2026-00455}"]
      - c: 3
        type: Negative
        brd: [BRRN.035]
        title: Conflicting and unknown response rows
        steps:
          - Open the result lines of the two conflicting rows and the row with code MAYBE.
        expected: None is applied; the conflicting reference is Exception.
        msg: ["Row {9}: {RNW-2026-000173} has conflicting responses"]
      - c: 3
        type: Negative
        brd: [BRRN.035]
        title: Revise without revised values
        steps:
          - Open the result of the Revise row without values.
        expected: The row is refused.
        msg: ["Row {11}: enter the revised premium, sum insured or rate"]
      - c: 3
        type: Negative
        brd: [BRRN.035]
        title: Late response blocks straight-through
        steps:
          - Open the account of the row received after the reply due date.
        expected: The response is stored as late; the account is Review and does not move to RA Ready automatically.
      - c: 4
        type: Positive
        persona: PROCESSOR
        screen: INSTAB
        brd: [BRD 4.007.6, 4.007.6.1, 4.007.6.2]
        title: Manual Renew As Is on the Insurer tab
        steps:
          - Open a With Insurer account; Insurer tab; Response Renew As Is, insurer reference, received today; Save.
        expected: The account is RA Ready; the Insurer tab lists the response with source manual and the earlier responses.
      - c: 4
        type: Negative
        persona: PROCESSOR
        screen: INSTAB
        brd: [BRD 4.007.6]
        title: Manual Revise without values, and a future date
        steps:
          - Record Revise without premium; then Renew As Is with Received on tomorrow.
        expected: Both are refused; nothing is stored.

  FR-RN-080:
    scenario: SC-RN-09
    persona: MKT_AO
    screen: LETTERS
    data: [TD-RN-14]
    conditions:
      - Authorised users generate First or Second Notice RAs for selected RA Ready accounts (single, multiple, all except, all) from the latest approved template; each gets an RA number and a stored PDF.
      - Generation locks the account on the Marketing side; only an RA cancellation by RNW_OVERRIDE unlocks it.
      - An RA less than RNW_RA_MIN_NOTICE_DAYS before expiry needs the user's confirmation, which is recorded.
      - A second notice is offered only after RNW_RA_SECOND_NOTICE_DAYS without acceptance; a duplicate notice or an open blocking check is refused.
      - The user previews, views, closes and downloads RAs one by one or as a ZIP; a user without RNW_RA_GENERATE cannot generate.
    cases:
      - c: 1
        type: Workflow
        brd: [BRRN.010, 2.009.1-2.009.7.1]
        title: AO generates First Notice RAs for 50 accounts
        steps:
          - Open Letters, tab RA Ready; select 50 accounts; Generate RA; First Notice.
          - Watch the job progress; open tab RA Generated.
        expected: 50 RAs with numbers RA-yyyy are listed with a PDF each; each is stored as document type RENEWAL_ADVICE linked to the renewal account, client and candidate; the job ends within 20 seconds.
      - c: 1
        type: Workflow
        persona: MKT_TL
        brd: [restating BRD 1.010.1-1.010.7]
        title: Marketing TL generates RAs with "all except"
        steps:
          - As rn.mkttl1 select all RA Ready accounts, untick one; Generate RA; First Notice.
        expected: RAs are generated for all but the unticked account.
      - c: 1
        type: Workflow
        persona: PROCESSING_TL
        brd: [3.011.1-3.011.7.1]
        title: Processing TL generates RAs
        steps:
          - As rn.proctl generate First Notice RAs for two accounts.
        expected: Both RAs are generated with the template code and version recorded.
      - c: 1
        type: Workflow
        persona: PROCESSOR
        brd: [4.09.1-4.09.7]
        title: Processing Officer generates an RA
        steps:
          - As rn.po1 generate a First Notice RA for one assigned account.
        expected: The RA is generated and listed.
      - c: 2
        type: Negative
        screen: DISP
        brd: [BRD 2.004.9]
        title: Disposition disabled after the RA
        steps:
          - Open an account of TC-RN-080.1-01; try to change the disposition or edit remarks of the disposition.
        expected: The panel is locked; a padlock is shown; the API call is refused.
        msg: ["Renewal {RNW-2026-000130} is locked since the Renewal Advice was generated"]
      - c: 3
        type: Boundary
        brd: [BRRN.010]
        title: RA 20 days before expiry needs confirmation
        pre: RNW_RA_MIN_NOTICE_DAYS = 30.
        steps:
          - Select an account expiring in 20 days; Generate RA without ticking Confirm late notice.
          - Tick Confirm late notice; generate.
        expected: The first attempt is refused with the message; the second generates the RA and records the confirmation with user and time.
        msg: ["The Renewal Advice is less than {30} days before expiry; confirm to continue"]
      - c: 3
        type: Boundary
        brd: [BRRN.010]
        title: RA exactly 30 days before expiry needs no confirmation
        steps:
          - Generate an RA for an account expiring in 30 days.
        expected: No confirmation is asked.
      - c: 4
        type: Negative
        brd: [BRRN.010]
        title: Second First Notice on the same account
        steps:
          - Select an account in RA Generated; Generate RA; First Notice.
        expected: No RA is generated.
        msg: ["Renewal {RNW-2026-000130} already has a {First Notice} Renewal Advice"]
      - c: 4
        type: Workflow
        brd: [BRRN.010]
        title: Second Notice after 15 days without acceptance
        pre: A First Notice sent 15 days ago without acceptance; RNW_RA_SECOND_NOTICE_DAYS = 15.
        steps:
          - Open the account in RA Sent; Generate RA; Second Notice.
        expected: The Second Notice (template RNW_RA_SECOND) is generated; at 14 days it is not offered.
      - c: 4
        type: Negative
        brd: [BRRN.010]
        title: RA refused while a blocking check fails
        steps:
          - Generate an RA for an RA Ready account whose OUTSTANDING_PREMIUM check fails.
        expected: The RA is not generated.
        msg: ["Renewal {RNW-2026-000203} cannot get a Renewal Advice: {OUTSTANDING_PREMIUM} failed"]
      - c: 5
        type: Upload-download
        brd: [BRRN.010, 2.009.1-2.009.7.1]
        title: Preview, view and download as ZIP
        steps:
          - Preview one RA and close it; select ten RAs; Download ZIP.
        expected: The preview shows policy details, renewal terms, premium and BDOI contacts; the ZIP holds ten PDFs named by RA number.
      - c: 5
        type: Security-access
        persona: CONTACT_CENTER
        brd: [BRRN.010]
        title: User without RNW_RA_GENERATE cannot generate
        steps:
          - As rn.cc look for Generate RA; call POST /api/v1/renewal/letters/ra.
        expected: The action is not shown; the call returns HTTP 403.
        msg: [You are not permitted to perform this action]

  FR-RN-081:
    scenario: SC-RN-09
    persona: MKT_AO
    screen: LETTERS
    data: [TD-RN-10]
    conditions:
      - The user extracts the send details (RNW-RA-DISPATCH) and sends generated RAs in batch; each client receives one protected PDF and a separate password e-mail, and the account is RA Sent / Awaiting Response.
      - Each send shows its status (Queued, Sent, Failed); a failed send raises RNW_LETTER_FAILED and can be resent.
      - A client without e-mail or a recipient outside the recipient policy is refused and the RA stays Generated.
      - Every send, including failures, is logged with recipient, time, subject and attachment hash.
    cases:
      - c: 1
        type: Upload-download
        screen: MAILBOX
        brd: [BRRN.010, 2.009.6, 2.009.7, 2.009.7.1]
        title: Send 50 RAs in batch
        steps:
          - Tab RA Generated; Extract Details; select the 50 RAs of TC-RN-080.1-01; Send in Batch.
          - Open the clients' test mailboxes.
        expected: 50 protected RA e-mails and 50 password e-mails arrive; the accounts show RA Sent / Awaiting Response.
      - c: 1
        type: Report-output
        persona: MKT_TL
        screen: REPORTS
        brd: [restating BRD 1.010.6, 1.010.7]
        title: Extract the details for sending
        steps:
          - As rn.mkttl1 click Extract Details on RA Generated.
        expected: RNW-RA-DISPATCH lists each RA with client, recipient address and status; it exports to Excel.
      - c: 1
        type: Upload-download
        persona: PROCESSING_TL
        brd: [3.011.6, 3.011.7, 3.011.7.1]
        title: Processing TL sends RAs
        steps:
          - As rn.proctl send two generated RAs.
        expected: Both are Sent; the password goes in a separate e-mail.
      - c: 1
        type: Upload-download
        persona: PROCESSOR
        brd: [4.09.6, 4.09.7]
        title: Processing Officer sends an RA
        steps:
          - As rn.po1 send one generated RA.
        expected: The RA is Sent and the account RA Sent / Awaiting Response.
      - c: 2
        type: Workflow
        screen: NOTIF
        brd: [BRRN.010]
        title: Failed send and resend
        pre: The relay rejects the first attempt for one recipient.
        steps:
          - Send in Batch; open the bell; restore the relay; Resend the failed RA.
        expected: The RA shows Failed with the error and alert RNW_LETTER_FAILED; after the resend it is Sent.
      - c: 3
        type: Negative
        brd: [BRRN.010]
        title: Client without a registered e-mail
        steps:
          - Send the RA of the client without e-mail of TD-RN-10.
        expected: The RA stays Generated with the reason.
        msg: ["Client {Pacific Test Trading} has no registered e-mail address"]
      - c: 3
        type: Negative
        brd: [BRRN.010]
        title: Recipient outside the approved domains
        pre: The recipient policy with approved domains is loaded (RQ16).
        steps:
          - Send the RA of the client on a domain outside the policy.
        expected: The RA stays Generated.
        msg: ["{client@outside.example} is not an approved recipient domain"]
      - c: 4
        type: Positive
        persona: SYSADMIN
        screen: AUDIT
        brd: [BRRN.010]
        title: Each send is logged
        steps:
          - Open the Audit Trail for the sends of today.
        expected: Each send and failure is listed with recipient, time, subject, attachment hash and status.

  FR-RN-082:
