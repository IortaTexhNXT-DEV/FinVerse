    screen: ACCREQ
    permission: ACCESS_REQUEST (role-permission change request)
    allow: [SYSADMIN]
    deny: [MKT_TL, PROCESSING_TL]
    denied: The request type Modify role permissions is not offered.

findings:
  - fr: FR-RN-001
    issue: 'The FRS gives "Invalid user ID or password" for a wrong log-in. Renewal uses the platform log-in, which shows "Invalid user name or password" and, for a locked account, "Account is locked. Contact your administrator." (AuthService). The FRS gives no text for the lock.'
    proposal: Quote the platform texts in FRS v1.1; the cases use them.
  - fr: FR-RN-002
    issue: 'The FRS no-access text "You do not have access to this page" differs from the platform screen "You do not have access to this screen. Contact your administrator if you need it." (frontend/src/auth/RequireAuth.tsx).'
    proposal: Use the platform wording in FRS v1.1.
  - fr: FR-RN-025
    issue: 'For a wrong file type the FRS gives "The file type is not allowed" (FR-RN-025, 060, 085). The platform shows "Upload an Excel (.xlsx), OpenDocument (.ods), CSV (.csv) or text (.txt) file" for bulk uploads and "Only these file types are allowed - <list>" for attachments.'
    proposal: Quote the platform texts, or state that Renewal replaces them; the cases use the platform texts.
  - fr: FR-RN-080
    issue: Rule R2 and the field rule say "less than 30 days" before expiry; whether exactly 30 days needs a confirmation is not stated. TC-RN-080.3-02 assumes it does not.
    proposal: State the boundary ("fewer than RNW_RA_MIN_NOTICE_DAYS days") in R2 and in the field rule.
  - fr: FR-RN-013
    issue: Rule R1 asks for one scrollable view without pagination, which conflicts with the UX pager rule (UX-6, RQ05 open). Acceptance criterion 1 (20,000 rows without a pager) cannot be signed off until RQ05 is answered.
    proposal: Close RQ05 before UAT; the case TC-RN-013.1-01 follows the FRS.
  - fr: FR-RN-101
    issue: Four of the 34 summary counters have no source in the BRD and show 0 with "pending definition" (RQ10), so they cannot be tested against a business rule. The report range check is a report-engine check whose message today reads "<to> must not be before <from>", not "The end date must be on or after the start date".
    proposal: Define counters 5, 8, 14 and "to Other Bank" under RQ10; align the range message with the report engine or state that Renewal reports use their own check.
  - fr: FR-RN-071
    issue: The outcome of a Reject is "Not for Renewal (insurer declined) or back to Marketing to re-market"; the FRS does not say which, or who decides (RQ15). A late response is defined only as "after the reply due date" with no cut-off time.
    proposal: Answer RQ15 and name the rule or parameter that chooses the Reject path and the late cut-off.
  - fr: FR-RN-083
    issue: '"Not yet submitted" is defined only in the description (no disposition, or For Renewal without RA acceptance); a candidate For Quotation on the NB path, or Not for Renewal awaiting its NFR, is not covered (RQ18).'
    proposal: List the stages that count as "submitted" so the NRNS checkpoint can be tested for every stage.
  - fr: FR-RN-090
    issue: 'The BRD trace lists bare numbers ("BRIDSP-22, 23, 25, 26" in FR-RN-090; "BRRN.001, 010, 025, 037" in FR-RN-103) and prose ("restating BRD ...", "with their sub-IDs"), which appear as IDs in the coverage sheet.'
    proposal: Write every BRD ID in full in the fr blocks (BRIDSP-23, BRRN.010) and keep the "restating" notes out of the brd list, so the coverage sheet lists clean IDs.
  - fr: FR-RN-102
    issue: The escalation rule gives the days per segment but not whether the alert is raised on the first day inside the window (59 or 60 days before expiry). Acceptance criterion 2 uses 59 days with a 60-day setting.
    proposal: State "fewer than RNW_ESCALATION_DAYS days to expiry" or "at most RNW_ESCALATION_DAYS days"; the cases test 59 days (alert) and 61 days (no alert) and leave 60 days to the answer.
