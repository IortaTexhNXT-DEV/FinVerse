  FR-RN-015:
    scenario: SC-RN-02
    persona: MKT_TL
    screen: EXPIRY
    data: [TD-RN-02, TD-RN-03]
    conditions:
      - An extracted candidate stays EXTRACTED and appears in no worklist until it is initiated.
      - Initiation records the user and time and moves the candidate to EVALUATING and on by its bucket and the matrix.
      - Segments in RNW_BULK_INITIATION_SEGMENTS (CLG) are initiated in bulk; a bulk selection refuses the segments initiated one by one.
      - A candidate that is already initiated cannot be initiated again.
    cases:
      - c: 1
        type: Negative
        title: Extracted candidate is in no worklist
        steps:
          - After extraction, open My Dispositions as rn.ao1, TL Review as rn.mkttl1 and the Processing Worklist as rn.proctl.
        expected: The new candidates are not in any of them; the Expiry List shows them with stage Extracted.
      - c: 2
        type: Workflow
        title: Initiate one Non-Mortgage candidate
        steps:
          - Tick one Non-Mortgage candidate; click Initiate; confirm.
        expected: The candidate moves to Evaluating, then to Unassigned Disposition; the History tab shows INITIATED with rn.mkttl1 and the time.
      - c: 3
        type: Workflow
        title: Bulk initiation of 200 CLG candidates
        steps:
          - Filter Market Segment = CLG; select all; Initiate.
        expected: All 200 are initiated; each shows the user and time of initiation.
      - c: 3
        type: Negative
        title: Non-Mortgage candidate in a bulk selection
        steps:
          - Select 20 CLG candidates and one Non-Mortgage candidate; Initiate.
        expected: The 20 CLG candidates are initiated; the Non-Mortgage candidate is listed as refused and stays Extracted.
        msg: ["Segment {Non-Mortgage} is initiated one account at a time"]
      - c: 4
        type: Negative
        screen: API
        title: Initiate an already initiated candidate
        steps:
          - Call POST /api/v1/renewal/candidates/initiate for a candidate in UNASSIGNED.
        expected: The call is refused and the candidate is unchanged.
        msg: ["Renewal {RNW-2026-000105} is already initiated"]

  FR-RN-016:
    scenario: SC-RN-02
    persona: PROCESSING_TL
    screen: HOME
    data: [TD-RN-15]
    conditions:
      - The go-live extraction creates exactly one candidate for every migrated policy expiring from go-live to 31 May 2028, and none for later expiries or for policies already renewed in legacy.
      - Candidates expiring up to 31 January 2028 carry the Urgent flag and are listed first.
      - A tracker row of an RA sent before go-live records the RA as Sent with the legacy date, and the RA cannot be generated or sent again.
      - Rejected tracker rows are applied only after a second member of the Renewal processing team approves the correction.
      - The first daily extraction after go-live does not extract again a policy already taken over.
    cases:
      - c: 1
        type: Positive
        brd: [BRRN.005]
        title: Go-live extraction takes the window up to 31 May 2028
        steps:
          - As rn.proctl run job RNW_GOLIVE_EXTRACTION from Administration > Scheduled Jobs.
          - Open Renewal Home, Extraction runs, and report RNW-GOLIVE.
        expected: One candidate in stage EXTRACTED, source Legacy, per TD-RN-15 policy expiring 3-Jan-2028 to 31-May-2028 (5 candidates); the 1-Jun-2028 policy is not extracted; the policy already renewed in legacy is counted as skipped.
      - c: 1
        type: Negative
        title: A second go-live run creates nothing new
        steps:
          - Run RNW_GOLIVE_EXTRACTION again.
        expected: The run is recorded with zero new candidates; the Expiry List still shows one candidate per policy.
      - c: 2
        type: Boundary
        screen: EXPIRY
        title: Urgent flag up to 31 January 2028
        steps:
          - Open the Expiry List sorted by default.
        expected: The candidates expiring 3-Jan-2028 and 31-Jan-2028 show the Urgent pill and come first; the 1-Feb-2028 candidate has no Urgent pill.
      - c: 3
        type: Upload-download
        persona: PROCESSOR
        screen: PROCWL
        title: Tracker of RAs already sent is recorded
        steps:
          - As rn.po1 upload RN_RA_SENT_JAN.xlsx with template RNW_RA_ALREADY_SENT.
          - Open a 3-Jan-2028 candidate, tab Letters.
        expected: The RA shows status Sent, source legacy, date 15-Dec-2027; Generate RA and Send are not offered for it.
      - c: 3
        type: Negative
        persona: PROCESSOR
        screen: PROCWL
        title: Tracker rows with errors are rejected
        steps:
          - Open the result of the RN_RA_SENT_JAN.xlsx upload.
        expected: "The rows with an unknown reference, a second row for the same policy and an RA date after go-live are rejected with the FRS messages (\"already recorded\", \"enter the date the Renewal Advice was sent (before go-live)\" for the last two); nothing is recorded from them."
        msg: ["Row {n}: no renewal candidate for legacy policy {reference}"]
      - c: 4
        type: Workflow
        persona: PROCESSOR
        screen: PROCWL
        title: Corrected tracker row applied after the checker approves
        steps:
          - As rn.po1 correct the rejected unknown-reference row and submit it.
          - As rn.po2 approve the corrected row.
        expected: The row is applied only after rn.po2 approves; the audit shows rn.po1 as maker and rn.po2 as checker.
      - c: 4
        type: Negative
        persona: PROCESSOR
        screen: PROCWL
        title: The maker cannot approve his own correction
        steps:
          - As rn.po1 try to approve the row he corrected.
        expected: The approval is refused; the row stays rejected.
      - c: 5
        type: Negative
        persona: SYSTEM
        title: Daily extraction skips policies already taken over
        steps:
          - Set the business date to 12-Jan-2028 (the date whose lead days reach 31-May-2028) and run RNW_EXTRACTION.
        expected: The 31-May-2028 policy is counted as existing; no second candidate is created.

  FR-RN-020:
    scenario: SC-RN-03
    persona: MKT_TL
    screen: CHECKS
    data: [TD-RN-04]
    conditions:
      - After extraction and every relevant event BIBS runs every active check and stores a result PASS, WARN, FAIL, INFO or NOT_APPLICABLE with its detail.
      - A check turns PASS at the next event once its condition is resolved, without user action.
      - When the Claims module is not connected the claims check is INFO "claims not connected" and does not block.
