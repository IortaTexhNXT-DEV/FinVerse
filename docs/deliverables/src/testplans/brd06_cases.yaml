  FR-RN-110:
    scenario: SC-RN-12
    persona: BUSINESS_ADMIN
    screen: LOV
    data: [TD-RN-01]
    conditions:
      - The Business Administrator views, adds, edits and end-dates renewal list values with effective dates; a change takes effect on its date after a checker authorises it.
      - Delete end-dates the value; records that used it stay readable.
      - Disposition codes are fixed; only their labels change; lists maintained by the system are refused.
      - An effective-to date before the effective-from date is refused.
    cases:
      - c: 1
        type: Workflow
        brd: [BRD 5.003.1, 5.003.2, 5.003.3]
        title: New non-renewal reason effective next month
        steps:
          - Open RNW_NONRENEWAL_REASON; add "Client relocated abroad" effective 1st of next month; save; rn.checker authorises.
          - As rn.ao1 open the reason list today and on the effective date.
        expected: The value is not offered today and is offered from its effective date.
      - c: 2
        type: Workflow
        brd: [5.003.4, 5.003.5]
        title: End-date a reason used by accounts
        steps:
          - Delete "Unit Sold"; rn.checker authorises; open an account that used it.
        expected: The value is end-dated, not removed; the account still shows Unit Sold.
      - c: 3
        type: Negative
        brd: [BRD 6.002.2.23]
        title: Disposition codes cannot be changed
        steps:
          - Open RNW_DISPOSITION; try to change the code FOR_RENEWAL; change its label to "For renewal (standard)".
        expected: The code is read only; the label change is saved after authorisation.
      - c: 4
        type: Negative
        brd: [BRD 5.003.1]
        title: Effective-to before effective-from
        steps:
          - Add a value with effective to before effective from.
        expected: The value is not saved.
        msg: [The effective-to date is before the effective-from date]

  FR-RN-111:
    scenario: SC-RN-12
    persona: BUSINESS_ADMIN
    screen: TEMPLATES
    data: [TD-RN-14]
    conditions:
      - A new template version is used for every letter generated after its activation; earlier letters keep their version.
      - A template with an unknown field is refused.
    cases:
      - c: 1
        type: Workflow
        brd: [BRD 5.005.1, BRD 6.002.2.25]
        title: New RA template version
        steps:
          - Open RNW_RA_FIRST; save version 2 with the changed footer; activate it.
          - Generate a First Notice RA; open an RA generated before.
        expected: The new RA shows the new footer and template version 2; the earlier RA keeps version 1.
      - c: 2
        type: Negative
        brd: [BRD 5.005.1]
        title: Unknown placeholder in a template
        steps:
          - Add the field {{policy.colour}} to the template; save.
        expected: The version is not saved.
        msg: ["The template uses an unknown field {policy.colour}"]

  FR-RN-112:
    scenario: SC-RN-12
    persona: BUSINESS_ADMIN
    screen: SETUP
    data: [TD-RN-08]
    conditions:
      - Rule sets and matrices are versioned drafts until a checker other than the maker activates them.
      - Parameters (lead days, thresholds, notice days) change through the parameter screen and apply from the next run.
      - A bucket rule that maps a failed check to Clean cannot be saved.
    cases:
      - c: 1
        type: Workflow
        persona: CHECKER
        brd: [BRRN.023, BRRN.034]
        title: Checker compares and activates a bucket rule set
        steps:
          - As rn.badmin draft bucket rule set version 2 (PRODUCT_RENEWABLE as FAIL_EXCEPTION); submit.
          - As rn.checker compare it with version 1 and activate it.
        expected: The differences are shown; version 2 is active from its effective date.
      - c: 1
        type: Security-access
        brd: [BRRN.023]
        title: Maker cannot activate the own rule set
        steps:
          - As rn.badmin activate the rule set rn.badmin drafted.
        expected: The activation is refused.
        msg: [A version is activated by someone other than its maker]
      - c: 2
        type: Positive
        persona: SYSADMIN
        screen: PARAMS
        brd: [BRRN.030]
        title: Lead days 140 to 120 from the next run
        steps:
          - Set RNW_EXTRACTION_LEAD_DAYS to 120; run RNW_EXTRACTION.
        expected: The run extracts policies expiring 120 days after the business date.
      - c: 3
        type: Negative
        brd: [BRRN.023, BRRN.009]
        title: Rule mapping a failed check to Clean
        steps:
          - In a draft rule set map ENDORSEMENT_PENDING FAIL to Clean; save.
        expected: The rule is not saved.
        msg: [A failed check cannot give the Clean bucket]

access:
  - action: Choose the package of a migrated policy (PACKAGE_REMAP)
    screen: RECORD
    permission: RNW_PACKAGE_REMAP
    allow: [PROCESSING_TL, PROCESSOR]
    deny: [MKT_AO, MKT_TL, LAMD]
    denied: The Package panel is read only; POST .../package returns HTTP 403.
  - action: Generate the expiry list and initiate candidates
    screen: EXPIRY
    permission: RNW_EXTRACT
    allow: [MKT_TL, PROCESSING_TL]
    deny: [MKT_AO, PROCESSOR, LAMD]
    denied: Generate Expiry List and Initiate are not shown; the API call returns HTTP 403.
  - action: Assign, re-assign and receive transfers
    screen: EXPIRY
    permission: RNW_ASSIGN
    allow: [MKT_TL]
    deny: [MKT_AO, PROCESSING_TL]
    denied: Assign Disposition, Re-assign Officer and the Incoming decisions are not shown (an AO only requests a transfer).
  - action: Give the disposition and push
    screen: DISP
    permission: RNW_DISPOSE
    allow: [MKT_AO, MKT_TL]
    deny: [PROCESSOR, CONTACT_CENTER, LAMD]
    denied: The Disposition panel is read only; POST .../disposition returns HTTP 403.
  - action: Review, return and post
    screen: TLREVIEW
    permission: RNW_REVIEW
    allow: [MKT_TL]
    deny: [MKT_AO, PROCESSING_TL]
    denied: TL Review is not in the menu; POST .../post returns HTTP 403.
  - action: Controlled overrides (outstanding balance, bucket, disposition, insurer mismatch, RA unlock)
    screen: RECORD
    permission: RNW_OVERRIDE
    allow: [MKT_TL]
    deny: [MKT_AO, PROCESSING_TL, PROCESSOR]
