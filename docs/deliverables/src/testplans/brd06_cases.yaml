      - c: 1
        type: Positive
        brd: [BRRN.003, restating BRD 1.003.3, 1.003.3.1-1.003.3.1.13]
        title: Risk Code "all except" MC01
        steps:
          - Open Filters; for Risk Code choose "all except" and tick MC01; Apply.
        expected: Every expiring account except risk code MC01 is listed; the chip "Risk Code - all except MC01" is shown above the grid.
      - c: 1
        type: Positive
        brd: [1.003.3.1-1.003.3.1.13]
        title: Two Unit Heads selected together
        steps:
          - For Unit Head type part of a name in the drop-down search and tick two Unit Heads; Apply.
        expected: The accounts of both Unit Heads are listed and no others.
      - c: 1
        type: Positive
        persona: PROCESSING_TL
        brd: [3.003.3, 3.003.3.1-3.003.3.13]
        title: Every criterion of the Processing list filters
        steps:
          - As rn.proctl open Filters and, one criterion at a time, select one value of Unit Head, Business Origin, Account Type, Region, Area, Invoicing Branch, Risk Code, Market Segment, Department Name, Account Officer, Bucket, Disposition and Stage; Apply after each.
        expected: For each criterion the list shows only the rows with the selected value; the row count changes accordingly.
      - c: 2
        type: Positive
        title: Filtered list shared by its page address
        steps:
          - Apply Region = NCR and Bucket = Review.
          - Copy the page address and open it in a new tab.
        expected: The new tab shows the same filtered list and chips.
      - c: 2
        type: Positive
        title: Cancel and Clear
        steps:
          - Open Filters, tick a value, click Cancel.
          - Open Filters again and click Clear.
        expected: Cancel closes the panel without change; Clear returns every criterion to All and shows the full list.
      - c: 3
        type: Negative
        title: "'Only' and 'all except' on the same criterion"
        steps:
          - For Account Officer tick rn.ao1 in "only" mode, switch to "all except" and tick rn.ao2; Apply.
        expected: The filter is not applied.
        msg: ["Choose either 'only' or 'all except' for {Account Officer}"]

  FR-RN-013:
    scenario: SC-RN-02
    persona: MKT_TL
