    permission: RNW_INSURER
    allow: [PROCESSING_TL, PROCESSOR]
    deny: [MKT_TL, MKT_AO]
    denied: Insurer Batches is not in the menu; POST /insurer-batches returns HTTP 403.
  - action: Generate and send RAs, NALs and NFRs
    screen: LETTERS
