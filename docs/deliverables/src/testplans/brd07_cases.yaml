      - c: 4
        type: Upload-download
        screen: BULK
        title: Upload of insurer claim numbers
        steps:
          - Upload the insurer claim numbers file of TD-CL-07.
        expected: All 10 rows are validated before the file is applied; each number appears on its claim line.

  FR-CL-022:
    scenario: SC-CL-03
