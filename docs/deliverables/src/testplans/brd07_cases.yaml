        expected: Reopen is not shown.
      - c: 3
        priority: High
        type: Negative
        persona: CLM_TH
        brd: [BRCLM.005]
        title: Reopen without a reason
        steps:
          - Confirm Reopen with the reason blank.
        expected: The claim stays closed.
        msg: ["Select a reason for 'reopen'"]

