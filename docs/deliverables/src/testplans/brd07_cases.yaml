    conditions:
      - A location with at least BCL_PRONE_MIN_CLAIMS claims in BCL_PRONE_YEARS years is flagged claims-prone.
      - The catastrophe filter lists only the claims with that code; the drill-down lists the claims of a location.
      - A period with the end before the start is refused.
    cases:
      - c: 1
        type: Boundary
        title: Three claims in three years
        steps:
          - Run BCL-PRONE-LOCATIONS for the last 3 years.
        expected: L1 (3 claims) is flagged claims-prone; a location with 2 claims is not.
      - c: 2
        type: Report-output
        title: Filter by Flood and drill down
        steps:
          - Filter catastrophe code Flood; open L1.
        expected: Only Flood-tagged claims are counted; the drill-down lists the claim numbers of L1.
      - c: 3
        type: Negative
        title: Period end before start
        steps:
          - Run the report with the period end before its start.
        expected: The report does not run.
        msg: ["{Period to} must not be before {Period from}"]

  FR-CL-064:
    scenario: SC-CL-07
    persona: CLM_RISK
    screen: REPORTS
    data: [TD-CL-03, TD-CL-08]
    conditions:
      - The Claims Data Extract gives one row per claim, insurer line and location, downloadable in Excel or CSV.
      - Users save parameter sets as report variants.
      - A user without BCL_DATA_EXTRACT cannot run the extract.
    cases:
      - c: 1
        priority: High
        type: Report-output
        title: Two insurers and three locations give six rows
        steps:
          - Run BCL-DATA-EXTRACT for a claim with INS-A, INS-B and locations L1, L2, L3; download CSV.
        expected: The claim has 6 rows with every claim field.
      - c: 2
        priority: High
        type: Positive
        title: Save the parameters as a variant
        steps:
          - Save the parameters as "Q1 property"; reopen the report and load the variant.
        expected: The parameters are restored.
      - c: 3
        priority: High
        type: Security-access
        persona: CLM_OFFICER
        title: Officer without BCL_DATA_EXTRACT
        steps:
          - As cl.officer1 look for the extract; call the run endpoint.
        expected: The report is not listed; the call returns HTTP 403.
        msg: [You are not permitted to perform this action]

  FR-CL-065:
    scenario: SC-CL-07
    persona: MKT_AO
    screen: REPORTS
    data: [TD-CL-08]
    conditions:
      - A Marketing AO views the Loss Experience report and the account's loss summary and cannot download.
      - A Marketing TL downloads the report in Excel.
      - Marketing users cannot open a claim record or maintain claims.
    cases:
      - c: 1
        type: Positive
        title: AO views the loss experience of a client
        steps:
          - Run BCL-LOSS-EXPERIENCE for the client; open the account's Claims tab.
        expected: The figures are shown; the loss summary shows claim count, open claims, paid and outstanding.
      - c: 1
        type: Security-access
        title: AO cannot download
        steps:
          - Look for Export; call the export endpoint.
        expected: Export is not shown; the call is refused.
        msg: [You are not permitted to perform this action]
      - c: 2
        type: Upload-download
        persona: MKT_TL
        title: Marketing TL downloads in Excel
        steps:
          - As cl.mkttl export BCL-LOSS-EXPERIENCE to Excel.
        expected: The file is downloaded with the rows of the screen; the export is logged.
      - c: 3
        type: Security-access
        screen: API
        title: AO cannot open a claim record
        steps:
          - Type the address of a claim record; call GET on the claim.
        expected: The no-access page is shown; the call returns HTTP 403.

  FR-CL-066:
    scenario: SC-CL-07
    persona: CLM_UH
    screen: REPORTS
    data: [TD-CL-03, TD-CL-05]
    conditions:
      - The Insurer Claim Numbers report lists one row per insurer claim number with the BDOI claim, insurer, share, reserve and settled amount.
      - The Claims Activity Log lists status, field, insurer update, location reference and diary changes with user and time.
      - Nothing can be edited from the reports; a period with the end before the start is refused.
    cases:
      - c: 1
        type: Report-output
        brd: [BRCLM.043]
        title: Two numbers under one BDOI claim
        steps:
          - Run BCL-INSURER-CLAIMS for the period.
        expected: C-INSA-9001 and C-INSB-4410 are listed under the same BDOI claim number with insurer, share, reserve and settled amount.
      - c: 2
        type: Report-output
        brd: [BRCLM.041, BRCLM.042, NFR 15.08]
        title: Activity log shows a location reference change
        steps:
          - Run BCL-ACTIVITY-LOG for the week.
        expected: The change of A-LOC-0091 to A-LOC-0105 is listed with the old and new reference, user and time, together with the status changes and insurer updates.
      - c: 3
        type: Negative
        brd: [BRCLM.043]
        title: Period end before start
        steps:
          - Run BCL-ACTIVITY-LOG with the end before the start.
        expected: The report does not run; the report rows offer no edit link.
        msg: ["{Period to} must not be before {Period from}"]

access:
  - action: Look up a cover
    screen: COVER
    permission: BCL_COVER_VIEW
    allow: [CLM_OFFICER, CLM_TL, CLM_TH, CLM_UH, CLM_RISK]
    deny: [MKT_AO, MKT_TL, AUDITOR]
    denied: Cover Lookup is not in the menu; the address shows the no-access page.
  - action: Record a claim, locations, insurer numbers and updates
    screen: NEWCLAIM
    permission: BCL_RECORD
    allow: [CLM_OFFICER, CLM_TL, CLM_TH]
    deny: [CLM_UH, CLM_RISK, MKT_AO]
    denied: Record Claim is not in the menu; the create call returns HTTP 403.
  - action: Generate the claims authorization code
    screen: CLAIM
    permission: BCL_AUTHORIZE
    allow: [CLM_OFFICER, CLM_TL, CLM_TH]
    deny: [CLM_UH, AUDITOR]
    denied: Generate Authorization Code is not shown.
  - action: Change the claim status (within the matrix)
    screen: CLAIM
    permission: BCL_STATUS_UPDATE
    allow: [CLM_OFFICER, CLM_TL, CLM_TH]
    deny: [CLM_UH, CLM_RISK, MKT_TL]
    denied: Change Status is not shown.
  - action: Close a claim permanently
    screen: RESERVE
    permission: BCL_CLOSE
    allow: [CLM_TL, CLM_TH]
    deny: [CLM_OFFICER, CLM_UH]
    denied: Closing settlement types are refused with "You are not permitted to perform this action".
  - action: Reopen a closed claim
    screen: CLAIM
    permission: BCL_REOPEN
    allow: [CLM_TH, CLM_UH]
    deny: [CLM_TL, CLM_OFFICER]
    denied: Reopen is not shown.
  - action: Override the claimant
    screen: DETAILS
    permission: BCL_CLAIMANT_OVERRIDE
    allow: [CLM_TL, CLM_TH]
    deny: [CLM_OFFICER, CLM_UH]
    denied: Override Claimant is not shown.
  - action: Set the settlement type
    screen: RESERVE
    permission: BCL_SETTLEMENT_UPDATE
    allow: [CLM_TL, CLM_TH]
    deny: [CLM_OFFICER]
    denied: Set Settlement is not shown.
  - action: Assign the adjuster
    screen: CLAIM
    permission: BCL_ADJUSTER_ASSIGN
    allow: [CLM_TL, CLM_TH]
    deny: [CLM_OFFICER]
    denied: Assign Adjuster is not shown.
  - action: Override the follow-up date
    screen: CLAIM
    permission: BCL_FOLLOW_UP_OVERRIDE
    allow: [CLM_TL, CLM_TH]
    deny: [CLM_OFFICER]
    denied: Override Follow-up Date is not shown.
  - action: Amend the insurer reserve
    screen: RESERVE
    permission: BCL_RESERVE_AMEND
    allow: [CLM_TL, CLM_TH]
    deny: [CLM_OFFICER, CLM_UH]
    denied: Amend Reserve is not shown.
  - action: Maintain insurer location references
    screen: LOCREF
    permission: BCL_LOCATION_REF_MAINTAIN
    allow: [CLM_OFFICER, CLM_TL]
    deny: [CLM_RISK, MKT_AO]
    denied: Insurer Location References is not in the menu.
  - action: Maintain statuses, settlement types, matrix and Claims lists
    screen: SETUP
    permission: BCL_SETUP
    allow: [CLM_UH]
    deny: [CLM_TH, CLM_TL, SYSADMIN]
    denied: Claims Setup is not in the menu; the Claims lists are read only.
  - action: Run the Claims reports
    screen: REPORTS
    permission: BCL_REPORT_VIEW
    allow: [CLM_OFFICER, CLM_UH, MKT_AO, MKT_TL, AUDITOR]
    deny: [REMITTANCE]
    denied: The category Claims Handling is not listed.
  - action: Download the Claims reports
    screen: REPORTS
    permission: BCL_REPORT_EXPORT
    allow: [CLM_TL, CLM_UH, MKT_TL]
    deny: [MKT_AO, AUDITOR, SYSADMIN]
    denied: Export is not shown; the export call returns HTTP 403.
  - action: Run the Claims Data Extract
    screen: REPORTS
    permission: BCL_DATA_EXTRACT
    allow: [CLM_UH, CLM_RISK]
    deny: [CLM_OFFICER, CLM_TL, MKT_TL]
    denied: BCL-DATA-EXTRACT is not listed.
  - action: Reassign claims between handlers
    screen: WORKLIST
    permission: WORK_ASSIGN
    allow: [CLM_TL, CLM_TH, CLM_UH]
    deny: [CLM_OFFICER]
    denied: Reassign is not shown.
  - action: Open the Claims worklist and claim records
    screen: WORKLIST
    permission: BCL_VIEW
    allow: [CLM_OFFICER, CLM_RISK, AUDITOR, SYSADMIN]
    deny: [MKT_AO, MKT_TL]
    denied: Claims Worklist is not in the menu; a claim address shows the no-access page.

findings:
  - fr: FR-CL-001
    issue: 'The FRS messages "Invalid user ID or password" and "Your account is locked. Contact the System Administrator" differ from the platform log-in ("Invalid user name or password"; "Account is locked. Contact your administrator."). The idle timeout of 15 minutes differs from the BIBS session policy (CLQ24).'
    proposal: Quote the platform texts in FRS v1.1 and close CLQ24; the cases use the platform texts and a 15-minute test setting.
  - fr: FR-CL-024
    issue: 'The FRS pairs EMAIL_ADDRESS_INVALID with "Enter a valid e-mail address"; the platform returns "Invalid e-mail address - <address>" for that code.'
    proposal: Quote the platform text.
  - fr: FR-CL-060
    issue: 'FR-CL-060 to 066 pair INVALID_REPORT_PARAMETERS with FRS texts ("The as-of date cannot be in the future", "The end date must be on or after the start date"). The report engine builds its own texts from the parameter labels, for example "<to> must not be before <from>". The future as-of date check does not exist in the engine today.'
    proposal: Quote the engine texts, and add the as-of date rule to the report definition at build; the range cases use the engine pattern, TC-CL-060.3-01 uses the FRS text.
  - fr: FR-CL-012
    issue: 'Acceptance criterion 3 says a Claims Officer without BCL_STATUS_UPDATE cannot correct the date, but the matrix of section 3.3 grants BCL_STATUS_UPDATE to officers (within the matrix). As written every officer can correct the reported date.'
    proposal: State whether the correction needs its own permission or is limited to TL / TH (CLQ03); the case removes the permission from a test role until then.
  - fr: FR-CL-045
    issue: The persona table gives reopen to the Team Head (CLM_TH) and the matrix gives BCL_REOPEN to TH and UH, while R1 says "TH / UH reopen (to confirm, CLQ06)". Temporarily closed claims keep ageing "to confirm" (R2 of FR-CL-053), so the ageing and outstanding cases depend on CLQ06.
    proposal: Close CLQ06 before UAT.
  - fr: FR-CL-043
    issue: Two settlement types ("Settled - LOA Issued - For Schedule of Repair", "... Vehicle Under Repair") have "Closes the claim" to confirm (CLQ05), so their closure behaviour cannot be tested yet.
    proposal: Answer CLQ05; the cases treat both as not closing.
  - fr: FR-CL-002
    issue: 'The FR is "High (BRD p.21)", a value the test plan builder does not map to High; the Test Conditions sheet shows the Claims conditions of every "High (BRD p.21)" FR as Medium while the cases carry High. The same applies to the other FRs with this priority.'
    proposal: Write the BRD priority as "High" or "Must have" in the fr blocks (keeping the page note in the trace), or extend the builder mapping.
  - fr: FR-CL-016
    issue: The meaning of the claims authorization code and any TL / TH override are open (CLQ01); the FRS tests only that the button is disabled while premium is unpaid.
    proposal: Answer CLQ01 before UAT and add the override case if one is agreed.
