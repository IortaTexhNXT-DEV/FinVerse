# Test plan BRD-7 Claims - test data file.
# Build: python docs/deliverables/src/testplans/build_test_plan.py docs/deliverables/src/testplans/brd07_cases.yaml
# Schema: see the header of build_test_plan.py. FR titles, BRD IDs and priorities come from the FRS.
# Claims is designed and not built: messages are the FRS texts (no codes), screen paths are those of the
# build design (docs/architecture/CLAIMS_BROKING_DESIGN.md) and there is no automation reference. Where a
# check reuses a platform message that exists today (log-in, report parameters, e-mail address), the case
# quotes the text BIBS shows and a finding records the FRS difference.
# The FRS priority "High (BRD p.21)" is set on each case (priority: High); the builder maps only
# "Must have" style values, so the condition sheet shows these conditions as Medium (finding TF-CL-07).

meta:
  brd: BRD-07
  name: Claims
  code: CL
  frs: FRS_BRD07_CLAIMS.md
  summary: TP_BRD07_CLAIMS.md
  version: "1.0"
  date: 25 September 2026
  built: false

personas:
  CLM_OFFICER: {name: Claims Officer / Claims Assistant, short: CLM Off.}
  CLM_TL: {name: Claims Team Lead, short: CLM TL}
  CLM_TH: {name: Claims Team Head, short: CLM TH}
  CLM_UH: {name: Claims Unit Head, short: CLM UH}
  CLM_RISK: {name: Claims / Risk user, short: CLM Risk}
  MKT_AO: {name: Marketing AO, short: MKT AO}
  MKT_TL: {name: Marketing Team Leader, short: MKT TL}
  REMITTANCE: {name: Operations Remittance user (BRD-2), short: Remit.}
  SYSADMIN: {name: System Administrator, short: Sys. Admin}
  AUDITOR: {name: Auditor, short: Audit.}
  SYSTEM: {name: BIBS scheduled job or event}

screens:
  LOGIN: Login page
  HOME: Claims Handling > Claims Home
  WORKLIST: Claims Handling > Claims Worklist
  COVER: Claims Handling > Cover Lookup
  NEWCLAIM: Claims Handling > Record Claim
  CLAIM: Claims Handling > Claims Worklist > Claim record (summary card)
  DETAILS: Claims Handling > Claim record > Details tab
  LOCATIONS: Claims Handling > Claim record > Locations tab
  INSURERS: Claims Handling > Claim record > Insurers & Updates tab
  RESERVE: Claims Handling > Claim record > Reserve & Settlement tab
  DIARY: Claims Handling > Claim record > Diary tab
  DOCS: Claims Handling > Claim record > Documents tab
  HIST: Claims Handling > Claim record > History tab
  LOCREF: Claims Handling > Insurer Location References
  SETUP: Claims Handling > Claims Setup
  LOV: Broking Setup > Lists of Values
  BULK: Broking Setup > Bulk Upload
  REPORTS: Reports > Report Centre (category Claims Handling)
  ACCOUNT: Accounts > Account page > Claims tab (BRD-1)
  INVOICE: Operations > Invoices > Invoice page (BRD-2)
  SPECREM: Operations > Remittance > Special Remittance request (BRD-2)
  CASHIER: Cashiering > Receipts (BRD-2)
  ACCREQ: Broking Setup > Access Requests
  AUDIT: Administration > Audit Trail
  NOTIF: Notifications (bell icon in the page header)
  MAILBOX: Test mailbox of the insurer (SIT mail relay)
  API: API call with the user's token (tester tool, for example Postman)

data:
  - id: TD-CL-01
    name: Test users per Claims role
    content: cl.officer1 (CLM_OFFICER, unit Motor HO), cl.officer2 (CLM_OFFICER, Non-Motor HO), cl.tl1 (CLM_TL), cl.th1 (CLM_TH), cl.uh1 and cl.uh2 (CLM_UH), cl.risk (CLM_RISK), cl.mktao (MKT_AO), cl.mkttl (MKT_TL), cl.remit (Operations remittance), cl.sysadmin (SYSADMIN), cl.auditor (AUDITOR); cl.officer3 (CLM_OFFICER) is not in the claims handler register
    source: Created by the test lead on SIT through approved access requests (BRD-11); grants of FRS section 3.3
  - id: TD-CL-02
    name: Motor cover, premium paid
    content: ARN-2026-000501 Motor own damage and theft, currency PHP, policy year 2026, policy MC-2026-11021 issued, one booked endorsement (version 1), all invoices paid, AO cl.mktao of Retail Marketing 1, branch Makati
    source: Booked and paid through BRD-1 and Cashiering on SIT; masked client
  - id: TD-CL-03
    name: Property cover, three locations, two insurers, unpaid endorsement
    content: ARN-2026-000602 Fire and allied perils, currency USD, locations L1 Makati, L2 Pasig, L3 Cebu; insurers INS-A 60 % and INS-B 40 %; original invoice paid, endorsement invoice PHP 18,400 unpaid; one cancelled unpaid invoice
    source: Booked on SIT with two insurer shares; endorsement invoice left unpaid
  - id: TD-CL-04
    name: Covers for defaults and edge cases
    content: ARN-2026-000703 without currency (defaults to PHP); ARN-2026-000704 direct-payment account (premium paid to the insurer); ARN-2026-000705 policy not yet issued; ARN-2026-000706 with a second endorsement booked after the loss date
    source: Booked on SIT by the test lead
  - id: TD-CL-05
    name: Claims in every phase
    content: "BCL-2026-000101 status 1 (NEW); BCL-2026-000102 status 3 (IN_PROGRESS, 5 days in status 3 then status 8 for 2 days); BCL-2026-000103 status 11 awaiting premium remittance; BCL-2026-000104 status 18 (TEMP_CLOSED); BCL-2026-000105 closed Closed - Denied on 15 March; BCL-2026-000106 settled Settled - Signed Release Papers Returned; claims aged 45, 80 and 95 days for the ageing and past-due cases"
    source: Recorded on SIT by the test lead; reported dates set in the test database for ageing
  - id: TD-CL-06
    name: Lists and matrix
    content: The 18 statuses, 10 settlement types, 25 adjusters, 7 catastrophe codes of the FRS; default status access matrix (TL and TH all statuses; officers statuses 1, 2, 17 and 18); claims handler register (Motor HO, Non-Motor HO, branches)
    source: Delivered list values of FRS section 9.2; register keyed in by cl.uh1
  - id: TD-CL-07
    name: Upload files
    content: "Insurer claim numbers file (10 rows); insurer updates file of 50 rows with one row whose insurer claim number matches no claim; insurer location references file"
    source: Prepared from the bulk templates BCL_INSURER_UPDATE and BCL_LOCATION_REF by the test lead
  - id: TD-CL-08
    name: Loss figures
    content: "Claim with reserve 100,000 and paid 60,000 (O/S 40,000); cover with premium 50,000 and losses 25,000 (loss ratio 50.00 %); location L1 with 3 claims in the last 3 years, one tagged Flood"
    source: Recorded on SIT with reserves and settlements; premiums from the booked invoices
  - id: TD-CL-09
    name: Insurer mailboxes
    content: INS-A claims e-mail cl-ins-a@test.bdoi.local; INS-B without a claims e-mail
    source: Insurer master on SIT; mailboxes of the SIT relay

scenarios:
  - id: SC-CL-01
    persona: SYSADMIN
    title: Access and audit. Claims users log in, see only the Claims actions of their role, and every change on a claim is kept in its history and the audit trail.
    pre: Users of TD-CL-01 are active.
  - id: SC-CL-02
    persona: CLM_OFFICER
    title: Cover and premium. The Claims Officer looks up a cover, records a claim with cover, version, policy number and sales data, and gets the authorization code only when the premium is paid.
    pre: Covers TD-CL-02 to TD-CL-04.
  - id: SC-CL-03
    persona: CLM_OFFICER
    title: Locations and insurers. The officer links several locations and insurers to one claim, records insurer claim numbers and updates, maintains insurer location references and sends the loss advice.
    pre: Cover TD-CL-03; files TD-CL-07; mailboxes TD-CL-09.
  - id: SC-CL-04
    persona: CLM_TL
    title: Claim handling. The Team Lead overrides the claimant, assigns adjusters, amends the reserve and tags catastrophes.
    pre: Open claims of TD-CL-05; lists TD-CL-06.
  - id: SC-CL-05
    persona: CLM_TL
    title: Status, settlement and closure. Handlers change statuses within the matrix, set the settlement, close temporarily or permanently, reopen, and request the special remittance.
    pre: Claims TD-CL-05; matrix TD-CL-06.
  - id: SC-CL-06
    persona: CLM_OFFICER
    title: Follow-up and ageing. BIBS computes follow-up dates and ages; handlers keep the action plan and diary and work the follow-ups due from Claims Home.
    pre: Claims TD-CL-05.
  - id: SC-CL-07
    persona: CLM_UH
    title: Reports and analytics. Claims users and Marketing run the ageing, outstanding, settled, loss, location and register reports and the data extract within their rights.
    pre: Claims TD-CL-05 and loss figures TD-CL-08.
  - id: SC-CL-08
    persona: CLM_UH
    title: Set-up. The Unit Head maintains statuses, settlement types, adjusters, catastrophe codes and the status matrix under maker-checker.
    pre: cl.uh1 and cl.uh2 available.

frs:
  FR-CL-001:
    scenario: SC-CL-01
    persona: CLM_OFFICER
    screen: LOGIN
    data: [TD-CL-01]
    conditions:
      - A user with a Claims role logs in with a masked password and sees the Claims Handling menu section.
      - Wrong credentials are refused with a plain message and counted.
      - After three failed attempts the account is locked until the System Administrator unlocks it.
      - An idle session ends after the configured timeout.
      - Every log-in and failed log-in is recorded with user, time and source address, visible to the System Administrator only.
    cases:
      - c: 1
        type: Positive
        title: Claims Officer logs in and sees Claims Handling
        steps:
          - Open the BIBS URL; enter cl.officer1 and the password (shown masked); Sign in.
          - Open the side menu.
        expected: The section Claims Handling lists Claims Home, Claims Worklist, Cover Lookup, Record Claim, My Diary and Reports.
      - c: 2
        type: Negative
        title: Wrong password
        steps:
          - Enter cl.officer1 and a wrong password; Sign in.
        expected: The Login page stays open and no session starts.
        msg: [Invalid user name or password]
      - c: 3
        type: Boundary
        neg: true
        title: The fourth attempt after three wrong passwords is refused
        steps:
          - Enter cl.officer2 with a wrong password three times, then the correct password.
        expected: The account is locked after the third attempt and the fourth attempt is refused.
        msg: [Account is locked. Contact your administrator.]
      - c: 3
        type: Boundary
        title: Two wrong passwords do not lock
        steps:
          - Enter cl.officer2 (unlocked) with a wrong password twice, then the correct password.
        expected: The log-in succeeds.
      - c: 4
        type: Positive
        screen: WORKLIST
        title: Idle session ends after the timeout
        pre: The session policy idle timeout is set to 15 minutes (CLQ24).
        steps:
          - Log in; leave the worklist idle for 15 minutes; click a claim.
        expected: The session has ended; the Login page opens.
      - c: 5
        type: Security-access
        persona: SYSADMIN
        screen: AUDIT
        title: Log-in audit visible to the System Administrator only
        steps:
          - As cl.sysadmin open the Audit Trail for today and cl.officer2.
          - As cl.tl1 look for the Audit Trail.
        expected: The successful and failed log-ins and the lock are listed with time and source address; cl.tl1 has no Audit Trail in the menu.

  FR-CL-002:
    scenario: SC-CL-01
    persona: CLM_OFFICER
    screen: CLAIM
    data: [TD-CL-01, TD-CL-05]
    conditions:
      - Each Claims action is offered only to the roles holding its permission; a direct call without it is refused (HTTP 403) and logged.
      - Marketing roles get the Claims reports only, never claim maintenance.
      - A claim of another company is answered as not found.
      - Grants change only through an approved User Access request.
    cases:
      - c: 1
        priority: High
        type: Security-access
        brd: [BRCLM.005]
        title: Claims Officer does not see Close
        steps:
          - Open BCL-2026-000102; look for Set Settlement and Close.
          - Call the close endpoint with cl.officer1's token.
        expected: The actions are not shown; the call returns HTTP 403 and is logged with user, endpoint and time.
        msg: [You are not permitted to perform this action]
      - c: 1
        priority: High
        type: Security-access
        neg: false
        persona: CLM_TL
        brd: [BRCLM.006, BRCLM.018, BRCLM.024]
        title: Team Lead sees the TL actions
        steps:
          - As cl.tl1 open BCL-2026-000102.
        expected: Override Claimant, Assign Adjuster, Amend Reserve, Override Follow-up Date, Set Settlement and Change Status are offered.
      - c: 1
        priority: High
        type: Security-access
        brd: [BRCLM.006, BRCLM.011, BRCLM.015, BRCLM.018, BRCLM.019, BRCLM.021, BRCLM.024]
        title: Officer cannot override claimant, amend reserve or override follow-up
        steps:
          - As cl.officer1 call the claimant override, reserve amendment and follow-up override endpoints.
        expected: Each call returns HTTP 403; the claim is unchanged.
        msg: [You are not permitted to perform this action]
      - c: 2
        priority: High
        type: Security-access
        persona: MKT_AO
        screen: REPORTS
        brd: [BRCLM.002]
        title: Marketing AO opens reports, not the worklist
        steps:
          - As cl.mktao open the menu; open Reports, category Claims Handling; type the worklist address.
        expected: The Claims reports are listed; Claims Worklist and Record Claim are not in the menu; the worklist address shows the no-access page.
      - c: 3
        priority: High
        type: Security-access
        screen: API
        brd: [BRCLM.002]
        title: Claim of another company
        steps:
          - Call GET on a claim id of the second test company with cl.officer1's token.
        expected: The call answers not found and reveals no data.
      - c: 4
        priority: High
        type: Workflow
        persona: CLM_UH
        screen: ACCREQ
        brd: [BRCLM.002]
        title: Unit Head requests BCL_DATA_EXTRACT for a user
        steps:
          - As cl.uh1 raise a User Access request adding BCL_DATA_EXTRACT to cl.tl1; cl.sysadmin approves.
        expected: cl.tl1 can run the Claims Data Extract after the approval and not before.

  FR-CL-003:
    scenario: SC-CL-01
    persona: CLM_TL
    screen: HIST
    data: [TD-CL-05]
    conditions:
      - The History tab lists every change on the claim (status, reserve, claimant, adjuster, follow-up, action plan, version, code, insurer updates, location references) with user and time.
      - Each change writes an audit entry with before and after values.
      - History and audit rows cannot be edited or deleted.
    cases:
      - c: 1
        type: Positive
        brd: [BRCLM.041]
        title: History of a closed claim
        steps:
          - Open BCL-2026-000106, History tab.
        expected: Every status change, the settlement and the closure are listed with user and time in time order; insurer updates are part of the timeline.
      - c: 2
        type: Positive
        brd: [BRCLM.042, NFR 4.01-4.03]
        title: Reserve amendment shows old and new amounts
        steps:
          - Amend the reserve of BCL-2026-000102 from 150,000 to 180,000 with a reason; open History; as cl.auditor open the audit entry.
        expected: The history shows 150,000, 180,000, the reason, cl.tl1 and the time; the audit entry has the same before and after values.
      - c: 3
        type: Security-access
        screen: API
        brd: [NFR 4.01-4.03]
        title: History cannot be changed
        steps:
          - Look for edit or delete on the History tab; call PUT and DELETE on a history row.
        expected: No action exists; the calls are refused.

  FR-CL-010:
    scenario: SC-CL-02
    persona: CLM_OFFICER
    screen: COVER
    data: [TD-CL-02, TD-CL-03]
    conditions:
      - A Claims user finds any cover by ARN, policy number or assured and sees its data read-only (account header, items and locations, endorsements, invoices with payment status, claims, insurer location references).
      - The Cover Lookup offers no edit action on the account.
      - A search text shorter than 3 characters, or without a match, is answered with its message.
      - A user without BCL_COVER_VIEW cannot open Cover Lookup.
    cases:
      - c: 1
        priority: High
        type: Positive
        brd: [BRCLM.003]
        title: Find a cover by policy number
        steps:
          - Search by Policy No. MC-2026-11021; open the cover.
        expected: The account header, the endorsement of 2026 and the invoices with their payment status are shown.
      - c: 1
        priority: High
        type: Positive
        brd: [BRCLM.003]
        title: All covers visible regardless of branch
        steps:
          - As cl.officer2 (Non-Motor HO) search the Motor cover ARN-2026-000501.
        expected: The cover opens; no portfolio or branch restriction applies.
      - c: 2
        priority: High
        type: Negative
        brd: [BRCLM.002]
        title: No edit action on the cover
        steps:
          - Open ARN-2026-000602 in Cover Lookup; look for Edit, Endorse or Cancel.
        expected: No edit action is offered; Record Claim is the only action.
      - c: 3
        priority: High
        type: Negative
        brd: [BRCLM.003]
        title: Search text of two characters, and no match
        steps:
          - Search "MC"; then search "ZZZ-NO-MATCH".
        expected: The first is refused with "Enter at least 3 characters"; the second shows the no-match message.
        msg: ["No cover found for {ZZZ-NO-MATCH}"]
      - c: 4
        priority: High
        type: Security-access
        persona: MKT_AO
        brd: [BRCLM.002]
        title: User without BCL_COVER_VIEW
        steps:
          - As cl.mktao type the Cover Lookup address.
        expected: The no-access page is shown and no cover data is loaded.

  FR-CL-011:
    scenario: SC-CL-02
    persona: CLM_OFFICER
    screen: NEWCLAIM
    data: [TD-CL-02, TD-CL-03, TD-CL-04]
    conditions:
      - A claim cannot be saved without cover number, policy year and cover version.
      - The claim currency is the cover currency, else PHP.
      - A saved claim gets a BCL number, phase NEW, the first status and a next follow-up date, and keeps a snapshot of the cover.
      - An insurer-reported claim shows the source "Insurer-reported" and the insurer claim number.
      - Loss date, reported date, nature of loss and a loss date outside the cover period are validated.
    cases:
      - c: 1
        priority: High
        type: Negative
        brd: [BRCLM.003]
        title: Save without a cover
        steps:
          - Open Record Claim; enter the loss details without selecting a cover; Save.
        expected: The claim is not saved.
        msg: [Select the cover of the claim]
      - c: 2
        priority: High
        type: Positive
        brd: [BRCLM.009]
        title: Currency from the cover, else PHP
        steps:
          - Record a claim on ARN-2026-000602 (USD); then on ARN-2026-000703 (no currency).
        expected: The first claim has currency USD, the second PHP.
      - c: 3
        priority: High
        type: Positive
        brd: [BRCLM.003]
        title: Record a Motor claim
        steps:
          - Record a claim on ARN-2026-000501, policy year 2026; loss date yesterday, reported today, nature Motor own damage, claim type, description; Save.
        expected: The claim number BCL-yyyy-nnnnnn is assigned; phase NEW, status 1, next follow-up date = today + 7 days; the summary shows policy number, "Cover v1", period, sum insured, Marketing unit, AO and branch; the handler's My Claims lists it; cl.mktao receives BCL_CLAIM_ASSIGNED.
      - c: 4
        priority: High
        type: Positive
        brd: [BRCLM.041]
        title: Insurer-reported claim
        steps:
          - Record a claim with Source Insurer-reported and INS-A claim number C-INSA-7781.
        expected: The claim shows source "Insurer-reported" and the insurer claim number on the INS-A line.
      - c: 5
        priority: High
        type: Negative
        brd: [BRCLM.003]
        title: Loss date in the future
        steps:
          - Enter tomorrow as loss date; Save.
        expected: The claim is not saved.
        msg: [Enter a loss date that is not in the future]
      - c: 5
        priority: High
        type: Negative
        brd: [BRCLM.003]
        title: Reported date before the loss date
        steps:
          - Enter loss date 10 March and reported date 9 March; Save.
        expected: The claim is not saved.
        msg: [The reported date must be between the loss date and today]
      - c: 5
        priority: High
        type: Negative
        brd: [BRCLM.003]
        title: Nature of loss missing
        steps:
          - Leave Nature of loss blank; Save.
        expected: The claim is not saved.
        msg: [Select the nature of loss]
      - c: 5
        priority: High
        type: Boundary
        brd: [BRCLM.003]
        title: Loss date outside the cover period asks for confirmation
        steps:
          - Enter a loss date one day after the cover end; Save; confirm.
        expected: BIBS warns and saves only after the confirmation.
        msg: ["The loss date is outside the cover period {01-Jan-2026} to {31-Dec-2026}. Confirm to continue"]

  FR-CL-012:
    scenario: SC-CL-02
    persona: CLM_TL
    screen: DETAILS
    data: [TD-CL-05]
    conditions:
      - The reported date is entered at recording and corrected on an open claim only by a BCL_STATUS_UPDATE holder with a reason; the change is in the history.
      - The reported date must be between the loss date and today.
      - A corrected date changes the ages at the next report run.
      - The reported date of a closed claim cannot change.
    cases:
      - c: 1
        priority: High
        type: Workflow
        title: Team Lead corrects the reported date
        steps:
          - Open BCL-2026-000102; Correct Reported Date; new date two days earlier; reason; Save.
        expected: The date is saved; the history shows old and new date, reason, cl.tl1 and time.
      - c: 1
        priority: High
        type: Security-access
        persona: CLM_OFFICER
        title: Officer without BCL_STATUS_UPDATE after recording
        pre: The test lead removes BCL_STATUS_UPDATE from a copy of the officer role.
        steps:
          - As that officer open the claim; look for Correct Reported Date.
        expected: The action is not shown.
      - c: 2
        priority: High
        type: Negative
        title: Reported date later than today
        steps:
          - Correct the reported date to tomorrow.
        expected: The change is refused.
        msg: [The reported date must be between the loss date and today]
      - c: 2
        priority: High
        type: Negative
        title: Correction without a reason
        steps:
          - Correct the date with the reason blank.
        expected: Nothing is saved.
        msg: [Enter the reason for the change]
      - c: 3
        priority: High
        type: Report-output
        screen: REPORTS
        title: Ages follow the corrected date
        steps:
          - Run BCL-AGEING before and after the correction.
        expected: Age overall of the claim is two days higher after the correction.
      - c: 4
        priority: High
        type: Negative
        title: Closed claim
        steps:
          - Correct the reported date of BCL-2026-000105 (closed).
        expected: The change is refused.
        msg: [The reported date of a closed claim cannot change]

  FR-CL-013:
    scenario: SC-CL-02
    persona: CLM_OFFICER
    screen: CLAIM
    data: [TD-CL-02, TD-CL-04]
    conditions:
      - The claim shows the policy number of its policy year without any entry, and the invoice of the cover shows the same number.
      - Claims keeps a copy of the policy number and never edits it.
      - A claim on a policy not yet issued shows "Policy number pending" and is filled when the policy is issued.
    cases:
      - c: 1
        priority: High
        type: Positive
        brd: [BRCLM.007]
        title: Policy number shown without re-keying
        steps:
          - Record a claim on ARN-2026-000501, policy year 2026.
        expected: The summary shows MC-2026-11021; no policy number field was offered for entry.
      - c: 1
        priority: High
        type: Positive
        screen: INVOICE
        brd: [BRCLM.008]
        title: Invoice shows the same policy number
        steps:
          - Open the 2026 invoice of ARN-2026-000501.
        expected: The invoice shows MC-2026-11021.
      - c: 2
        priority: High
        type: Negative
        brd: [BRCLM.007]
        title: Policy number cannot be edited on the claim
        steps:
          - Look for an edit action on the policy number; call the claim update with another policy number.
        expected: The field is read only; the value is not changed.
      - c: 3
        priority: High
        type: Workflow
        brd: [BRCLM.007]
        title: Policy number pending, then filled at issuance
        steps:
          - Record a claim on ARN-2026-000705; issue the policy in BRD-1; reopen the claim.
        expected: The claim first shows "Policy number pending", then the issued number after the snapshot refresh.

  FR-CL-014:
    scenario: SC-CL-02
    persona: CLM_OFFICER
    screen: CLAIM
    data: [TD-CL-02]
    conditions:
      - A new claim shows the Marketing team, AO and branch of the account from the sales stamp at recording.
      - Reports list the stored Marketing Team and Account Officer; Refresh Cover Data reloads changed values and records the change.
    cases:
      - c: 1
        priority: High
        type: Positive
        title: Marketing team, AO and branch on a new claim
        steps:
          - Record a claim on ARN-2026-000501.
        expected: The summary shows Retail Marketing 1, cl.mktao and branch Makati.
      - c: 2
        priority: High
        type: Report-output
        screen: REPORTS
        title: Outstanding report shows team and AO
        steps:
          - Run BCL-OUTSTANDING.
        expected: Each claim shows its Marketing Team and Account Officer.
      - c: 2
        priority: High
        type: Workflow
        title: Refresh after the account's sales stamp changed
        steps:
          - Change the AO of ARN-2026-000501 in BRD-1; click Refresh Cover Data on the claim.
        expected: The new AO is shown; the history records the old and new values.
      - c: 2
        priority: High
        type: Negative
        title: Reports keep the stored values until refresh
        steps:
          - Change the account's AO; run BCL-OUTSTANDING before the refresh.
        expected: The report shows the stored AO, not the new one.

  FR-CL-015:
    scenario: SC-CL-02
    persona: CLM_OFFICER
    screen: CLAIM
    data: [TD-CL-04]
    conditions:
      - The claim shows the cover number and version used, the version being the booked endorsements effective on or before the loss date.
      - A later endorsement of the policy year sets the flag Newer cover version and notifies the handler; the handler may switch to the latest version.
      - The cover panel of the claim has no edit action.
    cases:
      - c: 1
        type: Positive
        brd: [BRCLM.039]
        title: Cover number and version on the claim
        steps:
          - Record a claim on ARN-2026-000706 with a loss date between its first and second endorsement.
        expected: The summary shows "Cover v1 (<first endorsement no.>)".
      - c: 2
        type: Workflow
        brd: [BRCLM.039]
        title: Newer version flag and Use Latest Version
        steps:
          - Book a further endorsement of the policy year; open the claim and the bell; click Use Latest Version.
        expected: The claim shows "Newer cover version" and the handler has BCL_NEWER_COVER_VERSION; after the switch the version is v2 and the history records old and new version.
      - c: 3
        type: Negative
        brd: [BRCLM.003]
        title: No edit action on the cover panel
        steps:
          - Open the cover panel of the claim.
        expected: The panel is read only.

  FR-CL-016:
    scenario: SC-CL-02
    persona: CLM_OFFICER
    screen: CLAIM
    data: [TD-CL-02, TD-CL-03, TD-CL-04]
    conditions:
      - The premium check reads the invoices of the ARN and policy year (cancelled excluded) and shows PAID, UNPAID, PARTIALLY_PAID, DIRECT_PAYMENT or NO_INVOICE with the unpaid invoices.
      - The authorization code is generated only when the result is PAID; otherwise the button is disabled and the claim shows Unpaid premium.
      - A payment re-runs the check, notifies the handler and enables the code.
      - A direct-payment account needs the insurer's payment evidence (BCL_AUTH_DP_POLICY = CONFIRM).
      - The premium check answers within 5 seconds.
    cases:
      - c: 1
        priority: High
        type: Positive
        brd: [BRCLM.001]
        title: Cover with one unpaid endorsement invoice
        steps:
          - Record a claim on ARN-2026-000602.
        expected: The cover card shows UNPAID with the endorsement invoice and its balance PHP 18,400; the claim is saved with the flag Unpaid premium; the handler has alert BCL_UNPAID_PREMIUM_CLAIM.
      - c: 2
        priority: High
        type: Negative
        brd: [BRCLM.001]
        title: Code refused while premium is unpaid
        steps:
          - Look at Generate Authorization Code; call the endpoint.
        expected: The button is disabled; the call is refused.
        msg: ["The premium of {ARN-2026-000602} {2026} is not fully paid. The authorization code cannot be generated"]
      - c: 2
        priority: High
        type: Positive
        brd: [BRCLM.001]
        title: Code on a paid cover
        steps:
          - On a claim of ARN-2026-000501 click Generate Authorization Code.
        expected: A code CAC-yyyy-nnnnnn is issued; the history records user and time.
      - c: 3
        priority: High
        type: Workflow
        persona: SYSTEM
        screen: CASHIER
        brd: [BRCLM.001]
        title: Payment enables the code
        steps:
          - Pay the endorsement invoice of ARN-2026-000602 in Cashiering; open the claim and the handler's bell.
        expected: The result is PAID; the handler is notified; the button is enabled.
      - c: 1
        priority: High
        type: Negative
        brd: [BRCLM.001]
        title: Cancelled unpaid invoice does not block
        pre: Only the cancelled invoice of ARN-2026-000602 is unpaid.
        steps:
          - Open the claim.
        expected: The result is PAID; the cancelled invoice is not listed.
      - c: 4
        priority: High
        type: Negative
        brd: [BRCLM.001]
        title: Direct payment without evidence
        steps:
          - On a claim of ARN-2026-000704 click Generate Authorization Code without an attachment.
        expected: The code is not issued.
        msg: [Attach the insurer's payment evidence first]
      - c: 5
        priority: High
        type: Boundary
        brd: [NFR 15.05]
        title: Premium check within 5 seconds
        steps:
          - Time the cover card from selecting ARN-2026-000602 to the premium result, five times.
        expected: Each answer comes within 5 seconds.

  FR-CL-020:
