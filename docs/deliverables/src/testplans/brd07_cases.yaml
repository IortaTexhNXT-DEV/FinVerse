          - Open the INS-A mailbox.
        expected: The preview (template BCL_LOSS_ADVICE) shows assured, policy, date and location of loss, nature, initial reserve, adjuster and C-INSA-9001; the e-mail arrives; the send log shows recipient, time, subject and attachment name.
      - c: 2
        priority: High
        type: Positive
        screen: DOCS
