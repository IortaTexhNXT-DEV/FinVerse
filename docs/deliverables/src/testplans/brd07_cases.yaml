  FR-CL-021:
    scenario: SC-CL-03
    persona: CLM_OFFICER
    screen: INSURERS
    data: [TD-CL-03, TD-CL-07]
    conditions:
      - A claim holds one insurer line per insurer with share, insurer claim number, date reported, reserve, settled amount and adjuster, proposed from the invoice shares; two insurers show Multi-insurer.
      - The same insurer claim number twice for the same insurer and claim is refused; reuse on another claim warns and raises an alert.
      - A worklist search by an insurer claim number opens the BDOI claim.
      - Insurer claim numbers can be loaded by upload after every row is validated.
    cases:
      - c: 1
        type: Positive
        title: Two insurers, two claim numbers, one claim
        steps:
          - On a claim of ARN-2026-000602 open Insurers & Updates; add C-INSA-9001 on INS-A and C-INSB-4410 on INS-B with the dates reported.
        expected: Shares 60 % and 40 % were proposed; both numbers are shown with the insurer names; the claim stays one claim with the flag Multi-insurer.
      - c: 2
        type: Negative
        title: Same number twice for the same insurer
        steps:
          - Add C-INSA-9001 again on the INS-A line.
        expected: The number is refused.
        msg: ["Insurer claim number {C-INSA-9001} is already recorded for {INS-A} on this claim"]
      - c: 2
        type: Positive
        screen: NOTIF
        title: Number used on another claim warns
        steps:
          - Add C-INSA-9001 on the INS-A line of another claim; confirm.
        expected: BIBS shows the other claim and asks for confirmation; after it the number is saved and alert BCL_INSURER_CLAIM_NO_REUSED is raised.
      - c: 2
