        expected: BIBS asks for the recipient address and refuses the invalid one.
        msg: ["Invalid e-mail address: {claims@}"]
      - c: 3
        priority: High
        type: Negative
        brd: [Process p.24-25]
        title: No insurer selected
        steps:
          - Click Send Loss Advice and confirm with no insurer ticked.
        expected: Nothing is sent.
        msg: [Select at least one insurer]

