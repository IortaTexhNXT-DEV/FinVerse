access:
  - action: Maker actions of the cycle (RA, BOR, franchise, TOR, proposals, comparative, confirmation, placement trigger)
    screen: PROGRAMME
    permission: EB_MARKET
    allow: [EB_AO]
    deny: [EB_TL, EB_PROCESSOR, EB_COLLECTION, AUDITOR]
    denied: The maker buttons are not shown; the calls return HTTP 403.
  - action: Sign off a comparative
    screen: COMPARATIVE
    permission: EB_COMPARATIVE_APPROVE
    allow: [EB_TL]
    deny: [EB_AO, EB_MANAGEMENT]
    denied: Approve and Return are not shown.
  - action: Approve above the value threshold
    screen: APPROVALS
    permission: EB_THRESHOLD_APPROVE
    allow: [EB_MANAGEMENT]
    deny: [EB_TL, EB_AO]
    denied: The item is not offered in My Approvals.
  - action: Validate member changes, policy forms and SOAs
    screen: SOAREG
    permission: EB_PROCESS
    allow: [EB_PROCESSOR, EB_PROC_SUPERVISOR]
    deny: [EB_AO, EB_COLLECTION]
    denied: Validate and Release are not shown.
  - action: Collection view of SOAs and billing
    screen: SOAREG
    permission: EB_COLLECT
    allow: [EB_COLLECTION]
    deny: [EB_TL]
    denied: The Collection acknowledgement is not shown.
  - action: EB set-up (threshold rules, required documents, parameters)
    screen: EBSETUP
    permission: EB_SETUP
    allow: [BUSINESS_ADMIN]
    deny: [EB_AO, EB_TL, EB_MANAGEMENT]
    denied: EB Setup is not in the menu.
  - action: Run EB reports
    screen: REPORTS
    permission: EB_REPORT_VIEW
    allow: [EB_AO, EB_TL, EB_COLLECTION, AUDITOR]
    deny: [NON_EB_USER, INSURER_USER]
    denied: The Employee Benefits category is not listed; the run call returns HTTP 403.
  - action: Request portal users
    screen: ACCREQ
    permission: PORTAL_USER_REQUEST
    allow: [EB_AO]
    deny: [EB_TL, EB_PROCESSOR]
    denied: User type External is not offered.
  - action: Approve portal user requests
    screen: APPROVALS
    permission: PORTAL_USER_APPROVE
    allow: [BUSINESS_ADMIN]
    deny: [EB_AO, EB_TL]
    denied: The request is not offered for decision.
  - action: Lock and unlock portal users; portal logs
    screen: PORTALUSERS
    permission: PORTAL_ADMIN
    allow: [BUSINESS_ADMIN]
    deny: [EB_AO, EB_COLLECTION]
    denied: Portal Users is not in the menu.
  - action: Assign and reassign EB work
    screen: MEMBERCHG
    permission: WORK_ASSIGN
    allow: [EB_TL, EB_PROC_SUPERVISOR]
    deny: [EB_PROCESSOR, EB_AO]
    denied: Assign and Reassign are not shown.
  - action: Answer requests and franchise in the portal (own insurer only)
    screen: PRFP
    permission: Portal role INSURER_USER
    allow: [INSURER_USER]
    deny: [CLIENT_HR]
    denied: The insurer pages are not offered to a client HR user.
  - action: View the roster and confirm the comparative in the portal (own company only)
    screen: PPROG
    permission: Portal role CLIENT_HR
    allow: [CLIENT_HR]
    deny: [INSURER_USER]
    denied: The client pages are not offered to an insurer user.

findings:
  - fr: FR-EB-012
    issue: 'The FRS texts of the platform attachment codes differ from what BIBS shows - ATTACHMENT_TYPE_NOT_ALLOWED "The file type is not allowed" (built "Only these file types are allowed - <list>"), ATTACHMENT_TOO_LARGE "The file is larger than the allowed size" (built "The file exceeds the maximum size of <n> MB"), ATTACHMENT_INFECTED "The file failed the virus check" (built "The file was rejected by the malware scan - <detail>"). The same applies to FR-EB-002, 023, 030 and 031.'
    proposal: Quote the platform texts in FRS v1.1; the cases use them.
  - fr: FR-EB-020
    issue: 'The FRS gives CLIENT_DUPLICATE "A client with the same identifiers already exists" and CLIENT_NAME_REQUIRED "Enter the client name"; the client service shows "This client already exists - <client>" and "Enter the <field>".'
    proposal: Quote the built texts.
  - fr: FR-EB-004
    issue: 'EMAIL_ADDRESS_INVALID is given as "Enter a valid e-mail address"; the platform returns "Invalid e-mail address - <address>".'
    proposal: Quote the platform text.
  - fr: FR-EB-060
    issue: 'FR-EB-060 and 061 pair INVALID_REPORT_PARAMETERS with "The end date must be on or after the start date"; the report engine builds "<to> must not be before <from>" from the parameter labels.'
    proposal: Quote the engine pattern.
  - fr: FR-EB-010
    issue: 'Acceptance criterion 3 of FR-EB-010 says "The fourth failed sign-in locks the portal user" while rule R3 says lockout after 3 failed sign-ins (PORTAL_MAX_FAILED_LOGINS = 3). The cases lock at the third failure.'
    proposal: Align the acceptance criterion with R3 ("the third failed sign-in locks the portal user, and the fourth is refused").
  - fr: FR-EB-022
    issue: The RA lead time is 135 days (TAT annex) against the BRD example of 180 days (EBQ02), and who sets the renewal flag is open (EBQ03); the RA timing cases depend on both.
    proposal: Answer EBQ02 and EBQ03 before UAT.
  - fr: FR-EB-031
    issue: The BOR is required for new business and remarketing renewals, while the BRD negative scenario says a BOR uploaded for a renewal is invalid (EBQ05). A renewal that stays with the incumbent has no BOR case.
    proposal: Answer EBQ05; add a case for a renewal without remarketing once decided.
  - fr: FR-EB-042
    issue: The threshold values, measure and approver levels are demo values (EBQ11); the FRS does not say whether "meets" means at or above the amount.
    proposal: State "at or above" and give the BDOI values; the cases use the demo values.
  - fr: FR-EB-062
    issue: 'The TAT annex gives ranges ("1-5 working days"); the FRS parameters hold one value, and the start and stop events are open (EBQ21), so a breach cannot be tested except against the upper value.'
    proposal: Confirm that the upper value of each range is the target and name the start and stop events.
