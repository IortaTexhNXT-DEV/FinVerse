        type: Negative
        persona: CSF_SUPERVISOR
        screen: RESEND
        title: Other address that is not an e-mail address
        steps:
          - As sup1 click Resend; enter "client@@test"; enter a reason; confirm.
        expected: The address is refused and nothing is sent.
        msg: [Enter a valid e-mail address]
      - c: 5
        type: Negative
        title: Client without a registered e-mail
        pre: UAT CSF Client Two has an RA and no registered e-mail.
        steps:
          - Open the Renewal Advice tab of UAT CSF Client Two; select the RA; click Resend.
        expected: The resend is refused.
        msg: [The client has no registered e-mail. Update the contact details first]
      - c: 6
        type: Negative
        title: Client without RA
        pre: A client of TD-CSF-03 has no RENEWAL_ADVICE document.
        steps:
          - Open the Renewal Advice tab of that client.
        expected: The tab shows the empty state and no Resend button.
        msg: [No items to display]

