  FR-CSF-043:
    scenario: SC-CSF-08
    persona: INFRA
    screen: DB
    conditions:
      - The database log is archived at least every 15 minutes, and a daily base backup runs outside the peak hours.
      - A restore recovers the database to a point less than 15 minutes before the test.
      - Online response times stay within the targets while the log is archived.
      - A failed archive or backup alerts the infrastructure team.
    cases:
      - c: 1
        type: Positive
        title: Archive interval and base backup schedule
        steps:
          - Read the database setting archive_timeout and the backup schedule.
          - List the archived log segments of the last two hours.
        expected: archive_timeout is 15 minutes or less; at least one segment is archived in every 15-minute window; the daily base backup runs outside 10:00-12:00 and 14:00-16:00.
      - c: 2
        type: Positive
        title: Restore to a point less than 15 minutes before the test
        steps:
          - Note the time T; make a contact change on SIT at T minus 20 minutes and another at T minus 5 minutes.
          - Restore the last base backup and the archived log on the restore environment up to the latest point.
          - Check the two contact changes.
        expected: The restored database holds the change made at T minus 20 minutes and is recovered to a point less than 15 minutes before T.
      - c: 3
        type: Positive
        persona: CSF_AGENT
        screen: SEARCH
        title: Response times during archiving
        steps:
          - During an archive cycle run ten searches and open ten Servicing Views.
        expected: Every search and view answers within 3 seconds.
      - c: 4
        type: Negative
        title: Failed archive raises an alert
        steps:
          - Make the archive storage unavailable on the test environment; wait for the next archive attempt.
        expected: The archive fails and the infrastructure team receives the alert; archiving resumes when the storage is back.

access:
  - action: Open the Customer Search and the Servicing View
    screen: SEARCH
    permission: CSF_VIEW
    allow: [CSF_AGENT, CSF_SUPERVISOR, CSF_MANAGEMENT]
    deny: [SYSADMIN, MKT_AO]
    allowed: The Customer Search is the landing page and clients open in the Servicing View.
    denied: Customer Service Facility is not in the menu; /csf shows the no-access page.
  - action: Verify the caller and change contact details
    screen: UPDATE
    permission: CSF_CONTACT_UPDATE
    allow: [CSF_AGENT, CSF_SUPERVISOR]
    deny: [CSF_MANAGEMENT, SYSADMIN]
    denied: Update Contact is not shown; the contact update call returns HTTP 403.
  - action: Resend the RA or e-policy to the registered e-mail
    screen: RESEND
    permission: CSF_RESEND
    allow: [CSF_AGENT, CSF_SUPERVISOR]
    deny: [CSF_MANAGEMENT]
    denied: Resend is not shown; the resend call returns HTTP 403.
  - action: Resend to another address with a reason
    screen: RESEND
    permission: CSF_RESEND_OTHER
    allow: [CSF_SUPERVISOR]
    deny: [CSF_AGENT, CSF_MANAGEMENT]
    allowed: The recipient field is editable and the reason is asked.
    denied: The recipient is read only; a call with another recipient returns HTTP 403.
  - action: Upload documents from the Servicing View
    screen: DOCS
    permission: CSF_DOCUMENT_UPLOAD
    allow: [CSF_AGENT, CSF_SUPERVISOR]
    deny: [CSF_MANAGEMENT]
    denied: Upload is not shown; the upload call returns HTTP 403.
  - action: Open and download documents
    screen: DOCS
    permission: ATTACHMENT_VIEW
    allow: [CSF_AGENT, CSF_SUPERVISOR]
    deny: [CSF_MANAGEMENT]
    denied: Documents cannot be opened or downloaded; the download call returns HTTP 403.
  - action: Run the Contact Changes and Agent Activity reports
    screen: REPORTS
    permission: CSF_REPORT_VIEW
    allow: [CSF_SUPERVISOR, CSF_MANAGEMENT]
    deny: [CSF_AGENT, SYSADMIN]
    denied: The Customer Service category is not listed; the run call returns HTTP 403.
  - action: Run the Audit Trail report (CTL-AUDIT)
    screen: AUDIT
    permission: AUDIT_VIEW
    allow: [CSF_MANAGEMENT, SYSADMIN]
    deny: [CSF_AGENT, CSF_SUPERVISOR]
    denied: Audit Trail is not in the menu; the run call returns HTTP 403.
  - action: Maintain users and roles
    screen: USERS
    permission: USER_MANAGE, ROLE_MANAGE
    allow: [SYSADMIN]
    deny: [CSF_AGENT, CSF_SUPERVISOR, CSF_MANAGEMENT]
    denied: Administration > Users is not in the menu; the call returns HTTP 403.

findings:
  - fr: FR-CSF-001
    issue: The FRS messages "Invalid user ID or password" and "Your account is locked. Contact the System Administrator" differ from the platform log-in that BRD-9 reuses (fit FIT), which shows "Invalid user name or password" and "Account is locked. Contact your administrator." Acceptance criterion 3 repeats FR-CSF-002.
    proposal: Quote the platform texts in FRS v1.1, as FRS BRD-11 FR-UA-001 does; the cases use the platform texts. Keep criterion 3 in FR-CSF-002 only.
  - fr: FR-CSF-010
    issue: 'The response target "within 3 seconds (p.13)" gives no load: number of clients and accounts, concurrent agents. The FRS does not say whether a name search matches the start of the name, any word, or ignores accents and case.'
    proposal: 'State the measurement load (24 concurrent users, the year-5 volume of section 8) and the name-matching rule; the cases time searches in the peak window on SIT data.'
  - fr: FR-CSF-012
    issue: The mapping list CSF_STATUS_MAP has no rule for an account stage that no row matches, or for two rows that match the same account. A cancelled account with premium outstanding could match Booked and Closed.
    proposal: State that the first row by order wins and that an unmatched stage shows a fixed value (for example "Other") with an alert to the list owner.
  - fr: FR-CSF-020
    issue: 'The checks are Yes / No, so a check the agent did not ask cannot be recorded; "Record the result of the verification checks" does not say whether all four or only one must be answered. Whether a verification is also needed before a resend is open (CSQ03), and it is not stated whether a PASSED verification belongs to the agent or to any agent of the client.'
    proposal: Add a value "Not asked", state how many checks must be answered, and tie the verification to the agent and client. The cases assume all four are answered and the verification is per agent.
  - fr: FR-CSF-021
    issue: '"Add" contact details depends on CSQ15 and cannot be tested; "Philippine mobile format" is not defined (09xxxxxxxxx, +639xxxxxxxxx or both); the phone rule "digits and separators" has no length.'
    proposal: Define the accepted mobile and phone formats with examples and remove "add" until CSQ15 is answered; the cases use 12345 as an invalid mobile only.
  - fr: FR-CSF-022
    issue: Acceptance covers only the disabled sync. The sending, the number and interval of retries and the FAILED state cannot be tested until the interface is specified (CSQ01).
    proposal: Give the retry count and interval as parameters; TC-CSF-022.3-01 and 3-02 stay Blocked until a test stub of the interface exists.
  - fr: FR-CSF-030
    issue: The RA password convention (CSQ06) is open, so the cases can check only that the file needs a password and that the password arrives separately, not its value.
    proposal: Add the password rule to FR-CSF-030 when CSQ06 is answered; the cases are then extended with the expected password.
  - fr: FR-CSF-032
    issue: 'The maximum file size (CSQ08) is not given, so the "too large" boundary cannot be set; the 5-second upload target has no file size.'
    proposal: State the size limit and the file size for the 5-second target; until then the test uses the platform limit and a 2 MB file.
  - fr: FR-CSF-033
    issue: The permissions matrix gives CSF_MANAGEMENT the Servicing View (CSF_VIEW) but not ATTACHMENT_VIEW. The FRS does not say whether management sees the Documents, Renewal Advice and E-policies tabs as a list without download, or not at all.
    proposal: State the behaviour for management in section 3.3; the access checks assume the lists are shown and opening a document is refused.
  - fr: FR-CSF-043
    issue: The requirement is an infrastructure control and has no screen; the BRD's 4-hour RPO and backup (retention table) conflict with the 15-minute backup (CSQ11).
    proposal: Keep FR-CSF-043 for the infrastructure team's evidence (restore test log) and record the CSQ11 answer; the cases are run by the infrastructure team and witnessed by QA.
