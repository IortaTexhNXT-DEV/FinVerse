  FR-CSF-032:
    scenario: SC-CSF-06
    persona: CSF_AGENT
    screen: DOCS
    data: [TD-CSF-02, TD-CSF-07]
    conditions:
      - The agent uploads a document to the client or one of its accounts with a document type; BIBS stores it, confirms and lists it on the Documents tab.
      - Every file type of the BRD list is accepted, including the seven types added to the platform list.
      - A file type that is not allowed, or content that does not match the extension, is refused and nothing is stored.
      - An empty file, a file above the size limit and a missing file are refused.
      - An upload completes within 5 seconds and is logged with target, file name, size and hash.
      - A user without CSF_DOCUMENT_UPLOAD cannot upload.
    cases:
      - c: 1
        type: Upload-download
        title: Upload a HEIF photo to an account
        steps:
          - Click Upload; Attach to the CBG account; Document type from the list; choose the HEIF photo; confirm.
        expected: BIBS confirms the upload; the photo is listed on the Documents tab under the account with its type, name and date.
      - c: 1
        type: Upload-download
        title: Upload a PDF to the client
        steps:
          - Click Upload; Attach to Client; choose a document type and the PDF; confirm.
        expected: The PDF is stored and listed under the client.
      - c: 2
        type: Upload-download
        title: The seven added types are accepted
        steps:
          - Upload one TXT, RTF, GIF, BMP, TIFF and WEBP file and a HEIC photo to the client.
        expected: All seven uploads are stored and listed.
      - c: 2
        type: Upload-download
        title: Office, spreadsheet and image types are accepted
        steps:
          - Upload one DOC, DOCX, XLS, XLSX, ODS, CSV, PNG and JPG file.
        expected: All eight uploads are stored and listed.
      - c: 3
        type: Negative
        title: Executable file refused
        steps:
          - Upload the .exe file.
        expected: The upload is refused and nothing is stored.
        msg: [The file type is not allowed]
      - c: 3
        type: Negative
        title: Renamed executable with a .pdf extension refused
        steps:
          - Upload the .exe file renamed .pdf.
        expected: The upload is refused and nothing is stored.
        msg: [The file content does not match its type]
      - c: 4
        type: Negative
        title: Empty file refused
        steps:
          - Upload the 0-byte PDF.
        expected: The upload is refused.
        msg: [The file is empty]
      - c: 4
        type: Boundary
        neg: true
        title: File above the size limit refused
        steps:
          - Upload the PDF above the platform size limit.
        expected: The upload is refused.
        msg: [The file is larger than the allowed size]
      - c: 4
        type: Negative
        title: Confirm without a file
        steps:
          - Click Upload; select the target and type; confirm without choosing a file.
        expected: The File field is marked.
        msg: [Choose the file to upload]
      - c: 5
        type: Positive
        persona: SYSADMIN
        screen: AUDIT
        title: Upload time and log entry
        steps:
          - Time the HEIF upload of TC-CSF-032.1-01 from confirm to confirmation.
          - Open Administration > Audit Trail for the attachment.
        expected: The upload took less than 5 seconds; the log shows agent1, the target account, file name, size and hash.
      - c: 6
        type: Security-access
        persona: CSF_MANAGEMENT
        title: Management cannot upload
        steps:
          - As mgmt1 open the Documents tab of TD-CSF-02.
          - Call the attachment upload for the client with mgmt1's token.
        expected: No Upload button; the call returns HTTP 403.
        msg: [You are not permitted to perform this action]

