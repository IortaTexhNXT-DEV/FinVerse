    persona: COMPLIANCE_OFFICER
    screen: STR
    data: [TD-SS-09]
    conditions:
      - An extraction for a month includes only the committee-approved STRs of that month not yet extracted, and never an STR without the committee decision.
      - The file is saved and downloadable, the extraction is recorded and appears in the audit trail, and the STRs become EXTRACTED.
      - With nothing to extract no file is created; a period with the end before the start is refused.
      - An STR is extracted once; a re-extraction needs a reason.
    cases:
      - c: 1
        type: Report-output
        title: Extract this month
        steps:
          - Click Extract Approved STRs; period this month; check the list; confirm.
        expected: The list and the file hold the approved STR of this month only; last month's STR and any FOR_APPROVAL STR are not included.
      - c: 2
        type: Upload-download
        screen: AUDIT
        title: File saved, downloadable and audited
        steps:
          - Download the file from the STR screen; open the audit trail.
        expected: The file downloads; the extraction (batch, period, count, file, user, time) is in the audit trail; the STR shows EXTRACTED.
      - c: 3
        type: Negative
        title: Nothing to extract
        steps:
          - Extract for a month without approved STRs.
        expected: No file is created.
        msg: [No committee-approved STR to extract]
      - c: 3
        type: Negative
        title: Period end before start
        steps:
          - Period from 30 to 1 of this month.
        expected: Refused.
        msg: [The end date must be on or after the start date]
      - c: 4
        type: Negative
        title: Re-extraction without reason
        steps:
          - Extract the same month again without a reason.
        expected: The extracted STR is not included; a re-extraction asks for a reason and is recorded as such.

  FR-SS-072:
    scenario: SC-SS-07
    persona: COMPLIANCE_OFFICER
    screen: STR
    data: [TD-SS-09]
    conditions:
      - Recording the AMLC reference and filing date sets the STR FILED and closes the case.
      - The reference is required and unique, and the filing date cannot be before the extraction date.
    cases:
      - c: 1
        type: Workflow
        title: Record the filing
        steps:
          - Open the EXTRACTED STR; Record Filing; reference "UAT-AMLC-0001"; filing date today; save.
        expected: The STR is FILED in the register and the case is CLOSED with action filed.
      - c: 2
        type: Negative
        title: Reference blank
        steps:
          - Record Filing with a date and no reference.
        expected: Not saved.
        msg: [Enter the AMLC reference]
      - c: 2
        type: Negative
        title: Filing date before extraction
        steps:
          - Enter a filing date one day before the extraction date.
        expected: Not saved.
        msg: [The filing date cannot be before the extraction date]
      - c: 2
        type: Negative
        title: Reference used before
        steps:
          - Record Filing on another STR with "UAT-AMLC-0001".
        expected: Refused; the reference is unique.

  FR-SS-080:
    scenario: SC-SS-08
    persona: SCR_INVESTIGATOR
    screen: NOTIF
    data: [TD-SS-06]
    conditions:
      - The assignee of a new case receives a notification and opens the case from it; approvers, returned-case owners and committee members receive their events.
      - The notification log shows recipient, type and time; e-mail follows the user's preferences.
      - A user who is not concerned receives no notification.
    cases:
      - c: 1
        type: Workflow
        title: Assignee opens the case from the notification
        steps:
          - Create a case assigned to investigator; open the bell; click the notification.
        expected: The notification opens the case page.
      - c: 2
        type: Positive
        persona: SYSADMIN
        title: Notification log and e-mail preference
        steps:
          - Set investigator's preference for new cases to e-mail; create a case; open the notification log.
        expected: The log shows recipient, type and time; the e-mail reaches the test mailbox.
      - c: 3
        type: Negative
        title: Other investigator not notified
        steps:
          - As investigator2 open the bell.
        expected: No notification for the case of investigator.

  FR-SS-081:
    scenario: SC-SS-08
    persona: SYSTEM
    screen: NOTIF
    data: [TD-SS-06, TD-SS-07]
    conditions:
      - A case missing its KYC form one day before the SLA ends sends a reminder naming the KYC form to the assignee and the UCC.
      - At most one document reminder per case per day; no reminder when the documents are present.
    cases:
      - c: 1
        type: Positive
        title: Reminder names the missing KYC form
        pre: A case due tomorrow without the KYC form; reminder lead 24 hours.
        steps:
          - Run SCR_SLA_MONITOR; as the assignee and as ucc open the bell.
        expected: Both receive a reminder naming the KYC form.
      - c: 2
        type: Negative
        title: No second reminder the same day
        steps:
          - Run the monitor again the same day.
        expected: No second document reminder.
      - c: 2
        type: Negative
        title: No reminder when the documents are present
        steps:
          - Upload the KYC form; run the monitor the next day.
        expected: No document reminder.

  FR-SS-082:
    scenario: SC-SS-03
    persona: COMPLIANCE_OFFICER
    screen: NOTIF
    data: [TD-SS-04]
    conditions:
      - A run that adds entries notifies the Compliance Officers once with the source, the count and a link to the run.
      - A run that adds no entry sends no notification.
    cases:
      - c: 1
        type: Positive
        title: Run adding 5 entries
        steps:
          - Upload the NLDS_PEP file adding 5 entries; open the bell; click the notification.
        expected: One notification with source NLDS_PEP and 5 entries added; the link opens the run.
      - c: 2
        type: Negative
        title: Run with no new entry
        steps:
          - Upload the same file again.
        expected: No new notification.

  FR-SS-090:
    scenario: SC-SS-08
    persona: COMPLIANCE_OFFICER
    screen: REPORTS
    data: [TD-SS-06]
    conditions:
      - The case status report filtered by marketing unit and case status lists only those cases.
      - Each report exports to CSV, XLSX and PDF with the same rows and prints the parameters, user and time in the header.
      - A user without SCR_REPORT_VIEW cannot run the reports; a date range with the end before the start is refused.
    cases:
      - c: 1
        type: Report-output
        title: Case status report by unit and status
        steps:
          - Run SCR-CASE-STATUS for Corbank and status UNIT_HEAD_APPROVAL.
        expected: Only Corbank cases in UNIT_HEAD_APPROVAL, with stage, assignee, age and SLA state.
      - c: 2
        type: Report-output
        persona: OPS_LEAD
        title: Export in three formats
        steps:
          - Run SCR-SLA-BREACHES for the month; export to CSV, XLSX and PDF.
        expected: The three files hold the same rows; the header shows the parameters, the user and the time.
      - c: 2
        type: Report-output
        title: Sanctioned names, PEP clients and STR register run
        steps:
          - Run SCR-SANCTIONED-NAMES, SCR-PEP-CLIENTS, SCR-HIGH-RISK-CLIENTS and SCR-STR-REGISTER for the month.
        expected: Each report runs with its proposed columns and exports.
      - c: 3
        type: Security-access
        persona: SCR_INVESTIGATOR
        title: Investigator cannot run the reports
        steps:
          - As investigator open Reports; call the run of SCR-CASE-STATUS.
        expected: The Compliance category is not listed; the call returns HTTP 403.
        msg: [You are not permitted to perform this action]
      - c: 3
        type: Negative
        title: Invalid date range
        steps:
          - Run SCR-CASE-STATUS with the end date before the start date.
        expected: Not run.
        msg: [The end date must be on or after the start date]

  FR-SS-091:
    scenario: SC-SS-01
    persona: SYSADMIN
    screen: AUDIT
    data: [TD-SS-06]
    conditions:
      - Every user and system action writes an audit entry in the same transaction, and the timeline, configuration differences and list change records keep before and after values.
      - No screen or service allows an audit row or timeline event to be edited or deleted, including by the System Administrator.
      - A database update of a timeline row is refused.
    cases:
      - c: 1
        type: Positive
        title: Actions of a case in the audit trail
        steps:
          - Filter the audit trail on a case and on a configuration version.
        expected: Each action is listed with user and time; the version shows the before and after values.
      - c: 2
        type: Security-access
        title: No edit or delete of audit rows
        steps:
          - Open an audit row and a timeline event; look for edit and delete; call delete through the API.
        expected: No action offered; the API offers no update or delete and the call is refused.
      - c: 3
        type: Negative
        screen: DB
        title: Database update of a timeline row
        steps:
          - As the database administrator run an UPDATE on a row of the case timeline table.
        expected: The database refuses the update.

  FR-SS-092:
    scenario: SC-SS-08
    persona: AUDITOR
    screen: REPORTS
    data: [TD-SS-06]
    conditions:
      - The audit log report lists screening, configuration, list and case events with date, event, case or entry, from and to values, user and remarks; a disposition filter lists only the events of cases with that disposition.
      - The report exports to PDF and XLSX with the same rows.
      - A user without SCR_AUDIT_VIEW cannot run it; an invalid date range is refused.
    cases:
      - c: 1
        type: Report-output
        title: Filter by disposition
        steps:
          - Run SCR-AUDIT-LOG for the month with disposition False positive.
        expected: Only events of cases with that disposition, with from and to values, user and remarks.
      - c: 2
        type: Report-output
        title: Export to PDF and XLSX
        steps:
          - Export the report to PDF and XLSX.
        expected: Both files hold the same rows.
      - c: 3
        type: Security-access
        persona: UNIT_COMPLIANCE_COORD
        title: UCC cannot run the audit log report
        steps:
          - As ucc call the run of SCR-AUDIT-LOG.
        expected: HTTP 403.
        msg: [You are not permitted to perform this action]
      - c: 3
        type: Negative
        title: Invalid date range
        steps:
          - Run the report with the end date before the start date.
        expected: Not run.
        msg: [The end date must be on or after the start date]

access:
  - action: Open Sanction Screening screens and cases (read)
    screen: CASES
    permission: SCR_VIEW
    allow: [COMPLIANCE_OFFICER, COMPLIANCE_CHECKER, UNIT_COMPLIANCE_COORD, SCR_INVESTIGATOR, SCR_APPROVER, AML_COMMITTEE, OPS_LEAD, AUDITOR, SYSADMIN]
    deny: [MKT_AO]
    denied: Sanction Screening is not in the menu; /screening shows the no-access page.
  - action: Draft and submit configuration versions
    screen: CONFIG
    permission: SCR_CONFIG_MAINTAIN
    allow: [COMPLIANCE_OFFICER]
    deny: [COMPLIANCE_CHECKER, UNIT_COMPLIANCE_COORD, SCR_INVESTIGATOR, SYSADMIN]
    denied: New Draft and Submit for Approval are not shown; the call returns HTTP 403.
  - action: Approve or reject configuration versions
    screen: CONFIG
    permission: SCR_CONFIG_APPROVE
    allow: [COMPLIANCE_CHECKER]
    deny: [COMPLIANCE_OFFICER, SCR_APPROVER]
    denied: Approve and Reject are not shown; the call returns HTTP 403.
  - action: Maintain list entries and upload list files
    screen: WATCHLIST
    permission: SCR_LIST_MAINTAIN
    allow: [COMPLIANCE_OFFICER]
    deny: [COMPLIANCE_CHECKER, SCR_INVESTIGATOR, UNIT_COMPLIANCE_COORD]
    denied: Add Entry and Upload List File are not shown; the call returns HTTP 403.
  - action: Approve or reject list changes
    screen: APPROVALS
    permission: SCR_LIST_APPROVE
    allow: [COMPLIANCE_CHECKER]
    deny: [COMPLIANCE_OFFICER, AUDITOR]
    denied: The list change is not offered in My Approvals; the call returns HTTP 403.
  - action: Work the investigation stage
    screen: REVIEW
    permission: SCR_INVESTIGATE
    allow: [SCR_INVESTIGATOR]
    deny: [UNIT_COMPLIANCE_COORD, COMPLIANCE_OFFICER, SCR_APPROVER]
    denied: The Review tab is read only and Submit is not shown.
  - action: Update a client's risk tag
    screen: CASE
    permission: SCR_RISK_TAG
    allow: [SCR_INVESTIGATOR]
    deny: [UNIT_COMPLIANCE_COORD, COMPLIANCE_OFFICER]
    denied: Update Risk Tag and Mark False Positive are not shown.
  - action: Re-assign cases and approvals
    screen: CASE
    permission: SCR_CASE_ASSIGN
    allow: [COMPLIANCE_OFFICER, UNIT_COMPLIANCE_COORD, SCR_APPROVER]
    deny: [SCR_INVESTIGATOR, AML_COMMITTEE]
    denied: Re-assign is not shown; the call returns HTTP 403.
  - action: Approve or disapprove as Unit Head
    screen: CASE
    permission: SCR_CASE_APPROVE
    allow: [SCR_APPROVER]
    deny: [SCR_INVESTIGATOR, COMPLIANCE_OFFICER]
    denied: Approve and Disapprove are not shown; the call returns HTTP 403.
  - action: Review BU escalations and prepare the STR
    screen: CASE
    permission: SCR_COMPLIANCE_REVIEW
    allow: [COMPLIANCE_OFFICER]
    deny: [UNIT_COMPLIANCE_COORD, SCR_APPROVER, AML_COMMITTEE]
    denied: The outcome list and the STR tab actions are not shown; the call returns HTTP 403.
  - action: Record an AML Committee decision
    screen: DECISIONS
    permission: SCR_COMMITTEE
    allow: [AML_COMMITTEE]
    deny: [COMPLIANCE_OFFICER, SCR_APPROVER, SCR_INVESTIGATOR]
    denied: Record Decision is not shown; the call returns HTTP 403.
  - action: Extract STRs and record the filing reference
    screen: STR
    permission: SCR_STR_EXTRACT
    allow: [COMPLIANCE_OFFICER]
    deny: [UNIT_COMPLIANCE_COORD, AUDITOR]
    denied: Extract Approved STRs and Record Filing are not shown; the call returns HTTP 403.
  - action: Run the compliance reports
    screen: REPORTS
    permission: SCR_REPORT_VIEW
    allow: [COMPLIANCE_OFFICER, COMPLIANCE_CHECKER, UNIT_COMPLIANCE_COORD, OPS_LEAD, AUDITOR]
    deny: [SCR_INVESTIGATOR, SCR_APPROVER, AML_COMMITTEE]
    denied: The Compliance category is not listed; the run call returns HTTP 403.
  - action: Run the screening audit log report
    screen: REPORTS
    permission: SCR_AUDIT_VIEW
    allow: [COMPLIANCE_OFFICER, AUDITOR]
    deny: [UNIT_COMPLIANCE_COORD, OPS_LEAD, SYSADMIN]
    denied: SCR-AUDIT-LOG is not listed; the run call returns HTTP 403.

findings:
  - fr: FR-SS-001
    issue: 'The FRS gives the no-access text as "You do not have access to this page". The platform screen shows "You do not have access to this screen. Contact your administrator if you need it." (frontend/src/auth/RequireAuth.tsx), as found for BRD-3.'
    proposal: Quote the platform text in FRS v1.1; the cases check the no-access page without quoting it.
  - fr: FR-SS-031
    issue: 'Acceptance criterion 1 says "Juan Dela Cruz" matches "Juan de la Cruz" by the phonetic rule, but the normalisation of R4 (case, punctuation, word order) may already give an exact or fuzzy match first. The FRS does not say which algorithm is recorded when several meet their thresholds, or the expected score.'
    proposal: State the order of the algorithms and which one is recorded; give the expected algorithm and a score range for the acceptance example.
  - fr: FR-SS-034
    issue: The FRS says only clients with an active policy need a KYC review or EDD and others get a MONITOR case, but it does not say whether a NAME_MATCH or ACCOUNT_APPLICATION case of a client without an active policy also becomes MONITOR.
    proposal: State the case type per trigger for clients without an active policy; the cases assume only HIGH_RISK, PEP and EDD become MONITOR.
  - fr: FR-SS-043
    issue: The FR names the Investigator as an actor of re-assignment, but the role matrix does not grant SCR_CASE_ASSIGN to the Investigator (SQ13).
    proposal: Align the actor line with the matrix after SQ13; the access checks deny re-assignment to the Investigator.
  - fr: FR-SS-052
    issue: 'The naming example "KYC_REVIEW_ABC Trading_20260512_<type>_1" keeps a space and would keep other characters of the client name that file systems or the AMLC may refuse. The document-type code in the name is not fixed.'
    proposal: State how the client name is cleaned (spaces, punctuation, length) and which document-type value is used; the case checks the example as written.
  - fr: FR-SS-064
    issue: 'The FRS does not say whether MAJORITY means a majority of SCR_COMMITTEE_SIZE or of the members who hold AML_COMMITTEE, or what happens when fewer members than the size hold the role or a member is absent.'
    proposal: Define the quorum and the behaviour with fewer members; the cases use five members.
  - fr: FR-SS-070
    issue: At least one reason code is mandatory on the STR, but the list SCR_STR_REASON is delivered empty until BDOI supplies the AMLC codes (SQ09). An STR cannot be completed in UAT as delivered.
    proposal: Deliver placeholder reason codes for testing or make the field optional until SQ09; the cases use test codes UAT01 and UAT02 added by the test lead.
  - fr: FR-SS-071
    issue: 'Acceptance criterion 1 "the committee-approved STRs of that month" does not say whether the month is the committee decision date, the STR creation date or the date the STR was marked ready.'
    proposal: Name the date the period filters on; the cases assume the committee decision date.
  - fr: FR-SS-018
    issue: The acceptance criterion quotes delivered values (CONCUR, NOT_CONCUR) that are placeholders until BDOI confirms the dispositions (SQ06); the test changes when the list changes.
    proposal: Keep the criterion in terms of "the dispositions whose parent is the stage" and move the values to section 9.2.
  - fr: FR-SS-091
    issue: Acceptance criterion 2 (a database update of a timeline row is refused) needs database access that testers do not have, and the 5-year archive retention may be shorter than AMLA requires (SQ18).
    proposal: Record the database check as evidence from the database administrator; confirm the retention period under SQ18.
