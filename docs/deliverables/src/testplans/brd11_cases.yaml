        msg: [A request is implemented by someone other than its requester]

  FR-UA-050:
    scenario: SC-UA-06
    persona: SYSADMIN
    screen: ROLES
    data: [TD-UA-03]
    conditions:
      - The Requestor, Approver, Second approver and Business Administrator profiles exist with the permissions of the matrix.
      - Roles that held ACCESS_REQUEST before keep their request functions.
      - The Requestor profile holds no approval right.
    cases:
      - c: 1
        type: Positive
        title: Delivered profiles
        steps:
          - Open UAM_REQUESTOR, UAM_APPROVER, UAM_SECOND_APPROVER and BUSINESS_ADMIN.
        expected: Each holds exactly the permissions of FRS section 3.3.
      - c: 2
        type: Positive
        persona: BUSINESS_ADMIN
        screen: NEWREQ
        title: Existing ACCESS_REQUEST holders keep their functions
        steps:
          - As badmin raise a Modify user request.
        expected: The request is created.
      - c: 3
        type: Security-access
        persona: UAM_REQUESTOR
        title: Requestor has no approval right
        steps:
          - As requestor open My Approvals; call the approval of a pending request.
        expected: No access request is offered; the call returns HTTP 403.
        msg: [You are not permitted to perform this action]

  FR-UA-051:
    scenario: SC-UA-06
    persona: SYSADMIN
    screen: MATRIX
    data: [TD-UA-03]
    conditions:
      - A function added to a profile through an implemented request is granted to all members.
      - A profile without UAM_CANCEL does not show Cancel Request, and a direct call is refused.
      - The User Access Matrix shows UAM_ENROLL under area USER_ACCESS, action CREATE; every permission has an area.
    cases:
      - c: 1
        type: Workflow
        persona: BUSINESS_ADMIN
        screen: GP
        title: Add UAM_CANCEL to a profile
        steps:
          - Request UAM_CANCEL for UAT_HIGH; approve; implement; a member opens a pending own request.
        expected: The member now sees Cancel Request.
      - c: 2
        type: Security-access
        persona: UAM_APPROVER
        screen: API
        title: Cancel without UAM_CANCEL
        steps:
          - As uamapprover (no UAM_CANCEL) open an own request; call Cancel.
        expected: Cancel Request is not shown; the call is refused.
        msg: [You are not permitted to perform this action]
      - c: 3
        type: Report-output
        title: Matrix by area and action
        steps:
          - Open the matrix, view By Action, area USER_ACCESS; export to Excel.
        expected: UAM_ENROLL under CREATE; no permission without an area; the Excel file matches the screen.

  FR-UA-052:
    scenario: SC-UA-06
    persona: SYSADMIN
    screen: USERS
    data: [TD-UA-01]
    conditions:
      - The Users screen shows the Windows ID, business unit, user level and status (Active, Disabled, Locked, Online) of each user.
      - An unlock or password reset is a direct action and is listed in the audit log report with the administrator.
      - Direct creation or edit of users and own roles is refused; the screen offers Raise request.
    cases:
      - c: 1
        type: Positive
        title: User list columns
        steps:
          - Open Users; filter by status Locked.
        expected: The locked user is listed with Windows ID, business unit, user level and status Locked.
      - c: 2
        type: Positive
        persona: AUDITOR
        screen: UAREP
        title: Unlock in the audit log
        steps:
          - As admin unlock the locked user; as auditor run the User Access Audit Log.
        expected: The unlock is listed with admin and the time.
      - c: 3
        type: Security-access
        title: Own roles changed directly
        steps:
          - As admin edit the own user and add a role.
        expected: Refused.
        msg: [You cannot change your own roles]
      - c: 3
        type: Negative
        title: New user created directly
        steps:
          - Look for New User on the Users screen.
        expected: New User is replaced by Raise request, which opens New Request.

  FR-UA-060:
    scenario: SC-UA-07
    persona: BUSINESS_ADMIN
    screen: UAREP
    data: [TD-UA-01]
    conditions:
      - The User Access Report shows each user's profiles and who created, modified, deactivated or reactivated them, with the approver and request number, as of a date.
      - The report exports to PDF, XLSX and CSV.
      - An as-of date in the future is refused; a user without UAM_REPORT_VIEW cannot run it.
    cases:
      - c: 1
        type: Report-output
        title: Report as of today
        steps:
          - Run the User Access Report as of today for a013000196.
        expected: The profile, created by the approver of the enrolment with its request number, and the later changes with their approvers.
      - c: 1
        type: Report-output
        title: Report as of last week
        steps:
          - Run it as of a date before the Modify request of TC-UA-012.1-01.
        expected: The user shows the profile held on that date (Marketing Team Lead).
      - c: 2
        type: Report-output
        title: Export in three formats
        steps:
          - Export to PDF, XLSX and CSV.
        expected: The three files hold the same rows.
      - c: 3
        type: Boundary
        neg: true
        title: As-of date tomorrow
        steps:
          - Run as of tomorrow.
        expected: Refused.
        msg: [The as-of date cannot be in the future]
      - c: 3
        type: Security-access
        persona: UAM_REQUESTOR
        title: Requestor cannot run the reports
        steps:
          - As requestor open User Access Reports.
        expected: The screen is not in the menu; the run returns HTTP 403.

  FR-UA-061:
    scenario: SC-UA-07
    persona: BUSINESS_ADMIN
    screen: UAREP
    data: [TD-UA-03]
    conditions:
      - For a profile the report lists each module and task marked With Access or No Access, and the profile's lifecycle dates and actors.
      - An inactive profile is included only when the active flag filter asks for it.
    cases:
      - c: 1
        type: Report-output
        title: Marketing Account Officer profile
        steps:
          - Run the User Group Profile Report for Marketing Account Officer, area Client Management.
        expected: Client Management tasks each marked With Access or No Access; created and modified dates and actors.
      - c: 2
        type: Negative
        title: Inactive profile filtered out
        steps:
          - Run with active flag Active only.
        expected: UAT_INACTIVE is not in the report.

  FR-UA-062:
    scenario: SC-UA-07
    persona: AUDITOR
    screen: UAREP
    data: [TD-UA-03]
    conditions:
      - The list shows every member of a profile with the user who added each member and the date, and who modified it.
      - A user removed from the profile before the as-of date is not listed.
    cases:
      - c: 1
        type: Report-output
        title: Members of Marketing Team Lead
        steps:
          - Run Group Profile Membership for Marketing Team Lead as of today; export to XLSX.
        expected: Every member with user ID, name, added by and date; the file matches the screen.
      - c: 2
        type: Negative
        title: Removed member not listed
        steps:
          - Run as of today after TC-UA-012.1-01.
        expected: The user moved to Processing Team Lead is not listed under Marketing Team Lead.

  FR-UA-063:
    scenario: SC-UA-07
    persona: AUDITOR
    screen: UAREP
    data: [TD-UA-01]
    conditions:
      - A profile change of a user appears as Modify User Group Profile from the old to the new profile with the user who did it and the approver.
      - Log-ins, failed log-ins and log-outs appear when the option is selected, and not otherwise.
      - An end date before the start date is refused.
    cases:
      - c: 1
        type: Report-output
        title: Profile change in the audit log
        steps:
          - Run the User Access Audit Log for the week.
        expected: The change of TC-UA-012.1-01 as Modify User Group Profile, from "Marketing Team Lead" to "Processing Team Lead", done by, approved by and request number.
      - c: 2
        type: Report-output
        title: Log-outs included
        steps:
          - Run with the log-in option ticked.
        expected: Log-ins, failed log-ins and log-outs are listed.
      - c: 2
        type: Negative
        title: Log-outs excluded
        steps:
          - Run with the option unticked.
        expected: No log-in or log-out rows.
      - c: 3
        type: Negative
        title: End date before start date
        steps:
          - Run with the end date before the start date.
        expected: Refused.
        msg: [The end date must be on or after the start date]

  FR-UA-064:
    scenario: SC-UA-07
    persona: SYSTEM
    screen: DB
    data: [TD-UA-01]
    conditions:
      - Each attribute of a modified user has one log row with from and to values and the request number, written with the change.
      - A database update or delete of a log row is refused.
    cases:
      - c: 1
        type: Positive
        persona: AUDITOR
        screen: UAREP
        title: One row per attribute
        steps:
          - Apply a Modify user that changes the e-mail and the branch; run the audit log.
        expected: Two rows, e-mail and branch, each with from, to, request number, done by and approved by.
      - c: 2
        type: Negative
        title: Database update of a log row
        steps:
          - As the database administrator run an UPDATE and a DELETE on a row of the access-change log.
        expected: The database refuses both.

  FR-UA-070:
    scenario: SC-UA-08
    persona: SYSTEM
    screen: NOTIF
    data: [TD-UA-08]
    conditions:
      - A returned request notifies the requester with the remarks; a cancellation notifies the approver.
      - An applied deactivation notifies the affected user by e-mail, whatever the user's preferences.
      - Users who are not concerned receive no notice.
    cases:
      - c: 1
        type: Positive
        persona: UAM_REQUESTOR
        title: Return notice with remarks
        steps:
          - After TC-UA-033.1-01, as requestor open the bell.
        expected: The notice shows the remarks and opens the request.
      - c: 2
        type: Positive
        screen: MAIL
        title: Affected user e-mail on deactivation
        pre: The affected user's preference is in-app only.
        steps:
          - Apply a deactivation; open the user's mailbox.
        expected: The e-mail arrives.
      - c: 3
        type: Negative
        persona: UAM_APPROVER
        title: Not-chosen approver receives nothing
        steps:
          - As uamapprover2 open the bell after a submission to uamapprover.
        expected: No notice.

  FR-UA-071:
    scenario: SC-UA-08
    persona: SYSADMIN
    screen: JOBS
    data: [TD-UA-06, TD-UA-08]
    conditions:
      - A failed UAM_EFFECTIVE_CHANGES run is e-mailed to the recipients with the job, time and error, and raises the in-app alert.
      - An invalid address in JOB_FAILURE_RECIPIENTS is refused; a successful run sends no e-mail.
    cases:
      - c: 1
        type: Negative
        screen: MAIL
        title: Failed run e-mailed
        pre: The test lead makes the job fail (for example by revoking its database grant on the test environment).
        steps:
          - Run UAM_EFFECTIVE_CHANGES; open the recipients' mailbox and the bell.
        expected: The e-mail gives the job, time and error; alert JOB_FAILURE is raised.
      - c: 2
        type: Negative
        screen: PARAMS
        title: Invalid recipient
        steps:
          - Set JOB_FAILURE_RECIPIENTS to "ops@@test".
        expected: Refused.
        msg: ["{ops@@test} is not a valid e-mail address"]
      - c: 2
        type: Positive
        screen: MAIL
        title: Successful run - no e-mail
        steps:
          - Run the job successfully.
        expected: No e-mail.

access:
  - action: Raise user access requests (enrol, modify, deactivate, reactivate)
    screen: NEWREQ
    permission: UAM_ENROLL, UAM_MODIFY, UAM_DEACTIVATE, UAM_REACTIVATE
    allow: [UAM_REQUESTOR]
    deny: [UAM_APPROVER, UAM_SECOND_APPROVER, AUDITOR, MKT_AO]
    denied: New Request is not shown; the call returns HTTP 403.
  - action: Correct a returned request
    screen: REQ
    permission: UAM_CORRECT
    allow: [UAM_REQUESTOR, BUSINESS_ADMIN]
    deny: [UAM_APPROVER, AUDITOR]
    denied: Re-submit is not shown; the call returns HTTP 403.
  - action: Cancel a request
    screen: REQS
    permission: UAM_CANCEL
    allow: [UAM_REQUESTOR, BUSINESS_ADMIN]
    deny: [UAM_APPROVER, AUDITOR]
    denied: Cancel Request is not shown; the call returns HTTP 403.
  - action: View access requests
    screen: REQS
    permission: UAM_VIEW
    allow: [UAM_REQUESTOR, UAM_APPROVER, UAM_SECOND_APPROVER, BUSINESS_ADMIN, SYSADMIN, AUDITOR]
    deny: [MKT_AO]
    denied: User Access is not in the menu; the list call returns HTTP 403.
  - action: Approve, reject or return requests
    screen: APPROVALS
    permission: ACCESS_APPROVE
    allow: [UAM_APPROVER, NB_APPROVER]
    deny: [UAM_REQUESTOR, BUSINESS_ADMIN, AUDITOR]
    denied: The requests are not offered in My Approvals; the call returns HTTP 403.
  - action: Give the second approval
    screen: APPROVALS
    permission: UAM_SECOND_APPROVE
    allow: [UAM_SECOND_APPROVER]
    deny: [UAM_APPROVER, BUSINESS_ADMIN]
    denied: The Second Approval tab is not shown; the call returns HTTP 403.
  - action: Submit group-profile requests
    screen: GP
    permission: UAM_GROUP_REQUEST
    allow: [BUSINESS_ADMIN]
    deny: [UAM_REQUESTOR, UAM_APPROVER, SYSADMIN]
    denied: Group Profile Requests is not in the menu; the call returns HTTP 403.
  - action: Implement approved group-profile requests
    screen: ROLES
    permission: ROLE_MANAGE
    allow: [SYSADMIN]
    deny: [BUSINESS_ADMIN, UAM_APPROVER]
    denied: The For Implementation tab and Implement Request are not shown; the call returns HTTP 403.
  - action: Generate the user access reports
    screen: UAREP
    permission: UAM_REPORT_VIEW
    allow: [UAM_APPROVER, BUSINESS_ADMIN, SYSADMIN, AUDITOR]
    deny: [UAM_REQUESTOR, UAM_SECOND_APPROVER, MKT_AO]
    denied: User Access Reports is not in the menu; the run call returns HTTP 403.
  - action: Unlock users and reset passwords
    screen: USERS
    permission: USER_MANAGE
    allow: [SYSADMIN]
    deny: [BUSINESS_ADMIN, UAM_REQUESTOR]
    denied: Administration > Users is not in the menu; the call returns HTTP 403.

findings:
  - fr: FR-UA-001
    issue: '"Access only from BDO-issued devices" is enforced by the BDO network and endpoint policy, not by BIBS, so it cannot be tested in BIBS.'
    proposal: Move the device condition to the assumptions (A-UA) and ask BDO IT for the evidence; the cases test the profile and lock-out only.
  - fr: FR-UA-003
    issue: The EUA protocol, host and messages are not known (UQ04), so the directory cases need a stub and cannot quote the EUA refusal message.
    proposal: Record the EUA messages in the FRS when BDO supplies the interface; TC-UA-003 cases stay Blocked until the stub of TD-UA-07 exists.
  - fr: FR-UA-005
    issue: 'The weak-password message is a fragment ("must contain upper and lower case letters and a digit and a symbol"); the full text the user sees is not given, and the length rule (at least 10) has no message of its own.'
    proposal: Quote the full message, and state whether a 9-character password gets the same message or a length message.
  - fr: FR-UA-011
    issue: 'The description says "at least 10 alphanumeric characters, format a999999999", but the default USER_ID_PATTERN ^[a-zA-Z][0-9]{9}$ allows exactly 10 (one letter, nine digits). The baseline check "3 to 50 letters, digits, dots, dashes or underscores" also still applies, so two messages can answer the same wrong ID.'
    proposal: State one rule (exactly 10, or 10 or more) and which message wins; the cases assume exactly 10 per the pattern.
  - fr: FR-UA-017
    issue: The FR says the Requestor cancels a SCHEDULED request; the transition table (section 5.1) also lets the approver cancel it (UQ06). The acceptance does not cover the approver.
    proposal: State who may cancel a scheduled request and add an acceptance criterion; the cases test the creator only.
  - fr: FR-UA-019
    issue: The maximum number of rows, line-by-line decisions and mixed actions in one file are open (UQ10), so the size boundary cannot be tested.
    proposal: Set the maximum rows as a parameter with a default; add the boundary case when UQ10 is answered.
  - fr: FR-UA-034
    issue: UAM_WORKING_HOURS has no holiday calendar, so a submission on a public holiday during office hours is not flagged. The FRS does not say whether "outside hours" is judged at submission, at approval or both for a request submitted inside and approved outside hours.
    proposal: Use the BIBS holiday calendar for the out-of-hours flag and state the moments when it is evaluated (the cases assume both).
  - fr: FR-UA-042
    issue: Whether a profile with active members may be deactivated is open (UQ16); the validation "Move the n members before deactivating it" applies only if BDOI says block, so it cannot be tested now.
    proposal: Answer UQ16 and state the rule; the cases test deactivation with members allowed.
  - fr: FR-UA-060
    issue: The meaning of the as-of date (end of day, from the change log) is to be confirmed (UQ11); a change applied by the scheduled job at 00:05 falls on the effective date, not the approval date.
    proposal: Confirm that the as-of view uses the date the change was applied; the cases assume that.
  - fr: FR-UA-004
    issue: The Online status comes from an open session whose last activity is updated at most every 5 minutes. A user who closes the browser without logging out stays Online until the inactivity sign-out (30 minutes); the FRS does not say so.
    proposal: State how long a user can show Online after closing the browser; the case checks Online only while the user is active.
