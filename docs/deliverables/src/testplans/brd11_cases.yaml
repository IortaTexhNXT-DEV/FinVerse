  FR-UA-034:
    scenario: SC-UA-04
    persona: UAM_SECOND_APPROVER
    screen: APPROVALS
    data: [TD-UA-03, TD-UA-06]
    conditions:
      - A request that adds a High or Admin profile needs a second approval and raises an alert.
      - A request submitted or approved outside working hours is flagged and needs a second approval; one inside working hours is not.
      - The second approver differs from the first approver, the requester and the subject user; a second approver can reject or return.
    cases:
      - c: 1
        type: Workflow
        title: Adding the System Administrator profile
        steps:
