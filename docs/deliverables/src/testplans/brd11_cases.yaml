          - As secapprover open tab Second Approval; approve.
        expected: After the first approval the request is PENDING_SECOND with flag PRIVILEGE_INCREASE and alert UAM_PRIVILEGED_CHANGE; after the second approval it is applied.
      - c: 2
        type: Boundary
        neg: true
        title: Submitted at 21:00 on a weekday
        steps:
          - Submit a request at 21:00 (test clock); approve as uamapprover.
        expected: Flag OUTSIDE_HOURS; the request goes to PENDING_SECOND.
      - c: 2
        type: Boundary
        title: Submitted and approved at 17:59
        steps:
