  FR-UA-019:
    scenario: SC-UA-03
    persona: UAM_REQUESTOR
    screen: BULK
    data: [TD-UA-05]
    conditions:
      - A file of three enrolments creates a draft batch of three lines; after approval the three users exist.
      - Every row is validated before the batch is created and rows with errors are reported.
      - A line that fails on application is marked failed with the reason and the others stand.
      - Only XLSX and CSV files are accepted.
    cases:
