  FR-UA-017:
    scenario: SC-UA-03
    persona: UAM_REQUESTOR
    screen: REQS
    data: [TD-UA-02]
    conditions:
      - A pending request cancelled by its creator shows CANCELLED with the reason and leaves the approver's My Approvals; the approver is notified.
      - A scheduled request can be cancelled before its date.
      - An approved and applied request, or a request already decided, cannot be cancelled; a reason is required.
      - Requests can be searched by requester, approver and date range.
    cases:
      - c: 1
        type: Workflow
        title: Cancel a pending request
        steps:
          - Search the pending request; Cancel Request; reason; confirm.
          - As uamapprover open My Approvals and the bell.
        expected: The request is CANCELLED with the reason; it is no longer in My Approvals; uamapprover is notified.
      - c: 2
        type: Workflow
        title: Cancel a scheduled request
        steps:
          - Open the SCHEDULED request of TD-UA-02; Cancel Request; reason; confirm.
          - Run UAM_EFFECTIVE_CHANGES on its date.
        expected: The request is CANCELLED and the change is not applied.
      - c: 3
        type: Negative
        screen: API
        title: Cancel an applied request
        steps:
          - Call Cancel on the APPROVED request.
        expected: Refused.
        msg: ["Request {AR-2026-000005} is already {APPROVED}"]
      - c: 3
        type: Negative
        title: Cancel without reason
        steps:
          - Cancel Request with the reason blank.
        expected: Not cancelled.
        msg: [Enter the reason for the cancellation]
      - c: 4
        type: Positive
        title: Search by approver and date range
        steps:
          - Filter by approver uamapprover and this month.
        expected: Only the requests of this month assigned to uamapprover.

  FR-UA-018:
    scenario: SC-UA-03
    persona: UAM_REQUESTOR
    screen: REQS
    data: [TD-UA-02]
    conditions:
