        type: Upload-download
        title: Three enrolments
        steps:
          - Download the template; attach the three-row file; check the validation report; remarks; Save Draft; choose uamapprover; Submit.
          - As uamapprover approve the batch.
        expected: A draft batch of three lines; after approval the three users a013000201 to a013000203 exist.
      - c: 2
        type: Negative
        title: Row with an existing user ID
        steps:
          - Attach the file with the existing user ID.
        expected: The report lists the row with its error; no batch is created.
        msg: ["Row {2}: User {approver} already exists"]
      - c: 2
        type: Negative
        title: Row with an unknown action
        steps:
          - Attach the file with action "promote".
        expected: The report lists the row; no batch is created.
        msg: ["Row {3}: action {promote} is not valid"]
      - c: 3
        type: Negative
        persona: UAM_APPROVER
        title: One line fails on application
        pre: A batch of three lines is pending; the test lead creates one of the three user IDs directly before the approval.
        steps:
          - Approve the batch; open it.
        expected: Two lines are applied; one line is failed with the reason; the batch shows the counts.
      - c: 4
        type: Negative
        title: PDF file
        steps:
