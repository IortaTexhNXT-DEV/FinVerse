        expected: Refused.
        msg: ["Role {MKT_TL} already exists"]
      - c: 2
        type: Negative
        title: No permission
        steps:
          - Create a request without permissions; submit.
        expected: Refused.
        msg: [Select at least one permission]
      - c: 2
        type: Boundary
        neg: true
        title: Code of 41 characters
        steps:
          - Enter a code of 41 capital letters.
        expected: The code is refused (at most 40 characters).
      - c: 2
        type: Negative
        screen: API
        title: Unknown permission
        steps:
          - Submit a create request with permission UAT_NO_SUCH through the API.
        expected: Refused.
        msg: ["Unknown permission(s): {UAT_NO_SUCH}"]
      - c: 3
        type: Negative
        screen: API
        title: Too many permissions
        steps:
          - Submit a create request with more permissions than one request allows.
        expected: Refused.
