        expected: Refused.
        msg: [The file type is not allowed]

  FR-UA-020:
    scenario: SC-UA-02
    persona: UAM_REQUESTOR
    screen: NEWREQ
    data: [TD-UA-06]
    conditions:
      - A request approved before its effective date is SCHEDULED and applied by the daily job on the date; the requester and the affected user are notified.
      - A blank effective date applies the change on approval.
      - The effective date cannot be in the past.
      - A failed re-check leaves the request SCHEDULED and raises an alert to the System Administrator.
    cases:
      - c: 1
        type: Workflow
        persona: SYSTEM
        screen: JOBS
        title: Approved on the 10th, applied on the 15th
        steps:
          - Submit a deactivation effective the 15th; approve on the 10th (test date).
          - Run UAM_EFFECTIVE_CHANGES with the test date the 15th.
        expected: SCHEDULED after approval; on the 15th APPROVED, the user deactivated, the requester and the user notified.
      - c: 2
        type: Positive
        title: Blank effective date
        steps:
          - Submit a Modify user without an effective date; approve.
        expected: The change applies at the approval.
      - c: 3
        type: Boundary
        neg: true
        title: Effective date yesterday
        steps:
          - Enter yesterday as effective date; submit.
        expected: Refused.
        msg: [The effective date cannot be before today]
      - c: 4
        type: Negative
        persona: SYSADMIN
        screen: NOTIF
        title: Re-check fails on the date
        pre: A scheduled Modify user; the user is deactivated before the date.
        steps:
          - Run the job on the date; as admin open the bell.
        expected: The request stays SCHEDULED; alert UAM_SCHEDULED_APPLY_FAILED is raised.

