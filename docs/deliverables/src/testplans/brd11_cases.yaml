      - c: 3
        type: Security-access
        title: First approver gives the second approval
        pre: A user holding ACCESS_APPROVE and UAM_SECOND_APPROVE made the first approval.
        steps:
          - As that user approve the PENDING_SECOND request.
        expected: Refused.
        msg: [The second approval is given by another approver]
      - c: 3
        type: Workflow
        title: Second approver returns the request
        steps:
          - As secapprover return a PENDING_SECOND request with remarks.
        expected: RETURNED; the requester is notified.

  FR-UA-040:
