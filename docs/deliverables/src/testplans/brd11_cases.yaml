        expected: Refused.
        msg: ["Permission(s) both added and removed: {UAM_REPORT_VIEW}"]
      - c: 2
        type: Negative
        title: No change
        steps:
          - Add a permission the role already holds.
        expected: Refused.
        msg: ["The request does not change the permissions of role {MKT_TL}"]
      - c: 2
        type: Negative
        title: No role selected
        steps:
          - Submit a Modify request without a role.
        expected: Refused.
        msg: [Select the role to change]
      - c: 2
        type: Negative
        title: Second request for the role
        steps:
          - Submit another Modify request for Marketing Team Lead while one is pending.
        expected: Refused.
        msg: ["A request for role {MKT_TL} is already waiting for approval"]
      - c: 3
        type: Positive
        persona: SYSADMIN
        screen: PARAMS
        title: Apply on approval
        steps:
          - Set UAM_ROLE_APPLY_ON_APPROVAL true; submit and approve a Modify request.
        expected: The change is applied at the last approval; no implementation step.

