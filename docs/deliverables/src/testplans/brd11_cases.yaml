# Test plan BRD-11 User Access Maintenance - test data file.
# Build: python docs/deliverables/src/testplans/build_test_plan.py docs/deliverables/src/testplans/brd11_cases.yaml
# Schema: see the header of build_test_plan.py. FR titles, BRD IDs and priorities come from the FRS.
# BRD-11 is designed, not built: the expected results quote the message text of the FRS and the build
# design (docs/architecture/USER_ACCESS_DESIGN.md) without codes, and no case names an automated test.
# Part of the function exists today (the "baseline" of FRS section 2.3); the cases test the behaviour
# the FRS asks for after the BRD-11 change. Screen paths follow section 11.2 of the build design.

meta:
  brd: BRD-11
  name: User Access Maintenance
  code: UA
  frs: FRS_BRD11_USER_ACCESS_MAINTENANCE.md
  summary: TP_BRD11_USER_ACCESS_MAINTENANCE.md
  version: "1.0"
  date: 25 September 2026
  built: false

personas:
  UAM_REQUESTOR: {name: Requestor, short: Req.}
  UAM_APPROVER: {name: Approver, short: Appr.}
  UAM_SECOND_APPROVER: {name: Second approver, short: 2nd Appr.}
  BUSINESS_ADMIN: {name: Business Administrator, short: Bus. Admin}
  SYSADMIN: {name: System Administrator, short: Sys Admin}
  NB_APPROVER: {name: New Business approver (keeps ACCESS_APPROVE), short: NB Appr.}
  AUDITOR: {name: Auditor, short: Audit.}
  MKT_AO: {name: Business user without access-maintenance rights (Marketing AO), short: MKT AO}
  SYSTEM: {name: BIBS scheduled job or event}

screens:
  LOGIN: Login page
  HOME: Home page (menu of the user's roles)
  SESSION: Any BIBS screen (session guard dialog)
  PROFILE: User menu > My Profile
  USERS: Administration > Users
  ROLES: Administration > Roles & Permissions
  REQS: User Access > Access Requests
  NEWREQ: User Access > Access Requests > New Request
  REQ: User Access > Access Requests > Request detail (History tab)
  BULK: User Access > Bulk Request
  GP: User Access > Group Profile Requests
  MATRIX: User Access > User Access Matrix
  UAREP: User Access > User Access Reports
  APPROVALS: My Approvals
  AUDIT: Administration > Audit Trail
  PARAMS: Administration > System Parameters
  JOBS: Administration > Scheduled Jobs
  NOTIF: Notifications (bell icon in the page header)
  MAIL: Test mailbox of the recipient
  DB: Database console of the test environment (database administrator)
  API: API call with the user's token (tester tool, for example Postman)

data:
  - id: TD-UA-01
    name: Test users per role
    content: requestor and requestor2 (UAM_REQUESTOR), uamapprover and uamapprover2 (UAM_APPROVER), secapprover (UAM_SECOND_APPROVER), badmin (BUSINESS_ADMIN), admin and admin2 (SYSADMIN), approver (NB_APPROVER), auditor (AUDITOR), ao (MKT_AO); a disabled user and a locked user.
    source: Planned demo seed V1960 (requestor, uamapprover, secapprover) and existing seeds V900 / V980; the others created by the test lead
  - id: TD-UA-02
    name: Requests in every status
    content: A draft, a request pending for uamapprover, a returned request, a cancelled request, a scheduled request with a future date, an approved and applied request, a bulk batch of three lines, a group-profile create request FOR_IMPLEMENTATION, a privileged change waiting for the second approval.
    source: Planned demo seed V1960 of the build design
  - id: TD-UA-03
    name: Group profiles
    content: UAM_REQUESTOR, UAM_APPROVER, UAM_SECOND_APPROVER (Standard); Marketing Team Lead (MKT_TL) and Processing Team Lead (Standard); SYSADMIN (Admin); a High profile UAT_HIGH; an inactive profile UAT_INACTIVE; profile Marketing Account Officer.
    source: Delivered roles (V1060) and profiles created by the test lead through group-profile requests
  - id: TD-UA-04
    name: New user data
    content: User ID a013000196 (valid format), full name "UAT User One", e-mail on the test domain, home branch, Windows ID UATWIN01; invalid IDs "ab" (too short), "a01300019X" (wrong format), an existing user ID; a Windows ID already used.
    source: Keyed in by the tester
  - id: TD-UA-05
    name: Bulk files
    content: Template file with three enrolment rows (a013000201 to a013000203); a file with one row for an existing user ID; a file with a row whose action is "promote"; a PDF file.
    source: Template UAM_ACCESS_REQUEST downloaded from Bulk Request and filled by the test lead
  - id: TD-UA-06
    name: Parameters and jobs as delivered
    content: "LOGIN_MAX_FAILED_ATTEMPTS 3; SESSION_IDLE_WARNING_MINUTES 15; SESSION_TIMEOUT_MINUTES 30; SESSION_EXPIRY_WARNING_MINUTES 30; AUTH_MODE LOCAL; USER_ID_PATTERN ^[a-zA-Z][0-9]{9}$; PASSWORD_HISTORY_COUNT 8; PASSWORD_MAX_AGE_DAYS 90; PASSWORD_MIN_AGE_DAYS 1; UAM_WORKING_HOURS 08:00-18:00 MON-FRI; UAM_ANY_APPROVER false; UAM_DIRECT_ROLE_EDIT false; UAM_ROLE_APPLY_ON_APPROVAL false; JOB_FAILURE_RECIPIENTS = test mailbox; jobs UAM_EFFECTIVE_CHANGES 00:05 and PASSWORD_EXPIRY_NOTICE 06:00."
    source: Configuration delivered with the build (FRS section 9.1); recipients set by the test lead
  - id: TD-UA-07
    name: Directory test stub
    content: A test directory that answers for the Windows IDs of the test users, with one refusal message; available only when BDO supplies the EUA interface (UQ04).
    source: Test stub prepared by the project team from the EUA specification (not yet available)
  - id: TD-UA-08
    name: Test mailboxes
    content: E-mail addresses of the test users point to test mailboxes of the test lead.
    source: Test mail relay of SIT and UAT

scenarios:
  - id: SC-UA-01
    persona: UAM_REQUESTOR
    title: Sign-in, session and password. Users log in with their profile, get the inactivity warning and sign-out, log out, and follow the password policy; directory sign-in when AUTH_MODE is DIRECTORY.
    pre: Users TD-UA-01; parameters TD-UA-06.
  - id: SC-UA-02
    persona: UAM_REQUESTOR
    title: User access requests. The Requestor drafts, edits and submits requests to enrol, modify, deactivate and reactivate users, chooses the approver and sets an effective date.
    pre: Users TD-UA-01; profiles TD-UA-03; new user data TD-UA-04.
  - id: SC-UA-03
    persona: UAM_REQUESTOR
    title: Correction, cancellation, tracking and bulk. The Requestor corrects returned requests, cancels requests, follows their status and submits a bulk file.
    pre: Requests TD-UA-02; bulk files TD-UA-05.
  - id: SC-UA-04
    persona: UAM_APPROVER
    title: Review and approval. The chosen approver approves, rejects or returns requests; privileged and out-of-hours changes need a second approval.
    pre: Requests TD-UA-02.
  - id: SC-UA-05
    persona: BUSINESS_ADMIN
    title: Group-profile requests. The Business Administrator requests new, changed, deactivated and reactivated profiles; the approvers decide in order.
    pre: Profiles TD-UA-03.
  - id: SC-UA-06
    persona: SYSADMIN
    title: System Administrator functions. The System Administrator implements approved profile requests, checks the delivered profiles and functions, and maintains user data.
    pre: Group-profile request FOR_IMPLEMENTATION of TD-UA-02.
  - id: SC-UA-07
    persona: AUDITOR
    title: Reports and logs. The four access reports and the insert-only access-change log.
    pre: Scenarios SC-UA-02 to SC-UA-06 ran in the test period.
  - id: SC-UA-08
    persona: SYSTEM
    title: Notifications and batch failures. Requesters, approvers and affected users are notified; failed batch runs are e-mailed.
    pre: Mailboxes TD-UA-08; recipients TD-UA-06.

frs:
  FR-UA-001:
    scenario: SC-UA-01
    persona: UAM_REQUESTOR
    screen: LOGIN
    data: [TD-UA-01, TD-UA-06]
    conditions:
      - A user with the Requestor profile logs in and sees the User Access screens of the Requestor only; a user with several roles sees the union of their screens.
      - Wrong credentials are refused and the attempt is counted.
      - The third wrong password locks the account and the next attempt is refused.
      - The audit trail lists the failed and successful attempts.
    cases:
      - c: 1
        type: Positive
        title: Requestor logs in
        steps:
          - Log in as requestor; open the side menu.
        expected: User Access shows Access Requests and Bulk Request. Group Profile Requests, User Access Reports and Administration are not shown.
      - c: 1
        type: Positive
        persona: BUSINESS_ADMIN
        title: A user with two roles sees both sets of screens
        pre: badmin also holds UAM_REQUESTOR (granted through a request).
        steps:
          - Log in as badmin; open the side menu.
        expected: The menu shows the screens of BUSINESS_ADMIN and of UAM_REQUESTOR.
      - c: 2
        type: Negative
        title: Wrong password
        steps:
          - Enter requestor and a wrong password.
        expected: The log-in is refused and the failed attempt is counted.
        msg: [Invalid user name or password]
      - c: 3
        type: Boundary
        neg: true
        title: Third wrong password locks the account
        steps:
          - Enter requestor2 with a wrong password three times; then the correct password.
        expected: The account is locked; the fourth attempt is refused.
        msg: [Account is locked. Contact your administrator.]
      - c: 3
        type: Boundary
        title: Two wrong passwords do not lock
        steps:
          - Enter uamapprover2 with a wrong password twice; then the correct password.
        expected: The log-in succeeds.
      - c: 4
        type: Positive
        persona: AUDITOR
        screen: AUDIT
        title: Attempts in the audit trail
        steps:
          - Open Administration > Audit Trail for today and requestor2.
        expected: Three failed attempts and the refused attempt on the locked account, each with time and source address.

  FR-UA-002:
    scenario: SC-UA-01
    persona: MKT_AO
    screen: SESSION
    data: [TD-UA-06]
    conditions:
      - After 15 minutes without activity the inactivity warning appears; continuing closes it and restarts the timer.
      - After 30 minutes without activity the user is signed out and the session ends with reason idle timeout.
      - Activity in any browser tab keeps all tabs signed in.
      - The user is warned 30 minutes before the fixed token expiry.
    cases:
      - c: 1
        type: Boundary
        title: Warning after 15 minutes
        steps:
          - Log in as ao; leave the screen idle for 15 minutes.
          - Click Continue in the warning.
        expected: The warning appears at 15 minutes; after Continue it closes and the timer restarts.
      - c: 1
        type: Boundary
        neg: true
        title: No warning at 14 minutes
        steps:
          - Stay idle for 14 minutes.
        expected: No warning is shown.
      - c: 2
        type: Boundary
        neg: true
        title: Sign-out after 30 minutes
        steps:
          - Stay idle for 30 minutes; then click a menu entry.
        expected: The log-in screen shows; the session log shows the end reason idle timeout.
      - c: 3
        type: Positive
        title: Activity in a second tab keeps the first tab signed in
        steps:
          - Open BIBS in two tabs; work in tab 2 for 20 minutes while tab 1 is idle; return to tab 1.
        expected: Tab 1 is still signed in and shows no sign-out.
      - c: 4
        type: Positive
        title: Warning before the fixed token expiry
        pre: The test lead shortens the token lifetime on the test environment so the expiry is within 30 minutes.
        steps:
          - Keep working until 30 minutes before the token expiry.
        expected: The warning "For your security the system signs you out in n minute(s)" is shown while the user is active.

  FR-UA-003:
    scenario: SC-UA-01
    persona: UAM_REQUESTOR
    screen: LOGIN
    data: [TD-UA-06, TD-UA-07]
    conditions:
      - In DIRECTORY mode a user signs in with the Windows ID and the network password, and BIBS stores no password.
      - A password refused by the directory shows the directory's message and counts towards the lock-out.
      - A Windows ID not linked to a BIBS user is refused; an unreachable directory refuses the log-in with a service message.
      - Roles and permissions stay in BIBS in both modes.
    cases:
      - c: 1
        type: Positive
        title: Windows ID sign-in in DIRECTORY mode
        pre: AUTH_MODE = DIRECTORY; the directory stub of TD-UA-07 answers.
        steps:
          - Enter the Windows ID of requestor and the stub password.
          - As the database administrator check the password column of requestor.
        expected: The home page opens with the Requestor menu; no password is stored for requestor.
      - c: 2
        type: Negative
        title: Directory refuses the password
        steps:
          - Enter the Windows ID with a wrong password.
        expected: The message returned by the directory is shown; the failed attempt is counted and the third one locks the account.
      - c: 3
        type: Negative
        title: Windows ID without a BIBS user
        steps:
          - Enter a Windows ID that the stub knows but no BIBS user carries.
        expected: The log-in is refused.
        msg: [Invalid user name or password]
      - c: 3
        type: Negative
        title: Directory not reachable
        steps:
          - Stop the stub; log in.
        expected: The log-in is refused with a service message.
      - c: 4
        type: Positive
        title: Roles come from BIBS in DIRECTORY mode
        steps:
          - Sign in with the Windows ID of badmin.
        expected: The menu is that of the BIBS roles of badmin.

  FR-UA-004:
    scenario: SC-UA-01
    persona: UAM_REQUESTOR
    screen: HOME
    data: [TD-UA-01]
    conditions:
      - Log Out ends the session in BIBS and the log-out is recorded with user and time.
      - The Users screen shows a signed-in user as Online.
      - A token of an ended session is refused.
    cases:
      - c: 1
        type: Positive
        persona: AUDITOR
        screen: UAREP
        title: Log-out recorded
        steps:
          - As requestor click Log Out.
          - As auditor run the User Access Audit Log for today with log-ins and log-outs included.
        expected: The report shows the log-out of requestor with the time.
      - c: 2
        type: Positive
        persona: SYSADMIN
        screen: USERS
        title: Online status
        steps:
          - Log in as requestor in one browser; as admin open Administration > Users.
        expected: requestor shows the status Online.
      - c: 3
        type: Negative
        screen: API
        title: Token of an ended session
        steps:
          - Take the token of requestor; log out; call an API with the old token.
        expected: The call is refused with HTTP 401.

  FR-UA-005:
    scenario: SC-UA-01
    persona: UAM_REQUESTOR
    screen: PROFILE
    data: [TD-UA-06, TD-UA-08]
    conditions:
      - A new password of at least 10 characters with upper and lower case, digit and symbol is saved; a weaker one or a wrong current password is refused.
      - A new password equal to one of the last 8 is refused, and a second change within a day is refused.
      - After an administrator reset the user must change the password at the next log-in; a password older than 90 days must be changed at log-in.
      - The reset link works once and not after 30 minutes.
      - Users whose password expires within 7 days are notified.
    cases:
      - c: 1
        type: Positive
        title: Change to a compliant password
        steps:
          - Open My Profile > Change password; enter the current password and "Uat#Pass2026a" twice; save.
        expected: The password is changed.
      - c: 1
        type: Boundary
        neg: true
        title: Nine-character password
        steps:
          - Enter "Uat#Pas26" as the new password.
        expected: Refused.
        msg: [must contain upper and lower case letters and a digit and a symbol]
      - c: 1
        type: Negative
        title: Wrong current password
        steps:
          - Enter a wrong current password and a compliant new one.
        expected: Refused.
        msg: [Current password is incorrect]
      - c: 2
        type: Negative
        title: Password used recently
        pre: The user changed the password the day before, from P1 to P2.
        steps:
          - Change the password back to P1.
        expected: Refused.
        msg: [You used this password recently. Choose another one]
      - c: 2
        type: Negative
        title: Second change on the same day
        steps:
          - Change the password; change it again.
        expected: The second change is refused.
        msg: [You changed your password less than a day ago]
      - c: 3
        type: Workflow
        persona: SYSADMIN
        screen: USERS
        title: Forced change after an administrator reset
        steps:
          - As admin reset the password of requestor2; note the temporary password.
          - Log in as requestor2 with it.
        expected: BIBS asks for a new password before the home page opens.
      - c: 3
        type: Boundary
        neg: true
        screen: LOGIN
        title: Password 90 days old
        pre: The password date of requestor is set 90 days back in the test database.
        steps:
          - Log in as requestor.
        expected: BIBS asks for a new password before opening the home page.
      - c: 4
        type: Positive
        screen: LOGIN
        title: Forgot password link used once
        steps:
          - Click Forgot password?; enter requestor; open the e-mail; set a new password with the link.
          - Open the same link again.
        expected: The first use sets the password; the second use is refused.
      - c: 4
        type: Boundary
        neg: true
        screen: MAIL
        title: Reset link after 30 minutes
        steps:
          - Request a link; open it 31 minutes later.
        expected: The link is refused as expired.
      - c: 5
        type: Positive
        screen: NOTIF
        title: Expiry notice 7 days before
        pre: The password date of requestor is set 84 days back.
        steps:
          - Run PASSWORD_EXPIRY_NOTICE.
        expected: requestor is notified that the password expires within 7 days.

  FR-UA-010:
    scenario: SC-UA-02
    persona: UAM_REQUESTOR
    screen: NEWREQ
    data: [TD-UA-01, TD-UA-04]
    conditions:
      - A request saved as a draft keeps its number AR-yyyy-nnnnnn, is edited later and on submission becomes PENDING after the full checks.
      - Only the creator sees and edits a draft.
      - A cancelled draft stays in My Requests as CANCELLED with its reason; requests are never deleted.
      - Submission needs the justification; cancellation needs a reason.
      - Only one open request per user or group profile.
    cases:
      - c: 1
        type: Workflow
        title: Draft today, submit tomorrow
        steps:
          - New Request, type Enrol new user; enter the data of TD-UA-04; approver uamapprover; remarks; Save Draft.
          - The next day open the draft; change the home branch; Submit.
        expected: The draft gets AR-yyyy-nnnnnn; after submission it is PENDING with the same number.
      - c: 1
        type: Negative
        title: Full checks run on submission
        steps:
          - Save a draft for an existing user ID (passes the light checks); Submit.
        expected: The draft stays DRAFT and the message is shown.
        msg: ["User {approver} already exists"]
      - c: 2
        type: Security-access
        persona: UAM_REQUESTOR
        screen: API
        title: Another Requestor cannot open the draft
        steps:
          - As requestor2 open the address of requestor's draft; call the edit.
        expected: The draft is not listed for requestor2; the edit is refused.
        msg: [Only the creator can edit this draft]
      - c: 3
        type: Workflow
        screen: REQS
        title: Cancel a draft
        steps:
          - Open a draft; Cancel Request; reason "Raised twice"; confirm.
        expected: The request shows CANCELLED with the reason in My Requests; there is no Delete.
      - c: 4
        type: Negative
        title: Submit without justification
        steps:
          - Submit a draft with Remarks blank.
        expected: Not submitted.
        msg: [Enter the justification]
      - c: 4
        type: Negative
        title: Cancel without reason
        steps:
          - Cancel Request with the reason blank.
        expected: Not cancelled.
        msg: [Enter the reason for the cancellation]
      - c: 4
        type: Boundary
        neg: true
        title: Justification of 1001 characters
        steps:
          - Paste 1001 characters in Remarks; Submit.
        expected: The field accepts at most 1000 characters; the request is not submitted with 1001.
      - c: 5
        type: Negative
        title: Second request for a user with a pending request
        steps:
          - Submit a Modify user request for the user of the pending request of TD-UA-02.
        expected: Refused.
        msg: ["A request for user {uatuser2} is already waiting for approval"]

  FR-UA-011:
    scenario: SC-UA-02
    persona: UAM_REQUESTOR
    screen: NEWREQ
    data: [TD-UA-03, TD-UA-04]
    conditions:
      - An enrolment for user ID a013000196 with the Marketing Account Officer profile is applied after approval and the user can sign in.
      - The user ID must follow the BDOI format and be new; the full name and at least one group profile are required.
      - Only active group profiles are offered; unknown or inactive profiles are refused.
      - The Windows ID is unique across users.
    cases:
      - c: 1
        type: Workflow
        title: Enrol a013000196
        steps:
          - Enrol new user a013000196, UAT User One, profile Marketing Account Officer; approver uamapprover; submit.
          - As uamapprover approve; note the temporary password; log in as a013000196.
        expected: The user is created; the new user signs in with the Marketing Account Officer menu after changing the temporary password.
      - c: 2
        type: Negative
        title: Existing user ID
        steps:
          - Enrol user ID approver; submit.
        expected: Refused.
        msg: ["User {approver} already exists"]
      - c: 2
        type: Negative
        title: User ID not in the BDOI format
        steps:
          - Enrol user ID a01300019X; submit.
        expected: Refused.
        msg: ["The user ID must follow the format {^[a-zA-Z][0-9]{9}$}"]
      - c: 2
        type: Negative
        title: User ID too short
        steps:
          - Enrol user ID ab; submit.
        expected: Refused.
        msg: ["The user name has 3 to 50 letters, digits, dots, dashes or underscores"]
      - c: 2
        type: Negative
        title: Full name blank
        steps:
          - Enrol a013000197 without a full name; submit.
        expected: Refused.
        msg: [Enter the full name of the new user]
      - c: 2
        type: Negative
        title: No group profile
        steps:
          - Enrol a013000197 with no profile; submit.
        expected: Refused.
        msg: [Select at least one role]
      - c: 3
        type: Negative
        title: Inactive profile not offered
        steps:
          - Open the Group profiles list; look for UAT_INACTIVE.
        expected: UAT_INACTIVE is not listed.
      - c: 3
        type: Negative
        screen: API
        title: Inactive profile sent through the API
        steps:
          - Submit an enrolment with profile UAT_INACTIVE through the API.
        expected: Refused.
        msg: ["Group profile {UAT_INACTIVE} is not active"]
      - c: 4
        type: Negative
        title: Windows ID already used
        steps:
          - Enrol a013000198 with the Windows ID of requestor; submit.
        expected: Refused.
        msg: ["Windows ID {UATWIN01} belongs to another user"]

  FR-UA-012:
    scenario: SC-UA-02
    persona: UAM_REQUESTOR
    screen: NEWREQ
    data: [TD-UA-01, TD-UA-03]
    conditions:
      - A request that moves a user from Marketing Team Lead to Processing Team Lead is applied after approval and logged from and to.
      - A request that changes the e-mail only leaves the group profiles unchanged.
      - A request that changes nothing, names an unknown user, or changes the requester's own roles is refused.
    cases:
      - c: 1
        type: Workflow
        title: Move a user to Processing Team Lead
        steps:
          - Modify user; search the Marketing Team Lead test user; replace the profile with Processing Team Lead; submit; approve as uamapprover.
          - As auditor run the User Access Audit Log.
        expected: The user holds Processing Team Lead; the log shows "Marketing Team Lead" to "Processing Team Lead".
      - c: 2
        type: Positive
        title: E-mail change only
        steps:
          - Modify user; change the e-mail only; submit; approve.
        expected: The e-mail is changed; the group profiles are unchanged.
      - c: 3
        type: Negative
        title: Nothing changed
        steps:
          - Modify user; change nothing; submit.
        expected: Refused.
        msg: [The request does not change the user]
      - c: 3
        type: Negative
        screen: API
        title: Unknown user
        steps:
          - Submit a Modify user request for user "nosuchuser" through the API.
        expected: Refused.
        msg: ["User {nosuchuser} does not exist"]
      - c: 3
        type: Security-access
        title: Change of the requester's own roles
        steps:
          - As requestor, Modify user requestor; add a profile; submit.
        expected: Refused.
        msg: [You cannot change your own roles]

  FR-UA-013:
    scenario: SC-UA-02
    persona: UAM_REQUESTOR
    screen: NEWREQ
    data: [TD-UA-01]
    conditions:
      - After approval the deactivated user cannot sign in and keeps the group profiles; the User Access Report shows the deactivation with the approver.
      - A deactivation dated the 30th is applied on the 30th.
      - Only enabled users are offered; an unknown or already deactivated user is refused.
    cases:
      - c: 1
        type: Workflow
        title: Deactivate a user
        steps:
          - Deactivate user; search a013000196; reason Resigned; remarks; submit; approve as uamapprover.
          - Log in as a013000196; as badmin run the User Access Report.
        expected: The log-in is refused; the report shows the deactivation, the approver and the request number.
      - c: 2
        type: Workflow
        persona: SYSTEM
        screen: JOBS
        title: Deactivation dated the 30th
        steps:
          - Submit a deactivation with effective date the 30th; approve it before.
          - Run UAM_EFFECTIVE_CHANGES with the test date set to the 29th, then the 30th.
        expected: On the 29th the request is SCHEDULED and the user active; on the 30th the user is deactivated and the request APPROVED.
      - c: 3
        type: Negative
        title: Disabled user not offered
        steps:
          - Deactivate user; search the disabled user of TD-UA-01.
        expected: The disabled user is not offered.
      - c: 3
        type: Negative
        screen: API
        title: Already deactivated user through the API
        steps:
          - Submit a deactivation of the disabled user through the API.
        expected: Refused.
        msg: ["User {uatdisabled} is already deactivated"]

  FR-UA-014:
    scenario: SC-UA-02
    persona: UAM_REQUESTOR
    screen: NEWREQ
    data: [TD-UA-01]
    conditions:
