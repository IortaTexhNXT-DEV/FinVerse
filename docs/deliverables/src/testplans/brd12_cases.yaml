# Test plan BRD-12 Submitted Policies - test data file.
# Build: python docs/deliverables/src/testplans/build_test_plan.py docs/deliverables/src/testplans/brd12_cases.yaml
# Schema: see the header of build_test_plan.py. FR titles, BRD IDs and priorities come from the FRS.
# BRD-12 is designed, not built: the expected results quote the message text of the FRS and the build
# design (docs/architecture/SUBMITTED_POLICIES_DESIGN.md) without codes, and no case names an automated
# test. Screen paths follow section 12 of the build design (section Submitted Policies).

meta:
  brd: BRD-12
  name: Submitted Policies
  code: SP
  frs: FRS_BRD12_SUBMITTED_POLICIES.md
  summary: TP_BRD12_SUBMITTED_POLICIES.md
  version: "1.0"
  date: 25 September 2026
  built: false

personas:
  SBM_HANDLER: {name: Submitted Handler (CBG), short: SBM Hand.}
  SBM_CHECKER: {name: Submitted Checker, short: SBM Check.}
  SBM_SANITATION: {name: Sanitation Handler, short: Sanit.}
  SBM_TL: {name: Team Lead (Submitted Policies), short: SBM TL}
  SBM_POLICY_REVIEWER: {name: Policy Review Officer (Non-CBG Corporate), short: Pol. Rev.}
  SBM_RULE_ADMIN: {name: Rule administrator, short: Rule Admin}
  SBM_UPP_HANDLER: {name: Admin Team UPP handler, short: UPP}
  MKT_AO: {name: Marketing AO / MAO, short: MKT AO}
  MKT_TL: {name: NB Team Lead, short: MKT TL}
  TSU: {name: TSU approver, short: TSU}
  PROCESSOR: {name: Placement and Booking user, short: Proc.}
  SYSTEM: {name: BIBS scheduled job or event}

screens:
  HOME: Submitted Policies > Submitted Policies Home
  ML: Submitted Policies > Masterlist
  REC: Submitted Policies > Masterlist > Policy record (Details tab)
  LOAN: Submitted Policies > Masterlist > Policy record > Loan & Matching tab
  RULES: Submitted Policies > Masterlist > Policy record > Rule Results tab
  RECREV: Submitted Policies > Masterlist > Policy record > Review & IAAF tab
  RECTOR: Submitted Policies > Masterlist > Policy record > TOR tab
  RECRNW: Submitted Policies > Masterlist > Policy record > Renewal tab
  RECLET: Submitted Policies > Masterlist > Policy record > Letters tab
  RECHIST: Submitted Policies > Masterlist > Policy record > History tab
  INTAKE: Submitted Policies > Upload & Intake
  EXTRACT: Submitted Policies > Extraction Review
  RUNS: Submitted Policies > Processing Runs
  IAAF: Submitted Policies > Policy Reviews / IAAF
  TOR: Submitted Policies > TOR
  RWL: Submitted Policies > Renewal Work List
  LETTERS: Submitted Policies > Letters & Print Batches
  HF: Submitted Policies > Handling Fees
  SETUP: Submitted Policies > Submitted Policies Setup
  APPROVALS: My Approvals
  REPORTS: Reports > Report Centre (category Submitted Policies)
  PLACEMENT: Placement & Booking > Placement (BRD-1 screens)
  BOOKING: Placement & Booking > Booking Workbench
  RENEWAL: Renewal > Renewal record (BRD-6)
  UNAPPLIED: Collections > Unapplied Payments
  PARAMS: Administration > System Parameters
  JOBS: Administration > Scheduled Jobs
  AUDIT: Administration > Audit Trail
  NOTIF: Notifications (bell icon in the page header)
  MAIL: Test mailbox of the recipient
  API: API call with the user's token (tester tool, for example Postman)

data:
  - id: TD-SP-01
    name: Test users per role and scope
    content: sbmhandler (SBM_HANDLER, scope CBG Motor), firehandler (SBM_HANDLER, scope CBG Fire), sbmchecker (SBM_CHECKER, IAAF level 1), sanitation (SBM_SANITATION), sbmtl (SBM_TL), polreview (SBM_POLICY_REVIEWER), badmin (SBM_RULE_ADMIN), upphandler (SBM_UPP_HANDLER), ao and ao2 (MKT_AO, own records), mkttl (MKT_TL, IAAF level 2 and rule approval), tsu (TSU), proc (PROCESSOR).
    source: Planned demo seed V1970 of the build design; firehandler and ao2 created by the test lead with their user scope
  - id: TD-SP-02
    name: Source files
    content: LFS insurance report of 300 CBG Motor rows; the same file again; an LFS file with 5 rows without PN; an LFS file with one row that updates an existing policy (new premium); a CSV without header row; a PDF file.
    source: Prepared by the test lead from the upload template of the LFS source; masked data
  - id: TD-SP-03
    name: Policy documents
    content: A text PDF of a motor policy (insurer with an extraction pattern); a scanned image PDF without text.
    source: Test document folder of the test lead; masked policy copies
  - id: TD-SP-04
    name: Legacy masterlist
    content: NB Motor legacy Excel file of 1,000 rows, of which 12 are invalid (status not in the map, blank PN, blank expiry).
    source: Masked extract of a BDOI masterlist prepared by the test lead
  - id: TD-SP-05
    name: LAMD snapshot
    content: PN rows with active non-amortised loans (FFY and generic), fully paid loans, RMU (remedial) and open-market loans; one row without PN.
    source: Planned demo seed V1971; masked rows added by the test lead
  - id: TD-SP-06
    name: Rules and masters
    content: Active demo rule sets for sanitation, matching, classification and disposition; SM Group employee list; No Touch list; limit rule for insurer INS-MGIC Motor, maximum vehicle age 10 years; insurer rules by vehicle type (Motor) and different-from-expiring (Fire); letter rules; IAAF matrix (level 1 SBM_CHECKER, level 2 MKT_TL) and TSU matrix for TOR.
    source: Planned demo seed V1970 of the build design
  - id: TD-SP-07
    name: Masterlist records
    content: About 60 records over the four segments, NB and RB, including migrated records, with handlers and conversion statuses.
    source: Planned demo seed V1971 of the build design
  - id: TD-SP-08
    name: Review, TOR and handling-fee data
    content: A Non-CBG Corporate record IN_REVIEW with its documents; a CBG Motor record with a 12-year-old vehicle insured with INS-MGIC; billed handling-fee records with PN and location reference; a CLPC unapplied payment carrying a billed PN; an OTC payment with an unknown location reference; one payment matching two records.
    source: Planned demo seed V1972; payments keyed in Collections by the test lead
  - id: TD-SP-09
    name: Renewal candidates
    content: A For Renewal CBG Fire record expiring in 150 days (expiring insurer INS-LAC); a For Renewal CBG Motor record expiring in 120 days; a Non-CBG Retail record of ao; a renewal account with a hold cover request open for 6 days.
    source: Planned demo seeds V1971-V1972; expiry dates set by the test lead
  - id: TD-SP-10
    name: Parameters and jobs as delivered
    content: "SBM_RENEWAL_LEAD_DAYS CBG_FIRE=150, CBG_MOTOR=120; SBM_MASTERLIST_DAYS_FROM_EXTRACTION 30; SBM_INSURER_ACCEPT_DAYS 5; SBM_HOLD_COVER_UNBOOKED_ALERT_DAYS 5; jobs SBM_PROCESSING 21:30, SBM_EXPIRY_SCAN 22:00, SBM_LETTER_DISPATCH 06:30, SBM_HOLD_COVER_WATCH 07:00 PHT, SBM_HANDLING_FEE_TAGGER every 30 minutes."
    source: Configuration delivered with the build (FRS section 9.1)

scenarios:
  - id: SC-SP-01
    persona: SBM_HANDLER
    title: Intake. Handlers upload source files, confirm extracted policy details, create records by hand and migrate the Excel masterlists.
    pre: Files TD-SP-02, documents TD-SP-03, legacy file TD-SP-04.
  - id: SC-SP-02
    persona: SBM_HANDLER
    title: Masterlist. One masterlist with history, handler, conversion status and remarks; each user sees and extracts only the records of the own scope.
    pre: Records TD-SP-07; users TD-SP-01.
  - id: SC-SP-03
    persona: SBM_SANITATION
    title: Rules and processing. Rule sets are approved by a checker; processing runs after intake, on schedule and on demand; fallout is reported and resolved.
    pre: Rules TD-SP-06; LAMD TD-SP-05.
  - id: SC-SP-04
    persona: SYSTEM
    title: Classification and buckets. Policies are classified Inforced or Submitted, bucketed, excluded or made ready for renewal with the RA template.
    pre: Records TD-SP-07; LAMD TD-SP-05; rules TD-SP-06.
  - id: SC-SP-05
    persona: SBM_POLICY_REVIEWER
    title: Policy review and IAAF. The reviewer records reviews, generates one IAAF per policy and routes it through the approval matrix to the bank counterpart.
    pre: Review data TD-SP-08; IAAF matrix TD-SP-06.
  - id: SC-SP-06
    persona: MKT_AO
    title: Limits and TOR. A limit breach is flagged, the TOR is prepared, approved by TSU and handed over to the AO.
    pre: Flagged record TD-SP-08; TSU matrix TD-SP-06.
  - id: SC-SP-07
    persona: SBM_SANITATION
    title: Renewal. Expiring policies are handed to Renewal with the assigned insurer; letters are sent; the insurer is re-assigned while a hold cover is open; placement and booking update the masterlist.
    pre: Renewal candidates TD-SP-09; parameters TD-SP-10.
  - id: SC-SP-08
    persona: SBM_UPP_HANDLER
    title: Handling fee. Handling-fee payments are tagged in the Unapplied Payment List and applied by Cashiering.
    pre: Handling-fee data TD-SP-08.
  - id: SC-SP-09
    persona: SBM_TL
    title: Monitoring. The home page, the Submitted Policies reports in several formats, and the notifications and alerts of key events.
    pre: Scenarios SC-SP-01 to SC-SP-08 ran in the test period.

frs:
  FR-SP-001:
    scenario: SC-SP-01
    persona: SBM_HANDLER
    screen: INTAKE
    data: [TD-SP-02]
    conditions:
      - An LFS report of 300 rows creates 300 CBG Motor records with status RECEIVED, numbered SBM-yyyy-nnnnnn, and an intake run SBI-yyyy-nnnnnn.
      - Loading the same file a second time is refused and names the earlier run.
      - A row updating an existing policy changes the record and writes the history.
      - Invalid rows are listed with the reason and valid rows are committed; a file of a wrong type or without header row is refused.
      - The handlers of the segment are notified of new records.
    cases:
      - c: 1
        type: Upload-download
        title: Upload an LFS report of 300 rows
        steps:
          - Choose source LFS insurance report; upload the 300-row file; check the counts; confirm.
          - Open the Masterlist filtered on the run.
        expected: Valid 300, invalid 0. 300 CBG Motor records with status RECEIVED and SBM numbers; the run has an SBI number and a processing run starts.
      - c: 2
        type: Negative
        title: Same file again
        steps:
          - Upload the same file.
        expected: Refused; no record is created.
        msg: ["This file was already loaded in run {SBI-2026-000001}"]
      - c: 3
        type: Positive
        screen: RECHIST
        title: Row updating an existing policy
        steps:
          - Upload the file with the changed premium; open the record's History tab.
        expected: The record shows the new premium; the history shows the old and new value with the run.
      - c: 4
        type: Negative
        title: Rows without PN
        steps:
          - Upload the file with 5 rows without PN; download the invalid rows.
        expected: The 5 rows are listed with the reason; the other rows are committed.
        msg: ["Row {4}: {PN no.} is required"]
      - c: 4
        type: Negative
        title: CSV without header row
        steps:
          - Upload the CSV without header row.
        expected: Refused.
        msg: [The file has no header row]
      - c: 4
        type: Negative
        title: PDF uploaded as a source file
        steps:
          - Upload the PDF.
        expected: Refused.
        msg: [The file type is not allowed]
      - c: 5
        type: Positive
        screen: NOTIF
        title: Handlers notified
        steps:
          - After TC-SP-001.1-01, as sbmhandler open the bell; as firehandler open the bell.
        expected: sbmhandler (CBG Motor) is notified of the new submissions; firehandler is not.

  FR-SP-002:
    scenario: SC-SP-01
    persona: SBM_HANDLER
    screen: EXTRACT
    data: [TD-SP-03]
    conditions:
      - A text PDF of a motor policy produces a proposal; after confirmation the record shows the confirmed values and status VALIDATED.
      - Before confirmation the masterlist is unchanged.
      - A scanned document without text leads to manual entry; a proposal can be rejected with a reason.
      - Confirmation needs the mandatory fields.
    cases:
      - c: 1
        type: Upload-download
        title: Extract and confirm a motor policy
        steps:
          - Upload the text PDF as a new record; check each proposed value and its confidence; correct the plate number; Confirm.
        expected: The record shows the confirmed values, including the corrected plate, and status VALIDATED.
      - c: 2
        type: Negative
        screen: ML
        title: Masterlist unchanged before confirmation
        steps:
          - Upload the PDF; before confirming, search the masterlist for its policy number.
        expected: No record with the proposed values; handlers receive the manual-validation notice.
      - c: 3
        type: Negative
        title: Scanned document without text
        steps:
          - Upload the scanned PDF.
        expected: Extraction returns "not readable"; the user is sent to manual entry.
      - c: 3
        type: Negative
        title: Reject without a reason
        steps:
          - Open a proposal; Reject without a reason.
        expected: Not rejected.
        msg: [Enter the reason of the rejection]
      - c: 4
        type: Negative
        title: Confirm with the expiry blank
        steps:
          - Clear the expiry date; Confirm.
        expected: Not confirmed.
        msg: ["{Expiry} is required"]

  FR-SP-003:
    scenario: SC-SP-01
    persona: SBM_POLICY_REVIEWER
    screen: ML
    data: [TD-SP-07]
    conditions:
      - A manually created Non-CBG Corporate policy is saved as VALIDATED and appears in the masterlist.
      - A record tagged Non-Renewable shows the chip and appears in the Non-Renewal filter and report; the tag needs a reason.
      - A later processing run does not change a manual tag.
      - Mandatory fields per segment are required and a policy already in the masterlist is refused.
    cases:
      - c: 1
        type: Positive
        title: Create a Non-CBG Corporate policy by hand
        steps:
          - Click New Policy; segment Non-CBG Corporate; NB; assured, insurer, policy number, dates, amounts, location; save.
        expected: The record is VALIDATED and listed in the masterlist.
      - c: 2
        type: Positive
        screen: REC
        title: Tag Non-Renewable with a reason
        steps:
          - Open the record; Tag Non-Renewable; reason; save; open tab Non-Renewal and SBM-NON-RENEWAL.
        expected: The Non-Renewable chip shows; the record is in the filter and in the report with the reason.
      - c: 2
        type: Negative
        screen: REC
        title: Non-Renewable without a reason
        steps:
          - Tag Non-Renewable without a reason.
        expected: Not saved.
        msg: [Select the reason for Non-Renewable]
      - c: 3
        type: Positive
        persona: SBM_SANITATION
        screen: RULES
        title: Run keeps the manual tag
        steps:
          - Run processing for the record; open Rule Results.
        expected: The run records its own result; the tag stays Non-Renewable.
      - c: 4
        type: Negative
        persona: SBM_HANDLER
        title: CBG Motor record without PN
        steps:
          - New Policy, CBG Motor, without PN; save.
        expected: Not saved.
        msg: ["{PN no.} is required"]
      - c: 4
        type: Negative
        title: Policy already in the masterlist
        steps:
          - New Policy with the policy number of an existing record; save.
        expected: Refused.
        msg: ["Policy {PC-12345} is already in the masterlist ({SBM-2026-000031})"]

  FR-SP-004:
    scenario: SC-SP-01
    persona: SBM_TL
    screen: INTAKE
    data: [TD-SP-04]
    conditions:
      - A legacy file with 1,000 rows and 12 invalid rows migrates 988 records flagged Migrated and logs 12 errors with reason codes.
      - A migrated record keeps its original date received and legacy reference, and its legacy status is mapped to a BIBS status and bucket.
      - Running the same file again creates no duplicates.
      - A status without a mapping or a blank mandatory column is refused per row.
    cases:
      - c: 1
        type: Upload-download
        title: Migrate the NB Motor file
        steps:
          - Upload the legacy file; layout NB Motor; check the result; confirm.
          - Run SBM-MIGRATION-ERRORS.
        expected: 988 records flagged Migrated; the report lists 12 rows with reason codes.
      - c: 2
        type: Positive
        screen: REC
        title: Migrated record keeps its history data
        steps:
          - Open a migrated record.
        expected: The original date received, legacy reference, mapped status and bucket, and the Migrated chip.
      - c: 3
        type: Negative
        title: Same file again
        steps:
          - Run the migration of the same file again.
        expected: No duplicate; the counts show 0 created.
      - c: 4
        type: Negative
        title: Status not in the map
        steps:
          - Open the error of the row whose status has no mapping.
        expected: The row is not migrated.
        msg: ["Row {15}: status {PENDING-OLD} has no mapping"]
      - c: 4
        type: Negative
        title: Blank expiry column
        steps:
          - Open the error of the row with a blank expiry.
        expected: The row is not migrated.
        msg: ["Row {27}: {Expiry} is required"]

  FR-SP-010:
    scenario: SC-SP-02
    persona: SBM_HANDLER
    screen: ML
    data: [TD-SP-07]
    conditions:
      - After a record is updated by an upload, the masterlist shows the new values at once.
      - Filters by segment, business type, bucket, expiry month, insurer, handler, conversion status and Migrated return only the matching records.
      - The policy record shows the summary card with flag chips and the tabs; every change writes the history and the audit trail.
    cases:
      - c: 1
        type: Positive
        title: Update shows at once
        steps:
          - After TC-SP-001.3-01, open the masterlist row.
        expected: The new premium is shown without refresh delay.
      - c: 2
        type: Positive
        title: Filter by segment and expiry month
        steps:
          - Filter CBG Motor and next month.
        expected: Only CBG Motor records expiring next month.
      - c: 2
        type: Negative
        title: Filter excludes other segments
        steps:
          - As sbmtl filter CBG Fire; look for a CBG Motor record.
        expected: No CBG Motor record is listed.
      - c: 3
        type: Positive
        screen: REC
        title: Record page and history
        steps:
          - Open a record; change the remarks; open History and Administration > Audit Trail.
        expected: The summary card shows the chips; the tabs Details to History are present; the remarks change is in the history and the audit trail.

  FR-SP-011:
    scenario: SC-SP-02
    persona: SBM_HANDLER
    screen: ML
    data: [TD-SP-01, TD-SP-07]
    conditions:
      - A CBG Motor handler does not see CBG Fire records.
      - An AO sees only his or her own records.
      - The extract follows the user's scope and is archived; a user without SBM_EXPORT cannot extract the masterlist.
    cases:
      - c: 1
        type: Security-access
        title: CBG Motor handler and a CBG Fire record
        steps:
          - As sbmhandler search a CBG Fire record by number; open its address.
        expected: Not listed; the address shows the no-access page.
      - c: 2
        type: Security-access
        persona: MKT_AO
        title: AO sees own records only
        steps:
          - As ao open the masterlist; open a record of ao2 by address.
        expected: Only ao's records; ao2's record does not open.
      - c: 3
        type: Report-output
        title: Extract within scope
        steps:
          - As sbmhandler filter and click Export (XLSX); open Report Archive.
        expected: The file holds only CBG Motor records with the Report List row 151 fields; the export is archived.
      - c: 3
        type: Security-access
        persona: SBM_POLICY_REVIEWER
        screen: API
        title: Export without SBM_EXPORT
        steps:
          - As polreview look for Export; call the export.
        expected: No Export button; the call is refused.
        msg: [You are not permitted to perform this action]

  FR-SP-012:
    scenario: SC-SP-02
    persona: SBM_HANDLER
    screen: ML
    data: [TD-SP-07]
    conditions:
      - A handler change shows at once in the masterlist and in the record history, and the new handler is notified; bulk Assign Handler changes several records.
      - The quick filter Changed since yesterday lists the records updated today.
      - The handler must be an active user.
    cases:
      - c: 1
        type: Workflow
        title: Assign a handler in bulk
        steps:
          - Tick three records; Assign Handler; choose sanitation; save.
        expected: The three rows show sanitation; each history shows the change; sanitation is notified.
      - c: 1
        type: Positive
        screen: REC
        title: Conversion status and remarks
        steps:
          - Set conversion status Renewed - Inforce and remarks; save.
        expected: The list shows the new status and remarks; History shows both changes.
      - c: 2
        type: Positive
        title: Changed since yesterday
        steps:
          - Apply the quick filter Changed since yesterday.
        expected: The records changed today, and no others.
      - c: 3
        type: Negative
        screen: API
        title: Handler not active
        steps:
          - Assign the disabled user as handler through the API.
        expected: Refused.
        msg: ["{uatdisabled} is not an active user"]

  FR-SP-020:
    scenario: SC-SP-03
    persona: SBM_RULE_ADMIN
    screen: SETUP
    data: [TD-SP-06]
    conditions:
      - A new exclusion rule applies to the next run only after the approver approves it, with an effective date.
      - Each run result shows the rule and version that produced it; a record with no matching rule is fallout with reason no rule.
      - The maker cannot approve the own rule set; a rejection keeps the version a draft.
      - A rule needs an outcome and conditions on known fields only.
    cases:
      - c: 1
        type: Workflow
        persona: MKT_TL
        screen: APPROVALS
        title: SM Group employee exclusion rule
        steps:
          - As badmin draft the disposition rule set; add a rule "employee list = Yes gives BDO / SM Group Employee Accounts, stop"; submit.
          - Run processing before approval; as mkttl compare and approve effective today; run again.
        expected: The first run does not apply the rule; after approval the employee record goes to BDO / SM Group Employee Accounts.
      - c: 2
        type: Positive
        persona: SBM_SANITATION
        screen: RULES
        title: Rule and version on the result
        steps:
          - Open Rule Results of the employee record.
        expected: Each step shows the rule, the rule-set version, the outcome and the reason code.
      - c: 2
        type: Negative
        persona: SBM_SANITATION
        screen: RUNS
        title: No matching rule
        pre: A record whose segment has no matching disposition rule.
        steps:
          - Run processing; open the fallout.
        expected: The record is fallout with reason SBM_NO_RULE.
      - c: 3
        type: Security-access
        title: Maker approves the own rule set
        pre: sbmtl (maker right) holds SBM_RULE_APPROVE for this case.
        steps:
          - As sbmtl draft and submit a rule set; click Approve.
        expected: Refused.
        msg: [A rule set is approved by someone other than its maker]
      - c: 3
        type: Workflow
        persona: MKT_TL
        screen: APPROVALS
        title: Reject a rule set
        steps:
          - Reject a pending version with a reason.
        expected: The version is a draft again with the reason; the active version is unchanged.
      - c: 4
        type: Negative
        title: Rule without outcome
        steps:
          - Add a rule with conditions and no outcome; save.
        expected: Not saved.
        msg: [Select the outcome of the rule]
      - c: 4
        type: Negative
        title: Condition on an unknown field
        steps:
          - Import a rule file with a condition on field "color".
        expected: Refused.
        msg: ["Field {color} cannot be used in a rule"]

  FR-SP-021:
    scenario: SC-SP-03
    persona: SYSTEM
    screen: RUNS
    data: [TD-SP-02, TD-SP-05, TD-SP-06]
    conditions:
      - Uploading an LFS file starts a run; each new record ends with a classification and a bucket, or fallout, through the steps in order.
      - A record matched to an active LAMD loan is moved to the right bucket and the handlers are notified.
      - Sanitation marks duplicates (same PN or same serial / motor number) For Review and incomplete records as fallout.
      - A run starts from the daily job and on demand, each with an SBR number.
    cases:
      - c: 1
        type: Workflow
        title: Run after intake
        steps:
          - Upload an LFS file; open the run.
        expected: An SBR run with steps Sanitation, Matching, Classification, Disposition, Limits; every record has a classification and bucket or is fallout.
      - c: 2
        type: Positive
        screen: NOTIF
        title: Matched record bucketed and notified
        steps:
          - Open the record whose PN is an active LAMD loan; open the bell of its handler.
        expected: The record is in its bucket; the handler is notified of the bucket change.
      - c: 3
        type: Negative
        screen: RULES
        title: Duplicate serial number
        pre: Two records with the same motor number.
        steps:
          - Run processing; open both records.
        expected: Both are For Review with the duplicate reason.
      - c: 4
        type: Positive
        persona: SBM_SANITATION
        screen: ML
        title: Run on demand and by the job
        steps:
          - Tick records; Run Processing; run SBM_PROCESSING from Scheduled Jobs.
        expected: Two runs with SBR numbers; the job run covers the records due.

  FR-SP-022:
    scenario: SC-SP-03
    persona: SBM_SANITATION
    screen: RUNS
    data: [TD-SP-02]
    conditions:
      - A run with five records without PN produces a fallout list and report with the five records and their reason code, and raises the fallout alert.
      - A corrected record leaves the fallout after the next run.
      - Intake and extraction failures are listed in the document fallout report.
    cases:
      - c: 1
        type: Negative
        screen: REPORTS
        title: Five records without PN
        steps:
          - Run processing of the 5 records; open the Fallout tab; run SBM-PROCESS-FALLOUT; open the bell.
        expected: The five records with their reason code; the report shows the same; alert SBM_FALLOUT.
      - c: 2
        type: Workflow
        title: Correct and re-run
        steps:
          - Enter the PN of one record; re-run it.
        expected: The record leaves the fallout and gets a bucket.
      - c: 3
        type: Report-output
        screen: REPORTS
        title: Document fallout report
        steps:
