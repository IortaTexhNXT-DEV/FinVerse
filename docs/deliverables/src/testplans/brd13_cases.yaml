        title: Remitted legacy invoice not extracted
        steps:
          - Run the extraction for an insurer with a legacy invoice remitted in legacy.
        expected: The invoice is not in the extraction.
      - c: 3
        type: Workflow
        screen: JOURNAL
        title: Batch postings and schedule
        steps:
          - Create and approve a batch with one legacy and one new line; open the journal and the schedule.
        expected: Legacy line Dr DTIP - Legacy, Cr Commission Receivable - Legacy; new line on the new accounts; the schedule shows the legacy invoice number and source EBIX.

  FR-DM-090:
    scenario: SC-DM-06
    persona: OPS_USER
    screen: ENDORSE
    data: [TD-DM-04, TD-DM-05]
    conditions:
      - An additional premium of 2,000.00 on a legacy invoice books an endorsement invoice with the legacy invoice as parent and increases the PR and DTIP legacy sub-ledgers.
      - The service invoice is issued for the commission increase.
      - The account shows the increased premium and sum insured.
      - A legacy invoice without a migrated header cannot be endorsed.
    cases:
      - c: 1
        type: Workflow
        persona: ADJ_TL
        title: Positive endorsement
        steps:
          - Raise an additional-premium request on I00123456 for basic 2,000.00; validate; as adjtl approve; post the batch.
        expected: Endorsement invoice BI-... with parent I00123456 and ledger context LEGACY; Premium Receivable - Legacy and DTIP - Legacy increase.
      - c: 2
        type: Report-output
        title: Service invoice
        steps:
          - Open the documents of the endorsement.
        expected: A service invoice for the commission increase refers to the endorsement number.
      - c: 3
        type: Positive
        screen: ACCOUNTS
        title: Account updated
        steps:
          - Open the migrated account.
        expected: Premium and sum insured include the endorsement.
      - c: 4
        type: Negative
        title: No migrated header
        steps:
          - Raise a request on a legacy invoice whose policy has no header.
        expected: Refused.
        msg: ["Invoice {I00200001} has no migrated policy header; it cannot be endorsed in BIBS"]

  FR-DM-091:
    scenario: SC-DM-06
    persona: OPS_USER
    screen: ENDORSE
    data: [TD-DM-04, TD-DM-05]
    conditions:
      - A return premium of 1,000.00 on a legacy invoice with 1,000.00 open reduces the PR and DTIP legacy balances by 1,000.00.
      - After the endorsement the account premium is the net premium used by Renewal.
      - A decrease above the original premium is refused.
    cases:
      - c: 1
        type: Workflow
        persona: ADJ_TL
        title: Return premium
        steps:
          - Raise a return-premium request of 1,000.00; approve; post.
        expected: Return invoice in context LEGACY; PR and DTIP legacy balances fall by 1,000.00; service invoice credit refers to the legacy service invoice.
      - c: 2
        type: Positive
        screen: RENEWAL
        title: Net premium for renewal
        steps:
          - Open the renewal candidate of the policy.
        expected: The expiring premium is the net premium after the endorsement.
      - c: 3
        type: Negative
        title: Over-adjustment
        steps:
          - Raise a decrease larger than the original premium.
        expected: Refused with the over-adjustment message of the Adjustment module (ADJID.028).

  FR-DM-092:
    scenario: SC-DM-06
    persona: OPS_USER
    screen: ENDORSE
    data: [TD-DM-04]
    conditions:
      - An approved address change of a migrated policy is shown on the account and in the renewal candidate.
      - No journal is posted.
      - A financial field changed under a non-financial type is refused.
    cases:
      - c: 1
        type: Workflow
        persona: ADJ_TL
        title: Address change
        steps:
          - Raise a non-financial request changing the address; approve.
        expected: The account and the renewal candidate show the new address; the endorsement is recorded with old and new values.
      - c: 2
        type: Positive
        screen: JOURNAL
        title: No posting
        steps:
          - Search journals for the endorsement number.
        expected: No journal.
      - c: 3
        type: Negative
        title: Financial field under a non-financial type
        steps:
          - Change the sum insured in a non-financial request.
        expected: Refused as the Adjustment module refuses it.

  FR-DM-100:
    scenario: SC-DM-06
    persona: PRC
    screen: REPORTS
    data: [TD-DM-05]
    conditions:
      - After a positive endorsement of 2,000.00 on a legacy invoice with original premium 10,000.00, the report shows original 10,000.00, updated 12,000.00 and delta 2,000.00 with the endorsement number.
      - The report exports to Excel with the same rows.
      - A user without RECON_PROCESS cannot run it.
    cases:
      - c: 1
        type: Report-output
        title: Legacy change report
        pre: A 2,000.00 endorsement posted on an invoice with basic 10,000.00.
        steps:
          - Run PRC-LEGACY-CHANGES for the period.
        expected: One line - basic original 10,000.00, updated 12,000.00, delta 2,000.00, endorsement number, date and user.
      - c: 2
        type: Report-output
        title: Excel export
        steps:
          - Export to Excel.
        expected: Same rows and values.
      - c: 3
        type: Security-access
        persona: CASHIER
        title: Report refused without permission
        steps:
          - As cashier open the report.
        expected: Not in the report list; the call returns HTTP 403.

  FR-DM-110:
    scenario: SC-DM-07
    persona: AUDIT
    screen: INQUIRY
    data: [TD-DM-08]
    conditions:
      - A closed legacy invoice of 2022 is found by its invoice number and opens read only with its documents.
      - An export above the row limit is refused.
      - A search needs at least one criterion and, when configured, a reason.
    cases:
      - c: 1
        type: Positive
        title: Find a 2022 invoice
        steps:
          - Enter reason Audit request; search invoice I00098765; open it and its document.
        expected: The record opens read only with labelled columns; the document opens; no edit action.
      - c: 2
        type: Boundary
        neg: true
        title: Export above 1,000 rows
        steps:
          - Search record type INVOICE with 1,200 results; Export.
        expected: The export is refused; an export of a search with 1,000 results works.
      - c: 3
        type: Negative
        title: No criterion and no reason
        steps:
          - Click Search without criteria; then search without a reason.
        expected: "Both refused. The second check shows \"Enter the reason for this inquiry\"."
        msg: ["Enter at least one search criterion"]

  FR-DM-111:
    scenario: SC-DM-07
    persona: ACCESS_REV
    screen: ACCLOG
    data: [TD-DM-08]
    conditions:
      - A search in Legacy Inquiry creates a log entry with the user, criteria and result count.
      - No user can edit or delete a log entry.
      - A user without LEGACY_ACCESS_LOG_VIEW cannot open the log.
    cases:
      - c: 1
        type: Positive
        title: Search is logged
        steps:
          - After TC-DM-110.1-01 open the access log filtered on legacyaudit.
        expected: Entries for the search, view and document download with criteria, record keys, result count and reason.
      - c: 2
        type: Negative
        persona: SYSTEM
        screen: API
        title: Log cannot be changed
        steps:
          - Try to update and delete a log entry through the API as an administrator.
        expected: No edit or delete action exists; both calls are refused.
      - c: 3
        type: Security-access
        persona: AUDIT
        title: Log refused to the inquiry role
        steps:
          - As legacyaudit open the access log URL.
        expected: Refused.
        msg: [You are not permitted to perform this action]

  FR-DM-120:
    scenario: SC-DM-08
    persona: DML
    screen: CUTOVER
    data: [TD-DM-01]
    conditions:
      - A mock plan records planned and actual times per task and per object load.
      - The runbook export lists every task with owner and timing.
      - A task cannot start before its dependency is complete.
    cases:
      - c: 1
        type: Workflow
        title: Run a mock plan
        steps:
          - Create a plan of kind MOCK from the template; start and complete the tasks of phase D.
        expected: Actual start and end are recorded per task and per load; progress against the plan is shown.
      - c: 2
        type: Upload-download
        title: Runbook export
        steps:
          - Export the plan to Excel and Word.
        expected: Every task with phase, owner role, planned and actual times.
      - c: 3
        type: Negative
        title: Start before dependency
        steps:
          - Start CT-042 while CT-041 is not complete.
        expected: Refused.
        msg: ["Task {CT-042} depends on {CT-041}, which is not complete"]

  FR-DM-121:
    scenario: SC-DM-08
    persona: GONOGO
    screen: GONOGO
    data: [TD-DM-07]
    conditions:
      - GO cannot be recorded while Migration Clearing is not 0.00.
      - The decision record shows each criterion value at the time of the decision.
      - NO-GO starts the fallback task.
    cases:
      - c: 1
        type: Negative
        title: GO with clearing not zero
        pre: TB version with one control line 3,000.00 higher loaded.
        steps:
          - Click GO.
        expected: Refused.
        msg: ["Criterion {Migration Clearing} is not met"]
      - c: 2
        type: Positive
        title: GO recorded with values
        steps:
          - With all criteria met click GO with a comment; open the decision record.
        expected: The record shows every criterion with its value and status and the board member.
      - c: 3
        type: Workflow
        title: NO-GO starts the fallback
        steps:
          - In a mock plan record NO-GO.
        expected: The fallback task starts and its owner is notified.

  FR-DM-122:
    scenario: SC-DM-08
    persona: PM
    screen: RUNOFF
    data: [TD-DM-04]
    conditions:
      - A legacy policy expiring 60 days after go-live appears in BIBS Renewal with the disposition it had in legacy.
      - A legacy policy expiring 200 days after go-live is extracted by BIBS at 140 days before expiry.
      - The run-off report shows renewed, not renewed and open counts per expiry month.
      - A cohort row without a header is INVALID.
    cases:
      - c: 1
        type: Positive
        persona: MKT_AO
        screen: RENEWAL
        title: Carried cohort in Renewal
        steps:
          - Open the candidates with source LEGACY; open the policy expiring at T+60.
        expected: Candidate with the legacy disposition, handler and remarks.
      - c: 2
        type: Positive
        persona: SYSTEM
        screen: RENEWAL
        title: Later expiry extracted by BIBS
        steps:
          - Set the business date to expiry - 140 days for the T+200 policy; run the Renewal extraction.
        expected: A candidate is created from the migrated header.
      - c: 3
        type: Report-output
        screen: REPORTS
        title: Run-off report
        steps:
          - Run MIG-RUNOFF.
        expected: Per expiry month - in force at go-live, renewed, not renewed, lapsed, open.
      - c: 4
        type: Negative
        persona: OPERATOR
        screen: ISSUES
        title: Cohort row without header
        steps:
          - Validate P03 with the row whose cover is not in P01.
        expected: INVALID.
        msg: ["Cover {C-2026-009999} has no migrated header"]

  FR-DM-123:
    scenario: SC-DM-08
    persona: PM
    screen: RUNOFF
    data: [TD-DM-06, TD-DM-08]
    conditions:
      - A system cannot be marked decommissioned while its archive reconciliation is open.
      - The legacy context cannot be closed while a legacy UPP has a balance.
      - A system is decommissioned when every criterion is met and signed.
    cases:
      - c: 1
        type: Negative
        title: Archive reconciliation open
        steps:
          - Open the EBIX checklist with the archive reconciliation not signed; sign as system owner.
        expected: Refused.
        msg: ["Criterion {Archive reconciled} is not met"]
      - c: 2
        type: Negative
        title: Close the legacy context with a UPP balance
        steps:
          - Open the Legacy context checklist with one legacy UPP open; sign.
        expected: Refused.
      - c: 3
        type: Workflow
        title: Decommission a system
        steps:
          - Attach evidence to each criterion of a test system; sign as system owner, Compliance and Comptrollership.
        expected: The system is marked decommissioned with the three signatures and dates.

access:
  - action: View the Migration Console
    screen: HOME
    permission: MIG_VIEW
    allow: [DML, STEWARD, OWNER, OPERATOR, RECON, GONOGO]
    deny: [CASHIER, MKT_AO, AUDIT]
    denied: Data Migration is not in the menu; GET /api/v1/migration/objects returns HTTP 403.
  - action: Maintain objects and submit decisions
    screen: OBJ
    permission: MIG_OBJECT_MANAGE
    allow: [DML]
    deny: [STEWARD, OWNER, OPERATOR]
    denied: New Object and Submit Decision are not shown; the call returns HTTP 403.
  - action: Approve decisions and map versions
    screen: APPROVALS
    permission: MIG_DECISION_APPROVE / MIG_MAPPING_APPROVE
    allow: [OWNER]
    deny: [DML, STEWARD, OPERATOR]
    denied: The item is not offered in My Approvals; the call returns HTTP 403.
  - action: Edit code maps and resolve issues
    screen: MAPS
    permission: MIG_MAPPING_EDIT / MIG_DQ_RESOLVE
    allow: [STEWARD]
    deny: [OPERATOR, RECON]
    denied: The maps are read only; the call returns HTTP 403.
  - action: Upload extracts and run loads
    screen: EXTRACTS
    permission: MIG_INTAKE / MIG_LOAD_RUN
    allow: [OPERATOR]
    deny: [STEWARD, OWNER, RECON]
    denied: Upload and Load are not shown; the call returns HTTP 403.
  - action: Approve a load
    screen: BATCH
    permission: MIG_LOAD_APPROVE
    allow: [DML]
    deny: [OPERATOR, STEWARD]
    denied: Approve Load is not shown; the call returns HTTP 403.
  - action: Sign a reconciliation and approve rollbacks
    screen: RECONC
    permission: MIG_RECON_SIGNOFF / MIG_ROLLBACK_APPROVE
    allow: [RECON]
    deny: [DML, OPERATOR, STEWARD]
    denied: Sign and Approve are not shown; the call returns HTTP 403.
  - action: Decide go / no-go
    screen: GONOGO
    permission: MIG_GONOGO_DECIDE
    allow: [GONOGO]
    deny: [DML, RECON]
    denied: GO and NO-GO are not shown; the call returns HTTP 403.
  - action: Search the legacy archive
    screen: INQUIRY
    permission: LEGACY_INQUIRY_VIEW
    allow: [AUDIT]
    deny: [CASHIER, OPERATOR]
    denied: Legacy Inquiry is not in the menu; the call returns HTTP 403.
  - action: Review the legacy access log
    screen: ACCLOG
    permission: LEGACY_ACCESS_LOG_VIEW
    allow: [ACCESS_REV]
    deny: [AUDIT, DML]
    denied: Access Log is not shown; the call returns HTTP 403.
  - action: Approve UPP reclassification to income (second level)
    screen: APPROVALS
    permission: CASH_UPP_INCOME_APPROVE
    allow: [TOPMGMT]
    deny: [CASHIER, CASHIER_TL]
    denied: The batch is not offered at the top-management stage; the call returns HTTP 403.
  - action: Approve DPPR and PR2307 legacy reversal batches
    screen: APPROVALS
    permission: LEGACY_REVERSAL_APPROVE
    allow: [CASHIER_TL, COMMREC_TL]
    deny: [CASHIER, ACCT]
    denied: Approve is not shown; the call returns HTTP 403.

findings:
  - fr: FR-DM-013
    issue: The validation message for an error rate above the threshold is tested on a financial object whose limit is 0 percent; the FRS does not say whether the rate counts excluded rows. The case assumes excluded rows are not errors.
    proposal: State in FR-DM-013 R2 that rows excluded by the data owner are not counted in the error rate.
  - fr: FR-DM-021
    issue: 'Acceptance 3 ("an open invoice missing from the load shows as a Migration Clearing difference") needs a trial balance that includes the missing invoice; the sign of the difference is not stated.'
    proposal: State that the difference is a credit on Migration Clearing equal to the open premium receivable of the missing invoice (debit for a missing DTIP-only invoice).
  - fr: FR-DM-051
    issue: The alternate flow offers "the configured option" to issue a BIBS AR without cash posting, but no parameter names it; the case follows the default (no AR) of DMQ14.
    proposal: Name the parameter (for example MIG_UPP_ISSUE_AR) or remove the option when DMQ14 is answered.
  - fr: FR-DM-091
    issue: The over-adjustment check refers to ADJID.028 without quoting the message, so the case cannot quote it.
    proposal: Quote the Adjustment module message in FR-DM-091 at build (FRS v1.1).
  - fr: FR-DM-110
    issue: R2 limits exports to MIG_ARCHIVE_EXPORT_MAX_ROWS but no message text is given for the refused export.
    proposal: Add the message, for example "The export is limited to {1,000} rows; narrow the search".
  - fr: FR-DM-123
    issue: The checklist criteria are templates maintained by the Program Manager; the criterion names used in messages ("Archive reconciled") depend on the template.
    proposal: Fix the default criterion names in the FRS (Cutover Runbook section 9 gives them).
  - fr: FR-DM-061
    issue: The FRS does not say whether a payment row carrying a QPS invoice number is matched before DMQ11 gives the QPS format.
    proposal: Add the QPS number pattern to the matcher and to CLX_INVOICE_NO_PATTERN when DMQ11 is answered; until then QPS invoices are matched by ARN, policy or PN.
