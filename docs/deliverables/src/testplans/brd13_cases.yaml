  DML: {name: Data Migration Lead, short: DM Lead}
  STEWARD: {name: Data Steward, short: Steward}
  OWNER: {name: Data owner (business owner of the object), short: Owner}
  OPERATOR: {name: Migration Operator, short: Operator}
  RECON: {name: Reconciliation approver (Comptrollership), short: Recon}
  GONOGO: {name: Go / no-go board member, short: Go / no-go}
  PM: {name: Program Manager, short: PM}
  MKT_AO: {name: Marketing User (AO), short: MKT AO}
  OPS_USER: {name: Operations User (Adjustment processor), short: Ops}
  ADJ_TL: {name: Adjustment TL, short: Adj TL}
  CASHIER: {name: Cashiering User, short: Cashier}
  CASHIER_TL: {name: Cashiering TL, short: Cash TL}
  TOPMGMT: {name: Finance Approver (top management), short: Top mgmt}
  ACCT: {name: Accounting User, short: Acct}
  COMMREC_TL: {name: Commission TL, short: Comm TL}
  REMIT: {name: Remittance User, short: Remit}
  PRC: {name: Prod Recon Analyst, short: Prod Recon}
  AUDIT: {name: Audit / Compliance User (Legacy Inquiry), short: Inquiry}
  ACCESS_REV: {name: Compliance reviewer (access log), short: Log rev.}
  SYSTEM: {name: BIBS scheduled job or event}

