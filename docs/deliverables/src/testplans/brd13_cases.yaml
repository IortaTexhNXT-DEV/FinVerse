data:
  - id: TD-DM-01
    name: Test users per migration role
    content: miglead (DATA_MIGRATION_LEAD), migsteward (DATA_STEWARD), migowner and migowner2 (DATA_OWNER), migops (MIGRATION_OPERATOR), migrecon (MIGRATION_RECON_APPROVER), miggonogo (MIGRATION_GONOGO), legacyaudit (LEGACY_INQUIRY), legacyrev (LEGACY_ACCESS_REVIEWER), topmgmt (TOP_MANAGEMENT_APPROVER), plus the built Operations users (cashier, cashiertl, commrectl, remit, adjuster, adjtl, reconhandler, ao).
    source: Planned demo seed V1980 of the build design; existing Operations demo users
  - id: TD-DM-02
    name: Reference extracts
    content: R01 (MARKET_SEGMENT with 12 values, one unmapped code OLD-RET and one CREATE value WALKIN), R04 (insurers, one unmapped code), R05 (products), R08 (GL account map), R11 (receipt series).
    source: Masked sample extracts in backend/src/main/resources/demo/migration/ (build wave DM3) prepared by the test lead in the workbook layouts
  - id: TD-DM-03
    name: Client extracts
    content: C01 and C02 from QPS (600 clients) and EBIX (400 clients) with 40 exact duplicates on TIN, 15 pairs with similar names and the same birth date, 5 clients already in BIBS, 3 rows without birth date; a client delta file of the next day with 10 new and 5 changed clients.
    source: Masked extracts prepared by the test lead
  - id: TD-DM-04
    name: Policy header and RMEL extracts
    content: P01 and P01S with 300 in-force headers (20 with two insurers, one with shares adding to 90); P03 with 60 candidates expiring from T to T+140 and one row without a header.
    source: Masked extracts prepared by the test lead
  - id: TD-DM-05
    name: Open legacy invoices
    content: F01, F01S, F01C with 1,000 invoices - I00123456 (basic 20,000.00, paid 10,000.00, open 10,000.00), invoices paid in full and not remitted, direct-payment invoices with open PR, invoices with PR2307 balance, 20 USD invoices, one invoice whose components do not add up to its gross premium, one invoice number used in EBIX and QPS; control file with totals per component and currency.
    source: Masked extracts prepared by the test lead with Comptrollership
  - id: TD-DM-06
    name: Legacy UPP
    content: F02 with 200 items - a 5,000.00 item quoting legacy invoice I00200001 (3,000.00 open) and new invoice BI-2027-000150 (2,000.00 open); a 1,500.00 item older than 2 years; items without references; one item with a refund in progress.
    source: Masked extracts prepared by the test lead
  - id: TD-DM-07
    name: GL trial balance
    content: G01 per branch and currency, balanced, whose legacy control-account lines equal the F01 and F02 detail; a second version with one control line 3,000.00 higher.
    source: Prepared by the test lead with Comptrollership
  - id: TD-DM-08
    name: Archive extracts
    content: H01 with 500 records over the record types (a closed 2022 invoice I00098765) and H02 with 50 documents and their SHA-256.
    source: Masked extracts prepared by the test lead
  - id: TD-DM-09
    name: Configuration for the tests
    content: "Parameters as delivered - MIG_ENVIRONMENT_CLASS NON_PRODUCTION, MIG_STAGING_RETENTION_DAYS 5, MIG_CHUNK_SIZE 500, MIG_PARTITIONS 4, MIG_AMOUNT_TOLERANCE 0.00, MIG_MAX_ERROR_RATE_MASTER 0.5, MIG_MAX_ERROR_RATE_FINANCIAL 0, MIG_CLIENT_MATCH_AUTO 90, MIG_CLIENT_MATCH_REVIEW 60, MIG_ARCHIVE_EXPORT_MAX_ROWS 1000, MIG_ACCESS_EXPORT_ALERT_ROWS 5000; legacy control accounts, Migration Clearing and LG_ rule lines set up on the test chart."
    source: Configuration delivered with the build (FRS section 9); demo V1982
  - id: TD-DM-10
    name: New BIBS invoices and payments
    content: BIBS invoice BI-2027-000150 with 2,000.00 open; a Direct Credit payment file with one row carrying EBIX reference I00123457 and one row for a BIBS invoice; an approved client payout account.
    source: Built Operations demo data; payment file prepared by the test lead

scenarios:
  - id: SC-DM-01
    persona: DML
    title: Governance. The Data Migration Lead registers the objects, the owners decide their class, and every object passes the sign-off gates in order.
    pre: Users TD-DM-01.
  - id: SC-DM-02
    persona: OPERATOR
    title: Intake to load. Extracts are received with control files, staged, mapped, validated, loaded through the BIBS services, rerun and rolled back.
    pre: Reference TD-DM-02 and invoice TD-DM-05 extracts.
  - id: SC-DM-03
    persona: RECON
    title: Reconciliation. Each object is reconciled at L1-L4 and the financial objects at L5; Migration Clearing nets to zero.
    pre: Loads of SC-DM-02; TB TD-DM-07.
  - id: SC-DM-04
    persona: STEWARD
    title: Client master and reference data. Codes are mapped and created; legacy clients are matched, deduplicated and created as active clients.
    pre: Extracts TD-DM-02 and TD-DM-03.
  - id: SC-DM-05
    persona: CASHIER
    title: Legacy open items. Legacy invoices and UPP are processed with the BIBS screens - OTC, autopay, automatch, dispositions, refund and reclassification to income.
    pre: Invoices TD-DM-05, UPP TD-DM-06, payments TD-DM-10.
  - id: SC-DM-06
    persona: ACCT
    title: Reversals, remittance and endorsements on legacy invoices, and the Prod Recon change report.
    pre: Invoices TD-DM-05; headers TD-DM-04.
  - id: SC-DM-07
    persona: AUDIT
    title: History. Archived records are searched in Legacy Inquiry and every access is logged and reviewed.
    pre: Archive TD-DM-08.
  - id: SC-DM-08
    persona: PM
    title: Cutover. A mock plan is run, go / no-go is decided on measured criteria, renewals move by RMEL cohort and legacy systems are decommissioned on the checklist.
    pre: All objects loaded in a mock.

frs:
  FR-DM-001:
    scenario: SC-DM-01
    persona: DML
    screen: OBJ
    data: [TD-DM-01]
    conditions:
      - A new object is saved as PROPOSED with its four criteria and shown in the register.
      - An object cannot be given a load order before an object it depends on.
      - An Excluded object stays in the register and cannot be loaded.
      - An object code is unique and the rationale is mandatory.
    cases:
      - c: 1
        type: Positive
        title: Register the client master object
        steps:
          - Click New Object; enter code C01, name, category Client, source systems QPS and EBIX, target, owner migowner, steward migsteward.
          - Enter the four criteria (Day-1 need Yes, compliance need Yes, archival option No, data trust Medium), proposed class Migrate, load order 5, rationale; Save.
        expected: C01 is listed with status PROPOSED, its criteria, owner and steward; the audit shows the creation.
      - c: 2
        type: Negative
        title: Load order before a dependency
        steps:
          - Open P01; set Depends on C01 and load order 4; Save.
        expected: Not saved.
        msg: [The load order must follow the objects this object depends on]
      - c: 3
        type: Negative
        screen: BATCH
        title: Excluded object cannot be loaded
        steps:
          - After R10 is DECIDED as Excluded, open Batches, New Batch and look for R10 in the object list.
        expected: R10 is not offered; the register still lists R10 as Excluded.
      - c: 4
        type: Negative
        title: Duplicate code and missing rationale
        steps:
          - Create a second object with code C01; Save.
          - Create object X99 without a rationale; Save.
        expected: "Both are refused. The second check shows \"Enter the rationale for the proposed class\"."
        msg: ["This object code already exists"]

  FR-DM-002:
    scenario: SC-DM-01
    persona: DML
    screen: OBJDEC
    data: [TD-DM-01]
    conditions:
      - A decision approved by the business owner sets the object to DECIDED with the approved class.
      - The submitter cannot approve their own decision.
      - A returned decision goes back to PROPOSED and needs a reason.
      - A class change from Migrate to Excluded is refused while a batch of the object is loaded.
      - The report MIG-DECISIONS lists every decision with its approver.
    cases:
      - c: 1
        type: Workflow
        title: Submit and approve the decision of C01
        steps:
          - As miglead click Submit Decision on C01.
          - As migowner open My Approvals, open C01 and click Approve.
        expected: C01 moves FOR_DECISION then DECIDED with class Migrate; miglead is notified of the approval.
      - c: 2
        type: Security-access
        title: Submitter approves own decision
        persona: OWNER
        pre: A user holding both DATA_MIGRATION_LEAD and DATA_OWNER submitted the decision.
        steps:
          - As that user click Approve.
        expected: Refused; the decision stays FOR_DECISION.
        msg: [A record cannot be authorized by the user who maintained it]
      - c: 3
        type: Negative
        persona: OWNER
        screen: APPROVALS
        title: Return without a reason
        steps:
          - Click Return on a submitted decision without a reason; then enter a reason and Return.
        expected: The first attempt is refused; the second returns the object to PROPOSED.
        msg: [Enter the reason for the return]
      - c: 4
        type: Negative
        title: Change class with loaded data
        pre: A batch of R01 is LOADED and not rolled back.
        steps:
          - Submit a new decision for R01 with class Excluded.
        expected: Refused.
        msg: [Roll back the loaded batches before changing the class of this object]
      - c: 5
        type: Report-output
        screen: REPORTS
        title: Decision history report
        steps:
          - Run MIG-DECISIONS for the test period; export to Excel.
        expected: Every decision is listed with class, criteria, submitter, approver and dates; the Excel file has the same rows.

  FR-DM-003:
    scenario: SC-DM-01
    persona: DML
    screen: SIGNOFF
    data: [TD-DM-01]
    conditions:
      - An object reaches G6 only after G1-G5 are signed in order.
      - The operator of a batch cannot sign its reconciliation; one person cannot sign two gates of the same batch.
      - G5 cannot be signed while a break is open.
      - The Sign-off screen shows per object and environment which gates are signed, by whom and when.
    cases:
      - c: 1
        type: Workflow
        title: Sign G1 to G6 of R01 in order
        steps:
          - Sign G1 and G2 as migowner, G3 as migsteward, G4 as miglead, G5 as migrecon, G6 as migowner2 and miglead.
        expected: Each gate is recorded with role, user, time and comment; R01 shows ACCEPTED for SIT.
      - c: 1
        type: Negative
        title: Sign G6 before G5
        steps:
          - On a batch whose G5 is not signed, try to sign G6.
        expected: Refused.
        msg: [Sign the previous gate first]
      - c: 2
        type: Security-access
        persona: OPERATOR
        title: Operator signs the reconciliation of own batch
        pre: migops ran the batch and was given MIG_RECON_SIGNOFF for this test.
        steps:
          - As migops sign G5 of the batch.
        expected: Refused.
        msg: [A record cannot be authorized by the user who maintained it]
      - c: 3
        type: Negative
        persona: RECON
        title: Sign G5 with an open break
        steps:
          - Open a reconciliation with one BREAK without explanation; click Sign.
        expected: Refused.
        msg: [Explain and approve every break before signing the reconciliation]
      - c: 4
        type: Report-output
        title: Gate matrix
        steps:
          - Open Sign-off; filter environment SIT.
        expected: One row per object with G1-G7; signed gates show user and date; MIG-SIGNOFF-STATUS gives the same content.

  FR-DM-010:
    scenario: SC-DM-02
    persona: OPERATOR
    screen: EXTRACTS
    data: [TD-DM-02, TD-DM-05]
    conditions:
      - A file whose rows, amounts and hash total agree with its control file is staged and numbered MGX-yyyy-nnnnnn.
      - A file with one row fewer than the control count, a wrong checksum, a wrong header, a wrong amount total or a wrong hash total is rejected and nothing is staged.
      - The same file sent twice and a delta with an earlier as-of date are refused.
      - In a non-production environment staged client names and TINs are masked, always the same way; in production they are not.
    cases:
      - c: 1
        type: Upload-download
        title: Upload F01C with its control file
        steps:
          - Choose object F01, source EBIX, mode FULL; upload F01C_EBIX_20270226_01.csv and its .ctl.csv.
        expected: The extract gets an MGX number, status STAGED, and shows the row count and the totals per component and currency of the control file.
      - c: 2
        type: Negative
        title: One row missing
        steps:
          - Upload a data file with one row deleted and the original control file.
        expected: REJECTED; nothing staged; alert to the Data Migration Lead.
        msg: ["The file has {999} rows; the control file says {1000}"]
      - c: 2
        type: Negative
        title: Checksum and header mismatch
        steps:
          - Upload a file edited after the control file was made; then a file with column open_balance renamed.
        expected: "Both REJECTED. The second check shows \"The file columns do not match layout version 1: missing open_balance, extra open_bal\"."
        msg: ["The file does not match the checksum in the control file"]
      - c: 2
        type: Negative
        title: Amount and hash totals mismatch
        steps:
          - Upload a file with one open_balance changed by 1.00 and its checksum recomputed; then a file with one invoice number changed.
        expected: "Both REJECTED with the difference. The second check shows \"The hash total of the key column does not match the control file\"."
        msg: ["The total of {open_balance} in {PHP} is {x}; the control file says {y}"]
      - c: 3
        type: Negative
        title: Duplicate file and out-of-order delta
        steps:
          - Upload the accepted file of case 1 again.
          - Upload a C01 delta with as-of date one day before the last C01 extract.
        expected: "Both refused. The second check shows \"The as-of date is earlier than the last extract of this object\"."
        msg: ["This file was already received as extract {MGX-2027-000001}"]
      - c: 4
        type: Positive
        screen: ISSUES
        data: [TD-DM-03, TD-DM-09]
        title: Masking outside production
        steps:
          - Upload C01 twice in SIT under two different file names with one row changed; open the staged rows.
        expected: Names, TIN, e-mail, mobile and birth date are masked; the same client has the same masked values in both extracts; amounts and codes are unchanged.

  FR-DM-011:
    scenario: SC-DM-04
    persona: STEWARD
    screen: MAPS
    data: [TD-DM-02]
    conditions:
      - An approved version supersedes the previous one and is used by the next validated batch.
      - A version mapping to a BIBS code that does not exist cannot be approved.
      - A legacy code mapped twice in one version is refused.
      - The approver is never the submitter.
      - Each batch shows the map versions it used.
    cases:
      - c: 1
        type: Workflow
        title: New version of INSURER approved
        steps:
          - Create a DRAFT copied from the approved version; add MAL of QPS mapped to INS-MAL; Submit.
          - As migowner compare with the approved version and Approve.
        expected: Version 2 is APPROVED and version 1 SUPERSEDED; the comparison showed one added entry.
      - c: 2
        type: Negative
        persona: OWNER
        title: Target code does not exist
        steps:
          - Submit a version mapping XYZ to INS-NOPE; as migowner Approve.
        expected: Not approved.
        msg: ["Target code {INS-NOPE} does not exist in {INSURER}"]
      - c: 3
        type: Negative
        title: Same legacy code twice
        steps:
          - Add MAL of QPS twice in a DRAFT; Save.
        expected: Refused.
        msg: ["Legacy code {MAL} of {QPS} is mapped twice"]
      - c: 4
        type: Security-access
        title: Submitter approves own version
        pre: migsteward also holds MIG_MAPPING_APPROVE for this test.
        steps:
          - Submit a version and Approve it as the same user.
        expected: Refused.
        msg: [A record cannot be authorized by the user who maintained it]
      - c: 5
        type: Upload-download
        screen: BATCH
        title: Map versions on the batch and Excel round trip
        steps:
          - Export the INSURER set to Excel, add one entry, import it as a DRAFT.
          - Validate an R04 batch; open the batch page.
        expected: The import creates a DRAFT with the new entry; the batch lists the set versions it used.

  FR-DM-012:
    scenario: SC-DM-04
    persona: STEWARD
    screen: UNMAPPED
    data: [TD-DM-02]
    conditions:
      - A staged row whose insurer code is not mapped appears in MIG-UNMAPPED-CODES with its legacy key.
      - The load of that batch cannot be approved until the code is mapped and the batch validated again.
      - The report exports to Excel and PDF.
    cases:
      - c: 1
        type: Report-output
        title: Unmapped insurer listed
        steps:
          - Validate the R04 batch with one unmapped insurer code; open the Unmapped tab.
        expected: The code is listed with set INSURER, source, row count and sample keys; alert to the steward.
      - c: 2
        type: Negative
        persona: DML
        screen: BATCH
        title: Approve load with unmapped codes
        steps:
          - Click Approve Load on that batch.
        expected: Refused.
        msg: ["The batch has {1} unmapped codes; map them before approving the load"]
      - c: 2
        type: Positive
        title: Code mapped and batch revalidated
        steps:
          - Add the code in a new version; approve it; validate the batch again.
        expected: The code disappears from the report; Approve Load is possible.
      - c: 3
        type: Report-output
        screen: REPORTS
        title: Export the report
        steps:
          - Run MIG-UNMAPPED-CODES; export to Excel and to PDF.
        expected: Both files hold the same rows as the screen.

  FR-DM-013:
    scenario: SC-DM-02
    persona: OPERATOR
    screen: ISSUES
    data: [TD-DM-05, TD-DM-03]
    conditions:
      - A legacy invoice whose components do not add up to its gross premium is INVALID with that message.
      - A waived row shows the waiver reason and the data owner who approved it.
      - A batch of open invoices with one INVALID row cannot be approved for load unless the row is excluded by the data owner.
      - Master data can be approved for load with at most 0.5 percent of rows rejected or waived.
    cases:
      - c: 1
        type: Negative
        title: Components do not add up
        steps:
          - Validate the F01 batch; open the Issues tab filtered on ERROR.
        expected: The invoice is INVALID.
        msg: ["The premium components add up to {x}; the gross premium is {y}"]
      - c: 1
        type: Negative
        data: [TD-DM-03]
        title: Mandatory and format errors on clients
        steps:
          - Validate the C01 batch with 3 rows without birth date and one TIN of 5 digits.
        expected: "The rows are INVALID with their messages. The second check shows \"TIN 12345 is not a valid TIN\"."
        msg: ["{Birth date} is mandatory"]
      - c: 2
        type: Workflow
        persona: OWNER
        data: [TD-DM-03]
        title: Waive a client row
        steps:
          - As migsteward propose a waiver of one client row; as migowner approve it with reason Obsolete record.
        expected: The row shows WAIVED with the reason and migowner as approver.
      - c: 3
        type: Negative
        persona: DML
        screen: BATCH
        title: Approve F01 load with one INVALID row
        steps:
          - Click Approve Load on the F01 batch.
        expected: Refused while the row is INVALID; after migowner excludes it with a manual-entry plan, approval is possible.
        msg: ["{0.1} percent of rows have errors; the limit for this object is {0} percent"]
      - c: 4
        type: Boundary
        persona: DML
        screen: BATCH
        data: [TD-DM-03, TD-DM-09]
        title: Master data error rate at the limit
        steps:
          - Validate a C01 batch of 1,000 rows with 5 invalid rows (0.5 percent); Approve Load.
          - Validate a batch of 1,000 rows with 6 invalid rows (0.6 percent); Approve Load.
        expected: The first is approved; the second is refused with the rate and the limit.

  FR-DM-014:
    scenario: SC-DM-02
    persona: OPERATOR
    screen: BATCH
    data: [TD-DM-02, TD-DM-03]
    conditions:
      - Loading the same batch twice creates no duplicate; the second run marks the rows SKIPPED.
      - A client created by a load is found in client search and has a cross-reference to its legacy key.
      - The batch page shows staged, loaded, skipped, rejected and excluded counts that add up.
      - An object loads only after the objects it depends on are accepted, and the approver of the load is not the operator.
    cases:
      - c: 1
        type: Positive
        title: Load R01 twice
        steps:
          - As miglead Approve Load; as migops click Load; after completion run Load again.
        expected: First run LOADED; second run marks every row SKIPPED; no LOV value is duplicated.
      - c: 2
        type: Positive
        screen: CLIENTS
        title: Loaded client found by legacy number
        steps:
          - After the C01 load, search client search with legacy number Q-0012345.
        expected: The BIBS client opens; it shows source QPS and legacy number Q-0012345.
      - c: 3
        type: Report-output
        title: Counts add up
        steps:
          - Open the batch page of the C01 load; run MIG-BATCH-LOG.
        expected: loaded + skipped + rejected + excluded = staged; the log lists each step with counts and times.
      - c: 4
        type: Negative
        title: Dependency not accepted
        steps:
          - Approve and load a P01 batch while C01 is not accepted (G6) in the environment.
        expected: Refused.
        msg: ["Object {C01} must be accepted before this object can load"]
      - c: 4
        type: Security-access
        persona: DML
        title: Operator approves own load
        pre: migops is given MIG_LOAD_APPROVE for this test.
        steps:
          - As migops approve the load of the batch migops will run.
        expected: Refused.
        msg: [A record cannot be authorized by the user who maintained it]

  FR-DM-015:
    scenario: SC-DM-02
    persona: DML
    screen: BATCH
    data: [TD-DM-03, TD-DM-05]
    conditions:
      - A rerun batch loads only the previously rejected rows and its counts are added to the parent batch reconciliation.
      - A rollback of a client batch without later activity leaves no active migrated client of that batch.
      - A rollback is refused when a payment was applied to a legacy invoice of the batch.
      - The approver of a rollback is not the requester.
    cases:
      - c: 1
        type: Positive
        title: Rerun rejected clients
        steps:
          - Fix the 3 rejected rows at source; upload the new extract; click Rerun Rejects; approve and load.
        expected: A child batch with 3 rows loads them; the parent reconciliation shows the combined counts.
      - c: 2
        type: Workflow
        persona: RECON
        title: Roll back a client batch
        steps:
          - As miglead click Request Rollback with a reason; as migrecon approve.
        expected: The batch is ROLLED_BACK; no client of the batch is active; the log lists each undone record.
      - c: 3
        type: Negative
        title: Rollback after a payment
        steps:
          - Apply an OTC payment to one invoice of the F01 batch; request the rollback of F01.
        expected: Refused.
        msg: ["{1} records were changed after the load and cannot be rolled back"]
      - c: 4
        type: Security-access
        title: Requester approves own rollback
        pre: miglead is given MIG_ROLLBACK_APPROVE for this test.
        steps:
          - Request and approve the same rollback as miglead.
        expected: Refused.
        msg: [A record cannot be authorized by the user who maintained it]

