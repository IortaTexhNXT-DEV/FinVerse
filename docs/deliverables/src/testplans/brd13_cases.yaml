  GONOGO: Data Migration > Cutover > Go / No-go tab
  RUNOFF: Data Migration > Run-off and Decommissioning
  INQUIRY: Inquiry > Legacy Inquiry
  ACCLOG: Inquiry > Legacy Inquiry > Access Log
  APPROVALS: My Approvals
  CLIENTS: Clients > Client search
  ACCOUNTS: Accounts > Account search
  INV360: Operations > Invoices > Invoice 360
  UNAPPLIED: Cashiering > Unapplied Payments
  PAYMENT: Cashiering > Receive Payment (OTC)
  PAYUPLOAD: Cashiering > Payment Uploads
  RECLASS: Cashiering > UPP Income Reclassification
  PR2307REV: Cashiering > PR2307 Legacy Reversal
  DPPRREV: Commission > DPPR Legacy Reversal
  REMEXTRACT: Remittance > Extraction workbench
  ENDORSE: Adjustment > New Endorsement Request
  RENEWAL: Renewal > Renewal candidates
  REPORTS: Reports > Report Centre
