# Test plan BRD-13 Data Migration - test data file.
# Build: python docs/deliverables/src/testplans/build_test_plan.py docs/deliverables/src/testplans/brd13_cases.yaml
# Schema: see the header of build_test_plan.py. FR titles, BRD IDs and priorities come from the FRS.
# BRD-13 is designed, not built: the expected results quote the message text of the FRS and the build design
# (docs/architecture/DATA_MIGRATION_DESIGN.md) without codes, and no case names an automated test. Screen paths
# follow section 22 of the build design (sidebar section Data Migration). Test data are masked extracts in the
# layouts of the BDOI Data Requirements Workbook (docs/deliverables/out/Migration). Account names only: the legacy
# control accounts and Migration Clearing are assigned by Comptrollership (DMQ18).

meta:
  brd: BRD-13
  name: Data Migration
  code: DM
  frs: FRS_BRD13_DATA_MIGRATION.md
  summary: TP_BRD13_DATA_MIGRATION.md
  version: "1.0"
  date: 26 September 2026
  built: false

