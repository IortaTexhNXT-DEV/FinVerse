# Serves the SPA and proxies the REST API to the backend service (docker compose, plain HTTP on 8080).
# nginx drops the server-level add_header directives in every location that sets its own, so the
# locations below repeat the security headers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 26m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # The backend address is resolved at request time (resolver of the container, renewed every 10 s),
  # so nginx starts before the backend is reachable and follows it when it moves to another address.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  location /api/ {
    set $backend_upstream http://${BROKERVERSE_BACKEND_HOST}:8080;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /assets/ {
    expires 1y;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache";
  }
}
